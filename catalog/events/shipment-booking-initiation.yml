Event Name: Shipment Booking Initiation
Event Serialization: always

Description: |
  Measures each explicit customer, partner, or agent action that starts a shipment-booking workflow or creates a new booking draft. It captures booking intent and shipment context at initiation, regardless of whether the booking is subsequently completed, abandoned, rejected, or cancelled.

Category: Conversion

Tags: [event]

Industry: Logistics & Supply Chain

Priority: High

Core Area: Generic


Event Type: custom

Aggregation Window: Event, Session, User, and Time based - Hourly/Daily/Monthly/Yearly


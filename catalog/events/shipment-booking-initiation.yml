on","movement_type":"string - movement scope such as domestic, import, export, cross_border, or intra_regional","package_count":"integer - number of packages, handling units, pallets, or pieces entered at initiation","quoted_amount":"number - pre-tax freight amount presented or selected at initiation; null when pricing is not yet available","service_level":"string - requested logistics service level such as economy, standard, express, same_day, or time_definite","shipment_type":"string - shipment classification such as parcel, less_than_truckload, full_truckload, full_container_load, less_than_container_load, or bulk","booking_status":"string - status immediately after initiation, such as initiated, draft, validation_pending, or quote_selected","container_type":"string - requested container or equipment type such as dry_van, reefer, flatbed, 20ft_standard, or 40ft_high_cube","correlation_id":"string - identifier linking client, API gateway, booking service, and transportation management system records for the same initiation","transport_mode":"string - planned primary transportation mode such as road, air, ocean, rail, parcel, courier, or multimodal","booking_channel":"string - channel used to initiate the booking, such as web, mobile_app, contact_center, branch, EDI, API, or partner_portal","container_count":"integer - number of containers, trailers, or primary equipment units requested","event_timestamp":"string - UTC timestamp in ISO 8601 format when the initiation action was accepted","referral_source":"string - immediate referring source or partner that directed the actor into the booking workflow","customer_segment":"string - governed commercial segment of the associated customer account","initiation_action":"string - qualifying action that started the workflow, such as book_shipment_click, create_draft, accept_quote, duplicate_booking, or api_request","commodity_category":"string - governed high-level category of goods planned for shipment","draft_created_flag":"boolean - indicates whether a persistent booking draft was successfully created","origin_location_id":"string - governed identifier for the planned pickup or shipment-origin location","source_application":"string - application or system that generated the event","application_version":"string - deployed application, portal, mobile app, or API version","origin_country_code":"string - ISO 3166-1 alpha-2 country code for the planned origin","authentication_state":"string - user state at initiation, such as authenticated, guest, delegated, service_account, or unknown","origin_location_type":"string - origin classification such as residence, business, warehouse, store, port, terminal, or supplier","requested_pickup_date":"string - requested pickup date in ISO 8601 date format, interpreted using the origin location time zone","destination_location_id":"string - governed identifier for the planned delivery or shipment-destination location","hazardous_material_flag":"boolean - indicates whether the shipment is declared or expected to contain regulated hazardous materials","requested_delivery_date":"string - requested delivery date in ISO 8601 date format, interpreted using the destination location time zone","destination_country_code":"string - ISO 3166-1 alpha-2 country code for the planned destination","destination_location_type":"string - destination classification such as residence, business, warehouse, store, port, terminal, or customer_site","temperature_controlled_flag":"boolean - indicates whether temperature-controlled transport or storage is requested"}

Calculation Notes: |
  Fire the event only after an explicit initiation action is accepted by the client or booking service; page views, booking-form impressions, quote-result views, and passive navigation do not qualify. Count each legitimate initiation activation, including a user intentionally starting a new booking after abandoning or completing another booking. Use event_id as the primary deduplication key and correlation_id plus booking_id as secondary controls to suppress client retries, API retries, offline replay, and duplicate client/server emissions representing the same action. If both the user interface and booking service emit the event, retain the authoritative server event and enrich it with client context rather than counting both. A resumed persistent draft is not a new initiation unless the user explicitly duplicates the draft or creates a new booking_id. A booking started from a quote qualifies when the actor selects a rate and enters the booking workflow; generating or viewing a quote alone does not qualify. Cancellation, rejection, expiration, or abandonment after initiation does not remove the initiation from historical counts. Apply a 30-minute inactivity timeout for digital session reporting; API and EDI activity should use the source transaction session or correlation identifier rather than synthetic web sessions. Store event_timestamp in UTC, derive local reporting time from the origin location time zone, and attribute late-arriving events to the original event timestamp. Exclude monitoring traffic, automated tests, load tests, known bots, training accounts, and employee activity from certified business reporting unless a report explicitly includes internal operations. Null shipment details are permitted when the workflow begins before those details are entered, but event_id, event_timestamp, initiation_action, booking_channel, source_application, and correlation_id are required.

Business Use Case: |
  The Chief Operating Officer and Digital Product team compare initiation-to-completion conversion by booking channel, entry point, transport mode, and origin-destination lane. If mobile cross-border initiations show materially higher abandonment than web initiations, the team can inspect validation and completion-time patterns, simplify customs-data collection, prioritize the affected workflow for remediation, and measure whether the change increases completed bookings.



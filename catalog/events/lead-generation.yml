Parameters: |
  {
    "lead_id": "string - unique lead identifier returned by the form backend or CRM; dedupe key",
    "lead_type": "string - quote_request, trade_account, consultation or back_in_stock",
    "form_id": "string - stable identifier of the lead form that was submitted",
    "lead_source": "string - placement that produced the lead, e.g. pdp, footer, landing_page, exit_intent",
    "value": "number - expected lead value in currency units, set by Marketing; optional",
    "currency": "string - ISO 4217 code; required whenever value is sent",
    "items": "array - product(s) the lead concerns (item_id, item_name, item_variant); optional",
    "campaign_source": "string - UTM source of the session that produced the lead; optional",
    "campaign_medium": "string - UTM medium of the session that produced the lead; optional",
    "lead_validation_status": "string - valid, duplicate or spam as returned by the backend; optional",
    "user_id": "string - hashed customer identifier when the shopper is logged in; optional"
  }

Calculation Notes: |
  ["1️⃣ Fires on server-confirmed form success (lead_id returned); never on submit click, failed validation or form view. Newsletter opt-ins use sign_up.","2️⃣ Serialization always: every successful submission is a hit. Dedupe on lead_id so double submits and thank-you page reloads count once.","3️⃣ Required: lead_id, lead_type, form_id, lead_source. Optional: value, currency, items, campaign_source, campaign_medium, lead_validation_status.","4️⃣ lead_type is a fixed list: quote_request, trade_account, consultation, back_in_stock. items carries the product for back-in-stock and quote leads.","5️⃣ value is the expected lead value set by Marketing, never order revenue; send it only with currency, and omit both where no lead-value model exists.","6️⃣ Fire only with analytics consent. Never send email, phone or name; lead_id and a hashed user_id stitch the hit to the CRM lead record.","7️⃣ Common mistakes: firing on thank-you page load (bookmarks and refreshes inflate leads) and reusing one form_id across different lead forms."]

Business Use Case: |
  ["1️⃣ Performance Marketing: cost per lead on a paid campaign rises above target → moves budget to lower-CPL campaigns.","2️⃣ Sales: quote leads from one lead_source rarely close in CRM → Marketing tightens that source's targeting.","3️⃣ Merchandising: back-in-stock leads pile up on one SKU → raises the reorder quantity for that item.","4️⃣ CRO Team: lead form completions drop after a form redesign → removes the added fields and retests."]


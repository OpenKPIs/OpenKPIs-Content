# Event: Store Inventory Check
# Generated: 2026-09-19T18:28:33.716Z
# Contributed by: devyendarm


Event Name: Store Inventory Check
Event Serialization: always

Description: |
  Captures each explicit shopper request to see whether a specific item is available for pickup at a specific physical store, emitted as the unified view_item event with check_type='store_availability' plus the store, item and customer-facing inventory status returned. It is the top-of-funnel signal for BOPIS demand, showing which items and stores draw pickup intent and how often that intent meets a limited or out-of-stock answer before an order is ever placed.

Category: Engagement



















    
    
    
    
    
    
    
    
    

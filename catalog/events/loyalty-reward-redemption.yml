Parameters: |
  {
    "virtual_currency_name": "string - Name of the programme currency debited, as required by the GA4 recommended event (for example 'points', 'stars', 'miles').",
    "points_redeemed": "integer - Loyalty points debited from the member balance by this redemption, mapped to the GA4 `value` parameter; 0 when the reward is a tier entitlement that costs no points.",
    "reward_id": "string - Stable identifier of the reward or member offer as catalogued in the loyalty platform; the join key for reversals and re-credits.",
    "reward_type": "string - Reward family: discount, free_product, free_shipping, tier_benefit, partner_exchange or charity_donation.",
    "reward_value": "number - Fiat face value of the benefit granted, two decimal places, expressed in `currency`; a discount and liability measure that is never added to revenue, GMV or AOV.",
    "currency": "string - ISO-4217 code governing reward_value; mandatory whenever reward_value is populated, including zero-value rewards.",
    "loyalty_tier": "string - Member tier at the moment of redemption (for example Base, Silver, Gold, Platinum), captured as-is rather than recomputed at report time. Also set as the user-scoped GA4 user property loyalty_tier on every event so the member base can be segmented by tier.",
    "redemption_channel": "string - Channel where the redemption was confirmed: web, app, in_store_pos or call_center.",
    "transaction_id": "string - Order identifier when the reward is applied to an order, enabling the join to the separate `purchase` event; null for non-order redemptions.",
    "points_balance_after": "integer - Member points balance remaining after the debit, used for liability tracking and ledger reconciliation.",
    "customer_id": "string - SHA-256 hashed loyalty member identifier; the raw member number and email are never emitted to the digital layer.",
    "loyalty_member_id": "string - GA4 user property (user-scoped, set on every event once the member is identified) holding the SHA-256 hashed loyalty member identifier, identical to customer_id; defines the full active-member base for penetration rates.",
    "loyalty_account_flag": "string - GA4 user property (user-scoped, every event) / XDM _openkpis.loyalty.member.accountFlag / ACDL loyalty.member.accountFlag: member, employee, test or internal; employee, test and internal accounts are excluded from all reporting.",
    "customer_status": "string - GA4 user property (user-scoped, every event) / XDM _openkpis.loyalty.member.customerStatus: new or returning customer status of the member."
  }

Calculation Notes: |
  1️⃣ Implemented as the GA4 recommended event `spend_virtual_currency`, fired on the loyalty platform's confirmation of the points debit or reward application — not on the reward-selection click and not on the confirmation page render; `loyalty_redeem` is retained as an alias only and must never be sent as the event name.,2️⃣ points_redeemed carries the virtual-currency debit (mapped to the GA4 `value` parameter alongside virtual_currency_name) and reward_value carries the fiat face value of the benefit paired with an ISO-4217 `currency`; the two are never interchangeable and are never summed together. reward_value is excluded from revenue, GMV and AOV because the matching `purchase` event already reports the discounted order value under the same transaction_id.,3️⃣ Serialization is `always`: a member may redeem several times per order (for example points plus a free-shipping offer), so one event fires per reward with a shared transaction_id. Deduplicate on reward_id + transaction_id when a member refreshes or re-enters the confirmation step, and apply the standard 30-minute inactivity session timeout — a redemption resumed after a lapse is attributed to the new session while transaction_id preserves the order-level join.,4️⃣ Excluded: reward previews and balance simulators, points expiring under programme rules with no member action, member pricing applied automatically without a reward object (measured as a member price benefit in promotion reporting), goodwill points issued by service agents, and employee, test and internal QA accounts identified by the loyalty account flag.,5️⃣ Cancellations and returns re-credit the points in the loyalty ledger — never delete or retro-edit the original event. Net redemption is derived by joining the re-credit to the original reward_id and transaction_id, and every report that publishes net figures must state the reversal window in force (typically the 30-day return window).,6️⃣ Non-order redemptions (partner point exchanges, charity donations, tier benefits) carry a null transaction_id and, where no monetary benefit exists, reward_value = 0 with currency still populated; these rows must be filtered out of any checkout-attach or basket-level analysis rather than being treated as zero-value orders.,7️⃣ Timing and reconciliation: client events land within normal digital-analytics intraday latency while the loyalty ledger remains the system of record for balances. Reconcile points_redeemed against ledger debits daily, use points_balance_after as the tie-breaker on disputes, and treat a variance above 2% as a tagging defect rather than a business movement.

Business Use Case: |
  1️⃣ The CRM & Loyalty Manager (Marketing) reviews the weekly redemption mix by loyalty_tier and reward_type; when free-shipping redemptions in a tier climb above plan while points burn stays flat, they re-price that reward in the catalogue and shift the tier's featured offer.,2️⃣ Revenue Accounting (Finance) uses points_redeemed and points_balance_after at month-end to release deferred loyalty liability, and cross-checks reward_value against the discount lines on the matching purchase transaction_ids so the benefit is recognised once rather than double-counted as revenue.,3️⃣ The Lifecycle Marketing lead builds a segment of enrolled members with zero redemptions in the last 90 days and a positive balance, and triggers the points-expiry reminder journey ahead of the programme's expiry run.,4️⃣ The Merchandising planner joins redemption transaction_ids to order contribution margin to identify which reward types dilute margin most by category, and caps the highest-dilution reward before the peak trading window.


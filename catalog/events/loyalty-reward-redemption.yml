Parameters: |
  {
    "virtual_currency_name": "string - Name of the programme currency debited, as required by the GA4 recommended event (for example 'points', 'stars', 'miles').",
    "points_redeemed": "integer - Loyalty points debited from the member balance by this redemption, mapped to the GA4 `value` parameter; 0 when the reward is a tier entitlement that costs no points.",
    "reward_id": "string - Stable identifier of the reward or member offer as catalogued in the loyalty platform; the join key for reversals and re-credits.",
    "reward_type": "string - Reward family: discount, free_product, free_shipping, tier_benefit, partner_exchange or charity_donation.",
    "reward_value": "number - Fiat face value of the benefit granted, two decimal places, expressed in `currency`; a discount and liability measure that is never added to revenue, GMV or AOV.",
    "currency": "string - ISO-4217 code governing reward_value; mandatory whenever reward_value is populated, including zero-value rewards.",
    "loyalty_tier": "string - Member tier at the moment of redemption (for example Base, Silver, Gold, Platinum), captured as-is rather than recomputed at report time.",
    "redemption_channel": "string - Channel where the redemption was confirmed: web, app, in_store_pos or call_center.",
    "transaction_id": "string - Order identifier when the reward is applied to an order, enabling the join to the separate `purchase` event; null for non-order redemptions.",
    "points_balance_after": "integer - Member points balance remaining after the debit, used for liability tracking and ledger reconciliation.",
    "customer_id": "string - SHA-256 hashed loyalty member identifier; the raw member number and email are never emitted to the digital layer."
  }




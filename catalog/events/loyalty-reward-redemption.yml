# Event: Loyalty Reward Redemption
# Generated: 2026-09-17T23:36:31.535Z
# Contributed by: devyendarm


Event Name: Loyalty Reward Redemption
Event Serialization: always

Description: |
  Fires when an identified loyalty member spends programme points or applies an issued reward or member-only offer against an order or a benefit, capturing the points debited, the reward granted and its face value at the moment the loyalty platform confirms the debit. Redemption is a benefit-delivery event and not a monetary transaction: when a reward or member offer is applied at checkout the `purchase` event still fires separately with its own transaction value, so reward_value is a discount and liability measure that must never be added to revenue, GMV or Average Order Value.

Category: Retention



















    
    
    
    
    
    
    
    
    

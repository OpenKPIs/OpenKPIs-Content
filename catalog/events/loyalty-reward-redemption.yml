Parameters: |
  {
    "virtual_currency_name": "string - Name of the loyalty currency debited, such as points, miles, or stars.",
    "value": "number - Quantity of loyalty currency debited, using the GA4 recommended event parameter.",
    "redemption_id": "string - Immutable loyalty-ledger debit identifier used to deduplicate retries and join every reversal.",
    "reward_id": "string - Catalog identifier defining the reward or benefit that was redeemed.",
    "reward_type": "string - Governed reward family such as discount, free_product, free_shipping, or tier_benefit.",
    "reward_value": "number - Fiat face value of the benefit; this is a discount or liability measure, not revenue.",
    "currency": "string - ISO 4217 currency code for reward_value; required whenever reward_value is present.",
    "customer_loyalty_tier": "string - Customer tier effective when the platform confirms the redemption.",
    "redemption_channel": "string - Channel that confirmed the redemption, such as web, app, in_store_pos, or call_center.",
    "transaction_id": "string - Related order identifier; null for rewards not attached to an order.",
    "points_balance_after": "number - Loyalty-currency balance after the confirmed debit.",
    "reward_value_excluded_from_revenue": "boolean - Must be true to document that reward_value is not sales revenue."
  }

Calculation Notes: |
  1️⃣ Implemented as the GA4 recommended event `spend_virtual_currency`, fired on the loyalty platform's confirmation of the points debit or reward application — not on the reward-selection click and not on the confirmation page render; `loyalty_redeem` is retained as an alias only and must never be sent as the event name.,2️⃣ points_redeemed carries the virtual-currency debit (mapped to the GA4 `value` parameter alongside virtual_currency_name) and reward_value carries the fiat face value of the benefit paired with an ISO-4217 `currency`; the two are never interchangeable and are never summed together. reward_value is excluded from revenue, GMV and AOV because the matching `purchase` event already reports the discounted order value under the same transaction_id.,3️⃣ Serialization is `always`: a member may redeem several times per order (for example points plus a free-shipping offer), so one event fires per reward with a shared transaction_id. Deduplicate on reward_id + transaction_id when a member refreshes or re-enters the confirmation step, and apply the standard 30-minute inactivity session timeout — a redemption resumed after a lapse is attributed to the new session while transaction_id preserves the order-level join.,4️⃣ Excluded: reward previews and balance simulators, points expiring under programme rules with no member action, member pricing applied automatically without a reward object (measured as a member price benefit in promotion reporting), goodwill points issued by service agents, and employee, test and internal QA accounts identified by the loyalty account flag (GA4 user property loyalty_account_flag, ACDL/XDM loyalty.member.accountFlag, W3 profileInfo.loyaltyAccountFlag; values employee, test, internal).,5️⃣ Cancellations and returns re-credit the points in the loyalty ledger — never delete or retro-edit the original event. Net redemption is derived by joining the re-credit to the original reward_id and transaction_id, and every report that publishes net figures must state the reversal window in force (typically the 30-day return window).,6️⃣ Non-order redemptions (partner point exchanges, charity donations, tier benefits) carry a null transaction_id and, where no monetary benefit exists, reward_value = 0 with currency still populated; these rows must be filtered out of any checkout-attach or basket-level analysis rather than being treated as zero-value orders.,7️⃣ Timing and reconciliation: client events land within normal digital-analytics intraday latency while the loyalty ledger remains the system of record for balances. Reconcile points_redeemed against ledger debits daily, use points_balance_after as the tie-breaker on disputes, and treat a variance above 2% as a tagging defect rather than a business movement.

Business Use Case: |
  1️⃣ The CRM & Loyalty Manager (Marketing) reviews the weekly redemption mix by loyalty_tier and reward_type; when free-shipping redemptions in a tier climb above plan while points burn stays flat, they re-price that reward in the catalogue and shift the tier's featured offer.,2️⃣ Revenue Accounting (Finance) uses points_redeemed and points_balance_after at month-end to release deferred loyalty liability, and cross-checks reward_value against the discount lines on the matching purchase transaction_ids so the benefit is recognised once rather than double-counted as revenue.,3️⃣ The Lifecycle Marketing lead builds a segment of enrolled members with zero redemptions in the last 90 days and a positive balance, and triggers the points-expiry reminder journey ahead of the programme's expiry run.,4️⃣ The Merchandising planner joins redemption transaction_ids to order contribution margin to identify which reward types dilute margin most by category, and caps the highest-dilution reward before the peak trading window.


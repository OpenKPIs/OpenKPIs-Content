Parameters: |
  {
    "method": "string - Mechanism used to create the account: email, google, apple, facebook, phone or guest_conversion.",
    "registration_id": "string - One-time idempotency key returned by the account creation call, used to de-duplicate repeat fires on confirmation reloads.",
    "user_id": "string - Pseudonymous account identifier issued by the commerce platform; never an email address or any other direct identifier.",
    "registration_source": "string - Placement that initiated registration, for example header, checkout, wishlist gate, post-purchase prompt or loyalty banner.",
    "account_type": "string - Class of account created where the storefront supports more than one, for example individual, business or trade.",
    "email_verified": "boolean - Whether the address was already verified at creation time; false while a double opt-in confirmation is outstanding.",
    "marketing_opt_in": "boolean - Whether the shopper accepted marketing communications as part of the registration flow.",
    "loyalty_enrolled": "boolean - Whether loyalty enrolment was accepted in the same flow; the enrolment itself is captured by its own event."
  }

Calculation Notes: |
  1️⃣ Fire on confirmed creation only: the event is dispatched after the platform returns a persisted account identifier, never on registration form submit, field validation success or CAPTCHA pass; failed or rejected attempts stay silent so registrations always reconcile to accounts in the commerce and CRM systems.
  2️⃣ Serialization is once per user: guard the dispatch with the one-time registration_id issued by the creation call so a refresh, back navigation or bookmarked confirmation page cannot re-fire it; OAuth and social callbacks that re-enter the confirmation route are the most common source of duplicates.
  3️⃣ Required versus optional payload: method and registration_id are mandatory on every fire, user_id is mandatory wherever the platform already issues a pseudonymous account key, and account_type, registration_source, marketing_opt_in, loyalty_enrolled and email_verified are optional but expected wherever the storefront supports the flow; acquisition attribution is inherited from the session and must never be re-stamped onto the event.
  4️⃣ Guest-checkout account creation fires with method set to guest_conversion, immediately after the purchase confirmation event in the same queue, so the order keeps its guest checkout type while the shopper is still counted as a registration on that date.
  5️⃣ Double opt-in and email verification do not gate the event: sign_up marks account creation and carries email_verified as false where confirmation is pending; the later verification click is reported through the account verification status attribute and must not delay, replace or re-fire this event.
  6️⃣ Consent and PII: no email address, phone number, postal address, name fragment or password-derived value ever enters a parameter or the user_id; send only the pseudonymous account key, suppress the event where analytics or marketing consent is denied under the active consent mode, and keep any identity stitching to the server-side identity graph.
  7️⃣ Recurring instrumentation mistakes to reject in QA: firing on the registration page view, firing again on the new account's first login, reusing sign_up for newsletter opt-in or loyalty enrolment which own their own events, and omitting method so that channel-of-registration reporting collapses into (not set).

Business Use Case: |
  1️⃣ Acquisition Marketing reviews registrations by first-touch channel grouping and campaign in the weekly pacing meeting and reallocates paid budget toward the channels that produce registered accounts rather than raw sessions.
  2️⃣ CRM and Lifecycle Marketing trigger the welcome and first-purchase journey each morning from the previous day's registrations, targeting accounts created with no purchase in the following seven days with a first-order incentive.
  3️⃣ The Product team owning onboarding compares registration volume and completion by method after each sign-up redesign, and keeps or reverts the variant based on the shift between email, Google and Apple registrations.
  4️⃣ Finance uses registrations joined to media spend in the monthly acquisition review to recompute cost per registered customer and reset the acquisition budget ceiling for the next cycle.


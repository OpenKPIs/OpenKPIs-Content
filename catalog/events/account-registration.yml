# Event: Account Registration
# Generated: 2026-09-20T20:32:36.148Z
# Contributed by: devyendarm


Event Name: Account Registration
Event Serialization: once per user

Description: |
  Account Registration is the GA4 sign_up unified event, fired once at the moment the commerce platform confirms that a brand-new shopper account has been created, and it carries the registration method and placement that produced it. It is the entry point of the known-customer lifecycle and is deliberately distinct from Customer Login (login), which authenticates an account that already exists and recurs many times per user: registration happens at most once per account, login happens on every authenticated visit.

Category: Acquisition



















    
    
    
    
    
    
    
    
    

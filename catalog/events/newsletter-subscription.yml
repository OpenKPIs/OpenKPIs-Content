Parameters: |
  {
    "registration_type": "string - kind of sign-up; always newsletter for this event",
    "method": "string - how the email was captured, e.g. email (typed) or google (social prefill)",
    "form_id": "string - stable ID of the signup form",
    "form_type": "string - footer, popup, exit_intent, checkout_opt_in or landing_page",
    "page_type": "string - page template where the form was submitted",
    "marketing_opt_in": "boolean - explicit marketing consent given with the submit",
    "newsletter_list_id": "string - ESP list or audience joined",
    "coupon": "string - welcome incentive code offered, if any",
    "user_id": "string - hashed customer ID when the visitor is logged in"
  }

Calculation Notes: |
  ["1️⃣ Fires on the signup endpoint's success response, not on button click; failed validation and already-subscribed replies do not fire.","2️⃣ Serialization always: every successful submit is a hit. Unique subscribers are deduplicated in the ESP by email address, not in analytics.","3️⃣ Required: registration_type, method, form_id, form_type, page_type, marketing_opt_in. All other parameters are optional.","4️⃣ Never push the email address or name to the dataLayer; send only after consent allows analytics storage.","5️⃣ Double opt-in: fire once on submit; the confirmation click is recorded by the ESP, not as a second hit.","6️⃣ Checkout opt-in fires only if the shopper ticked the box and the email is new to the list; pre-ticked boxes do not count.","7️⃣ Common mistake: sign_up without registration_type = newsletter, which merges email captures into account-registration counts."]

Business Use Case: |
  ["1️⃣ Email Marketing Manager: pop-up sign-ups fall after a redesign → A/B tests the offer and trigger timing.","2️⃣ Acquisition Lead: paid social drives sign-ups but few welcome-coupon orders → shifts budget to higher-intent channels.","3️⃣ CRM Manager: checkout opt-in share drops in one market → audits consent copy and checkbox placement."]


Event Name: Newsletter Subscription
Event Serialization: always

Description: |
  Fires when a visitor submits a valid email to join the marketing newsletter from a footer, pop-up or checkout opt-in. Account creation uses account-registration; paid plans use subscription-start.

Category: Acquisition


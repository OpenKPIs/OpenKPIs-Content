Event Name: Add to cart
Aliases: [Cart Addition, Add to Bag, Add to Basket]

Event Serialization: Emit once after cart commitment; deduplicate by event_id. Retries reuse IDs; new actions use new IDs.

Description: |
  Captures a confirmed addition of one or more product units to a shopping cart. It helps teams understand which products move shoppers toward purchase.

Category: Conversion

Tags: [shopping cart, purchase intent, cart additions]

Industry: [E-commerce, Retail]

Business Criticality: High

Journey / Navigation Area: [Cart]

Owning Function: E-commerce Operations

Scope: Event

Measurement Channels: [Web, Mobile App, Backend / API]

GA4 Event Type: Recommended

Adobe Event Type: Standard XDM

Trigger Condition: WHEN a shopper-initiated positive cart addition is committed, including accepted partial success, THEN emit add_to_cart.

GA4 Event: |
  add_to_cart

Adobe Event: |
  commerce.productListAdds


Calculation Notes: |
  1️⃣ Emit only committed shopper additions; include accepted partial successes, never rejected or pending requests.
  2️⃣ Send positive unit deltas for all accepted lines; exclude decreases, restores, merges, and price-only changes.
  3️⃣ Count each action once across all lines; retries reuse event_id, and distinct successful actions use new IDs.
  4️⃣ The custom GA4 event_timestamp carries business time; it does not set GA4 native collection time.
  5️⃣ Use successful commitment time; reporting intervals include the start and exclude the end before deduplication.

Business Use Case: |
  1️⃣ Merchandising teams compare product additions with product views to prioritize product-page improvements.
  2️⃣ Commerce teams investigate falling confirmed additions to identify cart friction.



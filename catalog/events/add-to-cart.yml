Event Name: Add to cart
Event Serialization: always

Description: |
  Captures every confirmed addition of one or more units of a product to the shopping cart, aligned to the GA4 recommended add_to_cart event and the Adobe Analytics scAdd commerce event, carrying the items array, unit price, quantity added, cart value delta and the placement the add came from. It is the primary micro-conversion between product discovery and checkout, and the event-level foundation for Add-to-Cart Rate, Item View-to-Cart Rate, Cart-to-Purchase Rate, Cart Abandonment Rate and SKU-level merchandising funnels.

Category: Conversion

Tags: [event, E-commerce: Cart & Checkout Funnel Analytics]

Industry: E-commerce

Priority: High

Core Area: Checkout

Scope: Event

Event Type: standard

Aggregation Window: Event, Session, User, Daily, Weekly, Monthly


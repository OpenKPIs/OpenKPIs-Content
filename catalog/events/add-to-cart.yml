Calculation Notes: |
  1️⃣ Include only committed shopper additions; partial successes contain accepted lines only.
  2️⃣ Record positive units added; exclude decreases, restores, merges, and price-only changes.
  3️⃣ Deduplicate event_id across transports before collection; retries reuse IDs, new actions use new IDs.
  4️⃣ Delayed GA4 delivery requires verified transport support for the original commitment timestamp.
  5️⃣ Native analytics user/device identifiers are treated as person-linkable PII under ordinary access controls.

Business Use Case: |
  1️⃣ Merchandising teams compare additions with product views to prioritize product-page improvements.
  2️⃣ Commerce teams investigate falling confirmed additions to identify cart friction.



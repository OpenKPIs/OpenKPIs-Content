Calculation Notes: |
  1️⃣ Emit only committed shopper additions; partial successes include accepted lines only.
  2️⃣ Send positive units added; exclude decreases, restores, merges, and price-only changes.
  3️⃣ Deduplicate before collection by event_id across all transports; GA4 does not do this automatically.
  4️⃣ Preserve commitment time through supported native timestamp transport, including delayed delivery.
  5️⃣ Downstream intervals include the start and exclude the end before deduplication.

Business Use Case: |
  1️⃣ Merchandising teams compare additions with product views to prioritize product-page improvements.
  2️⃣ Commerce teams investigate falling confirmed additions to identify cart friction.



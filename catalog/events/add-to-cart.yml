Calculation Notes: |
  1️⃣ Count one committed shopper addition once, regardless of products or units added.
  2️⃣ Include only accepted lines and positive quantity increments, not the resulting cart contents.
  3️⃣ Exclude failed attempts, decreases, restores, merges, and price-only changes.
  4️⃣ Retries reuse event_id; prevent duplicate collection across transports before sending.
  5️⃣ Collect at commitment time; delayed delivery requires supported transport preserving that time.

Business Use Case: |
  1️⃣ Merchandising teams compare additions with product views to prioritize product-page improvements.
  2️⃣ Commerce teams investigate falling confirmed additions to identify cart friction.



Event Name: Coupon Applied
Aliases: [Promo Code Applied, Voucher Applied]

Event Serialization: One per confirmed coupon application

Description: |
  Records when a store accepts a submitted coupon and applies its discount to a cart or checkout. It helps teams understand promotion use before purchase.

Category: Engagement

Tags: [coupons, promotions, cart, checkout]

Industry: [E-commerce, Retail]

Business Criticality: Medium

Journey / Navigation Area: [Checkout, Cart]

Owning Function: Marketing

Scope: Event

Measurement Channels: [Web, Mobile App]

GA4 Collection Classification: Custom

Adobe XDM Classification: Custom XDM

Trigger Condition: WHEN the store accepts a submitted coupon and applies its discount, THEN emit coupon_apply.

GA4 Event: |
  coupon_apply

Adobe Event: |
  coupon_apply


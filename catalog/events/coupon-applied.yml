Calculation Notes: |
  1️⃣ Emit on confirmed application, not typing, rejected codes, automatic promotions, removal, reloads or purchase.
  2️⃣ Assign each completed application a unique event_id; reuse it on retries and deduplicate by that ID.
  3️⃣ Filter occurrence times to the reporting interval, excluding its end, before deduplicating.
  4️⃣ Collect only with analytics consent; use shared promotion codes and non-person-linked cart IDs, without user IDs.
  5️⃣ Preserve the accepted code unchanged; application does not prove purchase redemption or later coupon validity.

Business Use Case: |
  1️⃣ Marketing compares accepted coupon activity before deciding which promotions to continue.
  2️⃣ E-commerce Operations investigates unexpected changes in accepted applications for a promotion.


Source Data: [Digital Analytics, Commerce Platform]


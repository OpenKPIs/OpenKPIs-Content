Calculation Notes: |
  1️⃣ At commit, the commerce platform assigns one unique ID per transition and freezes the offer ID and commit time.
  2️⃣ Skip requests that leave the coupon applied. Applying it again after removal is a new action.
  3️⃣ Use one sender per platform. Retries reuse the ID and snapshot. Deduplicate by ID after the receipt cutoff.
  4️⃣ With analytics consent, send a stable, nonpersonal ID unique to one offer per reporting scope. Omit private codes.
  5️⃣ Count by commit time for events received by each analytics platform before the reporting period ended.

Business Use Case: |
  1️⃣ Marketing compares confirmed applications by offer to decide which offers to run again.



Parameters: |
  {
    "coupon": "string - Code as submitted, uppercased and trimmed; same format as purchase.coupon",
    "discount_value": "number - Discount granted by the accepted code in currency units",
    "value": "number - Net cart value after the discount, as on add_to_cart and view_cart; pre-discount value = value + discount_value",
    "currency": "string - ISO 4217 code of value and discount_value",
    "cart_id": "string - Cart identifier, same as add_to_cart.cart_id",
    "page_type": "string - cart | checkout",
    "checkout_step": "number - Checkout step where the code was entered; checkout only"
  }

Calculation Notes: |
  ["1️⃣ Fires only when the store accepts a submitted code and applies the discount; never on typing, field focus, a rejected code or the purchase.","2️⃣ Serialization always: each accepted code is a hit. Drop a repeat of the same coupon and cart_id within 2 seconds (Enter plus click).","3️⃣ Required: coupon, discount_value, currency, value, cart_id, page_type. Optional: checkout_step (checkout only).","4️⃣ Rejected codes are tracked on checkout_error (Checkout Error), not here. Code-free automatic promotions and clearing a code do not fire.","5️⃣ Uppercase and trim coupon to join purchase.coupon; mask single-use code suffixes the same way on purchase. No email or user data.","6️⃣ Sent only under analytics consent. Common mistake: firing on the success banner render, so a page reload re-sends the hit; push on the response."]

Business Use Case: |
  ["1️⃣ CRM Marketing: a campaign code is applied often but seldom reaches purchase → reviews checkout friction for that send.","2️⃣ Merchandising: average discount_value per applied code exceeds plan → tightens the code's cap or eligible items.","3️⃣ Finance: a leaked or unissued code spikes in applied hits → has the code revoked and checks the margin hit."]


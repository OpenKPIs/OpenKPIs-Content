Event Name: Coupon Applied
Aliases: [Promo Code Applied, Voucher Applied]

Event Serialization: One per confirmed coupon application

Description: |
  Records when a store accepts a submitted coupon and newly applies its discount in cart or checkout. It shows which offers shoppers choose to use.

Category: Engagement

Tags: [coupons, promotions, cart, checkout]

Industry: [E-commerce, Retail]

Business Criticality: Medium

Journey / Navigation Area: [Checkout, Cart]

Owning Function: Marketing

Scope: Event

Measurement Channels: [Web]

GA4 Collection Classification: Custom

Adobe XDM Classification: Custom XDM

Trigger Condition: WHEN a submitted coupon changes from unapplied to applied in a committed cart or checkout update, THEN emit coupon_applied.

GA4 Event: |
  coupon_applied

Adobe Event: |
  coupon_applied


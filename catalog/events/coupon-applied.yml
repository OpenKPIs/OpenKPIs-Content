Event Name: Coupon Applied
Event Serialization: always

Description: |
  Custom coupon_apply event, fired when the store accepts a coupon or promo code a shopper submits in cart or checkout. Rejected codes do not fire; redemption is read from purchase.

Category: Conversion

Tags: [event, E-commerce: Cart & Checkout Funnel Analytics, cart, checkout, promotion]

Industry: E-commerce

Priority: Medium

Core Area: Checkout


Event Type: custom


Event Name: Lesson Interaction
Event Serialization: always

Description: |
  Tracks user actions within a lesson, such as starting, pausing, or completing, to measure engagement and progression.

Category: Engagement

Tags: [event]

Industry: Education

Priority: High

Core Area: Engagement


Event Type: custom

Aggregation Window: Event

GA4 Event: |
  select_content

Adobe Event: |
  lesson_interaction

W3 Data Layer: |
  {"digitalData":{"user":{"userId":"user_001","userType":"student"},"event":{"lesson":{"lessonId":"12345","lessonTitle":"Introduction to GA4","lessonStatus":"started"},"eventInfo":{"eventName":"Lesson Interaction","eventAction":"engagement","eventCategory":"e-learning"}}}}


Parameters: |
  {"action":"string - type of interaction (e.g., start, pause, complete)","user_id":"string - unique identifier for the user","lesson_id":"string - unique identifier for the lesson","timestamp":"string - ISO 8601 format of the interaction time"}

Calculation Notes: |
  Ensure session timeouts are handled to avoid duplicate interactions. Exclude test users from analysis.

Business Use Case: |
  Analytics teams use this data to identify popular lessons and improve content based on user engagement patterns.



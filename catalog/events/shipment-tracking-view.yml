Event Name: Shipment Tracking View
Event Serialization: always

Description: |
  Records each successful display of shipment-tracking details to a customer or authorized business user, including the shipment's latest status, delivery estimate, carrier, and exception state. It measures tracking engagement at the event, session, user, shipment, and channel levels so teams can identify repeat status checks, delivery concerns, and gaps in tracking-data freshness.

Category: Engagement

Tags: [event]

Industry: Logistics & Supply Chain

Priority: High

Core Area: Engagement


Event Type: custom

Aggregation Window: Event, with Session, User, Shipment, and Time based - Hourly/Daily/Monthly rollups


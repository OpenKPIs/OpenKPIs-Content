Parameters: |
  {"locale":"string - viewer locale represented as a BCP 47 language tag","event_id":"string - globally unique identifier used to deduplicate retried or replayed event messages","order_id":"string - internal order identifier associated with the shipment","page_url":"string - canonical URL or application route for the tracking page with sensitive query parameters removed","platform":"string - delivery platform such as web, ios, android, customer_portal, merchant_portal, or support_console","timezone":"string - IANA timezone used to present shipment dates and times to the viewer","account_id":"string - internal account identifier associated with an authenticated business customer or merchant","session_id":"string - pseudonymous identifier for the active web or application session","app_version":"string - installed application or portal release version when applicable","device_type":"string - device classification such as desktop, mobile, tablet, handheld, or other","merchant_id":"string - internal identifier for the merchant, seller, or shipper responsible for the order","shipment_id":"string - internal unique identifier for the shipment being viewed","carrier_code":"string - standardized code identifying the carrier responsible for the shipment","page_view_id":"string - unique identifier for the page or screen instance containing the tracking view","business_unit":"string - organizational business unit responsible for the shipment experience","customer_type":"string - viewer classification such as guest, consumer, business_customer, merchant, support_agent, or operations_user","event_version":"string - version of the Shipment Tracking View event schema","package_count":"integer - total number of packages associated with the shipment","page_referrer":"string - sanitized referring URL, route, or application screen that preceded the tracking view","shipment_type":"string - shipment classification such as parcel, freight, same_day, international, or store_transfer","source_system":"string - system that supplied the displayed tracking status, such as carrier_api, TMS, OMS, visibility_platform, or manual_update","exception_code":"string - normalized operational exception code displayed for the shipment; null when no exception is active","origin_country":"string - ISO 3166-1 alpha-2 country code for the shipment origin","user_pseudo_id":"string - pseudonymous identifier used to analyze unauthenticated or cross-session behavior where permitted","event_timestamp":"string - UTC timestamp in ISO 8601 format when the tracking details were successfully rendered","shipment_status":"string - normalized shipment status displayed to the viewer, such as label_created, in_transit, out_for_delivery, delivered, exception, or returned","exception_active":"boolean - indicates whether an unresolved shipment exception was displayed","consent_analytics":"boolean - indicates whether analytics collection was permitted for the event under the applicable consent policy","destination_region":"string - state, province, or administrative region code for the shipment destination","exception_category":"string - business grouping of the active exception, such as weather, address, customs, capacity, damage, loss, or recipient_unavailable","shipment_direction":"string - direction of movement, such as outbound, return, transfer, or inbound","shipment_substatus":"string - more detailed normalized status describing the shipment's current operational state","destination_country":"string - ISO 3166-1 alpha-2 country code for the shipment destination","fulfillment_node_id":"string - internal identifier for the warehouse, store, hub, or fulfillment location that dispatched the shipment","notification_channel":"string - originating notification channel when the view followed a shipment communication, such as email, sms, push, messaging, or none","tracking_entry_point":"string - source from which the viewer opened tracking, such as order_history, email_link, sms_link, search, support, push_notification, or direct_url","tracking_number_hash":"string - one-way hash of the carrier tracking number; the raw tracking number must not be included","authenticated_user_id":"string - internal customer or business-user identifier when the viewer is authenticated","carrier_service_level":"string - contracted carrier service such as ground, express, next-day, or economy","data_freshness_seconds":"integer - elapsed whole seconds between the latest shipment status update and successful rendering of the tracking view","delivery_attempt_count":"integer - number of delivery attempts recorded when the tracking view was rendered","latest_checkpoint_city":"string - city associated with the latest displayed shipment checkpoint","latest_checkpoint_code":"string - normalized code for the latest carrier or logistics-network checkpoint displayed","promised_delivery_date":"string - customer-facing delivery commitment date in ISO 8601 date format","status_event_timestamp":"string - UTC timestamp in ISO 8601 format when the displayed shipment status became effective","estimated_delivery_date":"string - latest carrier or platform-calculated estimated delivery date in ISO 8601 date format","actual_delivery_timestamp":"string - UTC delivery completion timestamp in ISO 8601 format when the shipment has been delivered","destination_postal_prefix":"string - truncated destination postal code sufficient for regional analysis without storing the full delivery address","latest_checkpoint_country":"string - ISO 3166-1 alpha-2 country code associated with the latest displayed checkpoint"}

Calculation Notes: |
  Activate the event only after the primary tracking component has rendered a valid shipment identifier and customer-visible status; loading attempts, skeleton screens, authorization failures, invalid tracking searches, and technical error pages do not qualify. Count every qualifying render because event serialization is always, including manual refreshes and repeated views within the same session, but remove transport duplicates sharing the same event_id. A client-side route change counts only when it renders a different shipment or reconstructs the tracking component as a new page or screen instance; background polling, automatic status refreshes, tab focus changes, and component re-renders do not create another view unless the user explicitly reloads or reopens tracking. Use the event timestamp for view reporting and the status event timestamp for operational-status timing; store both in UTC and apply the supplied IANA timezone only for localized reporting. Treat a session as ended after 30 minutes of inactivity unless the governed channel-specific session standard defines a different timeout. Exclude internal monitoring, synthetic tests, bots, carrier webhook activity, employee testing accounts, and events where consent_analytics is false when consent is required. Resolve shipment status, carrier, exception, and delivery dates as they appeared at render time rather than replacing historical event values with the shipment's current state. Null estimated or promised dates must remain null and must not be interpreted as late delivery. Restrict destination geography to approved regional granularity, never collect a raw tracking number or full destination address, and apply authorized identity stitching before calculating cross-session unique viewers.

Business Use Case: |
  The Customer Experience team reviews tracking views by shipment status, exception category, entry point, carrier, and data-freshness band. If a carrier shows high repeat-view volume and stale status data for exception shipments, the team can escalate the carrier feed issue, revise customer messaging, trigger proactive notifications, and prioritize self-service content before related support contacts increase.



Event Name: Checkout Initiation
Event Serialization: always

Description: |
  Records each successful entry into the checkout flow after the commerce platform creates or resumes a valid checkout instance and makes the first checkout step available to the customer. It measures checkout demand and establishes the funnel entry point for evaluating progression from cart or plan selection to completed purchase.

Category: Conversion

Tags: [event]

Industry: E-commerce & SaaS

Priority: High

Core Area: Checkout


Event Type: custom

Aggregation Window: Event, Session, User, and Time based - Hourly/Daily/Monthly/Yearly

GA4 Event: |
  begin_checkout

Adobe Event: |
  begin_checkout


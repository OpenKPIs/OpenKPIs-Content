kout entry","schema_version":"string - payload contract version used to validate the event","traffic_source":"string - normalized acquisition source retained for checkout-funnel analysis","payment_required":"boolean - indicates whether payment details or an immediate payment authorization are required","shipping_required":"boolean - indicates whether the checkout contains items requiring physical shipment","distinct_item_count":"integer - number of distinct product, plan, or SKU lines entering checkout","is_resumed_checkout":"boolean - indicates whether an existing checkout instance was resumed rather than newly created","authentication_state":"string - customer state at entry, such as anonymous, guest, authenticated, or account_admin","checkout_entry_point":"string - controlled value identifying the source action, such as cart, buy_now, pricing_page, product_page, renewal, upgrade, or sales_assisted"}

Calculation Notes: |
  Count only validated event_ids representing successful checkout entry. Deduplicate matching event_ids across client and server streams, and treat repeated records with the same checkout_id, actor_id, session_id, and activation timestamp within 10 seconds as technical duplicates unless a distinct event_id is verified as a new user action. Exclude automated monitoring, load tests, internal QA traffic, known bots, malformed payloads, missing checkout_ids, zero-item carts, and failed checkout creation attempts. A checkout resumed within the same session is a new initiation only when the customer previously exited the checkout boundary and explicitly re-entered; refreshes and step changes are not new initiations. Use a 30-minute inactivity timeout for digital sessions unless the governed enterprise session standard specifies otherwise. Preserve the original currency and value, and use governed exchange rates only in downstream normalized-currency reporting. Link purchases to checkout_id where available and use session-plus-actor fallback only when the checkout identifier is unavailable on the purchase event.

Business Use Case: |
  The Product and Revenue Management teams compare checkout initiation volume and checkout-to-purchase performance by entry point, device, authentication state, product category, and experiment variant. If mobile buy-now entries remain stable while completed purchases decline, the teams can isolate the affected checkout stage, prioritize remediation, and evaluate whether the release should be rolled back.



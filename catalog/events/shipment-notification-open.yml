# Event: Shipment Notification Open
# Generated: 2026-09-14T01:09:37.824Z
# Contributed by: devyendarm


Event Name: Shipment Notification Open
Event Serialization: always

Description: |
  E-commerce specialisation of Notification Open: fires when a customer opens a transactional shipping-lifecycle message (shipping confirmation, out for delivery, delivered, pickup ready or delay) sent by email, SMS or push, as recorded by the ESP or push provider and stitched to the originating order through transaction_id. It is the base engagement signal for post-purchase communications and shows whether delivery updates actually reach customers before they contact support or check order status themselves.

Category: Experience



















    
    
    
    
    
    
    
    
    

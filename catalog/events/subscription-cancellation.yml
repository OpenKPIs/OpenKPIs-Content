Event Name: Subscription Cancellation
Event Serialization: always

Description: |
  Tracks when a user terminates their subscription to the media or streaming service. This event helps measure the churn rate and identify potential issues in customer retention.

Category: Retention

Tags: [event]

Industry: Media & Streaming

Priority: High

Core Area: Monetization


Event Type: custom

Aggregation Window: Event

GA4 Event: |
  unsubscribe

Adobe Event: |
  unsubscribe

W3 Data Layer: |
  {"user":{"subscriptionStatus":"cancelled"},"event":"unsubscribe","eventInfo":{"eventName":"Subscription Cancellation","eventAction":"unsubscribe"}}

GA4 Data Layer: |
  {"event":"unsubscribe","subscription_status":"cancelled"}

Adobe Client Data Layer: |
  {"user":{"subscriptionStatus":"cancelled"},"event":"unsubscribe","eventInfo":{"eventName":"Subscription Cancellation","eventAction":"unsubscribe"}}

XDM Mapping: |
  {"_experience":{"analytics":{"event1":{"eventType":"unsubscribe","subscriptionStatus":"cancelled"}}}}

Parameters: |
  {"user_id":"string - unique identifier for the user","reason_code":"string - code representing the reason for cancellation","subscription_id":"string - unique identifier for the subscription","cancellation_date":"string - ISO 8601 date of cancellation"}

Calculation Notes: |
  1️⃣ Count cancellations once per subscription.  
  2️⃣ Exclude trial cancellations from churn calculations.  
  3️⃣ Ensure accurate tracking of active subscriptions.  
  4️⃣ Maintain separate records for trial and paid subscriptions.  
  5️⃣ Regularly review cancellation data for accuracy.

Business Use Case: |
  Executives use this data to identify patterns in cancellations and develop strategies to improve customer retention.



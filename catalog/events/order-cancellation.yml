Event Name: Order Cancellation
Event Serialization: always

Description: |
  Fires when an entire e-commerce order is cancelled before any item ships, whether the customer cancels through web or app self-service or the merchant or order management platform cancels it (such as Shopify orders/cancelled or a Salesforce Commerce Cloud order cancel), and is sent as the GA4 recommended refund event (a full refund for the transaction_id) with refund_type = order_cancellation because GA4 has no cancel event. It captures order-level cancellations only, excludes refunds that are not cancellations from this spec's rate, and is distinct from shipment cancellation (voiding a carrier freight booking), post-delivery returns and refunds, and payment declines that never create an order.

Category: Operations

Tags: [event, E-commerce: Post-Purchase Logistics & Fulfillment]

Industry: E-commerce

Priority: High

Core Area: Monetization


Event Type: standard

Aggregation Window: Event, Daily, Weekly, Monthly

GA4 Event: |

Parameters: |
  {
    "page_location": "string - Full page URL after client-side PII scrubbing against the query-parameter allowlist; for SPA routes, the virtual URL of the rendered view",
    "page_referrer": "string - URL of the previous page or external referrer, scrubbed with the same allowlist; for SPA routes, the prior virtual URL",
    "page_title": "string - Document title of the rendered page or route, set before the hit fires",
    "page_type": "string - Governed template taxonomy value (home, category, product, search_results, cart, checkout, order_confirmation, content, account)",
    "content_group": "string - Business grouping of the page (e.g. department or site section) used for aggregated content reporting",
    "language": "string - Page or UI language in BCP 47 format (e.g. en-US)",
    "page_hostname": "string - Custom parameter carrying the hostname serving the page; must be registered as a custom dimension in GA4 to be reportable; the production hostname allowlist uses the collected device.web_info.hostname, with this parameter as a fallback",
    "navigation_type": "string - Load mechanism: navigate, reload, back_forward, prerender or spa_route",
    "engagement_time_msec": "integer - Foreground engagement time in milliseconds attributed to the previous page view in the session",
    "ga_session_id": "integer - Session identifier inherited from the active GA4 session; null for cookieless consent-denied pings",
    "ga_session_number": "integer - Ordinal count of the visitor's sessions, used for new versus returning analysis"
  }




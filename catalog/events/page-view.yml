Event Name: Page View
Event Serialization: always

Description: |
  Page View is the standard analytics hit recorded each time a page, or a virtual screen in a single-page application, completes loading and renders for a visitor, equivalent to the GA4 page_view event and the Adobe Analytics page-load (s.t()) call. It is the foundational event behind Pageviews, Sessions, Landing Page and Pages per Session reporting, so its firing rules, URL hygiene and page taxonomy must be governed identically across every template, app shell and analytics platform.

Category: Engagement

Tags: [event, E-commerce: Top-of-Funnel & Marketing Acquisition]

Industry: E-commerce

Priority: High

Core Area: Discovery

Scope: Event

Event Type: standard

Aggregation Window: Event, Session, Daily, Weekly, Monthly

GA4 Event: |
  page_view

Adobe Event: |
  page:view


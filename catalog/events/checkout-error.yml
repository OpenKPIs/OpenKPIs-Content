Event Name: Checkout Error
Event Serialization: always

Description: |
  Fires when a checkout step shows the shopper an error: payment decline, form validation, stock, shipping or promo failure. Each hit carries error type, code and step to locate funnel friction.

Category: Conversion

Tags: [event, E-commerce: Cart & Checkout Funnel Analytics]

Industry: E-commerce


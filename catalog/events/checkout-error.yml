Parameters: |
  {
    "error_type": "string - Error class: payment_declined, validation, inventory, shipping, promo, system",
    "error_code": "string - Normalised error code from the site or payment gateway",
    "error_source": "string - Where the error originated: client, server or payment_gateway",
    "error_message": "string - Templated message key shown to the shopper, no user input",
    "checkout_step": "string - Step where the error appeared, e.g. shipping, payment, review",
    "checkout_type": "string - guest, logged_in or express",
    "cart_id": "string - Cart identifier used for dedupe and joins to the checkout",
    "payment_type": "string - Payment method selected when the error occurred",
    "payment_provider": "string - Gateway or wallet that returned the error",
    "payment_attempt_number": "integer - Sequence of the payment attempt within the checkout",
    "value": "number - Cart value at the time of the error",
    "currency": "string - ISO 4217 currency code of value",
    "traffic_type": "string - Traffic classification used to exclude internal and test hits from checkout error volume"
  }




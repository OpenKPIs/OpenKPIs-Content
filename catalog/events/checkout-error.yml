Parameters: |
  {
    "error_type": "string - Error class: payment_declined, validation, inventory, shipping, promo, system",
    "error_code": "string - Normalised error code from the site or payment gateway",
    "error_source": "string - Where the error originated: client, server or payment_gateway",
    "error_message": "string - Templated message key shown to the shopper, no user input",
    "checkout_step": "string - Step where the error appeared, e.g. shipping, payment, review",
    "checkout_type": "string - guest, logged_in or express",
    "cart_id": "string - Cart identifier used for dedupe and joins to the checkout",
    "payment_type": "string - Payment method selected when the error occurred",
    "payment_provider": "string - Gateway or wallet that returned the error",
    "payment_attempt_number": "integer - Sequence of the payment attempt within the checkout",
    "value": "number - Cart value at the time of the error",
    "currency": "string - ISO 4217 currency code of value",
    "traffic_type": "string - Traffic classification used to exclude internal and test hits from checkout error volume"
  }

Calculation Notes: |
  1️⃣ Fire once per error rendered to the shopper, at display time or on the server response; never on silent retries.
  2️⃣ Dedupe on cart_id + checkout_step + error_code within 5 s; a failed re-submit is a new hit with payment_attempt_number + 1.
  3️⃣ Required: error_type, error_code, checkout_step, checkout_type, cart_id. Optional: error_source, error_message, value, currency, traffic_type.
  4️⃣ Optional on payment-step errors: payment_type, payment_provider, payment_attempt_number (1 on first attempt, +1 per re-submit).
  5️⃣ error_type is a fixed enum (payment_declined, validation, inventory, shipping, promo, system); map raw gateway codes server-side.
  6️⃣ No PII: no card numbers, emails or addresses; error_message is a templated key, never raw text echoing user input.
  7️⃣ Analytics consent only; exclude internal/test via traffic_type. Avoid: pre-submit field hints, numeric error_code, missed server declines.

Business Use Case: |
  1️⃣ Checkout Product Manager: payment-step error share rises week on week → prioritises a fix for the top error_code.
  2️⃣ Payments team: decline errors spike for one payment_provider → reroutes traffic or escalates to the gateway.
  3️⃣ Merchandising: inventory errors at checkout climb → tightens stock sync and oversell buffers for affected SKUs.
  4️⃣ Customer Service: promo or address errors surge after a release → updates help macros and alerts Engineering.


Parameters: |
  {
    "link_url": "string - Full destination URL, query string stripped of PII",
    "link_domain": "string - Destination hostname, e.g. amazon.com",
    "outbound": "boolean - true when link_domain is outside the site and the cross-domain list",
    "link_id": "string - HTML id of the clicked link, if set",
    "link_classes": "string - HTML class attribute of the clicked link, if set",
    "page_location": "string - URL of the page where the click happened",
    "page_type": "string - Site template of the source page, e.g. product, landing, blog"
  }

Calculation Notes: |
  ["1️⃣ Fires on a user click of an <a> link whose hostname differs from the page's; never on mailto:, tel:, script-only buttons or same-domain links.","2️⃣ Serialization always: every click is a hit, repeats included. Count unique exits by link_url per session at reporting time, not in the tag.","3️⃣ Required: link_url, link_domain, outbound (true). Optional: link_id, link_classes, page_location, page_type.","4️⃣ Domains on the GA4 cross-domain list (hosted checkout, payment, BNPL) do not set outbound; keep that list current or checkout hops read as exits.","5️⃣ Consent: sent only with analytics_storage granted. Strip query strings holding emails, tokens or order IDs from link_url before sending.","6️⃣ No manual click push: page_type is a page-level shared event parameter. A custom outbound tag beside enhanced measurement double-counts.","7️⃣ Same-tab exits can lose the hit when the page unloads first; expect counts to understate same-tab exits slightly."]

Business Use Case: |
  ["1️⃣ Affiliate Manager: partner clicks diverge from partner-reported referrals → disputes the invoice before payout.","2️⃣ E-commerce Marketing: PDP clicks to marketplace listings grow → tests moving the link below Add to Cart.","3️⃣ Social Media Manager: header social-icon clicks drain paid landing sessions → moves the icons to the footer.","4️⃣ Acquisition Lead: a paid campaign's landing page shows high outbound share → pauses the ad set and fixes the page."]


Event Name: Outbound Link Click
Event Serialization: always

Description: |
  GA4 enhanced-measurement click with outbound = true, fired when a shopper follows a link to another domain such as a marketplace, social profile or partner site. Cross-domain checkout hops are excluded.

Category: Engagement

Tags: [event, E-commerce: Top-of-Funnel & Marketing Acquisition]

Industry: E-commerce

Priority: Medium

Core Area: Engagement


Event Type: standard

Aggregation Window: Event, Session, Daily


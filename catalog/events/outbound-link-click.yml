    "link_id": "string - HTML id of the clicked link, if set",
    "link_classes": "string - HTML class attribute of the clicked link, if set",
    "page_location": "string - URL of the page where the click happened",
    "page_type": "string - Site template of the source page, e.g. product, landing, blog"
  }




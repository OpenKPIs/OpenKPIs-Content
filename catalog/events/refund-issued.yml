Event Name: Refund Issued
Event Serialization: always

Description: |
  Records each full or partial refund posted against a completed order, keyed to the original purchase transaction_id so that refunded value, currency and line items reconcile to the revenue originally recognised. It is the authoritative input for refund rate, refunded revenue and net revenue reporting, and it separates post-purchase value leakage from gross demand across channels, products and cohorts.

Category: Monetization

Tags: [event, E-commerce: Returns, Refunds & Customer Support]

Industry: E-commerce


Parameters: |
  {
    "transaction_id": "string - Order identifier of the original purchase; join key back to the purchase event (required)",
    "value": "number - Refunded amount in the original transaction currency, excluding refunded tax and shipping (required)",
    "currency": "string - ISO 4217 code of the original transaction (required when value is set)",
    "items": "array - Refunded line items with item_id, item_name, item_category, price and refunded quantity; omit for a full-order refund",
    "refund_id": "string - Payment gateway or OMS refund reference used for deduplication",
    "refund_type": "string - full, partial, store_credit, exchange_difference or goodwill",
    "refund_method": "string - original_payment, store_credit, gift_card or bank_transfer",
    "return_reason": "string - Standardised reason code captured on the return (e.g. wrong_size, damaged, not_as_described, changed_mind)",
    "return_method": "string - How the goods came back: mail, in_store, courier_pickup or returnless",
    "shipping": "number - Shipping amount refunded, in the transaction currency",
    "tax": "number - Tax amount refunded, in the transaction currency",
    "original_order_date": "string - ISO 8601 date of the original purchase, used for cohort and refund-lag analysis",
    "refund_channel": "string - Where the refund was initiated: self_service_portal, customer_service, store_pos or marketplace"
  }




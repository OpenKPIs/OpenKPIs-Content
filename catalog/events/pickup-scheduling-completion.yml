  {"user_id":"string - pseudonymous identifier for the authenticated or recognized user completing the schedule","event_id":"string - globally unique identifier for this event activation, used for event-level deduplication","order_id":"string - unique identifier for the commercial order or fulfillment order associated with the shipment","platform":"string - application platform on which scheduling was completed, such as web, iOS, Android, partner_api, or internal","carrier_id":"string - unique identifier for the carrier assigned to perform the pickup","session_id":"string - identifier for the digital session in which pickup scheduling was completed, when applicable","device_type":"string - normalized device class used in a digital scheduling flow, such as desktop, mobile, tablet, or unknown","origin_city":"string - normalized city name for the pickup origin","pickup_type":"string - operational pickup classification, such as on_demand, scheduled, recurring, drop_trailer, or parcel","shipment_id":"string - unique identifier for the shipment associated with the scheduled pickup","volume_unit":"string - unit for total_volume, such as m3, ft3, or in3","weight_unit":"string - unit for total_weight, restricted to an approved code such as kg or lb","total_volume":"number - total declared shipment volume included in the pickup request, when supplied","total_weight":"number - total declared shipment weight included in the pickup request","event_version":"string - version of the event payload contract used by the producer","package_count":"integer - total number of packages, handling units, pallets, or parcels included in the pickup request","service_level":"string - normalized transportation or pickup service level selected for the shipment","source_system":"string - system that emitted the event, such as web application, TMS, mobile application, or carrier booking service","attempt_number":"integer - sequential scheduling attempt number for the pickup_request_id, beginning at 1","correlation_id":"string - identifier used to trace the scheduling transaction across digital, integration, TMS, and carrier systems","event_timestamp":"string - UTC ISO 8601 timestamp when the pickup booking became durably confirmed","organization_id":"string - unique identifier for the shipper organization or business entity","pickup_timezone":"string - IANA timezone applicable to the pickup location and pickup window","reschedule_flag":"boolean - indicates that the completion replaced a previously confirmed pickup schedule","completion_method":"string - mechanism that finalized the booking, such as synchronous_carrier_confirmation, asynchronous_confirmation, manual_confirmation, or standing_schedule","completion_status":"string - terminal scheduling result; must equal confirmed for a valid completion event","lead_time_minutes":"integer - whole minutes from event_timestamp to confirmed_window_start, based on UTC timestamps","pickup_address_id":"string - tokenized or master-data identifier for the physical pickup address","pickup_request_id":"string - stable identifier for the pickup request across attempts, confirmations, and reschedules","commodity_category":"string - normalized high-level category of goods included in the pickup","origin_postal_code":"string - postal or ZIP code for the pickup origin","origin_region_code":"string - standardized state, province, or administrative region code for the pickup origin","schedule_flow_type":"string - scheduling workflow type, such as new_booking, reschedule, recurring_pickup, bulk_booking, or return_pickup","scheduling_channel":"string - channel used to schedule the pickup, such as web, mobile_app, API, call_center, EDI, or operations_console","customer_account_id":"string - unique identifier for the customer account responsible for the shipment","origin_country_code":"string - ISO 3166-1 alpha-2 country code for the pickup origin","shipper_location_id":"string - identifier for the customer facility, warehouse, store, or site where pickup will occur","carrier_service_code":"string - carrier-defined code for the booked pickup or transportation service","confirmed_window_end":"string - ISO 8601 timestamp for the end of the confirmed pickup window","requested_window_end":"string - ISO 8601 timestamp for the end of the pickup window requested by the user","confirmed_pickup_date":"string - local calendar date confirmed by the scheduling system in YYYY-MM-DD format","contact_required_flag":"boolean - indicates whether the carrier must contact the pickup location before arrival","requested_pickup_date":"string - local calendar date initially requested for pickup in YYYY-MM-DD format","confirmed_window_start":"string - ISO 8601 timestamp for the start of the confirmed pickup window","requested_window_start":"string - ISO 8601 timestamp for the start of the pickup window requested by the user","booking_confirmation_id":"string - unique confirmation or booking reference returned by the authoritative scheduling system","confirmation_latency_ms":"integer - elapsed milliseconds between final schedule submission and receipt of durable confirmation","hazardous_material_flag":"boolean - indicates whether the pickup includes regulated hazardous materials","special_instructions_flag":"boolean - indicates whether pickup instructions beyond standard service requirements were provided"}

Calculation Notes: |
  Emit the event only after the authoritative scheduling platform has persisted the pickup booking, assigned a non-null booking_confirmation_id, and returned completion_status=confirmed; do not emit for form submission, slot selection, quotation, pending carrier response, validation failure, technical failure, cancellation, or abandonment. Raw activations follow event_serialization=always, but curated event counts must deduplicate exact replays by event_id; if event_id is unavailable, retain the earliest valid record for the same pickup_request_id, booking_confirmation_id, event_version, and completion_status. A confirmed reschedule is a separate valid activation with reschedule_flag=true and the same stable pickup_request_id, but it must be excluded from first-time scheduling completion metrics unless explicitly requested. attempt_number must increase only after a submitted attempt fails or does not confirm, not for page views or field edits. Use event_timestamp as the completion time, store it in UTC, and interpret requested and confirmed pickup windows in pickup_timezone; lead_time_minutes must be recalculated when source values conflict. For digital funnel analysis, use a 30-minute inactivity timeout for sessionization and allow cross-session completion attribution through pickup_request_id. Exclude test accounts, synthetic monitoring traffic, employee training transactions, invalidated bookings, and records missing pickup_request_id, booking_confirmation_id, shipment_id, carrier_id, or confirmed_window_start from certified reporting. Process late-arriving events according to event_timestamp rather than ingestion time, and apply carrier or TMS corrections as restatements without creating an additional completion unless a new confirmation identifier or confirmed reschedule exists.

Business Use Case: |
  Transportation Operations reviews completion rate, confirmation latency, and reschedule rate by carrier, origin region, scheduling channel, and service level. When a carrier or channel shows declining first-attempt completion or excessive confirmation latency, the team can redirect booking volume, adjust pickup cutoffs, correct integration failures, expand slot capacity, or require carrier remediation before missed pickups affect fulfillment commitments.


Source Data: Transportation Management System (TMS), Carrier Booking APIs, Digital Analytics, Mobile Applications, EDI Integrations, and Customer Service Scheduling Systems


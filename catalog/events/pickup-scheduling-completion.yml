Event Name: Pickup Scheduling Completion
Event Serialization: always

Description: |
  Records each successful completion of a pickup scheduling flow after a durable pickup booking and confirmation identifier have been created by the responsible scheduling system. It measures confirmed pickup scheduling activity across customers, shipments, carriers, channels, locations, service levels, and requested pickup windows.

Category: Conversion

Tags: [event]

Industry: Logistics & Supply Chain

Priority: High

Core Area: Checkout


Event Type: custom

Aggregation Window: Event


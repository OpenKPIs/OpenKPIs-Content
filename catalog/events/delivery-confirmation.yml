# Event: Delivery Confirmation
# Generated: 2026-09-14T01:05:56.411Z
# Contributed by: devyendarm


Event Name: Delivery Confirmation
Event Serialization: always

Description: |
  E-commerce specialisation of Proof of Delivery Confirmation: records the moment a customer order shipment reaches carrier-confirmed "delivered" status, sourced from commerce-platform fulfillment events (e.g. Shopify FulfillmentEvent status = delivered) and carrier tracking webhooks reconciled in the order management system, rather than the signature or photo evidence captured in carrier and freight delivery systems. Because the payload is order- and shipment-level (transaction_id, shipment_id, promised versus actual delivery dates) and the source tables are fulfillment and tracking records, it is the system of record for On-Time Delivery Rate, Days to Delivery and Orders Delivered.

Category: Operations



















    
    
    
    
    
    
    
    
    

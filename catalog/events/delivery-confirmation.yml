Event Name: Delivery Confirmation
Event Serialization: always

Description: |
  E-commerce specialisation of Proof of Delivery Confirmation: records the moment a customer order shipment reaches carrier-confirmed "delivered" status, sourced from commerce-platform fulfillment events (e.g. Shopify FulfillmentEvent status = delivered) and carrier tracking webhooks reconciled in the order management system, rather than the signature or photo evidence captured in carrier and freight delivery systems. Because the payload is order- and shipment-level (transaction_id, shipment_id, promised versus actual delivery dates) and the source tables are fulfillment and tracking records, it is the system of record for On-Time Delivery Rate, Days to Delivery and Orders Delivered.

Category: Operations

Tags: [event, E-commerce: Post-Purchase Logistics & Fulfillment]

Industry: E-commerce

Priority: High

Core Area: Generic


Event Type: custom

Aggregation Window: Event, Daily, Weekly, Monthly







Parameters: |
  {"transaction_id":"string - Order identifier matching the purchase event transaction_id","shipment_id":"string - Unique fulfillment or shipment identifier; deduplication key","customer_id":"string - Pseudonymous customer identifier from the commerce platform","carrier":"string - Carrier name as normalised in the OMS (e.g. UPS, FedEx, USPS, DHL)","tracking_number":"string - Carrier tracking number for the shipment","service_level":"string - Shipping service purchased (e.g. standard, expedited, next_day)","promised_delivery_date":"date - Delivery date promised to the customer at checkout (destination local date)","ship_timestamp":"datetime - UTC timestamp of the first carrier acceptance scan","delivered_timestamp":"datetime - UTC timestamp of the carrier delivered scan","delivery_location_type":"string - Where the parcel was left (e.g. front_door, mailroom, parcel_locker, access_point, neighbour)"}

Calculation Notes: |
  1️⃣ Deduplication: one event per shipment_id. Carriers frequently emit repeated "delivered" scans or re-send webhooks; keep the earliest delivered_timestamp per shipment_id and discard subsequent duplicates, including replays after OMS resyncs.
  2️⃣ Split shipments: each shipment_id fires its own event. An order (transaction_id) counts toward Orders Delivered only when every non-cancelled shipment on that order has a delivery_confirmation; On-Time Delivery Rate is evaluated at shipment level against that shipment's promised_delivery_date.
  3️⃣ Exclusions: digital or non-shippable items, buy-online-pickup-in-store and curbside orders (fulfilled by pickup, not carrier delivery), return-to-sender and reverse-logistics shipments, cancelled or fully refunded-before-ship orders, internal replacement shipments flagged as such, and test or employee orders.
  4️⃣ Timing and time zones: delivered_timestamp is the carrier scan time normalised to UTC; on-time comparison uses the destination local calendar date against promised_delivery_date inclusive (a delivery at 21:00 local on the promised date is on time). Report on delivered date, never on webhook ingestion date.
  5️⃣ Late-arriving data: carrier webhooks and OMS polling can lag 24–72 hours, so daily aggregates are restated on a rolling 7-day lookback; shipments in transit with no delivered status after 30 days past promised_delivery_date are routed to delivery-exception-occurrence rather than left open.
  6️⃣ Status reversals: a delivered scan later followed by a carrier exception (misdelivery, lost-package claim) keeps the original event for audit but is flagged and excluded from On-Time Delivery Rate numerators until resolved; the corrected delivery, if any, supersedes it.
  7️⃣ Days to Delivery is measured from the purchase event timestamp (joined on transaction_id) to delivered_timestamp in fractional calendar days; transit time (ship_timestamp to delivered_timestamp) is reported separately so warehouse handling time and carrier performance are not conflated.

Business Use Case: |
  1️⃣ Logistics and Carrier Management team: when weekly On-Time Delivery Rate for a carrier and service_level falls below the contracted SLA, they file service-failure refund claims with the carrier and shift volume in the rate-shopping rules toward better-performing carriers for the affected lanes.
  2️⃣ Customer Service operations lead: when Days to Delivery for a region exceeds the promised window for two consecutive days, they trigger proactive delay notifications and pre-authorise shipping-fee credits to reduce "where is my order" contact volume.
  3️⃣ E-commerce Merchandising and Site Experience team: each month they recalibrate the delivery-date promise shown on product and checkout pages using actual delivered_timestamp distributions by service_level and destination, tightening estimates where carriers consistently beat them.
  4️⃣ CRM and Lifecycle Marketing team: on receipt of delivery_confirmation they schedule the post-delivery review request and replenishment or cross-sell journey a fixed number of days after delivery rather than after purchase, suppressing sends for flagged reversals.


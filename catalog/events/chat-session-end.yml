Event Name: Chat Session End
Aliases: [Chat End, Chat Closed, Live Chat End]

Event Serialization: One per closed support chat

Description: |
  Records when a customer, agent, or bot closes a support chat or when the chat times out. Support teams use the closure reason and elapsed time to review staffing and routing.

Category: Operational Efficiency

Tags: [customer support, live chat, chat closure]

Industry: [E-commerce, Retail]

Business Criticality: Medium

Journey / Navigation Area: [Customer Service]

Owning Function: Customer Support

Scope: Event

Measurement Channels: [Web]

GA4 Collection Classification: Custom

Adobe XDM Classification: Custom XDM

Trigger Condition: WHEN the support platform records a chat as finally closed, THEN emit chat_session_end.

GA4 Event: |
  chat_session_end

Adobe Event: |
  chat_session_end


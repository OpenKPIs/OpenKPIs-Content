Parameters: |
  {
    "interaction_type": "string - support-interaction phase carried by the unified contact_support event; 'chat_end' identifies this as the chat-closing hit",
    "chat_session_id": "string - chat platform conversation ID; dedupe key",
    "end_reason": "string - customer_closed, agent_closed, bot_closed or inactivity_timeout",
    "handled_by": "string - bot, agent or bot_to_agent",
    "chat_duration_sec": "integer - seconds from chat start to close, queue time included",
    "ticket_id": "string - CRM ticket linked to the chat, if one was created",
    "contact_reason": "string - reason the customer selected or the agent tagged, e.g. return_status",
    "resolution_type": "string - resolution recorded at close, e.g. resolved, escalated, unresolved",
    "agent_team": "string - team of the last agent on the chat; empty for bot-only chats",
    "csat_prompted": "boolean - true when the post-chat survey was shown"
  }




Calculation Notes: |
  1️⃣ At final closure, the support platform assigns a stable event ID and freezes the event details.
  2️⃣ Minimized widgets, page changes, tab closures, and transfers leave the event unrecorded while the chat is open.
  3️⃣ Use one sender per destination. Retry with the same ID and details. Deduplicate reports by event ID.
  4️⃣ Count seconds from first queue entry to closure, or from chat start if no queue was used. Transfers keep that start.
  5️⃣ Send only with analytics consent. Omit transcripts, contact details, and customer or ticket IDs.

Business Use Case: |
  1️⃣ Support managers review staffing and first-response targets when inactivity timeouts rise.
  2️⃣ Support leads review triage and routing when chats take longer to close.


Source Data: [Customer Support, Digital Analytics]

Report Attributes: [Chat end reason, Chat duration in seconds]

Segment Eligibility: |
  Chat End Reason IN ("customer_closed", "agent_closed", "bot_closed", "inactivity_timeout")






Event Name: Cart Viewed
Aliases: [Shopping Cart View, Basket View]

Event Serialization: One per confirmed cart view

Description: |
  Records when a shopper opens a cart with at least one item. It helps teams understand which products shoppers see when they review their carts.

Category: Engagement

Tags: [shopping cart, cart review]

Industry: [E-commerce, Retail]

Business Criticality: Medium

Journey / Navigation Area: [Cart]

Owning Function: Digital Experience

Scope: Event

Measurement Channels: [Mobile App, Web]

GA4 Collection Classification: Recommended

Adobe XDM Classification: Standard XDM

Trigger Condition: WHEN the shopper opens a cart and its nonempty item list is displayed, THEN emit cart_viewed.

GA4 Event: |
  view_cart

Adobe Event: |
  commerce.productListViews


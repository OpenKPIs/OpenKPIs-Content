Calculation Notes: |
  1️⃣ At confirmed display, the storefront assigns a stable event ID and freezes the UTC view time and full item list.
  2️⃣ Exclude empty carts, background loads, and redraws. Reopening a nonempty cart counts as a new view.
  3️⃣ Use one sender per platform. Retries reuse the original event ID, view time, and item list.
  4️⃣ Report by view time using events received by each analytics platform before the reporting period ended.
  5️⃣ After applying the receipt cutoff, count each event ID once.

Business Use Case: |
  1️⃣ Digital Experience teams compare cart views by product to choose which item details to test for clarity.



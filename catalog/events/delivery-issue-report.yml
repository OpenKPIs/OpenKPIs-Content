Event Name: Delivery Issue Report
Event Serialization: always

Description: |
  Standard submit_form event with form_type = delivery_issue, fired when a customer reports a missing, late or damaged shipment. Carrier-raised exceptions are Delivery Exception Occurrence, not this event.


Parameters: |
  {
    "form_type": "string - fixed value delivery_issue",
    "transaction_id": "string - order ID of the affected order, same key as purchase",
    "shipment_id": "string - shipment or package reported; one order can hold several",
    "issue_type": "string - not_received, late, damaged or partial",
    "case_id": "string - service case or ticket ID returned on submit (optional)",
    "carrier": "string - carrier handling the shipment (optional)",
    "support_channel": "string - self_service or agent (optional)"
  }

Calculation Notes: |
  1️⃣ Fires when the order-issue form is accepted and a case_id is returned; never on form open, failed validation or a tracking page view.,2️⃣ Serialization always: one hit per report. Drop a resubmit with the same transaction_id, shipment_id and issue_type within 24 hours.,3️⃣ Required: form_type, transaction_id, shipment_id, issue_type (not_received, late, damaged, partial). Optional: case_id, carrier, support_channel.,4️⃣ Customer-initiated only: carrier scans go to Delivery Exception Occurrence; general Contact Us messages stay Contact Form Submission.,5️⃣ No free text, photos, address, email or phone in the hit; case_id links to the service record. Send only under analytics consent.,6️⃣ Reports logged by an agent on phone or chat are sent server-side with support_channel = agent and the customer's client_id.,7️⃣ Common mistakes: one hit per item instead of per shipment, and a missing shipment_id on split orders, which breaks carrier attribution.

Business Use Case: |
  1️⃣ Customer Service: damaged reports for one carrier rise week over week → files a carrier claim and reviews packaging.,2️⃣ Fulfillment Ops: not_received reports cluster on shipments scanned delivered → requires photo proof in that region.,3️⃣ Finance: reports per 1,000 shipments by carrier exceed contract → withholds SLA credits at the quarterly review.


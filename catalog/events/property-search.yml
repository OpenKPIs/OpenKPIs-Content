Parameters: |
  {"city":"string - normalized city or municipality searched","region":"string - normalized state, province, county, or equivalent first-level administrative area searched","currency":"string - ISO 4217 currency code associated with submitted price filters","event_id":"string - globally unique identifier used to detect duplicate event delivery","keywords":"array[string] - normalized non-location search terms or feature phrases applied to the inventory query","max_area":"number - inclusive maximum floor area requested in the stated area unit","min_area":"number - inclusive minimum floor area requested in the stated area unit","platform":"string - channel on which the search occurred, such as web, iOS, Android, or partner portal","amenities":"array[string] - normalized amenity filters, such as parking, pool, elevator, balcony, or pet_friendly","area_unit":"string - unit used for area filters, such as square_meter or square_foot","max_price":"number - inclusive maximum property price or rent requested; null when unrestricted","min_price":"number - inclusive minimum property price or rent requested; null when unrestricted","radius_km":"number - search radius in kilometers when a radius-based geographic constraint is used","search_id":"string - unique identifier linking the search execution to returned results and downstream listing interactions","error_code":"string - stable application or service error code when search_status is not success; null for successful searches","map_bounds":"string - ordered southwest and northeast coordinates defining the visible map search boundary","session_id":"string - identifier for the active digital session","sort_order":"string - result ordering applied, such as relevance, newest, price_ascending, price_descending, or distance","app_version":"string - application or website release version generating the event","search_mode":"string - search interaction mode, such as list, map, natural_language, address, or nearby","country_code":"string - ISO 3166-1 alpha-2 code for the searched country","filter_count":"integer - count of active user-selectable filters excluding default market, inventory, and access controls","max_bedrooms":"integer - maximum number of bedrooms requested; null when unrestricted","min_bedrooms":"integer - minimum number of bedrooms requested; null when unrestricted","neighborhood":"string - normalized neighborhood, district, or local market area searched","search_query":"string - normalized and sanitized search text with email addresses, phone numbers, and other direct identifiers removed","location_type":"string - geographic level represented by the location query, such as country, region, city, postal_area, neighborhood, address, or map_area","min_bathrooms":"number - minimum number of bathrooms requested; null when unrestricted","property_type":"string - normalized primary property category, such as residential, commercial, land, or industrial","results_count":"integer - total number of eligible listings reported by the search service before pagination","search_status":"string - processing outcome of the search request, such as success, validation_error, timeout, or service_error","listing_status":"string - requested listing lifecycle status, such as active, coming_soon, under_offer, sold, or rented","location_query":"string - normalized place, address, development, landmark, or administrative area supplied as the search location","map_zoom_level":"number - map zoom level at the time the search was executed","search_trigger":"string - user or system action that executed the search, such as submit, filter_apply, map_move, sort_change, or saved_search_open","event_timestamp":"string - UTC timestamp in ISO 8601 format when the search request was accepted","filters_applied":"array[string] - canonical names of active search filters without duplicating their submitted values","open_house_only":"boolean - indicates whether the search was restricted to listings with a scheduled open house","property_subtype":"string - normalized detailed property category, such as apartment, detached_house, townhouse, office, or warehouse","response_time_ms":"integer - elapsed milliseconds from search request submission to receipt of the search response","transaction_type":"string - intended real estate transaction, such as sale, rent, lease, auction, or new_development","anonymous_user_id":"string - pseudonymous, non-PII visitor identifier used for cross-session analysis where consent permits","listed_since_days":"integer - maximum listing age in whole days requested by the user; null when unrestricted","zero_results_flag":"boolean - true when a successful search returns a results_count of zero","postal_code_prefix":"string - approved partial postal code used for area analysis without retaining a precise household address","search_entry_point":"string - product surface where the search began, such as home page, search page, map, saved search, or agent profile","map_center_latitude":"number - latitude of the searched map center rather than the user's physical location","map_center_longitude":"number - longitude of the searched map center rather than the user's physical location","experiment_assignments":"array[string] - active search-related experiment and variant identifiers applicable when the event occurred"}

Calculation Notes: |
  Emit the event only when a search request is submitted to and accepted by the search service; opening the search page, editing controls without execution, client-side autocomplete impressions, and pagination do not qualify. Emit a separate event for every explicit submission, filter application, sort change, saved-search execution, or map movement that requests refreshed inventory, and use search_trigger to distinguish these actions. Deduplicate transport retries using event_id while preserving genuinely repeated searches with different event IDs; search_id must remain stable only for the request and its associated result set. Set results_count to the service-reported total eligible inventory before pagination, and set zero_results_flag only for successful responses with zero results; failed or timed-out searches must use a null results_count and zero_results_flag. Calculate session-level analysis using a 30-minute inactivity timeout unless the governed platform session standard specifies otherwise. Exclude approved bots, synthetic monitoring, employee test traffic, malformed requests, and searches blocked before service acceptance from business reporting. Normalize property, location, amenity, currency, and area-unit values against governed taxonomies, and do not convert submitted prices or areas in the source event. Sanitize free-text fields before collection and prohibit email addresses, phone numbers, access credentials, or unapproved precise personal addresses.

Business Use Case: |
  The Product and Marketplace teams compare zero-result rate and search-to-inquiry conversion by city, property type, price band, and filter depth. If high-demand searches in a city repeatedly return no inventory, executives can prioritize listing acquisition in that market, while Product can revise overly restrictive defaults or improve location matching where inventory exists but search engagement remains weak.



# Event: Pickup Ready Notification
# Generated: 2026-09-19T18:28:19.373Z
# Contributed by: devyendarm


Event Name: Pickup Ready Notification
Event Serialization: always

Description: |
  Backend send event recorded when the order management system confirms a Buy Online, Pick Up In Store order has been picked, staged and marked ready to collect, and the email, SMS or push message telling the shopper so is dispatched through the ESP/CRM. Joined to the originating online purchase on transaction_id, it marks the store's ready-for-pickup commitment, so it anchors order-to-ready time, pickup completion and abandoned-pickup (return-to-stock) exposure by store and channel.

Category: Operations



















    
    
    
    
    
    
    
    
    

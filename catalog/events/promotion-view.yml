Parameters: |
  {
    "promotion_id": "string - Stable identifier of the promotion as registered in the campaign or offer system; the join key to Promotion Click and to campaign reporting.",
    "promotion_name": "string - Governed, human-readable promotion name such as 'Summer Sale 30% Off', shared with the paid media naming convention so on-site and off-site reporting reconcile.",
    "creative_name": "string - Name and version of the rendered creative asset, distinguishing design variants of the same promotion during experiments and refreshes.",
    "creative_slot": "string - Placement position of the creative within the page template, such as 'homepage_hero_1' or 'plp_banner_top'; values come from a fixed slot taxonomy.",
    "location_id": "string - Surface on which the creative was served (page type, list, locale or store context), required when one creative runs in several placements.",
    "items": "array - Optional list of products promoted by the creative (item_id, item_name, item_brand, price, index); sent only when the creative links to specific SKUs."
  }

Calculation Notes: |
  1️⃣ Fires on qualified viewability, not on render: the creative must have at least 50% of its pixel area inside the viewport for one continuous second, measured with an IntersectionObserver. Above-the-fold creatives fire once the threshold is met after paint; single-page-application route changes only re-arm the observer, they never fire the event by themselves.
  2️⃣ Serialization is once per promotion_id + creative_slot per page view, and the event fires on every subsequent page view — scrolling a creative out of and back into the viewport must not re-fire. Lazy-loaded and infinite-scroll modules fire on first qualifying exposure only; a carousel is the exception, where each slide is its own creative and fires when it becomes the active qualifying slide, with auto-rotation back to a slide already counted suppressed for the life of the page.
  3️⃣ Required parameters are promotion_id, promotion_name, creative_name and creative_slot; location_id is required whenever the same creative is served in more than one placement or locale. The items array is optional and is populated only when the creative promotes specific SKUs — send no array rather than an empty one, and keep promotion values identical at event and item level.
  4️⃣ Excluded from collection: exposures in a hidden or backgrounded tab (document.visibilityState is not 'visible'), pre-rendered and bot traffic, creatives inside collapsed accordions or off-screen carousel slides that were never activated, and personalisation slots that resolved to no creative at all.
  5️⃣ No personal data belongs in the payload. promotion_id, creative_name and creative_slot must be catalogue values from the campaign and merchandising systems, never a personalised string containing a customer name, email hash, segment membership or basket content, and collection is suppressed while analytics consent is denied so consented and non-consented exposure never mix in the denominator.
  6️⃣ The most common instrumentation faults are firing on DOM insertion rather than viewport exposure, which inflates the denominator and depresses Promotion Click-Through Rate; letting promotion_id or creative_slot drift between view_promotion and select_promotion, which breaks the impression-to-click join; reusing one creative_slot label across templates; and treating internal promotion views as paid media impressions in acquisition reporting.
  7️⃣ Volume is high — a merchandised homepage can emit more promotion views than page views — so cap the number of creatives instrumented per template, timestamp each event at the moment of qualifying exposure rather than at page load, and keep the event out of conversion-path and engagement definitions to protect event quotas and server-call budgets.

Business Use Case: |
  1️⃣ The Onsite Merchandising Manager reviews slot performance every Monday, ranks each creative_slot by promotion views against the clicks and revenue they generate, and rotates or retires any slot delivering exposure without click-through before the next campaign drop.
  2️⃣ The Campaign Marketing team checks delivery within 24 hours of a promotion going live, confirming the creative actually reached shoppers across device categories, locales and channels, and fixes targeting or personalisation rules when a placement shows no or partial exposure.
  3️⃣ The Product team running banner and hero experiments uses promotion views as the exposure denominator, verifying both variants received a comparable impression base before any click-through or conversion difference is read as a result.
  4️⃣ Revenue Management uses exposure by promotion and audience to judge how much discount visibility is being spent for each incremental order, and reallocates promotional inventory toward offers with the strongest click-to-order yield.


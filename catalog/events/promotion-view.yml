Event Name: Promotion View
Event Serialization: always

Description: |
  Promotion View is the standard ecommerce view_promotion event, recorded when an internal promotional creative such as a hero banner, carousel slide, category tile or offer module becomes genuinely visible to a shopper, and it carries promotion_id, promotion_name, creative_name, creative_slot and location_id. It is the impression half of the on-site campaign funnel and the agreed denominator for Promotion Click-Through Rate, so every promotion, creative variant and placement can be compared on exposure as well as on clicks and downstream revenue.

Category: Acquisition


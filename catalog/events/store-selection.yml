Event Name: Store Selection
Event Serialization: always

Description: |
  Records the moment a shopper sets or changes their preferred or pickup store, captured as the unified select_content event with content_type 'store' plus the store identifier, the store's distance from the shopper and the surface where the choice was made (locator, product page, cart, checkout or header). It is the anchor for measuring local-intent adoption in Buy Online Pick Up In Store journeys, because every store-scoped availability check, pickup assignment and store-level revenue attribution depends on a store being bound to the session first.

Category: Conversion

Tags: [event, Retail: Omnichannel (BOPIS - Buy Online Pick Up In Store), store_select, select_content, local-intent]

Industry: Retail

Priority: High

Core Area: Discovery


Event Type: standard

Aggregation Window: Event, Session, User, Daily, Weekly


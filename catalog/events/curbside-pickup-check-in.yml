Event Name: Curbside Pickup Check-In
Event Serialization: always

Description: |
  Fires when a curbside customer checks in on arrival: an I'm Here tap in the app, order page or SMS link, or a server-side geofence arrival. The handover itself is order-pickup.

Category: Operations

Tags: [event, Retail: Omnichannel (BOPIS - Buy Online Pick Up In Store)]

Industry: Retail

Priority: Medium

Core Area: Generic


Event Type: custom


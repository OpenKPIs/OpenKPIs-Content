Parameters: |
  {
    "form_type": "string - always curbside_check_in for this event",
    "transaction_id": "string - order ID the customer is collecting; joins to purchase and order-pickup",
    "store_id": "string - store where the customer checked in",
    "fulfillment_method": "string - always curbside for this event",
    "check_in_method": "string - app, web, sms or geofence",
    "parking_spot": "string - optional bay number entered by the customer",
    "order_ready_status": "string - optional order state at check-in: ready or not_ready",
    "pickup_window_start": "string - optional ISO 8601 start of the booked pickup window"
  }

Calculation Notes: |
  ["1️⃣ Fires when the order system accepts the check-in; never on the pickup-ready message, an On My Way tap or a check-in page load.","2️⃣ Serialization always: repeat taps re-fire. Dedupe on transaction_id + store_id for one check-in per order; keep the first timestamp.","3️⃣ Required: form_type, transaction_id, store_id, fulfillment_method, check_in_method. The other three parameters are optional.","4️⃣ No vehicle make, colour, plate or GPS coordinates in the payload; staff read vehicle details from the order system, not analytics.","5️⃣ The analytics hit follows analytics consent; the store alert does not. Expect fewer GA4 check-ins than order-system check-ins.","6️⃣ Geofence auto check-ins set check_in_method = geofence and are sent once, server-side; firing the client tap as well doubles arrivals.","7️⃣ Counter and locker pickups do not fire it; fulfillment_method must be curbside, never the generic pickup value."]

Business Use Case: |
  ["1️⃣ Store Operations: check-in to handover time runs over target at a store → adds a curbside runner at peak hours.","2️⃣ Customer Service: many check-ins arrive with order_ready_status not ready → delays the pickup-ready message.","3️⃣ Omnichannel Product Manager: SMS check-ins far outnumber app check-ins → promotes app check-in in the ready message."]


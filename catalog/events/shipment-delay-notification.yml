Parameters: |
  {"customer_id":"string - unique identifier for the customer","reason_code":"string - code representing the reason for the delay","shipment_id":"string - unique identifier for the shipment","delay_duration":"integer - duration of the delay in hours","notification_id":"string - unique identifier for the notification"}

Calculation Notes: |
  Ensure notifications are only counted once per delay event. Exclude notifications for delays under 1 hour.

Business Use Case: |
  Executives can use this data to identify frequent delay causes and implement process improvements to enhance delivery reliability.



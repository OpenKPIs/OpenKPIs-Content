  {"event":"Shipment Delay Notification","shipment":{"shipmentId":"12345","delayReason":"Weather conditions","expectedDeliveryDate":"2023-10-15"},"eventInfo":{"eventName":"Shipment Delay Notification","eventLabel":"delay","eventAction":"notify","eventCategory":"shipment"}}

GA4 Data Layer: |
  {"event":"notification","shipment_id":"12345","delay_reason":"Weather conditions","notification_type":"shipment_delay","expected_delivery_date":"2023-10-15"}


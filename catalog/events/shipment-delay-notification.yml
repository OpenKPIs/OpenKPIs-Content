Event Name: Shipment Delay Notification
Event Serialization: always

Description: |
  This event tracks notifications sent to customers when their shipment is delayed, capturing the impact on customer experience and operational efficiency.

Category: Quality

Tags: [event]

Industry: Logistics & Supply Chain

Priority: High

Core Area: Generic


Event Type: custom

Aggregation Window: Event


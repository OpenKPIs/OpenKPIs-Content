Event Name: Delivery Satisfaction Survey Submission
Aliases: [Delivery CSAT Survey Submission, Delivery Rating Submitted]

Event Serialization: One per accepted shipment survey invitation

Description: |
  Records the first accepted delivery satisfaction rating for a shipment survey invitation. The rating helps teams spot recurring dissatisfaction with deliveries.

Category: Satisfaction

Tags: [delivery satisfaction, post-delivery survey, customer feedback]

Industry: [E-commerce, Retail]

Business Criticality: Medium

Journey / Navigation Area: [Fulfillment, Post-Purchase]

Owning Function: Customer Experience

Scope: Event

Measurement Channels: [Backend / API, Web]

GA4 Collection Classification: Custom

Adobe XDM Classification: Custom XDM

Trigger Condition: WHEN the survey system atomically accepts the first valid rating for a shipment survey invitation with analytics consent, THEN emit delivery_satisfaction_survey_submission.


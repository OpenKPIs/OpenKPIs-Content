Parameters: |
  {
    "form_type": "string - Fixed value delivery_survey",
    "form_id": "string - Survey template identifier",
    "survey_id": "string - Unique survey response identifier; dedupe key",
    "order_id": "string - Order the delivery belongs to",
    "shipment_id": "string - Shipment rated; separates split shipments",
    "tracking_number": "string - Carrier tracking number of the shipment",
    "delivery_rating": "integer - Rating given, 1 to rating_scale_max",
    "rating_scale_max": "integer - Top of the rating scale, e.g. 5",
    "survey_channel": "string - Where the survey was answered: email, sms, tracking_page, app",
    "carrier": "string - Carrier that delivered the shipment",
    "shipping_tier": "string - Shipping method selected at checkout",
    "fulfillment_method": "string - ship_to_home, ship_to_store or local_delivery",
    "days_since_delivery": "integer - Days between delivery confirmation and survey submit",
    "has_comment": "boolean - True when a free-text comment was left",
    "issue_reason": "string - Selected issue option, e.g. late, damaged, wrong_location"
  }




Calculation Notes: |
  1️⃣ Atomically save the first valid rating, scale maximum, UTC submission time and a stable event ID per invitation.
  2️⃣ Enforce one acceptance per invitation. Later submissions and edits emit no event.
  3️⃣ Use one sender per destination. Retries reuse the opaque ID and original snapshot. Deduplicate by event ID.
  4️⃣ Use whole points from 1 to the scale maximum. Higher scores mean greater satisfaction.
  5️⃣ Report by committed submission time. Omit customer IDs, contact details, tracking numbers and free text.

Business Use Case: |
  1️⃣ Customer Experience teams compare ratings on matching scales to decide when to investigate recurring low scores.



  {"channel":"string - normalized digital channel that produced the event, such as web, mobile_web, ios, or android","currency":"string - uppercase ISO 4217 currency code applicable to every monetary attribute in the event","event_id":"string - globally unique identifier for the individual event emission, used for transport tracing and duplicate diagnostics","booking_id":"string - source-system identifier for the booking modified by the committed transaction","policy_type":"string - governed fare, rate, or booking-policy classification applied to the modification","loyalty_tier":"string - governed loyalty tier recognized at confirmation; null for non-members or unavailable status","new_end_date":"string - ISO 8601 local service end date immediately after the modification; null when not applicable","origin_after":"string - governed origin airport, station, port, or market code immediately after the modification","rail_changed":"boolean - indicates whether a rail component was changed by the committed transaction","self_service":"boolean - indicates whether the modification was completed without assisted-agent intervention","origin_before":"string - governed origin airport, station, port, or market code immediately before the modification","refund_amount":"number - non-negative amount refunded or due back to the customer as a result of the modification","booking_status":"string - normalized booking status immediately after the modification was committed","flight_changed":"boolean - indicates whether a flight component was changed by the committed transaction","loyalty_member":"boolean - indicates whether the booking was associated with a recognized loyalty member at confirmation","new_start_date":"string - ISO 8601 local service start date immediately after the modification","tax_difference":"number - signed change in taxes and statutory charges caused by the modification","waiver_applied":"boolean - indicates whether an eligible fee, penalty, or restriction was waived","event_timestamp":"string - ISO 8601 UTC timestamp when the booking platform confirmed that the modification was durably committed","modification_id":"string - globally unique identifier for the committed modification transaction and the authoritative event deduplication key","penalty_applied":"boolean - indicates whether a contractual change penalty was applied","rate_plan_after":"string - governed accommodation rate plan or commercial plan immediately after the modification","activity_changed":"boolean - indicates whether an activity or ancillary experience component was changed by the committed transaction","fare_class_after":"string - governed transport fare or cabin class immediately after the modification","modification_fee":"number - non-negative change, rebooking, administrative, or service fee assessed for the modification","rate_plan_before":"string - governed accommodation rate plan or commercial plan immediately before the modification","room_count_after":"integer - number of booked rooms immediately after the modification; null when accommodation is not applicable","value_difference":"number - signed change in total booking value, with positive values representing an increase and negative values representing a decrease","additional_amount":"number - non-negative incremental amount charged or due as a result of the modification, excluding any refund","destination_after":"string - governed destination airport, station, port, or market code immediately after the modification","fare_class_before":"string - governed transport fare or cabin class immediately before the modification","guest_count_after":"integer - number of travelers or guests attached to the booking immediately after the modification","modification_type":"string - governed classification of the modification, such as single_component or multi_component","new_booking_value":"number - total confirmed booking value immediately after the modification in the stated currency","original_end_date":"string - ISO 8601 local service end date immediately before the modification; null when not applicable","room_count_before":"integer - number of booked rooms immediately before the modification; null when accommodation is not applicable","car_rental_changed":"boolean - indicates whether a car-rental component was changed by the committed transaction","days_until_service":"integer - whole calendar days between modification confirmation and the earliest remaining service start date","destination_before":"string - governed destination airport, station, port, or market code immediately before the modification","guest_count_before":"integer - number of travelers or guests attached to the booking immediately before the modification","journey_step_count":"integer - number of governed digital journey steps completed from modification initiation through confirmation","affected_components":"array - governed list of component categories changed, such as flight, accommodation, rail, car_rental, or activity","confirmation_status":"string - normalized booking-platform outcome; the event qualifies only when the value is confirmed","original_start_date":"string - ISO 8601 local service start date immediately before the modification","booking_created_date":"string - ISO 8601 calendar date on which the original booking was created","accommodation_changed":"boolean - indicates whether an accommodation component was changed by the committed transaction","authentication_status":"string - normalized authentication state at confirmation, such as authenticated or anonymous","original_booking_value":"number - total confirmed booking value immediately before the modification in the stated currency","affected_component_count":"integer - number of distinct governed booking-component categories changed in the committed transaction"}

Calculation Notes: |
  1️⃣ Emit only after the booking platform returns durable confirmation that the modification has been committed to the booking record.
  2️⃣ Deduplicate by modification_id, retaining the latest confirmed event_timestamp and using event_id as the deterministic tie-breaker when timestamps are equal.
  3️⃣ Emit one event for an atomic modification transaction, including all affected components in that transaction rather than emitting one event per component.
  4️⃣ Exclude modification starts, searches, quote views, unsubmitted edits, abandoned journeys, failed submissions, and payment failures that prevent commitment.
  5️⃣ Exclude complete booking cancellations; a partial removal remains eligible only when the booking continues to exist and the transaction is classified as a modification.
  6️⃣ Report all monetary attributes in currency, use zero only when the concept is applicable with no monetary value, and use null when the concept is not applicable or unavailable.
  7️⃣ Calculate days_until_service from the confirmation date to the earliest remaining service start date using the service location's calendar.

Business Use Case: |
  Digital Product leadership can identify high-volume modification cohorts with low self-service completion or disproportionate fees, refunds, and repeat changes by component, policy, channel, and lead-time band. Teams can then simplify the relevant manage-booking journeys, improve policy presentation and payment handling, or prioritize self-service capabilities that reduce assisted-service demand while protecting booking value.



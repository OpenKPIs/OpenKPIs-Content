Event Name: Booking Modification
Event Serialization: once per modification_id

Description: |
  Measures each digitally initiated modification that is successfully committed to an existing booking, including the affected components, resulting booking state, commercial impact, policy treatment, and self-service context. The event excludes abandoned edits, unsuccessful submissions, payment failures that prevent commitment, and complete booking cancellations.


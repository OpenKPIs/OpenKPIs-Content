Parameters: |
  {
    "message_id": "string - Unique ID of the sent message instance; dedupe key with user_id",
    "message_channel": "string - push, in_app or email",
    "message_type": "string - promotional or lifecycle; transactional opens fire shipment-notification-open",
    "campaign_id": "string - CRM or ESP campaign / journey identifier",
    "message_name": "string - Human-readable message or campaign name",
    "message_time": "integer - Send time as Unix epoch seconds (Firebase message_time); web and email hits send the same epoch value",
    "platform": "string - ios, android, web or email_client",
    "machine_open": "boolean - true when the email open is a privacy-proxy prefetch",
    "user_id": "string - Hashed customer ID; never an email address or device token"
  }

Calculation Notes: |
  ["1️⃣ Fires on push or in-app tap (web push and in-app via gtag/GTM dataLayer) or ESP email open; never on receive, display, dismiss or send.","2️⃣ Serialization always: every open is a hit. Dedupe on message_id + user_id for unique opens; repeat opens of one message are not new openers.","3️⃣ Required: message_id, message_channel, message_type, campaign_id, message_time. Optional: message_name, platform, machine_open, user_id.","4️⃣ Email: ESP open webhook sent server-side via GA4 Measurement Protocol; Apple MPP prefetches get machine_open = true, excluded from rates.","5️⃣ Log only with push opt-in or email marketing consent on record; never send email address or device token, and pass user_id hashed.","6️⃣ App push: Firebase auto-collects message_id/name/time/channel, topic; never log manually. Join campaign_id, message_type, user_id from CRM log.","7️⃣ Value action by industry: E-commerce cart or back-in-stock push; Travel price-drop alert; SaaS feature-update email; Media new-episode push."]

Business Use Case: |
  ["1️⃣ CRM Manager: win-back push open rate stays below target → tests new copy and send time.","2️⃣ Lifecycle Marketing: human email opens fall for one loyalty tier → shifts that tier's sends to push.","3️⃣ App Product Manager: opens spike without a landing screen view after a release → fixes the broken deep link.","4️⃣ Retention team: customers with no opens in 90 days → move to a sunset flow to protect sender reputation."]


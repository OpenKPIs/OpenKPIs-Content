Parameters: |
  {
    "form_type": "string - Unified form classifier carried by the submit_form event; constant 'product_review' so review submissions are isolated from newsletter, contact, registration and lead forms.",
    "review_id": "string - Reviews platform identifier for the submission, used to deduplicate retries and to join the event to the later moderation outcome.",
    "item_id": "string - SKU or product identifier of the reviewed item, using the same identifier as view_item, add_to_cart and purchase so ratings join to the commerce funnel.",
    "item_name": "string - Merchandising display name of the reviewed item as shown at submission time.",
    "item_brand": "string - Brand or vendor of the reviewed item, used for brand-level and vendor-scorecard rating roll-ups.",
    "item_category": "string - Primary merchandising category of the reviewed item, taken from the same hierarchy used on the PDP.",
    "rating_value": "number - Star rating submitted, normalised to a 1-5 scale with one decimal place before aggregation.",
    "review_has_text": "boolean - True when the submission includes a written body in addition to the star rating.",
    "has_photo": "boolean - True when at least one image or video asset is attached to the submission.",
    "review_source": "string - Origin of the submission: post_purchase_email, post_purchase_sms, pdp, app or account_orders.",
    "days_since_purchase": "number - Whole days between the matched order date and the submission timestamp; null when no order match is found.",
    "verified_buyer_flag": "boolean - Order-matched attestation, true only when the reviewer identity resolves to a prior order line containing item_id.",
    "order_id": "string - Identifier of the matched order used to resolve verified_buyer_flag and days_since_purchase."
  }




Parameters: |
  {
    "form_type": "string - Unified form classifier carried by the submit_form event; constant 'product_review' so review submissions are isolated from newsletter, contact, registration and lead forms.",
    "form_name": "string - Display name of the review form the customer used (for example 'Write a Review'), used to separate PDP, app and order-history review entry points.",
    "form_submit_status": "string - Outcome returned by the reviews platform; only 'success' (widget success callback or HTTP 201) is counted as a submission.",
    "review_platform": "string - Ratings and reviews vendor that accepted the submission, for example bazaarvoice, yotpo or okendo.",
    "rating_scale_max": "number - Maximum value of the platform's rating scale (for example 5 or 10), sent with rating_value so the SQL can normalise ratings to 1-5.",
    "review_id": "string - Reviews platform identifier for the submission, used to deduplicate retries and to join the event to the later moderation outcome.",
    "item_id": "string - SKU or product identifier of the reviewed item, using the same identifier as view_item, add_to_cart and purchase so ratings join to the commerce funnel.",
    "item_name": "string - Merchandising display name of the reviewed item as shown at submission time.",
    "item_brand": "string - Brand or vendor of the reviewed item, used for brand-level and vendor-scorecard rating roll-ups.",
    "item_category": "string - Primary merchandising category of the reviewed item, taken from the same hierarchy used on the PDP.",
    "rating_value": "number - Raw rating submitted on the platform's own scale (see rating_scale_max); it is normalised to 1-5 in SQL, not in the data layer.",
    "review_has_text": "boolean - True when the submission includes a written body in addition to the star rating.",
    "has_photo": "boolean - True when at least one image or video asset is attached to the submission.",
    "review_source": "string - Origin of the submission: post_purchase_email, post_purchase_sms, pdp, app or account_orders.",
    "days_since_purchase": "number - Warehouse-derived field, not an event parameter (never sent by the client): whole days between the matched order date and the submission date in the reporting time zone; null when no order match is found.",
    "verified_buyer_flag": "boolean - Warehouse-derived field, not an event parameter (never sent by the client): true only when the submission matches an order line for item_id placed before the submission timestamp.",
    "order_id": "string - Order identifier captured client-side when the review is opened from the post-purchase email or SMS link or the order history screen; used as a join key when resolving verified_buyer_flag and days_since_purchase."
  }

Calculation Notes: |
  1️⃣ Instrumented as the unified submit_form event carrying form_type = 'product_review'; the ratings and reviews widget (Bazaarvoice, Yotpo, Okendo) fires its post-submit success callback into the site's own dataLayer / adobeDataLayer push, so this stays a first-party digital event and the full data-layer block remains in scope — it must never be modelled as an offline or backend-only feed.,2️⃣ Counted once per successful server acknowledgement (widget success callback or HTTP 201). Client-side validation failures, captcha rejections, saved drafts and abandoned review forms are excluded, and a retry that returns an already-seen review_id is deduplicated so double submissions do not inflate volume.,3️⃣ verified_buyer_flag is resolved in the warehouse, not in the browser: it is true only when the reviewer's customer identifier — or the tokenised recipient identifier carried by the post-purchase email or SMS link — joins to an order line containing the same item_id with an order date earlier than the submission timestamp. Any 'I bought this' checkbox on the form is ignored for this flag.,4️⃣ days_since_purchase is the whole-day difference between the matched order date and the submission date in the property's reporting time zone; when the customer has bought the same item more than once, the most recent order preceding the submission is the match. Submissions with no order match carry verified_buyer_flag = false and a null days_since_purchase and are reported separately as unverified reviews.,5️⃣ rating_value is normalised to a 1-5 scale before aggregation when the platform runs a 10-point or thumbs-up scale; zero, null and out-of-range ratings are dropped from any average-rating calculation but still count as submissions when review_has_text is true, so rating-free written contributions are not lost.,6️⃣ Sessionisation follows the standard 30-minute inactivity timeout. Because email and SMS solicitation land the customer in a new session, review submissions are routinely attributed to a campaign session rather than the purchase session — always report this event against item_id and order_id, not against the session's traffic source.,7️⃣ Excluded from all review reporting: syndicated reviews imported from manufacturers or marketplaces, seeded or incentivised sampling programmes flagged by the platform, internal employee and test accounts, and submissions later rejected by moderation. Moderation outcomes arrive late, so review counts and average ratings are restated for up to 7 days after the submission date.

Business Use Case: |
  1️⃣ The Category Manager in Merchandising reviews rating coverage every Monday; when a top-100 SKU is still below five verified-buyer reviews 30 days after launch, they add it to the priority list for the next post-purchase solicitation wave and request vendor sampling before the seasonal campaign goes live.,2️⃣ The Lifecycle Marketing Manager uses the days_since_purchase distribution by category to move the review request send date to the observed peak submission window, and suppresses the request entirely for orders carrying an open return, refund or delivery exception so solicitation does not amplify a bad experience.,3️⃣ The Voice of the Customer lead in Customer Service monitors verified-buyer submissions with rating_value of 1 or 2 daily; when a single item_id crosses five such ratings inside seven days, they open a product quality case with the vendor and trigger proactive outreach to the affected buyers before the rating drop reaches the PDP.,4️⃣ The E-commerce Product Manager A/B tests the PDP review module and the post-purchase flow, using submission rate split by review_source and the share of submissions with has_photo = true to decide rollout, then routes photo-bearing reviews into the PDP user-generated content gallery.


Event Name: Product Review Submission
Event Serialization: always

Description: |
  Fires when a customer submits a star rating or written review for an item they have already bought, covering both solicited submissions triggered by a post-purchase email or SMS request and unsolicited submissions written directly on the product detail page, in the app or from the order history screen. Every submission is resolved back to a prior order line, so verified_buyer_flag is an order-matched attestation produced by joining the reviewer identity to the order table and never a self-declared checkbox ticked on the review form.

Category: Retention

Tags: [event, E-commerce: Customer Retention, Loyalty & LTV]

Industry: E-commerce

Priority: Medium

Core Area: Engagement


Event Type: standard

Aggregation Window: Event, Daily, Weekly, Monthly

GA4 Event: |
  submit_form

Adobe Event: |
  Form Submit: Product Review


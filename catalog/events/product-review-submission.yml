Event Name: Product Review Submission
Event Serialization: always

Description: |
  Fires when the reviews platform acknowledges a product review submission (a star rating, a written review or both), covering both solicited submissions triggered by a post-purchase email or SMS request and unsolicited submissions written directly on the product detail page, in the app or from the order history screen. The event does not require a prior purchase: verified_buyer_flag is derived downstream in the warehouse by matching the submission to an earlier order line for the same item, never from a self-declared checkbox on the review form, and submissions with no order match are kept and reported as unverified reviews.

Category: Retention

Tags: [event, E-commerce: Customer Retention, Loyalty & LTV]

Industry: E-commerce

Priority: Medium

Core Area: Engagement


Event Type: standard


Event Name: Subscription Upgrade Completion
Event Serialization: always

Description: |
  Records each successful transition of an active subscription to a higher-value plan, tier, billing commitment, or licensed quantity when the upgraded entitlement becomes effective. It measures completed upgrades and captures the commercial, billing, customer, channel, and plan-transition context needed to analyze upgrade conversion and incremental recurring revenue.

Category: Conversion

Tags: [event]

Industry: E-commerce & SaaS

Priority: High

Core Area: Monetization


Event Type: custom

Aggregation Window: Event, Session, User, and Time based - Hourly/Daily/Monthly/Yearly


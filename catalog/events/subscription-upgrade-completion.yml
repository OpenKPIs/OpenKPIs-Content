ring - normalized commercial tier after the upgrade, such as Starter, Professional, Business, or Enterprise","source_system":"string - authoritative system that emitted the completion record, such as subscription_billing, commerce_order_service, or entitlement_service","payment_status":"string - normalized payment state at completion, such as paid, authorized, invoiced, credit_balance, or not_required","promotion_code":"string - promotion or coupon code applied to the upgrade; nullable when no promotion was used","quantity_delta":"number - signed change in licensed quantity resulting from the upgrade","sales_assisted":"boolean - indicates whether a sales representative materially participated in the completed upgrade","schema_version":"string - version identifier of the event payload contract used by the producer","transaction_id":"string - unique billing or payment transaction identifier; nullable when no payment transaction is required","discount_amount":"number - discount applied to the upgrade transaction as a non-negative monetary amount","event_timestamp":"string - UTC ISO 8601 timestamp when the upgraded subscription entitlement became effective","subscription_id":"string - unique identifier of the upgraded subscription","upgrade_channel":"string - channel through which the upgrade was completed, such as self_service_web, mobile_app, sales_assisted, partner, support, or admin","previous_plan_id":"string - unique identifier of the subscription plan effective immediately before the upgrade","proration_method":"string - normalized treatment of mid-cycle value, such as immediate_proration, next_invoice, full_charge, credit_and_rebill, or none","event_received_at":"string - UTC ISO 8601 timestamp when the analytics collection service received the event","previous_quantity":"number - licensed seat, unit, usage-pack, or entitlement quantity immediately before the upgrade","experiment_variant":"string - assigned experiment treatment or control variant; nullable when experiment_id is absent","previous_plan_name":"string - business-readable name of the subscription plan effective immediately before the upgrade","previous_plan_tier":"string - normalized commercial tier before the upgrade, such as Free, Starter, Professional, or Enterprise","upgrade_request_id":"string - unique identifier linking the initiation, checkout, billing, and completion stages of the same logical upgrade","current_term_end_at":"string - UTC ISO 8601 timestamp marking the end of the subscription term containing the completed upgrade","payment_method_type":"string - normalized payment method category, such as card, bank_debit, digital_wallet, invoice, account_credit, or none","upgrade_entry_point":"string - product or commercial surface that initiated the upgrade flow, such as pricing_page, usage_limit, billing_settings, in_app_prompt, renewal, or sales_quote","billing_effective_at":"string - UTC ISO 8601 timestamp when the upgraded pricing and billing terms took effect","new_recurring_amount":"number - recurring subscription amount for the upgraded configuration, normalized to the same cadence as previous_recurring_amount and excluding tax","credit_applied_amount":"number - existing account credit or unused-service credit applied to the upgrade transaction","current_term_start_at":"string - UTC ISO 8601 timestamp marking the start of the subscription term containing the completed upgrade","upgrade_charge_amount":"number - gross prorated or immediate charge generated by the upgrade before discounts, credits, and tax","billing_interval_after":"string - billing cadence effective after the upgrade, such as monthly, quarterly, annual, or multi_year","recurring_amount_delta":"number - signed incremental recurring amount attributable to the completed upgrade in the event currency","billing_interval_before":"string - billing cadence before the upgrade, such as monthly, quarterly, annual, or multi_year","previous_recurring_amount":"number - recurring subscription amount for the prior configuration, normalized to the organization's approved reporting cadence and excluding tax"}

Calculation Notes: |
  Emit the event only after the new plan, tier, billing interval, or licensed quantity is committed in the authoritative subscription system and the corresponding entitlement is effective. Scheduled upgrades must be recorded at their effective timestamp rather than their request timestamp; upgrade requests that are pending, declined, abandoned, canceled, or rolled back before activation must not emit this event. A completed no-charge upgrade is valid when payment_status is not_required, credit_balance, or invoiced according to approved billing policy. Raw collection accepts every activation, but canonical reporting must deduplicate exact retries by event_id and suppress repeated completion messages for the same upgrade_request_id, subscription_id, and effective configuration unless they represent separate committed amendments. recurring_amount_delta must use the same normalization cadence and currency basis as the previous and new recurring amounts; tax, one-time implementation fees, and unrelated purchases must not be included. Plan changes with no positive commercial or entitlement uplift must be classified as migrations or lateral plan changes rather than upgrades, while reductions must be captured as subscription downgrades. Later refunds, chargebacks, cancellations, or downgrades do not remove the historical completion event and must be represented by their respective lifecycle events. Test accounts, internal employee subscriptions, synthetic monitoring traffic, and billing sandbox transactions must be excluded from production KPI reporting. Use event_timestamp for business-effective reporting, event_received_at for pipeline-latency monitoring, UTC for storage, and the approved reporting timezone for calendar aggregation. When user_id or session_id is unavailable for a sales-assisted or system-initiated upgrade, account_id and subscription_id remain mandatory.

Business Use Case: |
  The Chief Product Officer and Revenue Management team review upgrade completion rate and incremental recurring revenue by previous plan, new plan, entry point, channel, and experiment variant. If accounts reaching usage limits complete self-service upgrades at a lower rate than sales-assisted accounts, the team can simplify the upgrade checkout, adjust in-product messaging, test pricing or proration treatments, and route high-value accounts to sales before measuring the resulting change in completed upgrades and revenue uplift.



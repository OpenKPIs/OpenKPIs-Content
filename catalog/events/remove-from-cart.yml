Calculation Notes: |
  1️⃣ Record confirmed changes at confirmation time; exclude failed requests, re-renders, and inactivity.
  2️⃣ One event represents one removal action; retries across delivery paths reuse the same event_id.
  3️⃣ Quantities are positive integers removed from each line, not quantities remaining.
  4️⃣ A clear-cart action includes every removed line in one event; item arrays are repeatable.
  5️⃣ Reports use confirmation time with an inclusive start and exclusive end, applied before deduplication.

Business Use Case: |
  1️⃣ Merchandising teams investigate products with rising removals before revising product information.
  2️⃣ Product teams compare removal patterns before changing cart design.



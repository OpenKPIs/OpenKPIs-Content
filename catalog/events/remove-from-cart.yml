Event Name: Remove from Cart
Event Serialization: always

Description: |
  Captures every confirmed removal of one or more product units from the cart, aligned to GA4 remove_from_cart and Adobe scRemove. Source event for Cart Removals and cart-edit analysis.

Category: Conversion

Tags: [event, E-commerce: Cart & Checkout Funnel Analytics]

Industry: E-commerce

Priority: Medium

Core Area: Checkout


Event Type: standard

Aggregation Window: Event, Session, Daily, Weekly

GA4 Event: |
  remove_from_cart

Adobe Event: |
  scRemove


Parameters: |
  {
    "items": "array - removed products with item_id, item_name, item_category, price and quantity (removed units only)",
    "currency": "string - ISO 4217 code, matching the add_to_cart currency",
    "value": "number - sum of price × removed quantity across items",
    "cart_id": "string - opaque cart identifier shared with add_to_cart and begin_checkout",
    "remove_method": "string - how the removal happened: remove_button, quantity_decrease, clear_cart, system",
    "page_type": "string - page where the removal happened, e.g. cart, mini_cart, checkout",
    "event_id": "string - unique id per confirmed removal, used for deduplication"
  }



Dependencies:
  Events: [add-to-cart]


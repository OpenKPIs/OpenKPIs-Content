Calculation Notes: |
  1️⃣ Record only confirmed changes; failed requests and cart re-renders emit nothing.
  2️⃣ Count each removal action once across delivery paths; retries reuse event_id.
  3️⃣ Report positive integer quantities removed, not quantities remaining.
  4️⃣ A clear-cart action includes every removed line in one event.
  5️⃣ Use the confirmed change time; inactivity alone is not a removal.

Business Use Case: |
  1️⃣ Merchandising teams investigate products with rising removals before revising product information.
  2️⃣ Product teams compare removal patterns before changing cart design.



Event Name: Remove from Cart
Aliases: [Cart Removal, Remove from Bag, Remove from Basket]

Event Serialization: Fire once per confirmed removal; deduplicate by event_id. Reuse on retry; new ID for each new action.

Description: |
  Records a confirmed removal of one or more product units from a shopping cart. It helps teams understand changes to cart contents and investigate removal patterns.

Category: Engagement

Tags: [cart, cart removal, shopping behavior]

Industry: [E-commerce, Retail]

Business Criticality: Medium

Journey / Navigation Area: [Cart]

Owning Function: Product Management

Scope: Event

Measurement Channels: [Backend / API, Mobile App, Web]

GA4 Event Type: Recommended

Adobe Event Type: Standard XDM

Trigger Condition: WHEN a cart change confirms removal of one or more product units, THEN emit remove_from_cart.

GA4 Event: |
  remove_from_cart

Adobe Event: |
  commerce.productListRemovals


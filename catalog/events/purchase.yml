Parameters: |
  {
    "transaction_id": "string - Required. The commerce platform's own order ID for the accepted order (ORD12345), read from the confirmation payload and never generated in the browser. This is the serialization and dedupe key: it must be byte-identical to the order id used by order management, finance and the later refund event, so every purchase row joins one-to-one to a booked order and repeat fires from refresh, back-navigation or a bookmarked confirmation URL collapse to a single transaction.",
    "value": "number - Required. Total monetary value of the order in the currency given by currency, under one documented revenue convention applied identically across web, app and server-side collection. Convention used here: sum over items of (price - discount) x quantity, plus tax and shipping (99.98 - 10.00 + 7.42 + 5.99 = 103.39). Two decimals, no currency symbol, no thousands separator, never a string.",
    "currency": "string - Required whenever value is set. ISO 4217 three-letter alphabetic code in upper case (USD, EUR, GBP, JPY) for the currency the customer was actually charged, not the reporting currency. GA4 discards or mis-converts the revenue when this is missing, lower-case, a symbol or a three-digit numeric code.",
    "tax": "number - Optional; populate wherever checkout captures it. Total tax charged on the order, in the currency given by currency. Include it in value only when the documented revenue convention is gross of tax, and apply that choice to every collection path.",
    "shipping": "number - Optional; populate wherever checkout captures it. Total shipping and handling charged on the order, net of any shipping promotion (0 for free shipping), in the currency given by currency. Included in value under the convention used here.",
    "coupon": "string - Optional. Order-level promotion or voucher code applied at checkout, normalised to the case the promotions engine stores (SUMMER10). Omit the key entirely rather than sending an empty string when no coupon was used; line-level codes belong on items[].coupon.",
    "affiliation": "string - Optional. Store, marketplace or selling channel that booked the order, from one controlled vocabulary shared with the Revenue Channel dimension: Online Store, Amazon Marketplace, eBay, Store 142 Endless Aisle, Call Center Assisted.",
    "payment_type": "string - Optional. Payment method category selected at checkout, from a controlled list: credit_card, debit_card, paypal, apple_pay, google_pay, gift_card, bnpl, bank_transfer, cash_on_delivery. Category only; never a card number, last four digits, token or any other payment credential.",
    "shipping_tier": "string - Optional. Delivery option the customer chose, using the same values sent on add_shipping_info so the two events reconcile: Ground, Two-Day, Overnight, Store Pickup, Curbside, Ship from Store.",
    "items": "array - Required. Array of item-level objects, one object per order line, whose fields are documented below as items[].*. Every purchased line must be present and the lines must reconcile to value under the same revenue convention; unreconciled arrays silently corrupt product-level revenue, margin and attribution. GA4 accepts at most 200 items per event: when a basket exceeds that, send the highest-revenue lines and keep the order-level totals correct.",
    "items[].item_id": "string - Required on every item (item_id or item_name must be present; send both). Product SKU or catalogue identifier at the same grain as inventory and merchandising, identical to the id sent on view_item and add_to_cart so the funnel joins at product level.",
    "items[].item_name": "string - Required on every item (item_id or item_name must be present; send both). Human-readable product title as merchandised, without price, promotion or availability text appended.",
    "items[].item_brand": "string - Optional. Brand or manufacturer of the product, from the product catalogue rather than free text.",
    "items[].item_category": "string - Optional. Primary (top-level) merchandising category for the product, e.g. Apparel. Deeper levels go in item_category2 through item_category5, top-down; never concatenate the hierarchy into one string.",
    "items[].item_category2": "string - Optional. Second level of the merchandising hierarchy beneath item_category, e.g. Tops. Same rule applies to item_category3, item_category4 and item_category5 where the taxonomy is deeper.",
    "items[].item_variant": "string - Optional. Variant of the product actually purchased, such as size, colour or configuration (Blue / M), matching the variant sent on add_to_cart.",
    "items[].price": "number - Optional but expected. Unit price of one item before any item discount is applied, in the currency given by currency; item revenue is computed as (price - discount) x quantity.",
    "items[].quantity": "integer - Optional but expected. Whole number of units of this item in the order; must be 1 or greater, and the sum across items must equal the units on the booked order.",
    "items[].discount": "number - Optional. Per-unit monetary discount applied to this item (5 here means 5 off each of the 2 units, 10 off the line), in the currency given by currency; order-level promotions must be allocated to the lines they reduce so the items reconcile to value.",
    "items[].coupon": "string - Optional. Promotion or voucher code that applied to this specific line; repeat the order-level coupon here only when it genuinely discounted the line.",
    "items[].affiliation": "string - Optional. Selling entity for this line when an order can span sellers (marketplace, third-party fulfiller, ship-from-store location); defaults to the order-level affiliation.",
    "items[].index": "integer - Optional. One-based position of the item in the line-item list, used to preserve line order between the confirmation payload and the analytics event.",
    "items[].item_list_id": "string - Optional. Identifier of the list the item was originally selected from (search_results, category_apparel, recommended_for_you), carried through from view_item_list so merchandising can attribute revenue to discovery surfaces.",
    "items[].item_list_name": "string - Optional. Display name of that list (Search Results), paired one-to-one with items[].item_list_id.",
    "items[].location_id": "string - Optional. Google Place ID (or the internal store id mapped to it) of the physical location fulfilling the line, used for ship-from-store and buy-online-pick-up-in-store reporting.",
    "event_id": "string - Optional but strongly recommended. Unique identifier for this specific occurrence of the purchase event, stable across the browser and the server-side copy of the same order, so the warehouse and the conversions API collapse both copies to one row. Generated once with the order confirmation, not per page render; transaction_id dedupes orders, event_id dedupes transmissions.",
    "user_id": "string - Optional; send only with consent. Pseudonymous, non-reversible customer identifier from the identity service, identical to the id used in CRM joins and lifetime-value reporting. Never an email address, phone number or any other direct identifier; hashed identifiers travel only through the dedicated user-provided-data channel.",
    "session_id": "string - Optional. Analytics session identifier (GA4 ga_session_id, the Adobe visit id), collected automatically by the tag and not pushed by hand; document it here because session-grain reporting such as revenue per session joins purchases on it."
  }

Calculation Notes: |
  1️⃣ Fire once per completed order using stable transaction_id or order_id for deduplication.  
  2️⃣ Prefer server-confirmed order success over client-only payment completion.  
  3️⃣ Exclude failed, pending, canceled, test, fraud, and duplicate orders unless reporting gross order attempts.  
  4️⃣ Value parameter should represent order revenue per organization’s reporting standard; document chosen convention.  
  5️⃣ Currency must use ISO 4217 codes.  
  6️⃣ Item-level arrays should reconcile to the order-level value where possible.  
  7️⃣ Use event_id and transaction_id for deduplication across all implementations.

Business Use Case: |
  Used by marketing, ecommerce, product, finance, and executive teams to measure revenue, conversion performance, campaign return, merchandising effectiveness, checkout funnel completion, customer acquisition quality, and customer lifetime value inputs. It supports revenue attribution, ROAS analysis, A/B test evaluation, product performance reporting, retention segmentation, and forecasting.


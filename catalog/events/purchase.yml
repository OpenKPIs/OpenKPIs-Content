Event Name: purchase
Event Serialization: always

Description: |
  Records a completed, payment-confirmed order together with its monetary value, currency and full line-item detail, making it the terminal conversion event of the e-commerce funnel and the transactional grain on which revenue, attribution and merchandising reporting are built. It fires only once the order has been accepted by the commerce platform — never at checkout start, at payment submission or on a declined authorization — so purchase counts equal orders booked rather than purchase attempts.

Category: Conversion

Tags: [event, E-commerce: Cart & Checkout Funnel Analytics, purchase, transaction, order, conversion]

Industry: Retail

Priority: High

Core Area: Checkout

Scope: Event

Event Type: standard

Aggregation Window: Event, Session, User, Daily, Weekly, Monthly


Calculation Notes: |
  1️⃣ Count each order once; transaction IDs must be unique across collection; retries reuse transaction and event IDs.
  2️⃣ Use purchase completion time, not page-render or ingestion time.
  3️⃣ Merchandise value sums discounted unit price × quantity across all lines; exclude tax and shipping.
  4️⃣ Exclude test orders and incomplete payment attempts; include valid completed zero-value orders.
  5️⃣ Record refunds and cancellations separately; retain the original purchase.

Business Use Case: |
  1️⃣ E-commerce Operations compares captured purchases with commerce confirmations to investigate missing orders.
  2️⃣ Merchandising compares purchased items before changing product placement or promotions.
  3️⃣ Finance reconciles merchandise totals with commerce records before using them in sales reporting.



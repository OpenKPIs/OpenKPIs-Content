Event Name: Purchase
Aliases: [Completed Purchase, Order Completed, Order Confirmation]

Event Serialization: Emit once after authoritative purchase confirmation; deduplicate by transaction_id.

Description: |
  Records an accepted order whose payment requirement has been satisfied, including its purchased items and merchandise value. It supports analysis of completed purchases and product sales.

Category: Conversion

Tags: [purchase, order confirmation, checkout, commerce]

Industry: [Retail, E-commerce]

Business Criticality: High

Journey / Navigation Area: [Purchase]

Owning Function: E-commerce Operations

Scope: Event

Measurement Channels: [Backend / API, Mobile App, Web]

GA4 Event Type: Recommended

Adobe Event Type: Standard XDM

Trigger Condition: WHEN the commerce platform accepts an order and its payment requirement is satisfied, THEN emit purchase.

GA4 Event: |
  purchase

Adobe Event: |

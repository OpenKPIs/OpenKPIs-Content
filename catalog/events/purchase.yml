Calculation Notes: |
  1️⃣ Record one purchase per confirmed order; retries reuse the same transaction and event identifiers.
  2️⃣ Use the purchase completion time, not page-render or ingestion time.
  3️⃣ Merchandise value sums discounted unit price × quantity across all lines, excluding tax and shipping.
  4️⃣ Exclude test orders and incomplete payment attempts; valid completed zero-value orders remain eligible.
  5️⃣ Record refunds and cancellations separately; do not rewrite the original purchase.

Business Use Case: |
  1️⃣ E-commerce Operations investigates missing purchases by comparing captured orders with commerce confirmations.
  2️⃣ Merchandising compares purchased items before changing product placement or promotions.
  3️⃣ Finance reconciles merchandise totals with commerce records before using them in sales reporting.



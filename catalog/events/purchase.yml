Parameters: |
  transaction_id: unique order or transaction identifier; value: monetary order value; currency: ISO 4217 currency code; tax: tax amount; shipping: shipping amount; coupon: order-level coupon code; affiliation: store, marketplace, or sales channel; payment_type: payment method category; shipping_tier: selected shipping method; items: array of purchased products; item_id: product SKU or identifier; item_name: product name; item_brand: product brand; item_category: primary product category; item_category2: secondary category; item_variant: variant such as size or color; price: unit price; quantity: units purchased; discount: item-level discount; event_id: unique event identifier for deduplication; user_id: authenticated user identifier if consented and allowed; session_id: analytics session identifier

Calculation Notes: |
  Fire exactly once per completed order using a stable transaction_id or order_id for deduplication. Prefer server-confirmed order success over client-only payment completion. Exclude failed, pending, canceled, test, fraud, and duplicate orders unless explicitly reporting gross order attempts. The value parameter should represent order revenue according to the organization’s reporting standard, commonly excluding tax and shipping for merchandise revenue or including them for gross transaction value; document the chosen convention. Currency must be populated using ISO 4217 codes. Item-level arrays should reconcile to the order-level value where possible. Use event_id and transaction_id to deduplicate across web, app, server-side, and tag manager implementations.

Business Use Case: |
  Used by marketing, ecommerce, product, finance, and executive teams to measure revenue, conversion performance, campaign return, merchandising effectiveness, checkout funnel completion, customer acquisition quality, and customer lifetime value inputs. It supports revenue attribution, ROAS analysis, A/B test evaluation, product performance reporting, retention segmentation, and forecasting.


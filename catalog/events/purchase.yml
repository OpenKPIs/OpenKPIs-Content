Event Name: purchase
Event Serialization: JSON event payload with a unique event_id, timestamp, event name, transaction object, and item array. Recommended serialization: one order-level purchase event containing all purchased items, plus optional downstream item-level exploded records in the warehouse. Deduplicate by transaction_id and event_id, and preserve original event timestamp and ingestion timestamp.

Description: |
  Represents a completed transaction or order. This event fires once after payment or order confirmation is successfully completed, typically on the order confirmation page or immediately after the backend confirms the order was accepted. It should not fire on checkout start, payment attempt, or failed payment.

Category: Revenue

Tags: [purchase, transaction, order, conversion, revenue, ecommerce, checkout]

Industry: ["Retail","E-commerce","SaaS","Media","Technology","Other"]

Priority: High

Core Area: Digital Analytics

Scope: Event

Event Type: standard

Aggregation Window: Event, Session, User


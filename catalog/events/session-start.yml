Parameters: |
  {
    "ga_session_id": "integer - session identifier assigned when the session opens; combined with the device identifier it forms the unique session key",
    "ga_session_number": "integer - ordinal of this session for the user on this stream; a value of 1 marks the user's first session",
    "session_engaged": "string - set to '1' once the session reaches the engagement threshold (10 seconds, two page views or a conversion); the basis of Engaged Sessions and Bounce Rate",
    "engagement_time_msec": "integer - milliseconds of foreground engagement attributed to the event",
    "page_location": "string - full URL of the entry page including query string; source of the Landing Page dimension",
    "page_referrer": "string - URL of the previous site, used for referral and organic classification",
    "page_title": "string - document title of the entry page, used for readable landing page reporting",
    "source": "string - utm_source, or the parsed referrer host when no campaign tagging is present",
    "medium": "string - utm_medium, or the inferred medium (organic, referral, none) for the visit",
    "campaign": "string - utm_campaign value carried on the entry URL",
    "term": "string - utm_term keyword for paid search entries; optional",
    "content": "string - utm_content creative or placement identifier; optional",
    "gclid": "string - Google Ads click identifier used for auto-tagged paid entries; optional",
    "language": "string - browser or device language of the entry, used for locale-level acquisition splits"
  }




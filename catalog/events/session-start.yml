Calculation Notes: |
  ["1️⃣ The event is emitted by the measurement library itself on the first event of a new visit — it is never pushed by hand. Adding a manual session_start push to the data layer double-counts sessions and corrupts every channel, campaign and landing-page report that uses the session as its unit.","2️⃣ Serialization is once per session per user and stream: a session closes after 30 minutes without a qualifying event (timeout configurable from 5 minutes to 7 hours 55 minutes at property level) and the next event opens a new one. Sessions no longer reset at midnight or on a mid-visit campaign change, so counts are not comparable with legacy Universal Analytics visit figures — restate historical benchmarks before using them as targets.","3️⃣ Web and app streams use the same timeout but different triggers: on app streams a session also reopens when the app returns to the foreground after the timeout has lapsed. Align the timeout across streams before blending web and app acquisition reporting, otherwise the same customer journey yields a different session count per platform.","4️⃣ Session-scoped acquisition dimensions are stamped from the traffic context carried on this event (referrer, utm parameters, click identifiers). Self-referrals from payment or authentication domains and UTM-tagged internal links are the two usual causes of inflated direct and referral sessions: maintain the unwanted-referrals / referral exclusion list for checkout, payment and SSO hosts, and never tag internal links.","5️⃣ Consent and privacy: with analytics storage denied under Consent Mode the event is still transmitted as a cookieless signal that feeds modelled sessions but carries no cookie-based continuity, so consented and modelled sessions must not be mixed in the same trend without a note. The payload carries no personal data — email, phone, hashed identifiers and order numbers must never be appended as parameters.","6️⃣ Required context is added automatically (session identifier, session ordinal, engagement flag and the collected traffic source); page location and page referrer are the parameters that must be verified, because they are the source of the Landing Page dimension and of organic versus referral classification. Confirm the tag sequence places this event ahead of the first page_view of the visit.","7️⃣ Recurring instrumentation faults to test for before publishing acquisition numbers: the configuration tag re-firing on every route change in a single-page application (session inflation), two configurations loading for the same stream (duplicate sessions), and unfiltered internal, preview and crawler traffic. Note also that first_visit fires alongside this event for a brand-new user, so session starts must never be read as new users."]

Business Use Case: |
  ["1️⃣ The Performance Marketing team, in the weekly channel review, reads sessions by default channel grouping and campaign from this event against spend, and reallocates budget away from campaigns whose session volume grows while session-to-order conversion falls.","2️⃣ The Merchandising and Site Content team, in the first 72 hours after a campaign or promotion launch, compares sessions and bounce rate by landing page and device to spot entry pages that receive paid traffic but lose it immediately, and reworks or redirects those pages.","3️⃣ The Digital Product Manager, at every front-end release, checks sessions per user and sessions per day for the affected templates to confirm the configuration tag is not re-firing on route change, and blocks the rollout when session inflation is detected.","4️⃣ The Lifecycle Marketing team, each month, builds audiences of sessions that started from email or push with no purchase in the visit and feeds them into re-engagement and abandonment journeys."]


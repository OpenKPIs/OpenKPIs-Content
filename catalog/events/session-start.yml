# Event: Session Start
# Generated: 2026-09-20T20:33:34.542Z
# Contributed by: devyendarm


Event Name: Session Start
Event Serialization: once per session

Description: |
  Session Start is the automatically collected event that opens a visit, firing on the first interaction a user has with the site or app after the inactivity timeout has elapsed. Every session-scoped acquisition report is counted from it — channel grouping, source/medium, campaign and landing page for the visit are resolved from the traffic context present on this event, and all downstream browsing, cart and purchase activity is attributed to the session it creates.

Category: Acquisition



















    
    
    
    
    
    
    
    
    

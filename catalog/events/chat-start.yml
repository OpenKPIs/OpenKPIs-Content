Event Name: Chat Start
Event Serialization: always

Description: |
  Chat Start records the moment a shopper opens a support conversation with a live agent or a chatbot (Zendesk, Gorgias, Intercom, LivePerson) and sends the first message, captured as the unified chat_start event with contact_method = chat. It is the volume numerator for chat contact rate, bot containment and pre-purchase assisted-conversion analysis, and lets Customer Service tie support demand to the page, order stage and journey step that generated it.

Category: Experience

Tags: [event, E-commerce: Returns, Refunds & Customer Support]

Industry: E-commerce

Priority: High

Core Area: Engagement


Event Type: standard

Aggregation Window: Event, Session, Hourly, Daily, Weekly


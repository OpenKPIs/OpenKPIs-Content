Parameters: |
  {
    "contact_method": "string - Contact channel; fixed value 'chat' for this event",
    "chat_type": "string - Who handles the conversation at start: 'live_agent' or 'bot'",
    "page_type": "string - Page template where the chat was opened, e.g. product, cart, checkout, order_status, returns, help_center",
    "conversation_id": "string - Vendor conversation or ticket identifier used for deduplication and helpdesk stitching",
    "chat_vendor": "string - Platform hosting the conversation, e.g. zendesk, gorgias, intercom, liveperson",
    "contact_reason": "string - Pre-chat form or bot intent selection, e.g. order_status, returns, refund, product_question, payment; 'unspecified' when not captured",
    "entry_point": "string - How the chat was opened: launcher, proactive_invite, help_center_link, order_email_link",
    "order_id": "string - Order reference when the chat is opened from an order context; omitted otherwise"
  }




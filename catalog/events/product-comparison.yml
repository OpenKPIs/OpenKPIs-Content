Parameters: |
  {
    "compare_action": "string - add, remove or view; which compare-tray action fired the event",
    "items": "array - products affected: item_id, item_name, item_brand, item_category, item_variant, price; all tray items on view",
    "compare_count": "integer - number of products in the comparison tray after the action",
    "item_list_id": "string - optional; id of the list the product was added from, e.g. category_shoes",
    "item_list_name": "string - optional; name of the list the product was added from, e.g. Running Shoes",
    "page_type": "string - optional; page where the action happened: plp, pdp, search or compare",
    "currency": "string - optional; ISO 4217 code for item prices, required if value is sent",
    "value": "number - optional; sum of price across items in the hit"
  }




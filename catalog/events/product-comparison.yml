Event Name: Product Comparison
Event Serialization: always

Description: |
  Custom compare_items event, fired when a shopper adds a product to, removes it from, or opens the side-by-side comparison tool. Carries the compared items[] and compare_count so tray use can be tied to purchase.

Category: Engagement

Tags: [event, E-commerce: Product Discovery & Merchandising (Search/Filters/PDP)]

Industry: E-commerce

Priority: Medium

Core Area: Discovery


Event Type: custom

Aggregation Window: Event, Session, Daily, Weekly


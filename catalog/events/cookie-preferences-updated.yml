Parameters: |
  consent_action=accept_all|reject_all|save_preferences|update_preferences|dismiss; consent_source=banner|preference_center|footer_link|account_settings|cmp_api; consent_version=version of consent notice or CMP configuration; consent_id=anonymous CMP consent transaction ID; previous_consent_state=prior summarized consent state; updated_consent_state=new summarized consent state; essential_cookies=true|false; analytics_cookies=true|false; marketing_cookies=true|false; personalization_cookies=true|false; functional_cookies=true|false; advertising_cookies=true|false; region=visitor consent jurisdiction such as US, CA, EU, UK; regulation=GDPR|CCPA|CPRA|LGPD|PIPEDA|other; cmp_provider=name of consent management platform; page_location=current page URL without query-string PII; page_referrer=referring page URL without query-string PII; language=site language; logged_in_status=true|false without user identifier; timestamp_utc=ISO-8601 event timestamp

Calculation Notes: |
  Trigger only after the visitor explicitly saves or confirms a consent choice, not on every page load where consent state is read. Fire once per confirmed action and include both previous and updated state when available. Essential cookies should normally remain true and should not be interpreted as marketing consent. Respect consent mode sequencing: update the CMP or consent API first, then fire this event only if the resulting consent state permits the relevant analytics collection, or send through a consent-exempt compliance endpoint if required by legal policy. Do not include names, email addresses, account numbers, IP addresses, or raw user identifiers. Strip query strings from URLs when they may contain sensitive financial account or campaign data. Ensure this event is available for audit even when analytics cookies are rejected, using approved server-side or CMP logs if the analytics platform cannot receive the hit.

Business Use Case: |
  Used by privacy, compliance, marketing operations, and analytics teams to measure consent opt-in and opt-out behavior, diagnose drops in measurable traffic, validate CMP implementation across jurisdictions, and estimate the impact of consent choices on attribution, personalization, remarketing, and investment product journey reporting.

Dependencies: |
  Consent Management Platform configuration; Cookie category taxonomy; Privacy notice version; Jurisdiction or region detection; Tag manager consent mode rules; Page URL and page metadata; Anonymous consent transaction ID


Parameters: |
  {
    "form_id": "string - Stable identifier of the consent form, always cookie_consent for the consent banner and preference center; together with form_type = consent it identifies consent decisions within submit_form",
    "form_name": "string - Readable form name, Cookie Preferences",
    "form_type": "string - Form classification, consent for every cookie consent decision, used to separate consent submissions from lead, contact and account forms",
    "consent_action": "string - Decision committed in the CMP UI: accept_all | reject_all | save_preferences | withdraw; banner close without a choice does not fire the event",
    "consent_source": "string - Surface where the decision was made: banner | preference_center | footer_link | account_settings",
    "is_first_choice": "boolean - true when no stored consent existed for this consent_id and consent_version (first decision); false for a change to an existing choice",
    "consent_changed": "boolean - true when the granted category set differs from previous_consent_categories; false for a re-save of an identical state",
    "ad_storage": "string - Google Consent Mode v2 state after the update: granted | denied",
    "analytics_storage": "string - Google Consent Mode v2 state after the update: granted | denied",
    "ad_user_data": "string - Google Consent Mode v2 state after the update: granted | denied (consent to send user data to Google for advertising)",
    "ad_personalization": "string - Google Consent Mode v2 state after the update: granted | denied (consent to remarketing and personalised advertising)",
    "consent_categories_granted": "string - Pipe-delimited CMP category ids granted after the update, e.g. OneTrust C0001|C0002|C0004 or necessary|analytics|marketing",
    "previous_consent_categories": "string - Pipe-delimited CMP category ids granted before the update; empty on a first decision",
    "gpc_signal": "boolean - true when the browser sent a Global Privacy Control signal honoured as an opt-out of sale or sharing",
    "tcf_policy_version": "number - IAB TCF policy version of the TC String when the TCF framework applies (e.g. 5 for TCF v2.2); the full TC String stays in the CMP log because it exceeds the GA4 100-character parameter limit",
    "consent_region": "string - ISO 3166-1 alpha-2 country or ISO 3166-2 subdivision resolved by the CMP geolocation rule, e.g. DE, GB, US-CA",
    "regulation": "string - Legal regime of the banner template shown: gdpr | uk_gdpr | ccpa_cpra | lgpd | pipeda | none",
    "consent_version": "string - Version of the cookie notice and CMP configuration the decision was made against",
    "cmp_provider": "string - Consent management platform that recorded the decision, e.g. onetrust | cookiebot | didomi | usercentrics",
    "consent_id": "string - Pseudonymous CMP consent receipt id used to join to the CMP consent log; never an email, customer number or CRM id",
    "page_location": "string - URL of the page where the decision was made, with query-string identifiers redacted"
  }

Calculation Notes: |
  1️⃣ Trigger only after explicit consent confirmation.  
  2️⃣ Fire event once per confirmed action.  
  3️⃣ Include both previous and updated consent states.  
  4️⃣ Essential cookies should remain true, not treated as marketing consent.  
  5️⃣ Update CMP or consent API before firing the event.  
  6️⃣ Avoid including sensitive user information.  
  7️⃣ Ensure event availability for audit even with rejected analytics cookies.

Business Use Case: |
  Used by privacy, compliance, marketing operations, and analytics teams to measure consent opt-in and opt-out behavior, diagnose drops in measurable traffic, validate CMP implementation across jurisdictions, and estimate the impact of consent choices on attribution, personalization, remarketing, and investment product journey reporting.


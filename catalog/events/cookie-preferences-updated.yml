Event Name: cookie_preferences_updated
Event Serialization: One event per explicit consent preference submission, serialized by consent_id and timestamp_utc. Deduplicate events with the same consent_id, consent_action, updated_consent_state, and timestamp within a 5-second window.

Description: |
  Fires when a visitor saves, updates, or confirms cookie consent preferences through the consent management platform or cookie preference center. This includes accepting all cookies, rejecting non-essential cookies, saving granular category choices, or changing a prior consent state.

Category: Quality

Tags: [cookie consent, privacy, consent management, cmp, compliance, measurement governance, financial services]

Industry: ["Finance","Technology"]

Priority: High

Core Area: Digital Analytics

Scope: User

Event Type: custom

Aggregation Window: Event, Session, User


Event Name: Cookie Preferences Updated
Event Serialization: always

Description: |
  Fires when a visitor commits a cookie consent decision in the consent management platform (CMP): accept all, reject all, a granular category selection, or a later change or withdrawal of an earlier choice. Each hit carries the resulting Google Consent Mode v2 states and CMP category grants, making it the basis for consent-rate, withdrawal and measurable-traffic reporting, with authoritative volumes reconciled to the CMP consent log because hits sent under denied analytics_storage are only partially collected.

Category: Governance

Tags: [event, Governance: Privacy & Consent Management, cookie consent, consent management platform, google consent mode v2, iab tcf v2.2, financial services]

Industry: ["Finance", "Technology"], Finance

Priority: High

Core Area: Generic

Scope: User

Event Type: custom


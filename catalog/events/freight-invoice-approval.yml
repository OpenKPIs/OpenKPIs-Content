Event Name: Freight Invoice Approval
Event Serialization: always

Description: |
  Records the successful completion of an authorized approval step for a freight invoice, including the approved amount, workflow stage, approver, matching result, and financial variance. Each occurrence represents one completed approval action for a specific invoice version and approval level, enabling analysis of approval throughput, cycle time, exceptions, and control compliance.

Category: Conversion

Tags: [event]

Industry: Logistics & Supply Chain

Priority: High

Core Area: Generic


Event Type: custom

Aggregation Window: Event







Parameters: |
  {"load_id":"string - identifier of the primary transportation load associated with the invoice, nullable when not applicable","event_id":"string - globally unique identifier for the approval event, used for idempotent ingestion and duplicate removal","carrier_id":"string - stable enterprise identifier for the invoicing freight carrier or logistics service provider","invoice_id":"string - immutable enterprise identifier for the freight invoice","tax_amount":"number - taxes included in the invoice amount for the approved invoice version","contract_id":"string - carrier contract, tariff, or rate agreement identifier used to validate the invoice","shipment_id":"string - identifier of the primary shipment associated with the invoice, nullable for consolidated invoices","carrier_name":"string - business name of the invoicing freight carrier or logistics service provider","freight_type":"string - classification of the billed movement, such as inbound, outbound, transfer, return, or international","approver_role":"string - business role under which approval authority was exercised","service_level":"string - contracted or purchased transportation service level","source_system":"string - originating ERP, transportation management, freight audit, or accounts-payable workflow system","approval_level":"string - approval authority tier associated with the completed action","approval_stage":"string - named workflow stage completed, such as operations_review, cost_validation, finance_review, or final_approval","cost_center_id":"string - accounting cost center to which the approved freight expense is assigned","exception_code":"string - standardized exception associated with the invoice at approval time, if applicable","invoice_number":"string - carrier-provided or accounts-payable invoice reference displayed to business users","transport_mode":"string - normalized freight mode, such as truckload, less_than_truckload, parcel, rail, ocean, or air","approval_action":"string - completed workflow action, normally approved, conditionally_approved, or auto_approved","approved_amount":"number - monetary amount authorized for payment by this approval action","disputed_amount":"number - portion of the submitted amount remaining disputed at approval time","event_timestamp":"string - ISO 8601 UTC timestamp when the approval action was committed in the system of record","invoice_version":"integer - revision number of the invoice approved by this action","legal_entity_id":"string - identifier of the legal entity liable for payment","variance_amount":"number - signed monetary difference between the invoiced amount and the validated expected amount","approver_user_id":"string - controlled internal identifier of the employee, contractor, or service account completing the approval","business_unit_id":"string - identifier of the business unit responsible for the freight expense","invoice_currency":"string - ISO 4217 currency code applying to all monetary fields in the event","approval_sequence":"integer - ordinal position of the approval step within the invoice workflow","purchase_order_id":"string - purchase order identifier against which freight charges are authorized, when applicable","accessorial_amount":"number - total billed amount for accessorial services such as detention, fuel surcharge, or liftgate service","exception_resolved":"boolean - indicates whether all approval-blocking exceptions were resolved when the action completed","origin_location_id":"string - normalized identifier for the shipment or load origin associated with the invoice","approval_request_id":"string - unique identifier linking the action to the originating approval task or request","ingestion_timestamp":"string - ISO 8601 UTC timestamp when the event was received by the analytics platform","variance_percentage":"number - signed variance expressed as a percentage of the validated expected amount","approval_reason_code":"string - standardized reason or policy code supporting conditional, exceptional, or automated approval","carrier_invoice_date":"string - calendar date printed or transmitted as the carrier invoice date in ISO 8601 date format","gross_invoice_amount":"number - total freight invoice amount submitted by the carrier before approval adjustments","invoice_status_after":"string - normalized invoice workflow status immediately after the approval action","approval_completed_at":"string - ISO 8601 UTC timestamp when the approver completed the approval task","approval_requested_at":"string - ISO 8601 UTC timestamp when the approval task became available to the approver","invoice_status_before":"string - normalized invoice workflow status immediately before the approval action","within_tolerance_flag":"boolean - indicates whether the invoice variance was within the applicable policy tolerance","three_way_match_status":"string - normalized result of matching the invoice to shipment execution evidence and contracted rates","approval_authority_type":"string - origin of approval authority, such as assigned, delegated, escalated, or system_rule","destination_location_id":"string - normalized identifier for the shipment or load destination associated with the invoice","approval_comment_present":"boolean - indicates whether an approval comment or supporting note was recorded","tolerance_threshold_amount":"number - maximum monetary variance allowed by the applicable approval policy"}

Calculation Notes: |
  Emit the event only after an approval action has been successfully committed; task assignment, task opening, saved drafts, rejections, cancellations, and validation attempts are not approvals. Emit one event for every completed approval level and every invoice version because intermediate, final, delegated, escalated, and automated approvals are analytically distinct; identify final approvals where invoice_status_after equals the governed final-approved status. Remove technical duplicates using event_id, but retain separate approval actions sharing the same invoice_id when approval_request_id, invoice_version, approval_sequence, or approval_level differs. Use approval_completed_at as the business occurrence time and event_timestamp as the system commit time; use ingestion_timestamp only for pipeline-latency analysis. Calculate approval duration from approval_requested_at to approval_completed_at in UTC, then apply the responsible business unit's calendar when reporting business hours, weekends, or holidays. Monetary values must remain in invoice_currency unless converted using an approved exchange-rate dimension; do not aggregate mixed currencies without conversion. For consolidated invoices, shipment_id and load_id may be null or may identify only the primary movement, so shipment-level allocation requires invoice-line data. Reopened, reversed, or voided invoices do not delete the original approval event and must be offset or reclassified using subsequent workflow events. Service accounts are included in approval counts and classified as automated only when approval_authority_type or governed account metadata identifies system-based authorization.

Business Use Case: |
  The Finance leadership team monitors approval cycle time, SLA attainment, and approved freight value by carrier, approval stage, business unit, and exception type. If a carrier shows high variance and repeated manual approvals, Accounts Payable can tighten tolerance rules, require supporting documentation, route invoices to freight audit, or renegotiate the carrier contract; if delays are concentrated at a specific approval level, management can revise authority thresholds, delegation coverage, or staffing.



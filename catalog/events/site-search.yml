Parameters: |
  {
    "search_term": "string - normalised query text as executed (trimmed, lower-cased, PII-redacted, max 100 characters); required",
    "search_type": "string - how the query was issued: keyword, suggestion, recent or voice; required",
    "search_results_count": "integer - number of products returned by the search service for the query, 0 for a null result; required",
    "search_source": "string - interface element where the search was initiated: header, mobile_menu, no_results_page or results_page; optional",
    "search_scope": "string - scope of the query: all, or the category id when the search is restricted to a department; optional",
    "search_term_original": "string - query as typed before auto-correction, sent only when the engine rewrote the term; optional",
    "page_type": "string - template of the page on which the search was initiated (home, category, product, cart, search_results); optional",
    "is_refire": "boolean - true when the event is re-emitted by a reload or history restore of a search results URL, excluded from search counts; optional"
  }




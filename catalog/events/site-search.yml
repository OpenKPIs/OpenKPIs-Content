# Event: Site Search
# Generated: 2026-09-21T17:38:44.401Z
# Contributed by: devyendarm


Event Name: Site Search
Event Serialization: always

Description: |
  Site Search is the standard search event, recorded each time a shopper executes a query against the storefront's internal product search, whether by submitting the search box, pressing enter or selecting an autocomplete suggestion. It carries search_term, search_type, search_source and search_results_count, and it is the single source for Site Searches, Internal Search Term, Zero-Results Search Rate and Search-to-Purchase Conversion Rate. It is the canonical search event; Property Search is its Real Estate variant, which keeps the same search event and adds location and radius parameters.

Category: Engagement



















    
    
    
    
    
    
    
    
    

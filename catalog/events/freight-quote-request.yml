gth required by the shipment; nullable when not provided","package_count":"integer - total number of handling units or packages included in the request","shipment_type":"string - shipment classification such as full_truckload, less_than_truckload, full_container_load, less_than_container_load, or parcel","source_system":"string - authoritative application or integration that accepted and persisted the request","declared_value":"number - non-negative declared commercial value of the shipment in the accompanying value currency","equipment_type":"string - requested equipment or container type such as dry_van, reefer, flatbed, tanker, or container_40ft","packaging_type":"string - primary packaging form such as pallet, carton, crate, drum, bag, or loose","request_status":"string - intake status at event time, normally submitted, accepted, or queued","stackable_flag":"boolean - indicates whether the freight may be safely stacked during transport","transport_mode":"string - requested primary mode such as road, rail, air, ocean, intermodal, or parcel","value_currency":"string - ISO 4217 currency code applicable to declared_value","pricing_currency":"string - ISO 4217 currency in which the customer expects the freight quote","quote_request_id":"string - globally unique, immutable identifier assigned to the freight quote request","request_timestamp":"string - ISO 8601 UTC timestamp when the request was successfully persisted by the intake system","commodity_category":"string - controlled classification of the primary goods being transported","estimated_distance":"number - non-negative route distance estimated at request time; nullable when routing has not completed","origin_postal_code":"string - normalized postal code for the shipment origin at the precision permitted by privacy policy","flexible_dates_flag":"boolean - indicates whether pickup or delivery dates may be adjusted during quotation","origin_country_code":"string - ISO 3166-1 alpha-2 country code for the shipment 
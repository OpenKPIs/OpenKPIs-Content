Calculation Notes: |
  Emit the event only after the intake platform validates the minimum required shipment details, persists the request, and assigns quote_request_id; form views, draft saves, field-validation errors, and abandoned forms are excluded. Because serialization is always, every technical activation is retained in raw data, while unique request reporting must deduplicate on quote_request_id and retain the earliest valid request_timestamp unless a later record is explicitly marked as a material resubmission under a new identifier. Retries caused by browser refreshes, message-broker redelivery, or integration timeouts are duplicates when quote_request_id is unchanged. Genuine customer revisions should update the request entity or emit a separate revision event rather than another Freight Quote Request event with the same identifier. Session-based analysis applies the organization's standard digital inactivity timeout, normally 30 minutes; API, EDI, batch, email-assisted, call-center, and sales-agent requests may have no session_id and must not be excluded. Dates are interpreted in the relevant location's local calendar, timestamps are stored in UTC, monetary values are not converted in the event, and currency conversion for reporting must use the governed exchange rate applicable on request_timestamp. Null means not supplied or not applicable; it must not be interpreted as zero or false. Test traffic, synthetic monitoring, employee training transactions, deleted test accounts, and requests rejected before persistence are excluded from certified reporting. Cancellation after submission does not reverse the event and must be analyzed through the request status history or a cancellation event.

Business Use Case: |
  Revenue Management reviews quote-request volume, lane mix, shipment complexity, and downstream booking conversion by transport mode and service level. If a high-demand lane shows increasing requests but low quote completion or booking conversion, the team can adjust carrier capacity, pricing rules, service coverage, or staffing and then monitor whether turnaround time and conversion improve.



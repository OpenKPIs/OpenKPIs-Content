Parameters: |
  {
    "inquiry_id": "string - Opaque inquiry reference returned by the lead backend; used for deduplication and the CRM outcome join, never derived from contact details",
    "property_id": "string - Listing or property identifier (MLS number or internal listing ID)",
    "property_type": "string - Property classification, e.g. apartment, detached_house, townhouse, land, commercial",
    "listing_type": "string - Transaction type of the listing: sale, rent, new_development",
    "listing_location": "string - Market of the listing at city, neighbourhood or postcode-district level, e.g. austin_downtown",
    "inquiry_type": "string - Intent of the submission: request_info, schedule_viewing, request_callback, make_offer",
    "form_id": "string - Identifier of the inquiry form or placement, e.g. listing_sidebar, gallery_modal, agent_profile",
    "lead_source": "string - Surface that produced the lead: listing_page, search_results, saved_search_alert, agent_page",
    "value": "number - Expected lead value from the lead-value model for this inquiry_type and listing_type; never the asking price",
    "currency": "string - ISO 4217 currency code of value, e.g. USD; required whenever value is sent"
  }

Calculation Notes: |
  1️⃣ Fire only on a server-confirmed submission (HTTP 2xx or a returned inquiry_id), never on button click or on a client-side validation failure, so that spam-blocked, CAPTCHA-failed and rejected submissions are excluded.
  2️⃣ Deduplicate on inquiry_id; where that is missing, collapse repeat hits with the same user (user_pseudo_id in GA4, ECID in AEP) + property_id + inquiry_type + form_id that arrive within 30 minutes of the previous matching hit, which removes double-clicks, page refreshes and thank-you page reloads.
  3️⃣ Multiple inquiries on different properties within one session are counted separately. Session-level reporting uses the standard 30-minute inactivity timeout, and the date is the event timestamp in the property's reporting time zone.
  4️⃣ Exclude internal and test traffic: in GA4, hits with traffic_type = internal or debug_mode set; in AEP, hits from the brokerage office IP prefixes; in both, hits on hostnames matching the staging / stage / qa / uat / test pattern. Backend test-lead flags (is_test in the lead-routing system) are applied in the CRM-reconciled view, not in these queries.
  5️⃣ Leads arriving by phone, email or walk-in are out of scope for this event. Click-to-call and click-to-email taps are tracked separately and must not be sent as generate_lead, otherwise channel lead counts double.
  6️⃣ value is the configured expected lead value for the inquiry_type and listing_type (for example, a sale viewing request is worth more than a rental information request), never the asking price. Omit value and currency together when no value model exists.
  7️⃣ No contact details (name, email, phone, message text) may be sent in parameters. The CRM join to agent outcomes uses inquiry_id only, which keeps the event non-PII.

Business Use Case: |
  1️⃣ Performance Marketing managers review inquiries by lead_source and campaign every week. When cost per inquiry for a paid channel rises more than 20% above its 4-week average, they move budget to the channels delivering viewing requests at lower cost.
  2️⃣ Listing Operations reviews each listing's views against its inquiries every day. When a listing reaches the market's median views but gets no inquiries within 7 days, they send a request to the listing agent to refresh the photos, description or price.
  3️⃣ Sales leadership at the brokerage checks the daily inquiry volume for each listing_location. When a market's viewing requests go above the capacity of the agents assigned to it, they reassign leads through round-robin routing or add agents to that territory.
  4️⃣ Product managers run a funnel review whenever a listing detail page release ships. If inquiries per listing detail page view for that page template drop by more than 10% against the previous release, they roll the change back and start an A/B test on form field count and CTA copy.


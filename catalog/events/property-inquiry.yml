Event Name: Property Inquiry
Event Serialization: always

Description: |
  Real-estate specialisation of the GA4 generate_lead event, fired once when a prospective buyer or renter successfully submits an inquiry on a listing, whether that is a request for information, a viewing request, a callback request or an offer enquiry. It is the primary lead-capture conversion for portals and brokerage sites, and it links listing discovery to the agent pipeline through the property, the listing market and the inquiry intent.

Category: Conversion


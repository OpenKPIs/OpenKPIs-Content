Parameters: |
  {"page_type":"string - Page template classification; always order_status for this check, used to isolate the order status or order details page view from other page_view hits","transaction_id":"string - Merchant order ID for the order being viewed; must equal the transaction_id sent on the originating purchase event so the check joins to the order","order_status":"string - Order status shown to the customer when the page rendered: placed, processing, shipped, out_for_delivery, delivered, cancelled","login_status":"string - Authentication state at view time: logged_in or guest","lookup_method":"string - How the customer reached the order: account (My Orders list), order_lookup_form (order ID + email/postcode form), email_link (link in an order or shipping confirmation email or SMS)","days_since_order":"integer - Whole calendar days between the order placement timestamp and the check, in the store's reporting time zone (0 = same day)"}




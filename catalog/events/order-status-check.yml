Event Name: Order Status Check
Event Serialization: always

Description: |
  Fires when a signed-in or guest customer opens the merchant's own order status, Track Order or order detail page for a single resolved order ID — the classic WISMO ("where is my order") self-service check — captured as the unified page_view event with page_type = order_status and carrying the order ID, the status rendered to the customer and the lookup path used. It is scoped to the merchant domain and to one order, with carrier or parcel-level tracking recorded separately as Shipment Tracking View, and supplies the behavioural signal behind order status check rate, WISMO contact deflection and delivery-promise accuracy reporting.

Category: Experience

Tags: [event, E-commerce: Post-Purchase Logistics & Fulfillment, WISMO, Self-Service, Order Tracking]

Industry: E-commerce


# Event: Order Status Check
# Generated: 2026-09-14T01:08:42.938Z
# Contributed by: devyendarm


Event Name: Order Status Check
Event Serialization: always

Description: |
  Storefront self-service event recorded when a signed-in or guest customer opens the merchant's order status, Track Order or order details page for a specific order ID, the classic WISMO ("where is my order") check, recorded as the unified page_view event with page_type = order_status. It differs from Shipment Tracking View, which records the carrier or shipment-level tracking view for a parcel, and feeds the order status check rate, order tracking page view volume and WISMO contact deflection analysis used by Customer Service and fulfillment teams.

Category: Experience



















    
    
    
    
    
    
    
    
    

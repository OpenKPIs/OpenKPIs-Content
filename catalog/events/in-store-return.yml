Event Name: In-Store Return
Event Serialization: always

Description: |
  Omnichannel specialisation of Return Initiated: records every online-purchased order, or part of one, that a customer brings back to a physical store and that is posted as a completed return at the point of sale (buy online, return in store, or BORIS). It is sourced from the POS and order management returns ledger rather than the web data layer, and each record carries the original online order ID, the store that took the return, the refund value and the standardised return reason, so e-commerce, store and finance teams report the same returns.

Category: Operations

Tags: [event, Retail: Omnichannel (BOPIS - Buy Online Pick Up In Store), BORIS, Returns]

Industry: Retail

Priority: High

Core Area: Generic


Event Type: custom

Aggregation Window: Daily, Weekly, Monthly







Parameters: |
  {
    "return_id": "string - Unique POS/OMS return transaction identifier; primary deduplication key (one event per posted return)",
    "transaction_id": "string - Original online order ID the returned items were purchased on; join key to the purchase event and OMS order header",
    "channel_of_purchase": "string - Channel of the original sale; fixed to 'online' for this event (web, app and call-centre orders captured in the OMS)",
    "channel_of_return": "string - Channel where the return was processed; fixed to 'store'",
    "original_fulfillment_method": "string - How the original order was fulfilled: 'ship_to_home', 'bopis', 'ship_to_store', 'curbside' or 'ship_from_store'",
    "store_id": "string - Store number where the return was posted, as held in the store master",
    "register_id": "string - POS terminal that posted the return; used for void and fraud reconciliation",
    "return_timestamp": "datetime - Moment the return was posted at the POS, stored in UTC with the store's local time zone retained separately",
    "order_timestamp": "datetime - Placement timestamp of the original online order, in UTC",
    "refund_value": "number - Net merchandise value refunded, excluding sales tax and original shipping, after any restocking fee",
    "tax_refunded": "number - Sales tax refunded, held separately so refund_value stays comparable across tax jurisdictions",
    "currency": "string - ISO 4217 currency code of refund_value",
    "refund_method": "string - 'original_tender', 'store_credit', 'gift_card' or 'exchange'",
    "return_reason": "string - Standardised reason code from the returns taxonomy (e.g. 'size_fit', 'damaged_defective', 'not_as_described', 'changed_mind', 'late_delivery', 'wrong_item')",
    "items": "array - Returned lines: item_id, item_variant, quantity, item_refund_value, return_reason, disposition ('restock', 'damaged', 'return_to_vendor', 'liquidate')",
    "item_count": "number - Total units returned across all lines",
    "order_match_status": "string - 'matched' when the return was linked to the online order via receipt, order lookup or card lookup; 'unmatched' otherwise",
    "within_policy_window": "boolean - True when return_timestamp falls inside the published return window for the order's category",
    "customer_id": "string - Hashed customer or loyalty identifier carried from the original order; never the raw email or card number"
  }



Dependencies:
  Events: [purchase, return-initiated]
  Dimensions: [return-reason, store-id]

Source Data: Store POS + OMS Returns Ledger (Backend)

    Report Attributes: |
  Store ID; Region; Return Reason; Original Fulfillment Method; Refund Method; Product Category; Order-to-Return Lag Band; Within Policy Window

    Dashboard Usage: [Omnichannel Returns Dashboard, Store Operations Performance, E-commerce Net Revenue & Refunds, Returns Reason Analysis]

    Segment Eligibility: |
  true

    Related Dimensions: [return-reason, store-id, channel-of-purchase, fulfillment-method, refund-method]

    Derived Dimensions: [return-channel, order-to-return-lag-days, return-disposition]

    Derived Metrics: [in-store-returns-count, in-store-refund-value, in-store-returned-units]

    Derived KPIs: [in-store-return-rate, in-store-returns-of-online-orders, return-rate]

    Data Sensitivity: Restricted

    Contains PII: Yes


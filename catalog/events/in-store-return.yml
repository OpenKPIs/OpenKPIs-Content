# Event: In-Store Return
# Generated: 2026-09-19T18:28:02.940Z
# Contributed by: devyendarm


Event Name: In-Store Return
Event Serialization: always

Description: |
  Omnichannel specialisation of Return Initiated: records every online-purchased order, or part of one, that a customer brings back to a physical store and that is posted as a completed return at the point of sale (buy online, return in store, or BORIS). It is sourced from the POS and order management returns ledger rather than the web data layer, and each record carries the original online order ID, the store that took the return, the refund value and the standardised return reason, so e-commerce, store and finance teams report the same returns.

Category: Operations



















    
    
    
    
    
    
    
    
    

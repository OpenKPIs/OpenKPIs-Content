# Event: In-Store Return
# Generated: 2026-09-20T00:24:29.204Z
# Contributed by: devyendarm
# Last modified by: devyendarm

Event Name: In-Store Return
Event Serialization: always

Description: |
  Omnichannel specialisation of Return Initiated: records every online-purchased order, or part of one, that a customer brings back to a physical store and that is posted as a completed return at the point of sale (buy online, return in store, or BORIS). It is sourced from the POS and order management returns ledger rather than the web data layer, and each record carries the original online order ID, the store that took the return, the refund value and the standardised return reason, so e-commerce, store and finance teams report the same returns.

Category: Operations

Tags: [event, Retail: Omnichannel (BOPIS - Buy Online Pick Up In Store), BORIS, Returns]

Industry: Retail

Priority: High

Core Area: Generic


Event Type: custom

Aggregation Window: Daily, Weekly, Monthly







Parameters: |
  {
    "return_id": "string - Unique POS/OMS return transaction identifier; primary deduplication key (one event per posted return)",
    "transaction_id": "string - Original online order ID the returned items were purchased on; join key to the purchase event and OMS order header",
    "channel_of_purchase": "string - Channel of the original sale; fixed to 'online' for this event (web, app and call-centre orders captured in the OMS)",
    "channel_of_return": "string - Channel where the return was processed; fixed to 'store'",
    "original_fulfillment_method": "string - How the original order was fulfilled: 'ship_to_home', 'bopis', 'ship_to_store', 'curbside' or 'ship_from_store'",
    "store_id": "string - Store number where the return was posted, as held in the store master",
    "register_id": "string - POS terminal that posted the return; used for void and fraud reconciliation",
    "return_timestamp": "datetime - Moment the return was posted at the POS, stored in UTC with the store's local time zone retained separately",
    "order_timestamp": "datetime - Placement timestamp of the original online order, in UTC",
    "refund_value": "number - Net merchandise value refunded, excluding sales tax and original shipping, after any restocking fee",
    "tax_refunded": "number - Sales tax refunded, held separately so refund_value stays comparable across tax jurisdictions",
    "currency": "string - ISO 4217 currency code of refund_value",
    "refund_method": "string - 'original_tender', 'store_credit', 'gift_card' or 'exchange'",
    "return_reason": "string - Standardised reason code from the returns taxonomy (e.g. 'size_fit', 'damaged_defective', 'not_as_described', 'changed_mind', 'late_delivery', 'wrong_item')",
    "items": "array - Returned lines: item_id, item_variant, quantity, item_refund_value, return_reason, disposition ('restock', 'damaged', 'return_to_vendor', 'liquidate')",
    "item_count": "number - Total units returned across all lines",
    "order_match_status": "string - 'matched' when the return was linked to the online order via receipt, order lookup or card lookup; 'unmatched' otherwise",
    "within_policy_window": "boolean - True when return_timestamp falls inside the published return window for the order's category",
    "customer_id": "string - Hashed customer or loyalty identifier carried from the original order; never the raw email or card number"
  }

Calculation Notes: |
  ["1️⃣ Scope is online-purchased orders only: the event fires when channel_of_purchase = 'online' and channel_of_return = 'store'. Store-purchased returns, returns sent back by mail or carrier and third-party marketplace seller orders that the store cannot refund are excluded, and returns dropped at a carrier kiosk inside the store count as mail returns because the POS does not post the refund.","2️⃣ One event per posted return_id. A multi-line return is a single event with an items array; partial returns of the same order made on different visits are separate events that share a transaction_id. A return voided at the register on the same business day removes the event, and a later reversal is recorded as a negative adjustment against the original return_id, not a deletion.","3️⃣ Timing: the event is dated to return_timestamp (POS posting time), not the order date, and business-day reporting uses the store's local time zone. Order-to-return lag is return_timestamp minus order_timestamp; returns outside the policy window are flagged with within_policy_window = false and kept in the data, not dropped.","4️⃣ Not a return: BOPIS orders the customer never collected, orders refused at the pickup counter before handover, and pre-fulfilment cancellations are cancellations or unclaimed orders and must not fire this event. Only merchandise the customer has already received counts.","5️⃣ refund_value is net merchandise value excluding tax and original shipping, less restocking fees, converted to the reporting currency at the return-date FX rate. Even exchanges post with refund_value = 0 and refund_method = 'exchange'; they count toward return volume but add nothing to refunded value.","6️⃣ Order linkage: the transaction_id comes from a receipt barcode scan, OMS order lookup or tender lookup. Receipt-less returns that cannot be matched carry order_match_status = 'unmatched' and are excluded from online-order return rates, but they are kept for loss-prevention review and match-rate monitoring (target above 95%).","7️⃣ Late-arriving data: POS returns trickle in from stores that sync overnight or were offline, so daily figures stay provisional for 72 hours and the prior 3 days are reprocessed on each load. The return_reason is taken from the line level when captured; otherwise the header reason applies to every line."]

Business Use Case: |
  ["1️⃣ Merchandising reviews in-store returns weekly by SKU and store. When returned units of an online-only SKU at one store pass the store's weekly sell-through, the team either sends the stock back to the fulfilment centre or approves a local markdown, which prevents dead stock building up in the back room.","2️⃣ Finance runs the month-end close. It reallocates refund_value from store P&L to the e-commerce P&L using transaction_id, so store managers are not charged for online-order refunds and online net revenue reflects returns processed in stores.","3️⃣ Product and Customer Service watch return_reason daily. When 'size_fit' or 'not_as_described' goes above 30% of in-store returns for a product family over 14 days, they update the size guide and product page copy and brief store associates on the known issue.","4️⃣ Store Operations compares return counter volume by hour and store with staffing. Stores where BORIS volume peaks (for example the two weeks after the holidays) get dedicated return-desk staffing and targeted exchange offers to recover the refunded revenue."]

Dependencies:
  Events: [purchase, return-initiated]
  Dimensions: [return-reason, store-id]

Source Data: Store POS + OMS Returns Ledger (Backend)

    Report Attributes: |
  Store ID; Region; Return Reason; Original Fulfillment Method; Refund Method; Product Category; Order-to-Return Lag Band; Within Policy Window

    Dashboard Usage: [Omnichannel Returns Dashboard, Store Operations Performance, E-commerce Net Revenue & Refunds, Returns Reason Analysis]

    Segment Eligibility: |
  true

    Related Dimensions: [return-reason, store-id, channel-of-purchase, fulfillment-method, refund-method]

    Derived Dimensions: [return-channel, order-to-return-lag-days, return-disposition]

    Derived Metrics: [in-store-returns-count, in-store-refund-value, in-store-returned-units]

    Derived KPIs: [in-store-return-rate, in-store-returns-of-online-orders, return-rate]


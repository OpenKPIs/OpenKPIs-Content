Event Name: Customer Login
Event Serialization: once per session

Description: |
  Customer Login records an explicit, successful authentication by a known customer on web or app and binds that session to the persistent, hashed customer identifier used by CRM, loyalty and POS — the identity-stitching moment that turns anonymous browsing into attributable customer behaviour and makes omnichannel lifetime value, churn and repeat-purchase analysis possible. It is deliberately distinct from account creation (the sign_up event): only an explicit authentication counts, while silent token refresh and persisted-session re-entry are excluded.

Category: Identity

Tags: [event, E-commerce: Customer Retention, Loyalty & LTV]

Industry: E-commerce

Priority: High

Core Area: Authentication


Event Type: standard


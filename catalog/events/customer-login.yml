Parameters: |
  {
    "method": "string - Authentication mechanism used for this explicit login: email_password, social_google, social_apple, social_facebook, sso_saml, passwordless_otp or biometric.",
    "customer_id": "string - Irreversible SHA-256 hash of the CRM customer key, resolved server-side at authentication; the persistent identity the session is bound to. Never an email address, phone number or raw account identifier.",
    "login_source": "string - Storefront surface that triggered the authentication: header, checkout, order_tracking, wishlist, loyalty_hub, subscription_manager or email_deeplink.",
    "is_first_login": "boolean - True when this is the customer's first authenticated session after account creation, separating activation from all subsequent logins and from the sign_up event.",
    "mfa_used": "boolean - True when a second factor was completed as part of the authentication, used to assess friction introduced by step-up security.",
    "loyalty_tier": "string - Loyalty programme tier resolved from the profile at authentication: none, member, silver, gold or platinum.",
    "customer_lifecycle_stage": "string - CRM lifecycle state at the moment of authentication: prospect, first_time_buyer, repeat, lapsed or reactivated.",
    "days_since_last_purchase": "integer - Whole days between the customer's most recent completed order (any channel) and this authentication; null when the customer has no purchase history.",
    "device_category": "string - Fallback only for server-side (Measurement Protocol) sends, where GA4's native device.category is not populated: desktop, mobile or tablet. Client-side tags omit it; reporting uses device.category (GA4) / device.type (XDM) on every event."
  }

Calculation Notes: |
  1️⃣ Fires once per session on the GA4 recommended `login` event, immediately after the authentication service returns a success response and before any personalised content renders — never a coined `customer_login` name, so the event stays comparable across GA4 and Adobe implementations.,2️⃣ Only explicit authentications count. Silent token refresh, long-lived cookie or keychain re-entry, app resume from background and SSO session extension are EXCLUDED: the once-per-session cap is a deduplication rule, not an under-count — a customer who is already authenticated when a new session starts generates no new event but is still attributed to the customer_id carried on the session.,3️⃣ Excluded from the count: failed or abandoned authentication attempts, password-reset and account-recovery flows, guest checkout (which carries an order-level email but no account binding), internal staff impersonation or admin support logins, and traffic identified as automated or synthetic monitoring.,4️⃣ Session timeout follows the platform default of 30 minutes of inactivity (or a campaign-driven session restart), after which the next explicit authentication produces a new event; a customer switching device or browser inside the same calendar day produces one event per device session, which is the intended basis for cross-device reach reporting.,5️⃣ Distinct from sign_up: account creation fires sign_up only. The first authenticated session that follows registration fires this event with `is_first_login` = true, so activation lag between account creation and first authenticated visit is measurable without double-counting either event.,6️⃣ Identity binding is the payload's purpose: `customer_id` is an irreversible hash of the CRM customer key, resolved server-side at authentication and propagated to every subsequent event in the session. No email address, phone number, loyalty card number or raw account identifier is ever placed in the payload, and the hashed key is the only join path to CRM, loyalty and POS order history.,7️⃣ Value action by industry: E-commerce binds the session to the customer's order and loyalty history; Retail binds it to the omnichannel profile shared with POS; SaaS binds it to the workspace/seat entitlement; Media binds it to the subscriber profile and entitlements; Finance binds it to the accountholder relationship — the unified event and the identity-binding semantics are identical, only the profile joined differs.

Business Use Case: |
  1️⃣ The CRM & Retention Marketing Manager reviews authenticated-session share by loyalty tier each month; when identified sessions fall for Gold and Platinum members while total traffic is flat, they launch a re-authentication prompt on the storefront and a targeted win-back journey to the tiers that dropped.,2️⃣ The Loyalty Programme Manager monitors customers who authenticate but never reach the loyalty hub in the same session; that daily list drives an in-session points-and-tier banner and is evaluated against subsequent reward redemption to confirm the prompt moved behaviour rather than just impressions.,3️⃣ The Digital Product Manager for Account & Checkout watches the authentication method mix and the mobile-versus-web authenticated share for two weeks after each release; if a newly shipped passwordless or social option does not lift the authenticated share on mobile, they roll the option back before it reaches the full audience.,4️⃣ The Customer Service Operations Lead routes proactive chat using the login payload: customers authenticating on order-tracking surfaces with a high days-since-last-purchase value, or authenticating repeatedly within a single day, are offered assisted service before they open a ticket.


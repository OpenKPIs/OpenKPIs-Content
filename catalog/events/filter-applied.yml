Parameters: |
  {
    "filter_type": "string - required; facet dimension the shopper refined on, as a stable key (category, brand, size, colour, price, rating, availability, fulfillment_method)",
    "filter_value": "string - required; normalised selected value or range (brand_nike, size_uk_9, price_50_100); multiple values in one committed selection are pipe-delimited",
    "item_list_id": "string - required; identifier of the product list being refined, identical to the value on view_item_list and select_item",
    "item_list_name": "string - required; readable name of the product list being refined (e.g. Category: Running Shoes, Search Results)",
    "page_type": "string - required; template on which the filter was applied (category, product_list, search_results)",
    "search_results_count": "integer - required; number of products returned after the filter is applied; 0 identifies a zero-result refinement",
    "search_term": "string - optional; internal search query when the filter is applied on a search results page",
    "filter_count": "integer - optional; number of active refinements on the list after this filter is applied",
    "filters": "string - optional; full active filter state after the change, serialised as filter_type:filter_value pairs separated by semicolons",
    "sort_order": "string - optional; sort applied to the list at the time of the filter (relevance, price_asc, price_desc, newest, top_rated)"
  }




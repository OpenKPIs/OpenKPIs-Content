Event Name: Filter Applied
Event Serialization: always

Description: |
  Filter Applied is the filter_apply event, recorded when a shopper commits a facet or refinement (category, brand, size, colour, price band, rating, availability, fulfillment option) on a product listing, category or search results page, and it carries the filter dimension, the selected value, the resulting product count and the item_list_id of the list being refined. It is the behavioural basis for the Filter Applications metric and for every analysis of how faceted navigation narrows an assortment, exposes zero-result dead ends and shapes the path from list view to product view, cart and order.

Category: Engagement

Tags: [event, E-commerce: Product Discovery & Merchandising (Search/Filters/PDP)]

Industry: E-commerce

Priority: High

Core Area: Discovery


Event Type: custom

Aggregation Window: Event, Session, Daily, Weekly


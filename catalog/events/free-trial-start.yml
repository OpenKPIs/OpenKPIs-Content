Parameters: |
  {"plan_id":"string - unique identifier of the product plan being trialed","user_id":"string - internal pseudonymous identifier of the user starting the trial","currency":"string - ISO 4217 currency code for the plan's expected post-trial billing currency","event_id":"string - globally unique identifier for this event occurrence","offer_id":"string - identifier of the trial offer or promotion used","platform":"string - activation platform such as web, iOS, Android, API, or sales-assisted","trial_id":"string - unique identifier for the activated trial entitlement","plan_name":"string - business-readable name of the product plan being trialed","account_id":"string - internal pseudonymous identifier of the organization or customer account receiving the trial","is_retrial":"boolean - indicates whether the user or account previously received a qualifying trial","product_id":"string - identifier of the product or service covered by the trial","session_id":"string - digital analytics session associated with the activation when available","campaign_id":"string - marketing campaign identifier attributed to the trial start","coupon_code":"string - non-personal promotional code applied to the trial, if applicable","environment":"string - deployment environment such as production, staging, or development","country_code":"string - ISO 3166-1 alpha-2 country derived from approved account, billing, or network data","source_system":"string - system that authoritatively confirmed trial activation","subscription_id":"string - subscription record identifier associated with the trial when available","billing_interval":"string - expected post-trial billing cadence such as monthly or annual","post_trial_price":"number - standard recurring price expected after the trial, before tax and excluding one-time charges","acquisition_channel":"string - normalized channel credited with acquiring the trial starter","trial_duration_days":"integer - scheduled number of calendar days between trial activation and expiration","trial_end_timestamp":"string - ISO 8601 UTC timestamp when trial access is scheduled to expire","trial_start_timestamp":"string - ISO 8601 UTC timestamp when trial access became active","payment_method_required":"boolean - indicates whether a payment method was required before activation","prior_subscription_status":"string - normalized subscription status immediately before trial activation"}

Calculation Notes: |
  Count one activation for each distinct trial_id using the earliest valid trial_start_timestamp. Retries with the same trial_id are duplicates; separate eligible trials for the same user or account count only when they have different trial_id values and comply with retrial policy. Use the entitlement activation timestamp rather than client emission or warehouse ingestion time, and retain late-arriving events in the original activation period. Trial extensions, plan changes within an active trial, entitlement refreshes, and reinstatements of the same trial do not create another start. Exclude non-production environments and accounts flagged as employee, test, bot, fraud, or quality-assurance traffic. A trial canceled after successful activation remains counted. Session attribution uses the associated session_id; where session_id is unavailable, attribute to the latest eligible digital session preceding activation, with a 30-minute inactivity timeout and a maximum 24-hour lookback.

Business Use Case: |
  The Product Growth team compares trial starts and downstream paid conversions by plan, acquisition channel, offer, and payment-method requirement. If a campaign produces high signup volume but low trial activation, leadership can prioritize onboarding fixes; if a trial offer produces strong activation but weak paid conversion, the team can revise qualification, product education, trial duration, or post-trial pricing.



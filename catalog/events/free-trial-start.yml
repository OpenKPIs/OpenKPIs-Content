Event Name: Free Trial Start
Event Serialization: once per trial_id

Description: |
  Records the successful activation of a time-limited, no-charge product entitlement for an eligible user or account. It measures actual trial access granted, not a trial button click, form submission, payment authorization, or pending registration.

Category: Conversion

Tags: [event]

Industry: E-commerce & SaaS

Priority: High

Core Area: Onboarding


Event Type: custom

Aggregation Window: Event, Session, User, and Time based - Daily/Weekly/Monthly

GA4 Event: |
  sign_up

Adobe Event: |
  sign_up


    Derived Dimensions: [Cancellation Lead-Time Band, Shipment Age at Cancellation Band, Cancellation Lifecycle Stage Group, Cancellation Responsibility Group, Cancellation Preventability Group, Pre-Pickup or Post-Pickup Cancellation, Domestic or Cross-Border Shipment, Same-Day Cancellation Flag, Carrier-Assigned-at-Cancellation Flag, Cancellation Fee Band]

    Derived Metrics: [Cancelled Shipment Count, Distinct Orders with Cancelled Shipments, Pre-Pickup Cancellation Count, Post-Pickup Cancellation Count, Preventable Cancellation Count, Carrier-Attributed Cancellation Count, Customer-Initiated Cancellation Count, Cancellation Fee Amount, Average Time from Shipment Creation to Cancellation, Average Time from Tender to Cancellation, Reinstated and Recancelled Shipment Count]

    Derived KPIs: [Shipment Cancellation Rate, Preventable Shipment Cancellation Rate, Post-Pickup Cancellation Rate, Carrier-Attributed Cancellation Rate, Customer-Initiated Cancellation Rate, Cancellation Cost per Cancelled Shipment, On-Time Shipment Preservation Rate, Cancellation Rate by Lifecycle Stage, Cancellation Rate by Carrier, Cancellation Rate by Service Level]


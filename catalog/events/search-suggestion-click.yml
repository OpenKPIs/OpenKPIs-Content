Calculation Notes: |
  1️⃣ Use the time the site confirms the selection.
  2️⃣ Assign a new anonymous action ID to each distinct confirmed selection and reuse it for retries.
  3️⃣ In BigQuery and Adobe Experience Platform reports, count each action ID once.
  4️⃣ If the selection runs a search, record the search separately as Site Search.
  5️⃣ Exclude shopper-entered text, suggestion labels, and user identifiers.

Business Use Case: |
  1️⃣ When category selections decline, merchandisers review where category suggestions appear in the search menu.
  2️⃣ Search teams compare product selections before and after a layout change to decide whether to keep it.



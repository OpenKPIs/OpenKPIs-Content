Event Name: Search Suggestion Click
Aliases: [Autocomplete Click, Typeahead Selection, Search Suggestion Selection]

Event Serialization: One per confirmed search suggestion selection

Description: |
  Records when a shopper selects a suggested query, product, or category from the site's search box. It shows which kinds of suggestions shoppers choose.

Category: Engagement

Tags: [site search, autocomplete, product discovery]

Industry: [E-commerce, Retail]

Business Criticality: Medium

Journey / Navigation Area: [Discovery]

Owning Function: Merchandising

Scope: Event

Measurement Channels: [Web]

GA4 Collection Classification: Recommended

Adobe XDM Classification: Custom XDM

Trigger Condition: WHEN the site accepts a shopper's selection of an autocomplete suggestion by click, tap, or keyboard, THEN emit search_suggestion_click.

GA4 Event: |
  select_content

Adobe Event: |
  search_suggestion_click


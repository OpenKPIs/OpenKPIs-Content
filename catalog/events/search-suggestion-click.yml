Parameters: |
  {
    "content_type": "string - Fixed value search_suggestion; separates suggestion picks from other select_content hits",
    "search_term": "string - Prefix the shopper had typed when picking, redacted for emails and phone numbers",
    "suggestion_text": "string - Label of the picked suggestion exactly as displayed",
    "suggestion_type": "string - query, product or category",
    "suggestion_position": "number - 1-based rank of the picked suggestion in the panel",
    "page_type": "string - Type of page the typeahead was used on (home, category, product, search_results)"
  }




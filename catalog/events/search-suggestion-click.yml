Event Name: Search Suggestion Click
Event Serialization: always

Description: |
  Standard select_content event with content_type = search_suggestion, fired when a shopper picks a query, product or category from the search typeahead. A typed query submitted without a pick is a Site Search.

Category: Engagement



















    
    
    
    
    
    
    
    
    

Event Name: Reserve and Collect Request
Event Serialization: always

Description: |
  Records a reserve-and-collect request once the store system accepts it, confirming the hold and returning a reservation_id; no online payment. Rejected requests are not recorded; collection is order-pickup.

Category: Conversion

Tags: [event, Retail: Omnichannel (BOPIS - Buy Online Pick Up In Store)]

Industry: Retail

Priority: Medium

Core Area: Checkout


Event Type: standard

Aggregation Window: Event, Daily, Weekly


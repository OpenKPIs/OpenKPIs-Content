Parameters: |
  {
    "reservation_id": "string - Unique hold identifier returned by the order or store system; dedupe key",
    "store_id": "string - Identifier of the store holding the items",
    "store_name": "string - Display name of the store holding the items",
    "items": "array - Reserved items with item_id, item_name, item_category, price, quantity",
    "value": "number - Total price of the reserved items; unpaid, not revenue",
    "currency": "string - ISO 4217 currency code of value",
    "fulfillment_method": "string - Fixed value reserve_collect",
    "store_inventory_status": "string - Stock status shown for the store when the hold was placed",
    "user_id": "string - Hashed customer identifier; sent only with analytics consent"
  }

Calculation Notes: |
  ["1️⃣ Fires once the store system accepts the request and returns a reservation_id; a rejected request, store pick or stock check sends nothing.","2️⃣ Serialization always: each confirmed reservation is a hit. Dedupe on reservation_id to drop reload and retry double fires.","3️⃣ Required: reservation_id, store_id, items, value, currency, fulfillment_method. Optional: store_name, store_inventory_status, user_id.","4️⃣ fulfillment_method is reserve_collect; value is the unpaid reserved amount and never counts as revenue or a purchase.","5️⃣ Name, email and phone for the hold notice stay in the order system; send only a hashed user_id, and only with analytics consent.","6️⃣ Common mistakes: sending purchase instead, firing before the hold is confirmed, and one hit per item instead of one items array."]

Business Use Case: |
  ["1️⃣ Store Operations: one store's daily reservations outgrow its hold shelf → add shelf space and pickup staff there.","2️⃣ Merchandising: one category takes most reservations → keep deeper stock of it at pickup stores.","3️⃣ Omnichannel PM: reservations placed on low-stock status climb → refresh store inventory feeds more often.","4️⃣ CRM Manager: reservation_id has no order-pickup match a day before expiry → send a pickup reminder."]


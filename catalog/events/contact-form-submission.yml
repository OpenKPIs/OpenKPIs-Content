# Event: Contact Form Submission
# Generated: 2026-09-18T16:51:49.924Z
# Contributed by: devyendarm


Event Name: Contact Form Submission
Event Serialization: always

Description: |
  Records each server-acknowledged submission of the storefront contact or help form, captured as the unified submit_form event with form_type='contact' and classified by contact_reason and ticket_category, with transaction_id attached when the enquiry concerns a specific order. It is the digital numerator for Contact Rate and Contacts per Order, so Customer Service can separate order-driven demand (WISMO, returns, refunds, damaged items) from pre-purchase questions and measure how well self-service deflects each one.

Category: Experience



















    
    
    
    
    
    
    
    
    

      },
      "meaning": "Opaque identifier for one accepted contact-form submission",
      "purposes": [
        "event_identity",
        "deduplication"
      ],
      "required": true,
      "justification": "Keeps retries and repeated acknowledgements from counting one submission more than once."
    }
  }

Calculation Notes: |
  1️⃣ Include only acknowledged new submissions; exclude failed attempts and updates to existing tickets.
  2️⃣ Count each accepted submission once by event_id; reuse the key for retries and repeated displays.
  3️⃣ Count separate accepted enquiries separately, even from the same person.
  4️⃣ Integration must preserve original acceptance time across platforms, including GA4 retransmissions.
  5️⃣ Analytics may miss accepted requests; reconcile totals with the support system.

Business Use Case: |
  1️⃣ Support managers use submission trends to adjust staffing for incoming requests.
  2️⃣ Customer experience teams compare submission trends before and after help-content changes.



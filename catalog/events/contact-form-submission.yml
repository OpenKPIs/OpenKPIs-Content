Parameters: |
  {
    "form_type": "string - Form classification; constant 'contact' for this event, used to separate it from other submit_form uses",
    "form_id": "string - Stable identifier of the form instance (e.g. 'contact_us_main', 'order_help_modal') for comparing placements",
    "contact_reason": "string - Customer-selected reason from the controlled picklist (order_status, return_request, refund_status, damaged_item, product_question, payment_issue, account_access, other)",
    "ticket_category": "string - Help-desk taxonomy category the reason maps to (pre_purchase, fulfilment, returns_refunds, billing, account, other); aligns with the ticket-category dimension",
    "ticket_id": "string - Help-desk ticket identifier returned on successful submission; used for deduplication and reconciliation",
    "transaction_id": "string - Optional. Validated order id when the contact concerns a specific order; enables Contacts per Order and order-cohort joins",
    "support_channel": "string - Constant 'web_form' for this event; aligns with the support-channel dimension so digital and help-desk contacts share one taxonomy",
    "customer_type": "string - 'guest' or 'registered' at time of submission"
  }




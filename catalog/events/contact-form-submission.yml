Event Name: Contact Form Submission
Aliases: [Contact Us Submission, Support Form Submission, Help Form Submission]

Event Serialization: Emit after support acknowledgement; persist event_id and deduplicate retries by that key.

Description: |
  Records a contact or help form submission successfully accepted by the support system. It helps support teams understand incoming requests and improve self-service.

Category: Conversion

Tags: [contact forms, customer support, self-service]

Industry: [E-commerce, Retail]

Business Criticality: High

Journey / Navigation Area: [Customer Service]

Owning Function: Customer Support

Scope: Event

Measurement Channels: [Backend / API, Web]

GA4 Event Type: Custom

Adobe Event Type: Standard XDM

Trigger Condition: WHEN the support system accepts a new contact-form submission and creates its ticket, THEN emit contact_form_submission.


Event Name: Contact Form Submission
Aliases: [Contact Us Submission, Support Form Submission, Help Form Submission]

Event Serialization: Emit once after successful acceptance; deduplicate retries and repeated acknowledgements by event_id.

Description: |
  Records a new contact or help form submission successfully accepted by the support system. It helps support teams understand incoming requests and assess help content.

Category: Conversion

Tags: [contact forms, customer support, self-service]

Industry: [E-commerce, Retail]

Business Criticality: High

Journey / Navigation Area: [Customer Service]

Owning Function: Customer Support

Scope: Event

Measurement Channels: [Backend / API, Web]

GA4 Collection Classification: Custom

Adobe XDM Classification: Standard XDM

Trigger Condition: WHEN the support system successfully accepts a new contact-form submission, THEN emit contact_form_submission.


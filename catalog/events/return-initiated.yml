Parameters: |
  {
    "form_type": "string - Fixed value 'return_request'; distinguishes return submissions from other submit_form usages such as contact or newsletter forms",
    "return_id": "string - Return merchandise authorisation (RMA) identifier issued by the returns platform; deduplication key for the request",
    "transaction_id": "string - Original order ID the return is raised against; joins to the purchase event and to Refund Issued",
    "items": "array - Returned line items, each with item_id, item_name, item_category, price, quantity and item-level return_reason",
    "return_reason": "string - Primary coded reason from the controlled reason list (e.g. size_too_small, damaged, not_as_described, changed_mind); aligns with the Return Reason dimension",
    "return_method": "string - How the goods will come back (mail_prepaid_label, drop_off_point, in_store, carrier_pickup, keep_item); aligns with the Return Method dimension",
    "resolution_type": "string - Requested outcome: refund | exchange | store_credit; maps to the Refund Type dimension",
    "value": "number - Merchandise value of the returned items at the price paid, excluding shipping and tax",
    "currency": "string - ISO 4217 currency code of value"
  }




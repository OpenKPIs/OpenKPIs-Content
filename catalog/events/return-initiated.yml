Event Name: Return Initiated
Event Serialization: always

Description: |
  Return Initiated fires when a customer successfully submits a return request against a completed order through the self-service returns portal (Shopify, Salesforce Commerce Cloud, Loop, Narvar), carrying the order reference, the returned line items, the stated reason, the return method and the requested resolution (refund, exchange or store credit). It is the authoritative numerator input for return rate and the leading signal of revenue at risk, reported by initiation date well before the downstream Refund Issued event confirms the financial reversal.

Category: Operations

Tags: [event, E-commerce: Returns, Refunds & Customer Support]

Industry: E-commerce

Priority: High

Core Area: Monetization


Event Type: standard

Aggregation Window: Event, Daily, Weekly, Monthly


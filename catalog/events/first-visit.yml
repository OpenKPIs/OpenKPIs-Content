Parameters: |
  {
    "ga_session_id": "integer - Identifier of the session in which the first visit occurred; set automatically and used to tie first_visit to its accompanying session_start.",
    "ga_session_number": "integer - Ordinal session count for the client identifier; must be 1 on a genuine first_visit, any other value signals duplicate tagging or identifier churn.",
    "engagement_time_msec": "integer - Foreground engagement time accumulated before the hit was sent; automatic, and the basis for classifying the first session as engaged.",
    "page_location": "string - Full URL of the entry page of the first session, the landing page used in acquisition reporting; web streams only.",
    "page_referrer": "string - Referring URL that brought the user to the site, empty for direct and app traffic; the fallback for first-touch attribution when no campaign parameters are present.",
    "source": "string - First-touch traffic source resolved from utm_source or the referrer; optional to send explicitly and must not be overwritten by later events.",
    "medium": "string - First-touch traffic medium resolved from utm_medium or referrer classification.",
    "campaign": "string - First-touch campaign name resolved from utm_campaign; empty for organic and direct entries.",
    "consent_state": "string - Analytics storage status at the moment of the hit (granted / denied); optional but required to separate observed first visits from modelled ones."
  }




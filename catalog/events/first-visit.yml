Parameters: |
  {
    "ga_session_id": "integer - Identifier of the session in which the first visit occurred; set automatically and used to tie first_visit to its accompanying session_start.",
    "ga_session_number": "integer - Ordinal session count for the client identifier; must be 1 on a genuine first_visit, any other value signals duplicate tagging or identifier churn.",
    "engagement_time_msec": "integer - Foreground engagement time accumulated before the hit was sent; automatic, and the basis for classifying the first session as engaged.",
    "page_location": "string - Full URL of the entry page of the first session, the landing page used in acquisition reporting; web streams only.",
    "page_referrer": "string - Referring URL that brought the user to the site, empty for direct and app traffic; the fallback for first-touch attribution when no campaign parameters are present.",
    "source": "string - First-touch traffic source resolved from utm_source or the referrer; optional to send explicitly and must not be overwritten by later events.",
    "medium": "string - First-touch traffic medium resolved from utm_medium or referrer classification.",
    "campaign": "string - First-touch campaign name resolved from utm_campaign; empty for organic and direct entries.",
    "consent_state": "string - Analytics storage status at the moment of the hit (granted / denied); optional but required to separate observed first visits from modelled ones."
  }

Calculation Notes: |
  1️⃣ Firing condition — the event is emitted by the GA4 tag itself, not by page code: on web it accompanies the first page_view of the first session when no analytics cookie is present for the property; on app streams it fires on the first open after install. It always co-occurs with a session_start carrying ga_session_number = 1, and it must never be pushed manually alongside the automatic one.
  2️⃣ Serialization and dedupe — once per client identifier (web cookie or app instance id), enforced on the device rather than by a server-side check. Report it as distinct identifiers carrying the event, never as an event count, so a duplicated GA4 configuration tag or a double-loaded container cannot inflate New Users.
  3️⃣ Identity caveat — because the gate is the client identifier, cookie clearing, private browsing, ITP/ETP storage capping and any browser or device switch all mint a second first_visit for the same human. Treat it as a per-browser acquisition marker; a person-level "new customer" requires stitching to user_id or the CRM customer record and must be labelled as such in every report.
  4️⃣ Required versus optional parameters — nothing is required of the implementation team beyond correct tag placement; the value sits in the automatic context (ga_session_id, ga_session_number, page_location, page_referrer and the resolved source/medium/campaign) that freezes first-touch attribution. Never overwrite those traffic-source values on later events and never add custom parameters that restate them.
  5️⃣ Consent and PII — under Consent Mode v2 with analytics_storage denied no identifier is written, so the visit arrives cookieless and first_visit is suppressed or behaviourally modelled; New Users in consent-restricted markets is therefore a modelled floor, not a count. No email, hashed email, order id or other personal field belongs on this event, and it must not be reconstructed server-side from a PII-derived key.
  6️⃣ Common instrumentation mistakes — renaming or hand-firing first_visit, mapping it to account creation (that is sign_up), or firing it on every new session (that is session_start); each breaks the once-per-user contract and corrupts every cohort built on it.
  7️⃣ Timing and exclusions — apply the property's internal-traffic and developer-traffic filters before publishing counts, exclude known bot and synthetic-monitoring identifiers, and anchor cohorts on the user's first-touch timestamp rather than the event date, since queued app events and offline sessions can land the hit a day or more after the visit actually happened.

Business Use Case: |
  1️⃣ The Acquisition Marketing manager reviews first_visit volume split by first-touch source/medium, campaign and landing page in the Monday channel stand-up, and shifts paid budget toward the channels that actually deliver new users instead of re-engaging the existing base.
  2️⃣ The Lifecycle/CRM team anchors acquisition cohorts on the first-visit date to track time to first purchase and cohort value by entry channel, and uses that to set the send date and offer strength of the welcome programme.
  3️⃣ The Merchandising team builds a first-visit audience to serve new-visitor landing experiences and first-order incentives, then compares its conversion against returning visitors before rolling the treatment sitewide.
  4️⃣ Marketing Operations monitors the first_visit to session_start ratio daily; a spike in first_visit without a matching session_start movement triggers a tagging review for duplicate configuration tags, cookie churn or a consent-banner change before the numbers reach the executive dashboard.


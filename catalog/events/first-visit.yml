Event Name: First Visit
Event Serialization: once per user

Description: |
  First Visit is the GA4 first_visit event, collected automatically the first time a browser or app instance loads the measurement tag with analytics storage available, and it marks the acquisition moment that starts a user's lifecycle on the digital property. It is deliberately narrower than session_start, which fires at the beginning of every session including the first: first_visit fires once in the lifetime of a client identifier, which is why New Users, New vs Returning User and First Touch Channel Grouping are built on it rather than on session counts.

Category: Acquisition

Tags: [event, E-commerce: Top-of-Funnel & Marketing Acquisition, Acquisition, GA4]

Industry: E-commerce

Priority: High

Core Area: Onboarding


Event Type: standard

Aggregation Window: Event, User, Daily, Weekly, Monthly

GA4 Event: |
  first_visit

Adobe Event: |
  s.t() first page view beacon of the visitor's first hit (new visitor is derived server-side from the Experience Cloud ID cookie; no custom link is sent)


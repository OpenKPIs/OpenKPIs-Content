Event Name: Delivery Exception Occurrence
Event Serialization: always

Description: |
  This event tracks instances where a delivery is disrupted due to issues like weather, incorrect address, or recipient unavailability.

Category: Quality

Tags: [event]

Industry: Logistics & Supply Chain

Priority: High


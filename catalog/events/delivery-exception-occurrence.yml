Parameters: |
  {"order_id":"string - unique order ID","timestamp":"string - ISO 8601 format date and time of the exception","exception_id":"string - unique identifier for the exception","exception_type":"string - type of exception (e.g., weather, address issue)"}

Calculation Notes: |
  Ensure exceptions are logged in real-time. Exclude resolved exceptions within 24 hours.

Business Use Case: |
  Executives can analyze delivery exceptions to optimize logistics processes and improve delivery reliability.



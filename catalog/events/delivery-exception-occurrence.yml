Event Name: Delivery Exception Occurrence
Event Serialization: always

Description: |
  This event measures instances where a delivery does not proceed as planned due to unforeseen issues such as weather, incorrect address, or recipient unavailability.

Category: Quality

Tags: [event]

Industry: Logistics & Supply Chain

Priority: High

Core Area: Generic


Event Type: custom

Aggregation Window: Event


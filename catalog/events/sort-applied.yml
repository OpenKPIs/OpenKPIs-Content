Event Name: Sort Applied
Event Serialization: always

Description: |
  Custom sort_apply event, fired when a shopper changes the sort order of a product listing or search results page. It is the sort counterpart of filter_apply (Filter Applied).

Category: Engagement

Tags: [event, E-commerce: Product Discovery & Merchandising (Search/Filters/PDP)]

Industry: E-commerce

Priority: Medium

Core Area: Discovery



Parameters: |
  {
    "sort_option": "string - selected sort order from the fixed taxonomy, e.g. price_asc, newest, best_selling",
    "item_list_id": "string - identifier of the product list or search results list being sorted",
    "item_list_name": "string - readable name of the list being sorted, e.g. Women's Running Shoes",
    "page_type": "string - page template where the sort was applied, e.g. category, search_results",
    "search_term": "string - optional; query behind the results when sorting a search results page",
    "search_results_count": "integer - optional; number of results in the list after the sort"
  }




Parameters: |
  {
    "sort_option": "string - selected sort order from the fixed taxonomy, e.g. price_asc, newest, best_selling",
    "item_list_id": "string - identifier of the product list or search results list being sorted",
    "item_list_name": "string - readable name of the list being sorted, e.g. Women's Running Shoes",
    "page_type": "string - page template where the sort was applied, e.g. category, search_results",
    "search_term": "string - optional; query behind the results when sorting a search results page",
    "search_results_count": "integer - optional; number of results in the list after the sort"
  }

Calculation Notes: |
  ["1️⃣ Fires when a shopper picks a new sort order and the list re-renders; never for the default sort on page load or a re-pick of the active option.","2️⃣ Serialization always: each sort change is a hit. Back-button restores and sort parameters in a landing URL do not fire.","3️⃣ Required: sort_option, item_list_id, item_list_name, page_type. Optional: search_term, search_results_count (search results pages only).","4️⃣ sort_option uses a fixed lowercase taxonomy (price_asc, price_desc, newest, best_selling, top_rated, relevance), not the localized label.","5️⃣ Fires only under analytics consent. search_term is sent after emails and phone numbers are stripped; no user identifiers in parameters.","6️⃣ Common mistakes: firing on pagination or infinite-scroll loads, folding sort into filter_apply, and missing item_list_id on search pages.","7️⃣ A single apply button that commits sort and filters together sends one sort_apply and one filter_apply, never a merged event."]

Business Use Case: |
  ["1️⃣ Merchandising: most shoppers on a category re-sort to price_asc → reviews default ranking and price-band assortment.","2️⃣ Site Search Manager: relevance is often swapped for top_rated on search pages → retunes the ranking model.","3️⃣ Product: sort usage on mobile lags desktop → tests a persistent sort control above the product grid."]


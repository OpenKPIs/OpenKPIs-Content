Calculation Notes: |
  1️⃣ Emit event only after successful save by favorites/collection service.  
  2️⃣ Count valid unsaved-to-saved transitions; deduplicate retries using event_id.  
  3️⃣ Exclude failed requests, canceled interactions, UI-only updates, test traffic, bots, and no-op attempts.  
  4️⃣ Re-saving after confirmed unsave is a new event; assign new event_id.  
  5️⃣ Attribute events to latest qualifying search_id or property view; avoid manufacturing search attribution.  
  6️⃣ Use event_timestamp for occurrence time; quarantine events with impossible timestamps.  
  7️⃣ For authenticated saves, use user_id; for anonymous saves, use anonymous_id under identity-resolution policy.

Business Use Case: |
  The Product and Marketplace teams compare property save rates by market, property type, price band, result position, and source surface to identify inventory and experiences that generate high buyer or renter intent. If mobile search-result saves underperform property-detail saves for otherwise comparable listings, Product can prioritize changes to listing-card content and save controls, while Marketing can create consent-compliant re-engagement audiences for users with recently saved active properties and measure downstream lead, contact, and tour-request conversion.



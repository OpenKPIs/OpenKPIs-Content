  {"city":"string - normalized city associated with the property","browser":"string - normalized browser family for web traffic","user_id":"string - stable pseudonymous account identifier when the user is authenticated; null for anonymous users","bedrooms":"number - advertised bedroom count at the time of the save","currency":"string - three-letter ISO 4217 currency code associated with listing_price","event_id":"string - globally unique identifier used to deduplicate the event","latitude":"number - approved latitude for the property or listing centroid, rounded according to geographic privacy policy","lot_area":"number - advertised land or lot area at the time of the save when applicable","page_url":"string - canonical URL or application route where the save occurred, excluding sensitive query values","platform":"string - delivery platform, such as web, ios, android, or mobile_web","bathrooms":"number - advertised bathroom count at the time of the save","longitude":"number - approved longitude for the property or listing centroid, rounded according to geographic privacy policy","market_id":"string - normalized internal identifier for the property's reporting market","page_type":"string - logical page or screen classification at the time of the save","search_id":"string - identifier linking the save to the originating search execution when applicable","event_name":"string - constant event name; must equal property_saved","floor_area":"number - advertised interior floor area at the time of the save","listing_id":"string - unique identifier for the specific active listing version saved by the user","save_state":"string - resulting persisted state; must equal saved","session_id":"string - unique identifier for the active digital analytics session","app_version":"string - application release version that emitted the event; null for web when unavailable","device_type":"string - normalized device category, such as desktop, mobile, tablet, or connected_device","postal_code":"string - normalized property postal code, subject to approved geographic precision rules","property_id":"string - canonical identifier for the physical property across listings and channels","save_action":"string - action represented by the event; must equal save","save_method":"string - interaction method used to save, such as heart_icon, save_button, keyboard, or automated_rule","anonymous_id":"string - pseudonymous browser or device identifier used before authentication","brokerage_id":"string - internal identifier for the brokerage associated with the listing","country_code":"string - two-letter ISO 3166-1 alpha-2 country code associated with the property","referrer_url":"string - previous URL or route that led to the save surface, excluding sensitive query values","search_query":"string - normalized non-PII search criteria summary, such as location and property filters, when applicable","state_region":"string - normalized state, province, or administrative region associated with the property","collection_id":"string - pseudonymous identifier of the favorites list or collection receiving the property","listing_price":"number - advertised property price at the time of the save in the specified currency","lot_area_unit":"string - unit for lot_area, such as sqft, sqm, acre, or hectare","property_type":"string - normalized property classification, such as single_family, condominium, townhouse, multifamily, land, or rental","experiment_ids":"array<string> - identifiers and assigned variants for experiments active when the save occurred","source_surface":"string - product surface where the save occurred, such as search_results, property_detail, map, recommendations, or comparison","event_timestamp":"string - UTC timestamp in ISO 8601 format when the save state was successfully committed","floor_area_unit":"string - unit for floor_area, restricted to sqft or sqm","property_status":"string - listing status at save time, such as active, pending, contingent, off_market
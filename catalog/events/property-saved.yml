Event Name: Property Saved
Event Serialization: always

Description: |
  Measures each successful user action that changes an active property listing from an unsaved state to a saved state in a favorites list or collection. It captures the property, user or anonymous visitor, discovery context, market attributes, and application context needed to analyze high-intent engagement.

Category: Engagement

Tags: [event]

Industry: Real Estate Tech

Priority: High

Core Area: Engagement


Event Type: custom

Aggregation Window: Event, Session, User, and Time based - Hourly/Daily/Monthly/Yearly


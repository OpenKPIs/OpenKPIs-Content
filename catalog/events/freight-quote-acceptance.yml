  {"lane_id":"string - standardized origin-to-destination lane identifier","quote_id":"string - unique identifier of the freight quote","carrier_id":"string - selected carrier identifier when the accepted quote is carrier-specific","contract_id":"string - identifier of the governing customer contract when applicable","rate_source":"string - governed source of the accepted rate, such as contract, tariff, spot, carrier_api, or manual","promotion_id":"string - identifier of a digital promotion or incentive applied to the quote","quote_number":"string - business-facing reference for the freight quote","acceptance_id":"string - unique identifier of the persisted acceptance transaction","source_system":"string - code identifying the digital platform that committed acceptance","commodity_code":"string - governed commodity classification associated with the quote","correlation_id":"string - identifier used to trace the transaction across the digital channel and quoting services","equipment_type":"string - equipment or container type specified by the accepted quote","schema_version":"string - version of the event payload schema","transport_mode":"string - governed transportation mode code","quoted_currency":"string - ISO 4217 currency code for all quoted monetary values","accepted_by_role":"string - governed role of the accepting actor, such as customer, broker, or authorized_agent","quote_version_id":"string - unique identifier of the exact commercial quote version accepted","acceptance_status":"string - normalized resulting status, required to equal accepted","quoted_tax_amount":"number - total tax included in the accepted quote","acceptance_channel":"string - governed digital channel such as web_portal, mobile_app, api, or edi","digital_session_id":"string - digital analytics session identifier associated with the acceptance journey","origin_location_id":"string - governed identifier of the quoted shipment origin","quoted_base_charge":"number - accepted base transportation charge before accessorials, taxes, and discounts","service_level_code":"string - governed code for the accepted transportation service level","shipper_account_id":"string - identifier of the shipping account when different from the customer account","acceptance_event_id":"string - globally unique identifier for the committed acceptance event","accepted_by_user_id":"string - tokenized or access-controlled identifier of the authenticated accepting user","customer_account_id":"string - unique identifier of the customer account associated with the quote","quoted_total_amount":"number - total customer charge committed at acceptance","acceptance_timestamp":"string - ISO 8601 UTC timestamp when the authoritative platform committed acceptance","accepted_by_party_id":"string - identifier of the customer or partner organization accepting the quote","previous_quote_status":"string - normalized quote status immediately before acceptance","pricing_strategy_code":"string - governed identifier of the pricing strategy or rate program","estimated_carrier_cost":"number - estimated fulfillment cost captured by the pricing platform at acceptance","quoted_discount_amount":"number - total discount applied to the accepted quote","destination_location_id":"string - governed identifier of the quoted shipment destination","estimated_margin_amount":"number - estimated commercial margin snapshot captured at acceptance","quote_created_timestamp":"string - ISO 8601 UTC timestamp when the accepted quote version was created","estimated_margin_percent":"number - estimated margin percentage stored by the pricing platform at acceptance","quote_presented_timestamp":"string - ISO 8601 UTC timestamp when the accepted quote version was first presented digitally","quoted_accessorial_charge":"number - total accepted accessorial charge","quote_expiration_timestamp":"string - ISO 8601 UTC timestamp after which the quote version is no longer valid","source_record_updated_timestamp":"string - ISO 8601 UTC timestamp of the source record used to produce the event"}

Calculation Notes: |
  1️⃣ Count only successful server-side transitions of a specific quote version from an eligible presented or offered state to accepted.
  2️⃣ Deduplicate transport retries using acceptance_event_id; if unavailable, use source_system, quote_version_id, acceptance_id, and acceptance_status.
  3️⃣ Retain the earliest valid acceptance for a quote version as canonical; record a later reinstatement only when it follows a governed reversal event.
  4️⃣ Exclude client clicks, abandoned attempts, failed API responses, pending approvals, test traffic, pricing simulations, and administrative status repairs.
  5️⃣ Exclude acceptances committed after expiration unless the source contains an approved extension effective at the acceptance timestamp.
  6️⃣ Calculate digital time to acceptance from quote_presented_timestamp, falling back to quote_created_timestamp only when presentation time is unavailable.
  7️⃣ Preserve monetary values and pricing attributes as acceptance-time snapshots; record cancellations, reversals, and commercial corrections as linked events rather than overwriting the acceptance.

Business Use Case: |
  Revenue Management monitors digital acceptance rate, accepted value, response time, and margin by channel, customer, lane, mode, and pricing strategy. When a high-traffic digital lane has weak acceptance, the team can adjust rate rules or service options; when acceptance is strong but margin is below threshold, it can tighten discount controls or route subsequent quotes through a higher-margin pricing strategy.



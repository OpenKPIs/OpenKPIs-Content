Event Name: Freight Quote Acceptance
Event Serialization: always

Description: |
  Records the authoritative digital acceptance of a specific freight quote version after the quoting platform successfully commits the accepted status. It measures digital quote conversion, accepted commercial value, and time to acceptance while excluding clicks, failed requests, pending approvals, and other noncommitted attempts.

Category: Conversion

Tags: [event]

Industry: Other

Priority: High

Core Area: Monetization


Event Type: custom

Aggregation Window: Event and Time based - Hourly/Daily/Monthly/Yearly


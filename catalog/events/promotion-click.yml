Parameters: |
  {
    "promotion_id": "string - Stable identifier of the promotion as registered in the campaign or offer system; the join key back to Promotion View and forward to campaign reporting.",
    "promotion_name": "string - Governed, human-readable promotion name such as 'Summer Sale 30% Off', shared with the paid media naming convention so on-site and off-site reporting reconcile.",
    "creative_name": "string - Name and version of the activated creative asset, distinguishing design variants of the same promotion during experiments and refreshes.",
    "creative_slot": "string - Placement position of the creative within the page template, such as 'homepage_hero_1' or 'plp_banner_top'; values come from the same fixed slot taxonomy used on the impression.",
    "location_id": "string - Surface on which the creative was served (page type, list, locale or store context), required when one creative runs in several placements.",
    "items": "array - Optional list of products promoted by the activated creative (item_id, item_name, item_brand, price, index); sent only when the creative links to specific SKUs."
  }

Calculation Notes: |
  1️⃣ Fires on deliberate activation of the creative — primary mouse click, touch tap, Enter or Space on a focused element, and modifier or middle clicks that open a new tab — and it fires before navigation, not after the destination page loads. Send it with a beacon or keep-alive transport, or hold the navigation on an event callback with a short timeout, so the hit survives unload on slow devices; never rely on the destination page to report the click back.
  2️⃣ Serialization is once per deliberate activation, so the event is allowed to repeat within a page view and within a session. Bind the handler to the outermost creative container and stop propagation there: a banner whose wrapper, image anchor and CTA button are each clickable must emit exactly one event, and a repeat activation of the same promotion_id and creative_slot inside roughly one second (double-click, rage-click, touch plus synthetic click) is suppressed as a duplicate.
  3️⃣ Required parameters are promotion_id, promotion_name, creative_name and creative_slot, with location_id required whenever the same creative runs in more than one placement or locale; the items array stays optional and is sent only when the creative links to specific SKUs. Every value must be byte-identical to the one sent on the paired Promotion View — any drift in casing, versioning or slot label silently breaks the impression-to-click join and makes click-through unreportable.
  4️⃣ Excluded from collection: programmatic activations that no shopper made (carousel auto-advance, personalisation or test scripts calling click()), clicks on surrounding chrome such as carousel arrows, pagination dots and dismiss controls, activations of an expired or disabled creative that does not navigate, and bot, pre-render and automated traffic. Clicks on paid media placements belong to campaign reporting and are never collected here.
  5️⃣ No personal data belongs in the payload. promotion_id, creative_name and creative_slot must be catalogue values from the campaign and merchandising systems rather than personalised strings, and no identifier from the destination URL query string is copied into the event; collection is suppressed while analytics consent is denied, on the same basis as Promotion View, so numerator and denominator are never drawn from different consent populations.
  6️⃣ The event belongs to the page view and session in which the creative was exposed. Stamp it at the moment of activation and dispatch it before a single-page-application route change rewrites page context; when the destination opens in a new tab the event still belongs to the originating page, not to the new one.
  7️⃣ The recurring instrumentation faults are firing on hover or on impression rather than on activation, losing the hit to navigation because no beacon transport was configured, emitting several events from nested clickable regions of one creative, letting creative_slot labels diverge between templates, and replacing the standard event with a KPI-shaped custom name such as 'banner_ctr' that cannot be joined to the impression.

Business Use Case: |
  1️⃣ The Onsite Merchandising Manager reviews the weekly promotion report, ranks each creative_slot by clicks earned against the impressions it received, and moves the strongest offer into the hero slot while retiring creatives that draw exposure but no engagement before the next campaign drop.
  2️⃣ The Campaign Marketing Manager checks clicks by creative_name within the first 48 hours of a launch, identifies the copy or imagery variant shoppers actually respond to, and pushes that variant to the remaining placements while the campaign is still live.
  3️⃣ The Product team running banner and hero experiments uses the click as the primary success event against Promotion View as the exposure denominator, and only declares a winning creative once both variants show a comparable impression base.
  4️⃣ Revenue Management joins promotion clicks to the orders and discount cost that follow them, and reallocates prime placement and promotional inventory toward the offers that convert clicks into margin rather than those that simply attract them.


# Event: Promotion Click
# Generated: 2026-09-20T20:33:05.585Z
# Contributed by: devyendarm


Event Name: Promotion Click
Event Serialization: always

Description: |
  Promotion Click is the standard ecommerce select_promotion event, recorded when a shopper deliberately activates an internal promotional creative such as a hero banner, carousel slide, category tile or offer module, and it carries the same promotion_id, promotion_name, creative_name, creative_slot and location_id as the impression that preceded it. It is the click half of the on-site campaign funnel and the agreed numerator for Promotion Click-Through Rate, so every promotion, creative variant and placement can be judged on the engagement it earns from the exposure it was given.

Category: Acquisition



















    
    
    
    
    
    
    
    
    

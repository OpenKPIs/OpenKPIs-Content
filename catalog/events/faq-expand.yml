Parameters: |
  {
    "content_type": "string - type of content selected, always 'faq' for this event",
    "item_id": "string - stable CMS identifier of the FAQ entry",
    "faq_question": "string - question text as published in the CMS",
    "faq_category": "string - FAQ topic group, e.g. returns, shipping, payments, sizing",
    "faq_position": "number - 1-based position of the entry in its list",
    "page_location": "string - full URL of the page showing the FAQ",
    "page_type": "string - page template, e.g. faq, product, cart, order_status",
    "content_group": "string - site section the page belongs to",
    "search_term": "string - site-search query that led to the entry, when present"
  }

Calculation Notes: |
  ["1️⃣ Fires on a user-initiated expand of one FAQ entry; never on page load, on collapse, or for entries rendered already open.","2️⃣ Serialization always: every expand is a hit. Dedupe on item_id within a session to count unique questions viewed.","3️⃣ Required: content_type, item_id, faq_question, faq_category, page_location. Optional: faq_position, page_type, content_group, search_term.","4️⃣ item_id is the stable CMS key; localized question text never serves as the id, so one question reports as one row across languages.","5️⃣ No PII: faq_question is CMS text. Strip emails and order numbers from search_term; send only under analytics consent.","6️⃣ Common mistake: one listener on the whole accordion fires a hit per entry on a single click; bind it to each entry's toggle."]

Business Use Case: |
  ["1️⃣ Customer Service: returns-policy FAQ views jump after a policy change → rewrite the answer and watch return contacts.","2️⃣ Support Content Manager: an FAQ view is often followed by a contact form in-session → rewrite that answer.","3️⃣ Help Center Product Manager: top-viewed FAQs sit low by faq_position → move them to the top of the list."]


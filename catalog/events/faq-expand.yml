Event Name: FAQ Expand
Event Serialization: always

Description: |
  Fires when a shopper expands an FAQ entry to read its answer, on the FAQ page or an inline accordion on PDP, cart or order pages. Full help articles use help-article-view.

Category: Experience

Tags: [event, E-commerce: Returns, Refunds & Customer Support]

Industry: E-commerce

Priority: Medium

Core Area: Engagement


Event Type: standard

Aggregation Window: Event, Session, Daily


Event Name: Product View
Event Serialization: always

Description: |
  Fires when a shopper renders a Product Detail Page, capturing the full item payload (identifier, name, category, brand, variant and price) as the primary signal of interest in a specific product. It anchors product-level engagement analysis and is the entry event for the PDP-to-cart funnel.

Category: Engagement

Tags: [event, E-commerce: Product Discovery & Merchandising (Search/Filters/PDP)]

Industry: E-commerce

Priority: High

Core Area: Discovery

Scope: Event

Event Type: standard

Aggregation Window: Event


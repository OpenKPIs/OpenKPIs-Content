Parameters: |
  {
    "content_type": "string - Content classification of the rendered page; 'help_article' or 'faq' qualifies the page_view as a help article view",
    "article_id": "string - Stable knowledge base article identifier from the help center platform (Zendesk Guide article ID, Salesforce Knowledge article number); shared across locales",
    "article_title": "string - Published article title in the rendered locale, for readable reporting only; joins must use article_id",
    "article_category": "string - Top-level help taxonomy node, e.g. 'returns_refunds', 'order_tracking', 'shipping_delivery', 'payments', 'sizing_fit', 'account'",
    "article_section": "string - Second-level section within the category, e.g. 'return_eligibility', 'refund_timelines'",
    "article_locale": "string - BCP 47 locale of the rendered translation, e.g. 'en-US', 'fr-FR'",
    "article_version": "string - Published revision identifier or last-updated date of the article at render time",
    "article_status": "string - Lifecycle state at render time: 'published' or 'archived'",
    "display_surface": "string - Where the article was rendered: 'help_center', 'web_widget', 'chat_suggestion', 'order_status_page', 'in_app_help'",
    "entry_point": "string - How the shopper arrived: 'help_search', 'category_browse', 'contact_form_suggestion', 'order_page_link', 'external_search', 'email_link'",
    "search_term": "string - Help center search query that led to the article when entry_point is 'help_search'; must be scrubbed of order numbers, emails and phone numbers before collection",
    "has_open_order": "boolean - True when the logged-in shopper has an order not yet delivered or a return in progress at the time of the view",
    "login_status": "string - 'logged_in' or 'guest', used to scope stitched deflection analysis"
  }




# Event: Help Article View
# Generated: 2026-09-18T16:52:05.129Z
# Contributed by: devyendarm


Event Name: Help Article View
Event Serialization: always

Description: |
  Fires each time a shopper renders a help center, FAQ or knowledge base article (returns policy, refund timelines, order tracking, sizing, payment issues) on the storefront help center or in an embedded support widget, captured as a unified page_view with content_type set to 'help_article' or 'faq' plus article_id and article_category. It is the numerator event for Self-Service Rate, Self-Service Score and Ticket Deflection Rate, letting Customer Service quantify how much post-purchase demand is resolved by content before it becomes an agent-handled contact.

Category: Experience



















    
    
    
    
    
    
    
    
    

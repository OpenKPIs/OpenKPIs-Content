Event Name: Digital Check-In Completed
Event Serialization: once per stay

Description: |
  Records the authoritative completion of a guest's digital check-in journey after all required identity, reservation, payment, and policy validations have succeeded in a web or mobile channel. It measures successful digital conversion into a check-in-ready state and excludes button clicks, intermediate submissions, failed validations, and staff-completed check-ins.

Category: Conversion

Tags: [event]

Industry: Travel & Hospitality

Priority: High

Core Area: Onboarding


Event Type: custom

Aggregation Window: Event


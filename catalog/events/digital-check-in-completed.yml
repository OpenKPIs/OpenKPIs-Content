Parameters: |
  {"browser":"string - normalized browser family and major version when the channel is web-based","stay_id":"string - unique identifier for the guest stay used as the primary completion serialization key","event_id":"string - globally unique identifier for the event activation, used for idempotency and duplicate suppression","platform":"string - digital platform family such as web, iOS, or Android","device_type":"string - normalized device class such as mobile, tablet, desktop, or kiosk","entry_point":"string - controlled origin that initiated the journey, such as manage_booking, pre_arrival_email, push_notification, or digital_key","property_id":"string - enterprise identifier for the hotel, resort, or lodging property","adults_count":"integer - number of adult guests represented in the digital check-in submission","itinerary_id":"string - identifier linking the reservation to its broader digital travel itinerary","loyalty_tier":"string - normalized loyalty tier effective when digital check-in was completed","check_in_date":"date - property-local calendar date on which the booked stay begins","event_version":"string - semantic version of the event contract used to validate payload compatibility","application_id":"string - identifier for the website or mobile application that generated the event","check_out_date":"date - property-local calendar date on which the booked stay ends","children_count":"integer - number of child guests represented in the digital check-in submission","property_brand":"string - commercial brand under which the property operates","reservation_id":"string - protected internal identifier for the reservation associated with the completed check-in","confirmation_id":"string - unique identifier returned by the digital check-in service for the confirmed completion","event_timestamp":"timestamp - UTC date and time when the digital check-in platform confirmed successful completion","check_in_channel":"string - controlled channel value such as mobile_app, mobile_web, desktop_web, or kiosk_web","operating_system":"string - device operating-system family and normalized major version","completion_status":"string - terminal status that must equal completed for a valid event","digital_session_id":"string - identifier for the web or mobile analytics session in which completion occurred","property_time_zone":"string - IANA time-zone identifier used to interpret property-local dates and times","application_version":"string - deployed application version associated with the completed journey","journey_instance_id":"string - unique identifier connecting all digital check-in interactions belonging to one journey attempt","page_or_screen_name":"string - canonical page or application screen from which completion was confirmed","anonymous_visitor_id":"string - pseudonymous browser or application visitor identifier available before authentication","completion_date_time":"timestamp - UTC date and time at which all digital check-in requirements were successfully completed","rooms_in_reservation":"integer - total number of rooms included in the reservation at completion time","check_in_flow_version":"string - version of the digital check-in workflow, rules, and user experience","guests_in_reservation":"integer - total number of registered guests included in the reservation at completion time","loyalty_member_status":"string - normalized status indicating whether the authenticated guest is an enrolled loyalty member","property_country_code":"string - ISO 3166-1 alpha-2 country code of the property","room_selection_method":"string - method used to determine the room, such as guest_selected, auto_assigned, preference_matched, or pending_assignment","booking_reference_hash":"string - one-way hashed booking reference used for privacy-preserving reservation correlation","room_assignment_status":"string - controlled status indicating whether a room was assigned, selected, pending, or unavailable","digital_key_eligibility":"boolean - indicates whether the completed stay satisfies digital-key eligibility rules","terms_acceptance_status":"string - status confirming acceptance of required registration terms, policies, or property rules","consent_analytics_status":"string - analytics consent state applied when collecting and processing the event","authenticated_customer_id":"string - protected enterprise customer identifier associated with the authenticated guest, when available","digital_key_issued_status":"string - status indicating whether a digital key was issued, pending, unavailable, or not requested","completion_local_date_time":"timestamp - completion date and time expressed in the property's local time zone","payment_verification_status":"string - status indicating whether the payment instrument required for check-in was validated or not required","scheduled_arrival_date_time":"timestamp - guest-provided or reservation-derived expected arrival time, normalized to UTC","identity_verification_method":"string - method used to verify the primary guest, such as account_match, document_scan, biometric_match, or reservation_questions","identity_verification_status":"string - terminal identity validation result, expected to be verified or not_required for completion","document_verification_provider":"string - approved digital verification service used to validate identity documents, without transmitting document contents","incidental_authorization_status":"string - status of any digitally requested incidental deposit or payment authorization"}

Calculation Notes: |
  1️⃣ Emit event only after durable successful state and confirmation identifier received.  
  2️⃣ Deduplicate retries using event_id; enforce one completion per stay_id.  
  3️⃣ Retain earliest valid completion timestamp unless prior event is invalidated.  
  4️⃣ Count one event for multi-room reservations upon entire stay confirmation.  
  5️⃣ Exclude specific completions: staff-assisted, call-center, offline imports, etc.  
  6️⃣ Use property_time_zone for stay dates; retain UTC timestamps for sequencing.  
  7️⃣ Do not transmit sensitive information (identity documents, payment credentials, etc.).

Business Use Case: |
  The Digital Guest Experience team compares completion rate, completion time, and digital-key issuance across properties, application versions, entry points, and verification methods. If a new mobile release produces lower completion for guests requiring document verification, the product owner can halt rollout, route affected users to a validated alternative flow, and prioritize remediation before the issue increases front-desk demand.



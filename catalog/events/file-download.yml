Event Name: File Download
Event Serialization: always

Description: |
  GA4 enhanced-measurement file_download event, fired when a user clicks a link to a document such as an order invoice or receipt PDF. It carries file_name, file_extension and link_url.

Category: Engagement

Tags: [event, E-commerce: Post-Purchase Logistics & Fulfillment]

Industry: E-commerce

Priority: Medium

Core Area: Engagement


Event Type: standard

Aggregation Window: Event, Daily, Weekly, Monthly

GA4 Event: |
  file_download

Adobe Event: |
  file_download


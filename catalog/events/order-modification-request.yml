Event Name: Order Modification Request
Event Serialization: Count distinct source_namespace + modification_id; use the latest record_revision for corrected reporting.

Description: |
  Records acceptance or rejection of a request to change items in a placed order, helping teams understand editing demand and barriers. Approval does not necessarily mean the change was applied.

Category: Operations

Tags: [Order Management, Post-Purchase, Order Editing]

Industry: E-commerce, Retail

Priority: Medium

Core Area: Post-Purchase Order Management

Scope: Event

Event Type: custom

Aggregation Window: Event, Daily, Weekly, Monthly

GA4 Event: |
  Collect custom event order_modification_request. Explicitly map scalar parameters; encode applied_at_decision as 1/0. Register decision, request_channel and rejection_reason as event-scoped custom dimensions when needed. Keep IDs for export joins. requested_changes is tag input only: omit the object array from collection and join commerce details by source_namespace and modification_id. Preserve decision_time; backdate only within supported limits. Use no ecommerce object. Native counts and dimensions may include duplicate deliveries or stale initial snapshots; corrected reporting requires the canonical source.

Adobe Event: |
  Listen for order_modification_request in Adobe Client Data Layer. Allocate an available Analytics custom counter and map scalars to configured variables, or configure Web SDK collection. A layer push alone sends no analytics. Declare an XDM field group under the organization's tenant namespace; _openkpis illustrates that namespace and must be adapted before ingestion. requested_changes is an object array: type, line_id, old_sku, old_variant, new_sku and new_variant are strings; before_qty and after_qty are nonnegative integers. Types are add, remove, quantity and variant; absent identities use empty strings and absent quantities use zero. _id uses length-prefixed namespace and request ID; timestamp equals decision_time. An Analytics counter cannot retain operation detail, and XDM _id alone does not serialize Analytics events.


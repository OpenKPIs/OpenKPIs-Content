Event Name: Order Modification Request
Event Serialization: always

Description: |
  Standard submit_form event with form_type = order_modification, fired when the order system answers a line-item edit. Address edits are Shipping Address Change (before label) or Delivery Preference Update (after).

Category: Operations

Tags: [event, E-commerce: Post-Purchase Logistics & Fulfillment]

Industry: E-commerce

Priority: Medium

Core Area: Generic


Event Type: standard

Aggregation Window: Event, Daily, Weekly, Monthly


Parameters: |
  {
    "source_namespace": "string, required: documented commerce-system namespace scoping order and request IDs.",
    "modification_id": "string, required: stable request ID; retries reuse it; new requests receive new IDs.",
    "transaction_id": "string, required: original placed-order ID within source_namespace; never the request deduplication key.",
    "record_revision": "integer, required: starts at 1; increases for each correction; retries preserve the revision.",
    "decision_time": "datetime, required: original definitive decision time in UTC; preserve through retries and corrections.",
    "decision": "string, required: accepted or rejected; exclude pending and partially accepted requests.",
    "request_channel": "string, required: web, app or agent; require equivalent definitive decision coverage.",
    "requested_changes": "array, required: proposed operation objects; structure and types are defined in adobe_event.",
    "currency": "string, required: ISO 4217 order currency; sum deltas separately unless a conversion rule is configured.",
    "applied_at_decision": "boolean, required: true only for an accepted change confirmed applied at decision time.",
    "value_delta": "number, required: revised merchandise total minus previous merchandise total if applied; otherwise zero.",
    "previous_merchandise_total": "number, required if applied: whole-order total before change, after discounts, excluding tax and shipping.",
    "revised_merchandise_total": "number, required if applied: whole-order total after change, after discounts, excluding tax and shipping.",
    "rejection_reason": "string, required for rejection: controlled reason code such as already_picked; omit for acceptance.",
    "order_status": "string, optional: controlled original-order state at decision time."
  }

Calculation Notes: |
  1️⃣ Count one atomic final decision per request at decision_time, regardless of lines. Exclude opens, drafts, pending and technical failures.
  2️⃣ Send the initial snapshot only. Retries reuse IDs; quarantine missing IDs. Corrections replace prior revisions without adding counts.
  3️⃣ Exclude cart edits, cancellations, returns, refunds and delivery-only changes. Removing all items cancels; reversals add no request.
  4️⃣ Keep each proposed operation and stable line ID, including mixed or rejected changes. Approval does not prove application.
  5️⃣ Rejected or unapplied requests have zero delta. Later application adds no request; use financial records for later values.
  6️⃣ Gate delivery on consent and access rules in every channel. Omit customer IDs, personal details and free text; order IDs remain linkable.
  7️⃣ Use configured edit windows. Browser coverage is incomplete. CEDDL attributes are extensions; canonical records govern corrected reports.

Business Use Case: |
  1️⃣ Identify common reasons customers cannot change placed orders.
  2️⃣ Compare self-service and assisted requests to improve order editing.
  3️⃣ Track demand for item additions, removals, quantity changes and variant changes.


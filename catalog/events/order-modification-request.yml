Parameters: |
  {
    "form_type": "string - fixed value order_modification",
    "transaction_id": "string - ID of the original order, matching the purchase transaction_id",
    "modification_id": "string - unique ID the order system returns for this edit request; dedupe key",
    "modification_type": "string - item_add, item_remove, quantity_change or variant_change",
    "form_status": "string - accepted or rejected, as returned by the order system",
    "items": "array - changed lines only: item_id, item_name, item_variant, price, quantity (new quantity; 0 if removed)",
    "currency": "string - ISO 4217 code of the order",
    "value_delta": "number - signed change in order value from this edit; negative for reductions, 0 if rejected",
    "rejection_reason": "string - optional; already_picked, already_shipped, out_of_stock or payment_failed",
    "request_channel": "string - optional; web, app or agent",
    "user_id": "string - optional; hashed internal customer ID"
  }

Calculation Notes: |
  1️⃣ Fires when the order system answers an edit request against a placed order, accepted or rejected; never when the edit form opens.,2️⃣ Serialization always: one hit per request. Dedupe on modification_id so a reload of the confirmation view does not re-fire.,3️⃣ Required: form_type, transaction_id, modification_id, modification_type, form_status, items, currency, value_delta.,4️⃣ Optional: request_channel (agent edits are sent server-side), rejection_reason (rejected requests only), user_id.,5️⃣ Not fired for full cancellation (Order Cancellation) or address edits: Shipping Address Change pre-label, Delivery Preference Update after.,6️⃣ Analytics consent gates the hit. user_id is the hashed internal ID; never send name, email or address in any parameter.,7️⃣ Common mistake: sending the whole order in items. Send changed lines only, quantity = new quantity (0 if removed); value_delta signed.

Business Use Case: |
  1️⃣ Fulfillment Ops: many requests rejected as already_picked → lengthens the edit window before pick release.,2️⃣ Merchandising: variant_change clusters on one product → fixes its size guide or variant imagery.,3️⃣ Customer Service: agent-channel share rises → adds self-service order editing to the order status page.,4️⃣ Finance: sums value_delta by week → reconciles booked revenue against edited order totals.


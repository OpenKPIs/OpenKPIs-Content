Parameters: |
  {
    "method": "string - Destination the share was routed to, using the GA4 `method` convention: facebook, instagram, x, pinterest, whatsapp, messenger, sms, email, native_share_sheet, copy_link. Social networks, messaging apps, the OS share sheet and copy-link are values of this parameter, never separate events.",
    "content_type": "string - Object being shared: product, cart, wishlist, order, collection, article, review. Drives whether item_id resolves to a SKU or to a basket/list identifier.",
    "item_id": "string - SKU or catalogue product ID when content_type = product; cart, wishlist or order identifier for basket-level shares; null for editorial pages with no catalogue object.",
    "item_category": "string - Merchandising category hierarchy of the shared item at share time, aligned to the item-category dimension; null for non-catalogue shares.",
    "share_surface": "string - UI affordance that raised the share: pdp_share_button, gallery_share, wishlist_share, cart_share, order_confirmation, article_footer, app_native_menu.",
    "customer_lifecycle_stage": "string - Lifecycle state of the sharer at event time: prospect, first_time_buyer, repeat_buyer, loyalty_member, lapsed. Null for unauthenticated visitors with no resolved customer record.",
    "loyalty_tier": "string - Loyalty programme tier of a signed-in sharer (e.g. base, silver, gold, elite); null for anonymous visitors and non-members."
  }




Parameters: |
  {
    "method": "string - Destination the share was routed to, using the GA4 `method` convention: facebook, instagram, x, pinterest, whatsapp, messenger, sms, email, native_share_sheet, copy_link. Social networks, messaging apps, the OS share sheet and copy-link are values of this parameter, never separate events.",
    "content_type": "string - Object being shared: product, cart, wishlist, order, collection, article, review. Drives whether item_id resolves to a SKU or to a basket/list identifier.",
    "item_id": "string - SKU or catalogue product ID when content_type = product; cart, wishlist or order identifier for basket-level shares; null for editorial pages with no catalogue object.",
    "item_category": "string - Merchandising category hierarchy of the shared item at share time, aligned to the item-category dimension; null for non-catalogue shares.",
    "share_surface": "string - UI affordance that raised the share: pdp_share_button, gallery_share, wishlist_share, cart_share, order_confirmation, article_footer, app_native_menu.",
    "page_type": "string - Template type of the page the share was raised from, aligned to the page-type dimension (product, category, cart, wishlist, order_confirmation, article). Maps to web.webPageDetails.siteSection in XDM.",
    "customer_lifecycle_stage": "string - Lifecycle state of the sharer at event time: prospect, first_time_buyer, repeat_buyer, loyalty_member, lapsed. Null for unauthenticated visitors with no resolved customer record.",
    "loyalty_tier": "string - Loyalty programme tier of a signed-in sharer (e.g. base, silver, gold, elite); null for anonymous visitors and non-members."
  }

Calculation Notes: |
  1️⃣ One standard event, many surfaces: social networks, messaging apps, the native OS share sheet and copy-link are all values of `method` on a single `share` event. Per-surface events (share_facebook, copy_link, whatsapp_share) are non-conformant and must be remapped at the tag layer, otherwise channel totals double count and the schema grows with every new network — coverage of those surfaces is therefore complete, not missing.,2️⃣ Intent, not delivery: the browser reports that the share dialog or `navigator.share()` call was invoked, not that a post was published. Sheet cancellations and promise rejections are indistinguishable on most platforms, so read volumes as share intent and expect a 5–15% gap against platform-side post counts; never reconcile this event to network-reported posts as if it were the same measure.,3️⃣ De-duplication and exclusions: serialize once per user, item_id and method within a session, suppressing repeats on the same target inside a 30-second window to absorb double taps and client re-renders. Exclude events from internal IP ranges, QA accounts and link-preview crawlers, which trigger share endpoints without a human actor.,4️⃣ Sessionisation and timing: the standard 30-minute inactivity timeout with midnight and campaign-change boundaries applies. A dialog opened before the boundary and completed after it belongs to the later session, so anchor every attribution on the `share` event timestamp rather than on the preceding page view or product view.,5️⃣ Self-directed shares are counted but flagged: email-to-self, copy-link pasted within the same session, and wishlist sends that are in fact gift registries remain valid `share` events but must stay identifiable through `method` and `share_surface` (content_type = wishlist, share_surface = registry) so advocacy reporting can exclude them from true peer-to-peer counts.,6️⃣ Outbound advocacy only: sessions arriving on the shared URL are classified by session source/medium, campaign parameters or the share link's tracking id and are never joined back onto this event as a referral or conversion field. Share-assisted revenue is produced by a separate attribution model and does not belong on this row.,7️⃣ Value action by industry: E-commerce = product, cart or wishlist share; Retail = store availability or pick-up page share; Media = article or episode share; SaaS = report or dashboard share; Finance = statement or calculator result share; Education = course or certificate share; Travel = itinerary share.

Business Use Case: |
  1️⃣ The Loyalty & CRM Manager (Marketing) reviews share counts by customer_lifecycle_stage each week; where loyalty members share at two or more times the rate of first-time buyers, they surface the share module in the post-purchase email and the member dashboard for that cohort, and pull it from lapsed-customer journeys where it under-delivers against the programme benchmark.,2️⃣ The Merchandising Manager ranks SKUs every Monday by shares per 1,000 product views; top-decile SKUs not yet in the paid social catalogue feed are handed to the Paid Social team as creative candidates, while SKUs with high shares but weak add-to-cart performance are queued for PDP content, imagery or price review.,3️⃣ The Social Media Lead monitors the `method` mix daily by device; when copy_link overtakes in-page network buttons on mobile, they reorder the share tray and raise a Product ticket to expose the native share sheet on mobile PDPs, then confirm the shift in mix in the following week's report.,4️⃣ The Customer Insights Lead in the Retention team builds a quarterly cohort comparing sharers with non-sharers matched on recency, order count and acquisition channel, measuring 12-month repeat purchase rate and customer lifetime value; where the sharer lift survives matching, they defend the advocacy budget line and set the share-rate target in the loyalty roadmap.


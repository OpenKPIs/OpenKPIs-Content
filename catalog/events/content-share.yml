Event Name: Content Share
Event Serialization: always

Description: |
  Fires when a shopper sends a product, cart, wishlist, order or editorial page outward to a social network, a messaging app, the native OS share sheet or a copied link, captured as the single GA4 `share` event with the destination carried in the `method` parameter rather than as separate per-surface events. It quantifies outbound advocacy only — who shares, what they share and from which surface — cut by the sharing session's acquisition context (the GA4 session last-click source / medium; in Adobe the marketing channel type of the session's entry hit). Inbound traffic and revenue arriving on a shared URL are attributed separately through session source/medium and campaign reporting, so this event deliberately carries no referral or referred-conversion fields.


# Event: Content Share
# Generated: 2026-09-17T23:36:02.603Z
# Contributed by: devyendarm


Event Name: Content Share
Event Serialization: always

Description: |
  Fires when a shopper sends a product, cart, wishlist, order or editorial page outward to a social network, a messaging app, the native OS share sheet or a copied link, captured as the single GA4 `share` event with the destination carried in the `method` parameter rather than as separate per-surface events. It quantifies outbound advocacy only — who shares, what they share and from which surface — while inbound traffic and revenue arriving on a shared URL are attributed through session source/medium and campaign reporting, so this event deliberately carries no referral or referred-conversion fields.

Category: Engagement



















    
    
    
    
    
    
    
    
    

Event Name: Product List Click
Event Serialization: always

Description: |
  Product List Click is the standard ecommerce select_item event, recorded when a shopper deliberately selects one product tile from a rendered list such as a category grid, search results page, recommendation carousel or cross-sell module, and it carries the list identity (item_list_id, item_list_name) together with the selected item and its position in the list. Paired with the view_item_list impressions of Product List View it forms the numerator of Product List Click-Through Rate, and it is the anchor for list attribution, crediting downstream product views, cart adds and revenue to the list and slot that produced them.

Category: Engagement

Tags: [event, E-commerce: Product Discovery & Merchandising (Search/Filters/PDP)]

Industry: E-commerce


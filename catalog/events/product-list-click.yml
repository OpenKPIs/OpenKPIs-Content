Parameters: |
  {
    "item_list_id": "string - Stable machine identifier of the list the product was selected from (e.g. category_listing, search_results, pdp_recommendations); must equal the value sent on the paired view_item_list impression",
    "item_list_name": "string - Human-readable list label matching the view_item_list impression (e.g. Category Listing, Search Results, Recommended For You); a static label that never contains the search query",
    "items": "array - Exactly one item object for the selected product: item_id and item_name required, index (zero-based rendered position) required, item_brand, item_category, item_variant and price optional",
    "page_type": "string - Template on which the list was rendered (e.g. category, search, product, cart, home), used to separate the same list component across page templates"
  }




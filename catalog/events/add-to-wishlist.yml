Event Name: Add to Wishlist
Event Serialization: always

Description: |
  Add to Wishlist is the GA4 recommended add_to_wishlist event, recorded when a shopper saves a product to a wishlist, favourites list or save-for-later list and the platform has confirmed the save, with currency, value and a single-element items array describing the saved SKU. It is the deferred-intent signal behind Wishlist Additions and Add to List Rate, and it lets Merchandising separate products that shoppers want but are not yet ready to buy from those they are simply browsing, which is the input for back-in-stock, price-drop and remarketing programmes.

Category: Engagement

Tags: [event, E-commerce: Product Discovery & Merchandising (Search/Filters/PDP)]

Industry: E-commerce

Priority: Medium

Core Area: Discovery


Event Type: standard

Aggregation Window: Event, Daily, Weekly, Monthly


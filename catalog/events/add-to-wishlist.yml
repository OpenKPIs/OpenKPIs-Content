Parameters: |
  {
    "currency": "string - ISO 4217 code of the value, required whenever value is sent",
    "value": "number - price × quantity of the saved item at the current selling price",
    "items": "array - exactly one item object with item_id, item_name, item_brand, item_category, item_variant, price and quantity",
    "item_list_id": "string - identifier of the product list the save came from, identical to product-list-view and product-list-click",
    "item_list_name": "string - readable name of that list, for example search_results or category_grid",
    "add_source": "string - surface of the save: plp, pdp, quick_view or cart",
    "page_type": "string - page template on which the save happened",
    "event_id": "string - unique identifier of the save, used for deduplication"
  }




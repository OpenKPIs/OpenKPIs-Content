Event Name: Add Shipping Info
Event Serialization: always

Description: |
  GA4 recommended add_shipping_info event, fired when a shopper submits a shipping method at checkout. It carries shipping_tier, cart value and items, and feeds shipping-step drop-off and delivery-mix analysis.

Category: Conversion

Tags: [event, E-commerce: Cart & Checkout Funnel Analytics]

Industry: E-commerce

Priority: High

Core Area: Checkout



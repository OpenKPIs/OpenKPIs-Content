Parameters: |
  {
    "currency": "string - ISO 4217 code of the cart value, e.g. USD",
    "value": "number - merchandise value of the cart, excluding shipping and tax",
    "items": "array - cart line items (item_id, item_name, price, quantity, item_category)",
    "shipping_tier": "string - selected shipping option, controlled lowercase value: standard, express, next_day or click_and_collect",
    "coupon": "string - order-level coupon code applied at checkout, if any",
    "checkout_id": "string - checkout identifier used to dedupe resubmissions",
    "cart_id": "string - cart identifier linking to add_to_cart and begin_checkout",
    "fulfillment_method": "string - delivery, click_and_collect or ship_to_store",
    "checkout_type": "string - guest or registered checkout"
  }

Calculation Notes: |
  ["1️⃣ Fires when the shipping step is submitted and address and method pass validation; not on method clicks or on page load.","2️⃣ Serialization always: re-fires on each resubmission; dedupe on checkout_id within a session when counting shipping-step completions.","3️⃣ Required: currency, value, items. Recommended: shipping_tier, coupon, checkout_id. value is merchandise total, excluding shipping and tax.","4️⃣ shipping_tier takes lowercase controlled values (standard, express, next_day, click_and_collect), as in add_payment_info; never rate IDs.","5️⃣ No PII: never send name, street address, postcode, email or phone. Send only when analytics_storage consent is granted.","6️⃣ Express wallets (Apple Pay, Shop Pay) must fire it on shipping selection in the wallet sheet, or the funnel shows false drop-off.","7️⃣ Common mistakes: firing on begin_checkout load, items out of sync with the cart, value sent as a string, currency missing."]

Business Use Case: |
  ["1️⃣ Checkout Product Manager: shipping-step drop-off rises week on week → audit address form errors.","2️⃣ Pricing team: Express share of shipping_tier falls after a rate change → retest the free-shipping threshold.","3️⃣ Fulfilment Operations: tier mix shifts toward Next Day before peak → rebook carrier capacity for the forecast.","4️⃣ CRO team: step completion differs by device → prioritise address autocomplete tests on the weakest device."]


Event Name: Add Shipping Info
Aliases: [Shipping Step Completed]

Event Serialization: One per accepted shipping submission

Description: |
  Records when checkout accepts a shopper’s shipping details and chosen shipping option. Teams use it to see which options shoppers successfully submit.

Category: Conversion

Tags: [checkout, shipping options, step completion]

Industry: [E-commerce, Retail]

Business Criticality: High

Journey / Navigation Area: [Checkout]

Owning Function: Product Management

Scope: Event

Measurement Channels: [Mobile App, Web]

GA4 Collection Classification: Recommended

Adobe XDM Classification: Custom XDM

Trigger Condition: WHEN checkout saves a submission after validating the required shipping details and chosen option, THEN emit add_shipping_info.

GA4 Event: |
  add_shipping_info

Adobe Event: |
  add_shipping_info


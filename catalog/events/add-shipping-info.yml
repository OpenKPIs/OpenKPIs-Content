Calculation Notes: |
  1️⃣ At commit, the commerce platform assigns a stable event ID and saves an immutable snapshot.
  2️⃣ Use one logical sender per destination and reuse the original ID and snapshot on retries.
  3️⃣ Count each event ID once. Each new accepted submission gets a new ID.
  4️⃣ Collect only with analytics consent and omit contact details and shipping addresses.
  5️⃣ Report by commit time using only events each analytics platform received before the reporting period ended.

Business Use Case: |
  1️⃣ Checkout teams compare submission counts with separate checkout-start counts to decide when to audit validation.
  2️⃣ Fulfillment teams use shifts in shipping tier mix to decide where to adjust carrier capacity forecasts.



Parameters: |
  {
    "subscription_id": "string - Unique identifier of the subscription contract created at activation; this is the grain of the event and the join key to the renewal, upgrade and cancellation records in the billing ledger.",
    "subscription_type": "string - Commerce plan family: subscribe_and_save, replenishment, curated_box or membership. Mandatory qualifier that separates a paid commerce plan from the newsletter opt-in that shares the subscribe event name.",
    "plan_name": "string - Merchandised name of the activated plan as shown to the customer (e.g. 'Coffee Monthly', 'Premium Membership'); aligns to the Subscription Plan dimension.",
    "billing_interval": "string - Recurrence cadence of the plan: weekly, biweekly, monthly, quarterly, semiannual or annual; aligns to the Billing Frequency dimension.",
    "subscription_value": "number - Net recurring charge per billing interval, exclusive of tax and shipping, as authorized at activation.",
    "currency": "string - ISO 4217 code of subscription_value, used to normalise cross-market aggregation.",
    "discount_rate": "number - Percentage discount applied to the plan list price at activation, 0 when the plan is taken at full price; isolates incentive-driven activations from organic ones.",
    "converted_from_trial_flag": "boolean - True when the activation converts an existing free trial (see Free Trial Start), false for a net-new paid activation; the single field that prevents double counting between trial conversion and net-new acquisition.",
    "item_id": "array - SKUs enrolled in the subscribe-and-save or replenishment plan; empty for membership plans that carry no item basket.",
    "commitment_term_months": "number - Minimum contracted term in months, 0 for rolling plans with no commitment; drives the survival window applied to retention cohorts."
  }

Calculation Notes: |
  1️⃣ The grain is the subscription contract, not the person: event_serialization is 'always' because one customer can hold several concurrent plans (coffee monthly, vitamins bi-weekly, paid membership). Count distinct subscription_id and never distinct customer_id, or concurrent plans collapse into a single activation and the subscriber base is understated.,2️⃣ Exclusion — newsletter and marketing opt-ins reuse the same unified subscribe event in the acquisition sub-domain. A row qualifies only when subscription_id is populated and subscription_type is one of subscribe_and_save, replenishment, curated_box or membership; email opt-in payloads belong to acquisition list-growth reporting and must be filtered out before any commerce aggregation.,3️⃣ converted_from_trial_flag is the only field that separates trial conversion from net-new activation: true routes the row to trial-to-paid measurement against Free Trial Start as the denominator, false routes it to net-new paid acquisition. Both cases fire Subscription Start exactly once — never net the two populations against each other.,4️⃣ Timing — fire on the first successful billing authorization, not on plan selection and not on confirmation page render. Where authorization is asynchronous, emit server-side on the authorization callback and reconcile against the billing ledger on a T+2 cycle; activations voided inside the statutory cooling-off window are removed at reconciliation rather than counted and later reversed.,5️⃣ Sessionisation — the digital hit inherits the standard 30-minute inactivity session timeout, so an activation completed after an idle gap opens a new session. Attribute the activation to the session in which the authorization confirmation was served and backfill server-side confirmations to that session using the transmitted session identifier, never the ingest timestamp.,6️⃣ Plan changes are not activations: a tier or cadence change against an existing subscription_id belongs to Subscription Upgrade Completion. A reactivation after a cancellation issues a new subscription_id and therefore does count as a new Subscription Start, distinguishable through the Subscription Status dimension.,7️⃣ Activations open the subscription ledger and are closed against Subscription Cancellation on the same subscription_id; subscription_value is converted to the reporting currency at the activation-date rate before any cross-market roll-up.

Business Use Case: |
  1️⃣ The Retention Marketing Manager reviews weekly activation cohorts split by converted_from_trial_flag and plan_name; when 60-day survival for a cohort falls below the programme benchmark, they trigger the plan-specific onboarding and first-replenishment reminder journey for that cohort in the ESP.,2️⃣ The Merchandising lead tracks subscribe-and-save attach rate by item_id against product detail views; SKUs with high view volume and low activation have the subscribe module promoted above the fold and the plan discount re-tiered at the next range review.,3️⃣ Revenue Management books recurring revenue from activations net of Subscription Cancellation each period; when net activations miss forecast in two consecutive periods, they re-price the discount_rate ladder and reset the renewal forecast handed to Finance.,4️⃣ The Product Manager for checkout and account monitors the split of net-new versus trial-converted activations after each release; a fall in net-new activation while trial starts hold steady opens an A/B test on the plan selector and on the default billing_interval.


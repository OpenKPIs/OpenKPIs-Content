Event Name: Subscription Start
Event Serialization: always

Description: |
  Subscription Start captures the moment a customer activates a paid recurring commerce plan — subscribe-and-save, replenishment, curated box or paid membership — at the point the first billing authorization succeeds and a subscription contract comes into existence. It deliberately excludes email and newsletter opt-ins that reuse the same unified subscribe event in the acquisition sub-domain: a row qualifies only when it carries a subscription_id and a recurring charge, so list growth is never counted as commerce revenue.


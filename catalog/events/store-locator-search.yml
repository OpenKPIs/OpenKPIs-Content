Event Name: Store Locator Search
Event Serialization: always

Description: |
  Store Locator Search records each executed query in the store finder, captured on the unified search event with search_type = 'store_locator' together with the location input method and the number of stores returned. It is the entry signal of the BOPIS and ship-to-store journey, quantifying local pickup intent and exposing locator coverage gaps before shoppers commit to a store, check inventory or select a pickup location.

Category: Engagement



















    
    
    
    
    
    
    
    
    

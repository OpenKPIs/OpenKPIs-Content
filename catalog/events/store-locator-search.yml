Parameters: |
  {
    "search_type": "string - Fixed value 'store_locator' distinguishing locator queries from product site search on the unified search event",
    "search_term": "string - Normalised postal code, city or region entered or resolved for the query; never a full street address, coordinates or other personal data",
    "location_method": "string - Input method used to locate stores: geolocation | zip | city | address (address input is reduced to postal code before collection)",
    "results_count": "integer - Number of stores returned after radius and service filters; 0 when no store matches",
    "search_radius": "number - Radius applied to the query in the site's distance unit, when a radius selector is offered",
    "service_filter": "string - Optional fulfilment filter applied to the results, e.g. bopis | curbside | same_day | none",
    "item_id": "string - Product SKU when the search is launched from the product detail page availability module, otherwise not set"
  }

Calculation Notes: |
  ["1️⃣ Fire only when the locator query actually executes and a results response (including an empty one) is rendered: keystroke-level autocomplete, typeahead suggestions and map pans or zooms that do not re-query the store index are excluded; a map pan that triggers a new 'search this area' request counts as a new search with location_method = 'geolocation' only if the device position was used, otherwise the method of the original input.","2️⃣ Deduplicate identical consecutive queries (same search_term, location_method and results_count) fired within 2 seconds in the same session to suppress double-submits and SPA re-renders; distinct refinements such as changing the radius or the pickup-available filter are counted as separate searches.","3️⃣ search_term is restricted to postal code, city or region; full street addresses, house numbers, raw latitude/longitude and free text that may contain names or phone numbers must be truncated to postal code or city before collection, and when location_method = 'geolocation' search_term is populated with the resolved postal code or '(geolocation)' rather than coordinates.","4️⃣ results_count is the integer number of stores returned for the query after radius and service filters are applied (not the number rendered on the first page of the list); results_count = 0 is always sent explicitly and forms the numerator of the Zero-Result Store Locator Rate, while null values are treated as instrumentation failures and excluded from rate denominators.","5️⃣ Searches are attributed to the standard 30-minute inactivity session; a store locator search is linked to a downstream store selection, inventory check or BOPIS order only when that action occurs in the same session or within a 7-day user-level lookback for logged-in customers, reported on the event date in the property time zone.","6️⃣ Exclude internal traffic (store associate devices, clienteling tablets and corporate IP ranges), known bots, and locator calls made by the checkout's automatic nearest-store preselection, which is system-initiated and must not be tagged with search_type = 'store_locator'.","7️⃣ Locator searches launched from the product detail page 'check store availability' module are tracked here and distinguished via the page context, so product-level inventory intent can be separated from generic 'find a store' traffic without introducing a separate event name."]

Business Use Case: |
  ["1️⃣ The Omnichannel Product team reviews weekly Zero-Result Store Locator Rate by postal code and region; when a market exceeds 8% it widens the default search radius, fixes geocoding for unmatched city names and flags the area to Real Estate as an unserved pickup demand pocket.","2️⃣ Store Operations compares daily store locator search volume per store catchment with BOPIS order volume; stores whose search share rises more than 20% above their pickup order share are reviewed for missing pickup eligibility, incorrect hours or stale inventory feeds.","3️⃣ The Digital Marketing team uses postal codes with high locator search volume but low Store Locator Conversion Rate as seed geographies for local inventory ads and geo-targeted 'pick up today' campaigns, and suppresses spend in areas where results_count is consistently zero.","4️⃣ The UX team monitors the location_method mix after each release; if the geolocation share drops sharply or zip-based searches show a rising zero-result rate, it audits the permission prompt and input validation before the change reaches peak season."]


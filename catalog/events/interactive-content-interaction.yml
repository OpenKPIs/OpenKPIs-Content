Event Name: Interactive Content Interaction
Event Serialization: always

Description: |
  Measures user engagement with interactive content such as quizzes, videos, or simulations within the e-learning platform. Tracks user actions to assess content effectiveness and user interest.

Category: Engagement

Tags: [event]

Industry: EdTech & E-Learning

Priority: High

Core Area: Engagement


Event Type: custom

Aggregation Window: Event

GA4 Event: |
  select_content

Adobe Event: |
  interactiveContentInteraction

W3 Data Layer: |
  {"user":{"userId":"user123","userType":"student"},"event":"interactiveContentInteraction","content":{"contentId":"quiz456","contentType":"quiz","contentTitle":"Introduction to GA4"},"eventInfo":{"eventName":"Interactive Content Interaction","eventLabel":"interactive","eventAction":"engage","eventCategory":"content"}}

GA4 Data Layer: |
  {"event":"select_content","user_id":"user123","user_type":"student","content_id":"quiz456","content_type":"quiz","content_title":"Introduction to GA4"}

Adobe Client Data Layer: |
  {"event":"interactiveContentInteraction","eventData":{"userId":"user123","userType":"student","contentId":"quiz456","contentType":"quiz","contentTitle":"Introduction to GA4"}}

XDM Mapping: |
  {"_experience":{"analytics":{"user":{"userId":"user123","userType":"student"},"content":{"contentId":"quiz456","contentType":"quiz","contentTitle":"Introduction to GA4"},"eventType":"interactiveContentInteraction"}}}

Parameters: |
  {"user_id":"string - unique identifier for the user","timestamp":"string - ISO 8601 format of the interaction time","content_id":"string - unique identifier for the content","interaction_type":"string - type of interaction (e.g., 'click', 'play', 'submit')"}

Calculation Notes: |
  Exclude interactions from users flagged as test accounts. Session timeout set to 30 minutes.

Business Use Case: |
  Executives use this data to identify high-performing content and allocate resources to develop similar materials, enhancing user engagement.


Source Data: Digital Analytics

    Report Attributes: |
  ["content_category","interaction_type"]


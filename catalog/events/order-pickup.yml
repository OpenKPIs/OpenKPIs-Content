# Event: Order Pickup
# Generated: 2026-09-20T00:25:30.411Z
# Contributed by: devyendarm
# Last modified by: devyendarm

Event Name: Order Pickup
Event Serialization: always

Description: |
  Records the handover of an online order to the customer at a store counter, curbside bay or parcel locker, as confirmed by the POS, store handheld or locker scan in the order management system, with one event per fulfillment (collection trip) of an order. It is the source event for pickups completed, ready-to-pickup latency and curbside wait time, covers the customer handover only, and is distinct from pickup_order (placing an order for pickup) and from Pickup Scheduling Completion, which tracks a carrier collecting parcels for onward shipment.

Category: Operations

Tags: [event, E-commerce: Retail Omnichannel (BOPIS / ship-to-store / in-store), E-commerce: Post-Purchase Logistics & Fulfillment, BOPIS, Curbside Pickup, Click and Collect, Store Fulfillment]

Industry: Retail

Priority: High

Core Area: Generic


Event Type: custom

Aggregation Window: Event, Hourly, Daily, Weekly, Monthly







Parameters: |
  {
    "transaction_id": "string - Order identifier shared with the originating purchase event and the join key to the online order. It is not unique on its own, because one order can be collected in several trips.",
    "fulfillment_id": "string - OMS fulfillment order identifier for one collection trip. Together with transaction_id it forms the unique and deduplication key of the event, so a split pickup produces one event per fulfillment_id.",
    "store_id": "string - Code of the store or locker-bank location where the handover took place, matching the store master",
    "pickup_method": "string - Collection method at handover, in lower case: in_store (counter or hold shelf), curbside or locker",
    "pickup_status": "string - full when every line with quantity above 0 has latest status handed_over; partial when at least one such line has any other latest status (held back, refused or cancelled). Fulfillments with no handed_over line produce no event.",
    "value": "number - SUM(price × quantity) of the lines handed over, excluding tax and shipping, in the order currency, rounded to two decimals",
    "currency": "string - ISO 4217 currency code of value, upper case (e.g. USD, GBP)",
    "items_quantity": "number - Total units handed over: SUM(quantity) across handed_over lines with quantity > 0",
    "items": "array - Line items handed over (item_id, item_name, item_category, price, quantity). On a partial pickup this is a subset of the order lines.",
    "ready_timestamp": "datetime - UTC time at which the OMS moved the fulfillment to Ready for Pickup (pick, pack and staging complete)",
    "arrival_timestamp": "datetime - UTC time of the customer arrival check-in recorded in the OMS (app 'I'm here' status, curbside bay call or counter queue scan). It is null when the customer did not check in, and is not used for locker pickups.",
    "pickup_timestamp": "datetime - UTC time of the POS or handheld handover scan, or of the locker door-open confirmation",
    "hours_ready_to_pickup": "number - Hours from ready_timestamp to pickup_timestamp, rounded to two decimals. It is null when ready_timestamp is missing or later than pickup_timestamp.",
    "pickup_wait_minutes": "number - Minutes from arrival_timestamp to pickup_timestamp, rounded to two decimals. It is null for locker pickups and when arrival_timestamp is missing or later than pickup_timestamp."
  }

Calculation Notes: |
  1️⃣ Fires once per fulfillment (collection trip) when the POS or store handheld handover scan, or the locker door-open confirmation, is written to the OMS and at least one line with quantity above 0 reaches latest status handed_over. Fulfillments with no handed_over line emit nothing, and placing the order (pickup_order) or a carrier collecting parcels (Pickup Scheduling Completion) never triggers it.
  2️⃣ Serialization is always, with the unique and deduplication key transaction_id + fulfillment_id. A retried scan, an OMS replay or a duplicate POS message carrying the same pair must be dropped, while a split pickup of one order legitimately yields several events that share transaction_id and differ in fulfillment_id, so never dedupe on transaction_id alone.
  3️⃣ Required parameters: transaction_id, fulfillment_id, store_id, pickup_method (in_store, curbside or locker, lower case), pickup_status (full or partial), value, currency (ISO 4217, upper case), items_quantity, items and pickup_timestamp. Optional and nullable by design: ready_timestamp, arrival_timestamp, hours_ready_to_pickup and pickup_wait_minutes. Derived durations are null, not zero, when a source timestamp is missing or later than pickup_timestamp, and pickup_wait_minutes is always null for locker pickups.
  4️⃣ All timestamps are UTC, while reporting attributes such as Store Local Date and Pickup Hour are converted with the store's local time zone from the store master, so a late-evening handover lands on the correct store day. value is SUM(price × quantity) of the handed-over lines only, excluding tax and shipping, in the order currency, so a partial pickup is smaller than the order total and must not be summed across currencies without conversion.
  5️⃣ Consent and PII: the payload carries no customer name, email, phone or loyalty identifier, only order, fulfillment and store keys, which is why pii_flag is false and sensitivity is Internal. Do not add arrival notes, licence-plate or vehicle details from the curbside check-in, or recipient names for third-party collection, and join to the customer profile downstream under existing consent rules rather than in the event.
  6️⃣ Common instrumentation mistakes: emitting on Ready for Pickup or on the customer check-in instead of the handover scan; emitting one event per order rather than per fulfillment_id; labelling a partial pickup as full, or including refused, held-back or cancelled lines in items and value; sending pickup_method in mixed case; stamping ready_timestamp or pickup_timestamp in store local time; and backfilling arrival_timestamp with pickup_timestamp, which fakes a zero wait.
  7️⃣ Timing and joins: source data is the OMS with POS, handheld and locker confirmations rather than a browser tag, so the event can arrive after store connectivity is restored. Attribute it to the pickup_timestamp rather than the load time, allow late-arriving records to reprocess the Hourly and Daily windows, and reconcile to the originating purchase event through transaction_id.

Business Use Case: |
  1️⃣ Store Operations managers watch hours_ready_to_pickup and pickup_wait_minutes by store and pickup_method on the BOPIS & Curbside Operations Dashboard, and when a store's curbside wait exceeds its target during a peak hour, they add staff to the curbside bay for that daypart.
  2️⃣ Omnichannel fulfillment leads compare partial against full pickups by store and item category, and when a store's partial share rises, they investigate stock accuracy and hold-shelf picking with the store district manager.
  3️⃣ Finance analysts in store revenue accounting match the value and currency of each pickup to the originating purchase during month-end close, and when handed-over value differs from the order value, they raise the difference for review in the Store Revenue Reconciliation Report.
  4️⃣ Customer Service supervisors review pickups where hours_ready_to_pickup is long, and when the gap between ready_timestamp and pickup_timestamp keeps growing for a store or pickup_method, they revise the reminder cadence sent through the notification channel so customers collect before the hold period expires.


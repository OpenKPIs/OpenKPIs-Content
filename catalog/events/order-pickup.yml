# Event: Order Pickup
# Generated: 2026-09-14T05:57:32.192Z
# Contributed by: devyendarm
# Last modified by: devyendarm

Event Name: Order Pickup
Event Serialization: always

Description: |
  Records the moment a customer collects an online order that was fulfilled for buy-online-pickup-in-store (BOPIS), curbside or locker collection, as confirmed by the handover scan in the POS or order management system, and it is the single source for pickup completion, ready-to-pickup latency and store fulfillment throughput. It covers the customer handover only and is distinct from Pickup Scheduling Completion, which tracks a freight carrier collecting parcels from a warehouse or store for onward shipping.

Category: Operations

Tags: [event, E-commerce: Post-Purchase Logistics & Fulfillment, E-commerce: Retail Omnichannel (BOPIS / ship-to-store / in-store), BOPIS, Curbside, Click and Collect]

Industry: E-commerce

Priority: High

Core Area: Generic


Event Type: custom

Aggregation Window: Event, Daily, Weekly, Monthly







Parameters: |
  {"transaction_id":"string - Order identifier shared with the originating purchase event; join key to the online order and the deduplication key for the handover","store_id":"string - Store or locker-bank location code where the handover took place, matching the store master","pickup_method":"string - Collection method at handover: in_store, curbside or locker","value":"number - Net merchandise value of the items handed over, excluding tax and shipping, in the order currency","currency":"string - ISO 4217 currency code of value (e.g. USD, GBP)","items":"array - Line items handed over (item_id, item_name, item_category, price, quantity); a subset of the order lines on a partial pickup","pickup_status":"string - full when every eligible order line is collected, partial when remaining lines are still held or were refused","ready_timestamp":"datetime - UTC timestamp at which the OMS moved the order to Ready for Pickup (pick, pack and staging complete)","pickup_timestamp":"datetime - UTC timestamp of the POS / handheld handover scan or locker door-open confirmation","hours_ready_to_pickup":"number - Elapsed hours from ready_timestamp to pickup_timestamp, two decimal places","pickup_wait_minutes":"number - Minutes from customer arrival check-in as recorded in the OMS (app 'I'm here' status, curbside bay call or counter queue scan) to handover; null for locker pickups and when no arrival signal exists"}



Dependencies:
  Events: [purchase, pickup-ready-notification]
  Dimensions: [transaction-id, store-id, fulfillment-type]

Source Data: Offline POS + OMS (Order Management System)

    Report Attributes: |
  Store ID; Store Name; Store Region / District; Pickup Method; Pickup Status; Item Category; Store Local Date; Hour of Day

    Dashboard Usage: [BOPIS & Curbside Operations Dashboard, Store Fulfillment Performance Scorecard, Omnichannel Executive Summary]

    Segment Eligibility: |
  true

    Related Dimensions: [store-id, store-name, fulfillment-type, fulfillment-method, pickup-window, transaction-id, channel-of-purchase]

    Derived Dimensions: [fulfillment-method]

    Derived Metrics: [orders-picked-up, average-ready-to-pickup-time]

    Derived KPIs: [pickup-completion-rate]

    Data Sensitivity: Internal

    Contains PII: No


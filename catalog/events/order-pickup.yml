# Last modified by: devyendarm

Event Name: Order Pickup
Event Serialization: always

Description: |
  Records the handover of an online order to the customer at a store counter, curbside bay or parcel locker, as confirmed by the POS, store handheld or locker scan in the order management system, with one event per fulfillment (collection trip) of an order. It is the source event for pickups completed, ready-to-pickup latency and curbside wait time, covers the customer handover only, and is distinct from pickup_order (placing an order for pickup) and from Pickup Scheduling Completion, which tracks a carrier collecting parcels for onward shipment.

Category: Operations

Tags: [event, E-commerce: Retail Omnichannel (BOPIS / ship-to-store / in-store), E-commerce: Post-Purchase Logistics & Fulfillment, BOPIS, Curbside Pickup, Click and Collect, Store Fulfillment]

Industry: Retail

Priority: High

Core Area: Generic


Event Type: custom

Aggregation Window: Event, Hourly, Daily, Weekly, Monthly







Parameters: |
  {
    "transaction_id": "string - Order identifier shared with the originating purchase event and the join key to the online order. It is not unique on its own, because one order can be collected in several trips.",
    "fulfillment_id": "string - OMS fulfillment order identifier for one collection trip. Together with transaction_id it forms the unique and deduplication key of the event, so a split pickup produces one event per fulfillment_id.",
    "store_id": "string - Code of the store or locker-bank location where the handover took place, matching the store master",
    "pickup_method": "string - Collection method at handover, in lower case: in_store (counter or hold shelf), curbside or locker",
    "pickup_status": "string - full when every line with quantity above 0 has latest status handed_over; partial when at least one such line has any other latest status (held back, refused or cancelled). Fulfillments with no handed_over line produce no event.",
    "value": "number - SUM(price × quantity) of the lines handed over, excluding tax and shipping, in the order currency, rounded to two decimals",
    "currency": "string - ISO 4217 currency code of value, upper case (e.g. USD, GBP)",
    "items_quantity": "number - Total units handed over: SUM(quantity) across handed_over lines with quantity > 0",
    "items": "array - Line items handed over (item_id, item_name, item_category, price, quantity). On a partial pickup this is a subset of the order lines.",
    "ready_timestamp": "datetime - UTC time at which the OMS moved the fulfillment to Ready for Pickup (pick, pack and staging complete)",
    "arrival_timestamp": "datetime - UTC time of the customer arrival check-in recorded in the OMS (app 'I'm here' status, curbside bay call or counter queue scan). It is null when the customer did not check in, and is not used for locker pickups.",
    "pickup_timestamp": "datetime - UTC time of the POS or handheld handover scan, or of the locker door-open confirmation",
    "hours_ready_to_pickup": "number - Hours from ready_timestamp to pickup_timestamp, rounded to two decimals. It is null when ready_timestamp is missing or later than pickup_timestamp.",
    "pickup_wait_minutes": "number - Minutes from arrival_timestamp to pickup_timestamp, rounded to two decimals. It is null for locker pickups and when arrival_timestamp is missing or later than pickup_timestamp."
  }



Dependencies:
  Events: [purchase]
  Dimensions: [store-zip-code-local-market, item-category]

Source Data: Offline POS + OMS (Order Management System)

    Report Attributes: |
  Store Local Date; Pickup Hour (Store Local); Store ID; Store Name; Store Region; Store District; Pickup Method; Pickup Status; Item Category; Currency

    Dashboard Usage: [BOPIS & Curbside Operations Dashboard, Store Fulfillment Performance Scorecard, Omnichannel Executive Summary, Store Revenue Reconciliation Report]

    Segment Eligibility: |
  true

    Related Dimensions: [store-zip-code-local-market, item-category, order-status, fulfillment-strategy, transaction-channel, notification-channel]

    Derived Dimensions: [Pickup Method, Pickup Status]

    Derived Metrics: [Pickups Completed, Average Ready-to-Pickup Time, Average Curbside Wait Time]

    Derived KPIs: [Pickup Completion Rate]

    Data Sensitivity: Internal

    Contains PII: No


Event Name: Mortgage Pre-Approval Start
Event Serialization: once per pre_approval_attempt_id

Description: |
  Records the creation of a mortgage pre-approval attempt when a user reaches the first actionable pre-approval application step and the platform successfully initializes an attempt identifier. It measures entry into the pre-approval conversion funnel, excluding marketing-page views, CTA clicks, eligibility previews, and resumptions of an existing attempt.

Category: Conversion

Tags: [event]

Industry: Real Estate Tech

Priority: High

Core Area: Onboarding


Event Type: custom

Aggregation Window: Event; roll up by Session, User, and Time based - Hourly/Daily/Weekly/Monthly


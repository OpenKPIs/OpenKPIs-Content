Calculation Notes: |
  Count one qualified event for each distinct pre_approval_attempt_id after deduplicating repeated deliveries by event_id and pre_approval_attempt_id. Do not count refreshes, back-navigation, resumptions, CTA clicks without successful initialization, failed lender handoffs, test traffic, employee activity, known bots, synthetic monitoring, or events with is_test=true. A deliberate restart counts as a new start only when the application service issues a new attempt identifier; starts spanning multiple sessions remain one attempt. Use a 30-minute inactivity threshold for session reporting, but never use session boundaries to create additional starts. Attribute the event to the initialization timestamp rather than the CTA-click or ingestion timestamp, report enterprise totals in UTC, and apply the approved property-market timezone only for local operational views. Late-arriving events may update historical daily totals within the governed seven-day restatement window. Parameters learned after initialization must not be backfilled onto the original event unless the analytics model explicitly uses slowly enriched attempt attributes and preserves their effective timestamps.

Business Use Case: |
  The Chief Product Officer reviews pre-approval starts and start-to-completion rates by listing surface, acquisition channel, device, and lender partner. If mobile listing-detail traffic produces strong CTA volume but materially fewer qualified starts, Product investigates initialization latency and form-render failures, while Mortgage Operations redirects eligible traffic toward lender partners with higher handoff and completion performance.



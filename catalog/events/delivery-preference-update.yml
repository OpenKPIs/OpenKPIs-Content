Calculation Notes: |
  1️⃣ At commit, the order system stores one durable event ID and fixed snapshot per save and changed preference type.
  2️⃣ Save and carrier confirmation replays reuse the stored ID. A new confirmed save gets a new ID per changed type.
  3️⃣ Use one sender per destination. Retries reuse the ID and snapshot. Deduplicate downstream by event ID.
  4️⃣ Change Source records origin: self_service_web for web, agent_assisted for support, carrier_portal for partners.
  5️⃣ Honor analytics consent and omit addresses, instruction text, contact details, and tracking numbers.

Business Use Case: |
  1️⃣ Customer Support adds self-service links to shipping emails when agents handle more address changes.
  2️⃣ Delivery teams review how customers choose a time window when rescheduling becomes more common.


Source Data: [Offline Operational System, Order Management, Digital Analytics]


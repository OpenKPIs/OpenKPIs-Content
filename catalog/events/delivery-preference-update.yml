Event Name: Delivery Preference Update
Aliases: [Delivery Options Update]

Event Serialization: One per preference type changed in a confirmed save

Description: |
  Records a confirmed change to the delivery address, instructions, or time window for a placed order. It shows what customers change and where each change starts.

Category: Engagement

Tags: [delivery preferences, delivery changes, post-purchase]

Industry: [E-commerce, Retail]

Business Criticality: Medium

Journey / Navigation Area: [Fulfillment, Post-Purchase]

Owning Function: Customer Support

Scope: Event

Measurement Channels: [External Platform / Partner, Call Center / Support, Web]

GA4 Collection Classification: Custom

Adobe XDM Classification: Custom XDM

Trigger Condition: WHEN the order system saves a validated delivery preference change for a placed order after any required carrier acceptance, THEN emit delivery_preference_update.

GA4 Event: |
  delivery_preference_update

Adobe Event: |
  delivery_preference_update


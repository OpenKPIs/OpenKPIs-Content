Parameters: |
  {
    "form_type": "string - Always delivery_preference_update; identifies this submit_form hit among other forms.",
    "transaction_id": "string - Order ID of the placed order being changed; joins to purchase.",
    "preference_type": "string - address | instructions | time_window.",
    "change_id": "string - ID of the saved change request; shared by all hits from one save; dedupe key.",
    "change_source": "string - self_service_web | self_service_app | carrier_portal | agent.",
    "order_status": "string - Order status at change time, e.g. processing, shipped, out_for_delivery.",
    "delivery_time_window": "string - New window when preference_type = time_window, e.g. 2026-09-26 14:00-16:00.",
    "delivery_region": "string - State/province of the new address when preference_type = address; no street or postcode.",
    "fulfillment_method": "string - Fulfilment method of the order, e.g. ship_to_home, same_day_delivery.",
    "tracking_number": "string - Carrier tracking number, when a shipment already exists."
  }

Calculation Notes: |
  ["1️⃣ Fires on the server-confirmed save of the change, after address validation and carrier acceptance; not on form open or rejected edits.","2️⃣ Serialization always: one hit per saved preference_type; one save changing address and time window sends two hits sharing change_id.","3️⃣ Required: transaction_id, preference_type, change_id, change_source, order_status. Optional: delivery_time_window, delivery_region, tracking_number.","4️⃣ Never send address lines, postcode, phone or instruction free text; delivery_region is state/province level only. Honour analytics consent.","5️⃣ Carrier-portal changes (UPS My Choice, FedEx Delivery Manager) count only when ingested server-side with change_source = carrier_portal.","6️⃣ Common mistake: firing on checkout address edits. Those belong to add_shipping_info; this event is post-purchase only."]

Business Use Case: |
  ["1️⃣ Customer Service lead: agent-made address changes rise → adds self-service change links to shipping emails.","2️⃣ Fulfilment Operations: address changes after dispatch spike → adds a pre-dispatch hold to cut redirect fees.","3️⃣ Delivery Product Manager: time_window changes cluster on one slot → reviews that slot's capacity at checkout."]


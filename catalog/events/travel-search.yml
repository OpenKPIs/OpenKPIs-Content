  {"rooms":"integer - number of accommodation rooms requested when applicable","adults":"integer - number of adult travelers included in the executed request","locale":"string - BCP 47 locale active in the search interface","market":"string - governed commercial market or point of sale associated with the digital property","infants":"integer - number of infant travelers included in the executed request","children":"integer - number of child travelers included in the executed request","currency":"string - ISO 4217 currency code used for displayed search-result prices","event_id":"string - unique identifier for the emitted event instance, used to identify duplicate delivery of the same terminal search event","platform":"string - governed delivery platform, such as web, ios, or android","fare_type":"string - governed commercial fare or rate category, such as standard, member, corporate, award, package, or promotional","page_name":"string - governed analytics name of the page or application screen that initiated the search","search_id":"string - unique identifier assigned to one executed inventory request and retained across its associated result interactions","trip_type":"string - governed itinerary structure, such as one_way, round_trip, multi_city, open_jaw, or stay_only","error_code":"string - normalized non-PII application or service error code for an unsuccessful or partially successful request","session_id":"string - identifier for the active enterprise digital analytics session","site_brand":"string - governed brand or digital property associated with the search","cabin_class":"string - governed requested service class, such as economy, premium_economy, business, or first","campaign_id":"string - approved non-PII campaign identifier attributed to the search","device_type":"string - governed device category, such as desktop, mobile, or tablet","origin_code":"string - standardized departure, pickup, or embarkation location code when applicable","origin_type":"string - governed classification of the origin, such as airport, city, station, port, property, or region","return_date":"string - requested inbound, check-out, drop-off, or disembarkation date in ISO 8601 calendar format when applicable","search_type":"string - governed travel inventory vertical, such as flight, hotel, car, package, rail, cruise, or activity","sort_option":"string - governed result ordering active when the inventory request was executed","nonstop_only":"boolean - indicates whether the request was restricted to nonstop or direct itineraries","result_count":"integer - total eligible results reported by the terminal response before client-side pagination","zero_results":"boolean - indicates that a technically successful search returned exactly zero eligible results","consent_state":"string - normalized analytics consent state effective when the terminal search event was collected","filters_count":"integer - number of explicit filter criteria applied to the executed inventory request","page_url_path":"string - canonical URL path with query parameters, fragments, and customer-entered values removed","referrer_type":"string - governed classification of the referring source, such as internal, external, direct, paid, or organic","search_status":"string - normalized terminal outcome, such as success, partial, validation_error, error, timeout, or cancelled","departure_date":"string - requested outbound, check-in, pickup, embarkation, or activity date in ISO 8601 calendar format","flexible_dates":"boolean - indicates whether flexible-date inventory was requested","search_surface":"string - governed digital interface from which the request was submitted, such as search_form, home_page, results_page, or deep_link","event_timestamp":"string - UTC timestamp in ISO 8601 format when the search reached its terminal response state","refundable_only":"boolean - indicates whether the request was restricted to refundable fares or rates","travelers_total":"integer - total number of travelers included in the executed request","destination_code":"string - standardized arrival, stay, drop-off, or activity destination code when applicable","destination_type":"string - governed classification of the destination, such as airport, city, station, port, property, or region","flexibility_days":"integer - number of calendar days before or after the requested date included in the flexible-date search","marketing_channel":"string - governed acquisition or traffic channel attributed to the search session","max_display_price":"number - highest eligible price displayed in the terminal result set, expressed in the reported currency","min_display_price":"number - lowest eligible price displayed in the terminal result set, expressed in the reported currency","search_latency_ms":"integer - elapsed milliseconds from accepted search submission to terminal response availability","promo_code_applied":"boolean - indicates whether an approved promotional code influenced the request without collecting the code value","stay_length_nights":"integer - number of requested accommodation nights when applicable","booking_window_days":"integer - whole calendar days between the market-local search date and departure or check-in date","loyalty_rate_requested":"boolean - indicates whether member, loyalty, or award inventory was requested without exposing a loyalty identifier"}

Calculation Notes: |
  1️⃣ Emit the event only after an intentionally submitted inventory request reaches a terminal state; exclude form edits, autocomplete interactions, calendar browsing, filter previews, and passive recommendations.
  2️⃣ Assign a new search_id to every initial request or inventory re-query, preserve it for downstream result interactions, and deduplicate transport retries using search_id.
  3️⃣ Set zero_results to true only when search_status is success and result_count equals zero; errors, timeouts, cancellations, validation failures, and null result counts are not zero-result searches.
  4️⃣ Populate result_count, displayed prices, and search_latency_ms from the terminal response; use null rather than zero when a value is unavailable or inapplicable.
  5️⃣ Calculate booking_window_days and stay_length_nights using market-local calendar dates, and do not substitute UTC date boundaries.
  6️⃣ Do not collect free-form search text, raw promotional codes, loyalty account numbers, names, contact details, payment data, URL query strings, or URL fragments.
  7️⃣ Apply the enterprise session definition, normally ending after 30 minutes of inactivity, and exclude bots, synthetic monitoring, internal QA, employee testing, and known automation from certified reporting.

Business Use Case: |
  Digital Product and Revenue Management teams use this event to identify high-demand routes or destinations with elevated zero-result rates, poor response times, or weak booking progression. Leaders can respond by expanding inventory, adjusting availability or merchandising, promoting flexible dates, remediating search-service performance, or redesigning the affected digital search journey.



Event Name: Travel Search
Event Serialization: once per search_id

Description: |
  Records each intentionally submitted travel inventory search when the request reaches a terminal response state, together with its governed criteria, outcome, result volume, and response latency. It measures digital travel demand, inventory availability, search reliability, refinement behavior, and progression from discovery toward booking.


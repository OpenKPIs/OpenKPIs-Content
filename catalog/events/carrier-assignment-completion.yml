Event Name: Carrier Assignment Completion
Event Serialization: always

Description: |
  Records the successful completion of assigning a carrier to a shipment or load after the assignment is committed in the transportation management system. It measures completed assignment activity, assignment timing, sourcing method, selected carrier, route context, and committed transportation cost.

Category: Conversion

Tags: [event]

Industry: Logistics & Supply Chain

Priority: High

Core Area: Generic


Event Type: custom

Aggregation Window: Event; Time based - Hourly/Daily/Monthly/Yearly







Parameters: |
  {"load_id":"string - unique identifier of the consolidated transportation load, when applicable","event_id":"string - globally unique identifier for this event activation, used for ingestion deduplication","order_id":"string - associated customer, transfer, or fulfillment order identifier, when applicable","route_id":"string - identifier of the planned route or lane used for the movement","tender_id":"string - identifier of the related carrier tender, offer, or booking request, when applicable","carrier_id":"string - enterprise identifier of the carrier assigned to execute the movement","facility_id":"string - primary operating facility responsible for planning or dispatching the movement","shipment_id":"string - unique identifier of the shipment receiving the carrier assignment","carrier_name":"string - governed legal or operating name of the assigned carrier","carrier_scac":"string - Standard Carrier Alpha Code of the assigned carrier, when available","assignment_id":"string - unique identifier for the carrier assignment transaction","distance_unit":"string - governed unit for planned distance, such as km or mi","service_level":"string - committed transportation service level, such as standard, expedited, next-day, or same-day","tender_status":"string - tender state at assignment completion, such as accepted, auto-accepted, manually confirmed, or not applicable","correlation_id":"string - identifier used to trace the assignment across workflow, integration, tendering, and source-system messages","distance_value":"decimal - planned route distance associated with the assigned movement","equipment_type":"string - assigned or required equipment classification, such as dry van, reefer, flatbed, container, or box truck","exception_code":"string - governed code for an exception resolved or overridden during completion; null when no exception occurred","schema_version":"string - version of the event payload contract used to produce the record","transport_mode":"string - transportation mode, such as truckload, less-than-truckload, parcel, air, ocean, rail, or intermodal","event_timestamp":"timestamp - UTC date and time when the source system emitted the completion event","planner_team_id":"string - identifier of the transportation planning team responsible for the assignment","business_unit_id":"string - enterprise business unit accountable for the shipment","spot_market_flag":"boolean - indicates whether the assignment was sourced through the spot transportation market","assignment_method":"string - method used to complete the assignment, such as automatic, manual, contracted tender, routing guide, spot bid, or API","assignment_status":"string - committed assignment state; expected completion values are assigned, confirmed, or equivalent governed statuses","assignment_rule_id":"string - identifier of the routing guide, optimization rule, or decision rule that selected the carrier","assignment_version":"integer - sequential version of the assignment, incremented when a shipment or load is reassigned","origin_location_id":"string - enterprise identifier of the shipment origin facility or node","quoted_cost_amount":"decimal - carrier-quoted transportation cost recorded at assignment completion, excluding later audit adjustments","customer_account_id":"string - non-personal enterprise customer account identifier associated with the shipment, when applicable","origin_country_code":"string - ISO 3166-1 alpha-2 country code for the shipment origin","tender_round_number":"integer - sequential tender attempt or routing-guide round that resulted in the assignment","cost_variance_amount":"decimal - stored variance between quoted cost and contracted cost in the quoted cost currency","quoted_cost_currency":"string - ISO 4217 currency code for quoted and contracted cost amounts","shipment_volume_unit":"string - governed unit for shipment volume, such as m3 or ft3","shipment_weight_unit":"string - governed unit for shipment weight, such as kg or lb","shipment_volume_value":"decimal - planned shipment volume available at assignment completion","shipment_weight_value":"decimal - planned billable or physical shipment weight available at assignment completion","contracted_cost_amount":"decimal - expected cost under the applicable carrier contract or rate card at assignment completion","contracted_carrier_flag":"boolean - indicates whether the assigned carrier was covered by an active transportation contract","destination_location_id":"string - enterprise identifier of the shipment destination facility or node","assignment_source_system":"string - system that committed the authoritative carrier assignment","destination_country_code":"string - ISO 3166-1 alpha-2 country code for the shipment destination","planned_pickup_timestamp":"timestamp - scheduled pickup date and time in UTC at assignment completion","planned_delivery_timestamp":"timestamp - scheduled delivery date and time in UTC at assignment completion","assignment_duration_seconds":"integer - elapsed whole seconds from assignment workflow start to successful commitment","assignment_started_timestamp":"timestamp - UTC date and time when the assignment workflow began","assignment_completed_timestamp":"timestamp - UTC date and time when the carrier assignment was successfully committed"}

Calculation Notes: |
  Emit the event only after the authoritative carrier assignment is successfully committed and the shipment or load has an active carrier_id; carrier recommendations, uncommitted selections, pending tenders, rejected tenders, failed saves, and simulation results are excluded. Raw activations are retained because event serialization is always, but analytical counts must deduplicate exact retries by event_id and retain a single completion per assignment_id and assignment_version. A legitimate reassignment must produce a new assignment version or assignment identifier and remains a separate completion; cancellation without a replacement carrier is not a completion. Use assignment_completed_timestamp as the business occurrence time and event_timestamp only for ingestion-latency analysis. Assignment duration is valid only when both workflow timestamps exist, the completion time is not earlier than the start time, and neither timestamp was backfilled from a batch default. Monetary comparisons require a common currency; when currencies differ, use the governed finance exchange rate effective at assignment completion rather than comparing source amounts directly. Null tender fields are valid for direct bookings, private-fleet assignments, or workflows that do not use tendering. Exclude test shipments, training carriers, deleted transactions, and non-production source environments from certified reporting. Late-arriving events must be attributed to the assignment completion date and may restate previously published daily results within the governed data correction window.

Business Use Case: |
  Transportation Operations uses daily completion volume, cycle time, tender-round, sourcing-method, and cost-variance breakdowns to identify lanes where assignments require excessive manual intervention or repeatedly fall through to spot carriers. Leadership can then adjust routing-guide priority, renegotiate carrier capacity, correct automation rules, or add contracted coverage before assignment delays create missed pickup commitments and higher freight costs.


Source Data: Transportation Management System (TMS), carrier tendering platform, routing and optimization engine, shipment planning system, carrier master data, and transportation contract rate management


# Event: Product List View
# Generated: 2026-09-21T17:38:28.463Z
# Contributed by: devyendarm


Event Name: Product List View
Event Serialization: always

Description: |
  Product List View is the standard ecommerce view_item_list event, recorded when a set of products is shown to a shopper as a list (category and product listing pages, search results, recommendation carousels, cross-sell and recently viewed modules) and it carries item_list_id, item_list_name and the items array with each product's list position. It is the impression side of the list funnel: paired with Product List Click (select_item) on the same item_list_id and index, it measures how well each list, ranking position and product converts exposure into product detail views, carts and revenue.

Category: Engagement



















    
    
    
    
    
    
    
    
    

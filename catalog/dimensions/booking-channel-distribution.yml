Google Analytics SQL: |
  -- ==========================================
  -- 1. GOOGLE BIGQUERY SQL
  -- ==========================================
  SELECT booking_channel AS channel, COUNT(*) AS booking_count
  FROM `your-project.erp.warehouse_logs`
  WHERE event_type = 'booking'
  GROUP BY booking_channel

AEP Query Service SQL: |
  -- ==========================================
  -- 2. ADOBE AEP QUERY SERVICE SQL
  -- ==========================================
  SELECT bookingChannel AS channel, COUNT(*) AS booking_count
  FROM aep_backend_dataset
  WHERE event_type = 'booking'
  GROUP BY bookingChannel

Calculation Notes: |
  Ensure accurate channel attribution by excluding duplicate entries and accounting for session timeouts.

Business Use Case: |
  Executives use this dimension to allocate marketing budgets effectively by identifying high-performing channels and optimizing underperforming ones.



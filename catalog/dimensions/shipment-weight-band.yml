Dimension Name: Shipment Weight Band

Description: |
  Classifies a customer-visible shipment into a governed weight range using the weight applied when shipping options, delivery promises, or charges are presented. It enables comparison of checkout conversion, shipping-fee acceptance, delivery experience, billing outcomes, repeat purchase, and customer lifetime value across shipment sizes.

Category: Conversion

Tags: [dimension]

Industry: Logistics & Supply Chain

Priority: High

Core Area: Checkout

Scope: Event

Data Type: string

Aggregation Window: Event


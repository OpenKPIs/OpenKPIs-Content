Dimension Name: Lead Urgency

Description: |
  Lead Urgency classifies how quickly a real estate prospect is expected to take the next meaningful transaction step, such as scheduling a tour, applying, listing a property, or completing a purchase. It enables consistent lead prioritization using declared timing, verified intent signals, agent assessment, and approved scoring rules.

Category: Conversion

Tags: [dimension]

Industry: Real Estate Tech

Priority: High

Core Area: Engagement

Scope: Event

Data Type: string

Aggregation Window: Event


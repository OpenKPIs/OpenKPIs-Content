Dimension Name: Loyalty Points Transaction Type
Aliases: [Points Transaction Type, Points Activity Type, Loyalty Ledger Entry Type]


Description: |
  Identifies why a posted loyalty points ledger entry changed the balance: earn, redeem, expire, adjust or reverse. It helps teams understand the mix of loyalty points activity.

Category: Retention

Tags: [loyalty, points, ledger activity]

Industry: [E-commerce, Retail]

Business Criticality: Medium

Journey / Navigation Area: [Loyalty & Retention]

Owning Function: Loyalty & CRM

Scope: Event

Measurement Channels: [Backend / API]

Data Type: string


GA4 Event: |
  loyalty_points_posted — records one posted loyalty points ledger entry

Adobe Event: |
  loyalty_points_posted — records one posted loyalty points ledger entry

W3 Data Layer: |
  {"digitalData":{"event":[{"eventInfo":{"eventName":"loyalty_points_posted","timeStamp":"2026-11-15T12:00:00Z"},"attributes":{"ledgerEntryId":"LPE-123","transactionType":"earn","accountType":"customer"}}]}}

GA4 Data Layer: |
  [{"event":"loyalty_points_posted","ledger_entry_id":"LPE-123","transaction_type":"earn","account_type":"customer"}]

Adobe Client Data Layer: |
  [{"event":"loyalty_points_posted","eventInfo":{"timestamp":"2026-11-15T12:00:00Z"},"data":{"ledgerEntryId":"LPE-123","transactionType":"earn","accountType":"customer"}}]

XDM Mapping: |
  [{"_id":"LPE-123","timestamp":"2026-11-15T12:00:00Z","eventType":"loyalty_points_posted","_openkpis":{"loyalty":{"transactionType":"earn","accountType":"customer"}}}]

Google Analytics SQL: |
  WITH entries AS (
    SELECT
      (SELECT p.value.string_value FROM UNNEST(event_params) AS p WHERE p.key = 'ledger_entry_id') AS ledger_entry_id,
      (SELECT p.value.string_value FROM UNNEST(event_params) AS p WHERE p.key = 'transaction_type') AS transaction_type,
      (SELECT p.value.string_value FROM UNNEST(event_params) AS p WHERE p.key = 'account_type') AS account_type
    FROM `{{GA4_PROJECT}}.{{GA4_DATASET}}.events_*`
    WHERE event_name = 'loyalty_points_posted'
      AND _TABLE_SUFFIX BETWEEN
        FORMAT_DATE('%Y%m%d', DATE_SUB(DATE(@report_start), INTERVAL 1 DAY))
        AND FORMAT_DATE('%Y%m%d', DATE_ADD(DATE(@report_end), INTERVAL 1 DAY))
      AND event_timestamp >= UNIX_MICROS(@report_start)
      AND event_timestamp < UNIX_MICROS(@report_end)
  )
  SELECT ledger_entry_id, transaction_type AS loyalty_points_transaction_type
  FROM entries
  WHERE ledger_entry_id IS NOT NULL
    AND transaction_type IS NOT NULL
    AND account_type NOT IN ('test', 'internal');

AEP Query Service SQL: |
  SELECT
    _id AS ledger_entry_id,
    _openkpis.loyalty.transactionType AS loyalty_points_transaction_type
  FROM {{AEP_EXPERIENCE_EVENT_DATASET}}
  WHERE eventType = 'loyalty_points_posted'
    AND timestamp >= CAST('{{REPORT_START_UTC}}' AS TIMESTAMP)
    AND timestamp < CAST('{{REPORT_END_UTC}}' AS TIMESTAMP)
    AND _id IS NOT NULL
    AND _openkpis.loyalty.transactionType IS NOT NULL
    AND _openkpis.loyalty.accountType NOT IN ('test', 'internal');

Calculation Notes: |
  1️⃣ Use ledger posting time in UTC: include report start and exclude report end; supply both bounds at runtime.
  2️⃣ Emit only posted entries with an account type; exclude pending entries and test or internal accounts.
  3️⃣ Integration prerequisite: deliver each ledger entry once, with a unique, non-null ID and one value per parameter.
  4️⃣ Collect earn, redeem, expire, adjust or reverse from the ledger; return the collected type unchanged.
  5️⃣ Record reversals as separate entries when posted; later reversals do not rewrite earlier reporting periods.

Business Use Case: |
  1️⃣ Loyalty teams investigate rising expiry activity before changing points-expiry communications.
  2️⃣ Customer support teams review adjustment activity before changing agent credit policies.
  3️⃣ Finance teams compare transaction types when investigating changes in loyalty ledger activity.



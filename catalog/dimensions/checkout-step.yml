Dimension Name: Checkout Step

Description: |
  Checkout Step is the ordered cart-to-order stage a session reached or dropped out at, drawn from a fixed five-value sequence: View Cart, Begin Checkout, Shipping Info, Payment Info and Purchase. In GA4 the value is derived from the standard ecommerce event name because no standard step parameter exists, and in Adobe it is read from _tenant.checkout.stepNumber alongside the native Cart Views, Checkouts and Orders events (commerce.checkouts.value is set only at Begin Checkout, while the shipping and payment stages are sent as checkout-step hits that do not set it), so the dimension carries the stage label and its ordinal while the funnel rates across stages stay with the checkout KPIs.

Category: Conversion

Tags: [dimension, E-commerce: Cart & Checkout Funnel Analytics, Checkout Funnel]

Industry: E-commerce

Priority: High

Core Area: Checkout

Scope: Session

Data Type: string


Dimension Name: Checkout Step

Description: |
  Checkout Step is the ordered cart-to-order stage a session reached or dropped out at, drawn from a fixed five-value sequence: View Cart, Begin Checkout, Shipping Info, Payment Info and Purchase. In GA4 the value is derived from the standard ecommerce event name because no standard step parameter exists, and in Adobe Analytics it maps to the checkout funnel stage (Cart Views, Checkouts, custom shipping and payment stages, Orders), so the dimension carries the stage label and its ordinal while the funnel rates across stages stay with the checkout KPIs.


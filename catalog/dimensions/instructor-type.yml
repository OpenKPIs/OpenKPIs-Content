Dimension Name: Instructor Type

Description: |
  Classifies the instructional delivery model assigned to a digital course, class, cohort, or learning content item, distinguishing human-led, AI-led, peer-led, hybrid, recorded, and self-directed experiences. It enables consistent comparison of learner conversion, engagement, completion, satisfaction, and retention across materially different modes of instruction.

Category: Engagement

Tags: [dimension]

Industry: EdTech & E-Learning

Priority: High

Core Area: Engagement

Scope: Item

Data Type: string

Aggregation Window: Event (resolved from the course-offering version effective at event time)

GA4 Event: |
  view_item

Adobe Event: |
  view_item


Dimension Name: Campaign Name

Description: |
  The marketing campaign credited with driving the session, resolved from utm_campaign, ad-platform auto-tagging (gclid, msclkid) or the Adobe cid tracking code, and equivalent to GA4 "Session campaign" and the Adobe "Tracking Code" campaign classification. It carries the campaign ID (utm_id or the ad-platform campaign id) as the stable join key to ad-platform cost data, so spend, sessions, conversions and revenue can be read side by side at campaign grain for Return on Ad Spend, Paid Search Conversion Rate and Marketing-Sourced New Customer Rate.


Dimension Name: Billing Frequency

Description: |
  Billing Frequency identifies how often a customer is scheduled to be charged for an order, subscription, installment plan, or recurring service agreement. It distinguishes one-time and recurring billing cadences so teams can analyze checkout conversion, revenue timing, renewal behavior, retention, and customer lifetime value.

Category: Revenue

Tags: [dimension]

Industry: E-commerce & SaaS

Priority: High

Core Area: Monetization

Scope: Event

Data Type: string

Aggregation Window: Event


Dimension Name: Item Coupon

Description: |
  The coupon code applied to a single line item, sent as coupon inside the GA4 items[] array on cart, checkout and purchase events. Order-level codes belong to the Coupon Code dimension, not this one.

Category: Monetization

Tags: [dimension, E-commerce: Cart & Checkout Funnel Analytics]

Industry: E-commerce

Priority: Medium

Core Area: Checkout

Scope: Event

Data Type: string

Aggregation Window: Event, Daily, Weekly, Monthly


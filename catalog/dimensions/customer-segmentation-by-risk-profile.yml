Dimension Name: Customer Segmentation by Risk Profile

Description: |
  This dimension categorizes customers based on their financial risk levels, enabling targeted strategies for risk management and marketing. It measures the risk tolerance and behavior patterns of customers in financial transactions.

Category: Conversion

Tags: [dimension]

Industry: FinTech & Banking

Priority: High

Core Area: Generic

Scope: User

Data Type: string

Aggregation Window: User







Google Analytics SQL: |
  -- ==========================================
  -- 1. GOOGLE BIGQUERY SQL
  -- ==========================================
  SELECT customer_id, 
         CASE 
             WHEN risk_score <= 20 THEN 'Low Risk'
             WHEN risk_score BETWEEN 21 AND 50 THEN 'Medium Risk'
             ELSE 'High Risk'
         END AS risk_profile
  FROM `your-project.crm.customer_data`
  WHERE risk_score IS NOT NULL;

AEP Query Service SQL: |
  -- ==========================================
  -- 2. ADOBE AEP QUERY SERVICE SQL
  -- ==========================================
  SELECT customer_id, 
         CASE 
             WHEN risk_score <= 20 THEN 'Low Risk'
             WHEN risk_score BETWEEN 21 AND 50 THEN 'Medium Risk'
             ELSE 'High Risk'
         END AS risk_profile
  FROM crm.customer_data
  WHERE risk_score IS NOT NULL;

Calculation Notes: |
  Exclude customers with insufficient transaction history; update profiles monthly.

Business Use Case: |
  Executives use this segmentation to tailor financial products and marketing campaigns to different risk profiles, optimizing conversion rates.



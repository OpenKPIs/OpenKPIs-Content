Dimension Name: Subscription Plan

Description: |
  Subscription Plan identifies the effective-dated commercial package governing a learner or organization subscription, including its tier, billing cadence, entitlement level, market, and catalog version. It enables revenue, conversion, retention, and engagement analysis by the exact plan terms applicable when a subscription event occurred.

Category: Revenue

Tags: [dimension]

Industry: EdTech & E-Learning

Priority: High

Core Area: Monetization

Scope: Item

Data Type: string

Aggregation Window: Event







Google Analytics SQL: |
  -- ==========================================
  -- 1. GOOGLE BIGQUERY SQL
  -- ==========================================
  WITH billing_plans AS (
    SELECT * EXCEPT (row_num)
    FROM (
      SELECT
        CAST(plan_id AS STRING) AS plan_id,
        plan_code,
        plan_name,
        plan_description,
        plan_status,
        plan_type,
        CAST(product_id AS STRING) AS product_id,
        billing_provider,
        external_plan_id,
        billing_frequency,
        billing_interval_count,
        billing_period_days,
        trial_available_flag,
        trial_period_days,
        grace_period_days,
        currency_code,
        list_price,
        setup_fee,
        discount_eligible_flag,
        tax_inclusive_flag,
        auto_renew_flag,
        seat_model,
        min_seats,
        max_seats,
        sales_channel,
        effective_start_at,
        effective_end_at,
        created_at,
        updated_at,
        ROW_NUMBER() OVER (
          PARTITION BY CAST(plan_id AS STRING)
          ORDER BY updated_at DESC, created_at DESC
        ) AS row_num
      FROM `your-project.subscription_billing.subscription_plans`
      WHERE COALESCE(is_deleted, FALSE) = FALSE
    )
    WHERE row_num = 1
  ),
  catalog_plans AS (
    SELECT * EXCEPT (row_num)
    FROM (
      SELECT
        CAST(plan_id AS STRING) AS plan_id,
        plan_code,
        plan_name,
        plan_description,
        catalog_status,
        plan_type,
        CAST(product_id AS STRING) AS product_id,
        product_code,
        product_name,
        product_family,
        product_category,
        platform,
        region_code,
        country_code,
        language_code,
        effective_start_at,
        effective_end_at,
        created_at,
        updated_at,
        ROW_NUMBER() OVER (
          PARTITION BY CAST(plan_id AS STRING)
          ORDER BY updated_at DESC, created_at DESC
        ) AS row_num
      FROM `your-project.subscription_catalog.subscription_products`
      WHERE COALESCE(is_deleted, FALSE) = FALSE
    )
    WHERE row_num = 1
  ),
  crm_products AS (
    SELECT * EXCEPT (row_num)
    FROM (
      SELECT
        CAST(subscription_plan_id AS STRING) AS plan_id,
        CAST(crm_product_id AS STRING) AS crm_product_id,
        product_code,
        product_name,
        product_family,
        product_category,
        market_segment,
        customer_type,
        sales_channel,
        region_code,
        country_code,
        effective_start_at,
        effective_end_at,
        created_at,
        updated_at,
        ROW_NUMBER() OVER (
          PARTITION BY CAST(subscription_plan_id AS STRING)
          ORDER BY updated_at DESC, created_at DESC
        ) AS row_num
      FROM `your-project.crm.product_catalog`
      WHERE COALESCE(is_deleted, FALSE) = FALSE
        AND subscription_plan_id IS NOT NULL
    )
    WHERE row_num = 1
  ),
  app_store_products AS (
    SELECT * EXCEPT (row_num)
    FROM (
      SELECT
        CAST(subscription_plan_id AS STRING) AS plan_id,
        app_store_product_id,
        store_name AS billing_provider,
        platform,
        billing_frequency,
        billing_interval_count,
        currency_code,
        list_price,
        country_code,
        effective_start_at,
        effective_end_at,
        ingested_at AS updated_at,
        ROW_NUMBER() OVER (
          PARTITION BY CAST(subscription_plan_id AS STRING)
          ORDER BY ingested_at DESC
        ) AS row_num
      FROM `your-project.app_store.subscription_product_feed`
      WHERE COALESCE(is_deleted, FALSE) = FALSE
        AND subscription_plan_id IS NOT NULL
    )
    WHERE row_num = 1
  ),
  entitlements AS (
    SELECT
      CAST(subscription_plan_id AS STRING) AS plan_id,
      MAX(CAST(entitlement_package_id AS STRING)) AS entitlement_package_id,
      STRING_AGG(DISTINCT entitlement_code, '|' ORDER BY entitlement_code) AS entitlement_codes,
      MAX(learner_limit) AS learner_limit,
      MAX(storage_limit_gb) AS storage_limit_gb,
      MAX(access_level) AS access_level,
      MAX(content_tier) AS content_tier,
      MAX(support_tier) AS support_tier,
      MIN(effective_start_at) AS effective_start_at,
      MAX(effective_end_at) AS effective_end_at,
      MAX(updated_at) AS updated_at
    FROM `your-project.learning_entitlements.plan_entitlements`
    WHERE COALESCE(is_deleted, FALSE) = FALSE
      AND subscription_plan_id IS NOT NULL
    GROUP BY CAST(subscription_plan_id AS STRING)
  ),
  plan_ids AS (
    SELECT plan_id FROM billing_plans
    UNION DISTINCT
    SELECT plan_id FROM catalog_plans
    UNION DISTINCT
    SELECT plan_id FROM crm_products
    UNION DISTINCT
    SELECT plan_id FROM app_store_products
    UNION DISTINCT
    SELECT plan_id FROM entitlements
  ),
  resolved AS (
    SELECT
      p.plan_id,
      b,
      c,
      r,
      a,
      e
    FROM plan_ids p
    LEFT JOIN billing_plans b USING (plan_id)
    LEFT JOIN catalog_plans c USING (plan_id)
    LEFT JOIN crm_products r USING (plan_id)
    LEFT JOIN app_store_products a USING (plan_id)
    LEFT JOIN entitlements e USING (plan_id)
  )
  SELECT
    TO_HEX(SHA256(CONCAT('SUBSCRIPTION_PLAN|', plan_id))) AS subscription_plan_key,
    plan_id,
    COALESCE(b.plan_code, c.plan_code, r.product_code, CONCAT('PLAN-', plan_id)) AS plan_code,
    COALESCE(b.plan_name, c.plan_name, r.product_name, 'Unknown Subscription Plan') AS plan_name,
    COALESCE(b.plan_description, c.plan_description) AS plan_description,
    UPPER(COALESCE(b.plan_status, c.catalog_status, 'UNKNOWN')) AS plan_status,
    UPPER(COALESCE(b.plan_type, c.plan_type, 'UNKNOWN')) AS plan_type,
    COALESCE(b.product_id, c.product_id) AS product_id,
    COALESCE(c.product_code, r.product_code) AS product_code,
    COALESCE(c.product_name, r.product_name, b.plan_name) AS product_name,
    COALESCE(c.product_family, r.product_family) AS product_family,
    COALESCE(c.product_category, r.product_category) AS product_category,
    COALESCE(b.billing_provider, a.billing_provider, 'UNKNOWN') AS billing_provider,
    b.external_plan_id AS external_plan_id,
    a.app_store_product_id AS app_store_product_id,
    e.entitlement_package_id AS entitlement_package_id,
    UPPER(COALESCE(b.billing_frequency, a.billing_frequency, 'UNKNOWN')) AS billing_frequency,
    COALESCE(b.billing_interval_count, a.billing_interval_count, 1) AS billing_interval_count,
    b.billing_period_days AS billing_period_days,
    COALESCE(b.trial_available_flag, FALSE) AS trial_available_flag,
    COALESCE(b.trial_period_days, 0) AS trial_period_days,
    COALESCE(b.grace_period_days, 0) AS grace_period_days,
    UPPER(COALESCE(b.currency_code, a.currency_code, 'UNKNOWN')) AS currency_code,
    COALESCE(b.list_price, a.list_price) AS list_price,
    COALESCE(b.setup_fee, 0) AS setup_fee,
    COALESCE(b.discount_eligible_flag, FALSE) AS discount_eligible_flag,
    COALESCE(b.tax_inclusive_flag, FALSE) AS tax_inclusive_flag,
    COALESCE(b.auto_renew_flag, FALSE) AS auto_renew_flag,
    UPPER(COALESCE(b.seat_model, 'INDIVIDUAL')) AS seat_model,
    b.min_seats AS min_seats,
    b.max_seats AS max_seats,
    e.learner_limit AS learner_limit,
    e.storage_limit_gb AS storage_limit_gb,
    UPPER(COALESCE(e.access_level, 'UNKNOWN')) AS access_level,
    UPPER(COALESCE(e.content_tier, 'UNKNOWN')) AS content_tier,
    UPPER(COALESCE(e.support_tier, 'UNKNOWN')) AS support_tier,
    e.entitlement_codes AS entitlement_codes,
    UPPER(COALESCE(b.sales_channel, r.sales_channel, 'UNKNOWN')) AS sales_channel,
    UPPER(COALESCE(r.market_segment, 'UNKNOWN')) AS market_segment,
    UPPER(COALESCE(r.customer_type, 'UNKNOWN')) AS customer_type,
    UPPER(COALESCE(c.region_code, r.region_code, 'GLOBAL')) AS region_code,
    UPPER(COALESCE(c.country_code, r.country_code, a.country_code, 'GLOBAL')) AS country_code,
    LOWER(COALESCE(c.language_code, 'und')) AS language_code,
    UPPER(COALESCE(c.platform, a.platform, 'UNKNOWN')) AS platform,
    r.crm_product_id AS crm_product_id,
    COALESCE(b.effective_start_at, c.effective_start_at, r.effective_start_at, a.effective_start_at, e.effective_start_at, b.created_at, c.created_at, r.created_at) AS effective_start_at,
    COALESCE(b.effective_end_at, c.effective_end_at, r.effective_end_at, a.effective_end_at, e.effective_end_at, TIMESTAMP '9999-12-31 23:59:59+00') AS effective_end_at,
    CASE
      WHEN UPPER(COALESCE(b.plan_status, c.catalog_status, 'ACTIVE')) IN ('ACTIVE', 'AVAILABLE', 'PUBLISHED')
       AND COALESCE(b.effective_end_at, c.effective_end_at, r.effective_end_at, a.effective_end_at, e.effective_end_at, TIMESTAMP '9999-12-31 23:59:59+00') > CURRENT_TIMESTAMP()
      THEN TRUE ELSE FALSE
    END AS is_current,
    GREATEST(
      COALESCE(b.updated_at, TIMESTAMP '1970-01-01 00:00:00+00'),
      COALESCE(c.updated_at, TIMESTAMP '1970-01-01 00:00:00+00'),
      COALESCE(r.updated_at, TIMESTAMP '1970-01-01 00:00:00+00'),
      COALESCE(a.updated_at, TIMESTAMP '1970-01-01 00:00:00+00'),
      COALESCE(e.updated_at, TIMESTAMP '1970-01-01 00:00:00+00')
    ) AS source_updated_at,
    ARRAY_TO_STRING(
      ARRAY(
        SELECT source_name
        FROM UNNEST([
          IF(b.plan_id IS NOT NULL, 'SUBSCRIPTION_BILLING', NULL),
          IF(c.plan_id IS NOT NULL, 'PRODUCT_CATALOG', NULL),
          IF(r.plan_id IS NOT NULL, 'CRM', NULL),
          IF(a.plan_id IS NOT NULL, 'APP_STORE', NULL),
          IF(e.plan_id IS NOT NULL, 'ENTITLEMENT_SERVICE', NULL)
        ]) AS source_name
        WHERE source_name IS NOT NULL
      ),
      '|'
    ) AS source_system
  FROM resolved;


      CASE WHEN e.plan_id IS NOT NULL THEN 'ENTITLEMENT_SERVICE' END AS entitlement_source
    FROM plan_ids p
    LEFT JOIN billing_plans b ON p.plan_id = b.plan_id
    LEFT JOIN catalog_plans c ON p.plan_id = c.plan_id
    LEFT JOIN crm_products r ON p.plan_id = r.plan_id
    LEFT JOIN app_store_products a ON p.plan_id = a.plan_id
    LEFT JOIN entitlements e ON p.plan_id = e.plan_id

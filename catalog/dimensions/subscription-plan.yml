      c.updated_at AS catalog_updated_at,
      r.crm_product_id,
      r.product_code AS crm_product_code,
      r.product_name AS crm_product_name,
      r.product_family AS crm_product_family,
      r.product_category AS crm_product_category,
      r.market_segment,
      r.customer_type,
      r.sales_channel AS crm_sales_channel,
      r.region_code AS crm_region_code,
      r.country_code AS crm_country_code,
      r.effective_start_at AS crm_effective_start_at,
      r.effective_end_at AS crm_effective_end_at,
      r.created_at AS crm_created_at,
      r.updated_at AS crm_updated_at,
      a.app_store_product_id,
      a.billing_provider AS app_billing_provider,
      a.platform AS app_platform,
      a.billing_frequency AS app_billing_frequency,
      a.billing_interval_count AS app_billing_interval_count,
      a.currency_code AS app_currency_code,
      a.list_price AS app_list_price,
      a.country_code AS app_country_code,
      a.effective_start_at AS app_effective_start_at,
      a.effective_end_at AS app_effective_end_at,
      a.updated_at AS app_updated_at,
      e.entitlement_package_id,
      e.entitlement_codes,
      e.learner_limit,
      e.storage_limit_gb,
      e.access_level,
      e.content_tier,
      e.support_tier,
      e.effective_start_at AS entitlement_effective_start_at,
      e.effective_end_at AS entitlement_effective_end_at,
      e.updated_at AS entitlement_updated_at,
      CASE WHEN b.plan_id IS NOT NULL THEN 'SUBSCRIPTION_BILLING' END AS billing_source,

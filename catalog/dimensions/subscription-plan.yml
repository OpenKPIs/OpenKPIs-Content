    COALESCE(trial_available_flag, FALSE) AS trial_available_flag,
    COALESCE(trial_period_days, 0) AS trial_period_days,
    COALESCE(grace_period_days, 0) AS grace_period_days,
    UPPER(COALESCE(billing_currency_code, app_currency_code, 'UNKNOWN')) AS currency_code,
    COALESCE(billing_list_price, app_list_price) AS list_price,
    COALESCE(setup_fee, 0) AS setup_fee,
    COALESCE(discount_eligible_flag, FALSE) AS discount_eligible_flag,
    COALESCE(tax_inclusive_flag, FALSE) AS tax_inclusive_flag,
    COALESCE(auto_renew_flag, FALSE) AS auto_renew_flag,
    UPPER(COALESCE(seat_model, 'INDIVIDUAL')) AS seat_model,
    min_seats,
    max_seats,
    learner_limit,
    storage_limit_gb,
    UPPER(COALESCE(access_level, 'UNKNOWN')) AS access_level,
    UPPER(COALESCE(content_tier, 'UNKNOWN')) AS content_tier,
    UPPER(COALESCE(support_tier, 'UNKNOWN')) AS support_tier,
    entitlement_codes,
    UPPER(COALESCE(billing_sales_channel, crm_sales_channel, 'UNKNOWN')) AS sales_channel,
    UPPER(COALESCE(market_segment, 'UNKNOWN')) AS market_segment,
    UPPER(COALESCE(customer_type, 'UNKNOWN')) AS customer_type,
    UPPER(COALESCE(catalog_region_code, crm_region_code, 'GLOBAL')) AS region_code,
    UPPER(COALESCE(catalog_country_code, crm_country_code, app_country_code, 'GLOBAL')) AS country_code,
    LOWER(COALESCE(language_code, 'und')) AS language_code,
    UPPER(COALESCE(catalog_platform, app_platform, 'UNKNOWN')) AS platform,
    crm_product_id,
    COALESCE(billing_effective_start_at, catalog_effective_start_at, crm_effective_start_at, app_effective_start_at, entitlement_effective_start_at, billing_created_at, catalog_created_at, crm_created_at) AS effective_start_at,
    COALESCE(billing_effective_end_at, catalog_effective_end_at, crm_effective_end_at, app_effective_end_at, entitlement_effective_end_at, TIMESTAMP '9999-12-31 23:59:59') AS effective_end_at,
    CASE
      WHEN UPPER(COALESCE(plan_status, catalog_status, 'ACTIVE')) IN ('ACTIVE', 'AVAILABLE', 'PUBLISHED')
       AND COALESCE(billing_effective_end_at, catalog_effective_end_at, crm_effective_end_at, app_effective_end_at, entitlement_effective_end_at, TIMESTAMP '9999-12-31 23:59:59') > CURRENT_TIMESTAMP
      THEN TRUE ELSE FALSE
    END AS is_current,
    GREATEST(
      COALESCE(billing_updated_at, TIMESTAMP '1970-01-01 00:00:00'),
      COALESCE(catalog_updated_at, TIMESTAMP '1970-01-01 00:00:00'),
      COALESCE(crm_updated_at, TIMESTAMP '1970-01-01 00:00:00'),
      COALESCE(app_updated_at, TIMESTAMP '1970-01-01 00:00:00'),
      COALESCE(entitlement_updated_at, TIMESTAMP '1970-01-01 00:00:00')
    ) AS source_updated_at,
    CONCAT_WS('|', billing_source, catalog_source, crm_source, app_source, entitlement_source) AS source_system
  FROM resolved;

Calculation Notes: |
  Resolve the plan using the subscription event timestamp against the plan version's valid-from and valid-to timestamps; do not overwrite historical events with the current catalog definition. A renewal retains the existing plan unless a plan-change transaction occurred, while upgrades, downgrades, migrations, and reactivations use the newly effective plan from their contractual effective timestamp. Coupons, scholarships, credits, negotiated discounts, taxes, refunds, and payment failures do not change the plan classification unless they reference a distinct catalog plan identifier. Classify a trial under its destination paid plan when the trial is an introductory state of that plan; retain a separate plan only when the trial has its own catalog identifier and entitlements. Grandfathered, regional, institutional, app-store, and legacy variants must remain distinct when pricing, entitlements, currency, billing cadence, or contractual terms differ. Resolve timestamps in UTC, preserve the original plan on cancellation and refund events, and map missing or retired identifiers to UNKNOWN_PLAN until late-arriving catalog data is backfilled.

Business Use Case: |
  Revenue Management compares trial conversion, renewal rate, learner engagement, and recurring revenue across plan tiers and billing cadences. If an annual premium plan produces stronger retention but weak initial conversion, the team can test onboarding changes or targeted introductory offers without changing the plan's historical classification.



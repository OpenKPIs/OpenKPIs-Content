      b.billing_provider,
      b.external_plan_id,
      b.billing_frequency AS billing_billing_frequency,
      b.billing_interval_count AS billing_interval_count,
      b.billing_period_days,
      b.trial_available_flag,
      b.trial_period_days,
      b.grace_period_days,
      b.currency_code AS billing_currency_code,
      b.list_price AS billing_list_price,
      b.setup_fee,
      b.discount_eligible_flag,
      b.tax_inclusive_flag,
      b.auto_renew_flag,
      b.seat_model,
      b.min_seats,
      b.max_seats,
      b.sales_channel AS billing_sales_channel,
      b.effective_start_at AS billing_effective_start_at,
      b.effective_end_at AS billing_effective_end_at,
      b.created_at AS billing_created_at,
      b.updated_at AS billing_updated_at,
      c.plan_code AS catalog_plan_code,
      c.plan_name AS catalog_plan_name,
      c.plan_description AS catalog_plan_description,
      c.catalog_status,
      c.plan_type AS catalog_plan_type,
      c.product_id AS catalog_product_id,
      c.product_code AS catalog_product_code,
      c.product_name AS catalog_product_name,
      c.product_family AS catalog_product_family,
      c.product_category AS catalog_product_category,
      c.platform AS catalog_platform,
      c.region_code AS catalog_region_code,

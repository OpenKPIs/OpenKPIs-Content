Dimension Name: Traffic Source

Description: |
  Identifies the origin from which a user arrives at the e-commerce platform.

Category: Acquisition

Tags: [dimension]

Industry: Retail

Priority: High

Core Area: Generic

Scope: Event

Data Type: string

Aggregation Window: Event

GA4 Event: |
  page_view

Adobe Event: |
  pageView

W3 Data Layer: |
  {"page":{"type":"product","source":"organic"}}

GA4 Data Layer: |
  {"event":"page_view","traffic_source":"organic"}

Adobe Client Data Layer: |
  {"events":[{"type":"pageView","source":"organic"}]}

XDM Mapping: |
  {"_experience":{"analytics":{"trafficSource":"organic"}}}

Google Analytics SQL: |
  -- ==========================================
  -- 1. GOOGLE BIGQUERY SQL
  -- ==========================================
  SELECT traffic_source, COUNT(*) as traffic_count
  FROM `your-project.analytics_123456789.events_*`
  WHERE ga4_data_layer.event = 'page_view'
  GROUP BY traffic_source

AEP Query Service SQL: |
  -- ==========================================
  -- 2. ADOBE AEP QUERY SERVICE SQL
  -- ==========================================
  SELECT traffic_source, COUNT(*) as traffic_count
  FROM `aep_backend_dataset.events`
  WHERE adobe_event = 'pageView'
  GROUP BY traffic_source

Calculation Notes: |
  Includes direct, organic search, paid search, and referral sources.

Business Use Case: |
  Executives analyze the effectiveness of marketing channels to allocate budget efficiently.


Source Data: Digital Analytics

Report Attributes: |
  ["Traffic Source Type","Traffic Source Channel"]

Dashboard Usage: [Acquisition Dashboard]

Segment Eligibility: |
  true



Data Sensitivity: internal

Contains PII: No


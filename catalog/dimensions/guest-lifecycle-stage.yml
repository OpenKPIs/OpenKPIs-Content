Dimension Name: Guest Lifecycle Stage

Description: |
  Guest Lifecycle Stage classifies each digital guest or visitor into the mutually exclusive stage that best represents their current relationship with the hospitality brand. It distinguishes anonymous visitors, known prospects, booking-intent users, upcoming guests, in-stay guests, recent guests, and lapsed guests using identity, booking, and stay-date signals available at the evaluation time.

Category: Conversion

Tags: [dimension]

Industry: Travel & Hospitality

Priority: High

Core Area: Generic

Scope: User

Data Type: string


Dimension Name: Delivery Promise Date

Description: |
  Delivery Promise Date is the delivery date, or earliest-to-latest date window, committed to the customer at checkout and stored on the order, captured as delivery_promise_date (ISO 8601 date, with delivery_promise_earliest_date and delivery_promise_latest_date when the promise is a window) on add_shipping_info and purchase, and frozen at the value in force when the order is placed. It is the baseline that Shipment On-Time Delivery Rate measures actual delivery against, so operations, customer service and checkout teams can analyse promise accuracy by delivery option, fulfilment node and destination without confusing it with the carrier's later estimated delivery date, the actual delivered date or the shipping method purchased.

Category: Operations




























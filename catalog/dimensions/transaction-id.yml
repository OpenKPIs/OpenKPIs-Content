Dimension Name: Transaction ID

Description: |
  Transaction ID is the unique order identifier the commerce platform assigns when an order is confirmed and that is sent with the purchase event (GA4 `transaction_id`, Adobe Analytics `s.purchaseID`, XDM `commerce.order.purchaseID`), one value per order and never reused for a different order. It is the key that de-duplicates repeated purchase hits so that orders and revenue are counted once, and that joins clickstream purchases to order, refund and fulfilment records in the order management system for revenue reconciliation.


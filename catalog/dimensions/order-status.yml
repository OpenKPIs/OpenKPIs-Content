Dimension Name: Order Status

Description: |
  Order Status is where the whole order sits in its lifecycle, normalised to one governed list (Pending, Processing, On Hold, Shipped/Complete, Cancelled, Closed) and mapped from the native Adobe Commerce, Salesforce Commerce Cloud and Shopify order and fulfillment fields. Customer Service, fulfillment operations and finance use it to size and age the open-order backlog, read post-purchase behaviour against the status the customer actually saw, and separate net demand from cancelled or closed orders, without mixing in payment state, shipment-level carrier tracking or cancellation reasons.


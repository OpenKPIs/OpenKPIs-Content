Google Analytics SQL: |
  WITH visit_starts AS (
    SELECT
      (SELECT p.value.string_value FROM UNNEST(event_params) AS p WHERE p.key = 'web_visit_id') AS web_visit_id,
      (SELECT p.value.string_value FROM UNNEST(event_params) AS p WHERE p.key = 'browser_family') AS browser_family
    FROM `your-project.analytics_123456789.events_*`
    WHERE event_name = 'web_session_started'
      AND _TABLE_SUFFIX BETWEEN FORMAT_DATE('%Y%m%d', DATE_SUB(DATE(@report_start), INTERVAL 1 DAY))
                            AND FORMAT_DATE('%Y%m%d', DATE_ADD(DATE(@report_end), INTERVAL 1 DAY))
      AND event_timestamp >= UNIX_MICROS(@report_start)
      AND event_timestamp < UNIX_MICROS(@report_end)
  )
  SELECT web_visit_id, browser_family
  FROM visit_starts
  WHERE browser_family IS NOT NULL

AEP Query Service SQL: |
  SELECT e._id AS web_visit_id, e._openkpis.browserFamily AS browser_family
  FROM {{AEP_EXPERIENCE_EVENT_DATASET}} AS e
  WHERE e.eventType = 'web_session_started'
    AND e.timestamp >= CAST($report_start AS TIMESTAMP)
    AND e.timestamp < CAST($report_end AS TIMESTAMP)
    AND e._openkpis.browserFamily IS NOT NULL

Calculation Notes: |
  1️⃣ Capture the browser family on the first action of each web visit.
  2️⃣ Include starts at or after the UTC report start and before the UTC report end.
  3️⃣ Exclude missing browser values and return collected family labels unchanged.
  4️⃣ Collection must deliver one start record per visit using a unique, anonymous visit ID.
  5️⃣ Browser per page view is a separate event-level variant.

Business Use Case: |
  1️⃣ Product managers investigate when checkout completion falls for one browser family.
  2️⃣ Payments teams reproduce payment failures in the affected browser before changing redirect behavior.
  3️⃣ Front-end QA prioritizes test coverage for the browser families used most often at checkout.



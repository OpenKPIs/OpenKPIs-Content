Dimension Name: Device category

Description: |
  Device category is the form-factor class of the device behind an event or session (desktop, mobile, tablet or smart TV), resolved at collection time from the User-Agent string and User-Agent Client Hints and exposed as device.category in GA4 and as Mobile Device Type (XDM device.type) in Adobe Analytics. It is the main breakdown for finding device-level gaps in add-to-cart, checkout completion and order conversion, and it guides mobile checkout UX investment and device bid adjustments in paid media.

Category: Experience

Tags: [dimension, E-commerce: Top-of-Funnel & Marketing Acquisition]

Industry: E-commerce

Priority: High

Core Area: Generic

Scope: Session

Data Type: string

Aggregation Window: Event, Session, Daily, Weekly, Monthly


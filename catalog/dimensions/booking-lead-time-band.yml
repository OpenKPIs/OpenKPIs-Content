Dimension Name: Booking Lead Time Band

Description: |
  Classifies each digitally completed booking into a standardized range based on the number of local calendar days between booking confirmation and scheduled check-in. It enables comparison of advance-purchase behavior, conversion performance, demand timing, and revenue-management opportunities without exposing exact travel dates.

Category: Conversion

Tags: [dimension]

Industry: Travel & Hospitality

Priority: High

Core Area: Checkout

Scope: Event

Data Type: string

Aggregation Window: Event


Dimension Name: Supplier

Description: |
  Identifies the canonical third-party organization that provides the item or customer-facing service displayed, selected, purchased, billed, renewed, returned, or reviewed during a customer journey. It enables acquisition, engagement, conversion, retention, billing, and lifetime-value analysis by consistently attributing item-level customer interactions and commercial outcomes to the responsible supplier.

Category: Conversion

Tags: [dimension]

Industry: Logistics & Supply Chain

Priority: High

Core Area: Generic

Scope: Item

Data Type: string

Aggregation Window: Event


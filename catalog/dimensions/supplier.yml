      NULLIF(TRIM(CAST(product_item._tenant.supplier.supplier_subscription_platform_id AS VARCHAR)), '') AS supplier_subscription_platform_id,
      NULLIF(TRIM(CAST(product_item._tenant.supplier.supplier_support_account_id AS VARCHAR)), '') AS supplier_support_account_id,
      UPPER(NULLIF(TRIM(CAST(product_item._tenant.supplier.supplier_country_code AS VARCHAR)), '')) AS supplier_country_code,
      UPPER(NULLIF(TRIM(CAST(product_item._tenant.supplier.supplier_region_code AS VARCHAR)), '')) AS supplier_region_code,
      UPPER(NULLIF(TRIM(CAST(product_item._tenant.supplier.supplier_state_province_code AS VARCHAR)), '')) AS supplier_state_province_code,
      NULLIF(TRIM(CAST(product_item._tenant.supplier.supplier_city AS VARCHAR)), '') AS supplier_city,
      NULLIF(TRIM(CAST(product_item._tenant.supplier.supplier_postal_code AS VARCHAR)), '') AS supplier_postal_code,
      UPPER(NULLIF(TRIM(CAST(product_item._tenant.supplier.supplier_currency_code AS VARCHAR)), '')) AS supplier_currency_code,
      NULLIF(TRIM(CAST(product_item._tenant.supplier.supplier_language_code AS VARCHAR)), '') AS supplier_language_code,
      NULLIF(TRIM(CAST(product_item._tenant.supplier.supplier_timezone AS VARCHAR)), '') AS supplier_timezone,
      NULLIF(TRIM(CAST(product_item._tenant.supplier.supplier_industry AS VARCHAR)), '') AS supplier_industry,
      NULLIF(TRIM(CAST(product_item._tenant.supplier.supplier_category AS VARCHAR)), '') AS supplier_category,
      NULLIF(TRIM(CAST(product_item._tenant.supplier.supplier_subcategory AS VARCHAR)), '') AS supplier_subcategory,
      NULLIF(TRIM(CAST(product_item._tenant.supplier.supplier_channel AS VARCHAR)), '') AS supplier_channel,
      NULLIF(TRIM(CAST(product_item._tenant.supplier.supplier_fulfillment_model AS VARCHAR)), '') AS supplier_fulfillment_model,
      NULLIF(TRIM(CAST(product_item._tenant.supplier.supplier_service_model AS VARCHAR)), '') AS supplier_service_model,
      NULLIF(TRIM(CAST(product_item._tenant.supplier.supplier_payment_model AS VARCHAR)), '') AS supplier_payment_model,
      NULLIF(TRIM(CAST(product_item._tenant.supplier.supplier_contract_id AS VARCHAR)), '') AS supplier_contract_id,
      CAST(NULLIF(TRIM(CAST(product_item._tenant.supplier.supplier_contract_start_date AS VARCHAR)), '') AS DATE) AS supplier_contract_start_date,
      CAST(NULLIF(TRIM(CAST(product_item._tenant.supplier.supplier_contract_end_date AS VARCHAR)), '') AS DATE) AS supplier_contract_end_date,
      CAST(NULLIF(TRIM(CAST(product_item._tenant.supplier.supplier_onboarding_date AS VARCHAR)), '') AS DATE) AS supplier_onboarding_date,
      CAST(NULLIF(TRIM(CAST(product_item._tenant.supplier.supplier_offboarding_date AS VARCHAR)), '') AS DATE) AS supplier_offboarding_date,
      NULLIF(TRIM(CAST(product_item._tenant.supplier.supplier_service_level AS VARCHAR)), '') AS supplier_service_level,
      CAST(product_item._tenant.supplier.supplier_rating AS DOUBLE) AS supplier_rating,
      CAST(product_item._tenant.supplier.supplier_review_count AS BIGINT) AS supplier_review_count,
      CAST(product_item._tenant.supplier.supplier_is_preferred AS BOOLEAN) AS supplier_is_preferred,
      CAST(product_item._tenant.supplier.supplier_is_verified AS BOOLEAN) AS supplier_is_verified,
      CAST(product_item._tenant.supplier.supplier_is_active AS BOOLEAN) AS supplier_is_active,
      CAST(NULLIF(TRIM(CAST(product_item._tenant.supplier.supplier_effective_at AS VARCHAR)), '') AS TIMESTAMP) AS supplier_effective_at
    FROM exploded_items
    WHERE NULLIF(TRIM(CAST(product_item._tenant.supplier.supplier_id AS VARCHAR)), '') IS NOT NULL
  ),
  ranked_supplier AS (
    SELECT
      *,
      ROW_NUMBER() OVER (
        PARTITION BY supplier_id
        ORDER BY
          COALESCE(supplier_effective_at, source_event_timestamp) DESC,
          CAST(supplier_identity_version AS BIGINT) DESC,
          source_event_timestamp DESC
      ) AS row_number
    FROM typed_supplier
  )
  SELECT
    supplier_id,
    supplier_name,
    supplier_legal_name,
    supplier_display_name,
    supplier_type,
    supplier_status,
    supplier_tier,
    supplier_parent_id,
    supplier_parent_name,
    supplier_group_id,
    supplier_group_name,
    supplier_source_system,
    supplier_source_record_id,
    supplier_crosswalk_id,
    supplier_identity_version,
    supplier_identity_confidence,
    supplier_marketplace_id,
    supplier_crm_account_id,
    supplier_order_management_id,
    supplier_billing_account_id,
    supplier_subscription_platform_id,
    supplier_support_account_id,
    supplier_country_code,
    supplier_region_code,
    supplier_state_province_code,
    supplier_city,
    supplier_postal_code,
    supplier_currency_code,
    supplier_language_code,
    supplier_timezone,
    supplier_industry,
    supplier_category,
    supplier_subcategory,
    supplier_channel,
    supplier_fulfillment_model,
    supplier_service_model,
    supplier_payment_model,
    supplier_contract_id,
    supplier_contract_start_date,
    supplier_contract_end_date,
    supplier_onboarding_date,
    supplier_offboarding_date,
    supplier_service_level,
    supplier_rating,
    supplier_review_count,
    supplier_is_preferred,
    supplier_is_verified,
    supplier_is_active,
    supplier_effective_at
  FROM ranked_supplier
  WHERE row_number = 1;

Calculation Notes: |
  Store the stable canonical supplier identifier rather than a display name, legal name, contact name, brand, or marketplace seller identifier. Resolve source identifiers through an effective-dated supplier identity crosswalk and preserve the supplier valid at the time of the event; later supplier reassignment must not rewrite historical journey attribution. Capture the dimension at item-event grain for impressions, product views, cart actions, purchases, renewals, cancellations, returns, reviews, and billing events. For orders containing items from multiple suppliers, assign each item to its own supplier and do not create an order-level supplier unless all qualifying items map to the same canonical supplier. Distinguish the supplier from the marketplace seller when those parties differ, and use the party contractually responsible for providing the item or customer-facing service. Exclude payment processors, advertising platforms, internal departments, and carriers unless the carrier itself is the customer-purchased service. Map missing values to 'unknown', unresolved conflicting mappings to 'unresolved', and first-party inventory to a governed internal-supplier identifier rather than null. Refunds, returns, chargebacks, and cancellations retain the supplier from the originating item transaction. Test traffic, employee transactions, duplicate events, and deleted test suppliers must be excluded from production reporting.

Business Use Case: |
  The Chief Commercial Officer compares supplier-level product discovery, add-to-cart, purchase, repeat-purchase, return, billing-dispute, and satisfaction patterns to identify suppliers generating strong customer lifetime value rather than only initial sales. The marketplace and merchandising teams can then increase high-performing suppliers' placement in acquisition and discovery experiences, require corrective plans for suppliers associated with abandonment or poor retention, and adjust renewal or promotion strategies by supplier segment.


Source Data: Digital Analytics (GA4 or Adobe Analytics) and mobile event streams stitched with e-commerce catalog, marketplace partner CRM, order-management APIs, subscription platforms, customer support, and Billing/Stripe data through a governed supplier identity crosswalk


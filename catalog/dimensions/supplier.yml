  WITH parameter_values AS (
    SELECT
      event_timestamp AS source_event_timestamp,
      user_pseudo_id,
      stream_id,
      ep.key AS parameter_key,
      COALESCE(
        ep.value.string_value,
        CAST(ep.value.int_value AS STRING),
        CAST(ep.value.double_value AS STRING),
        CAST(ep.value.float_value AS STRING)
      ) AS parameter_value
    FROM `your-project.analytics_123456789.events_*`
    CROSS JOIN UNNEST(event_params) AS ep
    WHERE REGEXP_CONTAINS(_TABLE_SUFFIX, r'^\d{8}$')
      AND ep.key IN (
        'supplier_id', 'supplier_name', 'supplier_legal_name',
        'supplier_display_name', 'supplier_type', 'supplier_status',
        'supplier_tier', 'supplier_parent_id', 'supplier_parent_name',
        'supplier_group_id', 'supplier_group_name', 'supplier_source_system',
        'supplier_source_record_id', 'supplier_crosswalk_id',
        'supplier_identity_version', 'supplier_identity_confidence',
        'supplier_marketplace_id', 'supplier_crm_account_id',
        'supplier_order_management_id', 'supplier_billing_account_id',
        'supplier_subscription_platform_id', 'supplier_support_account_id',
        'supplier_country_code', 'supplier_region_code',
        'supplier_state_province_code', 'supplier_city', 'supplier_postal_code',
        'supplier_currency_code', 'supplier_language_code', 'supplier_timezone',
        'supplier_industry', 'supplier_category', 'supplier_subcategory',
        'supplier_channel', 'supplier_fulfillment_model', 'supplier_service_model',
        'supplier_payment_model', 'supplier_contract_id',
        'supplier_contract_start_date', 'supplier_contract_end_date',
        'supplier_onboarding_date', 'supplier_offboarding_date',
        'supplier_service_level', 'supplier_rating', 'supplier_review_count',
        'supplier_is_preferred', 'supplier_is_verified', 'supplier_is_active',
        'supplier_effective_at'
      )
  ),
  event_supplier AS (
    SELECT
      source_event_timestamp,
      user_pseudo_id,
      stream_id,
      MAX(IF(parameter_key = 'supplier_id', parameter_value, NULL)) AS supplier_id,
      MAX(IF(parameter_key = 'supplier_name', parameter_value, NULL)) AS supplier_name,
      MAX(IF(parameter_key = 'supplier_legal_name', parameter_value, NULL)) AS supplier_legal_name,
      MAX(IF(parameter_key = 'supplier_display_name', parameter_value, NULL)) AS supplier_display_name,
      MAX(IF(parameter_key = 'supplier_type', parameter_value, NULL)) AS supplier_type,
      MAX(IF(parameter_key = 'supplier_status', parameter_value, NULL)) AS supplier_status,
      MAX(IF(parameter_key = 'supplier_tier', parameter_value, NULL)) AS supplier_tier,
      MAX(IF(parameter_key = 'supplier_parent_id', parameter_value, NULL)) AS supplier_parent_id,
      MAX(IF(parameter_key = 'supplier_parent_name', parameter_value, NULL)) AS supplier_parent_name,
      MAX(IF(parameter_key = 'supplier_group_id', parameter_value, NULL)) AS supplier_group_id,
      MAX(IF(parameter_key = 'supplier_group_name', parameter_value, NULL)) AS supplier_group_name,
      MAX(IF(parameter_key = 'supplier_source_system', parameter_value, NULL)) AS supplier_source_system,
      MAX(IF(parameter_key = 'supplier_source_record_id', parameter_value, NULL)) AS supplier_source_record_id,
      MAX(IF(parameter_key = 'supplier_crosswalk_id', parameter_value, NULL)) AS supplier_crosswalk_id,
      MAX(IF(parameter_key = 'supplier_identity_version', parameter_value, NULL)) AS supplier_identity_version,
      MAX(IF(parameter_key = 'supplier_identity_confidence', parameter_value, NULL)) AS supplier_identity_confidence,
      MAX(IF(parameter_key = 'supplier_marketplace_id', parameter_value, NULL)) AS supplier_marketplace_id,
      MAX(IF(parameter_key = 'supplier_crm_account_id', parameter_value, NULL)) AS supplier_crm_account_id,
      MAX(IF(parameter_key = 'supplier_order_management_id', parameter_value, NULL)) AS supplier_order_management_id,
      MAX(IF(parameter_key = 'supplier_billing_account_id', parameter_value, NULL)) AS supplier_billing_account_id,
      MAX(IF(parameter_key = 'supplier_subscription_platform_id', parameter_value, NULL)) AS supplier_subscription_platform_id,
      MAX(IF(parameter_key = 'supplier_support_account_id', parameter_value, NULL)) AS supplier_support_account_id,
      MAX(IF(parameter_key = 'supplier_country_code', parameter_value, NULL)) AS supplier_country_code,
      MAX(IF(parameter_key = 'supplier_region_code', parameter_value, NULL)) AS supplier_region_code,
      MAX(IF(parameter_key = 'supplier_state_province_code', parameter_value, NULL)) AS supplier_state_province_code,
      MAX(IF(parameter_key = 'supplier_city', parameter_value, NULL)) AS supplier_city,
      MAX(IF(parameter_key = 'supplier_postal_code', parameter_value, NULL)) AS supplier_postal_code,
      MAX(IF(parameter_key = 'supplier_currency_code', parameter_value, NULL)) AS supplier_currency_code,
      MAX(IF(parameter_key = 'supplier_language_code', parameter_value, NULL)) AS supplier_language_code,
      MAX(IF(parameter_key = 'supplier_timezone', parameter_value, NULL)) AS supplier_timezone,
      MAX(IF(parameter_key = 'supplier_industry', parameter_value, NULL)) AS supplier_industry,
      MAX(IF(parameter_key = 'supplier_category', parameter_value, NULL)) AS supplier_category,
      MAX(IF(parameter_key = 'supplier_subcategory', parameter_value, NULL)) AS supplier_subcategory,
      MAX(IF(parameter_key = 'supplier_channel', parameter_value, NULL)) AS supplier_channel,
      MAX(IF(parameter_key = 'supplier_fulfillment_model', parameter_value, NULL)) AS supplier_fulfillment_model,
      MAX(IF(parameter_key = 'supplier_service_model', parameter_value, NULL)) AS supplier_service_model,
      MAX(IF(parameter_key = 'supplier_payment_model', parameter_value, NULL)) AS supplier_payment_model,
      MAX(IF(parameter_key = 'supplier_contract_id', parameter_value, NULL)) AS supplier_contract_id,
      MAX(IF(parameter_key = 'supplier_contract_start_date', parameter_value, NULL)) AS supplier_contract_start_date,
      MAX(IF(parameter_key = 'supplier_contract_end_date', parameter_value, NULL)) AS supplier_contract_end_date,
      MAX(IF(parameter_key = 'supplier_onboarding_date', parameter_value, NULL)) AS supplier_onboarding_date,
      MAX(IF(parameter_key = 'supplier_offboarding_date', parameter_value, NULL)) AS supplier_offboarding_date,
      MAX(IF(parameter_key = 'supplier_service_level', parameter_value, NULL)) AS supplier_service_level,
      MAX(IF(parameter_key = 'supplier_rating', parameter_value, NULL)) AS supplier_rating,
      MAX(IF(parameter_key = 'supplier_review_count', parameter_value, NULL)) AS supplier_review_count,
      MAX(IF(parameter_key = 'supplier_is_preferred', parameter_value, NULL)) AS supplier_is_preferred,
      MAX(IF(parameter_key = 'supplier_is_verified', parameter_value, NULL)) AS supplier_is_verified,
      MAX(IF(parameter_key = 'supplier_is_active', parameter_value, NULL)) AS supplier_is_active,
      MAX(IF(parameter_key = 'supplier_effective_at', parameter_value, NULL)) AS supplier_effective_at
    FROM parameter_values
    GROUP BY source_event_timestamp, user_pseudo_id, stream_id
  ),
  typed_supplier AS (
    SELECT
      source_event_timestamp,
      NULLIF(TRIM(supplier_id), '') AS supplier_id,
      NULLIF(TRIM(supplier_name), '') AS supplier_name,
      NULLIF(TRIM(supplier_legal_name), '') AS supplier_legal_name,
      NULLIF(TRIM(supplier_display_name), '') AS supplier_display_name,
      NULLIF(TRIM(supplier_type), '') AS supplier_type,
      NULLIF(TRIM(supplier_status), '') AS supplier_status,
      NULLIF(TRIM(supplier_tier), '') AS supplier_tier,
      NULLIF(TRIM(supplier_parent_id), '') AS supplier_parent_id,
      NULLIF(TRIM(supplier_parent_name), '') AS supplier_parent_name,
      NULLIF(TRIM(supplier_group_id), '') AS supplier_group_id,
      NULLIF(TRIM(supplier_group_name), '') AS supplier_group_name,
      NULLIF(TRIM(supplier_source_system), '') AS supplier_source_system,
      NULLIF(TRIM(supplier_source_record_id), '') AS supplier_source_record_id,
      NULLIF(TRIM(supplier_crosswalk_id), '') AS supplier_crosswalk_id,
      NULLIF(TRIM(supplier_identity_version), '') AS supplier_identity_version,
      SAFE_CAST(NULLIF(TRIM(supplier_identity_confidence), '') AS NUMERIC) AS supplier_identity_confidence,
      NULLIF(TRIM(supplier_marketplace_id), '') AS supplier_marketplace_id,
      NULLIF(TRIM(supplier_crm_account_id), '') AS supplier_crm_account_id,
      NULLIF(TRIM(supplier_order_management_id), '') AS supplier_order_management_id,
      NULLIF(TRIM(supplier_billing_account_id), '') AS supplier_billing_account_id,
      NULLIF(TRIM(supplier_subscription_platform_id), '') AS supplier_subscription_platform_id,
      NULLIF(TRIM(supplier_support_account_id), '') AS supplier_support_account_id,
      UPPER(NULLIF(TRIM(supplier_country_code), '')) AS supplier_country_code,
      UPPER(NULLIF(TRIM(supplier_region_code), '')) AS supplier_region_code,
      UPPER(NULLIF(TRIM(supplier_state_province_code), '')) AS supplier_state_province_code,
      NULLIF(TRIM(supplier_city), '') AS supplier_city,
      NULLIF(TRIM(supplier_postal_code), '') AS supplier_postal_code,
      UPPER(NULLIF(TRIM(supplier_currency_code), '')) AS supplier_currency_code,
      NULLIF(TRIM(supplier_language_code), '') AS supplier_language_code,
      NULLIF(TRIM(supplier_timezone), '') AS supplier_timezone,
      NULLIF(TRIM(supplier_industry), '') AS supplier_industry,
      NULLIF(TRIM(supplier_category), '') AS supplier_category,
      NULLIF(TRIM(supplier_subcategory), '') AS supplier_subcategory,
      NULLIF(TRIM(supplier_channel), '') AS supplier_channel,
      NULLIF(TRIM(supplier_fulfillment_model), '') AS supplier_fulfillment_model,
      NULLIF(TRIM(supplier_service_model), '') AS supplier_service_model,
      NULLIF(TRIM(supplier_payment_model), '') AS supplier_payment_model,
      NULLIF(TRIM(supplier_contract_id), '') AS supplier_contract_id,
      SAFE_CAST(NULLIF(TRIM(supplier_contract_start_date), '') AS DATE) AS supplier_contract_start_date,
      SAFE_CAST(NULLIF(TRIM(supplier_contract_end_date), '') AS DATE) AS supplier_contract_end_date,
      SAFE_CAST(NULLIF(TRIM(supplier_onboarding_date), '') AS DATE) AS supplier_onboarding_date,
      SAFE_CAST(NULLIF(TRIM(supplier_offboarding_date), '') AS DATE) AS supplier_offboarding_date,
      NULLIF(TRIM(supplier_service_level), '') AS supplier_service_level,
      SAFE_CAST(NULLIF(TRIM(supplier_rating), '') AS NUMERIC) AS supplier_rating,
      SAFE_CAST(NULLIF(TRIM(supplier_review_count), '') AS INT64) AS supplier_review_count,
      SAFE_CAST(NULLIF(LOWER(TRIM(supplier_is_preferred)), '') AS BOOL) AS supplier_is_preferred,
      SAFE_CAST(NULLIF(LOWER(TRIM(supplier_is_verified)), '') AS BOOL) AS supplier_is_verified,
      SAFE_CAST(NULLIF(LOWER(TRIM(supplier_is_active)), '') AS BOOL) AS supplier_is_active,
      SAFE_CAST(NULLIF(TRIM(supplier_effective_at), '') AS TIMESTAMP) AS supplier_effective_at
    FROM event_supplier
    WHERE NULLIF(TRIM(supplier_id), '') IS NOT NULL
  ),
  ranked_supplier AS (
    SELECT
      *,
      ROW_NUMBER() OVER (
        PARTITION BY supplier_id
        ORDER BY
          COALESCE(supplier_effective_at, TIMESTAMP_MICROS(source_event_timestamp)) DESC,
          SAFE_CAST(supplier_identity_version AS INT64) DESC,
          source_event_timestamp DESC
      ) AS row_number
    FROM typed_supplier
  )
  SELECT

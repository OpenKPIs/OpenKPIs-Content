    supplier_billing_account_id,
    supplier_subscription_platform_id,
    supplier_support_account_id,
    supplier_country_code,
    supplier_region_code,
    supplier_state_province_code,
    supplier_city,
    supplier_postal_code,
    supplier_currency_code,
    supplier_language_code,
    supplier_timezone,
    supplier_industry,
    supplier_category,
    supplier_subcategory,
    supplier_channel,
    supplier_fulfillment_model,
    supplier_service_model,
    supplier_payment_model,
    supplier_contract_id,
    supplier_contract_start_date,
    supplier_contract_end_date,
    supplier_onboarding_date,
    supplier_offboarding_date,
    supplier_service_level,
    supplier_rating,
    supplier_review_count,
    supplier_is_preferred,
    supplier_is_verified,
    supplier_is_active,
    supplier_effective_at
  FROM ranked_supplier
  WHERE row_number = 1;


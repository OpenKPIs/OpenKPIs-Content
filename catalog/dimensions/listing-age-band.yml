Dimension Name: Listing Age Band

Description: |
  Classifies each listing episode by the number of completed 24-hour periods between its governed episode start timestamp and the effective analysis timestamp. It enables consistent analysis of inventory freshness, exposure, engagement, and conversion across standardized age ranges.

Category: Performance

Tags: [dimension]


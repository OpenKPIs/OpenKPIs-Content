Dimension Name: Inventory Class

Description: |
  Inventory Class identifies the governed customer-facing availability and fulfillment model assigned to an item when a customer interaction occurs, such as stocked, preorder, dropship, or digital non-inventory. It enables journey teams to compare discovery, checkout, billing, delivery-promise, retention, and lifetime-value outcomes for items carrying different purchase and fulfillment expectations.

Category: Conversion

Tags: [dimension]

Industry: Logistics & Supply Chain

Priority: High

Core Area: Generic

Scope: Item

Data Type: string


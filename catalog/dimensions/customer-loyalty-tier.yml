Dimension Name: Customer Loyalty Tier

Description: |
  Classifies each identified customer into the loyalty program tier (for example Bronze, Silver, Gold, Platinum) that the program had formally assigned at the moment an event occurred, keeping Not Enrolled and Unknown as separate values. It is the canonical loyalty tier dimension for comparing conversion, order value, purchase frequency, revenue share and retention across tiers; Traveler Loyalty Tier specialises the same concept for travel elite-status programs.

Category: Retention

Tags: [dimension, E-commerce: Customer Retention, Loyalty & LTV, Retail]

Industry: Travel & Hospitality, E-commerce

Priority: High

Core Area: Engagement

Scope: User

Data Type: string

Aggregation Window: User; Time based - Daily snapshot with event-time attribution, Event, Session, User, Daily


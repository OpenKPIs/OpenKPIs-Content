    consent_analytics_storage,
    consent_ads_storage,
    tier_effective_at AS record_valid_from,
    COALESCE(tier_expiration_at, TIMESTAMP '9999-12-31 23:59:59') AS record_valid_to,
    TRUE AS is_current,
    CURRENT_TIMESTAMP AS record_created_at,
    CURRENT_TIMESTAMP AS record_updated_at,
    CASE
      WHEN customer_key IS NULL THEN 'INVALID_IDENTITY'
      WHEN normalized_tier NOT IN ('BRONZE', 'SILVER', 'GOLD', 'PLATINUM', 'DIAMOND') THEN 'UNMAPPED_TIER'
      ELSE 'VALID'
    END AS data_quality_status
  FROM ranked
  WHERE current_row_number = 1;

Calculation Notes: |
  1️⃣ Use the loyalty tier effective interval: effective_start_timestamp <= event_timestamp < effective_end_timestamp in UTC.  
  2️⃣ Do not backfill current tier onto historical events to avoid look-ahead bias.  
  3️⃣ Label records without effective-dated history as current-snapshot attribution via metadata.  
  4️⃣ Preserve NOT_ENROLLED separately from UNKNOWN; map tier names through the approved crosswalk.  
  5️⃣ Never infer a higher tier from points, spend, bookings, or engagement unless formally assigned.  
  6️⃣ For overlapping tier records, select the latest source update timestamp after quarantining conflicts.  
  7️⃣ Exclude employee, test, bot, synthetic-monitoring, and deleted-account profiles from standard reporting unless requested.

Business Use Case: |
  The Chief Marketing Officer compares digital booking conversion and repeat-visit rates by event-time loyalty tier, identifies that eligible Gold and Platinum members abandon during benefit selection, and prioritizes a personalized digital checkout experience that surfaces applicable benefits before payment. The loyalty team subsequently measures whether the intervention improves conversion and retained digital engagement for those tiers without overstating results by applying current status to historical sessions.



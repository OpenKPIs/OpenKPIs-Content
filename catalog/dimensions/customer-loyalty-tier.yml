        WHEN identityMap['CRMID'][0].id IS NOT NULL THEN 'CUSTOMER_ID'
        WHEN identityMap['LOYALTY_ID'][0].id IS NOT NULL THEN 'LOYALTY_MEMBER_ID'
        ELSE 'ECID'
      END AS identity_type,
      CASE
        WHEN identityMap['CRMID'][0].id IS NOT NULL OR identityMap['LOYALTY_ID'][0].id IS NOT NULL THEN TRUE
        ELSE FALSE
      END AS identity_is_authenticated,
      CAST(NULL AS VARCHAR) AS country,
      CAST(NULL AS VARCHAR) AS region,
      CAST(NULL AS VARCHAR) AS city,
      CAST(NULL AS VARCHAR) AS language,
      CAST(NULL AS VARCHAR) AS device_category,
      CAST(NULL AS VARCHAR) AS operating_system,
      CAST(NULL AS VARCHAR) AS browser,
      CAST(NULL AS VARCHAR) AS acquisition_source,
      CAST(NULL AS VARCHAR) AS acquisition_medium,
      CAST(NULL AS VARCHAR) AS acquisition_campaign,
      CAST(NULL AS VARCHAR) AS consent_analytics_storage,
      CAST(NULL AS VARCHAR) AS consent_ads_storage
    FROM your_aep_experience_event_dataset
    WHERE _experience.analytics.customDimensions.eVars.eVar1 IS NOT NULL
      AND TRIM(CAST(_experience.analytics.customDimensions.eVars.eVar1 AS VARCHAR)) <> ''
      AND COALESCE(
        identityMap['CRMID'][0].id,
        identityMap['LOYALTY_ID'][0].id,
        identityMap['ECID'][0].id
      ) IS NOT NULL
  ),
  loyalty_platform_source AS (
    SELECT
      COALESCE(NULLIF(customer_id, ''), NULLIF(loyalty_member_id, '')) AS customer_key,
      NULLIF(customer_id, '') AS customer_id,
      CAST(NULL AS VARCHAR) AS user_pseudo_id,
      NULLIF(loyalty_member_id, '') AS loyalty_member_id,
      loyalty_tier AS raw_tier,
      COALESCE(tier_effective_at, updated_at) AS tier_effective_at,
      updated_at AS tier_observed_at,
      tier_expiration_at,
      COALESCE(is_active, TRUE) AS tier_is_active,
      'DIGITAL_LOYALTY_PLATFORM' AS source_system,
      'your_aep_loyalty_profile_dataset' AS source_dataset,
      'profile_update' AS source_event_name,
      CONCAT(COALESCE(customer_id, loyalty_member_id), '|', CAST(updated_at AS VARCHAR)) AS source_event_id,
      CAST(updated_at AS DATE) AS source_event_date,
      'LOYALTY_PLATFORM' AS source_platform,
      CAST(NULL AS VARCHAR) AS source_stream_id,
      'loyalty_profile' AS source_method,
      1 AS source_priority,
      CASE WHEN NULLIF(customer_id, '') IS NOT NULL THEN 'CUSTOMER_ID' ELSE 'LOYALTY_MEMBER_ID' END AS identity_type,
      TRUE AS identity_is_authenticated,
      country,
      region,
      city,
      CAST(NULL AS VARCHAR) AS language,
      CAST(NULL AS VARCHAR) AS device_category,
      CAST(NULL AS VARCHAR) AS operating_system,
      CAST(NULL AS VARCHAR) AS browser,
      CAST(NULL AS VARCHAR) AS acquisition_source,
      CAST(NULL AS VARCHAR) AS acquisition_medium,
      CAST(NULL AS VARCHAR) AS acquisition_campaign,
      CAST(NULL AS VARCHAR) AS consent_analytics_storage,
      CAST(NULL AS VARCHAR) AS consent_ads_storage
    FROM your_aep_loyalty_profile_dataset
    WHERE COALESCE(NULLIF(customer_id, ''), NULLIF(loyalty_member_id, '')) IS NOT NULL
      AND NULLIF(TRIM(loyalty_tier), '') IS NOT NULL
  ),
  normalized AS (
    SELECT
      s.*,
      CASE
        WHEN UPPER(TRIM(raw_tier)) IN ('BRONZE', 'BRONZE TIER', 'BRONZE_TIER') THEN 'BRONZE'
        WHEN UPPER(TRIM(raw_tier)) IN ('SILVER', 'SILVER TIER', 'SILVER_TIER') THEN 'SILVER'
        WHEN UPPER(TRIM(raw_tier)) IN ('GOLD', 'GOLD TIER', 'GOLD_TIER') THEN 'GOLD'
        WHEN UPPER(TRIM(raw_tier)) IN ('PLATINUM', 'PLATINUM TIER', 'PLATINUM_TIER') THEN 'PLATINUM'
        WHEN UPPER(TRIM(raw_tier)) IN ('DIAMOND', 'DIAMOND TIER', 'DIAMOND_TIER') THEN 'DIAMOND'
        ELSE UPPER(REPLACE(TRIM(raw_tier), ' ', '_'))
      END AS normalized_tier
    FROM (
      SELECT * FROM aep_event_source
      UNION ALL
      SELECT * FROM loyalty_platform_source
    ) s
    WHERE raw_tier IS NOT NULL
      AND TRIM(raw_tier) <> ''
  ),
  sequenced AS (
    SELECT
      n.*,
      LAG(normalized_tier) OVER (
        PARTITION BY customer_key
        ORDER BY tier_observed_at, source_priority DESC, source_event_id
      ) AS prior_loyalty_tier
    FROM normalized n
  ),
  measured AS (
    SELECT
      s.*,
      MIN(tier_observed_at) OVER (PARTITION BY customer_key) AS tier_first_observed_at,
      MAX(tier_observed_at) OVER (PARTITION BY customer_key) AS tier_last_observed_at,
      SUM(
        CASE
          WHEN prior_loyalty_tier IS NOT NULL AND prior_loyalty_tier <> normalized_tier THEN 1
          ELSE 0
        END
      ) OVER (PARTITION BY customer_key) AS tier_change_count
    FROM sequenced s
  ),
  ranked AS (
    SELECT
      m.*,
      ROW_NUMBER() OVER (
        PARTITION BY customer_key
        ORDER BY source_priority, tier_observed_at DESC, tier_effective_at DESC, source_event_id DESC
      ) AS current_row_number
    FROM measured m
  )
  SELECT
    customer_key,
    customer_id,
    user_pseudo_id,
    loyalty_member_id,
    normalized_tier AS customer_loyalty_tier,
    normalized_tier AS loyalty_tier_code,
    CASE normalized_tier
      WHEN 'BRONZE' THEN 'Bronze'
      WHEN 'SILVER' THEN 'Silver'
      WHEN 'GOLD' THEN 'Gold'
      WHEN 'PLATINUM' THEN 'Platinum'
      WHEN 'DIAMOND' THEN 'Diamond'
      ELSE REPLACE(normalized_tier, '_', ' ')
    END AS loyalty_tier_name,
    CASE normalized_tier
      WHEN 'BRONZE' THEN 1
      WHEN 'SILVER' THEN 2
      WHEN 'GOLD' THEN 3
      WHEN 'PLATINUM' THEN 4
      WHEN 'DIAMOND' THEN 5
      ELSE 0
    END AS loyalty_tier_rank,
    CASE
      WHEN normalized_tier IN ('BRONZE', 'SILVER') THEN 'STANDARD'
      WHEN normalized_tier IN ('GOLD', 'PLATINUM') THEN 'PREMIUM'
      WHEN normalized_tier = 'DIAMOND' THEN 'ELITE'
      ELSE 'UNMAPPED'
    END AS loyalty_tier_group,
    CASE WHEN normalized_tier IN ('BRONZE', 'SILVER', 'GOLD', 'PLATINUM', 'DIAMOND') THEN 'RECOGNIZED' ELSE 'UNMAPPED' END AS loyalty_tier_status,
    CASE WHEN normalized_tier IN ('BRONZE', 'SILVER', 'GOLD', 'PLATINUM', 'DIAMOND') THEN TRUE ELSE FALSE END AS tier_is_recognized,
    tier_is_active,
    tier_effective_at,
    tier_observed_at,
    tier_expiration_at,
    tier_first_observed_at,
    tier_last_observed_at,
    prior_loyalty_tier,
    CASE WHEN prior_loyalty_tier IS NOT NULL AND prior_loyalty_tier <> normalized_tier THEN TRUE ELSE FALSE END AS tier_changed_flag,
    tier_change_count,
    source_system,
    source_dataset,
    source_event_name,
    source_event_id,
    source_event_date,
    source_platform,
    source_stream_id,
    source_method,
    source_priority,
    identity_type,
    identity_is_authenticated,
    country,

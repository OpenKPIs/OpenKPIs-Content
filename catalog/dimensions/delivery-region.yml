Google Analytics SQL: |
  -- ==========================================
  -- 1. GOOGLE BIGQUERY SQL (GA4 Export)
  -- ==========================================
  SELECT DISTINCT
    geo.region AS delivery_region
  FROM `your-project.analytics_123456789.events_*`,
    UNNEST(geo) AS geo
  WHERE geo.region IS NOT NULL
    AND _TABLE_SUFFIX BETWEEN '20230101' AND '20231231';

AEP Query Service SQL: |
  -- ==========================================
  -- 2. ADOBE AEP QUERY SERVICE SQL
  -- ==========================================
  SELECT DISTINCT
    location.region AS delivery_region
  FROM aep_backend_dataset
  WHERE location.region IS NOT NULL;

Calculation Notes: |
  Ensure regions are consistently defined and updated to reflect changes in delivery zones.

Business Use Case: |
  Executives use this dimension to analyze delivery efficiency and optimize resource allocation across different regions.



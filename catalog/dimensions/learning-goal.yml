          MAX(IF(ep.key = 'confidence_score', COALESCE(ep.value.string_value, CAST(ep.value.int_value AS STRING), CAST(ep.value.double_value AS STRING)), NULL)) AS confidence_score,
          MAX(IF(ep.key = 'consent_status', ep.value.string_value, NULL)) AS consent_status,

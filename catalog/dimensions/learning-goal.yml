          MAX(IF(ep.key = 'current_proficiency_level', ep.value.string_value, NULL)) AS current_proficiency_level,
          MAX(IF(ep.key = 'credential_type', ep.value.string_value, NULL)) AS credential_type,
          MAX(IF(ep.key = 'credential_name', ep.value.string_value, NULL)) AS credential_name,
          MAX(IF(ep.key = 'certification_provider', ep.value.string_value, NULL)) AS certification_provider,
          MAX(IF(ep.key = 'career_objective', ep.value.string_value, NULL)) AS career_objective,
          MAX(IF(ep.key = 'target_role', ep.value.string_value, NULL)) AS target_role,
          MAX(IF(ep.key = 'target_industry', ep.value.string_value, NULL)) AS target_industry,
          MAX(IF(ep.key = 'academic_objective', ep.value.string_value, NULL)) AS academic_objective,
          MAX(IF(ep.key = 'academic_level', ep.value.string_value, NULL)) AS academic_level,
          MAX(IF(ep.key = 'program_name', ep.value.string_value, NULL)) AS program_name,
          MAX(IF(ep.key = 'course_id', ep.value.string_value, NULL)) AS course_id,
          MAX(IF(ep.key = 'learning_path_id', ep.value.string_value, NULL)) AS learning_path_id,
          MAX(IF(ep.key = 'delivery_mode', ep.value.string_value, NULL)) AS delivery_mode,
          MAX(IF(ep.key = 'commitment_level', ep.value.string_value, NULL)) AS commitment_level,
          MAX(IF(ep.key = 'target_completion_date', ep.value.string_value, NULL)) AS target_completion_date,
          MAX(IF(ep.key = 'expected_duration_days', COALESCE(ep.value.string_value, CAST(ep.value.int_value AS STRING), CAST(ep.value.double_value AS STRING)), NULL)) AS expected_duration_days,
          MAX(IF(ep.key = 'weekly_study_hours', COALESCE(ep.value.string_value, CAST(ep.value.int_value AS STRING), CAST(ep.value.double_value AS STRING)), NULL)) AS weekly_study_hours,

Calculation Notes: |
  1️⃣ Populate only from explicit digital goal selections, profile updates, onboarding responses, or confirmed LMS preferences; do not treat content browsing as a declared goal.
  2️⃣ Normalize source values through a governed learning-goal taxonomy while retaining the original source value for lineage and remapping.
  3️⃣ Apply effective dating so historical events retain the goal active at the event timestamp rather than inheriting the learner's latest goal.
  4️⃣ When multiple goals are permitted, use the explicitly designated primary goal; otherwise apply the governed source-precedence rule and store secondary goals separately.
  5️⃣ Map blank, deleted, unmapped, or invalid values to controlled states such as "Not Provided" or "Other" rather than null-like free-text variants.
  6️⃣ Stitch anonymous selections to authenticated learner profiles only through approved deterministic identity resolution and applicable consent controls.
  7️⃣ Exclude internal testers, automated traffic, corrupted events, and goal updates lacking a valid learner identifier, event timestamp, or taxonomy version.

Business Use Case: |
  The Chief Product Officer can compare activation, course-start, completion, and subscription-conversion patterns across declared learning goals, then prioritize onboarding journeys and content recommendations for high-intent goals with strong demand but weak progression. Product and curriculum teams can also identify goals that lack aligned courses or learning paths and direct roadmap investment toward those coverage gaps.



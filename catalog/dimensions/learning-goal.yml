          MAX(IF(ep.key = 'schema_version', ep.value.string_value, NULL)) AS schema_version
        FROM UNNEST(e.event_params) AS ep
      ) AS p
    FROM `your-project.analytics_123456789.events_*` AS e
    WHERE e.event_name = 'select_content'
  ),
  normalized AS (
    SELECT
      NULLIF(TRIM(COALESCE(p.goal_id, p.item_id)), '') AS goal_id,
      NULLIF(TRIM(p.goal_name), '') AS goal_name,
      NULLIF(TRIM(p.normalized_goal), '') AS normalized_goal,
      NULLIF(TRIM(p.goal_category), '') AS goal_category,
      NULLIF(TRIM(p.goal_subcategory), '') AS goal_subcategory,
      NULLIF(TRIM(p.goal_type), '') AS goal_type,
      NULLIF(TRIM(p.goal_description), '') AS goal_description,
      NULLIF(TRIM(p.intended_outcome), '') AS intended_outcome,
      NULLIF(TRIM(p.subject_area), '') AS subject_area,
      NULLIF(TRIM(p.skill_domain), '') AS skill_domain,
      NULLIF(TRIM(p.target_skill), '') AS target_skill,
      NULLIF(TRIM(p.target_proficiency_level), '') AS target_proficiency_level,
      NULLIF(TRIM(p.current_proficiency_level), '') AS current_proficiency_level,
      NULLIF(TRIM(p.credential_type), '') AS credential_type,
      NULLIF(TRIM(p.credential_name), '') AS credential_name,
      NULLIF(TRIM(p.certification_provider), '') AS certification_provider,
      NULLIF(TRIM(p.career_objective), '') AS career_objective,
      NULLIF(TRIM(p.target_role), '') AS target_role,
      NULLIF(TRIM(p.target_industry), '') AS target_industry,
      NULLIF(TRIM(p.academic_objective), '') AS academic_objective,
      NULLIF(TRIM(p.academic_level), '') AS academic_level,
      NULLIF(TRIM(p.program_name), '') AS program_name,
      NULLIF(TRIM(p.course_id), '') AS course_id,
      NULLIF(TRIM(p.learning_path_id), '') AS learning_path_id,
      NULLIF(TRIM(p.delivery_mode), '') AS delivery_mode,
      NULLIF(TRIM(p.commitment_level), '') AS commitment_level,
      SAFE_CAST(NULLIF(TRIM(p.target_completion_date), '') AS DATE) AS target_completion_date,
      SAFE_CAST(NULLIF(TRIM(p.expected_duration_days), '') AS INT64) AS expected_duration_days,
      SAFE_CAST(NULLIF(TRIM(p.weekly_study_hours), '') AS NUMERIC) AS weekly_study_hours,
      SAFE_CAST(NULLIF(TRIM(p.priority), '') AS INT64) AS priority,
      NULLIF(TRIM(p.motivation), '') AS motivation,
      NULLIF(TRIM(p.declaration_method), '') AS declaration_method,
      NULLIF(TRIM(p.declaration_source), '') AS declaration_source,
      NULLIF(TRIM(p.source_system), '') AS source_system,
      NULLIF(TRIM(p.source_channel), '') AS source_channel,
      COALESCE(SAFE_CAST(NULLIF(TRIM(p.first_declared_at), '') AS TIMESTAMP), TIMESTAMP_MICROS(event_timestamp)) AS first_declared_at,
      COALESCE(SAFE_CAST(NULLIF(TRIM(p.effective_from), '') AS TIMESTAMP), TIMESTAMP_MICROS(event_timestamp)) AS effective_from,
      SAFE_CAST(NULLIF(TRIM(p.effective_to), '') AS TIMESTAMP) AS effective_to,
      COALESCE(SAFE_CAST(NULLIF(TRIM(p.last_updated_at), '') AS TIMESTAMP), TIMESTAMP_MICROS(event_timestamp)) AS last_updated_at,
      NULLIF(TRIM(p.status), '') AS status,
      CASE
        WHEN LOWER(NULLIF(TRIM(p.is_primary), '')) IN ('true', '1', 'yes') THEN TRUE
        WHEN LOWER(NULLIF(TRIM(p.is_primary), '')) IN ('false', '0', 'no') THEN FALSE
      END AS is_primary,
      CASE
        WHEN LOWER(NULLIF(TRIM(p.is_inferred), '')) IN ('true', '1', 'yes') THEN TRUE
        WHEN LOWER(NULLIF(TRIM(p.is_inferred), '')) IN ('false', '0', 'no') THEN FALSE
      END AS is_inferred,
      SAFE_CAST(NULLIF(TRIM(p.confidence_score), '') AS NUMERIC) AS confidence_score,
      NULLIF(TRIM(p.consent_status), '') AS consent_status,
      NULLIF(TRIM(p.locale), '') AS locale,
      UPPER(NULLIF(TRIM(p.country_code), '')) AS country_code,
      NULLIF(TRIM(p.organization_id), '') AS organization_id,
      NULLIF(TRIM(p.taxonomy_version), '') AS taxonomy_version,
      NULLIF(TRIM(p.schema_version), '') AS schema_version,
      event_timestamp
    FROM extracted
    WHERE LOWER(NULLIF(TRIM(p.content_type), '')) = 'learning_goal'
      AND NULLIF(TRIM(COALESCE(p.goal_id, p.item_id)), '') IS NOT NULL
  ),
  ranked AS (
    SELECT
      normalized.*,
      ROW_NUMBER() OVER (
        PARTITION BY goal_id, effective_from
        ORDER BY last_updated_at DESC, event_timestamp DESC
      ) AS version_rank
    FROM normalized
  )

      NULLIF(TRIM(CAST(_tenantId.learningGoal.schemaVersion AS VARCHAR)), '') AS schema_version,
      CAST(timestamp AS TIMESTAMP) AS event_timestamp
    FROM aep_learning_goal_event_dataset

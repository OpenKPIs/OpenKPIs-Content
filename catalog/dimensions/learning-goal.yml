Dimension Name: Learning Goal

Description: |
  Learning Goal identifies the normalized outcome a learner explicitly intends to achieve through the digital learning experience, such as career advancement, certification preparation, skill development, or academic mastery. It records the effective goal applicable to each learner and attributable digital interaction, enabling analysis of behavior, progression, and conversion by declared learning intent.

Category: Engagement

Tags: [dimension]

Industry: EdTech & E-Learning

Priority: High

Core Area: Onboarding

Scope: User

Data Type: string

Aggregation Window: User (effective-dated with point-in-time event attribution)


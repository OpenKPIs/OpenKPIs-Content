    learning_path_id,
    delivery_mode,
    commitment_level,
    target_completion_date,
    expected_duration_days,
    weekly_study_hours,
    priority,
    motivation,
    declaration_method,
    declaration_source,
    source_system,
    source_channel,
    first_declared_at,
    effective_from,
    effective_to,
    last_updated_at,
    status,
    is_primary,
    is_inferred,
    confidence_score,
    consent_status,
    locale,
    country_code,
    organization_id,
    taxonomy_version,
    schema_version
  FROM ranked
  WHERE version_rank = 1;


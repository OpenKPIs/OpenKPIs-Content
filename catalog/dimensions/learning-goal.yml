          MAX(IF(ep.key = 'last_updated_at', ep.value.string_value, NULL)) AS last_updated_at,
          MAX(IF(ep.key = 'status', ep.value.string_value, NULL)) AS status,
          MAX(IF(ep.key = 'is_primary', COALESCE(ep.value.string_value, CAST(ep.value.int_value AS STRING)), NULL)) AS is_primary,

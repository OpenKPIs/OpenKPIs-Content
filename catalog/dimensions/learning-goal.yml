  WITH extracted AS (
    SELECT
      e.event_timestamp,
      (
        SELECT AS STRUCT
          MAX(IF(ep.key = 'content_type', COALESCE(ep.value.string_value, CAST(ep.value.int_value AS STRING), CAST(ep.value.double_value AS STRING), CAST(ep.value.float_value AS STRING)), NULL)) AS content_type,
          MAX(IF(ep.key = 'item_id', COALESCE(ep.value.string_value, CAST(ep.value.int_value AS STRING)), NULL)) AS item_id,
          MAX(IF(ep.key = 'goal_id', ep.value.string_value, NULL)) AS goal_id,
          MAX(IF(ep.key = 'goal_name', ep.value.string_value, NULL)) AS goal_name,
          MAX(IF(ep.key = 'normalized_goal', ep.value.string_value, NULL)) AS normalized_goal,
          MAX(IF(ep.key = 'goal_category', ep.value.string_value, NULL)) AS goal_category,
          MAX(IF(ep.key = 'goal_subcategory', ep.value.string_value, NULL)) AS goal_subcategory,
          MAX(IF(ep.key = 'goal_type', ep.value.string_value, NULL)) AS goal_type,
          MAX(IF(ep.key = 'goal_description', ep.value.string_value, NULL)) AS goal_description,
          MAX(IF(ep.key = 'intended_outcome', ep.value.string_value, NULL)) AS intended_outcome,
          MAX(IF(ep.key = 'subject_area', ep.value.string_value, NULL)) AS subject_area,

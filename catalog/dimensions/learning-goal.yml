      NULLIF(TRIM(CAST(_tenantId.learningGoal.goalName AS VARCHAR)), '') AS goal_name,
      NULLIF(TRIM(CAST(_tenantId.learningGoal.normalizedGoal AS VARCHAR)), '') AS normalized_goal,
      NULLIF(TRIM(CAST(_tenantId.learningGoal.goalCategory AS VARCHAR)), '') AS goal_category,
      NULLIF(TRIM(CAST(_tenantId.learningGoal.goalSubcategory AS VARCHAR)), '') AS goal_subcategory,
      NULLIF(TRIM(CAST(_tenantId.learningGoal.goalType AS VARCHAR)), '') AS goal_type,
      NULLIF(TRIM(CAST(_tenantId.learningGoal.goalDescription AS VARCHAR)), '') AS goal_description,
      NULLIF(TRIM(CAST(_tenantId.learningGoal.intendedOutcome AS VARCHAR)), '') AS intended_outcome,
      NULLIF(TRIM(CAST(_tenantId.learningGoal.subjectArea AS VARCHAR)), '') AS subject_area,
      NULLIF(TRIM(CAST(_tenantId.learningGoal.skillDomain AS VARCHAR)), '') AS skill_domain,
      NULLIF(TRIM(CAST(_tenantId.learningGoal.targetSkill AS VARCHAR)), '') AS target_skill,
      NULLIF(TRIM(CAST(_tenantId.learningGoal.targetProficiencyLevel AS VARCHAR)), '') AS target_proficiency_level,
      NULLIF(TRIM(CAST(_tenantId.learningGoal.currentProficiencyLevel AS VARCHAR)), '') AS current_proficiency_level,
      NULLIF(TRIM(CAST(_tenantId.learningGoal.credentialType AS VARCHAR)), '') AS credential_type,
      NULLIF(TRIM(CAST(_tenantId.learningGoal.credentialName AS VARCHAR)), '') AS credential_name,
      NULLIF(TRIM(CAST(_tenantId.learningGoal.certificationProvider AS VARCHAR)), '') AS certification_provider,
      NULLIF(TRIM(CAST(_tenantId.learningGoal.careerObjective AS VARCHAR)), '') AS career_objective,
      NULLIF(TRIM(CAST(_tenantId.learningGoal.targetRole AS VARCHAR)), '') AS target_role,
      NULLIF(TRIM(CAST(_tenantId.learningGoal.targetIndustry AS VARCHAR)), '') AS target_industry,
      NULLIF(TRIM(CAST(_tenantId.learningGoal.academicObjective AS VARCHAR)), '') AS academic_objective,
      NULLIF(TRIM(CAST(_tenantId.learningGoal.academicLevel AS VARCHAR)), '') AS academic_level,
      NULLIF(TRIM(CAST(_tenantId.learningGoal.programName AS VARCHAR)), '') AS program_name,
      NULLIF(TRIM(CAST(_tenantId.learningGoal.courseId AS VARCHAR)), '') AS course_id,
      NULLIF(TRIM(CAST(_tenantId.learningGoal.learningPathId AS VARCHAR)), '') AS learning_path_id,
      NULLIF(TRIM(CAST(_tenantId.learningGoal.deliveryMode AS VARCHAR)), '') AS delivery_mode,
      NULLIF(TRIM(CAST(_tenantId.learningGoal.commitmentLevel AS VARCHAR)), '') AS commitment_level,
      CAST(NULLIF(TRIM(CAST(_tenantId.learningGoal.targetCompletionDate AS VARCHAR)), '') AS DATE) AS target_completion_date,
      CAST(NULLIF(TRIM(CAST(_tenantId.learningGoal.expectedDurationDays AS VARCHAR)), '') AS BIGINT) AS expected_duration_days,
      CAST(NULLIF(TRIM(CAST(_tenantId.learningGoal.weeklyStudyHours AS VARCHAR)), '') AS DOUBLE) AS weekly_study_hours,
      CAST(NULLIF(TRIM(CAST(_tenantId.learningGoal.priority AS VARCHAR)), '') AS BIGINT) AS priority,
      NULLIF(TRIM(CAST(_tenantId.learningGoal.motivation AS VARCHAR)), '') AS motivation,
      NULLIF(TRIM(CAST(_tenantId.learningGoal.declarationMethod AS VARCHAR)), '') AS declaration_method,
      NULLIF(TRIM(CAST(_tenantId.learningGoal.declarationSource AS VARCHAR)), '') AS declaration_source,
      NULLIF(TRIM(CAST(_tenantId.learningGoal.sourceSystem AS VARCHAR)), '') AS source_system,
      NULLIF(TRIM(CAST(_tenantId.learningGoal.sourceChannel AS VARCHAR)), '') AS source_channel,
      COALESCE(
        CAST(NULLIF(TRIM(CAST(_tenantId.learningGoal.firstDeclaredAt AS VARCHAR)), '') AS TIMESTAMP),
        CAST(timestamp AS TIMESTAMP)
      ) AS first_declared_at,
      COALESCE(
        CAST(NULLIF(TRIM(CAST(_tenantId.learningGoal.effectiveFrom AS VARCHAR)), '') AS TIMESTAMP),
        CAST(timestamp AS TIMESTAMP)
      ) AS effective_from,
      CAST(NULLIF(TRIM(CAST(_tenantId.learningGoal.effectiveTo AS VARCHAR)), '') AS TIMESTAMP) AS effective_to,
      COALESCE(
        CAST(NULLIF(TRIM(CAST(_tenantId.learningGoal.lastUpdatedAt AS VARCHAR)), '') AS TIMESTAMP),
        CAST(timestamp AS TIMESTAMP)
      ) AS last_updated_at,
      NULLIF(TRIM(CAST(_tenantId.learningGoal.status AS VARCHAR)), '') AS status,
      CAST(_tenantId.learningGoal.isPrimary AS BOOLEAN) AS is_primary,
      CAST(_tenantId.learningGoal.isInferred AS BOOLEAN) AS is_inferred,
      CAST(_tenantId.learningGoal.confidenceScore AS DOUBLE) AS confidence_score,
      NULLIF(TRIM(CAST(_tenantId.learningGoal.consentStatus AS VARCHAR)), '') AS consent_status,
      NULLIF(TRIM(CAST(_tenantId.learningGoal.locale AS VARCHAR)), '') AS locale,
      UPPER(NULLIF(TRIM(CAST(_tenantId.learningGoal.countryCode AS VARCHAR)), '')) AS country_code,
      NULLIF(TRIM(CAST(_tenantId.learningGoal.organizationId AS VARCHAR)), '') AS organization_id,

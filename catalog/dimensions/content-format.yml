Dimension Name: Content Format

Description: |
  Content Format identifies the standardized presentation and delivery form in which a customer encounters or consumes a content item, such as video on demand, live video, linear video, audio, text, image gallery, interactive, or mixed media. It enables acquisition, engagement, conversion, retention, monetization, and lifetime-value performance to be compared across consistent customer experiences rather than source-system labels.

Category: Engagement


Dimension Name: Buyer Journey Stage

Description: |
  Buyer Journey Stage classifies the current verified position of a prospective property buyer within the real estate purchase lifecycle. It identifies the furthest operationally confirmed stage reached for a distinct buyer journey as of the applicable event or reporting time.

Category: Conversion

Tags: [dimension]

Industry: Real Estate Tech

Priority: High

Core Area: Discovery

Scope: User

Data Type: string

Aggregation Window: User









Calculation Notes: |
  Assign the stage using timestamped behavioral and transactional evidence available at the reporting cutoff. Use event occurrence time rather than ingestion time, retain the previous stage when a duplicate or lower-priority event arrives, and apply corrected source events through effective-dated restatement. Anonymous activity may contribute after deterministic identity resolution but must not be assigned to a known buyer before resolution. A new purchase intent occurring after Closed Won must create a new Buyer Journey ID rather than overwrite the completed journey. Exclude employee, agent-training, test, bot, synthetic, fraudulent, and deleted-consent records. Session timeout rules do not reset the stage; sessions expire after 30 minutes of inactivity for behavioral attribution only.

Business Use Case: |
  The Chief Revenue Officer reviews conversion and volume by Buyer Journey Stage, market, acquisition channel, and agent to identify where qualified buyers stall. If a market has high Inquiry volume but low progression to Tour Scheduled, Sales Operations can adjust agent response SLAs, redistribute leads, and trigger automated tour-booking outreach.


Source Data: CRM, Digital Analytics, Property Marketplace, Tour Scheduling Platform, Offer Management System, and Transaction Management System

Report Attributes: |
  ["Acquisition Channel","Campaign","Property Market","Property Type","Price Band","Buyer Segment","Buyer Intent","Agent","Brokerage","Device Type","Journey Start Month","Journey Outcome"]

Dashboard Usage: [Executive Buyer Conversion Funnel, Buyer Journey Performance, Sales Pipeline and Lead Progression, Marketplace Conversion Health, Agent Response and Tour Operations, Offer-to-Close Performance, Acquisition Quality by Channel]

Segment Eligibility: |
  true


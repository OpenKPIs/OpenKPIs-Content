Dimension Name: Item Variant

Description: |
  Item Variant identifies the specific purchasable configuration of a product (size, color, style, material or pack size) carried on each item in view_item, add_to_cart, begin_checkout and purchase interactions, exactly as populated in the GA4 items[].item_variant parameter. It lets merchandising teams break product performance below the parent product level, showing which configurations drive discovery, basket additions and revenue so that assortment depth, inventory allocation and PDP default selections follow what customers actually buy.

Category: Engagement

Tags: [dimension, E-commerce: Product Discovery & Merchandising (Search/Filters/PDP)]

Industry: E-commerce

Priority: High

Core Area: Discovery

Scope: Event

Data Type: string

Aggregation Window: Event, Daily, Weekly, Monthly


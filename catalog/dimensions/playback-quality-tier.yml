Dimension Name: Playback Quality Tier

Description: |
  Classifies the effective media quality rendered to the customer at a playback observation into a governed tier such as Audio Only, Data Saver, SD, HD, Full HD, or UHD/4K. It reflects experienced playback quality rather than the customer’s selected setting, subscription entitlement, device capability, or the quality originally requested from the player.

Category: Quality

Tags: [dimension]

Industry: Media & Streaming

Priority: High

Core Area: Engagement

Scope: Event

Data Type: string

Aggregation Window: Event, with state carried across the player session until the rendered rendition changes

GA4 Event: |
  video_progress

Adobe Event: |
  video_progress


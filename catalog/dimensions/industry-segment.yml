Dimension Name: Industry Segment

Description: |
  Industry classification of the B2B buyer account: the NAICS sector (or the SIC code / CRM industry picklist value mapped to NAICS) held on the company record in the CRM and the B2B commerce platform (Salesforce B2B Commerce Account, Adobe Commerce B2B Company, Shopify B2B Company), inherited by every buyer user, session and order tied to that account. It is the standard firmographic breakdown for comparing revenue, conversion, order value and retention across the verticals a B2B storefront sells into, and it drives sector-specific pricing, assortment and account-based marketing decisions.

Category: Identity

Tags: [dimension, E-commerce: Customer Retention, Loyalty & LTV]

Industry: E-commerce

Priority: Medium

Core Area: Generic

Scope: User

Data Type: string

Aggregation Window: Daily, Weekly, Monthly, Quarterly


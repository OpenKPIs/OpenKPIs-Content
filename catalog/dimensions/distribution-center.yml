Dimension Name: Distribution Center

Description: |
  Identifies the normalized fulfillment location assigned to a customer order, shipment, pickup, delivery, or return event across digital and assisted channels. It enables analysis of how the assigned location influences product availability, checkout conversion, delivery experience, repeat purchase, refunds, and customer lifetime value.

Category: Performance

Tags: [dimension]

Industry: Logistics & Supply Chain

Priority: High

Core Area: Generic

Scope: Event

Data Type: string

Aggregation Window: Event


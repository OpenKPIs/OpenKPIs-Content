AEP Query Service SQL: |
  -- ==========================================
  -- 2. ADOBE AEP QUERY SERVICE SQL
  -- ==========================================
  WITH source_events AS (
    SELECT
      e.timestamp AS xdm_event_timestamp,
      e._propertyListing.propertyPriceBand AS price_band
    FROM property_listing_experience_events AS e
    WHERE e.eventType = 'commerce.productViews'
      AND e._propertyListing.propertyPriceBand IS NOT NULL
  )
  SELECT
    NULLIF(TRIM(price_band.property_id), '') AS property_id,
    NULLIF(TRIM(price_band.listing_id), '') AS listing_id,
    NULLIF(TRIM(price_band.listing_source), '') AS listing_source,
    NULLIF(TRIM(price_band.listing_status), '') AS listing_status,
    NULLIF(TRIM(price_band.transaction_type), '') AS transaction_type,
    NULLIF(TRIM(price_band.market_id), '') AS market_id,
    NULLIF(TRIM(price_band.market_name), '') AS market_name,
    UPPER(NULLIF(TRIM(price_band.market_country_code), '')) AS market_country_code,
    NULLIF(TRIM(price_band.market_region_code), '') AS market_region_code,
    NULLIF(TRIM(price_band.property_type), '') AS property_type,
    NULLIF(TRIM(price_band.property_subtype), '') AS property_subtype,
    CAST(price_band.advertised_price AS DECIMAL(38, 9)) AS advertised_price,
    CAST(price_band.advertised_price_min AS DECIMAL(38, 9)) AS advertised_price_min,
    CAST(price_band.advertised_price_max AS DECIMAL(38, 9)) AS advertised_price_max,
    NULLIF(TRIM(price_band.advertised_price_qualifier), '') AS advertised_price_qualifier,
    UPPER(NULLIF(TRIM(price_band.advertised_currency), '')) AS advertised_currency,
    NULLIF(TRIM(price_band.price_basis), '') AS price_basis,
    NULLIF(TRIM(price_band.billing_period), '') AS billing_period,
    NULLIF(TRIM(price_band.tax_inclusion), '') AS tax_inclusion,
    NULLIF(TRIM(price_band.fee_inclusion), '') AS fee_inclusion,
    CAST(price_band.normalized_price AS DECIMAL(38, 9)) AS normalized_price,
    UPPER(NULLIF(TRIM(price_band.normalized_currency), '')) AS normalized_currency,
    CAST(price_band.fx_rate AS DECIMAL(38, 12)) AS fx_rate,
    CAST(price_band.fx_rate_date AS DATE) AS fx_rate_date,
    NULLIF(TRIM(price_band.fx_rate_source), '') AS fx_rate_source,
    NULLIF(TRIM(price_band.fx_rate_type), '') AS fx_rate_type,
    NULLIF(TRIM(price_band.band_id), '') AS band_id,
    NULLIF(TRIM(price_band.band_code), '') AS band_code,
    NULLIF(TRIM(price_band.band_name), '') AS band_name,
    COALESCE(
      NULLIF(TRIM(price_band.band_label), ''),
      NULLIF(TRIM(price_band.band_name), '')
    ) AS band_label,
    CAST(price_band.band_order AS BIGINT) AS band_order,
    CAST(price_band.band_lower_bound AS DECIMAL(38, 9)) AS band_lower_bound,
    CAST(price_band.band_upper_bound AS DECIMAL(38, 9)) AS band_upper_bound,
    CAST(price_band.lower_bound_inclusive AS BOOLEAN) AS lower_bound_inclusive,
    CAST(price_band.upper_bound_inclusive AS BOOLEAN) AS upper_bound_inclusive,
    UPPER(NULLIF(TRIM(price_band.band_currency), '')) AS band_currency,
    NULLIF(TRIM(price_band.band_transaction_type), '') AS band_transaction_type,
    NULLIF(TRIM(price_band.band_market_id), '') AS band_market_id,
    NULLIF(TRIM(price_band.band_property_type), '') AS band_property_type,
    NULLIF(TRIM(price_band.threshold_schedule_id), '') AS threshold_schedule_id,
    NULLIF(TRIM(price_band.threshold_schedule_version), '') AS threshold_schedule_version,
    CAST(price_band.threshold_effective_from AS TIMESTAMP) AS threshold_effective_from,
    CAST(price_band.threshold_effective_to AS TIMESTAMP) AS threshold_effective_to,
    COALESCE(
      CAST(price_band.classification_timestamp AS TIMESTAMP),
      xdm_event_timestamp
    ) AS classification_timestamp,
    COALESCE(
      CAST(price_band.event_timestamp AS TIMESTAMP),
      xdm_event_timestamp
    ) AS event_timestamp,
    NULLIF(TRIM(price_band.classification_status), '') AS classification_status,
    NULLIF(TRIM(price_band.classification_reason), '') AS classification_reason,
    CAST(price_band.is_price_on_application AS BOOLEAN) AS is_price_on_application,
    NULLIF(TRIM(price_band.data_quality_status), '') AS data_quality_status
  FROM source_events
  WHERE price_band.band_id IS NOT NULL
     OR price_band.band_code IS NOT NULL
     OR price_band.band_label IS NOT NULL
     OR price_band.classification_status IS NOT NULL;

Calculation Notes: |
  Use the active total advertised asking price for sale listings and the recurring base rent normalized to the configured rental period for rental listings. Select the effective threshold schedule by market, transaction type, property type, reporting currency, and business timestamp; use the listing price effective timestamp for listing snapshots and the event timestamp for behavioral events. Convert prices to the schedule currency using the approved foreign-exchange rate effective for that timestamp. Bands include the lower threshold and exclude the upper threshold, while the highest band has no upper limit. The canonical dimension value must be one of Entry, Mainstream, Upper-Mid, Premium, Luxury, Unknown, or Not Applicable; currency-formatted ranges such as $500,000–<$1,000,000 are display labels and must not be emitted as the canonical Property Price Band value. Return Unknown when the price or any mandatory classification input is missing, invalid, nonpositive, or cannot be matched to exactly one effective band. Return Not Applicable only when a supported listing status intentionally has no monetary price. Exclude deposits, taxes, utilities, service charges, optional parking, incentives, and transaction fees unless the applicable configuration explicitly includes them. Keep sale and rental schedules separate, preserve previously emitted event-time classifications, and deduplicate repeated updates by listing version and price effective timestamp. For GA4, emit property_price_band as the canonical string value and serialize property_price_band_context as a JSON-encoded string event parameter before collection; extraction logic must not expect a native object in event_params.

Business Use Case: |
  Revenue Management compares monthly listing supply, qualified leads, and completed transactions by market and Property Price Band. When Entry inventory has high demand but low supply while Premium inventory has weak inquiry conversion, the team can redirect broker acquisition toward lower-priced listings, revise premium pricing guidance, and adjust marketplace merchandising.



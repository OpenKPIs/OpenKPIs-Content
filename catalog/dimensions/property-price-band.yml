  -- ==========================================
  -- 1. GOOGLE BIGQUERY SQL
  -- ==========================================
  WITH source_events AS (
    SELECT
      e.event_timestamp AS ga4_event_timestamp,
      i.item_id,
      i.item_name,
      i.item_brand,
      i.item_category,
      i.item_category2,
      i.item_category3,
      i.item_category4,
      i.item_category5,
      i.price AS item_price,
      (
        SELECT AS STRUCT
          MAX(IF(ep.key = 'property_price_band_context', ep.value.string_value, NULL)) AS context_json_text,
          MAX(IF(ep.key = 'property_id', ep.value.string_value, NULL)) AS property_id,
          MAX(IF(ep.key = 'listing_id', ep.value.string_value, NULL)) AS listing_id,
          MAX(IF(ep.key = 'listing_source', ep.value.string_value, NULL)) AS listing_source,
          MAX(IF(ep.key = 'transaction_type', ep.value.string_value, NULL)) AS transaction_type,
          MAX(IF(ep.key = 'market_id', ep.value.string_value, NULL)) AS market_id,
          MAX(IF(ep.key = 'property_type', ep.value.string_value, NULL)) AS property_type,
          MAX(IF(ep.key = 'property_price_band', ep.value.string_value, NULL)) AS band_label,
          MAX(IF(ep.key = 'property_price_band_code', ep.value.string_value, NULL)) AS band_code,
          MAX(
            IF(
              ep.key = 'property_price_band_order',
              COALESCE(
                ep.value.string_value,
                CAST(ep.value.int_value AS STRING),
                CAST(ep.value.double_value AS STRING),
                CAST(ep.value.float_value AS STRING)
              ),
              NULL
            )
          ) AS band_order,
          MAX(IF(ep.key = 'threshold_schedule_id', ep.value.string_value, NULL)) AS threshold_schedule_id,
          MAX(IF(ep.key = 'threshold_schedule_version', ep.value.string_value, NULL)) AS threshold_schedule_version
        FROM UNNEST(e.event_params) AS ep
      ) AS event_parameters
    FROM `your-project.analytics_123456789.events_*` AS e
    LEFT JOIN UNNEST(e.items) AS i ON TRUE
    WHERE _TABLE_SUFFIX BETWEEN FORMAT_DATE('%Y%m%d', @start_date)
                            AND FORMAT_DATE('%Y%m%d', @end_date)
      AND e.event_name = 'view_item'
  ),
  property_price_band AS (
    SELECT
      COALESCE(
        NULLIF(TRIM(JSON_VALUE(event_parameters.context_json_text, '$.property_id')), ''),
        NULLIF(TRIM(event_parameters.property_id), ''),
        NULLIF(TRIM(item_id), '')
      ) AS property_id,
      COALESCE(
        NULLIF(TRIM(JSON_VALUE(event_parameters.context_json_text, '$.listing_id')), ''),
        NULLIF(TRIM(event_parameters.listing_id), ''),
        NULLIF(TRIM(item_name), '')
      ) AS listing_id,
      COALESCE(
        NULLIF(TRIM(JSON_VALUE(event_parameters.context_json_text, '$.listing_source')), ''),
        NULLIF(TRIM(event_parameters.listing_source), ''),
        NULLIF(TRIM(item_brand), '')
      ) AS listing_source,
      NULLIF(TRIM(JSON_VALUE(event_parameters.context_json_text, '$.listing_status')), '') AS listing_status,
      COALESCE(
        NULLIF(TRIM(JSON_VALUE(event_parameters.context_json_text, '$.transaction_type')), ''),
        NULLIF(TRIM(event_parameters.transaction_type), ''),
        NULLIF(TRIM(item_category3), '')
      ) AS transaction_type,
      COALESCE(
        NULLIF(TRIM(JSON_VALUE(event_parameters.context_json_text, '$.market_id')), ''),
        NULLIF(TRIM(event_parameters.market_id), '')
      ) AS market_id,
      COALESCE(
        NULLIF(TRIM(JSON_VALUE(event_parameters.context_json_text, '$.market_name')), ''),
        NULLIF(TRIM(item_category4), '')
      ) AS market_name,
      UPPER(NULLIF(TRIM(JSON_VALUE(event_parameters.context_json_text, '$.market_country_code')), '')) AS market_country_code,
      NULLIF(TRIM(JSON_VALUE(event_parameters.context_json_text, '$.market_region_code')), '') AS market_region_code,
      COALESCE(
        NULLIF(TRIM(JSON_VALUE(event_parameters.context_json_text, '$.property_type')), ''),
        NULLIF(TRIM(event_parameters.property_type), ''),
        NULLIF(TRIM(item_category), '')
      ) AS property_type,
      COALESCE(
        NULLIF(TRIM(JSON_VALUE(event_parameters.context_json_text, '$.property_subtype')), ''),
        NULLIF(TRIM(item_category2), '')
      ) AS property_subtype,
      COALESCE(
        SAFE_CAST(JSON_VALUE(event_parameters.context_json_text, '$.advertised_price') AS NUMERIC),
        SAFE_CAST(item_price AS NUMERIC)
      ) AS advertised_price,
      SAFE_CAST(JSON_VALUE(event_parameters.context_json_text, '$.advertised_price_min') AS NUMERIC) AS advertised_price_min,
      SAFE_CAST(JSON_VALUE(event_parameters.context_json_text, '$.advertised_price_max') AS NUMERIC) AS advertised_price_max,
      NULLIF(TRIM(JSON_VALUE(event_parameters.context_json_text, '$.advertised_price_qualifier')), '') AS advertised_price_qualifier,
      UPPER(NULLIF(TRIM(JSON_VALUE(event_parameters.context_json_text, '$.advertised_currency')), '')) AS advertised_currency,
      NULLIF(TRIM(JSON_VALUE(event_parameters.context_json_text, '$.price_basis')), '') AS price_basis,
      NULLIF(TRIM(JSON_VALUE(event_parameters.context_json_text, '$.billing_period')), '') AS billing_period,
      NULLIF(TRIM(JSON_VALUE(event_parameters.context_json_text, '$.tax_inclusion')), '') AS tax_inclusion,
      NULLIF(TRIM(JSON_VALUE(event_parameters.context_json_text, '$.fee_inclusion')), '') AS fee_inclusion,
      SAFE_CAST(JSON_VALUE(event_parameters.context_json_text, '$.normalized_price') AS NUMERIC) AS normalized_price,
      UPPER(NULLIF(TRIM(JSON_VALUE(event_parameters.context_json_text, '$.normalized_currency')), '')) AS normalized_currency,
      SAFE_CAST(JSON_VALUE(event_parameters.context_json_text, '$.fx_rate') AS NUMERIC) AS fx_rate,
      SAFE_CAST(JSON_VALUE(event_parameters.context_json_text, '$.fx_rate_date') AS DATE) AS fx_rate_date,
      NULLIF(TRIM(JSON_VALUE(event_parameters.context_json_text, '$.fx_rate_source')), '') AS fx_rate_source,
      NULLIF(TRIM(JSON_VALUE(event_parameters.context_json_text, '$.fx_rate_type')), '') AS fx_rate_type,
      NULLIF(TRIM(JSON_VALUE(event_parameters.context_json_text, '$.band_id')), '') AS band_id,
      COALESCE(
        NULLIF(TRIM(JSON_VALUE(event_parameters.context_json_text, '$.band_code')), ''),
        NULLIF(TRIM(event_parameters.band_code), '')
      ) AS band_code,
      NULLIF(TRIM(JSON_VALUE(event_parameters.context_json_text, '$.band_name')), '') AS band_name,
      COALESCE(
        NULLIF(TRIM(JSON_VALUE(event_parameters.context_json_text, '$.band_label')), ''),
        NULLIF(TRIM(event_parameters.band_label), ''),
        NULLIF(TRIM(item_category5), ''),
        NULLIF(TRIM(JSON_VALUE(event_parameters.context_json_text, '$.band_name')), '')
      ) AS band_label,
      COALESCE(
        SAFE_CAST(JSON_VALUE(event_parameters.context_json_text, '$.band_order') AS INT64),
        SAFE_CAST(event_parameters.band_order AS INT64)
      ) AS band_order,
      SAFE_CAST(JSON_VALUE(event_parameters.context_json_text, '$.band_lower_bound') AS NUMERIC) AS band_lower_bound,
      SAFE_CAST(JSON_VALUE(event_parameters.context_json_text, '$.band_upper_bound') AS NUMERIC) AS band_upper_bound,
      SAFE_CAST(JSON_VALUE(event_parameters.context_json_text, '$.lower_bound_inclusive') AS BOOL) AS lower_bound_inclusive,
      SAFE_CAST(JSON_VALUE(event_parameters.context_json_text, '$.upper_bound_inclusive') AS BOOL) AS upper_bound_inclusive,
      UPPER(NULLIF(TRIM(JSON_VALUE(event_parameters.context_json_text, '$.band_currency')), '')) AS band_currency,
      NULLIF(TRIM(JSON_VALUE(event_parameters.context_json_text, '$.band_transaction_type')), '') AS band_transaction_type,
      NULLIF(TRIM(JSON_VALUE(event_parameters.context_json_text, '$.band_market_id')), '') AS band_market_id,
      NULLIF(TRIM(JSON_VALUE(event_parameters.context_json_text, '$.band_property_type')), '') AS band_property_type,
      COALESCE(
        NULLIF(TRIM(JSON_VALUE(event_parameters.context_json_text, '$.threshold_schedule_id')), ''),
        NULLIF(TRIM(event_parameters.threshold_schedule_id), '')
      ) AS threshold_schedule_id,
      COALESCE(
        NULLIF(TRIM(JSON_VALUE(event_parameters.context_json_text, '$.threshold_schedule_version')), ''),
        NULLIF(TRIM(event_parameters.threshold_schedule_version), '')
      ) AS threshold_schedule_version,
      SAFE_CAST(JSON_VALUE(event_parameters.context_json_text, '$.threshold_effective_from') AS TIMESTAMP) AS threshold_effective_from,
      SAFE_CAST(JSON_VALUE(event_parameters.context_json_text, '$.threshold_effective_to') AS TIMESTAMP) AS threshold_effective_to,
      COALESCE(
        SAFE_CAST(JSON_VALUE(event_parameters.context_json_text, '$.classification_timestamp') AS TIMESTAMP),
        TIMESTAMP_MICROS(ga4_event_timestamp)
      ) AS classification_timestamp,
      COALESCE(
        SAFE_CAST(JSON_VALUE(event_parameters.context_json_text, '$.event_timestamp') AS TIMESTAMP),
        TIMESTAMP_MICROS(ga4_event_timestamp)
      ) AS event_timestamp,
      NULLIF(TRIM(JSON_VALUE(event_parameters.context_json_text, '$.classification_status')), '') AS classification_status,
      NULLIF(TRIM(JSON_VALUE(event_parameters.context_json_text, '$.classification_reason')), '') AS classification_reason,
      SAFE_CAST(JSON_VALUE(event_parameters.context_json_text, '$.is_price_on_application') AS BOOL) AS is_price_on_application,
      NULLIF(TRIM(JSON_VALUE(event_parameters.context_json_text, '$.data_quality_status')), '') AS data_quality_status
    FROM source_events
    WHERE event_parameters.context_json_text IS NOT NULL
       OR event_parameters.band_label IS NOT NULL
       OR event_parameters.band_code IS NOT NULL
       OR item_category5 IS NOT NULL
  )

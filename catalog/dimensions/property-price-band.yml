Dimension Name: Property Price Band

Description: |
  Property Price Band identifies the governed categorical price tier assigned to a property listing using its applicable advertised price and the configuration effective when the listing snapshot or event occurred. It supports consistent comparison of inventory, engagement, leads, and conversions across price tiers without exposing or grouping by exact prices.

Category: Conversion

Tags: [dimension]

Industry: Technology

Priority: High

Core Area: Discovery

Scope: Item

Data Type: string

Aggregation Window: Event


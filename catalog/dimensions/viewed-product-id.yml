Google Analytics SQL: |
  SELECT event_timestamp, user_pseudo_id, item.item_id AS viewed_product_id
  FROM `project.analytics.events_*`, UNNEST(items) AS item
  WHERE _TABLE_SUFFIX BETWEEN @start_date AND @end_date
    AND event_name = 'view_item'
    AND item.item_id IS NOT NULL

AEP Query Service SQL: |
  SELECT timestamp, _id, item.SKU AS viewed_product_id
  FROM {{AEP_EXPERIENCE_EVENT_DATASET}}
  LATERAL VIEW EXPLODE(productListItems) items AS item
  WHERE timestamp >= :start_timestamp
    AND timestamp < :end_timestamp
    AND eventType = 'commerce.productViews'
    AND item.SKU IS NOT NULL

Calculation Notes: |
  1️⃣ Preserve the captured product identifier. 2️⃣ Keep missing values null. 3️⃣ Apply one governed identifier format across reports.

Business Use Case: |
  1️⃣ Merchandising teams compare interest by product. 2️⃣ Product teams find viewed products with weak cart progression.


Dimension Name: Purchase Count Band

Description: |
  Purchase Count Band groups each customer by their lifetime number of completed orders, meaning orders that were not cancelled and are not test orders, into the default bands 0 (registered, no orders), 1, 2, 3-5 and 6+. It is the standard way to split one-time buyers from repeat buyers in retention, Customer Lifetime Value and CRM segmentation, and it is only a banding of the Orders per Customer count: it is not a New/Returning label (Customer Status), not a basket-size cut (Cart Size Band) and not a score.

Category: Retention




























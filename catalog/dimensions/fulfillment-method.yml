Google Analytics SQL: |
  -- ==========================================
  -- 1. GOOGLE BIGQUERY SQL
  -- ==========================================
  -- Fulfillment Method distribution across its carrier events (add_shipping_info, begin_checkout, purchase, refund),
  -- reported at three grains: event grain (selection volume), order grain (purchase-time snapshot, 'split' when a
  -- basket mixes methods) and item grain (line-level method for mixed baskets).
  -- Event-scoped params are pivoted with UNNEST + MAX(IF(...)) inside scalar subqueries so no row fan-out occurs
  -- and the items ARRAY stays intact for the line-level pass.
  WITH base AS (
    SELECT
      PARSE_DATE('%Y%m%d', e.event_date) AS event_day,
      e.event_name,
      e.user_pseudo_id,
      e.event_timestamp,
      e.items,
      (SELECT MAX(IF(ep.key = 'ga_session_id', ep.value.int_value, NULL)) FROM UNNEST(e.event_params) AS ep) AS ga_session_id,
      (SELECT MAX(IF(ep.key = 'fulfillment_method', ep.value.string_value, NULL)) FROM UNNEST(e.event_params) AS ep) AS fulfillment_method_raw,
      (SELECT MAX(IF(ep.key = 'pickup_location_id', ep.value.string_value, NULL)) FROM UNNEST(e.event_params) AS ep) AS pickup_location_id,
      (SELECT MAX(IF(ep.key = 'transaction_channel', ep.value.string_value, NULL)) FROM UNNEST(e.event_params) AS ep) AS transaction_channel,
      (SELECT MAX(IF(ep.key = 'shipping_tier', ep.value.string_value, NULL)) FROM UNNEST(e.event_params) AS ep) AS shipping_tier,
      (SELECT MAX(IF(ep.key = 'checkout_step', ep.value.int_value, NULL)) FROM UNNEST(e.event_params) AS ep) AS checkout_step,
      COALESCE(
        NULLIF(e.ecommerce.transaction_id, '(not set)'),
        (SELECT MAX(IF(ep.key = 'transaction_id', ep.value.string_value, NULL)) FROM UNNEST(e.event_params) AS ep)
      ) AS transaction_id,
      e.ecommerce.purchase_revenue AS purchase_revenue
    FROM `your-project.analytics_123456789.events_*` AS e
    WHERE _TABLE_SUFFIX BETWEEN FORMAT_DATE('%Y%m%d', DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY))
                            AND FORMAT_DATE('%Y%m%d', DATE_SUB(CURRENT_DATE(), INTERVAL 1 DAY))
      AND e.event_name IN ('add_shipping_info', 'begin_checkout', 'purchase', 'refund')
  ),
  -- Controlled vocabulary: anything outside the governed list is surfaced as '(unmapped)' data quality volume,
  -- and sessions that never reached the shipping step stay 'not_set' instead of defaulting to ship_to_home.
  events_typed AS (
    SELECT
      b.* EXCEPT (fulfillment_method_raw),
      CASE LOWER(TRIM(COALESCE(b.fulfillment_method_raw, '')))
        WHEN 'bopis_in_store' THEN 'bopis_in_store'
        WHEN 'curbside_pickup' THEN 'curbside_pickup'
        WHEN 'ship_to_store' THEN 'ship_to_store'
        WHEN 'ship_to_home' THEN 'ship_to_home'
        WHEN 'same_day_delivery' THEN 'same_day_delivery'
        WHEN 'split' THEN 'split'
        WHEN 'not_set' THEN 'not_set'
        WHEN '' THEN 'not_set'
        ELSE '(unmapped)'
      END AS fulfillment_method
    FROM base AS b
  ),
  -- Grain 1: how often each value is carried, per carrier event. Denominator is every event of that carrier
  -- event in the window, including not_set, so the shares of one carrier event sum to 1.
  event_mix AS (
    SELECT
      event_name AS carrier_event,
      fulfillment_method,
      COUNT(*) AS events,
      COUNT(DISTINCT CONCAT(user_pseudo_id, '-', CAST(ga_session_id AS STRING))) AS sessions,
      COUNT(DISTINCT user_pseudo_id) AS users,
      COUNT(DISTINCT pickup_location_id) AS pickup_locations,
      SAFE_DIVIDE(COUNT(*), SUM(COUNT(*)) OVER (PARTITION BY event_name)) AS share_of_carrier_event
    FROM events_typed
    GROUP BY carrier_event, fulfillment_method
  ),
  -- Purchase snapshot, deduplicated to one row per transaction_id.
  purchases AS (
    SELECT *
    FROM events_typed
    WHERE event_name = 'purchase'
      AND transaction_id IS NOT NULL
    QUALIFY ROW_NUMBER() OVER (PARTITION BY transaction_id ORDER BY event_timestamp) = 1
  ),
  -- Grain 3 source: item-scoped fulfillment_method, pivoted out of item_params the same way.
  purchase_items AS (
    SELECT
      p.transaction_id,
      p.event_day,
      it.item_id,
      it.item_name,
      it.item_category,
      IFNULL(it.quantity, 0) AS quantity,
      IFNULL(it.item_revenue, IFNULL(it.price, 0) * IFNULL(it.quantity, 0)) AS item_revenue,
      CASE LOWER(TRIM(COALESCE(
        (SELECT MAX(IF(ip.key = 'fulfillment_method', ip.value.string_value, NULL)) FROM UNNEST(it.item_params) AS ip),
        '')))
        WHEN 'bopis_in_store' THEN 'bopis_in_store'
        WHEN 'curbside_pickup' THEN 'curbside_pickup'
        WHEN 'ship_to_store' THEN 'ship_to_store'
        WHEN 'ship_to_home' THEN 'ship_to_home'
        WHEN 'same_day_delivery' THEN 'same_day_delivery'
        WHEN '' THEN 'not_set'
        ELSE '(unmapped)'
      END AS item_fulfillment_method
    FROM purchases AS p,
      UNNEST(p.items) AS it
  ),
  -- Grain 2: order-level value. Two or more distinct line methods resolve to 'split' so pickup orders are never inflated.
  order_method AS (
    SELECT
      pi.transaction_id,
      IF(COUNT(DISTINCT IF(pi.item_fulfillment_method IN ('not_set', '(unmapped)'), NULL, pi.item_fulfillment_method)) > 1,
         'split',
         COALESCE(MAX(IF(pi.item_fulfillment_method IN ('not_set', '(unmapped)'), NULL, pi.item_fulfillment_method)), 'not_set')
      ) AS order_fulfillment_method,
      SUM(pi.quantity) AS units,
      SUM(pi.item_revenue) AS item_revenue
    FROM purchase_items AS pi
    GROUP BY pi.transaction_id
  ),
  order_mix AS (
    SELECT
      om.order_fulfillment_method AS fulfillment_method,
      COUNT(DISTINCT om.transaction_id) AS orders,
      SUM(om.units) AS units,
      ROUND(SUM(om.item_revenue), 2) AS revenue,
      SAFE_DIVIDE(COUNT(DISTINCT om.transaction_id), SUM(COUNT(DISTINCT om.transaction_id)) OVER ()) AS share_of_all_orders
    FROM order_method AS om
    GROUP BY fulfillment_method
  ),
  item_mix AS (
    SELECT
      pi.item_fulfillment_method AS fulfillment_method,
      COUNT(DISTINCT pi.transaction_id) AS orders,
      SUM(pi.quantity) AS units,
      ROUND(SUM(pi.item_revenue), 2) AS revenue,
      SAFE_DIVIDE(SUM(pi.quantity), SUM(SUM(pi.quantity)) OVER ()) AS share_of_all_units
    FROM purchase_items AS pi
    GROUP BY fulfillment_method
  )
  SELECT
    'event' AS grain,
    em.carrier_event,
    em.fulfillment_method,
    em.events,
    em.sessions,
    em.users,
    em.pickup_locations,
    CAST(NULL AS INT64) AS orders,
    CAST(NULL AS INT64) AS units,
    CAST(NULL AS FLOAT64) AS revenue,
    ROUND(em.share_of_carrier_event, 4) AS share_of_base
  FROM event_mix AS em
  UNION ALL
  SELECT
    'order',
    'purchase',
    om.fulfillment_method,
    CAST(NULL AS INT64),
    CAST(NULL AS INT64),
    CAST(NULL AS INT64),
    CAST(NULL AS INT64),
    om.orders,
    om.units,
    om.revenue,
    ROUND(om.share_of_all_orders, 4)
  FROM order_mix AS om
  UNION ALL
  SELECT
    'item',
    'purchase',
    im.fulfillment_method,
    CAST(NULL AS INT64),
    CAST(NULL AS INT64),
    CAST(NULL AS INT64),
    CAST(NULL AS INT64),
    im.orders,
    im.units,
    im.revenue,
    ROUND(im.share_of_all_units, 4)
  FROM item_mix AS im
  ORDER BY grain, carrier_event, share_of_base DESC, fulfillment_method;

AEP Query Service SQL: |
  -- ==========================================
  -- 2. ADOBE AEP QUERY SERVICE SQL
  -- ==========================================
  -- Fulfillment Method distribution on the ExperienceEvent dataset, reading the XDM paths the mapping declares:
  -- commerce.shipping.shippingMethod (order/checkout value), _experience.analytics.customDimensions.eVars.eVar23
  -- (fulfillment method), eVar24 (pickup location), eVar25 (transaction channel), props.prop23 and
  -- customDimensions.lists.list1 (SKU|method pairs for mixed baskets).
  WITH base AS (
    SELECT
      endUserIDs._experience.ecid.id AS ecid,
      timestamp AS event_ts,
      eventType AS event_type,
      CASE
        WHEN eventType = 'commerce.purchases' THEN 'purchase'
        WHEN eventType = 'commerce.returns' THEN 'refund'
        WHEN commerce.shipping.shippingMethod IS NOT NULL AND TRIM(commerce.shipping.shippingMethod) <> '' THEN 'add_shipping_info'
        ELSE 'begin_checkout'
      END AS carrier_event,
      LOWER(TRIM(COALESCE(
        commerce.shipping.shippingMethod,
        _experience.analytics.customDimensions.eVars.eVar23,
        _experience.analytics.customDimensions.props.prop23,
        ''
      ))) AS fulfillment_method_raw,
      _experience.analytics.customDimensions.eVars.eVar24 AS pickup_location_id,
      COALESCE(_experience.analytics.customDimensions.eVars.eVar25, channel.typeAtSource) AS transaction_channel,
      commerce.shipping.shippingTier AS shipping_tier,
      commerce.order.purchaseID AS purchase_id,
      commerce.order.priceTotal AS order_total,
      productListItems AS product_list_items,
      _experience.analytics.customDimensions.lists.list1.list AS item_method_list
    FROM aep_web_events_dataset
    WHERE timestamp >= date_sub(current_date(), 30)
      AND timestamp < current_date()
      AND eventType IN ('commerce.checkouts', 'commerce.purchases', 'commerce.returns')
  ),
  -- Controlled vocabulary; unlisted values become '(unmapped)' data-quality volume, empty stays 'not_set'.
  events_typed AS (
    SELECT
      b.*,
      CASE b.fulfillment_method_raw
        WHEN 'bopis_in_store' THEN 'bopis_in_store'
        WHEN 'curbside_pickup' THEN 'curbside_pickup'
        WHEN 'ship_to_store' THEN 'ship_to_store'
        WHEN 'ship_to_home' THEN 'ship_to_home'
        WHEN 'same_day_delivery' THEN 'same_day_delivery'
        WHEN 'split' THEN 'split'
        WHEN 'not_set' THEN 'not_set'
        WHEN '' THEN 'not_set'
        ELSE '(unmapped)'
      END AS fulfillment_method
    FROM base b
  ),
  -- Grain 1: volume per carrier event. Denominator is every event of that carrier event, not_set included.
  event_mix AS (
    SELECT
      carrier_event,
      fulfillment_method,
      COUNT(*) AS events,
      COUNT(DISTINCT ecid) AS visitors,
      COUNT(DISTINCT pickup_location_id) AS pickup_locations,
      CAST(COUNT(*) AS DOUBLE) / NULLIF(SUM(COUNT(*)) OVER (PARTITION BY carrier_event), 0) AS share_of_base
    FROM events_typed
    GROUP BY carrier_event, fulfillment_method
  ),
  purchases AS (
    SELECT ecid, event_ts, purchase_id, order_total, fulfillment_method, product_list_items, item_method_list
    FROM (
      SELECT
        e.*,
        ROW_NUMBER() OVER (PARTITION BY e.purchase_id ORDER BY e.event_ts) AS rn
      FROM events_typed e
      WHERE e.carrier_event = 'purchase'
        AND e.purchase_id IS NOT NULL
    ) p
    WHERE rn = 1
  ),
  purchase_lines AS (
    SELECT purchase_id, order_total, explode(product_list_items) AS line
    FROM purchases
  ),
  line_methods AS (
    SELECT purchase_id, explode(item_method_list) AS entry
    FROM purchases
  ),
  line_method_pairs AS (
    SELECT
      purchase_id,
      split(entry.value, '\\|')[0] AS sku,
      LOWER(TRIM(COALESCE(split(entry.value, '\\|')[1], ''))) AS item_method_raw
    FROM line_methods
  ),
  purchase_items AS (
    SELECT
      pl.purchase_id,
      pl.line.SKU AS sku,
      COALESCE(pl.line.quantity, 0) AS quantity,
      COALESCE(pl.line.priceTotal, 0) AS line_revenue,
      CASE COALESCE(mp.item_method_raw, '')
        WHEN 'bopis_in_store' THEN 'bopis_in_store'
        WHEN 'curbside_pickup' THEN 'curbside_pickup'
        WHEN 'ship_to_store' THEN 'ship_to_store'
        WHEN 'ship_to_home' THEN 'ship_to_home'
        WHEN 'same_day_delivery' THEN 'same_day_delivery'
        WHEN '' THEN 'not_set'
        ELSE '(unmapped)'
      END AS item_fulfillment_method
    FROM purchase_lines pl
    LEFT JOIN line_method_pairs mp
      ON mp.purchase_id = pl.purchase_id
     AND mp.sku = pl.line.SKU
  ),
  -- Grain 2: order value, 'split' when the basket mixes two or more governed methods.
  order_method AS (
    SELECT
      purchase_id,
      CASE
        WHEN COUNT(DISTINCT CASE WHEN item_fulfillment_method NOT IN ('not_set', '(unmapped)') THEN item_fulfillment_method END) > 1 THEN 'split'
        ELSE COALESCE(MAX(CASE WHEN item_fulfillment_method NOT IN ('not_set', '(unmapped)') THEN item_fulfillment_method END), 'not_set')
      END AS fulfillment_method,
      SUM(quantity) AS units,
      SUM(line_revenue) AS revenue
    FROM purchase_items
    GROUP BY purchase_id
  ),
  order_mix AS (
    SELECT
      fulfillment_method,
      COUNT(DISTINCT purchase_id) AS orders,
      SUM(units) AS units,
      ROUND(SUM(revenue), 2) AS revenue,
      CAST(COUNT(DISTINCT purchase_id) AS DOUBLE) / NULLIF(SUM(COUNT(DISTINCT purchase_id)) OVER (), 0) AS share_of_base
    FROM order_method
    GROUP BY fulfillment_method
  ),
  item_mix AS (
    SELECT
      item_fulfillment_method AS fulfillment_method,
      COUNT(DISTINCT purchase_id) AS orders,
      SUM(quantity) AS units,
      ROUND(SUM(line_revenue), 2) AS revenue,
      CAST(SUM(quantity) AS DOUBLE) / NULLIF(SUM(SUM(quantity)) OVER (), 0) AS share_of_base
    FROM purchase_items
    GROUP BY item_fulfillment_method
  )
  SELECT
    'event' AS grain,
    carrier_event,
    fulfillment_method,
    events,
    visitors,
    pickup_locations,
    CAST(NULL AS BIGINT) AS orders,
    CAST(NULL AS BIGINT) AS units,
    CAST(NULL AS DOUBLE) AS revenue,
    ROUND(share_of_base, 4) AS share_of_base
  FROM event_mix
  UNION ALL
  SELECT
    'order',
    'purchase',
    fulfillment_method,
    CAST(NULL AS BIGINT),
    CAST(NULL AS BIGINT),
    CAST(NULL AS BIGINT),
    orders,
    units,
    revenue,
    ROUND(share_of_base, 4)
  FROM order_mix
  UNION ALL
  SELECT
    'item',
    'purchase',
    fulfillment_method,
    CAST(NULL AS BIGINT),
    CAST(NULL AS BIGINT),
    CAST(NULL AS BIGINT),
    orders,
    units,
    revenue,
    ROUND(share_of_base, 4)
  FROM item_mix
  ORDER BY grain, carrier_event, share_of_base DESC, fulfillment_method;

Calculation Notes: |
  1️⃣ Controlled vocabulary only — the permitted values are bopis_in_store, curbside_pickup, ship_to_store, ship_to_home and same_day_delivery, normalised to lower snake case at collection. Curbside is kept distinct from in-store pickup because the hand-off operation, staffing model and dwell-time targets differ; collapsing the two is the most common reporting error and destroys curbside SLA measurement.,2️⃣ Excludes all sourcing-node, warehouse and carrier-routing attributes. Ship-from-store node ids, distribution-centre codes, dark-store flags, carrier or parcel-service names and routing rules belong to Fulfillment Strategy and Shipping Tier respectively and must never be written into this dimension — a customer who chose ship_to_home stays ship_to_home whether the parcel was picked in a store or a regional centre.,3️⃣ Set on add_shipping_info when the shopper selects the hand-off mode, carried forward on begin_checkout, and snapshotted immutably on purchase. The purchase-time value is the system of record for all reporting; any later change of mind is handled as a cancellation plus a new order, never as a retroactive rewrite of the original row.,4️⃣ Mixed-basket split-fulfillment orders are resolved at line-item grain: every item carries its own Fulfillment Method, and item-level BOPIS metrics sum across the basket without double counting. At order grain the value is 'split' when two or more distinct methods are present on one order, so order-level pickup counts are never inflated by shipped lines; report the pure methods and 'split' together to reconcile to total orders.,5️⃣ Sessions that never reach add_shipping_info — browse-only traffic, cart abandonment before shipping selection, and digital gift-card or e-delivery orders where no physical hand-off exists — are recorded as 'not_set' rather than defaulted to ship_to_home. Denominators for method mix must exclude 'not_set' and digital-only lines, and report them separately as data-quality volume.,6️⃣ The pickup leg is deliberately not bounded by the analytics session timeout. The store hand-off routinely occurs hours or days after the ordering session ends, so the dimension is keyed to the order identifier, not the session; pickup and collection events joined back to the order inherit the purchase-time value even when the offline leg falls in a later day, week or month than the order.,7️⃣ Refunds, returns and cancellations inherit the original purchase value so return-rate-by-method analysis stays comparable, including in-store returns of items originally shipped to home. Orders cancelled because the pickup window expired keep their pickup value and are flagged through the cancellation reason, not by moving them out of the method.

Business Use Case: |
  1️⃣ The Omnichannel Merchandising lead reviews weekly method mix by store cluster and, when BOPIS and curbside share falls below plan in a market, moves the pickup promise higher in the product detail page and checkout messaging for that market and re-tests the following week.,2️⃣ Store Operations planners use pickup-method volume by store and day-part to staff the collection desk and curbside lanes, triggering a rota change whenever a store's curbside orders exceed its hourly hand-off capacity two weeks running.,3️⃣ The Customer Service team segments contact drivers and refunds by method to isolate pickup-specific failure modes — order not ready, wrong item staged, expired pickup window — and routes the top offending stores to the regional manager for corrective action.,4️⃣ Finance uses the method split on completed orders to attribute shipping cost, last-mile spend and in-store attachment revenue, quantifying the margin difference between pickup and ship-to-home orders in the monthly channel profitability review.


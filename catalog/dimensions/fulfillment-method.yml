Dimension Name: Fulfillment Method

Description: |
  Fulfillment Method records the customer-visible way an order is handed over — BOPIS (buy online, pick up in store), curbside pickup, ship-to-store, ship-to-home or same-day delivery — captured at the shipping step and frozen on the completed order, making it the anchor that stitches the digital order to its offline pickup or delivery leg and the primary slice for every BOPIS and omnichannel KPI. It is deliberately narrower than Shipping Tier, which describes delivery speed and the service level the customer paid for (Standard, Expedited, Overnight), and than Fulfillment Strategy, which describes the backend sourcing decision (store-ship-from, dark store, regional distribution centre); those two are maintained as separate published rows and Fulfillment Method never carries their values.

Category: Operations

Tags: [dimension, Retail: Omnichannel (BOPIS - Buy Online Pick Up In Store)]

Industry: Retail

Priority: High

Core Area: Checkout

Scope: Event

Data Type: string

Aggregation Window: Event, Session, Daily, Weekly, Monthly


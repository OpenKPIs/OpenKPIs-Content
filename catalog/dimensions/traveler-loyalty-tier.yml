Dimension Name: Traveler Loyalty Tier

Description: |
  Identifies the travel loyalty program status level effective for a traveler when a digital interaction occurs, based on the latest authoritative tier available through the digital loyalty profile service. It enables comparison of acquisition, engagement, booking conversion, ancillary adoption, and retention behavior across standardized membership levels without exposing the traveler’s identity.

Category: Retention

Tags: [dimension]

Industry: Travel & Hospitality

Priority: High

Core Area: Engagement

Scope: User

Data Type: string

Aggregation Window: Event

GA4 Event: |
  traveler_loyalty_tier

Adobe Event: |
  s.t() / s.tl()

W3 Data Layer: |
  {"digitalData":{"user":[{"profile":[{"attributes":{"travelerLoyaltyTier":"standardized_tier_value"}}]}]}}

GA4 Data Layer: |
  {"user_properties":{"traveler_loyalty_tier":"standardized_tier_value"},"traveler_loyalty_tier":"standardized_tier_value"}

Adobe Client Data Layer: |

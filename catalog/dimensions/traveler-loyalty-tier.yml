Google Analytics SQL: |
  -- ==========================================
  -- 1. GOOGLE BIGQUERY SQL
  -- ==========================================
  WITH raw_events AS (
    SELECT
      user_id AS traveler_id,
      user_pseudo_id,
      COALESCE(NULLIF(user_id, ''), NULLIF(user_pseudo_id, '')) AS traveler_identifier,
      event_name,
      PARSE_DATE('%Y%m%d', event_date) AS source_event_date,
      TIMESTAMP_MICROS(event_timestamp) AS source_event_ts,
      stream_id,
      platform,
      device.category AS device_category,
      device.operating_system,
      device.web_info.browser AS browser,
      device.language,
      geo.country,
      geo.region,
      geo.city,
      COALESCE(
        (
          SELECT COALESCE(
            NULLIF(up.value.string_value, ''),
            CAST(up.value.int_value AS STRING),
            CAST(up.value.double_value AS STRING),
            CAST(up.value.float_value AS STRING)
          )
          FROM UNNEST(user_properties) AS up
          WHERE up.key = 'traveler_loyalty_tier'
          LIMIT 1
        ),
        (
          SELECT COALESCE(
            NULLIF(ep.value.string_value, ''),
            CAST(ep.value.int_value AS STRING),
            CAST(ep.value.double_value AS STRING),
            CAST(ep.value.float_value AS STRING)
          )
          FROM UNNEST(event_params) AS ep
          WHERE ep.key = 'traveler_loyalty_tier'
          LIMIT 1
        )
      ) AS raw_tier_value,
      CASE
        WHEN EXISTS (
          SELECT 1
          FROM UNNEST(user_properties) AS up
          WHERE up.key = 'traveler_loyalty_tier'
            AND COALESCE(
              NULLIF(up.value.string_value, ''),
              CAST(up.value.int_value AS STRING),
              CAST(up.value.double_value AS STRING),
              CAST(up.value.float_value AS STRING)
            ) IS NOT NULL
        ) THEN 'user_property'
        ELSE 'event_parameter'
      END AS extraction_method,
      (
        SELECT CAST(ep.value.int_value AS STRING)
        FROM UNNEST(event_params) AS ep
        WHERE ep.key = 'ga_session_id'
        LIMIT 1
      ) AS session_id
    FROM `your-project.analytics_123456789.events_*`
    WHERE COALESCE(NULLIF(user_id, ''), NULLIF(user_pseudo_id, '')) IS NOT NULL
  ),
  normalized_events AS (
    SELECT
      *,
      REGEXP_REPLACE(
        REGEXP_REPLACE(LOWER(TRIM(raw_tier_value)), r'[^a-z0-9]+', '_'),
        r'^_+|_+$',
        ''
      ) AS normalized_tier_value
    FROM raw_events
    WHERE raw_tier_value IS NOT NULL
      AND LOWER(TRIM(raw_tier_value)) NOT IN ('', 'null', 'undefined', 'unknown', 'n/a', 'na')
  ),
  tier_observations AS (
    SELECT
      *,
      CASE normalized_tier_value
        WHEN 'non_member' THEN 'NON_MEMBER'
        WHEN 'none' THEN 'NON_MEMBER'
        WHEN 'guest' THEN 'NON_MEMBER'
        WHEN 'member' THEN 'MEMBER'
        WHEN 'base' THEN 'MEMBER'
        WHEN 'basic' THEN 'MEMBER'
        WHEN 'standard' THEN 'STANDARD'
        WHEN 'silver' THEN 'SILVER'
        WHEN 'gold' THEN 'GOLD'
        WHEN 'platinum' THEN 'PLATINUM'
        WHEN 'diamond' THEN 'DIAMOND'
        WHEN 'elite' THEN 'ELITE'
        ELSE UPPER(normalized_tier_value)
      END AS loyalty_tier_code,
      ROW_NUMBER() OVER (
        PARTITION BY traveler_identifier
        ORDER BY source_event_ts DESC, event_name DESC
      ) AS traveler_recency_rank
    FROM normalized_events
  ),
  tier_statistics AS (
    SELECT
      traveler_identifier,
      normalized_tier_value,
      MIN(source_event_ts) AS first_observed_ts,
      MAX(source_event_ts) AS last_observed_ts,
      COUNT(*) AS observation_count,
      COUNT(DISTINCT session_id) AS session_count
    FROM tier_observations
    GROUP BY traveler_identifier, normalized_tier_value
  ),
  current_tier AS (
    SELECT *
    FROM tier_observations
    WHERE traveler_recency_rank = 1
  )
  SELECT
    TO_HEX(SHA256(current_tier.traveler_identifier)) AS traveler_key,
    current_tier.traveler_id,
    current_tier.user_pseudo_id,
    TO_HEX(SHA256(current_tier.loyalty_tier_code)) AS loyalty_tier_key,
    current_tier.loyalty_tier_code,
    CASE current_tier.loyalty_tier_code
      WHEN 'NON_MEMBER' THEN 'Non-member'
      WHEN 'MEMBER' THEN 'Member'
      WHEN 'STANDARD' THEN 'Standard'
      WHEN 'SILVER' THEN 'Silver'
      WHEN 'GOLD' THEN 'Gold'
      WHEN 'PLATINUM' THEN 'Platinum'
      WHEN 'DIAMOND' THEN 'Diamond'
      WHEN 'ELITE' THEN 'Elite'
      ELSE INITCAP(REPLACE(current_tier.normalized_tier_value, '_', ' '))
    END AS loyalty_tier_name,
    CASE current_tier.loyalty_tier_code
      WHEN 'NON_MEMBER' THEN 0
      WHEN 'MEMBER' THEN 1
      WHEN 'STANDARD' THEN 1
      WHEN 'SILVER' THEN 2
      WHEN 'GOLD' THEN 3
      WHEN 'PLATINUM' THEN 4
      WHEN 'DIAMOND' THEN 5
      WHEN 'ELITE' THEN 6
      ELSE 99
    END AS loyalty_tier_rank,
    CASE
      WHEN current_tier.loyalty_tier_code = 'NON_MEMBER' THEN 'NON_MEMBER'
      WHEN current_tier.loyalty_tier_code IN ('PLATINUM', 'DIAMOND', 'ELITE') THEN 'ELITE'
      WHEN current_tier.loyalty_tier_code IN ('SILVER', 'GOLD') THEN 'PREMIUM'
      WHEN current_tier.loyalty_tier_code IN ('MEMBER', 'STANDARD') THEN 'BASE'
      ELSE 'OTHER'
    END AS loyalty_tier_group,
    CASE WHEN current_tier.loyalty_tier_code = 'NON_MEMBER' THEN 'INACTIVE' ELSE 'ACTIVE' END AS loyalty_tier_status,
    current_tier.loyalty_tier_code <> 'NON_MEMBER' AS is_loyalty_member,
    current_tier.loyalty_tier_code IN ('PLATINUM', 'DIAMOND', 'ELITE') AS is_elite_tier,
    current_tier.raw_tier_value,
    current_tier.normalized_tier_value,
    'Digital Loyalty Profile API + Digital Analytics' AS source_system,
    'GA4' AS source_platform,
    'your-project.analytics_123456789.events_*' AS source_dataset,
    current_tier.event_name AS source_event_name,
    current_tier.source_event_date,
    current_tier.source_event_ts,
    tier_statistics.first_observed_ts,
    tier_statistics.last_observed_ts,
    DATE(tier_statistics.first_observed_ts) AS first_observed_date,
    DATE(tier_statistics.last_observed_ts) AS last_observed_date,
    tier_statistics.observation_count,
    tier_statistics.session_count,
    current_tier.device_category,
    current_tier.operating_system,
    current_tier.browser,
    current_tier.country,
    current_tier.region,
    current_tier.city,
    current_tier.language,
    current_tier.stream_id,
    current_tier.platform,
    '123456789' AS property_id,
    'DIGITAL' AS collection_channel,
    current_tier.extraction_method,
    CASE current_tier.extraction_method WHEN 'user_property' THEN 1 ELSE 2 END AS source_precedence,
    'GA4_EVENT_EXPORT' AS record_source,
    tier_statistics.first_observed_ts AS effective_start_ts,
    CAST(NULL AS TIMESTAMP) AS effective_end_ts,
    TRUE AS is_current,
    FALSE AS is_inferred,
    TRUE AS is_valid,
    CASE
      WHEN current_tier.loyalty_tier_code IN ('NON_MEMBER', 'MEMBER', 'STANDARD', 'SILVER', 'GOLD', 'PLATINUM', 'DIAMOND', 'ELITE')
        THEN 'VALID_STANDARD_TIER'
      ELSE 'VALID_UNMAPPED_TIER'
    END AS validation_status,
    CASE
      WHEN current_tier.traveler_id IS NOT NULL
        AND current_tier.loyalty_tier_code IN ('NON_MEMBER', 'MEMBER', 'STANDARD', 'SILVER', 'GOLD', 'PLATINUM', 'DIAMOND', 'ELITE') THEN 1.00
      WHEN current_tier.loyalty_tier_code IN ('NON_MEMBER', 'MEMBER', 'STANDARD', 'SILVER', 'GOLD', 'PLATINUM', 'DIAMOND', 'ELITE') THEN 0.90
      ELSE 0.75
    END AS data_quality_score,
    CURRENT_TIMESTAMP() AS created_ts,
    CURRENT_TIMESTAMP() AS updated_ts,
    TO_HEX(SHA256(CONCAT(
      current_tier.traveler_identifier, '|',
      current_tier.loyalty_tier_code, '|',
      CAST(current_tier.source_event_ts AS STRING)
    ))) AS record_hash
  FROM current_tier
  JOIN tier_statistics
    ON current_tier.traveler_identifier = tier_statistics.traveler_identifier
   AND current_tier.normalized_tier_value = tier_statistics.normalized_tier_value;


Calculation Notes: |
  Persist the authoritative tier value returned by the digital loyalty profile API as an event-time snapshot rather than applying the traveler’s current tier retroactively to historical activity. Normalize source labels and codes to the enterprise tier taxonomy while retaining program-specific distinctions where tier structures differ; for example, map case, spacing, abbreviations, and legacy codes to one governed value. Assign "Non-Member" only when the digital identity service confirms that the traveler has no loyalty membership, and assign "Unknown" when authentication, identity resolution, consent, profile retrieval, or tier data is unavailable. Anonymous visitors must remain "Unknown" and must not be inferred as "Non-Member." Pending qualification, promotional trial, lifetime status, invitation-only status, grace-period status, and suspended memberships must follow explicit loyalty-program rules and must not be promoted to a standard earned tier unless the authoritative service identifies that tier as currently effective. When multiple memberships are associated with a traveler, use the tier for the loyalty program relevant to the active brand or transaction; if no program context exists, use the designated primary digital membership. Resolve conflicting values by effective timestamp and source authority, giving precedence to the loyalty profile service over browser storage, campaign parameters, client-side data layers, or previously cached analytics attributes. Apply tier changes from their effective timestamp, honor downgrade grace periods represented by the source system, and prevent future-dated tiers from appearing early. Reprocess late-arriving profile updates only when event-time effective dating is available; otherwise preserve the originally observed value and document restatement behavior. Exclude test accounts, employee-only tiers, synthetic traffic, bots, monitoring agents, and invalid or deleted loyalty profiles from production reporting. Account merges must retain event-time tier history and must not rewrite prior events solely because digital identities were consolidated.

Business Use Case: |
  The Chief Loyalty Officer compares authenticated booking conversion, direct-channel adoption, ancillary attachment, and repeat digital engagement by loyalty tier. If mid-tier travelers demonstrate strong trip-search activity but materially lower booking completion than top-tier travelers, the loyalty and product teams can introduce targeted digital benefits, personalized upgrade messaging, or checkout interventions and measure whether the changes improve retention and direct revenue.



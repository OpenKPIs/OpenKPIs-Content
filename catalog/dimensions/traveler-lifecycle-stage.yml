Dimension Name: Traveler Lifecycle Stage

Description: |
  Classifies each recognized digital traveler into the most advanced currently applicable stage of the travel journey based on observed browsing, planning, booking, trip-date, and post-trip behaviors. The dimension provides a governed, point-in-time state for analyzing progression, abandonment, re-engagement, and repeat travel across first-party digital experiences.

Category: Engagement

Tags: [dimension]

Industry: Travel & Hospitality

Priority: High

Core Area: Generic

Scope: User

Data Type: string

Aggregation Window: User (evaluated at each event with a daily current-state snapshot)


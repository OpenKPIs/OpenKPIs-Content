Dimension Name: Store Inventory Status

Description: |
  Retail store-level availability state — In Stock, Low Stock or Out of Stock — that was displayed to the shopper for the requested item at the store they selected, at the moment of the check. The value is resolved per store rather than per item: it is keyed by store_id on the store inventory check, is sourced from store-level salable quantity rather than the global catalog, and gates whether a BOPIS order can be placed at all. A store-context event that arrives without a resolved availability label is reported as (not set), the single unknown bucket, so the complete value set is In Stock, Low Stock, Out of Stock or (not set).

Category: Conversion

Tags: [dimension, Retail: Omnichannel (BOPIS - Buy Online Pick Up In Store)]

Industry: Retail

Priority: High

Core Area: Discovery

Scope: Event

Data Type: string

Aggregation Window: Event, Session, Daily, Weekly


Dimension Name: Store Inventory Status

Description: |
  Retail store-level specialisation of the generic item-level Stock Status concept: it records the availability state — In Stock, Low Stock or Out of Stock — that was displayed to the shopper for the requested item at the store they selected, at the moment of the check. The implementation differs in substance from the catalog-wide concept because the value is resolved per store rather than per item, is keyed by store_id on the store inventory check, is sourced from store-level salable quantity rather than the global catalog, and gates whether a BOPIS order can be placed at all.

Category: Conversion




























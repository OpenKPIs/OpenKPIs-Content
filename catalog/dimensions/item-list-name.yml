Dimension Name: Item List Name

Description: |
  Identifies the product list or merchandising module (Search Results, Category Grid, Related Products, Recently Viewed, New Arrivals, and so on) in which an item was rendered or from which it was selected, captured through the GA4 item_list_name parameter on view_item_list and select_item and carried forward to the item's add_to_cart, begin_checkout and purchase events. Paired with its stable key item_list_id, it lets Merchandising attribute list impressions, clicks, cart additions and item revenue to the placement that produced them, and that attribution drives slotting, ranking and recommendation-module investment decisions.

Category: Engagement




























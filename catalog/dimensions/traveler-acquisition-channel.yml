Dimension Name: Traveler Acquisition Channel

Description: |
  Classifies each known or anonymous traveler by the normalized digital marketing channel that generated the traveler’s earliest eligible interaction with the brand. The value provides a persistent, mutually exclusive acquisition classification for first-touch cohort analysis and does not change when the traveler returns through subsequent channels.

Category: Acquisition

Tags: [dimension]

Industry: Travel & Hospitality

Priority: High

Core Area: Discovery

Scope: User

Data Type: string

Aggregation Window: User

GA4 Event: |
  page_view

Adobe Event: |
  page_view


    example_learning_offering_id,
    example_learning_offering_name,
    CASE WHEN format_category = 'UNKNOWN' THEN 'MISSING_OR_UNKNOWN' WHEN format_category = 'OTHER' THEN 'UNMAPPED_VALUE' ELSE 'VALID' END AS data_quality_status,
    format_category = 'UNKNOWN' AS is_unknown,
    TRUE AS is_active,
    CAST(first_seen_timestamp AS DATE) AS effective_start_date,

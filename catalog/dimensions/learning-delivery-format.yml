    format_category AS learning_delivery_format_category,
    CASE
      WHEN format_category = 'IN_PERSON' THEN 'PHYSICAL'
      WHEN format_category IN ('ONLINE', 'ONLINE_SELF_PACED', 'VIRTUAL_INSTRUCTOR_LED') THEN 'DIGITAL'
      WHEN format_category = 'HYBRID' THEN 'PHYSICAL_AND_DIGITAL'
      WHEN format_category = 'CORRESPONDENCE' THEN 'REMOTE_NON_DIGITAL'
      ELSE 'UNCLASSIFIED'
    END AS delivery_mode,
    CASE
      WHEN format_category = 'IN_PERSON' THEN 'PHYSICAL_LOCATION'
      WHEN format_category = 'HYBRID' THEN 'PHYSICAL_AND_VIRTUAL'
      WHEN format_category IN ('ONLINE', 'ONLINE_SELF_PACED', 'VIRTUAL_INSTRUCTOR_LED') THEN 'VIRTUAL_LOCATION'
      WHEN format_category = 'CORRESPONDENCE' THEN 'REMOTE'
      ELSE 'UNKNOWN'
    END AS location_type,
    CASE
      WHEN format_category IN ('IN_PERSON', 'VIRTUAL_INSTRUCTOR_LED') THEN 'SYNCHRONOUS'
      WHEN format_category = 'ONLINE_SELF_PACED' THEN 'ASYNCHRONOUS'
      WHEN format_category IN ('HYBRID', 'ONLINE') THEN 'MIXED_OR_UNSPECIFIED'
      ELSE 'UNKNOWN'
    END AS synchronicity_type,
    CASE
      WHEN format_category IN ('IN_PERSON', 'VIRTUAL_INSTRUCTOR_LED') THEN 'INSTRUCTOR_PRESENT'
      WHEN format_category = 'ONLINE_SELF_PACED' THEN 'NO_LIVE_INSTRUCTOR'
      WHEN format_category IN ('HYBRID', 'ONLINE') THEN 'OPTIONAL_OR_MIXED'
      ELSE 'UNKNOWN'
    END AS instructor_presence_type,
    CASE
      WHEN format_category = 'IN_PERSON' THEN 'FACE_TO_FACE'
      WHEN format_category = 'VIRTUAL_INSTRUCTOR_LED' THEN 'LIVE_DIGITAL'
      WHEN format_category IN ('ONLINE', 'ONLINE_SELF_PACED') THEN 'DIGITAL'
      WHEN format_category = 'HYBRID' THEN 'MULTIMODAL'
      WHEN format_category = 'CORRESPONDENCE' THEN 'CORRESPONDENCE'
      ELSE 'UNKNOWN'
    END AS interaction_mode,
    CASE WHEN format_category IN ('ONLINE', 'ONLINE_SELF_PACED', 'VIRTUAL_INSTRUCTOR_LED', 'HYBRID') THEN 'TECHNOLOGY_REQUIRED' ELSE 'TECHNOLOGY_NOT_REQUIRED_OR_UNKNOWN' END AS technology_dependency_type,
    CASE WHEN format_category = 'IN_PERSON' THEN 'ONSITE' WHEN format_category = 'HYBRID' THEN 'ONSITE_AND_REMOTE' WHEN format_category = 'UNKNOWN' THEN 'UNKNOWN' ELSE 'REMOTE' END AS attendance_mode,
    CASE WHEN format_category IN ('IN_PERSON', 'VIRTUAL_INSTRUCTOR_LED') THEN 'SCHEDULED' WHEN format_category = 'ONLINE_SELF_PACED' THEN 'ON_DEMAND' WHEN format_category IN ('HYBRID', 'ONLINE') THEN 'MIXED_OR_UNSPECIFIED' ELSE 'UNKNOWN' END AS schedule_type,
    CASE WHEN format_category = 'ONLINE_SELF_PACED' THEN 'LEARNER_PACED' WHEN format_category IN ('IN_PERSON', 'VIRTUAL_INSTRUCTOR_LED') THEN 'INSTRUCTOR_PACED' WHEN format_category IN ('HYBRID', 'ONLINE') THEN 'MIXED_OR_UNSPECIFIED' ELSE 'UNKNOWN' END AS pacing_type,
    CASE WHEN format_category = 'IN_PERSON' THEN 'CLASSROOM' WHEN format_category IN ('ONLINE', 'ONLINE_SELF_PACED', 'VIRTUAL_INSTRUCTOR_LED') THEN 'DIGITAL_LEARNING' WHEN format_category = 'HYBRID' THEN 'BLENDED_LEARNING' ELSE format_category END AS modality_group,
    CASE WHEN format_category = 'IN_PERSON' THEN 'OFFLINE' WHEN format_category = 'HYBRID' THEN 'OMNICHANNEL' WHEN format_category = 'CORRESPONDENCE' THEN 'NON_DIGITAL_REMOTE' WHEN format_category = 'UNKNOWN' THEN 'UNKNOWN' ELSE 'DIGITAL' END AS channel_group,
    format_category IN ('ONLINE', 'ONLINE_SELF_PACED', 'VIRTUAL_INSTRUCTOR_LED', 'HYBRID') AS is_online,
    format_category IN ('IN_PERSON', 'HYBRID') AS is_in_person,
    format_category = 'HYBRID' AS is_hybrid,
    format_category IN ('ONLINE', 'ONLINE_SELF_PACED', 'VIRTUAL_INSTRUCTOR_LED', 'HYBRID') AS is_virtual,
    format_category = 'ONLINE_SELF_PACED' AS is_self_paced,
    format_category IN ('IN_PERSON', 'VIRTUAL_INSTRUCTOR_LED', 'HYBRID') AS is_instructor_led,
    format_category IN ('IN_PERSON', 'VIRTUAL_INSTRUCTOR_LED', 'HYBRID') AS is_synchronous,
    format_category IN ('ONLINE_SELF_PACED', 'ONLINE', 'HYBRID') AS is_asynchronous,
    format_category = 'HYBRID' AS is_blended,
    format_category = 'ONLINE_SELF_PACED' AS is_on_demand,
    format_category IN ('IN_PERSON', 'HYBRID') AS requires_physical_location,
    format_category IN ('ONLINE', 'ONLINE_SELF_PACED', 'VIRTUAL_INSTRUCTOR_LED', 'HYBRID') AS requires_virtual_platform,
    '1.0' AS taxonomy_version,
    'ADOBE_EXPERIENCE_PLATFORM' AS source_system,
    'view_item' AS source_event_name,
    'XDM_EXPERIENCE_EVENT' AS source_schema,
    representative_source_field_path AS source_field_path,
    CAST(first_seen_timestamp AS DATE) AS first_seen_date,

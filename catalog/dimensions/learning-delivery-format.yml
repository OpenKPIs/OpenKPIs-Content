Dimension Name: Learning Delivery Format

Description: |
  Classifies the primary operational format through which a learner receives a course, program, class, or other learning offering. It distinguishes asynchronous online, synchronous virtual, in-person, hybrid, blended, and offline self-directed delivery for consistent engagement, completion, capacity, and outcome analysis.

Category: Engagement

Tags: [dimension]

Industry: EdTech & E-Learning

Priority: High

Core Area: Engagement

Scope: Item

Data Type: string

Aggregation Window: Event


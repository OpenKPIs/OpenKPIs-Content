            REGEXP_REPLACE(LOWER(raw_learning_delivery_format), '[_/|]+', ' '),
            '\\s+',
            ' '
          )
        ),
        ''
      ) AS normalized_value
    FROM source_events
  ),
  classified AS (
    SELECT
      *,
      CASE
        WHEN normalized_value IS NULL OR normalized_value IN ('unknown', 'not set', '(not set)', 'n a', 'na', 'null', 'unspecified') THEN 'UNKNOWN'
        WHEN normalized_value RLIKE '\\b(hybrid|blended|mixed mode|mixed modality|flex|hyflex)\\b' THEN 'HYBRID'

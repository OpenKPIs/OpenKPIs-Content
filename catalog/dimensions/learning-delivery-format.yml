Calculation Notes: |
  1️⃣ Assign format at learning-offering or scheduled-section level.  
  2️⃣ Copy effective value to enrollment, attendance, content-launch, progress, and completion events.  
  3️⃣ Use 'blended' for asynchronous and scheduled synchronous components.  
  4️⃣ Use 'hybrid_synchronous' for physical or virtual attendance options.  
  5️⃣ Do not classify as blended based on downloadable files or optional content.  
  6️⃣ Use offering-level value over course-level value in case of conflicts.  
  7️⃣ Map missing values to 'unknown' and exclude test or deleted offerings.

Business Use Case: |
  The Chief Learning Officer compares enrollment, attendance, completion, learner satisfaction, and unit delivery cost by format. If synchronous virtual offerings produce completion outcomes comparable to in-person offerings but have lower delivery cost and higher geographic reach, the portfolio team can shift selected future sections to synchronous virtual delivery while retaining in-person delivery for subjects requiring physical practice.


Source Data: Learning Management System (LMS), Learning Experience Platform (LXP), Student Information System (SIS), Course Catalog, Virtual Classroom Platform, Scheduling System, and Digital Analytics


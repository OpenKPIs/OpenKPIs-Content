Dimension Name: Return Reason

Description: |
  Return Reason is the standardised code a customer selects for each returned line item when starting a return after delivery, such as Size Too Small, Size Too Large, Defective or Damaged, Not as Described, Wrong Item Sent, Unwanted or Changed Mind, and Arrived Too Late. It explains why post-purchase revenue is reversed, so Merchandising, Customer Service and Fulfilment can separate fit, quality, content-accuracy and delivery failures from buyer's remorse; it covers returns only, not pre-shipment cancellations, which are tracked in Order Cancellation Reason.

Category: Operations

Tags: [dimension, E-commerce: Returns, Refunds & Customer Support]

Industry: E-commerce

Priority: High

Core Area: Monetization

Scope: Event

Data Type: string

Aggregation Window: Event, Daily, Weekly, Monthly


Dimension Name: Customer Segment

Description: |
  Owner-defined segment a customer belongs to (e.g. vip, wholesale, employee), as set in the CRM or commerce platform. Unlike RFM Segment or Customer Value Tier, it follows business rules, not a score.

Category: Retention


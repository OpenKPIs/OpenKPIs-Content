Google Analytics SQL: |
  WITH purchases AS (
    SELECT
      ecommerce.transaction_id AS transaction_id,
      user_id AS customer_id,
      (SELECT p.value.string_value FROM UNNEST(event_params) p
       WHERE p.key = 'customer_segment') AS customer_segment
    FROM `{{GA4_PROJECT}}.{{GA4_DATASET}}.events_*`
    WHERE event_name = 'purchase'
      AND _TABLE_SUFFIX BETWEEN
        FORMAT_DATE('%Y%m%d', DATE_SUB(DATE(@report_start), INTERVAL 1 DAY))
        AND FORMAT_DATE('%Y%m%d', DATE_ADD(DATE(@report_end), INTERVAL 1 DAY))
      AND event_timestamp >= UNIX_MICROS(@report_start)
      AND event_timestamp < UNIX_MICROS(@report_end)
  )
  SELECT transaction_id, customer_id, customer_segment
  FROM purchases
  WHERE customer_id IS NOT NULL
    AND customer_segment IS NOT NULL;

AEP Query Service SQL: |
  SELECT
    commerce.order.purchaseID AS transaction_id,
    identityMap['CRMID'][0].id AS customer_id,
    _openkpis.customerSegment AS customer_segment
  FROM {{AEP_EXPERIENCE_EVENT_DATASET}}
  WHERE eventType = 'commerce.purchases'
    AND timestamp >= CAST('{{REPORT_START}}' AS TIMESTAMP)
    AND timestamp < CAST('{{REPORT_END}}' AS TIMESTAMP)
    AND identityMap['CRMID'][0].id IS NOT NULL
    AND _openkpis.customerSegment IS NOT NULL;

Calculation Notes: |
  1️⃣ One row per purchase; return its recorded segment unchanged, without later membership updates.
  2️⃣ The source applies Marketing's precedence rules to supply one segment when memberships overlap.
  3️⃣ Exclude purchases missing Customer ID or Customer Segment; use only the primary CRMID entry in AEP.
  4️⃣ Use UTC report bounds: include the start and exclude the end; no prior-behavior lookback applies.
  5️⃣ Integration requires one purchase per transaction, unique parameter keys, and one primary CRMID entry.

Business Use Case: |
  1️⃣ Marketing compares repeat purchasing by segment before adjusting retention campaigns.
  2️⃣ Merchandising compares wholesale and retail purchases before changing pack sizes or pricing.


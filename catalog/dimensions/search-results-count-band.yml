Google Analytics SQL: |
  WITH received_searches AS (
    SELECT event_timestamp AS receipt_micros,
      (SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'event_id') AS search_id,
      (SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'search_term') AS internal_search_term,
      (SELECT value.int_value FROM UNNEST(event_params) WHERE key = 'search_results_count') AS results_count,
      SAFE_CAST((SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'occurred_at') AS TIMESTAMP) AS occurrence_time
    FROM `project.analytics_dataset.events_*`
    WHERE event_name = 'search'
      AND _TABLE_SUFFIX BETWEEN FORMAT_DATE('%Y%m%d', DATE_SUB(DATE(@report_start_utc), INTERVAL 1 DAY))
                            AND FORMAT_DATE('%Y%m%d', DATE_ADD(DATE(@report_end_utc), INTERVAL 1 DAY))
      AND event_timestamp < UNIX_MICROS(@report_end_utc)
  )
  SELECT search_id, internal_search_term,
    CASE
      WHEN results_count = 0 THEN '0'
      WHEN results_count BETWEEN 1 AND 10 THEN '1-10'
      WHEN results_count BETWEEN 11 AND 50 THEN '11-50'
      WHEN results_count >= 51 THEN '51+'
      ELSE '(not set)'
    END AS search_results_count_band
  FROM received_searches
  WHERE occurrence_time >= @report_start_utc AND occurrence_time < @report_end_utc
    AND search_id IS NOT NULL AND search_id <> ''
  QUALIFY ROW_NUMBER() OVER (PARTITION BY search_id ORDER BY receipt_micros) = 1

AEP Query Service SQL: |
  -- Configure the Query Service session with drop_system_columns=false to expose Adobe-managed ingestTime.
  -- Bind REPORT_END_EPOCH_MS to the same instant as REPORT_END_UTC.
  WITH eligible_searches AS (
    SELECT _id AS search_id,
      _openkpis.siteSearch.searchTerm AS internal_search_term,
      _openkpis.siteSearch.searchResultsCount AS results_count,
      ROW_NUMBER() OVER (PARTITION BY _id ORDER BY _acp_system_metadata.ingestTime) AS receipt_rank
    FROM {{AEP_EXPERIENCE_EVENT_DATASET}}
    WHERE eventType = 'search'
      AND _acp_system_metadata.ingestTime < CAST({{REPORT_END_EPOCH_MS}} AS BIGINT)
      AND timestamp >= CAST('{{REPORT_START_UTC}}' AS TIMESTAMP)
      AND timestamp < CAST('{{REPORT_END_UTC}}' AS TIMESTAMP)
      AND _id IS NOT NULL AND _id <> ''
  )
  SELECT search_id, internal_search_term,
    CASE
      WHEN results_count = 0 THEN '0'
      WHEN results_count BETWEEN 1 AND 10 THEN '1-10'
      WHEN results_count BETWEEN 11 AND 50 THEN '11-50'
      WHEN results_count >= 51 THEN '51+'
      ELSE '(not set)'
    END AS search_results_count_band
  FROM eligible_searches
  WHERE receipt_rank = 1

Calculation Notes: |
  1️⃣ Use the total matches from the initial response to each submitted search, before pagination.
  2️⃣ Exclude autocomplete displays, sort reloads, later pages, and internal and bot traffic at collection.
  3️⃣ Use “(not set)” for missing or invalid counts. Reserve “0” for explicit zero matches.
  4️⃣ Use occurrence time and events received by each analytics platform before the reporting period ended.
  5️⃣ Keep one row per search ID. Retries reuse the ID and snapshot. A new submission of the same term gets a new ID.

Business Use Case: |
  1️⃣ Search merchandisers review terms in the 0 band to decide where synonyms or redirects could help.
  2️⃣ Search product owners review terms in the 51+ band to decide where to improve ranking or add filters.


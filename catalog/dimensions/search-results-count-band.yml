Dimension Name: Search Results Count Band
Aliases: [Search Result Count Band, Search Results Bucket]

Formula: Search results count → Search Results Count Band

Description: |
  Groups submitted storefront searches by how many matches the search engine found. The bands show where shoppers find no matches, a short list, or a broad set of results.

Category: Engagement

Tags: [site search, product discovery, search results]

Industry: [E-commerce, Retail]

Business Criticality: Medium

Journey / Navigation Area: [Discovery]

Owning Function: Merchandising

Scope: Event

Measurement Channels: [Web]

Data Type: string



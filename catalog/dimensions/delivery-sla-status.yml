Dimension Name: Delivery SLA Status

Description: |
  Delivery SLA Status classifies each shipment as Early, On Time or Late by comparing the carrier delivery scan with the delivery promise date. Open shipments are In Transit or At Risk until the promise date passes.

Category: Operations

Tags: [dimension, E-commerce: Post-Purchase Logistics & Fulfillment]

Industry: E-commerce

Priority: High

Core Area: Generic

Scope: Event

Data Type: string

Aggregation Window: Event, Daily, Weekly, Monthly


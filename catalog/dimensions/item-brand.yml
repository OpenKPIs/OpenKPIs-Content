Dimension Name: Item Brand

Description: |
  The brand or manufacturer of the product in an ecommerce item interaction, captured on every item in the GA4 items[] array (item_brand) and resolved to a governed brand master keyed on item_id. It splits item views, list impressions, add-to-carts and purchased revenue by brand, so merchandising, vendor-partnership and search teams can compare brand demand, conversion and assortment performance on one consistent key.

Category: Conversion

Tags: [dimension, E-commerce: Product Discovery & Merchandising (Search/Filters/PDP)]

Industry: E-commerce

Priority: High

Core Area: Discovery

Scope: Event

Data Type: string

Aggregation Window: Event, Session, Daily, Weekly, Monthly

GA4 Event: |
  view_item

Adobe Event: |
  prodView


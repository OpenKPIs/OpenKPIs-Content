Dimension Name: Transit Distance Band

Description: |
  Transit Distance Band classifies the distance between the committed fulfillment origin and the customer's delivery destination into standardized ranges for each eligible customer journey event. It enables analysis of how delivery distance affects shipping choices, checkout conversion, delivery engagement, billing outcomes, retention, and customer lifetime value without exposing an exact address or distance.


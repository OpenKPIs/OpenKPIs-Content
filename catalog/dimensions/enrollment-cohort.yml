Dimension Name: Enrollment Cohort

Description: |
  Enrollment Cohort classifies each valid course or program enrollment by the calendar month in which the enrollment became effective. It enables comparison of conversion, engagement, completion, and retention outcomes among enrollments that started during the same period.

Category: Conversion

Tags: [dimension]

Industry: EdTech & E-Learning

Priority: High

Core Area: Onboarding

Scope: Item

Data Type: string

Aggregation Window: Time based - Monthly







Google Analytics SQL: |
  -- ==========================================
  -- 1. GOOGLE BIGQUERY SQL
  -- ==========================================
  WITH enrollment_latest AS (
    SELECT
      e.*,
      ROW_NUMBER() OVER (
        PARTITION BY e.enrollment_id
        ORDER BY e.updated_at DESC, e.created_at DESC
      ) AS version_rank
    FROM `your-project.sis.enrollments` AS e
  ),
  qualifying_enrollments AS (
    SELECT
      e.*
    FROM enrollment_latest AS e
    WHERE e.version_rank = 1
      AND LOWER(e.enrollment_status) IN (
        'enrolled',
        'active',
        'completed',
        'graduated',
        'withdrawn'
      )
  ),
  first_enrollment AS (
    SELECT * EXCEPT (first_enrollment_rank)
    FROM (
      SELECT
        e.*,
        ROW_NUMBER() OVER (
          PARTITION BY e.student_id, e.institution_id
          ORDER BY
            COALESCE(e.enrollment_start_date, DATE(e.created_at)),
            e.created_at,
            e.enrollment_id
        ) AS first_enrollment_rank
      FROM qualifying_enrollments AS e
    )
    WHERE first_enrollment_rank = 1
  ),
  application_ranked AS (
    SELECT
      a.*,
      ROW_NUMBER() OVER (
        PARTITION BY a.student_id, a.institution_id, a.program_id
        ORDER BY
          CASE WHEN LOWER(a.application_status) IN ('accepted', 'admitted', 'enrolled') THEN 0 ELSE 1 END,
          a.admission_date DESC,
          a.updated_at DESC,
          a.application_id DESC
      ) AS application_rank
    FROM `your-project.crm.applications` AS a
  ),
  cohort_base AS (
    SELECT
      TO_HEX(SHA256(CONCAT(
        COALESCE(CAST(e.student_id AS STRING), 'UNKNOWN'), '|',
        COALESCE(CAST(e.institution_id AS STRING), 'UNKNOWN'), '|',
        COALESCE(CAST(e.program_id AS STRING), 'UNKNOWN'), '|',
        COALESCE(CAST(e.term_id AS STRING), 'UNKNOWN')
      ))) AS enrollment_cohort_key,
      CONCAT(
        COALESCE(CAST(e.institution_id AS STRING), 'UNKNOWN'), '-',
        COALESCE(CAST(e.program_id AS STRING), 'UNDECLARED'), '-',
        COALESCE(t.term_code, FORMAT_DATE('%Y-%m', COALESCE(t.term_start_date, e.enrollment_start_date)))
      ) AS cohort_code,
      CONCAT(
        COALESCE(i.institution_name, 'Unknown Institution'), ' / ',
        COALESCE(p.program_name, 'Undeclared Program'), ' / ',
        COALESCE(t.term_name, FORMAT_DATE('%B %Y', COALESCE(t.term_start_date, e.enrollment_start_date)))
      ) AS cohort_name,
      'FIRST_INSTITUTION_ENROLLMENT' AS cohort_type,
      COALESCE(t.term_start_date, e.enrollment_start_date, DATE(e.created_at)) AS cohort_start_date,
      COALESCE(t.academic_year, CONCAT(
        CAST(
          CASE
            WHEN EXTRACT(MONTH FROM COALESCE(t.term_start_date, e.enrollment_start_date, DATE(e.created_at))) >= 7
              THEN EXTRACT(YEAR FROM COALESCE(t.term_start_date, e.enrollment_start_date, DATE(e.created_at)))
            ELSE EXTRACT(YEAR FROM COALESCE(t.term_start_date, e.enrollment_start_date, DATE(e.created_at))) - 1
          END AS STRING
        ), '-',
        CAST(
          CASE
            WHEN EXTRACT(MONTH FROM COALESCE(t.term_start_date, e.enrollment_start_date, DATE(e.created_at))) >= 7
              THEN EXTRACT(YEAR FROM COALESCE(t.term_start_date, e.enrollment_start_date, DATE(e.created_at))) + 1
            ELSE EXTRACT(YEAR FROM COALESCE(t.term_start_date, e.enrollment_start_date, DATE(e.created_at)))
          END AS STRING
        )
      )) AS cohort_academic_year,
      t.term_code AS cohort_term_code,
      t.term_name AS cohort_term_name,
      t.term_type AS cohort_term_type,
      t.term_start_date AS cohort_term_start_date,
      t.term_end_date AS cohort_term_end_date,
      e.student_id,
      e.enrollment_id,
      a.application_id,
      e.institution_id,
      i.institution_name,
      e.campus_id,
      c.campus_name,
      p.college_id,
      col.college_name,
      p.department_id,
      d.department_name,
      e.program_id,
      p.program_name,
      p.program_level,
      p.degree_type,
      p.field_of_study,
      COALESCE(e.delivery_modality, p.default_delivery_modality, 'UNKNOWN') AS delivery_modality,
      COALESCE(e.attendance_intensity, 'UNKNOWN') AS attendance_intensity,
      COALESCE(e.student_type, 'UNKNOWN') AS student_type,
      COALESCE(a.admit_type, e.admit_type, 'UNKNOWN') AS admit_type,
      UPPER(e.enrollment_status) AS enrollment_status,
      e.enrollment_status_reason,
      COALESCE(e.enrollment_start_date, DATE(e.created_at)) AS enrollment_start_date,
      e.enrollment_end_date,
      COALESCE(e.enrollment_start_date, DATE(e.created_at)) AS first_enrollment_date,
      COALESCE(e.expected_graduation_date, a.expected_graduation_date) AS expected_graduation_date,
      COALESCE(s.residency_status, 'UNKNOWN') AS residency_status,
      UPPER(COALESCE(s.citizenship_country_code, 'UNKNOWN')) AS citizenship_country_code,
      CASE
        WHEN UPPER(s.residency_status) IN ('INTERNATIONAL', 'NONRESIDENT_ALIEN') THEN 'INTERNATIONAL'
        WHEN UPPER(s.citizenship_country_code) NOT IN ('US', 'USA', 'UNKNOWN') THEN 'INTERNATIONAL'
        WHEN s.residency_status IS NULL AND s.citizenship_country_code IS NULL THEN 'UNKNOWN'
        ELSE 'DOMESTIC'
      END AS domestic_international_flag,
      COALESCE(s.first_generation_flag, FALSE) AS first_generation_flag,
      COALESCE(s.transfer_student_flag, FALSE) AS transfer_student_flag,
      CASE
        WHEN UPPER(COALESCE(e.delivery_modality, p.default_delivery_modality, 'UNKNOWN')) IN
          ('ONLINE', 'FULLY_ONLINE', 'VIRTUAL', 'REMOTE') THEN TRUE
        ELSE FALSE
      END AS online_student_flag,
      GREATEST(
        COALESCE(e.updated_at, TIMESTAMP '1900-01-01 00:00:00+00'),
        COALESCE(s.updated_at, TIMESTAMP '1900-01-01 00:00:00+00'),
        COALESCE(a.updated_at, TIMESTAMP '1900-01-01 00:00:00+00'),
        COALESCE(t.updated_at, TIMESTAMP '1900-01-01 00:00:00+00'),
        COALESCE(p.updated_at, TIMESTAMP '1900-01-01 00:00:00+00')
      ) AS record_effective_timestamp
    FROM first_enrollment AS e
    INNER JOIN `your-project.sis.students` AS s
      ON s.student_id = e.student_id
    LEFT JOIN `your-project.sis.academic_terms` AS t
      ON t.term_id = e.term_id
     AND t.institution_id = e.institution_id
    LEFT JOIN `your-project.sis.programs` AS p
      ON p.program_id = e.program_id
     AND p.institution_id = e.institution_id
    LEFT JOIN `your-project.sis.institutions` AS i
      ON i.institution_id = e.institution_id
    LEFT JOIN `your-project.sis.campuses` AS c
      ON c.campus_id = e.campus_id
     AND c.institution_id = e.institution_id
    LEFT JOIN `your-project.sis.colleges` AS col
      ON col.college_id = p.college_id
     AND col.institution_id = e.institution_id
    LEFT JOIN `your-project.sis.departments` AS d
      ON d.department_id = p.department_id
     AND d.institution_id = e.institution_id
    LEFT JOIN application_ranked AS a
      ON a.student_id = e.student_id
     AND a.institution_id = e.institution_id
     AND a.program_id = e.program_id
     AND a.application_rank = 1
  ),
  cohort_enriched AS (
    SELECT
      b.*,
      COUNT(*) OVER (
        PARTITION BY b.institution_id, b.program_id, b.cohort_term_code
      ) AS cohort_size
    FROM cohort_base AS b
  )
  SELECT
    enrollment_cohort_key,
    cohort_code,
    cohort_name,
    cohort_type,
    cohort_start_date,
    EXTRACT(YEAR FROM cohort_start_date) AS cohort_start_year,
    EXTRACT(QUARTER FROM cohort_start_date) AS cohort_start_quarter,
    EXTRACT(MONTH FROM cohort_start_date) AS cohort_start_month,
    cohort_academic_year,
    cohort_term_code,
    cohort_term_name,
    cohort_term_type,
    cohort_term_start_date,
    cohort_term_end_date,
    student_id,
    enrollment_id,
    application_id,
    institution_id,
    institution_name,
    campus_id,
    campus_name,
    college_id,
    college_name,
    department_id,
    department_name,
    program_id,
    program_name,
    program_level,
    degree_type,
    field_of_study,
    delivery_modality,
    attendance_intensity,
    student_type,
    admit_type,
    enrollment_status,
    enrollment_status_reason,
    enrollment_start_date,
    enrollment_end_date,
    first_enrollment_date,
    expected_graduation_date,
    residency_status,
    citizenship_country_code,
    domestic_international_flag,
    first_generation_flag,
    transfer_student_flag,
    online_student_flag,
    cohort_size,
    CASE
      WHEN CURRENT_DATE() BETWEEN cohort_term_start_date AND cohort_term_end_date THEN TRUE
      ELSE FALSE
    END AS is_current_cohort,
    record_effective_timestamp
  FROM cohort_enriched;

AEP Query Service SQL: |
  -- ==========================================
  -- 2. ADOBE AEP QUERY SERVICE SQL
  -- ==========================================
  WITH enrollment_versioned AS (
    SELECT
      e.*,
      ROW_NUMBER() OVER (
        PARTITION BY e.enrollment_id
        ORDER BY e.updated_at DESC, e.created_at DESC
      ) AS version_rank
    FROM sis_enrollments AS e
  ),
  qualifying_enrollments AS (
    SELECT
      e.*
    FROM enrollment_versioned AS e
    WHERE e.version_rank = 1
      AND LOWER(e.enrollment_status) IN (
        'enrolled',
        'active',
        'completed',
        'graduated',
        'withdrawn'
      )
  ),
  first_enrollment_ranked AS (
    SELECT
      e.*,
      ROW_NUMBER() OVER (
        PARTITION BY e.student_id, e.institution_id
        ORDER BY
          COALESCE(e.enrollment_start_date, CAST(e.created_at AS DATE)),
          e.created_at,
          e.enrollment_id
      ) AS first_enrollment_rank
    FROM qualifying_enrollments AS e
  ),
  first_enrollment AS (
    SELECT
      e.*
    FROM first_enrollment_ranked AS e
    WHERE e.first_enrollment_rank = 1
  ),
  application_ranked AS (
    SELECT
      a.*,
      ROW_NUMBER() OVER (
        PARTITION BY a.student_id, a.institution_id, a.program_id
        ORDER BY
          CASE WHEN LOWER(a.application_status) IN ('accepted', 'admitted', 'enrolled') THEN 0 ELSE 1 END,
          a.admission_date DESC,
          a.updated_at DESC,
          a.application_id DESC
      ) AS application_rank
    FROM crm_applications AS a
  ),
  cohort_base AS (
    SELECT
      SHA2(CONCAT(
        COALESCE(CAST(e.student_id AS VARCHAR), 'UNKNOWN'), '|',
        COALESCE(CAST(e.institution_id AS VARCHAR), 'UNKNOWN'), '|',
        COALESCE(CAST(e.program_id AS VARCHAR), 'UNKNOWN'), '|',
        COALESCE(CAST(e.term_id AS VARCHAR), 'UNKNOWN')
      ), 256) AS enrollment_cohort_key,
      CONCAT(
        COALESCE(CAST(e.institution_id AS VARCHAR), 'UNKNOWN'), '-',
        COALESCE(CAST(e.program_id AS VARCHAR), 'UNDECLARED'), '-',
        COALESCE(t.term_code, TO_CHAR(COALESCE(t.term_start_date, e.enrollment_start_date), 'YYYY-MM'))
      ) AS cohort_code,
      CONCAT(
        COALESCE(i.institution_name, 'Unknown Institution'), ' / ',
        COALESCE(p.program_name, 'Undeclared Program'), ' / ',
        COALESCE(t.term_name, TO_CHAR(COALESCE(t.term_start_date, e.enrollment_start_date), 'Month YYYY'))
      ) AS cohort_name,
      'FIRST_INSTITUTION_ENROLLMENT' AS cohort_type,
      COALESCE(t.term_start_date, e.enrollment_start_date, CAST(e.created_at AS DATE)) AS cohort_start_date,
      COALESCE(t.academic_year, CONCAT(
        CAST(
          CASE
            WHEN EXTRACT(MONTH FROM COALESCE(t.term_start_date, e.enrollment_start_date, CAST(e.created_at AS DATE))) >= 7
              THEN EXTRACT(YEAR FROM COALESCE(t.term_start_date, e.enrollment_start_date, CAST(e.created_at AS DATE)))
            ELSE EXTRACT(YEAR FROM COALESCE(t.term_start_date, e.enrollment_start_date, CAST(e.created_at AS DATE))) - 1
          END AS VARCHAR
        ), '-',
        CAST(
          CASE
            WHEN EXTRACT(MONTH FROM COALESCE(t.term_start_date, e.enrollment_start_date, CAST(e.created_at AS DATE))) >= 7
              THEN EXTRACT(YEAR FROM COALESCE(t.term_start_date, e.enrollment_start_date, CAST(e.created_at AS DATE))) + 1
            ELSE EXTRACT(YEAR FROM COALESCE(t.term_start_date, e.enrollment_start_date, CAST(e.created_at AS DATE)))
          END AS VARCHAR
        )
      )) AS cohort_academic_year,
      t.term_code AS cohort_term_code,
      t.term_name AS cohort_term_name,
      t.term_type AS cohort_term_type,
      t.term_start_date AS cohort_term_start_date,
      t.term_end_date AS cohort_term_end_date,
      e.student_id,
      e.enrollment_id,
      a.application_id,
      e.institution_id,
      i.institution_name,
      e.campus_id,
      c.campus_name,
      p.college_id,
      col.college_name,
      p.department_id,
      d.department_name,
      e.program_id,
      p.program_name,
      p.program_level,
      p.degree_type,
      p.field_of_study,
      COALESCE(e.delivery_modality, p.default_delivery_modality, 'UNKNOWN') AS delivery_modality,
      COALESCE(e.attendance_intensity, 'UNKNOWN') AS attendance_intensity,
      COALESCE(e.student_type, 'UNKNOWN') AS student_type,
      COALESCE(a.admit_type, e.admit_type, 'UNKNOWN') AS admit_type,
      UPPER(e.enrollment_status) AS enrollment_status,
      e.enrollment_status_reason,
      COALESCE(e.enrollment_start_date, CAST(e.created_at AS DATE)) AS enrollment_start_date,
      e.enrollment_end_date,
      COALESCE(e.enrollment_start_date, CAST(e.created_at AS DATE)) AS first_enrollment_date,
      COALESCE(e.expected_graduation_date, a.expected_graduation_date) AS expected_graduation_date,
      COALESCE(s.residency_status, 'UNKNOWN') AS residency_status,
      UPPER(COALESCE(s.citizenship_country_code, 'UNKNOWN')) AS citizenship_country_code,
      CASE
        WHEN UPPER(s.residency_status) IN ('INTERNATIONAL', 'NONRESIDENT_ALIEN') THEN 'INTERNATIONAL'
        WHEN UPPER(s.citizenship_country_code) NOT IN ('US', 'USA', 'UNKNOWN') THEN 'INTERNATIONAL'
        WHEN s.residency_status IS NULL AND s.citizenship_country_code IS NULL THEN 'UNKNOWN'
        ELSE 'DOMESTIC'
      END AS domestic_international_flag,
      COALESCE(s.first_generation_flag, FALSE) AS first_generation_flag,
      COALESCE(s.transfer_student_flag, FALSE) AS transfer_student_flag,
      CASE
        WHEN UPPER(COALESCE(e.delivery_modality, p.default_delivery_modality, 'UNKNOWN')) IN
          ('ONLINE', 'FULLY_ONLINE', 'VIRTUAL', 'REMOTE') THEN TRUE
        ELSE FALSE
      END AS online_student_flag,
      GREATEST(
        COALESCE(e.updated_at, TIMESTAMP '1900-01-01 00:00:00'),
        COALESCE(s.updated_at, TIMESTAMP '1900-01-01 00:00:00'),
        COALESCE(a.updated_at, TIMESTAMP '1900-01-01 00:00:00'),
        COALESCE(t.updated_at, TIMESTAMP '1900-01-01 00:00:00'),
        COALESCE(p.updated_at, TIMESTAMP '1900-01-01 00:00:00')
      ) AS record_effective_timestamp
    FROM first_enrollment AS e
    INNER JOIN sis_students AS s
      ON s.student_id = e.student_id
    LEFT JOIN sis_academic_terms AS t
      ON t.term_id = e.term_id
     AND t.institution_id = e.institution_id
    LEFT JOIN sis_programs AS p
      ON p.program_id = e.program_id
     AND p.institution_id = e.institution_id
    LEFT JOIN sis_institutions AS i
      ON i.institution_id = e.institution_id
    LEFT JOIN sis_campuses AS c
      ON c.campus_id = e.campus_id
     AND c.institution_id = e.institution_id
    LEFT JOIN sis_colleges AS col
      ON col.college_id = p.college_id
     AND col.institution_id = e.institution_id
    LEFT JOIN sis_departments AS d
      ON d.department_id = p.department_id
     AND d.institution_id = e.institution_id
    LEFT JOIN application_ranked AS a
      ON a.student_id = e.student_id
     AND a.institution_id = e.institution_id
     AND a.program_id = e.program_id
     AND a.application_rank = 1
  ),
  cohort_enriched AS (
    SELECT
      b.*,
      COUNT(*) OVER (
        PARTITION BY b.institution_id, b.program_id, b.cohort_term_code
      ) AS cohort_size
    FROM cohort_base AS b
  )
  SELECT
    enrollment_cohort_key,
    cohort_code,
    cohort_name,
    cohort_type,
    cohort_start_date,
    EXTRACT(YEAR FROM cohort_start_date) AS cohort_start_year,
    EXTRACT(QUARTER FROM cohort_start_date) AS cohort_start_quarter,
    EXTRACT(MONTH FROM cohort_start_date) AS cohort_start_month,
    cohort_academic_year,
    cohort_term_code,
    cohort_term_name,
    cohort_term_type,
    cohort_term_start_date,
    cohort_term_end_date,
    student_id,
    enrollment_id,
    application_id,
    institution_id,
    institution_name,
    campus_id,
    campus_name,
    college_id,
    college_name,
    department_id,
    department_name,
    program_id,
    program_name,
    program_level,
    degree_type,
    field_of_study,
    delivery_modality,
    attendance_intensity,
    student_type,
    admit_type,
    enrollment_status,
    enrollment_status_reason,
    enrollment_start_date,
    enrollment_end_date,
    first_enrollment_date,
    expected_graduation_date,
    residency_status,
    citizenship_country_code,
    domestic_international_flag,
    first_generation_flag,
    transfer_student_flag,
    online_student_flag,
    cohort_size,
    CASE
      WHEN CURRENT_DATE BETWEEN cohort_term_start_date AND cohort_term_end_date THEN TRUE
      ELSE FALSE
    END AS is_current_cohort,
    record_effective_timestamp
  FROM cohort_enriched;

Calculation Notes: |
  Assign the cohort from the enrollment effective timestamp converted to the institution's reporting time zone, using the canonical YYYY-MM label. Include only completed, activated, or administratively confirmed enrollments; exclude drafts, failed payment attempts, waitlist entries, test records, duplicate enrollment events, and records canceled before access begins. A learner with multiple valid enrollments may belong to multiple cohorts because assignment occurs at enrollment grain. Re-enrollment after a completed withdrawal receives a new cohort only when a new enrollment identifier is issued. Preserve the original cohort for ordinary status changes, pauses, deferrals, and course progress activity. If the source timestamp is missing, retain an Unknown value until corrected rather than substituting ingestion time.

Business Use Case: |
  Enrollment Operations compares 30-day activation and 90-day completion rates across monthly enrollment cohorts by program and acquisition channel. If a recent cohort underperforms after controlling for program mix, leaders can investigate onboarding changes, instructor capacity, payment friction, or campaign quality and redirect operational resources.



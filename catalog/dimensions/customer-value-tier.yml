Dimension Name: Customer Value Tier

Description: |
  Assigns each customer to a High, Medium or Low tier by percentile rank of historical lifetime revenue: top 20%, next 30%, bottom 50%. Pure value tiering, unlike RFM Segment or Customer Loyalty Tier.

Category: Retention

Tags: [dimension, E-commerce: Customer Retention, Loyalty & LTV, ltv]

Industry: E-commerce

Priority: High

Core Area: Monetization

Scope: User


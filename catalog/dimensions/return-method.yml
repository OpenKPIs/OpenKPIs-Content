Dimension Name: Return Method

Description: |
  Return Method records how a returned item gets back to the merchant, with the values mail_in (prepaid label), carrier_drop_off (carrier counter, parcel locker or partner return point), in_store (including BORIS, buy online, return in store), scheduled_pickup, self_ship and returnless (refund or replacement issued without the item moving). Returns operations, store operations and finance teams use it to compare return cost, refund cycle time and resale recovery by method.

Category: Operations

Tags: [dimension, E-commerce: Returns, Refunds & Customer Support]

Industry: E-commerce

Priority: High

Core Area: Generic

Scope: Event

Data Type: string

Aggregation Window: Event, Daily, Weekly, Monthly


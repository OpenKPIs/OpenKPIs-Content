Dimension Name: Return Method

Description: |
  Return Method records how a returned item gets back to the merchant: prepaid mail-in label, carrier or partner drop-off point, in-store return (including online orders returned in store, known as BORIS or buy online, return in store), scheduled carrier pickup, or a shipment the customer arranges and pays for (self-ship). It also covers returnless refunds (keep-it refunds, where the refund or replacement is issued and the item does not move). It is the catalog's single definition of the Channel of Return concept (standard catalog sub-domain 6), so no separate Channel of Return dimension should be created, and returns, store operations and finance teams use it to compare return cost, refund cycle time and resale recovery by method.

Category: Operations




























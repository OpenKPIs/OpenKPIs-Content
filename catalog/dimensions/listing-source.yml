Calculation Notes: |
  1️⃣ Exclude property reference, valuation-only, test, training, and deleted records unless specified.  
  2️⃣ Relisted properties must have a new listing record source, not inherit from prior listings.  
  3️⃣ Feed retransmissions and listing updates do not create a new source.  
  4️⃣ Authorized transfers to a different feed require an effective-dated source change.  
  5️⃣ Consumer web-session timeout and traffic attribution rules do not apply.  
  6️⃣ Session, referrer, or campaign data must not overwrite Listing Source.  
  7️⃣ Use the source effective at the reporting timestamp for point-in-time reporting.

Business Use Case: |
  Marketplace Operations compares active inventory, publication success, duplicate rate, lead conversion, freshness, and listing expiry by Listing Source. Executives use the results to renegotiate underperforming feed agreements, prioritize direct broker or builder integrations, reduce dependency on high-cost syndication partners, and direct onboarding resources toward sources that deliver complete and converting inventory.


Source Data: Listing Ingestion Platform, MLS and RESO feeds, broker and partner APIs, bulk-upload services, agent and owner listing applications, builder systems, property-management integrations, and listing master data


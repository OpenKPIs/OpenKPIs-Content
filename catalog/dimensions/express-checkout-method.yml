Dimension Name: Express Checkout Method

Description: |
  Express Checkout Method records which accelerated wallet checkout a shopper launched to place an order (apple_pay, google_pay, shop_pay, paypal_express, amazon_pay or other_express), or none when the order went through the merchant's standard multi-step checkout, captured as the express_checkout parameter on begin_checkout, add_payment_info and purchase. Where Payment Method describes the tender that settled the order, this dimension describes the checkout path, so it is the breakdown used to size how much revenue skips the address, shipping and payment forms, and to see how each wallet converts compared with standard checkout.

Category: Conversion




























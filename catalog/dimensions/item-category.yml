Dimension Name: Item Category

Description: |
  Item Category is the top level of the merchandise hierarchy on every product in the GA4 items[] array (item_category, with item_category2 to item_category5 for deeper levels), matching the Adobe Analytics product-string category and the Shopify and Salesforce Commerce catalog category. Merchandising uses it to compare item views, add-to-carts, units and item revenue across departments, and it reconciles with finance reporting only when the value comes from the product master for the item_id rather than the page breadcrumb.

Category: Performance

Tags: [dimension, E-commerce: Product Discovery & Merchandising, product hierarchy]

Industry: E-commerce

Priority: High

Core Area: Discovery

Scope: Event

Data Type: string

Aggregation Window: Event, Session, Daily, Weekly, Monthly


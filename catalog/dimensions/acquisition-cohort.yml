Dimension Name: Acquisition Cohort

Description: |
  Acquisition Cohort is the calendar period in which a customer was acquired. In E-commerce that is the month (by default) of the customer's first completed, non-cancelled order in the store's reporting time zone, and it stays fixed for the life of the customer as the row key of retention triangles and LTV curves. Retention marketing, growth and finance teams compare cohorts at the same number of periods since acquisition to see whether customers won in a given month, promotion or seasonal peak repeat and build revenue faster or slower than earlier cohorts, separately from how the customer was acquired (first-touch channel) or where the customer stands today (customer status).

Category: Retention




























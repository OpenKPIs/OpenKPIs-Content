Calculation Notes: |
  Assign the canonical value effective at the event timestamp, not the promotion's current configuration. Test, employee-only, fraud, bot, duplicate, and internally generated transactions must be excluded from production journey reporting unless explicitly requested. A promotion exposure does not constitute redemption; redemption requires an accepted promotion application linked to a completed order, activated subscription, or posted eligible billing transaction. Refunds, cancellations, and chargebacks do not change the original Promotion Type but must be evaluated through transaction-status dimensions when analyzing realized revenue. Session reporting should use the enterprise session definition, normally 30 minutes of inactivity, without changing the event-level classification.

Business Use Case: |
  The Chief Marketing Officer and Revenue Management team compare percentage discounts, free trials, recurring discounts, and loyalty rewards by acquisition conversion, checkout completion, renewal rate, net revenue, and customer lifetime value. They use the results to reduce dependence on low-margin incentives, expand promotion types that acquire durable customers, and target retention offers to segments with demonstrated incremental response.


Source Data: Promotion engine and offer catalog stitched with Digital Analytics (GA4 or equivalent), e-commerce order platform, CRM, subscription management, and Billing/Stripe


Dimension Name: Promotion Type

Description: |
  Classifies the commercial benefit or incentive mechanic presented to or redeemed by a customer during acquisition, engagement, checkout, subscription, billing, or retention interactions. It enables consistent comparison of customer conversion, revenue, recurring billing, retention, and lifetime value outcomes across promotion strategies.

Category: Conversion

Tags: [dimension]

Industry: E-commerce & SaaS

Priority: High

Core Area: Monetization

Scope: Event


Dimension Name: Pickup Location Type

Description: |
  Store handover point for a pickup order: in_store_counter, curbside or pickup_locker. One value, chosen at checkout; refines Fulfillment Method's pickup values, and curbside fulfillment always maps to curbside.

Category: Operations

Tags: [dimension, Retail: Omnichannel (BOPIS - Buy Online Pick Up In Store)]

Industry: Retail

Priority: Medium

Core Area: Checkout

Scope: Event

Data Type: string

Aggregation Window: Event, Daily, Weekly, Monthly


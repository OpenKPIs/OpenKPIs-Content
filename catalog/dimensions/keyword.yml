Dimension Name: Keyword

Description: |
  The search keyword attributed to the session's acquiring click, sourced from the Google Ads keyword resolved through the gclid auto-tag or, for manually tagged and non-Google engines, the utm_term parameter; it is the lowest-grain acquisition dimension below Campaign Name and Ad Group and is the join key for keyword-level spend, bid and conversion analysis. For organic search the value is overwhelmingly "(not provided)" because engines strip the query from the HTTPS referrer, so organic keyword performance must be read from Google Search Console query data and never inferred from this dimension, and sessions with no paid or tagged click resolve to "(not set)".

Category: Acquisition

Tags: [dimension, E-commerce: Top-of-Funnel & Marketing Acquisition]

Industry: E-commerce

Priority: High

Core Area: Discovery

Scope: Session

Data Type: string

Aggregation Window: Session, Daily, Weekly, Monthly


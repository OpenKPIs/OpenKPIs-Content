Dimension Name: Store ID

Description: |
  Store ID is the unique identifier of the physical store a shopper selected, checked inventory against, or used for pickup on an order, captured at event grain; order-grain value taken from the purchase event; carried on the unified select_item, view_item, add_shipping_info and purchase events. Unlike Store ZIP Code / Local Market, which bands stores into a market-level geography for trade-area analysis, Store ID is the store master key itself — far higher cardinality, one value per fulfilling location — and is the join that stitches online behaviour to offline fulfilment and powers store-level BOPIS Order Share and Pickup Completion Rate.

Category: Operations

Tags: [dimension, Retail: Omnichannel (BOPIS - Buy Online Pick Up In Store)]

Industry: Retail

Priority: High

Core Area: Checkout

Scope: Event

Data Type: string

Aggregation Window: Event, Session, Daily, Monthly


Google Analytics SQL: |
  -- ==========================================
  -- 1. GOOGLE BIGQUERY SQL
  -- ==========================================
  -- Store ID: distribution and usage of the fulfilling-store key across its carrier events
  -- (select_item with selection_context = 'store_selector' = store selection; view_item carrying
  -- store_inventory_status = store inventory check; other view_item = persisted-key product view;
  -- add_shipping_info, purchase). select_item from other item lists is not a store selection and is excluded.
  -- event_params are pivoted once per event with UNNEST + MAX(IF(...)) at the event grain.
  -- The value is the store key only: never split, parsed or concatenated. Store name, banner and
  -- district are resolved by joining the effective-dated store master reference on that key.
  
  -- Query A: store-level distribution, volume and share of the full carrier-event population
  WITH store_carrier_events AS (
    SELECT
      e.user_pseudo_id,
      PARSE_DATE('%Y%m%d', e.event_date) AS event_date,
      e.event_timestamp,
      e.event_name,
      MAX(IF(ep.key = 'ga_session_id', ep.value.int_value, NULL)) AS ga_session_id,
      -- trimmed, upper-cased, leading zeros preserved; no numeric cast
      NULLIF(UPPER(TRIM(MAX(IF(ep.key = 'store_id', ep.value.string_value, NULL)))), '') AS store_id,
      LOWER(MAX(IF(ep.key = 'fulfillment_method', ep.value.string_value, NULL))) AS fulfillment_method,
      LOWER(MAX(IF(ep.key = 'selection_context', ep.value.string_value, NULL))) AS selection_context,
      LOWER(MAX(IF(ep.key = 'store_inventory_status', ep.value.string_value, NULL))) AS store_inventory_status,
      COALESCE(
        NULLIF(MAX(e.ecommerce.transaction_id), '(not set)'),
        MAX(IF(ep.key = 'transaction_id', ep.value.string_value, NULL))
      ) AS transaction_id,
      MAX(e.ecommerce.purchase_revenue) AS purchase_revenue
    FROM `your-project.analytics_123456789.events_*` AS e,
      UNNEST(e.event_params) AS ep
    WHERE _TABLE_SUFFIX BETWEEN FORMAT_DATE('%Y%m%d', DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY))
                            AND FORMAT_DATE('%Y%m%d', DATE_SUB(CURRENT_DATE(), INTERVAL 1 DAY))
      AND e.event_name IN ('select_item', 'view_item', 'add_shipping_info', 'purchase')
    GROUP BY e.user_pseudo_id, e.event_date, e.event_timestamp, e.event_name, e.event_bundle_sequence_id
  ),
  -- Store attributes resolved as of each event's own date (effective-dated master, event grain)
  sessionized AS (
    SELECT
      s.*,
      CONCAT(s.user_pseudo_id, '.', CAST(s.ga_session_id AS STRING)) AS session_key,
      m.store_name,
      m.banner,
      m.district,
      m.store_format
    FROM store_carrier_events AS s
    LEFT JOIN `your-project.retail_reference.store_master` AS m
      ON m.store_key = s.store_id
     AND s.event_date BETWEEN m.effective_from AND COALESCE(m.effective_to, DATE '9999-12-31')
    -- only store-selector select_item events are store selections
    WHERE s.event_name != 'select_item' OR s.selection_context = 'store_selector'
  ),
  -- Full base population: every carrier event in the window, including ship-to-home and
  -- digital-only events that legitimately carry no store key. Every share divides by this base.
  population AS (
    SELECT
      COUNT(*) AS carrier_events,
      COUNT(DISTINCT session_key) AS sessions,
      COUNT(DISTINCT IF(event_name = 'purchase', transaction_id, NULL)) AS orders,
      SUM(IF(event_name = 'purchase', purchase_revenue, 0)) AS purchase_revenue
    FROM sessionized
  ),
  by_store AS (
    SELECT
      store_id AS store_key,
      store_name,
      banner,
      district,
      store_format,
      COUNT(*) AS carrier_events,
      -- store selections and inventory checks: distinct sessions per store (calculation note 3)
      COUNT(DISTINCT IF(event_name = 'select_item', session_key, NULL)) AS store_selections,
      COUNT(DISTINCT IF(event_name = 'view_item' AND store_inventory_status IS NOT NULL, session_key, NULL)) AS store_inventory_checks,
      COUNTIF(event_name = 'add_shipping_info') AS checkout_shipping_events,
      COUNTIF(event_name = 'purchase') AS purchase_events,
      COUNT(DISTINCT session_key) AS sessions,
      COUNT(DISTINCT user_pseudo_id) AS users,
      COUNT(DISTINCT IF(event_name = 'purchase', transaction_id, NULL)) AS orders,
      COUNT(DISTINCT IF(event_name = 'purchase'
                        AND fulfillment_method IN ('bopis', 'curbside', 'ship_to_store'),
                        transaction_id, NULL)) AS store_fulfilled_orders,
      ROUND(SUM(IF(event_name = 'purchase', purchase_revenue, 0)), 2) AS purchase_revenue,
      COUNT(DISTINCT IF(event_name = 'view_item' AND store_inventory_status = 'in_stock', session_key, NULL)) AS in_stock_inventory_checks,
      MIN(event_date) AS first_seen_date,
      MAX(event_date) AS last_seen_date
    FROM sessionized
    WHERE store_id IS NOT NULL
    GROUP BY store_key, store_name, banner, district, store_format
  )
  SELECT
    b.store_key,
    -- descriptive attributes come from the event-date master join, never from the key itself
    b.store_name,
    b.banner,
    b.district,
    b.store_format,
    b.carrier_events,
    b.store_selections,
    b.store_inventory_checks,
    b.checkout_shipping_events,
    b.purchase_events,
    b.sessions,
    b.users,
    b.orders,
    b.store_fulfilled_orders,
    b.purchase_revenue,
    b.in_stock_inventory_checks,
    b.first_seen_date,
    b.last_seen_date,
    ROUND(SAFE_DIVIDE(b.carrier_events, p.carrier_events) * 100, 2) AS pct_of_all_carrier_events,
    ROUND(SAFE_DIVIDE(b.sessions, p.sessions) * 100, 2) AS pct_of_all_sessions,
    ROUND(SAFE_DIVIDE(b.orders, p.orders) * 100, 2) AS pct_of_all_orders,
    ROUND(SAFE_DIVIDE(b.purchase_revenue, p.purchase_revenue) * 100, 2) AS pct_of_all_revenue,
    ROUND(SAFE_DIVIDE(b.in_stock_inventory_checks, b.store_inventory_checks) * 100, 2) AS in_stock_check_rate_pct
  FROM by_store AS b
  CROSS JOIN population AS p
  ORDER BY b.carrier_events DESC;
  
  -- Query B: dimension health - how much of the FULL carrier-event population carries the key
  WITH carrier_events AS (
    SELECT
      e.event_name,
      NULLIF(UPPER(TRIM(MAX(IF(ep.key = 'store_id', ep.value.string_value, NULL)))), '') AS store_id,
      LOWER(MAX(IF(ep.key = 'fulfillment_method', ep.value.string_value, NULL))) AS fulfillment_method,
      LOWER(MAX(IF(ep.key = 'selection_context', ep.value.string_value, NULL))) AS selection_context
    FROM `your-project.analytics_123456789.events_*` AS e,
      UNNEST(e.event_params) AS ep
    WHERE _TABLE_SUFFIX BETWEEN FORMAT_DATE('%Y%m%d', DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY))
                            AND FORMAT_DATE('%Y%m%d', DATE_SUB(CURRENT_DATE(), INTERVAL 1 DAY))
      AND e.event_name IN ('select_item', 'view_item', 'add_shipping_info', 'purchase')
    GROUP BY e.user_pseudo_id, e.event_date, e.event_timestamp, e.event_name, e.event_bundle_sequence_id
  )
  SELECT
    event_name,
    COUNT(*) AS events,                                        -- full base population for this event
    COUNTIF(store_id IS NOT NULL) AS events_with_store_key,
    ROUND(SAFE_DIVIDE(COUNTIF(store_id IS NOT NULL), COUNT(*)) * 100, 2) AS store_key_coverage_pct,
    COUNT(DISTINCT store_id) AS distinct_store_keys,
    -- compound values such as store+banner or store+region are a collection defect, not a value
    COUNTIF(store_id IS NOT NULL AND NOT REGEXP_CONTAINS(store_id, r'^[A-Z0-9]+$')) AS non_conforming_keys,
    COUNTIF(store_id IN ('0', 'NA', 'N/A', 'NONE', 'NULL', 'ONLINE')) AS filler_token_values,
    COUNTIF(store_id IS NULL AND fulfillment_method IN ('bopis', 'curbside', 'ship_to_store')) AS store_fulfilment_missing_key
  FROM carrier_events
  WHERE event_name != 'select_item' OR selection_context = 'store_selector'
  GROUP BY event_name
  ORDER BY events DESC;

AEP Query Service SQL: |
  -- ==========================================
  -- 2. ADOBE AEP QUERY SERVICE SQL
  -- ==========================================
  -- Store ID from the XDM ExperienceEvent dataset: placeContext.POIinteraction.POIDetail.poiID,
  -- with _experience.analytics.customDimensions.eVars.eVar27 as the Analytics fallback.
  -- Carrier events: web.webinteraction.linkClicks + web.webInteraction.name = 'Store Selection' (store
  -- selection), commerce.productViews (store inventory check only when _tenant.storeInventoryStatus is present;
  -- otherwise a persisted-key product view), commerce.checkouts + web.webInteraction.name
  -- = 'Add Shipping Info' (shipping step, matching GA4 add_shipping_info) and commerce.purchases.
  -- Fulfillment method: commerce.shipping.shippingMethod, eVar23 as the Analytics fallback.
  -- The value is the store key only: never split, parsed or concatenated. Store name, banner and
  -- district are resolved by joining the effective-dated store master lookup on that key.
  
  -- Query A: store-level distribution, volume and share of the full carrier-event population
  WITH carrier_events AS (
    SELECT
      endUserIDs._experience.ecid.id AS ecid,
      timestamp AS event_ts,
      eventType AS event_type,
      web.webInteraction.name AS interaction_name,
      NULLIF(UPPER(TRIM(COALESCE(
        placeContext.POIinteraction.POIDetail.poiID,
        _experience.analytics.customDimensions.eVars.eVar27
      ))), '') AS store_key,
      placeContext.POIinteraction.POIDetail.category AS poi_category,
      LOWER(_tenant.storeInventoryStatus) AS store_inventory_status,
      commerce.order.purchaseID AS purchase_id,
      commerce.order.priceTotal AS order_total,
      CASE
        WHEN eventType = 'web.webinteraction.linkClicks' AND web.webInteraction.name = 'Store Selection' THEN 'store_selection'
        WHEN eventType = 'commerce.productViews' AND _tenant.storeInventoryStatus IS NOT NULL THEN 'store_inventory_check'
        WHEN eventType = 'commerce.productViews' THEN 'product_view'
        WHEN eventType = 'commerce.checkouts' AND web.webInteraction.name = 'Add Shipping Info' THEN 'checkout_shipping'
        WHEN eventType = 'commerce.purchases' THEN 'purchase'
      END AS carrier_event,
      SESS_TIMEOUT(timestamp, 60 * 30) OVER (
        PARTITION BY endUserIDs._experience.ecid.id
        ORDER BY timestamp
        ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW
      ) AS session
    FROM aep_web_events_dataset
    WHERE timestamp >= date_sub(current_date(), 30)
      AND timestamp < current_date()
      AND eventType IN ('web.webinteraction.linkClicks', 'commerce.productViews', 'commerce.checkouts', 'commerce.purchases')
      AND endUserIDs._experience.ecid.id IS NOT NULL
  ),
  -- Store attributes resolved as of each event's own date (effective-dated master, event grain);
  -- non-carrier link clicks and non-shipping checkout steps are excluded from the base population
  labelled AS (
    SELECT
      c.ecid,
      c.event_ts,
      c.store_key,
      c.poi_category,
      c.store_inventory_status,
      c.purchase_id,
      c.order_total,
      c.carrier_event,
      CONCAT(c.ecid, '.', CAST(c.session.num AS STRING)) AS session_key,
      m.store_name,
      m.banner,
      m.district,
      m.store_format
    FROM carrier_events c
    LEFT JOIN store_master_lookup_dataset m
      ON m.store_key = c.store_key
     AND to_date(c.event_ts) >= m.effective_from
     AND to_date(c.event_ts) <= COALESCE(m.effective_to, date '9999-12-31')
    WHERE c.carrier_event IS NOT NULL
  ),
  -- Full base population: every carrier event in the window, including ship-to-home and
  -- digital-only events that legitimately carry no store key. Every share divides by this base.
  population AS (
    SELECT
      COUNT(*) AS carrier_events,
      COUNT(DISTINCT session_key) AS sessions,
      COUNT(DISTINCT CASE WHEN carrier_event = 'purchase' THEN purchase_id END) AS orders,
      SUM(CASE WHEN carrier_event = 'purchase' THEN order_total ELSE 0 END) AS order_revenue
    FROM labelled
  ),
  by_store AS (
    SELECT
      store_key,
      store_name,
      banner,
      district,
      store_format,
      COUNT(*) AS carrier_events,
      -- store selections and inventory checks: distinct sessions per store (calculation note 3)
      COUNT(DISTINCT CASE WHEN carrier_event = 'store_selection' THEN session_key END) AS store_selections,
      COUNT(DISTINCT CASE WHEN carrier_event = 'store_inventory_check' THEN session_key END) AS store_inventory_checks,
      SUM(CASE WHEN carrier_event = 'checkout_shipping' THEN 1 ELSE 0 END) AS checkout_shipping_events,
      SUM(CASE WHEN carrier_event = 'purchase' THEN 1 ELSE 0 END) AS purchase_events,
      COUNT(DISTINCT session_key) AS sessions,
      COUNT(DISTINCT ecid) AS visitors,
      COUNT(DISTINCT CASE WHEN carrier_event = 'purchase' THEN purchase_id END) AS orders,
      ROUND(SUM(CASE WHEN carrier_event = 'purchase' THEN order_total ELSE 0 END), 2) AS order_revenue,
      COUNT(DISTINCT CASE WHEN carrier_event = 'store_inventory_check' AND store_inventory_status = 'in_stock' THEN session_key END) AS in_stock_inventory_checks,
      MIN(to_date(event_ts)) AS first_seen_date,
      MAX(to_date(event_ts)) AS last_seen_date
    FROM labelled
    WHERE store_key IS NOT NULL
    GROUP BY store_key, store_name, banner, district, store_format
  )
  SELECT
    b.store_key,
    -- descriptive attributes come from the event-date master join, never from the key itself
    b.store_name,
    b.banner,
    b.district,
    b.store_format,
    b.carrier_events,
    b.store_selections,
    b.store_inventory_checks,
    b.checkout_shipping_events,
    b.purchase_events,
    b.sessions,
    b.visitors,
    b.orders,
    b.order_revenue,
    b.in_stock_inventory_checks,
    b.first_seen_date,
    b.last_seen_date,
    ROUND(CAST(b.carrier_events AS DOUBLE) / NULLIF(p.carrier_events, 0) * 100, 2) AS pct_of_all_carrier_events,
    ROUND(CAST(b.sessions AS DOUBLE) / NULLIF(p.sessions, 0) * 100, 2) AS pct_of_all_sessions,
    ROUND(CAST(b.orders AS DOUBLE) / NULLIF(p.orders, 0) * 100, 2) AS pct_of_all_orders,
    ROUND(b.order_revenue / NULLIF(p.order_revenue, 0) * 100, 2) AS pct_of_all_revenue,
    ROUND(CAST(b.in_stock_inventory_checks AS DOUBLE) / NULLIF(b.store_inventory_checks, 0) * 100, 2) AS in_stock_check_rate_pct
  FROM by_store b
  CROSS JOIN population p
  ORDER BY b.carrier_events DESC;
  
  -- Query B: dimension health - how much of the FULL carrier-event population carries the key
  WITH carrier_events AS (
    SELECT
      CASE
        WHEN eventType = 'web.webinteraction.linkClicks' AND web.webInteraction.name = 'Store Selection' THEN 'store_selection'
        WHEN eventType = 'commerce.productViews' AND _tenant.storeInventoryStatus IS NOT NULL THEN 'store_inventory_check'
        WHEN eventType = 'commerce.productViews' THEN 'product_view'
        WHEN eventType = 'commerce.checkouts' AND web.webInteraction.name = 'Add Shipping Info' THEN 'checkout_shipping'
        WHEN eventType = 'commerce.purchases' THEN 'purchase'
      END AS carrier_event,
      NULLIF(UPPER(TRIM(COALESCE(
        placeContext.POIinteraction.POIDetail.poiID,
        _experience.analytics.customDimensions.eVars.eVar27
      ))), '') AS store_key,
      LOWER(COALESCE(
        commerce.shipping.shippingMethod,
        _experience.analytics.customDimensions.eVars.eVar23
      )) AS fulfillment_method
    FROM aep_web_events_dataset
    WHERE timestamp >= date_sub(current_date(), 30)
      AND timestamp < current_date()
      AND eventType IN ('web.webinteraction.linkClicks', 'commerce.productViews', 'commerce.checkouts', 'commerce.purchases')
  )
  SELECT
    carrier_event,
    COUNT(*) AS events,                                        -- full base population for this carrier event
    SUM(CASE WHEN store_key IS NOT NULL THEN 1 ELSE 0 END) AS events_with_store_key,
    ROUND(CAST(SUM(CASE WHEN store_key IS NOT NULL THEN 1 ELSE 0 END) AS DOUBLE)
          / NULLIF(COUNT(*), 0) * 100, 2) AS store_key_coverage_pct,
    COUNT(DISTINCT store_key) AS distinct_store_keys,
    -- compound values such as store+banner or store+region are a collection defect, not a value
    SUM(CASE WHEN store_key IS NOT NULL AND store_key NOT RLIKE '^[A-Z0-9]+$' THEN 1 ELSE 0 END) AS non_conforming_keys,
    SUM(CASE WHEN store_key IN ('0', 'NA', 'N/A', 'NONE', 'NULL', 'ONLINE') THEN 1 ELSE 0 END) AS filler_token_values,
    SUM(CASE WHEN store_key IS NULL AND fulfillment_method IN ('bopis', 'curbside', 'ship_to_store') THEN 1 ELSE 0 END) AS store_fulfilment_missing_key
  FROM carrier_events
  WHERE carrier_event IS NOT NULL
  GROUP BY carrier_event
  ORDER BY events DESC;

Calculation Notes: |
  1️⃣ Populated the moment a shopper commits to a location — store selection on select_item, store inventory check on view_item — and stored as the shopper's preferred store on the logged-in profile and a first-party cookie, then sent on every subsequent carrier event (view_item, add_shipping_info, purchase) so the order inherits the store that will actually fulfil it. Event-grain reporting keeps every value observed; order-grain reporting uses the value present on the purchase event only.,2️⃣ The value carries the store key and nothing else. Concatenated fragments such as store+region, store+banner, store+district or store+channel are prohibited; banner, region, district, format and store name are joined from the store master file, never encoded into the identifier.,3️⃣ Multi-store sessions are expected in comparison shopping: a shopper may check inventory at three locations before choosing one. Store-level funnel metrics count each distinct Store ID once per session for store-selection and inventory-check measures (distinct sessions per store, not raw events); a store selection is a select_item with item_list_id / selection_context = 'store_selector', and an inventory check is a view_item carrying store_inventory_status, while conversion and revenue attach solely to the store on the purchase event to prevent double counting.,4️⃣ Closed, relocated and rebannered stores retain their original identifier permanently — keys are never recycled and never backfilled to the successor location. Reporting resolves store attributes against the store master as of each event's date (slowly changing dimension, effective-dated), joined at event grain before any aggregation, so historical periods continue to roll up under the banner and district in force at the time.,5️⃣ Ship-to-home and digital-only orders have no fulfilling store and must be recorded as null rather than a filler token such as 0, 'NA' or 'ONLINE'. These rows are excluded from store-level denominators; ship-to-store orders are in scope and carry the destination store, distinguished from pickup by Fulfillment Method.,6️⃣ Stored as a trimmed, upper-cased string with leading zeros preserved (e.g. '00427'). Numeric casting, locale formatting and store-name substitution are prohibited, as they silently collide distinct locations and break the join to the store master.,7️⃣ Persistence model: the preferred store persists across sessions and visits on the profile/cookie and is re-sent on every carrier event until the shopper selects a different store, which overwrites it immediately (including mid-checkout); in Adobe Analytics eVar27 is set to most-recent allocation with a 90-day expiration to match the cookie lifetime, and clearing the cookie or signing out on a new device leaves the value null until the next store selection. Post-order amendments — pickup transferred to another location or converted to ship-to-home — are reconciled on the T+1 order refresh, so same-day store reporting is provisional.

Business Use Case: |
  1️⃣ The Omnichannel Merchandising manager ranks stores by BOPIS Order Share and Pickup Completion Rate every Monday, and for any location falling two consecutive weeks below the chain median reallocates pickup-heavy SKUs and raises the local safety stock on the store's top ten online-demand items.,2️⃣ The Store Operations lead monitors elapsed time from order to pickup by Store ID; when a store breaches the two-hour ready-for-pickup promise on more than 5% of orders in a day, they trigger a staffing review and temporarily suspend that store from the 'ready in 2 hours' badge on the site.,3️⃣ The Marketing team activates local campaigns on the shopper's preferred Store ID — the most recently selected location, persisted on the profile/cookie across visits — targeting customers who checked store inventory but did not purchase with a pickup-offer message scoped to that store's in-stock assortment.,4️⃣ The Finance analyst allocates online-originated revenue to the fulfilling store's P&L using the Store ID on the purchase event, resolving the credit disputes between digital and store channels that arise at quarter close and feeding store-level omnichannel contribution reporting.


Dimension Name: Checkout Error Type

Description: |
  Checkout Error Type is the normalised category of a blocking validation or payment error shown to a shopper between begin checkout and order confirmation, such as payment_declined, address_invalid, out_of_stock or coupon_invalid, captured as the error_type parameter on the checkout_error event with the raw gateway or platform code kept separately in error_code. It explains why checkout attempts fail and routes each failure to the team that can remove it, which makes it the primary breakdown for Payment Failure Rate, Checkout Completion Rate and Checkout Conversion Rate.

Category: Conversion


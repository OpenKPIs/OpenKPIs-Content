Dimension Name: Pickup Window

Description: |
  The pickup time slot promised to, or selected by, the customer on a buy-online-pick-up-in-store order — expressed as a governed label such as "Within 2 hours", "Same day", "Next day" or "Scheduled slot" — captured on the unified add_shipping_info and purchase events. It is the customer-facing collection promise made at checkout and the primary breakdown for Pickup Completion Rate, not-collected volume and BOPIS-driven cancellation and refund analysis.

Category: Operations

Tags: [dimension, Retail: Omnichannel (BOPIS - Buy Online Pick Up In Store)]

Industry: Retail

Priority: High

Core Area: Checkout

Scope: Event

Data Type: string

Aggregation Window: Event, Session, Daily, Weekly, Monthly


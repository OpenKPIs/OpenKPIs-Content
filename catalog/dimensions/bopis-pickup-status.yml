Dimension Name: BOPIS Pickup Status

Description: |
  Current state of a BOPIS or curbside order at the pickup store: pending, ready_for_pickup, picked_up, expired or cancelled. One value per order, set by the order management system; separate from Order Status.

Category: Operations


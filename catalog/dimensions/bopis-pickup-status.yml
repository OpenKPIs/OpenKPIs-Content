    "commerce": {
      "order": {
        "purchaseID": "string - order transaction ID, read from the purchase event"
      }
    },
    "_tenant": {
      "orderFulfillment": {
        "fulfillmentMethod": "string - bopis | curbside | ship_to_store | ship_to_home, read from the purchase event",
        "bopisPickupStatus": "string - pending | ready_for_pickup | picked_up | expired | cancelled, set by the order management system; joined from the OMS order line status history at query time, not present on the purchase event"
      }

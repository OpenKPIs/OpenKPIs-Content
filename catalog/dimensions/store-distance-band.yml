Dimension Name: Store Distance Band

Description: |
  Buckets the distance between the shopper's location and the store they selected — or the nearest store returned to them — into four fixed trade-area ranges (under 2 miles, 2–5 miles, 5–10 miles, 10 or more miles), and carries that band on store locator searches, store selections and purchases. Shopper-to-store proximity is the strongest single predictor of BOPIS selection and pickup completion, which makes this the standard trade-area cut for omnichannel reporting; it is distinct from carrier leg distance between fulfillment nodes, which is a backend logistics measure and not a customer-facing trade-area attribute.

Category: Conversion

Tags: [dimension, Retail: Omnichannel (BOPIS - Buy Online Pick Up In Store)]

Industry: Retail

Priority: High

Core Area: Checkout

Scope: Event

Data Type: string

Aggregation Window: Event, Session, Daily, Weekly, Monthly


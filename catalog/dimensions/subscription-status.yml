Dimension Name: Subscription Status

Description: |
  Subscription Status is the current billing state of a customer's recurring product subscription contract (subscribe-and-save, scheduled replenishment or paid membership), normalised to one governed list (trialing, active, paused, past_due, cancelled, expired) and mapped from Stripe Billing, Shopify Subscription Contracts and Recharge. Finance, Customer Service and lifecycle marketing use it to size the live subscriber base, work payment recovery and pause-to-resume queues, and split churn into voluntary and involuntary, without mixing in plan catalog lifecycle, email or marketing consent, or the broader customer lifecycle held in Customer Status.

Category: Retention




























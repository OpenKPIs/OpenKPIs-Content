Dimension Name: Content Release Window

Description: |
  Classifies each customer-facing content interaction by the content title's availability stage at the time of the event, such as Pre-release, Premiere, New Release, Catalog, or Expiring Soon. It enables acquisition, engagement, conversion, retention, and lifetime-value analysis based on where content was in its release lifecycle when the customer encountered it.


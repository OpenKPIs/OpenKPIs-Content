Google Analytics SQL: |
  -- ==========================================
  -- 1. GOOGLE BIGQUERY SQL
  -- ==========================================
  WITH event_params_pivot AS (
    SELECT
      event_date,
      event_timestamp AS ga4_event_timestamp,
      user_pseudo_id,
      stream_id,
      platform AS ga4_platform,
      MAX(IF(ep.key = 'content_id', ep.value.string_value, NULL)) AS content_id,
      MAX(IF(ep.key = 'content_title', ep.value.string_value, NULL)) AS content_title,
      MAX(IF(ep.key = 'content_type', ep.value.string_value, NULL)) AS content_type,
      MAX(IF(ep.key = 'series_id', ep.value.string_value, NULL)) AS series_id,
      MAX(IF(ep.key = 'series_title', ep.value.string_value, NULL)) AS series_title,
      MAX(IF(ep.key = 'season_number', COALESCE(ep.value.int_value, SAFE_CAST(ep.value.string_value AS INT64)), NULL)) AS season_number,
      MAX(IF(ep.key = 'episode_number', COALESCE(ep.value.int_value, SAFE_CAST(ep.value.string_value AS INT64)), NULL)) AS episode_number,
      MAX(IF(ep.key = 'genre', ep.value.string_value, NULL)) AS genre,
      MAX(IF(ep.key = 'subgenre', ep.value.string_value, NULL)) AS subgenre,
      MAX(IF(ep.key = 'franchise', ep.value.string_value, NULL)) AS franchise,
      MAX(IF(ep.key = 'brand', ep.value.string_value, NULL)) AS brand,
      MAX(IF(ep.key = 'studio', ep.value.string_value, NULL)) AS studio,
      MAX(IF(ep.key = 'production_country', ep.value.string_value, NULL)) AS production_country,
      MAX(IF(ep.key = 'original_language', ep.value.string_value, NULL)) AS original_language,
      MAX(IF(ep.key = 'audience_rating', ep.value.string_value, NULL)) AS audience_rating,
      MAX(IF(ep.key = 'runtime_seconds', COALESCE(ep.value.int_value, SAFE_CAST(ep.value.string_value AS INT64)), NULL)) AS runtime_seconds,
      MAX(IF(ep.key = 'release_date', ep.value.string_value, NULL)) AS release_date_raw,
      MAX(IF(ep.key = 'availability_start_datetime', ep.value.string_value, NULL)) AS availability_start_raw,
      MAX(IF(ep.key = 'availability_end_datetime', ep.value.string_value, NULL)) AS availability_end_raw,
      MAX(IF(ep.key = 'premiere_type', ep.value.string_value, NULL)) AS premiere_type,
      MAX(IF(ep.key = 'rights_status', ep.value.string_value, NULL)) AS rights_status,
      MAX(IF(ep.key = 'rights_territory', ep.value.string_value, NULL)) AS rights_territory,
      MAX(IF(ep.key = 'rights_package', ep.value.string_value, NULL)) AS rights_package,
      MAX(IF(ep.key = 'distribution_channel', ep.value.string_value, NULL)) AS distribution_channel,
      MAX(IF(ep.key = 'platform', ep.value.string_value, NULL)) AS platform_raw,
      MAX(IF(ep.key = 'app_name', ep.value.string_value, NULL)) AS app_name,
      MAX(IF(ep.key = 'app_version', ep.value.string_value, NULL)) AS app_version,
      MAX(IF(ep.key = 'page_location', ep.value.string_value, NULL)) AS page_location,
      MAX(IF(ep.key = 'page_type', ep.value.string_value, NULL)) AS page_type,
      MAX(IF(ep.key = 'placement_id', ep.value.string_value, NULL)) AS placement_id,
      MAX(IF(ep.key = 'placement_name', ep.value.string_value, NULL)) AS placement_name,
      MAX(IF(ep.key = 'position', COALESCE(ep.value.int_value, SAFE_CAST(ep.value.string_value AS INT64)), NULL)) AS position,
      MAX(IF(ep.key = 'interaction_type', ep.value.string_value, NULL)) AS interaction_type,
      MAX(IF(ep.key = 'playback_state', ep.value.string_value, NULL)) AS playback_state,
      MAX(IF(ep.key = 'subscription_tier', ep.value.string_value, NULL)) AS subscription_tier,
      MAX(IF(ep.key = 'entitlement_status', ep.value.string_value, NULL)) AS entitlement_status,
      MAX(IF(ep.key = 'customer_status', ep.value.string_value, NULL)) AS customer_status
    FROM `your-project.analytics_123456789.events_*`
    CROSS JOIN UNNEST(event_params) AS ep
    WHERE _TABLE_SUFFIX BETWEEN FORMAT_DATE('%Y%m%d', DATE_SUB(CURRENT_DATE(), INTERVAL 90 DAY))
                            AND FORMAT_DATE('%Y%m%d', CURRENT_DATE())
      AND event_name = 'select_content'
    GROUP BY event_date, ga4_event_timestamp, user_pseudo_id, stream_id, ga4_platform
  ),
  typed AS (
    SELECT
      *,
      SAFE_CAST(release_date_raw AS DATE) AS release_date,
      SAFE_CAST(availability_start_raw AS TIMESTAMP) AS availability_start_datetime,
      SAFE_CAST(availability_end_raw AS TIMESTAMP) AS availability_end_datetime,
      TIMESTAMP_MICROS(ga4_event_timestamp) AS event_timestamp,
      COALESCE(
        SAFE_CAST(availability_start_raw AS TIMESTAMP),
        TIMESTAMP(SAFE_CAST(release_date_raw AS DATE))
      ) AS premiere_datetime
    FROM event_params_pivot
  ),
  metrics AS (
    SELECT
      *,
      DATE_DIFF(DATE(event_timestamp), DATE(premiere_datetime), DAY) AS days_since_premiere,
      DATE_DIFF(DATE(availability_end_datetime), DATE(event_timestamp), DAY) AS days_until_expiration
    FROM typed
  ),
  classified AS (
    SELECT
      *,
      CASE
        WHEN premiere_datetime IS NULL THEN 'Unknown'
        WHEN availability_end_datetime IS NOT NULL AND event_timestamp > availability_end_datetime THEN 'Unavailable'
        WHEN event_timestamp < premiere_datetime THEN 'Pre-Release'
        WHEN DATE(event_timestamp) = DATE(premiere_datetime) THEN 'Premiere'
        WHEN availability_end_datetime IS NOT NULL
          AND DATE_DIFF(DATE(availability_end_datetime), DATE(event_timestamp), DAY) BETWEEN 0 AND 30 THEN 'Expiring Soon'
        WHEN DATE_DIFF(DATE(event_timestamp), DATE(premiere_datetime), DAY) BETWEEN 1 AND 30 THEN 'New Release'
        ELSE 'Catalog'
      END AS content_release_window
    FROM metrics
  ),
  windowed AS (
    SELECT
      *,
      CASE content_release_window
        WHEN 'Pre-Release' THEN CAST(NULL AS TIMESTAMP)
        WHEN 'Premiere' THEN TIMESTAMP(DATE(premiere_datetime))
        WHEN 'New Release' THEN TIMESTAMP(DATE_ADD(DATE(premiere_datetime), INTERVAL 1 DAY))
        WHEN 'Catalog' THEN TIMESTAMP(DATE_ADD(DATE(premiere_datetime), INTERVAL 31 DAY))
        WHEN 'Expiring Soon' THEN TIMESTAMP(DATE_SUB(DATE(availability_end_datetime), INTERVAL 30 DAY))
        WHEN 'Unavailable' THEN TIMESTAMP_ADD(availability_end_datetime, INTERVAL 1 MICROSECOND)
        ELSE CAST(NULL AS TIMESTAMP)
      END AS release_window_start_datetime,
      CASE content_release_window
        WHEN 'Pre-Release' THEN TIMESTAMP_SUB(premiere_datetime, INTERVAL 1 MICROSECOND)
        WHEN 'Premiere' THEN TIMESTAMP_SUB(TIMESTAMP(DATE_ADD(DATE(premiere_datetime), INTERVAL 1 DAY)), INTERVAL 1 MICROSECOND)
        WHEN 'New Release' THEN
          CASE
            WHEN availability_end_datetime IS NULL THEN TIMESTAMP_SUB(TIMESTAMP(DATE_ADD(DATE(premiere_datetime), INTERVAL 31 DAY)), INTERVAL 1 MICROSECOND)
            ELSE LEAST(availability_end_datetime, TIMESTAMP_SUB(TIMESTAMP(DATE_ADD(DATE(premiere_datetime), INTERVAL 31 DAY)), INTERVAL 1 MICROSECOND))
          END
        WHEN 'Catalog' THEN
          CASE
            WHEN availability_end_datetime IS NULL THEN CAST(NULL AS TIMESTAMP)
            ELSE TIMESTAMP_SUB(TIMESTAMP(DATE_SUB(DATE(availability_end_datetime), INTERVAL 30 DAY)), INTERVAL 1 MICROSECOND)
          END
        WHEN 'Expiring Soon' THEN availability_end_datetime
        ELSE CAST(NULL AS TIMESTAMP)
      END AS release_window_end_datetime
    FROM classified
  )
  SELECT
    content_id,
    content_title,
    content_type,
    series_id,
    series_title,
    season_number,
    episode_number,
    genre,
    subgenre,
    franchise,
    brand,
    studio,
    production_country,
    original_language,
    audience_rating,
    runtime_seconds,
    release_date,
    availability_start_datetime,
    availability_end_datetime,
    content_release_window,
    LOWER(REPLACE(content_release_window, '-', '_')) AS content_release_window_code,
    release_window_start_datetime,
    release_window_end_datetime,
    days_since_premiere,
    days_until_expiration,
    content_release_window = 'Pre-Release' AS is_pre_release,
    content_release_window = 'Premiere' AS is_premiere,
    content_release_window = 'New Release' AS is_new_release,
    content_release_window = 'Catalog' AS is_catalog,
    content_release_window = 'Expiring Soon' AS is_expiring_soon,
    premiere_type,
    rights_status,
    rights_territory,
    rights_package,
    distribution_channel,
    COALESCE(NULLIF(platform_raw, ''), LOWER(ga4_platform)) AS platform,
    app_name,
    app_version,
    page_location,
    page_type,
    placement_id,
    placement_name,
    position,
    interaction_type,
    playback_state,
    subscription_tier,
    entitlement_status,
    customer_status,
    event_timestamp
  FROM windowed;

AEP Query Service SQL: |
  -- ==========================================
  -- 2. ADOBE AEP QUERY SERVICE SQL
  -- ==========================================
  WITH base AS (
    SELECT
      NULLIF(TRIM(_contentLifecycle.content.contentId), '') AS content_id,
      NULLIF(TRIM(_contentLifecycle.content.contentTitle), '') AS content_title,
      NULLIF(TRIM(_contentLifecycle.content.contentType), '') AS content_type,
      NULLIF(TRIM(_contentLifecycle.content.seriesId), '') AS series_id,
      NULLIF(TRIM(_contentLifecycle.content.seriesTitle), '') AS series_title,
      CAST(_contentLifecycle.content.seasonNumber AS BIGINT) AS season_number,
      CAST(_contentLifecycle.content.episodeNumber AS BIGINT) AS episode_number,
      NULLIF(TRIM(_contentLifecycle.content.genre), '') AS genre,
      NULLIF(TRIM(_contentLifecycle.content.subgenre), '') AS subgenre,
      NULLIF(TRIM(_contentLifecycle.content.franchise), '') AS franchise,
      NULLIF(TRIM(_contentLifecycle.content.brand), '') AS brand,
      NULLIF(TRIM(_contentLifecycle.content.studio), '') AS studio,
      NULLIF(TRIM(_contentLifecycle.content.productionCountry), '') AS production_country,
      NULLIF(TRIM(_contentLifecycle.content.originalLanguage), '') AS original_language,
      NULLIF(TRIM(_contentLifecycle.content.audienceRating), '') AS audience_rating,
      CAST(_contentLifecycle.content.runtimeSeconds AS BIGINT) AS runtime_seconds,
      CAST(_contentLifecycle.content.releaseDate AS DATE) AS release_date,
      CAST(_contentLifecycle.content.availabilityStartDateTime AS TIMESTAMP) AS availability_start_datetime,
      CAST(_contentLifecycle.content.availabilityEndDateTime AS TIMESTAMP) AS availability_end_datetime,
      NULLIF(TRIM(_contentLifecycle.content.premiereType), '') AS premiere_type,
      NULLIF(TRIM(_contentLifecycle.content.rightsStatus), '') AS rights_status,
      NULLIF(TRIM(_contentLifecycle.content.rightsTerritory), '') AS rights_territory,
      NULLIF(TRIM(_contentLifecycle.content.rightsPackage), '') AS rights_package,
      NULLIF(TRIM(_contentLifecycle.content.distributionChannel), '') AS distribution_channel,
      NULLIF(TRIM(_contentLifecycle.content.platform), '') AS platform,
      NULLIF(TRIM(_contentLifecycle.content.appName), '') AS app_name,
      NULLIF(TRIM(_contentLifecycle.content.appVersion), '') AS app_version,
      NULLIF(TRIM(_contentLifecycle.content.pageLocation), '') AS page_location,
      NULLIF(TRIM(_contentLifecycle.content.pageType), '') AS page_type,
      NULLIF(TRIM(_contentLifecycle.content.placementId), '') AS placement_id,
      NULLIF(TRIM(_contentLifecycle.content.placementName), '') AS placement_name,
      CAST(_contentLifecycle.content.position AS BIGINT) AS position,
      NULLIF(TRIM(_contentLifecycle.content.interactionType), '') AS interaction_type,
      NULLIF(TRIM(_contentLifecycle.content.playbackState), '') AS playback_state,
      NULLIF(TRIM(_contentLifecycle.content.subscriptionTier), '') AS subscription_tier,
      NULLIF(TRIM(_contentLifecycle.content.entitlementStatus), '') AS entitlement_status,
      NULLIF(TRIM(_contentLifecycle.content.customerStatus), '') AS customer_status,
      CAST(timestamp AS TIMESTAMP) AS event_timestamp,
      COALESCE(
        CAST(_contentLifecycle.content.availabilityStartDateTime AS TIMESTAMP),
        CAST(CAST(_contentLifecycle.content.releaseDate AS DATE) AS TIMESTAMP)
      ) AS premiere_datetime
    FROM aep_content_lifecycle_events
    WHERE eventType = 'web.webinteraction.linkClicks'
      AND web.webInteraction.name = 'select_content'
      AND timestamp >= CURRENT_TIMESTAMP - INTERVAL '90' DAY
  ),
  metrics AS (
    SELECT
      *,
      DATEDIFF('day', CAST(premiere_datetime AS DATE), CAST(event_timestamp AS DATE)) AS days_since_premiere,
      DATEDIFF('day', CAST(event_timestamp AS DATE), CAST(availability_end_datetime AS DATE)) AS days_until_expiration
    FROM base
  ),
  classified AS (
    SELECT
      *,
      CASE
        WHEN premiere_datetime IS NULL THEN 'Unknown'
        WHEN availability_end_datetime IS NOT NULL AND event_timestamp > availability_end_datetime THEN 'Unavailable'
        WHEN event_timestamp < premiere_datetime THEN 'Pre-Release'
        WHEN CAST(event_timestamp AS DATE) = CAST(premiere_datetime AS DATE) THEN 'Premiere'
        WHEN availability_end_datetime IS NOT NULL
          AND DATEDIFF('day', CAST(event_timestamp AS DATE), CAST(availability_end_datetime AS DATE)) BETWEEN 0 AND 30 THEN 'Expiring Soon'
        WHEN DATEDIFF('day', CAST(premiere_datetime AS DATE), CAST(event_timestamp AS DATE)) BETWEEN 1 AND 30 THEN 'New Release'
        ELSE 'Catalog'
      END AS content_release_window
    FROM metrics
  ),
  windowed AS (
    SELECT
      *,
      CASE content_release_window
        WHEN 'Pre-Release' THEN CAST(NULL AS TIMESTAMP)
        WHEN 'Premiere' THEN CAST(CAST(premiere_datetime AS DATE) AS TIMESTAMP)
        WHEN 'New Release' THEN CAST(CAST(premiere_datetime AS DATE) AS TIMESTAMP) + INTERVAL '1' DAY
        WHEN 'Catalog' THEN CAST(CAST(premiere_datetime AS DATE) AS TIMESTAMP) + INTERVAL '31' DAY
        WHEN 'Expiring Soon' THEN CAST(CAST(availability_end_datetime AS DATE) AS TIMESTAMP) - INTERVAL '30' DAY
        WHEN 'Unavailable' THEN availability_end_datetime + INTERVAL '1' SECOND
        ELSE CAST(NULL AS TIMESTAMP)
      END AS release_window_start_datetime,
      CASE content_release_window
        WHEN 'Pre-Release' THEN premiere_datetime - INTERVAL '1' SECOND
        WHEN 'Premiere' THEN CAST(CAST(premiere_datetime AS DATE) AS TIMESTAMP) + INTERVAL '1' DAY - INTERVAL '1' SECOND
        WHEN 'New Release' THEN
          CASE
            WHEN availability_end_datetime IS NULL THEN CAST(CAST(premiere_datetime AS DATE) AS TIMESTAMP) + INTERVAL '31' DAY - INTERVAL '1' SECOND
            WHEN availability_end_datetime < CAST(CAST(premiere_datetime AS DATE) AS TIMESTAMP) + INTERVAL '31' DAY - INTERVAL '1' SECOND THEN availability_end_datetime
            ELSE CAST(CAST(premiere_datetime AS DATE) AS TIMESTAMP) + INTERVAL '31' DAY - INTERVAL '1' SECOND
          END
        WHEN 'Catalog' THEN
          CASE
            WHEN availability_end_datetime IS NULL THEN CAST(NULL AS TIMESTAMP)
            ELSE CAST(CAST(availability_end_datetime AS DATE) AS TIMESTAMP) - INTERVAL '30' DAY - INTERVAL '1' SECOND
          END
        WHEN 'Expiring Soon' THEN availability_end_datetime
        ELSE CAST(NULL AS TIMESTAMP)
      END AS release_window_end_datetime
    FROM classified
  )
  SELECT
    content_id,
    content_title,
    content_type,
    series_id,
    series_title,
    season_number,
    episode_number,
    genre,
    subgenre,
    franchise,
    brand,
    studio,
    production_country,
    original_language,
    audience_rating,
    runtime_seconds,
    release_date,
    availability_start_datetime,
    availability_end_datetime,
    content_release_window,
    LOWER(REPLACE(content_release_window, '-', '_')) AS content_release_window_code,
    release_window_start_datetime,
    release_window_end_datetime,
    days_since_premiere,
    days_until_expiration,
    CASE WHEN content_release_window = 'Pre-Release' THEN TRUE ELSE FALSE END AS is_pre_release,
    CASE WHEN content_release_window = 'Premiere' THEN TRUE ELSE FALSE END AS is_premiere,
    CASE WHEN content_release_window = 'New Release' THEN TRUE ELSE FALSE END AS is_new_release,
    CASE WHEN content_release_window = 'Catalog' THEN TRUE ELSE FALSE END AS is_catalog,
    CASE WHEN content_release_window = 'Expiring Soon' THEN TRUE ELSE FALSE END AS is_expiring_soon,
    premiere_type,
    rights_status,
    rights_territory,
    rights_package,
    distribution_channel,
    platform,
    app_name,
    app_version,
    page_location,
    page_type,
    placement_id,
    placement_name,
    position,
    interaction_type,
    playback_state,
    subscription_tier,
    entitlement_status,
    customer_status,
    event_timestamp
  FROM windowed;

Calculation Notes: |
  1️⃣ Classify value using customer event timestamp and effective-dated availability record.  
  2️⃣ Apply precedence: Expiring Soon, Early Access, Pre-release, Premiere, New Release, Recent Release, Catalog, Out of Window, Unknown.  
  3️⃣ Expiring Soon: last 7 days of valid availability period.  
  4️⃣ Premiere: first 24 hours after general availability.  
  5️⃣ New Release: from end of Premiere to day 30; Recent Release: days 31 to 90; Catalog: after day 90.  
  6️⃣ Flag Pre-release or Out of Window playback-start events for entitlement or timestamp validation.  
  7️⃣ Recalculate dimension for every event; sessions may have multiple release-window values across boundaries.

Business Use Case: |
  The Content Strategy and Product teams compare title-detail views, trial starts, playback starts, completion, upgrades, churn, and retained viewing across Premiere, New Release, and Catalog windows. If premiere content generates high acquisition but weak post-trial retention, executives can shift merchandising and lifecycle messaging toward related catalog titles before the acquired cohort reaches renewal.


Source Data: Content Management System and rights-availability service stitched with Digital Analytics event streams, application playback telemetry, CRM subscription profiles, and Billing platform entitlement data.

Report Attributes: |
  ["Content Title","Content Type","Content Genre","Content Franchise","Market","Platform","Entitlement Tier","Subscription Plan","Acquisition Channel","Customer Lifecycle Stage","Event Date","Release Cohort"]


Dimension Name: Payment Method

Description: |
  Payment Method is the normalized payment option a customer selects at checkout and settles an order with, captured as the GA4 payment_type parameter on add_payment_info and purchase (for example credit_card, paypal, apple_pay, klarna, gift_card). It lets teams compare checkout conversion, order share, revenue, refunds and chargebacks by how customers pay, without ever exposing card numbers, tokens or other payment credentials.


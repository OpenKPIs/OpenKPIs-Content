Dimension Name: Payment Method

Description: |
  Payment Method identifies the normalized payment option selected or used by a customer for a checkout, subscription invoice, renewal, or other billable journey event. It supports analysis of conversion, payment preference, billing success, retention, and lifetime value without exposing account numbers, payment tokens, or other payment credentials.

Category: Conversion

Tags: [dimension]

Industry: E-commerce & SaaS

Priority: High

Core Area: Checkout

Scope: Event

Data Type: string

Aggregation Window: Event

GA4 Event: |
  add_payment_info

Adobe Event: |
  add_payment_info


Google Analytics SQL: |
  -- ==========================================
  -- 1. GOOGLE BIGQUERY SQL
  -- ==========================================
  -- Payment Method (GA4 payment_type): checkout sessions, transactions and revenue by method, last 30 complete days
  WITH ev AS (
    SELECT
      user_pseudo_id,
      event_name,
      event_timestamp,
      (SELECT MAX(IF(key = 'ga_session_id', value.int_value, NULL)) FROM UNNEST(event_params)) AS ga_session_id,
      (SELECT MAX(IF(key = 'payment_type', value.string_value, NULL)) FROM UNNEST(event_params)) AS payment_type_raw,
      ecommerce.transaction_id,
      ecommerce.purchase_revenue_in_usd AS revenue_usd
    FROM `your-project.analytics_123456789.events_*`
    WHERE _TABLE_SUFFIX BETWEEN FORMAT_DATE('%Y%m%d', DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY))
                            AND FORMAT_DATE('%Y%m%d', DATE_SUB(CURRENT_DATE(), INTERVAL 1 DAY))
      AND event_name IN ('add_payment_info', 'purchase')
  ),
  last_selection AS (
    -- customers may switch methods during checkout; the last selection in the session wins
    SELECT
      user_pseudo_id,
      ga_session_id,
      ARRAY_AGG(LOWER(TRIM(payment_type_raw)) ORDER BY event_timestamp DESC LIMIT 1)[OFFSET(0)] AS selected_method
    FROM ev
    WHERE event_name = 'add_payment_info' AND payment_type_raw IS NOT NULL
    GROUP BY user_pseudo_id, ga_session_id
  ),
  orders AS (
    -- one row per transaction; the settled method sent on purchase overrides the checkout selection
    SELECT
      user_pseudo_id,
      ga_session_id,
      transaction_id,
      LOWER(TRIM(payment_type_raw)) AS settled_method,
      revenue_usd
    FROM ev
    WHERE event_name = 'purchase' AND transaction_id IS NOT NULL AND transaction_id != '(not set)'
    QUALIFY ROW_NUMBER() OVER (PARTITION BY transaction_id ORDER BY event_timestamp) = 1
  ),
  sessions AS (
    SELECT
      CONCAT(COALESCE(s.user_pseudo_id, o.user_pseudo_id), '.', CAST(COALESCE(s.ga_session_id, o.ga_session_id) AS STRING)) AS session_key,
      s.selected_method IS NOT NULL AS had_payment_info,
      COALESCE(o.settled_method, s.selected_method, '(not set)') AS payment_method,
      o.transaction_id,
      o.revenue_usd
    FROM last_selection s
    FULL OUTER JOIN orders o
      ON o.user_pseudo_id = s.user_pseudo_id AND o.ga_session_id = s.ga_session_id
  )
  SELECT
    payment_method,
    COUNT(DISTINCT IF(had_payment_info, session_key, NULL)) AS sessions_with_payment_info,
    COUNT(DISTINCT transaction_id) AS transactions,
    ROUND(SUM(revenue_usd), 2) AS purchase_revenue_usd,
    ROUND(SAFE_DIVIDE(
      COUNT(DISTINCT IF(had_payment_info AND transaction_id IS NOT NULL, session_key, NULL)),
      COUNT(DISTINCT IF(had_payment_info, session_key, NULL))), 4) AS payment_to_purchase_rate,
    ROUND(SAFE_DIVIDE(COUNT(DISTINCT transaction_id), SUM(COUNT(DISTINCT transaction_id)) OVER ()), 4) AS transaction_share
  FROM sessions
  GROUP BY payment_method
  ORDER BY transactions DESC;

AEP Query Service SQL: |
  -- ==========================================
  -- 2. ADOBE AEP QUERY SERVICE SQL
  -- ==========================================
  -- Payment Method from XDM commerce.order.payments (Web SDK / Analytics source dataset), last 30 complete days
  WITH tenders AS (
    SELECT
      _id AS event_id,
      timestamp,
      eventType,
      commerce.order.purchaseID AS purchase_id,
      commerce.order.priceTotal AS order_total,
      posexplode(commerce.order.payments) AS (tender_seq, pmt)
    FROM web_experience_events
    WHERE timestamp >= date_sub(current_date, 30)
      AND timestamp < current_date
      AND eventType IN ('commerce.checkouts', 'commerce.purchases')
      AND commerce.order.payments IS NOT NULL
  ),
  primary_tender AS (
    -- split tender: the largest settled amount is primary, ties broken by tender sequence
    SELECT event_id, eventType, purchase_id, order_total, lower(trim(pmt.paymentType)) AS payment_method
    FROM (
      SELECT t.*, ROW_NUMBER() OVER (PARTITION BY event_id ORDER BY pmt.paymentAmount DESC NULLS LAST, tender_seq ASC) AS rn
      FROM tenders t
    ) r
    WHERE rn = 1
  ),
  orders AS (
    SELECT purchase_id, payment_method, order_total
    FROM (
      SELECT p.*, ROW_NUMBER() OVER (PARTITION BY purchase_id ORDER BY event_id) AS dup
      FROM primary_tender p
      WHERE eventType = 'commerce.purchases' AND purchase_id IS NOT NULL
    ) d
    WHERE dup = 1
  ),
  selections AS (
    SELECT payment_method, COUNT(DISTINCT event_id) AS payment_selection_events
    FROM primary_tender
    WHERE eventType = 'commerce.checkouts'
    GROUP BY payment_method
  ),
  order_totals AS (
    SELECT payment_method, COUNT(*) AS orders, ROUND(SUM(order_total), 2) AS order_revenue
    FROM orders
    GROUP BY payment_method
  )
  SELECT
    COALESCE(s.payment_method, o.payment_method) AS payment_method,
    COALESCE(s.payment_selection_events, 0) AS payment_selection_events,
    COALESCE(o.orders, 0) AS orders,
    COALESCE(o.order_revenue, 0) AS order_revenue,
    ROUND(COALESCE(o.orders, 0) / NULLIF(SUM(COALESCE(o.orders, 0)) OVER (), 0), 4) AS order_share
  FROM selections s
  FULL OUTER JOIN order_totals o ON s.payment_method = o.payment_method
  ORDER BY orders DESC;

Calculation Notes: |
  1️⃣ Capture the GA4 recommended parameter payment_type on add_payment_info and repeat it on purchase; normalize to a controlled lowercase list (credit_card, debit_card, paypal, apple_pay, google_pay, shop_pay, klarna, afterpay, affirm, gift_card, store_credit, bank_transfer, cash_on_delivery), map unknown values to other and missing values to (not set).  
  2️⃣ Keep every selection at event level when a customer switches methods during checkout; session- and order-level reporting use the last add_payment_info selection before purchase.  
  3️⃣ A completed transaction carries the successfully settled method (purchase payment_type, or the payment processor record joined on transaction_id), which overrides the last checkout selection.  
  4️⃣ Split tender: the method with the largest settled amount is the primary value, ties resolved by tender sequence; the full tender list stays in the order's payments array.  
  5️⃣ Failed or declined attempts keep the attempted method; refunds and chargebacks inherit the original settled method of the transaction; recurring off-session charges use the method presented to the processor, not the customer's current default.  
  6️⃣ Store only the method type: never collect card numbers, tokens, BIN, expiry dates or wallet account identifiers (card brand belongs in its own dimension).  
  7️⃣ Exclude test, sandbox, internal QA and processor replay transactions and bot-flagged traffic from production reporting.

Business Use Case: |
  1️⃣ The E-commerce Product team reviews payment-to-purchase rate by payment method and device every week; when a wallet such as apple_pay converts materially better on mobile but is unavailable or hidden in a priority market, they prioritize enabling or surfacing it and track conversion after launch.  
  2️⃣ Finance compares order share and revenue by settled method against processor fee rates each month; when high-fee methods gain share without a conversion benefit, they renegotiate processor pricing or change the default method order at checkout.  
  3️⃣ The Finance risk team monitors refund and chargeback rates by settled method; when one method exceeds card-scheme chargeback thresholds, they tighten 3-D Secure or manual-review rules for that method only.  
  4️⃣ Merchandising reviews buy-now-pay-later usage (klarna, afterpay, affirm) by order value band each quarter; when installment payments lift average order value in higher bands, they add installment messaging to product pages in those price ranges.


Calculation Notes: |
  Record the value known at the timestamp of each payment_method_selected, payment_attempted, purchase_completed, refund, chargeback, or subscription invoice event. If the customer changes methods during checkout, retain each selection on its event and assign the successfully settled method to the completed transaction; for split tender, assign the method with the largest settled amount as primary and resolve equal amounts by tender sequence. Failed attempts retain the attempted method, refunds inherit the original settled method, and recurring off-session charges use the method actually presented to the processor rather than the customer's current default method. Exclude test, sandbox, employee quality-assurance, and processor replay events from production reporting.

Business Use Case: |
  The Product and Finance teams compare checkout completion and recurring billing success by payment method, device, market, and customer tenure. If mobile customers in a priority market convert materially better with a wallet that has low availability, leadership can prioritize enabling that wallet and then monitor conversion, renewal success, and customer lifetime value after launch.


Source Data: Billing and payment processors such as Stripe, Adyen, PayPal, or Braintree stitched with Digital Analytics (GA4 or Adobe Analytics), subscription billing, and the e-commerce order platform


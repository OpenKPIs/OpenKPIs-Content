Google Analytics SQL: |
  -- ==========================================
  -- 1. GOOGLE BIGQUERY SQL
  -- ==========================================
  WITH channel AS (
    SELECT
      user_pseudo_id,
      event_timestamp,
      LOWER(COALESCE(traffic_source.source, '(direct)')) AS source,
      LOWER(COALESCE(traffic_source.medium, '(none)')) AS medium,
      CASE
        WHEN COALESCE(traffic_source.source, '(direct)') = '(direct)' AND COALESCE(traffic_source.medium, '(none)') IN ('(none)', '(not set)') THEN 'Direct'
        WHEN LOWER(traffic_source.medium) = 'organic' THEN 'Organic Search'
        WHEN LOWER(traffic_source.medium) IN ('cpc', 'ppc', 'paidsearch') THEN 'Paid Search'
        WHEN LOWER(traffic_source.medium) IN ('paidsocial', 'paid_social', 'paid-social') THEN 'Paid Social'
        WHEN LOWER(traffic_source.medium) IN ('social', 'social-network', 'social-media', 'sm') THEN 'Organic Social'
        WHEN LOWER(traffic_source.medium) IN ('display', 'cpm', 'banner') THEN 'Display'
        WHEN LOWER(traffic_source.medium) = 'affiliate' THEN 'Affiliate'
        WHEN LOWER(traffic_source.medium) IN ('email', 'e-mail', 'e_mail') THEN 'Email'
        WHEN LOWER(traffic_source.medium) = 'sms' THEN 'SMS'
        WHEN LOWER(traffic_source.medium) = 'referral' THEN 'Referral'
        ELSE 'Unassigned'
      END AS channel_grouping
    FROM `your-project.analytics_123456789.events_*`
    WHERE event_name = 'session_start'
      AND _TABLE_SUFFIX BETWEEN FORMAT_DATE('%Y%m%d', DATE_SUB(@report_start, INTERVAL 90 DAY)) AND FORMAT_DATE('%Y%m%d', @report_end)
  ),
  first_touch AS (
    SELECT
      user_pseudo_id,
      ARRAY_AGG(STRUCT(channel_grouping, source, medium) ORDER BY event_timestamp ASC LIMIT 1)[OFFSET(0)] AS ft
    FROM channel
    GROUP BY user_pseudo_id
  )
  SELECT
    user_pseudo_id,
    ft.channel_grouping AS first_touch_channel_grouping,
    ft.source AS first_touch_source,
    ft.medium AS first_touch_medium
  FROM first_touch;

AEP Query Service SQL: |
  -- ==========================================
  -- 2. ADOBE AEP QUERY SERVICE SQL
  -- ==========================================
  WITH channel AS (
    SELECT
      endUserIDs._experience.mcid.id AS user_id,
      timestamp,
      LOWER(COALESCE(marketing.trackingCode, 'direct')) AS tracking_code,
      CASE
        WHEN marketing.trackingCode IS NULL AND web.webReferrer.URL IS NULL THEN 'Direct'
        WHEN LOWER(marketing.trackingCode) LIKE '%organic%' THEN 'Organic Search'
        WHEN LOWER(marketing.trackingCode) LIKE '%cpc%' OR LOWER(marketing.trackingCode) LIKE '%paidsearch%' THEN 'Paid Search'
        WHEN LOWER(marketing.trackingCode) LIKE '%paidsocial%' THEN 'Paid Social'
        WHEN LOWER(marketing.trackingCode) LIKE '%social%' THEN 'Organic Social'
        WHEN LOWER(marketing.trackingCode) LIKE '%display%' THEN 'Display'
        WHEN LOWER(marketing.trackingCode) LIKE '%affiliate%' THEN 'Affiliate'
        WHEN LOWER(marketing.trackingCode) LIKE '%email%' THEN 'Email'
        WHEN LOWER(marketing.trackingCode) LIKE '%sms%' THEN 'SMS'
        WHEN web.webReferrer.URL IS NOT NULL THEN 'Referral'
        ELSE 'Unassigned'
      END AS channel_grouping
    FROM web_experience_events
    WHERE eventType = 'web.webpagedetails.pageViews'
      AND timestamp >= DATE_SUB(CAST(@report_start AS DATE), INTERVAL 90 DAY)
      AND timestamp < DATE_ADD(CAST(@report_end AS DATE), INTERVAL 1 DAY)
  ),
  ranked AS (
    SELECT
      user_id,
      channel_grouping,
      tracking_code,
      ROW_NUMBER() OVER (PARTITION BY user_id ORDER BY timestamp ASC) AS rn
    FROM channel
  )
  SELECT
    user_id,
    channel_grouping AS first_touch_channel_grouping,
    tracking_code AS first_touch_tracking_code
  FROM ranked
  WHERE rn = 1;

Calculation Notes: |
  1️⃣ Derived once per user from the first session_start event inside a rolling 90-day lookback that precedes the user's first conversion; it is never re-evaluated after the first purchase.
  2️⃣ Values follow the GA4 default channel grouping taxonomy: Direct, Organic Search, Paid Search, Paid Social, Organic Social, Display, Affiliate, Email, SMS, Referral, Organic Video, Paid Video, Cross-network, Unassigned.
  3️⃣ Sessions expire after 30 minutes of inactivity; a session that spans midnight is not treated as a new first touch.
  4️⃣ When user_id stitching later links an anonymous device to a known customer, the earliest touch across all stitched identities wins.
  5️⃣ Internal traffic, known bots and test orders are excluded before the first session is selected.
  6️⃣ Sessions with (not set) source and medium are grouped as Unassigned rather than dropped, so denominators stay complete.

Business Use Case: |
  Marketing leadership breaks down new customers, first-order revenue and 90-day repeat rate by this dimension to decide which acquisition channels deserve incremental budget, and the finance team uses it to reconcile channel-level customer acquisition cost against channel-level lifetime value.



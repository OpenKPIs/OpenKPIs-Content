Dimension Name: First Touch Channel Grouping

Description: |
  The default channel grouping of the earliest recorded session for a user within the attribution lookback window, persisted at user level so that every later event, order and revenue amount can be attributed back to how that customer was originally acquired. It is the backbone dimension for first-touch acquisition reporting and for separating marketing-sourced growth from organic and direct demand.

Category: Acquisition




























Dimension Name: Cart ID
Aliases: [Cart Identifier]

Formula: Cart ID = Collected shopping cart identifier

Description: |
  An opaque shopping cart identifier that groups actions without identifying a person. It supports cart activity analysis and, with compatible outcome events, analysis of progression and outcomes.

Category: Conversion

Tags: [shopping cart, cart activity, cart progression]

Industry: [E-commerce, Retail]

Business Criticality: High

Journey / Navigation Area: [Cart]

Owning Function: E-commerce Operations

Scope: Event

Measurement Channels: [Web, Mobile App, Backend / API]

Data Type: string


GA4 Event: |
  add_to_cart — supplies the shopping cart identifier

Adobe Event: |
  commerce.productListAdds — supplies the shopping cart identifier


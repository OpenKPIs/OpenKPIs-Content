Google Analytics SQL: |
  -- Bind report_start and report_end as UTC TIMESTAMP parameters.
  WITH cart_actions AS (
    SELECT
      (SELECT p.value.string_value FROM UNNEST(event_params) AS p
       WHERE p.key = 'event_id') AS event_id,
      TIMESTAMP_MICROS(event_timestamp) AS action_time,
      (SELECT p.value.string_value FROM UNNEST(event_params) AS p
       WHERE p.key = 'cart_id') AS cart_id
    FROM `{{GA4_PROJECT}}.{{GA4_DATASET}}.events_*`
    WHERE event_name = 'add_to_cart'
      AND _TABLE_SUFFIX BETWEEN
        FORMAT_DATE('%Y%m%d', DATE_SUB(DATE(@report_start), INTERVAL 1 DAY))
        AND FORMAT_DATE('%Y%m%d', DATE_ADD(DATE(@report_end), INTERVAL 1 DAY))
      AND event_timestamp >= UNIX_MICROS(@report_start)
      AND event_timestamp < UNIX_MICROS(@report_end)
  )
  SELECT event_id, action_time, cart_id
  FROM cart_actions
  WHERE cart_id IS NOT NULL;

AEP Query Service SQL: |
  -- Substitute report bounds as UTC timestamp literals; use a UTC query session.
  SELECT
    _id AS event_id,
    timestamp AS action_time,
    commerce.cart.cartID AS cart_id
  FROM {{AEP_EXPERIENCE_EVENT_DATASET}}
  WHERE eventType = 'commerce.productListAdds'
    AND timestamp >= CAST('{{REPORT_START_UTC}}' AS TIMESTAMP)
    AND timestamp < CAST('{{REPORT_END_UTC}}' AS TIMESTAMP)
    AND commerce.cart.cartID IS NOT NULL;

Calculation Notes: |
  1️⃣ Return the collected Cart ID unchanged on each qualifying action.
  2️⃣ Repeated Cart IDs group cart actions; they do not identify people.
  3️⃣ Missing Cart IDs do not qualify for the segment population.
  4️⃣ Document identifier replacement when anonymous and signed-in carts merge.
  5️⃣ Preserve historical action values when a cart identifier changes.

Business Use Case: |
  1️⃣ E-commerce teams group cart additions to investigate repeated cart activity.
  2️⃣ Checkout teams investigate drop-offs when checkout and purchase activity carry the same Cart ID.


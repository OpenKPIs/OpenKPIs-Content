Dimension Name: Promotion Name

Description: |
  Promotion Name is the governed display label of the internal promotion, banner or merchandising creative a shopper was served or clicked on owned properties, captured as the GA4 promotion_name parameter on view_promotion and select_promotion alongside promotion_id, creative_name and creative_slot. It is the primary breakdown for judging which onsite merchandising placements earn attention, product engagement and attributed revenue, and it is distinct from Promotion Type, which classifies the commercial mechanic (percentage off, BOGO, free shipping) rather than naming the individual placement.

Category: Engagement

Tags: [dimension, E-commerce: Product Discovery & Merchandising (Search/Filters/PDP)]

Industry: E-commerce

Priority: High

Core Area: Discovery

Scope: Event

Data Type: string

Aggregation Window: Event, Session, Daily, Weekly, Monthly


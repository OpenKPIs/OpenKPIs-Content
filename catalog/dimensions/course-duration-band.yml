Dimension Name: Course Duration Band

Description: |
  Course Duration Band classifies each digital course into a standardized, ordered range based on its published expected instructional duration. It measures the learner time commitment represented by the course offering, not enrollment access length, elapsed completion time, or an individual learner's observed consumption time.


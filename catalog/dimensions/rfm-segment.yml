Dimension Name: RFM Segment

Description: |
  RFM Segment is the named behavioral segment a customer holds on the scoring snapshot date, built from Recency, Frequency and Monetary scores of 1–5 assigned by customer-count quintile across every customer with at least one qualifying order in the trailing scoring window, with the R×F score combination mapped to a governed segment list whose documented default is the 11-segment map from Champions to Lost. Lifecycle marketing, retention and finance teams use it to target, suppress and prioritise customer groups and to track migration between segments from one refresh to the next, and it is distinct from Customer Status (relationship or lifecycle state), Customer Loyalty Tier (a tier earned under a loyalty program) and Customer Segmentation by Risk Profile (financial or credit risk).

Category: Retention




























  WITH login_events AS (
    SELECT
      event_timestamp,
      TIMESTAMP_MICROS(event_timestamp) AS event_observed_at,
      event_bundle_sequence_id,
      user_pseudo_id,
      _TABLE_SUFFIX AS event_date_suffix,
      ARRAY(
        SELECT AS STRUCT
          key,
          COALESCE(
            value.string_value,
            CAST(value.int_value AS STRING),
            CAST(value.double_value AS STRING),
            CAST(value.float_value AS STRING)
          ) AS attribute_value
        FROM UNNEST(event_params)
  
        UNION ALL
  
        SELECT AS STRUCT
          key,
          COALESCE(
            value.string_value,
            CAST(value.int_value AS STRING),
            CAST(value.double_value AS STRING),
            CAST(value.float_value AS STRING)
          ) AS attribute_value
        FROM UNNEST(user_properties)
      ) AS attributes
    FROM `your-project.analytics_123456789.events_*`
    WHERE event_name = 'login'
  ),
  pivoted AS (
    SELECT
      event_timestamp,
      event_observed_at,
      event_bundle_sequence_id,
      user_pseudo_id,
      event_date_suffix,
      MAX(IF(key = 'role_id', attribute_value, NULL)) AS role_id,
      COALESCE(
        MAX(IF(key = 'role_name', attribute_value, NULL)),

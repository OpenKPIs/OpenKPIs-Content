    FROM login_events
    CROSS JOIN UNNEST(attributes)
    GROUP BY
      event_timestamp,
      event_observed_at,
      event_bundle_sequence_id,
      user_pseudo_id,
      event_date_suffix
  ),
  typed AS (
    SELECT
      role_id,
      role_name,
      role_code,
      role_category,
      role_group,
      role_type,
      role_scope,
      role_status,
      role_description,
      role_version,
      CASE
        WHEN LOWER(TRIM(is_primary_raw)) IN ('true', '1', 'yes', 'y') THEN TRUE
        WHEN LOWER(TRIM(is_primary_raw)) IN ('false', '0', 'no', 'n') THEN FALSE
      END AS is_primary,
      CASE
        WHEN LOWER(TRIM(is_active_raw)) IN ('true', '1', 'yes', 'y') THEN TRUE
        WHEN LOWER(TRIM(is_active_raw)) IN ('false', '0', 'no', 'n') THEN FALSE
      END AS is_active,
      CASE
        WHEN LOWER(TRIM(is_privileged_raw)) IN ('true', '1', 'yes', 'y') THEN TRUE
        WHEN LOWER(TRIM(is_privileged_raw)) IN ('false', '0', 'no', 'n') THEN FALSE
      END AS is_privileged,
      assignment_id,
      assignment_method,
      assignment_source,
      assignment_reason,
      SAFE_CAST(NULLIF(TRIM(assigned_at_raw), '') AS TIMESTAMP) AS assigned_at,
      SAFE_CAST(NULLIF(TRIM(effective_from_raw), '') AS TIMESTAMP) AS effective_from,
      SAFE_CAST(NULLIF(TRIM(effective_to_raw), '') AS TIMESTAMP) AS effective_to,
      SAFE_CAST(NULLIF(TRIM(expires_at_raw), '') AS TIMESTAMP) AS expires_at,
      SAFE_CAST(NULLIF(TRIM(last_updated_at_raw), '') AS TIMESTAMP) AS last_updated_at,
      organization_id,
      organization_name,
      organization_unit_id,
      organization_unit_name,
      platform_id,
      platform_name,
      course_id,
      course_name,
      cohort_id,
      cohort_name,
      learning_event_id,
      learning_event_name,
      program_id,
      program_name,
      learner_id,
      account_id,
      crm_contact_id,
      iam_subject_id,
      SAFE_CAST(NULLIF(TRIM(role_hierarchy_level_raw), '') AS INT64) AS role_hierarchy_level,
      permissions_profile_id,
      audience_segment,
      locale,
      country_code,
      source_system,
      source_record_id,
      governance_taxonomy,
      data_quality_status,
      event_observed_at,
      event_date_suffix,
      user_pseudo_id,
      event_bundle_sequence_id,
      event_timestamp
    FROM pivoted
    WHERE COALESCE(role_id, role_name, assignment_id) IS NOT NULL
  ),
  deduplicated AS (
    SELECT
      *,
      ROW_NUMBER() OVER (
        PARTITION BY
          CASE
            WHEN NULLIF(assignment_id, '') IS NOT NULL THEN
              CONCAT(COALESCE(source_system, ''), '|', assignment_id)
            ELSE
              CONCAT(
                COALESCE(source_system, ''), '|',
                COALESCE(role_id, role_code, role_name, ''), '|',
                COALESCE(learner_id, iam_subject_id, crm_contact_id, user_pseudo_id, ''), '|',
                COALESCE(organization_id, ''), '|',
                COALESCE(platform_id, ''), '|',
                COALESCE(course_id, ''), '|',
                COALESCE(cohort_id, ''), '|',
                COALESCE(learning_event_id, ''), '|',
                COALESCE(program_id, '')
              )
          END
        ORDER BY
          COALESCE(last_updated_at, assigned_at, effective_from, event_observed_at) DESC,
          event_timestamp DESC
      ) AS record_rank
    FROM typed
  )
  SELECT
    TO_HEX(
      SHA256(
        CASE
          WHEN NULLIF(assignment_id, '') IS NOT NULL THEN
            CONCAT(COALESCE(source_system, ''), '|', assignment_id)
          ELSE
            CONCAT(
              COALESCE(source_system, ''), '|',
              COALESCE(role_id, role_code, role_name, ''), '|',
              COALESCE(learner_id, iam_subject_id, crm_contact_id, user_pseudo_id, ''), '|',
              COALESCE(organization_id, ''), '|',
              COALESCE(platform_id, ''), '|',
              COALESCE(course_id, ''), '|',
              COALESCE(cohort_id, ''), '|',
              COALESCE(learning_event_id, ''), '|',
              COALESCE(program_id, '')
            )
        END
      )
    ) AS learner_role_key,
    role_id,
    role_name,
    role_code,
    role_category,
    role_group,
    role_type,
    role_scope,
    role_status,
    role_description,
    role_version,
    is_primary,
    is_active,
    is_privileged,
    assignment_id,
    assignment_method,
    assignment_source,
    assignment_reason,
    assigned_at,
    effective_from,
    effective_to,
    expires_at,
    last_updated_at,
    organization_id,
    organization_name,
    organization_unit_id,
    organization_unit_name,
    platform_id,
    platform_name,
    course_id,
    course_name,
    cohort_id,
    cohort_name,
    learning_event_id,
    learning_event_name,
    program_id,
    program_name,
    learner_id,
    account_id,
    crm_contact_id,
    iam_subject_id,
    role_hierarchy_level,
    permissions_profile_id,
    audience_segment,
    locale,
    country_code,
    source_system,
    source_record_id,
    governance_taxonomy,
    data_quality_status,
    event_observed_at
  FROM deduplicated
  WHERE record_rank = 1;


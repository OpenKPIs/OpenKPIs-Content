      NULLIF(TRIM(_experience.analytics.customDimensions.eVars.eVar47), '') AS source_record_id,
      NULLIF(TRIM(_experience.analytics.customDimensions.eVars.eVar48), '') AS governance_taxonomy,
      NULLIF(TRIM(_experience.analytics.customDimensions.eVars.eVar49), '') AS data_quality_status,
      timestamp AS event_observed_at
    FROM aep_analytics_event_dataset
    WHERE eventType = 'user.login'
  ),
  typed AS (
    SELECT
      role_id,
      role_name,
      role_code,
      role_category,
      role_group,
      role_type,
      role_scope,
      role_status,
      role_description,
      role_version,
      CASE
        WHEN LOWER(is_primary_raw) IN ('true', '1', 'yes', 'y') THEN TRUE
        WHEN LOWER(is_primary_raw) IN ('false', '0', 'no', 'n') THEN FALSE
      END AS is_primary,
      CASE
        WHEN LOWER(is_active_raw) IN ('true', '1', 'yes', 'y') THEN TRUE
        WHEN LOWER(is_active_raw) IN ('false', '0', 'no', 'n') THEN FALSE
      END AS is_active,
      CASE
        WHEN LOWER(is_privileged_raw) IN ('true', '1', 'yes', 'y') THEN TRUE
        WHEN LOWER(is_privileged_raw) IN ('false', '0', 'no', 'n') THEN FALSE
      END AS is_privileged,
      assignment_id,
      assignment_method,
      assignment_source,
      assignment_reason,
      assigned_at,
      effective_from,
      effective_to,
      expires_at,
      last_updated_at,
      organization_id,
      organization_name,
      organization_unit_id,
      organization_unit_name,
      platform_id,
      platform_name,
      course_id,
      course_name,
      cohort_id,
      cohort_name,
      learning_event_id,
      learning_event_name,
      program_id,
      program_name,
      learner_id,
      account_id,
      crm_contact_id,
      iam_subject_id,
      CAST(role_hierarchy_level AS INTEGER) AS role_hierarchy_level,
      permissions_profile_id,
      audience_segment,
      locale,
      country_code,
      source_system,
      source_record_id,
      governance_taxonomy,
      data_quality_status,
      event_observed_at
    FROM extracted
    WHERE COALESCE(role_id, role_name, assignment_id) IS NOT NULL
  ),
  ranked AS (
    SELECT
      *,
      ROW_NUMBER() OVER (
        PARTITION BY
          CASE
            WHEN assignment_id IS NOT NULL THEN
              CONCAT(COALESCE(source_system, ''), '|', assignment_id)
            ELSE
              CONCAT(
                COALESCE(source_system, ''), '|',
                COALESCE(role_id, role_code, role_name, ''), '|',
                COALESCE(learner_id, iam_subject_id, crm_contact_id, ''), '|',
                COALESCE(organization_id, ''), '|',
                COALESCE(platform_id, ''), '|',
                COALESCE(course_id, ''), '|',
                COALESCE(cohort_id, ''), '|',
                COALESCE(learning_event_id, ''), '|',
                COALESCE(program_id, '')
              )
          END
        ORDER BY
          COALESCE(last_updated_at, assigned_at, effective_from, CAST(event_observed_at AS STRING)) DESC,
          event_observed_at DESC
      ) AS record_rank
    FROM typed
  )
  SELECT
    role_id,
    role_name,
    role_code,
    role_category,
    role_group,
    role_type,
    role_scope,
    role_status,
    role_description,
    role_version,
    is_primary,
    is_active,
    is_privileged,
    assignment_id,
    assignment_method,
    assignment_source,
    assignment_reason,
    assigned_at,
    effective_from,
    effective_to,
    expires_at,
    last_updated_at,
    organization_id,
    organization_name,
    organization_unit_id,
    organization_unit_name,
    platform_id,
    platform_name,
    course_id,
    course_name,
    cohort_id,
    cohort_name,
    learning_event_id,
    learning_event_name,
    program_id,
    program_name,
    learner_id,
    account_id,
    crm_contact_id,
    iam_subject_id,
    role_hierarchy_level,
    permissions_profile_id,
    audience_segment,
    locale,
    country_code,
    source_system,
    source_record_id,
    governance_taxonomy,
    data_quality_status,
    event_observed_at
  FROM ranked
  WHERE record_rank = 1;

Calculation Notes: |
  1️⃣ Resolve role based on event timestamp and specific context.  
  2️⃣ Prioritize course/cohort enrollment role over organization-level role, then account-level role.  
  3️⃣ Preserve event-time role for historical reporting despite future changes.  
  4️⃣ Map source-specific labels to canonical vocabulary (e.g., student → learner).  
  5️⃣ Exclude test, synthetic, monitoring, and deleted-system accounts with governed exclusion flag.  
  6️⃣ Set value to unknown if no valid role can be resolved; avoid inferring from URLs, activity, job title, or email.  
  7️⃣ Attribute each event independently in session reports; do not overwrite earlier events.

Business Use Case: |
  The Chief Learning Officer reviews course activation and completion rates by Learner Role and finds that manager-role users complete mandatory leadership programs at a materially lower rate than learner-role users. The learning operations team responds by creating a manager-specific onboarding journey, simplifying delegated enrollment tasks, and monitoring subsequent activation and completion by role.



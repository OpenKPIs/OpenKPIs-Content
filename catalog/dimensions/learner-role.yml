Dimension Name: Learner Role

Description: |
  Learner Role identifies the standardized functional role under which a person participates in the learning platform, organization, course, cohort, or learning event. It enables engagement, conversion, completion, and retention results to be compared across learners, instructors, managers, administrators, content authors, and other governed role groups.

Category: Engagement

Tags: [dimension]

Industry: EdTech & E-Learning

Priority: High

Core Area: Engagement

Scope: Event

Data Type: string

Aggregation Window: Event; may be summarized by Session, User, Daily, Monthly, Term, or Yearly periods using the role effective at the event timestamp


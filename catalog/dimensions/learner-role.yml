      MAX(IF(key = 'iam_subject_id', attribute_value, NULL)) AS iam_subject_id,
      MAX(IF(key = 'role_hierarchy_level', attribute_value, NULL)) AS role_hierarchy_level_raw,
      MAX(IF(key = 'permissions_profile_id', attribute_value, NULL)) AS permissions_profile_id,
      MAX(IF(key = 'audience_segment', attribute_value, NULL)) AS audience_segment,

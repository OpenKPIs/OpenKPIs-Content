Dimension Name: Content Rights Status

Description: |
  Classifies whether an individual content item is legally distributable for the applicable country, platform, channel, subscription tier, and interaction timestamp. It separates rights-enabled demand from demand restricted by licensing windows, territory rules, platform terms, tier requirements, suspensions, embargoes, or blackouts.

Category: Engagement

Tags: [dimension]

Industry: Media

Priority: High

Core Area: Engagement

Scope: Item

Data Type: string

Aggregation Window: Event


Dimension Name: Number of Shipments

Description: |
  Number of Shipments is the count of separate tracked fulfillments an order was delivered in, fixed once the order is fully fulfilled and reported in the bands 1, 2 and 3+, taken from the order management record (Shopify fulfillments, Salesforce Order Management FulfillmentOrder, Adobe Commerce sales_shipment). It is the order-level grouping behind Split Shipment Rate, so fulfillment operations, finance and customer service can see what orders that leave the network in more than one parcel group do to shipping cost, delivery experience and contact volume.


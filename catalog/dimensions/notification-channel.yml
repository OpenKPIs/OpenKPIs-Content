Dimension Name: Notification Channel

Description: |
  Notification Channel is the delivery medium through which a transactional customer notification was actually delivered (Email, SMS, Push, In-App or Other), taken from the send record in the ESP or SMS gateway and carried as the notification_channel parameter on shipment-notification-open and shipment-delay-notification. It lets customer service, CRM and operations teams compare reach, open behaviour, cost and 'where is my order' contact deflection of order and shipment updates by medium, and it is kept strictly separate from marketing acquisition channels, support contact channels and the message type being sent.

Category: Experience

Tags: [dimension, E-commerce: Post-Purchase Logistics & Fulfillment]

Industry: E-commerce

Priority: Medium

Core Area: Engagement

Scope: Event

Data Type: string

Aggregation Window: Event, Session, Daily, Weekly, Monthly


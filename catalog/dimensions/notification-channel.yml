Dimension Name: Notification Channel

Description: |
  Notification Channel is the delivery medium through which a transactional customer notification was actually delivered, taken from the send record in the ESP or SMS gateway and carried as the channel parameter of the shipment-notification-open event (raw lowercase values email, sms, push, in_app, other), with notification_type (order_confirmed, shipped, out_for_delivery, delay, delivered, pickup_ready) as the context parameter and message_id as the unique per-send ID. The raw values are normalised to the governed Title-case output (Email, SMS, Push, In-App, Other). It lets customer service, CRM and operations teams compare reach, open behaviour, cost and 'where is my order' contact deflection of order and shipment updates by medium, and it is kept strictly separate from marketing acquisition channels, support contact channels and the message type being sent.

Category: Experience

Tags: [dimension, E-commerce: Post-Purchase Logistics & Fulfillment]

Industry: E-commerce

Priority: Medium

Core Area: Engagement

Scope: Event

Data Type: string

Aggregation Window: Event, Session, Daily, Weekly, Monthly


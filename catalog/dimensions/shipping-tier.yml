Dimension Name: Shipping Tier

Description: |
  Shipping Tier is the delivery option the customer selects at checkout, recorded exactly as it was presented to them (for example Standard, Express, Next Day or Free Shipping), captured as the GA4 shipping_tier parameter on add_shipping_info and, where implemented, also sent as a custom shipping_tier parameter on purchase; order-level reporting uses the purchase value when present and otherwise the last add_shipping_info selection in the same session before the purchase. It lets checkout, merchandising and finance teams break down funnel progression, order value and shipping economics by the delivery promise the customer bought, independently of the carrier, service level or transport mode later used to fulfil the order.

Category: Conversion

Tags: [dimension, E-commerce: Cart & Checkout Funnel Analytics]

Industry: E-commerce

Priority: High

Core Area: Checkout

Scope: Event

Data Type: string

Aggregation Window: Event, Session, Daily, Weekly, Monthly


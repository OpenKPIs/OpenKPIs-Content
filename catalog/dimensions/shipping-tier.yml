Dimension Name: Shipping Tier

Description: |
  Shipping Tier is the delivery option the customer selects at checkout, recorded exactly as it was presented to them (for example Standard, Express, Next Day or Free Shipping), captured as the GA4 shipping_tier parameter on add_shipping_info and persisted onto the purchase. It lets checkout, merchandising and finance teams break down funnel progression, order value and shipping economics by the delivery promise the customer bought, independently of the carrier, service level or transport mode later used to fulfil the order.

Category: Conversion




























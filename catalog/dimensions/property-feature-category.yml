Calculation Notes: |
  Resolve the category by joining each valid listing-feature assignment to its canonical property feature code and then to the governed, effective-dated property feature taxonomy. For event analysis, select the category whose effective period contains the event timestamp; for inventory snapshots, use the category and listing-feature assignment valid at the snapshot timestamp. Treat effective-from timestamps as inclusive and effective-to timestamps as exclusive, and prohibit overlapping active category mappings for the same canonical feature code. Assign 'Unknown' only when a valid canonical feature assignment has no applicable category mapping; do not create a category record when no feature assignment exists. Deduplicate the same canonical feature within a listing and effective period for listing counts while retaining records that differ by source lineage, verification status, or effective period. Preserve Type 2 history and do not restate historical categories after taxonomy changes unless an approved historical restatement is performed. Category values must come from the governed taxonomy and must not be derived from hardcoded property boolean columns, raw feature labels, free text, or embedded category labels.

Business Use Case: |
  The Product analytics team compares search-filter engagement with available listing inventory by property feature category and identifies strong demand but low coverage for Parking and Accessibility in selected markets. Product leadership then prioritizes structured feature collection for those categories, and partner teams ask brokers and property managers to enrich affected listings.



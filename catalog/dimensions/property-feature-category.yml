Dimension Name: Property Feature Category

Description: |
  Classifies each canonical property feature assigned to a listing into one governed functional category, such as Parking, Accessibility, Utilities, or Safety and Security. It supports consistent analysis of property inventory, feature demand, search behavior, and listing engagement by feature category.

Category: Engagement

Tags: [dimension]

Industry: Technology

Priority: High

Core Area: Discovery

Scope: Item

Data Type: string

Aggregation Window: Event







Google Analytics SQL: |
  -- ==========================================
  -- 1. GOOGLE BIGQUERY SQL
  -- ==========================================
  WITH ranked_categories AS (
    SELECT
      c.category_id,
      c.category_version_id,
      c.category_name,
      c.effective_from,
      c.effective_to,
      c.updated_at,
      c.ingestion_timestamp,
      ROW_NUMBER() OVER (
        PARTITION BY c.category_id, c.category_version_id
        ORDER BY c.updated_at DESC, c.ingestion_timestamp DESC
      ) AS row_number
    FROM `your-project.property_feature_taxonomy.feature_categories` AS c
    WHERE c.category_id IS NOT NULL
      AND c.category_version_id IS NOT NULL
      AND c.category_name IS NOT NULL
      AND c.effective_from IS NOT NULL
  ),
  categories AS (
    SELECT * EXCEPT (row_number)
    FROM ranked_categories
    WHERE row_number = 1
  ),
  ranked_features AS (
    SELECT
      f.feature_id,
      f.feature_version_id,
      f.feature_name,
      f.category_id,
      f.effective_from,
      f.effective_to,
      f.updated_at,
      f.ingestion_timestamp,
      ROW_NUMBER() OVER (
        PARTITION BY f.feature_id, f.feature_version_id
        ORDER BY f.updated_at DESC, f.ingestion_timestamp DESC
      ) AS row_number
    FROM `your-project.property_feature_taxonomy.property_features` AS f
    WHERE f.feature_id IS NOT NULL
      AND f.feature_version_id IS NOT NULL
      AND f.category_id IS NOT NULL
      AND f.feature_name IS NOT NULL
      AND f.effective_from IS NOT NULL
  ),
  features AS (
    SELECT * EXCEPT (row_number)
    FROM ranked_features
    WHERE row_number = 1
  ),
  ranked_assignments AS (
    SELECT
      a.property_id,
      a.feature_id,
      a.is_enabled,
      a.effective_from,
      a.effective_to,
      a.updated_at,
      a.ingestion_timestamp,
      ROW_NUMBER() OVER (
        PARTITION BY a.property_id, a.feature_id, a.effective_from
        ORDER BY a.updated_at DESC, a.ingestion_timestamp DESC
      ) AS row_number
    FROM `your-project.property_listing_management.property_feature_assignments` AS a
    WHERE a.property_id IS NOT NULL
      AND a.feature_id IS NOT NULL
      AND a.effective_from IS NOT NULL
  ),
  assignments AS (
    SELECT * EXCEPT (row_number)
    FROM ranked_assignments
    WHERE row_number = 1
      AND COALESCE(is_enabled, FALSE) = TRUE
  ),
  temporal_intersections AS (
    SELECT
      a.property_id,
      f.feature_id,
      f.feature_version_id,
      f.feature_name,
      c.category_id,
      c.category_version_id,
      c.category_name,
      GREATEST(
        a.effective_from,
        f.effective_from,
        c.effective_from
      ) AS valid_from,
      LEAST(
        COALESCE(a.effective_to, TIMESTAMP '9999-12-31 23:59:59+00'),
        COALESCE(f.effective_to, TIMESTAMP '9999-12-31 23:59:59+00'),
        COALESCE(c.effective_to, TIMESTAMP '9999-12-31 23:59:59+00')
      ) AS valid_to_raw,
      GREATEST(
        COALESCE(a.updated_at, TIMESTAMP '1970-01-01 00:00:00+00'),
        COALESCE(f.updated_at, TIMESTAMP '1970-01-01 00:00:00+00'),
        COALESCE(c.updated_at, TIMESTAMP '1970-01-01 00:00:00+00')
      ) AS source_updated_at
    FROM assignments AS a
    INNER JOIN features AS f
      ON a.feature_id = f.feature_id
     AND a.effective_from < COALESCE(f.effective_to, TIMESTAMP '9999-12-31 23:59:59+00')
     AND f.effective_from < COALESCE(a.effective_to, TIMESTAMP '9999-12-31 23:59:59+00')
    INNER JOIN categories AS c
      ON f.category_id = c.category_id
     AND a.effective_from < COALESCE(c.effective_to, TIMESTAMP '9999-12-31 23:59:59+00')
     AND f.effective_from < COALESCE(c.effective_to, TIMESTAMP '9999-12-31 23:59:59+00')
     AND c.effective_from < COALESCE(a.effective_to, TIMESTAMP '9999-12-31 23:59:59+00')
     AND c.effective_from < COALESCE(f.effective_to, TIMESTAMP '9999-12-31 23:59:59+00')
  ),
  resolved_history AS (
    SELECT *
    FROM temporal_intersections
    WHERE valid_from < valid_to_raw
  )
  SELECT
    TO_HEX(MD5(CONCAT(
      LOWER(TRIM(CAST(category_id AS STRING))),
      '|',
      LOWER(TRIM(CAST(category_version_id AS STRING)))
    ))) AS property_feature_category_key,
    TO_HEX(MD5(CONCAT(
      LOWER(TRIM(CAST(feature_id AS STRING))),
      '|',
      LOWER(TRIM(CAST(feature_version_id AS STRING)))
    ))) AS property_feature_key,
    property_id,
    category_id AS property_feature_category_id,
    category_name AS property_feature_category,
    feature_id AS property_feature_id,
    feature_name AS property_feature_name,
    valid_from,
    IF(
      valid_to_raw = TIMESTAMP '9999-12-31 23:59:59+00',
      NULL,
      valid_to_raw
    ) AS valid_to,
    source_updated_at,
    CURRENT_TIMESTAMP() AS dimension_loaded_at,
    valid_to_raw = TIMESTAMP '9999-12-31 23:59:59+00' AS is_current
  FROM resolved_history;


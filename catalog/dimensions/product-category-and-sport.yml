Dimension Name: Product Category and Sport

Description: |
  Sporting-goods retail specialisation of Item Category: the merchandise category a product belongs to (Footwear, Apparel, Equipment, Accessories) paired with the sport or activity it serves (Running, Soccer, Basketball, Golf), carried on every ecommerce item as item_category and item_category2 and resolved against the governed product information hierarchy. It is the primary lens category managers, planners and marketers use to read demand, conversion and sell-through from list view to purchase, so every item-scoped view, cart and revenue figure reconciles by department and sport across web, app and store.

Category: Monetization

Tags: [dimension, E-commerce: Product Discovery & Merchandising (Search / Filters / PDP)]

Industry: Retail

Priority: High

Core Area: Discovery

Scope: Event

Data Type: string

Aggregation Window: Event, Daily, Weekly, Monthly, Quarterly, Yearly


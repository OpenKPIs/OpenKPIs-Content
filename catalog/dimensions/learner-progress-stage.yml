  -- ==========================================
  -- 1. GOOGLE BIGQUERY SQL
  -- ==========================================
  WITH event_parameters AS (
    SELECT
      event_date,
      event_timestamp AS ga4_event_timestamp,
      event_name AS ga4_event_name,
      user_pseudo_id,
      MAX(IF(p.key = 'learner_progress_stage', p.value.string_value, NULL)) AS stage_raw,
      MAX(IF(p.key = 'learner_progress_stage_rank', COALESCE(p.value.string_value, CAST(p.value.int_value AS STRING), CAST(p.value.double_value AS STRING), CAST(p.value.float_value AS STRING)), NULL)) AS stage_rank_raw,
      MAX(IF(p.key = 'learner_progress_stage_at', p.value.string_value, NULL)) AS stage_at_raw,
      MAX(IF(p.key = 'learner_progress_stage_source', p.value.string_value, NULL)) AS stage_source,
      MAX(IF(p.key = 'learner_progress_verified', COALESCE(p.value.string_value, CAST(p.value.int_value AS STRING)), NULL)) AS verified_raw,
      MAX(IF(p.key = 'learner_progress_verification_id', p.value.string_value, NULL)) AS verification_id,
      MAX(IF(p.key = 'learner_progress_verification_method', p.value.string_value, NULL)) AS verification_method,
      MAX(IF(p.key = 'learner_progress_version', p.value.string_value, NULL)) AS progress_version,
      MAX(IF(p.key = 'learner_id', p.value.string_value, NULL)) AS learner_id,
      MAX(IF(p.key = 'learner_id_type', p.value.string_value, NULL)) AS learner_id_type,
      MAX(IF(p.key = 'learning_item_id', p.value.string_value, NULL)) AS learning_item_id,
      MAX(IF(p.key = 'learning_item_type', p.value.string_value, NULL)) AS learning_item_type,
      MAX(IF(p.key = 'learning_item_title', p.value.string_value, NULL)) AS learning_item_title,
      MAX(IF(p.key = 'learning_item_version', p.value.string_value, NULL)) AS learning_item_version,
      MAX(IF(p.key = 'learning_item_provider', p.value.string_value, NULL)) AS learning_item_provider,
      MAX(IF(p.key = 'learning_program_id', p.value.string_value, NULL)) AS learning_program_id,
      MAX(IF(p.key = 'learning_path_id', p.value.string_value, NULL)) AS learning_path_id,
      MAX(IF(p.key = 'enrollment_id', p.value.string_value, NULL)) AS enrollment_id,
      MAX(IF(p.key = 'enrollment_at', p.value.string_value, NULL)) AS enrollment_at_raw,
      MAX(IF(p.key = 'first_started_at', p.value.string_value, NULL)) AS first_started_at_raw,
      MAX(IF(p.key = 'last_activity_at', p.value.string_value, NULL)) AS last_activity_at_raw,
      MAX(IF(p.key = 'completed_at', p.value.string_value, NULL)) AS completed_at_raw,
      MAX(IF(p.key = 'completion_verified_at', p.value.string_value, NULL)) AS completion_verified_at_raw,
      MAX(IF(p.key = 'attempt_id', p.value.string_value, NULL)) AS attempt_id,
      MAX(IF(p.key = 'attempt_number', COALESCE(p.value.string_value, CAST(p.value.int_value AS STRING)), NULL)) AS attempt_number_raw,
      MAX(IF(p.key = 'session_id', p.value.string_value, NULL)) AS session_id,
      MAX(IF(p.key = 'activity_id', p.value.string_value, NULL)) AS activity_id,
      MAX(IF(p.key = 'activity_type', p.value.string_value, NULL)) AS activity_type,
      MAX(IF(p.key = 'delivery_mode', p.value.string_value, NULL)) AS delivery_mode,
      MAX(IF(p.key = 'language', p.value.string_value, NULL)) AS language,
      MAX(IF(p.key = 'locale', p.value.string_value, NULL)) AS locale,
      MAX(IF(p.key = 'platform', p.value.string_value, NULL)) AS platform,
      MAX(IF(p.key = 'channel', p.value.string_value, NULL)) AS channel,
      MAX(IF(p.key = 'page_location', p.value.string_value, NULL)) AS page_location,
      MAX(IF(p.key = 'page_referrer', p.value.string_value, NULL)) AS page_referrer,
      MAX(IF(p.key = 'event_id', p.value.string_value, NULL)) AS source_event_id,
      MAX(IF(p.key = 'event_timestamp', p.value.string_value, NULL)) AS source_event_timestamp_raw,
      MAX(IF(p.key = 'event_name', p.value.string_value, NULL)) AS source_event_name,
      MAX(IF(p.key = 'event_source', p.value.string_value, NULL)) AS event_source,
      MAX(IF(p.key = 'xapi_statement_id', p.value.string_value, NULL)) AS xapi_statement_id,
      MAX(IF(p.key = 'xapi_verb_id', p.value.string_value, NULL)) AS xapi_verb_id,
      MAX(IF(p.key = 'lms_id', p.value.string_value, NULL)) AS lms_id,
      MAX(IF(p.key = 'lms_tenant_id', p.value.string_value, NULL)) AS lms_tenant_id,
      MAX(IF(p.key = 'organization_id', p.value.string_value, NULL)) AS organization_id,
      MAX(IF(p.key = 'user_pseudonymous_id', p.value.string_value, NULL)) AS user_pseudonymous_id,
      MAX(IF(p.key = 'authentication_state', p.value.string_value, NULL)) AS authentication_state,
      MAX(IF(p.key = 'consent_analytics', p.value.string_value, NULL)) AS consent_analytics,
      MAX(IF(p.key = 'schema_version', p.value.string_value, NULL)) AS schema_version,
      MAX(IF(p.key = 'data_quality_status', p.value.string_value, NULL)) AS data_quality_status
    FROM `your-project.analytics_123456789.events_*` AS e
    LEFT JOIN UNNEST(e.event_params) AS p
    WHERE _TABLE_SUFFIX BETWEEN FORMAT_DATE('%Y%m%d', @start_date)
                            AND FORMAT_DATE('%Y%m%d', @end_date)
    GROUP BY event_date, ga4_event_timestamp, ga4_event_name, user_pseudo_id
  ),
  normalized AS (
    SELECT
      LOWER(TRIM(stage_raw)) AS learner_progress_stage,
      COALESCE(
        SAFE_CAST(stage_rank_raw AS INT64),
        CASE LOWER(TRIM(stage_raw))
          WHEN 'enrolled' THEN 1
          WHEN 'started' THEN 2
          WHEN 'in_progress' THEN 3
          WHEN 'completed' THEN 4
          WHEN 'verified_complete' THEN 5
          ELSE 0
        END
      ) AS learner_progress_stage_rank,
      COALESCE(SAFE_CAST(stage_at_raw AS TIMESTAMP), TIMESTAMP_MICROS(ga4_event_timestamp)) AS learner_progress_stage_at,
      stage_source AS learner_progress_stage_source,
      CASE
        WHEN LOWER(TRIM(verified_raw)) IN ('true', '1', 'yes') THEN TRUE
        WHEN LOWER(TRIM(verified_raw)) IN ('false', '0', 'no') THEN FALSE
        ELSE NULL
      END AS learner_progress_verified,
      verification_id AS learner_progress_verification_id,
      verification_method AS learner_progress_verification_method,
      progress_version AS learner_progress_version,
      COALESCE(learner_id, user_pseudo_id) AS learner_id,
      learner_id_type,
      learning_item_id,
      learning_item_type,
      learning_item_title,
      learning_item_version,
      learning_item_provider,
      learning_program_id,
      learning_path_id,
      enrollment_id,
      SAFE_CAST(enrollment_at_raw AS TIMESTAMP) AS enrollment_at,
      SAFE_CAST(first_started_at_raw AS TIMESTAMP) AS first_started_at,
      SAFE_CAST(last_activity_at_raw AS TIMESTAMP) AS last_activity_at,
      SAFE_CAST(completed_at_raw AS TIMESTAMP) AS completed_at,
      SAFE_CAST(completion_verified_at_raw AS TIMESTAMP) AS completion_verified_at,
      attempt_id,
      SAFE_CAST(attempt_number_raw AS INT64) AS attempt_number,
      session_id,
      activity_id,
      activity_type,
      delivery_mode,
      language,
      locale,
      platform,
      channel,
      page_location,
      page_referrer,
      COALESCE(source_event_id, CONCAT(user_pseudo_id, '-', CAST(ga4_event_timestamp AS STRING), '-', ga4_event_name)) AS event_id,
      COALESCE(SAFE_CAST(source_event_timestamp_raw AS TIMESTAMP), TIMESTAMP_MICROS(ga4_event_timestamp)) AS event_timestamp,
      COALESCE(source_event_name, ga4_event_name) AS event_name,
      event_source,
      xapi_statement_id,
      xapi_verb_id,
      lms_id,
      lms_tenant_id,
      organization_id,
      user_pseudonymous_id,
      authentication_state,
      consent_analytics,
      schema_version,
      data_quality_status
    FROM event_parameters
    WHERE stage_raw IS NOT NULL
      AND learner_id IS NOT NULL
      AND learning_item_id IS NOT NULL
  ),
  deduplicated AS (
    SELECT
      *,
      ROW_NUMBER() OVER (
        PARTITION BY event_id
        ORDER BY learner_progress_stage_at DESC, event_timestamp DESC
      ) AS event_deduplication_rank
    FROM normalized
    WHERE learner_progress_stage IN ('enrolled', 'started', 'in_progress', 'completed', 'verified_complete')
  ),
  current_stage AS (
    SELECT
      *,
      ROW_NUMBER() OVER (
        PARTITION BY learner_id, learning_item_id, COALESCE(enrollment_id, '')
        ORDER BY learner_progress_stage_at DESC,
                 learner_progress_stage_rank DESC,
                 event_timestamp DESC,
                 event_id DESC
      ) AS current_stage_rank
    FROM deduplicated
    WHERE event_deduplication_rank = 1
  )
  SELECT
    learner_progress_stage,
    learner_progress_stage_rank,
    learner_progress_stage_at,
    learner_progress_stage_source,
    learner_progress_verified,
    learner_progress_verification_id,
    learner_progress_verification_method,
    learner_progress_version,
    learner_id,
    learner_id_type,
    learning_item_id,
    learning_item_type,
    learning_item_title,
    learning_item_version,
    learning_item_provider,
    learning_program_id,
    learning_path_id,
    enrollment_id,
    enrollment_at,
    first_started_at,
    last_activity_at,
    completed_at,
    completion_verified_at,
    attempt_id,
    attempt_number,
    session_id,
    activity_id,
    activity_type,
    delivery_mode,
    language,
    locale,
    platform,
    channel,
    page_location,
    page_referrer,
    event_id,
    event_timestamp,
    event_name,
    event_source,
    xapi_statement_id,
    xapi_verb_id,
    lms_id,
    lms_tenant_id,
    organization_id,
    user_pseudonymous_id,
    authentication_state,
    consent_analytics,
    schema_version,
    data_quality_status
  FROM current_stage
  WHERE current_stage_rank = 1;


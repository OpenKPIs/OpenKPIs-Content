      _experience.analytics.customDimensions.eVars.eVar48 AS schema_version,
      _experience.analytics.customDimensions.eVars.eVar49 AS data_quality_status
    FROM aep_learning_experience_event_dataset
    WHERE _experience.analytics.customDimensions.eVars.eVar1 IS NOT NULL
      AND _experience.analytics.customDimensions.eVars.eVar9 IS NOT NULL
      AND _experience.analytics.customDimensions.eVars.eVar11 IS NOT NULL
  ),
  deduplicated AS (
    SELECT
      extracted.*,
      ROW_NUMBER() OVER (
        PARTITION BY event_id
        ORDER BY learner_progress_stage_at DESC, event_timestamp DESC
      ) AS event_deduplication_rank
    FROM extracted
    WHERE learner_progress_stage IN ('enrolled', 'started', 'in_progress', 'completed', 'verified_complete')
  ),
  current_stage AS (
    SELECT
      deduplicated.*,
      ROW_NUMBER() OVER (
        PARTITION BY learner_id, learning_item_id, COALESCE(enrollment_id, '')
        ORDER BY learner_progress_stage_at DESC,
                 learner_progress_stage_rank DESC,
                 event_timestamp DESC,
                 event_id DESC
      ) AS current_stage_rank
    FROM deduplicated
    WHERE event_deduplication_rank = 1
  )
  SELECT
    learner_progress_stage,
    learner_progress_stage_rank,
    learner_progress_stage_at,
    learner_progress_stage_source,
    learner_progress_verified,
    learner_progress_verification_id,
    learner_progress_verification_method,
    learner_progress_version,
    learner_id,
    learner_id_type,
    learning_item_id,
    learning_item_type,
    learning_item_title,
    learning_item_version,
    learning_item_provider,
    learning_program_id,
    learning_path_id,
    enrollment_id,
    enrollment_at,
    first_started_at,
    last_activity_at,
    completed_at,
    completion_verified_at,
    attempt_id,
    attempt_number,
    session_id,
    activity_id,
    activity_type,
    delivery_mode,
    language,
    locale,
    platform,
    channel,
    page_location,
    page_referrer,
    event_id,
    event_timestamp,
    event_name,
    event_source,
    xapi_statement_id,
    xapi_verb_id,
    lms_id,
    lms_tenant_id,
    organization_id,
    user_pseudonymous_id,
    authentication_state,
    consent_analytics,
    schema_version,
    data_quality_status
  FROM current_stage
  WHERE current_stage_rank = 1;

Calculation Notes: |
  1️⃣ Assign the stage independently for each learner, enrollment, learning item, and learning item version.
  2️⃣ Give an authoritative completion event precedence over progress percentages and intermediate activity events.
  3️⃣ Classify enrolled items with no qualifying launch or content activity as Not Started; do not classify unenrolled catalog views.
  4️⃣ Preserve the highest verified stage unless an authorized enrollment reset, reassignment, or content-version migration occurs.
  5️⃣ Apply late-arriving events by source event time and restate affected historical stage assignments within the retention window.
  6️⃣ Exclude test accounts, synthetic monitoring, administrative previews, deleted enrollments, and identified bot traffic.
  7️⃣ Use Unknown when required identifiers or trustworthy progress evidence are absent; never infer Not Started from missing telemetry alone.

Business Use Case: |
  The Chief Product Officer reviews conversion by learner progress stage, course, device category, and acquisition cohort to identify learning items with disproportionate Started-to-In Progress or Nearing Completion-to-Completed abandonment. Product teams then prioritize content redesign, resume-flow improvements, technical defect remediation, or targeted digital reminders for the affected segments.



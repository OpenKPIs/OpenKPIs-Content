Dimension Name: Occupancy Status

Description: |
  Occupancy Status identifies the effective physical and operational occupancy state of a rentable unit or space at a specific point in time. It distinguishes occupied inventory from vacant-ready, vacant-not-ready, reserved, offline, and indeterminate inventory for availability, leasing, and property performance analysis.

Category: Performance

Tags: [dimension]

Industry: Real Estate Tech

Priority: High

Core Area: Generic

Scope: Item

Data Type: string

Aggregation Window: Time based - Daily









Calculation Notes: |
  1️⃣ Assign status based on the record effective at the reporting timestamp.  
  2️⃣ A unit becomes Occupied on actual possession/move-in timestamp.  
  3️⃣ Status remains Occupied until actual move-out, surrender, or possession-end timestamp.  
  4️⃣ Use contractual lease dates as a fallback only when operational events are unavailable.  
  5️⃣ Apply precedence for conflicting inputs: Offline > Occupied > Vacant - Reserved > Vacant - Not Ready > Vacant - Ready > Unknown.  
  6️⃣ Exclude non-rentable common areas and duplicate unit records.  
  7️⃣ Preserve historical status intervals; do not overwrite prior periods for late events.

Business Use Case: |
  Property Operations reviews occupancy status by property, unit type, and vacancy duration each day to identify vacant-ready units that can be marketed immediately, vacant-not-ready units requiring maintenance escalation, and offline units constraining revenue capacity. Executives use the same classification to separate leasing demand issues from operational readiness issues when setting occupancy targets, capital priorities, and property-level intervention plans.


Source Data: Property Management System and Lease Administration System


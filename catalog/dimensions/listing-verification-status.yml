    'view' AS event_action,
    source_event_id AS event_id,
    CAST(NULL AS VARCHAR) AS user_pseudo_id,
    CAST(NULL AS BIGINT) AS session_id,
    CAST(NULL AS BIGINT) AS session_number,
    'WEB' AS platform,
    CAST(NULL AS VARCHAR) AS stream_id,

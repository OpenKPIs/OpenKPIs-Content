      WHEN listing_verification_status IN ('pending', 'in_review') THEN 'workflow'
      WHEN listing_verification_status IN ('rejected', 'suspended') THEN 'adverse'
      WHEN listing_verification_status IN ('expired', 'unverified') THEN 'inactive'
      ELSE 'unknown'

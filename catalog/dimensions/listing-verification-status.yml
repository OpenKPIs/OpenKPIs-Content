        WHEN normalized_raw_status IN ('in_review', 'under_review', 'reviewing', 'manual_review') THEN 'in_review'
        WHEN normalized_raw_status IN ('pending', 'pending_verification', 'submitted', 'awaiting_verification') THEN 'pending'

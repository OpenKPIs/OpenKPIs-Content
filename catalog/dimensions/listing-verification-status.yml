Calculation Notes: |
  Use the latest non-cancelled status record effective at or before the analysis timestamp, not the latest record by ingestion time. Order competing records by effective timestamp, then source update timestamp, then immutable event identifier; route unresolved ties to a data-quality exception. Map source-specific statuses to the controlled values and never convert a null or unmapped source value to UNVERIFIED. A reopened or resubmitted verification becomes PENDING when the new attempt is effective, even if an earlier attempt was REJECTED or EXPIRED. VERIFIED is valid only while all currently mandatory checks remain passed and unexpired; material changes to address, ownership, publisher, property identity, or listing terms must trigger reassessment according to policy. REVOKED applies only when an explicit revocation decision exists. Historical reporting must use the status effective at the event or snapshot time to prevent current-state leakage. Exclude synthetic, employee test, and quality-assurance listings from production reporting unless a report explicitly includes them; retain deactivated or deleted listings in historical results when they were active during the reporting period.

Business Use Case: |
  The Trust & Safety leadership team compares verified-listing coverage, rejection rates, and pending-review backlogs by market, publisher type, and property category. Markets with high listing volume but low verification coverage can receive stricter publication controls, additional review capacity, publisher outreach, or policy changes, while Product can suppress or label unverified listings in discovery experiences.



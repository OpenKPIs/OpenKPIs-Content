Google Analytics SQL: |
  -- ==========================================
  -- 1. GOOGLE BIGQUERY SQL
  -- ==========================================
  WITH event_level AS (
    SELECT
      event_date,
      TIMESTAMP_MICROS(event_timestamp) AS event_timestamp,
      event_timestamp AS event_timestamp_micros,
      event_server_timestamp_offset,
      event_bundle_sequence_id,
      event_name,
      user_pseudo_id,
      platform,
      stream_id,
      device,
      geo,
      traffic_source,
      items,
      (SELECT COALESCE(p.value.string_value, CAST(p.value.int_value AS STRING), CAST(p.value.double_value AS STRING), CAST(p.value.float_value AS STRING)) FROM UNNEST(event_params) p WHERE p.key = 'listing_verification_status' LIMIT 1) AS event_verification_status,
      (SELECT COALESCE(p.value.string_value, CAST(p.value.int_value AS STRING), CAST(p.value.double_value AS STRING), CAST(p.value.float_value AS STRING)) FROM UNNEST(event_params) p WHERE p.key = 'listing_verification_as_of' LIMIT 1) AS event_verification_as_of,
      (SELECT COALESCE(p.value.string_value, CAST(p.value.int_value AS STRING)) FROM UNNEST(event_params) p WHERE p.key = 'listing_id' LIMIT 1) AS event_listing_id,
      (SELECT p.value.int_value FROM UNNEST(event_params) p WHERE p.key = 'ga_session_id' LIMIT 1) AS session_id,
      (SELECT p.value.int_value FROM UNNEST(event_params) p WHERE p.key = 'ga_session_number' LIMIT 1) AS session_number,
      (SELECT p.value.string_value FROM UNNEST(event_params) p WHERE p.key = 'page_location' LIMIT 1) AS page_location,
      (SELECT p.value.string_value FROM UNNEST(event_params) p WHERE p.key = 'page_referrer' LIMIT 1) AS page_referrer,
      (SELECT p.value.string_value FROM UNNEST(event_params) p WHERE p.key = 'currency' LIMIT 1) AS event_currency,
      (SELECT COALESCE(p.value.string_value, CAST(p.value.int_value AS STRING)) FROM UNNEST(event_params) p WHERE p.key = 'event_id' LIMIT 1) AS supplied_event_id
    FROM `your-project.analytics_123456789.events_*`
    WHERE event_name = 'view_item'
  ),
  item_level AS (
    SELECT
      e.* EXCEPT (items),
      COALESCE(NULLIF(i.item_id, ''), NULLIF(e.event_listing_id, '')) AS listing_id,
      i.item_name,
      i.item_category,
      i.item_category2,
      i.item_brand,
      i.item_variant,
      i.price,
      i.quantity,
      COALESCE(
        NULLIF((SELECT COALESCE(p.value.string_value, CAST(p.value.int_value AS STRING), CAST(p.value.double_value AS STRING), CAST(p.value.float_value AS STRING)) FROM UNNEST(i.item_params) p WHERE p.key = 'listing_verification_status' LIMIT 1), ''),
        NULLIF(e.event_verification_status, '')
      ) AS raw_listing_verification_status,
      COALESCE(
        SAFE_CAST(NULLIF((SELECT COALESCE(p.value.string_value, CAST(p.value.int_value AS STRING)) FROM UNNEST(i.item_params) p WHERE p.key = 'listing_verification_as_of' LIMIT 1), '') AS TIMESTAMP),
        SAFE_CAST(NULLIF(e.event_verification_as_of, '') AS TIMESTAMP),
        e.event_timestamp
      ) AS listing_verification_as_of
    FROM event_level e
    CROSS JOIN UNNEST(e.items) i
  ),
  normalized AS (
    SELECT
      *,
      LOWER(REGEXP_REPLACE(TRIM(raw_listing_verification_status), r'[^a-zA-Z0-9]+', '_')) AS normalized_raw_status
    FROM item_level
    WHERE listing_id IS NOT NULL
  ),
  canonical AS (
    SELECT
      *,
      CASE
        WHEN normalized_raw_status IN ('verified', 'approved', 'verification_approved', 'active_verified') THEN 'verified'
        WHEN normalized_raw_status IN ('in_review', 'under_review', 'reviewing', 'manual_review') THEN 'in_review'
        WHEN normalized_raw_status IN ('pending', 'pending_verification', 'submitted', 'awaiting_verification') THEN 'pending'
        WHEN normalized_raw_status IN ('rejected', 'declined', 'verification_failed', 'failed') THEN 'rejected'
        WHEN normalized_raw_status IN ('suspended', 'blocked', 'disabled') THEN 'suspended'
        WHEN normalized_raw_status IN ('expired', 'verification_expired') THEN 'expired'
        WHEN normalized_raw_status IN ('unverified', 'not_verified', 'new') THEN 'unverified'
        ELSE 'unknown'
      END AS listing_verification_status
    FROM normalized
  ),
  ranked AS (
    SELECT
      *,
      ROW_NUMBER() OVER (
        PARTITION BY listing_id
        ORDER BY listing_verification_as_of DESC, event_timestamp DESC, event_bundle_sequence_id DESC
      ) AS current_row_number
    FROM canonical
  )
  SELECT
    CONCAT('listing_verification_status|', listing_id) AS listing_verification_status_key,
    listing_id,
    listing_verification_status,
    raw_listing_verification_status,
    CASE
      WHEN listing_verification_status = 'verified' THEN 'approved'
      WHEN listing_verification_status IN ('pending', 'in_review') THEN 'workflow'
      WHEN listing_verification_status IN ('rejected', 'suspended') THEN 'adverse'
      WHEN listing_verification_status IN ('expired', 'unverified') THEN 'inactive'
      ELSE 'unknown'
    END AS listing_verification_status_group,
    listing_verification_status = 'verified' AS is_verified,
    listing_verification_status IN ('verified', 'rejected', 'suspended', 'expired') AS is_terminal_status,
    CASE listing_verification_status
      WHEN 'unverified' THEN 10
      WHEN 'pending' THEN 20
      WHEN 'in_review' THEN 30
      WHEN 'verified' THEN 40
      WHEN 'expired' THEN 50
      WHEN 'rejected' THEN 60
      WHEN 'suspended' THEN 70
      ELSE 0
    END AS listing_verification_status_rank,
    listing_verification_as_of AS listing_verification_as_of_timestamp,
    listing_verification_as_of AS effective_from_timestamp,
    CAST(NULL AS TIMESTAMP) AS effective_to_timestamp,
    TRUE AS is_current,
    DATE(event_timestamp) AS event_date,
    event_timestamp,
    event_name,
    'view' AS event_action,
    COALESCE(supplied_event_id, CONCAT(COALESCE(user_pseudo_id, 'anonymous'), '|', CAST(event_timestamp_micros AS STRING), '|', CAST(COALESCE(event_bundle_sequence_id, 0) AS STRING))) AS event_id,
    user_pseudo_id,
    session_id,
    session_number,
    platform,
    CAST(stream_id AS STRING) AS stream_id,
    device.category AS device_category,
    device.operating_system AS operating_system,
    device.web_info.browser AS browser,
    geo.country AS country,
    geo.region AS region,
    geo.city AS city,
    device.language AS language,
    page_location,
    page_referrer,
    traffic_source.source AS traffic_source,
    traffic_source.medium AS traffic_medium,
    traffic_source.name AS traffic_campaign,
    item_name,
    item_category,
    item_category2,
    item_brand,
    item_variant,
    SAFE_CAST(price AS NUMERIC) AS price,
    event_currency AS currency,
    COALESCE(quantity, 1) AS quantity,
    'Google Analytics 4' AS source_system,
    'ecommerce_item' AS source_record_type,
    'analytics_123456789.events_*' AS source_dataset,
    TIMESTAMP_ADD(event_timestamp, INTERVAL COALESCE(event_server_timestamp_offset, 0) MICROSECOND) AS ingestion_timestamp,
    event_timestamp AS record_created_at,
    CURRENT_TIMESTAMP() AS record_updated_at,
    CASE
      WHEN raw_listing_verification_status IS NULL THEN 'status_missing'
      WHEN listing_verification_status = 'unknown' THEN 'status_unrecognized'
      ELSE 'valid'
    END AS data_quality_status
  FROM ranked
  WHERE current_row_number = 1;

AEP Query Service SQL: |

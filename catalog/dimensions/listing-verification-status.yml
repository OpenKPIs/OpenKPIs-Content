Dimension Name: Listing Verification Status

Description: |
  Listing Verification Status identifies the authoritative verification state of a real-estate listing at a specified point in time. It shows whether required ownership, authorization, identity, document, and property checks have not started, are in review, passed, failed, expired, been revoked, or are not required.

Category: Quality

Tags: [dimension]

Industry: Real Estate Tech

Priority: High

Core Area: Discovery

Scope: Item

Data Type: string

Aggregation Window: Event (as of the event timestamp); Time based - Daily for historical status snapshots


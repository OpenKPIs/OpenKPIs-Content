  {"digitalData":{"event":[{"category":{"primaryCategory":"assessment"},"eventInfo":{"eventName":"view_item"},"attributes":{"assessmentType":"formative"}}],"product":[{"category":{"subCategory1":"formative","primaryCategory":"assessment"},"attributes":{"assessmentType":"formative"},"productInfo":{"productName":"Digital assessment"}}]}}


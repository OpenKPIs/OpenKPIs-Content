Dimension Name: Assessment Type

Description: |
  Classifies a digital assessment according to its governed pedagogical purpose, such as diagnostic, formative, summative, practice, placement, or certification. It enables performance, completion, integrity, and learner-progression outcomes to be compared across assessment categories without conflating purpose with delivery format or question type.

Category: Performance

Tags: [dimension]

Industry: EdTech & E-Learning

Priority: High

Core Area: Engagement

Scope: Item

Data Type: string

Aggregation Window: Event

GA4 Event: |
  item_category

Adobe Event: |
  view_item


Dimension Name: Support Channel

Description: |
  The customer-facing channel through which a shopper opened an inbound support contact (Live Chat, Email, Phone, Contact Form, Social Media, Messaging or Self-Service Help Center), normalised from the helpdesk origin field: Zendesk via.channel, Salesforce Service Cloud Case Origin, or the Gorgias ticket channel. Unmapped origins fall under Other and empty origins under Unknown, and bot-contained chat sessions that never reach a human agent are classified as Self-Service Help Center. It is the standard breakdown for contact volume, deflection, handling cost and resolution performance, and covers only customer-initiated support, unlike Notification Channel, which classifies outbound brand messages.

Category: Experience




























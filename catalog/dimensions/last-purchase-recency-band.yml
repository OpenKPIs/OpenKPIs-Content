  WITH params AS (
    SELECT
      CAST('2026-09-14' AS DATE) AS snapshot_start_date,
      CAST('2026-09-14' AS DATE) AS snapshot_end_date,
      'America/New_York' AS reporting_tz
  ),
  snapshots AS (
    SELECT explode(sequence(p.snapshot_start_date, p.snapshot_end_date, INTERVAL 1 DAY)) AS snapshot_date
    FROM params AS p
  ),
  customer_master AS (

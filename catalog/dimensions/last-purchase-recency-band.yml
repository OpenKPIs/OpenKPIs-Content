      customer_id,
      last_order_date,
      days_since_last_purchase,
      CASE
        WHEN last_order_date IS NULL THEN 'No purchase'
        WHEN days_since_last_purchase <= 30 THEN '0-30 days'
        WHEN days_since_last_purchase <= 90 THEN '31-90 days'
        WHEN days_since_last_purchase <= 180 THEN '91-180 days'
        WHEN days_since_last_purchase <= 365 THEN '181-365 days'
        ELSE '366+ days'
      END AS last_purchase_recency_band,
      CASE
        WHEN last_order_date IS NULL THEN 6
        WHEN days_since_last_purchase <= 30 THEN 1
        WHEN days_since_last_purchase <= 90 THEN 2
        WHEN days_since_last_purchase <= 180 THEN 3
        WHEN days_since_last_purchase <= 365 THEN 4

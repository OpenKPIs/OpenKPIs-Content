Dimension Name: Last Purchase Recency Band

Description: |
  Last Purchase Recency Band groups each customer by the number of calendar days between their most recent completed order and the analysis date, using default bands of 0-30, 31-90, 91-180, 181-365 and 366+ days plus No purchase for registered customers who have never ordered. It is the standard recency cut behind Klaviyo and Shopify win-back and lapsed-customer segments and the 12-month active-customer convention, and it measures elapsed time only, leaving the churn decision to Customer Churn Rate and lifecycle labels to Customer Status.

Category: Retention




























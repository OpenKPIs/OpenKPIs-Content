  -- 2. ADOBE AEP QUERY SERVICE SQL
  -- ==========================================
  -- Last Purchase Recency Band per registered customer and snapshot date, rolled up to the band distribution over all registered customers in scope.
  -- Backend datasets: commerce_orders_dataset + crm_customer_profile_dataset + crm_customer_id_map_dataset (no web ExperienceEvent data).

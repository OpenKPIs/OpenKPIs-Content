    FROM customer_master AS cm
    CROSS JOIN params AS p
    GROUP BY cm.customer_id, p.reporting_tz
    HAVING SUM(CASE WHEN cm.erased_at IS NOT NULL THEN 1 ELSE 0 END) = 0
      AND SUM(CASE WHEN COALESCE(cm.is_test_account, false) THEN 1 ELSE 0 END) = 0
  ),
  verified_emails AS (
    SELECT
      email_sha256,
      MIN(customer_id) AS customer_id
    FROM customer_master
    WHERE email_verified = true
      AND email_sha256 IS NOT NULL
      AND erased_at IS NULL
    GROUP BY email_sha256
    HAVING COUNT(DISTINCT customer_id) = 1

      ON o.customer_id IS NULL
      AND ve.email_sha256 = o.customer_email_sha256
    WHERE to_date(from_utc_timestamp(o.order_placed_at, p.reporting_tz)) <= p.snapshot_end_date
      AND (o.order_status = 'completed' OR o.financial_status IN ('paid', 'partially_refunded', 'refunded'))
      AND COALESCE(o.order_status, '') NOT IN ('cancelled', 'voided', 'draft')
      AND o.cancelled_at IS NULL
      AND COALESCE(o.fraud_status, 'not_reviewed') <> 'rejected'
      AND COALESCE(o.is_test_order, false) = false
      AND COALESCE(o.is_staff_order, false) = false
      AND NOT (o.total_price = 0 AND COALESCE(o.order_type, '') IN ('replacement', 'warranty_reship'))
      -- Optional win-back view only (document on the dashboard): AND COALESCE(o.order_source, '') <> 'subscription_renewal'

    last_purchase_recency_band,
    customers,
    SUM(customers) OVER (PARTITION BY snapshot_date) AS registered_customers_in_scope,
    ROUND(100.0 * customers / NULLIF(SUM(customers) OVER (PARTITION BY snapshot_date), 0), 2) AS pct_of_registered_customers,

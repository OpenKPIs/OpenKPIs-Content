Dimension Name: Ticket Category

Description: |
  The main reason a customer contacted support by ticket, chat, call or email, taken from a fixed list: order_status, shipping_delay, returns_refunds, payment_issue, product_question, account_access and other. Inquiry Type records what a prospect wants before a sale in Real Estate property inquiries; Ticket Category records why a customer contacted support after buying in e-commerce, and it is not the same as the Zendesk Ticket Type field (question, incident, problem, task).


Dimension Name: Content Acquisition Type

Description: |
  Classifies each content item by the commercial or editorial method through which the media company obtained the right to distribute it, such as commissioned original, licensed exclusive, licensed non-exclusive, co-production, syndicated, partner-supplied, user-generated, or public-domain content. It enables comparison of discovery, customer acquisition, engagement, conversion, retention, billing outcomes, and lifetime value across content sourcing models.

Category: Acquisition

Tags: [dimension]

Industry: Media & Streaming

Priority: High

Core Area: Engagement

Scope: Item

Data Type: string

Aggregation Window: Event

GA4 Event: |
  view_item

Adobe Event: |
  view_item


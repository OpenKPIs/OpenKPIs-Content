Dimension Name: Temperature Control Requirement

Description: |
  Temperature Control Requirement classifies the prescribed thermal regime that must be maintained for an item during storage, handling, and transportation. It represents the approved requirement used for planning and compliance evaluation, not the temperature actually recorded by a sensor.

Category: Quality

Tags: [dimension]

Industry: Logistics & Supply Chain

Priority: High

Core Area: Generic

Scope: Item

Data Type: string

Aggregation Window: Event









Calculation Notes: |
  1️⃣ Resolve requirements at shipment-item and leg level using effective dates.  
  2️⃣ Apply the most specific authorized value in the following order:  
     - Approved shipment-leg exception  
     - Approved shipment-item instruction  
     - Customer-order requirement  
     - Product-market regulatory profile  
     - Global product profile  
  3️⃣ Do not infer requirements from sensor readings, packaging labels, or other external factors.  
  4️⃣ Flag conflicting active requirements for quality review instead of automatic resolution.  
  5️⃣ CUSTOM_CONTROLLED_RANGE is valid only with approved temperature boundaries and unit.  
  6️⃣ Convert source labels to canonical classification without altering original values.  
  7️⃣ Evaluate late corrections against the requirement valid at the start of the shipment leg.

Business Use Case: |
  A supply chain executive reviews upcoming volume by temperature-control requirement, lane, carrier, and facility to identify refrigerated or frozen demand that exceeds qualified capacity. Operations can reassign shipments to validated carriers and cold-storage facilities before dispatch, while Quality can block controlled items whose requirement is UNKNOWN, conflicting, or unsupported by the planned service.


Source Data: Transportation Management System, Warehouse Management System, ERP product master, Order Management System, Quality Management System, product regulatory master, and validated customer shipping instructions


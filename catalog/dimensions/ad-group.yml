Dimension Name: Ad Group

Description: |
  The ad group (Google Ads, Microsoft Advertising) or ad set (Meta) inside a paid campaign that served the ad a visitor clicked, attributed to the session that the click started so traffic, conversions and revenue can be read at the targeting-and-bid layer below the campaign. Performance marketers use it to decide which audience, keyword theme or product cluster in a campaign earns more budget, which one gets restructured and which one gets paused.

Category: Acquisition

Tags: [dimension, E-commerce: Top-of-Funnel & Marketing Acquisition]

Industry: E-commerce

Priority: High

Core Area: Discovery

Scope: Session

Data Type: string

Aggregation Window: Session, Daily, Weekly, Monthly


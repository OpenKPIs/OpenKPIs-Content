Google Analytics SQL: |
  -- ==========================================
  -- 1. GOOGLE BIGQUERY SQL
  -- ==========================================
  -- Ad Group (session scope): first resolved paid ad group of each session with traffic, conversion and revenue outcomes.
  -- Window D-30 to D-3 so click-to-session resolution and platform imports have settled.
  WITH events AS (
    SELECT
      user_pseudo_id,
      event_name,
      event_timestamp,
      PARSE_DATE('%Y%m%d', event_date) AS event_date,
      (SELECT value.int_value FROM UNNEST(event_params) WHERE key = 'ga_session_id') AS ga_session_id,
      (SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'page_location') AS page_location,
      (SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'traffic_type') AS traffic_type,
      (SELECT COALESCE(value.string_value, CAST(value.int_value AS STRING)) FROM UNNEST(event_params) WHERE key = 'ad_group_id') AS dl_ad_group_id,
      (SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'ad_group_name') AS dl_ad_group_name,
      (SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'ad_platform') AS dl_ad_platform,
      CAST(session_traffic_source_last_click.google_ads_campaign.ad_group_id AS STRING) AS gads_ad_group_id,
      session_traffic_source_last_click.google_ads_campaign.ad_group_name AS gads_ad_group_name,
      session_traffic_source_last_click.manual_campaign.source AS session_source,
      session_traffic_source_last_click.manual_campaign.medium AS session_medium,
      session_traffic_source_last_click.manual_campaign.campaign_name AS session_campaign,
      session_traffic_source_last_click.manual_campaign.content AS session_utm_content,
      session_traffic_source_last_click.cross_channel_campaign.default_channel_group AS channel_group,
      collected_traffic_source.gclid AS gclid,
      ecommerce.transaction_id AS transaction_id,
      ecommerce.purchase_revenue AS purchase_revenue
    FROM `your-project.analytics_123456789.events_*`
    WHERE _TABLE_SUFFIX BETWEEN FORMAT_DATE('%Y%m%d', DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY))
                            AND FORMAT_DATE('%Y%m%d', DATE_SUB(CURRENT_DATE(), INTERVAL 3 DAY))
  ),
  sessions AS (
    SELECT
      user_pseudo_id,
      ga_session_id,
      MIN(event_date) AS session_date,
      ARRAY_AGG(COALESCE(NULLIF(TRIM(gads_ad_group_id), ''), NULLIF(TRIM(dl_ad_group_id), '')) IGNORE NULLS ORDER BY event_timestamp LIMIT 1)[SAFE_OFFSET(0)] AS ad_group_id,
      ARRAY_AGG(COALESCE(NULLIF(TRIM(gads_ad_group_name), ''), NULLIF(TRIM(dl_ad_group_name), ''), NULLIF(TRIM(session_utm_content), '')) IGNORE NULLS ORDER BY event_timestamp LIMIT 1)[SAFE_OFFSET(0)] AS ad_group_name,
      ARRAY_AGG(CASE
                  WHEN NULLIF(TRIM(gads_ad_group_name), '') IS NOT NULL OR gclid IS NOT NULL THEN 'Google Ads'
                  WHEN REGEXP_CONTAINS(IFNULL(page_location, ''), r'[?&]msclkid=') THEN 'Microsoft Advertising'
                  WHEN REGEXP_CONTAINS(IFNULL(page_location, ''), r'[?&]fbclid=') THEN 'Meta Ads'
                  ELSE NULLIF(TRIM(dl_ad_platform), '')
                END IGNORE NULLS ORDER BY event_timestamp LIMIT 1)[SAFE_OFFSET(0)] AS ad_platform,
      ARRAY_AGG(session_source IGNORE NULLS ORDER BY event_timestamp LIMIT 1)[SAFE_OFFSET(0)] AS session_source,
      ARRAY_AGG(session_campaign IGNORE NULLS ORDER BY event_timestamp LIMIT 1)[SAFE_OFFSET(0)] AS session_campaign,
      ARRAY_AGG(channel_group IGNORE NULLS ORDER BY event_timestamp LIMIT 1)[SAFE_OFFSET(0)] AS channel_group,
      LOGICAL_OR(traffic_type = 'internal') AS is_internal,
      LOGICAL_OR(gclid IS NOT NULL OR REGEXP_CONTAINS(IFNULL(page_location, ''), r'[?&](gclid|gbraid|wbraid|msclkid|fbclid)=')) AS has_click_id,
      LOGICAL_OR(REGEXP_CONTAINS(LOWER(IFNULL(session_medium, '')), r'^(cpc|ppc|paid.*|paidsearch|paidsocial|display)$')) AS is_paid_medium,
      COUNT(DISTINCT IF(event_name = 'purchase', transaction_id, NULL)) AS orders,
      SUM(IF(event_name = 'purchase', IFNULL(purchase_revenue, 0), 0)) AS revenue
    FROM events
    WHERE ga_session_id IS NOT NULL
    GROUP BY user_pseudo_id, ga_session_id
  ),
  classified AS (
    SELECT
      s.*,
      CASE
        WHEN COALESCE(s.ad_group_id, s.ad_group_name) IS NOT NULL THEN 'resolved'
        WHEN s.channel_group = 'Cross-network' THEN 'asset_group'
        WHEN s.is_paid_medium OR s.has_click_id THEN 'unresolved_paid'
        ELSE 'not_set'
      END AS resolution_status,
      COALESCE(s.ad_group_id, LOWER(s.ad_group_name)) AS ad_group_key
    FROM sessions AS s
    WHERE NOT IFNULL(s.is_internal, FALSE)
      AND NOT REGEXP_CONTAINS(LOWER(IFNULL(s.session_campaign, '')), r'(^|[_ -])(test|qa)([_ -]|$)')
  ),
  latest_names AS (
    SELECT
      ad_group_key,
      ARRAY_AGG(ad_group_name IGNORE NULLS ORDER BY session_date DESC LIMIT 1)[SAFE_OFFSET(0)] AS latest_name
    FROM classified
    WHERE resolution_status = 'resolved'
    GROUP BY ad_group_key
  )
  SELECT
    COALESCE(c.ad_platform, c.session_source, '(not set)') AS ad_platform,
    IF(c.resolution_status = 'resolved', c.ad_group_id, NULL) AS ad_group_id,
    CASE c.resolution_status
      WHEN 'resolved' THEN COALESCE(n.latest_name, c.ad_group_id)
      WHEN 'asset_group' THEN CONCAT('(asset group) ', COALESCE(c.session_campaign, '(not set)'))
      WHEN 'unresolved_paid' THEN '(unresolved paid)'
      ELSE '(not set)'
    END AS ad_group,
    COUNT(*) AS sessions,
    COUNT(DISTINCT c.user_pseudo_id) AS users,
    COUNTIF(c.orders > 0) AS converting_sessions,
    SUM(c.orders) AS orders,
    ROUND(SUM(c.revenue), 2) AS revenue,
    SAFE_DIVIDE(COUNTIF(c.orders > 0), COUNT(*)) AS session_conversion_rate,
    SAFE_DIVIDE(SUM(c.revenue), COUNT(*)) AS revenue_per_session,
    SAFE_DIVIDE(COUNTIF(c.resolution_status != 'not_set'), SUM(COUNTIF(c.resolution_status != 'not_set')) OVER ()) AS share_of_paid_sessions,
    SAFE_DIVIDE(COUNT(*), SUM(COUNT(*)) OVER ()) AS share_of_all_sessions
  FROM classified AS c
  LEFT JOIN latest_names AS n
    ON n.ad_group_key = c.ad_group_key
  GROUP BY 1, 2, 3
  ORDER BY sessions DESC;

AEP Query Service SQL: |
  -- ==========================================
  -- 2. ADOBE AEP QUERY SERVICE SQL
  -- ==========================================
  -- Ad Group (session scope, 30-minute inactivity timeout): first resolved paid ad group of each session with traffic, conversion and revenue outcomes.
  -- Window D-30 to D-3 so click-to-session resolution and platform imports have settled.
  WITH hits AS (
    SELECT
      endUserIDs._experience.ecid.id AS ecid,
      timestamp AS hit_ts,
      eventType AS event_type,
      NULLIF(TRIM(_experience.analytics.customDimensions.eVars.eVar13), '') AS dl_ad_group_id,
      COALESCE(NULLIF(TRIM(_experience.analytics.customDimensions.eVars.eVar12), ''), NULLIF(TRIM(marketing.campaignGroup), '')) AS dl_ad_group_name,
      NULLIF(TRIM(_experience.analytics.customDimensions.eVars.eVar14), '') AS dl_ad_platform,
      marketing.campaignName AS campaign_name,
      web.webPageDetails.URL AS page_url,
      commerce.order.purchaseID AS purchase_id,
      commerce.order.priceTotal AS order_total,
      SESS_TIMEOUT(timestamp, 60 * 30) OVER (
        PARTITION BY endUserIDs._experience.ecid.id
        ORDER BY timestamp
        ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW
      ) AS session
    FROM aep_web_events_dataset
    WHERE timestamp >= date_sub(current_date(), 30)
      AND timestamp < date_sub(current_date(), 2)
      AND endUserIDs._experience.ecid.id IS NOT NULL
  ),
  hit_attrs AS (
    SELECT
      ecid,
      session.num AS session_num,
      hit_ts,
      event_type,
      purchase_id,
      order_total,
      COALESCE(campaign_name, parse_url(page_url, 'QUERY', 'utm_campaign')) AS campaign,
      dl_ad_group_id AS hit_ad_group_id,
      COALESCE(dl_ad_group_name, NULLIF(TRIM(parse_url(page_url, 'QUERY', 'utm_content')), '')) AS hit_ad_group_name,
      CASE
        WHEN dl_ad_platform IS NOT NULL THEN dl_ad_platform
        WHEN COALESCE(parse_url(page_url, 'QUERY', 'gclid'), parse_url(page_url, 'QUERY', 'gbraid'), parse_url(page_url, 'QUERY', 'wbraid')) IS NOT NULL THEN 'Google Ads'
        WHEN parse_url(page_url, 'QUERY', 'msclkid') IS NOT NULL THEN 'Microsoft Advertising'
        WHEN parse_url(page_url, 'QUERY', 'fbclid') IS NOT NULL THEN 'Meta Ads'
        ELSE NULLIF(LOWER(parse_url(page_url, 'QUERY', 'utm_source')), '')
      END AS hit_ad_platform,
      CASE WHEN COALESCE(parse_url(page_url, 'QUERY', 'gclid'), parse_url(page_url, 'QUERY', 'gbraid'), parse_url(page_url, 'QUERY', 'wbraid'),
                         parse_url(page_url, 'QUERY', 'msclkid'), parse_url(page_url, 'QUERY', 'fbclid')) IS NOT NULL THEN 1 ELSE 0 END AS has_click_id,
      CASE WHEN LOWER(COALESCE(parse_url(page_url, 'QUERY', 'utm_medium'), '')) RLIKE '^(cpc|ppc|paid.*|paidsearch|paidsocial|display)$' THEN 1 ELSE 0 END AS is_paid_medium
    FROM hits
  ),
  session_first AS (
    SELECT
      ecid,
      session_num,
      hit_ts,
      event_type,
      purchase_id,
      order_total,
      has_click_id,
      is_paid_medium,
      first_value(hit_ad_group_id, true) OVER w AS s_ad_group_id,
      first_value(hit_ad_group_name, true) OVER w AS s_ad_group_name,
      first_value(hit_ad_platform, true) OVER w AS s_ad_platform,
      first_value(campaign, true) OVER w AS s_campaign
    FROM hit_attrs
    WINDOW w AS (PARTITION BY ecid, session_num ORDER BY hit_ts ROWS BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING)
  ),
  sessions AS (
    SELECT
      ecid,
      session_num,
      CAST(MIN(hit_ts) AS DATE) AS session_date,
      MAX(s_ad_group_id) AS ad_group_id,
      MAX(s_ad_group_name) AS ad_group_name,
      MAX(s_ad_platform) AS ad_platform,
      MAX(s_campaign) AS campaign,
      MAX(has_click_id) AS has_click_id,
      MAX(is_paid_medium) AS is_paid_medium,
      COUNT(DISTINCT CASE WHEN event_type = 'commerce.purchases' THEN purchase_id END) AS orders,
      SUM(CASE WHEN event_type = 'commerce.purchases' THEN COALESCE(order_total, 0) ELSE 0 END) AS revenue
    FROM session_first
    GROUP BY ecid, session_num
  ),
  classified AS (
    SELECT
      s.*,
      CASE
        WHEN COALESCE(s.ad_group_id, s.ad_group_name) IS NOT NULL THEN 'resolved'
        WHEN s.is_paid_medium = 1 OR s.has_click_id = 1 THEN 'unresolved_paid'
        ELSE 'not_set'
      END AS resolution_status,
      COALESCE(s.ad_group_id, LOWER(s.ad_group_name)) AS ad_group_key
    FROM sessions AS s
    WHERE NOT (LOWER(COALESCE(s.campaign, '')) RLIKE '(^|[_ -])(test|qa)([_ -]|$)')
  ),
  latest_names AS (
    SELECT ad_group_key, ad_group_name AS latest_name
    FROM (
      SELECT
        ad_group_key,
        ad_group_name,
        ROW_NUMBER() OVER (PARTITION BY ad_group_key ORDER BY session_date DESC) AS rn
      FROM classified
      WHERE resolution_status = 'resolved' AND ad_group_name IS NOT NULL
    ) ranked
    WHERE rn = 1
  )
  SELECT
    COALESCE(c.ad_platform, '(not set)') AS ad_platform,
    CASE WHEN c.resolution_status = 'resolved' THEN c.ad_group_id END AS ad_group_id,
    CASE c.resolution_status
      WHEN 'resolved' THEN COALESCE(n.latest_name, c.ad_group_id)
      WHEN 'unresolved_paid' THEN '(unresolved paid)'
      ELSE '(not set)'
    END AS ad_group,
    COUNT(*) AS sessions,
    COUNT(DISTINCT c.ecid) AS visitors,
    SUM(CASE WHEN c.orders > 0 THEN 1 ELSE 0 END) AS converting_sessions,
    SUM(c.orders) AS orders,
    ROUND(SUM(c.revenue), 2) AS revenue,
    SUM(CASE WHEN c.orders > 0 THEN 1 ELSE 0 END) / NULLIF(COUNT(*), 0) AS session_conversion_rate,
    SUM(c.revenue) / NULLIF(COUNT(*), 0) AS revenue_per_session,
    SUM(CASE WHEN c.resolution_status <> 'not_set' THEN 1 ELSE 0 END)
      / NULLIF(SUM(SUM(CASE WHEN c.resolution_status <> 'not_set' THEN 1 ELSE 0 END)) OVER (), 0) AS share_of_paid_sessions,
    COUNT(*) / NULLIF(SUM(COUNT(*)) OVER (), 0) AS share_of_all_sessions
  FROM classified AS c
  LEFT JOIN latest_names AS n
    ON n.ad_group_key = c.ad_group_key
  GROUP BY 1, 2, 3
  ORDER BY sessions DESC;

Calculation Notes: |
  1️⃣ Resolution order per session: Google Ads auto-tagging (gclid / gbraid / wbraid resolved via the linked Google Ads account into GA4 sessionGoogleAdsAdGroupName) takes precedence; Microsoft Advertising resolves through msclkid auto-tagging with the {AdGroup} URL parameter as fallback; Meta and other platforms resolve from the governed UTM convention (utm_content = ad group or ad set name, populated with dynamic macros such as {{adset.name}}). Manual UTMs never overwrite an auto-tagged value in the same session.,2️⃣ Session scope and timing: the value is fixed at session_start from the landing-page click identifiers and persists for the whole session under the 30-minute inactivity timeout; a new paid click with different campaign parameters mid-session starts a new session in Universal-Analytics-style implementations but not in GA4, so GA4 keeps the first ad group of the session and a later click is only visible at event level.,3️⃣ Attribution model: session-scoped reporting uses last non-direct click, so a direct return visit within the 90-day lookback inherits the prior paid ad group; user-scoped (first-user) and conversion-scoped (data-driven attribution) variants must be reported as separate columns and never mixed with the session value in the same table.,4️⃣ Identity key over label: join and trend on ad group ID (Google Ads ad_group_id, Microsoft AdGroupId, Meta adset_id) and display the most recent name from the platform dimension table, because renames otherwise split one ad group into several rows; names are trimmed and compared case-insensitively before any cross-platform rollup.,5️⃣ Null handling: non-paid sessions return (not set) and are excluded from ad group rankings but kept in totals; paid sessions with a click ID that failed to resolve (unlinked account, consent denied, gclid stripped by redirects or ITP) are reported as a distinct '(unresolved paid)' bucket so tagging breakage is visible rather than silently blended into organic.,6️⃣ Exclusions: internal and QA traffic (internal IP filter, traffic_type = internal), known bot user agents, and sessions from test campaigns flagged in the campaign naming taxonomy are removed; Performance Max, Advantage+ Shopping and Demand Gen asset groups are not ad groups and are mapped to their own asset-group value rather than forced into this dimension.,7️⃣ Reconciliation window: GA4 click-to-session resolution and platform cost imports settle within 24–72 hours, so ad group reporting that joins platform cost and clicks to GA4 sessions and revenue is treated as final only after day D+3; expect a 5–15% variance between platform clicks and GA4 sessions from consent mode, multiple clicks per session and bounced landings.

Business Use Case: |
  1️⃣ The Paid Search team reviews ad group ROAS and conversion rate every Monday; any ad group spending above its target CPA for two consecutive weeks has bids cut 20% or is paused, and budget moves to the top-quartile ad groups in the same campaign.,2️⃣ The Paid Social team compares Meta ad sets by new-customer rate and average order value from GA4 after each creative refresh; ad sets whose audience delivers below the account's new-customer baseline are consolidated or narrowed before the next flight is launched.,3️⃣ The Merchandising team checks product-category revenue by Shopping and Search ad group before seasonal promotions; ad groups driving traffic to low-stock or low-margin items are flagged so Paid Search excludes those products or rebuilds the ad group around in-stock alternatives.,4️⃣ Marketing Operations monitors the share of paid sessions landing in the '(unresolved paid)' ad group bucket daily; when it exceeds 5% the team audits auto-tagging, account links and UTM templates on the affected campaigns before the next reporting cycle.


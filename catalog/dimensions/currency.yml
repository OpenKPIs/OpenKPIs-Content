Dimension Name: Currency

Description: |
  Currency is the three-letter ISO 4217 code (for example USD, EUR, GBP, JPY) in which the monetary values of an ecommerce interaction are denominated, captured as the GA4 `currency` parameter on every event that carries `value`, from view_item and add_to_cart through begin_checkout, add_payment_info, purchase and refund. It is the currency the shopper was shown and charged in (the presentment currency), so Finance, Merchandising and Marketing can split revenue, order value and funnel conversion by currency market and reconcile analytics revenue with settlement before converting to a single reporting currency.

Category: Monetization

Tags: [dimension, E-commerce: Cart & Checkout Funnel Analytics]

Industry: E-commerce

Priority: High

Core Area: Checkout

Scope: Event

Data Type: string

Aggregation Window: Event, Daily, Weekly, Monthly


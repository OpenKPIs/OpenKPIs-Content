Dimension Name: Item ID

Description: |
  Item ID is the unique product identifier (SKU or product ID) attached to every ecommerce item interaction, from list impressions and product detail views through add-to-cart, checkout, purchase and refund, and it is the primary join key between behavioural data and the product catalog. It lets Merchandising and Product teams attribute views, cart activity, units and revenue to the exact sellable item, so product-level performance, inventory and feed decisions rest on one consistent key rather than on free-text product names.

Category: Performance




























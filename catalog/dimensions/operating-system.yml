Dimension Name: Operating System

Description: |
  The operating system family of the device behind a session: Windows, Macintosh, iOS, Android, Linux, Chrome OS or (not set). GA4 and Adobe collect it automatically; no tagging needed.

Category: Experience

Tags: [dimension, E-commerce: Cart & Checkout Funnel Analytics]

Industry: E-commerce

Priority: Medium

Core Area: Checkout

Scope: Session

Data Type: string

Aggregation Window: Session, Daily, Weekly, Monthly


Calculation Notes: |
  1️⃣ Use event-time version for event-type-to-stage mapping.  
  2️⃣ Deduplicate events using source event identifier or composite key.  
  3️⃣ Apply tie-breakers for simultaneous events: source sequence number, ingestion sequence, governed stage order.  
  4️⃣ Exclude test, training, deleted, and heartbeat events.  
  5️⃣ Cancellations remain with the original stage, not as a separate stage.  
  6️⃣ Map post-delivery reverse-logistics events to Return.  
  7️⃣ Use Unknown for unmapped qualifying events; Not Applicable for out-of-scope records.

Business Use Case: |
  The Chief Supply Chain Officer reviews cycle time, backlog, exception volume, and cost by Supply Chain Stage to locate persistent bottlenecks. If the Receive stage shows increasing dwell time at selected facilities, operations can add receiving capacity, revise appointment schedules, or address supplier advanced-shipping-notice compliance.


Source Data: Transportation Management System, Warehouse Management System, Order Management System, Enterprise Resource Planning, Procurement Platform, Manufacturing Execution System, Supplier EDI, and Carrier Event Feeds


Calculation Notes: |
  1️⃣ Assign trade lane based on origin and destination using hierarchy (facility, port, city, country, region).  
  2️⃣ Preserve directionality: Origin A to Destination B is different from Origin B to Destination A.  
  3️⃣ Use planned commercial origin and destination for end-to-end analysis; leg-level only for transport leg reporting.  
  4️⃣ Normalize location identifiers via location master before lane assignment; use stable lane codes.  
  5️⃣ For multiple modes, retain one end-to-end trade lane and analyze legs through Route or Transportation Mode.  
  6️⃣ Apply lane definition effective at booking time; late corrections follow approved restatement policy.  
  7️⃣ Assign 'Unknown Trade Lane' for one missing endpoint; 'Unmapped Trade Lane' for both endpoints not in location master.

Business Use Case: |
  Transportation Network Planning reviews cost, volume, capacity utilization, on-time delivery, and transit-time variability by trade lane to identify corridors with persistent cost or service issues. The team can then rebid carrier capacity, consolidate shipments, change routing guides, reposition equipment, adjust service commitments, or prioritize new consolidation hubs on the affected lanes.



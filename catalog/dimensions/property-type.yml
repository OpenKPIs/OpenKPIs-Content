Dimension Name: Property Type

Description: |
  Property Type classifies the physical real estate asset associated with a property or listing into a governed category such as apartment, single-family home, office, retail, land, or mixed-use. It enables consistent analysis of inventory, discovery, engagement, conversion, pricing, and transaction performance across asset categories.

Category: Conversion

Tags: [dimension]

Industry: Technology

Priority: High

Core Area: Discovery

Scope: Item

Data Type: string


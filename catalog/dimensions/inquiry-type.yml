Dimension Name: Inquiry Type

Description: |
  Inquiry Type identifies the standardized primary purpose of a property-related inquiry submitted by a prospect, customer, owner, or partner. It enables comparison of inquiry volume, response performance, lead quality, and downstream conversion by expressed intent.

Category: Conversion

Tags: [dimension]

Industry: Real Estate Tech

Priority: High

Core Area: Engagement

Scope: Event

Data Type: string

Aggregation Window: Event


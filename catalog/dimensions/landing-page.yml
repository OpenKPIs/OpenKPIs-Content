Dimension Name: Landing Page

Description: |
  Session-scoped attribute holding the normalised page path (with an allow-listed query string) of the first page view in a session, equivalent to GA4 'Landing page + query string', Adobe Analytics 'Entry Page' and Shopify 'Sessions by landing page'. It fixes the entry point for every session-level outcome (engaged sessions, bounces, add-to-carts, orders, revenue), so acquisition, SEO and merchandising teams can judge which entry experiences turn paid and organic traffic into buyers.

Category: Acquisition

Tags: [dimension, E-commerce: Top-of-Funnel & Marketing Acquisition]

Industry: E-commerce

Priority: High

Core Area: Discovery

Scope: Session

Data Type: string

Aggregation Window: Session, Daily, Weekly, Monthly


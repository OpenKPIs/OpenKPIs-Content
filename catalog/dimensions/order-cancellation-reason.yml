Google Analytics SQL: |
  -- ==========================================
  -- 1. GOOGLE BIGQUERY SQL
  -- ==========================================
  -- Order Cancellation Reason x Cancel Initiator for the order-placed cohort: orders placed 44 to 15 days ago (pre-ship window elapsed), cancellations read through yesterday
  -- Cancellation rate denominator = all distinct purchase transaction_id in the cohort, including orders later cancelled; reason mix is reported separately as share_of_cancelled_orders
  WITH purchase_events AS (
    SELECT
      e.event_timestamp,
      COALESCE(
        NULLIF(NULLIF(e.ecommerce.transaction_id, '(not set)'), ''),
        (SELECT MAX(IF(ep.key = 'transaction_id', ep.value.string_value, NULL)) FROM UNNEST(e.event_params) AS ep)
      ) AS transaction_id,
      (SELECT SUM(COALESCE(i.quantity, 0)) FROM UNNEST(e.items) AS i) AS units_ordered,
      e.items
    FROM `your-project.analytics_123456789.events_*` AS e
    WHERE _TABLE_SUFFIX BETWEEN FORMAT_DATE('%Y%m%d', DATE_SUB(CURRENT_DATE(), INTERVAL 44 DAY))
                            AND FORMAT_DATE('%Y%m%d', DATE_SUB(CURRENT_DATE(), INTERVAL 15 DAY))
      AND e.event_name = 'purchase'
  ),
  orders_placed AS (
    SELECT transaction_id, event_timestamp AS purchase_timestamp, units_ordered, items
    FROM purchase_events
    WHERE transaction_id IS NOT NULL
    QUALIFY ROW_NUMBER() OVER (PARTITION BY transaction_id ORDER BY event_timestamp) = 1
  ),
  purchase_lines AS (
    SELECT
      o.transaction_id,
      i.item_id,
      COALESCE(i.quantity, 0) AS quantity,
      COALESCE(i.price, 0) * COALESCE(i.quantity, 0) AS line_value
    FROM orders_placed AS o
    CROSS JOIN UNNEST(o.items) AS i
  ),
  -- Order-cancellation hits: GA4 refund with refund_type = order_cancellation; event_params pivoted once per hit
  refund_hits AS (
    SELECT
      e.event_timestamp,
      NULLIF(NULLIF(e.ecommerce.transaction_id, '(not set)'), '') AS ecommerce_transaction_id,
      (SELECT AS STRUCT
         MAX(IF(ep.key = 'transaction_id', ep.value.string_value, NULL)) AS transaction_id,
         MAX(IF(ep.key = 'refund_type', ep.value.string_value, NULL)) AS refund_type,
         MAX(IF(ep.key = 'cancellation_reason', ep.value.string_value, NULL)) AS cancellation_reason,
         MAX(IF(ep.key = 'cancellation_reason_raw', ep.value.string_value, NULL)) AS cancellation_reason_raw,
         MAX(IF(ep.key = 'cancel_initiator', ep.value.string_value, NULL)) AS cancel_initiator
       FROM UNNEST(e.event_params) AS ep) AS p,
      e.items
    FROM `your-project.analytics_123456789.events_*` AS e
    WHERE _TABLE_SUFFIX BETWEEN FORMAT_DATE('%Y%m%d', DATE_SUB(CURRENT_DATE(), INTERVAL 44 DAY))
                            AND FORMAT_DATE('%Y%m%d', DATE_SUB(CURRENT_DATE(), INTERVAL 1 DAY))
      AND e.event_name = 'refund'
  ),
  refund_events AS (
    SELECT
      h.event_timestamp,
      COALESCE(h.ecommerce_transaction_id, h.p.transaction_id) AS transaction_id,
      h.p.refund_type,
      h.p.cancellation_reason,
      h.p.cancellation_reason_raw,
      h.p.cancel_initiator,
      h.items
    FROM refund_hits AS h
  ),
  cancellation_events AS (
    SELECT
      r.transaction_id,
      r.event_timestamp,
      NULLIF(LOWER(TRIM(r.cancellation_reason)), '') AS reason_code,
      NULLIF(LOWER(TRIM(r.cancellation_reason_raw)), '') AS reason_raw_code,
      NULLIF(LOWER(TRIM(r.cancel_initiator)), '') AS initiator_code,
      COALESCE(ARRAY_LENGTH(r.items), 0) = 0 AS is_whole_order_action,
      r.items
    FROM refund_events AS r
    JOIN orders_placed AS o
      ON o.transaction_id = r.transaction_id
    WHERE LOWER(TRIM(r.refund_type)) = 'order_cancellation'
  ),
  -- Line grain: the reason on each cancelled line (item-scoped cancellation_reason, else the hit-level value); a hit without items cancels every purchased line
  cancelled_lines AS (
    SELECT
      c.transaction_id,
      COALESCE(
        NULLIF(LOWER(TRIM((SELECT MAX(IF(ip.key = 'cancellation_reason', ip.value.string_value, NULL)) FROM UNNEST(i.item_params) AS ip))), ''),
        c.reason_code
      ) AS reason_code,
      c.reason_raw_code,
      c.initiator_code,
      COALESCE(i.quantity, 0) AS units_cancelled,
      COALESCE(i.price, 0) * COALESCE(i.quantity, 0) AS value_cancelled
    FROM cancellation_events AS c
    CROSS JOIN UNNEST(c.items) AS i
    WHERE NOT c.is_whole_order_action
    UNION ALL
    SELECT
      c.transaction_id,
      c.reason_code,
      c.reason_raw_code,
      c.initiator_code,
      pl.quantity AS units_cancelled,
      pl.line_value AS value_cancelled
    FROM cancellation_events AS c
    JOIN purchase_lines AS pl
      ON pl.transaction_id = c.transaction_id
    WHERE c.is_whole_order_action
  ),
  order_cancel_units AS (
    SELECT transaction_id, SUM(units_cancelled) AS units_cancelled
    FROM cancelled_lines
    GROUP BY transaction_id
  ),
  ranked_cancellations AS (
    SELECT
      c.transaction_id,
      c.reason_code,
      c.reason_raw_code,
      c.initiator_code,
      ROW_NUMBER() OVER (PARTITION BY c.transaction_id ORDER BY c.event_timestamp DESC) AS rn,
      MAX(IF(c.is_whole_order_action, 1, 0)) OVER (PARTITION BY c.transaction_id) AS has_whole_order_action
    FROM cancellation_events AS c
  ),
  -- Order grain: an order counts as cancelled only when every line is cancelled; its reason is the one on the latest cancellation action (a partial cancellation never makes a cancelled order)
  cancelled_orders AS (
    SELECT
      r.transaction_id,
      r.reason_code,
      r.reason_raw_code,
      r.initiator_code
    FROM ranked_cancellations AS r
    JOIN orders_placed AS o
      ON o.transaction_id = r.transaction_id
    LEFT JOIN order_cancel_units AS cu
      ON cu.transaction_id = r.transaction_id
    WHERE r.rn = 1
      AND (r.has_whole_order_action = 1
           OR (o.units_ordered > 0 AND COALESCE(cu.units_cancelled, 0) >= o.units_ordered))
  ),
  grain_rows AS (
    SELECT 'order' AS grain, transaction_id, reason_code, reason_raw_code, initiator_code, 0 AS units_cancelled, 0.0 AS value_cancelled
    FROM cancelled_orders
    UNION ALL
    SELECT 'line' AS grain, transaction_id, reason_code, reason_raw_code, initiator_code, units_cancelled, value_cancelled
    FROM cancelled_lines
  ),
  -- Governed code -> display label; Shopify native cancel_reason codes resolve through the same lookup when the governed code is absent
  labelled AS (
    SELECT
      r.grain,
      r.transaction_id,
      r.units_cancelled,
      r.value_cancelled,
      CASE
        WHEN r.reason_code IS NULL AND r.reason_raw_code IS NULL THEN '(not set)'
        WHEN r.resolved_reason_code = 'customer_changed_mind' THEN 'Customer Changed Mind'
        WHEN r.resolved_reason_code = 'out_of_stock' THEN 'Inventory Unavailable'
        WHEN r.resolved_reason_code = 'fraud' THEN 'Fraud'
        WHEN r.resolved_reason_code = 'payment_declined' THEN 'Payment Declined'
        WHEN r.resolved_reason_code = 'staff_error' THEN 'Staff Error'
        WHEN r.resolved_reason_code = 'other' THEN 'Other'
        ELSE '(unmapped)'
      END AS cancellation_reason,
      CASE
        WHEN r.initiator_code IS NULL THEN '(not set)'
        WHEN r.initiator_code = 'customer' THEN 'Customer'
        WHEN r.initiator_code = 'merchant' THEN 'Merchant'
        WHEN r.initiator_code = 'system' THEN 'System'
        ELSE '(unmapped)'
      END AS cancel_initiator,
      CASE WHEN r.reason_raw_code = 'order_edit' THEN 1 ELSE 0 END AS is_order_edit
    FROM (
      SELECT
        g.*,
        COALESCE(
          g.reason_code,
          CASE g.reason_raw_code
            WHEN 'customer' THEN 'customer_changed_mind'
            WHEN 'inventory' THEN 'out_of_stock'
            WHEN 'fraud' THEN 'fraud'
            WHEN 'declined' THEN 'payment_declined'
            WHEN 'staff' THEN 'staff_error'
            WHEN 'other' THEN 'other'
            WHEN 'order_edit' THEN 'other'
          END
        ) AS resolved_reason_code
      FROM grain_rows AS g
    ) AS r
  ),
  totals AS (
    SELECT
      (SELECT COUNT(DISTINCT transaction_id) FROM orders_placed) AS orders_placed,
      (SELECT COUNT(DISTINCT transaction_id) FROM cancelled_orders) AS cancelled_orders_total
  )
  SELECT
    l.cancellation_reason,
    l.cancel_initiator,
    MAX(t.orders_placed) AS orders_placed,
    COUNT(DISTINCT IF(l.grain = 'order', l.transaction_id, NULL)) AS cancelled_orders,
    ROUND(SAFE_DIVIDE(COUNT(DISTINCT IF(l.grain = 'order', l.transaction_id, NULL)), MAX(t.orders_placed)), 4) AS cancellation_rate,
    ROUND(SAFE_DIVIDE(COUNT(DISTINCT IF(l.grain = 'order', l.transaction_id, NULL)), MAX(t.cancelled_orders_total)), 4) AS share_of_cancelled_orders,
    COUNT(DISTINCT IF(l.grain = 'order' AND l.is_order_edit = 1, l.transaction_id, NULL)) AS order_edit_cancelled_orders,
    COUNT(DISTINCT IF(l.grain = 'line', l.transaction_id, NULL)) AS orders_with_cancelled_lines,
    COUNTIF(l.grain = 'line') AS cancelled_lines,
    SUM(IF(l.grain = 'line', l.units_cancelled, 0)) AS units_cancelled,
    ROUND(SUM(IF(l.grain = 'line', l.value_cancelled, 0)), 2) AS cancelled_value
  FROM labelled AS l
  CROSS JOIN totals AS t
  GROUP BY l.cancellation_reason, l.cancel_initiator
  ORDER BY cancelled_orders DESC, units_cancelled DESC;

AEP Query Service SQL: |
  -- ==========================================
  -- 2. ADOBE AEP QUERY SERVICE SQL
  -- ==========================================
  -- Order Cancellation Reason x Cancel Initiator for the order-placed cohort: orders placed 44 to 15 days ago (pre-ship window elapsed), cancellations read through yesterday
  -- Cancellation rate denominator = all distinct commerce.purchases purchaseID in the cohort, including orders later cancelled; reason mix is reported separately as share_of_cancelled_orders
  WITH purchase_events AS (
    SELECT
      commerce.order.purchaseID AS transaction_id,
      timestamp AS purchase_ts,
      productListItems AS items,
      ROW_NUMBER() OVER (PARTITION BY commerce.order.purchaseID ORDER BY timestamp) AS rn
    FROM aep_web_events_dataset
    WHERE eventType = 'commerce.purchases'
      AND timestamp >= date_sub(current_date(), 44)
      AND timestamp < date_sub(current_date(), 14)
      AND commerce.order.purchaseID IS NOT NULL
      AND commerce.order.purchaseID <> ''
  ),
  orders_placed AS (
    SELECT transaction_id, purchase_ts, items
    FROM purchase_events
    WHERE rn = 1
  ),
  purchase_lines AS (
    SELECT
      x.transaction_id,
      x.pli.SKU AS sku,
      COALESCE(x.pli.quantity, 0) AS quantity,
      COALESCE(x.pli.priceTotal, 0) AS line_value
    FROM (
      SELECT transaction_id, explode(items) AS pli
      FROM orders_placed
    ) x
  ),
  order_units AS (
    SELECT transaction_id, SUM(quantity) AS units_ordered
    FROM purchase_lines
    GROUP BY transaction_id
  ),
  -- Order-cancellation events: order:cancel mapped to commerce.backofficeOrderCancelled with _tenant.orderCancellation.refundType = order_cancellation
  cancellation_events AS (
    SELECT
      c.transaction_id,
      c.event_ts,
      c.reason_code,
      c.reason_raw_code,
      c.initiator_code,
      c.items,
      COALESCE(size(c.items), 0) <= 0 AS is_whole_order_action
    FROM (
      SELECT
        commerce.order.purchaseID AS transaction_id,
        timestamp AS event_ts,
        NULLIF(LOWER(TRIM(_tenant.orderCancellation.cancellationReason)), '') AS reason_code,
        NULLIF(LOWER(TRIM(_tenant.orderCancellation.cancellationReasonRaw)), '') AS reason_raw_code,
        NULLIF(LOWER(TRIM(_tenant.orderCancellation.cancelInitiator)), '') AS initiator_code,
        productListItems AS items
      FROM aep_web_events_dataset
      WHERE eventType = 'commerce.backofficeOrderCancelled'
        AND LOWER(TRIM(_tenant.orderCancellation.refundType)) = 'order_cancellation'
        AND timestamp >= date_sub(current_date(), 44)
        AND timestamp < current_date()
    ) c
    JOIN orders_placed o
      ON o.transaction_id = c.transaction_id
  ),
  -- Line grain: cancelled productListItems carry the event's reason; an event without productListItems cancels every purchased line
  cancelled_lines AS (
    SELECT
      x.transaction_id,
      x.reason_code,
      x.reason_raw_code,
      x.initiator_code,
      COALESCE(x.pli.quantity, 0) AS units_cancelled,
      CAST(COALESCE(x.pli.priceTotal, 0) AS DOUBLE) AS value_cancelled
    FROM (
      SELECT transaction_id, reason_code, reason_raw_code, initiator_code, explode(items) AS pli
      FROM cancellation_events
      WHERE NOT is_whole_order_action
    ) x
    UNION ALL
    SELECT
      c.transaction_id,
      c.reason_code,
      c.reason_raw_code,
      c.initiator_code,
      pl.quantity AS units_cancelled,
      CAST(pl.line_value AS DOUBLE) AS value_cancelled
    FROM cancellation_events c
    JOIN purchase_lines pl
      ON pl.transaction_id = c.transaction_id
    WHERE c.is_whole_order_action
  ),
  order_cancel_units AS (
    SELECT transaction_id, SUM(units_cancelled) AS units_cancelled
    FROM cancelled_lines
    GROUP BY transaction_id
  ),
  ranked_cancellations AS (
    SELECT
      c.transaction_id,
      c.reason_code,
      c.reason_raw_code,
      c.initiator_code,
      ROW_NUMBER() OVER (PARTITION BY c.transaction_id ORDER BY c.event_ts DESC) AS rn,
      MAX(CASE WHEN c.is_whole_order_action THEN 1 ELSE 0 END) OVER (PARTITION BY c.transaction_id) AS has_whole_order_action
    FROM cancellation_events c
  ),
  -- Order grain: an order counts as cancelled only when every line is cancelled; its reason is the one on the latest cancellation action (a partial cancellation never makes a cancelled order)
  cancelled_orders AS (
    SELECT
      r.transaction_id,
      r.reason_code,
      r.reason_raw_code,
      r.initiator_code
    FROM ranked_cancellations r
    LEFT JOIN order_units ou
      ON ou.transaction_id = r.transaction_id
    LEFT JOIN order_cancel_units cu
      ON cu.transaction_id = r.transaction_id
    WHERE r.rn = 1
      AND (r.has_whole_order_action = 1
           OR (ou.units_ordered > 0 AND COALESCE(cu.units_cancelled, 0) >= ou.units_ordered))
  ),
  grain_rows AS (
    SELECT 'order' AS grain, transaction_id, reason_code, reason_raw_code, initiator_code, 0 AS units_cancelled, CAST(0 AS DOUBLE) AS value_cancelled
    FROM cancelled_orders
    UNION ALL
    SELECT 'line' AS grain, transaction_id, reason_code, reason_raw_code, initiator_code, units_cancelled, value_cancelled
    FROM cancelled_lines
  ),
  -- Governed code -> display label; Shopify native cancel_reason codes resolve through the same lookup when the governed code is absent
  labelled AS (
    SELECT
      r.grain,
      r.transaction_id,
      r.units_cancelled,
      r.value_cancelled,
      CASE
        WHEN r.reason_code IS NULL AND r.reason_raw_code IS NULL THEN '(not set)'
        WHEN r.resolved_reason_code = 'customer_changed_mind' THEN 'Customer Changed Mind'
        WHEN r.resolved_reason_code = 'out_of_stock' THEN 'Inventory Unavailable'
        WHEN r.resolved_reason_code = 'fraud' THEN 'Fraud'
        WHEN r.resolved_reason_code = 'payment_declined' THEN 'Payment Declined'
        WHEN r.resolved_reason_code = 'staff_error' THEN 'Staff Error'
        WHEN r.resolved_reason_code = 'other' THEN 'Other'
        ELSE '(unmapped)'
      END AS cancellation_reason,
      CASE
        WHEN r.initiator_code IS NULL THEN '(not set)'
        WHEN r.initiator_code = 'customer' THEN 'Customer'
        WHEN r.initiator_code = 'merchant' THEN 'Merchant'
        WHEN r.initiator_code = 'system' THEN 'System'
        ELSE '(unmapped)'
      END AS cancel_initiator,
      CASE WHEN r.reason_raw_code = 'order_edit' THEN 1 ELSE 0 END AS is_order_edit
    FROM (
      SELECT
        g.*,
        COALESCE(
          g.reason_code,
          CASE g.reason_raw_code
            WHEN 'customer' THEN 'customer_changed_mind'
            WHEN 'inventory' THEN 'out_of_stock'
            WHEN 'fraud' THEN 'fraud'
            WHEN 'declined' THEN 'payment_declined'
            WHEN 'staff' THEN 'staff_error'
            WHEN 'other' THEN 'other'
            WHEN 'order_edit' THEN 'other'
          END
        ) AS resolved_reason_code
      FROM grain_rows g
    ) r
  ),
  totals AS (
    SELECT
      (SELECT COUNT(DISTINCT transaction_id) FROM orders_placed) AS orders_placed,
      (SELECT COUNT(DISTINCT transaction_id) FROM cancelled_orders) AS cancelled_orders_total
  )
  SELECT
    l.cancellation_reason,
    l.cancel_initiator,
    MAX(t.orders_placed) AS orders_placed,
    COUNT(DISTINCT CASE WHEN l.grain = 'order' THEN l.transaction_id END) AS cancelled_orders,
    ROUND(CAST(COUNT(DISTINCT CASE WHEN l.grain = 'order' THEN l.transaction_id END) AS DOUBLE) / NULLIF(MAX(t.orders_placed), 0), 4) AS cancellation_rate,
    ROUND(CAST(COUNT(DISTINCT CASE WHEN l.grain = 'order' THEN l.transaction_id END) AS DOUBLE) / NULLIF(MAX(t.cancelled_orders_total), 0), 4) AS share_of_cancelled_orders,
    COUNT(DISTINCT CASE WHEN l.grain = 'order' AND l.is_order_edit = 1 THEN l.transaction_id END) AS order_edit_cancelled_orders,
    COUNT(DISTINCT CASE WHEN l.grain = 'line' THEN l.transaction_id END) AS orders_with_cancelled_lines,
    SUM(CASE WHEN l.grain = 'line' THEN 1 ELSE 0 END) AS cancelled_lines,
    SUM(CASE WHEN l.grain = 'line' THEN l.units_cancelled ELSE 0 END) AS units_cancelled,
    ROUND(SUM(CASE WHEN l.grain = 'line' THEN l.value_cancelled ELSE 0 END), 2) AS cancelled_value
  FROM labelled l
  CROSS JOIN totals t
  GROUP BY l.cancellation_reason, l.cancel_initiator
  ORDER BY cancelled_orders DESC, units_cancelled DESC;

Calculation Notes: |
  1️⃣ Capture and platform mapping: the value is sent as cancellation_reason on the order-cancellation event (GA4 refund with refund_type = order_cancellation, Adobe order:cancel), with cancel_initiator as a parameter on the same hit. Both are collected as the Order Cancellation event's lowercase snake_case codes and mapped to display labels in reporting: customer_changed_mind → Customer Changed Mind, out_of_stock → Inventory Unavailable, fraud → Fraud, payment_declined → Payment Declined, staff_error → Staff Error, other → Other; cancel_initiator customer → Customer, merchant → Merchant, system → System. Native codes map through a governed lookup: Shopify cancel_reason customer → Customer Changed Mind, inventory → Inventory Unavailable, fraud → Fraud, declined → Payment Declined, staff → Staff Error, other → Other; Salesforce Commerce Cloud Order cancelCode and OMS reason codes map through the merchant's code table; Adobe Commerce, which has no native reason enum, maps the configured cancellation reason attribute or the cancellation comment in sales_order_status_history by keyword. The raw platform code is kept in a separate field for audit.
  2️⃣ Reason is independent of initiator: cancel_initiator is recorded, never inferred from the reason, and the two are cross-tabulated rather than collapsed. A customer self-service cancellation after a delivery-date slip is Customer Changed Mind / Customer; a staff cancellation for an oversold SKU is Inventory Unavailable / Merchant; an automated risk-screen void is Fraud / System. Payment Declined applies only to accepted orders voided when capture or re-authorisation fails; authorisation failures that never created an order are checkout payment failures and never enter this dimension.
  3️⃣ Scope boundaries: only whole-order or order-line cancellations effective before the affected lines ship. Voided carrier labels or freight bookings on an order that remains live belong to Shipment Cancellation; failed, lost, damaged or refused deliveries belong to Delivery Exception Type; any reason captured after delivery belongs to Return Reason; subscription and recurring-order cancellations are out of scope even when they run through the same OMS.
  4️⃣ Order versus line grain: a partial cancellation carries the reason on each cancelled line and does not make the order a cancelled order in Order Cancellation Rate. When every line is eventually cancelled, the order-level value is the reason on the action that cancelled the final open line, while line-level analysis keeps each line's own reason; units and value by reason are always summed at line grain.
  5️⃣ Precedence, restatement and unresolved values: the OMS record is authoritative over the client-side hit. A reason reclassified within 30 days of cancellation (for example Other to Fraud after chargeback review) replaces the earlier value and prior periods are restated. Cancellations with no reason resolve to '(not set)' and unmapped native codes to '(unmapped)', both kept distinct from the governed Other and reviewed weekly; cancel-and-reissue order edits map to Other with raw code order_edit so they can be excluded from customer-intent analysis.
  6️⃣ Timing, sessions and denominators: merchant and system cancellations arrive server-side, never start or extend a session and are not subject to the 30-minute timeout; channel, device and customer attributes are inherited from the originating purchase by transaction_id. A reason-level cancellation rate is reported by order-placed cohort as orders cancelled with that reason / all orders placed in the cohort (distinct purchase transaction_id, including orders later cancelled, excluding test orders); reason mix (share of cancelled orders) is a separate view and is never labelled a rate. The latest cohort is immature until the pre-ship window (typically 7–14 days) has elapsed.
  7️⃣ Exclusions and sensitivity: test, draft and deleted-without-cancel-status orders are excluded. Free-text staff or customer cancellation comments are never exposed as the dimension value because they can contain names, addresses or payment details; only the governed value and raw platform code are reportable, which keeps the dimension non-PII.

Business Use Case: |
  1️⃣ Merchandising and Inventory Planning: when Inventory Unavailable cancellations for a category exceed 1% of all orders placed for that category in a week, the planner raises the channel safety-stock buffer, escalates OMS-to-storefront inventory sync latency and removes the affected SKUs from paid shopping feeds until availability recovers.
  2️⃣ Customer Service Operations lead: when Customer Changed Mind cancellations placed within two hours of ordering rise for two consecutive weeks, the team reviews the top raw reasons and order-confirmation content, then extends the self-service edit window for address and variant changes so edits stop turning into cancellations.
  3️⃣ Finance (Payments and Risk): at the weekly risk review, when Fraud and Payment Declined cancellations as a percentage of all orders placed rise for a payment method or ship-to country, the payments manager tunes fraud-screen thresholds and compares cancelled-order value against chargeback losses to confirm good orders are not being declined.
  4️⃣ Store and Fulfilment Operations manager: when Staff Error cancellations on ship-from-store or BOPIS orders at a location exceed the network baseline, the manager audits pick validation and inventory accuracy at that store and schedules retraining before routing volume back to it.


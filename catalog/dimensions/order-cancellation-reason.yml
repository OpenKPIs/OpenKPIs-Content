Dimension Name: Order Cancellation Reason

Description: |
  Order Cancellation Reason is the normalised cause recorded when an e-commerce order is cancelled before it ships, taken from the order-cancellation event's cancellation_reason codes (customer_changed_mind, duplicate_order, out_of_stock, fraud, payment_declined, address_unserviceable, order_edit, other) and the platform's native field (Shopify cancel_reason, Salesforce Commerce Cloud and OMS cancel codes, Adobe Commerce cancellation reason or comment), mapped to five governed values: Customer Changed Mind, Inventory Unavailable, Fraud, Payment Declined and Other (a Shopify staff cancellation is sent with the other code and reports as Other). It is the standard breakdown for order-cancellation analysis, letting merchandising, customer service and finance teams separate demand-side cancellations from stock, risk and operational failures and act on each, while carrier-level cancellations, in-transit exceptions, post-delivery returns and subscription cancellations are governed by their own specs.

Category: Operations


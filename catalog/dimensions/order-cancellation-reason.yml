Dimension Name: Order Cancellation Reason

Description: |
  Order Cancellation Reason is the normalised cause recorded when an e-commerce order, or an individual order line, is cancelled before it ships, mapped from the platform's native field (Shopify cancel_reason, Salesforce Commerce Cloud and OMS cancel codes, Adobe Commerce cancellation reason or comment) to six governed values: Customer Changed Mind, Inventory Unavailable, Fraud, Payment Declined, Staff Error and Other. It is the standard breakdown for Order Cancellation Rate, letting merchandising, customer service and finance teams separate demand-side cancellations from stock, risk and operational failures and act on each, while carrier-level cancellations, in-transit exceptions, post-delivery returns and subscription cancellations are governed by their own specs.


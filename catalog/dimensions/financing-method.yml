Dimension Name: Financing Method

Description: |
  Financing Method classifies the primary funding arrangement selected or confirmed for a real estate purchase, lease-to-own agreement, refinance, or property development transaction. It enables comparison of conversion, approval, closing, revenue, and transaction-cycle outcomes across cash, mortgage, government-backed, seller-funded, and alternative financing methods.


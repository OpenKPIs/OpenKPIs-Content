Calculation Notes: |
  Assign the value recorded for the transaction at the applicable event timestamp rather than the latest known value. Financing selections may change between inquiry, offer, application, approval, and closing; preserve each event-level value and use the closing-confirmed value for completed-transaction reporting. For blended financing, classify the method contributing the largest portion of the purchase price as primary and retain additional methods in a transaction-financing bridge table. Use Unknown when financing is expected but unavailable, Other only when a valid method falls outside the controlled vocabulary, and Not Applicable for transactions that do not require buyer financing. Exclude test, duplicate, canceled-before-submission, and internally simulated transactions from production conversion reporting.

Business Use Case: |
  The Revenue Management and Mortgage Operations teams compare offer-to-close conversion, approval rates, closing duration, and transaction revenue by financing method and market. If FHA-financed offers show materially lower closing conversion in a specific market, leadership can investigate lender coverage, appraisal delays, property eligibility, or agent training and then adjust lender partnerships and workflow guidance.



Dimension Name: Financing Method

Description: |
  Financing Method classifies the primary funding source a buyer uses for a residential property purchase (Cash, Conventional, Jumbo, FHA, VA, USDA, Seller Financing, Other or Unknown), following the RESO Data Dictionary BuyerFinancing vocabulary rolled up to HMDA loan-type conventions. It lets brokerage, marketing and finance teams compare lead-to-offer conversion, contract fall-through, days to close and commission revenue by financing type, so they can steer lender partnerships, campaign mix and pipeline forecasts.

Category: Conversion


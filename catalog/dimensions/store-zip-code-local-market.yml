Dimension Name: Store / ZIP Code / Local Market

Description: |
  Omnichannel retail location hierarchy that maps every order line, pickup and browsing interaction to a Store ID, that store's postal (ZIP) code and the local market (Nielsen DMA or retailer trade area) the store serves. Orders are credited to the fulfilling store (BOPIS, curbside, ship-to-store or ship-from-store), browsing activity to the shopper's selected 'my store', and the shipping ZIP is used only as a market-level fallback when neither is present.

Category: Operations

Tags: [dimension, E-commerce: Retail Omnichannel (BOPIS / ship-to-store / in-store)]

Industry: Retail

Priority: High

Core Area: Generic

Scope: Event

Data Type: string

Aggregation Window: Daily, Weekly, Monthly, Quarterly


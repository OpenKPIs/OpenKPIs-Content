Dimension Name: Booking Acquisition Channel

Description: |
  Classifies the digital marketing or traffic channel credited with producing a confirmed travel booking, using governed source, medium, campaign, referrer, and direct-navigation signals. The value is assigned at the booking-confirmation event under the approved attribution model and channel-grouping taxonomy, enabling consistent comparison of acquisition performance across digital bookings.

Category: Acquisition

Tags: [dimension]

Industry: Travel & Hospitality

Priority: High

Core Area: Checkout

Scope: Event

Data Type: string

Aggregation Window: Event


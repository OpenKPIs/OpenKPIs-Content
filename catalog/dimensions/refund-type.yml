Dimension Name: Refund Type

Description: |
  Refund Type records how a refund was settled: whether it returned the full or a partial captured amount, and whether the money went back to the original payment method or was issued as store credit or a gift card. It is separate from Payment Method, which records how the customer paid, so Finance and Customer Service can see how much refunded value leaves the business and how much stays as customer balance.

Category: Monetization




























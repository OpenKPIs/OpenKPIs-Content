Dimension Name: Product Area Interest

Description: |
  Product Area Interest is the user-level category affinity attribute: the top-level product category (item_category, department) in which a shopper has recorded the most qualifying product interactions (view_item, add_to_cart, purchase) over a rolling 30-day lookback. It turns item-scoped ecommerce behaviour into one stable, segmentable value, so merchandising, CRM and paid media teams can target, personalise and size audiences by the department each shopper is actually engaging with rather than by the last page viewed. Unlike item-category, which is the product attribute carried on each event, Product Area Interest is a shopper-level value derived from it.

Category: Engagement

Tags: [dimension, E-commerce: Product Discovery & Merchandising (Search / Filters / PDP)]

Industry: E-commerce

Priority: Medium

Core Area: Discovery

Scope: User

Data Type: string

Aggregation Window: User, Daily


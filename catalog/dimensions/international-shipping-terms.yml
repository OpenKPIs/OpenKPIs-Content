Dimension Name: International Shipping Terms

Description: |
  Identifies the standardized trade term governing buyer and seller responsibilities for an international shipment, including transport cost, insurance, customs clearance, and delivery obligations. It supports analysis of commercial responsibility, landed-cost exposure, operational handoffs, and shipment risk under the applicable Incoterms ruleset.

Category: Efficiency

Tags: [dimension]

Industry: Logistics & Supply Chain

Priority: High

Core Area: Generic

Scope: Item

Data Type: string

Aggregation Window: Event









Calculation Notes: |
  Use the shipment-level term when an authorized override exists; otherwise inherit the value effective on the originating order or commercial agreement. Preserve the originally agreed term for historical reporting and do not overwrite it with a later master-data default. Interpret legacy codes only with their recorded ruleset version, because obligations can differ by edition. The named place or port is mandatory context and must not be concatenated into the canonical code. Do not infer the term from freight payer, carrier account, duty amount, destination, or customs broker data. Returns, replacements, drop shipments, and intercompany transfers must use the term documented for their own movement rather than automatically inheriting the original outbound shipment term.

Business Use Case: |
  A global logistics executive segments shipments by DDP, DAP, FCA, and EXW to identify lanes where the company has unintentionally assumed import clearance, duty, or main-carriage responsibility. The trade compliance and procurement teams then renegotiate contract terms, correct supplier defaults, and prioritize controls on lanes with high landed-cost variance or customs exposure.


Source Data: ERP, Transportation Management System, Order Management System, Procurement Platform, and Trade Compliance Master Data

Report Attributes: |
  ["Incoterms Ruleset Version","Named Place or Port","Origin Country","Destination Country","Trade Lane","Transport Mode","Carrier","Customer","Supplier","Business Unit","Legal Entity","Shipment Status","Main Carriage Responsibility","Insurance Responsibility","Import Clearance Responsibility","Duty and Tax Responsibility","Risk Transfer Stage"]

Dashboard Usage: [Global Logistics Performance Dashboard, International Shipment Control Tower, Trade Compliance Risk Dashboard, Landed Cost and Duty Exposure Dashboard, Supplier Delivery Terms Dashboard, Customer Fulfillment Terms Dashboard, Freight Responsibility and Spend Dashboard]


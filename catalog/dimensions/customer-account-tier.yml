Dimension Name: Customer Account Tier

Description: |
  Customer Account Tier classifies each bill-to customer account into the governed commercial service level effective at the analysis timestamp. It supports comparison of revenue, shipment volume, profitability, service performance, retention, and resource allocation across strategically distinct account groups.

Category: Revenue

Tags: [dimension]

Industry: Logistics & Supply Chain

Priority: High

Core Area: Monetization

Scope: User

Data Type: string

Aggregation Window: User with point-in-time effective dating and Monthly governance review









Calculation Notes: |
  1️⃣ Resolve tier using assignment with effective start timestamp ≤ event timestamp.  
  2️⃣ Ensure effective end timestamp is later than event timestamp or null.  
  3️⃣ For current-state reporting, use assignment active at reporting cutoff.  
  4️⃣ For historical performance, use tier active at the time of the business event.  
  5️⃣ Closed, merged, or deleted accounts retain historical assignments.  
  6️⃣ Apply Customer Account Status filter for current active-account reporting.  
  7️⃣ Normalize case and whitespace, reject overlapping effective periods, and avoid unapproved parent-account tier replacements.

Business Use Case: |
  The Chief Commercial Officer reviews revenue, contribution margin, on-time delivery, claims, and retention by Customer Account Tier to determine whether service investment and account-management capacity align with commercial importance. If Strategic accounts show declining on-time delivery or retention risk, leadership can prioritize network remediation and executive account intervention while Revenue Management validates that tier assignments remain justified.


Source Data: CRM customer account master and segmentation workflow, supplemented by ERP account hierarchy and contract master data


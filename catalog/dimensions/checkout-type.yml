Dimension Name: Checkout Type

Description: |
  Labels each checkout and order as Guest or Registered, based on whether the shopper was signed in to a merchant account (a login state or a populated user_id) at begin_checkout and at purchase. Baymard's checkout research and the order reports in Shopify, Salesforce Commerce Cloud and Adobe Commerce all use this split to show how much revenue relies on guest checkout and where forced sign-in loses conversions.


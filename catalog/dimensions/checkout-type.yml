Dimension Name: Checkout Type

Description: |
  Labels each checkout and order with one of three lowercase values, guest, registered or unknown, based on whether the shopper was signed in to a merchant account (a login state or a populated user_id) at begin_checkout and at purchase. unknown is used when the sign-in signal is missing. Baymard's checkout research uses this split, Adobe Commerce records it on every order (sales_order.customer_is_guest) and Salesforce Commerce Cloud reports registered versus guest orders; retailers use it to show how much revenue relies on guest checkout and where forced sign-in loses conversions.

Category: Conversion

Tags: [dimension, E-commerce: Cart & Checkout Funnel Analytics]

Industry: E-commerce


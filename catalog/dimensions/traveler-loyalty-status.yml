Dimension Name: Traveler Loyalty Status

Description: |
  Classifies the loyalty program standing recognized for a traveler when a digital interaction occurs, using the authenticated account state available to the website or mobile application. It enables analysis of how tier recognition influences discovery, booking conversion, ancillary engagement, service behavior, and digital retention without requiring offline identity stitching.

Category: Retention

Tags: [dimension]

Industry: Travel & Hospitality

Priority: High

Core Area: Engagement

Scope: Event

Data Type: string

Aggregation Window: Event

GA4 Event: |
  traveler_loyalty_status

Adobe Event: |
  login

W3 Data Layer: |
  {"digitalData":{"user":[{"profile":[{"attributes":{"authenticationStatus":"authenticated","travelerLoyaltyStatus":"gold"}}]}],"event":[{"eventInfo":{"eventName":"login"},"attributes":{"travelerLoyaltyStatus":"gold"}}]}}

GA4 Data Layer: |
  {"event":"login","method":"authenticated_account","traveler_loyalty_status":"gold"}

Adobe Client Data Layer: |

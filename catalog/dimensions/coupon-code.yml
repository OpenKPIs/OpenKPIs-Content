Dimension Name: Coupon Code

Description: |
  Coupon Code is the exact promotional, discount or voucher code a customer successfully applied, captured at order level (GA4 Order coupon, the purchase `coupon` parameter) and at item level (GA4 Item coupon, `items[].coupon`), with in-store redemptions joined from POS on transaction_id. It lets Marketing, Merchandising and Finance break down orders, revenue and checkout behaviour by the specific code redeemed across web, app and store, while the kind of offer, internal promotion banners and discount values stay in Promotion Type, Promotion Name and the Discount Amount metric.

Category: Monetization




























Dimension Name: Viewing Method

Description: |
  Classifies the showing format of a viewing that a prospective buyer or renter booked through a tour request, using the standard brokerage and portal taxonomy: private in-person showing, open house, live video tour, recorded video tour session, 3D virtual walkthrough session and self-guided tour; only viewings booked through a tour request count, while unassisted on-demand video or 3D plays are measured by virtual-tour-start-count, not by this dimension. Captured on the tour request (generate_lead with lead_type tour_request, carrying the booking ID and listing ID) and resolved to the delivered format, attendance, no-show and offer outcomes from the showing scheduling record joined on booking ID, it lets brokerage and marketplace leaders compare tour demand, attendance and offer conversion by requested vs delivered format and decide where agent time and virtual-tour capability are best deployed.


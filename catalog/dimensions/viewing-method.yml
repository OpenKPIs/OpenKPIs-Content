Calculation Notes: |
  Assign the canonical method explicitly recorded on each viewing-related event. For booking or rescheduling events, use the method requested for that booking version; for attendance, completion, cancellation, feedback, offer, or conversion events, use the method associated with the effective viewing occurrence. If the method changes after initial booking, do not overwrite prior events; subsequent events must carry the revised method. Use the actual delivered method when it is available and differs from the requested method. Do not infer the method from device type, meeting URL, office location, agent notes, or session behavior unless an approved source-mapping rule exists. Multiple methods presented on the same listing remain separate options until one is selected. Session timeout rules do not apply because the value is event-bound and must not be propagated from an earlier event in the session. Map blank, missing, unmapped, or contradictory source values to unknown, and use other only when the source explicitly identifies a valid method outside the governed taxonomy.

Business Use Case: |
  The Product and Marketplace Operations teams compare booking-to-completion and viewing-to-inquiry or offer conversion by viewing method and market. If live virtual tours produce stronger qualified-lead conversion than recorded tours for remote prospects, leadership can expand agent availability and video infrastructure in markets with high out-of-area demand while reducing investment in underperforming formats.


Source Data: Property viewing booking platform, listing management system, virtual-tour platform, access-control system, CRM, and digital analytics event stream


Dimension Name: Viewing Method

Description: |
  Identifies the delivery format through which a prospective buyer or renter views a property, such as a private in-person tour, open house, live virtual tour, recorded video, 3D tour, or self-guided physical visit. The value represents the method applicable at the time of each viewing-related event and enables comparison of engagement, booking, attendance, and conversion outcomes by viewing format.


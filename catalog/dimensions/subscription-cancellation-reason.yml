Google Analytics SQL: |
  SELECT
    (SELECT p.value.string_value FROM UNNEST(event_params) AS p WHERE p.key = 'event_id') AS cancellation_id,
    (SELECT p.value.string_value FROM UNNEST(event_params) AS p WHERE p.key = 'cancellation_reason') AS cancellation_reason
  FROM `project.analytics.events_*`
  WHERE event_name = 'subscription_cancelled'
    AND _TABLE_SUFFIX BETWEEN FORMAT_DATE('%Y%m%d', DATE_SUB(DATE(@report_start), INTERVAL 1 DAY))
      AND FORMAT_DATE('%Y%m%d', DATE_ADD(DATE(@report_end), INTERVAL 1 DAY))
    AND event_timestamp >= UNIX_MICROS(@report_start)
    AND event_timestamp < UNIX_MICROS(@report_end);

AEP Query Service SQL: |
  SELECT
    _id AS cancellation_id,
    _openkpis.cancellation_reason AS cancellation_reason
  FROM {{AEP_EXPERIENCE_EVENT_DATASET}}
  WHERE eventType = 'subscription_cancelled'
    AND timestamp >= CAST('{{REPORT_START_UTC}}' AS TIMESTAMP)
    AND timestamp < CAST('{{REPORT_END_UTC}}' AS TIMESTAMP);

Calculation Notes: |
  1️⃣ Confirmed subscriber cancellations only; exclude saves, billing failures, staff actions and single-order cancellations.
  2️⃣ Return the single selected reason code unchanged; retain null for missing reasons. Never collect free-text comments.
  3️⃣ One source row per cancellation ID is an integration prerequisite; SQL does not resolve duplicate deliveries.
  4️⃣ Supply matching UTC report bounds to both queries; include the start and exclude the end. No lookback applies.
  5️⃣ Cancellation IDs identify actions only; exclude subscriber, account, device and contact identifiers from these payloads.

Business Use Case: |
  1️⃣ Product teams add frequency options when excess-product reasons become common.
  2️⃣ Loyalty teams test retention offers when price-related cancellations rise.
  3️⃣ Merchandising teams investigate product quality when that cancellation reason increases.



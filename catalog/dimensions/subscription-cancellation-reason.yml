Dimension Name: Subscription Cancellation Reason
Aliases: [Cancellation Reason, Subscription Churn Reason, Cancel Reason]

Formula: Collected subscription cancellation reason

Description: |
  The reason a subscriber selects when confirming cancellation of a recurring product subscription. It helps teams understand voluntary churn and choose retention improvements.

Category: Retention

Tags: [subscription, voluntary churn, cancellation]

Industry: [E-commerce, Retail]

Business Criticality: High

Journey / Navigation Area: [Loyalty & Retention]

Owning Function: Loyalty & CRM

Scope: Event

Measurement Channels: [Web, Mobile App]

Data Type: string



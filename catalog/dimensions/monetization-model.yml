Dimension Name: Monetization Model

Description: |
  Classifies the commercial mechanism through which a media or streaming interaction, entitlement, content item, offer, or transaction generates revenue or supports paid customer value. It distinguishes models such as subscription, advertising-supported, transactional purchase, rental, pay-per-view, freemium, sponsorship, licensing, affiliate, bundled, and hybrid monetization across acquisition, engagement, conversion, billing, retention, and lifetime-value analysis.

Category: Revenue

Tags: [dimension]

Industry: Media & Streaming

Priority: High

Core Area: Monetization

Scope: Event

Data Type: string

Aggregation Window: Event

GA4 Event: |
  view_item

Adobe Event: |
  content_interaction

W3 Data Layer: |
  {"digitalData":{"event":[{"eventInfo":{"eventName":"view_item"},"attributes":{"monetizationModel":"subscription"}}]}}

GA4 Data Layer: |
  {"event":"view_item","monetization_model":"subscription"}

Adobe Client Data Layer: |
  {"data":{"content":{"monetizationModel":"subscription"}},"event":"content-interaction"}


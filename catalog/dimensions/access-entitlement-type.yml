Dimension Name: Access Entitlement Type

Description: |
  Classifies the contractual or policy-based right under which a learner, educator, or administrator is permitted to access a digital course, assessment, credential, or learning resource. It records the entitlement effective at the time of the access decision, enabling comparison of free, trial, individually paid, institution-sponsored, promotional, privileged, and non-entitled experiences.

Category: Revenue

Tags: [dimension]

Industry: EdTech & E-Learning

Priority: High

Core Area: Monetization

Scope: Event

Data Type: string

Aggregation Window: Event


Calculation Notes: |
  1️⃣ Assign the value from the entitlement selected by the authorization service for the specific resource at the time of the access decision.
  2️⃣ Use the controlled taxonomy: free, trial, individual_subscription, institution_subscription, one_time_purchase, promotional, complimentary, instructor_staff, restricted_none, and unknown.
  3️⃣ When multiple valid entitlements exist, apply the authorization service's winning entitlement; otherwise prioritize explicit purchase, individual subscription, institution subscription, trial, promotional, complimentary, and free access in that order.
  4️⃣ Preserve the event-time value and do not restate historical events when subscriptions, licenses, roles, or entitlement policies subsequently change.
  5️⃣ Record restricted_none only when the service explicitly determines that no valid entitlement permits access; reserve unknown for missing, malformed, delayed, or unmapped entitlement data.
  6️⃣ Exclude preview, crawler, synthetic-monitoring, quality-assurance, and internal test activity unless those experiences are explicitly included in the governed reporting scope.
  7️⃣ For unauthenticated access, classify the event as free only when the resource policy grants anonymous access; otherwise use restricted_none rather than inferring an entitlement.

Business Use Case: |
  The Chief Product Officer uses conversion, engagement, and completion rates broken down by Access Entitlement Type to determine whether trial users should receive broader course access, whether institution-sponsored learners are underutilizing assigned licenses, and whether individually paid subscribers encounter disproportionate authorization failures. Product and Revenue Management teams can then adjust paywall rules, trial allowances, packaging, and entitlement remediation workflows for the affected access model.



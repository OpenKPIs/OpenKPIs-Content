Dimension Name: Ad Content

Description: |
  Creative or link variant within a campaign, taken from the utm_content parameter (GA4 Manual ad content). Separates ads, banners or email links that share the same source, medium and campaign.

Category: Acquisition

Tags: [dimension, E-commerce: Top-of-Funnel & Marketing Acquisition]

Industry: E-commerce


Dimension Name: Special Handling Requirement

Description: |
  Identifies the standardized handling condition a customer selects or that a business rule assigns to an item during discovery, checkout, or order servicing, such as fragile, temperature-controlled, signature required, or oversized. It enables analysis of how handling needs affect conversion, charges, delivery experience, repeat purchase, and customer lifetime value across digital and assisted channels.

Category: Conversion

Tags: [dimension]

Industry: Logistics & Supply Chain

Priority: High

Core Area: Checkout

Scope: Item

Data Type: string

Aggregation Window: Event

GA4 Event: |
  add_shipping_info

Adobe Event: |
  add_shipping_info


Dimension Name: Shipment Mode

Description: |
  Shipment Mode classifies each order by the normalized delivery service confirmed at purchase, such as Standard, Expedited, Same-Day, Pickup or Digital, and is the order-level Shipping Method used in fulfillment reporting. It differs from Shipping Tier, which records the option a shopper selects during checkout, because Shipment Mode reflects the service actually attached to the completed order rather than the carrier's physical transport method.


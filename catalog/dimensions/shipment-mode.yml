Google Analytics SQL: |
  -- ==========================================
  -- 1. GOOGLE BIGQUERY SQL
  -- ==========================================
  -- Orders, revenue and order share by normalized Shipment Mode (value confirmed at purchase), last 30 complete days
  WITH purchases AS (
    SELECT
      e.ecommerce.transaction_id AS transaction_id,
      MAX(e.ecommerce.purchase_revenue) AS purchase_revenue,
      MAX(IF(ep.key = 'shipping_tier', ep.value.string_value, NULL)) AS shipping_tier_raw
    FROM `your-project.analytics_123456789.events_*` AS e
    LEFT JOIN UNNEST(e.event_params) AS ep
    WHERE e._TABLE_SUFFIX BETWEEN FORMAT_DATE('%Y%m%d', DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY))
                              AND FORMAT_DATE('%Y%m%d', DATE_SUB(CURRENT_DATE(), INTERVAL 1 DAY))
      AND e.event_name = 'purchase'
      AND e.ecommerce.transaction_id IS NOT NULL
      AND e.ecommerce.transaction_id != '(not set)'
    GROUP BY transaction_id
  ),
  normalized AS (
    SELECT
      transaction_id,
      purchase_revenue,
      CASE
        WHEN shipping_tier_raw IS NULL OR TRIM(shipping_tier_raw) = '' THEN 'Unknown'
        WHEN REGEXP_CONTAINS(LOWER(shipping_tier_raw), r'mixed|multiple') THEN 'Mixed'
        WHEN REGEXP_CONTAINS(LOWER(shipping_tier_raw), r'same[ _-]?day') THEN 'Same-Day'
        WHEN REGEXP_CONTAINS(LOWER(shipping_tier_raw), r'pick[ _-]?up|bopis|click[ _-]?(and|&)[ _-]?collect|in[ _-]?store') THEN 'Pickup'
        WHEN REGEXP_CONTAINS(LOWER(shipping_tier_raw), r'digital|download|e-?delivery') THEN 'Digital'
        WHEN REGEXP_CONTAINS(LOWER(shipping_tier_raw), r'express|expedited|overnight|next[ _-]?day|priority|2[ _-]?day|two[ _-]?day') THEN 'Expedited'
        WHEN REGEXP_CONTAINS(LOWER(shipping_tier_raw), r'standard|ground|economy|free') THEN 'Standard'
        ELSE 'Unknown'
      END AS shipment_mode
    FROM purchases
  )
  SELECT
    shipment_mode,
    COUNT(DISTINCT transaction_id) AS orders,
    SUM(purchase_revenue) AS revenue,
    SAFE_DIVIDE(COUNT(DISTINCT transaction_id), SUM(COUNT(DISTINCT transaction_id)) OVER ()) AS order_share
  FROM normalized
  GROUP BY shipment_mode
  ORDER BY orders DESC;

AEP Query Service SQL: |
  -- ==========================================
  -- 2. ADOBE AEP QUERY SERVICE SQL
  -- ==========================================
  -- Orders, revenue and order share by normalized Shipment Mode (value confirmed at purchase), last 30 complete days
  WITH purchases AS (
    SELECT
      commerce.order.purchaseID AS purchase_id,
      MAX(commerce.order.priceTotal) AS purchase_revenue,
      MAX(shipping.shippingMethod) AS shipping_method_raw
    FROM commerce_experience_event_dataset
    WHERE commerce.purchases.value = 1
      AND commerce.order.purchaseID IS NOT NULL
      AND timestamp >= date_sub(current_date(), 30)
      AND timestamp < current_date()
    GROUP BY commerce.order.purchaseID
  ),
  normalized AS (
    SELECT
      purchase_id,
      purchase_revenue,
      CASE
        WHEN shipping_method_raw IS NULL OR TRIM(shipping_method_raw) = '' THEN 'Unknown'
        WHEN LOWER(shipping_method_raw) RLIKE 'mixed|multiple' THEN 'Mixed'
        WHEN LOWER(shipping_method_raw) RLIKE 'same[ _-]?day' THEN 'Same-Day'
        WHEN LOWER(shipping_method_raw) RLIKE 'pick[ _-]?up|bopis|click[ _-]?(and|&)[ _-]?collect|in[ _-]?store' THEN 'Pickup'
        WHEN LOWER(shipping_method_raw) RLIKE 'digital|download|e-?delivery' THEN 'Digital'
        WHEN LOWER(shipping_method_raw) RLIKE 'express|expedited|overnight|next[ _-]?day|priority|2[ _-]?day|two[ _-]?day' THEN 'Expedited'
        WHEN LOWER(shipping_method_raw) RLIKE 'standard|ground|economy|free' THEN 'Standard'
        ELSE 'Unknown'
      END AS shipment_mode
    FROM purchases
  )
  SELECT
    shipment_mode,
    COUNT(DISTINCT purchase_id) AS orders,
    SUM(purchase_revenue) AS revenue,
    COUNT(DISTINCT purchase_id) * 1.0 / NULLIF(SUM(COUNT(DISTINCT purchase_id)) OVER (), 0) AS order_share
  FROM normalized
  GROUP BY shipment_mode
  ORDER BY orders DESC;

Calculation Notes: |
  1️⃣ Read the shipping option confirmed on the purchase event (GA4 parameter shipping_tier mapped as an event parameter; XDM shipping.shippingMethod); the checkout-stage selection on add_shipping_info belongs to the Shipping Tier dimension.
  2️⃣ Normalize raw platform values to the governed vocabulary Standard, Expedited, Same-Day, Pickup, Digital, Mixed and Unknown with a case-insensitive mapping table maintained by Fulfillment Operations.
  3️⃣ Deduplicate purchase events by transaction ID before counting so that repeated confirmation-page loads do not inflate any mode.
  4️⃣ Send Mixed when one order is split across more than one delivery service and the implementation carries a single order-level string.
  5️⃣ Keep Unknown for missing, blank or unmapped values instead of defaulting them to Standard, and review the Unknown share weekly.
  6️⃣ Use the value captured at purchase as the historical record; later carrier upgrades or customer changes are tracked in shipment-level data and never overwrite the event.
  7️⃣ Exclude test orders always; exclude cancelled orders only for completed-fulfillment analysis and retain them for checkout and demand analysis.

Business Use Case: |
  1️⃣ The E-commerce Merchandising team reviews order share and revenue by Shipment Mode each month and, when Expedited share falls after a price change, adjusts the expedited shipping fee or free-shipping threshold.
  2️⃣ Fulfillment Operations forecasts pick, pack and carrier capacity from the weekly Same-Day and Expedited order volume and adds labor or carrier pickups before peak periods.
  3️⃣ Finance compares shipping revenue with shipping cost by Shipment Mode each quarter and flags modes that run at a loss for repricing or removal from checkout.


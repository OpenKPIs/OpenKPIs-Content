Dimension Name: Cart Size Band

Description: |
  Cart Size Band classifies every cart snapshot and completed order into one of five fixed unit-count bands (1, 2, 3-4, 5-9, 10+) by summing items[].quantity on the view_cart, begin_checkout and purchase payloads. It is the standard basket-size segmentation for comparing cart abandonment, checkout completion and order mix across small and large baskets, and it deliberately excludes order value, which is governed by Cart Value and Average Order Value.

Category: Conversion


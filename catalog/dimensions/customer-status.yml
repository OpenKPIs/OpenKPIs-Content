Dimension Name: Customer Status

Description: |
  Customer Status classifies each resolvable shopper into a single, mutually exclusive lifecycle stage — prospect, guest, new, returning, lapsing, churned or reactivated — determined from CRM and order-management purchase history rather than from device-based new/returning signals. It is the primary segmentation key for retention reporting: stamped onto digital behaviour, it allows conversion, order value, loyalty engagement and support demand to be read separately for every stage of the customer relationship.

Category: Retention

Tags: [dimension, E-commerce: Customer Lifecycle & Retention Analytics]

Industry: E-commerce

Priority: High

Core Area: Engagement

Scope: User

Data Type: string

Aggregation Window: Event, Session, User, Daily, Monthly, Quarterly


SQL Query: |
  WITH customer_history AS (
    SELECT
      customer_id,
      MIN(order_date) AS first_purchase_date,
      MAX(order_date) AS last_purchase_date,
      COUNT(DISTINCT order_id) AS purchase_count
    FROM orders
    WHERE order_status = 'completed'
    GROUP BY customer_id
  ), subscription_history AS (
    SELECT
      customer_id,
      MAX(subscription_status) AS subscription_status
    FROM subscriptions
    GROUP BY customer_id
  )
  SELECT
    e.event_id,
    e.event_timestamp,
    e.customer_id,
    CASE
      WHEN e.customer_id IS NULL AND COALESCE(e.is_logged_in,false) = false THEN 'guest'
      WHEN ch.customer_id IS NULL THEN 'prospect'
      WHEN DATE(ch.first_purchase_date) = DATE(e.event_timestamp) THEN 'new_customer'
      WHEN ch.purchase_count > 1
           AND DATE_DIFF(DATE(e.event_timestamp), DATE(ch.last_purchase_date), DAY) > 365 THEN 'reactivated_customer'
      WHEN sh.subscription_status = 'active' THEN 'active_subscriber'
      WHEN sh.subscription_status IN ('cancelled','expired','paused') THEN 'inactive_customer'
      WHEN ch.purchase_count >= 1 THEN 'returning_customer'
      ELSE 'unknown'
    END AS customer_status
  FROM raw_events e
  LEFT JOIN customer_history ch
    ON e.customer_id = ch.customer_id
  LEFT JOIN subscription_history sh
    ON e.customer_id = sh.customer_id;

Calculation Notes: |
  1️⃣ Define statuses centrally in a business rules document and keep them mutually exclusive. 
  2️⃣ Prefer CRM or order-management history over browser-only logic. 
  3️⃣ Persist as a user-level attribute and stamp onto events for easier reporting. 
  4️⃣ For anonymous users, use 'guest' or 'prospect' based on known lead state. 
  5️⃣ For subscription businesses, decide precedence between subscriber states and purchase-history states. 
  6️⃣ Capture after login, registration, purchase, subscription change, and CRM sync events. 
  7️⃣ Avoid using raw GA4 new/returning user as a substitute because it is device/browser based, not customer based.

Business Use Case: |
  1️⃣Analyze how customer lifecycle stage such as new, returning, loyal or reactivated impacts conversion, order value, retention, and support usage.
  2️⃣ Improve customer retention and revenue by tailoring onboarding, loyalty, and win-back campaigns for new, returning, and reactivated customers.
  3️⃣ Identify which customer lifecycle segments need targeted offers, service improvements, or retention actions to increase repeat purchases and lifetime value.







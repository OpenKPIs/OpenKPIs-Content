Dimension Name: Customer Status

Description: |
  Customer Status represents the shopper’s relationship and lifecycle stage within the customer journey, ranging from Prospect and New to Active, Returning, Churned, and Reactivated.

Category: Retention


Industry: Retail, E-commerce

Priority: High

Core Area: Digital Analytics

Scope: User

Data Type: string

Aggregation Window: Event, Session, User, Daily, Weekly, Monthly, Quarterly, Yearly


Google Analytics SQL: |
  -- ==========================================
  -- 1. GOOGLE BIGQUERY SQL (GA4 Export)
  -- ==========================================
  SELECT shipment_mode, COUNT(*) AS shipment_count
  FROM `your-project.erp.shipment_data`
  GROUP BY shipment_mode
  ORDER BY shipment_count DESC;

AEP Query Service SQL: |
  -- ==========================================
  -- 2. ADOBE AEP QUERY SERVICE SQL
  -- ==========================================
  SELECT shipment_mode, COUNT(*) AS shipment_count
  FROM aep_backend_dataset.shipment_data
  GROUP BY shipment_mode
  ORDER BY shipment_count DESC;

Calculation Notes: |
  Exclude shipments with incomplete mode data. Ensure real-time updates to reflect current distribution accurately.

Business Use Case: |
  Executives can optimize logistics strategies by analyzing the distribution of shipment modes to reduce costs and improve delivery times.



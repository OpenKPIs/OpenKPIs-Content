Dimension Name: Shipment Mode Distribution

Description: |
  Shipment Mode Distribution measures the proportion of shipments handled through various transportation modes such as air, sea, and land. It provides insights into logistics efficiency and cost management.

Category: Efficiency

Tags: [dimension]

Industry: Logistics & Supply Chain

Priority: High

Core Area: Generic

Scope: Event

Data Type: string

Aggregation Window: Event




Dimension Name: Transaction Type

Description: |
  Classifies each real estate transaction by its principal commercial or legal purpose, such as sale, lease, rental, refinance, or non-sale ownership transfer. It enables consistent comparison of transaction volume, conversion, revenue, cycle time, and operational performance across transaction classes.

Category: Conversion

Tags: [dimension]

Industry: Technology

Priority: High

Core Area: Monetization

Scope: Event

Data Type: string

Aggregation Window: Event







Google Analytics SQL: |
  -- ==========================================
  -- 1. GOOGLE BIGQUERY SQL
  -- ==========================================
  WITH source_values AS (
    SELECT
      TRIM(
        REGEXP_REPLACE(
          LOWER(
            CONCAT(
              COALESCE(CAST(transaction_type AS STRING), ''), ' ',
              COALESCE(CAST(deal_type AS STRING), ''), ' ',
              COALESCE(CAST(listing_type AS STRING), '')
            )
          ),
          r'[^a-z0-9]+',
          ' '
        )
      ) AS raw_descriptor
    FROM `your-project.enterprise_backend.transaction_records`
    WHERE COALESCE(is_deleted, FALSE) = FALSE
  ),
  normalized_values AS (
    SELECT
      raw_descriptor,
      CONCAT(' ', raw_descriptor, ' ') AS padded_descriptor
    FROM source_values
  ),
  classified AS (
    SELECT
      CASE
        WHEN raw_descriptor = '' THEN 'UNKNOWN'
        WHEN padded_descriptor LIKE '% refinance %'
          OR padded_descriptor LIKE '% refinancing %'
          OR padded_descriptor LIKE '% refinanced %'
          OR padded_descriptor LIKE '% refi %' THEN 'REFINANCE'
        WHEN padded_descriptor LIKE '% exchange %'
          OR padded_descriptor LIKE '% 1031 %' THEN 'EXCHANGE'
        WHEN padded_descriptor LIKE '% lease %'
          OR padded_descriptor LIKE '% leased %'
          OR padded_descriptor LIKE '% leasing %'
          OR padded_descriptor LIKE '% rent %'
          OR padded_descriptor LIKE '% rented %'
          OR padded_descriptor LIKE '% rental %' THEN 'LEASE'
        WHEN padded_descriptor LIKE '% purchase %'
          OR padded_descriptor LIKE '% purchased %'
          OR padded_descriptor LIKE '% acquisition %'
          OR padded_descriptor LIKE '% buyer %'
          OR padded_descriptor LIKE '% buy %'
          OR padded_descriptor LIKE '% buying %'
          OR padded_descriptor LIKE '% new construction %' THEN 'PURCHASE'
        WHEN padded_descriptor LIKE '% sale %'
          OR padded_descriptor LIKE '% resale %'
          OR padded_descriptor LIKE '% seller %'
          OR padded_descriptor LIKE '% sell %'
          OR padded_descriptor LIKE '% selling %'
          OR padded_descriptor LIKE '% sold %'
          OR padded_descriptor LIKE '% listing %' THEN 'SALE'
        ELSE 'OTHER'
      END AS transaction_type_code
    FROM normalized_values
  ),
  observed_codes AS (
    SELECT DISTINCT transaction_type_code
    FROM classified
  ),
  canonical_codes AS (
    SELECT 'SALE' AS transaction_type_code, 'Sale' AS transaction_type_name, FALSE AS is_unknown, 1 AS display_order
    UNION ALL
    SELECT 'PURCHASE', 'Purchase', FALSE, 2
    UNION ALL
    SELECT 'LEASE', 'Lease', FALSE, 3
    UNION ALL
    SELECT 'REFINANCE', 'Refinance', FALSE, 4
    UNION ALL
    SELECT 'EXCHANGE', 'Exchange', FALSE, 5
    UNION ALL
    SELECT 'OTHER', 'Other', FALSE, 98
    UNION ALL
    SELECT 'UNKNOWN', 'Unknown', TRUE, 99
  ),
  dimension_codes AS (
    SELECT
      canonical.transaction_type_code,
      canonical.transaction_type_name,
      canonical.is_unknown,
      canonical.display_order
    FROM canonical_codes AS canonical
    LEFT JOIN observed_codes AS observed
      ON canonical.transaction_type_code = observed.transaction_type_code
  )
  SELECT
    LOWER(TO_HEX(MD5(transaction_type_code))) AS transaction_type_key,
    transaction_type_code,
    transaction_type_name,
    is_unknown
  FROM dimension_codes
  ORDER BY display_order;

AEP Query Service SQL: |
  -- ==========================================
  -- 2. ADOBE AEP QUERY SERVICE SQL
  -- ==========================================
  WITH source_values AS (
    SELECT
      TRIM(
        REGEXP_REPLACE(
          LOWER(
            COALESCE(CAST(transaction_type AS VARCHAR), '') || ' ' ||
            COALESCE(CAST(deal_type AS VARCHAR), '') || ' ' ||
            COALESCE(CAST(listing_type AS VARCHAR), '')
          ),
          '[^a-z0-9]+',
          ' '
        )
      ) AS raw_descriptor
    FROM backend_transaction_dataset
    WHERE COALESCE(is_deleted, FALSE) = FALSE
  ),
  normalized_values AS (
    SELECT
      raw_descriptor,
      ' ' || raw_descriptor || ' ' AS padded_descriptor
    FROM source_values
  ),
  classified AS (
    SELECT
      CASE
        WHEN raw_descriptor = '' THEN 'UNKNOWN'
        WHEN padded_descriptor LIKE '% refinance %'
          OR padded_descriptor LIKE '% refinancing %'
          OR padded_descriptor LIKE '% refinanced %'
          OR padded_descriptor LIKE '% refi %' THEN 'REFINANCE'
        WHEN padded_descriptor LIKE '% exchange %'
          OR padded_descriptor LIKE '% 1031 %' THEN 'EXCHANGE'
        WHEN padded_descriptor LIKE '% lease %'
          OR padded_descriptor LIKE '% leased %'
          OR padded_descriptor LIKE '% leasing %'
          OR padded_descriptor LIKE '% rent %'
          OR padded_descriptor LIKE '% rented %'
          OR padded_descriptor LIKE '% rental %' THEN 'LEASE'
        WHEN padded_descriptor LIKE '% purchase %'
          OR padded_descriptor LIKE '% purchased %'
          OR padded_descriptor LIKE '% acquisition %'
          OR padded_descriptor LIKE '% buyer %'
          OR padded_descriptor LIKE '% buy %'
          OR padded_descriptor LIKE '% buying %'
          OR padded_descriptor LIKE '% new construction %' THEN 'PURCHASE'
        WHEN padded_descriptor LIKE '% sale %'
          OR padded_descriptor LIKE '% resale %'
          OR padded_descriptor LIKE '% seller %'
          OR padded_descriptor LIKE '% sell %'
          OR padded_descriptor LIKE '% selling %'
          OR padded_descriptor LIKE '% sold %'
          OR padded_descriptor LIKE '% listing %' THEN 'SALE'
        ELSE 'OTHER'
      END AS transaction_type_code
    FROM normalized_values
  ),
  observed_codes AS (
    SELECT DISTINCT transaction_type_code
    FROM classified
  ),
  canonical_codes AS (
    SELECT 'SALE' AS transaction_type_code, 'Sale' AS transaction_type_name, FALSE AS is_unknown, 1 AS display_order
    UNION ALL
    SELECT 'PURCHASE', 'Purchase', FALSE, 2
    UNION ALL
    SELECT 'LEASE', 'Lease', FALSE, 3
    UNION ALL
    SELECT 'REFINANCE', 'Refinance', FALSE, 4
    UNION ALL
    SELECT 'EXCHANGE', 'Exchange', FALSE, 5
    UNION ALL
    SELECT 'OTHER', 'Other', FALSE, 98
    UNION ALL
    SELECT 'UNKNOWN', 'Unknown', TRUE, 99
  ),
  dimension_codes AS (
    SELECT
      canonical.transaction_type_code,
      canonical.transaction_type_name,
      canonical.is_unknown,
      canonical.display_order
    FROM canonical_codes canonical
    LEFT JOIN observed_codes observed
      ON canonical.transaction_type_code = observed.transaction_type_code
  )
  SELECT
    LOWER(MD5(CAST(transaction_type_code AS VARCHAR))) AS transaction_type_key,

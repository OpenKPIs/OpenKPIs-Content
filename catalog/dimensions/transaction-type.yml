    is_unknown
  FROM dimension_codes
  ORDER BY display_order;

Calculation Notes: |
  Assign the canonical type effective at the event timestamp using the executed agreement or closing record first, followed by the governed transaction-management value and approved source-code mappings. Classify purchases, resales, new-construction sales, auction sales, and commercial property sales as sale; fixed-term leases, subleases, and renewals as lease; source-designated short-term, vacation, or recurring occupancy arrangements as rental; debt replacement or restructuring without an ownership sale as refinance; and non-sale title changes as transfer. Transaction side, customer role, property type, status, page labels, and event names must not determine the type. Preserve the type for cancelled, expired, withdrawn, and failed transactions, but exclude test, training, sandbox, duplicate, and deleted records from production reporting. Map missing, blank, contradictory, placeholder, or unresolved values to unknown; use other only for a populated source value that governance has confirmed falls outside the canonical taxonomy. Process late records using the classification and mapping effective at the original event timestamp; historical restatement requires an approved, auditable backfill. Session timeout rules do not apply.

Business Use Case: |
  The Chief Operating Officer compares conversion rate, close cycle, cancellation rate, and commission revenue by Transaction Type and finds that lease transactions have materially longer approval times in two markets. Operations responds by revising lease-specific document workflows, staffing, and partner integrations while leaving the sale process unchanged.



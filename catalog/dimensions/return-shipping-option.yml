Dimension Name: Return Shipping Option
Aliases: [Return Label Type, Return Shipping Method, Return Postage Option]


Description: |
  The postage arrangement recorded for a confirmed return request: a free prepaid label, a paid prepaid label, customer-arranged postage, or no shipment. It helps teams compare return shipping policies.

Category: Operational Efficiency

Tags: [returns, return postage, shipping policy]

Industry: [E-commerce, Retail]


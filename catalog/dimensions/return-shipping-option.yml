Google Analytics SQL: |
  WITH return_events AS (
    SELECT
      (SELECT p.value.string_value FROM UNNEST(event_params) AS p WHERE p.key = 'return_id') AS return_id,
      (SELECT p.value.string_value FROM UNNEST(event_params) AS p WHERE p.key = 'return_shipping_option') AS return_shipping_option
    FROM `{{GA4_PROJECT}}.{{GA4_DATASET}}.events_*`
    WHERE event_name = 'return_initiated'
      AND _TABLE_SUFFIX BETWEEN
        FORMAT_DATE('%Y%m%d', DATE_SUB(DATE(@report_start), INTERVAL 1 DAY))
        AND FORMAT_DATE('%Y%m%d', DATE_ADD(DATE(@report_end), INTERVAL 1 DAY))
      AND event_timestamp >= UNIX_MICROS(@report_start)
      AND event_timestamp < UNIX_MICROS(@report_end)
  )
  SELECT return_id, return_shipping_option
  FROM return_events
  WHERE return_id IS NOT NULL
    AND return_shipping_option IS NOT NULL;

AEP Query Service SQL: |
  SELECT
    _openkpis.returns.returnId AS return_id,
    _openkpis.returns.returnShippingOption AS return_shipping_option
  FROM {{AEP_EXPERIENCE_EVENT_DATASET}}
  WHERE eventType = 'return_initiated'
    AND timestamp >= CAST(:report_start AS TIMESTAMP)
    AND timestamp < CAST(:report_end AS TIMESTAMP)
    AND _openkpis.returns.returnId IS NOT NULL
    AND _openkpis.returns.returnShippingOption IS NOT NULL;

Calculation Notes: |
  1️⃣ Capture at request and label confirmation; separate labels require separate return IDs.
  2️⃣ free_prepaid_label has no fee; paid_prepaid_label has a refund deduction, after fee waivers.
  3️⃣ customer_arranged means customer-funded postage; not_applicable means no parcel shipment.
  4️⃣ Source rows must be unique per return ID. Exclude missing IDs or options; return collected values unchanged.
  5️⃣ Bind UTC report bounds; include start and exclude end by occurrence time. Later changes do not replace this value.

Business Use Case: |
  1️⃣ Returns teams compare postage arrangements before changing label fees or waiver rules.
  2️⃣ Customer Support reviews paid-label complaints to improve return policy wording.



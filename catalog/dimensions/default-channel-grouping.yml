Dimension Name: Default Channel Grouping

Description: |
  Session-scoped marketing channel (Organic Search, Paid Search, Paid Shopping, Paid Social, Organic Social, Email, Affiliates, Referral, Display, Direct and so on), assigned by evaluating the session's source, medium and campaign against an ordered, first-match rule set equivalent to GA4 "Session default channel group" and Adobe Analytics "Marketing Channel". It differs from First-Touch Channel Grouping in scope: this value can change on every session and credits the channel that started that visit, whereas the first-touch variant is fixed at user scope to the channel of the user's first recorded session and is used for acquisition cohorts rather than visit-level performance.

Category: Acquisition




























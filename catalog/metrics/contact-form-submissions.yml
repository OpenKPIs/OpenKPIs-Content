Google Analytics SQL: |
  WITH received AS (
    SELECT
      (SELECT p.value.string_value FROM UNNEST(event_params) AS p WHERE p.key = 'event_id') AS submission_id,
      SAFE_CAST((SELECT p.value.string_value FROM UNNEST(event_params) AS p
        WHERE p.key = 'occurred_at') AS TIMESTAMP) AS confirmed_at
    FROM `project.analytics.events_*`
    WHERE event_name = 'contact_form_submission'
      AND _TABLE_SUFFIX BETWEEN FORMAT_DATE('%Y%m%d', DATE_SUB(DATE(@report_start), INTERVAL 1 DAY))
        AND FORMAT_DATE('%Y%m%d', DATE_ADD(DATE(@report_end), INTERVAL 1 DAY))
      AND event_timestamp < UNIX_MICROS(@report_end)
  )
  SELECT COUNT(DISTINCT NULLIF(submission_id, '')) AS contact_form_submissions
  FROM received
  WHERE confirmed_at >= @report_start AND confirmed_at < @report_end

AEP Query Service SQL: |
  -- In the selected dataset, reserve web.formFilledOut for accepted web contact and support forms that meet the source exclusions.
  -- Set drop_system_columns=false in the Query Service session before running this SELECT.
  -- Bind start and end as UTC instants and REPORT_END_EPOCH_MS to that same end in epoch milliseconds.
  WITH received AS (
    SELECT e._id AS submission_id, e.timestamp AS confirmed_at
    FROM {{AEP_EXPERIENCE_EVENT_DATASET}} AS e
    WHERE e.eventType = 'web.formFilledOut'
      AND e._acp_system_metadata.ingestTime < {{REPORT_END_EPOCH_MS}}
  )
  SELECT COUNT(DISTINCT NULLIF(submission_id, '')) AS contact_form_submissions
  FROM received
  WHERE confirmed_at >= CAST('{{REPORT_START_UTC}}' AS TIMESTAMP)
    AND confirmed_at < CAST('{{REPORT_END_UTC}}' AS TIMESTAMP)

Calculation Notes: |
  1️⃣ Count accepted contact and support forms only. Exclude internal traffic, bots and blocked spam at the source.
  2️⃣ Use the confirmation time. Include the reporting period start and exclude its end.
  3️⃣ Count only events received by each analytics platform before the reporting period ended.
  4️⃣ Count each submission ID once. Retries keep the original ID. Separate accepted submissions get distinct IDs.
  5️⃣ Receipt times vary by platform, so events confirmed near the period end can produce different counts.

Business Use Case: |
  1️⃣ Customer Support uses weekly submission patterns to schedule coverage for the form queue.
  2️⃣ Customer Support investigates spikes after site releases to decide whether to update help content.


Metric Name: Contact Form Submissions
Aliases: [Contact Us Submissions, Support Form Submissions, Web Contact Form Submissions]

Formula: Total successful contact form submissions

Description: |
  Counts successful submissions through web contact and support forms. Customer Support uses this count to track demand for help through those forms.

Category: Engagement

Tags: [contact forms, customer support, support demand]

Industry: [E-commerce, Retail]

Business Criticality: Medium

Journey / Navigation Area: [Customer Service]

Owning Function: Customer Support

Scope: Event

Measurement Channels: [Web]

Measure Type: Counter

Aggregation Window: [Daily, Weekly, Monthly, Selected Reporting Period]

GA4 Event: |

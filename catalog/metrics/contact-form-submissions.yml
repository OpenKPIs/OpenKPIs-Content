Metric Name: Contact Form Submissions
Formula: COUNT(submit_form events WHERE form_type = 'contact' AND form_status = 'success'), deduplicated per submission, by event date in the reporting period

Description: |
  Count of successful contact and support form submissions in the period, from the unified submit_form event filtered to the contact form. It is the numerator of Support Contact Rate.


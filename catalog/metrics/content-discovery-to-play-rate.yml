Metric Name: Content Discovery-to-Play Rate
Formula: (COUNT(DISTINCT discovery_event_id WHERE attributed_qualified_play = true) / COUNT(DISTINCT eligible_discovery_event_id)) * 100

Description: |
  Measures the percentage of eligible content discovery interactions that lead to a qualified play of the selected title within the same session and a 30-minute attribution window. It indicates how effectively search, browse, recommendation, and editorial discovery experiences convert content interest into actual viewing or listening.

Category: Conversion

Tags: [metric]

Industry: Media & Streaming

Priority: High

Core Area: Discovery

Scope: Session

Measure Type: percentage

Aggregation Window: Time based - Daily


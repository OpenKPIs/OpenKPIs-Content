Calculation Notes: |
  Use discovery_event_id as the denominator grain. An eligible discovery event is an intentional selection of a playable content item from an approved discovery surface, including search results, browse or category rails, recommendations, editorial collections, watchlists, and promotional content modules. Attribute a conversion when the same session produces a qualified play for the selected content_id within 30 minutes after the discovery event. A qualified play requires successful playback initiation and at least 30 seconds of continuous or cumulative playback; for assets shorter than 30 seconds, require at least 90% completion. For live content, require at least 30 seconds of playback. Count each discovery_event_id no more than once, even when it produces multiple play events. If multiple eligible discovery events for the same content precede one qualified play, credit only the most recent eligible event. Exclude autoplay, background playback, previews, trailers when the selected item was a full program, bot or test traffic, internal QA accounts, unsupported content, entitlement-blocked selections, and events missing session_id, discovery_event_id, content_id, event timestamp, or discovery source. Sessions expire after 30 minutes of inactivity unless a platform-standard authenticated session boundary ends earlier. Calculate numerator and denominator using the discovery event date in the reporting timezone. Reprocess late playback events for 72 hours.

Business Use Case: |
  The Product organization compares this rate by discovery source, device, market, subscription tier, and content rail to identify experiences that generate interest but fail to initiate playback. For example, if a home-page recommendation rail has high selection volume but a materially lower discovery-to-play rate than comparable rails, Product can investigate entitlement messaging, detail-page friction, playback errors, ranking quality, or misleading artwork and then prioritize design, metadata, or recommendation-model changes.



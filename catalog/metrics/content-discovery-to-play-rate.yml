# Metric: Content Discovery-to-Play Rate
# Generated: 2026-09-14T08:12:19.743Z
# Contributed by: devyendarm
# Last modified by: devyendarm

Metric Name: Content Discovery-to-Play Rate
Formula: (COUNT(DISTINCT session × title exposures from view_item_list WHERE discovery_source IN (search, browse, recommendation, editorial) AND tile item_variant NOT IN (trailer, preview), with title = content_series_id falling back to content_id / item_id, WHERE a video_start of the same title (content_series_id falling back to content_id) with play_trigger NOT IN (autoplay, next_episode) AND content_type NOT IN (trailer, preview) occurs in the same session at or after the first exposure and within 30 minutes of it) / COUNT(DISTINCT session × title exposures from view_item_list with the same discovery_source and trailer/preview rules)) × 100

Description: |
  Percentage of distinct title discovery exposures (a title surfaced to a viewer in a search, browse, recommendation or editorial list, counted once per session) that are followed by a playback start of that same title in the same session within 30 minutes of the first exposure. It is the streaming industry's browse-to-play conversion measure and shows how well the catalogue presentation, ranking and artwork turn what a viewer is shown into what they actually watch.

Category: Conversion

Tags: [metric, Media & Streaming: Content Discovery & Playback]

Industry: Media & Streaming, Media

Priority: High

Core Area: Discovery

Scope: Session

Measure Type: Percentage

Aggregation Window: Time based - Daily, Daily, Weekly, Monthly


# Metric: Loyalty Points Redeemed
# Generated: 2026-09-19T17:56:55.948Z
# Contributed by: devyendarm


Metric Name: Loyalty Points Redeemed
Formula: SUM(points_redeemed on confirmed loyalty_reward_redemption transactions) − SUM(points_reversed on redemption reversals posted against those transactions)

Description: |
  Total loyalty points burned by program members in the reporting period across web, app and in-store redemptions, taken from confirmed redemption transactions reconciled to the loyalty platform ledger and stated net of reversed or cancelled redemptions. It is the numerator of Loyalty Redemption Rate and the operational volume behind the release of the points liability, so it shows whether the program's currency is being spent or piling up as unredeemed balance.

Category: Retention



























    device_category,
    platform_name,
    campaign_id,
    campaign_source,
    campaign_medium,
    campaign_name,
    referrer_domain,
    is_new_customer,
    customer_segment,
    lead_stage,
    appointment_status,
    completion_source,
    completion_method,
    completion_status,
    reschedule_flag,

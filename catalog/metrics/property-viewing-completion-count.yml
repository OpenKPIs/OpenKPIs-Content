# Metric: Property Viewing Completion Count
# Generated: 2026-09-07T13:30:25.506Z
# Contributed by: devyendarm
# Last modified by: devyendarm

Metric Name: Property Viewing Completion Count
Formula: COUNT(DISTINCT viewing_id) FILTER (WHERE event_name = 'property_viewing_completed' AND completion_timestamp >= window_start AND completion_timestamp < window_end AND viewing_id IS NOT NULL AND is_test = false AND is_cancelled = false)

Description: |
  Counts distinct property viewing appointments that reached a verified completed status during the reporting window across in-person, agent-led virtual, and self-guided channels. Each viewing is counted once by its canonical viewing ID at the completion timestamp, regardless of duplicate completion signals or the number of attendees.

Category: Conversion

Tags: [metric]

Industry: Real Estate Tech

Priority: High

Core Area: Engagement

Scope: Event

Measure Type: count

Aggregation Window: Time based - Hourly/Daily/Monthly/Yearly







Google Analytics SQL: |
  -- ==========================================
  -- 1. GOOGLE BIGQUERY SQL
  -- ==========================================
  WITH latest_record AS (
    SELECT * EXCEPT (record_rank)
    FROM (
      SELECT
        source.*,
        ROW_NUMBER() OVER (
          PARTITION BY viewing_id
          ORDER BY record_updated_at DESC, source_priority DESC
        ) AS record_rank
      FROM `your-project.omnichannel.viewing_fulfillment_records` AS source
      WHERE _PARTITIONDATE BETWEEN @start_date AND @end_date
        AND viewing_id IS NOT NULL
    )
    WHERE record_rank = 1
  ),
  completion_evidence AS (
    SELECT
      latest_record.*,
      COALESCE(
        platform_completed_at,
        crm_completed_at,
        agent_check_out_at,
        self_guided_exit_at,
        virtual_tour_ended_at,
        status_updated_at,
        scheduled_end_at
      ) AS completion_timestamp,
      CASE
        WHEN agent_check_in_at IS NOT NULL AND agent_check_out_at IS NOT NULL
          THEN 'agent_confirmation'
        WHEN self_guided_entry_at IS NOT NULL AND self_guided_exit_at IS NOT NULL
          THEN 'self_guided_access'
        WHEN virtual_tour_started_at IS NOT NULL AND virtual_tour_ended_at IS NOT NULL
          THEN 'virtual_tour_provider'
        WHEN platform_completed_at IS NOT NULL
          THEN 'property_viewing_platform'
        WHEN crm_completed_at IS NOT NULL
             OR LOWER(TRIM(COALESCE(appointment_status, ''))) IN ('completed', 'fulfilled')
          THEN 'crm'
        ELSE NULL
      END AS derived_completion_source,
      CASE
        WHEN platform_completed_at IS NOT NULL THEN TRUE
        WHEN crm_completed_at IS NOT NULL THEN TRUE
        WHEN LOWER(TRIM(COALESCE(appointment_status, ''))) IN ('completed', 'fulfilled') THEN TRUE
        WHEN agent_check_in_at IS NOT NULL AND agent_check_out_at IS NOT NULL THEN TRUE
        WHEN self_guided_entry_at IS NOT NULL AND self_guided_exit_at IS NOT NULL THEN TRUE
        WHEN virtual_tour_started_at IS NOT NULL AND virtual_tour_ended_at IS NOT NULL THEN TRUE
        ELSE FALSE
      END AS is_completed
    FROM latest_record
  ),
  completed_viewings AS (
    SELECT *
    FROM completion_evidence
    WHERE is_completed
      AND completion_timestamp IS NOT NULL
      AND DATE(completion_timestamp) BETWEEN @start_date AND @end_date
  ),
  attributed AS (
    SELECT
      DATE(completion_timestamp) AS metric_date,
      DATE(appointment_created_at) AS appointment_created_date,
      DATE(scheduled_start_at) AS scheduled_start_date,
      EXTRACT(HOUR FROM scheduled_start_at) AS scheduled_hour,
      EXTRACT(YEAR FROM completion_timestamp) AS completion_year,
      EXTRACT(MONTH FROM completion_timestamp) AS completion_month,
      EXTRACT(ISOWEEK FROM completion_timestamp) AS completion_week,
      EXTRACT(DAYOFWEEK FROM completion_timestamp) AS completion_day_of_week,
      COALESCE(CAST(market_id AS STRING), 'unknown') AS market_id,
      COALESCE(market_name, 'unknown') AS market_name,
      COALESCE(region_name, 'unknown') AS region_name,
      COALESCE(country_code, 'unknown') AS country_code,
      COALESCE(state_region, 'unknown') AS state_region,
      COALESCE(city, 'unknown') AS city,
      COALESCE(postal_code, 'unknown') AS postal_code,
      COALESCE(CAST(property_id AS STRING), 'unknown') AS property_id,
      COALESCE(property_type, 'unknown') AS property_type,
      COALESCE(CAST(listing_id AS STRING), 'unknown') AS listing_id,
      COALESCE(CAST(community_id AS STRING), 'unknown') AS community_id,
      COALESCE(CAST(office_id AS STRING), 'unknown') AS office_id,
      COALESCE(CAST(agent_id AS STRING), 'unknown') AS agent_id,
      COALESCE(CAST(agent_team_id AS STRING), 'unknown') AS agent_team_id,
      COALESCE(CAST(customer_id AS STRING), 'unknown') AS customer_id,
      COALESCE(CAST(lead_id AS STRING), 'unknown') AS lead_id,
      COALESCE(CAST(account_id AS STRING), 'unknown') AS account_id,
      COALESCE(appointment_channel, 'unknown') AS appointment_channel,
      COALESCE(booking_source, 'unknown') AS booking_source,
      COALESCE(viewing_mode, 'unknown') AS viewing_mode,
      COALESCE(device_category, 'unknown') AS device_category,
      COALESCE(platform_name, 'unknown') AS platform_name,
      COALESCE(CAST(campaign_id AS STRING), 'unknown') AS campaign_id,
      COALESCE(campaign_source, 'unknown') AS campaign_source,
      COALESCE(campaign_medium, 'unknown') AS campaign_medium,
      COALESCE(campaign_name, 'unknown') AS campaign_name,
      COALESCE(referrer_domain, 'unknown') AS referrer_domain,
      COALESCE(is_new_customer, FALSE) AS is_new_customer,
      COALESCE(customer_segment, 'unknown') AS customer_segment,
      COALESCE(lead_stage, 'unknown') AS lead_stage,
      COALESCE(appointment_status, 'unknown') AS appointment_status,
      derived_completion_source AS completion_source,
      COALESCE(completion_method, viewing_mode, 'unknown') AS completion_method,
      'completed' AS completion_status,
      COALESCE(reschedule_flag, FALSE) AS reschedule_flag,
      COALESCE(cancellation_flag, FALSE) AS cancellation_flag,
      COALESCE(no_show_flag, FALSE) AS no_show_flag,
      CASE
        WHEN viewing_duration_seconds IS NULL THEN 'unknown'
        WHEN viewing_duration_seconds < 300 THEN 'under_5_minutes'
        WHEN viewing_duration_seconds < 900 THEN '5_to_14_minutes'
        WHEN viewing_duration_seconds < 1800 THEN '15_to_29_minutes'
        WHEN viewing_duration_seconds < 3600 THEN '30_to_59_minutes'
        ELSE '60_minutes_or_more'
      END AS duration_bucket,
      COALESCE(access_method, 'unknown') AS access_method,
      COALESCE(identity_stitch_status, 'unknown') AS identity_stitch_status,
      COALESCE(consent_status, 'unknown') AS consent_status,
      viewing_id
    FROM completed_viewings
  )
  SELECT
    metric_date,
    appointment_created_date,
    scheduled_start_date,

Calculation Notes: |
  Use the canonical completion timestamp rather than the scheduling, start, ingestion, or update timestamp. Count one record per canonical viewing_id after cross-channel deduplication; multiple attendees, repeated status updates, webhook retries, and client/server duplicates do not increase the count. A rescheduled appointment counts only when its active appointment instance completes, while the superseded instance is excluded; a later repeat visit counts separately when it has a new viewing_id. Include completed walk-in and on-demand self-guided viewings when a canonical viewing_id and approved completion signal exist. Exclude cancellations, no-shows, abandoned starts, test records, employee demonstrations, bot activity, deleted fraudulent events, and records without a verifiable completion signal. Session timeout does not determine completion; digital session boundaries may support validation but cannot create or remove a completed viewing.

Business Use Case: |
  The Chief Product Officer and regional sales leadership compare completed viewings by property, market, booking channel, and acquisition source to identify where scheduled demand fails to become attended engagement. If a market has strong bookings but a low completion rate, teams can adjust reminder journeys, agent capacity, self-guided access reliability, scheduling availability, and follow-up messaging, then measure whether completed viewings and downstream offers increase.


Source Data: Property Viewing Platform and CRM appointment records stitched with Web/Mobile Digital Analytics, virtual-tour provider events, self-guided access events, and agent check-in or check-out confirmations


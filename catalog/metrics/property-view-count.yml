Metric Name: Property View Count
Formula: COUNT(property_view_events)

Description: |
  The total number of times a property listing is viewed by users on the platform, indicating interest and engagement.

Category: Engagement

Tags: [metric]

Industry: Real Estate Tech

Priority: High

Core Area: Discovery

Scope: Item

Measure Type: count

Aggregation Window: Time based - Daily


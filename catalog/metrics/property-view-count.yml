Google Analytics SQL: |
  -- ==========================================
  -- 1. GOOGLE BIGQUERY SQL (GA4 Export)
  -- ==========================================
  SELECT COUNT(*) AS property_view_count
  FROM `your-project.analytics_123456789.events_*`
  WHERE _TABLE_SUFFIX BETWEEN '20230101' AND '20231231'
  AND event_name = 'view_item'
  AND EXISTS (
    SELECT 1
    FROM UNNEST(event_params) AS params
    WHERE params.key = 'item_category'
  );
  

AEP Query Service SQL: |
  -- ==========================================
  -- 2. ADOBE AEP QUERY SERVICE SQL (XDM Dataset)
  -- ==========================================
  SELECT COUNT(*) AS property_view_count
  FROM your_aep_dataset.events
  WHERE eventType = 'view_item'
  AND EXISTS (
    SELECT 1
    FROM eventParams AS params
    WHERE params.key = 'item_category'
  );
  

Calculation Notes: |
  Exclude bot traffic and internal IP addresses. Consider session timeout of 30 minutes.

Business Use Case: |
  Executives use this metric to identify high-interest properties and allocate marketing resources effectively.



Google Analytics SQL: |
  -- ==========================================
  -- 1. GOOGLE BIGQUERY SQL
  -- ==========================================
  WITH parameterized_events AS (
    SELECT
      PARSE_DATE('%Y%m%d', e.event_date) AS event_date,
      e.event_timestamp AS ga4_event_timestamp,
      e.user_pseudo_id,
      MAX(IF(p.key = 'search_id', COALESCE(p.value.string_value, CAST(p.value.int_value AS STRING)), NULL)) AS search_id,
      MAX(IF(p.key = 'search_term', p.value.string_value, NULL)) AS search_term,
      MAX(IF(p.key = 'search_type', p.value.string_value, NULL)) AS search_type,
      MAX(IF(p.key = 'search_results_count', COALESCE(p.value.string_value, CAST(p.value.int_value AS STRING), CAST(p.value.double_value AS STRING)), NULL)) AS search_results_count_raw,
      MAX(IF(p.key = 'search_status', p.value.string_value, NULL)) AS search_status,
      MAX(IF(p.key = 'search_filters_count', COALESCE(p.value.string_value, CAST(p.value.int_value AS STRING)), NULL)) AS search_filters_count_raw,
      MAX(IF(p.key = 'property_type', p.value.string_value, NULL)) AS property_type,
      MAX(IF(p.key = 'listing_type', p.value.string_value, NULL)) AS listing_type,
      MAX(IF(p.key = 'location_query', p.value.string_value, NULL)) AS location_query,
      MAX(IF(p.key = 'location_id', COALESCE(p.value.string_value, CAST(p.value.int_value AS STRING)), NULL)) AS location_id,
      MAX(IF(p.key = 'city', p.value.string_value, NULL)) AS city,
      MAX(IF(p.key = 'region', p.value.string_value, NULL)) AS region,
      MAX(IF(p.key = 'country', p.value.string_value, NULL)) AS country,
      MAX(IF(p.key = 'postal_code', COALESCE(p.value.string_value, CAST(p.value.int_value AS STRING)), NULL)) AS postal_code,
      MAX(IF(p.key = 'latitude', COALESCE(p.value.string_value, CAST(p.value.double_value AS STRING), CAST(p.value.float_value AS STRING)), NULL)) AS latitude_raw,
      MAX(IF(p.key = 'longitude', COALESCE(p.value.string_value, CAST(p.value.double_value AS STRING), CAST(p.value.float_value AS STRING)), NULL)) AS longitude_raw,
      MAX(IF(p.key = 'radius', COALESCE(p.value.string_value, CAST(p.value.int_value AS STRING), CAST(p.value.double_value AS STRING)), NULL)) AS radius_raw,
      MAX(IF(p.key = 'radius_unit', p.value.string_value, NULL)) AS radius_unit,
      MAX(IF(p.key = 'min_price', COALESCE(p.value.string_value, CAST(p.value.int_value AS STRING), CAST(p.value.double_value AS STRING)), NULL)) AS min_price_raw,
      MAX(IF(p.key = 'max_price', COALESCE(p.value.string_value, CAST(p.value.int_value AS STRING), CAST(p.value.double_value AS STRING)), NULL)) AS max_price_raw,
      MAX(IF(p.key = 'currency', p.value.string_value, NULL)) AS currency,
      MAX(IF(p.key = 'min_bedrooms', COALESCE(p.value.string_value, CAST(p.value.int_value AS STRING), CAST(p.value.double_value AS STRING)), NULL)) AS min_bedrooms_raw,
      MAX(IF(p.key = 'max_bedrooms', COALESCE(p.value.string_value, CAST(p.value.int_value AS STRING), CAST(p.value.double_value AS STRING)), NULL)) AS max_bedrooms_raw,
      MAX(IF(p.key = 'min_bathrooms', COALESCE(p.value.string_value, CAST(p.value.int_value AS STRING), CAST(p.value.double_value AS STRING)), NULL)) AS min_bathrooms_raw,
      MAX(IF(p.key = 'max_bathrooms', COALESCE(p.value.string_value, CAST(p.value.int_value AS STRING), CAST(p.value.double_value AS STRING)), NULL)) AS max_bathrooms_raw,
      MAX(IF(p.key = 'min_area', COALESCE(p.value.string_value, CAST(p.value.int_value AS STRING), CAST(p.value.double_value AS STRING)), NULL)) AS min_area_raw,
      MAX(IF(p.key = 'max_area', COALESCE(p.value.string_value, CAST(p.value.int_value AS STRING), CAST(p.value.double_value AS STRING)), NULL)) AS max_area_raw,
      MAX(IF(p.key = 'area_unit', p.value.string_value, NULL)) AS area_unit,
      MAX(IF(p.key = 'move_in_date', p.value.string_value, NULL)) AS move_in_date_raw,
      MAX(IF(p.key = 'amenities', p.value.string_value, NULL)) AS amenities,
      MAX(IF(p.key = 'sort_order', p.value.string_value, NULL)) AS sort_order,
      MAX(IF(p.key = 'page_number', COALESCE(p.value.string_value, CAST(p.value.int_value AS STRING)), NULL)) AS page_number_raw,
      MAX(IF(p.key = 'results_per_page', COALESCE(p.value.string_value, CAST(p.value.int_value AS STRING)), NULL)) AS results_per_page_raw,
      MAX(IF(p.key = 'experience_name', p.value.string_value, NULL)) AS experience_name,
      MAX(IF(p.key = 'search_surface', p.value.string_value, NULL)) AS search_surface,
      MAX(IF(p.key = 'interaction_type', p.value.string_value, NULL)) AS interaction_type,
      MAX(IF(p.key = 'submission_method', p.value.string_value, NULL)) AS submission_method,
      MAX(IF(p.key = 'is_valid_search', COALESCE(p.value.string_value, CAST(p.value.int_value AS STRING)), NULL)) AS is_valid_search_raw,
      MAX(IF(p.key = 'is_duplicate', COALESCE(p.value.string_value, CAST(p.value.int_value AS STRING)), NULL)) AS is_duplicate_raw,
      MAX(IF(p.key = 'is_automated_traffic', COALESCE(p.value.string_value, CAST(p.value.int_value AS STRING)), NULL)) AS is_automated_traffic_raw,
      MAX(IF(p.key = 'is_pagination', COALESCE(p.value.string_value, CAST(p.value.int_value AS STRING)), NULL)) AS is_pagination_raw,
      MAX(IF(p.key = 'is_sort_only', COALESCE(p.value.string_value, CAST(p.value.int_value AS STRING)), NULL)) AS is_sort_only_raw,
      MAX(IF(p.key = 'consent_analytics', COALESCE(p.value.string_value, CAST(p.value.int_value AS STRING)), NULL)) AS consent_analytics,
      MAX(IF(p.key = 'user_login_state', p.value.string_value, NULL)) AS user_login_state,
      MAX(IF(p.key = 'session_id', COALESCE(p.value.string_value, CAST(p.value.int_value AS STRING)), NULL)) AS session_id,
      MAX(IF(p.key = 'page_location', p.value.string_value, NULL)) AS page_location,
      MAX(IF(p.key = 'page_referrer', p.value.string_value, NULL)) AS page_referrer,
      MAX(IF(p.key = 'timestamp', p.value.string_value, NULL)) AS timestamp_raw,
      MAX(IF(p.key = 'event_id', COALESCE(p.value.string_value, CAST(p.value.int_value AS STRING)), NULL)) AS event_id
    FROM `your-project.analytics_123456789.events_*` AS e
    LEFT JOIN UNNEST(e.event_params) AS p
    WHERE e.event_name = 'search'
      AND _TABLE_SUFFIX BETWEEN FORMAT_DATE('%Y%m%d', @start_date)
                            AND FORMAT_DATE('%Y%m%d', @end_date)
    GROUP BY
      e.event_date,
      e.event_timestamp,
      e.user_pseudo_id,
      e.event_bundle_sequence_id
  ),
  normalized_events AS (
    SELECT
      event_date,
      search_id,
      search_term,
      LOWER(TRIM(search_type)) AS search_type,
      SAFE_CAST(search_results_count_raw AS INT64) AS search_results_count,
      LOWER(TRIM(search_status)) AS search_status,
      SAFE_CAST(search_filters_count_raw AS INT64) AS search_filters_count,
      property_type,
      listing_type,
      location_query,
      location_id,
      city,
      region,
      country,
      postal_code,
      SAFE_CAST(latitude_raw AS FLOAT64) AS latitude,
      SAFE_CAST(longitude_raw AS FLOAT64) AS longitude,
      SAFE_CAST(radius_raw AS NUMERIC) AS radius,
      radius_unit,
      SAFE_CAST(min_price_raw AS NUMERIC) AS min_price,
      SAFE_CAST(max_price_raw AS NUMERIC) AS max_price,
      currency,
      SAFE_CAST(min_bedrooms_raw AS NUMERIC) AS min_bedrooms,
      SAFE_CAST(max_bedrooms_raw AS NUMERIC) AS max_bedrooms,
      SAFE_CAST(min_bathrooms_raw AS NUMERIC) AS min_bathrooms,
      SAFE_CAST(max_bathrooms_raw AS NUMERIC) AS max_bathrooms,
      SAFE_CAST(min_area_raw AS NUMERIC) AS min_area,
      SAFE_CAST(max_area_raw AS NUMERIC) AS max_area,
      area_unit,
      SAFE_CAST(move_in_date_raw AS DATE) AS move_in_date,
      amenities,
      sort_order,
      SAFE_CAST(page_number_raw AS INT64) AS page_number,
      SAFE_CAST(results_per_page_raw AS INT64) AS results_per_page,
      experience_name,
      search_surface,
      LOWER(TRIM(interaction_type)) AS interaction_type,
      submission_method,
      LOWER(TRIM(is_valid_search_raw)) IN ('true', '1') AS is_valid_search,
      LOWER(TRIM(is_duplicate_raw)) IN ('true', '1') AS is_duplicate,
      LOWER(TRIM(is_automated_traffic_raw)) IN ('true', '1') AS is_automated_traffic,
      LOWER(TRIM(is_pagination_raw)) IN ('true', '1') AS is_pagination,
      LOWER(TRIM(is_sort_only_raw)) IN ('true', '1') AS is_sort_only,
      consent_analytics,
      user_login_state,
      session_id,
      page_location,
      page_referrer,
      COALESCE(SAFE_CAST(timestamp_raw AS TIMESTAMP), TIMESTAMP_MICROS(ga4_event_timestamp)) AS timestamp,
      event_id,
      COALESCE(
        NULLIF(event_id, ''),
        TO_HEX(SHA256(CONCAT(
          COALESCE(user_pseudo_id, ''), '|',
          CAST(ga4_event_timestamp AS STRING), '|',
          COALESCE(search_id, ''), '|',
          COALESCE(session_id, '')
        )))
      ) AS metric_event_key
    FROM parameterized_events
  ),
  deduplicated_searches AS (
    SELECT *
    FROM normalized_events
    WHERE search_type = 'property'
      AND search_status = 'submitted'
      AND interaction_type = 'search_submission'
      AND is_valid_search IS TRUE
      AND is_duplicate IS FALSE
      AND is_automated_traffic IS FALSE
      AND is_pagination IS FALSE
      AND is_sort_only IS FALSE
    QUALIFY ROW_NUMBER() OVER (
      PARTITION BY metric_event_key
      ORDER BY timestamp
    ) = 1
  )
  SELECT
    event_date,
    search_id,
    search_term,
    search_type,
    search_results_count,
    search_status,
    search_filters_count,
    property_type,
    listing_type,
    location_query,
    location_id,
    city,
    region,
    country,
    postal_code,
    latitude,
    longitude,
    radius,
    radius_unit,
    min_price,
    max_price,
    currency,
    min_bedrooms,
    max_bedrooms,
    min_bathrooms,
    max_bathrooms,
    min_area,
    max_area,
    area_unit,
    move_in_date,
    amenities,
    sort_order,
    page_number,
    results_per_page,
    experience_name,
    search_surface,
    interaction_type,
    submission_method,
    is_valid_search,
    is_duplicate,
    is_automated_traffic,
    is_pagination,
    is_sort_only,
    consent_analytics,
    user_login_state,
    session_id,
    page_location,
    page_referrer,
    timestamp,
    event_id,
    1 AS property_search_count
  FROM deduplicated_searches;

AEP Query Service SQL: |
  -- ==========================================
  -- 2. ADOBE AEP QUERY SERVICE SQL
  -- ==========================================
  WITH normalized_events AS (
    SELECT
      CAST(COALESCE(CAST(_realEstate.search.timestamp AS TIMESTAMP), timestamp) AS DATE) AS event_date,
      _realEstate.search.search_id AS search_id,
      _realEstate.search.search_term AS search_term,
      LOWER(TRIM(_realEstate.search.search_type)) AS search_type,
      CAST(_realEstate.search.search_results_count AS BIGINT) AS search_results_count,
      LOWER(TRIM(_realEstate.search.search_status)) AS search_status,
      CAST(_realEstate.search.search_filters_count AS BIGINT) AS search_filters_count,
      _realEstate.search.property_type AS property_type,
      _realEstate.search.listing_type AS listing_type,
      _realEstate.search.location_query AS location_query,
      _realEstate.search.location_id AS location_id,
      _realEstate.search.city AS city,
      _realEstate.search.region AS region,
      _realEstate.search.country AS country,
      _realEstate.search.postal_code AS postal_code,
      CAST(_realEstate.search.latitude AS DOUBLE) AS latitude,
      CAST(_realEstate.search.longitude AS DOUBLE) AS longitude,
      CAST(_realEstate.search.radius AS DECIMAL(18,4)) AS radius,
      _realEstate.search.radius_unit AS radius_unit,
      CAST(_realEstate.search.min_price AS DECIMAL(18,2)) AS min_price,
      CAST(_realEstate.search.max_price AS DECIMAL(18,2)) AS max_price,
      _realEstate.search.currency AS currency,
      CAST(_realEstate.search.min_bedrooms AS DECIMAL(10,2)) AS min_bedrooms,
      CAST(_realEstate.search.max_bedrooms AS DECIMAL(10,2)) AS max_bedrooms,
      CAST(_realEstate.search.min_bathrooms AS DECIMAL(10,2)) AS min_bathrooms,
      CAST(_realEstate.search.max_bathrooms AS DECIMAL(10,2)) AS max_bathrooms,
      CAST(_realEstate.search.min_area AS DECIMAL(18,2)) AS min_area,
      CAST(_realEstate.search.max_area AS DECIMAL(18,2)) AS max_area,
      _realEstate.search.area_unit AS area_unit,
      CAST(_realEstate.search.move_in_date AS DATE) AS move_in_date,
      _realEstate.search.amenities AS amenities,
      _realEstate.search.sort_order AS sort_order,
      CAST(_realEstate.search.page_number AS BIGINT) AS page_number,
      CAST(_realEstate.search.results_per_page AS BIGINT) AS results_per_page,
      _realEstate.search.experience_name AS experience_name,
      _realEstate.search.search_surface AS search_surface,
      LOWER(TRIM(_realEstate.search.interaction_type)) AS interaction_type,
      _realEstate.search.submission_method AS submission_method,
      CAST(_realEstate.search.is_valid_search AS BOOLEAN) AS is_valid_search,
      CAST(_realEstate.search.is_duplicate AS BOOLEAN) AS is_duplicate,
      CAST(_realEstate.search.is_automated_traffic AS BOOLEAN) AS is_automated_traffic,
      CAST(_realEstate.search.is_pagination AS BOOLEAN) AS is_pagination,
      CAST(_realEstate.search.is_sort_only AS BOOLEAN) AS is_sort_only,
      _realEstate.search.consent_analytics AS consent_analytics,
      _realEstate.search.user_login_state AS user_login_state,
      _realEstate.search.session_id AS session_id,
      COALESCE(_realEstate.search.page_location, web.webPageDetails.URL) AS page_location,
      COALESCE(_realEstate.search.page_referrer, web.webReferrer.URL) AS page_referrer,
      COALESCE(CAST(_realEstate.search.timestamp AS TIMESTAMP), timestamp) AS search_timestamp,
      COALESCE(_realEstate.search.event_id, _id) AS event_id,
      COALESCE(
        _realEstate.search.event_id,
        _id,
        SHA2(CONCAT(
          COALESCE(_realEstate.search.session_id, ''), '|',
          COALESCE(CAST(timestamp AS STRING), ''), '|',
          COALESCE(_realEstate.search.search_id, '')
        ), 256)
      ) AS metric_event_key
    FROM real_estate_web_events
    WHERE eventType = 'web.webinteraction.search'
      AND CAST(timestamp AS DATE) BETWEEN :start_date AND :end_date
  ),
  qualified_searches AS (
    SELECT
      *,
      ROW_NUMBER() OVER (
        PARTITION BY metric_event_key
        ORDER BY search_timestamp
      ) AS deduplication_row_number
    FROM normalized_events
    WHERE search_type = 'property'
      AND search_status = 'submitted'
      AND interaction_type = 'search_submission'
      AND is_valid_search = TRUE
      AND is_duplicate = FALSE
      AND is_automated_traffic = FALSE
      AND is_pagination = FALSE
      AND is_sort_only = FALSE
  )
  SELECT
    event_date,
    search_id,
    search_term,
    search_type,
    search_results_count,
    search_status,
    search_filters_count,
    property_type,
    listing_type,
    location_query,
    location_id,
    city,
    region,
    country,
    postal_code,
    latitude,
    longitude,
    radius,
    radius_unit,
    min_price,
    max_price,
    currency,
    min_bedrooms,
    max_bedrooms,
    min_bathrooms,
    max_bathrooms,
    min_area,
    max_area,
    area_unit,
    move_in_date,
    amenities,
    sort_order,
    page_number,
    results_per_page,
    experience_name,
    search_surface,
    interaction_type,
    submission_method,
    is_valid_search,
    is_duplicate,
    is_automated_traffic,
    is_pagination,
    is_sort_only,
    consent_analytics,
    user_login_state,
    session_id,
    page_location,
    page_referrer,
    search_timestamp AS timestamp,
    event_id,
    1 AS property_search_count
  FROM qualified_searches
  WHERE deduplication_row_number = 1;

Calculation Notes: |
  1️⃣ Count searches on explicit submissions or material criteria changes.  
  2️⃣ Exclude autosuggest impressions, filter-panel opens, and pagination changes.  
  3️⃣ Deduplicate events using search_event_id or a combination of identifiers.  
  4️⃣ Count map movements only with user-triggered searches or auto-refreshes.  
  5️⃣ Count zero-result searches if the request is valid.  
  6️⃣ Apply reporting time zone to event timestamps.  
  7️⃣ Use event occurrence date instead of ingestion date.

Business Use Case: |
  The Product organization reviews daily search volume by market, platform, search-entry point, and filter usage to identify changes in buyer or renter demand and discovery friction. For example, if mobile search count remains stable but the search-to-property-view rate falls in a specific city while zero-result searches increase, the team can adjust default filters, improve geographic matching, or work with inventory operations to expand relevant listings.



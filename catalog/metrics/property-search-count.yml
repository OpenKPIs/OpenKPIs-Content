Metric Name: Property Search Count
Formula: COUNT(DISTINCT search_event_id) WHERE event_name = 'property_search_submitted' AND is_valid_search = TRUE AND is_bot = FALSE AND is_duplicate = FALSE

Description: |
  Counts valid property-search actions submitted by users across supported real estate discovery experiences during the selected reporting period. Each qualifying search is counted once after excluding duplicate delivery, automated traffic, pagination, sorting-only actions, and non-submitted search interactions.

Category: Engagement

Tags: [metric]

Industry: Real Estate Tech

Priority: High

Core Area: Discovery

Scope: Event

Measure Type: count

Aggregation Window: Time based - Hourly/Daily/Monthly/Yearly


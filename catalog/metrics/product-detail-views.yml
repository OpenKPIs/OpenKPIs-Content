Metric Name: Product Detail Views
Aliases: [PDP Views, Product Page Views]

Formula: Count of Product Viewed events

Description: |
  Number of product detail views recorded in the selected period. It shows the volume of shopper interest in individual products.

Category: Engagement

Tags: [product views, product detail pages, merchandising]

Industry: [Retail, E-commerce]

Business Criticality: High

Journey / Navigation Area: [Discovery, Product Experience]

Owning Function: Merchandising

Scope: Event

Measurement Channels: [Web, Mobile App]

Measure Type: Counter

Aggregation Window: [Daily, Weekly, Monthly]


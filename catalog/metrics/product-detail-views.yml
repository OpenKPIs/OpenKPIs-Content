Google Analytics SQL: |
  SELECT COUNT(DISTINCT (SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'event_id')) AS product_detail_views
  FROM `project.analytics.events_*`
  WHERE _TABLE_SUFFIX BETWEEN @start_date AND @end_date
    AND event_name = 'view_item'

AEP Query Service SQL: |
  SELECT COUNT(DISTINCT _id) AS product_detail_views
  FROM {{AEP_EXPERIENCE_EVENT_DATASET}}
  WHERE timestamp >= :start_timestamp
    AND timestamp < :end_timestamp
    AND eventType = 'commerce.productViews'

Calculation Notes: |
  1️⃣ Count each unique event_id once. 2️⃣ Exclude internal, test and automated traffic. 3️⃣ Use the selected reporting period.

Business Use Case: |
  1️⃣ Merchandising teams compare product-view demand. 2️⃣ Product teams investigate products and devices with sustained changes.


Metric Name: Shipment Volume
Formula: COUNT(DISTINCT CASE WHEN first_valid_shipped_at >= window_start AND first_valid_shipped_at < window_end AND is_test_shipment = FALSE THEN shipment_id END)

Description: |
  Counts unique customer-order shipments handed to a carrier or confirmed as dispatched during the reporting period, with split shipments counted separately and duplicate status events removed. It connects acquisition and conversion demand to post-purchase engagement, billing, retention, and customer lifetime value by showing how many fulfillment commitments entered the delivery journey.

Category: Performance

Tags: [metric]

Industry: Logistics & Supply Chain

Priority: High

Core Area: Generic

Scope: Event

Measure Type: count

Aggregation Window: Time based - Hourly/Daily/Monthly/Yearly









Calculation Notes: |
  1️⃣ Use the earliest qualifying shipped or carrier-accepted timestamp for each shipment_id.  
  2️⃣ Count each physical outbound shipment once; multiple packages with one shipment_id count as one.  
  3️⃣ Exclude test, fraud-rejected, voided-before-dispatch, internal transfer, supplier replenishment, and non-customer shipments.  
  4️⃣ Do not subtract later cancellations, returns, delivery failures, or refunds from historical volume.  
  5️⃣ Include replacement and reshipment records only if they have a new shipment_id and are identifiable through shipment_type.  
  6️⃣ Apply half-open reporting intervals and recalculate late events within the controlled lookback window.  
  7️⃣ Session timeout rules do not affect shipment count; digital session and acquisition attributes are inherited from the stitched originating order.

Business Use Case: |
  A Chief Customer Officer reviews Shipment Volume by acquisition channel, promised service level, customer tenure, and region before a promotional campaign. If paid-social orders create shipment growth but also elevated split-shipment and late-delivery rates, the team can change delivery promises, suppress affected offers, rebalance campaign spend, and send proactive post-purchase communications to protect conversion, retention, and lifetime value.


Source Data: E-commerce order and shipment events from the Order Management System and carrier event platform, stitched with Digital Analytics (GA4 or Adobe Analytics), CRM customer profiles, customer service interactions, and billing or payment data.


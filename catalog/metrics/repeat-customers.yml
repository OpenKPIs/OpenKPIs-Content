Metric Name: Repeat Customers
Formula: COUNT(DISTINCT customer_id) WHERE orders_in_period >= 1 AND lifetime_order_count_at_period_end >= 2

Description: |
  Repeat Customers is the count of distinct identified customers who placed at least one valid order in the reporting period and whose lifetime order count, evaluated as of the period end, is two or more. It is the numerator of Repeat Purchase Rate and Second-Purchase Conversion Rate and the volume anchor for retention, loyalty and Customer Lifetime Value planning.

Category: Retention



























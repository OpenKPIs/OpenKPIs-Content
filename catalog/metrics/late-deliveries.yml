# Metric: Late Deliveries
# Generated: 2026-09-18T17:21:43.349Z
# Contributed by: devyendarm


Metric Name: Late Deliveries
Formula: COUNT(DISTINCT order_id) WHERE order_delivered_date_local > promised_delivery_date, where order_delivered_date_local = DATE(MAX(shipment.delivered_at) AT TIME ZONE ship_to_timezone) across all shipments of the order and promised_delivery_date is the Delivery Promise Date committed at order confirmation

Description: |
  Late Deliveries counts the distinct customer orders whose confirmed delivery landed on a calendar day after the Delivery Promise Date shown to the shopper at checkout, measured at order level from OMS and carrier tracking records. It is the absolute late-side counterpart to Shipment On-Time Delivery Rate, sizing how many customers actually experienced a broken delivery promise so that fulfillment, carrier and service teams can act on volume rather than on a percentage alone.

Category: Operations



























# Metric: Unique Visitors
# Generated: 2026-09-15T14:05:47.295Z
# Contributed by: devyendarm
# Last modified by: devyendarm

Metric Name: Unique Visitors
Formula: Unique Visitors = COUNT(DISTINCT COALESCE(user_id, last user_id seen on the same device ID in the date range, device ID)) over qualifying client-side hits with a non-null device ID (GA4 user_pseudo_id / Adobe ECID); page_view (web) and screen_view (app) are the reference events, and any other client-side event carrying the same identifier also counts. Applied after bot, internal, non-production and denied-consent exclusions, within the reporting date range. Computed directly at each requested grain (date range × segment) and never summed or averaged from finer grains.

Description: |
  Unique Visitors is the de-duplicated count of distinct people who generated at least one qualifying hit on the web or app storefront within the selected date range. Each person is counted once, by customer login ID when available and otherwise by a persistent browser or app-instance ID, aligned with Total Users in GA4 and Unique Visitors in Adobe Analytics. It is the reach denominator for visitor-based conversion and revenue KPIs, and because it is a distinct count it must be recalculated for every date range, channel or segment rather than summed from smaller slices.


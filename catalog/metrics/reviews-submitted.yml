Metric Name: Reviews Submitted
Formula: COUNT(DISTINCT review_id) WHERE event = product review submission AND submission succeeded AND event_date IN reporting window

Description: |
  Count of product reviews customers successfully submit in the reporting period, one per unique review ID. It counts submissions, not reviews that pass moderation and get published.


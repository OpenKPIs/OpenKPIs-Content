# Metric: Refund Amount
# Generated: 2026-09-20T19:41:04.740Z
# Contributed by: devyendarm


Metric Name: Refund Amount
Formula: SUM(refund_value) across all refund transactions with a refund date in the reporting period, where refund_value = refunded item value + refunded shipping + refunded tax per the finance revenue rule, converted to the reporting currency

Description: |
  Refund Amount is the total monetary value returned to customers against orders in the reporting period, covering both full refunds and partial refunds such as single-line returns, price adjustments and shipping-only credits. It is recorded in the order's transaction currency on the refund date and is the value that converts gross revenue into net revenue and the monetary basis for Refund Rate.

Category: Monetization



























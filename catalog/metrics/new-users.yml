Metric Name: New Users
Formula: COUNT(DISTINCT user_pseudo_id WHERE event_name IN ('first_visit', 'first_open') AND event_date IN reporting window)

Description: |
  Distinct users whose first_visit (web) or first_open (app) event falls inside the reporting window. It is the new-audience subset of Unique Visitors and excludes anyone first seen before the window.

Category: Acquisition



























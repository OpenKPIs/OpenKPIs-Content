Metric Name: BOPIS Orders
Formula: COUNT(DISTINCT transaction_id) FROM purchase WHERE fulfillment_method IN ('pickup_in_store', 'curbside_pickup') AND traffic_type NOT IN ('internal', 'test')

Description: |
  The number of distinct online orders placed with store pickup as the fulfillment method, including curbside pickup, counted once per transaction_id on the day the order is placed. It sizes the demand the store network has to pick, stage and hand over, and it is the base population for pickup completion, abandonment and pickup-attach analysis.


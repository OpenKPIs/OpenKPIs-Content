# Metric: Subscription Cancellations
# Generated: 2026-09-19T17:57:38.321Z
# Contributed by: devyendarm
# Last modified by: devyendarm

Metric Name: Subscription Cancellations
Formula: COUNT(DISTINCT subscription_id) WHERE subscription_status transitions to 'cancelled' AND cancellation_effective_date BETWEEN period_start AND period_end (web subscription_cancellation events UNION billing-platform cancellation records, deduplicated by subscription_id)

Description: |
  Count of distinct subscribe-and-save and replenishment subscriptions whose status moved to cancelled within the reporting period, combining customer-initiated cancellations from the account area or storefront with involuntary and agent-driven cancellations recorded in the subscription billing platform, deduplicated by subscription_id. It is the numerator behind Subscription Churn Rate and the loss term in Subscription Retention, so it tells Retention and Finance teams exactly how much recurring revenue base left the programme and through which channel.

Category: Retention

Tags: [metric, E-commerce: Customer Retention, Loyalty & LTV, subscription, churn, replenishment, omnichannel]

Industry: E-commerce

Priority: High

Core Area: Monetization

Scope: Global

Measure Type: Counter

Aggregation Window: Daily, Weekly, Monthly, Quarterly


Metric Name: Filter Applications
Formula: COUNT(filter_apply events WHERE filter_action contains 'apply'; a mixed add/remove batch counts once) — one event per committed filter change: each auto-applied facet selection = 1; a multi-select batch confirmed with a single Apply control = 1 regardless of the number of values; after 2-second duplicate collapse and standard traffic exclusions

Description: |
  Filter Applications counts every time a shopper applies a filter (facet or refinement) on a product listing page or site search results page, recorded through the unified filter_apply event with filter_action = 'apply', the filter name and value, the list context and the post-filter results count. Removals, sort changes, pagination and reloads of an already-filtered URL are excluded, so the metric isolates deliberate narrowing behaviour and shows merchandising and discovery teams which attributes shoppers actually use to find products.

Category: Engagement

Tags: [metric, E-commerce: Product Discovery & Merchandising (Search/Filters/PDP)]

Industry: E-commerce

Priority: High

Core Area: Discovery

Scope: Event

Measure Type: Counter

Aggregation Window: Session, Daily, Weekly, Monthly


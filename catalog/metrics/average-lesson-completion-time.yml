Metric Name: Average Lesson Completion Time
Formula: SUM(completion_time) / COUNT(completed_lessons)

Description: |
  Measures the average time taken by users to complete a lesson, providing insights into content engagement and pacing. This metric helps identify lessons that may require optimization for better user experience.

Category: Engagement

Tags: [metric]

Industry: EdTech & E-Learning

Priority: High

Core Area: Engagement

Scope: User

Measure Type: average

Aggregation Window: Time based - Daily

GA4 Event: |
  complete_lesson

Adobe Event: |
  completeLesson

W3 Data Layer: |
  {"event":"completeLesson","eventInfo":{"eventName":"completeLesson","averageLessonCompletionTime":{"unit":"seconds","value":0}}}

GA4 Data Layer: |
  {"event":"complete_lesson","average_lesson_completion_time":{"unit":"seconds","value":0}}

Adobe Client Data Layer: |
  {"event":"completeLesson","averageLessonCompletionTime":{"unit":"seconds","value":0}}

XDM Mapping: |
  {"_experience":{"analytics":{"event1":{"name":"completeLesson","averageLessonCompletionTime":{"unit":"seconds","value":0}}}}}

Google Analytics SQL: |
  -- ==========================================
  -- 1. GOOGLE BIGQUERY SQL
  -- ==========================================
  SELECT user_id, AVG(lesson_completion_time) AS average_lesson_completion_time
  FROM (
    SELECT
      user_id,
      TIMESTAMP_DIFF(
        MAX(IF(param.key = 'lesson_end_time', TIMESTAMP(param.value.string_value), NULL)),
        MIN(IF(param.key = 'lesson_start_time', TIMESTAMP(param.value.string_value), NULL)),
        SECOND
      ) AS lesson_completion_time
    FROM `your-project.analytics_123456789.events_*`,
    UNNEST(event_params) AS param
    WHERE event_name = 'complete_lesson'
    GROUP BY user_id, event_id
  )
  GROUP BY user_id;

AEP Query Service SQL: |
  -- ==========================================
  -- 2. ADOBE AEP QUERY SERVICE SQL
  -- ==========================================
  SELECT user_id, AVG(lesson_completion_time) AS average_lesson_completion_time
  FROM (
    SELECT
      user_id,
      TIMESTAMPDIFF(
        SECOND,
        MIN(CASE WHEN param.key = 'lesson_start_time' THEN TO_TIMESTAMP(param.value) END),
        MAX(CASE WHEN param.key = 'lesson_end_time' THEN TO_TIMESTAMP(param.value) END)
      ) AS lesson_completion_time
    FROM aep_backend_dataset.events,
    LATERAL VIEW EXPLODE(event_params) AS param
    WHERE event_name = 'completeLesson'
    GROUP BY user_id, event_id
  )
  GROUP BY user_id;

Calculation Notes: |
  Exclude lessons with completion time less than 1 minute to filter out accidental completions. Consider session timeouts of 30 minutes.

Business Use Case: |
  Executives use this metric to identify lessons that are too long or too short, enabling content adjustments to improve user satisfaction and retention.



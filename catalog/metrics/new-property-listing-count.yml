# Metric: New Property Listing Count
# Generated: 2026-09-04T14:30:22.868Z
# Contributed by: devyendarm
# Last modified by: devyendarm

Metric Name: New Property Listing Count
Formula: COUNT(DISTINCT CASE WHEN first_approved_publication_at >= window_start AND first_approved_publication_at < window_end AND is_publicly_discoverable = true AND is_test_listing = false AND is_duplicate_listing = false THEN property_listing_id END)

Description: |
  Counts distinct, non-test property listings that become publicly discoverable for the first time after satisfying required moderation and publication controls during the reporting period. It measures successful conversion of listing supply into customer-visible inventory that can drive discovery, engagement, inquiries, monetization, retention, and lifetime value.

Category: Conversion

Tags: [metric]

Industry: Technology

Priority: High

Core Area: Onboarding

Scope: Item

Measure Type: count

Aggregation Window: Time based - Hourly/Daily/Monthly/Yearly







Google Analytics SQL: |
  -- ==========================================
  -- 1. GOOGLE BIGQUERY SQL
  -- ==========================================
  WITH publication_event_versions AS (
    SELECT
      event_id,
      property_listing_id,
      seller_account_id,
      publication_status,
      publication_source,
      platform,
      device_category,
      app_version,
      published_at,
      ingested_at,
      ROW_NUMBER() OVER (
        PARTITION BY event_id
        ORDER BY
          CASE WHEN ingested_at IS NULL THEN 1 ELSE 0 END,
          ingested_at DESC,
          published_at DESC
      ) AS version_rank
    FROM `your-project.publication_events.listing_publication_events`
    WHERE event_id IS NOT NULL
      AND property_listing_id IS NOT NULL
  ),
  published_events AS (
    SELECT
      event_id,
      property_listing_id,
      seller_account_id,
      publication_source,
      platform,
      device_category,
      app_version,
      published_at
    FROM publication_event_versions
    WHERE version_rank = 1
      AND LOWER(TRIM(publication_status)) = 'published'
      AND published_at IS NOT NULL
  ),
  ranked_publications AS (
    SELECT
      published_events.*,
      ROW_NUMBER() OVER (
        PARTITION BY property_listing_id
        ORDER BY published_at, event_id
      ) AS publication_rank
    FROM published_events
  ),
  first_publication AS (
    SELECT
      event_id,
      property_listing_id,
      seller_account_id,
      publication_source,
      platform,
      device_category,
      app_version,
      published_at
    FROM ranked_publications
    WHERE publication_rank = 1
  ),
  moderation_decision_versions AS (
    SELECT
      decision_id,
      property_listing_id,
      decision,
      reason_code,
      decided_at,
      ingested_at,
      ROW_NUMBER() OVER (
        PARTITION BY decision_id
        ORDER BY
          CASE WHEN ingested_at IS NULL THEN 1 ELSE 0 END,
          ingested_at DESC,
          decided_at DESC
      ) AS version_rank
    FROM `your-project.moderation.listing_moderation_decisions`
    WHERE decision_id IS NOT NULL
      AND property_listing_id IS NOT NULL
  ),
  ranked_moderation AS (
    SELECT
      fp.event_id,
      fp.property_listing_id,
      fp.seller_account_id,
      fp.publication_source,
      fp.platform,
      fp.device_category,
      fp.app_version,
      fp.published_at,
      md.decision AS moderation_decision,
      md.reason_code AS moderation_reason_code,
      ROW_NUMBER() OVER (
        PARTITION BY fp.property_listing_id
        ORDER BY
          CASE WHEN md.decided_at IS NULL THEN 1 ELSE 0 END,
          md.decided_at DESC,
          md.decision_id DESC
      ) AS moderation_rank
    FROM first_publication AS fp
    LEFT JOIN moderation_decision_versions AS md
      ON fp.property_listing_id = md.property_listing_id
     AND md.version_rank = 1
     AND md.decided_at <= fp.published_at
  ),
  qualified_new_listings AS (
    SELECT
      event_id,
      property_listing_id,
      seller_account_id,
      publication_source,
      platform,
      device_category,
      app_version,
      published_at,
      moderation_decision,
      moderation_reason_code
    FROM ranked_moderation
    WHERE moderation_rank = 1
      AND LOWER(TRIM(moderation_decision)) = 'approved'
      AND DATE(published_at, 'UTC') BETWEEN @start_date AND @end_date
  ),
  ranked_listing_candidates AS (
    SELECT
      q.property_listing_id,
      q.seller_account_id AS event_seller_account_id,
      q.publication_source,
      q.platform,
      q.device_category,
      q.app_version,
      q.published_at,
      q.moderation_decision,
      q.moderation_reason_code,
      l.country_code,
      l.region,
      l.city,
      l.postal_code,
      l.market_id,
      l.latitude_band,
      l.longitude_band,
      l.property_type,
      l.property_subtype,
      l.listing_type,
      l.tenure_type,
      l.bedroom_count,
      l.bathroom_count,
      l.parking_space_count,
      l.floor_area_band,
      l.lot_area_band,
      l.price_band,
      l.price_currency,
      l.furnished_status,
      l.is_new_build,
      l.energy_rating,
      l.seller_account_id AS listing_seller_account_id,
      l.agent_id,
      l.acquisition_channel,
      l.acquisition_source,
      l.acquisition_medium,
      l.acquisition_campaign,
      l.acquisition_content,
      l.acquisition_term,
      ROW_NUMBER() OVER (
        PARTITION BY q.property_listing_id
        ORDER BY l.created_at DESC
      ) AS listing_rank
    FROM qualified_new_listings AS q
    INNER JOIN `your-project.listing_management.property_listings` AS l
      ON q.property_listing_id = l.property_listing_id
     AND l.created_at <= q.published_at
     AND COALESCE(l.is_test_listing, FALSE) = FALSE
  ),
  listing_as_of_publication AS (
    SELECT * EXCEPT (listing_rank)
    FROM ranked_listing_candidates
    WHERE listing_rank = 1
  ),
  seller_accounts AS (

Calculation Notes: |
  Count each property_listing_id once at its earliest timestamp when it is both approved and publicly discoverable. Use the half-open reporting interval [window_start, window_end), store source timestamps in UTC, and assign reporting periods using the governed market timezone. Exclude null IDs, tests, previews, internal-only inventory, fraud or policy blocks, unresolved technical duplicates, rejected listings, event retries, and publication events that never produced external visibility. Edits, renewals, reactivations, price changes, temporary suspensions, expirations, withdrawals, and republications do not create another new listing count. A genuinely new commercial mandate is countable only when marketplace policy assigns it a new valid listing lifecycle and property_listing_id. Resolve duplicate IDs to the surviving canonical listing before finalized reporting, retain unknown optional dimensions as 'Unknown', and restate affected periods for approved late moderation, fraud, or duplicate-resolution updates.

Business Use Case: |
  Marketplace executives monitor this metric by market, seller type, acquisition channel, property type, and publication route to identify declines in customer-visible supply. When volume falls in a priority market, Product and Marketing can determine whether the cause is weaker seller acquisition, onboarding abandonment, moderation rejection, or publication failure, then adjust campaigns, listing flows, review capacity, or platform reliability while monitoring downstream views, inquiries, seller retention, billing, and lifetime value.



# Last modified by: devyendarm

Metric Name: Playback Failure Rate
Formula: 100 * COUNT(DISTINCT CASE WHEN eligibility_status = 'eligible' AND attempt_outcome = 'technical_failure' THEN playback_attempt_id END) / NULLIF(COUNT(DISTINCT CASE WHEN eligibility_status = 'eligible' AND attempt_outcome IN ('technical_failure', 'non_failure') THEN playback_attempt_id END), 0)

Description: |
  Playback Failure Rate measures the percentage of eligible playback attempts that terminate because of a technical failure before normal completion or an intentional user stop. It quantifies playback reliability across content, applications, devices, delivery networks, and geographic markets.

Category: Quality

Tags: [metric]

Industry: Media & Streaming

Priority: High

Core Area: Engagement

Scope: Event

Measure Type: percentage

Aggregation Window: Time based - Daily


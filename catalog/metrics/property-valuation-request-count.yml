  -- 2. ADOBE AEP QUERY SERVICE SQL
  -- ==========================================
  WITH normalized AS (
    SELECT
      COALESCE(_propertyValuation.event_id, _id) AS event_id,
      COALESCE(CAST(_propertyValuation.event_timestamp AS TIMESTAMP), CAST(timestamp AS TIMESTAMP)) AS event_timestamp,
      _propertyValuation.request_id AS request_id,
      LOWER(_propertyValuation.request_status) AS request_status,
      LOWER(_propertyValuation.acceptance_status) AS acceptance_status,
      COALESCE(CAST(_propertyValuation.accepted_timestamp AS TIMESTAMP), CAST(_propertyValuation.event_timestamp AS TIMESTAMP), CAST(timestamp AS TIMESTAMP)) AS accepted_timestamp,
      _propertyValuation.lead_id AS lead_id,
      LOWER(_propertyValuation.lead_type) AS lead_type,
      LOWER(_propertyValuation.service_type) AS service_type,
      LOWER(_propertyValuation.request_channel) AS request_channel,
      LOWER(_propertyValuation.channel_group) AS channel_group,
      LOWER(_propertyValuation.interaction_mode) AS interaction_mode,
      _propertyValuation.source_system AS source_system,
      _propertyValuation.source_record_id AS source_record_id,
      _propertyValuation.customer_id AS customer_id,
      _propertyValuation.anonymous_id AS anonymous_id,
      CAST(_propertyValuation.session_id AS STRING) AS session_id,
      LOWER(_propertyValuation.user_status) AS user_status,
      _propertyValuation.property_id AS property_id,
      LOWER(_propertyValuation.property_type) AS property_type,
      LOWER(_propertyValuation.property_subtype) AS property_subtype,
      UPPER(_propertyValuation.property_country) AS property_country,
      _propertyValuation.property_region AS property_region,
      _propertyValuation.property_city AS property_city,
      UPPER(_propertyValuation.property_postal_code) AS property_postal_code,
      LOWER(_propertyValuation.property_occupancy) AS property_occupancy,
      LOWER(_propertyValuation.tenure_type) AS tenure_type,
      CAST(_propertyValuation.bedroom_count AS BIGINT) AS bedroom_count,
      CAST(_propertyValuation.bathroom_count AS BIGINT) AS bathroom_count,
      UPPER(_propertyValuation.currency) AS currency,
      CAST(_propertyValuation.value AS DECIMAL(18,2)) AS value,
      _propertyValuation.estimated_value_band AS estimated_value_band,
      LOWER(_propertyValuation.valuation_reason) AS valuation_reason,
      LOWER(_propertyValuation.preferred_valuation_method) AS preferred_valuation_method,
      LOWER(_propertyValuation.preferred_contact_channel) AS preferred_contact_channel,
      CAST(_propertyValuation.appointment_requested AS BOOLEAN) AS appointment_requested,
      _propertyValuation.appointment_id AS appointment_id,
      LOWER(_propertyValuation.appointment_status) AS appointment_status,
      NULLIF(TRIM(_propertyValuation.referral_partner_id), '') AS referral_partner_id,
      _propertyValuation.campaign_id AS campaign_id,
      _propertyValuation.traffic_source AS traffic_source,
      _propertyValuation.traffic_medium AS traffic_medium,
      _propertyValuation.traffic_campaign AS traffic_campaign,
      LOWER(_propertyValuation.consent_status) AS consent_status,
      LOWER(_propertyValuation.consent_type) AS consent_type,
      CAST(_propertyValuation.consent_timestamp AS TIMESTAMP) AS consent_timestamp,
      COALESCE(_propertyValuation.deduplication_key, eventMergeId) AS deduplication_key,
      CAST(_propertyValuation.is_unique_request AS BOOLEAN) AS is_unique_request,
      COALESCE(_propertyValuation.reporting_period, DATE_FORMAT(COALESCE(CAST(_propertyValuation.accepted_timestamp AS TIMESTAMP), CAST(timestamp AS TIMESTAMP)), 'yyyy-MM')) AS reporting_period
    FROM property_valuation_experience_event_dataset
    WHERE CAST(timestamp AS TIMESTAMP) >= CAST(:start_timestamp AS TIMESTAMP)
      AND CAST(timestamp AS TIMESTAMP) < CAST(:end_timestamp AS TIMESTAMP)
      AND eventType = 'generate_lead'
  ),
  ranked AS (
    SELECT
      normalized.*,
      ROW_NUMBER() OVER (
        PARTITION BY COALESCE(NULLIF(deduplication_key, ''), NULLIF(request_id, ''), NULLIF(event_id, ''), CONCAT(COALESCE(source_system, 'unknown'), ':', COALESCE(source_record_id, 'unknown')))
        ORDER BY accepted_timestamp DESC, event_timestamp DESC
      ) AS deduplication_rank
    FROM normalized
    WHERE lead_type = 'property_valuation'
      AND service_type = 'valuation'
      AND request_status = 'accepted'
      AND acceptance_status = 'success'
      AND is_unique_request = TRUE
      AND request_id IS NOT NULL
  )
  SELECT
    event_id,
    event_timestamp,
    request_id,
    request_status,
    acceptance_status,
    accepted_timestamp,
    lead_id,
    lead_type,
    service_type,
    request_channel,
    channel_group,
    interaction_mode,
    source_system,
    source_record_id,
    customer_id,
    anonymous_id,
    session_id,
    user_status,
    property_id,
    property_type,
    property_subtype,
    property_country,
    property_region,
    property_city,
    property_postal_code,
    property_occupancy,
    tenure_type,
    bedroom_count,
    bathroom_count,
    currency,
    value,
    estimated_value_band,
    valuation_reason,
    preferred_valuation_method,
    preferred_contact_channel,
    appointment_requested,
    appointment_id,
    appointment_status,
    referral_partner_id,
    campaign_id,
    traffic_source,
    traffic_medium,
    traffic_campaign,
    consent_status,
    consent_type,
    consent_timestamp,
    deduplication_key,
    is_unique_request,
    reporting_period,
    CAST(1 AS BIGINT) AS property_valuation_request_count
  FROM ranked
  WHERE deduplication_rank = 1;

Calculation Notes: |
  Assign the request to the calendar period containing the first accepted_at timestamp. A later cancellation, disqualification, appointment, or status change does not remove the original accepted request from this metric; those outcomes must be measured separately. Multiple valid requests from one customer or for one property count separately when they have distinct request identifiers and are not source-confirmed retries or duplicates. Cross-device and cross-channel identity stitching affects segmentation and attribution but not the base count. Requests received near a reporting boundary use the server acceptance timestamp, and historical daily totals are restated when valid late-arriving records or duplicate resolutions are processed.

Business Use Case: |
  The Chief Marketing Officer and property marketplace leadership review valuation requests by acquisition source, market, device, customer type, and submitting channel. If paid social generates high request volume but weak appointment and instruction conversion, budget can be shifted toward higher-quality channels while Product removes form friction in underperforming journey steps and Sales adjusts contact capacity in markets with increasing accepted demand; downstream revenue and lifetime-value measures confirm whether the additional requests create profitable customers.


Source Data: Valuation Request Service and Customer Data Platform stitched with Digital Analytics (GA4 or equivalent), CRM (Salesforce or equivalent), contact-center events, partner referral feeds, consent records, and downstream appointment, transaction, and billing data.


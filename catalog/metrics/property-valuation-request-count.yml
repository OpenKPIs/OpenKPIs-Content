Metric Name: Property Valuation Request Count
Formula: COUNT(DISTINCT CASE WHEN event_name = 'property_valuation_request_submitted' AND request_status = 'accepted' AND is_test = FALSE AND is_duplicate = FALSE THEN request_id END)

Description: |
  Counts unique property valuation requests successfully accepted through digital or assisted customer channels during the reporting period. It measures conversion from property-owner engagement into an actionable valuation lead that can progress to an appointment, instruction, transaction, and customer lifetime value.


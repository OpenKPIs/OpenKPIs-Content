  WITH source_events AS (
    SELECT
      event_timestamp AS raw_event_timestamp,
      user_pseudo_id,
      event_bundle_sequence_id,
      (
        SELECT AS STRUCT
          MAX(IF(ep.key = 'event_id', ep.value.string_value, NULL)) AS event_id,
          MAX(IF(ep.key = 'event_timestamp', ep.value.string_value, NULL)) AS event_timestamp_text,
          MAX(IF(ep.key = 'request_id', ep.value.string_value, NULL)) AS request_id,
          MAX(IF(ep.key = 'request_status', ep.value.string_value, NULL)) AS request_status,
          MAX(IF(ep.key = 'acceptance_status', ep.value.string_value, NULL)) AS acceptance_status,
          MAX(IF(ep.key = 'accepted_timestamp', ep.value.string_value, NULL)) AS accepted_timestamp_text,
          MAX(IF(ep.key = 'lead_id', ep.value.string_value, NULL)) AS lead_id,
          MAX(IF(ep.key = 'lead_type', ep.value.string_value, NULL)) AS lead_type,
          MAX(IF(ep.key = 'service_type', ep.value.string_value, NULL)) AS service_type,
          MAX(IF(ep.key = 'request_channel', ep.value.string_value, NULL)) AS request_channel,
          MAX(IF(ep.key = 'channel_group', ep.value.string_value, NULL)) AS channel_group,
          MAX(IF(ep.key = 'interaction_mode', ep.value.string_value, NULL)) AS interaction_mode,
          MAX(IF(ep.key = 'source_system', ep.value.string_value, NULL)) AS source_system,
          MAX(IF(ep.key = 'source_record_id', ep.value.string_value, NULL)) AS source_record_id,
          MAX(IF(ep.key = 'customer_id', ep.value.string_value, NULL)) AS customer_id,
          MAX(IF(ep.key = 'anonymous_id', ep.value.string_value, NULL)) AS anonymous_id,
          MAX(IF(ep.key = 'session_id', COALESCE(ep.value.string_value, CAST(ep.value.int_value AS STRING)), NULL)) AS session_id,
          MAX(IF(ep.key = 'user_status', ep.value.string_value, NULL)) AS user_status,
          MAX(IF(ep.key = 'property_id', ep.value.string_value, NULL)) AS property_id,
          MAX(IF(ep.key = 'property_type', ep.value.string_value, NULL)) AS property_type,
          MAX(IF(ep.key = 'property_subtype', ep.value.string_value, NULL)) AS property_subtype,
          MAX(IF(ep.key = 'property_country', ep.value.string_value, NULL)) AS property_country,
          MAX(IF(ep.key = 'property_region', ep.value.string_value, NULL)) AS property_region,
          MAX(IF(ep.key = 'property_city', ep.value.string_value, NULL)) AS property_city,
          MAX(IF(ep.key = 'property_postal_code', ep.value.string_value, NULL)) AS property_postal_code,
          MAX(IF(ep.key = 'property_occupancy', ep.value.string_value, NULL)) AS property_occupancy,
          MAX(IF(ep.key = 'tenure_type', ep.value.string_value, NULL)) AS tenure_type,
          MAX(IF(ep.key = 'bedroom_count', COALESCE(CAST(ep.value.int_value AS STRING), ep.value.string_value), NULL)) AS bedroom_count_text,
          MAX(IF(ep.key = 'bathroom_count', COALESCE(CAST(ep.value.int_value AS STRING), ep.value.string_value), NULL)) AS bathroom_count_text,
          MAX(IF(ep.key = 'currency', ep.value.string_value, NULL)) AS currency,
          MAX(IF(ep.key = 'value', COALESCE(CAST(ep.value.int_value AS STRING), CAST(ep.value.double_value AS STRING), ep.value.string_value), NULL)) AS value_text,
          MAX(IF(ep.key = 'estimated_value_band', ep.value.string_value, NULL)) AS estimated_value_band,
          MAX(IF(ep.key = 'valuation_reason', ep.value.string_value, NULL)) AS valuation_reason,
          MAX(IF(ep.key = 'preferred_valuation_method', ep.value.string_value, NULL)) AS preferred_valuation_method,
          MAX(IF(ep.key = 'preferred_contact_channel', ep.value.string_value, NULL)) AS preferred_contact_channel,
          MAX(IF(ep.key = 'appointment_requested', COALESCE(ep.value.string_value, CAST(ep.value.int_value AS STRING)), NULL)) AS appointment_requested_text,
          MAX(IF(ep.key = 'appointment_id', ep.value.string_value, NULL)) AS appointment_id,
          MAX(IF(ep.key = 'appointment_status', ep.value.string_value, NULL)) AS appointment_status,
          MAX(IF(ep.key = 'referral_partner_id', ep.value.string_value, NULL)) AS referral_partner_id,
          MAX(IF(ep.key = 'campaign_id', ep.value.string_value, NULL)) AS campaign_id,
          MAX(IF(ep.key = 'traffic_source', ep.value.string_value, NULL)) AS traffic_source,
          MAX(IF(ep.key = 'traffic_medium', ep.value.string_value, NULL)) AS traffic_medium,
          MAX(IF(ep.key = 'traffic_campaign', ep.value.string_value, NULL)) AS traffic_campaign,
          MAX(IF(ep.key = 'consent_status', ep.value.string_value, NULL)) AS consent_status,
          MAX(IF(ep.key = 'consent_type', ep.value.string_value, NULL)) AS consent_type,
          MAX(IF(ep.key = 'consent_timestamp', ep.value.string_value, NULL)) AS consent_timestamp_text,
          MAX(IF(ep.key = 'deduplication_key', ep.value.string_value, NULL)) AS deduplication_key,
          MAX(IF(ep.key = 'is_unique_request', COALESCE(ep.value.string_value, CAST(ep.value.int_value AS STRING)), NULL)) AS is_unique_request_text,
          MAX(IF(ep.key = 'reporting_period', ep.value.string_value, NULL)) AS reporting_period
        FROM UNNEST(event_params) AS ep
      ) AS p
    FROM `your-project.analytics_123456789.events_*`
    WHERE _TABLE_SUFFIX BETWEEN FORMAT_DATE('%Y%m%d', @start_date) AND FORMAT_DATE('%Y%m%d', @end_date)
      AND event_name = 'generate_lead'
  ),
  normalized AS (
    SELECT
      p.event_id,
      COALESCE(SAFE_CAST(p.event_timestamp_text AS TIMESTAMP), TIMESTAMP_MICROS(raw_event_timestamp)) AS event_timestamp,
      p.request_id,
      LOWER(p.request_status) AS request_status,
      LOWER(p.acceptance_status) AS acceptance_status,
      COALESCE(SAFE_CAST(p.accepted_timestamp_text AS TIMESTAMP), SAFE_CAST(p.event_timestamp_text AS TIMESTAMP), TIMESTAMP_MICROS(raw_event_timestamp)) AS accepted_timestamp,
      p.lead_id,
      LOWER(p.lead_type) AS lead_type,
      LOWER(p.service_type) AS service_type,
      LOWER(p.request_channel) AS request_channel,
      LOWER(p.channel_group) AS channel_group,
      LOWER(p.interaction_mode) AS interaction_mode,
      p.source_system,
      p.source_record_id,
      p.customer_id,
      COALESCE(p.anonymous_id, user_pseudo_id) AS anonymous_id,
      p.session_id,
      LOWER(p.user_status) AS user_status,
      p.property_id,
      LOWER(p.property_type) AS property_type,
      LOWER(p.property_subtype) AS property_subtype,
      UPPER(p.property_country) AS property_country,
      p.property_region,
      p.property_city,
      UPPER(p.property_postal_code) AS property_postal_code,
      LOWER(p.property_occupancy) AS property_occupancy,
      LOWER(p.tenure_type) AS tenure_type,
      SAFE_CAST(p.bedroom_count_text AS INT64) AS bedroom_count,
      SAFE_CAST(p.bathroom_count_text AS INT64) AS bathroom_count,
      UPPER(p.currency) AS currency,
      SAFE_CAST(p.value_text AS NUMERIC) AS value,
      p.estimated_value_band,
      LOWER(p.valuation_reason) AS valuation_reason,
      LOWER(p.preferred_valuation_method) AS preferred_valuation_method,
      LOWER(p.preferred_contact_channel) AS preferred_contact_channel,
      LOWER(p.appointment_requested_text) IN ('true', '1', 'yes') AS appointment_requested,
      p.appointment_id,
      LOWER(p.appointment_status) AS appointment_status,
      NULLIF(TRIM(p.referral_partner_id), '') AS referral_partner_id,
      p.campaign_id,
      p.traffic_source,
      p.traffic_medium,
      p.traffic_campaign,
      LOWER(p.consent_status) AS consent_status,
      LOWER(p.consent_type) AS consent_type,
      SAFE_CAST(p.consent_timestamp_text AS TIMESTAMP) AS consent_timestamp,
      p.deduplication_key,
      LOWER(p.is_unique_request_text) IN ('true', '1', 'yes') AS is_unique_request,
      COALESCE(p.reporting_period, FORMAT_TIMESTAMP('%Y-%m', COALESCE(SAFE_CAST(p.accepted_timestamp_text AS TIMESTAMP), TIMESTAMP_MICROS(raw_event_timestamp)))) AS reporting_period,
      raw_event_timestamp,
      event_bundle_sequence_id
    FROM source_events
  ),
  deduplicated AS (
    SELECT * EXCEPT(raw_event_timestamp, event_bundle_sequence_id, deduplication_rank)
    FROM (
      SELECT
        normalized.*,
        ROW_NUMBER() OVER (
          PARTITION BY COALESCE(NULLIF(deduplication_key, ''), NULLIF(request_id, ''), NULLIF(event_id, ''), CONCAT(COALESCE(source_system, 'unknown'), ':', COALESCE(source_record_id, 'unknown')))
          ORDER BY accepted_timestamp DESC, raw_event_timestamp DESC, event_bundle_sequence_id DESC
        ) AS deduplication_rank
      FROM normalized
      WHERE lead_type = 'property_valuation'
        AND service_type = 'valuation'
        AND request_status = 'accepted'
        AND acceptance_status = 'success'
        AND is_unique_request = TRUE
        AND request_id IS NOT NULL
    )
    WHERE deduplication_rank = 1
  )
  SELECT
    deduplicated.*,
    CAST(1 AS INT64) AS property_valuation_request_count
  FROM deduplicated;


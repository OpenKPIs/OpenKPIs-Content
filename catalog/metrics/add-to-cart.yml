Metric Name: Add to cart
Formula: Add to cart = COUNT(DISTINCT dedupe_key) over qualifying add_to_cart events, where dedupe_key = event_id, or when event_id is missing the fallback key user_pseudo_id + ga_session_id + event_timestamp + item list hash (Adobe: XDM _id); excluding add_method values login_rehydration, cart_merge, saved_cart_restore and promo_auto_gift, internal traffic, QA/staging/dev hostnames and bot traffic (GA4: add_to_cart events; Adobe: scAdd / commerce.productListAdds.value = 1 per hit)

Description: |
  Count of deduplicated add-to-cart interactions, equivalent to the GA4 add_to_cart event (reported as Add to carts) and the Adobe Analytics scAdd success event (Cart Additions), where each interaction counts once regardless of how many units or SKUs it carries. It is the primary mid-funnel intent signal between product detail views and checkout initiation. It is the numerator of Add-to-Cart Rate (adds / item views or sessions) and Cart-to-Detail Rate (adds / product detail views), the base population of Cart Abandonment Rate (1 − purchases / carts, the share of carts not ending in a purchase), and the denominator of Cart-to-Checkout Rate (begin_checkout / adds) and of Revenue per Add to Cart (revenue / adds), analysed across products, categories, campaigns and devices.


Google Analytics SQL: |
  -- Bind @report_start and @report_end as UTC timestamps; native event time must represent the successful action.
  -- The one-day suffix buffer accommodates the property's unspecified reporting timezone.
  -- Item breakdowns expand items and count distinct action IDs per item; use UTC for date/hour groups.
  WITH additions AS (
    SELECT
      (SELECT p.value.string_value FROM UNNEST(event_params) AS p WHERE p.key = 'event_id') AS event_id,
      (SELECT p.value.string_value FROM UNNEST(event_params) AS p WHERE p.key = 'cart_id') AS cart_id
    FROM `{{GA4_PROJECT}}.{{GA4_DATASET}}.events_*`
    WHERE event_name = 'add_to_cart'
      AND _TABLE_SUFFIX BETWEEN FORMAT_DATE('%Y%m%d', DATE_SUB(DATE(@report_start), INTERVAL 1 DAY))
                            AND FORMAT_DATE('%Y%m%d', DATE_ADD(DATE(@report_end), INTERVAL 1 DAY))
      AND event_timestamp >= UNIX_MICROS(@report_start)
      AND event_timestamp < UNIX_MICROS(@report_end)
  )
  SELECT COUNT(DISTINCT event_id) AS add_to_cart
  FROM additions
  WHERE cart_id IS NOT NULL AND cart_id <> ''
    AND event_id IS NOT NULL AND event_id <> '';

AEP Query Service SQL: |
  -- Bind :report_start and :report_end as UTC timestamps; timestamp must represent the successful action.
  -- Item breakdowns use explode(productListItems) in a bounded subquery and count distinct _id per item.SKU.
  -- Use UTC for date/hour groups; overlapping item groups must not be summed.
  SELECT COUNT(DISTINCT _id) AS add_to_cart
  FROM {{AEP_EXPERIENCE_EVENT_DATASET}}
  WHERE eventType = 'commerce.productListAdds'
    AND timestamp >= CAST(:report_start AS TIMESTAMP)
    AND timestamp < CAST(:report_end AS TIMESTAMP)
    AND commerce.cart.cartID IS NOT NULL
    AND commerce.cart.cartID <> ''
    AND _id IS NOT NULL AND _id <> '';

Calculation Notes: |
  1️⃣ Count each successful action ID once; retries reuse it, and missing IDs require source correction.
  2️⃣ Count one action regardless of products or units; removals do not reduce the count.
  3️⃣ Use action time: start inclusive, end exclusive; calendar breakdowns use UTC on both platforms.
  4️⃣ Count each action once per Item ID; product groups overlap and must not be summed.
  5️⃣ Return zero when no qualifying actions exist.

Business Use Case: |
  1️⃣ Merchandisers investigate falling product cart additions before changing offers or product content.
  2️⃣ Commerce teams compare hourly additions to decide when to adjust trading activity.
  3️⃣ Product teams investigate sudden declines after cart experience changes.


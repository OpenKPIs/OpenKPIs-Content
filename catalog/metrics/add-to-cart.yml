Metric Name: Add to cart
Aliases: [Add to Carts, Cart Additions, Cart Adds, Adds to Cart]

Formula: Count of successful add-to-cart actions

Description: |
  Number of successful actions that add products to a shopping cart, counting each action once regardless of products or units. It shows shopping activity moving toward purchase.

Category: Conversion

Tags: [shopping cart, purchase intent, merchandising, conversion funnel]

Industry: [E-commerce, Retail]

Business Criticality: High

Journey / Navigation Area: [Cart]

Owning Function: Merchandising

Scope: Event

Measurement Channels: [Web, Mobile App]

Measure Type: Counter


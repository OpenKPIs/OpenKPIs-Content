Google Analytics SQL: |
  -- Bind @report_start and @report_end as UTC timestamps; replace the configured export table template.
  -- Parse the custom action timestamp; scan all export dates because delivery delay has no declared bound.
  -- Optional breakdown: project and GROUP BY DATE(action_time), TIMESTAMP_TRUNC(action_time, HOUR), or cart_id.
  -- For Item ID, also project items in the CTE, CROSS JOIN UNNEST(items) AS item, then group COUNT(DISTINCT event_id) by item.item_id.
  WITH additions AS (
    SELECT
      (SELECT p.value.string_value FROM UNNEST(event_params) AS p WHERE p.key = 'event_id') AS event_id,
      (SELECT p.value.string_value FROM UNNEST(event_params) AS p WHERE p.key = 'cart_id') AS cart_id,
      SAFE_CAST((SELECT p.value.string_value FROM UNNEST(event_params) AS p WHERE p.key = 'event_timestamp') AS TIMESTAMP) AS action_time
    FROM `{{GA4_PROJECT}}.{{GA4_DATASET}}.events_*`
    WHERE event_name = 'add_to_cart'
  )
  SELECT COUNT(DISTINCT event_id) AS add_to_cart
  FROM additions
  WHERE action_time >= @report_start
    AND action_time < @report_end
    AND cart_id IS NOT NULL AND cart_id <> ''
    AND event_id IS NOT NULL AND event_id <> '';

AEP Query Service SQL: |
  -- Bind :report_start and :report_end as UTC timestamps; timestamp is the successful action time.
  -- Optional breakdown: project and GROUP BY CAST(timestamp AS DATE), date_trunc('HOUR', timestamp), or commerce.cart.cartID.
  -- For Item ID, use a subquery projecting _id and explode(productListItems) AS item after the same filters.
  -- Group the item subquery by item.SKU and count DISTINCT _id; retain every repeatable product line.
  SELECT COUNT(DISTINCT _id) AS add_to_cart
  FROM {{AEP_EXPERIENCE_EVENT_DATASET}}
  WHERE eventType = 'commerce.productListAdds'
    AND timestamp >= CAST(:report_start AS TIMESTAMP)
    AND timestamp < CAST(:report_end AS TIMESTAMP)
    AND commerce.cart.cartID IS NOT NULL
    AND commerce.cart.cartID <> ''
    AND _id IS NOT NULL AND _id <> '';

Calculation Notes: |
  1️⃣ Count each successful addition once by action ID; retries reuse it, and missing IDs require source correction.
  2️⃣ Count one action regardless of products or units; removals do not reduce the count.
  3️⃣ Use successful action time: start inclusive, end exclusive; calendar breakdowns use UTC on both platforms.
  4️⃣ Count each action once per Item ID; product groups overlap and must not be summed.
  5️⃣ Return zero when no qualifying actions exist.

Business Use Case: |
  1️⃣ Merchandisers investigate falling product cart additions before changing offers or product content.
  2️⃣ Commerce teams compare hourly additions to decide when to adjust trading activity.
  3️⃣ Product teams investigate sudden declines after cart experience changes.


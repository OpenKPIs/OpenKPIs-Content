Google Analytics SQL: |
  -- ==========================================
  -- 1. GOOGLE BIGQUERY SQL
  -- ==========================================
  -- Add to cart: one count per deduplicated add_to_cart event, independent of units or SKUs.
  -- Events are counted at event grain; items are only aggregated inside a scalar subquery, never joined.
  WITH atc_events AS (
    SELECT
      PARSE_DATE('%Y%m%d', event_date) AS event_date,
      user_pseudo_id,
      event_timestamp,
      (SELECT ep.value.string_value FROM UNNEST(event_params) AS ep WHERE ep.key = 'event_id') AS event_id,
      (SELECT ep.value.int_value FROM UNNEST(event_params) AS ep WHERE ep.key = 'ga_session_id') AS ga_session_id,
      (SELECT ep.value.string_value FROM UNNEST(event_params) AS ep WHERE ep.key = 'traffic_type') AS traffic_type,
      (SELECT ep.value.string_value FROM UNNEST(event_params) AS ep WHERE ep.key = 'add_method') AS add_method,
      (SELECT ep.value.string_value FROM UNNEST(event_params) AS ep WHERE ep.key = 'page_location') AS page_location,
      device.web_info.hostname AS hostname,
      (SELECT STRING_AGG(CONCAT(IFNULL(i.item_id, ''), ':', CAST(COALESCE(NULLIF(i.quantity, 0), 1) AS STRING)), '|' ORDER BY i.item_id)
         FROM UNNEST(items) AS i) AS items_signature,
      (SELECT IFNULL(SUM(COALESCE(NULLIF(i.quantity, 0), 1)), 0) FROM UNNEST(items) AS i) AS units_added
    FROM `your-project.analytics_123456789.events_*`
    WHERE _TABLE_SUFFIX BETWEEN FORMAT_DATE('%Y%m%d', DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY))
                            AND FORMAT_DATE('%Y%m%d', DATE_SUB(CURRENT_DATE(), INTERVAL 1 DAY))
      AND event_name = 'add_to_cart'
  ),
  filtered AS (
    SELECT
      event_date,
      CONCAT(IFNULL(user_pseudo_id, 'na'), '.', IFNULL(CAST(ga_session_id AS STRING), 'na')) AS session_key,
      -- Dedupe on event_id; fallback key wraps every nullable part so NULLs never collapse distinct events.
      COALESCE(
        NULLIF(event_id, ''),
        CONCAT(IFNULL(user_pseudo_id, 'na'), '.', IFNULL(CAST(ga_session_id AS STRING), 'na'), '.',
               IFNULL(CAST(event_timestamp AS STRING), 'na'), '.',
               TO_HEX(MD5(IFNULL(items_signature, ''))))
      ) AS dedupe_key,
      event_timestamp,
      units_added
    FROM atc_events
    WHERE IFNULL(traffic_type, '') NOT IN ('internal', 'developer', 'test')
      -- Non-shopper adds: login rehydration, cart merges, saved-cart restoration, promotion auto-injected gifts.
      AND LOWER(IFNULL(add_method, '')) NOT IN ('login_rehydration', 'cart_merge', 'saved_cart_restore', 'promo_auto_gift')
      -- QA / staging / dev hostnames (hostname from device.web_info, falling back to the page_location host).
      AND NOT REGEXP_CONTAINS(
        LOWER(COALESCE(hostname, NET.HOST(page_location), '')),
        r'(^|[.-])(qa|staging|stage|dev|test|uat|preview)([.-]|$)|localhost'
      )
  ),
  deduped AS (
    SELECT *
    FROM filtered
    WHERE TRUE
    QUALIFY ROW_NUMBER() OVER (PARTITION BY dedupe_key ORDER BY event_timestamp) = 1
  )
  SELECT
    event_date,
    COUNT(*) AS add_to_cart,
    COUNT(DISTINCT session_key) AS sessions_with_add_to_cart,
    SUM(units_added) AS items_added_to_cart
  FROM deduped
  GROUP BY event_date
  ORDER BY event_date;

AEP Query Service SQL: |
  -- ==========================================
  -- 2. ADOBE AEP QUERY SERVICE SQL
  -- ==========================================
  -- Add to cart: one count per deduplicated commerce.productListAdds experience event (_id), independent of units.
  -- Sessions are rebuilt over all web activity per ECID with a 30-minute inactivity timeout, then filtered to adds.
  WITH web_events AS (
    SELECT
      _id,
      timestamp,
      eventType,
      identityMap['ECID'][0].id AS ecid,
      productListItems
    FROM aep_web_events_dataset
    WHERE timestamp >= date_sub(current_date(), 30)
      AND timestamp < current_date()
      AND identityMap['ECID'][0].id IS NOT NULL
      AND NOT (LOWER(COALESCE(environment.browserDetails.userAgent, '')) RLIKE 'bot|crawler|spider|headless|slurp|monitor')
      -- Internal traffic flagged at collection (office IP ranges on environment.ipV4 are mapped to trafficType upstream).
      AND COALESCE(_tenant.trafficType, '') <> 'internal'
      -- QA / staging / dev hostnames.
      AND NOT (LOWER(COALESCE(parse_url(web.webPageDetails.URL, 'HOST'), '')) RLIKE '(^|[.-])(qa|staging|stage|dev|test|uat|preview)([.-]|$)|localhost')
  ),
  sessionized AS (
    SELECT
      _id,
      timestamp,
      eventType,
      ecid,
      productListItems,
      SESS_TIMEOUT(timestamp, 60 * 30) OVER (
        PARTITION BY ecid ORDER BY timestamp
        ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW
      ) AS session
    FROM web_events
  ),
  atc_ranked AS (
    SELECT
      to_date(timestamp) AS event_date,
      CONCAT(ecid, '.', CAST(session.num AS STRING)) AS session_key,
      COALESCE(aggregate(
        productListItems,
        CAST(0 AS BIGINT),
        (acc, x) -> acc + CAST(COALESCE(NULLIF(x.quantity, 0), 1) AS BIGINT)
      ), CAST(0 AS BIGINT)) AS units_added,
      ROW_NUMBER() OVER (PARTITION BY _id ORDER BY timestamp) AS rn
    FROM sessionized
    WHERE eventType = 'commerce.productListAdds'
      -- Non-shopper adds: login rehydration, cart merges, saved-cart restoration, promotion auto-injected gifts.
      AND (productListItems IS NULL OR NOT exists(
        productListItems,
        x -> LOWER(COALESCE(x.productAddMethod, '')) IN ('login_rehydration', 'cart_merge', 'saved_cart_restore', 'promo_auto_gift')
      ))
  )
  SELECT
    event_date,
    COUNT(*) AS add_to_cart,
    COUNT(DISTINCT session_key) AS sessions_with_add_to_cart,
    SUM(units_added) AS items_added_to_cart
  FROM atc_ranked
  WHERE rn = 1
  GROUP BY event_date
  ORDER BY event_date;

Calculation Notes: |
  1️⃣ Unit of count is the interaction: each qualifying add_to_cart event (Adobe scAdd / XDM commerce.productListAdds) adds exactly 1, whether the payload holds one SKU at quantity 1 or several SKUs at higher quantities. Unit volume is reported separately as Items Added to Cart (SUM(items.quantity), missing quantity coerced to 1), and reach as Sessions with Add to Cart (COUNT DISTINCT session key); the three must never be mixed in one column.  
  2️⃣ Deduplicate on event_id (or on user_pseudo_id + ga_session_id + event_timestamp + item list hash when no event_id is sent) to remove double fires from page reloads, SPA re-renders, retry logic and duplicate tag deployments; in Adobe, rely on the scAdd event serialisation or a merchandising-level dedupe key where configured.  
  3️⃣ Qualifying adds originate on PDP, PLP quick-add, search results, recommendation carousels, wishlist-to-cart and quick-reorder surfaces; exclude automatic cart rehydration on login, cart merges between anonymous and authenticated carts, server-side restoration of saved carts and promotion-engine auto-injected gifts (add_method / addMethod / productAddMethod values login_rehydration, cart_merge, saved_cart_restore and promo_auto_gift), and quantity edits made inside the cart page (those are update_cart, not add_to_cart).  
  4️⃣ remove_from_cart is never netted against this metric; it is a gross intent counter, and net cart activity belongs to a separate derived measure.  
  5️⃣ Currency and value are irrelevant to the count: the value and price parameters are carried for revenue-per-add analysis but play no part in the calculation, and zero-priced or free-gift adds still count unless the gift is auto-injected by a promotion engine without a shopper action.  
  6️⃣ Exclude internal IP ranges, QA and staging hostnames, known bots and spiders (GA4 built-in bot filtering, Adobe bot rules / IAB list) and synthetic monitoring traffic; do not exclude users who never reach checkout.  
  7️⃣ Timestamps are bucketed in the reporting property time zone; GA4 sessions end after 30 minutes of inactivity (Adobe visits after 30 minutes, 12-hour cap), so an add landing after a timeout starts a new session for any session-scoped ratio, while the raw event count itself is unaffected.

Business Use Case: |
  1️⃣ Merchandising: when a product's Add to cart count per 100 PDP views drops more than 20% week over week against its category median, the category merchandiser reviews price, imagery, size availability and reviews for that SKU and escalates out-of-stock variants to Inventory Planning within the same trading week.  
  2️⃣ Performance Marketing: when a paid campaign's landing sessions generate fewer Add to cart events per 100 sessions than the channel benchmark for 7 consecutive days, the paid media manager reallocates budget to higher-intent ad groups or swaps the landing page before the next bid cycle.  
  3️⃣ Product (Digital Experience): when Add to cart on mobile falls more than 15% below desktop for the same SKUs after a release, the product manager opens a defect against the add-to-cart component (sticky button, variant selector, quick-add modal) and gates the next release on recovery.  
  4️⃣ E-commerce Trading: during promotions and peak events, the trading lead monitors hourly Add to cart against forecast and, when adds rise without a matching rise in begin_checkout, triggers checkout-friction checks and cart-recovery messaging within the hour.


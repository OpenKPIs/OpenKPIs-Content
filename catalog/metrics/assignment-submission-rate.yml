      student_type,
      residency_status,
      enrollment_status,
      COUNT(*) AS eligible_assignment_count,
      SUM(CASE WHEN first_submitted_at IS NOT NULL THEN 1 ELSE 0 END) AS submitted_assignment_count,
      SUM(CASE WHEN first_submitted_at IS NULL THEN 1 ELSE 0 END) AS unsubmitted_assignment_count,
      SUM(
        CASE
          WHEN first_submitted_at IS NOT NULL
           AND assignment_due_at IS NOT NULL
           AND first_submitted_at <= assignment_due_at THEN 1
          ELSE 0
        END
      ) AS on_time_submission_count,
      SUM(
        CASE
          WHEN first_submitted_at IS NOT NULL
           AND assignment_due_at IS NOT NULL
           AND first_submitted_at > assignment_due_at THEN 1
          ELSE 0
        END
      ) AS late_submission_count
    FROM eligible_obligations
    GROUP BY
      as_of_timestamp, CAST(eligibility_at AS DATE),
      DATE_TRUNC('month', CAST(eligibility_at AS DATE)), academic_year,
      term_id, term_name, institution_id, institution_name, campus_id,
      campus_name, school_id, school_name, department_id, department_name,
      program_id, program_name, course_id, course_code, course_name, section_id,
      section_code, section_name, delivery_mode, instructor_id, instructor_name,
      assignment_id, assignment_name, assignment_type, assignment_status,
      assignment_available_at, assignment_due_at, assignment_closed_at,
      points_possible, student_level, student_type, residency_status,
      enrollment_status
  )
  SELECT
    'Assignment Submission Rate' AS metric_name,
    'Submitted eligible student-assignment obligations divided by all eligible non-exempt student-assignment obligations' AS metric_description,
    'RATE' AS metric_unit,
    as_of_timestamp,
    reporting_due_date,
    reporting_month,
    academic_year,
    term_id,
    term_name,
    institution_id,
    institution_name,
    campus_id,
    campus_name,
    school_id,
    school_name,
    department_id,
    department_name,
    program_id,
    program_name,
    course_id,
    course_code,
    course_name,
    section_id,
    section_code,
    section_name,
    delivery_mode,
    instructor_id,
    instructor_name,
    assignment_id,
    assignment_name,
    assignment_type,
    assignment_status,
    assignment_available_at,
    assignment_due_at,
    assignment_closed_at,
    points_possible,
    student_level,
    student_type,
    residency_status,
    enrollment_status,
    'NOT_EXEMPT' AS exemption_status,
    CASE
      WHEN submitted_assignment_count = 0 THEN 'NONE_SUBMITTED'
      WHEN submitted_assignment_count = eligible_assignment_count THEN 'ALL_SUBMITTED'
      ELSE 'PARTIALLY_SUBMITTED'
    END AS submission_coverage_status,
    eligible_assignment_count,
    submitted_assignment_count,
    unsubmitted_assignment_count,
    on_time_submission_count,
    late_submission_count,
    CASE
      WHEN eligible_assignment_count = 0 THEN NULL
      ELSE CAST(submitted_assignment_count AS DOUBLE) /
           CAST(eligible_assignment_count AS DOUBLE)
    END AS assignment_submission_rate,
    ROUND(
      100.0 * CASE
        WHEN eligible_assignment_count = 0 THEN NULL
        ELSE CAST(submitted_assignment_count AS DOUBLE) /
             CAST(eligible_assignment_count AS DOUBLE)
      END,
      2
    ) AS assignment_submission_rate_pct
  FROM aggregated;

Calculation Notes: |
  Use one learner_assignment_key per learner and assigned assignment instance. The denominator includes obligations due in the selected window only after their due time has passed and excludes drafts, unreleased assignments, deleted assignments, test accounts, auditors, withdrawn enrollments effective before the due time, and formally excused or waived obligations. The numerator requires at least one accepted, non-draft, non-deleted submission recorded by report_as_of_at; multiple attempts and resubmissions count once. Late submissions are included in the canonical rate and must be separated using On-Time Assignment Submission Rate when deadline compliance is required. Return null, not zero, when the eligible denominator is zero.

Business Use Case: |
  Academic Operations reviews the rate by course, instructor, assignment type, and learner cohort each week. If a course falls below 70%, the team examines release timing, workload concentration, notification delivery, and assignment accessibility, then triggers learner reminders, instructor outreach, deadline adjustments, or assignment redesign and monitors the subsequent submission-rate change.


Source Data: Learning Management System assignment, enrollment, exemption, and submission records supplemented by the digital learning event store and Student Information System


Metric Name: Average Subscription Duration
Formula: AVG(DATE_DIFF(COALESCE(cancellation_effective_date, period_end_date), first_paid_date, DAY)) over subscriptions active at any point in the period

Description: |
  Subscription specialisation of Average Customer Tenure: mean days from first paid cycle to cancellation, or to period end if still active. Feeds subscription Customer Lifetime Value.

Category: Retention



























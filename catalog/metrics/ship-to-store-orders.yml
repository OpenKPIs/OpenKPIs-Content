Metric Name: Ship-to-Store Orders
Formula: COUNT(DISTINCT transaction_id) on purchase events WHERE fulfillment_method = 'ship_to_store', by order date in the reporting period

Description: |
  Distinct online orders shipped from a DC to the chosen store for pickup (Fulfillment Method = ship_to_store). Unlike BOPIS Orders, no store stock is used; it is the count behind Ship-to-Store Rate.

Category: Operations

Tags: [metric, Retail: Omnichannel (BOPIS - Buy Online Pick Up In Store)]

Industry: Retail

Priority: Medium

Core Area: Checkout

Scope: Event

Measure Type: Counter

Aggregation Window: Daily, Weekly, Monthly


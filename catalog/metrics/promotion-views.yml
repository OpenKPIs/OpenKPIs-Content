Metric Name: Promotion Views
Formula: COUNT of view_promotion impressions, one per distinct promotion_id per page view, by event timestamp in the reporting period

Description: |
  Count of internal promotion impressions (GA4 view_promotion), one per promotion per page view once the slot is in view. It is the denominator of Promotion Click-Through Rate.


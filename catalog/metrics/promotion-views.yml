Metric Name: Promotion Views
Aliases: [Promotion Impressions, Internal Promotion Views, Banner Impressions]

Formula: Total internal promotion impressions

Description: |
  Count of internal promotions seen on a page, with each promotion counted once per page view. It helps merchandising teams compare offer exposure with clicks.

Category: Engagement


Google Analytics SQL: |
  WITH impressions AS (
    SELECT DISTINCT
      (SELECT p.value.string_value FROM UNNEST(event_params) AS p WHERE p.key = 'page_view_id') AS page_view_id,
      COALESCE(
        NULLIF((SELECT p.value.string_value FROM UNNEST(event_params) AS p WHERE p.key = 'promotion_id'), ''),
        NULLIF((SELECT p.value.string_value FROM UNNEST(event_params) AS p WHERE p.key = 'promotion_name'), ''),
        '(not set)'
      ) AS promotion_key
    FROM `project.analytics.events_*`
    WHERE event_name = 'view_promotion'
      AND _TABLE_SUFFIX BETWEEN FORMAT_DATE('%Y%m%d', DATE_SUB(DATE(@report_start), INTERVAL 1 DAY))
        AND FORMAT_DATE('%Y%m%d', DATE_ADD(DATE(@report_end), INTERVAL 1 DAY))
      AND event_timestamp >= UNIX_MICROS(@report_start)
      AND event_timestamp < UNIX_MICROS(@report_end)
      AND COALESCE((SELECT p.value.string_value FROM UNNEST(event_params) AS p WHERE p.key = 'traffic_type'), '') != 'internal'
      AND NULLIF((SELECT p.value.string_value FROM UNNEST(event_params) AS p WHERE p.key = 'page_view_id'), '') IS NOT NULL
  )
  SELECT COUNT(*) AS promotion_views
  FROM impressions;

AEP Query Service SQL: |
  WITH impressions AS (
    SELECT DISTINCT
      _openkpis.pageViewId AS page_view_id,
      COALESCE(NULLIF(_openkpis.promotionId, ''), NULLIF(_openkpis.promotionName, ''), '(not set)') AS promotion_key
    FROM {{AEP_EXPERIENCE_EVENT_DATASET}}
    WHERE eventType = 'decisioning.propositionDisplay'
      AND timestamp >= CAST(:report_start AS TIMESTAMP)
      AND timestamp < CAST(:report_end AS TIMESTAMP)
      AND COALESCE(_openkpis.trafficType, '') != 'internal'
      AND NULLIF(_openkpis.pageViewId, '') IS NOT NULL
  )
  SELECT COUNT(*) AS promotion_views
  FROM impressions;

Calculation Notes: |
  1️⃣ Record after 50% is visible for 1 second; exclude third-party ads, product lists and internal traffic.
  2️⃣ Count each promotion once per page-view ID; carousel rotations, retries and scroll-back add no views.
  3️⃣ Use promotion ID, else name, else "(not set)"; send one promotion per event regardless of product count.
  4️⃣ Use occurrence time: start inclusive, end exclusive, before deduplication; keep retry timestamps unchanged.
  5️⃣ Page-view IDs must be nonempty, anonymous and unique per page view; exclude records without them.

Business Use Case: |
  1️⃣ Merchandising compares promotion exposure with clicks before replacing a weak creative.
  2️⃣ Marketing investigates low launch-day exposure before changing offer placement.


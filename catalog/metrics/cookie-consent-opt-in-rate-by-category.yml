SQL Query: |
  -- BigQuery example using GA4 export where one cookie_consent_update event is sent per consent category
  WITH consent_events AS (
    SELECT
      PARSE_DATE('%Y%m%d', event_date) AS event_date,
      user_pseudo_id,
      (SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'consent_category') AS consent_category,
      (SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'consent_status') AS consent_status,
      (SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'consent_action') AS consent_action,
      geo.country AS country,
      device.category AS device_category
    FROM `project.dataset.events_*`
    WHERE event_name = 'cookie_consent_update'
      AND _TABLE_SUFFIX BETWEEN '20260101' AND '20260131'
  ), latest_user_category_decision AS (
    SELECT
      event_date,
      user_pseudo_id,
      consent_category,
      consent_status,
      country,
      device_category,
      ROW_NUMBER() OVER (
        PARTITION BY event_date, user_pseudo_id, consent_category
        ORDER BY event_date DESC
      ) AS rn
    FROM consent_events
    WHERE consent_category IS NOT NULL
      AND consent_status IN ('granted', 'denied')
  )
  SELECT
    event_date,
    consent_category,
    country,
    device_category,
    COUNT(DISTINCT user_pseudo_id) AS users_with_consent_decision,
    COUNT(DISTINCT IF(consent_status = 'granted', user_pseudo_id, NULL)) AS users_opted_in,
    SAFE_DIVIDE(
      COUNT(DISTINCT IF(consent_status = 'granted', user_pseudo_id, NULL)),
      COUNT(DISTINCT user_pseudo_id)
    ) * 100 AS cookie_consent_opt_in_rate_pct
  FROM latest_user_category_decision
  WHERE rn = 1
  GROUP BY event_date, consent_category, country, device_category
  ORDER BY event_date, consent_category;

Calculation Notes: |
  Calculate separately for each consent category; do not combine analytics, advertising, personalization, and functional categories into a single numerator unless explicitly reporting an overall rate. Strictly necessary or security cookies should usually be excluded because they are not optional and can distort opt-in performance. Use the latest consent decision per user per category within the reporting window when measuring user-level opt-in rate; use all events only when measuring decision-level opt-in rate. Exclude internal traffic, test consent banner events, QA environments, bots, and duplicate CMP callbacks. Regional privacy rules may change the available categories and default states, so always segment by country or regulatory region.

Business Use Case: |
  A digital analytics and compliance team monitors analytics-cookie opt-in rates after launching a revised cookie banner on an investment research website. If analytics consent drops sharply in the EU, the team can review banner language, placement, and preference-center UX while ensuring changes remain compliant with GDPR, FCA, SEC, and internal privacy policies.


# Metric: Cookie Consent Opt-In Rate by Category
# Generated: 2026-09-16T22:39:27.699Z
# Contributed by: devyendarm
# Last modified by: devyendarm

Metric Name: Cookie Consent Opt-In Rate by Category
Formula: Cookie Consent Opt-In Rate (category c) = (Distinct users whose latest consent decision for c in the reporting window has consent_status = 'granted' / Distinct users with at least one granted or denied consent decision for c in the reporting window) × 100

Description: |
  Measures, for each optional cookie category (analytics, functional, personalization, advertising), the share of users whose latest explicit consent decision in the reporting period is granted, out of all users who recorded a decision for that category. Financial services marketing and privacy teams use it to size the measurable and addressable digital audience, diagnose the impact of consent banner changes, and compare consent outcomes across opt-in jurisdictions governed by the GDPR and the ePrivacy Directive.

Category: Governance

Tags: [metric, Finance: Digital Privacy & Consent Management, cookie consent, consent management, privacy, opt-in rate]

Industry: ["Finance"], Finance

Priority: High

Core Area: Generic

Scope: User

Measure Type: Percentage

Aggregation Window: Daily, Weekly, Monthly, Quarterly


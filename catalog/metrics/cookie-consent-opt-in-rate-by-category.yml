Metric Name: Cookie Consent Opt-In Rate by Category
Formula: Cookie Consent Opt-In Rate by Category = (Distinct users or consent decisions with consent_status = 'granted' for a given consent_category / Distinct users or consent decisions with a recorded consent decision for that consent_category) × 100

Description: |
  Measures the percentage of visitors who grant cookie consent for each consent category, such as analytics, personalization, advertising, or functional cookies. This matters because consent levels directly affect measurement coverage, personalization eligibility, marketing activation, and privacy compliance in financial services environments.

Category: Conversion

Tags: [cookie consent, privacy, consent management, opt-in rate, analytics consent, marketing consent, financial services compliance]

Industry: ["Finance"]

Priority: High

Core Area: Digital Analytics

Scope: User

Measure Type: percentage

Aggregation Window: Event, User, Time based - Hourly/Daily/Monthly/Quarterly/Yearly; reportable by consent category, region, device, browser, page type, and acquisition channel


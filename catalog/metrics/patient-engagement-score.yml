Metric Name: Patient Engagement Score
Formula: (SUM(interactions) + SUM(feature_utilization)) / COUNT(unique_patients)

Description: |
  Measures the level of interaction and involvement a patient has with telemedicine services, including usage frequency and feature utilization.

Category: Engagement

Tags: [metric]

Industry: Healthcare & Telemedicine

Priority: High

Core Area: Engagement

Scope: User

Measure Type: score

Aggregation Window: Time based - Monthly

GA4 Event: |
  engagement

Adobe Event: |
  custom_link_patient_engagement

W3 Data Layer: |
  {"digitalData":{"event":{"eventInfo":{"eventName":"Patient Engagement Score","eventAction":"engagement"},"attributes":{"score":"value"}}}}

GA4 Data Layer: |
  {"event":"engagement","event_params":{"engagement_score":"value"}}

Adobe Client Data Layer: |
  {"event":"custom_link_patient_engagement","eventData":{"engagementScore":"value"}}

XDM Mapping: |
  {"_experience":{"analytics":{"event1":{"name":"Patient Engagement Score","details":{"score":"value"}}}}}

Google Analytics SQL: |
  -- ==========================================
  -- 1. GOOGLE BIGQUERY SQL
  -- ==========================================
  SELECT event_date, user_id, event_params.value.int_value AS engagement_score
  FROM `your-project.analytics_123456789.events_*`
  WHERE event_name = 'engagement'
    AND EXISTS (
      SELECT 1
      FROM UNNEST(event_params) AS param
      WHERE param.key = 'engagement_score'
    )

AEP Query Service SQL: |
  -- ==========================================
  -- 2. ADOBE AEP QUERY SERVICE SQL
  -- ==========================================
  SELECT eventDate, userID, eventData.engagementScore AS engagement_score
  FROM aep_backend_dataset
  WHERE event = 'custom_link_patient_engagement'
    AND eventData.engagementScore IS NOT NULL

Calculation Notes: |
  Exclude inactive patients and interactions under 30 seconds. Consider session timeout after 15 minutes of inactivity.

Business Use Case: |
  Executives use this score to identify highly engaged patients and tailor personalized outreach programs to improve service adoption.



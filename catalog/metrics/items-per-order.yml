Metric Name: Items per Order
Formula: SUM(items.quantity WHERE event_name = 'purchase') / COUNT(DISTINCT transaction_id WHERE event_name = 'purchase')

Description: |
  Average units per completed order: summed item quantity on purchases divided by distinct transaction_ids in the period. Read with Average Order Value to separate basket depth from price.


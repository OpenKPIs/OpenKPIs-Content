Metric Name: BOPIS Revenue
Formula: SUM(items.price × items.quantity) on purchase events WHERE fulfillment_method IN ('store_pickup', 'curbside'), deduplicated by transaction_id, by purchase date

Description: |
  Merchandise revenue at discounted unit price × quantity (item discounts netted; tax and shipping excluded) of online orders placed for store or curbside pickup. Revenue counterpart of BOPIS Orders.

Category: Monetization



























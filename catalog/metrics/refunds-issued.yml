Metric Name: Refunds Issued
Formula: COUNT(DISTINCT refund_id) WHERE event_name = 'refund', by refund issue date in the reporting period

Description: |
  Count of distinct refund transactions, full or partial, issued to customers in the period by refund date. It counts refunds, not their value, and is the numerator of Refund Rate.

Category: Monetization

Tags: [metric, E-commerce: Returns, Refunds & Customer Support]

Industry: E-commerce


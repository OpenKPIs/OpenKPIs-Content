Metric Name: Tax Amount
Formula: SUM(tax) over purchase events, one row per distinct transaction_id, converted to reporting currency

Description: |
  Sum of the tax value carried on completed purchases in the reporting window, in reporting currency. Kept apart from revenue so AOV and GMV stay tax-exclusive; refunded tax is not netted here.

Category: Monetization

Tags: [metric, E-commerce: Cart & Checkout Funnel Analytics]

Industry: E-commerce


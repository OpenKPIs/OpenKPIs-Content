Calculation Notes: |
  1️⃣ Cohort sessions are based on session start date, not booking confirmation date.  
  2️⃣ A session is eligible with an availability search, offer selection, or booking-start action.  
  3️⃣ Use a 30-minute inactivity timeout for web/app sessions; assisted-channel sessions must not exceed 24 hours.  
  4️⃣ Count a session once, regardless of multiple searches or bookings.  
  5️⃣ Confirmed bookings require a unique ID, committed inventory, timestamp, and valid status.  
  6️⃣ Customer cancellations affect Cancellation Rate, not original conversion.  
  7️⃣ Return null for eligible denominator if zero; recalculate cohorts with new data.

Business Use Case: |
  The Chief Commercial Officer reviews Booking Conversion Rate by acquisition channel, device, destination, product, customer type, and booking-flow step. If mobile paid-search sessions show a material decline while desktop and organic traffic remain stable, Digital Commerce investigates mobile availability, pricing, authentication, payment, and confirmation-step performance, pauses inefficient campaign spend, and prioritizes remediation against the step producing the largest recoverable booking loss.


Source Data: Digital Analytics (web and mobile app), Central Reservation System, CRM and call-center interaction data, partner booking feeds, identity-resolution services, and payment platform events stitched through session, customer, interaction, and reservation identifiers


Metric Name: Booking Conversion Rate
Formula: 100 * COUNT(DISTINCT CASE WHEN is_eligible_booking_session = TRUE AND booking_status = 'CONFIRMED' AND booking_confirmation_timestamp >= session_start_timestamp AND booking_confirmation_timestamp < session_start_timestamp + INTERVAL '30 days' THEN eligible_session_id END) / NULLIF(COUNT(DISTINCT CASE WHEN is_eligible_booking_session = TRUE THEN eligible_session_id END), 0)

Description: |
  Booking Conversion Rate measures the percentage of eligible customer booking sessions that result in at least one confirmed reservation within the defined conversion window. It shows how effectively acquisition and engagement activity across digital, assisted, and partner channels converts booking intent into confirmed travel revenue opportunities.

Category: Conversion

Tags: [metric]

Industry: Travel & Hospitality

Priority: High

Core Area: Checkout

Scope: Session

Measure Type: percentage

Aggregation Window: Time based - Daily


Metric Name: Store Selections
Formula: COUNT(store selection events WHERE store_id IS NOT NULL), deduplicated by event_id, by event date in the reporting period

Description: |
  Counts the times a shopper explicitly chooses a pickup or preferred store, recorded on the store selection event with a store_id. It is the store-choice step of the pickup funnel, ahead of BOPIS orders.

Category: Conversion

Tags: [metric, Retail: Omnichannel (BOPIS - Buy Online Pick Up In Store)]

Industry: Retail

Priority: Medium

Core Area: Checkout

Scope: Event

Measure Type: Counter

Aggregation Window: Daily, Weekly, Monthly


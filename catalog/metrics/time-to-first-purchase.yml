# Metric: Time to First Purchase
# Generated: 2026-09-14T06:46:55.892Z
# Contributed by: devyendarm


Metric Name: Time to First Purchase
Formula: MEDIAN(TIMESTAMP_DIFF(first_purchase_ts, sign_up_ts, HOUR)) and AVG(TIMESTAMP_DIFF(first_purchase_ts, sign_up_ts, HOUR)) over customers where sign_up_ts IS NOT NULL AND first_purchase_ts >= sign_up_ts, with sign_up_ts = MIN(sign_up event or customers.created_at) and first_purchase_ts = MIN(completed purchase timestamp per customer); days = hours / 24

Description: |
  E-commerce specialisation of the canonical metric Time to First Value: the elapsed time per registered customer between account creation (sign_up) and that customer's first completed purchase, reported as the median and mean in hours or days for a sign-up cohort. It measures how quickly a new account turns into revenue, and it only covers customers who have both a sign-up and a completed order, so guest checkouts without an account are left out by design.


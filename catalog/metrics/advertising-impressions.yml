# Last modified by: devyendarm

Metric Name: Advertising Impressions
Formula: COUNT(DISTINCT impression_id) WHERE event_name = 'ad_impression' AND delivery_status = 'accepted' AND COALESCE(test_traffic_flag, false) = false AND COALESCE(invalid_traffic_flag, false) = false

Description: |
  Advertising Impressions measures the number of valid digital ad exposures recorded when an eligible display, video, audio, or sponsored creative begins rendering or playback in a web, mobile, connected-TV, or streaming experience. It counts accepted impression events rather than ad requests, opportunities, completed views, or viewable impressions and is used to govern delivery, inventory monetization, and campaign pacing.

Category: Performance

Tags: [metric]

Industry: Media & Streaming

Priority: High

Core Area: Monetization

Scope: Event

Measure Type: count

Aggregation Window: Time based - Hourly/Daily/Monthly/Yearly

GA4 Event: |
  ad_impression

Adobe Event: |
  media.adStart


Google Analytics SQL: |
  -- ==========================================
  -- 1. GOOGLE BIGQUERY SQL
  -- ==========================================
  WITH event_parameters AS (
    SELECT
      e.event_date,
      e.event_timestamp AS ga4_event_timestamp,
      e.event_bundle_sequence_id,
      e.event_server_timestamp_offset,
      e.user_pseudo_id,
      ep.key,
      COALESCE(
        ep.value.string_value,
        CAST(ep.value.int_value AS STRING),
        CAST(ep.value.double_value AS STRING),
        CAST(ep.value.float_value AS STRING)
      ) AS parameter_value
    FROM `your-project.analytics_123456789.events_*` AS e
    LEFT JOIN UNNEST(e.event_params) AS ep
    WHERE _TABLE_SUFFIX BETWEEN FORMAT_DATE('%Y%m%d', @start_date)
                            AND FORMAT_DATE('%Y%m%d', @end_date)
      AND e.event_name = 'ad_impression'
  ),
  pivoted_events AS (
    SELECT
      event_date,
      ga4_event_timestamp,
      event_bundle_sequence_id,
      event_server_timestamp_offset,
      user_pseudo_id,
      MAX(IF(key = 'impression_id', parameter_value, NULL)) AS impression_id,
      MAX(IF(key = 'impression_timestamp', parameter_value, NULL)) AS impression_timestamp_raw,
      MAX(IF(key = 'ad_server', parameter_value, NULL)) AS ad_server,
      MAX(IF(key = 'source_log_type', parameter_value, NULL)) AS source_log_type,
      MAX(IF(key = 'delivery_method', parameter_value, NULL)) AS delivery_method,
      MAX(IF(key = 'environment', parameter_value, NULL)) AS environment,
      MAX(IF(key = 'platform', parameter_value, NULL)) AS platform,
      MAX(IF(key = 'device_type', parameter_value, NULL)) AS device_type,
      MAX(IF(key = 'app_or_site_id', parameter_value, NULL)) AS app_or_site_id,
      MAX(IF(key = 'page_or_screen_name', parameter_value, NULL)) AS page_or_screen_name,
      MAX(IF(key = 'page_url', parameter_value, NULL)) AS page_url,
      MAX(IF(key = 'referrer_url', parameter_value, NULL)) AS referrer_url,
      MAX(IF(key = 'content_id', parameter_value, NULL)) AS content_id,
      MAX(IF(key = 'content_title', parameter_value, NULL)) AS content_title,
      MAX(IF(key = 'content_type', parameter_value, NULL)) AS content_type,
      MAX(IF(key = 'player_id', parameter_value, NULL)) AS player_id,
      MAX(IF(key = 'player_name', parameter_value, NULL)) AS player_name,
      MAX(IF(key = 'player_version', parameter_value, NULL)) AS player_version,
      MAX(IF(key = 'playback_session_id', parameter_value, NULL)) AS playback_session_id,
      MAX(IF(key = 'stream_id', parameter_value, NULL)) AS stream_id,
      MAX(IF(key = 'stream_type', parameter_value, NULL)) AS stream_type,
      MAX(IF(key = 'live_stream', parameter_value, NULL)) AS live_stream_raw,
      MAX(IF(key = 'ad_unit_id', parameter_value, NULL)) AS ad_unit_id,
      MAX(IF(key = 'ad_unit_name', parameter_value, NULL)) AS ad_unit_name,
      MAX(IF(key = 'placement_id', parameter_value, NULL)) AS placement_id,
      MAX(IF(key = 'placement_name', parameter_value, NULL)) AS placement_name,
      MAX(IF(key = 'inventory_type', parameter_value, NULL)) AS inventory_type,
      MAX(IF(key = 'ad_format', parameter_value, NULL)) AS ad_format,
      MAX(IF(key = 'creative_id', parameter_value, NULL)) AS creative_id,
      MAX(IF(key = 'creative_name', parameter_value, NULL)) AS creative_name,
      MAX(IF(key = 'creative_type', parameter_value, NULL)) AS creative_type,
      MAX(IF(key = 'creative_duration_ms', parameter_value, NULL)) AS creative_duration_ms_raw,
      MAX(IF(key = 'advertiser_id', parameter_value, NULL)) AS advertiser_id,
      MAX(IF(key = 'advertiser_name', parameter_value, NULL)) AS advertiser_name,
      MAX(IF(key = 'campaign_id', parameter_value, NULL)) AS campaign_id,
      MAX(IF(key = 'campaign_name', parameter_value, NULL)) AS campaign_name,
      MAX(IF(key = 'order_id', parameter_value, NULL)) AS order_id,
      MAX(IF(key = 'line_item_id', parameter_value, NULL)) AS line_item_id,
      MAX(IF(key = 'line_item_name', parameter_value, NULL)) AS line_item_name,
      MAX(IF(key = 'flight_id', parameter_value, NULL)) AS flight_id,
      MAX(IF(key = 'ad_break_id', parameter_value, NULL)) AS ad_break_id,
      MAX(IF(key = 'ad_break_position', parameter_value, NULL)) AS ad_break_position,
      MAX(IF(key = 'pod_id', parameter_value, NULL)) AS pod_id,
      MAX(IF(key = 'pod_position', parameter_value, NULL)) AS pod_position_raw,
      MAX(IF(key = 'impression_position_ms', parameter_value, NULL)) AS impression_position_ms_raw,
      MAX(IF(key = 'rendered_percentage', parameter_value, NULL)) AS rendered_percentage_raw,
      MAX(IF(key = 'valid_impression', parameter_value, NULL)) AS valid_impression_raw,
      MAX(IF(key = 'rejection_reason', parameter_value, NULL)) AS rejection_reason,
      MAX(IF(key = 'consent_status', parameter_value, NULL)) AS consent_status
    FROM event_parameters
    GROUP BY
      event_date,
      ga4_event_timestamp,
      event_bundle_sequence_id,
      event_server_timestamp_offset,
      user_pseudo_id
  ),
  typed_events AS (
    SELECT
      impression_id,
      COALESCE(
        SAFE_CAST(impression_timestamp_raw AS TIMESTAMP),
        TIMESTAMP_MICROS(ga4_event_timestamp)
      ) AS impression_timestamp,
      ad_server,
      source_log_type,
      delivery_method,
      environment,
      platform,
      device_type,
      app_or_site_id,
      page_or_screen_name,
      page_url,
      referrer_url,
      content_id,
      content_title,
      content_type,
      player_id,
      player_name,
      player_version,
      playback_session_id,
      stream_id,
      stream_type,
      CASE
        WHEN LOWER(live_stream_raw) IN ('true', '1') THEN TRUE
        WHEN LOWER(live_stream_raw) IN ('false', '0') THEN FALSE
      END AS live_stream,
      ad_unit_id,
      ad_unit_name,
      placement_id,
      placement_name,
      inventory_type,
      ad_format,
      creative_id,
      creative_name,
      creative_type,
      SAFE_CAST(creative_duration_ms_raw AS INT64) AS creative_duration_ms,
      advertiser_id,
      advertiser_name,
      campaign_id,
      campaign_name,
      order_id,
      line_item_id,
      line_item_name,
      flight_id,
      ad_break_id,
      ad_break_position,
      pod_id,
      SAFE_CAST(pod_position_raw AS INT64) AS pod_position,
      SAFE_CAST(impression_position_ms_raw AS INT64) AS impression_position_ms,
      SAFE_CAST(rendered_percentage_raw AS NUMERIC) AS rendered_percentage,
      CASE
        WHEN LOWER(valid_impression_raw) IN ('true', '1') THEN TRUE
        WHEN LOWER(valid_impression_raw) IN ('false', '0') THEN FALSE
      END AS valid_impression,
      rejection_reason,
      consent_status,
      ga4_event_timestamp,
      event_bundle_sequence_id,
      event_server_timestamp_offset,
      user_pseudo_id
    FROM pivoted_events
  ),
  deduplicated_impressions AS (
    SELECT * EXCEPT(row_number)
    FROM (
      SELECT
        typed_events.*,
        ROW_NUMBER() OVER (
          PARTITION BY impression_id
          ORDER BY
            impression_timestamp,
            CASE source_log_type
              WHEN 'client_beacon' THEN 1
              WHEN 'server_side_ad_insertion' THEN 2
              WHEN 'ad_server_delivery_log' THEN 3
              ELSE 4
            END,
            ga4_event_timestamp,
            event_bundle_sequence_id,
            event_server_timestamp_offset
        ) AS row_number
      FROM typed_events
      WHERE impression_id IS NOT NULL
        AND valid_impression IS TRUE
        AND environment = 'production'
    )
    WHERE row_number = 1
  )
  SELECT
    impression_id,
    impression_timestamp,
    ad_server,
    source_log_type,
    delivery_method,
    environment,
    platform,
    device_type,
    app_or_site_id,
    page_or_screen_name,
    page_url,
    referrer_url,
    content_id,
    content_title,
    content_type,
    player_id,
    player_name,
    player_version,
    playback_session_id,
    stream_id,
    stream_type,
    live_stream,
    ad_unit_id,
    ad_unit_name,
    placement_id,
    placement_name,
    inventory_type,
    ad_format,
    creative_id,
    creative_name,
    creative_type,
    creative_duration_ms,
    advertiser_id,
    advertiser_name,
    campaign_id,
    campaign_name,
    order_id,
    line_item_id,
    line_item_name,
    flight_id,
    ad_break_id,
    ad_break_position,
    pod_id,
    pod_position,
    impression_position_ms,
    rendered_percentage,
    valid_impression,
    rejection_reason,
    consent_status,
    CAST(1 AS INT64) AS advertising_impressions
  FROM deduplicated_impressions;


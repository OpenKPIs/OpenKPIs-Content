  -- 2. ADOBE AEP QUERY SERVICE SQL
  -- ==========================================
  WITH extracted_impressions AS (
    SELECT
      _adDelivery.advertisingImpression.impression_id AS impression_id,
      COALESCE(
        CAST(_adDelivery.advertisingImpression.impression_timestamp AS TIMESTAMP),
        CAST(timestamp AS TIMESTAMP)
      ) AS impression_timestamp,
      _adDelivery.advertisingImpression.ad_server AS ad_server,
      _adDelivery.advertisingImpression.source_log_type AS source_log_type,
      _adDelivery.advertisingImpression.delivery_method AS delivery_method,
      _adDelivery.advertisingImpression.environment AS environment,
      _adDelivery.advertisingImpression.platform AS platform,
      _adDelivery.advertisingImpression.device_type AS device_type,
      _adDelivery.advertisingImpression.app_or_site_id AS app_or_site_id,
      _adDelivery.advertisingImpression.page_or_screen_name AS page_or_screen_name,
      _adDelivery.advertisingImpression.page_url AS page_url,
      _adDelivery.advertisingImpression.referrer_url AS referrer_url,
      _adDelivery.advertisingImpression.content_id AS content_id,
      _adDelivery.advertisingImpression.content_title AS content_title,
      _adDelivery.advertisingImpression.content_type AS content_type,
      _adDelivery.advertisingImpression.player_id AS player_id,
      _adDelivery.advertisingImpression.player_name AS player_name,
      _adDelivery.advertisingImpression.player_version AS player_version,
      _adDelivery.advertisingImpression.playback_session_id AS playback_session_id,
      _adDelivery.advertisingImpression.stream_id AS stream_id,
      _adDelivery.advertisingImpression.stream_type AS stream_type,
      CAST(_adDelivery.advertisingImpression.live_stream AS BOOLEAN) AS live_stream,
      _adDelivery.advertisingImpression.ad_unit_id AS ad_unit_id,
      _adDelivery.advertisingImpression.ad_unit_name AS ad_unit_name,
      _adDelivery.advertisingImpression.placement_id AS placement_id,
      _adDelivery.advertisingImpression.placement_name AS placement_name,
      _adDelivery.advertisingImpression.inventory_type AS inventory_type,
      _adDelivery.advertisingImpression.ad_format AS ad_format,
      _adDelivery.advertisingImpression.creative_id AS creative_id,
      _adDelivery.advertisingImpression.creative_name AS creative_name,
      _adDelivery.advertisingImpression.creative_type AS creative_type,
      CAST(_adDelivery.advertisingImpression.creative_duration_ms AS BIGINT) AS creative_duration_ms,
      _adDelivery.advertisingImpression.advertiser_id AS advertiser_id,
      _adDelivery.advertisingImpression.advertiser_name AS advertiser_name,
      _adDelivery.advertisingImpression.campaign_id AS campaign_id,
      _adDelivery.advertisingImpression.campaign_name AS campaign_name,
      _adDelivery.advertisingImpression.order_id AS order_id,
      _adDelivery.advertisingImpression.line_item_id AS line_item_id,
      _adDelivery.advertisingImpression.line_item_name AS line_item_name,
      _adDelivery.advertisingImpression.flight_id AS flight_id,
      _adDelivery.advertisingImpression.ad_break_id AS ad_break_id,
      _adDelivery.advertisingImpression.ad_break_position AS ad_break_position,
      _adDelivery.advertisingImpression.pod_id AS pod_id,
      CAST(_adDelivery.advertisingImpression.pod_position AS INTEGER) AS pod_position,
      CAST(_adDelivery.advertisingImpression.impression_position_ms AS BIGINT) AS impression_position_ms,
      CAST(_adDelivery.advertisingImpression.rendered_percentage AS DECIMAL(10,4)) AS rendered_percentage,
      CAST(_adDelivery.advertisingImpression.valid_impression AS BOOLEAN) AS valid_impression,
      _adDelivery.advertisingImpression.rejection_reason AS rejection_reason,
      _adDelivery.advertisingImpression.consent_status AS consent_status,
      _id AS experience_event_id
    FROM aep_advertising_impression_events
    WHERE eventType = 'media.adStart'
      AND CAST(timestamp AS TIMESTAMP) >= CAST(:start_timestamp AS TIMESTAMP)
      AND CAST(timestamp AS TIMESTAMP) < CAST(:end_timestamp AS TIMESTAMP)
  ),
  ranked_impressions AS (
    SELECT
      extracted_impressions.*,
      ROW_NUMBER() OVER (
        PARTITION BY impression_id
        ORDER BY
          impression_timestamp,
          CASE source_log_type
            WHEN 'client_beacon' THEN 1
            WHEN 'server_side_ad_insertion' THEN 2
            WHEN 'ad_server_delivery_log' THEN 3
            ELSE 4
          END,
          experience_event_id
      ) AS row_number
    FROM extracted_impressions
    WHERE impression_id IS NOT NULL
      AND valid_impression = TRUE
      AND environment = 'production'
  )
  SELECT
    impression_id,
    impression_timestamp,
    ad_server,
    source_log_type,
    delivery_method,
    environment,
    platform,
    device_type,
    app_or_site_id,
    page_or_screen_name,
    page_url,
    referrer_url,
    content_id,
    content_title,
    content_type,
    player_id,
    player_name,
    player_version,
    playback_session_id,
    stream_id,
    stream_type,
    live_stream,
    ad_unit_id,
    ad_unit_name,
    placement_id,
    placement_name,
    inventory_type,
    ad_format,
    creative_id,
    creative_name,
    creative_type,
    creative_duration_ms,
    advertiser_id,
    advertiser_name,
    campaign_id,
    campaign_name,
    order_id,
    line_item_id,
    line_item_name,
    flight_id,
    ad_break_id,
    ad_break_position,
    pod_id,
    pod_position,
    impression_position_ms,
    rendered_percentage,
    valid_impression,
    rejection_reason,
    consent_status,
    CAST(1 AS BIGINT) AS advertising_impressions
  FROM ranked_impressions
  WHERE row_number = 1;

Calculation Notes: |
  1️⃣ Count one impression when the approved impression trigger confirms that the creative has begun rendering or playback; do not count the preceding ad request or auction.
  2️⃣ Deduplicate on impression_id within the retention horizon; when unavailable, use the governed composite key defined in the deduplication rule.
  3️⃣ Count each eligible ad within an ad pod separately, including sequential video or audio ads delivered during the same content break.
  4️⃣ Exclude test traffic, malformed events, blocked integrations, known bot activity, and traffic classified as invalid under the current fraud policy.
  5️⃣ Treat viewable impressions, measurable impressions, starts, quartiles, clicks, and completions as separate metrics; viewability is not required for this count.
  6️⃣ Assign the impression to the event occurrence timestamp in the property's reporting time zone, while retaining UTC for cross-market reconciliation.
  7️⃣ Restate recent periods for accepted late events and post-delivery invalid-traffic adjustments according to the defined close policy.

Business Use Case: |
  Advertising Operations compares delivered impressions with prorated campaign commitments by order, creative, platform, and market each day; under-delivering lines can be reprioritized, extended, or assigned additional inventory, while over-delivering lines can be capped to protect yield and contractual limits.


Source Data: Digital Ad Serving and Streaming Analytics (Google Ad Manager delivery logs, client-side ad impression beacons, and server-side ad insertion logs)


  -- ==========================================
  -- 1. GOOGLE BIGQUERY SQL
  -- ==========================================
  WITH exploded_params AS (
    SELECT
      PARSE_DATE('%Y%m%d', e.event_date) AS event_date,
      e.user_pseudo_id,
      e.event_timestamp,
      e.event_bundle_sequence_id,
      ep.key,
      COALESCE(
        ep.value.string_value,
        CAST(ep.value.int_value AS STRING),
        CAST(ep.value.double_value AS STRING),
        CAST(ep.value.float_value AS STRING)
      ) AS param_value
    FROM `your-project.analytics_123456789.events_*` AS e
    CROSS JOIN UNNEST(e.event_params) AS ep
    WHERE _TABLE_SUFFIX BETWEEN FORMAT_DATE('%Y%m%d', @start_date)
                            AND FORMAT_DATE('%Y%m%d', @end_date)
      AND e.event_name = 'search'
  ),
  pivoted AS (
    SELECT
      event_date,
      user_pseudo_id,
      event_timestamp,
      event_bundle_sequence_id,
      MAX(IF(key = 'search_id', param_value, NULL)) AS search_id,
      MAX(IF(key = 'search_term', param_value, NULL)) AS search_term,
      MAX(IF(key = 'search_type', param_value, NULL)) AS search_type,
      MAX(IF(key = 'origin', param_value, NULL)) AS origin,
      MAX(IF(key = 'destination', param_value, NULL)) AS destination,
      MAX(IF(key = 'departure_date', param_value, NULL)) AS departure_date,
      MAX(IF(key = 'return_date', param_value, NULL)) AS return_date,
      MAX(IF(key = 'trip_type', param_value, NULL)) AS trip_type,
      MAX(IF(key = 'travel_mode', param_value, NULL)) AS travel_mode,
      MAX(IF(key = 'cabin_class', param_value, NULL)) AS cabin_class,
      MAX(IF(key = 'passengers_total', param_value, NULL)) AS passengers_total,
      MAX(IF(key = 'adults', param_value, NULL)) AS adults,
      MAX(IF(key = 'children', param_value, NULL)) AS children,
      MAX(IF(key = 'infants', param_value, NULL)) AS infants,
      MAX(IF(key = 'rooms', param_value, NULL)) AS rooms,
      MAX(IF(key = 'currency', param_value, NULL)) AS currency,
      MAX(IF(key = 'market', param_value, NULL)) AS market,
      MAX(IF(key = 'locale', param_value, NULL)) AS locale,
      MAX(IF(key = 'country', param_value, NULL)) AS country,
      MAX(IF(key = 'channel', param_value, NULL)) AS channel,
      MAX(IF(key = 'platform', param_value, NULL)) AS platform,
      MAX(IF(key = 'app_version', param_value, NULL)) AS app_version,
      MAX(IF(key = 'page_location', param_value, NULL)) AS page_location,
      MAX(IF(key = 'page_referrer', param_value, NULL)) AS page_referrer,
      MAX(IF(key = 'page_title', param_value, NULL)) AS page_title,
      MAX(IF(key = 'screen_name', param_value, NULL)) AS screen_name,
      MAX(IF(key = 'session_id', param_value, NULL)) AS session_id,
      MAX(IF(key = 'consent_analytics', param_value, NULL)) AS consent_analytics,
      MAX(IF(key = 'submitted_at', param_value, NULL)) AS submitted_at,
      MAX(IF(key = 'response_received_at', param_value, NULL)) AS response_received_at,
      MAX(IF(key = 'first_result_rendered_at', param_value, NULL)) AS first_result_rendered_at,
      MAX(IF(key = 'response_time_ms', param_value, NULL)) AS response_time_ms,
      MAX(IF(key = 'response_time_threshold_ms', param_value, NULL)) AS response_time_threshold_ms,
      MAX(IF(key = 'within_response_time_threshold', param_value, NULL)) AS within_response_time_threshold,
      MAX(IF(key = 'result_count', param_value, NULL)) AS result_count,
      MAX(IF(key = 'eligible_result_count', param_value, NULL)) AS eligible_result_count,
      MAX(IF(key = 'bookable_result_count', param_value, NULL)) AS bookable_result_count,
      MAX(IF(key = 'displayed_result_count', param_value, NULL)) AS displayed_result_count,
      MAX(IF(key = 'eligible_bookable_displayed_result_count', param_value, NULL)) AS eligible_bookable_displayed_result_count,
      MAX(IF(key = 'search_success', param_value, NULL)) AS search_success,
      MAX(IF(key = 'search_is_valid', param_value, NULL)) AS search_is_valid,
      MAX(IF(key = 'validation_status', param_value, NULL)) AS validation_status,
      MAX(IF(key = 'failure_reason', param_value, NULL)) AS failure_reason,
      MAX(IF(key = 'api_status_code', param_value, NULL)) AS api_status_code,
      MAX(IF(key = 'api_request_id', param_value, NULL)) AS api_request_id,
      MAX(IF(key = 'inventory_source', param_value, NULL)) AS inventory_source,
      MAX(IF(key = 'sort_order', param_value, NULL)) AS sort_order,
      MAX(IF(key = 'filter_count', param_value, NULL)) AS filter_count,
      MAX(IF(key = 'cache_status', param_value, NULL)) AS cache_status
    FROM exploded_params
    GROUP BY
      event_date,
      user_pseudo_id,
      event_timestamp,
      event_bundle_sequence_id
  ),
  normalized AS (
    SELECT
      event_date,
      user_pseudo_id,
      event_timestamp,
      event_bundle_sequence_id,
      NULLIF(TRIM(search_id), '') AS search_id,
      search_term,
      search_type,
      origin,
      destination,
      SAFE_CAST(departure_date AS DATE) AS departure_date,
      SAFE_CAST(return_date AS DATE) AS return_date,
      trip_type,
      travel_mode,
      cabin_class,
      SAFE_CAST(passengers_total AS INT64) AS passengers_total,
      SAFE_CAST(adults AS INT64) AS adults,
      SAFE_CAST(children AS INT64) AS children,
      SAFE_CAST(infants AS INT64) AS infants,
      SAFE_CAST(rooms AS INT64) AS rooms,
      currency,
      market,
      locale,
      country,
      channel,
      platform,
      app_version,
      page_location,
      page_referrer,
      page_title,
      screen_name,
      session_id,
      CASE
        WHEN LOWER(consent_analytics) IN ('true', '1') THEN TRUE
        WHEN LOWER(consent_analytics) IN ('false', '0') THEN FALSE
      END AS consent_analytics,
      SAFE_CAST(submitted_at AS TIMESTAMP) AS submitted_at,
      SAFE_CAST(response_received_at AS TIMESTAMP) AS response_received_at,
      SAFE_CAST(first_result_rendered_at AS TIMESTAMP) AS first_result_rendered_at,
      SAFE_CAST(response_time_ms AS INT64) AS response_time_ms,
      SAFE_CAST(response_time_threshold_ms AS INT64) AS response_time_threshold_ms,
      CASE
        WHEN LOWER(within_response_time_threshold) IN ('true', '1') THEN TRUE
        WHEN LOWER(within_response_time_threshold) IN ('false', '0') THEN FALSE
      END AS within_response_time_threshold,
      SAFE_CAST(result_count AS INT64) AS result_count,
      SAFE_CAST(eligible_result_count AS INT64) AS eligible_result_count,
      SAFE_CAST(bookable_result_count AS INT64) AS bookable_result_count,
      SAFE_CAST(displayed_result_count AS INT64) AS displayed_result_count,
      SAFE_CAST(eligible_bookable_displayed_result_count AS INT64) AS eligible_bookable_displayed_result_count,
      CASE
        WHEN LOWER(search_success) IN ('true', '1') THEN TRUE
        WHEN LOWER(search_success) IN ('false', '0') THEN FALSE
      END AS search_success,
      CASE
        WHEN LOWER(search_is_valid) IN ('true', '1') THEN TRUE
        WHEN LOWER(search_is_valid) IN ('false', '0') THEN FALSE
      END AS search_is_valid,
      validation_status,
      failure_reason,
      SAFE_CAST(api_status_code AS INT64) AS api_status_code,
      api_request_id,
      inventory_source,
      sort_order,
      SAFE_CAST(filter_count AS INT64) AS filter_count,
      cache_status
    FROM pivoted
    WHERE search_type = 'travel_inventory'
  ),
  deduplicated_searches AS (
    SELECT *
    FROM normalized
    QUALIFY ROW_NUMBER() OVER (
      PARTITION BY COALESCE(
        search_id,
        api_request_id,
        CONCAT(
          COALESCE(user_pseudo_id, 'unknown'), '|',
          COALESCE(session_id, 'unknown'), '|',
          CAST(event_timestamp AS STRING), '|',
          CAST(event_bundle_sequence_id AS STRING)
        )
      )
      ORDER BY
        first_result_rendered_at DESC,
        response_received_at DESC,
        event_timestamp DESC
    ) = 1
  )
  SELECT
    event_date,
    COALESCE(market, 'unknown') AS market,
    COALESCE(country, 'unknown') AS country,
    COALESCE(channel, 'unknown') AS channel,
    COALESCE(platform, 'unknown') AS platform,
    COALESCE(travel_mode, 'unknown') AS travel_mode,
    COALESCE(trip_type, 'unknown') AS trip_type,
    COALESCE(cabin_class, 'unknown') AS cabin_class,
    COUNTIF(search_is_valid IS TRUE) AS total_valid_travel_searches,
    COUNTIF(search_is_valid IS TRUE AND search_success IS TRUE) AS successful_travel_searches,
    ROUND(
      100.0 * SAFE_DIVIDE(
        COUNTIF(search_is_valid IS TRUE AND search_success IS TRUE),
        COUNTIF(search_is_valid IS TRUE)
      ),
      4
    ) AS travel_search_success_rate
  FROM deduplicated_searches
  GROUP BY
    event_date,
    market,
    country,
    channel,
    platform,
    travel_mode,
    trip_type,
    cabin_class
  ORDER BY
    event_date,
    market,
    country,
    channel,
    platform,
    travel_mode,
    trip_type,
    cabin_class

AEP Query Service SQL: |
  -- ==========================================
  -- 2. ADOBE AEP QUERY SERVICE SQL
  -- ==========================================
  WITH normalized AS (
    SELECT
      CAST(t.timestamp AS DATE) AS event_date,
      t.timestamp AS event_timestamp,
      t._travel.search.searchId AS search_id,
      t._travel.search.searchTerm AS search_term,
      t._travel.search.searchType AS search_type,
      t._travel.search.origin AS origin,
      t._travel.search.destination AS destination,
      CAST(t._travel.search.departureDate AS DATE) AS departure_date,
      CAST(t._travel.search.returnDate AS DATE) AS return_date,
      t._travel.search.tripType AS trip_type,
      t._travel.search.travelMode AS travel_mode,
      t._travel.search.cabinClass AS cabin_class,
      CAST(t._travel.search.passengersTotal AS BIGINT) AS passengers_total,
      CAST(t._travel.search.adults AS BIGINT) AS adults,
      CAST(t._travel.search.children AS BIGINT) AS children,
      CAST(t._travel.search.infants AS BIGINT) AS infants,
      CAST(t._travel.search.rooms AS BIGINT) AS rooms,
      t._travel.search.currency AS currency,
      t._travel.search.market AS market,
      t._travel.search.locale AS locale,
      t._travel.search.country AS country,
      t._travel.search.channel AS channel,
      t._travel.search.platform AS platform,
      t._travel.search.appVersion AS app_version,
      t._travel.search.pageLocation AS page_location,
      t._travel.search.pageReferrer AS page_referrer,
      t._travel.search.pageTitle AS page_title,
      t._travel.search.screenName AS screen_name,
      t._travel.search.sessionId AS session_id,
      CAST(t._travel.search.consentAnalytics AS BOOLEAN) AS consent_analytics,
      CAST(t._travel.search.submittedAt AS TIMESTAMP) AS submitted_at,
      CAST(t._travel.search.responseReceivedAt AS TIMESTAMP) AS response_received_at,
      CAST(t._travel.search.firstResultRenderedAt AS TIMESTAMP) AS first_result_rendered_at,
      CAST(t._travel.search.responseTimeMs AS BIGINT) AS response_time_ms,
      CAST(t._travel.search.responseTimeThresholdMs AS BIGINT) AS response_time_threshold_ms,
      CAST(t._travel.search.withinResponseTimeThreshold AS BOOLEAN) AS within_response_time_threshold,
      CAST(t._travel.search.resultCount AS BIGINT) AS result_count,
      CAST(t._travel.search.eligibleResultCount AS BIGINT) AS eligible_result_count,
      CAST(t._travel.search.bookableResultCount AS BIGINT) AS bookable_result_count,
      CAST(t._travel.search.displayedResultCount AS BIGINT) AS displayed_result_count,
      CAST(t._travel.search.eligibleBookableDisplayedResultCount AS BIGINT) AS eligible_bookable_displayed_result_count,
      CAST(t._travel.search.searchSuccess AS BOOLEAN) AS search_success,
      CAST(t._travel.search.searchIsValid AS BOOLEAN) AS search_is_valid,
      t._travel.search.validationStatus AS validation_status,
      t._travel.search.failureReason AS failure_reason,
      CAST(t._travel.search.apiStatusCode AS BIGINT) AS api_status_code,
      t._travel.search.apiRequestId AS api_request_id,
      t._travel.search.inventorySource AS inventory_source,
      t._travel.search.sortOrder AS sort_order,
      CAST(t._travel.search.filterCount AS BIGINT) AS filter_count,
      t._travel.search.cacheStatus AS cache_status
    FROM travel_search_experience_event_dataset AS t
    WHERE t.eventType = 'search'
      AND t._travel.search.searchType = 'travel_inventory'
      AND CAST(t.timestamp AS DATE) BETWEEN CAST('${START_DATE}' AS DATE)
                                        AND CAST('${END_DATE}' AS DATE)
  ),
  ranked_searches AS (
    SELECT
      n.*,
      ROW_NUMBER() OVER (
        PARTITION BY COALESCE(
          NULLIF(TRIM(n.search_id), ''),
          NULLIF(TRIM(n.api_request_id), ''),
          CONCAT(
            COALESCE(n.session_id, 'unknown'), '|',
            CAST(n.event_timestamp AS VARCHAR)
          )
        )
        ORDER BY
          n.first_result_rendered_at DESC,
          n.response_received_at DESC,
          n.event_timestamp DESC
      ) AS search_row_number
    FROM normalized AS n
  ),
  deduplicated_searches AS (
    SELECT *
    FROM ranked_searches
    WHERE search_row_number = 1
  )
  SELECT
    event_date,
    COALESCE(market, 'unknown') AS market,
    COALESCE(country, 'unknown') AS country,
    COALESCE(channel, 'unknown') AS channel,
    COALESCE(platform, 'unknown') AS platform,
    COALESCE(travel_mode, 'unknown') AS travel_mode,
    COALESCE(trip_type, 'unknown') AS trip_type,
    COALESCE(cabin_class, 'unknown') AS cabin_class,
    SUM(CASE WHEN search_is_valid = TRUE THEN 1 ELSE 0 END) AS total_valid_travel_searches,
    SUM(
      CASE
        WHEN search_is_valid = TRUE AND search_success = TRUE THEN 1
        ELSE 0
      END
    ) AS successful_travel_searches,
    ROUND(
      100.0 * SUM(
        CASE
          WHEN search_is_valid = TRUE AND search_success = TRUE THEN 1
          ELSE 0
        END
      ) / NULLIF(
        SUM(CASE WHEN search_is_valid = TRUE THEN 1 ELSE 0 END),
        0
      ),
      4
    ) AS travel_search_success_rate
  FROM deduplicated_searches
  GROUP BY
    event_date,
    market,
    country,
    channel,
    platform,
    travel_mode,
    trip_type,
    cabin_class
  ORDER BY
    event_date,
    market,
    country,
    channel,
    platform,
    travel_mode,
    trip_type,
    cabin_class

Calculation Notes: |
  1️⃣ Generate valid_search_id on accepted search submission.  
  2️⃣ Deduplicate events by valid_search_id for submit, retry, response, and impression.  
  3️⃣ Use the earliest qualifying impression for multiple result impressions.  
  4️⃣ Classify search as successful only if a qualifying result is rendered within SLA; flag conflicts as data-quality defects.  
  5️⃣ Keep legitimate zero-inventory responses in the denominator; exclude from numerator.  
  6️⃣ Recompute percentage from distinct counts at every aggregation level.  
  7️⃣ Return NULL if denominator is zero; apply effective SLA version at search time.

Business Use Case: |
  The Digital Product executive reviews this rate by product, market, route, platform, application version, supplier, and latency band to distinguish inventory gaps from technical failures. If success deteriorates for a specific destination or supplier, Product can adjust empty-state alternatives and supplier prioritization, Revenue Management can investigate inventory coverage, and engineering can remediate service or rendering defects before the issue materially reduces downstream bookings.



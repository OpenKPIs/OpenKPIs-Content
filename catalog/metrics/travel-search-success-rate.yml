# Metric: Travel Search Success Rate
# Generated: 2026-09-13T18:30:24.882Z
# Contributed by: devyendarm
# Last modified by: devyendarm

Metric Name: Travel Search Success Rate
Formula: IF(COUNT_DISTINCT(valid_search_id) = 0, NULL, 100 * COUNT_DISTINCT(CASE WHEN eligible_bookable_result_rendered = TRUE AND result_render_latency_seconds <= search_success_sla_seconds THEN valid_search_id END) / COUNT_DISTINCT(valid_search_id))

Description: |
  Travel Search Success Rate measures the percentage of valid digital travel searches that display at least one eligible, bookable result within the defined response-time threshold. It quantifies whether the digital discovery experience successfully converts submitted traveler intent into visible inventory, independent of subsequent result selection or booking.

Category: Quality

Tags: [metric]

Industry: Travel & Hospitality

Priority: High

Core Area: Discovery

Scope: Event

Measure Type: percentage

Aggregation Window: Time based - Daily


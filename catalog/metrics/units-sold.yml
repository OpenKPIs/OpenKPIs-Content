Google Analytics SQL: |
  -- ==========================================
  -- 1. GOOGLE BIGQUERY SQL
  -- ==========================================
  -- Metric : Units Sold — gross item quantity on completed purchase transactions
  -- Grain  : one row per reporting day x merchandising / channel breakdown
  -- Source : GA4 BigQuery export, date-sharded events_* (quantity lives in the items array,
  --          event-scoped parameters are pivoted out of event_params with UNNEST / MAX(IF()))
  -- Scope  : GROSS units booked at transaction time. Refunds, cancellations and chargebacks are
  --          NOT netted here; Net Units Sold is published separately against the original order date.
  
  DECLARE start_date DATE DEFAULT DATE_SUB(CURRENT_DATE('America/Chicago'), INTERVAL 27 DAY);
  DECLARE end_date   DATE DEFAULT CURRENT_DATE('America/Chicago');
  
  WITH purchase_events AS (
    SELECT
      PARSE_DATE('%Y%m%d', event_date)                                     AS order_date,
      event_timestamp,
      user_pseudo_id,
      IFNULL(device.category, '(not set)')                                 AS device_category,
      IFNULL(geo.country, '(not set)')                                     AS country,
      LOWER(IFNULL(traffic_source.medium, '(none)'))                       AS traffic_medium,
      LOWER(IFNULL(traffic_source.source, '(direct)'))                     AS traffic_source_name,
      -- Event-param pivot: one scalar subquery per parameter key, never two key predicates in a single row filter
      COALESCE(
        (SELECT MAX(IF(p.key = 'transaction_id', p.value.string_value, NULL)) FROM UNNEST(event_params) AS p),
        ecommerce.transaction_id
      )                                                                    AS transaction_id,
      (SELECT MAX(IF(p.key = 'currency',      p.value.string_value, NULL)) FROM UNNEST(event_params) AS p) AS currency,
      (SELECT MAX(IF(p.key = 'coupon',        p.value.string_value, NULL)) FROM UNNEST(event_params) AS p) AS coupon_code,
      (SELECT MAX(IF(p.key = 'shipping_tier', p.value.string_value, NULL)) FROM UNNEST(event_params) AS p) AS shipping_tier,
      (SELECT MAX(IF(p.key = 'payment_type',  p.value.string_value, NULL)) FROM UNNEST(event_params) AS p) AS payment_method,
      (SELECT MAX(IF(p.key = 'checkout_type', p.value.string_value, NULL)) FROM UNNEST(event_params) AS p) AS checkout_type,
      (SELECT MAX(IF(p.key = 'ga_session_id', p.value.int_value,    NULL)) FROM UNNEST(event_params) AS p) AS ga_session_id,
      items
    FROM `your-project.analytics_123456789.events_*`
    WHERE _TABLE_SUFFIX BETWEEN FORMAT_DATE('%Y%m%d', start_date)
                            AND FORMAT_DATE('%Y%m%d', end_date)
      AND event_name = 'purchase'
  ),
  
  -- Transaction de-duplication: purchase is serialised once per transaction ID, so confirmation-page
  -- reloads, back navigation and client-side retries collapse to the first hit per transaction.
  deduplicated_orders AS (
    SELECT * EXCEPT (row_num)
    FROM (
      SELECT
        pe.*,
        ROW_NUMBER() OVER (
          PARTITION BY pe.transaction_id
          ORDER BY pe.event_timestamp ASC
        ) AS row_num
      FROM purchase_events AS pe
      WHERE pe.transaction_id IS NOT NULL
        AND TRIM(pe.transaction_id) <> ''
        -- Internal and QA orders are out of scope
        AND NOT REGEXP_CONTAINS(UPPER(pe.transaction_id), r'^(TEST|QA|INT)[-_]')
        AND LOWER(IFNULL(pe.payment_method, '')) NOT IN ('test', 'test_card', 'internal')
    )
    WHERE row_num = 1
  ),
  
  order_items AS (
    SELECT
      o.order_date,
      o.transaction_id,
      o.device_category,
      o.country,
      o.currency,
      IFNULL(o.coupon_code, '(none)')                AS coupon_code,
      IFNULL(o.shipping_tier, '(not set)')           AS shipping_tier,
      IFNULL(o.payment_method, '(not set)')          AS payment_method,
      IFNULL(o.checkout_type, '(not set)')           AS checkout_type,
      CASE
        WHEN o.traffic_medium IN ('cpc', 'ppc', 'paid', 'paidsearch')          THEN 'Paid Search'
        WHEN o.traffic_medium = 'organic'                                      THEN 'Organic Search'
        WHEN o.traffic_medium IN ('email', 'e-mail', 'newsletter')             THEN 'Email'
        WHEN o.traffic_medium IN ('social', 'social-network', 'social-media')  THEN 'Organic Social'
        WHEN o.traffic_medium IN ('display', 'banner', 'cpm')                  THEN 'Display'
        WHEN o.traffic_medium = 'affiliate'                                    THEN 'Affiliates'
        WHEN o.traffic_medium = 'referral'                                     THEN 'Referral'
        WHEN o.traffic_medium IN ('(none)', '') AND o.traffic_source_name IN ('(direct)', '') THEN 'Direct'
        ELSE 'Other'
      END                                            AS default_channel_grouping,
      IFNULL(it.item_category, '(not set)')          AS item_category,
      IFNULL(it.item_brand, '(not set)')             AS item_brand,
      IFNULL(it.item_name, '(not set)')              AS item_name,
      IFNULL(it.item_variant, '(not set)')           AS item_variant,
      it.item_id,
      it.quantity                                    AS item_quantity
    FROM deduplicated_orders AS o
    CROSS JOIN UNNEST(o.items) AS it
    -- Missing, zero or negative quantity is a tagging defect and is dropped, never coerced to 1
    WHERE IFNULL(it.quantity, 0) > 0
      -- Non-merchandise lines and bundle parents whose components are transmitted separately
      AND LOWER(IFNULL(it.item_category, '')) NOT IN ('gift wrap', 'shipping insurance', 'donation', 'gift card')
      AND NOT REGEXP_CONTAINS(UPPER(IFNULL(it.item_id, '')), r'^(BUNDLE|GWRAP|GIFTCARD|DONATE)[-_]')
  )
  
  SELECT
    order_date,
    item_category,
    item_brand,
    default_channel_grouping,
    device_category,
    checkout_type,
    SUM(item_quantity)                                                AS units_sold,
    COUNT(DISTINCT transaction_id)                                    AS orders,
    COUNT(*)                                                          AS item_lines,
    ROUND(SAFE_DIVIDE(SUM(item_quantity), COUNT(DISTINCT transaction_id)), 2) AS units_per_order
  FROM order_items
  GROUP BY
    order_date,
    item_category,
    item_brand,
    default_channel_grouping,
    device_category,
    checkout_type
  ORDER BY
    order_date DESC,
    units_sold DESC;

AEP Query Service SQL: |
  -- ==========================================
  -- 2. ADOBE AEP QUERY SERVICE SQL
  -- ==========================================
  -- Metric : Units Sold — gross item quantity on completed purchase transactions
  -- Grain  : one row per reporting day x merchandising / channel breakdown
  -- Source : AEP ExperienceEvent dataset, eventType = 'commerce.purchases'
  --          (quantity lives in the productListItems array, order context in commerce.order)
  -- Scope  : GROSS units booked at transaction time. commerce.refunds / returns are NOT netted here;
  --          Net Units Sold is published separately against the original order date.
  
  WITH purchase_events AS (
    SELECT
      to_date(from_utc_timestamp(timestamp, 'America/Chicago'))        AS order_date,
      timestamp                                                        AS event_ts,
      _id                                                              AS event_id,
      commerce.order.purchaseID                                        AS transaction_id,
      commerce.order.currencyCode                                      AS currency,
      commerce.order.couponCode                                        AS coupon_code,
      commerce.order.checkoutType                                      AS checkout_type,
      commerce.order.payments[0].paymentType                           AS payment_method,
      coalesce(device.type, 'unknown')                                 AS device_category,
      coalesce(placeContext.geo.countryCode, '(not set)')              AS country,
      lower(coalesce(web.webReferrer.type, 'direct'))                  AS referrer_type,
      coalesce(marketing.trackingCode, '(none)')                       AS tracking_code,
      productListItems                                                 AS product_list_items
    FROM your_experience_event_dataset
    WHERE eventType = 'commerce.purchases'
      AND commerce.purchases.value > 0
      -- Partition-pruning filter on the ingest timestamp column
      AND timestamp >= to_timestamp('2026-08-21 00:00:00')
      AND timestamp <  to_timestamp('2026-09-18 00:00:00')
      AND commerce.order.purchaseID IS NOT NULL
      AND trim(commerce.order.purchaseID) <> ''
      AND upper(commerce.order.purchaseID) NOT RLIKE '^(TEST|QA|INT)[-_]'
      AND lower(coalesce(commerce.order.payments[0].paymentType, '')) NOT IN ('test', 'test_card', 'internal')
  ),
  
  -- Transaction de-duplication: confirmation reloads and client-side retries resolve to the
  -- first event received per purchase ID.
  deduplicated_orders AS (
    SELECT
      order_date,
      transaction_id,
      currency,
      coalesce(coupon_code, '(none)')          AS coupon_code,
      coalesce(checkout_type, '(not set)')     AS checkout_type,
      coalesce(payment_method, '(not set)')    AS payment_method,
      device_category,
      country,
      CASE
        WHEN tracking_code <> '(none)'                 THEN 'Campaign'
        WHEN referrer_type IN ('search', 'search_paid') THEN 'Search'
        WHEN referrer_type = 'social'                   THEN 'Organic Social'
        WHEN referrer_type = 'email'                    THEN 'Email'
        WHEN referrer_type = 'external'                 THEN 'Referral'
        WHEN referrer_type IN ('direct', 'internal')    THEN 'Direct'
        ELSE 'Other'
      END                                      AS default_channel_grouping,
      product_list_items
    FROM (
      SELECT
        pe.*,
        ROW_NUMBER() OVER (
          PARTITION BY pe.transaction_id
          ORDER BY pe.event_ts ASC
        ) AS row_num
      FROM purchase_events AS pe
    ) AS ranked
    WHERE row_num = 1
  ),
  
  order_items AS (
    SELECT
      o.order_date,
      o.transaction_id,
      o.device_category,
      o.country,
      o.currency,
      o.coupon_code,
      o.checkout_type,
      o.payment_method,
      o.default_channel_grouping,
      coalesce(item.productCategory, '(not set)')  AS item_category,
      coalesce(item.productBrand, '(not set)')     AS item_brand,
      coalesce(item.name, '(not set)')             AS item_name,
      coalesce(item.productVariant, '(not set)')   AS item_variant,
      item.SKU                                     AS item_sku,
      item.quantity                                AS item_quantity
    FROM deduplicated_orders AS o
    LATERAL VIEW explode(o.product_list_items) exploded_items AS item
    -- Missing, zero or negative quantity is a tagging defect and is dropped, never coerced to 1
    WHERE coalesce(item.quantity, 0) > 0
      -- Non-merchandise lines and bundle parents whose components are transmitted separately
      AND lower(coalesce(item.productCategory, '')) NOT IN ('gift wrap', 'shipping insurance', 'donation', 'gift card')
      AND upper(coalesce(item.SKU, '')) NOT RLIKE '^(BUNDLE|GWRAP|GIFTCARD|DONATE)[-_]'
  )
  
  SELECT
    order_date,
    item_category,
    item_brand,
    default_channel_grouping,
    device_category,
    checkout_type,
    SUM(item_quantity)                                              AS units_sold,
    COUNT(DISTINCT transaction_id)                                  AS orders,
    COUNT(*)                                                        AS item_lines,
    ROUND(SUM(item_quantity) / NULLIF(COUNT(DISTINCT transaction_id), 0), 2) AS units_per_order
  FROM order_items
  GROUP BY
    order_date,
    item_category,
    item_brand,
    default_channel_grouping,
    device_category,
    checkout_type
  ORDER BY
    order_date DESC,
    units_sold DESC;

Calculation Notes: |
  1️⃣ The grain is the item line, not the order: every purchase event contributes the sum of the quantity on its item array, so an order containing three of one SKU adds three units while a single-line order adds one. Order count and order value never enter the calculation.,2️⃣ Gross at transaction time: units are booked when the purchase confirms and are never retroactively reduced by returns, refunds, cancellations or chargebacks. Net Units Sold is a separate derivation that subtracts refunded quantity against the original order date; the two are published side by side rather than one silently netted into the other.,3️⃣ Exclusions: internal and test orders identified by the QA order prefix or test payment method, non-merchandise lines (gift wrap, shipping insurance, donations, and gift cards where policy treats them as tender), bundle parent SKUs whose components are also transmitted, and lines carrying a missing, zero or negative quantity — those are raised as a tagging defect rather than coerced to one.,4️⃣ Transaction de-duplication: purchase is serialised once per transaction ID, so confirmation-page reloads, back navigation and client-side retries must resolve to the first event per transaction ID. Without that guard the full basket quantity is counted twice, and the inflation lands disproportionately on desktop and on slow networks.,5️⃣ Timing: units are attributed to the timestamp of the purchase event in the reporting time zone, never to session start or ship date. The 30-minute session-inactivity timeout, midnight boundary and campaign-change session resets therefore move only session-scoped breakdowns such as channel, landing page or device — the period total is unaffected.,6️⃣ Quantity carries no price component, so units aggregate cleanly across currencies, markets and item categories without an FX step; this is the roll-up to trust when price changes, discount depth or exchange rates distort revenue comparisons year over year.,7️⃣ Pre-orders, backorders and subscription renewals count at purchase confirmation regardless of fulfilment date; a renewal contributes its ordered quantity once per billing transaction, and split shipments of a single order never re-count the same units.

Business Use Case: |
  1️⃣ Merchandising planners review Units Sold beside Item Revenue by item category and SKU in the weekly trade meeting; SKUs with high unit velocity but thin revenue contribution are demoted from prime product-list and home-page slots in favour of higher-value substitutes.,2️⃣ Revenue Management reads Units Sold split by coupon code and discount depth within 72 hours of a promotion ending and extends, re-prices or kills the offer depending on whether the unit lift covered the margin given away.,3️⃣ Finance reconciles digital Units Sold to shipped quantity from the order-management system at every month-end close; a variance beyond the agreed tolerance opens a tagging investigation before the figure is released into the demand and inventory forecast.,4️⃣ Marketing compares Units Sold by default channel grouping and campaign against spend each month and shifts budget toward channels that deliver unit volume in the categories the merchandising calendar is pushing, rather than isolated high-ticket orders.


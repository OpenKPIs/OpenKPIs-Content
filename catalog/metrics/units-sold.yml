Metric Name: Units Sold
Formula: SUM(purchase.items[].quantity)

Description: |
  Units Sold is the total quantity of items purchased across completed transactions in the period, summing the item-level quantity carried on every purchase. Because it measures volume rather than value, it isolates demand from price, discount and order-size effects, which makes it the reference base for sell-through, replenishment planning and per-unit economics.

Category: Monetization



























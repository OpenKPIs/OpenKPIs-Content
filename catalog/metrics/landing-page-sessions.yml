Metric Name: Landing Page Sessions
Formula: COUNT(DISTINCT CONCAT(user_pseudo_id, '.', ga_session_id)) GROUP BY landing_page, where landing_page = path of page_location of the session's first page_view by event_timestamp, else '(not set)'

Description: |
  Sessions per landing page, each session counted once against the path of its first page_view. Sessions with no page_view report (not set), so the total equals Sessions.


Metric Name: Course Enrollment Count
Formula: COUNT(DISTINCT CASE WHEN enrollment_event_type = 'ENROLLMENT_CONFIRMED' AND access_granted = TRUE AND is_test = FALSE AND is_admin_created = FALSE AND is_system_transfer = FALSE THEN CONCAT(institution_id, '|', enrollment_id) END)

Description: |
  Counts unique digital course enrollments confirmed during the reporting period when a learner is granted access to a valid course offering. It measures gross enrollment creation and retains qualifying enrollments regardless of subsequent completion, cancellation, expiration, or refund activity.

Category: Conversion

Tags: [metric]

Industry: Education

Priority: High

Core Area: Onboarding

Scope: Event

Measure Type: count

Aggregation Window: Time based - Hourly/Daily/Monthly/Yearly


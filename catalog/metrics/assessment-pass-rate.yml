Calculation Notes: |
  1️⃣ Count each eligible graded submission as one assessment attempt with a unique attempt_id.  
  2️⃣ Determine pass status based on pass threshold, grading rule, and effective assessment version at submission.  
  3️⃣ Exclude attempts that are in progress, abandoned, saved but not submitted, pending grading, invalidated, voided, deleted, fraudulent, or created for testing.  
  4️⃣ Include manually graded attempts only after grading is finalized.  
  5️⃣ Count each valid retake separately; first or final attempts must select the earliest or latest eligible graded attempt.  
  6️⃣ Deduplicate repeated events by attempt_id and retain the latest finalized grading record.  
  7️⃣ Assign an attempt to a reporting period using graded_at; use submitted_at only if graded_at is unavailable and result is finalized synchronously.

Business Use Case: |
  A Chief Learning Officer reviews monthly pass rates by course, assessment, cohort, and question domain. If a required assessment falls below the 70% warning threshold while completion remains stable, the learning team investigates item difficulty, instructional coverage, learner segment gaps, and instructor delivery, then revises content, provides remediation, or recalibrates defective questions before the next cohort begins.



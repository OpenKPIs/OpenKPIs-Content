# Metric: Pickup Notifications Sent
# Generated: 2026-09-21T16:48:41.157Z
# Contributed by: devyendarm


Metric Name: Pickup Notifications Sent
Formula: COUNT(DISTINCT pickup_group_id × notification_channel) WHERE notification_type = 'ready_for_pickup' AND notification_stage = 'initial' AND provider_status IN ('accepted','sent','delivered') AND fulfillment_method IN ('pickup_in_store','curbside_pickup','locker_pickup','ship_to_store') AND is_test_order = FALSE

Description: |
  Counts the 'ready for pickup' notifications the order management and customer-messaging platforms successfully dispatched for store-pickup orders (BOPIS, curbside, locker), counted once per pickup group and channel at the moment the store marks the order picked, staged and ready. It sits between BOPIS Orders and Pickups Completed in the omnichannel funnel, so a shortfall against orders reaching ready status exposes stores or channels that stage orders without telling the customer, and it provides the notified-order base for pickup completion and abandonment analysis.

Category: Operations



























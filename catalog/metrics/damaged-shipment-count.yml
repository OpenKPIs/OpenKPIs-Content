# Metric: Damaged Shipment Count
# Generated: 2026-09-04T13:30:26.569Z
# Contributed by: devyendarm
# Last modified by: devyendarm

Metric Name: Damaged Shipment Count
Formula: COUNT(DISTINCT CASE WHEN customer_facing_shipment_flag = TRUE AND damage_confirmation_status = 'confirmed' AND damage_incident_stage IN ('carrier_transit', 'last_mile', 'delivery', 'post_delivery_unboxing') AND first_damage_confirmed_at >= reporting_window_start AND first_damage_confirmed_at < reporting_window_end THEN shipment_id END)

Description: |
  Counts unique customer-facing shipments confirmed as physically damaged during carrier transit, delivery, or customer unboxing within the reporting window. It measures fulfillment quality across the omnichannel journey by linking acquisition promises and conversion outcomes to service engagement, billing remedies, retention, and customer lifetime value.

Category: Quality

Tags: [metric]

Industry: Logistics & Supply Chain

Priority: High

Core Area: Generic

Scope: Item

Measure Type: count

Aggregation Window: Time based - Daily







Google Analytics SQL: |
  -- ==========================================
  -- 1. GOOGLE BIGQUERY SQL
  -- ==========================================
  WITH shipment_ranked AS (
    SELECT
      s.*,
      ROW_NUMBER() OVER (
        PARTITION BY s.shipment_id
        ORDER BY s.updated_at DESC, s.shipment_created_at DESC
      ) AS row_num
    FROM `your-project.commerce.shipments` AS s
  ),
  shipment_base AS (
    SELECT * EXCEPT (row_num)
    FROM shipment_ranked
    WHERE row_num = 1
  ),
  damage_evidence AS (
    SELECT
      shipment_id,
      observed_at AS evidence_at,
      'carrier_tracking' AS evidence_source
    FROM `your-project.logistics.carrier_tracking_events`
    WHERE UPPER(exception_code) IN ('DAMAGE', 'DAMAGED', 'PACKAGE_DAMAGED', 'CONTENT_DAMAGED')
  
    UNION ALL
  
    SELECT
      shipment_id,
      reported_at AS evidence_at,
      'self_service_claim' AS evidence_source
    FROM `your-project.customer_service.customer_claims`
    WHERE UPPER(issue_type) IN ('DAMAGED_ITEM', 'DAMAGED_PACKAGE', 'SHIPPING_DAMAGE')
      AND UPPER(claim_status) NOT IN ('DRAFT', 'CANCELLED', 'REJECTED_AS_DUPLICATE')
  
    UNION ALL
  
    SELECT
      shipment_id,
      completed_at AS evidence_at,
      'support_journey' AS evidence_source
    FROM `your-project.digital_support.support_journeys`
    WHERE UPPER(issue_category) IN ('DAMAGED_ITEM', 'DAMAGED_PACKAGE', 'SHIPPING_DAMAGE')
      AND UPPER(journey_status) IN ('SUBMITTED', 'COMPLETED', 'ESCALATED')
  
    UNION ALL
  
    SELECT
      shipment_id,
      created_at AS evidence_at,
      'crm_service_case' AS evidence_source
    FROM `your-project.crm.service_cases`
    WHERE UPPER(case_category) IN ('DAMAGED_ITEM', 'DAMAGED_PACKAGE', 'SHIPPING_DAMAGE')
      AND UPPER(case_status) NOT IN ('CANCELLED', 'DUPLICATE')
  
    UNION ALL
  
    SELECT
      shipment_id,
      created_at AS evidence_at,
      'billing_refund' AS evidence_source
    FROM `your-project.billing.refunds`
    WHERE UPPER(refund_reason) IN ('DAMAGED_ITEM', 'DAMAGED_PACKAGE', 'SHIPPING_DAMAGE')
      AND UPPER(refund_status) IN ('APPROVED', 'PROCESSED', 'COMPLETED')
  ),
  evidence_by_source AS (
    SELECT
      shipment_id,
      evidence_source,
      MIN(evidence_at) AS first_source_evidence_at,
      MAX(evidence_at) AS last_source_evidence_at
    FROM damage_evidence
    WHERE shipment_id IS NOT NULL
      AND evidence_at IS NOT NULL
    GROUP BY shipment_id, evidence_source
  ),
  first_evidence_source AS (
    SELECT shipment_id, evidence_source
    FROM evidence_by_source
    QUALIFY ROW_NUMBER() OVER (
      PARTITION BY shipment_id
      ORDER BY first_source_evidence_at, evidence_source
    ) = 1
  ),
  evidence_rollup AS (
    SELECT
      shipment_id,
      MIN(first_source_evidence_at) AS first_damage_reported_at,
      MAX(last_source_evidence_at) AS last_damage_reported_at,
      MAX(IF(evidence_source = 'carrier_tracking', 1, 0)) AS carrier_damage_flag,
      MAX(IF(evidence_source = 'self_service_claim', 1, 0)) AS self_service_damage_flag,
      MAX(IF(evidence_source = 'support_journey', 1, 0)) AS support_journey_damage_flag,
      MAX(IF(evidence_source = 'crm_service_case', 1, 0)) AS crm_damage_flag,
      MAX(IF(evidence_source = 'billing_refund', 1, 0)) AS refund_damage_flag
    FROM evidence_by_source
    GROUP BY shipment_id
  ),
  item_rollup AS (
    SELECT
      shipment_id,
      SUM(COALESCE(quantity, 0)) AS item_quantity,
      COUNT(DISTINCT sku) AS distinct_sku_count
    FROM `your-project.commerce.shipment_items`
    GROUP BY shipment_id
  ),
  claim_rollup AS (
    SELECT
      shipment_id,
      ARRAY_AGG(claim_id IGNORE NULLS ORDER BY reported_at LIMIT 1)[SAFE_OFFSET(0)] AS primary_claim_id
    FROM `your-project.customer_service.customer_claims`
    WHERE UPPER(issue_type) IN ('DAMAGED_ITEM', 'DAMAGED_PACKAGE', 'SHIPPING_DAMAGE')
      AND UPPER(claim_status) NOT IN ('DRAFT', 'CANCELLED', 'REJECTED_AS_DUPLICATE')
    GROUP BY shipment_id
  ),
  case_rollup AS (
    SELECT
      shipment_id,
      ARRAY_AGG(case_id IGNORE NULLS ORDER BY created_at LIMIT 1)[SAFE_OFFSET(0)] AS primary_service_case_id
    FROM `your-project.crm.service_cases`
    WHERE UPPER(case_category) IN ('DAMAGED_ITEM', 'DAMAGED_PACKAGE', 'SHIPPING_DAMAGE')
      AND UPPER(case_status) NOT IN ('CANCELLED', 'DUPLICATE')
    GROUP BY shipment_id
  ),
  refund_rollup AS (
    SELECT
      shipment_id,
      SUM(COALESCE(refund_amount, 0)) AS damage_refund_amount,
      MAX(updated_at) AS refund_updated_at
    FROM `your-project.billing.refunds`
    WHERE UPPER(refund_reason) IN ('DAMAGED_ITEM', 'DAMAGED_PACKAGE', 'SHIPPING_DAMAGE')
      AND UPPER(refund_status) IN ('APPROVED', 'PROCESSED', 'COMPLETED')
    GROUP BY shipment_id
  )
  SELECT
    DATE(e.first_damage_reported_at) AS metric_date,
    'Damaged Shipment Count' AS metric_name,
    '1.0' AS metric_version,
    'Distinct shipments with at least one validated carrier, claim, support, CRM, or refund damage signal; each output row is one additive damaged shipment.' AS metric_definition,
    CAST(1 AS INT64) AS damaged_shipment_count,
    s.shipment_id,
    s.tracking_number,
    s.order_id,
    o.order_number,
    o.customer_id,
    o.account_id,
    o.checkout_id,
    s.shipment_created_at,
    s.shipped_at,
    s.promised_delivery_at,
    s.delivered_at,
    e.first_damage_reported_at,
    e.last_damage_reported_at,
    fs.evidence_source AS damage_detection_source,
    e.carrier_damage_flag = 1 AS carrier_damage_flag,
    e.self_service_damage_flag = 1 AS self_service_damage_flag,
    e.support_journey_damage_flag = 1 AS support_journey_damage_flag,
    e.crm_damage_flag = 1 AS crm_damage_flag,
    e.refund_damage_flag = 1 AS refund_damage_flag,
    s.carrier_code,
    cr.carrier_name,
    s.service_level,
    s.shipment_status,
    s.fulfillment_center_id,
    fc.warehouse_id,
    fc.country_code AS origin_country_code,
    s.destination_country_code,
    s.destination_region,
    s.destination_city,
    o.sales_channel,
    o.device_channel,
    o.currency_code AS order_currency,
    o.order_value,
    s.shipment_value,
    COALESCE(i.item_quantity, 0) AS item_quantity,
    COALESCE(i.distinct_sku_count, 0) AS distinct_sku_count,
    COALESCE(s.package_count, 0) AS package_count,
    s.total_weight,
    s.weight_unit,
    c.customer_type,
    cl.primary_claim_id,
    sc.primary_service_case_id,
    COALESCE(r.damage_refund_amount, 0) AS damage_refund_amount,
    GREATEST(
      COALESCE(s.updated_at, TIMESTAMP '1970-01-01 00:00:00+00'),
      e.last_damage_reported_at,
      COALESCE(r.refund_updated_at, TIMESTAMP '1970-01-01 00:00:00+00')
    ) AS record_updated_at
  FROM shipment_base AS s
  JOIN evidence_rollup AS e
    ON e.shipment_id = s.shipment_id
  JOIN first_evidence_source AS fs
    ON fs.shipment_id = s.shipment_id
  LEFT JOIN `your-project.commerce.orders` AS o
    ON o.order_id = s.order_id
  LEFT JOIN `your-project.logistics.carriers` AS cr
    ON cr.carrier_code = s.carrier_code
  LEFT JOIN `your-project.logistics.fulfillment_centers` AS fc
    ON fc.fulfillment_center_id = s.fulfillment_center_id
  LEFT JOIN `your-project.customer.customer_profiles` AS c
    ON c.customer_id = o.customer_id
  LEFT JOIN item_rollup AS i
    ON i.shipment_id = s.shipment_id
  LEFT JOIN claim_rollup AS cl
    ON cl.shipment_id = s.shipment_id
  LEFT JOIN case_rollup AS sc
    ON sc.shipment_id = s.shipment_id
  LEFT JOIN refund_rollup AS r
    ON r.shipment_id = s.shipment_id;


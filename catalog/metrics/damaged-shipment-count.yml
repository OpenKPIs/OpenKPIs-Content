Calculation Notes: |
  Count each shipment_id once using its first qualifying confirmation timestamp, regardless of the number of damaged packages, items, customer contacts, claim updates, refunds, or replacements associated with that shipment. A shipment qualifies when damage is confirmed by an accepted customer claim, carrier evidence, or a completed customer remedy coded with a damage reason; customer reports are eligible when submitted within 30 calendar days after delivery or attempted delivery. Exclude unverified allegations, cosmetic packaging marks that do not affect the parcel or merchandise, loss or theft without physical damage, damage recorded before carrier handoff, canceled orders never handed to a carrier, test orders, fraudulent claims, duplicate cases, and reverse-logistics damage occurring during a customer return. If a confirmed status is later rejected or reversed, remove the shipment and restate affected reporting periods.

Business Use Case: |
  The Customer Experience executive reviews damaged shipment trends by order channel, carrier, fulfillment route, product category, and customer cohort. When a carrier-route combination exceeds the control threshold, the team can change delivery options shown at checkout, suppress a high-risk service level, improve proactive customer messaging, accelerate refunds or replacements, and measure whether those actions restore repeat conversion and retention.


Source Data: E-commerce order management and digital checkout data stitched with carrier tracking webhooks, customer self-service claims, mobile or web support journeys, CRM service cases, and billing or refund platforms


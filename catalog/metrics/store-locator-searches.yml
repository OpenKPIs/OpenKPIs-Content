Metric Name: Store Locator Searches
Formula: COUNT(search events WHERE search_type = 'store_locator' AND search_source <> 'auto_detect' AND COALESCE(is_refire, false) = false AND traffic_type <> 'internal') — identical search_term submissions within 30 seconds in the same session collapse to one

Description: |
  Counts the store locator queries shoppers submit to find a physical store (by postal code, city, address or device location), recorded through the unified search event scoped to search_type = 'store_locator' and counted once per qualifying submission. It measures local-intent demand at the top of the pickup and store-visit journey and supplies the volume base for store-selection, pickup-order and store-visit conversion analysis by market, device and entry point.

Category: Engagement

Tags: [metric, Retail: Omnichannel (BOPIS - Buy Online Pick Up In Store)]


Metric Name: Payment Info Added
Formula: COUNT(add_payment_info) — one qualifying occurrence per checkout_id (per session_id when checkout_id is absent)

Description: |
  The number of checkout interactions in which a shopper successfully submitted payment details, counted once per qualifying add_payment_info occurrence and attributed to the checkout in which it happened. It is the last shopper-supplied step before order submission, so the gap between it and completed orders isolates payment, authorization and review-page friction rather than merchandising or cart friction.

Category: Conversion

Tags: [metric, E-commerce: Cart & Checkout Funnel Analytics]

Industry: E-commerce

Priority: High

Core Area: Checkout

Scope: Event

Measure Type: Counter

Aggregation Window: Event, Session, Daily, Weekly, Monthly

GA4 Event: |
  add_payment_info

Adobe Event: |
  Checkout: Add Payment Info


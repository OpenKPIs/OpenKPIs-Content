Google Analytics SQL: |
  -- ==========================================
  -- 1. GOOGLE BIGQUERY SQL
  -- ==========================================
  -- Payment Info Added: qualifying add_payment_info events, serialized to one occurrence per checkout_id
  -- (falling back to the GA4 session when the property does not emit checkout_id, which is flagged as degraded).
  -- Event parameters are pivoted once per event with UNNEST + MAX(IF(key = ...)) so payment_type, value, currency,
  -- coupon and the checkout context can be read side by side.
  -- Exclusions: internal / QA traffic_type, staging-QA-preview-dev hostnames, agent-assisted checkouts keyed by
  -- Customer Service. Gift card, store credit and loyalty-point tenders are counted like any other payment_type.
  -- value mirrors the cart subtotal at submission and is reported as intent value only, never as recognised revenue;
  -- non-USD checkouts are converted with the finance daily booking rate.
  -- event_date is already in the reporting-property timezone; the trailing 3 days stay provisional (72h late-hit window).
  WITH raw_events AS (
    SELECT
      PARSE_DATE('%Y%m%d', e.event_date)                       AS event_date,
      e.event_timestamp                                        AS event_timestamp,
      e.user_pseudo_id                                         AS user_pseudo_id,
      COALESCE(e.device.category, '(not set)')                 AS device_category,
      LOWER(COALESCE(e.device.web_info.hostname, ''))          AS hostname,
      COALESCE(e.traffic_source.medium, '(not set)')           AS traffic_medium,
      COALESCE(e.traffic_source.source, '(not set)')           AS traffic_source,
      e.event_params                                           AS event_params,
      (SELECT COALESCE(SUM(it.quantity), 0) FROM UNNEST(e.items) AS it) AS item_units
    FROM `your-project.analytics_123456789.events_*` AS e
    WHERE _TABLE_SUFFIX BETWEEN FORMAT_DATE('%Y%m%d', DATE_SUB(CURRENT_DATE(), INTERVAL 90 DAY))
                            AND FORMAT_DATE('%Y%m%d', DATE_SUB(CURRENT_DATE(), INTERVAL 1 DAY))
      AND e.event_name = 'add_payment_info'
  ),
  pivoted AS (
    SELECT
      r.event_date,
      r.event_timestamp,
      r.user_pseudo_id,
      r.device_category,
      r.hostname,
      r.traffic_medium,
      r.traffic_source,
      r.item_units,
      MAX(IF(ep.key = 'ga_session_id', ep.value.int_value, NULL))                                           AS ga_session_id,
      MAX(IF(ep.key = 'checkout_id', ep.value.string_value, NULL))                                          AS checkout_id,
      MAX(IF(ep.key = 'checkout_step', COALESCE(ep.value.int_value, SAFE_CAST(ep.value.string_value AS INT64)), NULL)) AS checkout_step,
      LOWER(MAX(IF(ep.key = 'checkout_step_name', ep.value.string_value, NULL)))                            AS checkout_step_name,
      LOWER(MAX(IF(ep.key = 'checkout_type', ep.value.string_value, NULL)))                                 AS checkout_type,
      LOWER(MAX(IF(ep.key = 'payment_type', ep.value.string_value, NULL)))                                  AS payment_type,
      LOWER(MAX(IF(ep.key = 'shipping_tier', ep.value.string_value, NULL)))                                 AS shipping_tier,
      COALESCE(MAX(IF(ep.key = 'cart_size_band', ep.value.string_value, NULL)),
               CASE WHEN r.item_units <= 1 THEN '1 item' WHEN r.item_units <= 3 THEN '2-3 items'
                    WHEN r.item_units <= 6 THEN '4-6 items' ELSE '7+ items' END)                       AS cart_size_band,
      MAX(IF(ep.key = 'coupon', ep.value.string_value, NULL))                                               AS coupon_code,
      UPPER(MAX(IF(ep.key = 'currency', ep.value.string_value, NULL)))                                      AS currency_code,
      MAX(IF(ep.key = 'value', COALESCE(ep.value.double_value, ep.value.float_value, SAFE_CAST(ep.value.int_value AS FLOAT64)), NULL)) AS checkout_value_local,
      LOWER(MAX(IF(ep.key = 'traffic_type', ep.value.string_value, NULL)))                                  AS traffic_type,
      LOWER(MAX(IF(ep.key = 'entry_method', ep.value.string_value, NULL)))                                  AS entry_method
    FROM raw_events AS r, UNNEST(r.event_params) AS ep
    GROUP BY
      r.event_date, r.event_timestamp, r.user_pseudo_id, r.device_category,
      r.hostname, r.traffic_medium, r.traffic_source, r.item_units
  ),
  qualified AS (
    SELECT
      p.*,
      CONCAT(p.user_pseudo_id, '-', CAST(COALESCE(p.ga_session_id, 0) AS STRING))            AS session_key,
      COALESCE(p.checkout_id, CONCAT('sess:', p.user_pseudo_id, '-', CAST(COALESCE(p.ga_session_id, 0) AS STRING))) AS serialization_key,
      p.checkout_id IS NULL                                                                  AS is_degraded_serialization,
      CASE
        WHEN p.payment_type IN ('apple_pay', 'google_pay', 'paypal', 'paypal_express', 'shop_pay', 'amazon_pay', 'link') THEN 'express_wallet'
        ELSE 'classic_form'
      END                                                                                    AS payment_channel
    FROM pivoted AS p
    WHERE COALESCE(p.traffic_type, '') NOT IN ('internal', 'qa', 'test')
      AND NOT REGEXP_CONTAINS(p.hostname, r'^(staging|stage|qa|uat|preview|dev)[.-]|localhost')
      AND COALESCE(p.checkout_type, '') NOT IN ('agent_assisted', 'call_center', 'customer_service')
      AND p.payment_type IS NOT NULL
  ),
  serialized AS (
    SELECT
      q.*,
      ROW_NUMBER() OVER (PARTITION BY q.serialization_key ORDER BY q.event_timestamp) AS occurrence_rank
    FROM qualified AS q
  ),
  first_submission AS (
    SELECT * FROM serialized WHERE occurrence_rank = 1
  ),
  daily AS (
    SELECT
      f.event_date,
      f.device_category,
      f.checkout_type,
      f.payment_type,
      f.payment_channel,
      f.shipping_tier,
      f.cart_size_band,
      COUNT(*)                                                                    AS payment_info_added,
      COUNT(DISTINCT f.session_key)                                               AS sessions_with_payment_info,
      COUNT(DISTINCT f.user_pseudo_id)                                            AS users_with_payment_info,
      SUM(f.item_units)                                                           AS units_at_payment_step,
      COUNTIF(f.is_degraded_serialization)                                        AS events_missing_checkout_id,
      COUNTIF(COALESCE(f.coupon_code, '') <> '')                                  AS events_with_coupon,
      ROUND(SUM(f.checkout_value_local *
                CASE WHEN f.currency_code = 'USD' THEN 1.0 ELSE fx.rate_to_usd END), 2) AS checkout_intent_value_usd,
      COUNTIF(COALESCE(f.currency_code, '') <> 'USD' AND fx.rate_to_usd IS NULL)  AS events_missing_fx_rate
    FROM first_submission AS f
    LEFT JOIN `your-project.finance.fx_daily_rates` AS fx
      ON fx.rate_date = f.event_date
     AND UPPER(fx.currency_code) = f.currency_code
    GROUP BY
      f.event_date, f.device_category, f.checkout_type,
      f.payment_type, f.payment_channel, f.shipping_tier, f.cart_size_band
  )
  SELECT
    d.event_date,
    d.device_category,
    d.checkout_type,
    d.payment_type,
    d.payment_channel,
    d.shipping_tier,
    d.cart_size_band,
    d.payment_info_added,
    d.sessions_with_payment_info,
    d.users_with_payment_info,
    d.units_at_payment_step,
    d.checkout_intent_value_usd,
    SAFE_DIVIDE(d.checkout_intent_value_usd, d.payment_info_added)          AS avg_intent_value_usd,
    d.events_with_coupon,
    d.events_missing_checkout_id,
    SAFE_DIVIDE(d.events_missing_checkout_id, d.payment_info_added)         AS degraded_serialization_share,
    d.events_missing_fx_rate,
    d.event_date >= DATE_SUB(CURRENT_DATE(), INTERVAL 3 DAY)                AS is_provisional
  FROM daily AS d
  ORDER BY d.event_date DESC, d.payment_info_added DESC;

AEP Query Service SQL: |
  -- ==========================================
  -- 2. ADOBE AEP QUERY SERVICE SQL
  -- ==========================================
  -- Payment Info Added: qualifying commerce.checkouts ExperienceEvents that carry the payment step
  -- (commerce.order.payments populated or the payment-step success event15 set), serialized to one occurrence per
  -- checkout id (commerce.checkouts.id / eVar24), falling back to ECID + visit number when the
  -- property does not emit a checkout id - those events are flagged as degraded serialization.
  -- Exclusions: internal / QA / test traffic (tenant trafficType flag set by the internal-IP processing rule),
  -- bot and synthetic user agents, staging-QA-preview-dev hosts, and agent-assisted checkouts keyed by Customer Service.
  -- Gift card, store credit and loyalty-point tenders are counted like any other payment_type.
  -- commerce.order.payments.paymentAmount mirrors the cart subtotal at submission and is intent value only, never
  -- recognised revenue; non-USD checkouts are converted with the finance daily booking rate.
  -- Coupon code is read from eVar26; cart size band is derived from productListItems quantities.
  -- Dates use the reporting timezone; the trailing 3 days stay provisional (72h late-hit window).
  WITH base AS (
    SELECT
      to_date(from_utc_timestamp(e.timestamp, 'America/New_York'))                       AS event_date,
      e.timestamp                                                                        AS event_ts,
      COALESCE(e.endUserIDs._experience.mcid.id, e.identityMap['ECID'][0].id)             AS ecid,
      e._experience.analytics.session.num                                                AS visit_num,
      COALESCE(e.device.type, 'unknown')                                                 AS device_type,
      COALESCE(e.marketing.trackingCode, 'direct')                                       AS tracking_code,
      lower(COALESCE(element_at(e.commerce.order.payments, 1).paymentType,
                     e._experience.analytics.customDimensions.eVars.eVar21))              AS payment_type,
      lower(COALESCE(e._experience.analytics.customDimensions.eVars.eVar22, 'unknown'))   AS checkout_type,
      lower(COALESCE(e._experience.analytics.customDimensions.eVars.eVar23, 'unknown'))   AS checkout_step_name,
      COALESCE(e.commerce.checkouts.id,
               e._experience.analytics.customDimensions.eVars.eVar24)                     AS checkout_id,
      lower(COALESCE(e._experience.analytics.customDimensions.eVars.eVar25, 'unknown'))   AS shipping_tier,
      COALESCE(e._experience.analytics.customDimensions.eVars.eVar26, '')                 AS coupon_code,
      upper(COALESCE(element_at(e.commerce.order.payments, 1).currencyCode,
                     e.commerce.order.currencyCode, 'USD'))                               AS currency_code,
      CAST(COALESCE(element_at(e.commerce.order.payments, 1).paymentAmount,
                    e.commerce.order.priceTotal, 0) AS DOUBLE)                            AS checkout_value_local,
      CASE WHEN e.productListItems IS NULL THEN 0
           ELSE aggregate(e.productListItems, 0, (acc, x) -> acc + COALESCE(CAST(x.quantity AS INT), 0)) END AS item_units,
      COALESCE(e.commerce.order.payments IS NOT NULL AND size(e.commerce.order.payments) > 0, false) AS has_payment_instrument,
      COALESCE(e._experience.analytics.event1to100.event15.value, 0)                      AS payment_step_event
    FROM web_experience_events_dataset AS e
    WHERE e.timestamp >= date_sub(current_date(), 91)
      AND e.timestamp <  current_date()
      AND e.eventType = 'commerce.checkouts'
      AND COALESCE(e.commerce.checkouts.value, 0) > 0
      AND lower(COALESCE(e.web.webPageDetails.URL, '')) NOT RLIKE '^https?://(staging|stage|qa|uat|preview|dev)[.-]|localhost'
      AND lower(COALESCE(e.environment.browserDetails.userAgent, '')) NOT RLIKE 'bot|spider|crawler|headless|synthetic'
      -- internal traffic flag: replace _tenant with your tenant namespace (e.g. _acmecorp)
      AND lower(COALESCE(e._tenant.trafficType, '')) NOT IN ('internal', 'qa', 'test')
  ),
  qualified AS (
    SELECT
      b.*,
      concat(b.ecid, '-', CAST(b.visit_num AS STRING))                                   AS visit_key,
      COALESCE(b.checkout_id, concat('visit:', b.ecid, '-', CAST(b.visit_num AS STRING))) AS serialization_key,
      b.checkout_id IS NULL                                                              AS is_degraded_serialization,
      CASE
        WHEN b.payment_type IN ('apple_pay', 'google_pay', 'paypal', 'paypal_express', 'shop_pay', 'amazon_pay', 'link')
          THEN 'express_wallet'
        ELSE 'classic_form'
      END                                                                                AS payment_channel,
      CASE WHEN b.item_units <= 1 THEN '1 item' WHEN b.item_units <= 3 THEN '2-3 items'
           WHEN b.item_units <= 6 THEN '4-6 items' ELSE '7+ items' END                  AS cart_size_band
    FROM base AS b
    WHERE b.event_date >= date_sub(current_date(), 90)
      AND (b.has_payment_instrument OR b.payment_step_event > 0)
      AND b.payment_type IS NOT NULL
      AND b.checkout_type NOT IN ('agent_assisted', 'call_center', 'customer_service')
  ),
  serialized AS (
    SELECT
      q.*,
      ROW_NUMBER() OVER (PARTITION BY q.serialization_key ORDER BY q.event_ts) AS occurrence_rank
    FROM qualified AS q
  ),
  first_submission AS (
    SELECT * FROM serialized WHERE occurrence_rank = 1
  ),
  daily AS (
    SELECT
      f.event_date,
      f.device_type,
      f.checkout_type,
      f.payment_type,
      f.payment_channel,
      f.shipping_tier,
      f.cart_size_band,
      COUNT(*)                                                                      AS payment_info_added,
      COUNT(DISTINCT f.visit_key)                                                   AS visits_with_payment_info,
      COUNT(DISTINCT f.ecid)                                                        AS visitors_with_payment_info,
      SUM(f.item_units)                                                             AS units_at_payment_step,
      SUM(CASE WHEN f.is_degraded_serialization THEN 1 ELSE 0 END)                  AS events_missing_checkout_id,
      SUM(CASE WHEN f.coupon_code <> '' THEN 1 ELSE 0 END)                          AS events_with_coupon,
      ROUND(SUM(f.checkout_value_local *
                CASE WHEN f.currency_code = 'USD' THEN CAST(1.0 AS DOUBLE) ELSE fx.rate_to_usd END), 2) AS checkout_intent_value_usd,
      SUM(CASE WHEN f.currency_code <> 'USD' AND fx.rate_to_usd IS NULL THEN 1 ELSE 0 END) AS events_missing_fx_rate
    FROM first_submission AS f
    LEFT JOIN fx_daily_rates_dataset AS fx
      ON fx.rate_date = f.event_date
     AND upper(fx.currency_code) = f.currency_code
    GROUP BY
      f.event_date, f.device_type, f.checkout_type,
      f.payment_type, f.payment_channel, f.shipping_tier, f.cart_size_band
  )
  SELECT
    d.event_date,
    d.device_type,
    d.checkout_type,
    d.payment_type,
    d.payment_channel,
    d.shipping_tier,
    d.cart_size_band,
    d.payment_info_added,
    d.visits_with_payment_info,
    d.visitors_with_payment_info,
    d.units_at_payment_step,
    d.checkout_intent_value_usd,
    d.checkout_intent_value_usd / NULLIF(d.payment_info_added, 0)                   AS avg_intent_value_usd,
    d.events_with_coupon,
    d.events_missing_checkout_id,
    CAST(d.events_missing_checkout_id AS DOUBLE) / NULLIF(d.payment_info_added, 0)  AS degraded_serialization_share,
    d.events_missing_fx_rate,
    d.event_date >= date_sub(current_date(), 3)                                     AS is_provisional
  FROM daily AS d
  ORDER BY d.event_date DESC, d.payment_info_added DESC;

Calculation Notes: |
  1️⃣ Serialization: count one occurrence per checkout_id; card edits, instrument swaps and retries after a validation error collapse into the first qualifying submission so a single struggling shopper cannot inflate the step. Where checkout_id is not emitted, deduplicate on session_id and flag the property as degraded in the funnel report.,2️⃣ Qualification: the event counts only after client-side and gateway tokenization validation pass and the instrument is attached to the order draft. Field focus, partial entry, abandoned CVV entry and declined validation are excluded; validation failures may be logged for diagnostics through the standard GA4 exception event (Adobe: an error prop), but they never count toward this metric.,3️⃣ Exclusions: internal, QA and test traffic — in GA4 through the traffic_type event parameter set by the property's internal-traffic (IP) rule, in Adobe through the tenant trafficType flag set by the internal-IP processing rule; staging, QA, preview and dev hostnames on both platforms; known bots and synthetic monitors (GA4 known-bot filtering at collection, Adobe user-agent exclusion in the query); and agent-assisted orders keyed in by Customer Service. Gift card, store credit and loyalty-point tenders are legitimate payment-info submissions and are counted, broken out by payment_type.,4️⃣ Express wallets bypass the classic payment form: Apple Pay, Google Pay, PayPal Express and Shop Pay authorize inside a single sheet. Fire add_payment_info at wallet-sheet authorization with payment_type set to the wallet name; without this, wallet-heavy traffic understates the step and overstates payment-page abandonment.,5️⃣ Session-timeout handling follows the platform default — 30 minutes of inactivity in GA4, the 30-minute visit rule in Adobe. A checkout resumed after timeout opens a new session, so deduplicate on checkout_id first and session_id second to avoid double-counting a single order attempt across two sessions.,6️⃣ Timing: the metric is stamped at event time in the property's reporting timezone and reconciled against the order table on order date. Late and offline-queued hits are accepted for 72 hours, so the trailing three days are provisional and should carry a freshness note on any dashboard used for trading decisions.,7️⃣ Value and currency on the event mirror the cart subtotal at submission and must never be summed into recognised revenue; multi-market reporting converts using the daily booking rate held in the finance rate table.

Business Use Case: |
  1️⃣ The Checkout Product Manager reviews the step funnel each morning; when the Payment Info Added count for a device × payment type cell falls more than 10% below its trailing four-week same-weekday average, and the derived Begin Checkout → Payment Info Added step rate confirms the drop, they raise a P2 defect with the payments squad and hold the next checkout release until the cell recovers.,2️⃣ The Payments Manager in Finance compares Payment Info Added against completed orders by payment type every week; a widening gap isolated to one acquirer route triggers a rerouting request or a change to the 3-D Secure step-up threshold with that acquirer.,3️⃣ The Lifecycle Marketing Manager builds a recovery audience of sessions with Payment Info Added and no order within 60 minutes and sends them the highest-value abandonment journey, because these shoppers are one interaction from purchase and convert materially better than cart-stage abandoners.,4️⃣ The Conversion Optimization Lead in Merchandising reads payment-page A/B tests on this step before reading revenue, calling winners on step conversion where sample size is reached weeks earlier than on order-level significance.


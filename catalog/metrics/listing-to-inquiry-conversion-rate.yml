Google Analytics SQL: |
  -- ==========================================
  -- 1. GOOGLE BIGQUERY SQL
  -- ==========================================
  WITH raw_events AS (
    SELECT
      event_name,
      TIMESTAMP_MICROS(event_timestamp) AS collected_event_timestamp,
      user_pseudo_id AS collected_user_pseudo_id,
      p.*
    FROM `your-project.analytics_123456789.events_*` AS e
    CROSS JOIN (
      SELECT AS STRUCT
        MAX(IF(key = 'event_id', value.string_value, NULL)) AS event_id,
        MAX(IF(key = 'event_timestamp', value.string_value, NULL)) AS event_timestamp,
        MAX(IF(key = 'event_source', value.string_value, NULL)) AS event_source,
        MAX(IF(key = 'platform', value.string_value, NULL)) AS platform,
        MAX(IF(key = 'page_location', value.string_value, NULL)) AS page_location,
        MAX(IF(key = 'page_referrer', value.string_value, NULL)) AS page_referrer,
        MAX(IF(key = 'session_id', COALESCE(value.string_value, CAST(value.int_value AS STRING)), NULL)) AS session_id,
        MAX(IF(key = 'visit_unit_id', value.string_value, NULL)) AS visit_unit_id,
        MAX(IF(key = 'user_pseudo_id', value.string_value, NULL)) AS user_pseudo_id,
        MAX(IF(key = 'identity_id', value.string_value, NULL)) AS identity_id,
        MAX(IF(key = 'analytics_consent', value.string_value, NULL)) AS analytics_consent,
        MAX(IF(key = 'listing_id', value.string_value, NULL)) AS listing_id,
        MAX(IF(key = 'listing_type', value.string_value, NULL)) AS listing_type,
        MAX(IF(key = 'property_type', value.string_value, NULL)) AS property_type,
        MAX(IF(key = 'listing_status', value.string_value, NULL)) AS listing_status,
        MAX(IF(key = 'availability_status', value.string_value, NULL)) AS availability_status,
        MAX(IF(key = 'city', value.string_value, NULL)) AS city,
        MAX(IF(key = 'region', value.string_value, NULL)) AS region,
        MAX(IF(key = 'country', value.string_value, NULL)) AS country,
        MAX(IF(key = 'currency', value.string_value, NULL)) AS currency,
        MAX(IF(key = 'value', COALESCE(value.string_value, CAST(value.int_value AS STRING), CAST(value.double_value AS STRING), CAST(value.float_value AS STRING)), NULL)) AS value,
        MAX(IF(key = 'inquiry_id', value.string_value, NULL)) AS inquiry_id,
        MAX(IF(key = 'inquiry_type', value.string_value, NULL)) AS inquiry_type,
        MAX(IF(key = 'inquiry_channel', value.string_value, NULL)) AS inquiry_channel,
        MAX(IF(key = 'inquiry_status', value.string_value, NULL)) AS inquiry_status,
        MAX(IF(key = 'qualified_inquiry', COALESCE(value.string_value, CAST(value.int_value AS STRING)), NULL)) AS qualified_inquiry,
        MAX(IF(key = 'qualification_reason', value.string_value, NULL)) AS qualification_reason,
        MAX(IF(key = 'lead_id', value.string_value, NULL)) AS lead_id,
        MAX(IF(key = 'crm_source', value.string_value, NULL)) AS crm_source,
        MAX(IF(key = 'message_id', value.string_value, NULL)) AS message_id,
        MAX(IF(key = 'call_id', value.string_value, NULL)) AS call_id,
        MAX(IF(key = 'partner_id', value.string_value, NULL)) AS partner_id,
        MAX(IF(key = 'partner_event_id', value.string_value, NULL)) AS partner_event_id,
        MAX(IF(key = 'attribution_token', value.string_value, NULL)) AS attribution_token,
        MAX(IF(key = 'campaign_id', value.string_value, NULL)) AS campaign_id,
        MAX(IF(key = 'traffic_source', value.string_value, NULL)) AS traffic_source,
        MAX(IF(key = 'traffic_medium', value.string_value, NULL)) AS traffic_medium,
        MAX(IF(key = 'touchpoint_channel', value.string_value, NULL)) AS touchpoint_channel,
        MAX(IF(key = 'attribution_model', value.string_value, NULL)) AS attribution_model,
        MAX(IF(key = 'conversion_window_hours', COALESCE(value.string_value, CAST(value.int_value AS STRING)), NULL)) AS conversion_window_hours,
        MAX(IF(key = 'listing_view_timestamp', value.string_value, NULL)) AS listing_view_timestamp,
        MAX(IF(key = 'inquiry_timestamp', value.string_value, NULL)) AS inquiry_timestamp,
        MAX(IF(key = 'elapsed_seconds', COALESCE(value.string_value, CAST(value.int_value AS STRING), CAST(value.double_value AS STRING)), NULL)) AS elapsed_seconds,
        MAX(IF(key = 'eligible_visit_unit', COALESCE(value.string_value, CAST(value.int_value AS STRING)), NULL)) AS eligible_visit_unit,
        MAX(IF(key = 'eligibility_reason', value.string_value, NULL)) AS eligibility_reason,
        MAX(IF(key = 'duplicate_inquiry', COALESCE(value.string_value, CAST(value.int_value AS STRING)), NULL)) AS duplicate_inquiry,
        MAX(IF(key = 'fraud_flag', COALESCE(value.string_value, CAST(value.int_value AS STRING)), NULL)) AS fraud_flag,
        MAX(IF(key = 'bot_flag', COALESCE(value.string_value, CAST(value.int_value AS STRING)), NULL)) AS bot_flag,
        MAX(IF(key = 'schema_version', value.string_value, NULL)) AS schema_version
      FROM UNNEST(e.event_params)
    ) AS p
    WHERE _TABLE_SUFFIX BETWEEN @start_date
      AND FORMAT_DATE('%Y%m%d', DATE_ADD(PARSE_DATE('%Y%m%d', @end_date), INTERVAL 3 DAY))
      AND event_name IN ('view_item', 'generate_lead')
  ),
  normalized_events AS (
    SELECT
      * EXCEPT(event_timestamp, user_pseudo_id),
      COALESCE(SAFE_CAST(event_timestamp AS TIMESTAMP), collected_event_timestamp) AS event_ts,
      COALESCE(user_pseudo_id, collected_user_pseudo_id) AS user_pseudo_id,
      SAFE_CAST(value AS NUMERIC) AS numeric_value,
      SAFE_CAST(conversion_window_hours AS INT64) AS conversion_window_hours_value,
      SAFE_CAST(listing_view_timestamp AS TIMESTAMP) AS listing_view_ts,
      SAFE_CAST(inquiry_timestamp AS TIMESTAMP) AS inquiry_ts,
      SAFE_CAST(elapsed_seconds AS INT64) AS elapsed_seconds_value,
      LOWER(COALESCE(qualified_inquiry, 'false')) IN ('true', '1') AS is_qualified_inquiry,
      LOWER(COALESCE(eligible_visit_unit, 'false')) IN ('true', '1') AS is_eligible_visit_unit,
      LOWER(COALESCE(duplicate_inquiry, 'false')) IN ('true', '1') AS is_duplicate_inquiry,
      LOWER(COALESCE(fraud_flag, 'false')) IN ('true', '1') AS is_fraud,
      LOWER(COALESCE(bot_flag, 'false')) IN ('true', '1') AS is_bot
    FROM raw_events
  ),
  ranked_listing_views AS (
    SELECT
      n.*,
      COALESCE(listing_view_ts, event_ts) AS effective_view_ts,
      ROW_NUMBER() OVER (
        PARTITION BY visit_unit_id, listing_id
        ORDER BY COALESCE(listing_view_ts, event_ts), collected_event_timestamp, event_id
      ) AS view_rank
    FROM normalized_events AS n
    WHERE event_name = 'view_item'
      AND visit_unit_id IS NOT NULL
      AND listing_id IS NOT NULL
      AND is_eligible_visit_unit
      AND NOT is_fraud
      AND NOT is_bot
      AND DATE(COALESCE(listing_view_ts, event_ts)) BETWEEN PARSE_DATE('%Y%m%d', @start_date)
        AND PARSE_DATE('%Y%m%d', @end_date)
  ),
  eligible_listing_views AS (
    SELECT * EXCEPT(view_rank)
    FROM ranked_listing_views
    WHERE view_rank = 1
  ),
  ranked_inquiries AS (
    SELECT
      n.*,
      COALESCE(inquiry_ts, event_ts) AS effective_inquiry_ts,
      ROW_NUMBER() OVER (
        PARTITION BY inquiry_id
        ORDER BY COALESCE(inquiry_ts, event_ts), collected_event_timestamp, event_id
      ) AS inquiry_rank
    FROM normalized_events AS n
    WHERE event_name = 'generate_lead'
      AND inquiry_id IS NOT NULL
      AND visit_unit_id IS NOT NULL
      AND listing_id IS NOT NULL
      AND is_qualified_inquiry
      AND NOT is_duplicate_inquiry
      AND NOT is_fraud
      AND NOT is_bot
  ),
  valid_inquiries AS (
    SELECT * EXCEPT(inquiry_rank)
    FROM ranked_inquiries
    WHERE inquiry_rank = 1
  ),
  ranked_attribution AS (
    SELECT
      v.*,
      i.inquiry_id AS attributed_inquiry_id,
      i.effective_inquiry_ts AS attributed_inquiry_timestamp,
      i.inquiry_type AS attributed_inquiry_type,
      i.inquiry_channel AS attributed_inquiry_channel,
      i.inquiry_status AS attributed_inquiry_status,
      i.qualification_reason AS attributed_qualification_reason,
      i.lead_id AS attributed_lead_id,
      i.crm_source AS attributed_crm_source,
      i.message_id AS attributed_message_id,
      i.call_id AS attributed_call_id,
      i.partner_id AS attributed_partner_id,
      i.partner_event_id AS attributed_partner_event_id,
      i.attribution_token AS inquiry_attribution_token,
      i.touchpoint_channel AS inquiry_touchpoint_channel,
      i.attribution_model AS inquiry_attribution_model,
      i.schema_version AS inquiry_schema_version,
      ROW_NUMBER() OVER (
        PARTITION BY v.visit_unit_id, v.listing_id
        ORDER BY i.effective_inquiry_ts, i.inquiry_id
      ) AS attribution_rank
    FROM eligible_listing_views AS v
    LEFT JOIN valid_inquiries AS i
      ON i.visit_unit_id = v.visit_unit_id
     AND i.listing_id = v.listing_id
     AND i.effective_inquiry_ts >= v.effective_view_ts
     AND i.effective_inquiry_ts <= TIMESTAMP_ADD(v.effective_view_ts, INTERVAL 72 HOUR)
  ),
  attributed_visit_units AS (
    SELECT * EXCEPT(attribution_rank)
    FROM ranked_attribution
    WHERE attribution_rank = 1
  )
  SELECT
    DATE(effective_view_ts) AS listing_view_date,
    event_source,
    platform,
    listing_id,
    listing_type,
    property_type,
    listing_status,
    availability_status,
    city,
    region,
    country,
    currency,
    campaign_id,
    traffic_source,
    traffic_medium,
    touchpoint_channel,
    COUNT(*) AS eligible_listing_visit_units,
    COUNTIF(attributed_inquiry_id IS NOT NULL) AS converted_listing_visit_units,
    COUNT(DISTINCT attributed_inquiry_id) AS qualified_inquiries,
    ROUND(
      100 * SAFE_DIVIDE(COUNTIF(attributed_inquiry_id IS NOT NULL), COUNT(*)),
      4
    ) AS listing_to_inquiry_conversion_rate_pct
  FROM attributed_visit_units
  GROUP BY
    listing_view_date,
    event_source,
    platform,
    listing_id,
    listing_type,
    property_type,
    listing_status,
    availability_status,
    city,
    region,
    country,
    currency,
    campaign_id,
    traffic_source,
    traffic_medium,
    touchpoint_channel
  ORDER BY listing_view_date, listing_id;

AEP Query Service SQL: |
  -- ==========================================
  -- 2. ADOBE AEP QUERY SERVICE SQL
  -- ==========================================
  WITH normalized_events AS (
    SELECT
      COALESCE(web.webInteraction.name, eventType) AS unified_event_name,
      _listingInquiry.event_id AS event_id,
      COALESCE(CAST(_listingInquiry.event_timestamp AS TIMESTAMP), CAST(timestamp AS TIMESTAMP)) AS event_ts,
      _listingInquiry.event_source AS event_source,
      _listingInquiry.platform AS platform,
      _listingInquiry.page_location AS page_location,
      _listingInquiry.page_referrer AS page_referrer,
      _listingInquiry.session_id AS session_id,
      _listingInquiry.visit_unit_id AS visit_unit_id,
      _listingInquiry.user_pseudo_id AS user_pseudo_id,
      _listingInquiry.identity_id AS identity_id,
      _listingInquiry.analytics_consent AS analytics_consent,
      _listingInquiry.listing_id AS listing_id,
      _listingInquiry.listing_type AS listing_type,
      _listingInquiry.property_type AS property_type,
      _listingInquiry.listing_status AS listing_status,
      _listingInquiry.availability_status AS availability_status,
      _listingInquiry.city AS city,
      _listingInquiry.region AS region,
      _listingInquiry.country AS country,
      _listingInquiry.currency AS currency,
      CAST(_listingInquiry.value AS DECIMAL(38,6)) AS value,
      _listingInquiry.inquiry_id AS inquiry_id,
      _listingInquiry.inquiry_type AS inquiry_type,
      _listingInquiry.inquiry_channel AS inquiry_channel,
      _listingInquiry.inquiry_status AS inquiry_status,
      CASE WHEN LOWER(CAST(_listingInquiry.qualified_inquiry AS STRING)) IN ('true', '1') THEN TRUE ELSE FALSE END AS qualified_inquiry,
      _listingInquiry.qualification_reason AS qualification_reason,
      _listingInquiry.lead_id AS lead_id,
      _listingInquiry.crm_source AS crm_source,
      _listingInquiry.message_id AS message_id,
      _listingInquiry.call_id AS call_id,
      _listingInquiry.partner_id AS partner_id,
      _listingInquiry.partner_event_id AS partner_event_id,
      _listingInquiry.attribution_token AS attribution_token,
      _listingInquiry.campaign_id AS campaign_id,
      _listingInquiry.traffic_source AS traffic_source,
      _listingInquiry.traffic_medium AS traffic_medium,
      _listingInquiry.touchpoint_channel AS touchpoint_channel,
      _listingInquiry.attribution_model AS attribution_model,
      CAST(_listingInquiry.conversion_window_hours AS BIGINT) AS conversion_window_hours,
      CAST(_listingInquiry.listing_view_timestamp AS TIMESTAMP) AS listing_view_timestamp,
      CAST(_listingInquiry.inquiry_timestamp AS TIMESTAMP) AS inquiry_timestamp,
      CAST(_listingInquiry.elapsed_seconds AS BIGINT) AS elapsed_seconds,
      CASE WHEN LOWER(CAST(_listingInquiry.eligible_visit_unit AS STRING)) IN ('true', '1') THEN TRUE ELSE FALSE END AS eligible_visit_unit,
      _listingInquiry.eligibility_reason AS eligibility_reason,
      CASE WHEN LOWER(CAST(_listingInquiry.duplicate_inquiry AS STRING)) IN ('true', '1') THEN TRUE ELSE FALSE END AS duplicate_inquiry,
      CASE WHEN LOWER(CAST(_listingInquiry.fraud_flag AS STRING)) IN ('true', '1') THEN TRUE ELSE FALSE END AS fraud_flag,
      CASE WHEN LOWER(CAST(_listingInquiry.bot_flag AS STRING)) IN ('true', '1') THEN TRUE ELSE FALSE END AS bot_flag,
      _listingInquiry.schema_version AS schema_version
    FROM listing_inquiry_experience_events
    WHERE CAST(timestamp AS TIMESTAMP) >= CAST(:start_timestamp AS TIMESTAMP)
      AND CAST(timestamp AS TIMESTAMP) < CAST(:end_timestamp AS TIMESTAMP) + INTERVAL '72' HOUR
      AND web.webInteraction.name IN ('view_item', 'generate_lead')
  ),
  ranked_listing_views AS (
    SELECT
      n.*,
      COALESCE(listing_view_timestamp, event_ts) AS effective_view_ts,
      ROW_NUMBER() OVER (
        PARTITION BY visit_unit_id, listing_id
        ORDER BY COALESCE(listing_view_timestamp, event_ts), event_ts, event_id
      ) AS view_rank
    FROM normalized_events AS n
    WHERE unified_event_name = 'view_item'
      AND visit_unit_id IS NOT NULL
      AND listing_id IS NOT NULL
      AND eligible_visit_unit = TRUE
      AND fraud_flag = FALSE
      AND bot_flag = FALSE
      AND COALESCE(listing_view_timestamp, event_ts) >= CAST(:start_timestamp AS TIMESTAMP)
      AND COALESCE(listing_view_timestamp, event_ts) < CAST(:end_timestamp AS TIMESTAMP)
  ),
  eligible_listing_views AS (
    SELECT *
    FROM ranked_listing_views
    WHERE view_rank = 1
  ),
  ranked_inquiries AS (
    SELECT
      n.*,
      COALESCE(inquiry_timestamp, event_ts) AS effective_inquiry_ts,
      ROW_NUMBER() OVER (
        PARTITION BY inquiry_id
        ORDER BY COALESCE(inquiry_timestamp, event_ts), event_ts, event_id
      ) AS inquiry_rank
    FROM normalized_events AS n
    WHERE unified_event_name = 'generate_lead'
      AND inquiry_id IS NOT NULL
      AND visit_unit_id IS NOT NULL
      AND listing_id IS NOT NULL
      AND qualified_inquiry = TRUE
      AND duplicate_inquiry = FALSE
      AND fraud_flag = FALSE
      AND bot_flag = FALSE
  ),
  valid_inquiries AS (
    SELECT *
    FROM ranked_inquiries
    WHERE inquiry_rank = 1
  ),
  ranked_attribution AS (
    SELECT
      v.*,
      i.inquiry_id AS attributed_inquiry_id,
      i.effective_inquiry_ts AS attributed_inquiry_timestamp,
      i.inquiry_type AS attributed_inquiry_type,
      i.inquiry_channel AS attributed_inquiry_channel,
      i.inquiry_status AS attributed_inquiry_status,
      i.qualification_reason AS attributed_qualification_reason,
      i.lead_id AS attributed_lead_id,
      i.crm_source AS attributed_crm_source,
      i.message_id AS attributed_message_id,
      i.call_id AS attributed_call_id,
      i.partner_id AS attributed_partner_id,
      i.partner_event_id AS attributed_partner_event_id,
      i.attribution_token AS inquiry_attribution_token,
      i.touchpoint_channel AS inquiry_touchpoint_channel,
      i.attribution_model AS inquiry_attribution_model,
      i.schema_version AS inquiry_schema_version,
      ROW_NUMBER() OVER (
        PARTITION BY v.visit_unit_id, v.listing_id
        ORDER BY i.effective_inquiry_ts, i.inquiry_id
      ) AS attribution_rank
    FROM eligible_listing_views AS v
    LEFT JOIN valid_inquiries AS i
      ON i.visit_unit_id = v.visit_unit_id
     AND i.listing_id = v.listing_id
     AND i.effective_inquiry_ts >= v.effective_view_ts
     AND i.effective_inquiry_ts <= v.effective_view_ts + INTERVAL '72' HOUR
  ),
  attributed_visit_units AS (
    SELECT *
    FROM ranked_attribution
    WHERE attribution_rank = 1
  )
  SELECT
    CAST(effective_view_ts AS DATE) AS listing_view_date,
    event_source,
    platform,
    listing_id,
    listing_type,
    property_type,
    listing_status,
    availability_status,
    city,
    region,
    country,
    currency,
    campaign_id,
    traffic_source,
    traffic_medium,
    touchpoint_channel,
    COUNT(*) AS eligible_listing_visit_units,
    COUNT(CASE WHEN attributed_inquiry_id IS NOT NULL THEN 1 END) AS converted_listing_visit_units,
    COUNT(DISTINCT attributed_inquiry_id) AS qualified_inquiries,
    ROUND(
      100.0 * COUNT(CASE WHEN attributed_inquiry_id IS NOT NULL THEN 1 END)
        / NULLIF(COUNT(*), 0),
      4
    ) AS listing_to_inquiry_conversion_rate_pct
  FROM attributed_visit_units
  GROUP BY
    CAST(effective_view_ts AS DATE),
    event_source,
    platform,
    listing_id,
    listing_type,
    property_type,
    listing_status,
    availability_status,
    city,
    region,
    country,
    currency,
    campaign_id,
    traffic_source,
    traffic_medium,
    touchpoint_channel
  ORDER BY listing_view_date, listing_id;

Calculation Notes: |
  Assign cohorts using the eligible listing visit timestamp, not the inquiry timestamp, and revise cohort results until the full 7-day window plus a 24-hour validation period has elapsed. Use the listing-market timezone for market reporting and UTC for enterprise storage; recalculate weekly and monthly results from distinct raw listing visit units rather than averaging daily percentages. Return null when the eligible denominator is zero. Exclude deleted test listings, preview environments, employee traffic, known crawlers, synthetic monitoring, fraudulent traffic, listings that were not contactable when viewed, inquiries submitted before the qualifying visit, and inquiries invalidated as spam or failed delivery within 24 hours. A listing deactivated after an eligible view remains in the denominator, and a valid inquiry submitted before deactivation remains eligible. Channel-specific inquiry events must map to the governed qualified-inquiry status before inclusion.

Business Use Case: |
  The Product and Marketplace teams compare mature conversion rates by market, property type, price band, acquisition channel, device, listing quality tier, and contact method. If mobile conversion for rental listings falls below 90% of its eight-week benchmark while desktop remains stable, the teams inspect mobile rendering and inquiry-submit failures, prioritize remediation, and estimate recovered inquiries by applying the benchmark conversion rate to affected eligible listing visits; commercial teams can separately use low-converting, high-traffic listings to trigger content-quality or agent-response interventions.


Source Data: Digital Analytics from web and native applications, listing catalog and availability services, CRM lead records, messaging and chat platforms, call-tracking providers, fraud and bot-detection services, consented identity resolution, and partner marketplace event feeds stitched through listing_id, session identifiers, inquiry_id, and approved attribution tokens.


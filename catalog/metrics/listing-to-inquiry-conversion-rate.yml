# Metric: Listing-to-Inquiry Conversion Rate
# Generated: 2026-09-07T14:30:19.068Z
# Contributed by: devyendarm
# Last modified by: devyendarm

Metric Name: Listing-to-Inquiry Conversion Rate
Formula: 100 * COUNT(DISTINCT CASE WHEN qualified_inquiry_flag = true AND inquiry_attributed_to_listing_visit_flag = true THEN listing_visit_key END) / NULLIF(COUNT(DISTINCT CASE WHEN eligible_listing_visit_flag = true THEN listing_visit_key END), 0)

Description: |
  Measures the percentage of eligible listing-detail visit units across web, mobile app, and attributable assisted channels that generate at least one qualified inquiry for the same property within the defined conversion window. It shows how effectively listing discovery and engagement move prospective customers into a contact conversion, with each eligible visit unit credited no more than once.

Category: Conversion

Tags: [metric]

Industry: Real Estate Tech

Priority: High

Core Area: Discovery

Scope: Item

Measure Type: percentage

Aggregation Window: Time based - Daily/Weekly/Monthly, cohort-based on the eligible listing visit timestamp and finalized after the 7-day conversion window

GA4 Event: |
  generate_lead

Adobe Event: |

Metric Name: Wishlist Additions
Formula: Wishlist Additions = COUNT(events WHERE event_name = 'add_to_wishlist'); Wishlist Item Additions = SUM(ARRAY_LENGTH(items)) across the same qualifying add_to_wishlist events

Description: |
  Wishlist Additions counts the confirmed add_to_wishlist events recorded when a shopper saves a product to a wishlist, favourites or save-for-later list, reported at event grain and at item grain from the items[] array. It is the numerator of Add-to-List Rate and a leading indicator of deferred purchase intent, showing which products attract consideration but have not yet been carted.

Category: Engagement



























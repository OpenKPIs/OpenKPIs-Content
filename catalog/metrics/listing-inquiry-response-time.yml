      OR (
        r.inquiry_id IS NULL
        AND i.lead_id IS NOT NULL
        AND r.lead_id = i.lead_id
      )
    CROSS JOIN params p
    WHERE LOWER(r.routing_action) IN ('assigned', 'reassigned', 'accepted')
      AND r.assigned_at IS NOT NULL
      AND r.assigned_at >= i.inquiry_created_at
      AND r.assigned_at <= p.as_of_ts
      AND r.assigned_at < LEAST(
        COALESCE(i.next_inquiry_at, i.inquiry_created_at + INTERVAL '30' DAY),
        i.inquiry_created_at + INTERVAL '30' DAY
      )
      AND (i.inquiry_closed_at IS NULL OR r.assigned_at <= i.inquiry_closed_at)
  ),
  first_assignment AS (
    SELECT
      inquiry_id,
      agent_id,
      assigned_at,
      queue_id,
      routing_rule_id,
      routing_method
    FROM ranked_assignments
    WHERE assignment_rank = 1
  ),
  response_candidates AS (
    SELECT DISTINCT
      CAST(m.message_id AS VARCHAR) AS response_event_id,
      m.inquiry_id,
      m.lead_id,
      m.sent_at AS response_at,
      'messaging' AS response_channel,
      CAST(m.sender_id AS VARCHAR) AS response_actor_id
    FROM messaging_platform_events m
    CROSS JOIN params p
    WHERE LOWER(m.direction) = 'outbound'
      AND LOWER(m.sender_role) IN ('agent', 'broker', 'advertiser', 'property_manager')
      AND LOWER(m.delivery_status) IN ('sent', 'delivered', 'read')
      AND COALESCE(m.is_automated, FALSE) = FALSE
      AND COALESCE(m.is_internal, FALSE) = FALSE
      AND m.sent_at IS NOT NULL
      AND CAST(m.sent_at AS DATE) >= p.cutoff_date
      AND m.sent_at <= p.as_of_ts
  
    UNION ALL
  
    SELECT DISTINCT
      CAST(c.call_id AS VARCHAR) AS response_event_id,
      c.inquiry_id,
      c.lead_id,
      c.started_at AS response_at,
      'phone' AS response_channel,
      CAST(c.agent_id AS VARCHAR) AS response_actor_id
    FROM telephony_call_events c
    CROSS JOIN params p
    WHERE LOWER(c.direction) = 'outbound'
      AND LOWER(c.call_status) IN ('initiated', 'ringing', 'connected', 'completed', 'no_answer', 'voicemail')
      AND COALESCE(c.is_test, FALSE) = FALSE
      AND COALESCE(c.is_internal, FALSE) = FALSE
      AND c.started_at IS NOT NULL
      AND CAST(c.started_at AS DATE) >= p.cutoff_date
      AND c.started_at <= p.as_of_ts
  ),
  ranked_responses AS (
    SELECT
      i.inquiry_id,
      c.response_event_id,
      c.response_at,
      c.response_channel,
      c.response_actor_id,
      ROW_NUMBER() OVER (
        PARTITION BY i.inquiry_id
        ORDER BY
          c.response_at,
          c.response_channel,
          c.response_event_id,
          c.response_actor_id
      ) AS response_rank
    FROM inquiries i
    JOIN response_candidates c
      ON c.inquiry_id = i.inquiry_id
      OR (
        c.inquiry_id IS NULL
        AND i.lead_id IS NOT NULL
        AND c.lead_id = i.lead_id
      )
    WHERE c.response_at >= i.inquiry_created_at
      AND c.response_at < LEAST(
        COALESCE(i.next_inquiry_at, i.inquiry_created_at + INTERVAL '30' DAY),
        i.inquiry_created_at + INTERVAL '30' DAY
      )
      AND (i.inquiry_closed_at IS NULL OR c.response_at <= i.inquiry_closed_at)
  ),
  first_response AS (
    SELECT
      inquiry_id,
      response_event_id,
      response_at,
      response_channel,
      response_actor_id
    FROM ranked_responses
    WHERE response_rank = 1
  ),
  ranked_listings AS (
    SELECT
      listing_id,
      external_listing_id,
      listing_type,
      listing_status,
      property_type,
      market_id,
      city,
      region,
      country,
      postal_code,
      time_zone,
      brokerage_id,
      advertiser_account_id,
      ROW_NUMBER() OVER (
        PARTITION BY listing_id
        ORDER BY updated_at DESC
      ) AS listing_rank
    FROM listing_management_listings
    WHERE listing_id IS NOT NULL
  ),
  listing_dimension AS (
    SELECT
      listing_id,
      external_listing_id,
      listing_type,
      listing_status,
      property_type,
      market_id,
      city,
      region,
      country,
      postal_code,
      time_zone,
      brokerage_id,
      advertiser_account_id
    FROM ranked_listings
    WHERE listing_rank = 1
  ),
  metric_base AS (
    SELECT
      i.*,
      l.external_listing_id,
      l.listing_type,
      l.listing_status,
      l.property_type,
      l.market_id,
      l.city AS listing_city,
      l.region AS listing_region,
      l.country AS listing_country,
      l.postal_code AS listing_postal_code,
      COALESCE(l.time_zone, 'UTC') AS listing_time_zone,
      l.brokerage_id,
      l.advertiser_account_id,
      l.listing_id AS matched_listing_id,
      COALESCE(a.agent_id, i.assigned_agent_id) AS effective_assigned_agent_id,
      a.assigned_at AS assignment_at,
      a.queue_id AS routing_queue_id,
      a.routing_rule_id,
      a.routing_method,
      r.response_at AS first_response_at,
      r.response_event_id,
      r.response_channel,
      r.response_actor_id,
      CASE
        WHEN r.response_at IS NULL THEN NULL
        ELSE CAST(EXTRACT(EPOCH FROM (r.response_at - i.inquiry_created_at)) AS BIGINT)
      END AS response_time_seconds,
      CASE
        WHEN a.assigned_at IS NULL OR r.response_at IS NULL THEN NULL
        ELSE CAST(EXTRACT(EPOCH FROM (r.response_at - a.assigned_at)) AS BIGINT)
      END AS assignment_to_response_seconds,
      p.as_of_ts
    FROM inquiries i
    LEFT JOIN first_assignment a
      ON a.inquiry_id = i.inquiry_id
    LEFT JOIN first_response r
      ON r.inquiry_id = i.inquiry_id
    LEFT JOIN listing_dimension l
      ON l.listing_id = i.listing_id
    CROSS JOIN params p
  )
  SELECT
    'listing_inquiry_response_time' AS metric_name,
    'seconds' AS metric_unit,
    inquiry_id,
    lead_id,

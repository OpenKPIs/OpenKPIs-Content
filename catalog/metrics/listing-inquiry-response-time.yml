    FROM ranked_inquiries
    WHERE record_rank = 1
      AND COALESCE(is_test, FALSE) = FALSE
      AND LOWER(COALESCE(record_classification, 'valid')) NOT IN ('spam', 'duplicate', 'invalid')
  ),
  inquiries AS (
    SELECT
      d.*,
      CASE
        WHEN d.lead_id IS NULL THEN NULL
        ELSE LEAD(d.inquiry_created_at) OVER (
          PARTITION BY d.lead_id
          ORDER BY d.inquiry_created_at, d.inquiry_id
        )
      END AS next_inquiry_at,
      CASE
        WHEN d.response_sla_seconds IS NULL OR d.response_sla_seconds <= 0 THEN 86400
        ELSE d.response_sla_seconds
      END AS effective_response_sla_seconds
    FROM deduplicated_inquiries d
  ),
  ranked_assignments AS (
    SELECT
      i.inquiry_id,
      r.agent_id,

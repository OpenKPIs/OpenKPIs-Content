    response_event_id,
    response_channel,
    response_actor_id,
    response_time_seconds,
    CASE
      WHEN response_time_seconds IS NULL THEN NULL
      ELSE ROUND(CAST(response_time_seconds AS DOUBLE) / 60.0, 2)
    END AS response_time_minutes,
    CASE
      WHEN response_time_seconds IS NULL THEN NULL
      ELSE ROUND(CAST(response_time_seconds AS DOUBLE) / 3600.0, 2)
    END AS response_time_hours,
    assignment_to_response_seconds,
    CASE WHEN first_response_at IS NOT NULL THEN TRUE ELSE FALSE END AS is_responded,
    CASE
      WHEN first_response_at IS NOT NULL THEN 'responded'
      WHEN inquiry_closed_at IS NOT NULL AND inquiry_closed_at <= as_of_ts THEN 'closed_unresponded'
      WHEN EXTRACT(EPOCH FROM (as_of_ts - inquiry_created_at)) > effective_response_sla_seconds THEN 'overdue'
      ELSE 'pending'
    END AS response_status,
    effective_response_sla_seconds AS response_sla_target_seconds,
    CASE
      WHEN first_response_at IS NOT NULL THEN response_time_seconds <= effective_response_sla_seconds
      WHEN inquiry_closed_at IS NOT NULL AND inquiry_closed_at <= as_of_ts THEN FALSE
      WHEN EXTRACT(EPOCH FROM (as_of_ts - inquiry_created_at)) > effective_response_sla_seconds THEN FALSE
      ELSE NULL
    END AS response_sla_met_flag,
    submitted_during_business_hours AS inquiry_business_hours_flag,
    CAST(EXTRACT(EPOCH FROM (as_of_ts - inquiry_created_at)) AS BIGINT) AS inquiry_age_seconds,
    inquiry_closed_at,
    CASE
      WHEN inquiry_closed_at IS NOT NULL AND inquiry_closed_at < inquiry_created_at THEN 'invalid_close_before_inquiry'
      WHEN first_response_at IS NOT NULL AND response_time_seconds < 0 THEN 'invalid_negative_duration'
      WHEN assignment_to_response_seconds IS NOT NULL AND assignment_to_response_seconds < 0 THEN 'response_before_assignment'
      WHEN response_sla_seconds IS NOT NULL AND response_sla_seconds <= 0 THEN 'invalid_sla_target'
      WHEN listing_id IS NULL THEN 'missing_listing_id'
      WHEN matched_listing_id IS NULL THEN 'listing_not_found'
      WHEN effective_assigned_agent_id IS NULL THEN 'missing_assignment'
      ELSE 'valid'
    END AS data_quality_status,
    as_of_ts AS extracted_at
  FROM metric_base;

Calculation Notes: |
  Start the timer at the server-side timestamp when the platform accepts and persists the inquiry. Stop it at the earliest successfully sent or delivered human-authored email, SMS, chat, or in-app message; connected outbound call; or confirmed human voicemail from a representative authorized for the listing at that time. Exclude automated acknowledgements, chatbots, autoresponders, internal notes, delivery receipts, failed messages, unanswered or merely initiated calls, platform tests, spam, fraud, owner- or representative-generated inquiries, blocked submissions, malformed records, and duplicates. Deduplicate first by source_system and stable source inquiry ID; when unavailable, retain the earliest inquiry for the same normalized contact, listing, channel, and materially identical message within 10 minutes. Attribute responses using inquiry_id whenever available; lead-level fallback is permitted only before the lead's next inquiry and within 30 days. Calculate continuous calendar elapsed time in UTC across nights, weekends, and holidays, then assign the result to the inquiry-created date in the listing market's configured timezone. Exclude unanswered inquiries from the average without treating them as zero, do not impute timestamps, reject negative durations, and do not cap or winsorize valid durations. Flag durations above 30 days for validation and exclude them only when confirmed as attribution, integration, or backfill errors. Reopened conversations, transfers, later replies, and reassignment do not restart the timer. Business-hours response time is a separate metric.

Business Use Case: |
  Marketplace Operations compares daily response time and response-rate trends by brokerage, agent, market, listing tier, and inquiry channel. If a brokerage exceeds 120 minutes or deteriorates materially week over week, leadership can change routing rules, activate backup responders, coach agents, escalate account outreach, or reduce lead allocation, then measure the effect on viewing and transaction conversion.



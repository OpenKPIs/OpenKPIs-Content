Google Analytics SQL: |
  -- ==========================================
  -- 1. GOOGLE BIGQUERY SQL
  -- ==========================================
  SELECT user_id, AVG(TIMESTAMP_DIFF(completion_time, enrollment_time, SECOND)) AS avg_time_to_completion
  FROM (
    SELECT user_id,
           MIN(IF(event_name = 'enroll', event_timestamp, NULL)) AS enrollment_time,
           MIN(IF(event_name = 'complete_course', event_timestamp, NULL)) AS completion_time
    FROM `your-project.analytics_123456789.events_*`,
         UNNEST(event_params) AS params
    WHERE event_name IN ('enroll', 'complete_course')
    GROUP BY user_id
    HAVING completion_time IS NOT NULL
  )
  GROUP BY user_id

AEP Query Service SQL: |
  -- ==========================================
  -- 2. ADOBE AEP QUERY SERVICE SQL
  -- ==========================================
  SELECT user_id, AVG(DATEDIFF(completion_time, enrollment_time)) AS avg_time_to_completion
  FROM (
    SELECT user_id,
           MIN(CASE WHEN event_name = 'enroll' THEN event_timestamp END) AS enrollment_time,
           MIN(CASE WHEN event_name = 'complete_course' THEN event_timestamp END) AS completion_time
    FROM aep_backend_dataset,
         UNNEST(event_params) AS params
    WHERE event_name IN ('enroll', 'complete_course')
    GROUP BY user_id
    HAVING completion_time IS NOT NULL
  )
  GROUP BY user_id

Calculation Notes: |
  Exclude courses with incomplete status and filter outliers where completion time exceeds 2 standard deviations from the mean.

Business Use Case: |
  Executives can use this metric to identify courses that may need redesign or additional support resources to improve completion rates.



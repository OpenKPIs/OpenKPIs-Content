Metric Name: Average Time to Course Completion
Formula: SUM(completion_time) / COUNT(completed_courses)

Description: |
  Measures the average duration taken by learners to complete a course from enrollment to completion. This metric helps in understanding learner engagement and course effectiveness.

Category: Engagement

Tags: [metric]

Industry: EdTech & E-Learning

Priority: High

Core Area: Engagement

Scope: User

Measure Type: average

Aggregation Window: Time based - Monthly




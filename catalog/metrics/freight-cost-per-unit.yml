Metric Name: Freight Cost per Unit
Formula: SUM(total_freight_cost) / SUM(total_units_shipped)

Description: |
  Measures the average cost incurred to ship a single unit of product. It helps in understanding the efficiency of logistics operations.

Category: Efficiency

Tags: [metric]

Industry: Logistics & Supply Chain

Priority: High

Core Area: Generic

Scope: Item

Measure Type: currency

Aggregation Window: Time based - Daily







Google Analytics SQL: |
  -- ==========================================
  -- 1. GOOGLE BIGQUERY SQL
  -- ==========================================
  SELECT order_id, 
         SUM(freight_cost) / SUM(quantity) AS freight_cost_per_unit
  FROM `your-project.erp.orders`
  GROUP BY order_id

AEP Query Service SQL: |
  -- ==========================================
  -- 2. ADOBE AEP QUERY SERVICE SQL
  -- ==========================================
  SELECT order_id, 
         SUM(freight_cost) / SUM(quantity) AS freight_cost_per_unit
  FROM aep_backend_dataset.orders
  GROUP BY order_id

Calculation Notes: |
  Exclude shipments below minimum weight threshold. Consider currency conversion for international shipments.

Business Use Case: |
  Executives use this metric to identify cost-saving opportunities in shipping and negotiate better rates with carriers.


Source Data: ERP

Report Attributes: |
  ["Region","Carrier","Product Category"]


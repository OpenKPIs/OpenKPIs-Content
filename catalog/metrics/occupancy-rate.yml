Metric Name: Occupancy Rate
Formula: 100 * SUM(occupied_sellable_room_nights) / NULLIF(SUM(available_room_nights), 0)

Description: |
  Measures the percentage of available sellable room nights consumed by valid guest stays during a selected stay-date period. When connected to booking and customer data, it identifies which acquisition and engagement journeys convert into completed stays and contribute to billed revenue, retention, and customer lifetime value.

Category: Performance

Tags: [metric]

Industry: Other

Priority: High

Core Area: Monetization

Scope: Item

Measure Type: percentage

Aggregation Window: Time based - Daily/Weekly/Monthly/Yearly







Google Analytics SQL: |
  -- ==========================================
  -- 1. GOOGLE BIGQUERY SQL
  -- ==========================================
  WITH reporting_window AS (
    SELECT
      DATE_SUB(CURRENT_DATE(), INTERVAL 730 DAY) AS start_date,
      DATE_SUB(CURRENT_DATE(), INTERVAL 1 DAY) AS end_date
  ),
  property_latest AS (
    SELECT * EXCEPT (row_num)
    FROM (
      SELECT
        property_id,
        property_name,
        brand_id,
        brand_name,
        portfolio_id,
        portfolio_name,
        region_name,
        country_code,
        state_province_code,
        city_name,
        market_name,
        submarket_name,
        time_zone_name,
        property_type,
        ownership_type,
        management_type,
        chain_scale,
        currency_code,
        ROW_NUMBER() OVER (
          PARTITION BY property_id
          ORDER BY updated_at DESC, property_name DESC
        ) AS row_num
      FROM `your-project.pms.properties`
      WHERE property_id IS NOT NULL
    )
    WHERE row_num = 1
  ),
  inventory_ranked AS (
    SELECT
      DATE(i.inventory_date) AS stay_date,
      i.property_id,
      i.room_id,
      i.room_type_id,
      i.room_type_name,
      i.room_class,
      i.building_id,
      i.floor_id,
      COALESCE(
        UPPER(REGEXP_REPLACE(TRIM(i.operational_status), r'[ -]+', '_')),
        'UNKNOWN'
      ) AS operational_status,
      COALESCE(i.is_sellable, FALSE) AS is_sellable,
      ROW_NUMBER() OVER (
        PARTITION BY DATE(i.inventory_date), i.property_id, i.room_id
        ORDER BY i.updated_at DESC
      ) AS row_num
    FROM `your-project.pms.room_inventory_daily` AS i
    CROSS JOIN reporting_window AS w
    WHERE DATE(i.inventory_date) BETWEEN w.start_date AND w.end_date
      AND i.property_id IS NOT NULL
  ),
  inventory_deduplicated AS (
    SELECT * EXCEPT (row_num)
    FROM inventory_ranked
    WHERE row_num = 1
  ),
  inventory_daily AS (
    SELECT
      stay_date,
      property_id,
      room_type_id,
      MAX(room_type_name) AS room_type_name,
      MAX(room_class) AS room_class,
      building_id,
      COUNT(DISTINCT room_id) AS physical_room_nights,
      COUNT(DISTINCT IF(operational_status = 'OUT_OF_ORDER', room_id, NULL)) AS out_of_order_room_nights,
      COUNT(DISTINCT IF(operational_status = 'OUT_OF_SERVICE', room_id, NULL)) AS out_of_service_room_nights,
      COUNT(DISTINCT IF(operational_status = 'MAINTENANCE', room_id, NULL)) AS maintenance_room_nights,
      COUNT(DISTINCT IF(
        is_sellable
        AND operational_status NOT IN (
          'OUT_OF_ORDER',
          'OUT_OF_SERVICE',
          'MAINTENANCE',
          'DECOMMISSIONED'
        ),
        room_id,
        NULL
      )) AS available_room_nights,
      COUNT(DISTINCT floor_id) AS floor_count
    FROM inventory_deduplicated
    GROUP BY
      stay_date,
      property_id,
      room_type_id,
      building_id
  ),
  stay_room_nights_ranked AS (
    SELECT
      DATE(s.stay_date) AS stay_date,
      s.property_id,
      s.room_type_id,
      s.building_id,
      s.stay_room_night_id,
      s.room_id,
      COALESCE(
        UPPER(REGEXP_REPLACE(TRIM(s.room_night_status), r'[ -]+', '_')),
        'UNKNOWN'
      ) AS room_night_status,
      COALESCE(
        UPPER(REGEXP_REPLACE(TRIM(s.occupancy_type), r'[ -]+', '_')),
        'UNKNOWN'
      ) AS occupancy_type,
      COALESCE(s.is_actualized, FALSE) AS is_actualized,
      ROW_NUMBER() OVER (
        PARTITION BY s.property_id, s.stay_room_night_id
        ORDER BY s.updated_at DESC
      ) AS row_num
    FROM `your-project.pms.stay_room_nights` AS s
    CROSS JOIN reporting_window AS w
    WHERE DATE(s.stay_date) BETWEEN w.start_date AND w.end_date
      AND s.property_id IS NOT NULL
      AND s.stay_room_night_id IS NOT NULL
  ),
  stay_room_nights_deduplicated AS (
    SELECT * EXCEPT (row_num)
    FROM stay_room_nights_ranked
    WHERE row_num = 1
  ),
  occupied_daily AS (
    SELECT
      stay_date,
      property_id,
      room_type_id,
      building_id,
      COUNT(DISTINCT stay_room_night_id) AS occupied_room_nights,
      COUNT(DISTINCT IF(occupancy_type = 'PAID', stay_room_night_id, NULL)) AS paid_occupied_room_nights,
      COUNT(DISTINCT IF(occupancy_type IN ('COMPLIMENTARY', 'COMP'), stay_room_night_id, NULL)) AS complimentary_room_nights,
      COUNT(DISTINCT IF(occupancy_type = 'HOUSE_USE', stay_room_night_id, NULL)) AS house_use_room_nights,
      COUNT(DISTINCT IF(
        occupancy_type NOT IN ('PAID', 'COMPLIMENTARY', 'COMP', 'HOUSE_USE'),
        stay_room_night_id,
        NULL
      )) AS other_occupied_room_nights,
      COUNT(DISTINCT room_id) AS distinct_occupied_rooms
    FROM stay_room_nights_deduplicated
    WHERE is_actualized
      AND room_night_status IN (
        'OCCUPIED',
        'STAYED',
        'CHECKED_IN',
        'CHECKED_OUT',
        'DEPARTED'
      )
    GROUP BY
      stay_date,
      property_id,
      room_type_id,
      building_id
  ),
  metric_base AS (
    SELECT
      COALESCE(i.stay_date, o.stay_date) AS stay_date,
      COALESCE(i.property_id, o.property_id) AS property_id,
      COALESCE(i.room_type_id, o.room_type_id) AS room_type_id,
      i.room_type_name,
      i.room_class,
      COALESCE(i.building_id, o.building_id) AS building_id,
      COALESCE(i.floor_count, 0) AS floor_count,
      COALESCE(i.physical_room_nights, 0) AS physical_room_nights,
      COALESCE(i.out_of_order_room_nights, 0) AS out_of_order_room_nights,
      COALESCE(i.out_of_service_room_nights, 0) AS out_of_service_room_nights,
      COALESCE(i.maintenance_room_nights, 0) AS maintenance_room_nights,
      COALESCE(i.available_room_nights, 0) AS available_room_nights,
      COALESCE(o.occupied_room_nights, 0) AS occupied_room_nights,
      COALESCE(o.paid_occupied_room_nights, 0) AS paid_occupied_room_nights,
      COALESCE(o.complimentary_room_nights, 0) AS complimentary_room_nights,
      COALESCE(o.house_use_room_nights, 0) AS house_use_room_nights,
      COALESCE(o.other_occupied_room_nights, 0) AS other_occupied_room_nights,
      COALESCE(o.distinct_occupied_rooms, 0) AS distinct_occupied_rooms
    FROM inventory_daily AS i
    FULL OUTER JOIN occupied_daily AS o
      ON i.stay_date = o.stay_date
     AND i.property_id = o.property_id
     AND (i.room_type_id = o.room_type_id OR (i.room_type_id IS NULL AND o.room_type_id IS NULL))
     AND (i.building_id = o.building_id OR (i.building_id IS NULL AND o.building_id IS NULL))
  )
  SELECT
    b.stay_date AS metric_date,
    DATE_TRUNC(b.stay_date, WEEK(MONDAY)) AS week_start_date,
    DATE_TRUNC(b.stay_date, MONTH) AS month_start_date,
    DATE_TRUNC(b.stay_date, QUARTER) AS quarter_start_date,
    EXTRACT(YEAR FROM b.stay_date) AS calendar_year,
    EXTRACT(QUARTER FROM b.stay_date) AS calendar_quarter,
    EXTRACT(MONTH FROM b.stay_date) AS calendar_month,
    EXTRACT(ISOWEEK FROM b.stay_date) AS iso_week_number,
    FORMAT_DATE('%A', b.stay_date) AS day_of_week_name,
    EXTRACT(DAYOFWEEK FROM b.stay_date) IN (1, 7) AS is_weekend,
    b.property_id,
    p.property_name,
    p.brand_id,
    p.brand_name,
    p.portfolio_id,
    p.portfolio_name,
    p.region_name,
    p.country_code,
    p.state_province_code,
    p.city_name,
    p.market_name,
    p.submarket_name,
    p.time_zone_name,
    p.property_type,
    p.ownership_type,
    p.management_type,
    p.chain_scale,
    p.currency_code,
    b.room_type_id,
    COALESCE(b.room_type_name, 'Unknown') AS room_type_name,
    COALESCE(b.room_class, 'Unknown') AS room_class,
    COALESCE(b.building_id, 'Unknown') AS building_id,
    b.floor_count,
    b.physical_room_nights,
    b.out_of_order_room_nights,
    b.out_of_service_room_nights,
    b.maintenance_room_nights,
    b.available_room_nights,
    b.occupied_room_nights,
    b.paid_occupied_room_nights,
    b.complimentary_room_nights,
    b.house_use_room_nights,
    b.other_occupied_room_nights,
    b.distinct_occupied_rooms,
    GREATEST(b.physical_room_nights - b.available_room_nights, 0) AS unavailable_room_nights,
    GREATEST(b.available_room_nights - b.occupied_room_nights, 0) AS vacant_available_room_nights,
    GREATEST(b.occupied_room_nights - b.available_room_nights, 0) AS oversold_room_nights,
    SAFE_DIVIDE(b.occupied_room_nights, b.available_room_nights) AS occupancy_rate,
    ROUND(100 * SAFE_DIVIDE(b.occupied_room_nights, b.available_room_nights), 2) AS occupancy_rate_percent,
    SAFE_DIVIDE(b.paid_occupied_room_nights, b.available_room_nights) AS paid_occupancy_rate,
    ROUND(100 * SAFE_DIVIDE(b.paid_occupied_room_nights, b.available_room_nights), 2) AS paid_occupancy_rate_percent,
    CASE
      WHEN b.available_room_nights = 0 AND b.occupied_room_nights > 0
        THEN 'OCCUPANCY_WITHOUT_AVAILABLE_INVENTORY'
      WHEN b.physical_room_nights = 0
        THEN 'MISSING_PHYSICAL_INVENTORY'
      WHEN b.available_room_nights > b.physical_room_nights
        THEN 'AVAILABLE_EXCEEDS_PHYSICAL_INVENTORY'
      WHEN b.occupied_room_nights > b.available_room_nights
        THEN 'OCCUPIED_EXCEEDS_AVAILABLE'
      ELSE 'VALID'
    END AS metric_quality_status,
    'actualized occupied room nights / available sellable room nights' AS metric_definition,
    'property-room_type-building-day' AS metric_grain,
    'PMS' AS source_system,
    CURRENT_TIMESTAMP() AS calculated_at
  FROM metric_base AS b
  LEFT JOIN property_latest AS p
    ON b.property_id = p.property_id;


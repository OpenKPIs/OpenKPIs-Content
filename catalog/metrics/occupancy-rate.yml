  WITH reporting_window AS (
    SELECT
      CAST(CURRENT_DATE - INTERVAL '730' DAY AS DATE) AS start_date,
      CAST(CURRENT_DATE - INTERVAL '1' DAY AS DATE) AS end_date
  ),
  property_ranked AS (
    SELECT
      property_id,
      property_name,
      brand_id,
      brand_name,
      portfolio_id,
      portfolio_name,
      region_name,
      country_code,
      state_province_code,
      city_name,
      market_name,
      submarket_name,
      time_zone_name,
      property_type,
      ownership_type,
      management_type,
      chain_scale,
      currency_code,
      ROW_NUMBER() OVER (
        PARTITION BY property_id
        ORDER BY updated_at DESC, property_name DESC
      ) AS row_num
    FROM pms_properties
    WHERE property_id IS NOT NULL
  ),
  property_latest AS (
    SELECT
      property_id,
      property_name,
      brand_id,
      brand_name,
      portfolio_id,
      portfolio_name,
      region_name,
      country_code,
      state_province_code,
      city_name,
      market_name,
      submarket_name,
      time_zone_name,
      property_type,
      ownership_type,
      management_type,
      chain_scale,
      currency_code
    FROM property_ranked
    WHERE row_num = 1
  ),
  inventory_ranked AS (
    SELECT
      CAST(i.inventory_date AS DATE) AS stay_date,
      i.property_id,
      i.room_id,
      i.room_type_id,
      i.room_type_name,
      i.room_class,
      i.building_id,
      i.floor_id,
      COALESCE(
        UPPER(REGEXP_REPLACE(TRIM(i.operational_status), '[ -]+', '_')),
        'UNKNOWN'
      ) AS operational_status,
      COALESCE(i.is_sellable, false) AS is_sellable,
      ROW_NUMBER() OVER (
        PARTITION BY CAST(i.inventory_date AS DATE), i.property_id, i.room_id
        ORDER BY i.updated_at DESC
      ) AS row_num
    FROM pms_room_inventory_daily AS i
    CROSS JOIN reporting_window AS w
    WHERE CAST(i.inventory_date AS DATE) BETWEEN w.start_date AND w.end_date
      AND i.property_id IS NOT NULL
  ),
  inventory_deduplicated AS (
    SELECT
      stay_date,
      property_id,
      room_id,
      room_type_id,
      room_type_name,
      room_class,
      building_id,
      floor_id,
      operational_status,
      is_sellable
    FROM inventory_ranked
    WHERE row_num = 1
  ),
  inventory_daily AS (
    SELECT
      stay_date,
      property_id,
      room_type_id,
      MAX(room_type_name) AS room_type_name,
      MAX(room_class) AS room_class,
      building_id,
      COUNT(DISTINCT room_id) AS physical_room_nights,
      COUNT(DISTINCT CASE WHEN operational_status = 'OUT_OF_ORDER' THEN room_id END) AS out_of_order_room_nights,
      COUNT(DISTINCT CASE WHEN operational_status = 'OUT_OF_SERVICE' THEN room_id END) AS out_of_service_room_nights,
      COUNT(DISTINCT CASE WHEN operational_status = 'MAINTENANCE' THEN room_id END) AS maintenance_room_nights,
      COUNT(DISTINCT CASE
        WHEN is_sellable = true
         AND operational_status NOT IN (
           'OUT_OF_ORDER',
           'OUT_OF_SERVICE',
           'MAINTENANCE',
           'DECOMMISSIONED'
         )
        THEN room_id
      END) AS available_room_nights,
      COUNT(DISTINCT floor_id) AS floor_count
    FROM inventory_deduplicated
    GROUP BY
      stay_date,
      property_id,
      room_type_id,
      building_id
  ),
  stay_room_nights_ranked AS (
    SELECT
      CAST(s.stay_date AS DATE) AS stay_date,
      s.property_id,
      s.room_type_id,
      s.building_id,
      s.stay_room_night_id,
      s.room_id,
      COALESCE(
        UPPER(REGEXP_REPLACE(TRIM(s.room_night_status), '[ -]+', '_')),
        'UNKNOWN'
      ) AS room_night_status,
      COALESCE(
        UPPER(REGEXP_REPLACE(TRIM(s.occupancy_type), '[ -]+', '_')),
        'UNKNOWN'
      ) AS occupancy_type,
      COALESCE(s.is_actualized, false) AS is_actualized,
      ROW_NUMBER() OVER (
        PARTITION BY s.property_id, s.stay_room_night_id
        ORDER BY s.updated_at DESC
      ) AS row_num
    FROM pms_stay_room_nights AS s
    CROSS JOIN reporting_window AS w
    WHERE CAST(s.stay_date AS DATE) BETWEEN w.start_date AND w.end_date
      AND s.property_id IS NOT NULL
      AND s.stay_room_night_id IS NOT NULL
  ),
  stay_room_nights_deduplicated AS (
    SELECT
      stay_date,
      property_id,
      room_type_id,
      building_id,
      stay_room_night_id,
      room_id,
      room_night_status,
      occupancy_type,
      is_actualized
    FROM stay_room_nights_ranked
    WHERE row_num = 1
  ),
  occupied_daily AS (
    SELECT
      stay_date,
      property_id,
      room_type_id,
      building_id,
      COUNT(DISTINCT stay_room_night_id) AS occupied_room_nights,
      COUNT(DISTINCT CASE WHEN occupancy_type = 'PAID' THEN stay_room_night_id END) AS paid_occupied_room_nights,
      COUNT(DISTINCT CASE WHEN occupancy_type IN ('COMPLIMENTARY', 'COMP') THEN stay_room_night_id END) AS complimentary_room_nights,
      COUNT(DISTINCT CASE WHEN occupancy_type = 'HOUSE_USE' THEN stay_room_night_id END) AS house_use_room_nights,
      COUNT(DISTINCT CASE
        WHEN occupancy_type NOT IN ('PAID', 'COMPLIMENTARY', 'COMP', 'HOUSE_USE')
        THEN stay_room_night_id
      END) AS other_occupied_room_nights,
      COUNT(DISTINCT room_id) AS distinct_occupied_rooms
    FROM stay_room_nights_deduplicated
    WHERE is_actualized = true
      AND room_night_status IN (
        'OCCUPIED',
        'STAYED',
        'CHECKED_IN',
        'CHECKED_OUT',
        'DEPARTED'
      )
    GROUP BY
      stay_date,
      property_id,
      room_type_id,
      building_id
  ),
  metric_base AS (
    SELECT
      COALESCE(i.stay_date, o.stay_date) AS stay_date,
      COALESCE(i.property_id, o.property_id) AS property_id,
      COALESCE(i.room_type_id, o.room_type_id) AS room_type_id,
      i.room_type_name,
      i.room_class,
      COALESCE(i.building_id, o.building_id) AS building_id,
      COALESCE(i.floor_count, 0) AS floor_count,
      COALESCE(i.physical_room_nights, 0) AS physical_room_nights,
      COALESCE(i.out_of_order_room_nights, 0) AS out_of_order_room_nights,
      COALESCE(i.out_of_service_room_nights, 0) AS out_of_service_room_nights,
      COALESCE(i.maintenance_room_nights, 0) AS maintenance_room_nights,
      COALESCE(i.available_room_nights, 0) AS available_room_nights,
      COALESCE(o.occupied_room_nights, 0) AS occupied_room_nights,
      COALESCE(o.paid_occupied_room_nights, 0) AS paid_occupied_room_nights,
      COALESCE(o.complimentary_room_nights, 0) AS complimentary_room_nights,
      COALESCE(o.house_use_room_nights, 0) AS house_use_room_nights,
      COALESCE(o.other_occupied_room_nights, 0) AS other_occupied_room_nights,
      COALESCE(o.distinct_occupied_rooms, 0) AS distinct_occupied_rooms
    FROM inventory_daily AS i
    FULL OUTER JOIN occupied_daily AS o
      ON i.stay_date = o.stay_date
     AND i.property_id = o.property_id
     AND (i.room_type_id = o.room_type_id OR (i.room_type_id IS NULL AND o.room_type_id IS NULL))
     AND (i.building_id = o.building_id OR (i.building_id IS NULL AND o.building_id IS NULL))
  )
  SELECT
    b.stay_date AS metric_date,
    CAST(DATE_TRUNC('week', b.stay_date) AS DATE) AS week_start_date,
    CAST(DATE_TRUNC('month', b.stay_date) AS DATE) AS month_start_date,
    CAST(DATE_TRUNC('quarter', b.stay_date) AS DATE) AS quarter_start_date,
    EXTRACT(YEAR FROM b.stay_date) AS calendar_year,
    EXTRACT(QUARTER FROM b.stay_date) AS calendar_quarter,
    EXTRACT(MONTH FROM b.stay_date) AS calendar_month,
    EXTRACT(WEEK FROM b.stay_date) AS iso_week_number,
    TRIM(TO_CHAR(b.stay_date, 'Day')) AS day_of_week_name,
    CASE
      WHEN EXTRACT(DOW FROM b.stay_date) IN (0, 6) THEN true
      ELSE false
    END AS is_weekend,
    b.property_id,
    p.property_name,
    p.brand_id,
    p.brand_name,
    p.portfolio_id,
    p.portfolio_name,
    p.region_name,
    p.country_code,
    p.state_province_code,
    p.city_name,
    p.market_name,
    p.submarket_name,
    p.time_zone_name,
    p.property_type,
    p.ownership_type,
    p.management_type,
    p.chain_scale,
    p.currency_code,
    b.room_type_id,
    COALESCE(b.room_type_name, 'Unknown') AS room_type_name,
    COALESCE(b.room_class, 'Unknown') AS room_class,
    COALESCE(b.building_id, 'Unknown') AS building_id,
    b.floor_count,
    b.physical_room_nights,
    b.out_of_order_room_nights,
    b.out_of_service_room_nights,
    b.maintenance_room_nights,
    b.available_room_nights,
    b.occupied_room_nights,
    b.paid_occupied_room_nights,
    b.complimentary_room_nights,
    b.house_use_room_nights,
    b.other_occupied_room_nights,
    b.distinct_occupied_rooms,
    GREATEST(b.physical_room_nights - b.available_room_nights, 0) AS unavailable_room_nights,
    GREATEST(b.available_room_nights - b.occupied_room_nights, 0) AS vacant_available_room_nights,
    GREATEST(b.occupied_room_nights - b.available_room_nights, 0) AS oversold_room_nights,
    CAST(b.occupied_room_nights AS DECIMAL(38,10))
      / NULLIF(CAST(b.available_room_nights AS DECIMAL(38,10)), 0) AS occupancy_rate,
    ROUND(
      CAST(100 AS DECIMAL(38,10)) * CAST(b.occupied_room_nights AS DECIMAL(38,10))
        / NULLIF(CAST(b.available_room_nights AS DECIMAL(38,10)), 0),
      2
    ) AS occupancy_rate_percent,
    CAST(b.paid_occupied_room_nights AS DECIMAL(38,10))
      / NULLIF(CAST(b.available_room_nights AS DECIMAL(38,10)), 0) AS paid_occupancy_rate,
    ROUND(
      CAST(100 AS DECIMAL(38,10)) * CAST(b.paid_occupied_room_nights AS DECIMAL(38,10))
        / NULLIF(CAST(b.available_room_nights AS DECIMAL(38,10)), 0),
      2
    ) AS paid_occupancy_rate_percent,
    CASE
      WHEN b.available_room_nights = 0 AND b.occupied_room_nights > 0
        THEN 'OCCUPANCY_WITHOUT_AVAILABLE_INVENTORY'
      WHEN b.physical_room_nights = 0
        THEN 'MISSING_PHYSICAL_INVENTORY'
      WHEN b.available_room_nights > b.physical_room_nights
        THEN 'AVAILABLE_EXCEEDS_PHYSICAL_INVENTORY'
      WHEN b.occupied_room_nights > b.available_room_nights
        THEN 'OCCUPIED_EXCEEDS_AVAILABLE'
      ELSE 'VALID'
    END AS metric_quality_status,
    'actualized occupied room nights / available sellable room nights' AS metric_definition,
    'property-room_type-building-day' AS metric_grain,
    'PMS' AS source_system,
    CURRENT_TIMESTAMP AS calculated_at
  FROM metric_base AS b
  LEFT JOIN property_latest AS p
    ON b.property_id = p.property_id;

Calculation Notes: |
  1️⃣ Assign inventory and consumed stays to the local night-audit business date.  
  2️⃣ Count one occupied sellable room night for each valid checked-in or completed stay.  
  3️⃣ Exclude cancellations, no-shows, and unconsumed allotments from counts.  
  4️⃣ Calculate available room nights as active inventory minus non-sellable rooms.  
  5️⃣ Deduplicate room moves and merged reservations to one consumed unit per date.  
  6️⃣ Include day-use stays only if they block overnight inventory per policy.  
  7️⃣ Return null if available room nights are zero and flag occupancy above 100%.

Business Use Case: |
  A revenue-management executive compares occupancy contribution, average daily rate, billed room revenue, distribution cost, and repeat-guest value across direct web, mobile app, call center, OTA, GDS, and walk-in journeys. If OTA occupancy contribution is rising while direct conversion, net revenue, and returning-guest value are below forecast, the team can adjust direct-channel availability, pricing, loyalty offers, campaign targeting, and booking-funnel experiences, then measure whether those changes generate incremental completed stays and profitable retention.



      _mortgage.applicationStart.application_status AS application_status,
      _mortgage.applicationStart.workflow_name AS workflow_name,
      _mortgage.applicationStart.workflow_step AS workflow_step,
      _mortgage.applicationStart.start_indicator AS start_indicator,
      _mortgage.applicationStart.first_qualifying_start AS first_qualifying_start,
      COALESCE(
        _mortgage.applicationStart.deduplication_key,
        CONCAT(_mortgage.applicationStart.application_id, ':begin_checkout')
      ) AS deduplication_key,
      _mortgage.applicationStart.correlation_id AS correlation_id,
      _mortgage.applicationStart.session_id AS session_id,
      _mortgage.applicationStart.user_pseudo_id AS user_pseudo_id,
      _mortgage.applicationStart.authenticated_state AS authenticated_state,
      _mortgage.applicationStart.channel AS channel,
      _mortgage.applicationStart.source_system AS source_system,
      _mortgage.applicationStart.event_source AS event_source,
      COALESCE(_mortgage.applicationStart.page_location, web.webPageDetails.URL) AS page_location,
      COALESCE(_mortgage.applicationStart.page_referrer, web.webReferrer.URL) AS page_referrer,
      COALESCE(_mortgage.applicationStart.page_title, web.webPageDetails.name) AS page_title,
      _mortgage.applicationStart.page_type AS page_type,
      _mortgage.applicationStart.site_name AS site_name,
      COALESCE(_mortgage.applicationStart.site_section, web.webPageDetails.siteSection) AS site_section,
      _mortgage.applicationStart.language AS language,
      _mortgage.applicationStart.country AS country,
      _mortgage.applicationStart.region AS region,
      _mortgage.applicationStart.currency AS currency,
      _mortgage.applicationStart.mortgage_purpose AS mortgage_purpose,
      _mortgage.applicationStart.occupancy_type AS occupancy_type,
      _mortgage.applicationStart.property_type AS property_type,
      _mortgage.applicationStart.loan_type AS loan_type,
      _mortgage.applicationStart.interest_rate_type AS interest_rate_type,
      _mortgage.applicationStart.application_method AS application_method,
      _mortgage.applicationStart.partner_channel AS partner_channel,
      _mortgage.applicationStart.campaign_id AS campaign_id,
      _mortgage.applicationStart.campaign_source AS campaign_source,
      _mortgage.applicationStart.campaign_medium AS campaign_medium,
      _mortgage.applicationStart.campaign_name AS campaign_name,
      COALESCE(_mortgage.applicationStart.device_category, environment.type) AS device_category,
      COALESCE(_mortgage.applicationStart.browser, environment.browserDetails.name) AS browser,
      COALESCE(_mortgage.applicationStart.operating_system, environment.operatingSystem) AS operating_system,
      _mortgage.applicationStart.consent_analytics AS consent_analytics,
      _mortgage.applicationStart.consent_personalization AS consent_personalization,
      _mortgage.applicationStart.processing_status AS processing_status,
      CAST(_mortgage.applicationStart.acceptance_timestamp AS TIMESTAMP) AS acceptance_timestamp,
      COALESCE(
        CAST(_mortgage.applicationStart.reporting_period_date AS DATE),
        CAST(COALESCE(_mortgage.applicationStart.event_timestamp, timestamp) AS DATE)
      ) AS reporting_period_date
    FROM aep_mortgage_web_events
    WHERE timestamp >= CAST(CURRENT_DATE - INTERVAL '1 day' AS TIMESTAMP)
      AND timestamp < CAST(CURRENT_DATE AS TIMESTAMP)
      AND eventType = 'commerce.checkouts'
      AND COALESCE(_mortgage.applicationStart.event_name, web.webInteraction.name) = 'begin_checkout'
  ),

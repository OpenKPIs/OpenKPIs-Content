  WITH event_parameters AS (
    SELECT
      event_date,
      event_timestamp AS ga_event_timestamp,
      event_name AS ga_event_name,
      user_pseudo_id AS ga_user_pseudo_id,
      device,
      traffic_source,
      MAX(IF(ep.key = 'event_id', ep.value.string_value, NULL)) AS event_id,
      MAX(IF(ep.key = 'event_version', ep.value.string_value, NULL)) AS event_version,
      MAX(IF(ep.key = 'event_timestamp', ep.value.string_value, NULL)) AS event_timestamp_raw,
      MAX(IF(ep.key = 'application_id', ep.value.string_value, NULL)) AS application_id,

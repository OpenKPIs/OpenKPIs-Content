    application_type,
    application_stage,
    application_status,
    workflow_name,
    workflow_step,
    start_indicator,
    first_qualifying_start,
    deduplication_key,
    correlation_id,
    session_id,
    user_pseudo_id,
    authenticated_state,
    channel,
    source_system,
    event_source,
    page_location,
    page_referrer,
    page_title,
    page_type,
    site_name,
    site_section,
    language,
    country,
    region,
    currency,
    mortgage_purpose,
    occupancy_type,
    property_type,
    loan_type,
    interest_rate_type,
    application_method,
    partner_channel,
    campaign_id,
    campaign_source,
    campaign_medium,
    campaign_name,
    device_category,

  -- ==========================================
  WITH typed_events AS (
    SELECT
      COALESCE(_mortgage.applicationStart.event_id, _id) AS event_id,
      COALESCE(_mortgage.applicationStart.event_name, web.webInteraction.name) AS event_name,

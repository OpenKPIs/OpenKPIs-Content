        PARTITION BY application_id
        ORDER BY event_timestamp, acceptance_timestamp, event_id
      ) AS application_start_row_number
    FROM typed_events
    WHERE application_id IS NOT NULL
      AND application_type = 'mortgage'
      AND application_stage = 'application_start'
      AND application_status = 'started'
      AND workflow_name = 'formal_mortgage_application'
      AND start_indicator = 1
      AND first_qualifying_start = TRUE
      AND processing_status = 'accepted'
  )
  SELECT

Metric Name: Mortgage Application Start Count
Formula: COUNT(DISTINCT application_start_id) WHERE event_name = 'mortgage_application_started' AND event_status = 'accepted' AND environment = 'production' AND is_test = false AND is_bot = false

Description: |
  Counts unique mortgage applications for which an applicant initiates the formal mortgage application workflow during the reporting period. A start is recorded once per application when the first qualifying application-start event is accepted, regardless of whether the application is subsequently completed, submitted, approved, withdrawn, or abandoned.

Category: Conversion

Tags: [metric]

Industry: Real Estate Tech

Priority: High

Core Area: Onboarding

Scope: Event

Measure Type: count

Aggregation Window: Time based - Hourly/Daily/Weekly/Monthly/Yearly


      COALESCE(campaign_name, traffic_source.name) AS campaign_name,
      COALESCE(parameter_device_category, device.category) AS device_category,
      COALESCE(parameter_browser, device.web_info.browser) AS browser,
      COALESCE(parameter_operating_system, device.operating_system) AS operating_system,
      consent_analytics,
      consent_personalization,
      processing_status,
      SAFE_CAST(acceptance_timestamp_raw AS TIMESTAMP) AS acceptance_timestamp,
      COALESCE(
        SAFE_CAST(reporting_period_date_raw AS DATE),
        SAFE.PARSE_DATE('%Y%m%d', event_date),
        DATE(TIMESTAMP_MICROS(ga_event_timestamp))
      ) AS reporting_period_date
    FROM event_parameters
  ),
  deduplicated_starts AS (
    SELECT *
    FROM typed_events
    WHERE application_id IS NOT NULL
      AND application_type = 'mortgage'
      AND application_stage = 'application_start'

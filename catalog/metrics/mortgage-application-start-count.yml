    operating_system,
    consent_analytics,
    consent_personalization,
    processing_status,
    acceptance_timestamp,
    reporting_period_date,
    CAST(1 AS BIGINT) AS mortgage_application_start_count
  FROM deduplicated_starts
  WHERE application_start_row_number = 1;

Calculation Notes: |
  The metric counts application instances, not people, sessions, page views, button clicks, or event rows. One person may contribute multiple starts only when each start represents a separately persisted mortgage application with a different application_start_id; restarting, resuming, or editing the same application does not create another count. A joint application counts once even when it has multiple applicants or co-borrowers. Cross-device activity must be reconciled through application_start_id rather than cookie, session, or user identifiers. Starts remain counted if the application is later abandoned, withdrawn, denied, duplicated operationally, or funded, unless governance review determines that the original start record was invalid. Daily values remain provisional for 72 hours to incorporate delayed server events, identity reconciliation, bot filtering, and source corrections. The metric is additive across non-overlapping time periods when application_start_id is globally unique, but totals across overlapping dimension values must not be summed.

Business Use Case: |
  The Mortgage Product leadership team reviews starts by acquisition channel, property market, device, loan purpose, and funnel entry point each week. If qualified traffic remains stable but starts decline for mobile refinance applicants, the team compares start errors, page performance, eligibility outcomes, and experiment exposure, then prioritizes remediation of the affected entry flow and measures recovery through start-to-submission conversion.



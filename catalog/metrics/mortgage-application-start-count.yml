      MAX(IF(ep.key = 'workflow_name', ep.value.string_value, NULL)) AS workflow_name,
      MAX(IF(ep.key = 'workflow_step', COALESCE(ep.value.string_value, CAST(ep.value.int_value AS STRING)), NULL)) AS workflow_step,
      MAX(IF(ep.key = 'start_indicator', COALESCE(ep.value.int_value, SAFE_CAST(ep.value.string_value AS INT64)), NULL)) AS start_indicator,

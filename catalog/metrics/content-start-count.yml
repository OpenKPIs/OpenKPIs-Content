# Metric: Content Start Count
# Generated: 2026-09-03T16:30:19.060Z
# Contributed by: devyendarm
# Last modified by: devyendarm

Metric Name: Content Start Count
Formula: COUNT(DISTINCT CASE WHEN event_name = 'playback_start' AND playback_status = 'playing' AND media_time_advanced = TRUE AND is_eligible_content = TRUE AND is_ad = FALSE AND is_preview = FALSE THEN playback_start_id END)

Description: |
  Counts valid instances in which eligible video or audio content begins playback and the player confirms that media time has started advancing. Each distinct playback start is counted once, including user-initiated and autoplay starts, while playback attempts, ad starts, previews, pause resumes, and duplicate telemetry are excluded.

Category: Engagement

Tags: [metric]

Industry: Media & Streaming

Priority: High

Core Area: Engagement

Scope: Event

Measure Type: count

Aggregation Window: Time based - Hourly/Daily/Monthly/Yearly


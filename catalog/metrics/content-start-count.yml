AEP Query Service SQL: |
  -- ==========================================
  -- 2. ADOBE AEP QUERY SERVICE SQL
  -- ==========================================
  WITH extracted AS (
    SELECT
      CAST(timestamp AS DATE) AS event_date,
      timestamp AS event_timestamp,
      eventType AS event_name,
      _id AS event_id,
      CAST(NULL AS BIGINT) AS event_sequence,
      CAST(NULL AS VARCHAR) AS schema_version,
      mediaCollection.sessionDetails.contentID AS content_id,
      mediaCollection.sessionDetails.friendlyName AS content_title,
      mediaCollection.sessionDetails.contentType AS content_type,
      CAST(NULL AS VARCHAR) AS content_format,
      mediaCollection.sessionDetails.genre AS content_category,
      mediaCollection.sessionDetails.show AS content_series,
      mediaCollection.sessionDetails.season AS content_season,
      mediaCollection.sessionDetails.episode AS content_episode,
      CAST(mediaCollection.sessionDetails.length AS DOUBLE PRECISION) AS content_duration,
      CAST(NULL AS VARCHAR) AS content_url,
      CAST(NULL AS VARCHAR) AS content_language,
      mediaCollection.sessionDetails.channel AS content_provider,
      mediaCollection.sessionDetails.originator AS content_owner,
      CAST(NULL AS VARCHAR) AS content_asset_type,
      CAST(NULL AS VARCHAR) AS player_id,
      mediaCollection.sessionDetails.playerName AS player_name,
      implementationDetails.version AS player_version,
      implementationDetails.environment AS player_type,
      CAST(NULL AS VARCHAR) AS playback_start_type,
      CAST(FALSE AS BOOLEAN) AS autoplay,
      CAST(FALSE AS BOOLEAN) AS muted,
      CAST(FALSE AS BOOLEAN) AS fullscreen,
      mediaCollection.sessionDetails.streamType AS stream_type,
      mediaCollection.sessionDetails.feed AS delivery_type,
      CAST(mediaCollection.playhead AS DOUBLE PRECISION) AS playhead,
      CAST(0 AS DOUBLE PRECISION) AS media_time_previous,
      CAST(mediaCollection.playhead AS DOUBLE PRECISION) AS media_time_current,
      CAST(TRUE AS BOOLEAN) AS media_time_advanced,
      CAST(mediaCollection.playhead AS DOUBLE PRECISION) AS advancement_delta,
      CAST(FALSE AS BOOLEAN) AS playback_attempt,
      CAST(FALSE AS BOOLEAN) AS is_ad,
      CAST(FALSE AS BOOLEAN) AS is_preview,
      CAST(FALSE AS BOOLEAN) AS is_resume,
      CAST(TRUE AS BOOLEAN) AS valid_start,
      COALESCE(mediaCollection.sessionID, eventMergeId) AS playback_session_id,
      CAST(NULL AS VARCHAR) AS analytics_session_id,
      web.webPageDetails.URL AS page_location,
      web.webReferrer.URL AS page_referrer,
      web.webPageDetails.name AS page_title,
      CAST(NULL AS VARCHAR) AS user_id,
      identityMap['ECID'][0].id AS anonymous_id,
      CAST(NULL AS VARCHAR) AS analytics_storage,
      environment.type AS platform
    FROM aep_media_events
    WHERE eventType = 'media.sessionStart'
  ),
  deduplicated AS (
    SELECT
      extracted.*,
      ROW_NUMBER() OVER (
        PARTITION BY COALESCE(
          event_id,
          CONCAT(
            COALESCE(anonymous_id, ''), '|',
            COALESCE(CAST(event_timestamp AS VARCHAR), ''), '|',
            COALESCE(playback_session_id, ''), '|',
            COALESCE(content_id, '')
          )
        )
        ORDER BY event_timestamp
      ) AS duplicate_sequence
    FROM extracted
    WHERE valid_start = TRUE
      AND is_ad = FALSE
      AND is_preview = FALSE
      AND playback_attempt = FALSE
      AND media_time_advanced = TRUE
      AND COALESCE(media_time_current, 0) > COALESCE(media_time_previous, 0)
  )
  SELECT
    event_date,
    event_timestamp,
    event_name,
    event_id,
    event_sequence,
    schema_version,
    content_id,
    content_title,
    content_type,
    content_format,
    content_category,
    content_series,
    content_season,
    content_episode,
    content_duration,
    content_url,
    content_language,
    content_provider,
    content_owner,
    content_asset_type,
    player_id,
    player_name,
    player_version,
    player_type,
    playback_start_type,
    autoplay,
    muted,
    fullscreen,
    stream_type,
    delivery_type,
    playhead,
    media_time_previous,
    media_time_current,
    media_time_advanced,
    advancement_delta,
    playback_attempt,
    is_ad,
    is_preview,
    is_resume,
    valid_start,
    playback_session_id,
    analytics_session_id,
    page_location,
    page_referrer,
    page_title,
    user_id,
    anonymous_id,
    analytics_storage,
    platform,
    CAST(1 AS BIGINT) AS content_start_count
  FROM deduplicated
  WHERE duplicate_sequence = 1;

Calculation Notes: |
  Assign each start to the period containing its original event occurrence timestamp, not its ingestion timestamp. A pause resume or recovery from buffering does not create a new start; a replay or restart counts only when a new playback_start_id is issued after the prior playback instance ended or was abandoned. For ad-supported playback, count the content start when editorial content begins rather than when the pre-roll begins. Autoplay of a full eligible item is included, but silent previews and promotional loops are excluded. Client and server events must be identity-resolved before counting, and offline events are restated into their original occurrence period when received within the late-arrival window.

Business Use Case: |
  The Product organization compares content starts by title, placement, platform, and market after a homepage or recommendation change. If impressions increase but starts do not, the team can revise artwork, ranking, metadata, or playback entry points; if playback attempts increase without corresponding starts, the team can prioritize investigation of startup failures by application version and device.



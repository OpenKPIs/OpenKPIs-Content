          COALESCE(playback_session_id, ''), '|',
          COALESCE(content_id, ''), '|',
          COALESCE(CAST(event_sequence AS STRING), '')
        )))
      )
      ORDER BY event_timestamp, event_sequence
    ) = 1
  )

# Metric: Offer Submission Count
# Generated: 2026-09-04T14:30:26.345Z
# Contributed by: devyendarm
# Last modified by: devyendarm

Metric Name: Offer Submission Count
Formula: COUNT(DISTINCT CASE WHEN event_name = 'offer_submitted' AND submission_status = 'submitted' AND platform_acknowledged = TRUE AND offer_submission_id IS NOT NULL AND listing_id IS NOT NULL AND is_test = FALSE AND is_bot = FALSE THEN offer_submission_id END)

Description: |
  Counts unique purchase or rental offers that the platform successfully persists and acknowledges during the reporting period across approved web, mobile app, agent-assisted digital, partner, and API journeys. It measures completed offer-submission conversions, excluding attempts, drafts, failures, duplicates, test activity, bots, and downstream offer outcomes.

Category: Conversion

Tags: [metric]

Industry: Technology

Priority: High

Core Area: Checkout

Scope: Event

Measure Type: count

Aggregation Window: Time based - Hourly/Daily/Monthly/Yearly







Google Analytics SQL: |
  -- ==========================================
  -- 1. GOOGLE BIGQUERY SQL
  -- ==========================================
  WITH normalized_submissions AS (
    SELECT
      DATE(submitted_at) AS event_date,
      submitted_at AS event_timestamp,
      'generate_lead' AS event_name,
      NULLIF(TRIM(CAST(source_event_id AS STRING)), '') AS event_id,
      NULLIF(TRIM(CAST(offer_submission_id AS STRING)), '') AS offer_submission_id,
      NULLIF(TRIM(CAST(offer_id AS STRING)), '') AS offer_id,
      NULLIF(TRIM(CAST(listing_id AS STRING)), '') AS listing_id,
      NULLIF(TRIM(CAST(property_id AS STRING)), '') AS property_id,
      NULLIF(TRIM(CAST(offer_type AS STRING)), '') AS offer_type,
      LOWER(NULLIF(TRIM(CAST(submission_status AS STRING)), '')) AS submission_status,
      NULLIF(TRIM(CAST(submission_channel AS STRING)), '') AS submission_channel,
      NULLIF(TRIM(CAST(submission_method AS STRING)), '') AS submission_method,
      CASE
        WHEN LOWER(TRIM(CAST(platform_acknowledged AS STRING))) IN ('true', '1', 'yes', 'y') THEN TRUE
        ELSE FALSE
      END AS platform_acknowledged,
      CASE
        WHEN LOWER(TRIM(CAST(is_test AS STRING))) IN ('true', '1', 'yes', 'y') THEN TRUE
        ELSE FALSE
      END AS is_test,
      CASE
        WHEN LOWER(TRIM(CAST(is_bot AS STRING))) IN ('true', '1', 'yes', 'y') THEN TRUE
        ELSE FALSE
      END AS is_bot,
      NULLIF(TRIM(CAST(user_pseudo_id AS STRING)), '') AS user_pseudo_id,
      NULLIF(TRIM(CAST(crm_contact_id AS STRING)), '') AS crm_contact_id,
      NULLIF(TRIM(CAST(agent_id AS STRING)), '') AS agent_id,
      NULLIF(TRIM(CAST(partner_id AS STRING)), '') AS partner_id,
      NULLIF(TRIM(CAST(platform AS STRING)), '') AS platform,
      NULLIF(TRIM(CAST(device_category AS STRING)), '') AS device_category,
      NULLIF(TRIM(CAST(market_id AS STRING)), '') AS market_id,
      NULLIF(TRIM(CAST(country AS STRING)), '') AS country,
      NULLIF(TRIM(CAST(region AS STRING)), '') AS region,
      NULLIF(TRIM(CAST(city AS STRING)), '') AS city,
      NULLIF(TRIM(CAST(postal_code AS STRING)), '') AS postal_code,
      UPPER(NULLIF(TRIM(CAST(currency AS STRING)), '')) AS currency,
      SAFE_CAST(offer_amount AS NUMERIC) AS offer_amount,
      NULLIF(TRIM(CAST(source_system AS STRING)), '') AS source_system
    FROM `your-project.offer_transaction_service.offer_submission_events`
    WHERE submitted_at >= @start_timestamp
      AND submitted_at < @end_timestamp
  ),
  eligible_submissions AS (
    SELECT *
    FROM normalized_submissions
    WHERE submission_status = 'submitted'
      AND platform_acknowledged = TRUE
      AND is_test = FALSE
      AND is_bot = FALSE
      AND offer_submission_id IS NOT NULL
      AND listing_id IS NOT NULL
  ),
  ranked_submissions AS (
    SELECT
      *,
      ROW_NUMBER() OVER (
        PARTITION BY offer_submission_id
        ORDER BY
          event_timestamp DESC,
          event_id DESC
      ) AS deduplication_rank
    FROM eligible_submissions
  )
  SELECT
    event_date,
    event_timestamp,
    event_name,
    event_id,
    offer_submission_id,
    offer_submission_id AS submission_deduplication_id,
    offer_id,
    listing_id,
    property_id,
    offer_type,
    submission_status,
    submission_channel,
    submission_method,
    platform_acknowledged,
    is_test,
    is_bot,
    user_pseudo_id,
    crm_contact_id,
    agent_id,
    partner_id,
    platform,
    device_category,
    market_id,
    country,
    region,
    city,
    postal_code,
    currency,
    offer_amount,
    source_system,
    CAST(1 AS INT64) AS offer_submission_count
  FROM ranked_submissions
  WHERE deduplication_rank = 1;


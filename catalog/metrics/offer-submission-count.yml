Calculation Notes: |
  Use the server-confirmed submitted_at timestamp from the Offer Transaction Service, not the client click timestamp. Include only offer_submitted records with submission_status = 'submitted', platform_acknowledged = TRUE, a non-null offer_submission_id, and a non-null listing_id. Deduplicate exclusively by offer_submission_id across service, digital analytics, CRM, partner API, and webhook records; event_id, offer_id, customer identifiers, and synthetic hashes must not replace the submission identifier. Exclude drafts, saved forms, unacknowledged attempts, validation or transmission failures, test records, employee QA, bots, synthetic monitoring, and historical imports without verified submission evidence. Retries, page refreshes, mirrored records, and webhook replays do not add counts. An edit or counteroffer counts again only when the platform creates and acknowledges a new offer_submission_id. Later acceptance, rejection, withdrawal, expiration, or supersession does not remove the original submission. Session boundaries do not affect the count; late or corrected records may restate the original submission period under the governed backfill policy.

Business Use Case: |
  Product and Sales leaders compare acknowledged offer submissions with listing views, offer-form starts, and submission failures by market, channel, platform, and device. If high-intent engagement remains stable while submissions decline, teams can identify the affected journey, prioritize form, authentication, partner integration, or offer-service remediation, and measure whether conversion recovers.



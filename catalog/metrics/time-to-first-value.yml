Google Analytics SQL: |
  -- ==========================================
  -- 1. GOOGLE BIGQUERY SQL
  -- ==========================================
  WITH signups AS (
    SELECT
      user_id AS account_id,
      MIN(TIMESTAMP_MICROS(event_timestamp)) AS sign_up_ts
    FROM `your-project.analytics_123456789.events_*`
    WHERE event_name = 'sign_up'
      AND user_id IS NOT NULL
      AND _TABLE_SUFFIX BETWEEN FORMAT_DATE('%Y%m%d', @cohort_start) AND FORMAT_DATE('%Y%m%d', @cohort_end)
    GROUP BY user_id
  ),
  first_value AS (
    SELECT
      e.user_id AS account_id,
      MIN(TIMESTAMP_MICROS(e.event_timestamp)) AS first_value_ts
    FROM `your-project.analytics_123456789.events_*` e
    JOIN signups s ON s.account_id = e.user_id
    WHERE e.event_name = 'tutorial_complete'
      AND (SELECT value.string_value FROM UNNEST(e.event_params) WHERE key = 'value_action') IS NOT NULL
      AND TIMESTAMP_MICROS(e.event_timestamp) >= s.sign_up_ts
      AND _TABLE_SUFFIX BETWEEN FORMAT_DATE('%Y%m%d', @cohort_start) AND FORMAT_DATE('%Y%m%d', DATE_ADD(@cohort_end, INTERVAL 14 DAY))
    GROUP BY e.user_id
  ),
  per_account AS (
    SELECT
      s.account_id,
      DATE_TRUNC(DATE(s.sign_up_ts), WEEK(MONDAY)) AS sign_up_cohort_week,
      TIMESTAMP_DIFF(f.first_value_ts, s.sign_up_ts, MINUTE) / 60.0 AS hours_to_first_value
    FROM signups s
    JOIN first_value f USING (account_id)
  )
  SELECT
    sign_up_cohort_week,
    COUNT(*) AS activated_accounts,
    APPROX_QUANTILES(hours_to_first_value, 100)[OFFSET(50)] AS median_hours_to_first_value,
    APPROX_QUANTILES(hours_to_first_value, 100)[OFFSET(75)] AS p75_hours_to_first_value
  FROM per_account
  GROUP BY sign_up_cohort_week
  ORDER BY sign_up_cohort_week;

AEP Query Service SQL: |
  -- ==========================================
  -- 2. ADOBE AEP QUERY SERVICE SQL
  -- ==========================================
  WITH signups AS (
    SELECT
      identityMap['accountId'][0].id AS account_id,
      MIN(timestamp) AS sign_up_ts
    FROM product_experience_events
    WHERE eventType = 'userAccount.createProfile'
      AND timestamp BETWEEN CAST(@cohort_start AS TIMESTAMP) AND CAST(@cohort_end AS TIMESTAMP)
    GROUP BY 1
  ),
  first_value AS (
    SELECT
      e.identityMap['accountId'][0].id AS account_id,
      MIN(e.timestamp) AS first_value_ts
    FROM product_experience_events e
    JOIN signups s ON s.account_id = e.identityMap['accountId'][0].id
    WHERE e.eventType = 'application.milestone'
      AND e._experience.analytics.customDimensions.eVars.eVar20 IS NOT NULL
      AND e.timestamp >= s.sign_up_ts
      AND e.timestamp < DATE_ADD(CAST(@cohort_end AS TIMESTAMP), INTERVAL 14 DAY)
    GROUP BY 1
  ),
  per_account AS (
    SELECT
      s.account_id,
      DATE_TRUNC('week', s.sign_up_ts) AS sign_up_cohort_week,
      (UNIX_TIMESTAMP(f.first_value_ts) - UNIX_TIMESTAMP(s.sign_up_ts)) / 3600.0 AS hours_to_first_value
    FROM signups s
    JOIN first_value f ON f.account_id = s.account_id
  )
  SELECT
    sign_up_cohort_week,
    COUNT(*) AS activated_accounts,
    PERCENTILE_APPROX(hours_to_first_value, 0.5) AS median_hours_to_first_value,
    PERCENTILE_APPROX(hours_to_first_value, 0.75) AS p75_hours_to_first_value
  FROM per_account
  GROUP BY 1
  ORDER BY 1;

Calculation Notes: |
  1️⃣ The clock starts at the sign_up event of the account owner and stops at the first value event for that account (any seat), defined per product in the activation configuration (for example generate_report, integration_connected or workflow_published).
  2️⃣ Report the median, not the mean; the distribution is heavily right-skewed by accounts that never activate.
  3️⃣ Accounts that have not yet reached the value event are excluded from the median but counted in the companion Activated Trial Accounts metric, so the two are read together.
  4️⃣ Use the sign-up cohort week or month as the reporting grain; only cohorts old enough for the observation window (14 days for trials) are final.
  5️⃣ Exclude internal, demo and test workspaces and accounts created by sales on behalf of prospects.
  6️⃣ Time zones are normalized to UTC before the difference is computed; sessions and the 30-minute session timeout do not affect this metric.

Business Use Case: |
  The Head of Product reviews Time to First Value by sign-up cohort after every onboarding release; when the median rises, the growth team reorders or removes onboarding steps and adds in-product guidance at the step where accounts stall, and customer success uses the per-account value to prioritize outreach to trials that have not activated within 48 hours.


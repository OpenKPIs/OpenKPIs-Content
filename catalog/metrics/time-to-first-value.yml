Metric Name: Time to First Value
Formula: MEDIAN(first_value_event_timestamp − sign_up_timestamp) in hours, per account cohort

Description: |
  Elapsed time between an account's sign-up and the first completion of the product's defining value action, such as the first report generated, first integration connected or first workflow published. It is the core building block for activation KPIs and shows how quickly onboarding turns a new account into a working one.

Category: Engagement

Tags: [metric, SaaS: Product-Led Growth, Activation & Expansion]

Industry: SaaS

Priority: High

Core Area: Onboarding

Scope: User

Measure Type: Average

Aggregation Window: Time based - Weekly/Monthly (by sign-up cohort), Weekly, Monthly

GA4 Event: |
  tutorial_complete

Adobe Event: |
  First Value Achieved


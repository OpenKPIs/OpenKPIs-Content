Metric Name: Booking Journey Duration
Formula: AVG((booking_confirmation_timestamp_utc - attributable_journey_start_timestamp_utc) / 60) over eligible completed digital booking journeys

Description: |
  Measures the average elapsed time, in minutes, from the first attributable digital booking-intent event to successful booking confirmation for completed digital journeys. It quantifies how long customers require to progress from active travel search into a confirmed reservation, including qualifying activity across multiple digital sessions.

Category: Conversion

Tags: [metric]

Industry: Travel & Hospitality

Priority: High

Core Area: Checkout

Scope: User

Measure Type: average

Aggregation Window: Time based - Daily


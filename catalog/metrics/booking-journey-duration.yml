Google Analytics SQL: |
  -- ==========================================
  -- 1. GOOGLE BIGQUERY SQL
  -- ==========================================
  WITH purchase_events AS (
    SELECT
      PARSE_DATE('%Y%m%d', e.event_date) AS event_date,
      TIMESTAMP_MICROS(e.event_timestamp) AS ga4_event_time,
      e.event_bundle_sequence_id,
      e.user_pseudo_id AS ga4_user_pseudo_id,
      e.ecommerce.transaction_id AS ga4_transaction_id,
      e.ecommerce.currency AS ga4_currency,
      e.ecommerce.purchase_revenue AS ga4_purchase_value,
      e.geo.country AS ga4_country,
      e.device.category AS ga4_device_category,
      e.app_info.version AS ga4_app_version,
      e.traffic_source.source AS ga4_attribution_source,
      MAX(IF(ep.key = 'event_id', ep.value.string_value, NULL)) AS event_id,
      MAX(IF(ep.key = 'event_time', ep.value.string_value, NULL)) AS event_time_raw,
      MAX(IF(ep.key = 'booking_journey_id', ep.value.string_value, NULL)) AS booking_journey_id,
      MAX(IF(ep.key = 'booking_id', ep.value.string_value, NULL)) AS booking_id,
      MAX(IF(ep.key = 'transaction_id', COALESCE(ep.value.string_value, CAST(ep.value.int_value AS STRING)), NULL)) AS transaction_id_param,
      MAX(IF(ep.key = 'journey_start_time', ep.value.string_value, NULL)) AS journey_start_time_raw,
      MAX(IF(ep.key = 'confirmation_time', ep.value.string_value, NULL)) AS confirmation_time_raw,
      MAX(IF(ep.key = 'currency', ep.value.string_value, NULL)) AS currency_param,
      MAX(IF(ep.key = 'value', COALESCE(ep.value.double_value, ep.value.float_value, CAST(ep.value.int_value AS FLOAT64), SAFE_CAST(ep.value.string_value AS FLOAT64)), NULL)) AS value_param,
      MAX(IF(ep.key = 'tax', COALESCE(ep.value.double_value, ep.value.float_value, CAST(ep.value.int_value AS FLOAT64), SAFE_CAST(ep.value.string_value AS FLOAT64)), NULL)) AS tax,
      MAX(IF(ep.key = 'fees', COALESCE(ep.value.double_value, ep.value.float_value, CAST(ep.value.int_value AS FLOAT64), SAFE_CAST(ep.value.string_value AS FLOAT64)), NULL)) AS fees,
      MAX(IF(ep.key = 'discount', COALESCE(ep.value.double_value, ep.value.float_value, CAST(ep.value.int_value AS FLOAT64), SAFE_CAST(ep.value.string_value AS FLOAT64)), NULL)) AS discount,
      MAX(IF(ep.key = 'coupon', ep.value.string_value, NULL)) AS coupon,
      MAX(IF(ep.key = 'payment_type', ep.value.string_value, NULL)) AS payment_type,
      MAX(IF(ep.key = 'booking_status', ep.value.string_value, NULL)) AS booking_status,
      MAX(IF(ep.key = 'booking_channel', ep.value.string_value, NULL)) AS booking_channel,
      MAX(IF(ep.key = 'platform', ep.value.string_value, NULL)) AS platform,
      MAX(IF(ep.key = 'site_name', ep.value.string_value, NULL)) AS site_name,
      MAX(IF(ep.key = 'page_name', ep.value.string_value, NULL)) AS page_name,
      MAX(IF(ep.key = 'page_location', ep.value.string_value, NULL)) AS page_location,
      MAX(IF(ep.key = 'page_referrer', ep.value.string_value, NULL)) AS page_referrer,
      MAX(IF(ep.key = 'language', ep.value.string_value, NULL)) AS language,
      MAX(IF(ep.key = 'country', ep.value.string_value, NULL)) AS country_param,
      MAX(IF(ep.key = 'market', ep.value.string_value, NULL)) AS market,
      MAX(IF(ep.key = 'brand', ep.value.string_value, NULL)) AS brand,
      MAX(IF(ep.key = 'business_unit', ep.value.string_value, NULL)) AS business_unit,
      MAX(IF(ep.key = 'travel_product_type', ep.value.string_value, NULL)) AS travel_product_type,
      MAX(IF(ep.key = 'origin', ep.value.string_value, NULL)) AS origin,
      MAX(IF(ep.key = 'destination', ep.value.string_value, NULL)) AS destination,
      MAX(IF(ep.key = 'departure_date', ep.value.string_value, NULL)) AS departure_date_raw,
      MAX(IF(ep.key = 'return_date', ep.value.string_value, NULL)) AS return_date_raw,
      MAX(IF(ep.key = 'trip_type', ep.value.string_value, NULL)) AS trip_type,
      MAX(IF(ep.key = 'passenger_count', COALESCE(ep.value.int_value, SAFE_CAST(ep.value.string_value AS INT64)), NULL)) AS passenger_count,
      MAX(IF(ep.key = 'adult_count', COALESCE(ep.value.int_value, SAFE_CAST(ep.value.string_value AS INT64)), NULL)) AS adult_count,
      MAX(IF(ep.key = 'child_count', COALESCE(ep.value.int_value, SAFE_CAST(ep.value.string_value AS INT64)), NULL)) AS child_count,
      MAX(IF(ep.key = 'infant_count', COALESCE(ep.value.int_value, SAFE_CAST(ep.value.string_value AS INT64)), NULL)) AS infant_count,
      MAX(IF(ep.key = 'cabin_class', ep.value.string_value, NULL)) AS cabin_class,
      MAX(IF(ep.key = 'fare_class', ep.value.string_value, NULL)) AS fare_class,
      MAX(IF(ep.key = 'loyalty_member', COALESCE(ep.value.string_value, CAST(ep.value.int_value AS STRING)), NULL)) AS loyalty_member_raw,
      MAX(IF(ep.key = 'loyalty_tier', ep.value.string_value, NULL)) AS loyalty_tier,
      MAX(IF(ep.key = 'login_status', ep.value.string_value, NULL)) AS login_status,
      MAX(IF(ep.key = 'user_pseudo_id', COALESCE(ep.value.string_value, CAST(ep.value.int_value AS STRING)), NULL)) AS user_pseudo_id_param,
      MAX(IF(ep.key = 'session_id', COALESCE(ep.value.string_value, CAST(ep.value.int_value AS STRING)), NULL)) AS session_id,
      MAX(IF(ep.key IN ('session_number', 'ga_session_number'), COALESCE(ep.value.int_value, SAFE_CAST(ep.value.string_value AS INT64)), NULL)) AS session_number,
      MAX(IF(ep.key = 'device_category', ep.value.string_value, NULL)) AS device_category_param,
      MAX(IF(ep.key = 'app_version', ep.value.string_value, NULL)) AS app_version_param,
      MAX(IF(ep.key = 'analytics_consent', ep.value.string_value, NULL)) AS analytics_consent,
      MAX(IF(ep.key = 'attribution_source', ep.value.string_value, NULL)) AS attribution_source_param
    FROM `your-project.analytics_123456789.events_*` AS e
    LEFT JOIN UNNEST(e.event_params) AS ep
    WHERE _TABLE_SUFFIX BETWEEN @start_date AND @end_date
      AND e.event_name = 'purchase'
    GROUP BY
      event_date,
      ga4_event_time,
      e.event_bundle_sequence_id,
      ga4_user_pseudo_id,
      ga4_transaction_id,
      ga4_currency,
      ga4_purchase_value,
      ga4_country,
      ga4_device_category,
      ga4_app_version,
      ga4_attribution_source
  ),
  typed AS (
    SELECT
      event_date,
      COALESCE(SAFE_CAST(event_time_raw AS TIMESTAMP), ga4_event_time) AS event_time,
      event_id,
      booking_journey_id,
      booking_id,
      COALESCE(transaction_id_param, ga4_transaction_id) AS transaction_id,
      SAFE_CAST(journey_start_time_raw AS TIMESTAMP) AS journey_start_time,
      COALESCE(SAFE_CAST(confirmation_time_raw AS TIMESTAMP), SAFE_CAST(event_time_raw AS TIMESTAMP), ga4_event_time) AS confirmation_time,
      COALESCE(currency_param, ga4_currency) AS currency,
      COALESCE(value_param, ga4_purchase_value) AS value,
      tax,
      fees,
      discount,
      coupon,
      payment_type,
      booking_status,
      booking_channel,
      platform,
      site_name,
      page_name,
      page_location,
      page_referrer,
      language,
      COALESCE(country_param, ga4_country) AS country,
      market,
      brand,
      business_unit,
      travel_product_type,
      origin,
      destination,
      SAFE_CAST(departure_date_raw AS DATE) AS departure_date,
      SAFE_CAST(return_date_raw AS DATE) AS return_date,
      trip_type,
      passenger_count,
      adult_count,
      child_count,
      infant_count,
      cabin_class,
      fare_class,
      CASE
        WHEN LOWER(loyalty_member_raw) IN ('true', '1', 'yes') THEN TRUE
        WHEN LOWER(loyalty_member_raw) IN ('false', '0', 'no') THEN FALSE
      END AS loyalty_member,
      loyalty_tier,
      login_status,
      COALESCE(user_pseudo_id_param, ga4_user_pseudo_id) AS user_pseudo_id,
      session_id,
      session_number,
      COALESCE(device_category_param, ga4_device_category) AS device_category,
      COALESCE(NULLIF(app_version_param, ''), ga4_app_version) AS app_version,
      analytics_consent,
      COALESCE(attribution_source_param, ga4_attribution_source) AS attribution_source,
      event_bundle_sequence_id
    FROM purchase_events
  ),
  deduplicated AS (
    SELECT *
    FROM typed
    QUALIFY ROW_NUMBER() OVER (
      PARTITION BY COALESCE(event_id, transaction_id, booking_id, booking_journey_id, CONCAT(user_pseudo_id, '|', CAST(event_time AS STRING)))
      ORDER BY event_time DESC, event_bundle_sequence_id DESC
    ) = 1
  )
  SELECT
    event_date,
    event_time,
    event_id,
    booking_journey_id,
    booking_id,
    transaction_id,
    journey_start_time,
    confirmation_time,
    TIMESTAMP_DIFF(confirmation_time, journey_start_time, MICROSECOND) / 60000000.0 AS booking_journey_duration_minutes,
    currency,
    value,
    tax,
    fees,
    discount,
    coupon,
    payment_type,
    booking_status,
    booking_channel,
    platform,
    site_name,
    page_name,
    page_location,
    page_referrer,
    language,
    country,
    market,
    brand,
    business_unit,
    travel_product_type,
    origin,
    destination,
    departure_date,
    return_date,
    trip_type,
    passenger_count,
    adult_count,
    child_count,
    infant_count,
    cabin_class,
    fare_class,
    loyalty_member,
    loyalty_tier,
    login_status,
    user_pseudo_id,
    session_id,
    session_number,
    device_category,
    app_version,
    analytics_consent,
    attribution_source
  FROM deduplicated
  WHERE journey_start_time IS NOT NULL
    AND confirmation_time IS NOT NULL
    AND confirmation_time >= journey_start_time;

AEP Query Service SQL: |
  -- ==========================================
  -- 2. ADOBE AEP QUERY SERVICE SQL
  -- ==========================================
  WITH purchase_events AS (
    SELECT
      CAST(timestamp AS DATE) AS event_date,
      CAST(timestamp AS TIMESTAMP) AS event_time,
      _id AS event_id,
      _acme.bookingJourney.bookingJourneyId AS booking_journey_id,
      _acme.bookingJourney.bookingId AS booking_id,
      commerce.order.purchaseID AS transaction_id,
      CAST(_acme.bookingJourney.journeyStartTime AS TIMESTAMP) AS journey_start_time,
      COALESCE(
        CAST(_acme.bookingJourney.confirmationTime AS TIMESTAMP),
        CAST(timestamp AS TIMESTAMP)
      ) AS confirmation_time,
      commerce.order.currencyCode AS currency,
      CAST(commerce.order.priceTotal AS DOUBLE) AS value,
      CAST(_acme.bookingJourney.tax AS DOUBLE) AS tax,
      CAST(_acme.bookingJourney.fees AS DOUBLE) AS fees,
      CAST(_acme.bookingJourney.discount AS DOUBLE) AS discount,
      _acme.bookingJourney.coupon AS coupon,
      _acme.bookingJourney.paymentType AS payment_type,
      _acme.bookingJourney.bookingStatus AS booking_status,
      _acme.bookingJourney.bookingChannel AS booking_channel,
      _acme.bookingJourney.platform AS platform,
      _acme.bookingJourney.siteName AS site_name,
      web.webPageDetails.name AS page_name,
      web.webPageDetails.URL AS page_location,
      web.webReferrer.URL AS page_referrer,
      environment.language AS language,
      placeContext.geo.countryCode AS country,
      _acme.bookingJourney.market AS market,
      _acme.bookingJourney.brand AS brand,
      _acme.bookingJourney.businessUnit AS business_unit,
      _acme.bookingJourney.travelProductType AS travel_product_type,
      _acme.bookingJourney.origin AS origin,
      _acme.bookingJourney.destination AS destination,
      CAST(_acme.bookingJourney.departureDate AS DATE) AS departure_date,
      CAST(_acme.bookingJourney.returnDate AS DATE) AS return_date,
      _acme.bookingJourney.tripType AS trip_type,
      CAST(_acme.bookingJourney.passengerCount AS BIGINT) AS passenger_count,
      CAST(_acme.bookingJourney.adultCount AS BIGINT) AS adult_count,
      CAST(_acme.bookingJourney.childCount AS BIGINT) AS child_count,
      CAST(_acme.bookingJourney.infantCount AS BIGINT) AS infant_count,
      _acme.bookingJourney.cabinClass AS cabin_class,
      _acme.bookingJourney.fareClass AS fare_class,
      CAST(_acme.bookingJourney.loyaltyMember AS BOOLEAN) AS loyalty_member,
      _acme.bookingJourney.loyaltyTier AS loyalty_tier,
      _acme.bookingJourney.loginStatus AS login_status,
      _acme.bookingJourney.userPseudoId AS user_pseudo_id,
      _acme.bookingJourney.sessionId AS session_id,
      CAST(_acme.bookingJourney.sessionNumber AS BIGINT) AS session_number,
      device.type AS device_category,
      _acme.bookingJourney.appVersion AS app_version,
      _acme.bookingJourney.analyticsConsent AS analytics_consent,
      _acme.bookingJourney.attributionSource AS attribution_source
    FROM aep_booking_journey_event_dataset
    WHERE eventType = 'commerce.purchases'
      AND timestamp >= CURRENT_TIMESTAMP - INTERVAL '90 days'
      AND timestamp < CURRENT_TIMESTAMP
  ),
  deduplicated AS (
    SELECT
      *,
      ROW_NUMBER() OVER (
        PARTITION BY COALESCE(event_id, transaction_id, booking_id, booking_journey_id, CONCAT(user_pseudo_id, '|', CAST(event_time AS VARCHAR)))
        ORDER BY event_time DESC
      ) AS record_rank
    FROM purchase_events
  )
  SELECT
    event_date,
    event_time,
    event_id,
    booking_journey_id,
    booking_id,
    transaction_id,
    journey_start_time,
    confirmation_time,
    EXTRACT(EPOCH FROM (confirmation_time - journey_start_time)) / 60.0 AS booking_journey_duration_minutes,
    currency,
    value,
    tax,
    fees,
    discount,
    coupon,
    payment_type,
    booking_status,
    booking_channel,
    platform,
    site_name,
    page_name,
    page_location,
    page_referrer,
    language,
    country,
    market,
    brand,
    business_unit,
    travel_product_type,
    origin,
    destination,
    departure_date,
    return_date,
    trip_type,
    passenger_count,
    adult_count,
    child_count,
    infant_count,
    cabin_class,
    fare_class,
    loyalty_member,
    loyalty_tier,
    login_status,
    user_pseudo_id,
    session_id,
    session_number,
    device_category,
    app_version,
    analytics_consent,
    attribution_source
  FROM deduplicated
  WHERE record_rank = 1
    AND journey_start_time IS NOT NULL
    AND confirmation_time IS NOT NULL
    AND confirmation_time >= journey_start_time;

Calculation Notes: |
  1️⃣ Assign the metric to the reporting date of the successful booking confirmation, not the journey-start date.
  2️⃣ Measure across sessions and devices only when deterministic, consented digital identity resolution is available.
  3️⃣ Use the earliest attributable qualifying intent event within the 30-day lookback; do not default to the first site visit.
  4️⃣ Deduplicate confirmation events by reservation identifier and retain the earliest valid success timestamp.
  5️⃣ Exclude journeys with missing timestamps, negative durations, ambiguous attribution, bot traffic, or internal test activity.
  6️⃣ Keep valid long-duration journeys in the average; report median and upper percentiles alongside it to expose skew.
  7️⃣ Exclude call-center, agent, airport, property-desk, and other offline activity from this digital-only definition.

Business Use Case: |
  The Chief Digital Officer and booking product leadership compare duration distributions by device, market, product, acquisition channel, and checkout step. If mobile-app journeys show elevated P75 duration and lower conversion after fare or room selection, the team can prioritize inventory persistence, price-transparency, authentication, and payment-flow improvements, then validate whether the release reduces duration without lowering booking value or increasing cancellations.


Source Data: Digital Analytics (Adobe Analytics or GA4 web and mobile-app event streams)


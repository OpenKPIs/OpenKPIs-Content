Metric Name: Shipping Info Added
Formula: COUNT(add_shipping_info events WHERE shipping_tier IS NOT NULL AND address validation not failed AND fulfillment_type NOT IN (digital, none) AND NOT excluded traffic/checkout types AND analytics consent granted)

Description: |
  Counts the checkout interactions in which a shopper submitted a shipping address or selected a delivery option, incrementing once for every qualifying add_shipping_info occurrence. It isolates the fulfillment-selection step of the checkout funnel and supplies the step-level volume used to measure drop-off between checkout start and payment entry.

Category: Conversion

Tags: [metric, E-commerce: Cart & Checkout Funnel Analytics]

Industry: E-commerce

Priority: High

Core Area: Checkout

Scope: Event

Measure Type: Counter

Aggregation Window: Event, Session, Daily, Weekly, Monthly

GA4 Event: |
  add_shipping_info

Adobe Event: |
  Checkout: Shipping Info Added


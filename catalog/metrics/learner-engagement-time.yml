    lab_id,
    interaction_type,
    engagement_start_time,
    engagement_end_time,
    active_time_msec,
    idle_time_msec,
    background_time_msec,
    duplicate_time_msec,
    invalid_time_msec,
    non_learning_time_msec,
    elapsed_time_msec,
    completion_status,
    attribution_eligible,
    CASE
      WHEN attribution_eligible THEN GREATEST(
        LEAST(
          candidate_engagement_time_msec,
          COALESCE(elapsed_time_msec, candidate_engagement_time_msec)
        ),
        0
      )
      ELSE 0
    END AS engagement_time_msec,
    CAST(
      CASE
        WHEN attribution_eligible THEN GREATEST(
          LEAST(candidate_engagement_time_msec, COALESCE(elapsed_time_msec, candidate_engagement_time_msec)),
          0
        )
        ELSE 0
      END AS DOUBLE
    ) / 1000.0 AS engagement_time_seconds,
    CAST(
      CASE
        WHEN attribution_eligible THEN GREATEST(
          LEAST(candidate_engagement_time_msec, COALESCE(elapsed_time_msec, candidate_engagement_time_msec)),
          0
        )
        ELSE 0
      END AS DOUBLE
    ) / 60000.0 AS engagement_time_minutes
  FROM measured;

Calculation Notes: |
  Build active intervals from trusted engagement heartbeats or explicit start, pause, resume, seek, answer, submit, navigate, and completion events. Clip intervals to reporting-window boundaries, merge overlapping or adjacent intervals for the same learner, and count the union once to prevent concurrent tabs, devices, or media streams from multiplying time. Prefer measured foreground-active duration supplied by the client; when unavailable, infer time only between consecutive eligible events no more than 60 seconds apart. Do not assign the full 30-minute session timeout as engagement time. Pause accumulation when the application is hidden, the device is locked, media is paused or buffering, or no qualifying heartbeat is received. For offline activity, use validated client event time after synchronization and include it under the late-arriving-data policy.

Business Use Case: |
  The Chief Product Officer reviews monthly engagement time by course, lesson, content format, and learner cohort to identify high-enrollment content with declining active time. Product and instructional design teams then investigate telemetry-confirmed drop-off points, revise or replace low-engagement activities, and compare post-release engagement time and completion-rate changes against the pre-release baseline.



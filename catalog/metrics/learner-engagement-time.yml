  WITH source_events AS (
    SELECT
      e.eventType,
      e.eventID AS xdm_event_id,
      e.timestamp AS xdm_timestamp,
      e._learning.learnerEngagement AS le
    FROM learner_engagement_events AS e
    WHERE e.timestamp >= CAST('${START_TIMESTAMP}' AS TIMESTAMP)
      AND e.timestamp < CAST('${END_TIMESTAMP}' AS TIMESTAMP)
      AND e.eventType = 'user_engagement'
  ),
  normalized AS (
    SELECT
      COALESCE(NULLIF(le.event_id, ''), xdm_event_id) AS event_id,
      le.event_version AS event_version,
      COALESCE(CAST(le.event_timestamp AS TIMESTAMP), xdm_timestamp) AS event_timestamp,
      le.reporting_window_id AS reporting_window_id,
      CAST(le.reporting_window_start AS TIMESTAMP) AS reporting_window_start,
      CAST(le.reporting_window_end AS TIMESTAMP) AS reporting_window_end,
      le.learner_id AS learner_id,
      le.anonymous_id AS anonymous_id,
      le.identity_namespace AS identity_namespace,
      le.identity_auth_state AS identity_auth_state,
      le.session_id AS session_id,
      le.engagement_id AS engagement_id,
      le.enrollment_id AS enrollment_id,
      le.course_id AS course_id,
      le.course_name AS course_name,
      le.course_version AS course_version,
      le.learning_path_id AS learning_path_id,
      le.module_id AS module_id,
      le.lesson_id AS lesson_id,
      le.activity_id AS activity_id,
      le.activity_type AS activity_type,
      le.content_id AS content_id,
      le.content_type AS content_type,
      le.content_title AS content_title,
      le.content_provider AS content_provider,
      le.content_language AS content_language,
      le.delivery_channel AS delivery_channel,
      le.platform AS platform,
      le.device_type AS device_type,
      le.app_id AS app_id,
      le.app_version AS app_version,
      le.page_location AS page_location,
      le.page_referrer AS page_referrer,
      NULLIF(le.media_id, '') AS media_id,
      NULLIF(le.assessment_id, '') AS assessment_id,
      NULLIF(le.lab_id, '') AS lab_id,
      le.interaction_type AS interaction_type,
      CAST(le.engagement_start_time AS TIMESTAMP) AS engagement_start_time,
      CAST(le.engagement_end_time AS TIMESTAMP) AS engagement_end_time,
      CAST(le.active_time_msec AS BIGINT) AS active_time_msec,
      CAST(le.idle_time_msec AS BIGINT) AS idle_time_msec,
      CAST(le.background_time_msec AS BIGINT) AS background_time_msec,
      CAST(le.duplicate_time_msec AS BIGINT) AS duplicate_time_msec,
      CAST(le.invalid_time_msec AS BIGINT) AS invalid_time_msec,
      CAST(le.non_learning_time_msec AS BIGINT) AS non_learning_time_msec,
      CAST(le.elapsed_time_msec AS BIGINT) AS elapsed_time_msec,
      le.completion_status AS completion_status,
      COALESCE(le.attribution_eligible, FALSE) AS attribution_eligible,
      CAST(le.engagement_time_msec AS BIGINT) AS reported_engagement_time_msec,
      xdm_timestamp AS ingestion_order_timestamp
    FROM source_events
  ),
  ranked AS (
    SELECT
      *,
      ROW_NUMBER() OVER (
        PARTITION BY COALESCE(
          NULLIF(event_id, ''),
          CONCAT(
            COALESCE(NULLIF(engagement_id, ''), 'unknown'), '|',
            COALESCE(NULLIF(learner_id, ''), NULLIF(anonymous_id, ''), 'unknown'), '|',
            CAST(event_timestamp AS VARCHAR)
          )
        )
        ORDER BY ingestion_order_timestamp DESC
      ) AS duplicate_rank
    FROM normalized
  ),
  deduplicated AS (
    SELECT *
    FROM ranked
    WHERE duplicate_rank = 1
  ),
  measured AS (
    SELECT
      *,
      COALESCE(
        reported_engagement_time_msec,
        active_time_msec,
        GREATEST(
          COALESCE(elapsed_time_msec, 0)

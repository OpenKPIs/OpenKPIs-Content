          MAX(IF(key = 'event_version', param_value, NULL)) AS event_version,
          MAX(IF(key = 'event_timestamp', param_value, NULL)) AS event_timestamp_value,
          MAX(IF(key = 'reporting_window_id', param_value, NULL)) AS reporting_window_id,

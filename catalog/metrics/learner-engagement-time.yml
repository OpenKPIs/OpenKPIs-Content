          MAX(IF(key IN ('ga_session_id', 'session_id'), param_value, NULL)) AS session_id,
          MAX(IF(key = 'engagement_id', param_value, NULL)) AS engagement_id,
          MAX(IF(key = 'enrollment_id', param_value, NULL)) AS enrollment_id,
          MAX(IF(key = 'course_id', param_value, NULL)) AS course_id,
          MAX(IF(key = 'course_name', param_value, NULL)) AS course_name,
          MAX(IF(key = 'course_version', param_value, NULL)) AS course_version,
          MAX(IF(key = 'learning_path_id', param_value, NULL)) AS learning_path_id,

      p.platform,
      COALESCE(NULLIF(p.device_type, ''), device.category) AS device_type,
      COALESCE(NULLIF(p.app_id, ''), app_info.id) AS app_id,
      COALESCE(NULLIF(p.app_version, ''), app_info.version) AS app_version,
      p.page_location,
      p.page_referrer,
      NULLIF(p.media_id, '') AS media_id,
      NULLIF(p.assessment_id, '') AS assessment_id,
      NULLIF(p.lab_id, '') AS lab_id,
      p.interaction_type,
      SAFE_CAST(p.engagement_start_time AS TIMESTAMP) AS engagement_start_time,
      SAFE_CAST(p.engagement_end_time AS TIMESTAMP) AS engagement_end_time,
      SAFE_CAST(p.active_time_msec AS INT64) AS active_time_msec,
      SAFE_CAST(p.idle_time_msec AS INT64) AS idle_time_msec,
      SAFE_CAST(p.background_time_msec AS INT64) AS background_time_msec,
      SAFE_CAST(p.duplicate_time_msec AS INT64) AS duplicate_time_msec,
      SAFE_CAST(p.invalid_time_msec AS INT64) AS invalid_time_msec,
      SAFE_CAST(p.non_learning_time_msec AS INT64) AS non_learning_time_msec,
      SAFE_CAST(p.elapsed_time_msec AS INT64) AS elapsed_time_msec,
      p.completion_status,
      COALESCE(SAFE_CAST(p.attribution_eligible AS BOOL), FALSE) AS attribution_eligible,
      SAFE_CAST(p.reported_engagement_time_msec AS INT64) AS reported_engagement_time_msec,
      event_bundle_sequence_id,
      event_server_timestamp_offset
    FROM source_events
  ),
  deduplicated AS (
    SELECT * EXCEPT(event_bundle_sequence_id, event_server_timestamp_offset)
    FROM normalized
    QUALIFY ROW_NUMBER() OVER (
      PARTITION BY COALESCE(
        NULLIF(event_id, ''),
        CONCAT(
          COALESCE(NULLIF(engagement_id, ''), 'unknown'), '|',
          COALESCE(NULLIF(learner_id, ''), NULLIF(anonymous_id, ''), 'unknown'), '|',
          CAST(event_timestamp AS STRING)
        )
      )
      ORDER BY event_server_timestamp_offset DESC, event_bundle_sequence_id DESC
    ) = 1
  ),
  measured AS (
    SELECT
      *,
      COALESCE(
        reported_engagement_time_msec,
        active_time_msec,
        GREATEST(
          COALESCE(elapsed_time_msec, 0)
            - COALESCE(idle_time_msec, 0)
            - COALESCE(background_time_msec, 0)
            - COALESCE(duplicate_time_msec, 0)
            - COALESCE(invalid_time_msec, 0)
            - COALESCE(non_learning_time_msec, 0),
          0
        )
      ) AS candidate_engagement_time_msec
    FROM deduplicated
  )
  SELECT
    event_id,
    event_version,
    event_timestamp,
    reporting_window_id,
    reporting_window_start,
    reporting_window_end,
    learner_id,
    anonymous_id,
    identity_namespace,
    identity_auth_state,
    session_id,
    engagement_id,
    enrollment_id,
    course_id,
    course_name,
    course_version,
    learning_path_id,
    module_id,
    lesson_id,
    activity_id,
    activity_type,
    content_id,
    content_type,
    content_title,
    content_provider,
    content_language,
    delivery_channel,
    platform,
    device_type,
    app_id,
    app_version,
    page_location,
    page_referrer,
    media_id,
    assessment_id,
    lab_id,
    interaction_type,
    engagement_start_time,
    engagement_end_time,
    active_time_msec,
    idle_time_msec,
    background_time_msec,
    duplicate_time_msec,
    invalid_time_msec,
    non_learning_time_msec,
    elapsed_time_msec,
    completion_status,
    attribution_eligible,
    CASE
      WHEN attribution_eligible THEN GREATEST(
        LEAST(
          candidate_engagement_time_msec,
          COALESCE(elapsed_time_msec, candidate_engagement_time_msec)
        ),
        0
      )
      ELSE 0
    END AS engagement_time_msec,
    SAFE_DIVIDE(
      CASE WHEN attribution_eligible THEN GREATEST(
        LEAST(candidate_engagement_time_msec, COALESCE(elapsed_time_msec, candidate_engagement_time_msec)), 0
      ) ELSE 0 END,
      1000.0
    ) AS engagement_time_seconds,
    SAFE_DIVIDE(
      CASE WHEN attribution_eligible THEN GREATEST(
        LEAST(candidate_engagement_time_msec, COALESCE(elapsed_time_msec, candidate_engagement_time_msec)), 0
      ) ELSE 0 END,
      60000.0
    ) AS engagement_time_minutes
  FROM measured;


Metric Name: Learner Engagement Time
Formula: SUM_over_learners(DURATION_SECONDS(UNION(CLIP(eligible_active_intervals, window_start, window_end))))

Description: |
  Measures the total active time learners spend interacting with eligible learning content and activities during a defined reporting window. It excludes background, idle, duplicate, invalid, and non-learning activity so that the result represents attributable learning engagement rather than elapsed session duration.

Category: Engagement

Tags: [metric]

Industry: EdTech & E-Learning

Priority: High

Core Area: Engagement

Scope: User

Measure Type: count

Aggregation Window: Time based - Daily, with weekly, monthly, term, and annual rollups


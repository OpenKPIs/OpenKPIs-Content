Metric Name: Unsubscribes
Formula: COUNT(DISTINCT subscriber_id) of ESP marketing-email unsubscribe events, by unsubscribe timestamp in the reporting period

Description: |
  Count of unique subscribers who opt out of marketing email in the period, as recorded by the ESP. Spam complaints and hard bounces are excluded; it is the numerator of unsubscribe rate.

Category: Engagement



























Metric Name: Orders Cancelled
Formula: COUNT(DISTINCT order_id) WHERE order_status = 'cancelled' AND cancelled_at BETWEEN period_start AND period_end AND checkout_completed_at IS NOT NULL AND is_test_order = FALSE

Description: |
  Orders Cancelled counts the distinct orders that completed checkout and were then cancelled in full before fulfillment, whether the customer or the merchant started it (fraud review, inventory shortfall, payment void), dated by the cancellation timestamp rather than the order date. It is the numerator of Order Cancellation Rate and the volume signal Customer Service, Finance and Fulfillment Operations use to size the revenue lost between checkout and shipment and to trace it to a root-cause reason.

Category: Operations



























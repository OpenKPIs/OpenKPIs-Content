Metric Name: Promotion Clicks
Formula: COUNT(select_promotion events) in the reporting period, excluding internal and bot traffic, grouped by promotion_id, promotion_name and creative_slot

Description: |
  Count of clicks on internal promotions such as banners and hero tiles, from the GA4 select_promotion event. It is the numerator of Promotion Click-Through Rate, with Promotion Views as the denominator.


Metric Name: Carts Created
Formula: COUNT(DISTINCT cart_id WHERE event_name = 'add_to_cart' AND cart_id IS NOT NULL AND MIN(event_timestamp) per cart_id IN reporting window AND traffic_type != 'internal')

Description: |
  Count of distinct shopping carts opened in the reporting window, one per cart_id, dated to its first add_to_cart. Unlike Add to cart, later adds to the same cart do not count again.


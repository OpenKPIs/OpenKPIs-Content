# Metric: Content Completion Rate
# Generated: 2026-09-13T20:30:13.385Z
# Contributed by: devyendarm
# Last modified by: devyendarm

Metric Name: Content Completion Rate
Formula: 100 * COUNT_DISTINCT(CASE WHEN content_completion_flag = TRUE THEN content_attempt_id END) / NULLIF(COUNT_DISTINCT(CASE WHEN eligible_content_start_flag = TRUE THEN content_attempt_id END), 0)

Description: |
  Measures the percentage of eligible digital content consumption attempts that reach the governed completion threshold for the applicable content format. It indicates whether audiences who start an asset consume enough of it to be classified as complete, enabling comparable engagement analysis across content, platforms, and audience segments.

Category: Engagement

Tags: [metric]

Industry: Media & Streaming

Priority: High

Core Area: Engagement

Scope: Item

Measure Type: percentage

Aggregation Window: Time based - Daily


  -- ==========================================
  -- 1. GOOGLE BIGQUERY SQL
  -- ==========================================
  WITH event_source AS (
    SELECT
      event_name,
      TIMESTAMP_MICROS(event_timestamp) AS collected_event_timestamp,
      user_id AS native_user_id,
      user_pseudo_id,
      platform AS native_platform,
      device.category AS native_device_type,
      device.operating_system AS native_operating_system,
      device.web_info.browser AS native_browser,
      geo.country AS native_country,
      geo.region AS native_region,
      app_info.id AS native_app_id,
      app_info.version AS native_app_version,
      ep.*
    FROM `your-project.analytics_123456789.events_*`
    CROSS JOIN UNNEST([
      (SELECT AS STRUCT
        MAX(IF(key = 'event_id', value.string_value, NULL)) AS event_id,
        MAX(IF(key = 'attempt_id', value.string_value, NULL)) AS attempt_id,
        MAX(IF(key = 'media_session_id', value.string_value, NULL)) AS media_session_id,
        MAX(IF(key = 'ga_session_id', COALESCE(value.string_value, CAST(value.int_value AS STRING)), NULL)) AS ga_session_id,
        MAX(IF(key = 'user_id', value.string_value, NULL)) AS parameter_user_id,
        MAX(IF(key = 'anonymous_id', value.string_value, NULL)) AS anonymous_id,
        MAX(IF(key = 'content_id', value.string_value, NULL)) AS content_id,
        MAX(IF(key = 'content_name', value.string_value, NULL)) AS content_name,
        MAX(IF(key = 'content_type', value.string_value, NULL)) AS content_type,
        MAX(IF(key = 'content_format', value.string_value, NULL)) AS content_format,
        MAX(IF(key = 'content_category', value.string_value, NULL)) AS content_category,
        MAX(IF(key = 'content_topic', value.string_value, NULL)) AS content_topic,
        MAX(IF(key = 'content_language', value.string_value, NULL)) AS content_language,
        MAX(IF(key = 'content_author', value.string_value, NULL)) AS content_author,
        MAX(IF(key = 'content_publisher', value.string_value, NULL)) AS content_publisher,
        MAX(IF(key = 'content_length', COALESCE(value.double_value, value.float_value, CAST(value.int_value AS FLOAT64), SAFE_CAST(value.string_value AS FLOAT64)), NULL)) AS content_length,
        MAX(IF(key = 'content_length_unit', value.string_value, NULL)) AS content_length_unit,
        MAX(IF(key = 'completion_threshold', COALESCE(value.double_value, value.float_value, CAST(value.int_value AS FLOAT64), SAFE_CAST(value.string_value AS FLOAT64)), NULL)) AS completion_threshold,
        MAX(IF(key = 'threshold_unit', value.string_value, NULL)) AS threshold_unit,
        MAX(IF(key = 'consumed_value', COALESCE(value.double_value, value.float_value, CAST(value.int_value AS FLOAT64), SAFE_CAST(value.string_value AS FLOAT64)), NULL)) AS consumed_value,
        MAX(IF(key = 'consumed_unit', value.string_value, NULL)) AS consumed_unit,
        MAX(IF(key = 'completion_percent', COALESCE(value.double_value, value.float_value, CAST(value.int_value AS FLOAT64), SAFE_CAST(value.string_value AS FLOAT64)), NULL)) AS completion_percent,
        MAX(IF(key = 'completion_status', value.string_value, NULL)) AS completion_status,
        MAX(IF(key = 'eligible_attempt', COALESCE(value.string_value, CAST(value.int_value AS STRING)), NULL)) AS eligible_attempt,
        MAX(IF(key = 'start_timestamp', value.string_value, NULL)) AS start_timestamp,
        MAX(IF(key = 'completion_timestamp', value.string_value, NULL)) AS completion_timestamp,
        MAX(IF(key = 'elapsed_time_ms', COALESCE(value.int_value, SAFE_CAST(value.string_value AS INT64)), NULL)) AS elapsed_time_ms,
        MAX(IF(key = 'player_name', value.string_value, NULL)) AS player_name,
        MAX(IF(key = 'player_version', value.string_value, NULL)) AS player_version,
        MAX(IF(key = 'autoplay', COALESCE(value.string_value, CAST(value.int_value AS STRING)), NULL)) AS autoplay,
        MAX(IF(key = 'muted', COALESCE(value.string_value, CAST(value.int_value AS STRING)), NULL)) AS muted,
        MAX(IF(key = 'playback_rate', COALESCE(value.double_value, value.float_value, CAST(value.int_value AS FLOAT64), SAFE_CAST(value.string_value AS FLOAT64)), NULL)) AS playback_rate,
        MAX(IF(key = 'stream_type', value.string_value, NULL)) AS stream_type,
        MAX(IF(key = 'quality', value.string_value, NULL)) AS quality,
        MAX(IF(key = 'platform', value.string_value, NULL)) AS parameter_platform,
        MAX(IF(key = 'page_location', value.string_value, NULL)) AS page_location,
        MAX(IF(key = 'page_referrer', value.string_value, NULL)) AS page_referrer,
        MAX(IF(key = 'page_title', value.string_value, NULL)) AS page_title,
        MAX(IF(key = 'app_id', value.string_value, NULL)) AS parameter_app_id,
        MAX(IF(key = 'app_version', value.string_value, NULL)) AS parameter_app_version,
        MAX(IF(key = 'device_type', value.string_value, NULL)) AS parameter_device_type,
        MAX(IF(key = 'operating_system', value.string_value, NULL)) AS parameter_operating_system,
        MAX(IF(key = 'browser', value.string_value, NULL)) AS parameter_browser,
        MAX(IF(key = 'country', value.string_value, NULL)) AS parameter_country,
        MAX(IF(key = 'region', value.string_value, NULL)) AS parameter_region,
        MAX(IF(key = 'audience_segment', value.string_value, NULL)) AS audience_segment,
        MAX(IF(key = 'campaign_id', value.string_value, NULL)) AS campaign_id,
        MAX(IF(key = 'analytics_consent', value.string_value, NULL)) AS analytics_consent
      FROM UNNEST(event_params))
    ]) AS ep
    WHERE _TABLE_SUFFIX BETWEEN FORMAT_DATE('%Y%m%d', DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY))
                            AND FORMAT_DATE('%Y%m%d', DATE_SUB(CURRENT_DATE(), INTERVAL 1 DAY))
      AND event_name IN ('video_start', 'video_complete')
  ),
  normalized_events AS (
    SELECT
      event_name,
      collected_event_timestamp,
      event_id,
      COALESCE(NULLIF(attempt_id, ''), NULLIF(media_session_id, '')) AS attempt_key,
      attempt_id,
      media_session_id,
      ga_session_id,
      COALESCE(NULLIF(parameter_user_id, ''), native_user_id) AS user_id,
      COALESCE(NULLIF(anonymous_id, ''), user_pseudo_id) AS anonymous_id,
      content_id,
      content_name,
      content_type,
      content_format,
      content_category,
      content_topic,
      content_language,
      content_author,
      content_publisher,
      content_length,
      content_length_unit,
      completion_threshold,
      threshold_unit,
      consumed_value,
      consumed_unit,
      completion_percent,
      LOWER(completion_status) AS completion_status,
      LOWER(eligible_attempt) IN ('true', '1', 'yes', 'y') AS eligible_attempt,
      SAFE_CAST(start_timestamp AS TIMESTAMP) AS start_timestamp,
      SAFE_CAST(completion_timestamp AS TIMESTAMP) AS completion_timestamp,
      elapsed_time_ms,
      player_name,
      player_version,
      LOWER(autoplay) IN ('true', '1', 'yes', 'y') AS autoplay,
      LOWER(muted) IN ('true', '1', 'yes', 'y') AS muted,
      playback_rate,
      stream_type,
      quality,
      COALESCE(NULLIF(parameter_platform, ''), native_platform) AS platform,
      page_location,
      page_referrer,
      page_title,
      COALESCE(NULLIF(parameter_app_id, ''), native_app_id) AS app_id,
      COALESCE(NULLIF(parameter_app_version, ''), native_app_version) AS app_version,
      COALESCE(NULLIF(parameter_device_type, ''), native_device_type) AS device_type,
      COALESCE(NULLIF(parameter_operating_system, ''), native_operating_system) AS operating_system,
      COALESCE(NULLIF(parameter_browser, ''), native_browser) AS browser,
      COALESCE(NULLIF(parameter_country, ''), native_country) AS country,
      COALESCE(NULLIF(parameter_region, ''), native_region) AS region,
      audience_segment,
      campaign_id,
      analytics_consent
    FROM event_source
    WHERE COALESCE(NULLIF(attempt_id, ''), NULLIF(media_session_id, '')) IS NOT NULL
  ),
  attempt_facts AS (
    SELECT
      attempt_key,
      MAX(attempt_id) AS attempt_id,
      MAX(media_session_id) AS media_session_id,
      MAX(ga_session_id) AS ga_session_id,
      MAX(user_id) AS user_id,
      MAX(anonymous_id) AS anonymous_id,
      MAX(content_id) AS content_id,
      MAX(content_name) AS content_name,
      MAX(content_type) AS content_type,
      MAX(content_format) AS content_format,
      MAX(content_category) AS content_category,
      MAX(content_topic) AS content_topic,
      MAX(content_language) AS content_language,
      MAX(content_author) AS content_author,
      MAX(content_publisher) AS content_publisher,
      MAX(content_length) AS content_length,
      MAX(content_length_unit) AS content_length_unit,
      MAX(completion_threshold) AS completion_threshold,
      MAX(threshold_unit) AS threshold_unit,
      MAX(consumed_value) AS consumed_value,
      MAX(consumed_unit) AS consumed_unit,
      MAX(completion_percent) AS completion_percent,
      MAX(completion_status) AS completion_status,
      LOGICAL_OR(eligible_attempt) AS eligible_attempt,
      COALESCE(MIN(start_timestamp), MIN(IF(event_name = 'video_start', collected_event_timestamp, NULL))) AS start_timestamp,
      COALESCE(MAX(completion_timestamp), MAX(IF(event_name = 'video_complete', collected_event_timestamp, NULL))) AS completion_timestamp,
      MAX(elapsed_time_ms) AS elapsed_time_ms,
      MAX(player_name) AS player_name,
      MAX(player_version) AS player_version,
      LOGICAL_OR(COALESCE(autoplay, FALSE)) AS autoplay,
      LOGICAL_OR(COALESCE(muted, FALSE)) AS muted,
      MAX(playback_rate) AS playback_rate,
      MAX(stream_type) AS stream_type,
      MAX(quality) AS quality,
      MAX(platform) AS platform,
      MAX(page_location) AS page_location,
      MAX(page_referrer) AS page_referrer,
      MAX(page_title) AS page_title,
      MAX(app_id) AS app_id,
      MAX(app_version) AS app_version,
      MAX(device_type) AS device_type,
      MAX(operating_system) AS operating_system,
      MAX(browser) AS browser,
      MAX(country) AS country,
      MAX(region) AS region,
      MAX(audience_segment) AS audience_segment,
      MAX(campaign_id) AS campaign_id,
      MAX(analytics_consent) AS analytics_consent,
      MAX(IF(event_name = 'video_start', 1, 0)) AS has_start,
      MAX(IF(event_name = 'video_complete', 1, 0)) AS has_completion,
      MAX(IF(event_name = 'video_start', event_id, NULL)) AS start_event_id,
      MAX(IF(event_name = 'video_complete', event_id, NULL)) AS completion_event_id
    FROM normalized_events
    GROUP BY attempt_key
  ),
  metric_summary AS (
    SELECT
      DATE(start_timestamp) AS reporting_date,
      content_id,
      content_name,
      content_type,
      content_format,
      content_category,
      content_topic,
      content_language,
      content_author,
      content_publisher,
      content_length,
      content_length_unit,
      completion_threshold,
      threshold_unit,
      player_name,
      player_version,
      autoplay,
      muted,
      playback_rate,
      stream_type,
      quality,
      platform,
      page_location,
      page_referrer,
      page_title,
      app_id,
      app_version,
      device_type,
      operating_system,
      browser,
      country,
      region,
      audience_segment,
      campaign_id,
      analytics_consent,
      COUNTIF(has_start = 1 AND eligible_attempt) AS eligible_attempts,
      COUNTIF(has_start = 1 AND eligible_attempt AND has_completion = 1) AS completed_attempts
    FROM attempt_facts
    GROUP BY
      reporting_date, content_id, content_name, content_type, content_format,
      content_category, content_topic, content_language, content_author,
      content_publisher, content_length, content_length_unit,
      completion_threshold, threshold_unit, player_name, player_version,
      autoplay, muted, playback_rate, stream_type, quality, platform,
      page_location, page_referrer, page_title, app_id, app_version,
      device_type, operating_system, browser, country, region,
      audience_segment, campaign_id, analytics_consent
  )
  SELECT
    *,
    ROUND(100 * SAFE_DIVIDE(completed_attempts, eligible_attempts), 2) AS content_completion_rate_percent
  FROM metric_summary
  WHERE eligible_attempts > 0;

AEP Query Service SQL: |
  -- ==========================================
  -- 2. ADOBE AEP QUERY SERVICE SQL
  -- ==========================================
  WITH event_source AS (
    SELECT
      eventType AS event_name,
      eventMergeId AS event_id,
      timestamp AS collected_event_timestamp,
      mediaCollection.customMetadata.attempt_id AS attempt_id,
      mediaCollection.sessionID AS media_session_id,
      mediaCollection.customMetadata.ga_session_id AS ga_session_id,
      identityMap['userID'][0].id AS user_id,
      identityMap['ECID'][0].id AS anonymous_id,
      mediaCollection.customMetadata.content_id AS content_id,
      mediaCollection.sessionDetails.name AS content_name,
      mediaCollection.customMetadata.content_type AS content_type,
      mediaCollection.customMetadata.content_format AS content_format,
      mediaCollection.customMetadata.content_category AS content_category,
      mediaCollection.customMetadata.content_topic AS content_topic,
      mediaCollection.customMetadata.content_language AS content_language,
      mediaCollection.customMetadata.content_author AS content_author,
      mediaCollection.customMetadata.content_publisher AS content_publisher,
      CAST(mediaCollection.sessionDetails.length AS DOUBLE PRECISION) AS content_length,
      mediaCollection.customMetadata.content_length_unit AS content_length_unit,
      CAST(mediaCollection.customMetadata.completion_threshold AS DOUBLE PRECISION) AS completion_threshold,
      mediaCollection.customMetadata.threshold_unit AS threshold_unit,
      CAST(mediaCollection.customMetadata.consumed_value AS DOUBLE PRECISION) AS consumed_value,
      mediaCollection.customMetadata.consumed_unit AS consumed_unit,
      CAST(mediaCollection.customMetadata.completion_percent AS DOUBLE PRECISION) AS completion_percent,
      LOWER(CAST(mediaCollection.customMetadata.completion_status AS VARCHAR)) AS completion_status,
      LOWER(CAST(mediaCollection.customMetadata.eligible_attempt AS VARCHAR)) IN ('true', '1', 'yes', 'y') AS eligible_attempt,
      CAST(mediaCollection.customMetadata.start_timestamp AS TIMESTAMP) AS start_timestamp,
      CAST(mediaCollection.customMetadata.completion_timestamp AS TIMESTAMP) AS completion_timestamp,
      CAST(mediaCollection.customMetadata.elapsed_time_ms AS BIGINT) AS elapsed_time_ms,
      mediaCollection.sessionDetails.playerName AS player_name,
      mediaCollection.customMetadata.player_version AS player_version,
      LOWER(CAST(mediaCollection.customMetadata.autoplay AS VARCHAR)) IN ('true', '1', 'yes', 'y') AS autoplay,
      LOWER(CAST(mediaCollection.customMetadata.muted AS VARCHAR)) IN ('true', '1', 'yes', 'y') AS muted,
      CAST(mediaCollection.customMetadata.playback_rate AS DOUBLE PRECISION) AS playback_rate,
      mediaCollection.sessionDetails.streamType AS stream_type,
      mediaCollection.customMetadata.quality AS quality,
      COALESCE(mediaCollection.customMetadata.platform, mediaCollection.sessionDetails.channel) AS platform,
      web.webPageDetails.URL AS page_location,
      web.webReferrer.URL AS page_referrer,
      web.webPageDetails.name AS page_title,
      application.id AS app_id,
      application.version AS app_version,
      device.type AS device_type,
      environment.operatingSystem AS operating_system,
      environment.browserDetails.name AS browser,
      placeContext.geo.countryCode AS country,
      placeContext.geo.stateProvince AS region,
      mediaCollection.customMetadata.audience_segment AS audience_segment,
      mediaCollection.customMetadata.campaign_id AS campaign_id,
      CASE
        WHEN LOWER(CAST(consents.collect.val AS VARCHAR)) IN ('y', 'yes', 'true', '1') THEN 'granted'
        WHEN LOWER(CAST(consents.collect.val AS VARCHAR)) IN ('n', 'no', 'false', '0') THEN 'denied'
        ELSE CAST(consents.collect.val AS VARCHAR)
      END AS analytics_consent
    FROM aep_media_event_dataset
    WHERE timestamp >= CURRENT_DATE - INTERVAL '30 days'
      AND timestamp < CURRENT_DATE
      AND eventType IN ('media.sessionStart', 'media.sessionComplete')
  ),
  normalized_events AS (
    SELECT
      *,
      COALESCE(NULLIF(attempt_id, ''), NULLIF(media_session_id, '')) AS attempt_key
    FROM event_source
    WHERE COALESCE(NULLIF(attempt_id, ''), NULLIF(media_session_id, '')) IS NOT NULL
  ),
  attempt_facts AS (
    SELECT
      attempt_key,
      MAX(attempt_id) AS attempt_id,
      MAX(media_session_id) AS media_session_id,
      MAX(ga_session_id) AS ga_session_id,
      MAX(user_id) AS user_id,
      MAX(anonymous_id) AS anonymous_id,
      MAX(content_id) AS content_id,
      MAX(content_name) AS content_name,
      MAX(content_type) AS content_type,
      MAX(content_format) AS content_format,
      MAX(content_category) AS content_category,
      MAX(content_topic) AS content_topic,
      MAX(content_language) AS content_language,
      MAX(content_author) AS content_author,
      MAX(content_publisher) AS content_publisher,
      MAX(content_length) AS content_length,
      MAX(content_length_unit) AS content_length_unit,
      MAX(completion_threshold) AS completion_threshold,
      MAX(threshold_unit) AS threshold_unit,
      MAX(consumed_value) AS consumed_value,
      MAX(consumed_unit) AS consumed_unit,
      MAX(completion_percent) AS completion_percent,
      MAX(completion_status) AS completion_status,
      MAX(CASE WHEN eligible_attempt THEN 1 ELSE 0 END) AS eligible_attempt,
      COALESCE(
        MIN(start_timestamp),
        MIN(CASE WHEN event_name = 'media.sessionStart' THEN collected_event_timestamp END)
      ) AS start_timestamp,
      COALESCE(
        MAX(completion_timestamp),
        MAX(CASE WHEN event_name = 'media.sessionComplete' THEN collected_event_timestamp END)
      ) AS completion_timestamp,
      MAX(elapsed_time_ms) AS elapsed_time_ms,
      MAX(player_name) AS player_name,
      MAX(player_version) AS player_version,
      MAX(CASE WHEN autoplay THEN 1 ELSE 0 END) AS autoplay,
      MAX(CASE WHEN muted THEN 1 ELSE 0 END) AS muted,
      MAX(playback_rate) AS playback_rate,
      MAX(stream_type) AS stream_type,
      MAX(quality) AS quality,
      MAX(platform) AS platform,
      MAX(page_location) AS page_location,
      MAX(page_referrer) AS page_referrer,
      MAX(page_title) AS page_title,
      MAX(app_id) AS app_id,
      MAX(app_version) AS app_version,
      MAX(device_type) AS device_type,
      MAX(operating_system) AS operating_system,
      MAX(browser) AS browser,
      MAX(country) AS country,
      MAX(region) AS region,
      MAX(audience_segment) AS audience_segment,
      MAX(campaign_id) AS campaign_id,
      MAX(analytics_consent) AS analytics_consent,
      MAX(CASE WHEN event_name = 'media.sessionStart' THEN 1 ELSE 0 END) AS has_start,
      MAX(CASE WHEN event_name = 'media.sessionComplete' THEN 1 ELSE 0 END) AS has_completion,
      MAX(CASE WHEN event_name = 'media.sessionStart' THEN event_id END) AS start_event_id,
      MAX(CASE WHEN event_name = 'media.sessionComplete' THEN event_id END) AS completion_event_id
    FROM normalized_events
    GROUP BY attempt_key
  ),
  metric_summary AS (
    SELECT
      CAST(start_timestamp AS DATE) AS reporting_date,
      content_id,
      content_name,
      content_type,
      content_format,
      content_category,
      content_topic,
      content_language,
      content_author,
      content_publisher,
      content_length,
      content_length_unit,
      completion_threshold,
      threshold_unit,
      player_name,
      player_version,
      autoplay,
      muted,
      playback_rate,
      stream_type,
      quality,
      platform,
      page_location,
      page_referrer,
      page_title,
      app_id,
      app_version,
      device_type,
      operating_system,
      browser,
      country,
      region,
      audience_segment,
      campaign_id,
      analytics_consent,
      COUNT(DISTINCT CASE
        WHEN has_start = 1 AND eligible_attempt = 1 THEN attempt_key
      END) AS eligible_attempts,
      COUNT(DISTINCT CASE
        WHEN has_start = 1 AND eligible_attempt = 1 AND has_completion = 1 THEN attempt_key
      END) AS completed_attempts
    FROM attempt_facts
    GROUP BY
      CAST(start_timestamp AS DATE), content_id, content_name, content_type,
      content_format, content_category, content_topic, content_language,
      content_author, content_publisher, content_length, content_length_unit,
      completion_threshold, threshold_unit, player_name, player_version,
      autoplay, muted, playback_rate, stream_type, quality, platform,
      page_location, page_referrer, page_title, app_id, app_version,
      device_type, operating_system, browser, country, region,
      audience_segment, campaign_id, analytics_consent
  )
  SELECT
    metric_summary.*,
    ROUND(
      100.0 * completed_attempts / NULLIF(eligible_attempts, 0),
      2
    ) AS content_completion_rate_percent
  FROM metric_summary
  WHERE eligible_attempts > 0;

Calculation Notes: |
  1️⃣ Count each eligible content attempt once in the denominator and no more than once in the numerator.
  2️⃣ Apply format-specific completion rules from the governed threshold table; do not use one universal threshold across video, audio, articles, and galleries.
  3️⃣ Treat a digital session as expired after 30 minutes of inactivity, while permitting a persisted content attempt to resume within 24 hours when a stable attempt identifier exists.
  4️⃣ Exclude previews, ads, background loads, bots, test traffic, telemetry retries, playback failures before qualification, and assets without a measurable endpoint.
  5️⃣ Qualify autoplay playback only after two continuous seconds; user-initiated starts qualify when valid playback or meaningful content engagement begins.
  6️⃣ Attribute a completion to the date and acquisition context of its eligible start, including completions received after the original session.
  7️⃣ Return null, not zero, when the eligible-start denominator is zero and suppress decision-grade segment comparisons below the approved sample threshold.

Business Use Case: |
  The Chief Content Officer reviews completion rate by title, episode, format, acquisition surface, and subscriber status to identify assets that generate starts but fail to sustain consumption. Content and Product teams can then adjust editorial packaging, opening sequences, episode length, recommendation placement, or playback experience and measure whether completion improves without reducing qualified starts.



Metric Name: Days Since Last Purchase
Formula: Per customer: DATE_DIFF(reporting_date, MAX(purchase_date), DAY); rolled up across customers as MEDIAN(days_since_last_purchase), with AVG(days_since_last_purchase) reported beside it

Description: |
  Whole days from a customer's most recent completed purchase to the reporting date. It is the Recency (R) input to RFM segmentation and lapse-based win-back triggers.

Category: Retention



























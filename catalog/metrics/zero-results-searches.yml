Metric Name: Zero-Results Searches
Formula: COUNT(search events WHERE search_results_count = 0 AND is_refire is not true AND search_type != 'store_locator' AND traffic_type NOT IN ('internal', 'bot')), by event date in the reporting period

Description: |
  Count of site searches that return no products: unified search events with search_results_count = 0 (Adobe null searches). Numerator of Zero-Results Search Rate over Site Searches.


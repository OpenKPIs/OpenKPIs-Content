Google Analytics SQL: |
  -- ==========================================
  -- 1. GOOGLE BIGQUERY SQL
  -- ==========================================
  -- Reporting window: last 90 complete days (event_date is already in the property time zone)
  DECLARE start_date DATE DEFAULT DATE_SUB(CURRENT_DATE(), INTERVAL 90 DAY);
  DECLARE end_date DATE DEFAULT DATE_SUB(CURRENT_DATE(), INTERVAL 1 DAY);
  
  -- Search events in the window with result count, re-fire flag, search type and traffic type pivoted from event_params
  WITH searches AS (
    SELECT
      (SELECT MAX(IF(key = 'search_results_count', COALESCE(value.int_value, SAFE_CAST(value.string_value AS INT64), CAST(value.double_value AS INT64)), NULL)) FROM UNNEST(event_params)) AS search_results_count,
      (SELECT MAX(IF(key = 'is_refire', LOWER(COALESCE(value.string_value, CAST(value.int_value AS STRING))), NULL)) FROM UNNEST(event_params)) AS is_refire,
      (SELECT MAX(IF(key = 'search_type', value.string_value, NULL)) FROM UNNEST(event_params)) AS search_type,
      (SELECT MAX(IF(key = 'traffic_type', value.string_value, NULL)) FROM UNNEST(event_params)) AS traffic_type
    FROM `your-project.analytics_123456789.events_*`
    WHERE _TABLE_SUFFIX BETWEEN FORMAT_DATE('%Y%m%d', start_date) AND FORMAT_DATE('%Y%m%d', end_date)
      AND event_name = 'search'
  )
  
  -- Zero-results searches: count exactly 0 (null is excluded), no re-fires, no store locator, no internal or bot traffic
  SELECT COUNT(*) AS zero_results_searches
  FROM searches
  WHERE search_results_count = 0
    AND IFNULL(is_refire, 'false') NOT IN ('true', '1')
    AND IFNULL(search_type, '') != 'store_locator'
    AND IFNULL(traffic_type, '') NOT IN ('internal', 'bot');

AEP Query Service SQL: |
  -- ==========================================
  -- 2. ADOBE AEP QUERY SERVICE SQL
  -- ==========================================
  -- Reporting window: last 90 complete days, dated in the property time zone (set report_tz to it)
  WITH params AS (
    SELECT date_sub(current_date(), 90) AS start_date,
           date_sub(current_date(), 1) AS end_date,
           'America/New_York' AS report_tz
  ),
  
  -- Search events with local event date, result count, re-fire flag, search type and traffic type
  searches AS (
    SELECT
      to_date(from_utc_timestamp(timestamp, params.report_tz)) AS event_date,
      _tenantId.search.searchResultsCount AS search_results_count,
      _tenantId.search.isRefire AS is_refire,
      _tenantId.search.searchType AS search_type,
      _tenantId.trafficType AS traffic_type
    FROM aep_web_events, params
    WHERE eventType = 'search'
      AND timestamp >= date_sub(params.start_date, 1)
      AND timestamp < date_add(params.end_date, 2)
  )
  
  -- Zero-results searches: count exactly 0 (null is excluded), no re-fires, no store locator, no internal or bot traffic
  SELECT COUNT(*) AS zero_results_searches
  FROM searches, params
  WHERE event_date BETWEEN params.start_date AND params.end_date
    AND search_results_count = 0
    AND COALESCE(is_refire, false) = false
    AND COALESCE(search_type, '') != 'store_locator'
    AND COALESCE(traffic_type, '') NOT IN ('internal', 'bot');

Calculation Notes: |
  1️⃣ Counts each submitted search whose search_results_count is exactly 0; same event population as Site Searches, so the two reconcile.,2️⃣ Re-fires on refresh, back button or pagination (is_refire = true) are excluded; one submitted query counts once.,3️⃣ A missing or null search_results_count is not zero; those events are excluded here and tracked as an instrumentation defect.,4️⃣ Store locator searches (search_type = store_locator) are excluded; every other search type, or none, is counted, as in Site Searches.,5️⃣ A query auto-corrected to a term that returns products is not a zero-results search; the count shown to the shopper decides.,6️⃣ Zero results after applying filters to a successful search fire filter_apply, not search, and are not counted here.,7️⃣ Bot and internal traffic are excluded via traffic_type; events are dated by event timestamp in the property time zone.

Business Use Case: |
  1️⃣ Merchandising reviews the top zero-results terms weekly and adds synonyms or redirects for the highest-volume ones.,2️⃣ Merchandising sends zero-results terms for products not stocked to Buying as assortment-gap demand signals.,3️⃣ Product compares zero-results searches before and after a search engine or catalog feed release and rolls back a spike.


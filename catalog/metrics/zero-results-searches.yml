Metric Name: Zero-Results Searches
Aliases: [Null Searches, No Results Searches, Searches with No Results]

Formula: Zero-result product search completions

Description: |
  Number of submitted product searches whose completed response contains no matching products. It helps merchandising teams identify gaps in search relevance and product assortment.

Category: Engagement

Tags: [Product search, Product discovery, Search quality]

Industry: [E-commerce, Retail]

Business Criticality: High

Journey / Navigation Area: [Discovery]

Owning Function: Merchandising

Scope: Event

Measurement Channels: [Web, Mobile App]

Measure Type: Counter

Aggregation Window: [Daily, Weekly, Monthly, Selected Reporting Period]

GA4 Event: |
  zero_results_search — completed product search with an explicit zero matching-product count


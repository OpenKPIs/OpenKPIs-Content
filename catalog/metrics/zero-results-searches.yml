Google Analytics SQL: |
  -- Bind @report_start and @report_end as UTC TIMESTAMP values; start inclusive, end exclusive.
  SELECT COUNT(*) AS zero_results_searches
  FROM `{{ga4_export_dataset}}.events_*`
  WHERE _TABLE_SUFFIX BETWEEN
    FORMAT_DATE('%Y%m%d', DATE_SUB(DATE(@report_start), INTERVAL 1 DAY))
    AND FORMAT_DATE('%Y%m%d', DATE_ADD(DATE(@report_end), INTERVAL 1 DAY))
    AND event_name = 'zero_results_search'
    AND event_timestamp >= UNIX_MICROS(@report_start)
    AND event_timestamp < UNIX_MICROS(@report_end);

AEP Query Service SQL: |
  -- Substitute report_start and report_end with UTC timestamps; start inclusive, end exclusive.
  SELECT COUNT(*) AS zero_results_searches
  FROM {{AEP_EXPERIENCE_EVENT_DATASET}}
  WHERE eventType = 'zero_results_search'
    AND timestamp >= CAST('{{report_start}}' AS TIMESTAMP)
    AND timestamp < CAST('{{report_end}}' AS TIMESTAMP);

Calculation Notes: |
  1️⃣ Emit only for a deliberate product search with a completed response and an explicit valid zero match count.
  2️⃣ Exclude errors, timeouts, missing counts, bots, staff, tests, navigation, refinements, and autocomplete requests.
  3️⃣ Evaluate final matches after query correction; unrelated recommendations do not count as matches.
  4️⃣ Date by response completion using UTC bounds: include the start and exclude the end; no events returns zero.
  5️⃣ Source uniqueness is required: emit once per submission and remove retries before export; deliberate repeats count.

Business Use Case: |
  1️⃣ Merchandising teams investigate rising counts before changing synonyms, redirects, or search rules.
  2️⃣ Assortment teams assess unmet product demand before expanding the catalog.
  3️⃣ Search teams compare counts across equivalent periods before retaining search-engine changes.



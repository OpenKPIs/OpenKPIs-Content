Metric Name: Zero-Results Searches
Formula: Count of submitted product searches with zero matching products

Description: |
  The number of submitted product searches that show no matching products to the shopper during the reporting period.

Category: Experience

Tags: [Product search, Product discovery, Search quality]

Industry: E-commerce, Retail

Priority: High

Core Area: Discovery

Scope: Event

Measure Type: Counter

Aggregation Window: Daily, Weekly, Monthly

GA4 Event: |
  Use the recommended search event with sanitized search_term. Custom parameters: search_submission_id, search_submitted_at, search_results_count, search_type, submission_kind, traffic_type, response_status. Emit the final response for a deliberate submission; retries retain its identifier and values. Configure collection to serialize text parameters as strings. Store search_results_count in exactly one GA4 value slot: integer, double, float, or a decimal string. Decimal strings representing zero must contain only an optional sign, zeros, and an optional decimal point followed by zeros. Parameter keys must occur once. Submission timestamps use RFC 3339 UTC strings. The SQL checks numeric zero directly without rounding. Register custom dimensions only where reporting requires them.

Adobe Event: |
  Configure a custom product-search completion event and map its submission identifier, submission timestamp, final result count, search type, submission kind, traffic classification, and response status to the XDM search fields shown. An Adobe Analytics custom counter may be populated through an explicitly configured integration; search or null searches is not an automatic native equivalent. The AEP query uses ExperienceEvent records, not Analytics report totals. Replace _tenantId with the configured tenant namespace in the mapping and SQL. The schema must define searchResultsCount as double, submittedAt as date-time, and the remaining search fields as strings. Configure ingestion for the custom search eventType. W3 and Adobe Client Data Layer examples require an integration to analytics. The synthetic ECID illustrates identityMap and is unnecessary for counting.


Metric Name: Item List Clicks
Formula: COUNT(select_item events) after the 2-second duplicate collapse and standard traffic exclusions; at item scope, one item per event (a payload with more than one item counts as one click, using the first item, and is flagged as a defect)

Description: |
  Item List Clicks counts every select_item interaction in which a shopper chooses a product from a merchandised list, such as a category grid, search results page, cross-sell carousel or recommendation module, keyed by item_list_id, item_list_name and the item's position (index). It is the numerator of Product List Click-Through Rate and shows merchandising and search teams which lists, placements and slots actually turn product exposure into product-detail traffic.

Category: Engagement

Tags: [metric, E-commerce: Product Discovery & Merchandising (Search/Filters/PDP), select_item, merchandising, product lists]

Industry: E-commerce

Priority: High

Core Area: Discovery

Scope: Event

Measure Type: Counter

Aggregation Window: Daily, Weekly, Monthly


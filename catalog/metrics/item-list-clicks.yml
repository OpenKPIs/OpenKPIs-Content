Metric Name: Item List Clicks
Formula: COUNT(select_item events), after 2-second duplicate collapse and standard traffic exclusions; item scope = COUNT(UNNEST(items)) within select_item

Description: |
  Item List Clicks counts every select_item interaction in which a shopper chooses a product from a merchandised list, such as a category grid, search results page, cross-sell carousel or recommendation module, keyed by item_list_id, item_list_name and the item's position (index). It is the numerator of Product List Click-Through Rate and shows merchandising and search teams which lists, placements and slots actually turn product exposure into product-detail traffic.

Category: Engagement



























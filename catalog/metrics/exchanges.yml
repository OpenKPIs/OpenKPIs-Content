Metric Name: Exchanges
Formula: COUNT(DISTINCT order_return_id WHERE resolution_type = 'Exchange')

Description: |
  Exchanges counts customer-elected return requests in which the shopper chooses a replacement item — a different size, colour or variant — instead of taking their money back. Because an exchange keeps the revenue on the books while a refund gives it away, this count is the primary volume measure retailers use to judge how well the returns experience converts would-be refunds into retained sales.


Google Analytics SQL: |
  -- ==========================================
  -- 1. GOOGLE BIGQUERY SQL
  -- ==========================================
  -- Exchanges: distinct returns-portal RMAs whose current resolution is an exchange, dated on the
  -- request creation timestamp. Even and uneven exchanges each count once; the incremental charge or
  -- partial refund of the difference belongs to Refund Amount and is never added to this counter.
  -- Test, employee and fraud/abuse flags and the non customer-elected flows (warranty replacements,
  -- damage and concession reships, pre-fulfilment order edits) are only held on the returns platform
  -- record, so the RMA table supplies those exclusions.
  DECLARE start_date DATE DEFAULT DATE_SUB(CURRENT_DATE(), INTERVAL 90 DAY);
  DECLARE end_date DATE DEFAULT CURRENT_DATE();
  DECLARE reporting_tz STRING DEFAULT 'America/New_York';
  
  WITH portal_submissions AS (
    -- Returns-portal form submissions with their event parameters pivoted onto one row per hit; scanned
    -- through today so a resolution changed after end_date still restates the original request period
    SELECT
      TIMESTAMP_MICROS(event_timestamp) AS event_ts,
      MAX(IF(ep.key = 'form_id', ep.value.string_value, NULL)) AS form_id,
      MAX(IF(ep.key = 'order_return_id', ep.value.string_value, NULL)) AS order_return_id,
      MAX(IF(ep.key = 'resolution_type', ep.value.string_value, NULL)) AS resolution_type,
      MAX(IF(ep.key = 'origination_channel', ep.value.string_value, NULL)) AS origination_channel
    FROM `your-project.analytics_123456789.events_*`, UNNEST(event_params) AS ep
    WHERE _TABLE_SUFFIX BETWEEN FORMAT_DATE('%Y%m%d', start_date) AND FORMAT_DATE('%Y%m%d', CURRENT_DATE())
      AND event_name = 'submit_form'
    GROUP BY event_ts, user_pseudo_id
    HAVING form_id = 'returns_portal_request' AND order_return_id IS NOT NULL
  ),
  
  request_state AS (
    -- Collapse every submission onto its return ID: creation time is the first submission, so portal
    -- re-renders, back navigation and a restart after the session times out add no extra request, while
    -- the newest submission carries the resolution type as it stands today
    SELECT
      order_return_id,
      DATE(MIN(event_ts) OVER (PARTITION BY order_return_id), reporting_tz) AS request_date,
      FIRST_VALUE(origination_channel) OVER (PARTITION BY order_return_id ORDER BY event_ts) AS origination_channel,
      resolution_type AS current_resolution_type,
      ROW_NUMBER() OVER (PARTITION BY order_return_id ORDER BY event_ts DESC) AS state_rank
    FROM portal_submissions
  ),
  
  excluded_requests AS (
    -- RMAs the returns platform places out of scope: internal test and employee orders, fraud or
    -- policy-abuse cases, and requests that are not customer-elected exchanges
    SELECT order_return_id
    FROM `your-project.returns_management.rma_requests`
    WHERE is_test_request
       OR is_employee_order
       OR fraud_or_abuse_flag
       OR request_type IN ('warranty_replacement', 'damage_reship', 'concession_reship', 'pre_fulfilment_order_edit')
  )
  
  -- Exchange count at RMA grain: current resolution only, which drops refund and store-credit
  -- resolutions, with self-service and agent-created requests both in scope and split by origination;
  -- a request stays counted even if the replacement is later cancelled or never ships
  SELECT
    request_date,
    origination_channel,
    COUNT(DISTINCT order_return_id) AS exchanges
  FROM request_state
  WHERE state_rank = 1
    AND current_resolution_type = 'exchange'
    AND request_date BETWEEN start_date AND end_date
    AND order_return_id NOT IN (SELECT order_return_id FROM excluded_requests)
  GROUP BY request_date, origination_channel
  ORDER BY request_date, origination_channel;

AEP Query Service SQL: |
  -- ==========================================
  -- 2. ADOBE AEP QUERY SERVICE SQL
  -- ==========================================
  -- Exchanges: distinct returns-portal RMAs whose current resolution is an exchange, dated on the
  -- request creation timestamp in the reporting timezone. Even and uneven exchanges each count once;
  -- the incremental charge or partial refund of the difference belongs to Refund Amount, not here.
  -- Test, employee and fraud/abuse flags and the non customer-elected flows (warranty replacements,
  -- damage and concession reships, pre-fulfilment order edits) are only held on the returns platform
  -- record, so the RMA dataset supplies those exclusions.
  
  WITH portal_submissions AS (
    -- Returns-portal form submissions (web.formFilledOut carrying the return request payload); scanned
    -- through today so a resolution changed after the period end still restates the request period
    SELECT
      timestamp AS event_ts,
      from_utc_timestamp(timestamp, 'America/New_York') AS event_local_ts,
      _openkpis.returnRequest.orderReturnID AS order_return_id,
      _openkpis.returnRequest.resolutionType AS resolution_type,
      _openkpis.returnRequest.originationChannel AS origination_channel
    FROM experience_events
    WHERE eventType = 'web.formFilledOut'
      AND web.webInteraction.name = 'Return Request Submitted'
      AND _openkpis.returnRequest.orderReturnID IS NOT NULL
      AND timestamp >= current_date - INTERVAL '90' DAY
  ),
  
  request_state AS (
    -- Collapse every submission onto its return ID: creation time is the first submission, so portal
    -- re-renders, back navigation and a restart after the session times out add no extra request, while
    -- the newest submission carries the resolution type as it stands today
    SELECT
      order_return_id,
      to_date(MIN(event_local_ts) OVER (PARTITION BY order_return_id)) AS request_date,
      FIRST_VALUE(origination_channel) OVER (PARTITION BY order_return_id ORDER BY event_ts) AS origination_channel,
      resolution_type AS current_resolution_type,
      ROW_NUMBER() OVER (PARTITION BY order_return_id ORDER BY event_ts DESC) AS state_rank
    FROM portal_submissions
  ),
  
  excluded_requests AS (
    -- RMAs the returns platform places out of scope: internal test and employee orders, fraud or
    -- policy-abuse cases, and requests that are not customer-elected exchanges
    SELECT orderReturnID AS order_return_id
    FROM returns_management_rma_requests
    WHERE isTestRequest = true
       OR isEmployeeOrder = true
       OR fraudOrAbuseFlag = true
       OR requestType IN ('warranty_replacement', 'damage_reship', 'concession_reship', 'pre_fulfilment_order_edit')
  )
  
  -- Exchange count at RMA grain: current resolution only, which drops refund and store-credit
  -- resolutions, with self-service and agent-created requests both in scope and split by origination;
  -- a request stays counted even if the replacement is later cancelled or never ships
  SELECT
    request_date,
    origination_channel,
    COUNT(DISTINCT order_return_id) AS exchanges
  FROM request_state
  WHERE state_rank = 1
    AND current_resolution_type = 'exchange'
    AND request_date >= current_date - INTERVAL '90' DAY
    AND request_date <= current_date
    AND order_return_id NOT IN (SELECT order_return_id FROM excluded_requests)
  GROUP BY request_date, origination_channel
  ORDER BY request_date, origination_channel;

Calculation Notes: |
  1️⃣ Grain is one row per order-return (RMA) identifier, not per line item: a single request that swaps three shirts counts as one exchange, and repeated return_initiated hits fired by portal re-renders, back-navigation or a session that times out mid-flow are collapsed on the return ID before counting.,2️⃣ Resolution type is read at its current state, not at initiation. A request opened as an exchange and later converted by the customer or an agent to a refund is removed from the exchange count and restated in the original request period, so trailing periods must be refreshed for at least the length of the returns window (typically 30–90 days).,3️⃣ Even exchanges (same price, zero balance) and uneven exchanges (a variant swap that carries an incremental charge or a partial refund of the difference) both count as one exchange each; the money movement belongs to Refund Amount and Revenue, never to this counter.,4️⃣ Timestamp used is the return request creation time in the reporting timezone, so exchanges raised against orders placed in an earlier period land in the current period. Return-rate style cohort views must join back to the order date rather than reuse this count as-is.,5️⃣ Self-service portal exchanges and agent-created exchanges are both in scope and are separated by the origination dimension; internal test RMAs, employee orders and requests flagged as fraudulent or policy-abuse are excluded.,6️⃣ A request counts once it is submitted and accepted, even if the replacement is later cancelled, expires unused or the returned goods never arrive; the shipped-replacement subset is a completion filter applied on top, not a redefinition of this metric.,7️⃣ Warranty replacements, damaged-in-transit reships, concession reships and pre-fulfilment order edits are not customer-elected exchanges and are excluded, as are store-credit resolutions, which report under refunds by refund type.

Business Use Case: |
  1️⃣ The Customer Service returns manager reviews exchanges against refunds every Monday; when the exchange share of resolutions drops week over week, they re-brief agents and adjust the portal's default resolution offer so replacement stock is proposed before a refund is granted.,2️⃣ Merchandising planners watch exchanges broken out by item variant and return reason; a size- or colour-driven spike on a style triggers a size-chart correction, updated PDP fit guidance or a supplier quality review before the next buy is placed.,3️⃣ Finance quantifies revenue retained through exchanges in the monthly returns reserve review, using the count and its average order value to size the reserve and to justify continued investment in instant-exchange capability.,4️⃣ The Product team owning the returns portal uses exchanges as the primary success measure of self-service experiments — one-click variant swap, bonus store credit, keep-and-exchange — promoting a variant only when exchanges rise without a matching rise in cancelled replacements.


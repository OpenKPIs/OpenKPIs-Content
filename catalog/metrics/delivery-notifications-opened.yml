Metric Name: Delivery Notifications Opened
Formula: COUNT(DISTINCT message_id WHERE event_name = 'notification_open' AND notification_type IN ('shipped', 'out_for_delivery', 'delivered', 'delayed') AND machine_open != true)

Description: |
  Count of unique shipment and delivery status notifications opened by customers, one per message_id, across email and push. Numerator of Delivery Notification Open Rate; read with Delivery Notifications Sent.


    bathrooms,
    floor_area,
    floor_area_unit,
    contact_method,
    consent_status,
    marketing_opt_in,
    form_id,
    form_name,
    form_location,
    page_url,
    page_title,
    referrer_url,
    channel,
    source,
    medium,
    campaign_id,
    campaign_name,
    campaign_content,
    campaign_term,
    session_id,
    client_id,
    device_type,
    language,
    source_system,
    reported_inquiry_count,
    1 AS inquiry_count,
    COUNT(*) OVER (
      PARTITION BY CAST(COALESCE(accepted_at, event_timestamp) AS DATE)
    ) AS daily_property_inquiry_count,
    COUNT(*) OVER () AS property_inquiry_count
  FROM deduplicated;

Calculation Notes: |
  Use the server-recorded accepted submission timestamp for period assignment. Count a submission only after the inquiry service returns an accepted status and assigns a persistent inquiry_id; client-side button clicks and form starts do not qualify. Multiple inquiries from the same user count separately when they have different inquiry_id values, including inquiries about different properties or intentional repeat submissions. Retries, duplicate event delivery, and repeated client/server instrumentation carrying the same inquiry_id count once. Exclude test traffic, monitoring traffic, rejected submissions, validation failures, known spam, bot-generated submissions, internal employee activity, deleted synthetic records, and records without property_id. Anonymous inquiries qualify when an inquiry_id and property_id are present. An inquiry later classified as spam or invalid may be removed through the governed restatement process.

Business Use Case: |
  The Product and marketplace leadership teams compare daily inquiry volume and view-to-inquiry conversion by market, property type, listing source, and device. If a market shows stable property-detail traffic but a material decline in inquiries, the team investigates contact-form defects, listing quality, pricing, availability, and channel mix, then prioritizes remediation or merchandising changes for the affected segment.



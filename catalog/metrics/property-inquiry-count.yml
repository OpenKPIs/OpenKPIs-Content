Google Analytics SQL: |
  -- ==========================================
  -- 1. GOOGLE BIGQUERY SQL
  -- ==========================================
  WITH extracted AS (
    SELECT
      PARSE_DATE('%Y%m%d', e.event_date) AS event_date,
      TIMESTAMP_MICROS(e.event_timestamp) AS event_timestamp,
      e.event_bundle_sequence_id,
      e.user_pseudo_id,
      (SELECT ep.value.string_value FROM UNNEST(e.event_params) ep WHERE ep.key = 'inquiry_id' LIMIT 1) AS inquiry_id,
      (SELECT ep.value.string_value FROM UNNEST(e.event_params) ep WHERE ep.key = 'submission_id' LIMIT 1) AS submission_id,
      (SELECT ep.value.string_value FROM UNNEST(e.event_params) ep WHERE ep.key = 'lead_id' LIMIT 1) AS lead_id,
      (SELECT ep.value.string_value FROM UNNEST(e.event_params) ep WHERE ep.key = 'prospect_id' LIMIT 1) AS prospect_id,
      (SELECT ep.value.string_value FROM UNNEST(e.event_params) ep WHERE ep.key = 'inquiry_type' LIMIT 1) AS inquiry_type,
      (SELECT ep.value.string_value FROM UNNEST(e.event_params) ep WHERE ep.key = 'inquiry_status' LIMIT 1) AS inquiry_status,
      COALESCE(
        (SELECT ep.value.int_value FROM UNNEST(e.event_params) ep WHERE ep.key = 'accepted' LIMIT 1),
        SAFE_CAST((SELECT ep.value.string_value FROM UNNEST(e.event_params) ep WHERE ep.key = 'accepted' LIMIT 1) AS INT64)
      ) AS accepted_int,
      LOWER((SELECT ep.value.string_value FROM UNNEST(e.event_params) ep WHERE ep.key = 'accepted' LIMIT 1)) AS accepted_string,
      COALESCE(
        (SELECT ep.value.int_value FROM UNNEST(e.event_params) ep WHERE ep.key = 'duplicate' LIMIT 1),
        SAFE_CAST((SELECT ep.value.string_value FROM UNNEST(e.event_params) ep WHERE ep.key = 'duplicate' LIMIT 1) AS INT64)
      ) AS duplicate_int,
      LOWER((SELECT ep.value.string_value FROM UNNEST(e.event_params) ep WHERE ep.key = 'duplicate' LIMIT 1)) AS duplicate_string,
      (SELECT ep.value.string_value FROM UNNEST(e.event_params) ep WHERE ep.key = 'duplicate_of_inquiry_id' LIMIT 1) AS duplicate_of_inquiry_id,
      (SELECT ep.value.string_value FROM UNNEST(e.event_params) ep WHERE ep.key = 'validation_result' LIMIT 1) AS validation_result,
      SAFE_CAST((SELECT ep.value.string_value FROM UNNEST(e.event_params) ep WHERE ep.key = 'submitted_at' LIMIT 1) AS TIMESTAMP) AS submitted_at,
      SAFE_CAST((SELECT ep.value.string_value FROM UNNEST(e.event_params) ep WHERE ep.key = 'accepted_at' LIMIT 1) AS TIMESTAMP) AS accepted_at,
      (SELECT ep.value.string_value FROM UNNEST(e.event_params) ep WHERE ep.key = 'property_listing_id' LIMIT 1) AS property_listing_id,
      (SELECT ep.value.string_value FROM UNNEST(e.event_params) ep WHERE ep.key = 'property_id' LIMIT 1) AS property_id,
      (SELECT ep.value.string_value FROM UNNEST(e.event_params) ep WHERE ep.key = 'listing_type' LIMIT 1) AS listing_type,
      (SELECT ep.value.string_value FROM UNNEST(e.event_params) ep WHERE ep.key = 'property_type' LIMIT 1) AS property_type,
      (SELECT ep.value.string_value FROM UNNEST(e.event_params) ep WHERE ep.key = 'listing_status' LIMIT 1) AS listing_status,
      (SELECT ep.value.string_value FROM UNNEST(e.event_params) ep WHERE ep.key = 'property_city' LIMIT 1) AS property_city,
      (SELECT ep.value.string_value FROM UNNEST(e.event_params) ep WHERE ep.key = 'property_region' LIMIT 1) AS property_region,
      (SELECT ep.value.string_value FROM UNNEST(e.event_params) ep WHERE ep.key = 'property_country' LIMIT 1) AS property_country,
      (SELECT ep.value.string_value FROM UNNEST(e.event_params) ep WHERE ep.key = 'property_postal_code' LIMIT 1) AS property_postal_code,
      COALESCE(
        (SELECT ep.value.double_value FROM UNNEST(e.event_params) ep WHERE ep.key = 'property_price' LIMIT 1),
        CAST((SELECT ep.value.int_value FROM UNNEST(e.event_params) ep WHERE ep.key = 'property_price' LIMIT 1) AS FLOAT64),
        SAFE_CAST((SELECT ep.value.string_value FROM UNNEST(e.event_params) ep WHERE ep.key = 'property_price' LIMIT 1) AS FLOAT64)
      ) AS property_price,
      (SELECT ep.value.string_value FROM UNNEST(e.event_params) ep WHERE ep.key = 'currency' LIMIT 1) AS currency,
      COALESCE(
        (SELECT ep.value.int_value FROM UNNEST(e.event_params) ep WHERE ep.key = 'bedrooms' LIMIT 1),
        SAFE_CAST((SELECT ep.value.string_value FROM UNNEST(e.event_params) ep WHERE ep.key = 'bedrooms' LIMIT 1) AS INT64)
      ) AS bedrooms,
      COALESCE(
        (SELECT ep.value.double_value FROM UNNEST(e.event_params) ep WHERE ep.key = 'bathrooms' LIMIT 1),
        CAST((SELECT ep.value.int_value FROM UNNEST(e.event_params) ep WHERE ep.key = 'bathrooms' LIMIT 1) AS FLOAT64),
        SAFE_CAST((SELECT ep.value.string_value FROM UNNEST(e.event_params) ep WHERE ep.key = 'bathrooms' LIMIT 1) AS FLOAT64)
      ) AS bathrooms,
      COALESCE(
        (SELECT ep.value.double_value FROM UNNEST(e.event_params) ep WHERE ep.key = 'floor_area' LIMIT 1),
        CAST((SELECT ep.value.int_value FROM UNNEST(e.event_params) ep WHERE ep.key = 'floor_area' LIMIT 1) AS FLOAT64),
        SAFE_CAST((SELECT ep.value.string_value FROM UNNEST(e.event_params) ep WHERE ep.key = 'floor_area' LIMIT 1) AS FLOAT64)
      ) AS floor_area,
      (SELECT ep.value.string_value FROM UNNEST(e.event_params) ep WHERE ep.key = 'floor_area_unit' LIMIT 1) AS floor_area_unit,
      (SELECT ep.value.string_value FROM UNNEST(e.event_params) ep WHERE ep.key = 'contact_method' LIMIT 1) AS contact_method,
      (SELECT ep.value.string_value FROM UNNEST(e.event_params) ep WHERE ep.key = 'consent_status' LIMIT 1) AS consent_status,
      COALESCE(
        (SELECT ep.value.int_value FROM UNNEST(e.event_params) ep WHERE ep.key = 'marketing_opt_in' LIMIT 1),
        SAFE_CAST((SELECT ep.value.string_value FROM UNNEST(e.event_params) ep WHERE ep.key = 'marketing_opt_in' LIMIT 1) AS INT64)
      ) AS marketing_opt_in_int,
      LOWER((SELECT ep.value.string_value FROM UNNEST(e.event_params) ep WHERE ep.key = 'marketing_opt_in' LIMIT 1)) AS marketing_opt_in_string,
      (SELECT ep.value.string_value FROM UNNEST(e.event_params) ep WHERE ep.key = 'form_id' LIMIT 1) AS form_id,
      (SELECT ep.value.string_value FROM UNNEST(e.event_params) ep WHERE ep.key = 'form_name' LIMIT 1) AS form_name,
      (SELECT ep.value.string_value FROM UNNEST(e.event_params) ep WHERE ep.key = 'form_location' LIMIT 1) AS form_location,
      COALESCE(
        (SELECT ep.value.string_value FROM UNNEST(e.event_params) ep WHERE ep.key = 'page_url' LIMIT 1),
        (SELECT ep.value.string_value FROM UNNEST(e.event_params) ep WHERE ep.key = 'page_location' LIMIT 1)
      ) AS page_url,
      (SELECT ep.value.string_value FROM UNNEST(e.event_params) ep WHERE ep.key = 'page_title' LIMIT 1) AS page_title,
      COALESCE(
        (SELECT ep.value.string_value FROM UNNEST(e.event_params) ep WHERE ep.key = 'referrer_url' LIMIT 1),
        (SELECT ep.value.string_value FROM UNNEST(e.event_params) ep WHERE ep.key = 'page_referrer' LIMIT 1)
      ) AS referrer_url,
      (SELECT ep.value.string_value FROM UNNEST(e.event_params) ep WHERE ep.key = 'channel' LIMIT 1) AS channel,
      COALESCE(
        (SELECT ep.value.string_value FROM UNNEST(e.event_params) ep WHERE ep.key = 'source' LIMIT 1),
        e.collected_traffic_source.manual_source
      ) AS source,
      COALESCE(
        (SELECT ep.value.string_value FROM UNNEST(e.event_params) ep WHERE ep.key = 'medium' LIMIT 1),
        e.collected_traffic_source.manual_medium
      ) AS medium,
      COALESCE(
        (SELECT ep.value.string_value FROM UNNEST(e.event_params) ep WHERE ep.key = 'campaign_id' LIMIT 1),
        e.collected_traffic_source.manual_campaign_id
      ) AS campaign_id,
      COALESCE(
        (SELECT ep.value.string_value FROM UNNEST(e.event_params) ep WHERE ep.key = 'campaign_name' LIMIT 1),
        e.collected_traffic_source.manual_campaign_name
      ) AS campaign_name,
      COALESCE(
        (SELECT ep.value.string_value FROM UNNEST(e.event_params) ep WHERE ep.key = 'campaign_content' LIMIT 1),
        e.collected_traffic_source.manual_content
      ) AS campaign_content,
      COALESCE(
        (SELECT ep.value.string_value FROM UNNEST(e.event_params) ep WHERE ep.key = 'campaign_term' LIMIT 1),
        e.collected_traffic_source.manual_term
      ) AS campaign_term,
      COALESCE(
        (SELECT ep.value.string_value FROM UNNEST(e.event_params) ep WHERE ep.key = 'session_id' LIMIT 1),
        CAST((SELECT ep.value.int_value FROM UNNEST(e.event_params) ep WHERE ep.key = 'ga_session_id' LIMIT 1) AS STRING)
      ) AS session_id,
      COALESCE(
        (SELECT ep.value.string_value FROM UNNEST(e.event_params) ep WHERE ep.key = 'client_id' LIMIT 1),
        e.user_pseudo_id
      ) AS client_id,
      COALESCE(
        (SELECT ep.value.string_value FROM UNNEST(e.event_params) ep WHERE ep.key = 'device_type' LIMIT 1),
        e.device.category
      ) AS device_type,
      COALESCE(
        (SELECT ep.value.string_value FROM UNNEST(e.event_params) ep WHERE ep.key = 'language' LIMIT 1),
        e.device.language
      ) AS language,
      (SELECT ep.value.string_value FROM UNNEST(e.event_params) ep WHERE ep.key = 'source_system' LIMIT 1) AS source_system,
      COALESCE(
        (SELECT ep.value.int_value FROM UNNEST(e.event_params) ep WHERE ep.key = 'inquiry_count' LIMIT 1),
        SAFE_CAST((SELECT ep.value.string_value FROM UNNEST(e.event_params) ep WHERE ep.key = 'inquiry_count' LIMIT 1) AS INT64)
      ) AS reported_inquiry_count
    FROM `your-project.analytics_123456789.events_*` e
    WHERE _TABLE_SUFFIX BETWEEN FORMAT_DATE('%Y%m%d', @start_date) AND FORMAT_DATE('%Y%m%d', @end_date)
      AND e.event_name = 'generate_lead'
  ),
  validated AS (
    SELECT
      *,
      COALESCE(accepted_int = 1, accepted_string = 'true', FALSE) AS accepted,
      COALESCE(duplicate_int = 1, duplicate_string = 'true', FALSE) AS duplicate,
      COALESCE(marketing_opt_in_int = 1, marketing_opt_in_string = 'true', FALSE) AS marketing_opt_in
    FROM extracted
    WHERE inquiry_id IS NOT NULL
  ),
  deduplicated AS (
    SELECT * EXCEPT(row_number)
    FROM (
      SELECT
        *,
        ROW_NUMBER() OVER (
          PARTITION BY inquiry_id
          ORDER BY COALESCE(accepted_at, event_timestamp) ASC, event_timestamp ASC, event_bundle_sequence_id ASC
        ) AS row_number
      FROM validated
      WHERE accepted = TRUE
        AND duplicate = FALSE
        AND inquiry_status = 'accepted'
        AND validation_result = 'accepted_non_duplicate'
    )
    WHERE row_number = 1
  )
  SELECT
    event_date,
    DATE(COALESCE(accepted_at, event_timestamp)) AS inquiry_date,
    event_timestamp,
    submitted_at,
    accepted_at,
    inquiry_id,
    submission_id,
    lead_id,
    prospect_id,
    inquiry_type,
    inquiry_status,
    accepted,
    duplicate,
    duplicate_of_inquiry_id,
    validation_result,
    property_listing_id,
    property_id,
    listing_type,
    property_type,
    listing_status,
    property_city,
    property_region,
    property_country,
    property_postal_code,
    property_price,
    currency,
    bedrooms,
    bathrooms,
    floor_area,
    floor_area_unit,
    contact_method,
    consent_status,
    marketing_opt_in,
    form_id,
    form_name,
    form_location,
    page_url,
    page_title,
    referrer_url,
    channel,
    source,
    medium,
    campaign_id,
    campaign_name,
    campaign_content,
    campaign_term,
    session_id,
    client_id,
    device_type,
    language,
    source_system,
    reported_inquiry_count,
    1 AS inquiry_count,
    COUNT(*) OVER (PARTITION BY DATE(COALESCE(accepted_at, event_timestamp))) AS daily_property_inquiry_count,
    COUNT(*) OVER () AS property_inquiry_count
  FROM deduplicated;

AEP Query Service SQL: |
  -- ==========================================
  -- 2. ADOBE AEP QUERY SERVICE SQL
  -- ==========================================
  WITH extracted AS (
    SELECT
      CAST(e.timestamp AS TIMESTAMP) AS event_timestamp,
      e._id AS experience_event_id,
      e._propertyInquiry.inquiryId AS inquiry_id,
      e._propertyInquiry.submissionId AS submission_id,
      e._propertyInquiry.leadId AS lead_id,
      e._propertyInquiry.prospectId AS prospect_id,
      e._propertyInquiry.inquiryType AS inquiry_type,
      e._propertyInquiry.inquiryStatus AS inquiry_status,
      e._propertyInquiry.accepted AS accepted,
      e._propertyInquiry.duplicate AS duplicate,
      e._propertyInquiry.duplicateOfInquiryId AS duplicate_of_inquiry_id,
      e._propertyInquiry.validationResult AS validation_result,
      CAST(e._propertyInquiry.submittedAt AS TIMESTAMP) AS submitted_at,
      CAST(e._propertyInquiry.acceptedAt AS TIMESTAMP) AS accepted_at,
      e._propertyInquiry.propertyListingId AS property_listing_id,
      e._propertyInquiry.propertyId AS property_id,
      e._propertyInquiry.listingType AS listing_type,
      e._propertyInquiry.propertyType AS property_type,
      e._propertyInquiry.listingStatus AS listing_status,
      e._propertyInquiry.propertyCity AS property_city,
      e._propertyInquiry.propertyRegion AS property_region,
      e._propertyInquiry.propertyCountry AS property_country,
      e._propertyInquiry.propertyPostalCode AS property_postal_code,
      CAST(e._propertyInquiry.propertyPrice AS DECIMAL(18,2)) AS property_price,
      e._propertyInquiry.currency AS currency,
      CAST(e._propertyInquiry.bedrooms AS INTEGER) AS bedrooms,
      CAST(e._propertyInquiry.bathrooms AS DECIMAL(8,2)) AS bathrooms,
      CAST(e._propertyInquiry.floorArea AS DECIMAL(18,2)) AS floor_area,
      e._propertyInquiry.floorAreaUnit AS floor_area_unit,
      e._propertyInquiry.contactMethod AS contact_method,
      e._propertyInquiry.consentStatus AS consent_status,
      e._propertyInquiry.marketingOptIn AS marketing_opt_in,
      e._propertyInquiry.formId AS form_id,
      e._propertyInquiry.formName AS form_name,
      e._propertyInquiry.formLocation AS form_location,
      COALESCE(e._propertyInquiry.pageUrl, e.web.webPageDetails.URL) AS page_url,
      COALESCE(e._propertyInquiry.pageTitle, e.web.webPageDetails.name) AS page_title,
      COALESCE(e._propertyInquiry.referrerUrl, e.web.webReferrer.URL) AS referrer_url,
      e._propertyInquiry.channel AS channel,
      e._propertyInquiry.source AS source,
      e._propertyInquiry.medium AS medium,
      e._propertyInquiry.campaignId AS campaign_id,
      e._propertyInquiry.campaignName AS campaign_name,
      e._propertyInquiry.campaignContent AS campaign_content,
      e._propertyInquiry.campaignTerm AS campaign_term,
      e._propertyInquiry.sessionId AS session_id,
      e._propertyInquiry.clientId AS client_id,
      e._propertyInquiry.deviceType AS device_type,
      e._propertyInquiry.language AS language,
      e._propertyInquiry.sourceSystem AS source_system,
      CAST(e._propertyInquiry.inquiryCount AS BIGINT) AS reported_inquiry_count
    FROM property_inquiry_experience_event_dataset e
    WHERE e.eventType = 'generate_lead'
      AND e.timestamp >= CAST(:start_timestamp AS TIMESTAMP)
      AND e.timestamp < CAST(:end_timestamp AS TIMESTAMP)
  ),
  validated AS (
    SELECT *
    FROM extracted
    WHERE inquiry_id IS NOT NULL
      AND accepted = TRUE
      AND duplicate = FALSE
      AND inquiry_status = 'accepted'
      AND validation_result = 'accepted_non_duplicate'
  ),
  ranked AS (
    SELECT
      *,
      ROW_NUMBER() OVER (
        PARTITION BY inquiry_id
        ORDER BY COALESCE(accepted_at, event_timestamp) ASC, event_timestamp ASC, experience_event_id ASC
      ) AS row_number
    FROM validated
  ),
  deduplicated AS (
    SELECT *
    FROM ranked
    WHERE row_number = 1
  )
  SELECT
    CAST(COALESCE(accepted_at, event_timestamp) AS DATE) AS inquiry_date,
    event_timestamp,
    submitted_at,
    accepted_at,
    experience_event_id,
    inquiry_id,
    submission_id,
    lead_id,
    prospect_id,

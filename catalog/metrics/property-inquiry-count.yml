Metric Name: Property Inquiry Count
Formula: COUNT(DISTINCT inquiry_id) FILTER (WHERE event_name = 'property_inquiry_submitted' AND submission_status = 'accepted' AND property_id IS NOT NULL AND is_test = false AND is_spam = false)

Description: |
  Counts accepted, non-duplicate inquiries submitted by prospective customers about identifiable property listings during the reporting period. Each distinct inquiry is counted once, including multiple legitimate inquiries from the same person when they represent separate submissions.

Category: Conversion

Tags: [metric]

Industry: Real Estate Tech

Priority: High

Core Area: Discovery

Scope: Event

Measure Type: count

Aggregation Window: Time based - Hourly/Daily/Monthly/Yearly


Metric Name: Search Exits
Aliases: [Search Results Exits, SRP Exits, Search Exit Count]

Formula: Sessions ending on search results

Description: |
  Number of completed visits whose final page is a site search results page. It helps merchandising teams identify searches that leave shoppers without a useful next step.

Category: Engagement

Tags: [site search, search exits, product discovery]

Industry: [E-commerce, Retail]

Business Criticality: High

Journey / Navigation Area: [Discovery]

Owning Function: Merchandising

Scope: Session

Measurement Channels: [Web]

Measure Type: Counter

Aggregation Window: [Daily, Weekly, Monthly, Selected Reporting Period]


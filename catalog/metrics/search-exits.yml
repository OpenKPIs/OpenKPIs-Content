Google Analytics SQL: |
  -- Bind report_start and report_end as UTC TIMESTAMP values.
  WITH closures AS (
    SELECT
      (SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'session_id') AS session_id,
      (SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'final_page_type') AS final_page_type,
      (SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'final_search_type') AS final_search_type,
      (SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'traffic_type') AS traffic_type
    FROM `project.analytics.events_*`
    WHERE _TABLE_SUFFIX BETWEEN FORMAT_DATE('%Y%m%d', DATE_SUB(DATE(@report_start), INTERVAL 1 DAY))
      AND FORMAT_DATE('%Y%m%d', DATE_ADD(DATE(@report_end), INTERVAL 1 DAY))
      AND event_name = 'session_closed'
      AND event_timestamp >= UNIX_MICROS(@report_start)
      AND event_timestamp < UNIX_MICROS(@report_end)
  )
  SELECT COUNT(DISTINCT session_id) AS search_exits
  FROM closures
  WHERE session_id IS NOT NULL AND session_id <> ''
    AND final_page_type = 'search_results'
    AND final_search_type <> 'store_locator'
    AND traffic_type NOT IN ('internal', 'bot');

AEP Query Service SQL: |
  -- Substitute report bounds with UTC timestamps; execute in a UTC SQL session.
  SELECT COUNT(DISTINCT _openkpis.session_id) AS search_exits
  FROM {{AEP_EXPERIENCE_EVENT_DATASET}}
  WHERE eventType = 'session_closed'
    AND timestamp >= CAST('{{REPORT_START_UTC}}' AS TIMESTAMP)
    AND timestamp < CAST('{{REPORT_END_UTC}}' AS TIMESTAMP)
    AND _openkpis.session_id IS NOT NULL
    AND _openkpis.session_id <> ''
    AND _openkpis.final_page_type = 'search_results'
    AND _openkpis.final_search_type <> 'store_locator'
    AND _openkpis.traffic_type NOT IN ('internal', 'bot');

Calculation Notes: |
  1️⃣ Close visits using the configured inactivity rule; activity after closure starts a new visit.
  2️⃣ Freeze the last page at closure; include zero-result searches and ignore non-page activity in page selection.
  3️⃣ Require complete, immutable closures with globally unique anonymous Session IDs; count retries once.
  4️⃣ Use UTC closure time with inclusive report start and exclusive report end before counting sessions.
  5️⃣ Exclude store-locator searches and visits classified as internal or bot using whole-visit traffic classification.

Business Use Case: |
  1️⃣ Merchandising investigates rising search exits and adjusts ranking or search navigation.
  2️⃣ Product teams compare exit counts before and after search interface changes alongside search volume.



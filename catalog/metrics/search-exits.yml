Metric Name: Search Exits
Formula: COUNT(DISTINCT session_key) WHERE the session's last page_view is a search results view (view_search_results); session_key = user_pseudo_id.ga_session_id

Description: |
  Count of sessions that end on a site search results page, meaning the shopper searched and left without clicking further. It is the numerator of Search Exit Rate.

Category: Engagement


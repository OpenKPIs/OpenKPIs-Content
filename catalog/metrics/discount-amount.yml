Metric Name: Discount Amount
Formula: SUM(item_discount × item_quantity) across all items on purchase events in the reporting period, expressed in the reporting currency

Description: |
  Discount Amount is the total monetary value of promotional price reductions — item markdowns, coupon codes and allocated cart-level offers — applied to completed purchases in the reporting period. It quantifies how much revenue the business gives back at checkout to convert demand, and it is the bridge line between gross merchandise value and net revenue in trading and margin reviews.

Category: Monetization



























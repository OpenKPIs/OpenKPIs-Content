Google Analytics SQL: |
  -- ==========================================
  -- 1. GOOGLE BIGQUERY SQL
  -- ==========================================
  -- Metric: Discount Amount (Currency, event scope) — total promotional price reduction on completed purchases.
  -- Source: GA4 BigQuery export, unified `purchase` event, item-level promotional fields.
  -- Semantics: the item `discount` parameter lands in items.item_params (key 'discount') as a PER-UNIT
  --            reduction, so every line contributes discount * items.quantity. Summing discount alone
  --            understates multi-unit lines. items.price is the paid unit price; list price = price + discount.
  -- Output grain: order_date x coupon_code x item_category, converted to one reporting currency.
  
  DECLARE start_date DATE DEFAULT DATE_SUB(CURRENT_DATE(), INTERVAL 28 DAY);
  DECLARE end_date   DATE DEFAULT DATE_SUB(CURRENT_DATE(), INTERVAL 1 DAY);
  DECLARE reporting_currency STRING DEFAULT 'USD';
  
  WITH raw_purchases AS (
    SELECT
      PARSE_DATE('%Y%m%d', event_date)      AS order_date,
      event_timestamp,
      user_pseudo_id,
      device.category                        AS device_category,
      -- Event-level parameters are pivoted once per event; they are never predicated key by key in one WHERE.
      (SELECT AS STRUCT
         MAX(IF(key = 'transaction_id', COALESCE(value.string_value, CAST(value.int_value AS STRING)), NULL)) AS transaction_id,
         MAX(IF(key = 'currency',         value.string_value, NULL)) AS currency,
         MAX(IF(key = 'coupon',           value.string_value, NULL)) AS order_coupon,
         MAX(IF(key = 'checkout_type',    value.string_value, NULL)) AS checkout_type,
         MAX(IF(key = 'customer_segment', value.string_value, NULL)) AS customer_segment,
         MAX(IF(key = 'ga_session_id',    value.int_value, NULL))    AS ga_session_id,
         -- Internal traffic is flagged by the GA4 'traffic_type' event parameter (internal-traffic data filter rule).
         MAX(IF(key = 'traffic_type',     value.string_value, NULL)) AS traffic_type
       FROM UNNEST(event_params))           AS ep,
      items
    FROM `your-project.analytics_123456789.events_*`
    WHERE _TABLE_SUFFIX BETWEEN FORMAT_DATE('%Y%m%d', start_date)
                            AND FORMAT_DATE('%Y%m%d', end_date)
      AND event_name = 'purchase'
  ),
  
  flattened_purchases AS (
    SELECT
      order_date,
      event_timestamp,
      user_pseudo_id,
      device_category,
      ep.transaction_id                               AS transaction_id,
      UPPER(COALESCE(ep.currency, reporting_currency)) AS currency,
      ep.order_coupon                                  AS order_coupon,
      ep.checkout_type                                 AS checkout_type,
      ep.customer_segment                              AS customer_segment,
      ep.ga_session_id                                 AS ga_session_id,
      items
    FROM raw_purchases
    WHERE ep.transaction_id IS NOT NULL
      AND NOT STARTS_WITH(UPPER(ep.transaction_id), 'TEST')
      AND COALESCE(ep.traffic_type, '') <> 'internal'
  ),
  
  -- One row per order: duplicate purchase hits are removed, the earliest occurrence wins.
  deduplicated_orders AS (
    SELECT * EXCEPT (occurrence)
    FROM (
      SELECT
        fp.*,
        ROW_NUMBER() OVER (PARTITION BY transaction_id ORDER BY event_timestamp ASC) AS occurrence
      FROM flattened_purchases AS fp
    )
    WHERE occurrence = 1
  ),
  
  item_lines AS (
    SELECT
      o.order_date,
      o.transaction_id,
      o.currency,
      o.device_category,
      o.checkout_type,
      o.customer_segment,
      COALESCE(it.coupon, o.order_coupon, '(none)') AS coupon_code,
      COALESCE(it.promotion_name, '(not set)')      AS promotion_name,
      COALESCE(it.item_category, '(not set)')       AS item_category,
      COALESCE(it.item_brand, '(not set)')          AS item_brand,
      it.item_id                                    AS item_id,
      -- PER-UNIT discount extended by the units sold on the line.
      COALESCE(d.unit_discount, 0) * COALESCE(it.quantity, 0)                          AS line_discount_amount,
      -- GA4 price is the paid (post-discount) unit price, so list value = (price + discount) * quantity.
      (COALESCE(it.price, 0) + COALESCE(d.unit_discount, 0)) * COALESCE(it.quantity, 0) AS line_gross_item_revenue
    FROM deduplicated_orders AS o
    CROSS JOIN UNNEST(o.items) AS it
    -- The items record has no discount column: the per-unit discount is read from item_params (key 'discount').
    LEFT JOIN UNNEST([STRUCT(
      (SELECT COALESCE(ip.value.double_value, ip.value.float_value,
                       CAST(ip.value.int_value AS FLOAT64), SAFE_CAST(ip.value.string_value AS FLOAT64))
       FROM UNNEST(it.item_params) AS ip
       WHERE ip.key = 'discount') AS unit_discount
    )]) AS d
  ),
  
  -- Mixed-currency sums are invalid: every line is converted at the order-date rate.
  converted_lines AS (
    SELECT
      l.*,
      CASE
        WHEN l.currency = reporting_currency THEN 1.0
        ELSE fx.fx_rate
      END AS fx_rate
    FROM item_lines AS l
    LEFT JOIN `your-project.finance.fx_daily_rates` AS fx
      ON  fx.rate_date     = l.order_date
      AND fx.from_currency = l.currency
      AND fx.to_currency   = reporting_currency
  )
  
  SELECT
    order_date,
    coupon_code,
    item_category,
    reporting_currency                                                               AS reporting_currency,
    ROUND(SUM(line_discount_amount * fx_rate), 2)                                    AS discount_amount,
    ROUND(SUM(line_gross_item_revenue * fx_rate), 2)                                 AS gross_item_revenue,
    COUNT(DISTINCT transaction_id)                                                   AS orders,
    ROUND(SAFE_DIVIDE(SUM(line_discount_amount * fx_rate),
                      COUNT(DISTINCT transaction_id)), 2)                            AS discount_amount_per_order,
    -- Discount depth: the discount given over the full gross item revenue of the same order population.
    ROUND(SAFE_DIVIDE(SUM(line_discount_amount * fx_rate),
                      NULLIF(SUM(line_gross_item_revenue * fx_rate), 0)) * 100, 2)   AS discount_depth_pct
  FROM converted_lines
  WHERE fx_rate IS NOT NULL   -- currencies missing from the rate table are fixed upstream, never summed raw
  GROUP BY order_date, coupon_code, item_category, reporting_currency
  ORDER BY order_date DESC, discount_amount DESC;

AEP Query Service SQL: |
  -- ==========================================
  -- 2. ADOBE AEP QUERY SERVICE SQL
  -- ==========================================
  -- Metric: Discount Amount (Currency, event scope) — total promotional price reduction on completed purchases.
  -- Source: XDM ExperienceEvent dataset, eventType = 'commerce.purchases', productListItems array.
  -- Semantics: XDM productListItems.discountAmount is the LINE TOTAL (already extended by quantity),
  --            so it is summed as emitted and never multiplied by productListItems.quantity again.
  -- Output grain: order_date x coupon_code x product_category, converted to one reporting currency.
  
  WITH purchase_events AS (
    SELECT
      to_date(timestamp)                                        AS order_date,
      timestamp                                                 AS event_timestamp,
      commerce.order.purchaseID                                 AS transaction_id,
      upper(coalesce(commerce.order.currencyCode, 'USD'))       AS currency,
      commerce.promotionID                                      AS promotion_id,
      _experience.analytics.customDimensions.eVars.eVar12.value AS order_coupon_code,
      _experience.analytics.customDimensions.eVars.eVar14.value AS checkout_type,
      productListItems                                          AS product_list_items
    FROM your_analytics_events_dataset
    WHERE eventType = 'commerce.purchases'
      AND timestamp >= current_date - interval '28 day'
      AND timestamp <  current_date
      AND commerce.order.purchaseID IS NOT NULL
      AND upper(commerce.order.purchaseID) NOT LIKE 'TEST%'
      -- Internal traffic is excluded, mirroring the GA4 traffic_type <> 'internal' filter:
      -- the tenant custom traffic-type flag is set to 'internal' for office IPs / employee sessions.
      -- Replace _tenant with the tenant namespace of your organisation.
      AND coalesce(_tenant.trafficType, '') <> 'internal'
  ),
  
  -- One row per order: duplicate purchase beacons are removed, the earliest occurrence wins.
  deduplicated_orders AS (
    SELECT
      order_date,
      transaction_id,
      currency,
      checkout_type,
      promotion_id,
      order_coupon_code,
      product_list_items
    FROM (
      SELECT
        pe.*,
        row_number() OVER (PARTITION BY transaction_id ORDER BY event_timestamp ASC) AS occurrence
      FROM purchase_events AS pe
    ) AS ranked
    WHERE occurrence = 1
  ),
  
  item_lines AS (
    SELECT
      order_date,
      transaction_id,
      currency,
      checkout_type,
      promotion_id,
      order_coupon_code,
      explode(product_list_items) AS item
    FROM deduplicated_orders
  ),
  
  normalized_lines AS (
    SELECT
      order_date,
      transaction_id,
      currency,
      checkout_type,
      coalesce(item.couponCode, order_coupon_code, '(none)')          AS coupon_code,
      coalesce(item.productCategory, '(not set)')                     AS product_category,
      item.SKU                                                        AS sku,
      -- LINE TOTAL discount, taken as emitted by the XDM schema.
      coalesce(item.discountAmount, 0)                                AS line_discount_amount,
      coalesce(item.priceTotal, 0) + coalesce(item.discountAmount, 0) AS line_gross_item_revenue
    FROM item_lines
  ),
  
  -- Mixed-currency sums are invalid: every line is converted at the order-date rate.
  converted_lines AS (
    SELECT
      l.*,
      CASE WHEN l.currency = 'USD' THEN 1.0 ELSE fx.fx_rate END AS fx_rate
    FROM normalized_lines AS l
    LEFT JOIN fx_daily_rates AS fx
      ON  fx.rate_date     = l.order_date
      AND fx.from_currency = l.currency
      AND fx.to_currency   = 'USD'
  )
  
  SELECT
    order_date,
    coupon_code,
    product_category,
    'USD'                                                              AS reporting_currency,
    round(sum(line_discount_amount * fx_rate), 2)                      AS discount_amount,
    round(sum(line_gross_item_revenue * fx_rate), 2)                   AS gross_item_revenue,
    count(DISTINCT transaction_id)                                     AS orders,
    round(sum(line_discount_amount * fx_rate)
          / nullif(count(DISTINCT transaction_id), 0), 2)              AS discount_amount_per_order,
    -- Discount depth: the discount given over the full gross item revenue of the same order population.
    round(100 * sum(line_discount_amount * fx_rate)
          / nullif(sum(line_gross_item_revenue * fx_rate), 0), 2)      AS discount_depth_pct
  FROM converted_lines
  WHERE fx_rate IS NOT NULL   -- currencies missing from the rate table are fixed upstream, never summed raw
  GROUP BY order_date, coupon_code, product_category
  ORDER BY order_date DESC, discount_amount DESC;

Calculation Notes: |
  1️⃣ Summed from the items array of the purchase event: GA4 carries `discount` at item level as a PER-UNIT reduction, so each line contributes discount × quantity. Summing `discount` alone understates every multi-unit line and is the single most common implementation defect in this metric. In the BigQuery export the items record has no discount column, so the per-unit value is read from items.item_params (key 'discount'); in XDM, productListItems.discountAmount is already the line total and is summed as emitted.,2️⃣ Cart-level offers (basket coupons, spend-and-save thresholds, loyalty-point redemptions) are allocated to item lines pro rata by item revenue before the purchase event fires, so that Discount Amount reconciles to the order total; unallocated order-level reductions are excluded rather than double counted at the transaction level.,3️⃣ Currency handling: item `discount` is emitted in the transaction currency carried by the event-level `currency` parameter. Values are converted to the single reporting currency at the order-date rate before aggregation — mixed-currency sums are invalid and must never be reported as one figure.,4️⃣ Exclusions applied in both SQLs: test orders (transaction IDs prefixed TEST) and internal traffic — events whose GA4 `traffic_type` event parameter is 'internal' (set by the internal-traffic data filter rule) and, in Adobe, events whose tenant custom traffic-type flag (`_tenant.trafficType`) is 'internal'; duplicate purchase hits are removed by de-duplicating on transaction_id and keeping the first occurrence. Cancellations and fraud reversals are not visible in the purchase event and are handled in the order-management reconciliation, not in this query. Refunds are not netted inside this metric — they are reported separately as refunded value in the period the refund posts, keeping the discount and returns ledgers independent.,5️⃣ Out of scope by definition: shipping discounts and free-shipping credits (reported with shipping revenue), tax adjustments, and gift-card or store-credit tender, which is a payment method rather than a price reduction. In GA4, item `price` is the paid (post-discount) unit price and `discount` is the per-unit reduction, so the list price is price + discount; only that per-unit reduction, extended by quantity, is counted.,6️⃣ Timing: the value is attributed to the purchase timestamp in the property time zone, never to coupon issue or coupon apply time. Server-side and late-arriving purchase events are backfilled for up to 72 hours, so intraday and current-day figures are provisional and are restated at T+3.,7️⃣ Session rules: the metric is transaction-scoped, not session-scoped. GA4's 30-minute inactivity timeout can split a checkout across two sessions, but the purchase event always carries the complete items array — when the figure is broken out by session or channel, aggregate at transaction_id level first so a single order is never counted in two sessions.

Business Use Case: |
  1️⃣ The Merchandising promotions manager reviews Discount Amount by coupon code and product category every Monday; when discount depth on a category exceeds its planned markdown budget for the month, the offending code is capped or retired in the promotions engine before the next trading week.,2️⃣ Finance FP&A reconciles Discount Amount to the gross-to-net bridge at each month close; a variance above 2% against the ERP discounts line raises a data-quality ticket with the checkout team and holds the net revenue restatement until the item-level allocation is corrected.,3️⃣ The CRM and lifecycle marketing lead compares Discount Amount per order for coupon-assisted versus organic orders by customer segment; where the incremental order value fails to cover the discount given, that segment is moved off price-led offers onto free shipping or loyalty points in the next campaign wave.,4️⃣ The E-commerce trading team monitors daily Discount Amount against forecast; an unexplained single-day spike concentrated on one coupon code triggers a code-leakage investigation with Customer Service and immediate deactivation of the code at checkout.


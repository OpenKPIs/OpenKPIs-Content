Metric Name: Order Tracking Page Views
Formula: COUNT(page_view) WHERE page_type IN ('order_status', 'order_tracking') AND traffic_type <> 'internal'

Description: |
  Total number of standard page_view hits on the order status and shipment tracking page templates (page_type = order_status or order_tracking), counting every time a customer opens a post-purchase tracking surface on the owned site, account area or branded tracking subdomain. It is the web-side volume of 'where is my order' demand that feeds WISMO Rate, and it measures page exposure only, unlike Order Status Check (a submitted order lookup) and Shipment Tracking View (a rendered carrier tracking timeline).

Category: Experience

Tags: [metric, Post-Purchase Logistics & Fulfillment]

Industry: E-commerce

Priority: High

Core Area: Engagement

Scope: Event

Measure Type: Counter

Aggregation Window: Daily, Weekly, Monthly


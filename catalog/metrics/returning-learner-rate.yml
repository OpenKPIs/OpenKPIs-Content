Metric Name: Returning Learner Rate
Formula: 100 * COUNT(DISTINCT CASE WHEN qualifying_activity_timestamp >= period_start AND qualifying_activity_timestamp < period_end AND first_qualifying_activity_timestamp < period_start THEN learner_id END) / NULLIF(COUNT(DISTINCT CASE WHEN qualifying_activity_timestamp >= period_start AND qualifying_activity_timestamp < period_end THEN learner_id END), 0)

Description: |
  Measures the percentage of distinct active learners in a reporting period who completed at least one qualifying learning activity before that period began. It quantifies the share of current learning engagement generated by previously active learners rather than first-time learners.

Category: Retention

Tags: [metric]

Industry: EdTech & E-Learning

Priority: High

Core Area: Engagement

Scope: User

Measure Type: percentage

Aggregation Window: Time based - Daily/Weekly/Monthly


      e.academic_year,
      e.enrollment_id,
      e.enrollment_status,
      e.enrollment_role,
      e.enrollment_type,
      e.delivery_mode,
      e.campus_id,
      e.campus_name,
      e.department_id,
      e.department_name,
      e.program_id,
      e.program_name,
      s.assessment_id,
      s.assessment_external_id,
      s.assessment_name,
      s.assessment_type,
      s.assessment_category,
      s.assessment_version,
      s.assessment_status,
      s.grading_method,
      COALESCE(s.attempt_scoring_policy, 'latest') AS attempt_scoring_policy,
      s.max_attempts,
      s.time_limit_minutes,
      s.points_possible,
      g.gradebook_item_id,
      g.gradebook_item_name,
      g.gradebook_category,
      COALESCE(g.grade_status, 'attempt_only') AS grade_status,
      CASE
        WHEN LOWER(g.grade_status) IN ('final', 'posted', 'graded')
         AND (g.score_percentage IS NOT NULL OR COALESCE(g.points_possible, s.points_possible) > 0)
          THEN 'gradebook'
        ELSE 'assessment_attempt'
      END AS final_score_source,
      'PERCENT_0_100' AS score_scale,
      COALESCE(i.locale, 'unknown') AS locale,
      COALESCE(i.timezone, 'UTC') AS timezone,
      COALESCE(i.is_test_account, false) AS is_test_account,
      COALESCE(i.is_staff_account, false) AS is_staff_account,
      s.completed_attempt_count,
      CASE
        WHEN LOWER(g.grade_status) IN ('final', 'posted', 'graded')
         AND g.score_percentage IS NOT NULL
          THEN GREATEST(CAST(g.score_percentage AS DECIMAL(18,6)), CAST(0 AS DECIMAL(18,6)))
        WHEN LOWER(g.grade_status) IN ('final', 'posted', 'graded')
         AND COALESCE(g.points_possible, s.points_possible) > 0
          THEN GREATEST(
            CAST(g.points_earned AS DECIMAL(18,6))
            / NULLIF(CAST(COALESCE(g.points_possible, s.points_possible) AS DECIMAL(18,6)), 0)
            * 100,
            CAST(0 AS DECIMAL(18,6))
          )
        ELSE s.policy_attempt_score
      END AS final_assessment_score
    FROM scored_records AS s
    JOIN enrollments AS e
      ON e.learner_id = s.learner_id
     AND e.course_id = s.course_id
    JOIN identity_accounts AS i
      ON i.learner_id = s.learner_id
    LEFT JOIN gradebook_records AS g
      ON g.learner_id = s.learner_id
     AND g.course_id = s.course_id
     AND g.assessment_id = s.assessment_id
    WHERE COALESCE(i.is_test_account, false) = false
      AND COALESCE(i.is_staff_account, false) = false
  )
  SELECT

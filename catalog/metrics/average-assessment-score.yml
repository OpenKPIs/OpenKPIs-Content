  WITH
  assessment_configuration_ranked AS (
    SELECT
      c.*,
      ROW_NUMBER() OVER (
        PARTITION BY c.course_id, c.assessment_id
        ORDER BY c.updated_at DESC, c.assessment_version DESC
      ) AS configuration_rank
    FROM lms_assessment_configurations AS c
    WHERE COALESCE(c.is_deleted, false) = false
  ),
  assessment_configurations AS (
    SELECT *
    FROM assessment_configuration_ranked
    WHERE configuration_rank = 1
  ),
  identity_ranked AS (
    SELECT
      i.*,
      ROW_NUMBER() OVER (
        PARTITION BY i.learner_id
        ORDER BY i.updated_at DESC
      ) AS identity_rank
    FROM lms_identity_accounts AS i
    WHERE COALESCE(i.is_deleted, false) = false
  ),
  identity_accounts AS (
    SELECT *
    FROM identity_ranked
    WHERE identity_rank = 1
  ),
  enrollment_ranked AS (
    SELECT
      e.*,
      ROW_NUMBER() OVER (
        PARTITION BY e.learner_id, e.course_id
        ORDER BY
          CASE WHEN LOWER(e.enrollment_status) IN ('active', 'completed') THEN 0 ELSE 1 END,
          e.updated_at DESC,
          e.enrollment_id DESC
      ) AS enrollment_rank
    FROM lms_enrollments AS e
    WHERE COALESCE(e.is_deleted, false) = false
  ),
  enrollments AS (
    SELECT *
    FROM enrollment_ranked
    WHERE enrollment_rank = 1
  ),
  valid_attempts AS (
    SELECT
      a.attempt_id,
      a.learner_id,
      a.course_id,
      a.assessment_id,
      COALESCE(a.attempt_completed_at, a.attempt_submitted_at, a.attempt_started_at) AS activity_at,
      CASE
        WHEN a.score_percentage IS NOT NULL
          THEN GREATEST(CAST(a.score_percentage AS DECIMAL(18,6)), CAST(0 AS DECIMAL(18,6)))
        WHEN COALESCE(a.points_possible, c.points_possible) > 0
          THEN GREATEST(
            CAST(a.points_earned AS DECIMAL(18,6))
            / NULLIF(CAST(COALESCE(a.points_possible, c.points_possible) AS DECIMAL(18,6)), 0)
            * 100,
            CAST(0 AS DECIMAL(18,6))
          )
      END AS attempt_score_percentage
    FROM lms_assessment_attempts AS a
    JOIN assessment_configurations AS c
      ON c.course_id = a.course_id
     AND c.assessment_id = a.assessment_id
    WHERE CAST(COALESCE(a.attempt_completed_at, a.attempt_submitted_at, a.attempt_started_at) AS DATE)
          BETWEEN CURRENT_DATE - INTERVAL '30' DAY AND CURRENT_DATE
      AND LOWER(a.attempt_status) IN ('completed', 'submitted', 'graded')
      AND COALESCE(a.is_voided, false) = false
      AND COALESCE(a.is_deleted, false) = false
      AND COALESCE(a.is_practice_attempt, false) = false
  ),
  ranked_attempts AS (
    SELECT
      v.*,
      ROW_NUMBER() OVER (
        PARTITION BY v.learner_id, v.course_id, v.assessment_id
        ORDER BY v.activity_at, v.attempt_id
      ) AS first_attempt_rank,
      ROW_NUMBER() OVER (
        PARTITION BY v.learner_id, v.course_id, v.assessment_id
        ORDER BY v.activity_at DESC, v.attempt_id DESC
      ) AS latest_attempt_rank
    FROM valid_attempts AS v
    WHERE v.attempt_score_percentage IS NOT NULL
  ),
  attempt_rollup AS (
    SELECT
      learner_id,
      course_id,
      assessment_id,
      CAST(MAX(activity_at) AS DATE) AS activity_date,
      COUNT(*) AS completed_attempt_count,
      AVG(attempt_score_percentage) AS mean_attempt_score,
      MAX(attempt_score_percentage) AS highest_attempt_score,
      MAX(CASE WHEN first_attempt_rank = 1 THEN attempt_score_percentage END) AS first_attempt_score,
      MAX(CASE WHEN latest_attempt_rank = 1 THEN attempt_score_percentage END) AS latest_attempt_score
    FROM ranked_attempts
    GROUP BY learner_id, course_id, assessment_id
  ),
  gradebook_ranked AS (
    SELECT
      g.*,
      ROW_NUMBER() OVER (
        PARTITION BY g.learner_id, g.course_id, g.assessment_id
        ORDER BY
          CASE WHEN LOWER(g.grade_status) IN ('final', 'posted', 'graded') THEN 0 ELSE 1 END,
          g.updated_at DESC,
          g.gradebook_record_id DESC
      ) AS grade_rank
    FROM lms_gradebook_records AS g
    WHERE COALESCE(g.is_deleted, false) = false
      AND COALESCE(g.is_excused, false) = false
  ),
  gradebook_records AS (
    SELECT *
    FROM gradebook_ranked
    WHERE grade_rank = 1
  ),
  scored_records AS (
    SELECT
      r.activity_date,
      r.completed_attempt_count,
      r.mean_attempt_score,
      r.highest_attempt_score,
      r.first_attempt_score,
      r.latest_attempt_score,

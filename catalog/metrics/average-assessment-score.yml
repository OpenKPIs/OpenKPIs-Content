Calculation Notes: |
  1️⃣ Normalize eligible attempts to a 0-100 scale for comparability.  
  2️⃣ Include finalized, machine-scored, or instructor-graded attempts only.  
  3️⃣ Exclude drafts, previews, practice attempts, abandoned attempts, deleted records, ungraded submissions, zero-point assessments, and attempts with missing points.  
  4️⃣ Each attempt has equal weight in the average calculation.  
  5️⃣ Quarantine scores above 100 or below 0 unless extra credit or negative marking is allowed.

Business Use Case: |
  Academic Operations reviews Average Assessment Score by course, assessment, learning objective, instructor, and cohort after each assessment cycle. If a required assessment's average falls below its configured mastery threshold, the team inspects item-level performance, assigns remediation content to affected learners, reviews instructional material for weak objectives, and evaluates whether ambiguous questions require correction or regrading.


Source Data: Learning Management System assessment attempt records, assessment configuration data, gradebook records, enrollment data, and identity/account classification data


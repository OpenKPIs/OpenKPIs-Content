      c.max_attempts,
      c.time_limit_minutes,
      c.points_possible,
      CASE LOWER(COALESCE(c.attempt_scoring_policy, 'latest'))
        WHEN 'highest' THEN r.highest_attempt_score
        WHEN 'best' THEN r.highest_attempt_score
        WHEN 'first' THEN r.first_attempt_score
        WHEN 'average' THEN r.mean_attempt_score
        WHEN 'mean' THEN r.mean_attempt_score
        ELSE r.latest_attempt_score
      END AS policy_attempt_score
    FROM attempt_rollup AS r
    JOIN assessment_configurations AS c
      ON c.course_id = r.course_id
     AND c.assessment_id = r.assessment_id
  ),
  final_records AS (
    SELECT
      s.activity_date,
      e.institution_id,
      e.institution_name,
      i.account_id,
      i.account_name,
      i.account_type,
      i.user_classification,
      s.learner_id,
      i.learner_external_id,
      s.course_id,
      e.course_code,

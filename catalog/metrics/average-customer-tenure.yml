Metric Name: Average Customer Tenure
Formula: AVG(DATE_DIFF(period_end_date, first_order_date, DAY)) over customers with >= 1 completed order in the 365 days ending period_end_date

Description: |
  Mean days from each active customer's first completed order to the period end date. Active means a completed order in the trailing 365 days; this is the continuous value behind Customer Tenure Band.

Category: Retention



























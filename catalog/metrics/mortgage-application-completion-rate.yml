# Metric: Mortgage Application Completion Rate
# Generated: 2026-09-06T14:30:22.209Z
# Contributed by: devyendarm
# Last modified by: devyendarm

Metric Name: Mortgage Application Completion Rate
Formula: 100 * COUNT(DISTINCT CASE WHEN completion_timestamp >= qualified_start_timestamp AND completion_timestamp < qualified_start_timestamp + INTERVAL '30 days' THEN canonical_application_id END) / NULLIF(COUNT(DISTINCT canonical_application_id), 0)

Description: |
  Measures the percentage of unique full mortgage applications that are completed and successfully submitted within 30 calendar days of a qualified application start across digital and advisor-assisted channels. It quantifies conversion from application initiation to lender-ready submission, excluding prequalification, duplicate, test, withdrawn-before-submission, and ineligible applications.

Category: Conversion

Tags: [metric]

Industry: Real Estate Tech

Priority: High

Core Area: Onboarding

Scope: Item

Measure Type: percentage

Aggregation Window: Time based - Daily/Weekly/Monthly


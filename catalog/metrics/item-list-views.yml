Google Analytics SQL: |
  -- ==========================================
  -- 1. GOOGLE BIGQUERY SQL
  -- ==========================================
  -- Item List Views: one count per rendered list state (view_item_list), not per product tile.
  -- Window: 30 complete days ending 4 days ago, so every day has cleared the 72-hour late-hit processing window.
  -- The export holds observed events only (no consent-mode modelling); known bots are excluded by GA4 at collection.
  -- Viewport qualification (50% of the list visible for 1 second) is enforced in the tag firing rule per placement.
  WITH raw_events AS (
    SELECT
      PARSE_DATE('%Y%m%d', e.event_date) AS event_date,
      e.event_timestamp,
      e.user_pseudo_id,
      e.device.category AS device_category,
      e.session_traffic_source_last_click.cross_channel_campaign.default_channel_group AS default_channel_group,
      LOWER(e.device.web_info.hostname) AS hostname,
      (
        SELECT AS STRUCT
          MAX(IF(p.key = 'ga_session_id', p.value.int_value, NULL)) AS ga_session_id,
          MAX(IF(p.key = 'traffic_type', p.value.string_value, NULL)) AS traffic_type,
          MAX(IF(p.key = 'debug_mode', COALESCE(CAST(p.value.int_value AS STRING), p.value.string_value), NULL)) AS debug_mode,
          MAX(IF(p.key = 'item_list_id', p.value.string_value, NULL)) AS item_list_id,
          MAX(IF(p.key = 'item_list_name', p.value.string_value, NULL)) AS item_list_name
        FROM UNNEST(e.event_params) AS p
      ) AS ep,
      (
        SELECT AS STRUCT
          COUNT(1) AS item_count,
          MAX(NULLIF(i.item_list_id, '(not set)')) AS item_list_id,
          MAX(NULLIF(i.item_list_name, '(not set)')) AS item_list_name,
          STRING_AGG(COALESCE(i.item_id, i.item_name, ''), '|' ORDER BY SAFE_CAST(i.item_list_index AS INT64), i.item_id) AS item_signature
        FROM UNNEST(e.items) AS i
      ) AS it
    FROM `your-project.analytics_123456789.events_*` AS e
    WHERE _TABLE_SUFFIX BETWEEN FORMAT_DATE('%Y%m%d', DATE_SUB(CURRENT_DATE(), INTERVAL 33 DAY))
                            AND FORMAT_DATE('%Y%m%d', DATE_SUB(CURRENT_DATE(), INTERVAL 4 DAY))
      AND e.event_name = 'view_item_list'
  ),
  qualified AS (
    SELECT
      event_date,
      event_timestamp,
      user_pseudo_id,
      ep.ga_session_id,
      COALESCE(device_category, '(not set)') AS device_category,
      COALESCE(default_channel_group, 'Unassigned') AS default_channel_group,
      COALESCE(ep.item_list_id, it.item_list_id, '(not set)') AS item_list_id,
      COALESCE(ep.item_list_name, it.item_list_name, '(not set)') AS item_list_name,
      it.item_signature
    FROM raw_events
    WHERE it.item_count > 0
      AND COALESCE(ep.traffic_type, '') NOT IN ('internal', 'developer')
      AND COALESCE(ep.debug_mode, '0') IN ('0', 'false')
      AND NOT REGEXP_CONTAINS(COALESCE(hostname, ''), r'localhost|(^|[.])(staging|stage|dev|qa|uat|test)[.]')
  ),
  flagged AS (
    SELECT
      *,
      LAG(event_timestamp) OVER (
        PARTITION BY user_pseudo_id, ga_session_id, item_list_id, item_signature
        ORDER BY event_timestamp
      ) AS prev_list_timestamp
    FROM qualified
  )
  SELECT
    event_date,
    item_list_id,
    item_list_name,
    device_category,
    default_channel_group,
    COUNTIF(user_pseudo_id IS NULL OR prev_list_timestamp IS NULL OR event_timestamp - prev_list_timestamp > 2000000) AS item_list_views,
    COUNT(1) AS view_item_list_events_observed,
    COUNTIF(user_pseudo_id IS NOT NULL AND prev_list_timestamp IS NOT NULL AND event_timestamp - prev_list_timestamp <= 2000000) AS rerenders_collapsed,
    COUNT(DISTINCT CONCAT(user_pseudo_id, '.', CAST(ga_session_id AS STRING))) AS sessions_with_item_list_view
  FROM flagged
  GROUP BY event_date, item_list_id, item_list_name, device_category, default_channel_group
  ORDER BY event_date, item_list_views DESC

AEP Query Service SQL: |
  -- ==========================================
  -- 2. ADOBE AEP QUERY SERVICE SQL
  -- ==========================================
  -- Item List Views from XDM ExperienceEvents: one count per rendered list state (web.webInteraction.name = 'view_item_list').
  -- Window: 30 complete local days ending 4 days ago (72-hour late-data window); set the time zone to the reporting property zone.
  -- Sessions: 30-minute inactivity timeout reset at local midnight, computed over all web events before the list filter.
  WITH web_events AS (
    SELECT
      COALESCE(identityMap['ECID'][0].id, endUserIDs._experience.ecid.id) AS ecid,
      timestamp AS event_ts,
      to_date(from_utc_timestamp(timestamp, 'America/New_York')) AS event_date,
      web.webInteraction.name AS interaction_name,
      lower(regexp_extract(web.webPageDetails.URL, '^https?://([^/:?#]+)', 1)) AS hostname,
      lower(environment.browserDetails.userAgent) AS user_agent,
      device.type AS device_type,
      channel.typeAtSource AS marketing_channel,
      web.webPageDetails.siteSection AS site_section,
      _experience.analytics.customDimensions.eVars.eVar20 AS item_list_id,
      _experience.analytics.customDimensions.eVars.eVar21 AS item_list_name,
      _experience.analytics.customDimensions.eVars.eVar22 AS list_type,
      CASE WHEN productListItems IS NULL THEN 0 ELSE size(productListItems) END AS item_count,
      concat_ws('|', transform(productListItems, x -> x.SKU)) AS item_signature
    FROM your_aep_web_events_dataset
    WHERE timestamp >= to_timestamp(date_sub(current_date(), 35))
      AND timestamp < to_timestamp(date_sub(current_date(), 2))
  ),
  sessionized AS (
    SELECT
      *,
      SESS_TIMEOUT(event_ts, 60 * 30) OVER (
        PARTITION BY ecid, event_date
        ORDER BY event_ts
        ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW
      ) AS session
    FROM web_events
    WHERE ecid IS NOT NULL
      AND event_date BETWEEN date_sub(current_date(), 33) AND date_sub(current_date(), 4)
      AND COALESCE(hostname, '') NOT RLIKE 'localhost|(^|[.])(staging|stage|dev|qa|uat|test)[.]'
      AND COALESCE(user_agent, '') NOT RLIKE '(bot|spider|crawler|headless|lighthouse)'
  ),
  flagged AS (
    SELECT
      *,
      LAG(event_ts) OVER (
        PARTITION BY ecid, event_date, session.num, item_list_id, item_signature
        ORDER BY event_ts
      ) AS prev_list_ts
    FROM sessionized
    WHERE interaction_name = 'view_item_list'
      AND item_count > 0
  )
  SELECT
    event_date,
    COALESCE(item_list_id, '(not set)') AS item_list_id,
    COALESCE(item_list_name, '(not set)') AS item_list_name,
    COALESCE(list_type, '(not set)') AS list_type,
    COALESCE(site_section, '(not set)') AS site_section,
    COALESCE(device_type, '(not set)') AS device_type,
    COALESCE(marketing_channel, 'Unassigned') AS marketing_channel,
    SUM(CASE WHEN prev_list_ts IS NULL OR CAST(event_ts AS DOUBLE) - CAST(prev_list_ts AS DOUBLE) > 2 THEN 1 ELSE 0 END) AS item_list_views,
    COUNT(1) AS view_item_list_events_observed,
    SUM(CASE WHEN prev_list_ts IS NOT NULL AND CAST(event_ts AS DOUBLE) - CAST(prev_list_ts AS DOUBLE) <= 2 THEN 1 ELSE 0 END) AS rerenders_collapsed,
    COUNT(DISTINCT concat_ws('-', ecid, CAST(event_date AS STRING), CAST(session.num AS STRING))) AS sessions_with_item_list_view
  FROM flagged
  GROUP BY 1, 2, 3, 4, 5, 6, 7
  ORDER BY event_date, item_list_views DESC

Calculation Notes: |
  1️⃣ Unit of count is the list render, not the product: one view_item_list event carrying items[] for all tiles in that render counts once, regardless of how many items it contains; item-level impressions are a separate measure derived by unnesting items[] (GA4 caps items[] at 200 per event, so oversized grids must be split into batches and each batch counts as a view).
  2️⃣ A new list state is a new view: pagination, infinite-scroll batch loads, and filter or sort changes that re-render the grid each emit a fresh event; carousel arrow navigation that reveals already-loaded tiles does not, unless the implementation lazy-loads a new batch.
  3️⃣ Deduplicate single-page-application re-renders: events sharing the same session, item_list_id and identical first item_id / index sequence within 2 seconds are collapsed to one, which removes double fires from hydration and virtual-DOM refresh cycles.
  4️⃣ Only lists that reach the viewport qualify when the implementation supports it (at least 50% of the list container visible for 1 second); below-the-fold carousels fired on page load inflate the denominator and depress Product List Click-Through Rate, so the firing rule must be documented per placement and held constant across compared periods.
  5️⃣ Search results grids fire view_item_list with item_list_id = 'search_results' in addition to view_search_results; do not sum the two events, and exclude zero-result pages where items[] is empty.
  6️⃣ Exclude internal and developer traffic (traffic_type filter), known bots and spiders, and QA or staging hostnames; consent-mode modelled events are reported separately from observed events when used as a click-through-rate denominator.
  7️⃣ Session attribution follows the 30-minute inactivity timeout and midnight boundary of the reporting property time zone; daily totals are final only after the 72-hour late-hit processing window, so trailing-day comparisons should use complete days.

Business Use Case: |
  1️⃣ Merchandising team, weekly category review: when a category grid or carousel ranks in the top decile of Item List Views but the bottom quartile of Item List Clicks, the category manager re-sequences the first two rows or swaps the placement's merchandising rule and measures the change the following week.
  2️⃣ Personalization product owner, release monitoring: when Item List Views for a recommendation placement (item_list_id) drops more than 20% day over day after a front-end deployment with stable sessions, the owner raises a defect to restore the render trigger before the placement's click-through and attributed revenue are misreported.
  3️⃣ Site search product manager, monthly results-page review: when search results grid views per search exceed 1.5 (shoppers paging past page one), the manager tests larger page sizes or relevance tuning on the affected query clusters.
  4️⃣ Digital marketing team, campaign landing QA: when paid traffic to a category landing page produces sessions without corresponding Item List Views, the team verifies that the destination grid renders for the campaign's device and region mix before scaling spend.


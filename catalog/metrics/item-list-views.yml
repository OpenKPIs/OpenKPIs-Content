Metric Name: Item List Views
Formula: COUNT(events WHERE event_name = 'view_item_list')

Description: |
  Item List Views counts every time a shopper is served a merchandised product list (category and listing grids, search results grids, recommendation and cross-sell carousels), recorded as one view_item_list event per rendered list state. It is the exposure base for list-level merchandising analysis and the denominator of Product List Click-Through Rate, so its firing discipline directly determines whether list, slot and placement performance can be compared.

Category: Engagement



























# Metric: Course Refund Rate
# Generated: 2026-09-12T18:30:10.931Z
# Contributed by: devyendarm
# Last modified by: devyendarm

Metric Name: Course Refund Rate
Formula: 100 * COUNT(DISTINCT CASE WHEN refund_status = 'completed' AND refunded_course_principal_amount > 0 AND refund_reversed_flag = false AND refund_in_observation_window_flag = true THEN course_order_line_id END) / NULLIF(COUNT(DISTINCT CASE WHEN qualifying_paid_course_purchase_flag = true THEN course_order_line_id END), 0)

Description: |
  Measures the percentage of qualifying paid course purchase lines that receive at least one completed monetary refund within the applicable refund observation window. It indicates how frequently completed course purchases are reversed, independent of the monetary value refunded.

Category: Revenue

Tags: [metric]

Industry: EdTech & E-Learning

Priority: High

Core Area: Monetization

Scope: Item

Measure Type: percentage

Aggregation Window: Time based - Monthly









Calculation Notes: |
  1️⃣ Count each course order line once, regardless of multiple refunds.  
  2️⃣ Include completed partial/full refunds with a positive course-principal component in the numerator.  
  3️⃣ Exclude tax-only refunds, fee-only adjustments, and refunds reversed before the reporting cutoff.  
  4️⃣ Attribute refunds to the original purchase cohort using the refund policy effective at purchase time.  
  5️⃣ Treat course bundles as one item unless separately priced child lines are created.  
  6️⃣ Return null when the denominator is zero, not zero.

Business Use Case: |
  Finance and Product review a monthly mature-cohort report and identify a course whose refund rate increased from 4.2% to 9.1% after a marketing and curriculum change. They segment the increase by refund reason, instructor, acquisition campaign, learner geography, and days from purchase to refund; pause misleading campaigns, correct the course landing page and affected lessons, and monitor subsequent cohorts until the rate returns below target.


Source Data: Learning commerce platform, order management system, payment processor, refund management workflow, and Finance ERP or revenue subledger.

Report Attributes: |
  ["Purchase Cohort Month","Course","Course Category","Course Bundle","Instructor","Refund Reason","Refund Type","Full or Partial Refund","Days from Purchase to Refund","Refund Policy","Learner Country","Learner Region","Acquisition Channel","Marketing Campaign","Device Type","Payment Method","Currency","Promotion Code","New or Returning Learner","Course Completion Status at Refund"]

Dashboard Usage: [Executive Revenue Health Dashboard, Course Portfolio Performance Dashboard, Refund and Chargeback Operations Dashboard, Learner Experience Quality Dashboard, Finance Revenue Reconciliation Dashboard]

Segment Eligibility: |
  true

Related Metrics: [Course Refund Count, Course Refund Amount, Course Revenue Refund Rate, Gross Course Revenue, Net Course Revenue, Course Purchase Count, Chargeback Rate, Course Cancellation Rate, Course Completion Rate, Learner Satisfaction Score]


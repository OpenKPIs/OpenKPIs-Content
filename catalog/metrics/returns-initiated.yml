Metric Name: Returns Initiated
Formula: COUNT(DISTINCT order_return_id) WHERE return_initiation_event IS present AND initiation_timestamp WITHIN reporting_period

Description: |
  Returns Initiated counts the distinct return requests customers start in the self-service returns portal or RMA flow, deduplicated to one per order-return ID no matter how many items the request covers or how often the customer restarts it. It is the entry point of the returns funnel and the volume building block behind Return Initiation Rate, refund liability forecasting and initiation-to-completion drop-off analysis.


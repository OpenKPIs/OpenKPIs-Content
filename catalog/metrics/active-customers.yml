Metric Name: Active Customers
Formula: COUNT(DISTINCT customer_id) WHERE order_status NOT IN ('cancelled','fraud','test') AND net_order_value > 0 AND order_date > as_of_date − INTERVAL 12 MONTH AND order_date <= as_of_date

Description: |
  Active Customers is the count of distinct resolved customers who completed at least one net-valid purchase in any channel during the trailing activity window, conventionally the 12 months ending on the reporting as-of date. It is the base population behind retention, purchase frequency and lifetime value reporting, and it sizes the live buyer file separately from subscription-based counts such as Active Subscriber Count.

Category: Retention

Tags: [metric, E-commerce: Customer Retention, Loyalty & LTV, Omnichannel, Customer Base]

Industry: E-commerce

Priority: High

Core Area: Monetization

Scope: User

Measure Type: Counter

Aggregation Window: Monthly, Quarterly, Yearly


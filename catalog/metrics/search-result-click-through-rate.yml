Google Analytics SQL: |
  -- ==========================================
  -- 1. GOOGLE BIGQUERY SQL
  -- ==========================================
  WITH raw_events AS (
    SELECT
      PARSE_DATE('%Y%m%d', e.event_date) AS event_dt,
      TIMESTAMP_MICROS(e.event_timestamp) AS event_ts,
      e.event_name,
      e.user_pseudo_id,
      e.stream_id,
      e.items,
      ARRAY(
        SELECT AS STRUCT
          ep.key,
          COALESCE(
            ep.value.string_value,
            CAST(ep.value.int_value AS STRING),
            CAST(ep.value.double_value AS STRING),
            CAST(ep.value.float_value AS STRING)
          ) AS value
        FROM UNNEST(e.event_params) ep
      ) AS params
    FROM `your-project.analytics_123456789.events_*` e
    WHERE _TABLE_SUFFIX BETWEEN
          FORMAT_DATE('%Y%m%d', DATE_SUB(CURRENT_DATE(), INTERVAL 31 DAY))
          AND FORMAT_DATE('%Y%m%d', CURRENT_DATE())
      AND e.event_name IN ('view_item_list', 'select_item')
  ),
  event_items AS (
    SELECT
      r.event_dt,
      r.event_ts,
      r.event_name,
      r.user_pseudo_id,
      r.stream_id,
      i.item_id,
      i.item_name,
      i.item_variant,
      i.item_list_id AS standard_item_list_id,
      i.item_list_name AS standard_item_list_name,
      i.item_list_index,
      ARRAY(
        SELECT AS STRUCT
          ip.key,
          COALESCE(
            ip.value.string_value,
            CAST(ip.value.int_value AS STRING),
            CAST(ip.value.double_value AS STRING),
            CAST(ip.value.float_value AS STRING)
          ) AS value
        FROM UNNEST(i.item_params) ip
      ) AS item_params,
      r.params
    FROM raw_events r
    CROSS JOIN UNNEST(r.items) i
  ),
  normalized AS (
    SELECT
      event_dt,
      event_ts,
      event_name,
      user_pseudo_id,
      stream_id,
      (SELECT value FROM UNNEST(params) WHERE key = 'search_id' LIMIT 1) AS search_id,
      (SELECT value FROM UNNEST(params) WHERE key = 'search_request_id' LIMIT 1) AS search_request_id,
      (SELECT value FROM UNNEST(params) WHERE key = 'search_session_id' LIMIT 1) AS search_session_id,
      (SELECT value FROM UNNEST(params) WHERE key = 'search_term' LIMIT 1) AS search_term,
      (SELECT value FROM UNNEST(params) WHERE key = 'search_type' LIMIT 1) AS search_type,
      COALESCE(
        standard_item_list_id,
        (SELECT value FROM UNNEST(params) WHERE key = 'item_list_id' LIMIT 1)
      ) AS item_list_id,
      COALESCE(
        standard_item_list_name,
        (SELECT value FROM UNNEST(params) WHERE key = 'item_list_name' LIMIT 1)
      ) AS item_list_name,
      (SELECT value FROM UNNEST(params) WHERE key = 'result_impression_id' LIMIT 1) AS result_impression_id,
      COALESCE(
        SAFE_CAST((SELECT value FROM UNNEST(params) WHERE key = 'impression_timestamp' LIMIT 1) AS TIMESTAMP),
        IF(event_name = 'view_item_list', event_ts, NULL)
      ) AS impression_timestamp,
      COALESCE(
        (SELECT value FROM UNNEST(item_params) WHERE key = 'result_id' LIMIT 1),
        (SELECT value FROM UNNEST(params) WHERE key = 'result_id' LIMIT 1),
        item_id
      ) AS result_id,
      COALESCE(
        (SELECT value FROM UNNEST(item_params) WHERE key = 'property_id' LIMIT 1),
        (SELECT value FROM UNNEST(params) WHERE key = 'property_id' LIMIT 1),
        item_id
      ) AS property_id,
      item_name AS result_name,
      COALESCE(
        (SELECT value FROM UNNEST(item_params) WHERE key = 'result_type' LIMIT 1),
        (SELECT value FROM UNNEST(params) WHERE key = 'result_type' LIMIT 1),
        item_variant
      ) AS result_type,
      COALESCE(
        SAFE_CAST((SELECT value FROM UNNEST(item_params) WHERE key = 'result_position' LIMIT 1) AS INT64),
        SAFE_CAST(item_list_index AS INT64),
        SAFE_CAST((SELECT value FROM UNNEST(params) WHERE key = 'result_position' LIMIT 1) AS INT64)
      ) AS result_position,
      SAFE_CAST((SELECT value FROM UNNEST(params) WHERE key = 'page_number' LIMIT 1) AS INT64) AS page_number,
      SAFE_CAST((SELECT value FROM UNNEST(params) WHERE key = 'results_per_page' LIMIT 1) AS INT64) AS results_per_page,
      SAFE_CAST((SELECT value FROM UNNEST(params) WHERE key = 'total_results' LIMIT 1) AS INT64) AS total_results,
      (SELECT value FROM UNNEST(params) WHERE key = 'algorithm_id' LIMIT 1) AS algorithm_id,
      (SELECT value FROM UNNEST(params) WHERE key = 'algorithm_version' LIMIT 1) AS algorithm_version,
      COALESCE(
        SAFE_CAST((SELECT value FROM UNNEST(item_params) WHERE key = 'ranking_score' LIMIT 1) AS FLOAT64),
        SAFE_CAST((SELECT value FROM UNNEST(params) WHERE key = 'ranking_score' LIMIT 1) AS FLOAT64)
      ) AS ranking_score,
      COALESCE(
        SAFE_CAST((SELECT value FROM UNNEST(item_params) WHERE key = 'relevance_score' LIMIT 1) AS FLOAT64),
        SAFE_CAST((SELECT value FROM UNNEST(params) WHERE key = 'relevance_score' LIMIT 1) AS FLOAT64)
      ) AS relevance_score,
      LOWER(COALESCE(
        (SELECT value FROM UNNEST(item_params) WHERE key = 'sponsored' LIMIT 1),
        (SELECT value FROM UNNEST(params) WHERE key = 'sponsored' LIMIT 1),
        'false'
      )) IN ('true', '1') AS sponsored,
      LOWER(COALESCE(
        (SELECT value FROM UNNEST(params) WHERE key = 'eligible_impression' LIMIT 1),
        'false'
      )) IN ('true', '1') AS eligible_impression,
      (SELECT value FROM UNNEST(params) WHERE key = 'eligibility_reason' LIMIT 1) AS eligibility_reason,
      LOWER(COALESCE(
        (SELECT value FROM UNNEST(item_params) WHERE key = 'rendered' LIMIT 1),
        (SELECT value FROM UNNEST(params) WHERE key = 'rendered' LIMIT 1),
        'false'
      )) IN ('true', '1') AS rendered,
      LOWER(COALESCE(
        (SELECT value FROM UNNEST(item_params) WHERE key = 'visible' LIMIT 1),
        (SELECT value FROM UNNEST(params) WHERE key = 'visible' LIMIT 1),
        'false'
      )) IN ('true', '1') AS visible,
      LOWER(COALESCE(
        (SELECT value FROM UNNEST(item_params) WHERE key = 'viewable' LIMIT 1),
        (SELECT value FROM UNNEST(params) WHERE key = 'viewable' LIMIT 1),
        'false'
      )) IN ('true', '1') AS viewable,
      COALESCE(
        SAFE_CAST((SELECT value FROM UNNEST(item_params) WHERE key = 'viewability_percent' LIMIT 1) AS FLOAT64),
        SAFE_CAST((SELECT value FROM UNNEST(params) WHERE key = 'viewability_percent' LIMIT 1) AS FLOAT64)
      ) AS viewability_percent,
      COALESCE(
        SAFE_CAST((SELECT value FROM UNNEST(item_params) WHERE key = 'time_in_view_ms' LIMIT 1) AS INT64),
        SAFE_CAST((SELECT value FROM UNNEST(params) WHERE key = 'time_in_view_ms' LIMIT 1) AS INT64)
      ) AS time_in_view_ms,
      LOWER(COALESCE((SELECT value FROM UNNEST(params) WHERE key = 'bot_flag' LIMIT 1), 'false')) IN ('true', '1') AS bot_flag,
      SAFE_CAST((SELECT value FROM UNNEST(params) WHERE key = 'bot_score' LIMIT 1) AS FLOAT64) AS bot_score,
      (SELECT value FROM UNNEST(params) WHERE key = 'traffic_type' LIMIT 1) AS traffic_type,
      (SELECT value FROM UNNEST(params) WHERE key = 'platform' LIMIT 1) AS platform,
      (SELECT value FROM UNNEST(params) WHERE key = 'channel' LIMIT 1) AS channel,
      (SELECT value FROM UNNEST(params) WHERE key = 'locale' LIMIT 1) AS locale,
      (SELECT value FROM UNNEST(params) WHERE key = 'currency' LIMIT 1) AS currency,
      (SELECT value FROM UNNEST(params) WHERE key = 'destination' LIMIT 1) AS destination,
      SAFE_CAST((SELECT value FROM UNNEST(params) WHERE key = 'check_in_date' LIMIT 1) AS DATE) AS check_in_date,
      SAFE_CAST((SELECT value FROM UNNEST(params) WHERE key = 'check_out_date' LIMIT 1) AS DATE) AS check_out_date,
      SAFE_CAST((SELECT value FROM UNNEST(params) WHERE key = 'guest_count' LIMIT 1) AS INT64) AS guest_count,
      SAFE_CAST((SELECT value FROM UNNEST(params) WHERE key = 'room_count' LIMIT 1) AS INT64) AS room_count,
      (SELECT value FROM UNNEST(params) WHERE key = 'filters_applied' LIMIT 1) AS filters_applied,
      (SELECT value FROM UNNEST(params) WHERE key = 'sort_order' LIMIT 1) AS sort_order,
      LOWER(COALESCE((SELECT value FROM UNNEST(params) WHERE key = 'map_view' LIMIT 1), 'false')) IN ('true', '1') AS map_view,
      (SELECT value FROM UNNEST(params) WHERE key = 'experiment_id' LIMIT 1) AS experiment_id,
      (SELECT value FROM UNNEST(params) WHERE key = 'variant_id' LIMIT 1) AS variant_id,
      (SELECT value FROM UNNEST(params) WHERE key = 'analytics_consent' LIMIT 1) AS analytics_consent,
      (SELECT value FROM UNNEST(params) WHERE key = 'page_id' LIMIT 1) AS page_id,
      COALESCE(
        (SELECT value FROM UNNEST(params) WHERE key = 'page_name' LIMIT 1),
        (SELECT value FROM UNNEST(params) WHERE key = 'page_title' LIMIT 1)
      ) AS page_name,
      (SELECT value FROM UNNEST(params) WHERE key = 'page_location' LIMIT 1) AS page_url,
      (SELECT value FROM UNNEST(params) WHERE key = 'page_referrer' LIMIT 1) AS referring_url,
      COALESCE(
        (SELECT value FROM UNNEST(item_params) WHERE key = 'click_url' LIMIT 1),
        (SELECT value FROM UNNEST(params) WHERE key = 'click_url' LIMIT 1)
      ) AS click_url
    FROM event_items
  ),
  eligible_impressions AS (
    SELECT * EXCEPT(impression_row_number)
    FROM (
      SELECT
        n.*,
        ROW_NUMBER() OVER (
          PARTITION BY n.result_impression_id
          ORDER BY n.event_ts, n.result_id
        ) AS impression_row_number
      FROM normalized n
      WHERE n.event_name = 'view_item_list'
        AND n.result_impression_id IS NOT NULL
        AND n.eligible_impression
        AND NOT n.bot_flag
        AND LOWER(COALESCE(n.traffic_type, 'human')) = 'human'
        AND n.event_dt >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
    )
    WHERE impression_row_number = 1
  ),
  deduplicated_clicks AS (
    SELECT * EXCEPT(click_row_number)
    FROM (
      SELECT
        result_impression_id,
        result_id,
        event_ts AS click_timestamp,
        click_url,
        ROW_NUMBER() OVER (
          PARTITION BY result_impression_id
          ORDER BY event_ts
        ) AS click_row_number
      FROM normalized
      WHERE event_name = 'select_item'
        AND result_impression_id IS NOT NULL
        AND NOT bot_flag
        AND LOWER(COALESCE(traffic_type, 'human')) = 'human'
    )
    WHERE click_row_number = 1
  ),
  attributed_impressions AS (
    SELECT
      i.*,
      c.click_timestamp,
      COALESCE(c.click_url, i.click_url) AS attributed_click_url,
      c.result_impression_id IS NOT NULL AS was_clicked
    FROM eligible_impressions i
    LEFT JOIN deduplicated_clicks c
      ON c.result_impression_id = i.result_impression_id
     AND (c.result_id = i.result_id OR c.result_id IS NULL OR i.result_id IS NULL)
     AND c.click_timestamp >= i.impression_timestamp
     AND c.click_timestamp <= TIMESTAMP_ADD(i.impression_timestamp, INTERVAL 30 MINUTE)
  )
  SELECT
    impression_timestamp AS metric_timestamp,
    DATE(impression_timestamp) AS metric_date,
    search_id,
    search_request_id,
    search_session_id,
    search_term,
    search_type,
    item_list_id,
    item_list_name,
    result_impression_id,
    result_id,
    property_id,
    result_name,
    result_type,
    result_position,
    page_number,
    results_per_page,
    total_results,
    algorithm_id,
    algorithm_version,
    ranking_score,
    relevance_score,
    sponsored,
    eligible_impression,
    eligibility_reason,
    rendered,
    visible,
    viewable,
    viewability_percent,
    time_in_view_ms,
    bot_flag,
    bot_score,
    traffic_type,
    platform,
    channel,
    locale,
    currency,
    destination,
    check_in_date,
    check_out_date,
    guest_count,
    room_count,
    filters_applied,
    sort_order,
    map_view,
    experiment_id,
    variant_id,
    analytics_consent,
    page_id,
    page_name,
    page_url,
    referring_url,
    user_pseudo_id,
    stream_id,
    click_timestamp,
    attributed_click_url AS click_url,
    1 AS eligible_impression_count,
    IF(was_clicked, 1, 0) AS clicked_impression_count,
    SAFE_DIVIDE(IF(was_clicked, 1, 0), 1) AS search_result_click_through_rate
  FROM attributed_impressions;

AEP Query Service SQL: |
  -- ==========================================
  -- 2. ADOBE AEP QUERY SERVICE SQL
  -- ==========================================
  WITH exploded_events AS (
    SELECT
      e.timestamp AS event_timestamp,
      e.eventType AS event_type,
      e.identityMap,
      e._searchResult AS search_result,
      e.web AS web,
      p AS product_item
    FROM search_result_event_dataset e
    LATERAL VIEW EXPLODE(e.productListItems) product_rows AS p
    WHERE e.timestamp >= CURRENT_TIMESTAMP - INTERVAL '31' DAY
      AND e.eventType IN (
        'commerce.productListViews',
        'commerce.productListItemClicks'
      )
  ),
  normalized AS (
    SELECT
      event_timestamp,
      event_type,
      search_result.searchId AS search_id,
      search_result.searchRequestId AS search_request_id,
      search_result.searchSessionId AS search_session_id,
      search_result.searchTerm AS search_term,
      search_result.searchType AS search_type,
      search_result.itemListId AS item_list_id,
      COALESCE(search_result.itemListName, product_item.productListName) AS item_list_name,
      search_result.resultImpressionId AS result_impression_id,
      COALESCE(
        CAST(search_result.impressionTimestamp AS TIMESTAMP),
        CASE WHEN event_type = 'commerce.productListViews' THEN event_timestamp END
      ) AS impression_timestamp,
      COALESCE(search_result.resultId, product_item.SKU) AS result_id,
      COALESCE(search_result.propertyId, product_item.SKU) AS property_id,
      product_item.name AS result_name,
      search_result.resultType AS result_type,
      COALESCE(search_result.resultPosition, product_item.position) AS result_position,
      search_result.pageNumber AS page_number,
      search_result.resultsPerPage AS results_per_page,
      search_result.totalResults AS total_results,
      search_result.algorithmId AS algorithm_id,
      search_result.algorithmVersion AS algorithm_version,
      search_result.rankingScore AS ranking_score,
      search_result.relevanceScore AS relevance_score,
      COALESCE(search_result.sponsored, FALSE) AS sponsored,
      COALESCE(search_result.eligibleImpression, FALSE) AS eligible_impression,
      search_result.eligibilityReason AS eligibility_reason,
      COALESCE(search_result.rendered, FALSE) AS rendered,
      COALESCE(search_result.visible, FALSE) AS visible,
      COALESCE(search_result.viewable, FALSE) AS viewable,
      search_result.viewabilityPercent AS viewability_percent,
      search_result.timeInViewMs AS time_in_view_ms,
      COALESCE(search_result.botFlag, FALSE) AS bot_flag,
      search_result.botScore AS bot_score,
      search_result.trafficType AS traffic_type,
      search_result.platform AS platform,
      search_result.channel AS channel,
      search_result.locale AS locale,
      COALESCE(search_result.currency, product_item.currencyCode) AS currency,
      search_result.destination AS destination,
      CAST(search_result.checkInDate AS DATE) AS check_in_date,
      CAST(search_result.checkOutDate AS DATE) AS check_out_date,
      search_result.guestCount AS guest_count,
      search_result.roomCount AS room_count,
      search_result.filtersApplied AS filters_applied,
      search_result.sortOrder AS sort_order,
      COALESCE(search_result.mapView, FALSE) AS map_view,
      search_result.experimentId AS experiment_id,
      search_result.variantId AS variant_id,
      search_result.analyticsConsent AS analytics_consent,
      CAST(NULL AS STRING) AS page_id,
      web.webPageDetails.name AS page_name,
      web.webPageDetails.URL AS page_url,
      web.webReferrer.URL AS referring_url,
      search_result.clickUrl AS custom_click_url,
      web.webInteraction.URL AS interaction_url,
      identityMap
    FROM exploded_events
  ),
  eligible_impressions AS (
    SELECT *
    FROM (
      SELECT
        n.*,
        ROW_NUMBER() OVER (
          PARTITION BY n.result_impression_id
          ORDER BY n.event_timestamp, n.result_id
        ) AS impression_row_number
      FROM normalized n
      WHERE n.event_type = 'commerce.productListViews'
        AND n.result_impression_id IS NOT NULL
        AND n.eligible_impression = TRUE
        AND n.bot_flag = FALSE
        AND LOWER(COALESCE(n.traffic_type, 'human')) = 'human'
        AND n.event_timestamp >= CURRENT_TIMESTAMP - INTERVAL '30' DAY
    ) ranked_impressions
    WHERE impression_row_number = 1
  ),
  deduplicated_clicks AS (
    SELECT *
    FROM (
      SELECT
        result_impression_id,
        result_id,
        event_timestamp AS click_timestamp,
        COALESCE(custom_click_url, interaction_url) AS click_url,
        ROW_NUMBER() OVER (
          PARTITION BY result_impression_id
          ORDER BY event_timestamp
        ) AS click_row_number
      FROM normalized
      WHERE event_type = 'commerce.productListItemClicks'
        AND result_impression_id IS NOT NULL
        AND bot_flag = FALSE
        AND LOWER(COALESCE(traffic_type, 'human')) = 'human'
    ) ranked_clicks
    WHERE click_row_number = 1
  ),
  attributed_impressions AS (
    SELECT
      i.*,
      c.click_timestamp,
      COALESCE(c.click_url, i.custom_click_url) AS attributed_click_url,
      CASE WHEN c.result_impression_id IS NOT NULL THEN TRUE ELSE FALSE END AS was_clicked
    FROM eligible_impressions i
    LEFT JOIN deduplicated_clicks c
      ON c.result_impression_id = i.result_impression_id
     AND (c.result_id = i.result_id OR c.result_id IS NULL OR i.result_id IS NULL)
     AND c.click_timestamp >= i.impression_timestamp
     AND c.click_timestamp <= i.impression_timestamp + INTERVAL '30' MINUTE
  )
  SELECT
    impression_timestamp AS metric_timestamp,
    CAST(impression_timestamp AS DATE) AS metric_date,
    search_id,
    search_request_id,
    search_session_id,
    search_term,
    search_type,
    item_list_id,
    item_list_name,
    result_impression_id,
    result_id,
    property_id,
    result_name,
    result_type,
    result_position,
    page_number,
    results_per_page,
    total_results,
    algorithm_id,
    algorithm_version,
    ranking_score,
    relevance_score,
    sponsored,
    eligible_impression,
    eligibility_reason,
    rendered,
    visible,
    viewable,
    viewability_percent,
    time_in_view_ms,
    bot_flag,
    bot_score,
    traffic_type,
    platform,
    channel,
    locale,
    currency,
    destination,
    check_in_date,
    check_out_date,
    guest_count,
    room_count,
    filters_applied,
    sort_order,
    map_view,
    experiment_id,
    variant_id,
    analytics_consent,
    page_id,
    page_name,
    page_url,
    referring_url,
    identityMap AS identity_map,
    click_timestamp,
    attributed_click_url AS click_url,
    1 AS eligible_impression_count,
    CASE WHEN was_clicked THEN 1 ELSE 0 END AS clicked_impression_count,
    CAST(CASE WHEN was_clicked THEN 1 ELSE 0 END AS DOUBLE) / 1.0 AS search_result_click_through_rate
  FROM attributed_impressions;

Calculation Notes: |
  Calculate the metric from viewable result-card impressions rather than result cards returned by the search service or merely rendered outside the viewport. Count each eligible impression once by impression_id and count a maximum of one clicked outcome for that impression, even if the user clicks the same result multiple times. Attribute a click only when its listing_id matches the impression, the click occurs after the impression in the same search_session_id, and no more than 30 minutes have elapsed; when multiple eligible impressions exist, use the latest preceding impression. The metric is null when the denominator is zero. Compute daily values from daily numerator and denominator totals and recompute longer periods from summed counts rather than averaging daily percentages.

Business Use Case: |
  The Search and Discovery Product team reviews this metric by rank position, market, property type, device, and experiment variant after a ranking-model release. If click-through rate declines materially for high-intent searches while inventory and latency remain stable, the team can roll back the model, adjust ranking features, or redesign result cards; if click-through rate rises but click-to-lead conversion falls, the team investigates misleading imagery, pricing, badges, or sponsored placement.



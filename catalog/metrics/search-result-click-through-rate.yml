Metric Name: Search Result Click-Through Rate
Formula: 100.0 * COUNT(DISTINCT impression_id WHERE eligible_result_impression = TRUE AND has_attributed_result_click = TRUE) / NULLIF(COUNT(DISTINCT impression_id WHERE eligible_result_impression = TRUE), 0)

Description: |
  Search Result Click-Through Rate measures the percentage of eligible property-result impressions that generate at least one attributed click to the represented result. It indicates how effectively search ranking, result relevance, merchandising, and result-card presentation convert result exposure into listing exploration.

Category: Conversion

Tags: [metric]

Industry: Real Estate Tech

Priority: High

Core Area: Discovery

Scope: Event

Measure Type: percentage

Aggregation Window: Time based - Daily


Metric Name: Learning Session Frequency
Formula: COUNT(DISTINCT CASE WHEN is_qualifying_learning_session = TRUE THEN session_id END) / NULLIF(COUNT(DISTINCT CASE WHEN is_qualifying_learning_session = TRUE THEN learner_id END), 0)

Description: |
  Learning Session Frequency measures the average number of qualifying learning sessions generated per active learner during a defined reporting period. It indicates how regularly learners return to consume instructional content, complete activities, or participate in assessments.

Category: Engagement

Tags: [metric]

Industry: EdTech & E-Learning

Priority: High

Core Area: Engagement

Scope: User

Measure Type: average

Aggregation Window: Time based - Weekly


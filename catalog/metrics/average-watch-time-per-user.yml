Metric Name: Average Watch Time per User
Formula: SUM(total_watch_time) / COUNT(unique_users)

Description: |
  Measures the average duration of content watched by each user over a specified period, indicating user engagement levels.

Category: Engagement

Tags: [metric]

Industry: Media & Streaming

Priority: High

Core Area: Engagement

Scope: User

Measure Type: average

Aggregation Window: Time based - Daily

GA4 Event: |
  engagement_time_msec

Adobe Event: |
  trackLink

W3 Data Layer: |
  {"digitalData":{"user":{"averageWatchTime":{"unit":"seconds","value":0}}}}

GA4 Data Layer: |
  {"event":"engagement_time_msec","average_watch_time":{"unit":"seconds","value":0}}

Adobe Client Data Layer: |
  {"event":"trackLink","averageWatchTime":{"unit":"seconds","value":0}}

XDM Mapping: |
  {"_experience":{"analytics":{"metrics":{"averageWatchTime":{"unit":"seconds","value":0}}}}}

Google Analytics SQL: |
  -- ==========================================
  -- 1. GOOGLE BIGQUERY SQL
  -- ==========================================
  SELECT user_id, AVG(engagement_time_msec / 1000) AS average_watch_time_seconds
  FROM `your-project.analytics_123456789.events_*`
  WHERE event_name = 'engagement_time_msec'
  GROUP BY user_id

AEP Query Service SQL: |
  -- ==========================================
  -- 2. ADOBE AEP QUERY SERVICE SQL
  -- ==========================================
  SELECT user_id, AVG(CAST(engagement_time_msec AS DOUBLE) / 1000) AS average_watch_time_seconds
  FROM aep_backend_dataset
  WHERE event_name = 'engagement_time_msec'
  GROUP BY user_id

Calculation Notes: |
  Exclude sessions shorter than 10 seconds to filter out accidental clicks. Consider session timeout as 30 minutes of inactivity.

Business Use Case: |
  Executives use this metric to assess content popularity and user retention strategies, adjusting content offerings based on engagement trends.



Metric Name: Store Inventory Checks
Formula: COUNT(DISTINCT session_id × items.item_id × store_id) FROM view_item WHERE view_context = 'store_availability' AND store_id IS NOT NULL AND store_inventory_status IS NOT NULL AND traffic_type NOT IN (internal, bot)

Description: |
  Counts the lookups in which a shopper requested real-time availability of a specific item (SKU and variant) at a specific store, recorded through the unified view_item event with view_context = 'store_availability' and a populated store_id, once per SKU × store × session. It sizes the local-inventory demand that feeds Buy Online, Pick Up In Store, and when read against the Store Inventory Status returned it shows how often shoppers look for local stock and find none.


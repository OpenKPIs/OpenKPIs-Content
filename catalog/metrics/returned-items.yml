Google Analytics SQL: |
  -- ==========================================
  -- 1. GOOGLE BIGQUERY SQL
  -- ==========================================
  DECLARE end_date DATE DEFAULT CURRENT_DATE();
  DECLARE start_date DATE DEFAULT DATE_SUB(end_date, INTERVAL 90 DAY);
  
  -- Refund events tied to a return (rma_id present), excluding test orders (traffic_type 'internal' or 'test'), one row per refund_id, dated by the refund posting date; cancellations have no rma_id and drop out
  WITH refunds AS (
    SELECT
      (SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'refund_id') AS refund_id,
      ecommerce.transaction_id AS transaction_id,
      items
    FROM `your-project.analytics_123456789.events_*`
    WHERE _TABLE_SUFFIX BETWEEN FORMAT_DATE('%Y%m%d', start_date) AND FORMAT_DATE('%Y%m%d', end_date)
      AND event_name = 'refund'
      AND (SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'rma_id') IS NOT NULL
      AND (SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'refund_id') IS NOT NULL
      AND COALESCE((SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'traffic_type'), '') NOT IN ('internal', 'test')
    QUALIFY ROW_NUMBER() OVER (PARTITION BY refund_id ORDER BY event_timestamp) = 1
  ),
  -- Original purchase lines for refunds sent without an items array, one purchase per transaction_id
  purchase_lines AS (
    SELECT
      ecommerce.transaction_id AS transaction_id,
      items
    FROM `your-project.analytics_123456789.events_*`
    WHERE _TABLE_SUFFIX <= FORMAT_DATE('%Y%m%d', end_date)
      AND event_name = 'purchase'
      AND ecommerce.transaction_id IN (SELECT transaction_id FROM refunds WHERE ARRAY_LENGTH(items) = 0)
    QUALIFY ROW_NUMBER() OVER (PARTITION BY ecommerce.transaction_id ORDER BY event_timestamp) = 1
  )
  -- Sum returned units: refund item lines, or the purchase lines when the refund has none
  SELECT SUM(item.quantity) AS returned_items
  FROM refunds r
  LEFT JOIN purchase_lines p USING (transaction_id)
  CROSS JOIN UNNEST(IF(ARRAY_LENGTH(r.items) > 0, r.items, p.items)) AS item;

AEP Query Service SQL: |
  -- ==========================================
  -- 2. ADOBE AEP QUERY SERVICE SQL
  -- ==========================================
  -- Relative reporting window and the property time zone used to date events
  WITH params AS (
    SELECT
      date_sub(current_date(), 90) AS start_date,
      current_date() AS end_date,
      'America/New_York' AS property_tz
  ),
  -- Refund events tied to a return (rmaID present), excluding test orders (trafficType 'internal' or 'test'), dated by the refund posting date; cancellations have no rmaID and drop out
  refund_hits AS (
    SELECT
      e._tenantId.refund.refundID AS refund_id,
      e.commerce.order.purchaseID AS transaction_id,
      e.productListItems AS items,
      e.timestamp AS event_ts
    FROM aep_web_events_dataset e
    CROSS JOIN params p
    WHERE e._tenantId.refund.refundID IS NOT NULL
      AND e._tenantId.refund.rmaID IS NOT NULL
      AND coalesce(e._tenantId.refund.trafficType, '') NOT IN ('internal', 'test')
      AND to_date(from_utc_timestamp(e.timestamp, p.property_tz)) BETWEEN p.start_date AND p.end_date
  ),
  -- One row per refund_id
  refunds AS (
    SELECT refund_id, transaction_id, items
    FROM (
      SELECT *, ROW_NUMBER() OVER (PARTITION BY refund_id ORDER BY event_ts) AS rn
      FROM refund_hits
    ) d
    WHERE rn = 1
  ),
  -- Original purchase lines for refunds sent without an items array, one purchase per transaction_id
  purchase_lines AS (
    SELECT transaction_id, items
    FROM (
      SELECT
        e.commerce.order.purchaseID AS transaction_id,
        e.productListItems AS items,
        ROW_NUMBER() OVER (PARTITION BY e.commerce.order.purchaseID ORDER BY e.timestamp) AS rn
      FROM aep_web_events_dataset e
      CROSS JOIN params p
      WHERE e.eventType = 'commerce.purchases'
        AND to_date(from_utc_timestamp(e.timestamp, p.property_tz)) <= p.end_date
        AND e.commerce.order.purchaseID IN (SELECT transaction_id FROM refunds WHERE coalesce(size(items), 0) <= 0)
    ) d
    WHERE rn = 1
  ),
  -- Refund item lines, or the purchase lines when the refund has none
  returned_lines AS (
    SELECT explode(CASE WHEN coalesce(size(r.items), 0) > 0 THEN r.items ELSE p.items END) AS item
    FROM refunds r
    LEFT JOIN purchase_lines p ON r.transaction_id = p.transaction_id
  )
  -- Sum returned units
  SELECT SUM(item.quantity) AS returned_items
  FROM returned_lines;

Calculation Notes: |
  1️⃣ Sum of items.quantity on refund events carrying an rma_id, deduplicated by refund_id; a refund of 3 units of one SKU adds 3.
  2️⃣ Counted on the refund posting date, not the order or request date; returns initiated but never received and refunded add nothing.
  3️⃣ Returnless refunds, price adjustments and appeasements (no rma_id) are excluded: money back without goods back is not a returned unit.
  4️⃣ Full refunds sent without an items array are expanded to the original purchase lines by transaction_id before summing.
  5️⃣ Test orders are excluded via traffic_type = 'internal' or 'test'; pre-shipment cancellations carry no rma_id and drop out.
  6️⃣ Exchanges count the unit sent back; the replacement ships as a new order and is not netted against this count.
  7️⃣ Distinct from Return Initiation Rate, which counts return requests; this counts units refunded against a return.

Business Use Case: |
  1️⃣ Merchandising reviews SKUs whose returned units spike against units sold and pulls or corrects the listing.
  2️⃣ Customer Service staffs the returns desk from weekly returned-unit volume after peak and promo periods.
  3️⃣ Merchandising splits returned units by return reason to fix size charts or imagery on top-returned lines.
  4️⃣ Finance sizes the monthly restock and liquidation reserve from returned units by category.


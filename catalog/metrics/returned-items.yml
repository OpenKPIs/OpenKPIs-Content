Metric Name: Returned Items
Formula: SUM(items.quantity) on refund events WHERE rma_id IS NOT NULL, deduplicated by refund_id, by refund posting date in the reporting period

Description: |
  Total product units customers return in the period, summed from item quantity on refund events tied to a return (RMA). Counts units, not return requests, and is the numerator of unit return rate.

Category: Operations



























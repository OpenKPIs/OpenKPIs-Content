    WHERE LOWER(a.attempt_status) IN ('completed', 'submitted', 'graded')
      AND a.submitted_at IS NOT NULL
      AND COALESCE(a.is_deleted, FALSE) = FALSE
      AND COALESCE(a.is_valid, TRUE) = TRUE
  ),
  valid_attempts AS (
    SELECT *
    FROM scored_attempts
    WHERE score_pct IS NOT NULL
      AND score_pct BETWEEN 0 AND 100
  ),
  baseline_ranked AS (
    SELECT
      v.*,
      ROW_NUMBER() OVER (
        PARTITION BY enrollment_id, course_id, assessment_pair_id

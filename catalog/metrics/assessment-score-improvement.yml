Calculation Notes: |
  1️⃣ Normalize baseline and comparison scores to a 0-100 scale.  
  2️⃣ Use the first valid submitted attempt for each baseline and comparison assessment.  
  3️⃣ Include only assessment pairs mapped to the same course enrollment, intervention, and learning-objective set.  
  4️⃣ Assign results to the comparison assessment submission month.  
  5️⃣ Retain negative improvements and zero values as valid outcomes.  
  6️⃣ Exclude incomplete, unscored, deleted, preview, instructor-test, sandbox, and integrity-invalidated attempts.  
  7️⃣ Exclude pairs with missing scores, missing scale boundaries, or no approved assessment-pair mapping.

Business Use Case: |
  The Chief Learning Officer reviews score improvement by course, instructor, delivery mode, and learner cohort each month. Courses with improvement below 5 percentage points for two consecutive cohorts are prioritized for content redesign and assessment-alignment review, while courses achieving at least 10 percentage points without lower completion rates are candidates for broader deployment.


Source Data: Learning Management System assessment attempt records, assessment catalog metadata, course enrollment records, and learning intervention completion records


  -- ==========================================
  -- 2. ADOBE AEP QUERY SERVICE SQL
  -- ==========================================
  WITH catalog AS (
    SELECT
      assessment_id,
      course_id,
      assessment_pair_id,
      assessment_name,
      LOWER(assessment_stage) AS assessment_stage,
      passing_score_percentage,
      improvement_threshold_points
    FROM lms_assessment_catalog
    WHERE is_active = TRUE
  ),
  scored_attempts AS (
    SELECT
      a.attempt_id,
      a.enrollment_id,
      a.learner_id,
      a.assessment_id,
      a.attempt_number,
      a.submitted_at,
      a.score AS raw_score,
      a.max_score,
      COALESCE(
        a.score_percentage,
        (CAST(a.score AS DECIMAL(18,6)) / NULLIF(CAST(a.max_score AS DECIMAL(18,6)), 0)) * 100
      ) AS score_pct,
      c.course_id,
      c.assessment_pair_id,
      c.assessment_name,
      c.assessment_stage,
      c.passing_score_percentage,

    p.post_attempt_id,
    p.post_attempt_number,
    p.post_attempt_at,
    p.post_raw_score,
    p.post_max_score,
    ROUND(CAST(p.post_score_pct AS DECIMAL(18,6)), 4) AS post_score_pct,
    p.intervention_id,
    p.intervention_type,
    p.intervention_completed_at,
    p.intervention_completion_status,
    CAST(p.post_attempt_at AS DATE) - CAST(p.submitted_at AS DATE) AS elapsed_days_between_assessments,
    ROUND(CAST(p.post_score_pct - p.score_pct AS DECIMAL(18,6)), 4) AS absolute_score_improvement_points,
    ROUND(CAST(((p.post_score_pct - p.score_pct) / NULLIF(p.score_pct, 0)) * 100 AS DECIMAL(18,6)), 4) AS relative_score_improvement_pct,
    ROUND(CAST(((p.post_score_pct - p.score_pct) / NULLIF(100 - p.score_pct, 0)) * 100 AS DECIMAL(18,6)), 4) AS normalized_gain_pct,
    CASE WHEN p.post_score_pct > p.score_pct THEN TRUE ELSE FALSE END AS improved_flag,
    CASE
      WHEN (p.post_score_pct - p.score_pct) >= COALESCE(p.post_improvement_threshold, p.improvement_threshold_points, 0) THEN TRUE
      ELSE FALSE
    END AS met_improvement_threshold_flag,
    COALESCE(p.post_improvement_threshold, p.improvement_threshold_points, 0) AS improvement_threshold_points,
    CASE WHEN p.passing_score_percentage IS NULL THEN NULL WHEN p.score_pct >= p.passing_score_percentage THEN TRUE ELSE FALSE END AS baseline_pass_flag,
    CASE WHEN p.post_passing_score_pct IS NULL THEN NULL WHEN p.post_score_pct >= p.post_passing_score_pct THEN TRUE ELSE FALSE END AS post_pass_flag,
    CASE
      WHEN p.passing_score_percentage IS NULL OR p.post_passing_score_pct IS NULL THEN 'unknown'
      WHEN p.score_pct < p.passing_score_percentage AND p.post_score_pct >= p.post_passing_score_pct THEN 'moved_to_pass'
      WHEN p.score_pct >= p.passing_score_percentage AND p.post_score_pct < p.post_passing_score_pct THEN 'moved_to_fail'
      WHEN p.score_pct >= p.passing_score_percentage AND p.post_score_pct >= p.post_passing_score_pct THEN 'remained_pass'
      ELSE 'remained_fail'
    END AS pass_status_change,
    CASE
      WHEN e.enrollment_id IS NULL THEN 'missing_enrollment'
      WHEN p.post_attempt_at <= p.submitted_at THEN 'invalid_assessment_sequence'
      WHEN p.score_pct NOT BETWEEN 0 AND 100 OR p.post_score_pct NOT BETWEEN 0 AND 100 THEN 'invalid_score_range'
      WHEN p.passing_score_percentage IS NULL OR p.post_passing_score_pct IS NULL THEN 'missing_pass_threshold'
      ELSE 'complete'
    END AS data_quality_status,
    'LMS' AS source_system
  FROM assessment_pairs AS p
  INNER JOIN enrollments AS e
    ON p.enrollment_id = e.enrollment_id

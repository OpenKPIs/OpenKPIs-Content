Metric Name: Curbside Orders
Formula: COUNT(DISTINCT transaction_id) on purchase events WHERE fulfillment_method = 'curbside', by order date in the reporting period

Description: |
  Online orders placed with curbside pickup as the fulfillment method, one per transaction_id by order date; a subset of BOPIS Orders. Numerator of Curbside Pickup Rate; counts orders placed, not curbside check-ins.


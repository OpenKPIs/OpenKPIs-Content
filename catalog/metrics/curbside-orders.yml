Google Analytics SQL: |
  -- ==========================================
  -- 1. GOOGLE BIGQUERY SQL
  -- ==========================================
  DECLARE start_date DATE DEFAULT DATE_SUB(CURRENT_DATE(), INTERVAL 90 DAY);
  DECLARE end_date DATE DEFAULT DATE_SUB(CURRENT_DATE(), INTERVAL 1 DAY);
  
  -- Purchase hits in the window with event-level fulfillment_method and traffic_type pivoted from event_params
  WITH purchase_hits AS (
    SELECT
      ecommerce.transaction_id AS transaction_id,
      PARSE_DATE('%Y%m%d', event_date) AS event_date,
      LOWER((SELECT ep.value.string_value FROM UNNEST(event_params) AS ep WHERE ep.key = 'fulfillment_method')) AS fulfillment_method,
      (SELECT ep.value.string_value FROM UNNEST(event_params) AS ep WHERE ep.key = 'traffic_type') AS traffic_type
    FROM `your-project.analytics_123456789.events_*`
    WHERE _TABLE_SUFFIX BETWEEN FORMAT_DATE('%Y%m%d', start_date) AND FORMAT_DATE('%Y%m%d', end_date)
      AND event_name = 'purchase'
      AND ecommerce.transaction_id IS NOT NULL
  ),
  -- One row per order: first purchase date as order date; curbside if any hit maps to a curbside value (split orders count once); internal if any hit is internal
  orders AS (
    SELECT
      transaction_id,
      MIN(event_date) AS order_date,
      LOGICAL_OR(fulfillment_method IN ('curbside', 'curbside_pickup', 'drive_up', 'kerbside')) AS is_curbside,
      LOGICAL_OR(traffic_type = 'internal') AS is_internal
    FROM purchase_hits
    GROUP BY transaction_id
  )
  -- Distinct curbside orders by order date, internal and test orders excluded, cancelled orders kept
  SELECT
    order_date,
    COUNT(DISTINCT transaction_id) AS curbside_orders
  FROM orders
  WHERE is_curbside
    AND NOT COALESCE(is_internal, FALSE)
  GROUP BY order_date
  ORDER BY order_date;

AEP Query Service SQL: |
  -- ==========================================
  -- 2. ADOBE AEP QUERY SERVICE SQL
  -- ==========================================
  -- Reporting window: last 90 complete days
  WITH params AS (
    SELECT date_sub(current_date(), 90) AS start_date, date_sub(current_date(), 1) AS end_date
  ),
  -- Purchase hits in the window with the tenant fulfillmentMethod and trafficType (tenant counterpart of GA4 traffic_type)
  purchase_hits AS (
    SELECT
      e.commerce.order.purchaseID AS transaction_id,
      to_date(e.timestamp) AS event_date,
      lower(e._tenantId.fulfillmentMethod) AS fulfillment_method,
      e._tenantId.trafficType AS traffic_type
    FROM aep_web_events_dataset AS e
    CROSS JOIN params AS p
    WHERE e.eventType = 'commerce.purchases'
      AND to_date(e.timestamp) BETWEEN p.start_date AND p.end_date
      AND e.commerce.order.purchaseID IS NOT NULL
  ),
  -- One row per order: first purchase date as order date; curbside if any hit maps to a curbside value (split orders count once); internal if any hit is internal
  orders AS (
    SELECT
      transaction_id,
      MIN(event_date) AS order_date,
      MAX(CASE WHEN fulfillment_method IN ('curbside', 'curbside_pickup', 'drive_up', 'kerbside') THEN 1 ELSE 0 END) AS is_curbside,
      MAX(CASE WHEN traffic_type = 'internal' THEN 1 ELSE 0 END) AS is_internal
    FROM purchase_hits
    GROUP BY transaction_id
  )
  -- Distinct curbside orders by order date, internal and test orders excluded, cancelled orders kept
  SELECT
    order_date,
    COUNT(DISTINCT transaction_id) AS curbside_orders
  FROM orders
  WHERE is_curbside = 1
    AND is_internal = 0
  GROUP BY order_date
  ORDER BY order_date;

Calculation Notes: |
  1️⃣ Distinct transaction_id on purchase events with fulfillment_method = 'curbside'; repeat purchase hits for one order count once.,2️⃣ Counted on the order date, not the pickup date; the method selected at checkout holds even if the customer later switches pickup type.,3️⃣ Subset of BOPIS Orders: in-store counter, locker and ship-to-store pickups are excluded and stay in their own counts.,4️⃣ Map platform values (curbside_pickup, drive_up, kerbside) to curbside through the fulfillment-method dimension before counting.,5️⃣ Tagging rule: the purchase hit sends order-level fulfillment_method 'curbside' when any line is curbside; split orders count once.,6️⃣ Internal and test orders (traffic_type = internal) are excluded; cancelled orders stay in, since the metric counts orders placed.,7️⃣ Not the curbside-pickup-check-in event: arrivals and handovers are measured by that event and Pickups Completed, after the order.

Business Use Case: |
  1️⃣ Store operations staffs curbside bays and runners per store and hour from last week's curbside order count.,2️⃣ Sales reviews curbside orders in stores newly enabled for curbside and widens or pauses the rollout.,3️⃣ Marketing tracks curbside orders during a pickup promotion and ends the offer if the count stays flat.


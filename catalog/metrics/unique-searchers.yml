Google Analytics SQL: |
  -- ==========================================
  -- 1. GOOGLE BIGQUERY SQL
  -- ==========================================
  -- Reporting window: trailing 90 complete days
  DECLARE start_date DATE DEFAULT DATE_SUB(CURRENT_DATE(), INTERVAL 90 DAY);
  DECLARE end_date DATE DEFAULT DATE_SUB(CURRENT_DATE(), INTERVAL 1 DAY);
  
  -- Known bot traffic is removed at collection by GA4 known-bot filtering; the export carries no bot flag
  -- Pivot the search parameters of every search event in the window
  WITH search_events AS (
    SELECT
      user_pseudo_id,
      (SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'search_term') AS search_term,
      (SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'search_type') AS search_type,
      (SELECT COALESCE(value.string_value, CAST(value.int_value AS STRING)) FROM UNNEST(event_params) WHERE key = 'is_refire') AS is_refire,
      (SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'traffic_type') AS traffic_type
    FROM `your-project.analytics_123456789.events_*`
    WHERE _TABLE_SUFFIX BETWEEN FORMAT_DATE('%Y%m%d', start_date) AND FORMAT_DATE('%Y%m%d', end_date)
      AND event_name = 'search'
  )
  -- Count each user once: non-blank product searches, no refires, no internal traffic
  SELECT
    COUNT(DISTINCT user_pseudo_id) AS unique_searchers
  FROM search_events
  WHERE NULLIF(TRIM(search_term), '') IS NOT NULL
    AND search_type = 'product'
    AND COALESCE(LOWER(is_refire), 'false') NOT IN ('true', '1')
    AND COALESCE(traffic_type, '') != 'internal';

AEP Query Service SQL: |
  -- ==========================================
  -- 2. ADOBE AEP QUERY SERVICE SQL
  -- ==========================================
  -- Reporting window: trailing 90 complete days (same as start_date / end_date in the BigQuery query)
  -- Known bot traffic is removed at collection by Adobe bot rules; the dataset carries no bot flag
  -- Search events in the window with their search fields
  WITH search_events AS (
    SELECT
      endUserIDs.userPseudoId.id AS user_pseudo_id,
      search.term AS search_term,
      search.type AS search_type,
      search.isRefire AS is_refire,
      search.trafficType AS traffic_type
    FROM aep_web_events_dataset
    WHERE timestamp >= CAST(DATE_SUB(CURRENT_DATE, 90) AS TIMESTAMP)
      AND timestamp < CAST(CURRENT_DATE AS TIMESTAMP)
      AND eventType = 'search'
  )
  -- Count each user once: non-blank product searches, no refires, no internal traffic
  SELECT
    COUNT(DISTINCT user_pseudo_id) AS unique_searchers
  FROM search_events
  WHERE NULLIF(TRIM(search_term), '') IS NOT NULL
    AND search_type = 'product'
    AND COALESCE(is_refire, FALSE) = FALSE
    AND COALESCE(traffic_type, '') != 'internal';

Calculation Notes: |
  1️⃣ A user counts once per window however many searches they run; daily values do not sum to a weekly or monthly total.,2️⃣ Count the unified search event only; view_search_results belongs to Search Results Views and is not used here.,3️⃣ Exclude search events with an empty or whitespace-only search_term and refires (is_refire = true); a re-sent search alone does not qualify.,4️⃣ Product catalog search only: exclude store-locator and help-centre searches (search_type other than product).,5️⃣ Exclude traffic_type = 'internal' and known bot traffic; staff and QA searches inflate counts on low-traffic sites.,6️⃣ Identity is user_pseudo_id; cleared cookies and multiple devices inflate the count unless user_id stitching is applied and stated.,7️⃣ Autocomplete selections that load a results page count; queries typed but never submitted do not.

Business Use Case: |
  1️⃣ Merchandising tracks weekly Unique Searchers against Unique Visitors and flags a drop in search reach to Product.,2️⃣ Product compares Unique Searchers by device category after a search UI release and rolls back if mobile falls.,3️⃣ Site search owners use daily Unique Searchers to size ranking A/B tests and set their minimum run time.


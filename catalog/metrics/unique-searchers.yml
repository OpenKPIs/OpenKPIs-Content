Metric Name: Unique Searchers
Formula: COUNT(DISTINCT user_pseudo_id WHERE event_name = 'search' AND TRIM(search_term) != '' AND is_refire != true AND search_type = 'product' AND traffic_type != 'internal' AND event_date IN reporting window)

Description: |
  De-duplicated count of distinct users who ran at least one site search in the reporting window. Each user counts once however many searches they run; it is the numerator of Site Search Usage Rate.

Category: Engagement



























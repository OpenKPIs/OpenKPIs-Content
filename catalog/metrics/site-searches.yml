Metric Name: Site Searches
Formula: COUNT(search events) WHERE NORMALIZE(search_term) IS NOT NULL AND is_refire = FALSE — NORMALIZE = lower-case, trim, collapse internal whitespace; is_refire = TRUE when the collected is_refire flag is true OR (NORMALIZE(search_term) equals the previous normalised search_term in the same session AND page_number > 1); sort, filter and back/forward re-fires are excluded only through the is_refire flag set by the site at collection

Description: |
  Site Searches counts the internal search queries shoppers submit on the storefront, recorded through the unified search event with the query string and the number of results returned. Pagination, sort and filter reloads of the same query are excluded, which makes it the reliable volume base for Zero-Results Search Rate, Search-to-Purchase Conversion Rate and search-led merchandising decisions.


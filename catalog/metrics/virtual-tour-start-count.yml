Calculation Notes: |
  Count each deduplicated qualifying start event in the reporting period. The instrumentation must emit no more than one virtual_tour_started event per viewer_instance_id; closing and reopening the viewer creates a new instance and may produce another valid start. Repeated starts by the same user, session, listing, or tour are retained because this is an event count rather than a unique-user, unique-session, or unique-listing metric. A click on a tour button does not qualify unless the viewer subsequently confirms a successful launch. Events arriving late are assigned to the period containing event_timestamp rather than ingestion_timestamp and are eligible for restatement during the defined late-arrival window. Embedded and full-screen launches are counted consistently when they satisfy the same success criteria.

Business Use Case: |
  The Consumer Product team compares virtual tour starts and launch success rates by listing, device, tour provider, and page placement. If starts fall while launch clicks remain stable, the team investigates viewer errors or load performance; if starts increase and downstream inquiries or scheduled tours also improve, it expands virtual-tour coverage and gives the successful placement greater prominence.



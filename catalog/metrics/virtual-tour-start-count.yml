      COALESCE(p.campaign_source, collected_campaign_source) AS campaign_source,
      COALESCE(p.campaign_medium, collected_campaign_medium) AS campaign_medium,
      COALESCE(p.campaign_name, collected_campaign_name) AS campaign_name,
      p.experiment_id,
      p.experiment_variant,
      p.engagement_time_msec,
      p.event_value AS value,
      p.non_interaction,
      ROW_NUMBER() OVER (
        PARTITION BY COALESCE(
          p.event_id,
          CONCAT(
            COALESCE(user_pseudo_id, 'unknown'), '|',
            CAST(event_timestamp AS STRING), '|',
            COALESCE(p.tour_id, p.content_id, 'unknown')
          )
        )
        ORDER BY event_timestamp, COALESCE(p.event_sequence, 0)
      ) AS event_deduplication_rank
    FROM source_events
    WHERE p.content_type = 'virtual_tour'
      AND p.trigger_type = 'viewer_ready'
      AND p.viewer_state = 'ready'
      AND p.load_status = 'loaded'
      AND p.event_status = 'success'

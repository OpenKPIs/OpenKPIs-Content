Metric Name: Virtual Tour Start Count
Formula: COUNT(DISTINCT event_id) WHERE event_name = 'virtual_tour_started' AND launch_status = 'success' AND listing_id IS NOT NULL AND virtual_tour_id IS NOT NULL AND COALESCE(is_test_event, false) = false AND COALESCE(is_bot, false) = false

Description: |
  Counts successful launches of an eligible virtual property tour during the selected reporting period, including each distinct qualifying start by the same user or session. A start is counted only when the tour viewer confirms that the experience has loaded and is available for viewing, not when the launch control is merely clicked.

Category: Engagement

Tags: [metric]

Industry: Real Estate Tech

Priority: High

Core Area: Discovery

Scope: Event

Measure Type: count

Aggregation Window: Time based - Hourly/Daily/Monthly/Yearly


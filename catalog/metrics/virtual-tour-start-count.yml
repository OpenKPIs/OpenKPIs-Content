      item.SKU AS tour_id,
      CAST(NULL AS VARCHAR) AS tour_provider,
      CAST(NULL AS VARCHAR) AS tour_type,
      CAST(NULL AS VARCHAR) AS tour_version,
      'ready' AS viewer_state,
      'loaded' AS load_status,
      CAST(NULL AS BIGINT) AS load_duration_ms,
      CAST(NULL AS VARCHAR) AS launch_surface,
      CAST(NULL AS VARCHAR) AS launch_method,
      web.webPageDetails.URL AS page_url,
      web.webPageDetails.name AS page_title,
      CAST(NULL AS VARCHAR) AS page_type,
      web.webReferrer.URL AS referrer_url,
      CAST(NULL AS VARCHAR) AS site_name,
      web.webPageDetails.siteSection AS site_section,
      environment.browserDetails.acceptLanguage AS language,
      placeContext.geo.countryCode AS country,
      item.currencyCode AS currency,
      identityMap['CRMID'][0].id AS user_id,
      identityMap['ECID'][0].id AS anonymous_id,
      CAST(NULL AS VARCHAR) AS session_id,
      CAST(NULL AS VARCHAR) AS consent_analytics,
      CAST(NULL AS VARCHAR) AS consent_personalization,
      device.type AS device_type,
      environment.type AS platform,
      environment.browserDetails.name AS browser,
      marketing.trackingCode AS campaign_id,
      CAST(NULL AS VARCHAR) AS campaign_source,
      CAST(NULL AS VARCHAR) AS campaign_medium,
      CAST(NULL AS VARCHAR) AS campaign_name,
      CAST(NULL AS VARCHAR) AS experiment_id,
      CAST(NULL AS VARCHAR) AS experiment_variant,
      CAST(NULL AS BIGINT) AS engagement_time_msec,
      item.priceTotal AS value,
      CAST(NULL AS BOOLEAN) AS non_interaction,
      ROW_NUMBER() OVER (
        PARTITION BY event_id

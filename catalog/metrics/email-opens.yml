Metric Name: Email Opens
Formula: COUNT(open events) on delivered marketing emails, by open timestamp in the reporting period, excluding test, seed and internal sends; unique opens = COUNT(DISTINCT recipient_id, send_id)

Description: |
  Total opens of delivered marketing emails, as logged by the email service provider from tracking-pixel loads. Repeat opens count; unique opens is the one-per-recipient variant.

Category: Engagement



























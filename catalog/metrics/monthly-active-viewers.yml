Metric Name: Monthly Active Viewers
Formula: COUNT(DISTINCT CASE WHEN is_qualified_view = TRUE AND event_timestamp >= month_start_utc AND event_timestamp < next_month_start_utc THEN canonical_viewer_id END)

Description: |
  Monthly Active Viewers measures the distinct digital viewers who generate at least one qualified content-viewing session during a calendar month. A viewer qualifies after accumulating at least 30 seconds of active playback, or viewing at least 50% of eligible content shorter than 30 seconds, across supported streaming applications and websites.

Category: Engagement

Tags: [metric]

Industry: Media & Streaming

Priority: High

Core Area: Engagement

Scope: User

Measure Type: count

Aggregation Window: Time based - Monthly


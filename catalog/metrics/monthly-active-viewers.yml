Google Analytics SQL: |
  -- ==========================================
  -- 1. GOOGLE BIGQUERY SQL
  -- ==========================================
  -- Parameters:
  --   @start_date DATE -- inclusive
  --   @end_date   DATE -- exclusive
  -- Output grain: one active viewer per calendar month.
  -- Attributes represent the viewer's first qualifying view in that month.
  WITH source_events AS (
    SELECT
      e.event_timestamp,
      e.user_pseudo_id,
      e.user_id,
      (
        SELECT AS STRUCT
          MAX(IF(ep.key = 'event_id', ep.value.string_value, NULL)) AS event_id,
          MAX(IF(ep.key = 'viewer_id_type', ep.value.string_value, NULL)) AS viewer_id_type,
          MAX(IF(ep.key = 'session_id', COALESCE(ep.value.string_value, CAST(ep.value.int_value AS STRING)), NULL)) AS session_id,
          MAX(IF(ep.key = 'platform', ep.value.string_value, NULL)) AS platform,
          MAX(IF(ep.key = 'application_id', ep.value.string_value, NULL)) AS application_id,
          MAX(IF(ep.key = 'application_name', ep.value.string_value, NULL)) AS application_name,
          MAX(IF(ep.key = 'application_version', ep.value.string_value, NULL)) AS application_version,
          MAX(IF(ep.key = 'site_name', ep.value.string_value, NULL)) AS site_name,
          MAX(IF(ep.key = 'page_location', ep.value.string_value, NULL)) AS page_location,
          MAX(IF(ep.key = 'page_referrer', ep.value.string_value, NULL)) AS page_referrer,
          MAX(IF(ep.key = 'device_category', ep.value.string_value, NULL)) AS device_category,
          MAX(IF(ep.key = 'operating_system', ep.value.string_value, NULL)) AS operating_system,
          MAX(IF(ep.key = 'browser', ep.value.string_value, NULL)) AS browser,
          MAX(IF(ep.key = 'country', ep.value.string_value, NULL)) AS country,
          MAX(IF(ep.key = 'region', ep.value.string_value, NULL)) AS region,
          MAX(IF(ep.key = 'language', ep.value.string_value, NULL)) AS language,
          MAX(IF(ep.key = 'analytics_consent', ep.value.string_value, NULL)) AS analytics_consent,
          MAX(IF(ep.key = 'content_id', ep.value.string_value, NULL)) AS content_id,
          MAX(IF(ep.key = 'video_title', ep.value.string_value, NULL)) AS video_title,
          MAX(IF(ep.key = 'content_type', ep.value.string_value, NULL)) AS content_type,
          MAX(IF(ep.key = 'video_duration', COALESCE(CAST(ep.value.int_value AS FLOAT64), ep.value.double_value, ep.value.float_value, SAFE_CAST(ep.value.string_value AS FLOAT64)), NULL)) AS video_duration,
          MAX(IF(ep.key = 'video_current_time', COALESCE(CAST(ep.value.int_value AS FLOAT64), ep.value.double_value, ep.value.float_value, SAFE_CAST(ep.value.string_value AS FLOAT64)), NULL)) AS video_current_time,
          MAX(IF(ep.key = 'video_percent', COALESCE(CAST(ep.value.int_value AS FLOAT64), ep.value.double_value, ep.value.float_value, SAFE_CAST(ep.value.string_value AS FLOAT64)), NULL)) AS video_percent,
          MAX(IF(ep.key = 'eligible_content', LOWER(COALESCE(ep.value.string_value, CAST(ep.value.int_value AS STRING))), NULL)) AS eligible_content_value,
          MAX(IF(ep.key = 'short_content', LOWER(COALESCE(ep.value.string_value, CAST(ep.value.int_value AS STRING))), NULL)) AS short_content_value,
          MAX(IF(ep.key = 'active_playback_seconds', COALESCE(CAST(ep.value.int_value AS FLOAT64), ep.value.double_value, ep.value.float_value, SAFE_CAST(ep.value.string_value AS FLOAT64)), NULL)) AS active_playback_seconds,
          MAX(IF(ep.key = 'qualification_method', ep.value.string_value, NULL)) AS qualification_method,
          MAX(IF(ep.key = 'qualification_threshold_seconds', COALESCE(CAST(ep.value.int_value AS FLOAT64), ep.value.double_value, ep.value.float_value, SAFE_CAST(ep.value.string_value AS FLOAT64)), NULL)) AS qualification_threshold_seconds,
          MAX(IF(ep.key = 'qualification_threshold_percent', COALESCE(CAST(ep.value.int_value AS FLOAT64), ep.value.double_value, ep.value.float_value, SAFE_CAST(ep.value.string_value AS FLOAT64)), NULL)) AS qualification_threshold_percent,
          MAX(IF(ep.key = 'qualified_view', LOWER(COALESCE(ep.value.string_value, CAST(ep.value.int_value AS STRING))), NULL)) AS qualified_view_value,
          MAX(IF(ep.key = 'video_provider', ep.value.string_value, NULL)) AS video_provider,
          MAX(IF(ep.key = 'player_name', ep.value.string_value, NULL)) AS player_name,
          MAX(IF(ep.key = 'player_version', ep.value.string_value, NULL)) AS player_version,
          MAX(IF(ep.key = 'playback_session_id', ep.value.string_value, NULL)) AS playback_session_id,
          MAX(IF(ep.key = 'stream_type', ep.value.string_value, NULL)) AS stream_type,
          MAX(IF(ep.key = 'media_type', ep.value.string_value, NULL)) AS media_type,
          MAX(IF(ep.key = 'channel', ep.value.string_value, NULL)) AS channel,
          MAX(IF(ep.key = 'series_name', ep.value.string_value, NULL)) AS series_name,
          MAX(IF(ep.key = 'season_number', COALESCE(ep.value.int_value, SAFE_CAST(ep.value.string_value AS INT64)), NULL)) AS season_number,
          MAX(IF(ep.key = 'episode_number', COALESCE(ep.value.int_value, SAFE_CAST(ep.value.string_value AS INT64)), NULL)) AS episode_number,
          MAX(IF(ep.key = 'genre', ep.value.string_value, NULL)) AS genre,
          MAX(IF(ep.key = 'autoplay', LOWER(COALESCE(ep.value.string_value, CAST(ep.value.int_value AS STRING))), NULL)) AS autoplay_value,
          MAX(IF(ep.key = 'muted', LOWER(COALESCE(ep.value.string_value, CAST(ep.value.int_value AS STRING))), NULL)) AS muted_value,
          MAX(IF(ep.key = 'playback_rate', COALESCE(CAST(ep.value.int_value AS FLOAT64), ep.value.double_value, ep.value.float_value, SAFE_CAST(ep.value.string_value AS FLOAT64)), NULL)) AS playback_rate,
          MAX(IF(ep.key = 'ad_status', ep.value.string_value, NULL)) AS ad_status,
          MAX(IF(ep.key = 'subscription_tier', ep.value.string_value, NULL)) AS subscription_tier
        FROM UNNEST(e.event_params) AS ep
      ) AS a
    FROM `your-project.analytics_123456789.events_*` AS e
    WHERE e.event_name = 'video_progress'
      AND _TABLE_SUFFIX >= FORMAT_DATE('%Y%m%d', @start_date)
      AND _TABLE_SUFFIX < FORMAT_DATE('%Y%m%d', @end_date)
  ),
  normalized_events AS (
    SELECT
      a.event_id,
      TIMESTAMP_MICROS(event_timestamp) AS event_timestamp,
      user_pseudo_id,
      user_id,
      COALESCE(
        a.viewer_id_type,
        IF(user_id IS NOT NULL, 'authenticated', 'anonymous')
      ) AS viewer_id_type,
      a.session_id,
      a.platform,
      a.application_id,
      a.application_name,
      a.application_version,
      a.site_name,
      a.page_location,
      a.page_referrer,
      a.device_category,
      a.operating_system,
      a.browser,
      a.country,
      a.region,
      a.language,
      a.analytics_consent,
      a.content_id,
      a.video_title,
      a.content_type,
      a.video_duration,
      a.video_current_time,
      a.video_percent,
      a.eligible_content_value IN ('true', '1') AS eligible_content,
      a.short_content_value IN ('true', '1') AS short_content,
      a.active_playback_seconds,
      a.qualification_method,
      a.qualification_threshold_seconds,
      a.qualification_threshold_percent,
      a.qualified_view_value IN ('true', '1') AS qualified_view,
      a.video_provider,
      a.player_name,
      a.player_version,
      a.playback_session_id,
      a.stream_type,
      a.media_type,
      a.channel,
      a.series_name,
      a.season_number,
      a.episode_number,
      a.genre,
      a.autoplay_value IN ('true', '1') AS autoplay,
      a.muted_value IN ('true', '1') AS muted,
      a.playback_rate,
      a.ad_status,
      a.subscription_tier,
      CASE
        WHEN user_id IS NOT NULL THEN CONCAT('user:', user_id)
        WHEN user_pseudo_id IS NOT NULL THEN CONCAT('anonymous:', user_pseudo_id)
      END AS viewer_key
    FROM source_events
  ),
  qualified_events AS (
    SELECT
      *,
      COALESCE(
        event_id,
        TO_HEX(SHA256(CONCAT(
          COALESCE(CAST(event_timestamp AS STRING), ''), '|',
          COALESCE(viewer_key, ''), '|',
          COALESCE(session_id, ''), '|',
          COALESCE(playback_session_id, ''), '|',
          COALESCE(content_id, '')
        )))
      ) AS event_deduplication_key
    FROM normalized_events
    WHERE viewer_key IS NOT NULL
      AND LOWER(COALESCE(analytics_consent, 'denied')) = 'granted'
      AND eligible_content IS TRUE
      AND qualified_view IS TRUE
      AND LOWER(COALESCE(ad_status, 'content')) = 'content'
  ),
  deduplicated_events AS (
    SELECT * EXCEPT(event_deduplication_key)
    FROM qualified_events
    QUALIFY ROW_NUMBER() OVER (
      PARTITION BY event_deduplication_key
      ORDER BY event_timestamp
    ) = 1
  ),
  monthly_active_viewer_detail AS (
    SELECT
      DATE_TRUNC(DATE(event_timestamp, 'UTC'), MONTH) AS activity_month,
      *
    FROM deduplicated_events
    QUALIFY ROW_NUMBER() OVER (
      PARTITION BY DATE_TRUNC(DATE(event_timestamp, 'UTC'), MONTH), viewer_key
      ORDER BY event_timestamp, event_id, playback_session_id, content_id
    ) = 1
  )
  SELECT
    activity_month,
    viewer_key,
    event_id,
    event_timestamp,
    user_pseudo_id,
    user_id,
    viewer_id_type,
    session_id,
    platform,
    application_id,
    application_name,
    application_version,
    site_name,
    page_location,
    page_referrer,
    device_category,
    operating_system,
    browser,
    country,
    region,
    language,
    analytics_consent,
    content_id,
    video_title,
    content_type,
    video_duration,
    video_current_time,
    video_percent,
    eligible_content,
    short_content,
    active_playback_seconds,
    qualification_method,
    qualification_threshold_seconds,
    qualification_threshold_percent,
    qualified_view,
    video_provider,
    player_name,
    player_version,
    playback_session_id,
    stream_type,
    media_type,
    channel,
    series_name,
    season_number,
    episode_number,
    genre,
    autoplay,
    muted,
    playback_rate,
    ad_status,
    subscription_tier,
    COUNT(*) OVER (PARTITION BY activity_month) AS monthly_active_viewers
  FROM monthly_active_viewer_detail
  ORDER BY activity_month, viewer_key;

AEP Query Service SQL: |
  -- ==========================================
  -- 2. ADOBE AEP QUERY SERVICE SQL
  -- ==========================================
  -- Output grain: one active viewer per calendar month.
  -- Attributes represent the viewer's first qualifying view in that month.
  WITH normalized_events AS (
    SELECT
      _id AS event_id,
      timestamp AS event_timestamp,
      identityMap['ECID'][0].id AS user_pseudo_id,
      identityMap['CRMID'][0].id AS user_id,
      CASE
        WHEN identityMap['CRMID'][0].id IS NOT NULL THEN 'authenticated'
        ELSE 'anonymous'
      END AS viewer_id_type,
      CAST(NULL AS VARCHAR) AS session_id,
      CASE
        WHEN environment.type = 'browser' THEN 'web'
        ELSE environment.type
      END AS platform,
      application.id AS application_id,
      application.name AS application_name,
      application.version AS application_version,
      CAST(NULL AS VARCHAR) AS site_name,
      web.webPageDetails.URL AS page_location,
      web.webReferrer.URL AS page_referrer,
      device.type AS device_category,
      environment.operatingSystem AS operating_system,
      environment.browserDetails.name AS browser,
      placeContext.geo.countryCode AS country,
      placeContext.geo.stateProvince AS region,
      environment.language AS language,
      CASE
        WHEN consents.collect.val = 'y' THEN 'granted'
        ELSE 'denied'
      END AS analytics_consent,
      mediaCollection.sessionDetails.assetID AS content_id,
      mediaCollection.sessionDetails.friendlyName AS video_title,
      mediaCollection.sessionDetails.contentType AS content_type,
      CAST(mediaCollection.sessionDetails.length AS DOUBLE) AS video_duration,
      CAST(mediaCollection.playhead AS DOUBLE) AS video_current_time,
      CASE
        WHEN mediaCollection.sessionDetails.length > 0
        THEN 100.0 * mediaCollection.playhead / mediaCollection.sessionDetails.length
      END AS video_percent,
      CASE
        WHEN _experience.analytics.customDimensions.props.prop1 = 'qualified_content_view' THEN TRUE
        ELSE FALSE
      END AS eligible_content,
      CASE
        WHEN mediaCollection.sessionDetails.length < 60 THEN TRUE
        ELSE FALSE
      END AS short_content,
      CAST(mediaCollection.playhead AS DOUBLE) AS active_playback_seconds,
      COALESCE(
        _experience.analytics.customDimensions.props.prop2,
        _experience.analytics.customDimensions.eVars.eVar4
      ) AS qualification_method,
      CAST(30 AS DOUBLE) AS qualification_threshold_seconds,
      CAST(50 AS DOUBLE) AS qualification_threshold_percent,
      CASE
        WHEN _experience.analytics.customDimensions.props.prop1 = 'qualified_content_view' THEN TRUE
        ELSE FALSE
      END AS qualified_view,
      mediaCollection.sessionDetails.publisher AS video_provider,
      mediaCollection.sessionDetails.playerName AS player_name,
      CAST(NULL AS VARCHAR) AS player_version,
      mediaCollection.sessionID AS playback_session_id,
      mediaCollection.sessionDetails.streamType AS stream_type,
      'video' AS media_type,
      mediaCollection.sessionDetails.channel AS channel,
      mediaCollection.sessionDetails.show AS series_name,
      CAST(mediaCollection.sessionDetails.season AS INTEGER) AS season_number,
      CAST(mediaCollection.sessionDetails.episode AS INTEGER) AS episode_number,
      mediaCollection.sessionDetails.genre AS genre,
      CAST(NULL AS BOOLEAN) AS autoplay,
      CAST(NULL AS BOOLEAN) AS muted,
      CAST(NULL AS DOUBLE) AS playback_rate,
      COALESCE(_experience.analytics.customDimensions.props.prop5, 'content') AS ad_status,
      COALESCE(
        _experience.analytics.customDimensions.props.prop4,
        _experience.analytics.customDimensions.eVars.eVar5
      ) AS subscription_tier,
      CASE
        WHEN identityMap['CRMID'][0].id IS NOT NULL
          THEN CONCAT('user:', identityMap['CRMID'][0].id)
        WHEN identityMap['ECID'][0].id IS NOT NULL
          THEN CONCAT('anonymous:', identityMap['ECID'][0].id)
      END AS viewer_key
    FROM aep_media_event_dataset
    WHERE eventType = 'media.ping'
  ),
  qualified_events AS (
    SELECT
      *,
      COALESCE(
        event_id,
        CONCAT(
          COALESCE(CAST(event_timestamp AS VARCHAR), ''), '|',
          COALESCE(viewer_key, ''), '|',
          COALESCE(playback_session_id, ''), '|',
          COALESCE(content_id, '')
        )
      ) AS event_deduplication_key
    FROM normalized_events
    WHERE viewer_key IS NOT NULL
      AND analytics_consent = 'granted'
      AND eligible_content = TRUE
      AND qualified_view = TRUE
      AND LOWER(COALESCE(ad_status, 'content')) = 'content'
  ),
  deduplication_ranked AS (
    SELECT
      *,
      ROW_NUMBER() OVER (
        PARTITION BY event_deduplication_key
        ORDER BY event_timestamp
      ) AS event_deduplication_rank
    FROM qualified_events
  ),
  deduplicated_events AS (
    SELECT *
    FROM deduplication_ranked
    WHERE event_deduplication_rank = 1
  ),
  monthly_viewer_ranked AS (
    SELECT
      DATE_TRUNC('month', event_timestamp) AS activity_month,
      *,
      ROW_NUMBER() OVER (
        PARTITION BY DATE_TRUNC('month', event_timestamp), viewer_key
        ORDER BY event_timestamp, event_id, playback_session_id, content_id
      ) AS monthly_viewer_rank
    FROM deduplicated_events
  ),
  monthly_active_viewer_detail AS (
    SELECT *
    FROM monthly_viewer_ranked
    WHERE monthly_viewer_rank = 1
  )
  SELECT
    activity_month,
    viewer_key,
    event_id,
    event_timestamp,
    user_pseudo_id,
    user_id,
    viewer_id_type,
    session_id,
    platform,
    application_id,
    application_name,
    application_version,
    site_name,
    page_location,
    page_referrer,
    device_category,
    operating_system,
    browser,
    country,
    region,
    language,
    analytics_consent,
    content_id,
    video_title,
    content_type,
    video_duration,
    video_current_time,
    video_percent,
    eligible_content,
    short_content,
    active_playback_seconds,
    qualification_method,
    qualification_threshold_seconds,
    qualification_threshold_percent,
    qualified_view,
    video_provider,
    player_name,
    player_version,
    playback_session_id,
    stream_type,
    media_type,
    channel,
    series_name,
    season_number,
    episode_number,
    genre,
    autoplay,
    muted,
    playback_rate,
    ad_status,
    subscription_tier,
    COUNT(*) OVER (PARTITION BY activity_month) AS monthly_active_viewers
  FROM monthly_active_viewer_detail
  ORDER BY activity_month, viewer_key;

Calculation Notes: |
  1️⃣ Use the canonical viewer identifier resolved from authenticated profile ID first and a stable first-party pseudonymous device or browser ID otherwise.
  2️⃣ Qualify playback at 30 seconds of active viewing, or 50% completion for eligible content shorter than 30 seconds; exclude buffering, paused time, and background playback where detectable.
  3️⃣ Include eligible video-on-demand, live, linear-stream, and replay content; exclude advertisements, trailers, autoplay previews, test assets, and operational monitoring streams.
  4️⃣ Count each canonical viewer once per calendar month regardless of devices, playback sessions, titles, or subscription states.
  5️⃣ Use UTC calendar-month boundaries for the certified global metric; property-local-time variants must be labeled separately and must not be combined.
  6️⃣ Apply a 30-minute inactivity timeout when reconstructing playback sessions, but do not require sessionization when trusted cumulative playback telemetry already establishes qualification.
  7️⃣ Reprocess late or corrected events for seven days after month-end, then publish the certified monthly value and process subsequent changes through controlled restatement.

Business Use Case: |
  The Chief Product Officer and audience-growth team use Monthly Active Viewers to determine whether content releases, product improvements, and audience-acquisition investments are expanding meaningful digital reach. If total viewing hours rise while Monthly Active Viewers declines, the team prioritizes acquisition and reactivation; if Monthly Active Viewers rises while viewing hours per viewer falls, it investigates content relevance, playback quality, recommendation effectiveness, and early-viewer retention.



      CAST(e._streamingAnalytics.ad_duration_ms AS BIGINT) AS ad_duration_ms,
      CAST(e._streamingAnalytics.inactive_duration_ms AS BIGINT) AS inactive_duration_ms,
      CAST(e._streamingAnalytics.excluded_duration_ms AS BIGINT) AS excluded_duration_ms,
      CAST(e._streamingAnalytics.eligible_session AS BOOLEAN) AS eligible_session,
      CAST(e._streamingAnalytics.is_playing AS BOOLEAN) AS is_playing,
      CAST(e._streamingAnalytics.is_paused AS BOOLEAN) AS is_paused,
      CAST(e._streamingAnalytics.is_buffering AS BOOLEAN) AS is_buffering,
      CAST(e._streamingAnalytics.is_ad_playing AS BOOLEAN) AS is_ad_playing,
      CAST(e._streamingAnalytics.is_in_foreground AS BOOLEAN) AS is_in_foreground,
      CAST(e._streamingAnalytics.is_visible AS BOOLEAN) AS is_visible,
      CAST(e._streamingAnalytics.has_focus AS BOOLEAN) AS has_focus,
      CAST(e._streamingAnalytics.playback_rate AS DOUBLE) AS playback_rate,
      CAST(e._streamingAnalytics.mute_status AS BOOLEAN) AS mute_status,
      CAST(e._streamingAnalytics.volume_percent AS INTEGER) AS volume_percent,
      e._streamingAnalytics.network_type AS network_type,
      e._streamingAnalytics.consent_status AS consent_status
    FROM streaming_analytics_event_dataset AS e
    WHERE e.eventType = 'media.ping'
      AND e.timestamp >= CAST(:start_timestamp AS TIMESTAMP)
      AND e.timestamp < CAST(:end_timestamp AS TIMESTAMP)
  ),
  event_ranked AS (
    SELECT
      source_events.*,
      ROW_NUMBER() OVER (
        PARTITION BY COALESCE(event_id, xdm_event_id)
        ORDER BY event_timestamp DESC, xdm_event_timestamp DESC
      ) AS event_id_rank
    FROM source_events
    WHERE viewing_session_id IS NOT NULL
  ),
  heartbeat_ranked AS (
    SELECT
      event_ranked.*,
      ROW_NUMBER() OVER (
        PARTITION BY viewing_session_id, heartbeat_sequence
        ORDER BY event_timestamp DESC, event_id DESC
      ) AS heartbeat_rank
    FROM event_ranked
    WHERE event_id_rank = 1
  ),
  eligible_intervals AS (
    SELECT *
    FROM heartbeat_ranked
    WHERE heartbeat_rank = 1
      AND eligible_session = TRUE
      AND LOWER(consent_status) = 'granted'
      AND interval_start_timestamp IS NOT NULL
      AND interval_end_timestamp IS NOT NULL
      AND interval_end_timestamp >= interval_start_timestamp
  ),
  session_rollup AS (
    SELECT
      viewing_session_id,
      MAX(session_id) AS session_id,
      MAX(user_pseudo_id) AS user_pseudo_id,
      MAX(platform) AS platform,
      MAX(device_type) AS device_type,
      MAX(app_id) AS app_id,
      MAX(app_version) AS app_version,
      MAX(page_location) AS page_location,
      MAX(page_referrer) AS page_referrer,
      MAX(content_id) AS content_id,
      MAX(content_title) AS content_title,
      MAX(content_type) AS content_type,
      MAX(content_duration_ms) AS content_duration_ms,
      MAX(content_position_ms) AS final_content_position_ms,
      MAX(content_genre) AS content_genre,
      MAX(series_name) AS series_name,
      MAX(season_number) AS season_number,
      MAX(episode_number) AS episode_number,
      MAX(channel_name) AS channel_name,
      MAX(stream_type) AS stream_type,
      MAX(player_name) AS player_name,
      MAX(player_version) AS player_version,
      MAX(playback_session_id) AS playback_session_id,
      MIN(session_start_timestamp) AS session_start_timestamp,
      MIN(event_timestamp) AS first_event_timestamp,
      MAX(event_timestamp) AS last_event_timestamp,
      MIN(interval_start_timestamp) AS first_interval_start_timestamp,
      MAX(interval_end_timestamp) AS last_interval_end_timestamp,
      MIN(heartbeat_sequence) AS first_heartbeat_sequence,
      MAX(heartbeat_sequence) AS last_heartbeat_sequence,
      COUNT(*) AS heartbeat_count,
      COUNT(DISTINCT event_id) AS distinct_event_count,
      SUM(GREATEST(COALESCE(interval_duration_ms, 0), 0)) AS reported_interval_duration_ms,
      SUM(GREATEST(COALESCE(active_viewing_duration_ms, 0), 0)) AS viewing_session_duration_ms,
      SUM(GREATEST(COALESCE(paused_duration_ms, 0), 0)) AS paused_duration_ms,
      SUM(GREATEST(COALESCE(buffering_duration_ms, 0), 0)) AS buffering_duration_ms,
      SUM(GREATEST(COALESCE(ad_duration_ms, 0), 0)) AS ad_duration_ms,
      SUM(GREATEST(COALESCE(inactive_duration_ms, 0), 0)) AS inactive_duration_ms,
      SUM(GREATEST(COALESCE(excluded_duration_ms, 0), 0)) AS excluded_duration_ms,
      MAX(CASE WHEN is_playing THEN 1 ELSE 0 END) = 1 AS was_playing,
      MAX(CASE WHEN is_paused THEN 1 ELSE 0 END) = 1 AS was_paused,
      MAX(CASE WHEN is_buffering THEN 1 ELSE 0 END) = 1 AS was_buffering,
      MAX(CASE WHEN is_ad_playing THEN 1 ELSE 0 END) = 1 AS had_ad_playback,
      MAX(CASE WHEN is_in_foreground THEN 1 ELSE 0 END) = 1 AS was_in_foreground,
      MAX(CASE WHEN is_visible THEN 1 ELSE 0 END) = 1 AS was_visible,
      MAX(CASE WHEN has_focus THEN 1 ELSE 0 END) = 1 AS had_focus,
      AVG(playback_rate) AS average_playback_rate,
      MAX(CASE WHEN mute_status THEN 1 ELSE 0 END) = 1 AS was_muted,
      AVG(volume_percent) AS average_volume_percent,
      MAX(network_type) AS network_type,
      MAX(consent_status) AS consent_status,
      TRUE AS eligible_session
    FROM eligible_intervals
    GROUP BY viewing_session_id
    HAVING SUM(GREATEST(COALESCE(active_viewing_duration_ms, 0), 0)) > 0
  )
  SELECT
    session_rollup.*,
    CAST(viewing_session_duration_ms AS DOUBLE) / 1000.0 AS viewing_session_duration_seconds,
    AVG(viewing_session_duration_ms) OVER () AS average_viewing_session_duration_ms,
    AVG(viewing_session_duration_ms) OVER () / 1000.0 AS average_viewing_session_duration_seconds,
    COUNT(*) OVER () AS eligible_viewing_session_count,
    SUM(viewing_session_duration_ms) OVER () AS total_viewing_duration_ms
  FROM session_rollup
  ORDER BY session_start_timestamp, viewing_session_id;

Calculation Notes: |
  1️⃣ Build each viewing session from digital playback telemetry using a stable session identifier; where unavailable, sessionize activity by device or app instance with a 30-minute inactivity timeout.
  2️⃣ Calculate session duration as the sum of non-overlapping active content-playback intervals, not the wall-clock difference between the first and last event.
  3️⃣ Exclude paused, buffering, seeking, loading, backgrounded, advertising, preview-autoplay, and heartbeat intervals without confirmed playback progression.
  4️⃣ Include only sessions with at least 10 seconds of validated active viewing and exclude test traffic, bots, monitoring agents, internal QA devices, and known telemetry corruption.
  5️⃣ Deduplicate retries and duplicate playback events using event ID, playback ID, event timestamp, and sequence number before constructing intervals.
  6️⃣ Assign a session to the reporting period by session-start timestamp in the approved reporting timezone; process late-arriving events through the governed restatement window.
  7️⃣ Compute the average from session-level durations rather than averaging device-, content-, or hourly-level averages; report the result in seconds and format as minutes or hours for presentation.

Business Use Case: |
  The Product organization compares this metric by content title, subscription tier, platform, app version, and playback experience to identify where viewers sustain or lose engagement. Executives can prioritize content promotion, player-performance remediation, recommendation changes, or release-strategy adjustments when materially shorter sessions are concentrated in specific audiences or digital experiences.



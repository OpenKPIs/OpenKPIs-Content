  WITH event_parameter_pivot AS (
    SELECT
      e.event_date,
      e.event_timestamp AS ga4_event_timestamp_micros,
      e.event_name,
      e.user_pseudo_id AS ga4_user_pseudo_id,
      MAX(IF(ep.key = 'event_id', ep.value.string_value, NULL)) AS event_id,
      MAX(IF(ep.key = 'event_timestamp', ep.value.string_value, NULL)) AS event_timestamp_raw,
      MAX(IF(ep.key = 'session_id', COALESCE(ep.value.string_value, CAST(ep.value.int_value AS STRING)), NULL)) AS session_id,
      MAX(IF(ep.key = 'user_pseudo_id', ep.value.string_value, NULL)) AS parameter_user_pseudo_id,
      MAX(IF(ep.key = 'platform', ep.value.string_value, NULL)) AS platform,
      MAX(IF(ep.key = 'device_type', ep.value.string_value, NULL)) AS device_type,
      MAX(IF(ep.key = 'app_id', ep.value.string_value, NULL)) AS app_id,
      MAX(IF(ep.key = 'app_version', ep.value.string_value, NULL)) AS app_version,
      MAX(IF(ep.key = 'page_location', ep.value.string_value, NULL)) AS page_location,
      MAX(IF(ep.key = 'page_referrer', ep.value.string_value, NULL)) AS page_referrer,
      MAX(IF(ep.key = 'content_id', ep.value.string_value, NULL)) AS content_id,
      MAX(IF(ep.key = 'content_title', ep.value.string_value, NULL)) AS content_title,
      MAX(IF(ep.key = 'content_type', ep.value.string_value, NULL)) AS content_type,
      MAX(IF(ep.key = 'content_duration_ms', COALESCE(CAST(ep.value.int_value AS STRING), ep.value.string_value), NULL)) AS content_duration_ms_raw,
      MAX(IF(ep.key = 'content_position_ms', COALESCE(CAST(ep.value.int_value AS STRING), ep.value.string_value), NULL)) AS content_position_ms_raw,
      MAX(IF(ep.key = 'content_genre', ep.value.string_value, NULL)) AS content_genre,
      MAX(IF(ep.key = 'series_name', ep.value.string_value, NULL)) AS series_name,
      MAX(IF(ep.key = 'season_number', COALESCE(CAST(ep.value.int_value AS STRING), ep.value.string_value), NULL)) AS season_number_raw,
      MAX(IF(ep.key = 'episode_number', COALESCE(CAST(ep.value.int_value AS STRING), ep.value.string_value), NULL)) AS episode_number_raw,
      MAX(IF(ep.key = 'channel_name', ep.value.string_value, NULL)) AS channel_name,
      MAX(IF(ep.key = 'stream_type', ep.value.string_value, NULL)) AS stream_type,
      MAX(IF(ep.key = 'player_name', ep.value.string_value, NULL)) AS player_name,
      MAX(IF(ep.key = 'player_version', ep.value.string_value, NULL)) AS player_version,
      MAX(IF(ep.key = 'playback_session_id', ep.value.string_value, NULL)) AS playback_session_id,
      MAX(IF(ep.key = 'viewing_session_id', ep.value.string_value, NULL)) AS viewing_session_id,
      MAX(IF(ep.key = 'session_start_timestamp', ep.value.string_value, NULL)) AS session_start_timestamp_raw,
      MAX(IF(ep.key = 'heartbeat_sequence', COALESCE(CAST(ep.value.int_value AS STRING), ep.value.string_value), NULL)) AS heartbeat_sequence_raw,
      MAX(IF(ep.key = 'interval_start_timestamp', ep.value.string_value, NULL)) AS interval_start_timestamp_raw,
      MAX(IF(ep.key = 'interval_end_timestamp', ep.value.string_value, NULL)) AS interval_end_timestamp_raw,
      MAX(IF(ep.key = 'interval_duration_ms', COALESCE(CAST(ep.value.int_value AS STRING), ep.value.string_value), NULL)) AS interval_duration_ms_raw,
      MAX(IF(ep.key = 'active_viewing_duration_ms', COALESCE(CAST(ep.value.int_value AS STRING), ep.value.string_value), NULL)) AS active_viewing_duration_ms_raw,
      MAX(IF(ep.key = 'paused_duration_ms', COALESCE(CAST(ep.value.int_value AS STRING), ep.value.string_value), NULL)) AS paused_duration_ms_raw,
      MAX(IF(ep.key = 'buffering_duration_ms', COALESCE(CAST(ep.value.int_value AS STRING), ep.value.string_value), NULL)) AS buffering_duration_ms_raw,
      MAX(IF(ep.key = 'ad_duration_ms', COALESCE(CAST(ep.value.int_value AS STRING), ep.value.string_value), NULL)) AS ad_duration_ms_raw,
      MAX(IF(ep.key = 'inactive_duration_ms', COALESCE(CAST(ep.value.int_value AS STRING), ep.value.string_value), NULL)) AS inactive_duration_ms_raw,
      MAX(IF(ep.key = 'excluded_duration_ms', COALESCE(CAST(ep.value.int_value AS STRING), ep.value.string_value), NULL)) AS excluded_duration_ms_raw,
      MAX(IF(ep.key = 'eligible_session', COALESCE(ep.value.string_value, CAST(ep.value.int_value AS STRING)), NULL)) AS eligible_session_raw,
      MAX(IF(ep.key = 'is_playing', COALESCE(ep.value.string_value, CAST(ep.value.int_value AS STRING)), NULL)) AS is_playing_raw,
      MAX(IF(ep.key = 'is_paused', COALESCE(ep.value.string_value, CAST(ep.value.int_value AS STRING)), NULL)) AS is_paused_raw,
      MAX(IF(ep.key = 'is_buffering', COALESCE(ep.value.string_value, CAST(ep.value.int_value AS STRING)), NULL)) AS is_buffering_raw,
      MAX(IF(ep.key = 'is_ad_playing', COALESCE(ep.value.string_value, CAST(ep.value.int_value AS STRING)), NULL)) AS is_ad_playing_raw,
      MAX(IF(ep.key = 'is_in_foreground', COALESCE(ep.value.string_value, CAST(ep.value.int_value AS STRING)), NULL)) AS is_in_foreground_raw,
      MAX(IF(ep.key = 'is_visible', COALESCE(ep.value.string_value, CAST(ep.value.int_value AS STRING)), NULL)) AS is_visible_raw,
      MAX(IF(ep.key = 'has_focus', COALESCE(ep.value.string_value, CAST(ep.value.int_value AS STRING)), NULL)) AS has_focus_raw,
      MAX(IF(ep.key = 'playback_rate', COALESCE(CAST(ep.value.double_value AS STRING), CAST(ep.value.float_value AS STRING), CAST(ep.value.int_value AS STRING), ep.value.string_value), NULL)) AS playback_rate_raw,
      MAX(IF(ep.key = 'mute_status', COALESCE(ep.value.string_value, CAST(ep.value.int_value AS STRING)), NULL)) AS mute_status_raw,
      MAX(IF(ep.key = 'volume_percent', COALESCE(CAST(ep.value.int_value AS STRING), ep.value.string_value), NULL)) AS volume_percent_raw,
      MAX(IF(ep.key = 'network_type', ep.value.string_value, NULL)) AS network_type,
      MAX(IF(ep.key = 'consent_status', ep.value.string_value, NULL)) AS consent_status
    FROM `your-project.analytics_123456789.events_*` AS e
    LEFT JOIN UNNEST(e.event_params) AS ep ON TRUE
    WHERE _TABLE_SUFFIX BETWEEN FORMAT_DATE('%Y%m%d', @start_date) AND FORMAT_DATE('%Y%m%d', @end_date)
      AND e.event_name = 'video_progress'
    GROUP BY e.event_date, e.event_timestamp, e.event_name, e.user_pseudo_id
  ),
  typed_events AS (
    SELECT
      event_date,
      event_name,
      event_id,
      COALESCE(SAFE_CAST(event_timestamp_raw AS TIMESTAMP), TIMESTAMP_MICROS(ga4_event_timestamp_micros)) AS event_timestamp,
      session_id,
      COALESCE(parameter_user_pseudo_id, ga4_user_pseudo_id) AS user_pseudo_id,
      platform,
      device_type,
      app_id,
      app_version,
      page_location,
      page_referrer,
      content_id,
      content_title,
      content_type,
      SAFE_CAST(content_duration_ms_raw AS INT64) AS content_duration_ms,
      SAFE_CAST(content_position_ms_raw AS INT64) AS content_position_ms,
      content_genre,
      series_name,
      SAFE_CAST(season_number_raw AS INT64) AS season_number,
      SAFE_CAST(episode_number_raw AS INT64) AS episode_number,
      channel_name,
      stream_type,
      player_name,
      player_version,
      playback_session_id,
      viewing_session_id,
      SAFE_CAST(session_start_timestamp_raw AS TIMESTAMP) AS session_start_timestamp,
      SAFE_CAST(heartbeat_sequence_raw AS INT64) AS heartbeat_sequence,
      SAFE_CAST(interval_start_timestamp_raw AS TIMESTAMP) AS interval_start_timestamp,
      SAFE_CAST(interval_end_timestamp_raw AS TIMESTAMP) AS interval_end_timestamp,
      SAFE_CAST(interval_duration_ms_raw AS INT64) AS interval_duration_ms,
      SAFE_CAST(active_viewing_duration_ms_raw AS INT64) AS active_viewing_duration_ms,
      SAFE_CAST(paused_duration_ms_raw AS INT64) AS paused_duration_ms,
      SAFE_CAST(buffering_duration_ms_raw AS INT64) AS buffering_duration_ms,
      SAFE_CAST(ad_duration_ms_raw AS INT64) AS ad_duration_ms,
      SAFE_CAST(inactive_duration_ms_raw AS INT64) AS inactive_duration_ms,
      SAFE_CAST(excluded_duration_ms_raw AS INT64) AS excluded_duration_ms,
      LOWER(eligible_session_raw) IN ('true', '1') AS eligible_session,
      LOWER(is_playing_raw) IN ('true', '1') AS is_playing,
      LOWER(is_paused_raw) IN ('true', '1') AS is_paused,
      LOWER(is_buffering_raw) IN ('true', '1') AS is_buffering,
      LOWER(is_ad_playing_raw) IN ('true', '1') AS is_ad_playing,
      LOWER(is_in_foreground_raw) IN ('true', '1') AS is_in_foreground,
      LOWER(is_visible_raw) IN ('true', '1') AS is_visible,
      LOWER(has_focus_raw) IN ('true', '1') AS has_focus,
      SAFE_CAST(playback_rate_raw AS FLOAT64) AS playback_rate,
      LOWER(mute_status_raw) IN ('true', '1') AS mute_status,
      SAFE_CAST(volume_percent_raw AS INT64) AS volume_percent,
      network_type,
      consent_status
    FROM event_parameter_pivot
  ),
  event_id_deduplicated AS (
    SELECT *
    FROM typed_events
    WHERE viewing_session_id IS NOT NULL
    QUALIFY ROW_NUMBER() OVER (
      PARTITION BY COALESCE(event_id, CONCAT(viewing_session_id, '|', CAST(heartbeat_sequence AS STRING), '|', CAST(event_timestamp AS STRING)))
      ORDER BY event_timestamp DESC
    ) = 1
  ),
  heartbeat_deduplicated AS (
    SELECT *
    FROM event_id_deduplicated
    QUALIFY ROW_NUMBER() OVER (
      PARTITION BY viewing_session_id, heartbeat_sequence
      ORDER BY event_timestamp DESC, event_id DESC
    ) = 1
  ),
  eligible_intervals AS (
    SELECT *
    FROM heartbeat_deduplicated
    WHERE eligible_session IS TRUE
      AND LOWER(consent_status) = 'granted'
      AND interval_start_timestamp IS NOT NULL
      AND interval_end_timestamp IS NOT NULL
      AND interval_end_timestamp >= interval_start_timestamp
  ),
  session_rollup AS (
    SELECT
      viewing_session_id,
      MAX(session_id) AS session_id,
      MAX(user_pseudo_id) AS user_pseudo_id,
      MAX(platform) AS platform,
      MAX(device_type) AS device_type,
      MAX(app_id) AS app_id,
      MAX(app_version) AS app_version,
      MAX(page_location) AS page_location,
      MAX(page_referrer) AS page_referrer,
      MAX(content_id) AS content_id,
      MAX(content_title) AS content_title,
      MAX(content_type) AS content_type,
      MAX(content_duration_ms) AS content_duration_ms,
      MAX(content_position_ms) AS final_content_position_ms,
      MAX(content_genre) AS content_genre,
      MAX(series_name) AS series_name,
      MAX(season_number) AS season_number,
      MAX(episode_number) AS episode_number,
      MAX(channel_name) AS channel_name,
      MAX(stream_type) AS stream_type,
      MAX(player_name) AS player_name,
      MAX(player_version) AS player_version,
      MAX(playback_session_id) AS playback_session_id,
      MIN(session_start_timestamp) AS session_start_timestamp,
      MIN(event_timestamp) AS first_event_timestamp,
      MAX(event_timestamp) AS last_event_timestamp,
      MIN(interval_start_timestamp) AS first_interval_start_timestamp,
      MAX(interval_end_timestamp) AS last_interval_end_timestamp,
      MIN(heartbeat_sequence) AS first_heartbeat_sequence,
      MAX(heartbeat_sequence) AS last_heartbeat_sequence,
      COUNT(*) AS heartbeat_count,
      COUNT(DISTINCT event_id) AS distinct_event_count,
      SUM(GREATEST(COALESCE(interval_duration_ms, 0), 0)) AS reported_interval_duration_ms,
      SUM(GREATEST(COALESCE(active_viewing_duration_ms, 0), 0)) AS viewing_session_duration_ms,
      SUM(GREATEST(COALESCE(paused_duration_ms, 0), 0)) AS paused_duration_ms,
      SUM(GREATEST(COALESCE(buffering_duration_ms, 0), 0)) AS buffering_duration_ms,
      SUM(GREATEST(COALESCE(ad_duration_ms, 0), 0)) AS ad_duration_ms,
      SUM(GREATEST(COALESCE(inactive_duration_ms, 0), 0)) AS inactive_duration_ms,
      SUM(GREATEST(COALESCE(excluded_duration_ms, 0), 0)) AS excluded_duration_ms,
      LOGICAL_OR(is_playing) AS was_playing,
      LOGICAL_OR(is_paused) AS was_paused,
      LOGICAL_OR(is_buffering) AS was_buffering,
      LOGICAL_OR(is_ad_playing) AS had_ad_playback,
      LOGICAL_OR(is_in_foreground) AS was_in_foreground,
      LOGICAL_OR(is_visible) AS was_visible,
      LOGICAL_OR(has_focus) AS had_focus,
      AVG(playback_rate) AS average_playback_rate,
      LOGICAL_OR(mute_status) AS was_muted,
      AVG(volume_percent) AS average_volume_percent,
      MAX(network_type) AS network_type,
      MAX(consent_status) AS consent_status,
      TRUE AS eligible_session
    FROM eligible_intervals
    GROUP BY viewing_session_id
    HAVING SUM(GREATEST(COALESCE(active_viewing_duration_ms, 0), 0)) > 0
  )
  SELECT
    session_rollup.*,
    viewing_session_duration_ms / 1000.0 AS viewing_session_duration_seconds,
    AVG(viewing_session_duration_ms) OVER () AS average_viewing_session_duration_ms,
    AVG(viewing_session_duration_ms) OVER () / 1000.0 AS average_viewing_session_duration_seconds,
    COUNT(*) OVER () AS eligible_viewing_session_count,
    SUM(viewing_session_duration_ms) OVER () AS total_viewing_duration_ms
  FROM session_rollup
  ORDER BY session_start_timestamp, viewing_session_id;


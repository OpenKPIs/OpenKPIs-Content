Metric Name: Average Viewing Session Duration
Formula: SUM(eligible_viewing_session_duration_seconds) / COUNT(DISTINCT eligible_viewing_session_id)

Description: |
  Measures the average active content-viewing time accumulated within an eligible digital viewing session during the reporting period. It quantifies session-level engagement while excluding inactive, paused, buffering, advertising, and otherwise non-viewing intervals.

Category: Engagement

Tags: [metric]

Industry: Media & Streaming

Priority: High

Core Area: Engagement

Scope: Session

Measure Type: average

Aggregation Window: Time based - Hourly/Daily/Monthly/Yearly


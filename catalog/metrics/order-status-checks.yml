Metric Name: Order Status Checks
Formula: COUNT(DISTINCT CONCAT(session_id, transaction_id)) over order status check events in the reporting period

Description: |
  Count of self-service lookups in which a customer viewed the status of an existing order, via the account order page or the guest order-lookup form. Feeds the WISMO Rate KPI.


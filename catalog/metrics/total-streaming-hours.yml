Google Analytics SQL: |
  -- ==========================================
  -- 1. GOOGLE BIGQUERY SQL
  -- ==========================================
  WITH parameter_pivot AS (
    SELECT
      e.event_timestamp AS ga_event_timestamp_micros,
      e.event_bundle_sequence_id,
      e.event_server_timestamp_offset,
      MAX(IF(ep.key = 'telemetry_event_id', ep.value.string_value, NULL)) AS telemetry_event_id,
      MAX(IF(ep.key = 'event_timestamp', ep.value.string_value, NULL)) AS telemetry_event_timestamp,
      MAX(IF(ep.key = 'session_id', ep.value.string_value, NULL)) AS session_id,
      MAX(IF(ep.key = 'playback_session_id', ep.value.string_value, NULL)) AS playback_session_id,
      COALESCE(
        MAX(IF(ep.key = 'heartbeat_sequence', ep.value.int_value, NULL)),
        SAFE_CAST(MAX(IF(ep.key = 'heartbeat_sequence', ep.value.string_value, NULL)) AS INT64)
      ) AS heartbeat_sequence,
      MAX(IF(ep.key = 'platform', ep.value.string_value, NULL)) AS platform,
      MAX(IF(ep.key = 'device_type', ep.value.string_value, NULL)) AS device_type,
      MAX(IF(ep.key = 'operating_system', ep.value.string_value, NULL)) AS operating_system,
      MAX(IF(ep.key = 'app_id', ep.value.string_value, NULL)) AS app_id,
      MAX(IF(ep.key = 'app_version', ep.value.string_value, NULL)) AS app_version,
      MAX(IF(ep.key = 'player_name', ep.value.string_value, NULL)) AS player_name,
      MAX(IF(ep.key = 'player_version', ep.value.string_value, NULL)) AS player_version,
      MAX(IF(ep.key = 'content_id', ep.value.string_value, NULL)) AS content_id,
      MAX(IF(ep.key = 'video_title', ep.value.string_value, NULL)) AS content_title,
      MAX(IF(ep.key = 'content_type', ep.value.string_value, NULL)) AS content_type,
      MAX(IF(ep.key = 'series_id', ep.value.string_value, NULL)) AS series_id,
      MAX(IF(ep.key = 'series_title', ep.value.string_value, NULL)) AS series_title,
      COALESCE(
        MAX(IF(ep.key = 'season_number', ep.value.int_value, NULL)),
        SAFE_CAST(MAX(IF(ep.key = 'season_number', ep.value.string_value, NULL)) AS INT64)
      ) AS season_number,
      COALESCE(
        MAX(IF(ep.key = 'episode_number', ep.value.int_value, NULL)),
        SAFE_CAST(MAX(IF(ep.key = 'episode_number', ep.value.string_value, NULL)) AS INT64)
      ) AS episode_number,
      MAX(IF(ep.key = 'genre', ep.value.string_value, NULL)) AS genre,
      MAX(IF(ep.key = 'video_provider', ep.value.string_value, NULL)) AS content_provider,
      MAX(IF(ep.key = 'channel', ep.value.string_value, NULL)) AS channel,
      MAX(IF(ep.key = 'stream_type', ep.value.string_value, NULL)) AS stream_type,
      MAX(IF(ep.key = 'stream_format', ep.value.string_value, NULL)) AS stream_format,
      MAX(IF(ep.key = 'entitlement_type', ep.value.string_value, NULL)) AS entitlement_type,
      COALESCE(
        MAX(IF(ep.key = 'video_current_time', ep.value.double_value, NULL)),
        CAST(MAX(IF(ep.key = 'video_current_time', ep.value.int_value, NULL)) AS FLOAT64),
        CAST(MAX(IF(ep.key = 'video_current_time', ep.value.float_value, NULL)) AS FLOAT64),
        SAFE_CAST(MAX(IF(ep.key = 'video_current_time', ep.value.string_value, NULL)) AS FLOAT64)
      ) AS playback_position_seconds,
      COALESCE(
        MAX(IF(ep.key = 'video_duration', ep.value.double_value, NULL)),
        CAST(MAX(IF(ep.key = 'video_duration', ep.value.int_value, NULL)) AS FLOAT64),
        CAST(MAX(IF(ep.key = 'video_duration', ep.value.float_value, NULL)) AS FLOAT64),
        SAFE_CAST(MAX(IF(ep.key = 'video_duration', ep.value.string_value, NULL)) AS FLOAT64)
      ) AS content_duration_seconds,
      COALESCE(
        MAX(IF(ep.key = 'heartbeat_interval_seconds', ep.value.double_value, NULL)),
        CAST(MAX(IF(ep.key = 'heartbeat_interval_seconds', ep.value.int_value, NULL)) AS FLOAT64),
        SAFE_CAST(MAX(IF(ep.key = 'heartbeat_interval_seconds', ep.value.string_value, NULL)) AS FLOAT64)
      ) AS heartbeat_interval_seconds,
      COALESCE(
        MAX(IF(ep.key = 'validated_playback_seconds', ep.value.double_value, NULL)),
        CAST(MAX(IF(ep.key = 'validated_playback_seconds', ep.value.int_value, NULL)) AS FLOAT64),
        CAST(MAX(IF(ep.key = 'validated_playback_seconds', ep.value.float_value, NULL)) AS FLOAT64),
        SAFE_CAST(MAX(IF(ep.key = 'validated_playback_seconds', ep.value.string_value, NULL)) AS FLOAT64)
      ) AS validated_playback_seconds,
      COALESCE(MAX(IF(ep.key = 'paused_seconds', ep.value.double_value, NULL)), CAST(MAX(IF(ep.key = 'paused_seconds', ep.value.int_value, NULL)) AS FLOAT64), SAFE_CAST(MAX(IF(ep.key = 'paused_seconds', ep.value.string_value, NULL)) AS FLOAT64)) AS paused_seconds,
      COALESCE(MAX(IF(ep.key = 'buffering_seconds', ep.value.double_value, NULL)), CAST(MAX(IF(ep.key = 'buffering_seconds', ep.value.int_value, NULL)) AS FLOAT64), SAFE_CAST(MAX(IF(ep.key = 'buffering_seconds', ep.value.string_value, NULL)) AS FLOAT64)) AS buffering_seconds,
      COALESCE(MAX(IF(ep.key = 'ad_seconds', ep.value.double_value, NULL)), CAST(MAX(IF(ep.key = 'ad_seconds', ep.value.int_value, NULL)) AS FLOAT64), SAFE_CAST(MAX(IF(ep.key = 'ad_seconds', ep.value.string_value, NULL)) AS FLOAT64)) AS ad_seconds,
      COALESCE(MAX(IF(ep.key = 'other_non_content_seconds', ep.value.double_value, NULL)), CAST(MAX(IF(ep.key = 'other_non_content_seconds', ep.value.int_value, NULL)) AS FLOAT64), SAFE_CAST(MAX(IF(ep.key = 'other_non_content_seconds', ep.value.string_value, NULL)) AS FLOAT64)) AS other_non_content_seconds,
      MAX(IF(ep.key = 'playback_state', ep.value.string_value, NULL)) AS playback_state,
      COALESCE(MAX(IF(ep.key = 'is_playing', ep.value.string_value, NULL)), CAST(MAX(IF(ep.key = 'is_playing', ep.value.int_value, NULL)) AS STRING)) AS is_playing_raw,
      COALESCE(MAX(IF(ep.key = 'is_muted', ep.value.string_value, NULL)), CAST(MAX(IF(ep.key = 'is_muted', ep.value.int_value, NULL)) AS STRING)) AS is_muted_raw,
      COALESCE(MAX(IF(ep.key = 'volume_percent', ep.value.int_value, NULL)), SAFE_CAST(MAX(IF(ep.key = 'volume_percent', ep.value.string_value, NULL)) AS INT64)) AS volume_percent,
      COALESCE(MAX(IF(ep.key = 'playback_rate', ep.value.double_value, NULL)), CAST(MAX(IF(ep.key = 'playback_rate', ep.value.int_value, NULL)) AS FLOAT64), SAFE_CAST(MAX(IF(ep.key = 'playback_rate', ep.value.string_value, NULL)) AS FLOAT64)) AS playback_rate,
      COALESCE(MAX(IF(ep.key = 'bitrate_kbps', ep.value.double_value, NULL)), CAST(MAX(IF(ep.key = 'bitrate_kbps', ep.value.int_value, NULL)) AS FLOAT64), SAFE_CAST(MAX(IF(ep.key = 'bitrate_kbps', ep.value.string_value, NULL)) AS FLOAT64)) AS bitrate_kbps,
      COALESCE(MAX(IF(ep.key = 'rendition_height', ep.value.int_value, NULL)), SAFE_CAST(MAX(IF(ep.key = 'rendition_height', ep.value.string_value, NULL)) AS INT64)) AS rendition_height,
      COALESCE(MAX(IF(ep.key = 'rendition_width', ep.value.int_value, NULL)), SAFE_CAST(MAX(IF(ep.key = 'rendition_width', ep.value.string_value, NULL)) AS INT64)) AS rendition_width,
      COALESCE(MAX(IF(ep.key = 'frames_per_second', ep.value.double_value, NULL)), CAST(MAX(IF(ep.key = 'frames_per_second', ep.value.int_value, NULL)) AS FLOAT64), SAFE_CAST(MAX(IF(ep.key = 'frames_per_second', ep.value.string_value, NULL)) AS FLOAT64)) AS frames_per_second,
      MAX(IF(ep.key = 'cdn_name', ep.value.string_value, NULL)) AS cdn_name,
      MAX(IF(ep.key = 'connection_type', ep.value.string_value, NULL)) AS connection_type,
      MAX(IF(ep.key = 'country', ep.value.string_value, NULL)) AS country,
      MAX(IF(ep.key = 'region', ep.value.string_value, NULL)) AS region,
      MAX(IF(ep.key = 'language', ep.value.string_value, NULL)) AS language,
      COALESCE(MAX(IF(ep.key = 'consent_analytics', ep.value.string_value, NULL)), CAST(MAX(IF(ep.key = 'consent_analytics', ep.value.int_value, NULL)) AS STRING)) AS consent_analytics_raw,
      MAX(IF(ep.key = 'validation_status', ep.value.string_value, NULL)) AS validation_status
    FROM `your-project.analytics_123456789.events_*` AS e
    CROSS JOIN UNNEST(e.event_params) AS ep
    WHERE _TABLE_SUFFIX BETWEEN @start_date AND @end_date
      AND e.event_name = 'video_progress'
    GROUP BY
      e.event_timestamp,
      e.event_bundle_sequence_id,
      e.event_server_timestamp_offset
  ),
  normalized AS (
    SELECT
      COALESCE(
        SAFE_CAST(telemetry_event_timestamp AS TIMESTAMP),
        TIMESTAMP_MICROS(ga_event_timestamp_micros)
      ) AS event_timestamp,
      telemetry_event_id,
      session_id,
      playback_session_id,
      heartbeat_sequence,
      platform,
      device_type,
      operating_system,
      app_id,
      app_version,
      player_name,
      player_version,
      content_id,
      content_title,
      content_type,
      series_id,
      series_title,
      season_number,
      episode_number,
      genre,
      content_provider,
      channel,
      stream_type,
      stream_format,
      entitlement_type,
      playback_position_seconds,
      content_duration_seconds,
      heartbeat_interval_seconds,
      validated_playback_seconds,
      paused_seconds,
      buffering_seconds,
      ad_seconds,
      other_non_content_seconds,
      playback_state,
      LOWER(is_playing_raw) IN ('true', '1') AS is_playing,
      LOWER(is_muted_raw) IN ('true', '1') AS is_muted,
      volume_percent,
      playback_rate,
      bitrate_kbps,
      rendition_height,
      rendition_width,
      frames_per_second,
      cdn_name,
      connection_type,
      country,
      region,
      language,
      LOWER(consent_analytics_raw) IN ('true', '1') AS consent_analytics,
      LOWER(validation_status) AS validation_status,
      ga_event_timestamp_micros,
      event_bundle_sequence_id,
      event_server_timestamp_offset,
      COALESCE(
        NULLIF(telemetry_event_id, ''),
        CONCAT(
          COALESCE(NULLIF(playback_session_id, ''), 'missing-session'), ':',
          CAST(COALESCE(heartbeat_sequence, -1) AS STRING), ':',
          CAST(ga_event_timestamp_micros AS STRING)
        )
      ) AS deduplication_key
    FROM parameter_pivot
  ),
  deduplicated AS (
    SELECT * EXCEPT (deduplication_rank)
    FROM (
      SELECT
        normalized.*,
        ROW_NUMBER() OVER (
          PARTITION BY deduplication_key
          ORDER BY
            ga_event_timestamp_micros DESC,
            event_bundle_sequence_id DESC,
            event_server_timestamp_offset DESC
        ) AS deduplication_rank
      FROM normalized
    )
    WHERE deduplication_rank = 1
  ),
  eligible_heartbeats AS (
    SELECT *
    FROM deduplicated
    WHERE consent_analytics IS TRUE
      AND validation_status = 'validated'
      AND validated_playback_seconds IS NOT NULL
      AND validated_playback_seconds >= 0
  )
  SELECT
    ROUND(SUM(validated_playback_seconds) / 3600.0, 6) AS total_streaming_hours
  FROM eligible_heartbeats;

AEP Query Service SQL: |
  -- ==========================================
  -- 2. ADOBE AEP QUERY SERVICE SQL
  -- ==========================================
  WITH normalized AS (
    SELECT
      CAST(COALESCE(_streamingTelemetry.eventTimestamp, timestamp) AS TIMESTAMP) AS event_timestamp,
      _streamingTelemetry.telemetryEventId AS telemetry_event_id,
      _streamingTelemetry.sessionId AS session_id,
      _streamingTelemetry.playbackSessionId AS playback_session_id,
      CAST(_streamingTelemetry.heartbeatSequence AS BIGINT) AS heartbeat_sequence,
      _streamingTelemetry.platform AS platform,
      _streamingTelemetry.deviceType AS device_type,
      _streamingTelemetry.operatingSystem AS operating_system,
      _streamingTelemetry.appId AS app_id,
      _streamingTelemetry.appVersion AS app_version,
      _streamingTelemetry.playerName AS player_name,
      _streamingTelemetry.playerVersion AS player_version,
      _streamingTelemetry.contentId AS content_id,
      _streamingTelemetry.contentTitle AS content_title,
      _streamingTelemetry.contentType AS content_type,
      _streamingTelemetry.seriesId AS series_id,
      _streamingTelemetry.seriesTitle AS series_title,
      CAST(_streamingTelemetry.seasonNumber AS BIGINT) AS season_number,
      CAST(_streamingTelemetry.episodeNumber AS BIGINT) AS episode_number,
      _streamingTelemetry.genre AS genre,
      _streamingTelemetry.contentProvider AS content_provider,
      _streamingTelemetry.channel AS channel,
      _streamingTelemetry.streamType AS stream_type,
      _streamingTelemetry.streamFormat AS stream_format,
      _streamingTelemetry.entitlementType AS entitlement_type,
      CAST(_streamingTelemetry.playbackPositionSeconds AS DOUBLE) AS playback_position_seconds,
      CAST(_streamingTelemetry.contentDurationSeconds AS DOUBLE) AS content_duration_seconds,
      CAST(_streamingTelemetry.heartbeatIntervalSeconds AS DOUBLE) AS heartbeat_interval_seconds,
      CAST(_streamingTelemetry.validatedPlaybackSeconds AS DOUBLE) AS validated_playback_seconds,
      CAST(_streamingTelemetry.pausedSeconds AS DOUBLE) AS paused_seconds,
      CAST(_streamingTelemetry.bufferingSeconds AS DOUBLE) AS buffering_seconds,
      CAST(_streamingTelemetry.adSeconds AS DOUBLE) AS ad_seconds,
      CAST(_streamingTelemetry.otherNonContentSeconds AS DOUBLE) AS other_non_content_seconds,
      _streamingTelemetry.playbackState AS playback_state,
      CAST(_streamingTelemetry.isPlaying AS BOOLEAN) AS is_playing,
      CAST(_streamingTelemetry.isMuted AS BOOLEAN) AS is_muted,
      CAST(_streamingTelemetry.volumePercent AS BIGINT) AS volume_percent,
      CAST(_streamingTelemetry.playbackRate AS DOUBLE) AS playback_rate,
      CAST(_streamingTelemetry.bitrateKbps AS DOUBLE) AS bitrate_kbps,
      CAST(_streamingTelemetry.renditionHeight AS BIGINT) AS rendition_height,
      CAST(_streamingTelemetry.renditionWidth AS BIGINT) AS rendition_width,
      CAST(_streamingTelemetry.framesPerSecond AS DOUBLE) AS frames_per_second,
      _streamingTelemetry.cdnName AS cdn_name,
      _streamingTelemetry.connectionType AS connection_type,
      _streamingTelemetry.country AS country,
      _streamingTelemetry.region AS region,
      _streamingTelemetry.language AS language,
      CAST(_streamingTelemetry.consentAnalytics AS BOOLEAN) AS consent_analytics,
      LOWER(_streamingTelemetry.validationStatus) AS validation_status,
      eventMergeId,
      eventType,
      COALESCE(
        NULLIF(_streamingTelemetry.telemetryEventId, ''),
        CONCAT(
          COALESCE(NULLIF(_streamingTelemetry.playbackSessionId, ''), 'missing-session'),
          ':',
          CAST(COALESCE(_streamingTelemetry.heartbeatSequence, -1) AS VARCHAR),
          ':',
          CAST(COALESCE(_streamingTelemetry.eventTimestamp, timestamp) AS VARCHAR)
        )
      ) AS deduplication_key
    FROM streaming_telemetry_dataset
    WHERE timestamp >= CAST(:start_timestamp AS TIMESTAMP)
      AND timestamp < CAST(:end_timestamp AS TIMESTAMP)
      AND eventType = 'media.ping'
  ),
  deduplicated AS (
    SELECT *
    FROM (
      SELECT
        normalized.*,
        ROW_NUMBER() OVER (
          PARTITION BY deduplication_key
          ORDER BY event_timestamp DESC, eventMergeId DESC
        ) AS deduplication_rank
      FROM normalized
    ) ranked
    WHERE deduplication_rank = 1
  ),
  eligible_heartbeats AS (
    SELECT *
    FROM deduplicated
    WHERE consent_analytics = TRUE
      AND validation_status = 'validated'
      AND validated_playback_seconds IS NOT NULL
      AND validated_playback_seconds >= 0
  )
  SELECT
    ROUND(SUM(validated_playback_seconds) / 3600.0, 6) AS total_streaming_hours
  FROM eligible_heartbeats;

Calculation Notes: |
  1️⃣ Calculate active playback from validated player-state transitions or heartbeat deltas, not session duration.
  2️⃣ Exclude paused, buffering, stalled, advertising, preview, trailer, error, and background-inactive intervals.
  3️⃣ Cap each heartbeat delta at the configured telemetry interval plus tolerance; treat larger gaps as unobserved time.
  4️⃣ Split playback intervals crossing reporting boundaries so seconds are allocated to the period in which consumption occurred.
  5️⃣ Count simultaneous valid streams additively because the metric represents delivered consumption, not unique viewer time.
  6️⃣ Use wall-clock playback time; do not inflate or reduce hours based on content playback speed or media-position movement.
  7️⃣ Accept late telemetry through the governed restatement window and recompute affected reporting partitions.

Business Use Case: |
  The Chief Product Officer and Content Strategy team compare streaming-hour trends by title, genre, subscription tier, device, and market to prioritize content investment, optimize release scheduling, identify engagement declines, and direct player-performance remediation toward experiences generating the greatest consumption impact.


Source Data: Digital Streaming Player Telemetry (web, mobile, connected-TV, smart-TV, and console playback-state and heartbeat events)


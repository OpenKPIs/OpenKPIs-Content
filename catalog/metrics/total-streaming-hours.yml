Metric Name: Total Streaming Hours
Formula: SUM(qualified_playback_seconds) / 3600

Description: |
  Total Streaming Hours measures the cumulative wall-clock time during which viewers actively consume qualifying streaming content across supported digital players. It sums validated playback time, excluding pauses, buffering, advertising, and other non-content intervals, and converts the result from seconds to hours.

Category: Engagement

Tags: [metric]

Industry: Media & Streaming

Priority: High

Core Area: Engagement

Scope: Event

Measure Type: count

Aggregation Window: Time based - Hourly/Daily/Monthly/Yearly


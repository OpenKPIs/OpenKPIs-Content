Metric Name: Churned Customers
Formula: COUNT(DISTINCT customer_id) WHERE last_purchase_date + inactivity_window (365 days) falls in the reporting period AND no purchase between last_purchase_date and the churn date

Description: |
  Count of customers whose last purchase passed the inactivity window (default 365 days) during the period with no repeat order. Numerator of customer churn rate and an input to Customer Retention Rate.

Category: Retention

Tags: [metric, E-commerce: Customer Retention, Loyalty & LTV]

Industry: E-commerce

Priority: High

Core Area: Engagement

Scope: User

Measure Type: Counter

Aggregation Window: Monthly, Quarterly, Yearly


  FROM aggregated AS a
  CROSS JOIN runtime AS r;

Calculation Notes: |
  1️⃣ Calculate at the distinct learner-course-enrollment grain and count each eligible enrollment once.
  2️⃣ Include only enrollments whose completion window ended on or before the reporting cutoff; exclude still-active completion opportunities.
  3️⃣ Recognize completion only when every mandatory rule for the applicable course version is satisfied within the allowed window.
  4️⃣ Use the earliest valid completion timestamp when duplicate or conflicting completion events exist.
  5️⃣ Exclude test, sandbox, QA, bot, administrator, instructor, deleted, fraudulent, canceled, and administratively ineligible enrollments.
  6️⃣ Exclude records missing eligibility, access-start, course-version, or completion-window data from the metric and route them to data-quality reporting.
  7️⃣ Return null when the eligible denominator is zero and restate affected cohorts when authoritative late-arriving events or corrections are received.

Business Use Case: |
  The Learning Product organization monitors monthly matured-cohort completion rates by course version, delivery format, learner segment, and assessment path. When a high-volume course falls below target, the team identifies the modules or assessments associated with abandonment, deploys content, reminder, or instructional changes, and compares completion-rate lift across subsequent matured cohorts.


Source Data: Digital Learning Platforms (LMS + LRS + Course Catalog)


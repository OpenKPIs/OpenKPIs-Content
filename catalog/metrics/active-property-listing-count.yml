Calculation Notes: |
  1️⃣ Calculate as a point-in-time inventory snapshot.  
  2️⃣ Count each canonical_listing_id once, regardless of multiple records.  
  3️⃣ Include listings that started before the snapshot timestamp and ended after.  
  4️⃣ Exclude drafts, rejected, deleted, test, spam, suppressed, and embargoed listings.  
  5️⃣ Ignore listings activated/deactivated between daily snapshots.  
  6️⃣ Count multiple legitimate listings for the same property separately unless canonicalized.  
  7️⃣ Treat active_end_at as an exclusive boundary.

Business Use Case: |
  Marketplace Operations reviews daily active listing inventory by market, property type, transaction type, and supply partner. If a priority market declines by more than 10% day over day, the team investigates feed failures, bulk expirations, moderation backlogs, or partner churn and can restore interrupted feeds, extend eligible listings, or launch targeted broker acquisition activity.



Metric Name: Help Center Views
Formula: COUNT(page_view) WHERE content_group = 'help_center' AND page_type NOT IN ('order_status', 'account_orders', 'contact_form') AND traffic_type != 'internal', by event date in the reporting period

Description: |
  Count of page views of help center and self-service pages, including help articles, FAQs and policy pages, in the period. It is the volume input to Self-Service Resolution Rate.


SQL Query: |
  WITH events AS (
    SELECT
      PARSE_DATE('%Y%m%d', event_date) AS event_date,
      user_pseudo_id,
      (SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'content_id') AS content_id,
      (SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'content_name') AS content_name,
      (SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'content_type') AS content_type,
      (SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'utm_source') AS utm_source,
      (SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'utm_medium') AS utm_medium,
      (SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'utm_campaign') AS utm_campaign,
      event_name
    FROM `project.dataset.events_*`
    WHERE event_name IN ('gated_content_view', 'gated_content_download')
  )
  SELECT
    event_date,
    content_id,
    ANY_VALUE(content_name) AS content_name,
    ANY_VALUE(content_type) AS content_type,
    utm_source,
    utm_medium,
    utm_campaign,
    COUNTIF(event_name = 'gated_content_view') AS gated_content_views,
    COUNTIF(event_name = 'gated_content_download') AS successful_gated_content_downloads,
    SAFE_DIVIDE(COUNTIF(event_name = 'gated_content_download'), COUNTIF(event_name = 'gated_content_view')) * 100 AS gated_content_download_rate
  FROM events
  WHERE content_id IS NOT NULL
  GROUP BY event_date, content_id, utm_source, utm_medium, utm_campaign
  ORDER BY event_date DESC, gated_content_download_rate DESC;

Calculation Notes: |
  Count only successful downloads where the gated asset is actually made available or downloaded after a valid form submission, SSO step, or progressive profiling step. Exclude ungated file_download events, bot traffic, internal employee traffic, QA/test submissions, duplicate rapid-fire clicks from the same user/session, and failed form submissions. The denominator should be gated content landing page views or gated_content_view events for the same asset; if the business prefers a form efficiency view, also track a separate metric using form submissions or form starts as the denominator. Use unique user/session deduplication when reporting audience-level conversion, but raw event counts may be useful for operational QA.

Business Use Case: |
  A demand generation team compares download rates across cybersecurity whitepapers, observability eBooks, and AIOps webinars by traffic source. If a high-value analyst report has strong paid LinkedIn traffic but a low download rate, the team can simplify the form, adjust page messaging, add proof points, or test ungating part of the content to improve lead capture efficiency.


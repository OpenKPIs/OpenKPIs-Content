# Metric: Gated Content Download Rate
# Generated: 2026-09-14T07:49:02.117Z
# Contributed by: devyendarm
# Last modified by: devyendarm

Metric Name: Gated Content Download Rate
Formula: Gated Content Download Rate = (Session × Asset Pairs with an Accepted Gated Asset Download ÷ Session × Asset Pairs with a Gated Content Landing Page View) × 100

Description: |
  Percentage of sessions that view a gated content landing page (whitepaper, analyst report, benchmark guide or technical eBook) and go on to clear the gate with an accepted asset download, measured per asset. It tells Demand Generation and Content Marketing how efficiently each gated asset turns landing page traffic into known, contactable prospects and where form friction is holding downloads back.

Category: Conversion

Tags: [metric, SaaS: Demand Generation & Content Marketing, gated content, lead generation, content marketing, form conversion]

Industry: ["SaaS", "Technology"], SaaS

Priority: High

Core Area: Engagement

Scope: Session

Measure Type: Percentage

Aggregation Window: Session, Content Asset, Campaign, Channel, Time based - Hourly/Daily/Weekly/Monthly/Quarterly/Yearly, Daily, Weekly, Monthly, Quarterly


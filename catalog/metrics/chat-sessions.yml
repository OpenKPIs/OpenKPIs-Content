Metric Name: Chat Sessions
Formula: COUNT(DISTINCT chat_conversation_id) WHERE event_name = 'chat_start' AND customer_engaged = true

Description: |
  Chat Sessions is the number of live-chat or virtual-agent conversations that customers start on the website or mobile app in a reporting period, counted once per conversation regardless of how many times the widget is opened or how many messages are exchanged. It sizes assisted-service demand alongside self-service content and ticket volume, and it is the denominator behind Chat Conversion Rate, Self-Service Resolution Rate and contact-per-order deflection targets.

Category: Experience

Tags: [metric, E-commerce: Returns, Refunds & Customer Support]

Industry: E-commerce

Priority: High

Core Area: Engagement

Scope: Event

Measure Type: Counter

Aggregation Window: Hourly, Daily, Weekly, Monthly, Quarterly


Metric Name: Search Results Views
Formula: COUNT(events WHERE event_name = 'view_search_results' AND event_date IN reporting window)

Description: |
  Counts every load of the search results page (GA4 view_search_results), including pagination, sort, filter and back-button re-views. Site Searches counts submitted queries; this counts results-page exposure.


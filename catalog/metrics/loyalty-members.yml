Metric Name: Loyalty Members
Formula: COUNT(DISTINCT customer_id) WHERE membership_status = 'active' AND enrolled_at <= period_end AND (cancelled_at IS NULL OR cancelled_at > period_end); New Loyalty Members (flow) = COUNT(DISTINCT customer_id) of first loyalty_program_enrollment events WHERE event_timestamp BETWEEN period_start AND period_end

Description: |
  Loyalty Members is the count of distinct customers holding an active, non-cancelled enrollment in the loyalty program as of the last moment of the reporting period, read from the loyalty membership record and reconciled with the loyalty_program_enrollment events captured on web and app. It is the base population for Loyalty Redemption Rate and Loyalty Program Enrollment Rate, so its size, growth and tier mix define the reach of every retention and LTV lever the program funds.

Category: Retention



























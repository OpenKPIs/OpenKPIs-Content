Metric Name: Products Compared
Formula: COUNT(DISTINCT session_id + item_id) across compare_items events in the reporting window

Description: |
  Count of products shoppers add to a product comparison list from listing, search or product detail pages. Repeat adds of the same product within a session count once; removals are not netted off.


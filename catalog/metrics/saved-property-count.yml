Metric Name: Saved Property Count
Formula: COUNT(DISTINCT CASE WHEN saved_at <= period_end AND (unsaved_at IS NULL OR unsaved_at > period_end) THEN CONCAT(user_id, '|', property_id) END)

Description: |
  Counts the distinct properties actively saved by users at the end of the reporting period. Each active user-property relationship counts once, regardless of repeated save events, and is removed from the count after a valid unsave or relationship deletion.

Category: Engagement

Tags: [metric]

Industry: Real Estate Tech

Priority: High

Core Area: Discovery

Scope: User

Measure Type: count

Aggregation Window: Time based - Daily snapshot at period end; rollups supported for weekly, monthly, quarterly, and yearly reporting


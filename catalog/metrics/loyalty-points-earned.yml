Metric Name: Loyalty Points Earned
Formula: SUM(points) WHERE ledger_type = 'earn' − SUM(points) WHERE ledger_type = 'earn_reversal', by posting date in the reporting period

Description: |
  Total loyalty points posted to member accounts in the period from purchases and other earning actions, net of earn reversals. It is the issuance side of the points liability.

Category: Retention



























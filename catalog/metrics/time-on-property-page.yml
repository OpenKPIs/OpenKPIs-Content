Metric Name: Time on Property Page
Formula: SUM over listing page views (LEAST(SUM(engagement_time_msec per listing page view), 1800000) / 1000) / COUNT(page_view WHERE page_type = 'listing_detail' AND listing_id IS NOT NULL)

Description: |
  Real estate application of GA4's average engagement time concept: the average foreground engagement time, in seconds, per property listing detail page view, computed as total engaged time per listing detail page view, capped at 30 minutes per view and converted to seconds, divided by the number of listing detail page views. It shows how thoroughly prospective buyers and renters read a listing (photos, floor plans, price history, neighbourhood data) and is the primary depth-of-interest signal that sits between listing views and inquiry or tour requests.


Google Analytics SQL: |
  -- ==========================================
  -- 1. GOOGLE BIGQUERY SQL (GA4 Export)
  -- ==========================================
  SELECT user_pseudo_id, 
         TIMESTAMP_DIFF(MAX(CASE WHEN event_name = 'page_view' AND param.key = 'page_location' AND param.value.string_value LIKE '%property%' THEN event_timestamp END), 
                       MIN(CASE WHEN event_name = 'page_view' AND param.key = 'page_location' AND param.value.string_value LIKE '%property%' THEN event_timestamp END), SECOND) AS time_on_property_page
  FROM `your-project.analytics_123456789.events_*`, 
       UNNEST(event_params) AS param
  WHERE _TABLE_SUFFIX BETWEEN '20230101' AND '20231231'
  GROUP BY user_pseudo_id

AEP Query Service SQL: |
  -- ==========================================
  -- 2. ADOBE AEP QUERY SERVICE SQL (XDM Dataset)
  -- ==========================================
  SELECT identityMap.ecid AS user_id, 
         TIMESTAMPDIFF(SECOND, MIN(CASE WHEN eventType = 'web.pageview' AND page.url LIKE '%property%' THEN timestamp END), 
                             MAX(CASE WHEN eventType = 'web.pageview' AND page.url LIKE '%property%' THEN timestamp END)) AS time_on_property_page
  FROM your_aep_dataset
  WHERE timestamp BETWEEN '2023-01-01T00:00:00Z' AND '2023-12-31T23:59:59Z'
  GROUP BY identityMap.ecid

Calculation Notes: |
  Exclude sessions with less than 5 seconds to filter out accidental clicks. Consider session timeout as 30 minutes of inactivity.

Business Use Case: |
  Executives use this metric to identify high-interest properties and optimize content or features to increase user engagement.



Google Analytics SQL: |
  -- ==========================================
  -- 1. GOOGLE BIGQUERY SQL
  -- ==========================================
  SELECT user_pseudo_id, 
         SUM(time_spent) AS total_time_on_property_page
  FROM (
    SELECT user_pseudo_id, 
           event_timestamp, 
           LEAD(event_timestamp) OVER (PARTITION BY user_pseudo_id ORDER BY event_timestamp) AS next_event_timestamp,
           IF(LEAD(event_name) OVER (PARTITION BY user_pseudo_id ORDER BY event_timestamp) = 'view_item',
              TIMESTAMP_DIFF(LEAD(event_timestamp) OVER (PARTITION BY user_pseudo_id ORDER BY event_timestamp), 
                            event_timestamp, SECOND),
              NULL) AS time_spent
    FROM `your-project.analytics_123456789.events_*`, 
         UNNEST(event_params) AS param
    WHERE event_name = 'view_item'
      AND param.key = 'page_location'
      AND param.value.string_value LIKE '%property%'
      AND _TABLE_SUFFIX BETWEEN '20230101' AND '20231231'
  ) AS session_times
  WHERE time_spent IS NOT NULL
  GROUP BY user_pseudo_id

AEP Query Service SQL: |
  -- ==========================================
  -- 2. ADOBE AEP QUERY SERVICE SQL
  -- ==========================================
  SELECT identityMap.ecid AS user_id, 
         SUM(time_spent) AS total_time_on_property_page
  FROM (
    SELECT identityMap.ecid, 
           timestamp, 
           LEAD(timestamp) OVER (PARTITION BY identityMap.ecid ORDER BY timestamp) AS next_timestamp,
           IF(LEAD(eventType) OVER (PARTITION BY identityMap.ecid ORDER BY timestamp) = 'web.pageview',
              TIMESTAMPDIFF(SECOND, timestamp, LEAD(timestamp) OVER (PARTITION BY identityMap.ecid ORDER BY timestamp)),
              NULL) AS time_spent
    FROM your_aep_dataset
    WHERE eventType = 'web.pageview'
      AND page.url LIKE '%property%'
      AND timestamp BETWEEN '2023-01-01T00:00:00Z' AND '2023-12-31T23:59:59Z'
  ) AS session_times
  WHERE time_spent IS NOT NULL
  GROUP BY identityMap.ecid

Calculation Notes: |
  Exclude sessions with less than 5 seconds to filter out accidental clicks. Consider session timeout as 30 minutes of inactivity.

Business Use Case: |
  Executives use this metric to identify high-interest properties and optimize content or features to increase user engagement.



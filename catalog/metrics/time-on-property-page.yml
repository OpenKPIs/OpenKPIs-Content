Metric Name: Time on Property Page
Formula: SUM(time_spent) / COUNT(visits)

Description: |
  Measures the average duration a user spends on a property listing page, indicating user interest and engagement with the property details.

Category: Engagement

Tags: [metric]

Industry: Real Estate Tech

Priority: High

Core Area: Discovery

Scope: Session

Measure Type: average

Aggregation Window: Time based - Daily

GA4 Event: |
  time_on_property_page

Adobe Event: |
  time_on_property_page

W3 Data Layer: |
  {"digitalData":{"event":{"eventInfo":{"type":"engagement","eventName":"time_on_property_page","timeStamp":"2023-10-05T14:48:00.000Z"},"attributes":{"timeSpent":120}}}}


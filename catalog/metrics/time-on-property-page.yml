Metric Name: Time on Property Page
Formula: SUM(time_spent)

Description: |
  Measures the duration a user spends on a single property listing page, indicating user engagement with property details.

Category: Engagement

Tags: [metric]

Industry: Technology

Priority: High

Core Area: Discovery

Scope: Event

Measure Type: average

Aggregation Window: Time based - Daily


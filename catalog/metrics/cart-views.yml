Metric Name: Cart Views
Formula: COUNT(events WHERE event_name = 'view_cart' AND cart_item_count > 0)

Description: |
  The number of times shoppers viewed the cart page or cart drawer with its contents rendered, counted once per qualifying view_cart occurrence. It measures the volume of cart-review moments that precede checkout initiation and anchors the denominator of cart-stage conversion and abandonment reporting.

Category: Conversion



























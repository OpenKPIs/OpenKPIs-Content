# Metric: Cart Views
# Generated: 2026-09-18T19:21:18.303Z
# Contributed by: devyendarm
# Last modified by: devyendarm

Metric Name: Cart Views
Formula: COUNT(view_cart events WHERE cart_item_count > 0 AND analytics consent granted AND traffic_type <> 'internal' AND page URL NOT non-production host), after collapsing hits in the same session with an identical cart_signature (cart_id|cart_item_count|value|cart_surface) less than 1 second apart into one occurrence

Description: |
  The number of times shoppers viewed the cart page or cart drawer with its contents rendered, counted once per qualifying view_cart occurrence. It measures the volume of cart-review moments that precede checkout initiation and anchors the denominator of cart-stage conversion and abandonment reporting.

Category: Conversion

Tags: [metric, E-commerce: Cart & Checkout Funnel Analytics]

Industry: E-commerce

Priority: High

Core Area: Checkout

Scope: Event

Measure Type: Counter

Aggregation Window: Event, Session, Daily, Weekly, Monthly


Google Analytics SQL: |
  -- ==========================================
  -- 1. GOOGLE BIGQUERY SQL
  -- ==========================================
  -- Metric  : Cart Views (cart-views) | E-commerce > Cart & Checkout Funnel Analytics
  -- Source  : GA4 BigQuery export, unified ecommerce event view_cart
  -- Measure : COUNT of qualifying view_cart occurrences (cart surface rendered with >= 1 line item)
  -- Grain   : one row per reporting day x device x channel x cart surface x checkout type x cart size band
  -- Notes   : occurrence counter, never a distinct-session count; per-session reach is exposed
  --           separately with COUNT(DISTINCT session key) instead of a division of the counter.
  
  DECLARE start_date DATE DEFAULT DATE_SUB(CURRENT_DATE('America/Chicago'), INTERVAL 28 DAY);
  DECLARE end_date   DATE DEFAULT DATE_SUB(CURRENT_DATE('America/Chicago'), INTERVAL 1 DAY);
  
  WITH view_cart_events AS (
    -- event_params are pivoted once per event with MAX(IF(key = '...')) so that each parameter
    -- becomes its own column; the shard scan is widened by one day on each side because the export
    -- is sharded on the property date while the metric is reported in the trading time zone.
    SELECT
      DATE(TIMESTAMP_MICROS(e.event_timestamp), 'America/Chicago')                                  AS report_date,
      e.event_timestamp,
      e.user_pseudo_id,
      e.device.category                                                                             AS device_category,
      e.geo.country                                                                                 AS country,
      -- session-scoped last-click source / medium: view_cart rarely carries campaign params itself
      e.session_traffic_source_last_click.manual_campaign.source                                    AS traffic_source,
      e.session_traffic_source_last_click.manual_campaign.medium                                    AS traffic_medium,
      IFNULL(e.privacy_info.analytics_storage, 'Yes')                                               AS analytics_storage,
      MAX(IF(p.key = 'ga_session_id',   p.value.int_value,    NULL))                                AS ga_session_id,
      MAX(IF(p.key = 'cart_id',         p.value.string_value, NULL))                                AS cart_id,
      MAX(IF(p.key = 'cart_surface',    p.value.string_value, NULL))                                AS cart_surface,
      MAX(IF(p.key = 'checkout_type',   p.value.string_value, NULL))                                AS checkout_type,
      MAX(IF(p.key = 'cart_size_band',  p.value.string_value, NULL))                                AS cart_size_band,
      MAX(IF(p.key = 'currency',        p.value.string_value, NULL))                                AS currency,
      MAX(IF(p.key = 'cart_item_count', p.value.int_value,    NULL))                                AS cart_item_count,
      MAX(IF(p.key = 'cart_line_count', p.value.int_value,    NULL))                                AS cart_line_count,
      MAX(IF(p.key = 'value',           COALESCE(p.value.double_value,
                                                 CAST(p.value.int_value AS FLOAT64)), NULL))        AS cart_value,
      MAX(IF(p.key = 'page_location',   p.value.string_value, NULL))                                AS page_location,
      MAX(IF(p.key = 'traffic_type',    p.value.string_value, NULL))                                AS traffic_type
    FROM `your-project.analytics_123456789.events_*` AS e
    LEFT JOIN UNNEST(e.event_params) AS p
    WHERE _TABLE_SUFFIX BETWEEN FORMAT_DATE('%Y%m%d', DATE_SUB(start_date, INTERVAL 1 DAY))
                            AND FORMAT_DATE('%Y%m%d', DATE_ADD(end_date,   INTERVAL 1 DAY))
      AND e.event_name = 'view_cart'
    GROUP BY
      report_date, e.event_timestamp, e.user_pseudo_id, device_category, country,
      traffic_source, traffic_medium, analytics_storage
  ),
  
  qualified_views AS (
    -- Qualification and exclusions: the cart must render with at least one line item, and internal,
    -- non-production and consent-withheld traffic is removed before the occurrence is counted.
    SELECT
      v.* EXCEPT (analytics_storage, traffic_type, page_location),
      CONCAT(IFNULL(v.cart_id, 'no-cart-id'), '|',
             CAST(IFNULL(v.cart_item_count, 0) AS STRING), '|',
             FORMAT('%.2f', IFNULL(v.cart_value, 0)), '|',
             IFNULL(v.cart_surface, 'unknown'))                                                     AS cart_signature,
      CONCAT(v.user_pseudo_id, '.', CAST(v.ga_session_id AS STRING))                                AS session_key
    FROM view_cart_events AS v
    WHERE v.report_date BETWEEN start_date AND end_date
      AND v.cart_item_count > 0
      AND v.ga_session_id IS NOT NULL
      AND v.analytics_storage <> 'No'
      AND IFNULL(v.traffic_type, 'external') <> 'internal'
      AND NOT REGEXP_CONTAINS(IFNULL(v.page_location, ''),
                              r'(?i)(staging|preview|uat|qa\.|localhost|127\.0\.0\.1)')
  ),
  
  deduplicated_views AS (
    -- Re-render suppression: two hits in the same session with an identical cart signature less than
    -- one second apart (SPA re-paint or duplicate tag fire) are one occurrence; a changed signature counts again.
    SELECT
      q.*,
      LAG(q.event_timestamp) OVER (
        PARTITION BY q.session_key, q.cart_signature
        ORDER BY q.event_timestamp
      )                                                                                             AS prev_event_timestamp
    FROM qualified_views AS q
  )
  
  SELECT
    report_date,
    device_category,
    CASE
      WHEN LOWER(IFNULL(traffic_medium, '')) IN ('cpc', 'ppc', 'paid', 'paidsearch') THEN 'Paid Search'
      WHEN LOWER(IFNULL(traffic_medium, '')) = 'organic'                             THEN 'Organic Search'
      WHEN LOWER(IFNULL(traffic_medium, '')) IN ('email', 'e-mail', 'newsletter')    THEN 'Email'
      WHEN LOWER(IFNULL(traffic_medium, '')) IN ('social', 'social-network', 'sm')   THEN 'Organic Social'
      WHEN LOWER(IFNULL(traffic_medium, '')) = 'affiliate'                           THEN 'Affiliates'
      WHEN LOWER(IFNULL(traffic_medium, '')) = 'referral'                            THEN 'Referral'
      WHEN traffic_medium IS NULL OR traffic_medium IN ('(none)', '')                THEN 'Direct'
      ELSE 'Other'
    END                                                                                             AS channel_grouping,
    IFNULL(cart_surface,   'unknown')                                                               AS cart_surface,
    IFNULL(checkout_type,  'unknown')                                                               AS checkout_type,
    IFNULL(cart_size_band, 'unknown')                                                               AS cart_size_band,
    IFNULL(currency,       'USD')                                                                   AS currency,
    COUNT(*)                                                                                        AS cart_views,
    COUNT(DISTINCT session_key)                                                                     AS sessions_with_cart_view,
    COUNT(DISTINCT user_pseudo_id)                                                                  AS users_with_cart_view,
    ROUND(SAFE_DIVIDE(COUNT(*), COUNT(DISTINCT session_key)), 3)                                    AS cart_views_per_session,
    ROUND(AVG(cart_item_count), 2)                                                                  AS avg_items_in_viewed_cart,
    ROUND(SUM(cart_value), 2)                                                                       AS viewed_cart_value
  FROM deduplicated_views
  WHERE prev_event_timestamp IS NULL
     OR (event_timestamp - prev_event_timestamp) >= 1000000
  GROUP BY
    report_date, device_category, channel_grouping, cart_surface,
    checkout_type, cart_size_band, currency
  ORDER BY report_date DESC, cart_views DESC;

AEP Query Service SQL: |
  -- ==========================================
  -- 2. ADOBE AEP QUERY SERVICE SQL
  -- ==========================================
  -- Metric  : Cart Views (cart-views) | E-commerce > Cart & Checkout Funnel Analytics
  -- Source  : XDM ExperienceEvent dataset; all eventTypes are sessionised, then eventType =
  --           'commerce.productListViews' (cart review surface) is counted
  -- Measure : COUNT of qualifying cart-view occurrences (cart rendered with >= 1 line item)
  -- Grain   : one row per reporting day x device x cart surface x checkout type x cart size band
  -- Notes   : eVar41 = cart surface, eVar43 = checkout type, eVar44 = cart size band; the tenant
  --           namespace _tenant (replace with your tenant id, e.g. _acmeretail) carries
  --           cart.cartItemCount / cart.cartValue / cart.currencyCode and trafficType.
  -- Window  : T-28 .. T-1 in America/Chicago, matching the BigQuery definition.
  
  WITH all_events AS (
    -- Every ExperienceEvent in the window (all eventTypes) so that sessions reflect any activity.
    SELECT
      to_date(from_utc_timestamp(timestamp, 'America/Chicago'))                                     AS report_date,
      timestamp                                                                                     AS event_ts_utc,
      eventType                                                                                     AS event_type,
      coalesce(identityMap['ECID'][0].id, endUserIDs._experience.mcid.id)                           AS ecid,
      commerce.cart.cartID                                                                          AS cart_id,
      commerce.productListViews.value                                                               AS product_list_views,
      lower(coalesce(_experience.analytics.customDimensions.eVars.eVar41.value, 'unknown'))          AS cart_surface,
      lower(coalesce(_experience.analytics.customDimensions.eVars.eVar43.value, 'unknown'))          AS checkout_type,
      coalesce(_experience.analytics.customDimensions.eVars.eVar44.value, 'unknown')                 AS cart_size_band,
      cast(_tenant.cart.cartItemCount as integer)                                                    AS cart_item_count,
      cast(_tenant.cart.cartValue as decimal(18,2))                                                  AS cart_value,
      coalesce(_tenant.cart.currencyCode, 'USD')                                                     AS currency,
      lower(coalesce(_tenant.trafficType, 'external'))                                               AS traffic_type,
      coalesce(device.type, 'unknown')                                                               AS device_type,
      web.webPageDetails.URL                                                                         AS page_url,
      coalesce(consents.collect.val, 'y')                                                            AS consent_collect
    FROM web_commerce_experience_events
    -- Chicago midnight of T-28 and of today converted to UTC with to_utc_timestamp.
    WHERE timestamp >= to_utc_timestamp(cast(date_sub(to_date(from_utc_timestamp(current_timestamp, 'America/Chicago')), 28) as timestamp), 'America/Chicago')
      AND timestamp <  to_utc_timestamp(cast(to_date(from_utc_timestamp(current_timestamp, 'America/Chicago')) as timestamp), 'America/Chicago')
  ),
  
  sessionised_events AS (
    -- 30-minute inactivity sessionisation per ECID over the full event stream (all eventTypes).
    SELECT
      a.*,
      SESS_TIMEOUT(a.event_ts_utc, 60 * 30) OVER (
        PARTITION BY a.ecid
        ORDER BY a.event_ts_utc
        ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW
      ).num                                                                                         AS session_num
    FROM all_events AS a
    WHERE a.ecid IS NOT NULL
  ),
  
  qualified_views AS (
    -- Cart-view eventType only, then the qualification and exclusions that mirror the BigQuery
    -- definition: a rendered cart with at least one line item, consent granted, internal traffic
    -- and non-production hostnames removed before counting.
    SELECT
      report_date,
      event_ts_utc,
      ecid,
      session_num,
      device_type,
      cart_surface,
      checkout_type,
      cart_size_band,
      currency,
      cart_item_count,
      cart_value,
      concat_ws('|', coalesce(cart_id, 'no-cart-id'), cast(coalesce(cart_item_count, 0) as string),
                cast(coalesce(cart_value, 0) as string), cart_surface)                              AS cart_signature
    FROM sessionised_events
    WHERE event_type = 'commerce.productListViews'
      AND report_date BETWEEN date_sub(to_date(from_utc_timestamp(current_timestamp, 'America/Chicago')), 28)
                          AND date_sub(to_date(from_utc_timestamp(current_timestamp, 'America/Chicago')), 1)
      AND coalesce(product_list_views, 1) > 0
      AND cart_item_count > 0
      AND consent_collect <> 'n'
      AND traffic_type <> 'internal'
      AND coalesce(page_url, '') NOT RLIKE '(?i)(staging|preview|uat|qa\.|localhost|127\.0\.0\.1)'
  ),
  
  deduplicated_views AS (
    -- Re-render suppression: identical cart signature (cart_id|item_count|value|surface) inside the
    -- same session less than one second apart counts once; a changed signature counts again.
    SELECT
      s.*,
      concat_ws('.', s.ecid, cast(s.session_num as string))                                         AS session_key,
      lag(s.event_ts_utc) OVER (
        PARTITION BY s.ecid, s.session_num, s.cart_signature
        ORDER BY s.event_ts_utc
      )                                                                                             AS prev_event_ts
    FROM qualified_views AS s
  )
  
  SELECT
    report_date,
    device_type,
    cart_surface,
    checkout_type,
    cart_size_band,
    currency,
    count(*)                                                                                        AS cart_views,
    count(DISTINCT session_key)                                                                     AS sessions_with_cart_view,
    count(DISTINCT ecid)                                                                            AS users_with_cart_view,
    round(count(*) / nullif(count(DISTINCT session_key), 0), 3)                                     AS cart_views_per_session,
    round(avg(cart_item_count), 2)                                                                  AS avg_items_in_viewed_cart,
    round(sum(cart_value), 2)                                                                       AS viewed_cart_value
  FROM deduplicated_views
  WHERE prev_event_ts IS NULL
     OR (to_unix_timestamp(event_ts_utc) - to_unix_timestamp(prev_event_ts)) >= 1
  GROUP BY report_date, device_type, cart_surface, checkout_type, cart_size_band, currency
  ORDER BY report_date DESC, cart_views DESC;

Calculation Notes: |
  1️⃣ One view_cart occurrence equals one Cart View: the count is an occurrence counter, not a unique-session or unique-user count. Cart Views is therefore always greater than or equal to the number of sessions that reached the cart, and per-session or per-user cart reach must be derived with COUNT(DISTINCT session_id) rather than by dividing.,2️⃣ The event fires only when the cart surface renders with at least one line item. Empty-cart renders, cart icon hovers, badge count updates and cart-quantity stepper interactions are excluded; the qualifying moment is the cart contents being displayed, whether as a full cart page, a slide-out drawer or a mini-cart panel, distinguished by a cart surface parameter rather than by a separate event name.,3️⃣ Re-render suppression uses one rule in both SQL fields: the cart signature is cart_id|cart_item_count|cart value (2 decimals)|cart_surface, and two view_cart hits from the same session with an identical signature less than 1 second apart count as a single occurrence (typically a single-page-application re-paint or duplicate tag fire). A hit whose signature differs, for example after a quantity edit or a coupon changes the item count or cart value, is counted as a separate Cart View.,4️⃣ A genuine return to the cart within the same session is a new Cart View — shoppers who leave the cart to a product detail page and come back, or who reopen the drawer after adding another item, legitimately generate multiple occurrences. This is the intended behaviour and is why Cart Views is used to measure review intensity, not reach.,5️⃣ Sessionisation: in BigQuery the session is user_pseudo_id + ga_session_id as assigned by GA4 (30-minute inactivity timeout by default, with no break at midnight or on a campaign change); in AEP it is SESS_TIMEOUT with a 30-minute inactivity timeout per ECID over all ExperienceEvents, before filtering to cart views. A cart reopened after the timeout starts a new session, so a Cart View on a persistent server-side cart can appear in a session that contains no add_to_cart activity; cart-stage funnels must account for this cross-session carry-over.,6️⃣ Excluded from the reported figure in both SQL fields: hits whose consent state withholds analytics (GA4 analytics_storage = 'No', AEP consents.collect.val = 'n'), internal traffic (traffic_type = 'internal' in GA4, _tenant.trafficType = 'internal' in AEP) and hits on non-production hostnames (staging, preview, uat, qa., localhost, 127.0.0.1) matched on the page URL.,7️⃣ Timing and restatement: figures are attributed to the client-side event timestamp adjusted to the reporting time zone, and late-arriving or offline-queued mobile hits can restate the last 72 hours. Trading commentary should be written against T-1 data at the earliest, and any comparison against Adobe Analytics Cart Views must align time zone and the treatment of the drawer surface before variance is investigated.

Business Use Case: |
  1️⃣ The Merchandising trading manager reviews Cart Views against Add to Carts each morning in the daily trading pack; when Cart Views fall while Add to Carts hold flat, they inspect the cart drawer and cart page for a rendering or pricing-service failure and raise a P2 with the site engineering team before the peak-traffic window.,2️⃣ The Conversion Rate Optimisation lead uses Cart Views as the exposure denominator when sizing cart-page tests (shipping threshold messaging, promotion code placement, cross-sell modules); the metric determines the traffic available per variant and the runtime needed to reach significance, and it gates whether a test is launched at all.,3️⃣ The CRM and Lifecycle marketing manager sizes the abandoned-cart audience by comparing Cart Views with Checkouts Initiated by device and channel; where the gap widens week on week, they increase send frequency for the browse-and-cart abandonment journey and brief the paid media team on remarketing bid adjustments.,4️⃣ The Analytics governance owner in Merchandising validates every release by checking that Cart Views per session stays inside its control band; a step change without a matching Add to Carts movement is treated as a tagging regression on the cart surface and blocks the release sign-off until the data layer is corrected.


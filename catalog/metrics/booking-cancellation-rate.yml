# Metric: Booking Cancellation Rate
# Generated: 2026-09-09T22:30:42.328Z
# Contributed by: devyendarm
# Last modified by: devyendarm

Metric Name: Booking Cancellation Rate
Formula: 100 * COUNT_DISTINCT(IF(eligible_booking_flag = TRUE AND final_cancellation_flag = TRUE, booking_id, NULL)) / NULLIF(COUNT_DISTINCT(IF(eligible_booking_flag = TRUE, booking_id, NULL)), 0)

Description: |
  Measures the percentage of eligible confirmed bookings created during a defined period that are subsequently fully cancelled before the first scheduled service begins. It quantifies post-conversion booking loss across direct, mobile, contact-center, corporate, and third-party channels and supports analysis of retention, revenue leakage, refunds, and customer lifetime value.

Category: Conversion

Tags: [metric]

Industry: Travel & Hospitality

Priority: High

Core Area: Checkout

Scope: Item

Measure Type: percentage

Aggregation Window: Time based - Daily/Monthly/Yearly


Calculation Notes: |
  1️⃣ Calculate using distinct canonical booking_id values, not status-event counts.  
  2️⃣ Return null instead of zero when the denominator is zero.  
  3️⃣ Use aggregate rates from numerator and denominator, not averages.  
  4️⃣ Assign cohorts based on provider's local business timezone; store UTC timestamps for reconciliation.  
  5️⃣ Count same-day cancellations from confirmed status, excluding technical voids.  
  6️⃣ Classify no-shows separately and include them in the denominator.  
  7️⃣ Report immature cohorts with an open-cohort flag due to potential cancellation rate increases.

Business Use Case: |
  Revenue Management reviews weekly cancellation-rate movement by booking channel, fare or rate plan, lead-time band, property or route, and cancellation initiator. If flexible mobile bookings with 30-to-60-day lead times exceed the trailing eight-week comparable baseline by at least 3 percentage points, leaders can test deposit rules, reminder journeys, self-service modification options, targeted save offers, or channel policy changes while monitoring conversion, refund cost, rebooking, and customer lifetime value for adverse effects.


Source Data: Booking engine and digital analytics events from web and mobile, central reservation or property management platforms, airline or travel reservation systems, CRM and customer identity resolution, contact-center records, OTA/GDS and partner API feeds, and payment or refund platforms stitched through canonical booking_id and customer_id where permitted.


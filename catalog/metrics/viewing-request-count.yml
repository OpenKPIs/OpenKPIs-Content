Metric Name: Viewing Request Count
Formula: COUNT(DISTINCT CASE WHEN viewing_request_id IS NOT NULL AND submitted_at IS NOT NULL AND request_status IN ('submitted', 'pending', 'accepted', 'confirmed', 'reschedule_requested', 'completed', 'declined', 'expired', 'cancelled_by_requester', 'cancelled_by_agent') AND COALESCE(is_test, false) = false AND COALESCE(is_spam, false) = false THEN viewing_request_id END)

Description: |
  Counts unique, successfully submitted requests from prospective renters or buyers to view a property during the reporting period. Each valid viewing request is counted once using its persistent request identifier, regardless of subsequent acceptance, rejection, completion, or cancellation.

Category: Conversion

Tags: [metric]

Industry: Real Estate Tech

Priority: High

Core Area: Engagement

Scope: Event

Measure Type: count

Aggregation Window: Time based - Hourly/Daily/Monthly/Yearly


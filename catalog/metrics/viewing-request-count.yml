Google Analytics SQL: |
  -- ==========================================
  -- 1. GOOGLE BIGQUERY SQL
  -- ==========================================
  WITH filtered_events AS (
    SELECT
      FARM_FINGERPRINT(TO_JSON_STRING(e)) AS event_row_id,
      e.event_date,
      e.event_timestamp,
      ep.key AS parameter_key,
      COALESCE(
        ep.value.string_value,
        CAST(ep.value.int_value AS STRING),
        CAST(ep.value.double_value AS STRING),
        CAST(ep.value.float_value AS STRING)
      ) AS parameter_value
    FROM `your-project.analytics_123456789.events_*` AS e
    CROSS JOIN UNNEST(e.event_params) AS ep
    WHERE _TABLE_SUFFIX BETWEEN FORMAT_DATE('%Y%m%d', @start_date)
                            AND FORMAT_DATE('%Y%m%d', @end_date)
      AND e.event_name = 'generate_lead'
  ),
  pivoted_events AS (
    SELECT
      event_row_id,
      event_date,
      event_timestamp,
      MAX(IF(parameter_key = 'request_id', parameter_value, NULL)) AS request_id,
      MAX(IF(parameter_key = 'request_type', parameter_value, NULL)) AS request_type,
      MAX(IF(parameter_key = 'request_status', parameter_value, NULL)) AS request_status,
      MAX(IF(parameter_key = 'request_success', parameter_value, NULL)) AS request_success_raw,
      MAX(IF(parameter_key = 'request_count', parameter_value, NULL)) AS request_count_raw,
      MAX(IF(parameter_key = 'property_id', parameter_value, NULL)) AS property_id,
      MAX(IF(parameter_key = 'property_type', parameter_value, NULL)) AS property_type,
      MAX(IF(parameter_key = 'listing_id', parameter_value, NULL)) AS listing_id,
      MAX(IF(parameter_key = 'listing_type', parameter_value, NULL)) AS listing_type,
      MAX(IF(parameter_key = 'transaction_type', parameter_value, NULL)) AS transaction_type,
      MAX(IF(parameter_key = 'market', parameter_value, NULL)) AS market,
      MAX(IF(parameter_key = 'country', parameter_value, NULL)) AS country,
      MAX(IF(parameter_key = 'region', parameter_value, NULL)) AS region,
      MAX(IF(parameter_key = 'city', parameter_value, NULL)) AS city,
      MAX(IF(parameter_key = 'postal_code', parameter_value, NULL)) AS postal_code,
      MAX(IF(parameter_key = 'currency', parameter_value, NULL)) AS currency,
      MAX(IF(parameter_key = 'listing_price', parameter_value, NULL)) AS listing_price_raw,
      MAX(IF(parameter_key = 'rent_amount', parameter_value, NULL)) AS rent_amount_raw,
      MAX(IF(parameter_key = 'bedrooms', parameter_value, NULL)) AS bedrooms_raw,
      MAX(IF(parameter_key = 'bathrooms', parameter_value, NULL)) AS bathrooms_raw,
      MAX(IF(parameter_key = 'furnished_status', parameter_value, NULL)) AS furnished_status,
      MAX(IF(parameter_key = 'availability_date', parameter_value, NULL)) AS availability_date_raw,
      MAX(IF(parameter_key = 'viewing_type', parameter_value, NULL)) AS viewing_type,
      MAX(IF(parameter_key = 'preferred_viewing_date', parameter_value, NULL)) AS preferred_viewing_date_raw,
      MAX(IF(parameter_key = 'preferred_viewing_time', parameter_value, NULL)) AS preferred_viewing_time,
      MAX(IF(parameter_key = 'lead_id', parameter_value, NULL)) AS lead_id,
      MAX(IF(parameter_key = 'prospect_id', parameter_value, NULL)) AS prospect_id,
      MAX(IF(parameter_key = 'customer_type', parameter_value, NULL)) AS customer_type,
      MAX(IF(parameter_key = 'authenticated', parameter_value, NULL)) AS authenticated_raw,
      MAX(IF(parameter_key = 'analytics_consent', parameter_value, NULL)) AS analytics_consent,
      MAX(IF(parameter_key = 'marketing_consent', parameter_value, NULL)) AS marketing_consent,
      MAX(IF(parameter_key = 'submission_method', parameter_value, NULL)) AS submission_method,
      MAX(IF(parameter_key = 'channel', parameter_value, NULL)) AS channel,
      MAX(IF(parameter_key = 'source_system', parameter_value, NULL)) AS source_system,
      MAX(IF(parameter_key = 'crm_system', parameter_value, NULL)) AS crm_system,
      MAX(IF(parameter_key = 'request_created_at', parameter_value, NULL)) AS request_created_at_raw,
      MAX(IF(parameter_key = 'request_submitted_at', parameter_value, NULL)) AS request_submitted_at_raw,
      MAX(IF(parameter_key = 'request_timezone', parameter_value, NULL)) AS request_timezone,
      MAX(IF(parameter_key = 'page_location', parameter_value, NULL)) AS page_location,
      MAX(IF(parameter_key = 'page_referrer', parameter_value, NULL)) AS page_referrer,
      MAX(IF(parameter_key = 'page_title', parameter_value, NULL)) AS page_title,
      MAX(IF(parameter_key = 'content_group', parameter_value, NULL)) AS content_group,
      MAX(IF(parameter_key = 'campaign_id', parameter_value, NULL)) AS campaign_id,
      MAX(IF(parameter_key = 'campaign_source', parameter_value, NULL)) AS campaign_source,
      MAX(IF(parameter_key = 'campaign_medium', parameter_value, NULL)) AS campaign_medium,
      MAX(IF(parameter_key = 'campaign_name', parameter_value, NULL)) AS campaign_name,
      MAX(IF(parameter_key = 'device_category', parameter_value, NULL)) AS device_category,
      MAX(IF(parameter_key = 'language', parameter_value, NULL)) AS language,
      MAX(IF(parameter_key = 'schema_version', parameter_value, NULL)) AS schema_version
    FROM filtered_events
    GROUP BY event_row_id, event_date, event_timestamp
  ),
  typed_events AS (
    SELECT
      request_id,
      request_type,
      request_status,
      LOWER(request_success_raw) IN ('true', '1') AS request_success,
      COALESCE(SAFE_CAST(request_count_raw AS INT64), 1) AS request_count,
      property_id,
      property_type,
      listing_id,
      listing_type,
      transaction_type,
      market,
      country,
      region,
      city,
      postal_code,
      currency,
      SAFE_CAST(listing_price_raw AS NUMERIC) AS listing_price,
      SAFE_CAST(rent_amount_raw AS NUMERIC) AS rent_amount,
      SAFE_CAST(bedrooms_raw AS NUMERIC) AS bedrooms,
      SAFE_CAST(bathrooms_raw AS NUMERIC) AS bathrooms,
      furnished_status,
      SAFE_CAST(availability_date_raw AS DATE) AS availability_date,
      viewing_type,
      SAFE_CAST(preferred_viewing_date_raw AS DATE) AS preferred_viewing_date,
      preferred_viewing_time,
      lead_id,
      prospect_id,
      customer_type,
      CASE
        WHEN LOWER(authenticated_raw) IN ('true', '1') THEN TRUE
        WHEN LOWER(authenticated_raw) IN ('false', '0') THEN FALSE
        ELSE NULL
      END AS authenticated,
      analytics_consent,
      marketing_consent,
      submission_method,
      channel,
      source_system,
      crm_system,
      SAFE_CAST(request_created_at_raw AS TIMESTAMP) AS request_created_at,
      COALESCE(
        SAFE_CAST(request_submitted_at_raw AS TIMESTAMP),
        TIMESTAMP_MICROS(event_timestamp)
      ) AS request_submitted_at,
      request_timezone,
      page_location,
      page_referrer,
      page_title,
      content_group,
      campaign_id,
      campaign_source,
      campaign_medium,
      campaign_name,
      device_category,
      language,
      schema_version,
      event_timestamp
    FROM pivoted_events
    WHERE request_id IS NOT NULL
      AND LOWER(request_type) = 'property_viewing'
      AND LOWER(request_status) = 'submitted'
      AND LOWER(request_success_raw) IN ('true', '1')
  ),
  deduplicated_requests AS (
    SELECT *
    FROM typed_events
    QUALIFY ROW_NUMBER() OVER (
      PARTITION BY request_id
      ORDER BY request_submitted_at ASC, event_timestamp ASC
    ) = 1
  )
  SELECT
    request_id,
    request_type,
    request_status,
    request_success,
    request_count,
    property_id,
    property_type,
    listing_id,
    listing_type,
    transaction_type,
    market,
    country,
    region,
    city,
    postal_code,
    currency,
    listing_price,
    rent_amount,
    bedrooms,
    bathrooms,
    furnished_status,
    availability_date,
    viewing_type,
    preferred_viewing_date,
    preferred_viewing_time,
    lead_id,
    prospect_id,
    customer_type,
    authenticated,
    analytics_consent,
    marketing_consent,
    submission_method,
    channel,
    source_system,
    crm_system,
    request_created_at,
    request_submitted_at,
    request_timezone,
    page_location,
    page_referrer,
    page_title,
    content_group,
    campaign_id,
    campaign_source,
    campaign_medium,
    campaign_name,
    device_category,
    language,
    schema_version,
    CAST(1 AS INT64) AS viewing_request_count
  FROM deduplicated_requests;

AEP Query Service SQL: |
  -- ==========================================
  -- 2. ADOBE AEP QUERY SERVICE SQL
  -- ==========================================
  WITH viewing_request_events AS (
    SELECT
      xdm._propertyExperience.viewingRequest.requestId AS request_id,
      xdm._propertyExperience.viewingRequest.requestType AS request_type,
      xdm._propertyExperience.viewingRequest.requestStatus AS request_status,
      xdm._propertyExperience.viewingRequest.requestSuccess AS request_success,
      COALESCE(CAST(xdm._propertyExperience.viewingRequest.requestCount AS BIGINT), 1) AS request_count,
      xdm._propertyExperience.viewingRequest.propertyId AS property_id,
      xdm._propertyExperience.viewingRequest.propertyType AS property_type,
      xdm._propertyExperience.viewingRequest.listingId AS listing_id,
      xdm._propertyExperience.viewingRequest.listingType AS listing_type,
      xdm._propertyExperience.viewingRequest.transactionType AS transaction_type,
      xdm._propertyExperience.viewingRequest.market AS market,
      xdm._propertyExperience.viewingRequest.country AS country,
      xdm._propertyExperience.viewingRequest.region AS region,
      xdm._propertyExperience.viewingRequest.city AS city,
      xdm._propertyExperience.viewingRequest.postalCode AS postal_code,
      xdm._propertyExperience.viewingRequest.currency AS currency,
      CAST(xdm._propertyExperience.viewingRequest.listingPrice AS DECIMAL(38, 9)) AS listing_price,
      CAST(xdm._propertyExperience.viewingRequest.rentAmount AS DECIMAL(38, 9)) AS rent_amount,
      CAST(xdm._propertyExperience.viewingRequest.bedrooms AS DECIMAL(10, 2)) AS bedrooms,
      CAST(xdm._propertyExperience.viewingRequest.bathrooms AS DECIMAL(10, 2)) AS bathrooms,
      xdm._propertyExperience.viewingRequest.furnishedStatus AS furnished_status,
      CAST(xdm._propertyExperience.viewingRequest.availabilityDate AS DATE) AS availability_date,
      xdm._propertyExperience.viewingRequest.viewingType AS viewing_type,
      CAST(xdm._propertyExperience.viewingRequest.preferredViewingDate AS DATE) AS preferred_viewing_date,
      xdm._propertyExperience.viewingRequest.preferredViewingTime AS preferred_viewing_time,
      xdm._propertyExperience.viewingRequest.leadId AS lead_id,
      xdm._propertyExperience.viewingRequest.prospectId AS prospect_id,
      xdm._propertyExperience.viewingRequest.customerType AS customer_type,
      xdm._propertyExperience.viewingRequest.authenticated AS authenticated,
      xdm._propertyExperience.viewingRequest.analyticsConsent AS analytics_consent,
      xdm._propertyExperience.viewingRequest.marketingConsent AS marketing_consent,
      xdm._propertyExperience.viewingRequest.submissionMethod AS submission_method,
      xdm._propertyExperience.viewingRequest.channel AS channel,
      xdm._propertyExperience.viewingRequest.sourceSystem AS source_system,
      xdm._propertyExperience.viewingRequest.crmSystem AS crm_system,
      CAST(xdm._propertyExperience.viewingRequest.requestCreatedAt AS TIMESTAMP) AS request_created_at,
      COALESCE(
        CAST(xdm._propertyExperience.viewingRequest.requestSubmittedAt AS TIMESTAMP),
        xdm.timestamp
      ) AS request_submitted_at,
      xdm._propertyExperience.viewingRequest.requestTimezone AS request_timezone,
      xdm._propertyExperience.viewingRequest.pageLocation AS page_location,
      xdm._propertyExperience.viewingRequest.pageReferrer AS page_referrer,
      xdm._propertyExperience.viewingRequest.pageTitle AS page_title,
      xdm._propertyExperience.viewingRequest.contentGroup AS content_group,
      xdm._propertyExperience.viewingRequest.campaignId AS campaign_id,
      xdm._propertyExperience.viewingRequest.campaignSource AS campaign_source,
      xdm._propertyExperience.viewingRequest.campaignMedium AS campaign_medium,
      xdm._propertyExperience.viewingRequest.campaignName AS campaign_name,
      xdm._propertyExperience.viewingRequest.deviceCategory AS device_category,
      xdm._propertyExperience.viewingRequest.language AS language,
      xdm._propertyExperience.viewingRequest.schemaVersion AS schema_version,
      xdm.timestamp AS event_timestamp
    FROM property_experience_event_dataset AS xdm
    WHERE xdm.eventType = 'generate_lead'
      AND xdm.timestamp >= CAST('${START_TIMESTAMP}' AS TIMESTAMP)
      AND xdm.timestamp < CAST('${END_TIMESTAMP}' AS TIMESTAMP)
      AND xdm._propertyExperience.viewingRequest.requestId IS NOT NULL
      AND LOWER(xdm._propertyExperience.viewingRequest.requestType) = 'property_viewing'
      AND LOWER(xdm._propertyExperience.viewingRequest.requestStatus) = 'submitted'
      AND xdm._propertyExperience.viewingRequest.requestSuccess = TRUE
  ),
  deduplicated_requests AS (
    SELECT
      *,
      ROW_NUMBER() OVER (
        PARTITION BY request_id
        ORDER BY request_submitted_at ASC, event_timestamp ASC
      ) AS request_row_number
    FROM viewing_request_events
  )
  SELECT
    request_id,
    request_type,
    request_status,
    request_success,
    request_count,
    property_id,
    property_type,
    listing_id,
    listing_type,
    transaction_type,
    market,
    country,
    region,
    city,
    postal_code,
    currency,
    listing_price,
    rent_amount,
    bedrooms,
    bathrooms,
    furnished_status,
    availability_date,
    viewing_type,
    preferred_viewing_date,
    preferred_viewing_time,
    lead_id,
    prospect_id,
    customer_type,
    authenticated,
    analytics_consent,
    marketing_consent,
    submission_method,
    channel,
    source_system,
    crm_system,
    request_created_at,
    request_submitted_at,
    request_timezone,
    page_location,
    page_referrer,
    page_title,
    content_group,
    campaign_id,
    campaign_source,
    campaign_medium,
    campaign_name,
    device_category,
    language,
    schema_version,
    CAST(1 AS BIGINT) AS viewing_request_count
  FROM deduplicated_requests
  WHERE request_row_number = 1;

Calculation Notes: |
  1️⃣ Count only successfully persisted and submitted viewing_request_id.  
  2️⃣ Include valid requests even if later declined, expired, rescheduled, completed, or cancelled.  
  3️⃣ Exclude button clicks, form starts, drafts, client-side retries, failed submissions, test activity, spam, synthetic monitoring, and deleted records without prior valid submission.  
  4️⃣ Treat a request spanning multiple sessions as one request; no session timeout for deduplication.  
  5️⃣ Count multiple valid requests by the same prospect for the same property separately if they have distinct identifiers.  
  6️⃣ Rescheduling or editing does not count unless a new canonical request is created.  
  7️⃣ Aggregate by submitted_at and recompute historical periods for late records or corrections.

Business Use Case: |
  The Product and Marketplace teams compare viewing request volume and property-detail-view conversion by market, listing, device, and acquisition channel. If high-traffic listings generate unusually few requests, they can investigate listing quality, availability, pricing, request-form friction, or agent responsiveness and prioritize corrective product or operational actions.


Source Data: Viewing Request Service, CRM, and Digital Analytics


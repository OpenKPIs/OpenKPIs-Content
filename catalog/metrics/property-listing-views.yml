Metric Name: Property Listing Views
Formula: COUNT(property_listing_view_events)

Description: |
  Measures the total number of times a property listing is viewed by users on the platform. This metric helps assess user interest and engagement with specific property listings.

Category: Engagement

Tags: [metric]

Industry: Real Estate Tech

Priority: High

Core Area: Discovery

Scope: Event

Measure Type: count

Aggregation Window: Time based - Daily

GA4 Event: |
  property_listing_views

Adobe Event: |
  property_listing_views

W3 Data Layer: |
  {"event":"propertyListingViews","listing":{"id":"12345","type":"residential","location":"New York"}}

GA4 Data Layer: |
  {"event":"property_listing_views","listing_id":"12345","listing_type":"residential","listing_location":"New York"}

Adobe Client Data Layer: |
  {"event":"property_listing_views","listing":{"id":"12345","type":"residential","location":"New York"}}

XDM Mapping: |
  {"_experience":{"analytics":{"event1":{"name":"property_listing_views","details":{"listingId":"12345","listingType":"residential","listingLocation":"New York"}}}}}

Google Analytics SQL: |
  -- ==========================================
  -- 1. GOOGLE BIGQUERY SQL (GA4 Export)
  -- ==========================================
  SELECT COUNT(*) AS property_listing_views
  FROM `your-project.analytics_123456789.events_*`
  WHERE _TABLE_SUFFIX BETWEEN '20230101' AND '20231231'
  AND event_name = 'view_item'
  AND EXISTS (
    SELECT 1
    FROM UNNEST(event_params) AS params
    WHERE params.key = 'item_category' AND params.value.string_value = 'property_listing'
  )

AEP Query Service SQL: |
  -- ==========================================
  -- 2. ADOBE AEP QUERY SERVICE SQL (XDM Dataset)
  -- ==========================================
  SELECT COUNT(*) AS property_listing_views
  FROM your_aep_dataset
  WHERE eventType = 'view_item'
  AND EXISTS (
    SELECT 1
    FROM UNNEST(eventParams) AS params
    WHERE params.name = 'item_category' AND params.value = 'property_listing'
  )

Calculation Notes: |
  Exclude bot traffic and internal views. Ensure session timeout is set to 30 minutes.

Business Use Case: |
  Executives use this metric to identify high-interest properties and allocate marketing resources accordingly.



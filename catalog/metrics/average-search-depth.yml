# Metric: Average Search Depth
# Generated: 2026-10-12T11:50:18.770Z
# Contributed by: devyendarm


Metric Name: Average Search Depth
Formula: Search Depth / Unique Searches, where Search Depth = COUNT(page_view after a search results page, same session, before the next search) and Unique Searches = COUNT(DISTINCT session × search_term)

Description: |
  Average page views a shopper makes after an on-site search: Search Depth (page views after a search) divided by unique searches. Higher depth means results lead shoppers further into the catalog.

Category: Engagement



























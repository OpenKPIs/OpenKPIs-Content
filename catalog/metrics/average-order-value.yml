Metric Name: Average Order Value
Formula: SUM(Net Merchandise Revenue of completed orders, after discounts, excl. tax and shipping) / COUNT(DISTINCT transaction_id)

Description: |
  Average Order Value (AOV) is the net merchandise revenue, after discounts and excluding tax and shipping, earned per distinct completed order in the reporting period, matching GA4 Purchase revenue ÷ Transactions and Adobe Analytics Revenue ÷ Orders. It shows basket economics independently of traffic volume, so Merchandising and Finance can tell whether revenue changes come from larger baskets or simply from more orders.


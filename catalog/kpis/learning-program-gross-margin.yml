# KPI: Learning Program Gross Margin
# Generated: 2026-09-10T23:30:21.568Z
# Contributed by: devyendarm
# Last modified by: devyendarm

KPI Name: Learning Program Gross Margin
Formula: Learning Program Gross Margin = Net Recognized Program Revenue - Direct Program Cost of Revenue, where Net Recognized Program Revenue = Gross Recognized Customer Consideration - Discounts - Refunds - Credits - Indirect Taxes, and Direct Program Cost of Revenue = Instructor Delivery Costs + Content Royalties + Program-Specific Platform Usage + Proctoring and Assessment Costs + Program-Specific Learner Support + Payment Processing Costs + Other Approved Direct Delivery Costs

Description: |
  Learning Program Gross Margin measures the net revenue recognized for a learning program minus the direct costs required to deliver that program during the same accounting period. It quantifies program-level profitability generated through conversion, learner engagement, retention, billing, and lifetime value while excluding acquisition and general corporate overhead.

Category: Revenue

Tags: [kpi]

Industry: [EdTech & E-Learning]

Priority: High

Core Area: Monetization

Scope: Item

Measure Type: currency

Aggregation Window: Time based - Monthly









Calculation Notes: |
  1️⃣ Recognize revenue and delivery costs in the same accounting period.  
  2️⃣ Revenue must be net of discounts, scholarships, refunds, and indirect taxes.  
  3️⃣ Instructor-led revenue recognized as sessions are delivered; subscription revenue follows service schedule.  
  4️⃣ Include only costs under approved direct cost-of-revenue policy; exclude unrelated costs.  
  5️⃣ Refunds and adjustments must restate original program and recognition period if material.  
  6️⃣ Programs with recognized revenue but missing cost allocations are flagged as incomplete.

Business Use Case: |
  The Chief Financial Officer and Learning Portfolio leader review monthly gross margin by program, learner segment, delivery format, and acquisition channel. If a high-enrollment certification program falls below plan because live-instructor and proctoring costs are increasing faster than recognized revenue, they can revise pricing, change cohort size, renegotiate vendor rates, adjust the delivery mix, or stop low-margin acquisition campaigns while protecting completion and retention outcomes.


Source Data: Billing and payments platforms such as Stripe, subscription management, revenue-recognition ledger, LMS enrollment and consumption events, CRM account and acquisition-channel data, instructor and content-vendor cost records, learner-support systems, and the finance general ledger

Report Attributes: |
  ["Accounting Period","Learning Program","Program Version","Program Category","Credential Type","Delivery Format","Subscription or One-Time Purchase","B2C or B2B Customer Type","Customer Segment","Acquisition Channel","Campaign","Geography","Billing Currency","Instructor Type","Enrollment Cohort","New or Returning Learner","Completion Status","Refund Status"]


KPI Name: Conversion Rate
Formula: (Sessions with Conversion Event / Total eligible sessions) * 100

Description: |
  Conversion rate measures the percentage of eligible sessions or users that complete a defined conversion action, such as a purchase, lead submission, or signup. It is a core KPI for evaluating how effectively digital experiences turn traffic into business outcomes.

Category: Conversion


Industry: [["Retail, SaaS, Education, Media, Manufacturing, Other, Technology, Finance, Healthcare, E-commerce"]]

Priority: High

Core Area: Digital Analytics, Business Intelligence

Scope: Session

Measure Type: Rate

Aggregation Window: User, Daily, Monthly, Yearly, Quarterly, Weekly, Hourly, Session


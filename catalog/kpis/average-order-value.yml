SQL Query: |
  WITH orders AS (
    SELECT
      event_date,
      ecommerce.transaction_id AS transaction_id,
      ANY_VALUE(ecommerce.purchase_revenue) AS order_revenue
    FROM `project.dataset.events_*`
    WHERE event_name = 'purchase'
      AND ecommerce.transaction_id IS NOT NULL
    GROUP BY event_date, transaction_id
  )
  SELECT
    SAFE_DIVIDE(SUM(order_revenue), COUNT(DISTINCT transaction_id)) AS average_order_value
  FROM orders;

Calculation Notes: |
  1) Use only completed purchase transactions and deduplicate by unique transaction_id to avoid inflating orders from duplicate tags or retries. 
  2) Exclude cancelled, refunded, test, fraudulent, or zero-value orders unless the business explicitly includes them. 
  3) Define whether revenue is gross or net of discounts, tax, shipping, and refunds, and keep that definition consistent across reporting. 
  4) For multi-currency businesses, convert all orders to a reporting currency before aggregation.

Business Use Case: |
  An e-commerce merchandising team monitors Average Order Value by device and campaign. If paid social traffic has strong conversion volume but low AOV, the team can test product bundles, cart upsells, free-shipping thresholds, or landing pages featuring higher-margin products to increase revenue per order.


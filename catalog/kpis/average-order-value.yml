KPI Name: Average Order Value
Formula: Total Revenue / Total Orders

Description: |
  Average Order Value measures the average revenue generated per completed order or purchase transaction. It matters because it helps teams understand monetization efficiency, evaluate merchandising and pricing strategies, and identify opportunities to increase revenue without necessarily increasing traffic.

Category: Revenue


























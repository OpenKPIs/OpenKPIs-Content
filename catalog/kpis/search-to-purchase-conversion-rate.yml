KPI Name: Search-to-Purchase Conversion Rate
Formula: (Sessions with ≥1 view_search_results followed later in the same session by ≥1 purchase / Sessions with ≥1 view_search_results) × 100

Description: |
  E-commerce specialisation of Search Conversion Rate (the Travel variant is Search-to-Booking Conversion Rate): the percentage of sessions with at least one site search that go on to complete a purchase later in the same session. It shows how well on-site search relevance, result ranking and merchandising rules turn stated shopping intent into orders, and is read against overall session conversion to size the commercial value of search.

Category: Conversion

Tags: [kpi, E-commerce: Product Discovery & Merchandising (Search/Filters/PDP)]

Industry: [["E-commerce"]]

Priority: High

Core Area: Discovery

Scope: Session

Measure Type: Percentage

Aggregation Window: Daily, Weekly, Monthly, Quarterly


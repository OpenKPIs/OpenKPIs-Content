KPI Name: Chat Conversion Rate
Formula: (Sessions with chat_start that also contain purchase / Sessions with chat_start) × 100

Description: |
  Share of chat-engaged sessions — sessions in which a visitor opens a live chat or support bot conversation — that go on to complete a purchase in that same session. It quantifies the commercial outcome of assisted-selling and support conversations so service and trading teams can size the revenue attached to chat coverage, staffing and bot deflection decisions.

Category: Conversion


























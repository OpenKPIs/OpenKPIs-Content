Google Analytics SQL: |
  -- ==========================================
  -- 1. GOOGLE BIGQUERY SQL
  -- ==========================================
  -- Chat Conversion Rate: chat-engaged sessions that also contain a purchase in the SAME session, over every chat-engaged session.
  -- Known bot and monitoring traffic is removed by the platform before the export and carries no event-level flag, so it cannot be re-applied here.
  -- The 24-hour / 7-day post-chat window is a separately labelled variant and is deliberately not blended into this same-session number.
  DECLARE start_date DATE DEFAULT DATE_SUB(CURRENT_DATE(), INTERVAL 90 DAY);
  DECLARE end_date DATE DEFAULT DATE_SUB(CURRENT_DATE(), INTERVAL 1 DAY);
  DECLARE restatement_days INT64 DEFAULT 30;
  
  WITH
  -- Chat, purchase and refund events with the session key, chat context and traffic type pivoted out of event_params
  base_events AS (
    SELECT
      PARSE_DATE('%Y%m%d', event_date) AS event_day,
      event_timestamp,
      event_name,
      user_pseudo_id,
      device.category AS device_category,
      ecommerce.transaction_id AS transaction_id,
      ARRAY_LENGTH(items) AS item_count,
      COALESCE(
        (SELECT MAX(IF(ep.key = 'ga_session_id', ep.value.int_value, NULL)) FROM UNNEST(event_params) AS ep),
        SAFE_CAST((SELECT MAX(IF(ep.key = 'ga_session_id', ep.value.string_value, NULL)) FROM UNNEST(event_params) AS ep) AS INT64)
      ) AS ga_session_id,
      (SELECT MAX(IF(ep.key = 'ga_session_number', ep.value.int_value, NULL)) FROM UNNEST(event_params) AS ep) AS ga_session_number,
      (SELECT MAX(IF(ep.key = 'traffic_type', ep.value.string_value, NULL)) FROM UNNEST(event_params) AS ep) AS traffic_type,
      (SELECT MAX(IF(ep.key = 'support_channel', ep.value.string_value, NULL)) FROM UNNEST(event_params) AS ep) AS support_channel,
      (SELECT MAX(IF(ep.key = 'chat_agent_type', ep.value.string_value, NULL)) FROM UNNEST(event_params) AS ep) AS chat_agent_type,
      (SELECT MAX(IF(ep.key = 'ticket_category', ep.value.string_value, NULL)) FROM UNNEST(event_params) AS ep) AS ticket_category,
      (SELECT MAX(IF(ep.key = 'chat_entry_point', ep.value.string_value, NULL)) FROM UNNEST(event_params) AS ep) AS chat_entry_point
    FROM `your-project.analytics_123456789.events_*`
    WHERE _TABLE_SUFFIX BETWEEN FORMAT_DATE('%Y%m%d', start_date)
                            AND FORMAT_DATE('%Y%m%d', DATE_ADD(end_date, INTERVAL restatement_days DAY))
      AND event_name IN ('chat_start', 'purchase', 'refund')
  ),
  -- Denominator population: one row per chat-engaged session (repeat chat_start events collapse), context from the first chat opened, internal / test traffic excluded
  chat_sessions AS (
    SELECT
      CONCAT(user_pseudo_id, '-', CAST(ga_session_id AS STRING)) AS session_key,
      MIN(event_day) AS chat_day,
      ARRAY_AGG(
        STRUCT(support_channel, chat_agent_type, ticket_category, chat_entry_point, device_category, ga_session_number)
        ORDER BY event_timestamp LIMIT 1
      )[OFFSET(0)] AS ctx
    FROM base_events
    WHERE event_name = 'chat_start'
      AND event_day BETWEEN start_date AND end_date
      AND ga_session_id IS NOT NULL
      AND COALESCE(traffic_type, 'external') = 'external'
    GROUP BY user_pseudo_id, ga_session_id
  ),
  -- Orders cancelled or fully refunded within the T+30 restatement window (a refund event without item detail is a full refund)
  reversed_transactions AS (
    SELECT DISTINCT transaction_id
    FROM base_events
    WHERE event_name = 'refund'
      AND transaction_id IS NOT NULL
      AND COALESCE(item_count, 0) = 0
  ),
  -- Numerator population: sessions holding a purchase, deduped by transaction_id and net of reversed orders
  converted_sessions AS (
    SELECT DISTINCT p.session_key
    FROM (
      SELECT
        CONCAT(user_pseudo_id, '-', CAST(ga_session_id AS STRING)) AS session_key,
        transaction_id
      FROM base_events
      WHERE event_name = 'purchase'
        AND event_day BETWEEN start_date AND end_date
        AND ga_session_id IS NOT NULL
        AND COALESCE(traffic_type, 'external') = 'external'
        AND transaction_id IS NOT NULL
      GROUP BY session_key, transaction_id
    ) AS p
    LEFT JOIN reversed_transactions AS r
      ON r.transaction_id = p.transaction_id
    WHERE r.transaction_id IS NULL
  )
  -- Rate per chat day and reporting split: denominator every chat-engaged session including abandoned chats, numerator the subset that purchased in that session
  SELECT
    c.chat_day,
    c.ctx.support_channel AS support_channel,
    c.ctx.chat_agent_type AS chat_agent_type,
    c.ctx.ticket_category AS ticket_category,
    c.ctx.chat_entry_point AS chat_entry_point_page_type,
    c.ctx.device_category AS device_category,
    IF(COALESCE(c.ctx.ga_session_number, 1) > 1, 'returning', 'new') AS visitor_type,
    COUNT(DISTINCT c.session_key) AS chat_engaged_sessions,
    COUNT(DISTINCT v.session_key) AS chat_sessions_with_purchase,
    ROUND(SAFE_DIVIDE(COUNT(DISTINCT v.session_key), COUNT(DISTINCT c.session_key)) * 100, 2) AS chat_conversion_rate_pct
  FROM chat_sessions AS c
  LEFT JOIN converted_sessions AS v
    ON v.session_key = c.session_key
  GROUP BY 1, 2, 3, 4, 5, 6, 7
  ORDER BY 1, 2, 3;

AEP Query Service SQL: |
  -- ==========================================
  -- 2. ADOBE AEP QUERY SERVICE SQL
  -- ==========================================
  -- Chat Conversion Rate: chat-engaged sessions that also contain a purchase in the SAME derived session, over every chat-engaged session.
  -- Internal / agent-side test traffic and known bot traffic are removed by the report suite bot rules and IP exclusions before ingestion; the XDM payload carries no per-event flag to re-apply them here.
  -- The 24-hour / 7-day post-chat window is a separately labelled variant and is deliberately not blended into this same-session number.
  -- Visitor type comes from the derived session index on the ECID, the XDM payload carrying no lifetime session number.
  WITH date_window AS (
    SELECT
      date_sub(current_date, 90) AS start_date,
      date_sub(current_date, 1) AS end_date,
      30 AS restatement_days
  ),
  -- Chat, purchase and back-office reversal events with a 30-minute inactivity session derived per ECID and the chat context read from the Analytics eVars
  base_events AS (
    SELECT
      x.identityMap['ECID'][1].id AS ecid,
      x.timestamp AS event_ts,
      CAST(x.timestamp AS DATE) AS event_day,
      x.eventType AS event_type,
      x.web.webInteraction.name AS interaction_name,
      x.commerce.order.purchaseID AS transaction_id,
      x.commerce.order.priceTotal AS order_total,
      x.device.type AS device_category,
      x._experience.analytics.customDimensions.eVars.eVar41 AS support_channel,
      x._experience.analytics.customDimensions.eVars.eVar42 AS chat_agent_type,
      x._experience.analytics.customDimensions.eVars.eVar44 AS ticket_category,
      x._experience.analytics.customDimensions.eVars.eVar45 AS chat_entry_point,
      SESS_TIMEOUT(x.timestamp, 60 * 30) OVER (
        PARTITION BY x.identityMap['ECID'][1].id
        ORDER BY x.timestamp
        ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW
      ).num AS session_num
    FROM aep_web_experience_event_dataset AS x
    CROSS JOIN date_window AS w
    WHERE CAST(x.timestamp AS DATE) BETWEEN w.start_date AND date_add(w.end_date, w.restatement_days)
      AND x.identityMap['ECID'][1].id IS NOT NULL
  ),
  -- Every chat open in the reporting window, ordered so the first chat of a session supplies its context
  chat_events AS (
    SELECT
      concat(b.ecid, '-', CAST(b.session_num AS STRING)) AS session_key,
      b.event_day,
      b.support_channel,
      b.chat_agent_type,
      b.ticket_category,
      b.chat_entry_point,
      b.device_category,
      b.session_num,
      ROW_NUMBER() OVER (
        PARTITION BY b.ecid, b.session_num ORDER BY b.event_ts
      ) AS chat_rank
    FROM base_events AS b
    CROSS JOIN date_window AS w
    WHERE b.event_type = 'web.webinteraction.linkClicks'
      AND b.interaction_name = 'Chat Start'
      AND b.event_day BETWEEN w.start_date AND w.end_date
  ),
  -- Denominator population: one row per chat-engaged session, repeat chat opens collapsed onto the first one
  chat_sessions AS (
    SELECT session_key, event_day AS chat_day, support_channel, chat_agent_type, ticket_category, chat_entry_point, device_category, session_num
    FROM chat_events
    WHERE chat_rank = 1
  ),
  -- Order value booked at purchase, used to tell a full reversal from a partial refund
  order_totals AS (
    SELECT transaction_id, MAX(order_total) AS order_total
    FROM base_events
    WHERE event_type = 'commerce.purchases' AND transaction_id IS NOT NULL
    GROUP BY transaction_id
  ),
  -- Amounts credited back per order inside the T+30 restatement window
  credit_memos AS (
    SELECT transaction_id, SUM(order_total) AS credited_total
    FROM base_events
    WHERE event_type = 'commerce.backofficeCreditMemoIssued' AND transaction_id IS NOT NULL
    GROUP BY transaction_id
  ),
  -- Orders cancelled or fully credited back, reversed out of the numerator
  reversed_transactions AS (
    SELECT DISTINCT transaction_id
    FROM base_events
    WHERE event_type = 'commerce.backofficeOrderCancelled' AND transaction_id IS NOT NULL
    UNION
    SELECT m.transaction_id
    FROM credit_memos AS m
    JOIN order_totals AS t ON t.transaction_id = m.transaction_id
    WHERE m.credited_total >= t.order_total
  ),
  -- Numerator population: sessions holding a purchase, deduped by order id and net of reversed orders
  converted_sessions AS (
    SELECT DISTINCT p.session_key
    FROM (
      SELECT DISTINCT concat(b.ecid, '-', CAST(b.session_num AS STRING)) AS session_key, b.transaction_id
      FROM base_events AS b
      CROSS JOIN date_window AS w
      WHERE b.event_type = 'commerce.purchases'
        AND b.event_day BETWEEN w.start_date AND w.end_date
        AND b.transaction_id IS NOT NULL
    ) AS p
    LEFT JOIN reversed_transactions AS r
      ON r.transaction_id = p.transaction_id
    WHERE r.transaction_id IS NULL
  )
  -- Rate per chat day and reporting split: denominator every chat-engaged session including abandoned chats, numerator the subset that purchased in that session
  SELECT
    c.chat_day,
    c.support_channel,
    c.chat_agent_type,
    c.ticket_category,
    c.chat_entry_point AS chat_entry_point_page_type,
    c.device_category,
    CASE WHEN COALESCE(c.session_num, 1) > 1 THEN 'returning' ELSE 'new' END AS visitor_type,
    COUNT(DISTINCT c.session_key) AS chat_engaged_sessions,
    COUNT(DISTINCT v.session_key) AS chat_sessions_with_purchase,
    ROUND(100.0 * COUNT(DISTINCT v.session_key) / NULLIF(COUNT(DISTINCT c.session_key), 0), 2) AS chat_conversion_rate_pct
  FROM chat_sessions AS c
  LEFT JOIN converted_sessions AS v
    ON v.session_key = c.session_key
  GROUP BY 1, 2, 3, 4, 5, 6, 7
  ORDER BY 1, 2, 3;

Calculation Notes: |
  1️⃣ Denominator is the full base population of chat-engaged sessions: every session containing at least one `chat_start`, including sessions where the visitor abandoned the conversation, queued without ever being served, or was deflected by the bot. Never narrow it to completed or agent-handled chats — that inflates the rate and breaks comparability with the site-wide session conversion baseline.,2️⃣ Primary definition is same-session attribution: the `purchase` must occur in the same session as the `chat_start`, at any point before or after the chat opens. A post-chat window (commonly 24 hours or 7 days from `chat_start`, cross-session) is a clearly labelled variant reported in its own column — it is never blended into the same-session number.,3️⃣ Built only from the unified standard events `chat_start` and `purchase`; no KPI-named or vendor-specific event fragments. A chat-end signal is not required and must not be a dependency, so sessions that end while the conversation is still open still count in the denominator.,4️⃣ This KPI is correlational, not causal. Visitors who open chat self-select as high-intent — they are already deep in the funnel, comparing variants or resolving a checkout blocker — so the gap versus the site-wide conversion rate is a selection effect, not chat's incremental lift. Publish it as an exposure-level outcome measure only; incrementality claims require a holdout or geo/PSM test, and that caveat travels with the number on every dashboard and deck.,5️⃣ Session boundaries follow the analytics platform's 30-minute inactivity timeout (and midnight/campaign-change resets where applicable). Multiple `chat_start` events in one session collapse to a single qualifying session, and multiple `purchase` events in one session still count the session once — numerator and denominator are both distinct session counts, never event counts.,6️⃣ Exclusions applied to both numerator and denominator: internal IP and agent-side test sessions, known bot and monitoring traffic, and automated proactive chat *impressions* that the visitor never accepted (only an engaged `chat_start` qualifies). Orders subsequently cancelled or fully refunded are reversed in the numerator on a T+30 restatement so the trend reconciles to net demand.,7️⃣ Always report alongside the all-session conversion baseline and split by Support Channel (bot versus human, pre-sales versus post-sales) — a blended rate hides the fact that WISMO and returns conversations carry a structurally lower purchase rate than pre-sales product questions.

Business Use Case: |
  1️⃣ The Customer Service Operations Manager reviews the daily chat conversion trend by Support Channel; when the rate for pre-sales conversations drops while queue wait time rises, they reweight agent shift coverage toward peak trading hours and raise the concurrency cap for the highest-converting intents.,2️⃣ The Conversational Commerce Product Owner monitors bot-handled versus human-handled chat conversion after each intent-model release; a sustained decline in bot sessions triggers a handoff-threshold change so high-intent product and checkout questions escalate to a human agent sooner.,3️⃣ The Merchandising / Assisted Selling lead uses the breakdown by Ticket Category to identify product lines where chat consistently rescues sessions (sizing, compatibility, delivery promise) and funds PDP content fixes so the answer is available before the shopper needs to ask.,4️⃣ The Finance Business Partner combines chat conversion with chat session volume in the quarterly service-cost review to size the demand attached to chat coverage — explicitly labelled as exposure, not incremental lift — and holds the incremental case open until the next holdout test reads out.


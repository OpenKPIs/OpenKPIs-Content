KPI Name: test1
Formula: (Number of Successful Conversions / Total Sessions) × 100

Description: |
  Measures the rate at which users complete a desired action during a session, indicating the effectiveness of the conversion process.

Category: Conversion


Industry: [Retail]

Priority: High

Core Area: Generic

Scope: Session

Measure Type: rate

Aggregation Window: Time based - Daily

GA4 Event: |
  conversion

Adobe Event: |
  conversion

W3 Data Layer: |
  {"event":{"category":{"primaryCategory":"engagement"},"eventInfo":{"type":"action","eventName":"conversion"}}}

GA4 Data Layer: |
  {"event":"conversion","eventParams":{"category":"engagement"}}

Adobe Client Data Layer: |
  {"event":"conversion","eventInfo":{"category":"engagement"}}

XDM Mapping: |
  {"_experience":{"analytics":{"event1":{"name":"conversion","category":"engagement"}}}}

Google Analytics SQL: |
  -- ==========================================
  -- 1. GOOGLE BIGQUERY SQL
  -- ==========================================
  SELECT COUNT(*) AS conversion_count
  FROM `your-project.analytics_123456789.events_*`
  WHERE event_name = 'conversion'
  AND EXISTS (
    SELECT 1
    FROM UNNEST(event_params) AS params
    WHERE params.key = 'category' AND params.value.string_value = 'engagement'
  );

AEP Query Service SQL: |
  -- ==========================================
  -- 2. ADOBE AEP QUERY SERVICE SQL
  -- ==========================================
  SELECT COUNT(*) AS conversion_count
  FROM aep_backend_dataset
  WHERE event = 'conversion'
  AND eventInfo.category = 'engagement';

Calculation Notes: |
  Exclude sessions with less than 2 page views; consider session timeout of 30 minutes.

Business Use Case: |
  Executives use this KPI to assess daily conversion performance and make strategic decisions to optimize marketing efforts.



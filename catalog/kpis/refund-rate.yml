# KPI: Refund Rate
# Generated: 2026-09-20T19:59:44.351Z
# Contributed by: devyendarm


KPI Name: Refund Rate
Formula: (Refunded Merchandise Revenue from Orders Placed in the Cohort Period / Gross Merchandise Revenue of Orders Placed in the Cohort Period) × 100 — both terms net of shipping and tax, and both restricted to the same order cohort observed through the full return-window lag

Description: |
  Refund Rate is the share of gross merchandise revenue that is given back to customers as refunds for a cohort of orders, measured on merchandise value only and covering every refund reason — returned goods, price adjustments, goodwill credits and cancellations after capture. This is the canonical, cross-industry definition of the measure; Enrollment Refund Rate and Course Refund Rate in Education are industry specialisations of it that apply the same math to tuition and course fees.

Category: Monetization


























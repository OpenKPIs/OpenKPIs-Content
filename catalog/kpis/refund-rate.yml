Google Analytics SQL: |
  -- ==========================================
  -- 1. GOOGLE BIGQUERY SQL
  -- ==========================================
  -- Test, employee and internal QA orders carry no flag on the collected payload; they are suppressed at collection and cannot be filtered here.
  DECLARE start_date DATE DEFAULT DATE_SUB(CURRENT_DATE(), INTERVAL 90 DAY);
  DECLARE end_date DATE DEFAULT CURRENT_DATE();
  DECLARE return_window_days INT64 DEFAULT 30;
  
  WITH purchase_events AS (
    -- Orders placed in the cohort period: merchandise lines net of discount, gift-card sales excluded, shipping, handling, duties and tax never in scope
    SELECT
      PARSE_DATE('%Y%m%d', event_date) AS order_date,
      (SELECT MAX(IF(key = 'transaction_id', value.string_value, NULL)) FROM UNNEST(event_params)) AS transaction_id,
      (SELECT MAX(IF(key = 'order_booking_exchange_rate', COALESCE(value.double_value, value.float_value, value.int_value), NULL)) FROM UNNEST(event_params)) AS booking_rate,
      (SELECT SUM(IF(LOWER(COALESCE(i.item_category, '')) LIKE '%gift card%', 0, (i.price - COALESCE(i.discount, 0)) * i.quantity)) FROM UNNEST(items) AS i) AS merchandise_value
    FROM `your-project.analytics_123456789.events_*`
    WHERE _TABLE_SUFFIX BETWEEN FORMAT_DATE('%Y%m%d', start_date) AND FORMAT_DATE('%Y%m%d', end_date)
      AND event_name = 'purchase'
  ),
  cohort_orders AS (
    -- One row per order, converted at the order's booking rate
    SELECT
      transaction_id,
      MIN(order_date) AS order_date,
      MAX(merchandise_value) * COALESCE(MAX(booking_rate), 1.0) AS gross_merchandise_revenue
    FROM purchase_events
    WHERE transaction_id IS NOT NULL
    GROUP BY transaction_id
  ),
  refund_events AS (
    -- Every refund type (returned goods, price adjustments, goodwill credits, post-capture cancellations), scanned through the full return-window lag
    SELECT
      (SELECT MAX(IF(key = 'transaction_id', value.string_value, NULL)) FROM UNNEST(event_params)) AS transaction_id,
      (SELECT MAX(IF(key = 'refund_type', value.string_value, NULL)) FROM UNNEST(event_params)) AS refund_type,
      (SELECT MAX(IF(key = 'value', COALESCE(value.double_value, value.float_value, value.int_value), NULL)) FROM UNNEST(event_params)) AS refund_value,
      (SELECT MAX(IF(key = 'shipping', COALESCE(value.double_value, value.float_value, value.int_value), NULL)) FROM UNNEST(event_params)) AS shipping_refunded,
      (SELECT MAX(IF(key = 'tax', COALESCE(value.double_value, value.float_value, value.int_value), NULL)) FROM UNNEST(event_params)) AS tax_refunded,
      (SELECT MAX(IF(key = 'order_booking_exchange_rate', COALESCE(value.double_value, value.float_value, value.int_value), NULL)) FROM UNNEST(event_params)) AS booking_rate,
      (SELECT SUM(i.price * i.quantity) FROM UNNEST(items) AS i) AS refunded_item_value
    FROM `your-project.analytics_123456789.events_*`
    WHERE _TABLE_SUFFIX BETWEEN FORMAT_DATE('%Y%m%d', start_date) AND FORMAT_DATE('%Y%m%d', DATE_ADD(end_date, INTERVAL return_window_days DAY))
      AND event_name = 'refund'
  ),
  refunds_by_order AS (
    -- Each refund at its own refunded amount (never the whole order), net of shipping and tax, item lines used when the event carries no amount;
    -- chargebacks, payment reversals and fraud cancellations belong to payment risk and are dropped
    SELECT
      transaction_id,
      SUM(COALESCE(refund_value - COALESCE(shipping_refunded, 0) - COALESCE(tax_refunded, 0), refunded_item_value) * COALESCE(booking_rate, 1.0)) AS refunded_merchandise_revenue
    FROM refund_events
    WHERE transaction_id IS NOT NULL
      AND LOWER(COALESCE(refund_type, '')) NOT IN ('chargeback', 'payment_reversal', 'fraud_cancellation')
    GROUP BY transaction_id
  )
  -- Cohort rate: refunded merchandise over the gross merchandise revenue of every order in the same cohort, provisional until the return window closes
  SELECT
    DATE_TRUNC(o.order_date, MONTH) AS cohort_month,
    ROUND(SUM(o.gross_merchandise_revenue), 2) AS gross_merchandise_revenue,
    ROUND(SUM(COALESCE(r.refunded_merchandise_revenue, 0)), 2) AS refunded_merchandise_revenue,
    ROUND(SAFE_DIVIDE(SUM(COALESCE(r.refunded_merchandise_revenue, 0)), SUM(o.gross_merchandise_revenue)) * 100, 2) AS refund_rate_pct,
    IF(DATE_ADD(LAST_DAY(o.order_date), INTERVAL return_window_days DAY) <= CURRENT_DATE(), 'matured', 'provisional') AS cohort_status
  FROM cohort_orders AS o
  LEFT JOIN refunds_by_order AS r USING (transaction_id)
  GROUP BY cohort_month, cohort_status
  ORDER BY cohort_month;

AEP Query Service SQL: |
  -- ==========================================
  -- 2. ADOBE AEP QUERY SERVICE SQL
  -- ==========================================
  -- Test, employee and internal QA orders carry no flag on the collected payload; they are suppressed at collection and cannot be filtered here.
  WITH purchase_items AS (
    -- Orders placed in the cohort period (last 90 days): merchandise lines only, gift-card sales excluded, shipping, handling, duties and tax never in scope
    SELECT
      e._id AS event_id,
      e.commerce.order.purchaseID AS transaction_id,
      date(e.timestamp) AS order_date,
      SUM(CASE WHEN lower(coalesce(item.productCategory, '')) LIKE '%gift card%' THEN 0 ELSE item.priceTotal END) AS merchandise_value,
      MAX(coalesce(e.orderDetails.orderBookingExchangeRate, 1.0)) AS booking_rate
    FROM aep_analytics_event_dataset e
    LATERAL VIEW EXPLODE(e.productListItems) exploded AS item
    WHERE date(e.timestamp) BETWEEN current_date - INTERVAL '90' DAY AND current_date
      AND e.eventType = 'commerce.purchases'
    GROUP BY 1, 2, 3
  ),
  cohort_orders AS (
    -- One row per order, converted at the order's booking rate
    SELECT
      transaction_id,
      MIN(order_date) AS order_date,
      MAX(merchandise_value * booking_rate) AS gross_merchandise_revenue
    FROM purchase_items
    WHERE transaction_id IS NOT NULL
    GROUP BY transaction_id
  ),
  refund_items AS (
    -- Item lines of each credit memo, used when the event carries no amount of its own; scanned 30 days (published return window) past the cohort
    SELECT
      e._id AS event_id,
      SUM(item.priceTotal) AS refunded_item_value
    FROM aep_analytics_event_dataset e
    LATERAL VIEW EXPLODE(e.productListItems) exploded AS item
    WHERE date(e.timestamp) BETWEEN current_date - INTERVAL '90' DAY AND current_date + INTERVAL '30' DAY
      AND e.eventType = 'commerce.backofficeCreditMemoIssued'
    GROUP BY 1
  ),
  refunds_by_order AS (
    -- Every refund type (returned goods, price adjustments, goodwill credits, post-capture cancellations) at its own refunded amount, net of shipping and tax;
    -- chargebacks, payment reversals and fraud cancellations belong to payment risk and are dropped
    SELECT
      e.commerce.order.purchaseID AS transaction_id,
      SUM(coalesce(e.commerce.order.priceTotal - coalesce(e.refundDetails.shippingRefunded, 0) - coalesce(e.refundDetails.taxRefunded, 0), ri.refunded_item_value) * coalesce(e.refundDetails.orderBookingExchangeRate, 1.0)) AS refunded_merchandise_revenue
    FROM aep_analytics_event_dataset e
    LEFT JOIN refund_items ri ON ri.event_id = e._id
    WHERE date(e.timestamp) BETWEEN current_date - INTERVAL '90' DAY AND current_date + INTERVAL '30' DAY
      AND e.eventType = 'commerce.backofficeCreditMemoIssued'
      AND lower(coalesce(e._experience.analytics.customDimensions.eVars.eVar10, '')) NOT IN ('chargeback', 'payment_reversal', 'fraud_cancellation')
    GROUP BY 1
  )
  -- Cohort rate: refunded merchandise over the gross merchandise revenue of every order in the same cohort, provisional until the return window closes
  SELECT
    date_trunc('month', o.order_date) AS cohort_month,
    round(SUM(o.gross_merchandise_revenue), 2) AS gross_merchandise_revenue,
    round(SUM(coalesce(r.refunded_merchandise_revenue, 0)), 2) AS refunded_merchandise_revenue,
    round(SUM(coalesce(r.refunded_merchandise_revenue, 0)) / nullif(SUM(o.gross_merchandise_revenue), 0) * 100, 2) AS refund_rate_pct,
    CASE WHEN last_day(o.order_date) + INTERVAL '30' DAY <= current_date THEN 'matured' ELSE 'provisional' END AS cohort_status
  FROM cohort_orders o
  LEFT JOIN refunds_by_order r ON r.transaction_id = o.transaction_id
  GROUP BY 1, 5
  ORDER BY 1;

Calculation Notes: |
  1️⃣ Numerator and denominator are cohort-aligned on order placement date, not on refund date: a refund settled in November against an October order belongs to the October cohort. Report the cohort only after it has aged past the published return window (commonly 30 days, 60 for holiday policies), and label in-flight cohorts as provisional so partial maturity is never read as an improvement.,2️⃣ Shipping charges, handling fees, duties and all tax components are excluded from both the numerator and the denominator. Only merchandise value at the transacted price is in scope, so freight policy changes and tax-jurisdiction mix never move the rate.,3️⃣ Partial refunds count at their refunded amount, never as a whole order. A 20 USD price adjustment on a 200 USD order contributes 20 USD to the numerator, not 200 USD — this is the structural difference from any unit- or order-count return measure.,4️⃣ Scope is every refund type, not only refunds accompanied by returned goods: post-purchase price adjustments, promotional make-goods, service recovery credits, shipping-damage settlements and post-capture cancellations are all included. This full coverage is what separates Refund Rate from Return Rate, which counts only merchandise physically sent back.,5️⃣ Merchandise discounts and promotional codes are applied before the measurement, so both terms are stated at net transacted value; gift-card issuance used as a refund instrument is included at face value, while gift-card sales themselves stay out of gross merchandise revenue to avoid double counting.,6️⃣ Exclude chargebacks, payment reversals and fraud-cancelled orders — those belong to payment-risk reporting and would otherwise inflate a merchandising and policy measure. Test orders, employee orders and internal quality-assurance transactions are filtered from both terms.,7️⃣ Currency is converted at the order's booking rate rather than the refund-date rate, so the denominator and numerator of a cross-border cohort stay on the same basis and FX movement cannot distort the percentage.

Business Use Case: |
  1️⃣ Finance uses the matured monthly cohort rate to set and true-up the refund reserve at close; when a cohort lands more than 50 basis points above forecast, the Controller reopens the accrual and flags the affected categories to Merchandising before the period is locked.,2️⃣ Merchandising reviews the rate broken down by Refund Type and Return Reason each week and pulls or re-photographs any style whose refund rate exceeds its category benchmark, treating sizing and description-mismatch reasons as a product-content defect rather than a customer behaviour.,3️⃣ Customer Service monitors the non-return refund share (goodwill credits, service recovery, price adjustments) to size agent discretion policy, tightening or widening credit authority thresholds when that share drifts from plan.,4️⃣ Revenue Management tests promotional and price-guarantee policies against the rate, retiring price-adjustment guarantees whose refund cost outweighs the incremental conversion they buy.


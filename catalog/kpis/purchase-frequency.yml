KPI Name: Purchase Frequency
Formula: Purchase Frequency = Total Valid Orders in Period / Distinct Purchasing Customers in Period (customers with ≥ 1 valid order in the same period); used in CLV = Average Order Value × Purchase Frequency × Customer Lifespan, with Purchase Frequency expressed on an annual basis

Description: |
  Purchase Frequency is the average number of valid orders placed per distinct purchasing customer within a reporting period, calculated as total valid orders divided by the unique customers who placed at least one of them. It is the frequency term of the standard Customer Lifetime Value decomposition (Average Order Value × Purchase Frequency × Customer Lifespan), so a movement here translates directly into lifetime value, retention-programme ROI and the revenue plan built on returning customers.


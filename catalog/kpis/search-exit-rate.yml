KPI Name: Search Exit Rate
Formula: (Search Exits / Unique Searches) × 100

Description: |
  Percentage of unique on-site searches after which the visitor leaves the site straight from the search results page. High values point to irrelevant results, weak ranking or a poor results layout.

Category: Experience


























KPI Name: Delivery Exception Rate
Formula: (Shipments with ≥1 Delivery Exception / Total Shipments Handed to Carrier) × 100

Description: |
  Share of shipments handed to a carrier that logged at least one delivery exception (delay, damage, address issue, failed attempt, loss). Wider than Failed Delivery Rate, which counts failed attempts only.

Category: Operations


























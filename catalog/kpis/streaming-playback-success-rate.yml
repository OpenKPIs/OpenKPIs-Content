  WITH extracted AS (
    SELECT
      e.event_timestamp AS source_event_timestamp,
      e.user_id AS ga4_user_id,
      (
        SELECT AS STRUCT
          MAX(IF(key = 'event_id', v, NULL)) AS event_id,
          MAX(IF(key = 'event_timestamp', v, NULL)) AS event_timestamp,
          MAX(IF(key = 'playback_attempt_id', v, NULL)) AS playback_attempt_id,
          MAX(IF(key = 'playback_session_id', v, NULL)) AS playback_session_id,
          MAX(IF(key = 'user_id', v, NULL)) AS user_id,
          MAX(IF(key = 'anonymous_id', v, NULL)) AS anonymous_id,
          MAX(IF(key = 'item_id', v, NULL)) AS item_id,
          MAX(IF(key = 'content_title', v, NULL)) AS content_title,
          MAX(IF(key = 'content_type', v, NULL)) AS content_type,
          MAX(IF(key = 'content_format', v, NULL)) AS content_format,
          MAX(IF(key = 'series_id', v, NULL)) AS series_id,
          MAX(IF(key = 'season_number', v, NULL)) AS season_number,
          MAX(IF(key = 'episode_number', v, NULL)) AS episode_number,
          MAX(IF(key = 'content_duration_ms', v, NULL)) AS content_duration_ms,
          MAX(IF(key = 'is_live', v, NULL)) AS is_live,
          MAX(IF(key = 'stream_type', v, NULL)) AS stream_type,
          MAX(IF(key = 'playback_position_ms', v, NULL)) AS playback_position_ms,
          MAX(IF(key = 'player_name', v, NULL)) AS player_name,

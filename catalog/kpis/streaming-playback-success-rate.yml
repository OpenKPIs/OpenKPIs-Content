    k.successful_qualified_attempts,
    k.total_qualified_attempts,
    k.streaming_playback_success_rate_pct
  FROM qualified_attempts q
  CROSS JOIN kpi k
  ORDER BY q.event_timestamp DESC, q.playback_attempt_id;

Calculation Notes: |
  Calculate from distinct qualified playback_attempt_id values using the timestamp of the playback attempt for period assignment. A successful attempt must produce a validated content-first-frame event within 10 seconds of the content playback request and must not record a fatal startup error before that event; for audio-only streams, the equivalent validated audio-render event is used. Required pre-roll advertising time is excluded by starting the measurement clock only when the content request becomes eligible after the ad sequence. Automatic player retries remain part of the original attempt unless a new user-initiated play action creates a new playback_attempt_id. Attempts without a terminal event remain pending until the 10-second outcome window expires and are then classified as unsuccessful. Recalculate recent periods for late-arriving telemetry and publish finalized daily values after the defined data-latency window.

Business Use Case: |
  The Streaming Product organization monitors this KPI by application version, device model, CDN, DRM provider, and content type. If the rate falls below 99.0% for a specific smart-TV release, the release owner can halt rollout, route traffic to a stable player version or alternate CDN, and prioritize remediation using the associated startup error codes.



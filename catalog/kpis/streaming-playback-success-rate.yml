KPI Name: Streaming Playback Success Rate
Formula: (Successful Qualified Playback Attempts / Total Qualified Playback Attempts) × 100

Description: |
  Measures the percentage of qualified streaming playback attempts that render the requested content within the defined startup time limit without a fatal playback error. It indicates the reliability of the end-to-end playback experience across applications, devices, content formats, delivery networks, and digital rights management services.

Category: Quality

Tags: [kpi]

Industry: [Media & Streaming]

Priority: High

Core Area: Engagement

Scope: Event

Measure Type: percentage

Aggregation Window: Time based - Hourly/Daily/Monthly


          MAX(IF(key = 'startup_time_ms', v, NULL)) AS startup_time_ms,
          MAX(IF(key = 'startup_time_limit_ms', v, NULL)) AS startup_time_limit_ms,
          MAX(IF(key = 'qualified_attempt', v, NULL)) AS qualified_attempt,
          MAX(IF(key = 'playback_success', v, NULL)) AS playback_success,
          MAX(IF(key = 'content_rendered', v, NULL)) AS content_rendered,
          MAX(IF(key = 'fatal_playback_error', v, NULL)) AS fatal_playback_error,
          MAX(IF(key = 'error_code', v, NULL)) AS error_code,
          MAX(IF(key = 'error_type', v, NULL)) AS error_type,
          MAX(IF(key = 'error_stage', v, NULL)) AS error_stage,
          MAX(IF(key = 'retry_count', v, NULL)) AS retry_count,
          MAX(IF(key = 'country_code', v, NULL)) AS country_code,
          MAX(IF(key = 'language_code', v, NULL)) AS language_code
        FROM (
          SELECT
            ep.key,
            COALESCE(
              ep.value.string_value,
              CAST(ep.value.int_value AS STRING),
              CAST(ep.value.double_value AS STRING),
              CAST(ep.value.float_value AS STRING)
            ) AS v
          FROM UNNEST(e.event_params) AS ep
        )
      ) AS p
    FROM `your-project.analytics_123456789.events_*` AS e
    WHERE e.event_name = 'select_content'
      AND _TABLE_SUFFIX BETWEEN FORMAT_DATE('%Y%m%d', DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY))
                            AND FORMAT_DATE('%Y%m%d', DATE_SUB(CURRENT_DATE(), INTERVAL 1 DAY))
  ),
  typed AS (
    SELECT
      COALESCE(p.event_id, CONCAT('ga4-', CAST(source_event_timestamp AS STRING), '-', p.playback_attempt_id)) AS event_id,
      COALESCE(SAFE_CAST(p.event_timestamp AS TIMESTAMP), TIMESTAMP_MICROS(source_event_timestamp)) AS event_timestamp,
      p.playback_attempt_id,
      p.playback_session_id,
      COALESCE(p.user_id, ga4_user_id) AS user_id,
      p.anonymous_id,
      p.item_id,
      p.content_title,
      p.content_type,
      p.content_format,
      p.series_id,
      SAFE_CAST(p.season_number AS INT64) AS season_number,
      SAFE_CAST(p.episode_number AS INT64) AS episode_number,
      SAFE_CAST(p.content_duration_ms AS INT64) AS content_duration_ms,
      SAFE_CAST(LOWER(p.is_live) AS BOOL) AS is_live,
      p.stream_type,
      SAFE_CAST(p.playback_position_ms AS INT64) AS playback_position_ms,
      p.player_name,
      p.player_version,
      p.application_name,
      p.application_version,
      p.platform,
      p.device_type,
      p.device_manufacturer,
      p.device_model,
      p.operating_system,
      p.operating_system_version,
      p.browser_name,
      p.browser_version,
      p.network_type,
      p.cdn_provider,
      p.cdn_pop,
      p.drm_system,
      p.drm_license_status,
      p.video_codec,
      p.audio_codec,
      SAFE_CAST(p.bitrate_kbps AS INT64) AS bitrate_kbps,
      SAFE_CAST(p.startup_time_ms AS INT64) AS startup_time_ms,
      SAFE_CAST(p.startup_time_limit_ms AS INT64) AS startup_time_limit_ms,
      SAFE_CAST(LOWER(p.qualified_attempt) AS BOOL) AS qualified_attempt,
      SAFE_CAST(LOWER(p.playback_success) AS BOOL) AS playback_success,
      SAFE_CAST(LOWER(p.content_rendered) AS BOOL) AS content_rendered,
      SAFE_CAST(LOWER(p.fatal_playback_error) AS BOOL) AS fatal_playback_error,
      NULLIF(p.error_code, '') AS error_code,
      NULLIF(p.error_type, '') AS error_type,
      NULLIF(p.error_stage, '') AS error_stage,
      SAFE_CAST(p.retry_count AS INT64) AS retry_count,
      p.country_code,
      p.language_code
    FROM extracted
  ),
  deduplicated AS (
    SELECT * EXCEPT(row_num)
    FROM (
      SELECT
        typed.*,
        ROW_NUMBER() OVER (
          PARTITION BY playback_attempt_id
          ORDER BY event_timestamp DESC, event_id DESC
        ) AS row_num
      FROM typed
      WHERE playback_attempt_id IS NOT NULL
        AND qualified_attempt IS NOT NULL
        AND playback_success IS NOT NULL
    )
    WHERE row_num = 1
  ),
  qualified_attempts AS (
    SELECT *
    FROM deduplicated
    WHERE qualified_attempt = TRUE
  ),
  kpi AS (
    SELECT
      COUNTIF(playback_success = TRUE) AS successful_qualified_attempts,
      COUNT(*) AS total_qualified_attempts,
      SAFE_MULTIPLY(
        100.0,
        SAFE_DIVIDE(COUNTIF(playback_success = TRUE), COUNT(*))
      ) AS streaming_playback_success_rate_pct
    FROM qualified_attempts
  )
  SELECT
    q.event_id,
    q.event_timestamp,
    q.playback_attempt_id,
    q.playback_session_id,
    q.user_id,
    q.anonymous_id,
    q.item_id,
    q.content_title,
    q.content_type,
    q.content_format,
    q.series_id,
    q.season_number,
    q.episode_number,
    q.content_duration_ms,
    q.is_live,
    q.stream_type,
    q.playback_position_ms,
    q.player_name,
    q.player_version,
    q.application_name,
    q.application_version,
    q.platform,
    q.device_type,
    q.device_manufacturer,
    q.device_model,
    q.operating_system,
    q.operating_system_version,
    q.browser_name,
    q.browser_version,
    q.network_type,
    q.cdn_provider,
    q.cdn_pop,
    q.drm_system,
    q.drm_license_status,
    q.video_codec,
    q.audio_codec,
    q.bitrate_kbps,
    q.startup_time_ms,
    q.startup_time_limit_ms,
    q.qualified_attempt,
    q.playback_success,
    q.content_rendered,
    q.fatal_playback_error,
    q.error_code,
    q.error_type,
    q.error_stage,
    q.retry_count,
    q.country_code,
    q.language_code,
    k.successful_qualified_attempts,
    k.total_qualified_attempts,
    k.streaming_playback_success_rate_pct
  FROM qualified_attempts AS q
  CROSS JOIN kpi AS k
  ORDER BY q.event_timestamp DESC, q.playback_attempt_id;

AEP Query Service SQL: |
  -- ==========================================
  -- 2. ADOBE AEP QUERY SERVICE SQL
  -- ==========================================
  WITH typed AS (
    SELECT
      eventID AS event_id,
      timestamp AS event_timestamp,
      _experience.analytics.customDimensions.eVars.eVar1 AS playback_attempt_id,
      _experience.analytics.customDimensions.eVars.eVar2 AS playback_session_id,
      _experience.analytics.customDimensions.eVars.eVar3 AS user_id,
      _experience.analytics.customDimensions.eVars.eVar4 AS anonymous_id,
      COALESCE(
        mediaCollection.sessionDetails.name,
        _experience.analytics.customDimensions.eVars.eVar5
      ) AS item_id,
      COALESCE(
        mediaCollection.sessionDetails.friendlyName,
        _experience.analytics.customDimensions.eVars.eVar6
      ) AS content_title,
      COALESCE(
        mediaCollection.sessionDetails.contentType,
        _experience.analytics.customDimensions.eVars.eVar7
      ) AS content_type,
      _experience.analytics.customDimensions.eVars.eVar8 AS content_format,
      _experience.analytics.customDimensions.eVars.eVar9 AS series_id,
      CAST(NULLIF(_experience.analytics.customDimensions.eVars.eVar10, '') AS INTEGER) AS season_number,
      CAST(NULLIF(_experience.analytics.customDimensions.eVars.eVar11, '') AS INTEGER) AS episode_number,
      COALESCE(
        CAST(NULLIF(_experience.analytics.customDimensions.eVars.eVar12, '') AS BIGINT),
        CAST(mediaCollection.sessionDetails.length * 1000 AS BIGINT)
      ) AS content_duration_ms,
      CASE
        WHEN LOWER(_experience.analytics.customDimensions.eVars.eVar13) = 'true' THEN TRUE
        WHEN LOWER(_experience.analytics.customDimensions.eVars.eVar13) = 'false' THEN FALSE
        ELSE NULL
      END AS is_live,
      COALESCE(
        mediaCollection.sessionDetails.streamType,
        _experience.analytics.customDimensions.eVars.eVar14
      ) AS stream_type,
      COALESCE(
        CAST(mediaCollection.playhead * 1000 AS BIGINT),
        CAST(NULLIF(_experience.analytics.customDimensions.eVars.eVar15, '') AS BIGINT)
      ) AS playback_position_ms,
      COALESCE(
        mediaCollection.sessionDetails.playerName,
        _experience.analytics.customDimensions.eVars.eVar16
      ) AS player_name,
      _experience.analytics.customDimensions.eVars.eVar17 AS player_version,
      COALESCE(application.name, _experience.analytics.customDimensions.eVars.eVar18) AS application_name,
      COALESCE(application.version, _experience.analytics.customDimensions.eVars.eVar19) AS application_version,
      COALESCE(environment.type, _experience.analytics.customDimensions.eVars.eVar20) AS platform,
      COALESCE(device.type, _experience.analytics.customDimensions.eVars.eVar21) AS device_type,
      COALESCE(device.manufacturer, _experience.analytics.customDimensions.eVars.eVar22) AS device_manufacturer,
      COALESCE(device.model, _experience.analytics.customDimensions.eVars.eVar23) AS device_model,
      COALESCE(environment.operatingSystem, _experience.analytics.customDimensions.eVars.eVar24) AS operating_system,
      COALESCE(environment.operatingSystemVersion, _experience.analytics.customDimensions.eVars.eVar25) AS operating_system_version,
      COALESCE(environment.browserDetails.browser, _experience.analytics.customDimensions.eVars.eVar26) AS browser_name,
      COALESCE(environment.browserDetails.version, _experience.analytics.customDimensions.eVars.eVar27) AS browser_version,
      _experience.analytics.customDimensions.eVars.eVar28 AS network_type,
      _experience.analytics.customDimensions.eVars.eVar29 AS cdn_provider,
      _experience.analytics.customDimensions.eVars.eVar30 AS cdn_pop,
      _experience.analytics.customDimensions.eVars.eVar31 AS drm_system,
      _experience.analytics.customDimensions.eVars.eVar32 AS drm_license_status,
      _experience.analytics.customDimensions.eVars.eVar33 AS video_codec,
      _experience.analytics.customDimensions.eVars.eVar34 AS audio_codec,
      COALESCE(
        CAST(mediaCollection.qoeDataDetails.bitrate AS BIGINT),
        CAST(NULLIF(_experience.analytics.customDimensions.eVars.eVar35, '') AS BIGINT)
      ) AS bitrate_kbps,
      COALESCE(
        CAST(mediaCollection.qoeDataDetails.timeToStart * 1000 AS BIGINT),
        CAST(NULLIF(_experience.analytics.customDimensions.eVars.eVar36, '') AS BIGINT)
      ) AS startup_time_ms,
      CAST(NULLIF(_experience.analytics.customDimensions.eVars.eVar37, '') AS BIGINT) AS startup_time_limit_ms,
      CASE
        WHEN LOWER(_experience.analytics.customDimensions.eVars.eVar38) = 'true' THEN TRUE
        WHEN LOWER(_experience.analytics.customDimensions.eVars.eVar38) = 'false' THEN FALSE
        ELSE NULL
      END AS qualified_attempt,
      CASE
        WHEN LOWER(_experience.analytics.customDimensions.eVars.eVar39) = 'true' THEN TRUE
        WHEN LOWER(_experience.analytics.customDimensions.eVars.eVar39) = 'false' THEN FALSE
        ELSE NULL
      END AS playback_success,
      CASE
        WHEN LOWER(_experience.analytics.customDimensions.eVars.eVar40) = 'true' THEN TRUE
        WHEN LOWER(_experience.analytics.customDimensions.eVars.eVar40) = 'false' THEN FALSE
        ELSE NULL
      END AS content_rendered,
      CASE
        WHEN LOWER(_experience.analytics.customDimensions.eVars.eVar41) = 'true' THEN TRUE
        WHEN LOWER(_experience.analytics.customDimensions.eVars.eVar41) = 'false' THEN FALSE
        ELSE NULL
      END AS fatal_playback_error,
      NULLIF(_experience.analytics.customDimensions.eVars.eVar42, '') AS error_code,
      NULLIF(_experience.analytics.customDimensions.eVars.eVar43, '') AS error_type,
      NULLIF(_experience.analytics.customDimensions.eVars.eVar44, '') AS error_stage,
      CAST(NULLIF(_experience.analytics.customDimensions.eVars.eVar45, '') AS INTEGER) AS retry_count,
      COALESCE(placeContext.geo.countryCode, _experience.analytics.customDimensions.eVars.eVar46) AS country_code,
      _experience.analytics.customDimensions.eVars.eVar47 AS language_code
    FROM streaming_playback_events
    WHERE web.webInteraction.name = 'select_content'
      AND timestamp >= CURRENT_DATE - INTERVAL '30' DAY
      AND timestamp < CURRENT_DATE
  ),
  ranked AS (
    SELECT
      typed.*,
      ROW_NUMBER() OVER (
        PARTITION BY playback_attempt_id
        ORDER BY event_timestamp DESC, event_id DESC
      ) AS row_num
    FROM typed
    WHERE playback_attempt_id IS NOT NULL
      AND qualified_attempt IS NOT NULL
      AND playback_success IS NOT NULL
  ),
  qualified_attempts AS (
    SELECT
      event_id,
      event_timestamp,
      playback_attempt_id,
      playback_session_id,
      user_id,
      anonymous_id,
      item_id,
      content_title,
      content_type,
      content_format,
      series_id,
      season_number,
      episode_number,
      content_duration_ms,
      is_live,
      stream_type,
      playback_position_ms,
      player_name,
      player_version,
      application_name,
      application_version,
      platform,
      device_type,
      device_manufacturer,
      device_model,
      operating_system,
      operating_system_version,
      browser_name,
      browser_version,
      network_type,
      cdn_provider,
      cdn_pop,
      drm_system,
      drm_license_status,
      video_codec,
      audio_codec,
      bitrate_kbps,
      startup_time_ms,
      startup_time_limit_ms,
      qualified_attempt,
      playback_success,
      content_rendered,
      fatal_playback_error,
      error_code,
      error_type,
      error_stage,
      retry_count,
      country_code,
      language_code
    FROM ranked
    WHERE row_num = 1
      AND qualified_attempt = TRUE
  ),
  kpi AS (
    SELECT
      SUM(CASE WHEN playback_success = TRUE THEN 1 ELSE 0 END) AS successful_qualified_attempts,
      COUNT(*) AS total_qualified_attempts,
      100.0 * SUM(CASE WHEN playback_success = TRUE THEN 1 ELSE 0 END)
        / NULLIF(COUNT(*), 0) AS streaming_playback_success_rate_pct
    FROM qualified_attempts
  )
  SELECT
    q.event_id,
    q.event_timestamp,
    q.playback_attempt_id,
    q.playback_session_id,
    q.user_id,
    q.anonymous_id,
    q.item_id,
    q.content_title,
    q.content_type,
    q.content_format,
    q.series_id,
    q.season_number,

# KPI: Curbside Pickup Rate
# Generated: 2026-09-21T17:12:09.605Z
# Contributed by: devyendarm
# Last modified by: devyendarm

KPI Name: Curbside Pickup Rate
Formula: Curbside Pickup Rate (%) = (COUNT(DISTINCT transaction_id) of BOPIS orders placed in the period with fulfillment_method = 'curbside' / COUNT(DISTINCT transaction_id) of all BOPIS orders placed in the period, where fulfillment_method IN ('pickup_in_store', 'curbside')) × 100

Description: |
  Curbside Pickup Rate is the share of all buy-online-pickup-in-store (BOPIS) orders placed in a period for which the customer chose curbside handoff, with the attendant bringing the order to the vehicle, instead of collecting it at the in-store pickup counter or locker. It is a fulfilment-mix measure used to staff curbside bays and set their capacity, and it is distinct from Pickup Completion Rate, which measures whether pickup orders are actually collected, not how the customer chose to collect them.


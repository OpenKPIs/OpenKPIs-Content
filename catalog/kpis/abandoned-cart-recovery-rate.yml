Google Analytics SQL: |
  -- BigQuery Standard SQL integration template; these relations are not native GA4 tables.
  -- Bind cart_recovery_config, cart_abandonment_facts and completed_order_facts to
  -- governed backend integration views. Browser event counts cannot establish the denominator.
  -- Overall recovery includes linked purchases with and without marketing contact.
  -- No marketing exposure, qualifying touch or attribution model is required.
  --
  -- Shared input contract for both platform templates:
  -- cart_recovery_config has exactly one validated row. Required fields:
  -- abandonment_seconds INT64 > 0; recovery_seconds INT64 > 0;
  -- arrival_seconds INT64 >= 0; report_lookback_seconds INT64 > 0;
  -- report_end_lag_seconds INT64 >= 0; reporting_timezone STRING, valid IANA zone;
  -- restatement_policy STRING = 'recompute_affected_cohorts'. No default durations.
  -- Reject missing, duplicate or invalid configuration before executing either query.
  -- All durations must fit timestamp arithmetic. Report boundaries are relative to
  -- the current whole-second observation time. For local calendar periods, resolve
  -- boundaries in reporting_timezone and supply the resulting elapsed-second offsets.
  -- Use the same observation second and boundaries when comparing platform results.
  --
  -- cart_abandonment_facts fields: merchant_id STRING, canonical_cart_id STRING,
  -- abandonment_ts TIMESTAMP, recovery_seconds INT64, arrival_seconds INT64,
  -- measurement_complete BOOL. Unique nonnull key: merchant_id, canonical_cart_id.
  -- Validate nonempty keys, nonnull timestamps, positive recovery_seconds and
  -- nonnegative arrival_seconds before query execution. Preserve configured durations
  -- on each fact so later rule changes do not alter existing recovery deadlines.
  -- Build facts from complete ordered cart lifecycle history, not a reporting-window scan.
  -- First abandonment is configured inactivity expiry for a nonempty production cart
  -- with no accepted, payment-confirmed purchase at or before that expiry.
  -- Exclude emptied carts, test/bot activity and confirmed fraud. Freeze first abandonment;
  -- later re-entry cannot move it. Resolve checkout, restored-cart and merged-cart lineage
  -- first. Each merged lifecycle has one canonical key and one first abandonment.
  -- Deduplicate source events by their stable keys. Resolve simultaneous state changes
  -- by authoritative sequence and source event ID; quarantine unresolved conflicts.
  --
  -- completed_order_facts fields: merchant_id STRING, transaction_id STRING,
  -- canonical_cart_id STRING, purchase_ts TIMESTAMP. Unique nonnull key:
  -- merchant_id, transaction_id. An order maps to at most one canonical cart.
  -- Deduplicate deliveries using order key and authoritative acceptance time.
  -- Include accepted, payment-confirmed production orders; exclude test/bot/fraud orders.
  -- Explicit commerce lineage is required; customer/device identity alone cannot link a cart.
  -- Legitimate later refunds or cancellations retain completion. Changed prices or partial
  -- contents still permit one recovery. Read orders through the selected recovery deadlines.
  -- Both fact tables use UTC timestamps at whole-second resolution.
  --
  -- Coverage: measurement_complete is true only with complete cart history and order-link
  -- coverage through the recovery deadline. Retain anonymous and marketing-suppressed carts.
  -- Missing keys and lifecycle records require a separate coverage report and block result
  -- publication; do not silently omit them. Incomplete candidate coverage suppresses results.
  -- No matching order with complete coverage means observed non-recovery; unavailable
  -- linkage does not. Recompute affected cohorts for late arrivals and retain revision history.
  --
  -- Shared privacy and mapping contract: opaque cart/order keys are customer-linkable,
  -- hence Restricted and pii_flag=true. Keep contact linkage in controlled backend systems.
  -- Respect collection permission separately from marketing permission; send no contact hashes.
  -- Payloads are synthetic field examples, not deployed records or complete event envelopes.
  -- Collection supplies event timestamps and IDs, including XDM timestamp and _id.
  -- XDM uses the declared tenant cartContext strings and needs no person identity here.
  -- Purchase XDM uses commerce.purchases, commerce.order.purchaseID and the same cartContext.
  -- This count-based KPI needs no money fields or campaign context.
  --
  -- Output: one total across mature carts first abandoned in the half-open reporting interval.
  -- Immature carts are excluded, not reported as failures; this is not a full-period estimate
  -- when that period contains immature carts. Finalization includes the arrival allowance.
  -- Segment using frozen abandonment attributes on both populations, retaining unknown values.
  -- Combine disjoint cohorts by summing counts and recomputing the percentage.
  WITH bounds AS (
    SELECT
      TIMESTAMP_TRUNC(CURRENT_TIMESTAMP(), SECOND) AS observation_ts,
      report_lookback_seconds,
      report_end_lag_seconds
    FROM cart_recovery_config
  ), candidates AS (
    SELECT
      c.merchant_id,
      c.canonical_cart_id,
      c.abandonment_ts,
      TIMESTAMP_ADD(c.abandonment_ts, INTERVAL c.recovery_seconds SECOND) AS recovery_end_ts,
      c.measurement_complete
    FROM cart_abandonment_facts AS c
    CROSS JOIN bounds AS b
    WHERE c.abandonment_ts >= TIMESTAMP_SUB(
        TIMESTAMP_SUB(b.observation_ts, INTERVAL b.report_end_lag_seconds SECOND),
        INTERVAL b.report_lookback_seconds SECOND)
      AND c.abandonment_ts < TIMESTAMP_SUB(b.observation_ts, INTERVAL b.report_end_lag_seconds SECOND)
      AND TIMESTAMP_ADD(
        TIMESTAMP_ADD(c.abandonment_ts, INTERVAL c.recovery_seconds SECOND),
        INTERVAL c.arrival_seconds SECOND) <= b.observation_ts
  ), outcomes AS (
    SELECT
      c.merchant_id,
      c.canonical_cart_id,
      c.measurement_complete,
      MAX(IF(o.transaction_id IS NOT NULL, 1, 0)) AS recovered
    FROM candidates AS c
    LEFT JOIN completed_order_facts AS o
      ON o.merchant_id = c.merchant_id
      AND o.canonical_cart_id = c.canonical_cart_id
      AND o.purchase_ts > c.abandonment_ts
      AND o.purchase_ts <= c.recovery_end_ts
    GROUP BY c.merchant_id, c.canonical_cart_id, c.measurement_complete
  ), totals AS (
    SELECT
      COUNT(*) AS eligible_carts,
      COALESCE(SUM(recovered), 0) AS recovered_carts,
      COUNTIF(measurement_complete IS NULL OR NOT measurement_complete) AS incomplete_carts
    FROM outcomes
  )
  SELECT
    IF(incomplete_carts > 0, 'incomplete_coverage', 'final_mature_carts') AS result_status,
    IF(incomplete_carts = 0, eligible_carts, NULL) AS eligible_abandoned_carts,
    IF(incomplete_carts = 0, recovered_carts, NULL) AS recovered_abandoned_carts,
    IF(incomplete_carts = 0, 100.0 * SAFE_DIVIDE(recovered_carts, eligible_carts), NULL) AS abandoned_cart_recovery_rate_pct
  FROM totals;

AEP Query Service SQL: |
  -- AEP Query Service SELECT template over integrated datasets, not native recovery fields.
  -- Bind cart_recovery_config, cart_abandonment_facts and completed_order_facts to
  -- datasets implementing the shared input, privacy and coverage contract in ga4_sql.
  -- That contract is mandatory for both templates, including upstream validation.
  -- No customer deployment or automatically available lifecycle dataset is implied.
  --
  -- AEP schema bindings:
  -- cart_recovery_config: abandonment_seconds, recovery_seconds, arrival_seconds,
  -- report_lookback_seconds and report_end_lag_seconds are BIGINT; reporting_timezone
  -- and restatement_policy are STRING. Exactly one valid row; no defaults.
  -- Abandonment, recovery and lookback durations are positive; arrival and end lag
  -- are nonnegative. Validate the IANA timezone and timestamp arithmetic ranges.
  -- cart_abandonment_facts: merchant_id STRING, canonical_cart_id STRING,
  -- abandonment_ts TIMESTAMP, recovery_seconds BIGINT, arrival_seconds BIGINT,
  -- measurement_complete BOOLEAN. Unique nonnull merchant/cart key.
  -- completed_order_facts: merchant_id STRING, transaction_id STRING,
  -- canonical_cart_id STRING, purchase_ts TIMESTAMP. Unique nonnull merchant/order key.
  -- Each order maps to at most one canonical cart through explicit commerce lineage.
  -- Session timezone is UTC; all input timestamps have whole-second resolution.
  --
  -- Freeze first qualifying abandonment and its configured durations from complete
  -- backend history. Resolve merged/restored/checkout identities before counting.
  -- Exclude carts emptied or purchased at or before inactivity expiry. Re-entry cannot
  -- move abandonment. Deduplicate by source keys; order simultaneous updates by
  -- authoritative sequence then event ID and quarantine unresolved conflicts.
  -- Include accepted, payment-confirmed production purchases, excluding test/bot/fraud.
  -- Later legitimate refunds/cancellations retain completion; partial contents qualify.
  -- Retain anonymous and suppressed carts. No touch or customer-identity match is required.
  -- Missing keys or records block publication through the upstream coverage check;
  -- incomplete candidate coverage suppresses the query result. Read order history through
  -- recovery deadlines. Recompute affected cohorts for late data, retaining revision history.
  --
  -- One total across mature carts in a relative half-open reporting interval.
  -- For calendar periods, resolve local boundaries into elapsed-second offsets.
  -- Match the observation second and boundaries to BigQuery for parity checks.
  -- Immature carts are excluded; output is not an estimate for all carts in the period.
  -- Filter segments by frozen abandonment attributes, retaining unknown values and
  -- both outcomes. Combine disjoint cohorts using counts rather than averaging rates.
  WITH bounds AS (
    SELECT
      unix_timestamp(current_timestamp()) AS observation_epoch,
      report_lookback_seconds,
      report_end_lag_seconds
    FROM cart_recovery_config
  ), candidates AS (
    SELECT
      c.merchant_id,
      c.canonical_cart_id,
      c.abandonment_ts,
      CAST(from_unixtime(unix_timestamp(c.abandonment_ts) + c.recovery_seconds) AS TIMESTAMP) AS recovery_end_ts,
      c.measurement_complete
    FROM cart_abandonment_facts c
    CROSS JOIN bounds b
    WHERE c.abandonment_ts >= CAST(from_unixtime(
        b.observation_epoch - b.report_end_lag_seconds - b.report_lookback_seconds) AS TIMESTAMP)
      AND c.abandonment_ts < CAST(from_unixtime(
        b.observation_epoch - b.report_end_lag_seconds) AS TIMESTAMP)
      AND unix_timestamp(c.abandonment_ts) + c.recovery_seconds + c.arrival_seconds <= b.observation_epoch
  ), outcomes AS (
    SELECT
      c.merchant_id,
      c.canonical_cart_id,
      c.measurement_complete,
      MAX(CASE WHEN o.transaction_id IS NOT NULL THEN 1 ELSE 0 END) AS recovered
    FROM candidates c
    LEFT JOIN completed_order_facts o
      ON o.merchant_id = c.merchant_id
      AND o.canonical_cart_id = c.canonical_cart_id
      AND o.purchase_ts > c.abandonment_ts
      AND o.purchase_ts <= c.recovery_end_ts
    GROUP BY c.merchant_id, c.canonical_cart_id, c.measurement_complete
  ), totals AS (
    SELECT
      COUNT(*) AS eligible_carts,
      COALESCE(SUM(recovered), 0) AS recovered_carts,
      COALESCE(SUM(CASE WHEN measurement_complete = true THEN 0 ELSE 1 END), 0) AS incomplete_carts
    FROM outcomes
  )
  SELECT
    CASE WHEN incomplete_carts > 0 THEN 'incomplete_coverage' ELSE 'final_mature_carts' END AS result_status,
    CASE WHEN incomplete_carts = 0 THEN eligible_carts ELSE NULL END AS eligible_abandoned_carts,
    CASE WHEN incomplete_carts = 0 THEN recovered_carts ELSE NULL END AS recovered_abandoned_carts,
    CASE WHEN incomplete_carts = 0 THEN 100.0 * recovered_carts / NULLIF(eligible_carts, 0) ELSE NULL END AS abandoned_cart_recovery_rate_pct
  FROM totals;

Calculation Notes: |
  1️⃣ Count one merchant-scoped cart lifecycle; resolve checkout, merged and restored cart links before counting.
  2️⃣ Freeze first abandonment at configured inactivity expiry for a nonempty cart with no completed purchase at or before expiry.
  3️⃣ Include purchases with and without marketing contact. Campaign-attributed conversion is a separate measure.
  4️⃣ Require explicit order-to-cart links. Count each cart once and credit each order to at most one cart.
  5️⃣ Count purchases after abandonment through its configured deadline; finalize after the configured data-arrival allowance.
  6️⃣ Keep anonymous and marketing-suppressed carts. Missing linkage is a coverage limitation; use backend history for the denominator.
  7️⃣ Exclude test, bot and fraud activity. Later legitimate refunds retain completion. Return null for no carts; combine rates from counts.

Business Use Case: |
  1️⃣ Track how much abandoned shopping demand returns to purchase.
  2️⃣ Compare recovery across cart sizes and checkout stages to prioritize improvements.
  3️⃣ Review recovery trends alongside recovered sales and incentive costs.

Dependencies:
  Events: [add-to-cart, remove-from-cart, checkout-initiation, purchase]
  Dimensions: [transaction-id, checkout-step, cart-size-band, device-category, customer-segment]

Source Data: Commerce cart history and completed orders, with links between carts and orders

Report Attributes: |
  Abandonment date; Checkout stage at abandonment; Cart size at abandonment; Device category at abandonment; Customer segment at abandonment

Dashboard Usage: [Cart and checkout performance, Abandoned demand recovery, Recovery trends by customer group]

Segment Eligibility: |
  Compare carts by checkout stage, cart size, device or customer group recorded at abandonment. Include recovered and unrecovered carts in each group, retain unknown values, and use the same recovery rules.


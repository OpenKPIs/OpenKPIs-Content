# KPI: Abandoned Cart Recovery Rate
# Generated: 2026-09-18T23:20:20.090Z
# Contributed by: devyendarm
# Last modified by: devyendarm

KPI Name: Abandoned Cart Recovery Rate
Formula: (Recovered Orders attributed to a recovery touch within the 7-day window / Abandoned Carts in the period) × 100

Description: |
  Abandoned Cart Recovery Rate is the share of carts and checkouts classified as abandoned in a period that are subsequently converted into a completed purchase by the same identified shopper within a fixed 7-day recovery window, credited to a recovery touch such as an email, SMS or retargeting click. It quantifies how much demand the business wins back after the primary funnel has already failed, and is the standard measure of commercial return on abandoned-cart journeys in Shopify, Klaviyo and Salesforce Marketing Cloud reporting.

Category: Conversion

Tags: [kpi, E-commerce: Cart & Checkout Funnel Analytics]

Industry: [["E-commerce"]]

Priority: High

Core Area: Checkout

Scope: User

Measure Type: Percentage

Aggregation Window: Daily, Weekly, Monthly

GA4 Event: |
  purchase

Adobe Event: |
  purchase


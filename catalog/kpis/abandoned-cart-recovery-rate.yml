KPI Name: Abandoned Cart Recovery Rate
Formula: (Abandoned carts that led to a completed order / Abandoned carts) × 100

Description: |
  Percentage of abandoned shopping carts that later lead to a completed order within the recovery period. Includes orders placed with or without marketing contact.

Category: Conversion

Tags: [Cart recovery, Checkout, E-commerce]

Industry: [["E-commerce, Retail"]]

Priority: High

Core Area: Cart and checkout recovery

Scope: Global

Measure Type: Percentage

Aggregation Window: Daily, Weekly, Monthly

GA4 Event: |
  Collect add_to_cart, remove_from_cart, begin_checkout and purchase. Send custom merchant_id and cart_id as event-level parameters outside ecommerce. Purchase includes ecommerce.transaction_id and items. Cart events carry the same cart key and the items involved. Configure tags to forward these fields; the mapping illustrates purchase.

Adobe Event: |
  Map additions, removals, checkout and purchase to commerce.productListAdds, commerce.productListRemovals, commerce.checkouts and commerce.purchases. Configure Adobe Client Data Layer rules to populate XDM. Purchase uses commerce.order.purchaseID. Define cartContext.merchantID and cartContext.cartID as strings under the organization's tenant namespace, replacing _tenant. Map the layer's cart fields to that context on every event. The XDM fragment illustrates purchase.


KPI Name: Abandoned Cart Recovery Rate
Formula: (Recovered abandoned carts / Eligible abandoned carts) × 100

Description: |
  Percentage of eligible abandoned carts that become completed purchases within the configured recovery window. Includes purchases with and without marketing contact.

Category: Conversion

Tags: [Cart recovery, Checkout, E-commerce]

Industry: [["E-commerce, Retail"]]

Priority: High

Core Area: Cart and checkout recovery

Scope: Global

Measure Type: Percentage

Aggregation Window: Daily, Weekly, Monthly

GA4 Event: |
  Collect add_to_cart, remove_from_cart, begin_checkout and purchase. Send custom merchant_id and cart_id as event-level parameters outside ecommerce. Purchase includes ecommerce.transaction_id and items. Cart events carry the same cart key and the items involved. Configure tags to forward these fields; the mapping illustrates purchase.

Adobe Event: |
  Map additions, removals, checkout and purchase to commerce.productListAdds, commerce.productListRemovals, commerce.checkouts and commerce.purchases. Configure Client Data Layer collection rules. The XDM fragment illustrates an addition; purchase uses commerce.purchases and commerce.order.purchaseID. Define cartContext.merchantID and cartContext.cartID as strings under the organization's tenant namespace, replacing _tenant.


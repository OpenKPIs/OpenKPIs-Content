Google Analytics SQL: |
  -- ==========================================
  -- 1. GOOGLE BIGQUERY SQL
  -- ==========================================
  -- KPI: Coupon Redemption Rate
  -- Formula: Orders with >= 1 coupon code applied / Total completed orders * 100
  -- Grain: ONE row per order (transaction_id). An order carrying the same code on
  -- three line items counts once; a re-fired purchase beacon counts once.
  -- Denominator: EVERY completed order in the window, including full-price,
  -- zero-discount orders. It is never narrowed to coupon-exposed sessions.
  -- Breakdown rows (Coupon Code, Discount Amount band) keep that same full base
  -- population as their denominator, so the rate stays comparable across cells.
  
  WITH purchase_events AS (
    SELECT
      PARSE_DATE('%Y%m%d', e.event_date) AS order_date,
      e.event_timestamp,
      e.user_pseudo_id,
      e.device.category AS device_category,
      e.traffic_source.medium AS traffic_medium,
      e.traffic_source.name AS campaign_name,
      -- Transaction-level parameters are pivoted out of the event_params array.
      -- One conditional pass per key with MAX(IF(...)), so two different keys are
      -- never demanded of the same array element.
      (SELECT MAX(IF(p.key = 'transaction_id', COALESCE(p.value.string_value, CAST(p.value.int_value AS STRING)), NULL))
         FROM UNNEST(e.event_params) AS p) AS transaction_id,
      (SELECT MAX(IF(p.key = 'coupon', TRIM(p.value.string_value), NULL))
         FROM UNNEST(e.event_params) AS p) AS order_coupon_code,
      (SELECT MAX(IF(p.key = 'discount_amount', COALESCE(p.value.double_value, p.value.float_value, CAST(p.value.int_value AS FLOAT64)), NULL))
         FROM UNNEST(e.event_params) AS p) AS order_discount_amount,
      (SELECT MAX(IF(p.key = 'value', COALESCE(p.value.double_value, p.value.float_value, CAST(p.value.int_value AS FLOAT64)), NULL))
         FROM UNNEST(e.event_params) AS p) AS order_value,
      (SELECT MAX(IF(p.key = 'order_status', LOWER(TRIM(p.value.string_value)), NULL))
         FROM UNNEST(e.event_params) AS p) AS order_status,
      (SELECT MAX(IF(p.key = 'coupon_applied', LOWER(COALESCE(p.value.string_value, CAST(p.value.int_value AS STRING))), NULL))
         FROM UNNEST(e.event_params) AS p) AS coupon_applied_flag,
      (SELECT MAX(IF(p.key = 'coupon_scope', p.value.string_value, NULL))
         FROM UNNEST(e.event_params) AS p) AS coupon_scope,
      (SELECT MAX(IF(p.key = 'promotion_name', p.value.string_value, NULL))
         FROM UNNEST(e.event_params) AS p) AS promotion_name,
      (SELECT MAX(IF(p.key = 'checkout_type', p.value.string_value, NULL))
         FROM UNNEST(e.event_params) AS p) AS checkout_type,
      (SELECT MAX(IF(p.key = 'payment_type', p.value.string_value, NULL))
         FROM UNNEST(e.event_params) AS p) AS payment_type,
      (SELECT MAX(IF(p.key = 'customer_type', p.value.string_value, NULL))
         FROM UNNEST(e.event_params) AS p) AS customer_type,
      (SELECT MAX(IF(p.key IN ('test_order', 'internal_traffic'), LOWER(COALESCE(p.value.string_value, CAST(p.value.int_value AS STRING))), NULL))
         FROM UNNEST(e.event_params) AS p) AS internal_or_test_flag,
      -- Item-level coupon lives in the items array, not in event_params.
      -- MAX() collapses the repeated code to one value per order line-set.
      (SELECT MAX(TRIM(i.coupon))
         FROM UNNEST(e.items) AS i
        WHERE i.coupon IS NOT NULL AND TRIM(i.coupon) <> '') AS item_coupon_code,
      (SELECT COUNTIF(i.coupon IS NOT NULL AND TRIM(i.coupon) <> '')
         FROM UNNEST(e.items) AS i) AS couponed_line_items,
      (SELECT COUNT(1) FROM UNNEST(e.items) AS i) AS line_items,
      (SELECT SUM(COALESCE(ip.value.double_value, ip.value.float_value, CAST(ip.value.int_value AS FLOAT64), 0) * IFNULL(i.quantity, 1))
         FROM UNNEST(e.items) AS i, UNNEST(i.item_params) AS ip
        WHERE ip.key = 'discount') AS item_discount_total
    FROM `your-project.analytics_123456789.events_*` AS e
    WHERE _TABLE_SUFFIX BETWEEN FORMAT_DATE('%Y%m%d', DATE_SUB(CURRENT_DATE(), INTERVAL 90 DAY))
                            AND FORMAT_DATE('%Y%m%d', DATE_SUB(CURRENT_DATE(), INTERVAL 1 DAY))
      AND e.event_name = 'purchase'
  ),
  
  -- Order grain: one surviving row per transaction_id (earliest beacon wins), so a
  -- confirmation-page reload cannot double count either side of the ratio.
  orders AS (
    SELECT
      order_date,
      transaction_id,
      COALESCE(NULLIF(order_coupon_code, ''), NULLIF(item_coupon_code, '')) AS coupon_code,
      COALESCE(order_discount_amount, item_discount_total, 0) AS discount_amount,
      order_value,
      coupon_applied_flag,
      coupon_scope,
      promotion_name,
      checkout_type,
      payment_type,
      customer_type,
      device_category,
      traffic_medium,
      campaign_name,
      couponed_line_items,
      line_items
    FROM purchase_events
    WHERE transaction_id IS NOT NULL
      AND TRIM(transaction_id) <> ''
      -- order_status is a string status, never a numeric metric
      AND COALESCE(order_status, 'completed') IN ('completed', 'complete', 'paid', 'success')
      AND COALESCE(internal_or_test_flag, 'false') NOT IN ('true', '1')
      AND NOT STARTS_WITH(UPPER(transaction_id), 'TEST')
    QUALIFY ROW_NUMBER() OVER (PARTITION BY transaction_id ORDER BY event_timestamp) = 1
  ),
  
  order_grain AS (
    SELECT
      order_date,
      transaction_id,
      coupon_code,
      -- Only a customer-facing code qualifies an order. An automatic cart price
      -- rule that moves discount_amount without a code does NOT count.
      -- The coupon_applied flag alone never qualifies an order: a non-empty code is required.
      (coupon_code IS NOT NULL) AS has_coupon,
      discount_amount,
      CASE
        WHEN discount_amount IS NULL OR discount_amount <= 0 THEN '0 | no discount'
        WHEN discount_amount < 10 THEN '1 | 0.01-9.99'
        WHEN discount_amount < 25 THEN '2 | 10-24.99'
        WHEN discount_amount < 50 THEN '3 | 25-49.99'
        WHEN discount_amount < 100 THEN '4 | 50-99.99'
        ELSE '5 | 100+'
      END AS discount_band,
      order_value,
      coupon_scope,
      promotion_name,
      checkout_type,
      payment_type,
      customer_type,
      device_category,
      traffic_medium,
      campaign_name,
      couponed_line_items,
      line_items
    FROM orders
  ),
  
  -- Full base population per day: ALL completed orders, couponed or not.
  base_population AS (
    SELECT order_date, COUNT(DISTINCT transaction_id) AS total_orders
    FROM order_grain
    GROUP BY order_date
  )
  
  SELECT
    o.order_date,
    IF(GROUPING(o.coupon_code) = 1, '(all orders)', COALESCE(o.coupon_code, '(no code applied)')) AS coupon_code,
    IF(GROUPING(o.discount_band) = 1, '(all bands)', o.discount_band) AS discount_amount_band,
    ANY_VALUE(b.total_orders) AS total_orders,
    COUNTIF(o.has_coupon) AS orders_with_coupon,
    ROUND(SAFE_DIVIDE(COUNTIF(o.has_coupon), ANY_VALUE(b.total_orders)) * 100, 2) AS coupon_redemption_rate_pct,
    ROUND(SUM(IF(o.has_coupon, o.discount_amount, 0)), 2) AS discount_amount_total,
    ROUND(SAFE_DIVIDE(SUM(IF(o.has_coupon, o.discount_amount, 0)), COUNTIF(o.has_coupon)), 2) AS avg_discount_per_redeemed_order,
    ROUND(SAFE_DIVIDE(SUM(IF(o.has_coupon, o.order_value, 0)), COUNTIF(o.has_coupon)), 2) AS avg_order_value_redeemed,
    SUM(o.couponed_line_items) AS couponed_line_items,
    SUM(o.line_items) AS line_items
  FROM order_grain AS o
  JOIN base_population AS b
    USING (order_date)
  GROUP BY GROUPING SETS (
    (o.order_date),
    (o.order_date, o.coupon_code),
    (o.order_date, o.discount_band)
  )
  ORDER BY order_date DESC, coupon_redemption_rate_pct DESC, coupon_code, discount_amount_band;

AEP Query Service SQL: |
  -- ==========================================
  -- 2. ADOBE AEP QUERY SERVICE SQL
  -- ==========================================
  -- KPI: Coupon Redemption Rate
  -- Formula: Orders with >= 1 coupon code applied / Total completed orders * 100
  -- Source: ExperienceEvent dataset, eventType = 'commerce.purchases'.
  -- Order identity: commerce.order.purchaseID. Order-level code: commerce.promotionID
  -- (mirrored in _yourtenant.coupon.code and eVar12); productListItems carry the per-line
  -- discountAmount only, so line-level context can never multiply an order in the numerator.
  -- Denominator: every completed order in the window, zero-discount orders included.
  -- Completed status and test/internal exclusions come from _yourtenant.orderAttributes,
  -- matching the order_status / test_order / internal_traffic filters in the GA4 query.
  
  WITH purchase_events AS (
    SELECT
      _id AS event_id,
      timestamp AS event_timestamp,
      to_date(timestamp) AS order_date,
      commerce.order.purchaseID AS transaction_id,
      commerce.order.purchaseOrderNumber AS purchase_order_number,
      commerce.order.currencyCode AS currency_code,
      commerce.order.priceTotal AS order_value,
      commerce.order.discountAmount AS order_discount_amount,
      commerce.purchases.value AS purchase_units,
      trim(commerce.promotionID) AS order_promotion_id,
      trim(_yourtenant.coupon.code) AS coupon_code_tenant,
      lower(trim(_yourtenant.orderAttributes.orderStatus)) AS order_status,
      trim(_experience.analytics.customDimensions.eVars.eVar12) AS coupon_code_evar,
      lower(trim(_experience.analytics.customDimensions.eVars.eVar13)) AS coupon_applied_evar,
      _experience.analytics.customDimensions.eVars.eVar14 AS coupon_scope,
      _experience.analytics.customDimensions.eVars.eVar15 AS discount_rate_band,
      _experience.analytics.customDimensions.props.prop12 AS promotion_name,
      web.webPageDetails.name AS page_name,
      web.webPageDetails.siteSection AS site_section
    FROM your_experience_event_dataset
    WHERE eventType = 'commerce.purchases'
      AND timestamp >= date_trunc('day', now() - interval '90 days')
      AND timestamp < date_trunc('day', now())
      AND commerce.order.purchaseID IS NOT NULL
      AND trim(commerce.order.purchaseID) <> ''
      AND lower(commerce.order.purchaseID) NOT LIKE 'test%'
      -- order_status is a string status, never a numeric metric
      AND coalesce(lower(trim(_yourtenant.orderAttributes.orderStatus)), 'completed') IN ('completed', 'complete', 'paid', 'success')
      AND coalesce(_yourtenant.orderAttributes.testOrder, false) = false
      AND coalesce(_yourtenant.orderAttributes.internalTraffic, false) = false
  ),
  
  -- productListItems is exploded in its own branch and folded straight back to the
  -- event, so a five-line order with one sitewide code stays one order.
  item_context AS (
    SELECT
      event_id,
      sum(coalesce(item.discountAmount, 0)) AS item_discount_total,
      sum(coalesce(item.quantity, 0)) AS units,
      count(1) AS line_items,
      sum(CASE WHEN coalesce(item.discountAmount, 0) > 0 THEN 1 ELSE 0 END) AS discounted_line_items
    FROM (
      SELECT _id AS event_id, explode(productListItems) AS item
      FROM your_experience_event_dataset
      WHERE eventType = 'commerce.purchases'
        AND timestamp >= date_trunc('day', now() - interval '90 days')
        AND timestamp < date_trunc('day', now())
    ) AS exploded_items
    GROUP BY event_id
  ),
  
  -- One surviving row per purchaseID (earliest beacon), so a confirmation reload
  -- cannot inflate the numerator or the denominator.
  deduplicated_orders AS (
    SELECT
      p.*,
      coalesce(i.item_discount_total, 0) AS item_discount_total,
      coalesce(i.line_items, 0) AS line_items,
      coalesce(i.discounted_line_items, 0) AS discounted_line_items,
      row_number() OVER (PARTITION BY p.transaction_id ORDER BY p.event_timestamp ASC) AS beacon_rank
    FROM purchase_events AS p
    LEFT JOIN item_context AS i
      ON i.event_id = p.event_id
  ),
  
  order_grain AS (
    SELECT
      order_date,
      transaction_id,
      coalesce(nullif(order_promotion_id, ''), nullif(coupon_code_tenant, ''), nullif(coupon_code_evar, '')) AS coupon_code,
      -- Only a non-empty customer-facing code qualifies; the applied flag (eVar13) alone never does.
      CASE
        WHEN coalesce(nullif(order_promotion_id, ''), nullif(coupon_code_tenant, ''), nullif(coupon_code_evar, '')) IS NOT NULL THEN 1
        ELSE 0
      END AS has_coupon,
      coalesce(order_discount_amount, item_discount_total, 0) AS discount_amount,
      coalesce(order_value, 0) AS order_value,
      coupon_scope,
      discount_rate_band,
      promotion_name,
      currency_code,
      line_items,
      discounted_line_items
    FROM deduplicated_orders
    WHERE beacon_rank = 1
  ),
  
  order_banded AS (
    SELECT
      order_date,
      transaction_id,
      coupon_code,
      has_coupon,
      discount_amount,
      order_value,
      coupon_scope,
      promotion_name,
      line_items,
      discounted_line_items,
      CASE
        WHEN discount_amount <= 0 THEN '0 | no discount'
        WHEN discount_amount < 10 THEN '1 | 0.01-9.99'
        WHEN discount_amount < 25 THEN '2 | 10-24.99'
        WHEN discount_amount < 50 THEN '3 | 25-49.99'
        WHEN discount_amount < 100 THEN '4 | 50-99.99'
        ELSE '5 | 100+'
      END AS discount_band
    FROM order_grain
  ),
  
  base_population AS (
    SELECT order_date, count(DISTINCT transaction_id) AS total_orders
    FROM order_banded
    GROUP BY order_date
  )
  
  SELECT
    o.order_date,
    CASE WHEN grouping(o.coupon_code) = 1 THEN '(all orders)'
         ELSE coalesce(o.coupon_code, '(no code applied)') END AS coupon_code,
    CASE WHEN grouping(o.discount_band) = 1 THEN '(all bands)'
         ELSE o.discount_band END AS discount_amount_band,
    max(b.total_orders) AS total_orders,
    sum(o.has_coupon) AS orders_with_coupon,
    round(sum(o.has_coupon) * 100.0 / nullif(max(b.total_orders), 0), 2) AS coupon_redemption_rate_pct,
    round(sum(CASE WHEN o.has_coupon = 1 THEN o.discount_amount ELSE 0 END), 2) AS discount_amount_total,
    round(sum(CASE WHEN o.has_coupon = 1 THEN o.discount_amount ELSE 0 END) / nullif(sum(o.has_coupon), 0), 2) AS avg_discount_per_redeemed_order,
    round(sum(CASE WHEN o.has_coupon = 1 THEN o.order_value ELSE 0 END) / nullif(sum(o.has_coupon), 0), 2) AS avg_order_value_redeemed,
    sum(o.discounted_line_items) AS discounted_line_items,
    sum(o.line_items) AS line_items
  FROM order_banded AS o
  JOIN base_population AS b
    ON b.order_date = o.order_date
  GROUP BY GROUPING SETS (
    (o.order_date),
    (o.order_date, o.coupon_code),
    (o.order_date, o.discount_band)
  )
  ORDER BY 1 DESC, 6 DESC, 2, 3;

Calculation Notes: |
  1️⃣ Denominator is every completed order (purchase event) in the period, including full-price orders that never saw a coupon field. Never narrow the base to sessions that opened or interacted with the promo-code input — that variant inflates the rate by 2–4× and destroys comparability across releases, devices and campaigns.,2️⃣ Numerator is orders carrying at least one coupon or promotion code on the purchase payload. Deduplicate to order grain on transaction_id: item-level coupon parameters repeat the same code on every line, so a five-line order with one sitewide code must resolve to a single qualifying order, not five.,3️⃣ coupon_apply events that never reach a purchase are excluded from the numerator by definition. Report them separately as a diagnostic pair — coupon apply-to-purchase rate and invalid/expired code rate — because a rising apply volume with flat redemption signals a validation or eligibility defect, not demand.,4️⃣ Exclusions: internal test and training orders, known bot traffic, and duplicate purchase events fired by order-confirmation page reloads (dedupe on transaction_id before counting either side of the ratio). Orders later cancelled or refunded remain on their original order date in both numerator and denominator unless the reporting standard is explicitly net orders — state which convention the dashboard uses.,5️⃣ Only a customer-facing code string counts. Automatic cart price rules that apply with no code entered, employee/staff discounts and price-match adjustments are excluded and are read through Discount Amount instead; gift cards and store credit are tender, not discounts, and never qualify an order.,6️⃣ Because the measure is order-grain, session-timeout mechanics (GA4's 30-minute inactivity rollover, midnight session resets) do not affect it — a code entered in an earlier session still counts when it is present on the purchase payload. Attribute each order to its purchase timestamp in the property's reporting timezone, and compare like periods only, since promotional calendars make week-over-week movement meaningless without an aligned baseline.,7️⃣ Slice the rate by Coupon Code and by Discount Amount band as standard practice; suppress or flag any cell with fewer than roughly 100 orders, and never sum sub-period rates — always recompute the ratio from the aggregated numerator and denominator.

Business Use Case: |
  1️⃣ The Promotions Manager in Merchandising reviews redemption by Coupon Code in the weekly trading meeting; when a sitewide code passes its planned share of orders (for example more than 40% of orders carrying a code) they raise the minimum-spend threshold, cap the code to targeted audiences, or retire it early to protect margin.,2️⃣ The Finance margin controller pairs the rate with Discount Amount band and Average Order Value at month-end close to quantify discount leakage per order, reforecast gross margin, and escalate codes where the incremental revenue does not cover the discount cost.,3️⃣ The Lifecycle Marketing Manager compares redemption for campaign-sourced orders against organic orders after each email or SMS send, then decides whether to reissue the code, narrow the audience, or suppress segments that only convert with a discount.,4️⃣ The Checkout Product Manager monitors the rate against the coupon apply-to-purchase diagnostic after every checkout release; a drop in redemption with rising failed applies triggers a fix to code validation, error messaging or promo-field placement before the next promotional window.


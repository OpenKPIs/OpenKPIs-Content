# KPI: Coupon Redemption Rate
# Generated: 2026-09-17T23:16:09.814Z
# Contributed by: devyendarm


KPI Name: Coupon Redemption Rate
Formula: (Orders with ≥ 1 Coupon Code Applied / Total Completed Orders) × 100

Description: |
  Coupon Redemption Rate is the share of completed orders in which at least one coupon or promotion code was successfully applied at purchase, measured against every order placed in the period including full-price, zero-discount orders. It is deliberately order-based and is not the issuance-based variant (coupons redeemed / coupons issued), which is a promotion-management measure of code distribution, nor is it Loyalty Redemption Rate, which tracks loyalty points and rewards being burned rather than discount codes.

Category: Conversion


























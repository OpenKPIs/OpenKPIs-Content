# KPI: Coupon Redemption Rate
# Generated: 2026-09-19T01:41:24.587Z
# Contributed by: devyendarm
# Last modified by: devyendarm

KPI Name: Coupon Redemption Rate
Formula: (Orders with ≥ 1 Coupon Code Applied / Total Completed Orders) × 100

Description: |
  Coupon Redemption Rate is the share of completed orders in which at least one coupon or promotion code was successfully applied at purchase, measured against every order placed in the period including full-price, zero-discount orders. It is deliberately order-based and is not the issuance-based variant (coupons redeemed / coupons issued), which is a promotion-management measure of code distribution. It sits downstream of Promotion Click-Through Rate, which measures engagement with promotional placements before checkout rather than codes actually applied to completed orders.

Category: Conversion

Tags: [kpi, E-commerce: Cart & Checkout Funnel Analytics]

Industry: [["E-commerce"]]

Priority: High

Core Area: Checkout

Scope: Event

Measure Type: Percentage

Aggregation Window: Daily, Weekly, Monthly, Quarterly

GA4 Event: |
  purchase

Adobe Event: |
  purchase (Order Confirmation page-view beacon; order-level coupon code set in the coupon eVar, item-level codes carried as product merchandising context)


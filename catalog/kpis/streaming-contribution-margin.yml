KPI Name: Streaming Contribution Margin
Formula: Streaming Contribution Margin(p, s) = Σ Net Recognized Streaming Revenue(p, s) − Σ Eligible Streaming Variable and Direct Costs(p, s), where p is the accounting period and s is the reporting scope

Description: |
  Streaming Contribution Margin measures net recognized streaming revenue less eligible variable and directly attributable costs recognized for the same accounting period and reporting scope. It represents the amount generated by streaming operations before corporate overhead, interest, income taxes, restructuring charges, and other excluded expenses.

Category: Revenue

Tags: [kpi]

Industry: [Media]

Priority: High

Core Area: Monetization

Scope: Global

Measure Type: currency

Aggregation Window: Time based - Monthly







Google Analytics SQL: |
  -- ==========================================
  -- 1. GOOGLE BIGQUERY SQL
  -- ==========================================
  WITH latest_finance_records AS (
    SELECT
      accounting_date,
      source_system,
      source_record_id,
      revision_number,
      approved_at,
      approval_status,
      business_line,
      contribution_margin_component,
      contribution_amount_usd
    FROM `your-project.finance_approved.streaming_profitability_mart`
    QUALIFY ROW_NUMBER() OVER (
      PARTITION BY source_system, source_record_id
      ORDER BY
        revision_number DESC NULLS LAST,
        approved_at DESC NULLS LAST
    ) = 1
  ),
  monthly_component_totals AS (
    SELECT
      DATE_TRUNC(accounting_date, MONTH) AS reporting_month,
      SUM(
        CASE
          WHEN contribution_margin_component = 'STREAMING_REVENUE'
            THEN COALESCE(contribution_amount_usd, 0)
          ELSE 0
        END
      ) AS recognized_streaming_revenue_usd,
      SUM(
        CASE
          WHEN contribution_margin_component = 'STREAMING_VARIABLE_COST'
            THEN -COALESCE(contribution_amount_usd, 0)
          ELSE 0
        END
      ) AS streaming_variable_cost_usd
    FROM latest_finance_records
    WHERE accounting_date >= DATE_SUB(
        DATE_TRUNC(CURRENT_DATE('UTC'), MONTH),
        INTERVAL 12 MONTH
      )
      AND accounting_date < DATE_TRUNC(CURRENT_DATE('UTC'), MONTH)
      AND approval_status = 'APPROVED'
      AND business_line = 'STREAMING'
      AND contribution_margin_component IN (
        'STREAMING_REVENUE',
        'STREAMING_VARIABLE_COST'
      )
    GROUP BY reporting_month
  ),
  monthly_financials AS (
    SELECT
      reporting_month,
      recognized_streaming_revenue_usd,
      streaming_variable_cost_usd,
      recognized_streaming_revenue_usd
        - streaming_variable_cost_usd AS streaming_contribution_margin_usd
    FROM monthly_component_totals
  )
  SELECT
    reporting_month,
    ROUND(recognized_streaming_revenue_usd, 2)
      AS recognized_streaming_revenue_usd,
    ROUND(streaming_variable_cost_usd, 2)
      AS streaming_variable_cost_usd,
    ROUND(streaming_contribution_margin_usd, 2)
      AS streaming_contribution_margin_usd,
    ROUND(
      100 * SAFE_DIVIDE(
        streaming_contribution_margin_usd,
        recognized_streaming_revenue_usd
      ),
      4
    ) AS streaming_contribution_margin_pct
  FROM monthly_financials
  ORDER BY reporting_month;

AEP Query Service SQL: |
  -- ==========================================
  -- 2. ADOBE AEP QUERY SERVICE SQL
  -- ==========================================
  WITH ranked_finance_records AS (
    SELECT
      accounting_date,
      source_system,
      source_record_id,
      revision_number,
      approved_at,
      approval_status,
      business_line,
      contribution_margin_component,
      contribution_amount_usd,
      ROW_NUMBER() OVER (
        PARTITION BY source_system, source_record_id
        ORDER BY
          revision_number DESC NULLS LAST,
          approved_at DESC NULLS LAST
      ) AS record_rank
    FROM finance_approved_streaming_profitability_mart
  ),
  latest_finance_records AS (
    SELECT
      accounting_date,
      source_system,
      source_record_id,
      revision_number,
      approved_at,
      approval_status,
      business_line,
      contribution_margin_component,
      contribution_amount_usd
    FROM ranked_finance_records
    WHERE record_rank = 1
  ),
  monthly_component_totals AS (
    SELECT
      CAST(date_trunc('month', accounting_date) AS DATE) AS reporting_month,
      SUM(
        CASE
          WHEN contribution_margin_component = 'STREAMING_REVENUE'
            THEN COALESCE(contribution_amount_usd, 0)
          ELSE 0
        END
      ) AS recognized_streaming_revenue_usd,
      SUM(
        CASE
          WHEN contribution_margin_component = 'STREAMING_VARIABLE_COST'
            THEN -COALESCE(contribution_amount_usd, 0)
          ELSE 0
        END
      ) AS streaming_variable_cost_usd
    FROM latest_finance_records
    WHERE accounting_date >= CAST(
        date_trunc('month', CURRENT_DATE) - INTERVAL '12 months' AS DATE
      )
      AND accounting_date < CAST(
        date_trunc('month', CURRENT_DATE) AS DATE
      )
      AND approval_status = 'APPROVED'
      AND business_line = 'STREAMING'
      AND contribution_margin_component IN (
        'STREAMING_REVENUE',
        'STREAMING_VARIABLE_COST'
      )
    GROUP BY CAST(date_trunc('month', accounting_date) AS DATE)
  ),
  monthly_financials AS (
    SELECT
      reporting_month,
      recognized_streaming_revenue_usd,
      streaming_variable_cost_usd,
      recognized_streaming_revenue_usd
        - streaming_variable_cost_usd AS streaming_contribution_margin_usd
    FROM monthly_component_totals
  )
  SELECT
    reporting_month,
    ROUND(recognized_streaming_revenue_usd, 2)
      AS recognized_streaming_revenue_usd,
    ROUND(streaming_variable_cost_usd, 2)
      AS streaming_variable_cost_usd,
    ROUND(streaming_contribution_margin_usd, 2)
      AS streaming_contribution_margin_usd,
    ROUND(
      100.0 * streaming_contribution_margin_usd
        / NULLIF(recognized_streaming_revenue_usd, 0),
      4
    ) AS streaming_contribution_margin_pct
  FROM monthly_financials
  ORDER BY reporting_month;

Calculation Notes: |
  Calculate on an accrual basis using revenue and eligible costs recognized in the same accounting period. Net recognized streaming revenue includes subscription, advertising, transactional, partner, distribution, and other directly attributable streaming revenue, less refunds, credits, chargebacks, discounts, and contra-revenue; exclude indirect taxes. Allocate bundle consideration using the Finance-approved standalone-selling-price methodology. Eligible costs include directly attributable content amortization and license expense, royalties, participations, partner revenue shares, CDN and bandwidth usage, transcoding, variable cloud delivery, payment processing, app-store commissions not recorded as contra-revenue, advertising delivery costs, and approved variable service costs. Do not record the same charge as both contra-revenue and expense. Exclude capitalized content additions, non-streaming activity, general corporate overhead, interest, income taxes, restructuring charges, and fixed enterprise costs without an approved streaming allocation. Use posted ledger entries and approved close estimates only; eliminate intercompany activity for consolidated reporting. Calculate in local currency first, then translate revenue and costs using the approved average exchange rate for the accounting period. Restate the original service period for material post-close adjustments under the Finance restatement policy.

Business Use Case: |
  The CFO and Streaming Finance team compare monthly contribution margin with plan by market, monetization model, subscription plan, and distribution channel. If a market's revenue grows while contribution margin falls below plan, management can revise pricing or promotions, change the distribution mix, renegotiate content or partner terms, or reduce delivery, cloud, and payment-processing costs.


Source Data: ERP general ledger and subledgers; subscription billing; advertising, transaction, payment-processing, app-store, and distribution partner systems; content rights and royalty systems; CDN and cloud billing; and the Finance-approved streaming profitability mart


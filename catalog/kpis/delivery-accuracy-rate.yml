KPI Name: Delivery Accuracy Rate
Formula: (Number of On-Time Deliveries / Total Deliveries) × 100

Description: |
  Measures the percentage of deliveries made on or before the scheduled delivery date. It reflects the efficiency and reliability of the logistics process.

Category: Quality

Tags: [kpi]

Industry: [Logistics & Supply Chain]

Priority: High

Core Area: Generic

Scope: Global

Measure Type: percentage

Aggregation Window: Time based - Daily







Google Analytics SQL: |
  -- ==========================================
  -- 1. GOOGLE BIGQUERY SQL
  -- ==========================================
  SELECT order_id, 
         COUNTIF(status = 'delivered') / COUNT(*) AS delivery_accuracy_rate
  FROM `your-project.erp.delivery_logs`
  GROUP BY order_id

AEP Query Service SQL: |
  -- ==========================================
  -- 2. ADOBE AEP QUERY SERVICE SQL
  -- ==========================================
  SELECT order_id, 
         COUNT(CASE WHEN status = 'delivered' THEN 1 END) / COUNT(*) AS delivery_accuracy_rate
  FROM aep_backend_dataset.delivery_logs
  GROUP BY order_id

Calculation Notes: |
  Exclude deliveries with customer-requested delays. Consider timezone differences for international shipments.

Business Use Case: |
  Logistics managers use this KPI to identify bottlenecks in the delivery process and improve customer satisfaction by ensuring timely deliveries.


Source Data: ERP


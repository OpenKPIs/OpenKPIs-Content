KPI Name: Content Release Audience Reach
Formula: (Unique Eligible Audience Members with at Least One Qualified Play of the Release / Unique Audience Members Eligible for the Release During the Measurement Window) × 100

Description: |
  Content Release Audience Reach measures the percentage of eligible audience members who generate at least one qualified play of a newly released content item during the defined post-release measurement window. It shows how broadly a release penetrates its addressable streaming audience rather than how frequently reached audience members watch it.

Category: Engagement

Tags: [kpi]

Industry: [Media & Streaming]

Priority: High

Core Area: Engagement

Scope: User

Measure Type: percentage

Aggregation Window: Time based - Daily

GA4 Event: |
  video_progress

Adobe Event: |

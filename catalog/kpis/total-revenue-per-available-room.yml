KPI Name: Total Revenue per Available Room
Formula: (Net Rooms Revenue + Net Food and Beverage Revenue + Net Spa Revenue + Net Parking Revenue + Net Other Operating Revenue) / Total Available Room Nights

Description: |
  Total Revenue per Available Room measures the net recognized operating revenue generated by a hotel or portfolio for each room night available for sale during the reporting period. It evaluates how effectively available room inventory generates revenue across rooms, food and beverage, spa, parking, and other hotel-operated outlets, regardless of whether the rooms were occupied.

Category: Revenue

Tags: [kpi]

Industry: [Travel & Hospitality]

Priority: High

Core Area: Monetization

Scope: Global

Measure Type: currency

Aggregation Window: Time based - Daily/Monthly/Yearly







Google Analytics SQL: |
  -- ==========================================
  -- 1. GOOGLE BIGQUERY SQL
  -- ==========================================
  WITH
  parameters AS (
    SELECT
      @start_date AS start_date,
      @end_date AS end_date,
      @reporting_currency AS reporting_currency
  ),
  inventory AS (
    SELECT
      i.property_id,
      MAX(i.total_room_count) AS current_room_inventory,
      SUM(GREATEST(COALESCE(i.available_room_count, 0), 0)) AS available_room_nights,
      SUM(GREATEST(COALESCE(i.occupied_room_count, 0), 0)) AS occupied_room_nights,
      SUM(GREATEST(COALESCE(i.sold_room_count, 0), 0)) AS sold_room_nights,
      SUM(GREATEST(COALESCE(i.complimentary_room_count, 0), 0)) AS complimentary_room_nights,
      SUM(GREATEST(COALESCE(i.house_use_room_count, 0), 0)) AS house_use_room_nights,
      SUM(GREATEST(COALESCE(i.out_of_order_room_count, 0), 0)) AS out_of_order_room_nights,
      MAX(i.loaded_at) AS inventory_loaded_at
    FROM `your-project.hospitality.property_inventory_daily` AS i
    CROSS JOIN parameters AS p
    WHERE i.business_date BETWEEN p.start_date AND p.end_date
    GROUP BY i.property_id
  ),
  revenue_base AS (
    SELECT
      r.property_id,
      r.transaction_id,
      r.business_date,
      r.revenue_department_code,
      r.source_system,
      r.currency_code,
      COALESCE(r.gross_revenue_amount_local, 0) AS gross_revenue_amount_local,
      COALESCE(r.discount_amount_local, 0) AS discount_amount_local,
      COALESCE(r.refund_amount_local, 0) AS refund_amount_local,
      COALESCE(r.tax_amount_local, 0) AS tax_amount_local,
      COALESCE(r.gratuity_amount_local, 0) AS gratuity_amount_local,
      COALESCE(r.net_revenue_amount_local, 0) AS net_revenue_amount_local,
      CASE
        WHEN r.currency_code = p.reporting_currency THEN CAST(1 AS NUMERIC)
        ELSE fx.conversion_rate
      END AS reporting_conversion_rate,
      r.loaded_at
    FROM `your-project.hospitality.revenue_subledger_transactions` AS r
    CROSS JOIN parameters AS p
    LEFT JOIN `your-project.finance.daily_fx_rates` AS fx
      ON fx.rate_date = r.business_date
     AND fx.from_currency_code = r.currency_code
     AND fx.to_currency_code = p.reporting_currency
    WHERE r.business_date BETWEEN p.start_date AND p.end_date
      AND r.transaction_status = 'POSTED'
      AND COALESCE(r.is_void, FALSE) = FALSE
      AND COALESCE(r.is_internal_transfer, FALSE) = FALSE
  ),
  revenue AS (
    SELECT
      property_id,
      SUM(gross_revenue_amount_local) AS gross_revenue_local,
      SUM(discount_amount_local) AS discount_amount_local,
      SUM(refund_amount_local) AS refund_amount_local,
      SUM(tax_amount_local) AS tax_amount_local,
      SUM(gratuity_amount_local) AS gratuity_amount_local,
      SUM(IF(revenue_department_code = 'ROOMS', net_revenue_amount_local, 0)) AS room_revenue_local,
      SUM(IF(revenue_department_code = 'FOOD_BEVERAGE', net_revenue_amount_local, 0)) AS food_beverage_revenue_local,
      SUM(IF(revenue_department_code = 'SPA', net_revenue_amount_local, 0)) AS spa_revenue_local,
      SUM(IF(revenue_department_code = 'GOLF', net_revenue_amount_local, 0)) AS golf_revenue_local,
      SUM(IF(revenue_department_code = 'PARKING', net_revenue_amount_local, 0)) AS parking_revenue_local,
      SUM(IF(revenue_department_code = 'RESORT_FEE', net_revenue_amount_local, 0)) AS resort_fee_revenue_local,
      SUM(
        IF(
          COALESCE(revenue_department_code, 'OTHER') NOT IN
            ('ROOMS', 'FOOD_BEVERAGE', 'SPA', 'GOLF', 'PARKING', 'RESORT_FEE'),
          net_revenue_amount_local,
          0
        )
      ) AS other_revenue_local,
      SUM(net_revenue_amount_local) AS total_revenue_local,
      CASE
        WHEN COUNTIF(reporting_conversion_rate IS NULL) > 0 THEN NULL
        ELSE SUM(net_revenue_amount_local * reporting_conversion_rate)
      END AS total_revenue_reporting,
      COUNT(DISTINCT transaction_id) AS revenue_transaction_count,
      COUNT(DISTINCT source_system) AS source_system_count,
      MAX(loaded_at) AS revenue_loaded_at
    FROM revenue_base
    GROUP BY property_id
  )
  SELECT
    p.start_date AS reporting_start_date,
    p.end_date AS reporting_end_date,
    i.property_id,
    d.property_name,
    d.brand_name,
    d.management_company,
    d.ownership_type,
    d.property_type,
    d.service_level,
    d.chain_scale,
    d.market_name,
    d.submarket_name,
    d.city,
    d.state_province,
    d.country_code,
    d.geographic_region,
    d.currency_code AS property_currency_code,
    d.time_zone,
    d.opening_date,
    i.current_room_inventory,
    i.available_room_nights,
    COALESCE(r.gross_revenue_local, 0) AS gross_revenue_local,
    COALESCE(r.discount_amount_local, 0) AS discount_amount_local,
    COALESCE(r.refund_amount_local, 0) AS refund_amount_local,
    COALESCE(r.tax_amount_local, 0) AS tax_amount_local,
    COALESCE(r.gratuity_amount_local, 0) AS gratuity_amount_local,
    COALESCE(r.room_revenue_local, 0) AS room_revenue_local,
    COALESCE(r.food_beverage_revenue_local, 0) AS food_beverage_revenue_local,
    COALESCE(r.spa_revenue_local, 0) AS spa_revenue_local,
    COALESCE(r.golf_revenue_local, 0) AS golf_revenue_local,
    COALESCE(r.parking_revenue_local, 0) AS parking_revenue_local,
    COALESCE(r.resort_fee_revenue_local, 0) AS resort_fee_revenue_local,
    COALESCE(r.other_revenue_local, 0) AS other_revenue_local,
    COALESCE(r.total_revenue_local, 0) AS total_revenue_local,
    r.total_revenue_reporting,
    p.reporting_currency,
    ROUND(SAFE_DIVIDE(COALESCE(r.total_revenue_local, 0), i.available_room_nights), 2) AS total_revenue_per_available_room_local,
    ROUND(SAFE_DIVIDE(r.total_revenue_reporting, i.available_room_nights), 2) AS total_revenue_per_available_room_reporting,
    i.occupied_room_nights,
    i.sold_room_nights,
    i.complimentary_room_nights,
    i.house_use_room_nights,
    i.out_of_order_room_nights,
    ROUND(100 * SAFE_DIVIDE(i.occupied_room_nights, i.available_room_nights), 2) AS occupancy_rate_percent,
    ROUND(SAFE_DIVIDE(COALESCE(r.room_revenue_local, 0), i.sold_room_nights), 2) AS average_daily_rate_local,
    ROUND(SAFE_DIVIDE(COALESCE(r.room_revenue_local, 0), i.available_room_nights), 2) AS room_revenue_per_available_room_local,
    COALESCE(r.revenue_transaction_count, 0) AS revenue_transaction_count,
    COALESCE(r.source_system_count, 0) AS source_system_count,
    GREATEST(i.inventory_loaded_at, COALESCE(r.revenue_loaded_at, i.inventory_loaded_at)) AS data_as_of_timestamp
  FROM inventory AS i
  CROSS JOIN parameters AS p
  JOIN `your-project.hospitality.property_master` AS d
    ON d.property_id = i.property_id
   AND d.is_current = TRUE
  LEFT JOIN revenue AS r
    ON r.property_id = i.property_id
  ORDER BY i.property_id;

AEP Query Service SQL: |
  -- ==========================================
  -- 2. ADOBE AEP QUERY SERVICE SQL
  -- ==========================================
  WITH
  parameters AS (
    SELECT
      CAST('${start_date}' AS DATE) AS start_date,
      CAST('${end_date}' AS DATE) AS end_date,
      CAST('${reporting_currency}' AS VARCHAR) AS reporting_currency
  ),
  inventory AS (
    SELECT
      i.property_id,
      MAX(i.total_room_count) AS current_room_inventory,
      SUM(GREATEST(COALESCE(i.available_room_count, 0), 0)) AS available_room_nights,
      SUM(GREATEST(COALESCE(i.occupied_room_count, 0), 0)) AS occupied_room_nights,
      SUM(GREATEST(COALESCE(i.sold_room_count, 0), 0)) AS sold_room_nights,
      SUM(GREATEST(COALESCE(i.complimentary_room_count, 0), 0)) AS complimentary_room_nights,
      SUM(GREATEST(COALESCE(i.house_use_room_count, 0), 0)) AS house_use_room_nights,
      SUM(GREATEST(COALESCE(i.out_of_order_room_count, 0), 0)) AS out_of_order_room_nights,
      MAX(i.loaded_at) AS inventory_loaded_at
    FROM hospitality_property_inventory_daily AS i
    CROSS JOIN parameters AS p
    WHERE i.business_date BETWEEN p.start_date AND p.end_date
    GROUP BY i.property_id
  ),
  revenue_base AS (
    SELECT
      r.property_id,
      r.transaction_id,
      r.business_date,
      r.revenue_department_code,
      r.source_system,
      r.currency_code,
      COALESCE(r.gross_revenue_amount_local, 0) AS gross_revenue_amount_local,
      COALESCE(r.discount_amount_local, 0) AS discount_amount_local,
      COALESCE(r.refund_amount_local, 0) AS refund_amount_local,
      COALESCE(r.tax_amount_local, 0) AS tax_amount_local,
      COALESCE(r.gratuity_amount_local, 0) AS gratuity_amount_local,
      COALESCE(r.net_revenue_amount_local, 0) AS net_revenue_amount_local,
      CASE
        WHEN r.currency_code = p.reporting_currency THEN CAST(1 AS DECIMAL(20, 8))
        ELSE fx.conversion_rate
      END AS reporting_conversion_rate,
      r.loaded_at
    FROM hospitality_revenue_subledger_transactions AS r
    CROSS JOIN parameters AS p
    LEFT JOIN finance_daily_fx_rates AS fx
      ON fx.rate_date = r.business_date
     AND fx.from_currency_code = r.currency_code
     AND fx.to_currency_code = p.reporting_currency
    WHERE r.business_date BETWEEN p.start_date AND p.end_date
      AND r.transaction_status = 'POSTED'
      AND COALESCE(r.is_void, FALSE) = FALSE
      AND COALESCE(r.is_internal_transfer, FALSE) = FALSE
  ),
  revenue AS (
    SELECT
      property_id,
      SUM(gross_revenue_amount_local) AS gross_revenue_local,
      SUM(discount_amount_local) AS discount_amount_local,
      SUM(refund_amount_local) AS refund_amount_local,
      SUM(tax_amount_local) AS tax_amount_local,
      SUM(gratuity_amount_local) AS gratuity_amount_local,
      SUM(CASE WHEN revenue_department_code = 'ROOMS' THEN net_revenue_amount_local ELSE 0 END) AS room_revenue_local,
      SUM(CASE WHEN revenue_department_code = 'FOOD_BEVERAGE' THEN net_revenue_amount_local ELSE 0 END) AS food_beverage_revenue_local,
      SUM(CASE WHEN revenue_department_code = 'SPA' THEN net_revenue_amount_local ELSE 0 END) AS spa_revenue_local,
      SUM(CASE WHEN revenue_department_code = 'GOLF' THEN net_revenue_amount_local ELSE 0 END) AS golf_revenue_local,
      SUM(CASE WHEN revenue_department_code = 'PARKING' THEN net_revenue_amount_local ELSE 0 END) AS parking_revenue_local,
      SUM(CASE WHEN revenue_department_code = 'RESORT_FEE' THEN net_revenue_amount_local ELSE 0 END) AS resort_fee_revenue_local,
      SUM(
        CASE
          WHEN COALESCE(revenue_department_code, 'OTHER') NOT IN
            ('ROOMS', 'FOOD_BEVERAGE', 'SPA', 'GOLF', 'PARKING', 'RESORT_FEE')
          THEN net_revenue_amount_local
          ELSE 0
        END
      ) AS other_revenue_local,
      SUM(net_revenue_amount_local) AS total_revenue_local,
      CASE
        WHEN SUM(CASE WHEN reporting_conversion_rate IS NULL THEN 1 ELSE 0 END) > 0 THEN NULL
        ELSE SUM(net_revenue_amount_local * reporting_conversion_rate)
      END AS total_revenue_reporting,
      COUNT(DISTINCT transaction_id) AS revenue_transaction_count,
      COUNT(DISTINCT source_system) AS source_system_count,
      MAX(loaded_at) AS revenue_loaded_at
    FROM revenue_base
    GROUP BY property_id
  )
  SELECT
    p.start_date AS reporting_start_date,
    p.end_date AS reporting_end_date,
    i.property_id,
    d.property_name,
    d.brand_name,
    d.management_company,
    d.ownership_type,
    d.property_type,
    d.service_level,
    d.chain_scale,
    d.market_name,
    d.submarket_name,
    d.city,
    d.state_province,
    d.country_code,
    d.geographic_region,
    d.currency_code AS property_currency_code,
    d.time_zone,
    d.opening_date,
    i.current_room_inventory,
    i.available_room_nights,
    COALESCE(r.gross_revenue_local, 0) AS gross_revenue_local,
    COALESCE(r.discount_amount_local, 0) AS discount_amount_local,
    COALESCE(r.refund_amount_local, 0) AS refund_amount_local,
    COALESCE(r.tax_amount_local, 0) AS tax_amount_local,
    COALESCE(r.gratuity_amount_local, 0) AS gratuity_amount_local,
    COALESCE(r.room_revenue_local, 0) AS room_revenue_local,
    COALESCE(r.food_beverage_revenue_local, 0) AS food_beverage_revenue_local,
    COALESCE(r.spa_revenue_local, 0) AS spa_revenue_local,
    COALESCE(r.golf_revenue_local, 0) AS golf_revenue_local,
    COALESCE(r.parking_revenue_local, 0) AS parking_revenue_local,
    COALESCE(r.resort_fee_revenue_local, 0) AS resort_fee_revenue_local,
    COALESCE(r.other_revenue_local, 0) AS other_revenue_local,
    COALESCE(r.total_revenue_local, 0) AS total_revenue_local,
    r.total_revenue_reporting,
    p.reporting_currency,
    ROUND(
      CAST(COALESCE(r.total_revenue_local, 0) AS DECIMAL(38, 8)) /
      NULLIF(CAST(i.available_room_nights AS DECIMAL(38, 8)), 0),
      2
    ) AS total_revenue_per_available_room_local,
    ROUND(
      CAST(r.total_revenue_reporting AS DECIMAL(38, 8)) /
      NULLIF(CAST(i.available_room_nights AS DECIMAL(38, 8)), 0),
      2
    ) AS total_revenue_per_available_room_reporting,
    i.occupied_room_nights,
    i.sold_room_nights,
    i.complimentary_room_nights,
    i.house_use_room_nights,
    i.out_of_order_room_nights,
    ROUND(
      100 * CAST(i.occupied_room_nights AS DECIMAL(38, 8)) /
      NULLIF(CAST(i.available_room_nights AS DECIMAL(38, 8)), 0),
      2
    ) AS occupancy_rate_percent,
    ROUND(
      CAST(COALESCE(r.room_revenue_local, 0) AS DECIMAL(38, 8)) /
      NULLIF(CAST(i.sold_room_nights AS DECIMAL(38, 8)), 0),
      2
    ) AS average_daily_rate_local,
    ROUND(
      CAST(COALESCE(r.room_revenue_local, 0) AS DECIMAL(38, 8)) /
      NULLIF(CAST(i.available_room_nights AS DECIMAL(38, 8)), 0),
      2
    ) AS room_revenue_per_available_room_local,
    COALESCE(r.revenue_transaction_count, 0) AS revenue_transaction_count,
    COALESCE(r.source_system_count, 0) AS source_system_count,
    GREATEST(i.inventory_loaded_at, COALESCE(r.revenue_loaded_at, i.inventory_loaded_at)) AS data_as_of_timestamp
  FROM inventory AS i
  CROSS JOIN parameters AS p
  JOIN hospitality_property_master AS d
    ON d.property_id = i.property_id
   AND d.is_current = TRUE
  LEFT JOIN revenue AS r
    ON r.property_id = i.property_id
  ORDER BY i.property_id;

Calculation Notes: |
  1️⃣ Calculate KPI as a ratio of period-level sums.  
  2️⃣ Assign revenue to the accounting date recognized, following chart-of-accounts mapping.  
  3️⃣ Exclude advance deposits and gift-card sales until redeemed.  
  4️⃣ Allocate package revenue among rooms and ancillary departments per accounting rules.  
  5️⃣ Include complimentary and house-use rooms in available room nights if usable.  
  6️⃣ Exclude out-of-order rooms only with approved, time-bounded inventory status.  
  7️⃣ Apply consistent revenue scope, inventory treatment, currency basis, and same-store rules for comparisons.

Business Use Case: |
  A Revenue Management executive compares actual TRevPAR with budget, prior year, and competitive benchmarks by property and market. If room RevPAR is on target but TRevPAR is below target, the team investigates outlet availability, package attachment, resort-fee capture, and guest ancillary spend, then adjusts packages, cross-selling offers, outlet hours, or local promotions rather than reducing room rates.


Source Data: Property Management System, Point of Sale systems, spa/golf/parking and other ancillary systems, Central Reservation System, revenue subledgers, ERP/General Ledger, property inventory master, and Revenue Management System


KPI Name: Purchase Conversion Rate
Formula: (COUNT DISTINCT eligible sessions with ≥ 1 purchase event carrying a unique transaction_id / COUNT DISTINCT eligible sessions) × 100, where eligible = non-bot, non-internal, non-test, analytics-consented sessions in the reporting period

Description: |
  Purchase Conversion Rate is the share of eligible website and app sessions that contain at least one completed purchase, after bot, internal and test traffic has been removed from both sides of the ratio. It is the headline measure of how effectively acquired traffic, merchandising, pricing and checkout turn visits into orders, and the baseline against which channel, device, release and experiment performance is judged.

Category: Conversion

Tags: [kpi, E-commerce: Cart & Checkout Funnel Analytics, conversion, purchase, sessions]

Industry: [["E-commerce"]]

Priority: High

Core Area: Checkout

Scope: Session

Measure Type: Percentage

Aggregation Window: Session, Time based - Hourly/Daily/Monthly/Yearly, Daily, Weekly, Monthly


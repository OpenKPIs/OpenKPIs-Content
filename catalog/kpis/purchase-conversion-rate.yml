Google Analytics SQL: |
  -- ==========================================
  -- 1. GOOGLE BIGQUERY SQL
  -- ==========================================
  -- Purchase Conversion Rate (session scope) = eligible sessions with >= 1 deduplicated purchase / all eligible sessions x 100.
  -- Reporting window 2026-08-01 to 2026-08-31 (property time zone). Daily tables are scanned one day either side so sessions crossing midnight are complete and attributed in full to their start date.
  -- Known bots and spiders are removed by GA4 automatic bot filtering before export; every other exclusion is applied per session to numerator and denominator alike.
  -- Test orders use the reserved transaction_id prefix TEST; align it with the order-management convention.
  WITH raw_events AS (
    SELECT
      e.user_pseudo_id,
      e.event_date,
      e.event_timestamp,
      e.event_name,
      e.platform,
      e.ecommerce.transaction_id AS transaction_id,
      LOWER(e.device.web_info.hostname) AS hostname,
      e.privacy_info.analytics_storage AS analytics_storage,
      (
        SELECT AS STRUCT
          MAX(IF(ep.key = 'ga_session_id', ep.value.int_value, NULL)) AS ga_session_id,
          MAX(IF(ep.key = 'traffic_type', ep.value.string_value, NULL)) AS traffic_type,
          MAX(IF(ep.key = 'debug_mode', COALESCE(CAST(ep.value.int_value AS STRING), ep.value.string_value), NULL)) AS debug_mode
        FROM UNNEST(e.event_params) AS ep
      ) AS params
    FROM `your-project.analytics_123456789.events_*` AS e
    WHERE _TABLE_SUFFIX BETWEEN '20260731' AND '20260901'
  ),
  session_events AS (
    SELECT
      CONCAT(user_pseudo_id, '.', CAST(params.ga_session_id AS STRING)) AS session_key,
      event_date,
      event_timestamp,
      event_name,
      platform,
      transaction_id,
      hostname,
      analytics_storage,
      params.traffic_type AS traffic_type,
      params.debug_mode AS debug_mode
    FROM raw_events
    WHERE user_pseudo_id IS NOT NULL
      AND params.ga_session_id IS NOT NULL
  ),
  first_purchases AS (
    SELECT
      transaction_id,
      session_key
    FROM session_events
    WHERE event_name = 'purchase'
      AND transaction_id IS NOT NULL
      AND transaction_id NOT IN ('', '(not set)')
    QUALIFY ROW_NUMBER() OVER (PARTITION BY transaction_id ORDER BY event_timestamp) = 1
  ),
  sessions AS (
    SELECT
      session_key,
      PARSE_DATE('%Y%m%d', MIN(event_date)) AS session_date,
      CASE MAX(platform)
        WHEN 'WEB' THEN 'Web'
        WHEN 'IOS' THEN 'iOS app'
        WHEN 'ANDROID' THEN 'Android app'
        ELSE 'Other'
      END AS stream_platform,
      LOGICAL_OR(IFNULL(analytics_storage = 'No', FALSE)) AS is_consent_denied,
      LOGICAL_OR(IFNULL(traffic_type = 'internal', FALSE)) AS is_internal,
      LOGICAL_OR(IFNULL(debug_mode IN ('1', 'true'), FALSE)) AS is_debug,
      LOGICAL_OR(IFNULL(REGEXP_CONTAINS(hostname, r'(^|[.])(staging|stage|dev|qa|uat|preview)[.-]|localhost'), FALSE)) AS is_staging,
      LOGICAL_OR(IFNULL(UPPER(transaction_id) LIKE 'TEST%', FALSE)) AS is_test_order
    FROM session_events
    GROUP BY session_key
  ),
  eligible_sessions AS (
    SELECT
      s.session_date,
      s.stream_platform,
      s.session_key,
      fp.session_key IS NOT NULL AS has_purchase
    FROM sessions AS s
    LEFT JOIN (SELECT DISTINCT session_key FROM first_purchases) AS fp
      ON fp.session_key = s.session_key
    WHERE s.session_date BETWEEN DATE '2026-08-01' AND DATE '2026-08-31'
      AND NOT s.is_consent_denied
      AND NOT s.is_internal
      AND NOT s.is_debug
      AND NOT s.is_staging
      AND NOT s.is_test_order
  )
  SELECT
    session_date,
    IF(GROUPING(stream_platform) = 1, 'All platforms', stream_platform) AS platform,
    COUNT(DISTINCT session_key) AS sessions,
    COUNT(DISTINCT IF(has_purchase, session_key, NULL)) AS sessions_with_purchase,
    ROUND(SAFE_DIVIDE(COUNT(DISTINCT IF(has_purchase, session_key, NULL)), COUNT(DISTINCT session_key)) * 100, 2) AS purchase_conversion_rate
  FROM eligible_sessions
  GROUP BY GROUPING SETS ((session_date, stream_platform), (session_date))
  ORDER BY session_date, platform;

AEP Query Service SQL: |
  -- ==========================================
  -- 2. ADOBE AEP QUERY SERVICE SQL
  -- ==========================================
  -- Purchase Conversion Rate (session scope) = eligible sessions with >= 1 deduplicated purchase / all eligible sessions x 100.
  -- Reporting window 2026-08-01 to 2026-08-31 in the reporting time zone (America/New_York below; replace with the report suite zone). Events are read one day either side so sessions crossing midnight are complete and attributed to their start date.
  -- Sessions are rebuilt across ALL experience events per ECID with a 30-minute inactivity timeout.
  -- _tenant.trafficType (internal flag set by collection rules) and _tenant.analyticsConsent (CMP analytics purpose, y / n) are tenant field-group paths to be adapted; map them to the schema paths in use.
  -- Test orders use the reserved purchaseID prefix TEST; align it with the order-management convention.
  WITH base AS (
    SELECT
      timestamp,
      eventType,
      COALESCE(identityMap['ECID'][0].id, endUserIDs._experience.ecid.id) AS ecid,
      commerce.order.purchaseID AS purchase_id,
      lower(web.webPageDetails.URL) AS page_url,
      lower(environment.browserDetails.userAgent) AS user_agent,
      CASE
        WHEN environment.type = 'application' AND lower(environment.operatingSystem) LIKE '%ios%' THEN 'iOS app'
        WHEN environment.type = 'application' AND lower(environment.operatingSystem) LIKE '%android%' THEN 'Android app'
        WHEN environment.type = 'application' THEN 'Other app'
        ELSE 'Web'
      END AS stream_platform,
      _tenant.trafficType AS traffic_type,
      lower(_tenant.analyticsConsent) AS analytics_consent
    FROM your_aep_web_events_dataset
    WHERE timestamp >= to_timestamp('2026-07-31 00:00:00')
      AND timestamp < to_timestamp('2026-09-02 00:00:00')
  ),
  sessionized AS (
    SELECT
      base.*,
      SESS_TIMEOUT(timestamp, 60 * 30) OVER (PARTITION BY ecid ORDER BY timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) AS session
    FROM base
    WHERE ecid IS NOT NULL
  ),
  session_events AS (
    SELECT
      concat(ecid, '-', CAST(session.num AS STRING)) AS session_key,
      timestamp,
      eventType,
      purchase_id,
      page_url,
      user_agent,
      stream_platform,
      traffic_type,
      analytics_consent
    FROM sessionized
  ),
  first_purchases AS (
    SELECT session_key
    FROM (
      SELECT
        session_key,
        ROW_NUMBER() OVER (PARTITION BY purchase_id ORDER BY timestamp) AS purchase_rank
      FROM session_events
      WHERE eventType = 'commerce.purchases'
        AND purchase_id IS NOT NULL
        AND purchase_id <> ''
    ) ranked_purchases
    WHERE purchase_rank = 1
    GROUP BY session_key
  ),
  sessions AS (
    SELECT
      session_key,
      to_date(from_utc_timestamp(MIN(timestamp), 'America/New_York')) AS session_date,
      MAX(stream_platform) AS stream_platform,
      MAX(CASE WHEN analytics_consent = 'n' THEN 1 ELSE 0 END) AS is_consent_denied,
      MAX(CASE WHEN traffic_type = 'internal' THEN 1 ELSE 0 END) AS is_internal,
      MAX(CASE WHEN user_agent RLIKE 'bot|spider|crawl|slurp|headless|phantomjs|lighthouse|pingdom' THEN 1 ELSE 0 END) AS is_bot,
      MAX(CASE WHEN page_url RLIKE '^https?://([^/]*[.])?(staging|stage|dev|qa|uat|preview)[.-]|^https?://localhost' THEN 1 ELSE 0 END) AS is_staging,
      MAX(CASE WHEN upper(purchase_id) LIKE 'TEST%' THEN 1 ELSE 0 END) AS is_test_order
    FROM session_events
    GROUP BY session_key
  ),
  eligible_sessions AS (
    SELECT
      s.session_date,
      s.stream_platform,
      s.session_key,
      CASE WHEN fp.session_key IS NOT NULL THEN 1 ELSE 0 END AS has_purchase
    FROM sessions s
    LEFT JOIN first_purchases fp
      ON fp.session_key = s.session_key
    WHERE s.session_date BETWEEN to_date('2026-08-01') AND to_date('2026-08-31')
      AND s.is_consent_denied = 0
      AND s.is_internal = 0
      AND s.is_bot = 0
      AND s.is_staging = 0
      AND s.is_test_order = 0
  )
  SELECT
    session_date,
    stream_platform AS platform,
    COUNT(DISTINCT session_key) AS sessions,
    SUM(has_purchase) AS sessions_with_purchase,
    ROUND(CAST(SUM(has_purchase) AS DOUBLE) / NULLIF(COUNT(DISTINCT session_key), 0) * 100, 2) AS purchase_conversion_rate
  FROM eligible_sessions
  GROUP BY session_date, stream_platform
  UNION ALL
  SELECT
    session_date,
    'All platforms' AS platform,
    COUNT(DISTINCT session_key) AS sessions,
    SUM(has_purchase) AS sessions_with_purchase,
    ROUND(CAST(SUM(has_purchase) AS DOUBLE) / NULLIF(COUNT(DISTINCT session_key), 0) * 100, 2) AS purchase_conversion_rate
  FROM eligible_sessions
  GROUP BY session_date
  ORDER BY session_date, platform;

Calculation Notes: |
  1️⃣ Numerator = distinct session keys (GA4: user_pseudo_id + ga_session_id; AEP: ECID (identityMap / endUserIDs) + rebuilt session number) holding at least one purchase event with a non-null transaction_id. Purchase hits are deduplicated on transaction_id before the session flag is set, so confirmation-page reloads and a session with three separate orders both count as one converting session. The Adobe Orders ÷ Visits construct counts orders, can exceed 100% in theory, and is published separately as order-conversion-rate-visit; the two are never blended on one dashboard tile.
  2️⃣ Denominator = every eligible session in the period, including bounced, non-engaged and single-page sessions. It is never restricted to engaged sessions, product viewers or cart creators, because those populations belong to the funnel-step rates (Add-to-Cart Rate, Cart-to-Purchase Rate, Checkout Conversion Rate).
  3️⃣ Exclusions apply identically to numerator and denominator: IAB/ABC known bots and spiders (GA4 automatic bot filtering, Adobe bot rules), internal traffic (corporate IP ranges or traffic_type = internal), GA4 debug-mode traffic (debug_mode = 1), staging and preview hostnames, and QA orders flagged by test payment gateway, test SKU or reserved transaction_id prefix. Genuine orders later cancelled, refunded or declined post-authorisation stay in the numerator; post-order loss is reported through Order Cancellation Rate and Refund Rate.
  4️⃣ Sessions close after 30 minutes of inactivity on both platforms (GA4 default; AEP sessions rebuilt with a 30-minute timeout). No maximum session length is applied, so the Adobe Analytics 12-hour / 2,500-hit visit cap is not reproduced. Sessions are not split at midnight or on a campaign change, so a session that starts at 23:50 and purchases at 00:15 is attributed in full to the start date in the reporting property's time zone. App sessions follow the SDK's 30-minute background timeout.
  5️⃣ Consent: the observed rate uses only sessions where analytics_storage (or the equivalent CMP analytics purpose) is granted, on both sides of the ratio. GA4 consent-mode behavioural modelling output is reported as a separate modelled figure and never mixed into the observed series. Order-management orders with no matching consented session are not back-filled into the numerator.
  6️⃣ Web + app: report by platform (Web, iOS app, Android app) and as a combined figure calculated as SUM(converting sessions) ÷ SUM(eligible sessions) across all streams; platform rates are never averaged. Cross-device journeys are not stitched at this scope: a cart built in the app and paid for on the web counts as a converting web session and a non-converting app session.
  7️⃣ Timing and reconciliation: daily values are provisional until the 72-hour late-hit window closes, and week-over-week comparisons use complete weeks only. The digital purchase count (distinct transaction_id) is reconciled weekly against order-management web and app channel orders; a variance above 5% triggers a tag and checkout-instrumentation audit rather than a restatement of the numerator.

Business Use Case: |
  1️⃣ The E-commerce Conversion Rate Optimization team, when an A/B test on the product detail page, cart or checkout reaches its pre-registered sample size, compares Purchase Conversion Rate by variant at session scope and ships the variant only if the lift is statistically significant and Average Order Value has not fallen.
  2️⃣ The Performance Marketing team, when a paid channel's weekly rate falls more than 15% below its trailing four-week baseline while its sessions hold steady, audits landing-page mapping and audience targeting for that channel and moves budget to campaigns converting at or above the site baseline.
  3️⃣ The Digital Commerce Operations manager, when the daily rate for any device category drops more than 20% against the same weekday of the prior week within 24 hours of a site release, opens a priority incident with the web engineering team and requests a rollback of the release until checkout is verified.
  4️⃣ The Merchandising team, during a promotional event, compares the rate by landing page against the pre-event baseline and reallocates homepage and category-page promotional placements from under-converting landing pages to those converting above baseline.


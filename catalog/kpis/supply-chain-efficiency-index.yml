# Last modified by: devyendarm

KPI Name: Supply Chain Efficiency Index
Formula: (Total Output Value / Total Input Cost) × 100

Description: |
  Measures the effectiveness of the supply chain in converting inputs into outputs with minimal waste and delays. It evaluates the balance between supply chain costs and service levels.

Category: Efficiency

Tags: [kpi]

Industry: [Logistics & Supply Chain]

Priority: High

Core Area: Generic

Scope: Global

Measure Type: index

Aggregation Window: Time based - Monthly







Google Analytics SQL: |
  -- ==========================================
  -- 1. GOOGLE BIGQUERY SQL
  -- ==========================================
  SELECT 
      warehouse_id,
      SUM(CASE WHEN status = 'delivered' THEN 1 ELSE 0 END) / COUNT(*) AS efficiency_index
  FROM 
      `your-project.erp.warehouse_logs`
  WHERE 
      event_date BETWEEN '2023-01-01' AND '2023-12-31'
  GROUP BY 
      warehouse_id

AEP Query Service SQL: |
  -- ==========================================
  -- 2. ADOBE AEP QUERY SERVICE SQL
  -- ==========================================
  SELECT 
      warehouse_id,
      SUM(CASE WHEN status = 'delivered' THEN 1 ELSE 0 END) / COUNT(*) AS efficiency_index
  FROM 
      aep_backend_dataset.warehouse_logs
  WHERE 
      event_date BETWEEN '2023-01-01' AND '2023-12-31'
  GROUP BY 
      warehouse_id

Calculation Notes: |
  Exclude returns and defective items from total output value. Consider only direct supply chain costs in total input cost.

Business Use Case: |
  Executives use this index to identify inefficiencies in the supply chain and make strategic decisions to optimize operations and reduce costs.


Source Data: ERP


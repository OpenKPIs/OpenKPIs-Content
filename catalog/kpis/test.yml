KPI Name: test
Formula: (Number of Successful Actions / Total Actions Initiated) × 100

Description: |
  This KPI measures the rate at which users complete a specific action or series of actions during a session, indicating the effectiveness of the process.

Category: Conversion


Industry: [Retail]

Priority: High

Core Area: Generic

Scope: Session

Measure Type: rate

Aggregation Window: Time based - Daily

GA4 Event: |
  conversion

Adobe Event: |
  conversion

W3 Data Layer: |
  {"event":{"category":{"primaryCategory":"engagement"},"eventInfo":{"type":"action","eventName":"conversion"}}}

GA4 Data Layer: |
  {"event":"conversion","eventParams":{"category":"engagement"}}

Adobe Client Data Layer: |
  {"event":"conversion","eventInfo":{"category":"engagement"}}

XDM Mapping: |
  {"_experience":{"analytics":{"eventType":"conversion"}}}

Google Analytics SQL: |
  -- ==========================================
  -- 1. GOOGLE BIGQUERY SQL
  -- ==========================================
  SELECT COUNT(*) AS conversion_count
  FROM `your-project.analytics_123456789.events_*`
  WHERE event_name = 'conversion'
  AND EXISTS (
    SELECT 1
    FROM UNNEST(event_params) AS params
    WHERE params.key = 'category' AND params.value.string_value = 'engagement'
  )

AEP Query Service SQL: |
  -- ==========================================
  -- 2. ADOBE AEP QUERY SERVICE SQL
  -- ==========================================
  SELECT COUNT(*) AS conversion_count
  FROM aep_backend_dataset
  WHERE event = 'conversion'
  AND eventInfo.category = 'engagement'

Calculation Notes: |
  Exclude sessions with less than two actions to avoid skewed data. Consider session timeout of 30 minutes.

Business Use Case: |
  Executives use this KPI to identify bottlenecks in the user journey and optimize the conversion funnel.


Source Data: Digital Analytics


KPI Name: Zero-Results Search Rate
Formula: (Searches where search_results_count = 0 / Submitted searches with a recorded search_results_count, deduplicated and excluding keyword redirects, zero-result searches included) × 100

Description: |
  Zero-Results Search Rate is the share of submitted on-site searches whose results page returns no products: searches with a search results count of zero divided by all submitted searches with a recorded results count in the period (deduplicated, keyword redirects excluded). It shows gaps in catalog coverage, synonym and spelling handling, and index freshness, and it is an early warning of lost search-driven revenue because shoppers who get no results rarely go on to add to cart.


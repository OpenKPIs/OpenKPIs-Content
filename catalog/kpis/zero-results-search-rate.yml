# KPI: Zero-Results Search Rate
# Generated: 2026-09-16T17:37:01.063Z
# Contributed by: devyendarm


KPI Name: Zero-Results Search Rate
Formula: (Searches where search_results_count = 0 / Total Searches, zero-result searches included) × 100

Description: |
  Zero-Results Search Rate is the share of submitted on-site searches whose results page returns no products: searches with a search results count of zero divided by all searches in the period. It shows gaps in catalog coverage, synonym and spelling handling, and index freshness, and it is an early warning of lost search-driven revenue because shoppers who get no results rarely go on to add to cart.

Category: Experience


























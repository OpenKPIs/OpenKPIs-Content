KPI Name: Multi-Item Cart Rate

Formula: (Carts with two or more distinct products added / Carts with at least one product added) × 100

Description: |
  Percentage of carts with successful additions that receive two or more distinct products during the reporting period. It helps assess cross-sell and cart-building effectiveness.


KPI Name: Viewer Reactivation Rate
Formula: (Unique Eligible Dormant Viewers with at Least One Qualified Viewing Event During the Reporting Period / Unique Eligible Dormant Viewers at the Start of the Reporting Period) × 100

Description: |
  Measures the percentage of eligible dormant viewers who resume qualified viewing during the reporting period. It indicates how effectively the streaming service brings previously engaged viewers back to active consumption.

Category: Retention

Tags: [kpi]

Industry: [Media & Streaming]

Priority: High

Core Area: Engagement

Scope: User

Measure Type: rate

Aggregation Window: Time based - Monthly


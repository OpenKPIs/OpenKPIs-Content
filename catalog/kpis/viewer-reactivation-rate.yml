Calculation Notes: |
  Count distinct resolved viewer profiles, not sessions, devices, accounts, or playback events. Establish the denominator as a point-in-time cohort at the start of the reporting period; viewers who become dormant during the period enter a later period's eligible cohort. A qualified viewing event requires at least 120 seconds of valid content playback, or at least 50% completion when the content duration is under 120 seconds. Count each viewer once in the numerator on the date of the first qualified viewing event in the period, regardless of subsequent sessions. Late playback events must be restated within the approved seven-day correction window. Rates must not be summed across periods or segments; recompute them from deduplicated numerator and denominator populations.

Business Use Case: |
  The Retention team compares reactivation rates by dormancy age, market, previous subscription plan, prior content preference, and win-back campaign exposure. If viewers dormant for 31–60 days respond strongly to new-season notifications while viewers dormant for 91–180 days do not, the team can shift campaign budget toward the higher-response cohort, change creative or offers for long-dormant viewers, and monitor whether reactivated viewers sustain viewing after return.



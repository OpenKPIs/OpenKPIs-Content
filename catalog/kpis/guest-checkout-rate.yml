KPI Name: Guest Checkout Rate
Formula: (Guest Orders / Total Orders) × 100

Description: |
  Guest Checkout Rate is the share of completed orders placed without the shopper signing in to or creating an account, measured at order grain on the purchase transaction. It quantifies how much of realised demand the business converts anonymously, framing the trade-off between frictionless checkout and the customer identity, consent and lifecycle data an account unlocks.

Category: Conversion


























# KPI: Ship-to-Store Rate
# Generated: 2026-09-21T17:14:16.959Z
# Contributed by: devyendarm
# Last modified by: devyendarm

KPI Name: Ship-to-Store Rate
Formula: Ship-to-Store Rate (%) = (COUNT(DISTINCT transaction_id where at least one order line has fulfillment_method = 'ship_to_store', i.e. store pickup sourced from a node other than the pickup store) / COUNT(DISTINCT transaction_id of all orders placed in the period across every fulfilment method)) × 100

Description: |
  Ship-to-Store Rate is the percentage of all orders placed in a period for which the customer chose store pickup and the merchandise was sourced from a distribution centre, fulfilment centre or another store and transferred to the pickup store. It differs from BOPIS, which picks from the pickup store's own on-hand stock, and tells omnichannel, supply chain and store operations leaders how much online demand relies on the store network as a free last-mile node instead of home delivery or local inventory.

Category: Operations

Tags: [kpi, Retail: Omnichannel (BOPIS - Buy Online Pick Up In Store)]


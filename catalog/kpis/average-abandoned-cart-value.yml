KPI Name: Average Abandoned Cart Value
Formula: Total Net Value of Abandoned Carts / Number of Abandoned Carts

Description: |
  Mean net merchandise value of carts that received an add_to_cart but no purchase within 7 days. Sizes the revenue left in abandoned carts and sets recovery-offer thresholds.

Category: Monetization

Tags: [kpi, E-commerce: Cart & Checkout Funnel Analytics]

Industry: [["E-commerce"]]

Priority: High

Core Area: Checkout

Scope: Global

Measure Type: Currency

Aggregation Window: Daily, Weekly, Monthly


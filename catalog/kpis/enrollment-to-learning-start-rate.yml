KPI Name: Enrollment-to-Learning Start Rate
Formula: (Eligible Enrollment Records with a Qualifying Learning Start within 7 Days / Total Eligible Enrollment Records) × 100

Description: |
  Measures the percentage of eligible course enrollments that generate a qualifying learning activity start within seven days of enrollment. It quantifies how effectively enrolled learners move from receiving course access to beginning the enrolled learning experience.

Category: Conversion

Tags: [kpi]

Industry: [EdTech & E-Learning]

Priority: High

Core Area: Onboarding

Scope: Item

Measure Type: rate

Aggregation Window: Time based - Daily


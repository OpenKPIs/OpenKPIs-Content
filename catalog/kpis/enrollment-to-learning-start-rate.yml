Google Analytics SQL: |
  -- ==========================================
  -- 1. GOOGLE BIGQUERY SQL
  -- ==========================================
  WITH eligible_enrollments AS (
    SELECT
      enrollment_id,
      organization_id,
      learner_id,
      enrollment_timestamp,
      enrollment_status,
      enrollment_type,
      eligibility_status,
      eligibility_reason,
      access_granted_timestamp,
      course_id,
      course_name,
      course_category,
      course_level,
      course_version,
      course_delivery_mode,
      course_provider,
      cohort_id,
      curriculum_id,
      COALESCE(qualifying_window_days, 7) AS qualifying_window_days
    FROM `your-project.learning.enrollments`
    WHERE enrollment_timestamp >= TIMESTAMP_SUB(CURRENT_TIMESTAMP(), INTERVAL 365 DAY)
      AND enrollment_timestamp < CURRENT_TIMESTAMP()
      AND eligibility_status = 'eligible'
      AND access_granted_timestamp IS NOT NULL
      AND COALESCE(enrollment_status, 'active') NOT IN ('cancelled', 'deleted', 'invalid')
    QUALIFY ROW_NUMBER() OVER (
      PARTITION BY enrollment_id
      ORDER BY updated_timestamp DESC, enrollment_timestamp DESC
    ) = 1
  ),
  telemetry_events AS (
    SELECT
      event_name,
      COALESCE(
        (SELECT ep.value.string_value FROM UNNEST(event_params) ep WHERE ep.key = 'event_id'),
        CONCAT(CAST(event_timestamp AS STRING), '-', user_pseudo_id, '-', event_name)
      ) AS event_id,
      COALESCE(
        SAFE_CAST((SELECT ep.value.string_value FROM UNNEST(event_params) ep WHERE ep.key = 'event_timestamp') AS TIMESTAMP),
        TIMESTAMP_MICROS(event_timestamp)
      ) AS event_timestamp,
      (SELECT ep.value.string_value FROM UNNEST(event_params) ep WHERE ep.key = 'source_system') AS source_system,
      (SELECT ep.value.string_value FROM UNNEST(event_params) ep WHERE ep.key = 'environment') AS environment,
      (SELECT ep.value.string_value FROM UNNEST(event_params) ep WHERE ep.key = 'platform') AS platform,
      (SELECT ep.value.string_value FROM UNNEST(event_params) ep WHERE ep.key = 'page_location') AS page_location,
      (SELECT ep.value.string_value FROM UNNEST(event_params) ep WHERE ep.key = 'page_referrer') AS page_referrer,
      (SELECT ep.value.string_value FROM UNNEST(event_params) ep WHERE ep.key = 'page_title') AS page_title,
      (SELECT ep.value.string_value FROM UNNEST(event_params) ep WHERE ep.key = 'language') AS language,
      (SELECT ep.value.string_value FROM UNNEST(event_params) ep WHERE ep.key = 'user_id') AS user_id,
      COALESCE(
        (SELECT ep.value.string_value FROM UNNEST(event_params) ep WHERE ep.key = 'anonymous_id'),
        user_pseudo_id
      ) AS anonymous_id,
      COALESCE(
        (SELECT ep.value.int_value FROM UNNEST(event_params) ep WHERE ep.key = 'ga_session_id'),
        SAFE_CAST((SELECT ep.value.string_value FROM UNNEST(event_params) ep WHERE ep.key = 'ga_session_id') AS INT64)
      ) AS ga_session_id,
      (SELECT ep.value.string_value FROM UNNEST(event_params) ep WHERE ep.key = 'analytics_consent') AS analytics_consent,
      (SELECT ep.value.string_value FROM UNNEST(event_params) ep WHERE ep.key = 'organization_id') AS organization_id,
      (SELECT ep.value.string_value FROM UNNEST(event_params) ep WHERE ep.key = 'learner_id') AS learner_id,
      (SELECT ep.value.string_value FROM UNNEST(event_params) ep WHERE ep.key = 'enrollment_id') AS enrollment_id,
      SAFE_CAST((SELECT ep.value.string_value FROM UNNEST(event_params) ep WHERE ep.key = 'enrollment_timestamp') AS TIMESTAMP) AS enrollment_timestamp,
      (SELECT ep.value.string_value FROM UNNEST(event_params) ep WHERE ep.key = 'enrollment_status') AS enrollment_status,
      (SELECT ep.value.string_value FROM UNNEST(event_params) ep WHERE ep.key = 'enrollment_type') AS enrollment_type,
      (SELECT ep.value.string_value FROM UNNEST(event_params) ep WHERE ep.key = 'eligibility_status') AS eligibility_status,
      (SELECT ep.value.string_value FROM UNNEST(event_params) ep WHERE ep.key = 'eligibility_reason') AS eligibility_reason,
      SAFE_CAST((SELECT ep.value.string_value FROM UNNEST(event_params) ep WHERE ep.key = 'access_granted_timestamp') AS TIMESTAMP) AS access_granted_timestamp,
      (SELECT ep.value.string_value FROM UNNEST(event_params) ep WHERE ep.key = 'course_id') AS course_id,
      (SELECT ep.value.string_value FROM UNNEST(event_params) ep WHERE ep.key = 'course_name') AS course_name,
      (SELECT ep.value.string_value FROM UNNEST(event_params) ep WHERE ep.key = 'course_category') AS course_category,
      (SELECT ep.value.string_value FROM UNNEST(event_params) ep WHERE ep.key = 'course_level') AS course_level,
      (SELECT ep.value.string_value FROM UNNEST(event_params) ep WHERE ep.key = 'course_version') AS course_version,
      (SELECT ep.value.string_value FROM UNNEST(event_params) ep WHERE ep.key = 'course_delivery_mode') AS course_delivery_mode,
      (SELECT ep.value.string_value FROM UNNEST(event_params) ep WHERE ep.key = 'course_provider') AS course_provider,
      (SELECT ep.value.string_value FROM UNNEST(event_params) ep WHERE ep.key = 'cohort_id') AS cohort_id,
      (SELECT ep.value.string_value FROM UNNEST(event_params) ep WHERE ep.key = 'curriculum_id') AS curriculum_id,
      (SELECT ep.value.string_value FROM UNNEST(event_params) ep WHERE ep.key = 'learning_activity_id') AS learning_activity_id,
      (SELECT ep.value.string_value FROM UNNEST(event_params) ep WHERE ep.key = 'learning_activity_type') AS learning_activity_type,
      (SELECT ep.value.string_value FROM UNNEST(event_params) ep WHERE ep.key = 'learning_activity_name') AS learning_activity_name,
      COALESCE(
        (SELECT ep.value.int_value FROM UNNEST(event_params) ep WHERE ep.key = 'learning_activity_sequence'),
        SAFE_CAST((SELECT ep.value.string_value FROM UNNEST(event_params) ep WHERE ep.key = 'learning_activity_sequence') AS INT64)
      ) AS learning_activity_sequence,
      COALESCE(
        SAFE_CAST((SELECT ep.value.string_value FROM UNNEST(event_params) ep WHERE ep.key = 'learning_start_timestamp') AS TIMESTAMP),
        TIMESTAMP_MICROS(event_timestamp)
      ) AS learning_start_timestamp,
      COALESCE(
        (SELECT ep.value.double_value FROM UNNEST(event_params) ep WHERE ep.key = 'hours_since_enrollment'),
        CAST((SELECT ep.value.int_value FROM UNNEST(event_params) ep WHERE ep.key = 'hours_since_enrollment') AS FLOAT64),
        SAFE_CAST((SELECT ep.value.string_value FROM UNNEST(event_params) ep WHERE ep.key = 'hours_since_enrollment') AS FLOAT64)
      ) AS hours_since_enrollment,
      COALESCE(
        (SELECT ep.value.int_value FROM UNNEST(event_params) ep WHERE ep.key = 'qualifying_window_days'),
        SAFE_CAST((SELECT ep.value.string_value FROM UNNEST(event_params) ep WHERE ep.key = 'qualifying_window_days') AS INT64)
      ) AS qualifying_window_days,
      COALESCE(
        LOWER((SELECT ep.value.string_value FROM UNNEST(event_params) ep WHERE ep.key = 'within_qualifying_window')) = 'true',
        (SELECT ep.value.int_value FROM UNNEST(event_params) ep WHERE ep.key = 'within_qualifying_window') = 1,
        FALSE
      ) AS within_qualifying_window,
      COALESCE(
        LOWER((SELECT ep.value.string_value FROM UNNEST(event_params) ep WHERE ep.key = 'qualifying_learning_start')) = 'true',
        (SELECT ep.value.int_value FROM UNNEST(event_params) ep WHERE ep.key = 'qualifying_learning_start') = 1,
        FALSE
      ) AS qualifying_learning_start,
      (SELECT ep.value.string_value FROM UNNEST(event_params) ep WHERE ep.key = 'qualification_rule_version') AS qualification_rule_version,
      COALESCE(
        (SELECT ep.value.int_value FROM UNNEST(event_params) ep WHERE ep.key = 'attempt_number'),
        SAFE_CAST((SELECT ep.value.string_value FROM UNNEST(event_params) ep WHERE ep.key = 'attempt_number') AS INT64)
      ) AS attempt_number,
      (SELECT ep.value.string_value FROM UNNEST(event_params) ep WHERE ep.key = 'launch_method') AS launch_method,
      (SELECT ep.value.string_value FROM UNNEST(event_params) ep WHERE ep.key = 'device_category') AS device_category,
      (SELECT ep.value.string_value FROM UNNEST(event_params) ep WHERE ep.key = 'operating_system') AS operating_system,
      (SELECT ep.value.string_value FROM UNNEST(event_params) ep WHERE ep.key = 'browser') AS browser,
      (SELECT ep.value.string_value FROM UNNEST(event_params) ep WHERE ep.key = 'country') AS country,
      (SELECT ep.value.string_value FROM UNNEST(event_params) ep WHERE ep.key = 'region') AS region
    FROM `your-project.analytics_123456789.events_*`
    WHERE _TABLE_SUFFIX BETWEEN FORMAT_DATE('%Y%m%d', DATE_SUB(CURRENT_DATE(), INTERVAL 372 DAY))
                            AND FORMAT_DATE('%Y%m%d', CURRENT_DATE())
      AND event_name = 'tutorial_begin'
  ),
  deduplicated_starts AS (
    SELECT *
    FROM telemetry_events
    WHERE enrollment_id IS NOT NULL
      AND course_id IS NOT NULL
      AND COALESCE(environment, 'production') = 'production'
    QUALIFY ROW_NUMBER() OVER (
      PARTITION BY event_id
      ORDER BY event_timestamp
    ) = 1
  ),
  enrollment_outcomes AS (
    SELECT
      e.*,
      MIN(s.learning_start_timestamp) AS first_qualifying_learning_start_timestamp
    FROM eligible_enrollments e
    LEFT JOIN deduplicated_starts s
      ON s.enrollment_id = e.enrollment_id
     AND s.course_id = e.course_id
     AND s.learning_start_timestamp >= e.enrollment_timestamp
     AND s.learning_start_timestamp < TIMESTAMP_ADD(
           e.enrollment_timestamp,
           INTERVAL e.qualifying_window_days DAY
         )
    WHERE e.enrollment_timestamp <= TIMESTAMP_SUB(
            CURRENT_TIMESTAMP(),
            INTERVAL e.qualifying_window_days DAY
          )
    GROUP BY ALL
  )
  SELECT
    DATE(enrollment_timestamp) AS enrollment_date,
    organization_id,
    course_id,
    course_name,
    course_category,
    course_level,
    course_version,
    course_delivery_mode,
    course_provider,
    cohort_id,
    curriculum_id,
    enrollment_type,
    qualifying_window_days,
    COUNT(*) AS eligible_enrollment_count,
    COUNTIF(first_qualifying_learning_start_timestamp IS NOT NULL) AS qualifying_learning_start_count,
    ROUND(
      100 * SAFE_DIVIDE(
        COUNTIF(first_qualifying_learning_start_timestamp IS NOT NULL),
        COUNT(*)
      ),
      4
    ) AS enrollment_to_learning_start_rate_pct
  FROM enrollment_outcomes
  GROUP BY
    enrollment_date,
    organization_id,
    course_id,
    course_name,
    course_category,
    course_level,
    course_version,
    course_delivery_mode,
    course_provider,
    cohort_id,
    curriculum_id,
    enrollment_type,
    qualifying_window_days;

AEP Query Service SQL: |
  -- ==========================================
  -- 2. ADOBE AEP QUERY SERVICE SQL
  -- ==========================================
  WITH eligible_enrollments AS (
    SELECT
      enrollment_id,
      organization_id,
      learner_id,
      enrollment_timestamp,
      enrollment_status,
      enrollment_type,
      eligibility_status,
      eligibility_reason,
      access_granted_timestamp,
      course_id,
      course_name,
      course_category,
      course_level,
      course_version,
      course_delivery_mode,
      course_provider,
      cohort_id,
      curriculum_id,
      COALESCE(qualifying_window_days, 7) AS qualifying_window_days
    FROM (
      SELECT
        _learning.enrollment.enrollmentId AS enrollment_id,
        _learning.organizationId AS organization_id,
        _learning.learnerId AS learner_id,
        CAST(_learning.enrollment.enrollmentTimestamp AS TIMESTAMP) AS enrollment_timestamp,
        _learning.enrollment.status AS enrollment_status,
        _learning.enrollment.type AS enrollment_type,
        _learning.enrollment.eligibilityStatus AS eligibility_status,
        _learning.enrollment.eligibilityReason AS eligibility_reason,
        CAST(_learning.enrollment.accessGrantedTimestamp AS TIMESTAMP) AS access_granted_timestamp,
        _learning.course.courseId AS course_id,
        _learning.course.courseName AS course_name,
        _learning.course.category AS course_category,
        _learning.course.level AS course_level,
        _learning.course.version AS course_version,
        _learning.course.deliveryMode AS course_delivery_mode,
        _learning.course.provider AS course_provider,
        _learning.course.cohortId AS cohort_id,
        _learning.course.curriculumId AS curriculum_id,
        COALESCE(_learning.qualification.qualifyingWindowDays, 7) AS qualifying_window_days,
        ROW_NUMBER() OVER (
          PARTITION BY _learning.enrollment.enrollmentId
          ORDER BY modified DESC, timestamp DESC
        ) AS row_rank
      FROM learning_enrollment_dataset
      WHERE CAST(_learning.enrollment.enrollmentTimestamp AS TIMESTAMP)
            >= CURRENT_TIMESTAMP - INTERVAL '365' DAY
    ) ranked_enrollments
    WHERE row_rank = 1
      AND enrollment_timestamp < CURRENT_TIMESTAMP
      AND eligibility_status = 'eligible'
      AND access_granted_timestamp IS NOT NULL
      AND COALESCE(enrollment_status, 'active') NOT IN ('cancelled', 'deleted', 'invalid')
  ),
  telemetry_events AS (
    SELECT
      eventType AS event_name,
      eventID AS event_id,
      CAST(timestamp AS TIMESTAMP) AS event_timestamp,
      _learning.sourceSystem AS source_system,
      _learning.environment AS environment,
      _learning.platform AS platform,
      web.webPageDetails.URL AS page_location,
      web.webReferrer.URL AS page_referrer,
      web.webPageDetails.name AS page_title,
      locale AS language,
      _learning.userId AS user_id,
      _learning.anonymousId AS anonymous_id,
      _learning.sessionId AS ga_session_id,
      _learning.analyticsConsent AS analytics_consent,
      _learning.organizationId AS organization_id,
      _learning.learnerId AS learner_id,
      _learning.enrollment.enrollmentId AS enrollment_id,
      CAST(_learning.enrollment.enrollmentTimestamp AS TIMESTAMP) AS enrollment_timestamp,
      _learning.enrollment.status AS enrollment_status,
      _learning.enrollment.type AS enrollment_type,
      _learning.enrollment.eligibilityStatus AS eligibility_status,
      _learning.enrollment.eligibilityReason AS eligibility_reason,
      CAST(_learning.enrollment.accessGrantedTimestamp AS TIMESTAMP) AS access_granted_timestamp,
      _learning.course.courseId AS course_id,
      _learning.course.courseName AS course_name,
      _learning.course.category AS course_category,
      _learning.course.level AS course_level,
      _learning.course.version AS course_version,
      _learning.course.deliveryMode AS course_delivery_mode,
      _learning.course.provider AS course_provider,
      _learning.course.cohortId AS cohort_id,
      _learning.course.curriculumId AS curriculum_id,
      _learning.learningActivity.activityId AS learning_activity_id,
      _learning.learningActivity.activityType AS learning_activity_type,
      _learning.learningActivity.activityName AS learning_activity_name,
      _learning.learningActivity.sequence AS learning_activity_sequence,
      CAST(_learning.learningActivity.startTimestamp AS TIMESTAMP) AS learning_start_timestamp,
      _learning.qualification.hoursSinceEnrollment AS hours_since_enrollment,
      _learning.qualification.qualifyingWindowDays AS qualifying_window_days,
      _learning.qualification.withinQualifyingWindow AS within_qualifying_window,
      _learning.qualification.qualifyingLearningStart AS qualifying_learning_start,
      _learning.qualification.ruleVersion AS qualification_rule_version,
      _learning.learningActivity.attemptNumber AS attempt_number,
      _learning.learningActivity.launchMethod AS launch_method,
      device.type AS device_category,
      environment.operatingSystem AS operating_system,
      environment.browserDetails.name AS browser,
      placeContext.geo.countryCode AS country,
      placeContext.geo.stateProvince AS region
    FROM digital_learning_event_dataset
    WHERE CAST(timestamp AS TIMESTAMP) >= CURRENT_TIMESTAMP - INTERVAL '372' DAY
      AND eventType = 'tutorial_begin'
  ),
  deduplicated_starts AS (
    SELECT *
    FROM (
      SELECT
        telemetry_events.*,
        ROW_NUMBER() OVER (
          PARTITION BY event_id
          ORDER BY event_timestamp
        ) AS row_rank
      FROM telemetry_events
      WHERE enrollment_id IS NOT NULL
        AND course_id IS NOT NULL
        AND COALESCE(environment, 'production') = 'production'
    ) ranked_starts
    WHERE row_rank = 1
  ),
  first_qualifying_starts AS (
    SELECT
      e.enrollment_id,
      MIN(s.learning_start_timestamp) AS first_qualifying_learning_start_timestamp
    FROM eligible_enrollments e
    JOIN deduplicated_starts s
      ON s.enrollment_id = e.enrollment_id
     AND s.course_id = e.course_id
     AND s.learning_start_timestamp >= e.enrollment_timestamp
     AND s.learning_start_timestamp < e.enrollment_timestamp
         + e.qualifying_window_days * INTERVAL '1' DAY
    GROUP BY e.enrollment_id
  ),
  enrollment_outcomes AS (
    SELECT
      e.*,
      f.first_qualifying_learning_start_timestamp
    FROM eligible_enrollments e
    LEFT JOIN first_qualifying_starts f
      ON f.enrollment_id = e.enrollment_id
    WHERE e.enrollment_timestamp <= CURRENT_TIMESTAMP
          - e.qualifying_window_days * INTERVAL '1' DAY
  )
  SELECT
    CAST(enrollment_timestamp AS DATE) AS enrollment_date,
    organization_id,
    course_id,
    course_name,
    course_category,
    course_level,
    course_version,
    course_delivery_mode,
    course_provider,
    cohort_id,
    curriculum_id,
    enrollment_type,
    qualifying_window_days,
    COUNT(*) AS eligible_enrollment_count,
    SUM(
      CASE
        WHEN first_qualifying_learning_start_timestamp IS NOT NULL THEN 1
        ELSE 0
      END
    ) AS qualifying_learning_start_count,
    ROUND(
      100.0 * SUM(
        CASE
          WHEN first_qualifying_learning_start_timestamp IS NOT NULL THEN 1
          ELSE 0
        END
      ) / NULLIF(COUNT(*), 0),
      4
    ) AS enrollment_to_learning_start_rate_pct
  FROM enrollment_outcomes
  GROUP BY
    CAST(enrollment_timestamp AS DATE),
    organization_id,
    course_id,
    course_name,
    course_category,
    course_level,
    course_version,
    course_delivery_mode,
    course_provider,
    cohort_id,
    curriculum_id,
    enrollment_type,
    qualifying_window_days;

Calculation Notes: |
  A qualifying start requires an authenticated learner-initiated launch or interaction event for a lesson, module, reading, video, quiz, assignment, live class, or standards-based package belonging to the enrolled course. Enrollment confirmation, course-page views, catalog previews, notifications, background preloads, autoplay, instructor impersonation, and system-generated events do not qualify. Deduplicate enrollment and activity events by immutable event ID, and count no more than one conversion per enrollment ID. Multiple qualifying starts for the same enrollment retain the earliest event only. Re-enrollments count separately only when a new valid enrollment ID and access period are created. Cross-device starts qualify when the authenticated event carries the same enrollment ID. Report unmatured seven-day cohorts as provisional and exclude them from finalized rate comparisons.

Business Use Case: |
  The Product organization monitors this rate by enrollment channel, course, device, and learner segment to identify where newly enrolled learners fail to begin. For example, a low rate for mobile marketplace enrollments can trigger investigation of deep-linking, authentication, entitlement, or content-launch failures, followed by onboarding changes and measurement of recovery in subsequent matured cohorts.



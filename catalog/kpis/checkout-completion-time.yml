KPI Name: Checkout Completion Time
Formula: SUM(purchase_timestamp − begin_checkout_timestamp) / Completed Checkouts

Description: |
  Average time in seconds from begin_checkout to purchase for checkouts that complete. A direct read on checkout friction; abandoned checkouts are excluded.

Category: Experience


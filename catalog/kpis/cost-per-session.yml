Google Analytics SQL: |
  -- ==========================================
  -- 1. GOOGLE BIGQUERY SQL
  -- ==========================================
  DECLARE start_date DATE DEFAULT DATE_SUB(CURRENT_DATE(), INTERVAL 90 DAY);
  DECLARE end_date DATE DEFAULT DATE_SUB(CURRENT_DATE(), INTERVAL 1 DAY);
  DECLARE reporting_currency STRING DEFAULT 'USD';
  DECLARE ad_account_tz STRING DEFAULT 'America/New_York';
  
  WITH media_spend AS (
    -- Daily ad platform media cost only (no fees, production or owned channels), converted at the daily FX rate
    SELECT
      s.spend_date,
      LOWER(s.source) AS source,
      LOWER(s.medium) AS medium,
      LOWER(s.campaign) AS campaign,
      SUM(s.spend_amount * IF(s.currency = reporting_currency, 1, fx.rate)) AS spend
    FROM `your-project.marketing.ad_spend_daily` AS s
    LEFT JOIN `your-project.finance.fx_daily_rates` AS fx
      ON fx.rate_date = s.spend_date
     AND fx.from_currency = s.currency
     AND fx.to_currency = reporting_currency
    WHERE s.spend_date BETWEEN start_date AND end_date
      AND s.cost_type = 'media'
    GROUP BY 1, 2, 3, 4
  ),
  sessions AS (
    -- One row per external session (user_pseudo_id + ga_session_id), internal and bot traffic excluded, dated in the ad account time zone
    SELECT
      CONCAT(user_pseudo_id, '.', (SELECT COALESCE(value.string_value, CAST(value.int_value AS STRING)) FROM UNNEST(event_params) WHERE key = 'ga_session_id')) AS session_key,
      DATE(TIMESTAMP_MICROS(event_timestamp), ad_account_tz) AS session_date,
      LOWER((SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'source')) AS source,
      LOWER((SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'medium')) AS medium,
      LOWER((SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'campaign')) AS campaign
    FROM `your-project.analytics_123456789.events_*`
    WHERE _TABLE_SUFFIX BETWEEN FORMAT_DATE('%Y%m%d', DATE_SUB(start_date, INTERVAL 1 DAY))
                            AND FORMAT_DATE('%Y%m%d', DATE_ADD(end_date, INTERVAL 1 DAY))
      AND event_name = 'session_start'
      AND IFNULL((SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'traffic_type'), 'external') NOT IN ('internal', 'bot')
  ),
  paid_sessions AS (
    -- Sessions whose date, source, medium and campaign match a media cost row
    SELECT COUNT(DISTINCT se.session_key) AS paid_sessions
    FROM sessions AS se
    JOIN media_spend AS m
      ON m.spend_date = se.session_date
     AND m.source = se.source
     AND m.medium = se.medium
     AND m.campaign = se.campaign
  )
  -- Total spend over total matched sessions; zero matched sessions returns NULL
  SELECT SAFE_DIVIDE((SELECT SUM(spend) FROM media_spend), paid_sessions) AS cost_per_session
  FROM paid_sessions;

AEP Query Service SQL: |
  -- ==========================================
  -- 2. ADOBE AEP QUERY SERVICE SQL
  -- ==========================================
  WITH params AS (
    -- Relative reporting window, reporting currency and ad account time zone
    SELECT
      date_sub(current_date(), 90) AS start_date,
      date_sub(current_date(), 1) AS end_date,
      'USD' AS reporting_currency,
      'America/New_York' AS ad_account_tz
  ),
  media_spend AS (
    -- Daily ad platform media cost only (no fees, production or owned channels), converted at the daily FX rate
    SELECT
      s.spend_date,
      lower(s.source) AS source,
      lower(s.medium) AS medium,
      lower(s.campaign) AS campaign,
      SUM(s.spend_amount * CASE WHEN s.currency = p.reporting_currency THEN 1 ELSE fx.rate END) AS spend
    FROM ad_spend_daily AS s
    CROSS JOIN params AS p
    LEFT JOIN fx_daily_rates AS fx
      ON fx.rate_date = s.spend_date
     AND fx.from_currency = s.currency
     AND fx.to_currency = p.reporting_currency
    WHERE s.spend_date BETWEEN p.start_date AND p.end_date
      AND s.cost_type = 'media'
    GROUP BY 1, 2, 3, 4
  ),
  sessions AS (
    -- One row per external session (sessionID), internal and bot traffic excluded, dated in the ad account time zone
    SELECT
      e._experience.analytics.session.sessionID AS session_key,
      to_date(from_utc_timestamp(e.timestamp, p.ad_account_tz)) AS session_date,
      lower(e._experience.analytics.customDimensions.eVars.source) AS source,
      lower(e._experience.analytics.customDimensions.eVars.medium) AS medium,
      lower(e.marketing.campaignGroup.campaignName) AS campaign
    FROM aep_web_events_dataset AS e
    CROSS JOIN params AS p
    WHERE e.eventType = 'sessionStart'
      AND coalesce(e._experience.analytics.customDimensions.eVars.trafficType, 'external') NOT IN ('internal', 'bot')
      AND e.timestamp >= date_sub(p.start_date, 1)
      AND e.timestamp < date_add(p.end_date, 2)
  ),
  paid_sessions AS (
    -- Sessions whose date, source, medium and campaign match a media cost row
    SELECT COUNT(DISTINCT se.session_key) AS paid_sessions
    FROM sessions AS se
    JOIN media_spend AS m
      ON m.spend_date = se.session_date
     AND m.source = se.source
     AND m.medium = se.medium
     AND m.campaign = se.campaign
  )
  -- Total spend over total matched sessions; zero matched sessions returns NULL
  SELECT (SELECT SUM(spend) FROM media_spend) / NULLIF(paid_sessions, 0) AS cost_per_session
  FROM paid_sessions;

Calculation Notes: |
  1️⃣ Numerator is ad platform media cost only; agency fees, creative production and owned or organic channel costs are excluded.
  2️⃣ Denominator counts sessions whose source, medium and campaign match a cost row; organic, direct and referral sessions are excluded.
  3️⃣ A session is a distinct user_pseudo_id + ga_session_id under the GA4 30-minute inactivity timeout.
  4️⃣ Exclude internal and bot traffic from sessions; spend is never filtered by traffic type.
  5️⃣ Convert spend to one reporting currency at the daily rate and align both sides to the ad account time zone before joining.
  6️⃣ Divide aggregated totals; never average daily ratios. Zero matched sessions returns NULL and flags a UTM tagging gap.

Business Use Case: |
  1️⃣ Paid media team: a campaign's cost per session rises 20% week over week; cut bids or pause weak placements.
  2️⃣ Growth marketing: cost per session exceeds Revenue per Visit on a channel; shift budget to channels where it does not.
  3️⃣ Finance: plans the quarterly traffic budget as planned sessions × trailing 90-day cost per session by channel.
  4️⃣ Marketing analytics: campaigns with spend but zero sessions go to ad ops for UTM tagging fixes.


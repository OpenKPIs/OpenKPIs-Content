KPI Name: Cost per Session
Formula: SUM(Paid Media Spend) / COUNT(DISTINCT Paid Sessions), matched on date, source, medium and campaign

Description: |
  Paid media spend divided by the sessions those same paid campaigns delivered in the period. Shows what each paid visit costs and is read against Revenue per Visit.

Category: Acquisition


























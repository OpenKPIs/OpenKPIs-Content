# KPI: Cart-to-Checkout Rate
# Generated: 2026-09-17T23:15:55.371Z
# Contributed by: devyendarm


KPI Name: Cart-to-Checkout Rate
Formula: (Sessions Initiating Checkout / Sessions with a Cart) × 100

Description: |
  Cart-to-Checkout Rate is the share of sessions that hold a cart — an add-to-cart or a cart view — and then go on to initiate checkout, isolating the single funnel step between cart intent and checkout entry. Unlike Cart Conversion Rate, which follows cart holders all the way through to a completed purchase, this KPI stops at checkout initiation, so it separates cart-page friction such as shipping-cost disclosure, CTA clarity and trust signals from failures that occur later inside the payment and fulfilment steps.

Category: Conversion


























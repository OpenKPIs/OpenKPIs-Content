Google Analytics SQL: |
  -- ==========================================
  -- 1. GOOGLE BIGQUERY SQL
  -- ==========================================
  -- Cart-to-Checkout Rate = sessions initiating checkout / sessions holding a cart x 100.
  -- Session grain = (user_pseudo_id, ga_session_id) pivoted out of event_params, the same session key as Order Conversion Rate (Visit);
  -- GA4 closes a session after 30 minutes of inactivity, at midnight in the property time zone and on a campaign change, so a cart built
  -- on one day and checked out on another correctly produces two sessions.
  -- Denominator = every qualified session with at least one add_to_cart or view_cart (the full cart-holding base population).
  -- Numerator  = the subset of those same sessions that also fire begin_checkout at or after the first cart event.
  -- Express (buy-now / wallet) entries that fire begin_checkout with no preceding cart event never enter either side, because the session
  -- carries no qualified cart event; they belong on the separate express checkout view.
  -- Window = 28 complete days, ending 4 days back so late-arriving hits have landed.
  WITH base_events AS (
    SELECT
      PARSE_DATE('%Y%m%d', e.event_date) AS event_date,
      e.event_name,
      e.event_timestamp,
      e.user_pseudo_id,
      e.device.category AS device_category,
      LOWER(COALESCE(e.collected_traffic_source.manual_source, e.traffic_source.source, '(direct)')) AS traffic_source,
      LOWER(COALESCE(e.collected_traffic_source.manual_medium, e.traffic_source.medium, '(none)')) AS traffic_medium,
      e.privacy_info.analytics_storage AS analytics_storage,
      p.ga_session_id,
      p.cart_size,
      p.cart_size_band,
      p.cart_value,
      p.express_checkout_flag,
      p.debug_mode,
      p.traffic_type,
      (
        SELECT COUNTIF(i.item_id IS NOT NULL
                       AND NOT STARTS_WITH(UPPER(i.item_id), 'TEST')
                       AND COALESCE(i.price, 0) > 0)
        FROM UNNEST(e.items) AS i
      ) AS sellable_items
    FROM `your-project.analytics_123456789.events_*` AS e,
    UNNEST([(
      SELECT AS STRUCT
        MAX(IF(ep.key = 'ga_session_id', ep.value.int_value, NULL)) AS ga_session_id,
        MAX(IF(ep.key = 'cart_size', COALESCE(ep.value.int_value, SAFE_CAST(ep.value.string_value AS INT64)), NULL)) AS cart_size,
        MAX(IF(ep.key = 'cart_size_band', ep.value.string_value, NULL)) AS cart_size_band,
        MAX(IF(ep.key = 'cart_value', COALESCE(ep.value.double_value, ep.value.float_value, SAFE_CAST(ep.value.int_value AS FLOAT64)), NULL)) AS cart_value,
        MAX(IF(ep.key = 'express_checkout', CASE WHEN LOWER(COALESCE(ep.value.string_value, '')) = 'true' OR ep.value.int_value = 1 THEN 1 ELSE 0 END, NULL)) AS express_checkout_flag,
        MAX(IF(ep.key = 'debug_mode', COALESCE(ep.value.int_value, SAFE_CAST(ep.value.string_value AS INT64)), NULL)) AS debug_mode,
        MAX(IF(ep.key = 'traffic_type', LOWER(ep.value.string_value), NULL)) AS traffic_type
      FROM UNNEST(e.event_params) AS ep
    )]) AS p
    WHERE e._TABLE_SUFFIX BETWEEN FORMAT_DATE('%Y%m%d', DATE_SUB(CURRENT_DATE(), INTERVAL 31 DAY))
                              AND FORMAT_DATE('%Y%m%d', DATE_SUB(CURRENT_DATE(), INTERVAL 3 DAY))
      AND e.event_name IN ('add_to_cart', 'view_cart', 'begin_checkout')
      AND COALESCE(e.device.web_info.hostname, '') NOT LIKE '%staging%'
  ),
  clean_events AS (
    -- Exclusions applied before the ratio: internal / QA / load-test traffic, debug hits and consent-denied measurement.
    SELECT
      CONCAT(user_pseudo_id, '.', CAST(ga_session_id AS STRING)) AS session_key,
      *
    FROM base_events
    WHERE ga_session_id IS NOT NULL
      AND COALESCE(debug_mode, 0) = 0
      AND COALESCE(traffic_type, '') NOT IN ('internal', 'qa', 'load_test', 'monitoring')
      AND COALESCE(analytics_storage, 'Yes') <> 'No'
  ),
  session_context AS (
    SELECT
      session_key,
      MIN(event_date) AS session_date,
      MAX(cart_size) AS max_cart_size,
      MAX(COALESCE(express_checkout_flag, 0)) AS express_flag,
      ARRAY_AGG(cart_size_band IGNORE NULLS ORDER BY event_timestamp DESC LIMIT 1)[SAFE_OFFSET(0)] AS last_cart_size_band,
      ARRAY_AGG(STRUCT(device_category, traffic_source, traffic_medium) ORDER BY event_timestamp LIMIT 1)[SAFE_OFFSET(0)] AS session_entry
    FROM clean_events
    GROUP BY session_key
  ),
  cart_sessions AS (
    -- Denominator population: one row per session that created or viewed a cart holding at least one sellable, non-test item.
    SELECT
      session_key,
      MIN(event_timestamp) AS first_cart_ts
    FROM clean_events
    WHERE event_name IN ('add_to_cart', 'view_cart')
      AND (sellable_items > 0 OR COALESCE(cart_value, 0) > 0)
    GROUP BY session_key
  ),
  checkout_sessions AS (
    -- Numerator population: the SAME sessions, deduplicated to one row, whose begin_checkout fires at or after the first cart event.
    SELECT
      c.session_key,
      MIN(c.event_timestamp) AS first_checkout_ts
    FROM clean_events AS c
    JOIN cart_sessions AS s USING (session_key)
    WHERE c.event_name = 'begin_checkout'
      AND c.event_timestamp >= s.first_cart_ts
    GROUP BY c.session_key
  ),
  session_outcome AS (
    SELECT
      cs.session_key,
      ctx.session_date,
      COALESCE(ctx.session_entry.device_category, 'unknown') AS device_category,
      COALESCE(
        ctx.last_cart_size_band,
        CASE
          WHEN ctx.max_cart_size IS NULL THEN 'Unknown'
          WHEN ctx.max_cart_size <= 2 THEN '1-2 items'
          WHEN ctx.max_cart_size <= 5 THEN '3-5 items'
          WHEN ctx.max_cart_size <= 9 THEN '6-9 items'
          ELSE '10+ items'
        END
      ) AS cart_size_band,
      CASE
        WHEN ctx.session_entry.traffic_medium IN ('cpc', 'ppc', 'paid', 'paidsearch')
             AND REGEXP_CONTAINS(ctx.session_entry.traffic_source, r'google|bing|yahoo|duckduckgo') THEN 'Paid Search'
        WHEN ctx.session_entry.traffic_medium IN ('cpc', 'ppc', 'paid', 'display', 'banner') THEN 'Paid Other'
        WHEN ctx.session_entry.traffic_medium = 'organic' THEN 'Organic Search'
        WHEN REGEXP_CONTAINS(ctx.session_entry.traffic_medium, r'^(social|social-network|social-media)$') THEN 'Organic Social'
        WHEN ctx.session_entry.traffic_medium IN ('email', 'e-mail', 'newsletter') THEN 'Email'
        WHEN ctx.session_entry.traffic_medium = 'affiliate' THEN 'Affiliates'
        WHEN ctx.session_entry.traffic_medium = 'referral' THEN 'Referral'
        WHEN ctx.session_entry.traffic_source IN ('(direct)', '') AND ctx.session_entry.traffic_medium IN ('(none)', '') THEN 'Direct'
        ELSE 'Other'
      END AS channel_group,
      ctx.express_flag,
      IF(co.session_key IS NULL, 0, 1) AS initiated_checkout
    FROM cart_sessions AS cs
    JOIN session_context AS ctx USING (session_key)
    LEFT JOIN checkout_sessions AS co USING (session_key)
  )
  SELECT
    session_date,
    device_category,
    channel_group,
    cart_size_band,
    COUNT(*) AS cart_sessions,
    COUNTIF(initiated_checkout = 1) AS sessions_initiating_checkout,
    COUNTIF(express_flag = 1) AS cart_sessions_with_express_entry,
    ROUND(100 * SAFE_DIVIDE(COUNTIF(initiated_checkout = 1), COUNT(*)), 1) AS cart_to_checkout_rate_pct,
    COUNT(*) >= 200 AS meets_minimum_base
  FROM session_outcome
  WHERE session_date BETWEEN DATE_SUB(CURRENT_DATE(), INTERVAL 31 DAY)
                         AND DATE_SUB(CURRENT_DATE(), INTERVAL 4 DAY)
  GROUP BY session_date, device_category, channel_group, cart_size_band
  ORDER BY session_date, device_category, channel_group, cart_size_band;

AEP Query Service SQL: |
  -- ==========================================
  -- 2. ADOBE AEP QUERY SERVICE SQL
  -- ==========================================
  -- Cart-to-Checkout Rate on the web ExperienceEvent dataset, same base population and same session grain as the BigQuery build.
  -- Session key = ECID from identityMap plus a session ordinal rebuilt from _experience.analytics.session.depth, which restarts at every
  -- new visit, with the 30-minute inactivity and midnight rules as the fallback boundary when depth is unavailable.
  -- Denominator = sessions with a qualified cart hit (commerce.productListAdds, or commerce.productListViews on the cart section).
  -- Numerator  = the subset of those sessions that also carry commerce.checkouts at or after the first cart hit.
  -- Checkout hits with no preceding cart hit in the session (express / wallet entries) fall outside both sides by construction.
  WITH base_events AS (
    SELECT
      identityMap['ECID'][0]['id'] AS ecid,
      timestamp AS event_ts,
      eventType,
      commerce.productListAdds.value AS product_list_adds,
      commerce.productListViews.value AS product_list_views,
      commerce.checkouts.value AS checkouts,
      commerce.order.priceTotal AS cart_value,
      device.type AS device_category,
      web.webPageDetails.siteSection AS site_section,
      web.webReferrer.URL AS referrer_url,
      _experience.analytics.session.depth AS session_depth,
      _experience.analytics.customDimensions.eVars.eVar2.value AS cart_size_band,
      _experience.analytics.customDimensions.eVars.eVar3.value AS checkout_type,
      COALESCE(size(filter(productListItems, i -> i.priceTotal > 0 AND upper(COALESCE(i.SKU, '')) NOT LIKE 'TEST%')), 0) AS sellable_items
    FROM aep_web_experience_events
    WHERE timestamp >= date_sub(current_date(), 31)
      AND timestamp < date_sub(current_date(), 3)
      AND identityMap['ECID'][0]['id'] IS NOT NULL
      AND COALESCE(web.webPageDetails.URL, '') NOT LIKE '%staging%'
      AND (
        eventType IN ('commerce.productListAdds', 'commerce.productListViews', 'commerce.checkouts')
        OR COALESCE(commerce.productListAdds.value, 0) > 0
        OR COALESCE(commerce.productListViews.value, 0) > 0
        OR COALESCE(commerce.checkouts.value, 0) > 0
      )
  ),
  sessionised AS (
    SELECT
      b.*,
      CASE
        WHEN LAG(event_ts) OVER (PARTITION BY ecid ORDER BY event_ts) IS NULL THEN 1
        WHEN session_depth IS NOT NULL
             AND LAG(session_depth) OVER (PARTITION BY ecid ORDER BY event_ts) IS NOT NULL
             AND session_depth <= LAG(session_depth) OVER (PARTITION BY ecid ORDER BY event_ts) THEN 1
        WHEN to_date(event_ts) <> to_date(LAG(event_ts) OVER (PARTITION BY ecid ORDER BY event_ts)) THEN 1
        WHEN unix_timestamp(event_ts) - unix_timestamp(LAG(event_ts) OVER (PARTITION BY ecid ORDER BY event_ts)) > 1800 THEN 1
        ELSE 0
      END AS is_session_start
    FROM base_events AS b
  ),
  keyed AS (
    SELECT
      s.*,
      CONCAT(ecid, '.', CAST(SUM(is_session_start) OVER (
        PARTITION BY ecid ORDER BY event_ts ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW
      ) AS STRING)) AS session_key
    FROM sessionised AS s
  ),
  cart_hits AS (
    SELECT *
    FROM keyed
    WHERE (
        eventType = 'commerce.productListAdds'
        OR COALESCE(product_list_adds, 0) > 0
        OR ((eventType = 'commerce.productListViews' OR COALESCE(product_list_views, 0) > 0)
            AND lower(COALESCE(site_section, '')) = 'cart')
      )
      AND (sellable_items > 0 OR COALESCE(cart_value, 0) > 0)
  ),
  cart_sessions AS (
    SELECT session_key, MIN(event_ts) AS first_cart_ts
    FROM cart_hits
    GROUP BY session_key
  ),
  checkout_sessions AS (
    SELECT k.session_key, MIN(k.event_ts) AS first_checkout_ts
    FROM keyed AS k
    JOIN cart_sessions AS c ON c.session_key = k.session_key
    WHERE (k.eventType = 'commerce.checkouts' OR COALESCE(k.checkouts, 0) > 0)
      AND k.event_ts >= c.first_cart_ts
    GROUP BY k.session_key
  ),
  session_context AS (
    SELECT
      session_key,
      to_date(MIN(event_ts)) AS session_date,
      COALESCE(MIN_BY(device_category, event_ts), 'unknown') AS device_category,
      MIN_BY(referrer_url, event_ts) AS entry_referrer,
      COALESCE(MAX_BY(cart_size_band, event_ts), MAX(cart_size_band), 'Unknown') AS cart_size_band,
      COALESCE(MAX_BY(checkout_type, event_ts), MAX(checkout_type)) AS checkout_type
    FROM keyed
    GROUP BY session_key
  ),
  session_outcome AS (
    SELECT
      cs.session_key,
      ctx.session_date,
      ctx.device_category,
      ctx.cart_size_band,
      ctx.checkout_type,
      CASE
        WHEN ctx.entry_referrer IS NULL OR ctx.entry_referrer = '' THEN 'Direct'
        WHEN lower(ctx.entry_referrer) LIKE '%example.com%' THEN 'Internal'
        WHEN lower(ctx.entry_referrer) LIKE '%google.%'
          OR lower(ctx.entry_referrer) LIKE '%bing.%'
          OR lower(ctx.entry_referrer) LIKE '%yahoo.%'
          OR lower(ctx.entry_referrer) LIKE '%duckduckgo.%' THEN 'Organic Search'
        WHEN lower(ctx.entry_referrer) LIKE '%facebook.%'
          OR lower(ctx.entry_referrer) LIKE '%instagram.%'
          OR lower(ctx.entry_referrer) LIKE '%tiktok.%'
          OR lower(ctx.entry_referrer) LIKE '%pinterest.%'
          OR lower(ctx.entry_referrer) LIKE '%linkedin.%' THEN 'Organic Social'
        WHEN lower(ctx.entry_referrer) LIKE '%mail.%'
          OR lower(ctx.entry_referrer) LIKE '%outlook.%' THEN 'Email'
        ELSE 'Referral'
      END AS channel_group,
      CASE WHEN co.session_key IS NOT NULL THEN 1 ELSE 0 END AS initiated_checkout
    FROM cart_sessions AS cs
    JOIN session_context AS ctx ON ctx.session_key = cs.session_key
    LEFT JOIN checkout_sessions AS co ON co.session_key = cs.session_key
  )
  SELECT
    session_date,
    device_category,
    channel_group,
    cart_size_band,
    COUNT(*) AS cart_sessions,
    SUM(initiated_checkout) AS sessions_initiating_checkout,
    SUM(CASE WHEN lower(COALESCE(checkout_type, '')) = 'guest' THEN 1 ELSE 0 END) AS guest_checkout_sessions,
    ROUND(100.0 * SUM(initiated_checkout) / NULLIF(COUNT(*), 0), 1) AS cart_to_checkout_rate_pct,
    CASE WHEN COUNT(*) >= 200 THEN TRUE ELSE FALSE END AS meets_minimum_base
  FROM session_outcome
  WHERE session_date <= date_sub(current_date(), 4)
  GROUP BY session_date, device_category, channel_group, cart_size_band
  ORDER BY session_date, device_category, channel_group, cart_size_band;

Calculation Notes: |
  1️⃣ Grain is the session and it never changes: the denominator is the count of distinct sessions containing at least one add_to_cart or view_cart event, and the numerator is the subset of those same sessions containing at least one begin_checkout event. Repeated cart additions or repeated checkout entries inside one session are collapsed to a single session on both sides, so the KPI measures session progression, not event volume.,2️⃣ The denominator is the full cart-holding base population — every session that created or viewed a cart, including sessions that never reach checkout. It is never restricted to begin_checkout sessions, which would force the result toward 100% and destroy the diagnostic value of the step.,3️⃣ Session-timeout rule: sessions close after 30 minutes of inactivity, at midnight in the reporting property's time zone, or on a campaign (source/medium) change. A shopper who builds a cart on Monday and checks out on Wednesday from a persisted cart produces two sessions — the first is a non-converting cart session, the second enters the denominator only if it fires view_cart or add_to_cart, which the cart page normally does. Long-deliberation categories therefore read low on this KPI by design; use the user-grain repeat-visit view for those, not a redefinition of this one.,4️⃣ Exclusions applied before the ratio is computed: internal and QA traffic (office IP / internal-traffic flag), known bots and crawlers, sessions from load-test and monitoring agents, and carts built only from test or zero-price SKUs. Sessions with consent-denied measurement are excluded from both numerator and denominator so the base stays internally consistent rather than mixing modelled and observed counts.,5️⃣ Ordering and timing: begin_checkout must occur at or after the first cart event in the same session, validated on event timestamp rather than hit arrival order, because late-arriving or retried hits can invert sequence. Express paths that jump straight to payment without a cart (buy-now, wallet express buttons) fire begin_checkout with no preceding cart event; those sessions are excluded from both numerator and denominator and reported separately as express checkout so they do not inflate the step.,6️⃣ Navigation back and forth between checkout steps re-fires begin_checkout; those firings are deduplicated to one per session. A remove_from_cart or an emptied cart does not remove a session from the denominator — the cart intent has already been expressed and removing it would hide exactly the abandonment this KPI exists to surface.,7️⃣ Reporting convention: report to one decimal place, compute the numerator and denominator daily and re-sum them when rolling up to week, month or quarter — never average the daily rates. Require at least 500 cart sessions in the window, and at least 200 within any breakdown, before acting on a movement.

Business Use Case: |
  1️⃣ The E-commerce Product Manager reviews the KPI in the weekly funnel readout; when it falls three or more percentage points week over week on a single device category while Add-to-Cart Rate holds, they open a cart-page experiment on delivery-cost disclosure and checkout CTA prominence and brief the checkout squad for the next sprint.,2️⃣ The Merchandising Manager breaks the rate down by item category and cart size band each month and, for categories sitting below the site baseline, moves the free-shipping threshold message and stock-assurance badge onto the cart page for those categories before the next trading cycle.,3️⃣ The Lifecycle Marketing Manager builds the recovery audience directly from the gap — cart sessions that never fired begin_checkout — and triggers the cart-recovery email and paid-social sequence within four hours of session close, suppressing anyone who later initiated checkout on another device.,4️⃣ The Trading Manager monitors the rate hourly through peak trading events; a drop below the trailing 14-day baseline while cart creation is stable is treated as a checkout-entry incident and escalated immediately to the payments and front-end on-call engineers rather than waiting for revenue to confirm the loss.


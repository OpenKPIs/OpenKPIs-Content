      CAST(x._hotel.reservation.leadTimeDays AS BIGINT) AS lead_time_days,
      x._hotel.reservation.eligibleReservation AS eligible_reservation,
      x._hotel.reservation.ownedDigitalChannel AS owned_digital_channel,
      x._hotel.reservation.reservationCompleted AS reservation_completed,
      x._hotel.reservation.completedCheckoutAvailable AS completed_checkout_available,
      x._hotel.reservation.stayRealizationStatus AS stay_realization_status
    FROM hotel_digital_experience_events x
    WHERE x.eventType = 'commerce.purchases'
      AND CAST(x.timestamp AS TIMESTAMP) >= CURRENT_TIMESTAMP - INTERVAL '365' DAY
      AND CAST(x.timestamp AS TIMESTAMP) < CURRENT_TIMESTAMP + INTERVAL '1' DAY
  ),
  normalized AS (
    SELECT
      p.*,
      COALESCE(p.booking_timestamp, p.event_timestamp) AS normalized_booking_timestamp,
      COALESCE(
        p.stay_nights,
        CAST(p.check_out_date - p.check_in_date AS BIGINT)
      ) AS normalized_stay_nights,
      COALESCE(NULLIF(p.reserved_room_stays, 0), NULLIF(p.room_count, 0), 1) AS normalized_reserved_room_stays
    FROM purchase_events p
  ),
  ranked AS (
    SELECT
      n.*,
      COALESCE(
        NULLIF(n.booked_room_nights, 0),
        n.normalized_stay_nights * n.normalized_reserved_room_stays
      ) AS normalized_booked_room_nights,
      ROW_NUMBER() OVER (
        PARTITION BY COALESCE(NULLIF(n.reservation_id, ''), NULLIF(n.transaction_id, ''))
        ORDER BY n.event_timestamp DESC
      ) AS reservation_row_number
    FROM normalized n
    WHERE COALESCE(NULLIF(n.reservation_id, ''), NULLIF(n.transaction_id, '')) IS NOT NULL
      AND LOWER(COALESCE(n.booking_status, 'confirmed')) IN ('confirmed', 'completed', 'booked')
      AND COALESCE(n.eligible_reservation, TRUE) = TRUE
      AND COALESCE(n.owned_digital_channel, TRUE) = TRUE
      AND COALESCE(n.reservation_completed, TRUE) = TRUE
  ),
  valid_reservations AS (
    SELECT *
    FROM ranked
    WHERE reservation_row_number = 1
      AND normalized_stay_nights > 0
      AND normalized_reserved_room_stays > 0
      AND normalized_booked_room_nights > 0
      AND check_in_date IS NOT NULL
      AND check_out_date IS NOT NULL
      AND check_out_date > check_in_date
  )
  SELECT
    CAST(normalized_booking_timestamp AS DATE) AS booking_date,
    property_id,
    property_name,
    brand,
    chain_code,
    destination_city,
    destination_region,
    destination_country,
    market_code,
    COALESCE(channel, 'owned_digital') AS channel,
    platform,
    booking_engine,
    site_id,
    language,
    device_category,
    rate_plan_id,
    rate_plan_type,
    room_type_id,
    COUNT(*) AS reservation_count,
    SUM(normalized_reserved_room_stays) AS reserved_room_stays,
    SUM(normalized_booked_room_nights) AS booked_room_nights,
    CAST(SUM(normalized_booked_room_nights) AS DECIMAL(38,6))
      / NULLIF(CAST(SUM(normalized_reserved_room_stays) AS DECIMAL(38,6)), 0)
        AS average_length_of_stay_nights
  FROM valid_reservations
  GROUP BY
    CAST(normalized_booking_timestamp AS DATE),
    property_id,
    property_name,
    brand,
    chain_code,
    destination_city,
    destination_region,
    destination_country,
    market_code,
    COALESCE(channel, 'owned_digital'),
    platform,
    booking_engine,
    site_id,
    language,
    device_category,
    rate_plan_id,
    rate_plan_type,
    room_type_id
  ORDER BY booking_date DESC, property_id;

Calculation Notes: |
  1️⃣ Calculate nights as scheduled check-out date minus scheduled check-in date using property-local calendar dates, not elapsed hours.
  2️⃣ Use one reservation-room record as one stay unit so multi-room bookings contribute one observation per reserved room.
  3️⃣ Include digitally originated reservations with a valid confirmed status as recorded by the digital booking platform.
  4️⃣ Exclude canceled, test, employee-training, complimentary, day-use, invalid-date, and zero-night reservation-room records.
  5️⃣ Cohort results by scheduled check-in date; booking-date reporting must be labeled separately as booked length of stay.
  6️⃣ Recalculate amended reservations using the latest valid digital itinerary and retain historical versions for auditability.

Business Use Case: |
  Revenue Management monitors Average Length of Stay by property, arrival period, source channel, rate plan, device, and campaign to identify short-stay demand that creates inventory gaps or high room-turnover pressure. The team can respond by introducing minimum-stay controls, length-of-stay pricing, extended-stay offers, or campaign changes for arrival dates where the projected stay mix is inconsistent with occupancy and revenue objectives.



KPI Name: Average Length of Stay
Formula: SUM(DATE_DIFF(scheduled_check_out_date, scheduled_check_in_date, DAY)) / COUNT(DISTINCT reservation_room_id)

Description: |
  Measures the mean number of booked nights per reserved room-stay for eligible confirmed reservations completed through owned digital channels, grouped by scheduled check-in date. It quantifies stay-duration mix and forward inventory commitment for digital demand but does not represent realized stays without completed-checkout data.

Category: Performance

Tags: [kpi]

Industry: [Travel & Hospitality]

Priority: High

Core Area: Monetization

Scope: Item

Measure Type: average

Aggregation Window: Time based - Daily/Monthly/Yearly


  WITH purchase_events AS (
    SELECT
      PARSE_DATE('%Y%m%d', event_date) AS event_date,
      TIMESTAMP_MICROS(event_timestamp) AS event_timestamp,
      user_pseudo_id,
      ecommerce.transaction_id,
      MAX(IF(ep.key = 'reservation_id', ep.value.string_value, NULL)) AS reservation_id,
      MAX(IF(ep.key = 'confirmation_number', ep.value.string_value, NULL)) AS confirmation_number,
      MAX(IF(ep.key = 'booking_status', ep.value.string_value, NULL)) AS booking_status,
      MAX(IF(ep.key = 'booking_timestamp', ep.value.string_value, NULL)) AS booking_timestamp,
      MAX(IF(ep.key = 'check_in_date', ep.value.string_value, NULL)) AS check_in_date,
      MAX(IF(ep.key = 'check_out_date', ep.value.string_value, NULL)) AS check_out_date,
      COALESCE(
        MAX(IF(ep.key = 'stay_nights', ep.value.int_value, NULL)),
        SAFE_CAST(MAX(IF(ep.key = 'stay_nights', ep.value.string_value, NULL)) AS INT64)
      ) AS stay_nights,
      COALESCE(
        MAX(IF(ep.key = 'reserved_room_stays', ep.value.int_value, NULL)),
        SAFE_CAST(MAX(IF(ep.key = 'reserved_room_stays', ep.value.string_value, NULL)) AS INT64)
      ) AS reserved_room_stays,
      COALESCE(
        MAX(IF(ep.key = 'booked_room_nights', ep.value.int_value, NULL)),
        SAFE_CAST(MAX(IF(ep.key = 'booked_room_nights', ep.value.string_value, NULL)) AS INT64)
      ) AS booked_room_nights,
      COALESCE(
        MAX(IF(ep.key = 'room_count', ep.value.int_value, NULL)),
        SAFE_CAST(MAX(IF(ep.key = 'room_count', ep.value.string_value, NULL)) AS INT64)
      ) AS room_count,
      MAX(IF(ep.key = 'adult_count', ep.value.int_value, NULL)) AS adult_count,
      MAX(IF(ep.key = 'child_count', ep.value.int_value, NULL)) AS child_count,
      MAX(IF(ep.key = 'guest_count', ep.value.int_value, NULL)) AS guest_count,
      MAX(IF(ep.key = 'property_id', ep.value.string_value, NULL)) AS property_id,
      MAX(IF(ep.key = 'property_name', ep.value.string_value, NULL)) AS property_name,
      MAX(IF(ep.key = 'brand', ep.value.string_value, NULL)) AS brand,
      MAX(IF(ep.key = 'chain_code', ep.value.string_value, NULL)) AS chain_code,
      MAX(IF(ep.key = 'destination_city', ep.value.string_value, NULL)) AS destination_city,
      MAX(IF(ep.key = 'destination_region', ep.value.string_value, NULL)) AS destination_region,
      MAX(IF(ep.key = 'destination_country', ep.value.string_value, NULL)) AS destination_country,
      MAX(IF(ep.key = 'market_code', ep.value.string_value, NULL)) AS market_code,
      MAX(IF(ep.key = 'currency', ep.value.string_value, NULL)) AS currency,
      MAX(IF(ep.key = 'room_revenue', COALESCE(ep.value.double_value, ep.value.float_value, CAST(ep.value.int_value AS FLOAT64)), NULL)) AS room_revenue,
      MAX(IF(ep.key = 'tax_amount', COALESCE(ep.value.double_value, ep.value.float_value, CAST(ep.value.int_value AS FLOAT64)), NULL)) AS tax_amount,
      MAX(IF(ep.key = 'fee_amount', COALESCE(ep.value.double_value, ep.value.float_value, CAST(ep.value.int_value AS FLOAT64)), NULL)) AS fee_amount,
      MAX(IF(ep.key = 'discount_amount', COALESCE(ep.value.double_value, ep.value.float_value, CAST(ep.value.int_value AS FLOAT64)), NULL)) AS discount_amount,
      MAX(IF(ep.key = 'total_value', COALESCE(ep.value.double_value, ep.value.float_value, CAST(ep.value.int_value AS FLOAT64)), NULL)) AS total_value,
      MAX(IF(ep.key = 'coupon', ep.value.string_value, NULL)) AS coupon,
      MAX(IF(ep.key = 'rate_plan_id', ep.value.string_value, NULL)) AS rate_plan_id,
      MAX(IF(ep.key = 'rate_plan_name', ep.value.string_value, NULL)) AS rate_plan_name,
      MAX(IF(ep.key = 'rate_plan_type', ep.value.string_value, NULL)) AS rate_plan_type,
      MAX(IF(ep.key = 'room_type_id', ep.value.string_value, NULL)) AS room_type_id,
      MAX(IF(ep.key = 'room_type_name', ep.value.string_value, NULL)) AS room_type_name,
      MAX(IF(ep.key = 'package_id', ep.value.string_value, NULL)) AS package_id,
      MAX(IF(ep.key = 'package_name', ep.value.string_value, NULL)) AS package_name,
      MAX(IF(ep.key = 'promo_code', ep.value.string_value, NULL)) AS promo_code,
      COALESCE(
        MAX(IF(ep.key = 'refundable', ep.value.string_value, NULL)),
        CAST(MAX(IF(ep.key = 'refundable', ep.value.int_value, NULL)) AS STRING)
      ) AS refundable,
      MAX(IF(ep.key = 'cancellation_policy_code', ep.value.string_value, NULL)) AS cancellation_policy_code,
      MAX(IF(ep.key = 'payment_type', ep.value.string_value, NULL)) AS payment_type,
      COALESCE(
        MAX(IF(ep.key = 'loyalty_member', ep.value.string_value, NULL)),
        CAST(MAX(IF(ep.key = 'loyalty_member', ep.value.int_value, NULL)) AS STRING)
      ) AS loyalty_member,
      MAX(IF(ep.key = 'loyalty_tier', ep.value.string_value, NULL)) AS loyalty_tier,
      MAX(IF(ep.key = 'customer_id', ep.value.string_value, NULL)) AS customer_id,
      MAX(IF(ep.key = 'user_id', ep.value.string_value, NULL)) AS reservation_user_id,
      COALESCE(
        MAX(IF(ep.key = 'session_id', ep.value.string_value, NULL)),
        CAST(MAX(IF(ep.key IN ('session_id', 'ga_session_id'), ep.value.int_value, NULL)) AS STRING)
      ) AS session_id,
      MAX(IF(ep.key = 'client_id', ep.value.string_value, NULL)) AS client_id,
      MAX(IF(ep.key = 'channel', ep.value.string_value, NULL)) AS channel,
      MAX(IF(ep.key = 'platform', ep.value.string_value, NULL)) AS platform,
      MAX(IF(ep.key = 'booking_engine', ep.value.string_value, NULL)) AS booking_engine,
      MAX(IF(ep.key = 'site_id', ep.value.string_value, NULL)) AS site_id,
      MAX(IF(ep.key = 'language', ep.value.string_value, NULL)) AS language,
      MAX(IF(ep.key = 'device_category', ep.value.string_value, NULL)) AS device_category,
      COALESCE(
        MAX(IF(ep.key = 'analytics_consent', ep.value.string_value, NULL)),
        CAST(MAX(IF(ep.key = 'analytics_consent', ep.value.int_value, NULL)) AS STRING)
      ) AS analytics_consent,
      MAX(IF(ep.key = 'lead_time_days', ep.value.int_value, NULL)) AS lead_time_days,
      COALESCE(
        MAX(IF(ep.key = 'eligible_reservation', ep.value.string_value, NULL)),
        CAST(MAX(IF(ep.key = 'eligible_reservation', ep.value.int_value, NULL)) AS STRING)
      ) AS eligible_reservation,
      COALESCE(
        MAX(IF(ep.key = 'owned_digital_channel', ep.value.string_value, NULL)),
        CAST(MAX(IF(ep.key = 'owned_digital_channel', ep.value.int_value, NULL)) AS STRING)
      ) AS owned_digital_channel,
      COALESCE(
        MAX(IF(ep.key = 'reservation_completed', ep.value.string_value, NULL)),
        CAST(MAX(IF(ep.key = 'reservation_completed', ep.value.int_value, NULL)) AS STRING)
      ) AS reservation_completed,
      COALESCE(
        MAX(IF(ep.key = 'completed_checkout_available', ep.value.string_value, NULL)),
        CAST(MAX(IF(ep.key = 'completed_checkout_available', ep.value.int_value, NULL)) AS STRING)
      ) AS completed_checkout_available,
      MAX(IF(ep.key = 'stay_realization_status', ep.value.string_value, NULL)) AS stay_realization_status
    FROM `your-project.analytics_123456789.events_*` AS e
    LEFT JOIN UNNEST(e.event_params) AS ep
    WHERE _TABLE_SUFFIX BETWEEN FORMAT_DATE('%Y%m%d', DATE_SUB(CURRENT_DATE(), INTERVAL 365 DAY))
                            AND FORMAT_DATE('%Y%m%d', CURRENT_DATE())
      AND event_name = 'purchase'
    GROUP BY
      event_date,
      event_timestamp,
      user_pseudo_id,
      ecommerce.transaction_id
  ),
  normalized AS (
    SELECT
      *,
      COALESCE(
        SAFE_CAST(booking_timestamp AS TIMESTAMP),
        event_timestamp
      ) AS normalized_booking_timestamp,
      SAFE.PARSE_DATE('%Y-%m-%d', check_in_date) AS normalized_check_in_date,
      SAFE.PARSE_DATE('%Y-%m-%d', check_out_date) AS normalized_check_out_date,
      COALESCE(
        stay_nights,
        DATE_DIFF(
          SAFE.PARSE_DATE('%Y-%m-%d', check_out_date),
          SAFE.PARSE_DATE('%Y-%m-%d', check_in_date),
          DAY
        )
      ) AS normalized_stay_nights,
      COALESCE(NULLIF(reserved_room_stays, 0), NULLIF(room_count, 0), 1) AS normalized_reserved_room_stays
    FROM purchase_events
  ),
  deduplicated AS (
    SELECT
      *,
      COALESCE(
        NULLIF(booked_room_nights, 0),
        normalized_stay_nights * normalized_reserved_room_stays
      ) AS normalized_booked_room_nights
    FROM normalized
    WHERE COALESCE(NULLIF(reservation_id, ''), NULLIF(transaction_id, '')) IS NOT NULL
      AND LOWER(COALESCE(booking_status, 'confirmed')) IN ('confirmed', 'completed', 'booked')
      AND LOWER(COALESCE(eligible_reservation, 'true')) IN ('true', '1', 'yes')
      AND LOWER(COALESCE(owned_digital_channel, 'true')) IN ('true', '1', 'yes')
      AND LOWER(COALESCE(reservation_completed, 'true')) IN ('true', '1', 'yes')
    QUALIFY ROW_NUMBER() OVER (
      PARTITION BY COALESCE(NULLIF(reservation_id, ''), NULLIF(transaction_id, ''))
      ORDER BY event_timestamp DESC
    ) = 1
  ),
  valid_reservations AS (
    SELECT *
    FROM deduplicated
    WHERE normalized_stay_nights > 0
      AND normalized_reserved_room_stays > 0
      AND normalized_booked_room_nights > 0
      AND normalized_check_in_date IS NOT NULL
      AND normalized_check_out_date IS NOT NULL
      AND normalized_check_out_date > normalized_check_in_date
  )
  SELECT
    DATE(normalized_booking_timestamp) AS booking_date,
    property_id,
    property_name,
    brand,
    chain_code,
    destination_city,
    destination_region,
    destination_country,
    market_code,
    COALESCE(channel, 'owned_digital') AS channel,
    platform,
    booking_engine,
    site_id,
    language,
    device_category,
    rate_plan_id,
    rate_plan_type,
    room_type_id,
    COUNT(*) AS reservation_count,
    SUM(normalized_reserved_room_stays) AS reserved_room_stays,
    SUM(normalized_booked_room_nights) AS booked_room_nights,
    SAFE_DIVIDE(
      SUM(normalized_booked_room_nights),
      SUM(normalized_reserved_room_stays)
    ) AS average_length_of_stay_nights
  FROM valid_reservations
  GROUP BY
    booking_date,
    property_id,
    property_name,
    brand,
    chain_code,
    destination_city,
    destination_region,
    destination_country,
    market_code,
    channel,
    platform,
    booking_engine,
    site_id,
    language,
    device_category,
    rate_plan_id,
    rate_plan_type,
    room_type_id
  ORDER BY booking_date DESC, property_id;


Google Analytics SQL: |
  -- ==========================================
  -- 1. GOOGLE BIGQUERY SQL
  -- ==========================================
  WITH event_parameter_pivot AS (
    SELECT
      PARSE_DATE('%Y%m%d', event_date) AS event_date,
      TIMESTAMP_MICROS(event_timestamp) AS event_timestamp,
      event_name,
      user_pseudo_id,
      user_id,
      platform,
      device.category AS device_category,
      device.operating_system,
      device.web_info.browser AS browser,
      geo.country,
      geo.region,
      geo.city,
      traffic_source.source,
      traffic_source.medium,
      traffic_source.name AS campaign,
      MAX(IF(ep.key = 'event_id', ep.value.string_value, NULL)) AS event_id,
      MAX(IF(ep.key = 'journey_session_id', ep.value.string_value, NULL)) AS journey_session_id,
      MAX(IF(ep.key = 'ga_session_id', COALESCE(CAST(ep.value.int_value AS STRING), ep.value.string_value), NULL)) AS ga_session_id_raw,
      MAX(IF(ep.key = 'ga_session_number', COALESCE(CAST(ep.value.int_value AS STRING), ep.value.string_value), NULL)) AS session_number_raw,
      MAX(IF(ep.key = 'page_location', ep.value.string_value, NULL)) AS page_location,
      MAX(IF(ep.key = 'page_title', ep.value.string_value, NULL)) AS page_title,
      MAX(IF(ep.key = 'page_referrer', ep.value.string_value, NULL)) AS page_referrer,
      MAX(IF(ep.key = 'language', ep.value.string_value, NULL)) AS language,
      MAX(IF(ep.key = 'search_id', ep.value.string_value, NULL)) AS search_id,
      MAX(IF(ep.key = 'search_term', ep.value.string_value, NULL)) AS search_term,
      MAX(IF(ep.key = 'search_origin', ep.value.string_value, NULL)) AS search_origin,
      MAX(IF(ep.key = 'search_destination', ep.value.string_value, NULL)) AS search_destination,
      MAX(IF(ep.key = 'departure_date', ep.value.string_value, NULL)) AS departure_date_raw,
      MAX(IF(ep.key = 'return_date', ep.value.string_value, NULL)) AS return_date_raw,
      MAX(IF(ep.key = 'trip_type', ep.value.string_value, NULL)) AS trip_type,
      MAX(IF(ep.key = 'traveler_count', COALESCE(CAST(ep.value.int_value AS STRING), ep.value.string_value), NULL)) AS traveler_count_raw,
      MAX(IF(ep.key = 'adult_count', COALESCE(CAST(ep.value.int_value AS STRING), ep.value.string_value), NULL)) AS adult_count_raw,
      MAX(IF(ep.key = 'child_count', COALESCE(CAST(ep.value.int_value AS STRING), ep.value.string_value), NULL)) AS child_count_raw,
      MAX(IF(ep.key = 'room_count', COALESCE(CAST(ep.value.int_value AS STRING), ep.value.string_value), NULL)) AS room_count_raw,
      MAX(IF(ep.key = 'search_results_count', COALESCE(CAST(ep.value.int_value AS STRING), ep.value.string_value), NULL)) AS search_results_count_raw,
      MAX(IF(ep.key = 'search_valid', COALESCE(ep.value.string_value, CAST(ep.value.int_value AS STRING)), NULL)) AS search_valid_raw,
      MAX(IF(ep.key = 'session_eligible', COALESCE(ep.value.string_value, CAST(ep.value.int_value AS STRING)), NULL)) AS session_eligible_raw,
      MAX(IF(ep.key = 'transaction_id', ep.value.string_value, NULL)) AS transaction_id,
      MAX(IF(ep.key = 'booking_status', ep.value.string_value, NULL)) AS booking_status,
      MAX(IF(ep.key = 'booking_validation', ep.value.string_value, NULL)) AS booking_validation,
      MAX(IF(ep.key = 'currency', ep.value.string_value, NULL)) AS currency,
      MAX(IF(ep.key = 'value', COALESCE(CAST(ep.value.double_value AS STRING), CAST(ep.value.float_value AS STRING), CAST(ep.value.int_value AS STRING), ep.value.string_value), NULL)) AS booking_value_raw,
      MAX(IF(ep.key = 'tax', COALESCE(CAST(ep.value.double_value AS STRING), CAST(ep.value.float_value AS STRING), CAST(ep.value.int_value AS STRING), ep.value.string_value), NULL)) AS tax_raw,
      MAX(IF(ep.key = 'shipping', COALESCE(CAST(ep.value.double_value AS STRING), CAST(ep.value.float_value AS STRING), CAST(ep.value.int_value AS STRING), ep.value.string_value), NULL)) AS shipping_raw,
      MAX(IF(ep.key = 'coupon', ep.value.string_value, NULL)) AS coupon,
      MAX(IF(ep.key = 'payment_type', ep.value.string_value, NULL)) AS payment_type,
      MAX(IF(ep.key = 'affiliation', ep.value.string_value, NULL)) AS affiliation
    FROM `your-project.analytics_123456789.events_*`
    LEFT JOIN UNNEST(event_params) AS ep
    WHERE _TABLE_SUFFIX BETWEEN FORMAT_DATE('%Y%m%d', DATE_SUB(CURRENT_DATE(), INTERVAL 90 DAY))
                            AND FORMAT_DATE('%Y%m%d', CURRENT_DATE())
      AND event_name IN ('search', 'view_search_results', 'purchase')
    GROUP BY
      event_date, event_timestamp, event_name, user_pseudo_id, user_id, platform,
      device_category, operating_system, browser, country, region, city,
      source, medium, campaign
  ),
  normalized_events AS (
    SELECT
      *,
      COALESCE(
        event_id,
        CONCAT(user_pseudo_id, '-', CAST(UNIX_MICROS(event_timestamp) AS STRING), '-', event_name)
      ) AS normalized_event_id,
      SAFE_CAST(ga_session_id_raw AS INT64) AS ga_session_id,
      SAFE_CAST(session_number_raw AS INT64) AS session_number,
      SAFE_CAST(departure_date_raw AS DATE) AS departure_date,
      SAFE_CAST(return_date_raw AS DATE) AS return_date,
      SAFE_CAST(traveler_count_raw AS INT64) AS traveler_count,
      SAFE_CAST(adult_count_raw AS INT64) AS adult_count,
      SAFE_CAST(child_count_raw AS INT64) AS child_count,
      SAFE_CAST(room_count_raw AS INT64) AS room_count,
      SAFE_CAST(search_results_count_raw AS INT64) AS search_results_count,
      LOWER(COALESCE(search_valid_raw, 'false')) IN ('true', '1') AS search_valid,
      LOWER(COALESCE(session_eligible_raw, 'false')) IN ('true', '1') AS session_eligible,
      SAFE_CAST(booking_value_raw AS NUMERIC) AS booking_value,
      SAFE_CAST(tax_raw AS NUMERIC) AS tax,
      SAFE_CAST(shipping_raw AS NUMERIC) AS shipping
    FROM event_parameter_pivot
  ),
  ranked_searches AS (
    SELECT
      *,
      COALESCE(search_id, normalized_event_id) AS search_key,
      ROW_NUMBER() OVER (
        PARTITION BY COALESCE(search_id, normalized_event_id)
        ORDER BY event_timestamp, normalized_event_id
      ) AS search_row_number
    FROM normalized_events
    WHERE event_name IN ('search', 'view_search_results')
      AND search_valid
      AND session_eligible
  ),
  searches AS (
    SELECT *
    FROM ranked_searches
    WHERE search_row_number = 1
  ),
  ranked_bookings AS (
    SELECT
      *,
      ROW_NUMBER() OVER (
        PARTITION BY transaction_id
        ORDER BY event_timestamp, normalized_event_id
      ) AS booking_row_number
    FROM normalized_events
    WHERE event_name = 'purchase'
      AND transaction_id IS NOT NULL
      AND search_id IS NOT NULL
      AND LOWER(COALESCE(booking_status, '')) = 'confirmed'
      AND LOWER(COALESCE(booking_validation, '')) = 'server_validated'
      AND search_valid
      AND session_eligible
  ),
  bookings AS (
    SELECT *
    FROM ranked_bookings
    WHERE booking_row_number = 1
  ),
  ranked_attribution AS (
    SELECT
      s.*,
      b.normalized_event_id AS booking_event_id,
      b.event_timestamp AS booking_timestamp,
      b.transaction_id,
      b.booking_status,
      b.booking_validation,
      b.currency,
      b.booking_value,
      b.tax,
      b.shipping,
      b.coupon,
      b.payment_type,
      b.affiliation,
      ROW_NUMBER() OVER (
        PARTITION BY s.search_key
        ORDER BY b.event_timestamp NULLS LAST, b.transaction_id
      ) AS attribution_row_number
    FROM searches AS s
    LEFT JOIN bookings AS b
      ON b.search_id = s.search_id
     AND b.event_timestamp >= s.event_timestamp
     AND b.event_timestamp <= TIMESTAMP_ADD(s.event_timestamp, INTERVAL 30 DAY)
  ),
  scored_searches AS (
    SELECT
      *,
      IF(transaction_id IS NOT NULL, 1, 0) AS converted_search,
      1 AS total_search
    FROM ranked_attribution
    WHERE attribution_row_number = 1
  ),
  daily_kpi AS (
    SELECT
      *,
      SUM(converted_search) OVER (PARTITION BY event_date) AS daily_converted_searches,
      SUM(total_search) OVER (PARTITION BY event_date) AS daily_total_valid_searches
    FROM scored_searches
  )
  SELECT
    event_date AS search_date,
    event_timestamp AS search_timestamp,
    normalized_event_id AS search_event_id,
    search_id,
    search_key,
    user_pseudo_id,
    user_id,
    journey_session_id,
    ga_session_id,
    session_number,
    platform,
    device_category,
    operating_system,
    browser,
    country,
    region,
    city,
    language,
    page_location,
    page_title,
    page_referrer,
    source,
    medium,
    campaign,
    search_term,
    search_origin,
    search_destination,
    departure_date,
    return_date,
    trip_type,
    traveler_count,
    adult_count,
    child_count,
    room_count,
    search_results_count,
    search_valid,
    session_eligible,
    booking_event_id,
    booking_timestamp,
    transaction_id,
    booking_status,
    booking_validation,
    currency,
    booking_value,
    tax,
    shipping,
    coupon,
    payment_type,
    affiliation,
    converted_search,
    total_search,
    daily_converted_searches,
    daily_total_valid_searches,
    SAFE_DIVIDE(daily_converted_searches, daily_total_valid_searches) AS search_to_booking_conversion_rate,
    100.0 * SAFE_DIVIDE(daily_converted_searches, daily_total_valid_searches) AS search_to_booking_conversion_percentage
  FROM daily_kpi
  ORDER BY search_date DESC, search_timestamp DESC;

AEP Query Service SQL: |
  -- ==========================================
  -- 2. ADOBE AEP QUERY SERVICE SQL
  -- ==========================================
  WITH normalized_events AS (
    SELECT
      CAST(timestamp AS TIMESTAMP) AS event_timestamp,
      CAST(timestamp AS DATE) AS event_date,
      eventType AS event_type,
      eventMergeId AS event_id,
      environment.type AS environment_type,
      web.webPageDetails.name AS page_name,
      web.webPageDetails.URL AS page_url,
      web.webPageDetails.siteSection AS site_section,
      web.webReferrer.URL AS referrer_url,
      _travel.session.sessionID AS session_id,
      _travel.session.sessionNumber AS session_number,
      _travel.session.eligible AS session_eligible,
      _travel.search.searchID AS search_id,
      _travel.search.searchTerm AS search_term,
      _travel.search.origin AS search_origin,
      _travel.search.destination AS search_destination,
      CAST(_travel.search.departureDate AS DATE) AS departure_date,
      CAST(_travel.search.returnDate AS DATE) AS return_date,
      _travel.search.tripType AS trip_type,
      _travel.search.travelerCount AS traveler_count,
      _travel.search.adultCount AS adult_count,
      _travel.search.childCount AS child_count,
      _travel.search.roomCount AS room_count,
      _travel.search.resultsCount AS search_results_count,
      _travel.search.valid AS search_valid,
      commerce.purchases.value AS purchase_value,
      commerce.order.purchaseID AS transaction_id,
      commerce.order.purchaseOrderNumber AS purchase_order_number,
      commerce.order.priceTotal AS booking_value,
      commerce.order.currencyCode AS currency,
      _travel.booking.status AS booking_status,
      _travel.booking.validation AS booking_validation,
      _travel.booking.affiliation AS affiliation,
      _travel.booking.couponCode AS coupon,
      _travel.booking.discountAmount AS discount_amount,
      _travel.booking.taxAmount AS tax_amount,
      CASE WHEN SIZE(commerce.order.payments) > 0 THEN commerce.order.payments[0].paymentType END AS payment_type,
      CASE WHEN SIZE(commerce.order.payments) > 0 THEN commerce.order.payments[0].transactionID END AS payment_transaction_id,
      CASE WHEN SIZE(commerce.order.payments) > 0 THEN commerce.order.payments[0].paymentAmount END AS payment_amount,
      CASE WHEN SIZE(commerce.order.payments) > 0 THEN commerce.order.payments[0].paymentCurrency END AS payment_currency,
      CASE WHEN SIZE(productListItems) > 0 THEN productListItems[0].SKU END AS first_item_sku,
      CASE WHEN SIZE(productListItems) > 0 THEN productListItems[0].name END AS first_item_name,
      CASE WHEN SIZE(productListItems) > 0 THEN productListItems[0].quantity END AS first_item_quantity,
      CASE WHEN SIZE(productListItems) > 0 THEN productListItems[0].priceTotal END AS first_item_price_total,
      CASE WHEN SIZE(productListItems) > 0 THEN productListItems[0].currencyCode END AS first_item_currency
    FROM your_aep_dataset
    WHERE CAST(timestamp AS DATE) BETWEEN current_date - INTERVAL '90' DAY AND current_date
      AND (
        eventType IN ('search', 'view_search_results', 'commerce.purchases')
        OR commerce.purchases.value > 0
      )
  ),
  search_candidates AS (
    SELECT
      *,
      COALESCE(search_id, event_id) AS search_key,
      ROW_NUMBER() OVER (
        PARTITION BY COALESCE(search_id, event_id)
        ORDER BY event_timestamp, event_id
      ) AS search_row_number
    FROM normalized_events
    WHERE event_type IN ('search', 'view_search_results')
      AND search_valid = true
      AND session_eligible = true
  ),
  searches AS (
    SELECT *
    FROM search_candidates
    WHERE search_row_number = 1
  ),
  booking_candidates AS (
    SELECT
      *,
      ROW_NUMBER() OVER (
        PARTITION BY transaction_id
        ORDER BY event_timestamp, event_id
      ) AS booking_row_number
    FROM normalized_events
    WHERE event_type = 'commerce.purchases'
      AND purchase_value > 0
      AND transaction_id IS NOT NULL
      AND search_id IS NOT NULL
      AND LOWER(booking_status) = 'confirmed'
      AND LOWER(booking_validation) = 'server_validated'
      AND search_valid = true
      AND session_eligible = true
  ),
  bookings AS (
    SELECT *
    FROM booking_candidates
    WHERE booking_row_number = 1
  ),
  attribution_candidates AS (
    SELECT
      s.*,
      b.event_id AS booking_event_id,
      b.event_timestamp AS booking_timestamp,
      b.transaction_id,
      b.purchase_order_number,
      b.booking_value,
      b.currency,
      b.booking_status,
      b.booking_validation,
      b.affiliation,
      b.coupon,
      b.discount_amount,
      b.tax_amount,
      b.payment_type,
      b.payment_transaction_id,
      b.payment_amount,
      b.payment_currency,
      b.first_item_sku,
      b.first_item_name,
      b.first_item_quantity,
      b.first_item_price_total,
      b.first_item_currency,
      ROW_NUMBER() OVER (
        PARTITION BY s.search_key
        ORDER BY CASE WHEN b.event_timestamp IS NULL THEN 1 ELSE 0 END, b.event_timestamp, b.transaction_id
      ) AS attribution_row_number
    FROM searches s
    LEFT JOIN bookings b
      ON b.search_id = s.search_id
     AND b.event_timestamp >= s.event_timestamp
     AND b.event_timestamp <= s.event_timestamp + INTERVAL '30' DAY
  ),
  scored_searches AS (
    SELECT
      *,
      CASE WHEN transaction_id IS NOT NULL THEN 1 ELSE 0 END AS converted_search,
      1 AS total_search
    FROM attribution_candidates
    WHERE attribution_row_number = 1
  ),
  daily_kpi AS (
    SELECT
      *,
      SUM(converted_search) OVER (PARTITION BY event_date) AS daily_converted_searches,
      SUM(total_search) OVER (PARTITION BY event_date) AS daily_total_valid_searches
    FROM scored_searches
  )
  SELECT
    event_date AS search_date,
    event_timestamp AS search_timestamp,
    event_id AS search_event_id,
    search_id,
    search_key,
    session_id,
    session_number,
    session_eligible,
    environment_type,
    page_name,
    page_url,
    site_section,
    referrer_url,
    search_term,
    search_origin,
    search_destination,
    departure_date,
    return_date,
    trip_type,
    traveler_count,
    adult_count,
    child_count,
    room_count,
    search_results_count,
    search_valid,
    booking_event_id,
    booking_timestamp,
    transaction_id,
    purchase_order_number,
    booking_status,
    booking_validation,
    booking_value,
    currency,
    affiliation,
    coupon,
    discount_amount,
    tax_amount,
    payment_type,
    payment_transaction_id,
    payment_amount,
    payment_currency,
    first_item_sku,
    first_item_name,
    first_item_quantity,
    first_item_price_total,
    first_item_currency,
    converted_search,
    total_search,
    daily_converted_searches,
    daily_total_valid_searches,
    CASE
      WHEN daily_total_valid_searches = 0 THEN NULL
      ELSE CAST(daily_converted_searches AS DOUBLE) / CAST(daily_total_valid_searches AS DOUBLE)
    END AS search_to_booking_conversion_rate,
    CASE
      WHEN daily_total_valid_searches = 0 THEN NULL
      ELSE 100.0 * CAST(daily_converted_searches AS DOUBLE) / CAST(daily_total_valid_searches AS DOUBLE)
    END AS search_to_booking_conversion_percentage
  FROM daily_kpi
  ORDER BY search_date DESC, search_timestamp DESC;

Calculation Notes: |
  1️⃣ Use sessions with at least one valid search-results event based on travel criteria.  
  2️⃣ Count each eligible search session once in both numerator and denominator.  
  3️⃣ A session converts only with a server-validated booking-confirmation event.  
  4️⃣ Apply a 30-minute inactivity rule for session definition; treat authenticated continuation as cross-session.  
  5️⃣ Include valid zero-result searches; exclude bots, tests, and unsupported traffic.  
  6️⃣ Assign conversion to the calendar date of the qualifying search session.  
  7️⃣ Deduplicate confirmations using booking reference and apply latest validated event status.

Business Use Case: |
  The Digital Product and Revenue Management teams monitor this rate by market, route or destination, device, platform, search-result status, and acquisition channel to identify where high-intent demand fails to reach confirmation. For example, if mobile conversion declines for searches returning limited inventory, leaders can prioritize availability messaging, ranking changes, alternative-date recommendations, checkout defect remediation, or targeted merchandising and then measure whether the intervention increases confirmed bookings without degrading booking value.



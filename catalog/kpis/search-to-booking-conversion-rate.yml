KPI Name: Search-to-Booking Conversion Rate
Formula: (Distinct Eligible Search Sessions with at Least One Confirmed Booking / Distinct Eligible Search Sessions) × 100

Description: |
  Measures the percentage of eligible digital sessions containing at least one valid travel search that result in a confirmed booking during the same session. It quantifies how effectively the digital discovery and booking journey converts demonstrated search intent into completed reservations.

Category: Conversion

Tags: [kpi]

Industry: [Travel & Hospitality]

Priority: High

Core Area: Discovery

Scope: Session

Measure Type: percentage

Aggregation Window: Time based - Daily


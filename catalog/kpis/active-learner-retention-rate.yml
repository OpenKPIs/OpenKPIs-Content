# KPI: Active Learner Retention Rate
# Generated: 2026-09-19T22:39:39.345Z
# Contributed by: devyendarm
# Last modified by: devyendarm

KPI Name: Active Learner Retention Rate
Formula: (COUNT DISTINCT user_id active in Period P−1 AND active in Period P ÷ COUNT DISTINCT user_id active in Period P−1) × 100, where active = at least 1 qualifying learning activity within the period: video_progress (content_type = 'video' AND engaged_seconds >= 10), video_complete (content_type = 'video'), tutorial_complete (content_type IN lesson, module, course) or form_submit (form_type IN assessment, assignment); live-session attendance and partial text-lesson progress are not counted; learners first active in P are excluded from both terms; both terms are counted excluding learners whose access ended by design between the start of P−1 and the end of P with no entitlement continuing past P

Description: |
  Education specialisation of the canonical Customer Retention Rate (customer-retention-rate): the percentage of learners who were active in the previous period (week, month or quarter) and completed at least one qualifying learning activity again in the current period. Because new learners are excluded from both sides of the ratio, it shows whether the platform keeps its existing learner base engaged regardless of acquisition volume, and it is the main leading indicator for course completion, subscription renewal and B2B seat utilisation.

Category: Retention

Tags: [kpi, Education: EdTech & E-Learning]

Industry: [["Education"]]

Priority: High

Core Area: Engagement

Scope: User

Measure Type: Percentage

Aggregation Window: Weekly, Monthly, Quarterly


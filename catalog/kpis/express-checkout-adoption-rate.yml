Google Analytics SQL: |
  -- ==========================================
  -- 1. GOOGLE BIGQUERY SQL
  -- ==========================================
  DECLARE start_date DATE DEFAULT DATE_SUB(CURRENT_DATE(), INTERVAL 90 DAY);
  DECLARE end_date DATE DEFAULT DATE_SUB(CURRENT_DATE(), INTERVAL 1 DAY);
  
  -- Test orders carry no flag in the purchase data layer; exclude them at collection or join a test-order list here.
  -- Purchase hits in the period (event_date is in the property time zone); refunds and cancellations are kept
  WITH purchase_hits AS (
    SELECT
      event_timestamp,
      IF(platform = 'WEB', 'web', 'app') AS channel,
      ecommerce.transaction_id AS transaction_id,
      LOWER((SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'checkout_type')) AS checkout_type,
      LOWER((SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'traffic_type')) AS traffic_type,
      (SELECT COALESCE(value.double_value, value.float_value, CAST(value.int_value AS FLOAT64)) FROM UNNEST(event_params) WHERE key = 'value') AS order_value
    FROM `your-project.analytics_123456789.events_*`
    WHERE _TABLE_SUFFIX BETWEEN FORMAT_DATE('%Y%m%d', start_date) AND FORMAT_DATE('%Y%m%d', end_date)
      AND event_name = 'purchase'
      AND ecommerce.transaction_id IS NOT NULL
  ),
  -- One row per transaction_id: the first purchase hit carries the flow the order completed in
  orders AS (
    SELECT *
    FROM purchase_hits
    QUALIFY ROW_NUMBER() OVER (PARTITION BY transaction_id ORDER BY event_timestamp) = 1
  )
  -- Express orders over all completed orders, excluding internal traffic and zero-value orders, web and app separately
  SELECT
    channel,
    COUNTIF(checkout_type = 'express') AS express_orders,
    COUNT(*) AS total_completed_orders,
    ROUND(SAFE_DIVIDE(COUNTIF(checkout_type = 'express'), COUNT(*)) * 100, 2) AS express_checkout_adoption_rate_pct
  FROM orders
  WHERE COALESCE(traffic_type, '') != 'internal'
    AND order_value > 0
  GROUP BY channel
  ORDER BY channel;

AEP Query Service SQL: |
  -- ==========================================
  -- 2. ADOBE AEP QUERY SERVICE SQL
  -- ==========================================
  -- Test orders carry no flag in the purchase data layer; exclude them at collection or join a test-order list here.
  -- Purchase hits in the last 90 complete days, dated in the property time zone; refunds and cancellations are kept
  WITH purchase_hits AS (
    SELECT
      e.timestamp AS event_ts,
      CASE WHEN e.environment.type = 'application' THEN 'app' ELSE 'web' END AS channel,
      e.commerce.order.purchaseID AS transaction_id,
      LOWER(e._experience.analytics.customDimensions.eVars.eVar1) AS checkout_type,
      LOWER(e._experience.analytics.customDimensions.eVars.eVar5) AS traffic_type,
      e.commerce.order.priceTotal AS order_value
    FROM aep_web_events_dataset AS e
    WHERE e.commerce.purchases.value > 0
      AND e.commerce.order.purchaseID IS NOT NULL
      AND to_date(from_utc_timestamp(e.timestamp, 'America/New_York')) BETWEEN date_sub(current_date(), 90) AND date_sub(current_date(), 1)
  ),
  -- One row per transaction_id: the first purchase hit carries the flow the order completed in
  orders AS (
    SELECT *
    FROM (
      SELECT p.*, ROW_NUMBER() OVER (PARTITION BY transaction_id ORDER BY event_ts) AS rn
      FROM purchase_hits AS p
    ) AS ranked
    WHERE rn = 1
  )
  -- Express orders over all completed orders, excluding internal traffic and zero-value orders, web and app separately
  SELECT
    channel,
    SUM(CASE WHEN checkout_type = 'express' THEN 1 ELSE 0 END) AS express_orders,
    COUNT(*) AS total_completed_orders,
    ROUND(100.0 * SUM(CASE WHEN checkout_type = 'express' THEN 1 ELSE 0 END) / NULLIF(COUNT(*), 0), 2) AS express_checkout_adoption_rate_pct
  FROM orders
  WHERE COALESCE(traffic_type, '') != 'internal'
    AND order_value > 0
  GROUP BY channel
  ORDER BY channel;

Calculation Notes: |
  1️⃣ Numerator: distinct transaction_id on purchase where checkout_type = express; express-checkout-method names the wallet used.
  2️⃣ Denominator: all distinct purchase transaction_id in the same period and channels, express and standard together.
  3️⃣ Classify by the flow the order completed in: an express flow abandoned and finished through standard checkout counts as standard.
  4️⃣ A wallet picked at the payment step of standard checkout is not express; only accelerated buttons that skip address and shipping steps count.
  5️⃣ Dedupe purchases on transaction_id; exclude internal traffic (traffic_type) and zero-value replacement orders.
  6️⃣ Digital orders only; call-center and in-store orders are excluded. Report web and app separately, as wallet availability differs by device.
  7️⃣ Order date = purchase timestamp in the property time zone; later cancellations and refunds stay in both numerator and denominator.

Business Use Case: |
  1️⃣ Product (Checkout): rate stalls below target → move express buttons above the fold on cart and product pages.
  2️⃣ Payments team: one wallet's share drops after an SDK release → check checkout_error by payment_provider, roll back.
  3️⃣ E-commerce Director: mobile rate lags desktop → A/B test express buttons on the mobile product page.
  4️⃣ Finance: express share rises → re-forecast wallet processing fees and chargeback reserves.


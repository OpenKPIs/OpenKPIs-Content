KPI Name: Express Checkout Adoption Rate
Formula: (Orders Completed via Express Checkout / Total Completed Orders) × 100

Description: |
  Share of completed web and app orders placed through an express checkout such as Shop Pay, Apple Pay, Google Pay or PayPal Express. Shows how many shoppers skip the standard multi-step checkout.


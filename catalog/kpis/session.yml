KPI Name: Session
Formula: COUNT(Session ID)

Description: |
  A session represents a group of user interactions with a website that take place within a given time frame. It is essential for understanding user behavior and engagement.

Category: Engagement

Tags: [user behavior, website, analytics]

Industry: [["Retail","E-commerce","SaaS","Media","Technology"]]

Priority: High

Core Area: Digital Analytics

Scope: Session

Measure Type: count

Aggregation Window: Session, Time based - Hourly/Daily/Monthly/Yearly

GA4 Event: |
  session_start

Adobe Event: |
  sessionStart

W3 Data Layer: |
  {"event":"sessionStart","session":{"sessionID":"s123","startTime":"2023-10-01T10:00:00Z"}}

GA4 Data Layer: |
  {"event":"session_start","session_id":"s123"}

Adobe Client Data Layer: |
  {"event":"sessionStarted","eventInfo":{"eventName":"sessionStarted"},"session":{"sessionID":"s123"}}

XDM Mapping: |
  {"eventType":"web.sessions","web":{"sessions":{"value":1}}}

SQL Query: |
  SELECT COUNT(DISTINCT session_id) AS sessions FROM user_interactions WHERE interaction_date BETWEEN '2023-01-01' AND '2023-12-31'

Calculation Notes: |
  Sessions typically expire after 30 minutes of inactivity; adjust for time zone differences.

Business Use Case: |
  Product teams analyze Sessions to understand peak usage times and optimize server resources.

Dependencies: |
  session_start

Source Data: Digital Analytics

Report Attributes: |
  Sessions, User, Duration

Dashboard Usage: [Traffic Analysis, User Behavior]

Segment Eligibility: |
  true

Related KPIs: [Page Views, Bounce Rate]

Data Sensitivity: public

Contains PII: No


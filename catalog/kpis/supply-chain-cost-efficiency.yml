# Last modified by: devyendarm

KPI Name: Supply Chain Cost Efficiency
Formula: (Total Supply Chain Costs / Value of Goods Delivered) × 100

Description: |
  Measures the effectiveness of cost management in the supply chain by comparing total supply chain costs to the value of goods delivered.

Category: Efficiency

Tags: [kpi]

Industry: [Logistics & Supply Chain]

Priority: High

Core Area: Generic

Scope: Global

Measure Type: percentage

Aggregation Window: Time based - Monthly







Google Analytics SQL: |
  -- ==========================================
  -- 1. GOOGLE BIGQUERY SQL
  -- ==========================================
  SELECT 
      SUM(cost) / SUM(revenue) AS supply_chain_cost_efficiency
  FROM 
      `your-project.erp.supply_chain_data`
  WHERE 
      date BETWEEN '2023-01-01' AND '2023-12-31';

AEP Query Service SQL: |
  -- ==========================================
  -- 2. ADOBE AEP QUERY SERVICE SQL
  -- ==========================================
  SELECT 
      SUM(cost) / SUM(revenue) AS supply_chain_cost_efficiency
  FROM 
      aep_backend_dataset.supply_chain_data
  WHERE 
      date BETWEEN '2023-01-01' AND '2023-12-31';

Calculation Notes: |
  Exclude non-operational costs; consider currency fluctuations in international operations.

Business Use Case: |
  Executives use this KPI to identify cost-saving opportunities and optimize supply chain operations.


Source Data: ERP

Report Attributes: |
  ["Region","Product Category","Time Period"]

Dashboard Usage: [Supply Chain Performance Dashboard, Executive Summary Dashboard]

Segment Eligibility: |

KPI Name: Return to Origin Rate
Formula: (Shipments Returned to Origin / Shipments Dispatched) × 100

Description: |
  Share of shipments dispatched in the period that the carrier sent back to the seller undelivered, after failed attempts or refusal. Each RTO costs forward and reverse freight with no sale.


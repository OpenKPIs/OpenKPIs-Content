KPI Name: Net Revenue Retention
Formula: ((Starting Cohort MRR + Expansion MRR - Contraction MRR - Churned MRR) / Starting Cohort MRR) × 100

Description: |
  Recurring subscription revenue kept from subscribers active at period start, after expansion, contraction and churn, as a share of their starting revenue. New subscribers and one-time orders are excluded.

Category: Retention


























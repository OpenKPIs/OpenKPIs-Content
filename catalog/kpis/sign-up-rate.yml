SQL Query: |
  WITH visitors AS (SELECT COUNT(DISTINCT user_pseudo_id) AS users FROM `project.dataset.events_*`), signups AS (SELECT COUNT(DISTINCT user_pseudo_id) AS signup_users FROM `project.dataset.events_*` WHERE event_name = 'sign_up') SELECT SAFE_DIVIDE(signup_users, users) * 100 AS sign_up_rate FROM visitors, signups;

Calculation Notes: |
  Count completed registrations, not form starts. Deduplicate multiple sign_up events from the same user within the reporting period. Exclude existing logged-in users if the KPI is intended for new account creation only.

Business Use Case: |
  A product team compares sign-up rate across onboarding variants to identify which messaging and form design produces the most new accounts.


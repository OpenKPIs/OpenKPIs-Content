KPI Name: Sign Up Rate
Formula: (Sign Ups / Eligible Visitors or Sessions) × 100

Description: |
  Sign Up Rate measures the percentage of eligible visitors or sessions that create an account. It indicates how effectively acquisition, onboarding, and value messaging convert anonymous users into known users.

Category: Conversion

Tags: [sign-up, registration, account, onboarding, acquisition]

Industry: [["SaaS, Retail, E-commerce"]]

Priority: High

Core Area: Digital Analytics

Scope: User

Measure Type: percentage

Aggregation Window: Session, User, Time based - Daily/Weekly/Monthly/Yearly


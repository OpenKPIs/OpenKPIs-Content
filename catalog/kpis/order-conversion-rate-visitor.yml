KPI Name: Order Conversion Rate (Visitor)
Formula: (Unique Visitors with >=1 Order / Unique Visitors) × 100

Description: |
  Order conversion rate (visitor) measures the percentage of unique visitors who place at least one order during the selected reporting period. It is a core e-commerce KPI for evaluating how effectively traffic is converted into purchasing customers at the visitor level rather than the session level.

Category: Conversion


Industry: [["Retail, E-commerce"]]

Priority: High

Core Area: Digital Analytics

Scope: User

Measure Type: Percentage

Aggregation Window: User, Daily, Yearly, Monthly, Quarterly, Weekly


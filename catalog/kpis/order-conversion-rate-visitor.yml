SQL Query: |
  WITH visitors AS (
    SELECT
      user_pseudo_id AS visitor_id
    FROM `project.dataset.events_*`
    WHERE event_name = 'session_start'
      AND _TABLE_SUFFIX BETWEEN '20260501' AND '20260531'
    GROUP BY 1
  ), purchasers AS (
    SELECT
      user_pseudo_id AS visitor_id
    FROM `project.dataset.events_*`
    WHERE event_name = 'purchase'
      AND _TABLE_SUFFIX BETWEEN '20260501' AND '20260531'
    GROUP BY 1
  )
  SELECT
    COUNT(DISTINCT p.visitor_id) AS purchasing_visitors,
    COUNT(DISTINCT v.visitor_id) AS total_visitors,
    SAFE_MULTIPLY(SAFE_DIVIDE(COUNT(DISTINCT p.visitor_id), COUNT(DISTINCT v.visitor_id)), 100) AS order_conversion_rate_visitor
  FROM visitors v
  LEFT JOIN purchasers p
    ON v.visitor_id = p.visitor_id;

Calculation Notes: |
  1) Use a consistent visitor identifier such as GA4 user_pseudo_id, Adobe ECID, or a first-party visitor ID. 
  2) Count each visitor only once in the numerator even if they place multiple orders in the period. 
  3) Exclude internal traffic, bots, QA environments, and invalid or refunded test orders where appropriate. 
  4) Define the denominator carefully: typically all unique visitors with at least one qualifying session in the period. 
  5) Cross-device identity stitching may materially change the result if implemented.

Business Use Case: |
  An e-commerce growth team monitors visitor-level order conversion rate by device, channel, and landing page. If mobile paid social traffic shows high visitor volume but low conversion, the team can investigate checkout friction, page speed, or audience quality and prioritize CRO tests to improve purchasing efficiency.


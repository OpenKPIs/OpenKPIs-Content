KPI Name: Time to Close
Formula: (Sum of Time from Inquiry to Close for All Transactions) / (Number of Closed Transactions)

Description: |
  Measures the average duration from the initiation of a property inquiry to the final closing of the sale. It reflects the efficiency of the sales process in converting inquiries into closed deals.

Category: Conversion

Tags: [kpi]

Industry: [Real Estate Tech]

Priority: High

Core Area: Generic

Scope: Session

Measure Type: average

Aggregation Window: Time based - Daily


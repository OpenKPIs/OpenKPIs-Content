Google Analytics SQL: |
  -- ==========================================
  -- 1. GOOGLE BIGQUERY SQL (GA4 Export)
  -- ==========================================
  SELECT user_id, TIMESTAMP_DIFF(CLOSE_TIMESTAMP, OPEN_TIMESTAMP, SECOND) AS time_to_close
  FROM (
    SELECT user_id,
      MAX(CASE WHEN event_name = 'open_event' THEN event_timestamp END) AS OPEN_TIMESTAMP,
      MAX(CASE WHEN event_name = 'close_event' THEN event_timestamp END) AS CLOSE_TIMESTAMP
    FROM `your-project.analytics_123456789.events_*`,
    UNNEST(event_params) AS params
    WHERE event_name IN ('open_event', 'close_event')
    GROUP BY user_id
  )
  WHERE OPEN_TIMESTAMP IS NOT NULL AND CLOSE_TIMESTAMP IS NOT NULL;

AEP Query Service SQL: |
  -- ==========================================
  -- 2. ADOBE AEP QUERY SERVICE SQL (XDM Dataset)
  -- ==========================================
  SELECT userID, DATEDIFF(SECOND, OPEN_TIMESTAMP, CLOSE_TIMESTAMP) AS time_to_close
  FROM (
    SELECT userID,
      MAX(CASE WHEN eventType = 'open_event' THEN timestamp END) AS OPEN_TIMESTAMP,
      MAX(CASE WHEN eventType = 'close_event' THEN timestamp END) AS CLOSE_TIMESTAMP
    FROM xdm_dataset
    WHERE eventType IN ('open_event', 'close_event')
    GROUP BY userID
  )
  WHERE OPEN_TIMESTAMP IS NOT NULL AND CLOSE_TIMESTAMP IS NOT NULL;

Calculation Notes: |
  Exclude transactions that are canceled or withdrawn. Consider timezone differences and ensure consistent date formats.

Business Use Case: |
  Executives use this KPI to identify bottlenecks in the sales process and implement strategies to reduce the time to close, thereby increasing overall sales efficiency.



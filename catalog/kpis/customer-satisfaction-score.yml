KPI Name: Customer Satisfaction Score
Formula: (Survey Responses Rated 4 or 5 on the 5-Point Scale / Total Completed Survey Responses) × 100

Description: |
  Customer Satisfaction Score is the percentage of post-interaction survey respondents who rate a support, chat or return experience in the top-2 box — 4 (Satisfied) or 5 (Very Satisfied) — of the standard 5-point satisfaction scale, measured against the full base of respondents in the reporting window. It is the canonical, cross-industry satisfaction definition that the published Guest Satisfaction Score (Hospitality) specialises, and surveys fielded on 1–7 or 1–10 scales are deliberately excluded from this KPI rather than rescaled so values stay comparable across channels, vendors and external benchmarks such as ACSI.


  -- ==========================================
  -- 1. GOOGLE BIGQUERY SQL
  -- ==========================================
  WITH raw_events AS (
    SELECT
      e.event_timestamp AS ga4_event_timestamp,
      e.event_bundle_sequence_id,
      e.user_pseudo_id,
      MAX(IF(ep.key = 'complaint_id', ep.value.string_value, NULL)) AS complaint_id,
      MAX(IF(ep.key = 'complaint_version', COALESCE(ep.value.string_value, CAST(ep.value.int_value AS STRING)), NULL)) AS complaint_version,
      MAX(IF(ep.key = 'complaint_status', ep.value.string_value, NULL)) AS complaint_status,
      MAX(IF(ep.key = 'lifecycle_stage', ep.value.string_value, NULL)) AS lifecycle_stage,
      MAX(IF(ep.key = 'lifecycle_event_type', ep.value.string_value, NULL)) AS lifecycle_event_type,
      MAX(IF(ep.key = 'lifecycle_event_timestamp', ep.value.string_value, NULL)) AS lifecycle_event_timestamp,
      MAX(IF(ep.key = 'submitted_timestamp', ep.value.string_value, NULL)) AS submitted_timestamp,
      MAX(IF(ep.key = 'acknowledged_timestamp', ep.value.string_value, NULL)) AS acknowledged_timestamp,
      MAX(IF(ep.key = 'first_response_timestamp', ep.value.string_value, NULL)) AS first_response_timestamp,
      MAX(IF(ep.key = 'resolution_timestamp', ep.value.string_value, NULL)) AS resolution_timestamp,
      MAX(IF(ep.key = 'verification_timestamp', ep.value.string_value, NULL)) AS verification_timestamp,
      MAX(IF(ep.key = 'closed_timestamp', ep.value.string_value, NULL)) AS closed_timestamp,
      MAX(IF(ep.key = 'resolution_horizon_start_timestamp', ep.value.string_value, NULL)) AS resolution_horizon_start_timestamp,
      MAX(IF(ep.key = 'resolution_horizon_due_timestamp', ep.value.string_value, NULL)) AS resolution_horizon_due_timestamp,
      MAX(IF(ep.key = 'resolution_horizon_hours', COALESCE(ep.value.string_value, CAST(ep.value.int_value AS STRING)), NULL)) AS resolution_horizon_hours,
      MAX(IF(ep.key = 'eligibility_evaluated_timestamp', ep.value.string_value, NULL)) AS eligibility_evaluated_timestamp,
      MAX(IF(ep.key = 'eligible', COALESCE(ep.value.string_value, CAST(ep.value.int_value AS STRING)), NULL)) AS eligible,
      MAX(IF(ep.key = 'eligibility_reason_code', ep.value.string_value, NULL)) AS eligibility_reason_code,
      MAX(IF(ep.key = 'verified_resolution', COALESCE(ep.value.string_value, CAST(ep.value.int_value AS STRING)), NULL)) AS verified_resolution,
      MAX(IF(ep.key = 'verification_status', ep.value.string_value, NULL)) AS verification_status,
      MAX(IF(ep.key = 'verification_method', ep.value.string_value, NULL)) AS verification_method,
      MAX(IF(ep.key = 'verified_by_type', ep.value.string_value, NULL)) AS verified_by_type,
      MAX(IF(ep.key = 'resolution_code', ep.value.string_value, NULL)) AS resolution_code,
      MAX(IF(ep.key = 'resolution_category', ep.value.string_value, NULL)) AS resolution_category,
      MAX(IF(ep.key = 'resolution_outcome', ep.value.string_value, NULL)) AS resolution_outcome,
      MAX(IF(ep.key = 'resolution_stability_status', ep.value.string_value, NULL)) AS resolution_stability_status,
      MAX(IF(ep.key = 'stability_window_hours', COALESCE(ep.value.string_value, CAST(ep.value.int_value AS STRING)), NULL)) AS stability_window_hours,
      MAX(IF(ep.key = 'stable_through_timestamp', ep.value.string_value, NULL)) AS stable_through_timestamp,
      MAX(IF(ep.key = 'reopened', COALESCE(ep.value.string_value, CAST(ep.value.int_value AS STRING)), NULL)) AS reopened,
      MAX(IF(ep.key = 'reopen_count', COALESCE(ep.value.string_value, CAST(ep.value.int_value AS STRING)), NULL)) AS reopen_count,
      MAX(IF(ep.key = 'administrative_close', COALESCE(ep.value.string_value, CAST(ep.value.int_value AS STRING)), NULL)) AS administrative_close,
      MAX(IF(ep.key = 'within_resolution_horizon', COALESCE(ep.value.string_value, CAST(ep.value.int_value AS STRING)), NULL)) AS within_resolution_horizon,
      MAX(IF(ep.key = 'resolution_duration_seconds', COALESCE(ep.value.string_value, CAST(ep.value.int_value AS STRING)), NULL)) AS resolution_duration_seconds,
      MAX(IF(ep.key = 'time_to_first_response_seconds', COALESCE(ep.value.string_value, CAST(ep.value.int_value AS STRING)), NULL)) AS time_to_first_response_seconds,
      MAX(IF(ep.key = 'submission_channel', ep.value.string_value, NULL)) AS submission_channel,
      MAX(IF(ep.key = 'resolution_channel', ep.value.string_value, NULL)) AS resolution_channel,
      MAX(IF(ep.key = 'platform', ep.value.string_value, NULL)) AS platform,
      MAX(IF(ep.key = 'digital_property_id', ep.value.string_value, NULL)) AS digital_property_id,
      MAX(IF(ep.key = 'authenticated', COALESCE(ep.value.string_value, CAST(ep.value.int_value AS STRING)), NULL)) AS authenticated,
      MAX(IF(ep.key = 'guest_id_pseudonymous', ep.value.string_value, NULL)) AS guest_id_pseudonymous,
      MAX(IF(ep.key = 'session_id', ep.value.string_value, NULL)) AS session_id,
      MAX(IF(ep.key = 'interaction_id', ep.value.string_value, NULL)) AS interaction_id,
      MAX(IF(ep.key = 'service_location_id', ep.value.string_value, NULL)) AS service_location_id,
      MAX(IF(ep.key = 'market', ep.value.string_value, NULL)) AS market,
      MAX(IF(ep.key = 'country_code', ep.value.string_value, NULL)) AS country_code,
      MAX(IF(ep.key = 'language_code', ep.value.string_value, NULL)) AS language_code,
      MAX(IF(ep.key = 'complaint_category', ep.value.string_value, NULL)) AS complaint_category,
      MAX(IF(ep.key = 'complaint_subcategory', ep.value.string_value, NULL)) AS complaint_subcategory,
      MAX(IF(ep.key = 'severity_code', ep.value.string_value, NULL)) AS severity_code
    FROM `your-project.analytics_123456789.events_*` AS e
    CROSS JOIN UNNEST(e.event_params) AS ep
    WHERE _TABLE_SUFFIX BETWEEN FORMAT_DATE('%Y%m%d', DATE_SUB(CURRENT_DATE(), INTERVAL 90 DAY))
                            AND FORMAT_DATE('%Y%m%d', CURRENT_DATE())
      AND e.event_name = 'conversion'
    GROUP BY
      e.event_timestamp,
      e.event_bundle_sequence_id,
      e.user_pseudo_id
  ),
  typed_events AS (
    SELECT
      complaint_id,
      SAFE_CAST(complaint_version AS INT64) AS complaint_version,
      complaint_status,
      lifecycle_stage,
      lifecycle_event_type,
      COALESCE(SAFE_CAST(lifecycle_event_timestamp AS TIMESTAMP), TIMESTAMP_MICROS(ga4_event_timestamp)) AS lifecycle_event_timestamp,
      SAFE_CAST(submitted_timestamp AS TIMESTAMP) AS submitted_timestamp,
      SAFE_CAST(acknowledged_timestamp AS TIMESTAMP) AS acknowledged_timestamp,
      SAFE_CAST(first_response_timestamp AS TIMESTAMP) AS first_response_timestamp,
      SAFE_CAST(resolution_timestamp AS TIMESTAMP) AS resolution_timestamp,
      SAFE_CAST(verification_timestamp AS TIMESTAMP) AS verification_timestamp,
      SAFE_CAST(closed_timestamp AS TIMESTAMP) AS closed_timestamp,
      SAFE_CAST(resolution_horizon_start_timestamp AS TIMESTAMP) AS resolution_horizon_start_timestamp,
      SAFE_CAST(resolution_horizon_due_timestamp AS TIMESTAMP) AS resolution_horizon_due_timestamp,
      SAFE_CAST(resolution_horizon_hours AS INT64) AS resolution_horizon_hours,
      SAFE_CAST(eligibility_evaluated_timestamp AS TIMESTAMP) AS eligibility_evaluated_timestamp,
      LOWER(eligible) IN ('true', '1') AS eligible,
      eligibility_reason_code,
      LOWER(verified_resolution) IN ('true', '1') AS verified_resolution,
      verification_status,
      verification_method,
      verified_by_type,
      resolution_code,
      resolution_category,
      resolution_outcome,
      resolution_stability_status,
      SAFE_CAST(stability_window_hours AS INT64) AS stability_window_hours,
      SAFE_CAST(stable_through_timestamp AS TIMESTAMP) AS stable_through_timestamp,
      LOWER(reopened) IN ('true', '1') AS reopened,
      SAFE_CAST(reopen_count AS INT64) AS reopen_count,
      LOWER(administrative_close) IN ('true', '1') AS administrative_close,
      LOWER(within_resolution_horizon) IN ('true', '1') AS within_resolution_horizon,
      SAFE_CAST(resolution_duration_seconds AS INT64) AS resolution_duration_seconds,
      SAFE_CAST(time_to_first_response_seconds AS INT64) AS time_to_first_response_seconds,
      submission_channel,
      resolution_channel,
      platform,
      digital_property_id,
      LOWER(authenticated) IN ('true', '1') AS authenticated,
      guest_id_pseudonymous,
      session_id,
      interaction_id,
      service_location_id,
      market,
      country_code,
      language_code,
      complaint_category,
      complaint_subcategory,
      severity_code,
      ga4_event_timestamp,
      event_bundle_sequence_id
    FROM raw_events
    WHERE complaint_id IS NOT NULL
  ),
  version_deduplicated AS (
    SELECT *
    FROM typed_events
    QUALIFY ROW_NUMBER() OVER (
      PARTITION BY complaint_id, complaint_version, lifecycle_event_type
      ORDER BY lifecycle_event_timestamp DESC, ga4_event_timestamp DESC, event_bundle_sequence_id DESC
    ) = 1
  ),
  latest_complaint_state AS (
    SELECT
      *,
      COALESCE(
        resolution_horizon_due_timestamp,
        TIMESTAMP_ADD(resolution_horizon_start_timestamp, INTERVAL resolution_horizon_hours HOUR)
      ) AS effective_resolution_horizon_due_timestamp
    FROM version_deduplicated
    QUALIFY ROW_NUMBER() OVER (
      PARTITION BY complaint_id
      ORDER BY complaint_version DESC, lifecycle_event_timestamp DESC, ga4_event_timestamp DESC
    ) = 1
  ),
  scored_complaints AS (
    SELECT
      *,
      1 AS denominator_complaint,
      IF(
        verified_resolution
        AND LOWER(verification_status) = 'verified'
        AND LOWER(verified_by_type) = 'guest'
        AND resolution_timestamp IS NOT NULL
        AND resolution_timestamp <= effective_resolution_horizon_due_timestamp
        AND within_resolution_horizon
        AND NOT administrative_close
        AND NOT reopened
        AND COALESCE(reopen_count, 0) = 0
        AND LOWER(resolution_outcome) = 'completed_stable'
        AND LOWER(resolution_stability_status) = 'stable'
        AND stable_through_timestamp <= CURRENT_TIMESTAMP(),
        1,
        0
      ) AS resolved_complaint
    FROM latest_complaint_state
    WHERE eligible
      AND submitted_timestamp >= TIMESTAMP(DATE_SUB(CURRENT_DATE(), INTERVAL 90 DAY))
      AND submitted_timestamp < TIMESTAMP(DATE_ADD(CURRENT_DATE(), INTERVAL 1 DAY))
      AND effective_resolution_horizon_due_timestamp <= CURRENT_TIMESTAMP()
  )
  SELECT
    DATE(submitted_timestamp) AS complaint_submission_date,
    market,
    country_code,
    language_code,
    submission_channel,
    platform,
    digital_property_id,
    service_location_id,
    complaint_category,
    complaint_subcategory,
    severity_code,
    COUNT(*) AS eligible_guest_complaints,
    COUNTIF(resolved_complaint = 1) AS resolved_guest_complaints,
    SAFE_DIVIDE(COUNTIF(resolved_complaint = 1), COUNT(*)) AS guest_complaint_resolution_rate,
    ROUND(100 * SAFE_DIVIDE(COUNTIF(resolved_complaint = 1), COUNT(*)), 2) AS guest_complaint_resolution_rate_pct
  FROM scored_complaints
  GROUP BY
    complaint_submission_date,
    market,
    country_code,
    language_code,
    submission_channel,
    platform,
    digital_property_id,
    service_location_id,
    complaint_category,
    complaint_subcategory,
    severity_code
  ORDER BY complaint_submission_date DESC, market, country_code, submission_channel;

AEP Query Service SQL: |
  -- ==========================================
  -- 2. ADOBE AEP QUERY SERVICE SQL
  -- ==========================================
  WITH normalized_events AS (
    SELECT
      _guestCare.complaint.complaintId AS complaint_id,
      CAST(_guestCare.complaint.complaintVersion AS BIGINT) AS complaint_version,
      _guestCare.complaint.complaintStatus AS complaint_status,
      _guestCare.complaint.lifecycleStage AS lifecycle_stage,
      _guestCare.complaint.lifecycleEventType AS lifecycle_event_type,
      COALESCE(CAST(_guestCare.complaint.lifecycleEventTimestamp AS TIMESTAMP), CAST(timestamp AS TIMESTAMP)) AS lifecycle_event_timestamp,
      CAST(_guestCare.complaint.submittedTimestamp AS TIMESTAMP) AS submitted_timestamp,
      CAST(_guestCare.complaint.acknowledgedTimestamp AS TIMESTAMP) AS acknowledged_timestamp,
      CAST(_guestCare.complaint.firstResponseTimestamp AS TIMESTAMP) AS first_response_timestamp,
      CAST(_guestCare.complaint.resolutionTimestamp AS TIMESTAMP) AS resolution_timestamp,
      CAST(_guestCare.complaint.verificationTimestamp AS TIMESTAMP) AS verification_timestamp,
      CAST(_guestCare.complaint.closedTimestamp AS TIMESTAMP) AS closed_timestamp,
      CAST(_guestCare.complaint.resolutionHorizonStartTimestamp AS TIMESTAMP) AS resolution_horizon_start_timestamp,
      CAST(_guestCare.complaint.resolutionHorizonDueTimestamp AS TIMESTAMP) AS resolution_horizon_due_timestamp,
      CAST(_guestCare.complaint.resolutionHorizonHours AS BIGINT) AS resolution_horizon_hours,
      CAST(_guestCare.complaint.eligibilityEvaluatedTimestamp AS TIMESTAMP) AS eligibility_evaluated_timestamp,
      CAST(_guestCare.complaint.eligible AS BOOLEAN) AS eligible,
      _guestCare.complaint.eligibilityReasonCode AS eligibility_reason_code,
      CAST(_guestCare.complaint.verifiedResolution AS BOOLEAN) AS verified_resolution,
      _guestCare.complaint.verificationStatus AS verification_status,
      _guestCare.complaint.verificationMethod AS verification_method,
      _guestCare.complaint.verifiedByType AS verified_by_type,
      _guestCare.complaint.resolutionCode AS resolution_code,
      _guestCare.complaint.resolutionCategory AS resolution_category,
      _guestCare.complaint.resolutionOutcome AS resolution_outcome,
      _guestCare.complaint.resolutionStabilityStatus AS resolution_stability_status,
      CAST(_guestCare.complaint.stabilityWindowHours AS BIGINT) AS stability_window_hours,
      CAST(_guestCare.complaint.stableThroughTimestamp AS TIMESTAMP) AS stable_through_timestamp,
      CAST(_guestCare.complaint.reopened AS BOOLEAN) AS reopened,
      CAST(_guestCare.complaint.reopenCount AS BIGINT) AS reopen_count,
      CAST(_guestCare.complaint.administrativeClose AS BOOLEAN) AS administrative_close,
      CAST(_guestCare.complaint.withinResolutionHorizon AS BOOLEAN) AS within_resolution_horizon,
      CAST(_guestCare.complaint.resolutionDurationSeconds AS BIGINT) AS resolution_duration_seconds,
      CAST(_guestCare.complaint.timeToFirstResponseSeconds AS BIGINT) AS time_to_first_response_seconds,
      _guestCare.complaint.submissionChannel AS submission_channel,
      _guestCare.complaint.resolutionChannel AS resolution_channel,
      _guestCare.complaint.platform AS platform,
      _guestCare.complaint.digitalPropertyId AS digital_property_id,
      CAST(_guestCare.complaint.authenticated AS BOOLEAN) AS authenticated,
      _guestCare.complaint.guestIdPseudonymous AS guest_id_pseudonymous,
      _guestCare.complaint.sessionId AS session_id,
      _guestCare.complaint.interactionId AS interaction_id,
      _guestCare.complaint.serviceLocationId AS service_location_id,
      _guestCare.complaint.market AS market,
      _guestCare.complaint.countryCode AS country_code,
      _guestCare.complaint.languageCode AS language_code,
      _guestCare.complaint.complaintCategory AS complaint_category,
      _guestCare.complaint.complaintSubcategory AS complaint_subcategory,
      _guestCare.complaint.severityCode AS severity_code,
      CAST(timestamp AS TIMESTAMP) AS aep_event_timestamp
    FROM aep_customer_care_event_dataset
    WHERE eventType = 'conversion'
      AND CAST(timestamp AS TIMESTAMP) >= CURRENT_TIMESTAMP - INTERVAL '90' DAY
      AND _guestCare.complaint.complaintId IS NOT NULL
  ),
  version_ranked AS (
    SELECT
      normalized_events.*,
      ROW_NUMBER() OVER (
        PARTITION BY complaint_id, complaint_version, lifecycle_event_type
        ORDER BY lifecycle_event_timestamp DESC, aep_event_timestamp DESC
      ) AS version_event_rank
    FROM normalized_events
  ),
  version_deduplicated AS (
    SELECT *
    FROM version_ranked
    WHERE version_event_rank = 1
  ),
  complaint_ranked AS (
    SELECT
      version_deduplicated.*,
      COALESCE(
        resolution_horizon_due_timestamp,
        resolution_horizon_start_timestamp + resolution_horizon_hours * INTERVAL '1' HOUR
      ) AS effective_resolution_horizon_due_timestamp,
      ROW_NUMBER() OVER (
        PARTITION BY complaint_id
        ORDER BY complaint_version DESC, lifecycle_event_timestamp DESC, aep_event_timestamp DESC
      ) AS complaint_state_rank
    FROM version_deduplicated
  ),
  latest_complaint_state AS (
    SELECT *
    FROM complaint_ranked
    WHERE complaint_state_rank = 1
  ),
  scored_complaints AS (
    SELECT
      latest_complaint_state.*,
      1 AS denominator_complaint,
      CASE
        WHEN verified_resolution = TRUE
         AND LOWER(verification_status) = 'verified'
         AND LOWER(verified_by_type) = 'guest'
         AND resolution_timestamp IS NOT NULL
         AND resolution_timestamp <= effective_resolution_horizon_due_timestamp
         AND within_resolution_horizon = TRUE
         AND COALESCE(administrative_close, FALSE) = FALSE
         AND COALESCE(reopened, FALSE) = FALSE
         AND COALESCE(reopen_count, 0) = 0
         AND LOWER(resolution_outcome) = 'completed_stable'
         AND LOWER(resolution_stability_status) = 'stable'
         AND stable_through_timestamp <= CURRENT_TIMESTAMP
        THEN 1
        ELSE 0
      END AS resolved_complaint
    FROM latest_complaint_state
    WHERE eligible = TRUE
      AND submitted_timestamp >= CURRENT_TIMESTAMP - INTERVAL '90' DAY
      AND submitted_timestamp < CURRENT_TIMESTAMP + INTERVAL '1' DAY
      AND effective_resolution_horizon_due_timestamp <= CURRENT_TIMESTAMP
  )
  SELECT
    CAST(submitted_timestamp AS DATE) AS complaint_submission_date,
    market,
    country_code,
    language_code,
    submission_channel,
    platform,
    digital_property_id,
    service_location_id,
    complaint_category,
    complaint_subcategory,
    severity_code,
    COUNT(*) AS eligible_guest_complaints,
    SUM(resolved_complaint) AS resolved_guest_complaints,
    CASE
      WHEN COUNT(*) = 0 THEN 0.0
      ELSE CAST(SUM(resolved_complaint) AS DOUBLE) / CAST(COUNT(*) AS DOUBLE)
    END AS guest_complaint_resolution_rate,
    CASE
      WHEN COUNT(*) = 0 THEN 0.0
      ELSE ROUND(100.0 * CAST(SUM(resolved_complaint) AS DOUBLE) / CAST(COUNT(*) AS DOUBLE), 2)
    END AS guest_complaint_resolution_rate_pct
  FROM scored_complaints
  GROUP BY
    CAST(submitted_timestamp AS DATE),
    market,
    country_code,
    language_code,
    submission_channel,
    platform,
    digital_property_id,
    service_location_id,
    complaint_category,
    complaint_subcategory,
    severity_code
  ORDER BY complaint_submission_date DESC, market, country_code, submission_channel;

Calculation Notes: |
  1️⃣ Use complaint-created cohorts and include a case only after its full policy resolution horizon has elapsed to prevent immature complaints from depressing the rate.
  2️⃣ Count distinct canonical complaint_case_id values, not messages, status events, chat sessions, issue labels, or agent interactions.
  3️⃣ Treat a complaint as resolved only when the guest confirms resolution or when an authorized resolved status remains unreopened for the defined 72-hour stability period.
  4️⃣ Apply the policy horizon active at complaint creation; retain that horizon for historical calculation even if the service policy later changes.
  5️⃣ Exclude spam, tests, duplicates, service requests without expressed dissatisfaction, withdrawn complaints, and cases invalidated for fraud or abuse.
  6️⃣ Attribute merged duplicates to the surviving canonical case and preserve the earliest valid digital complaint timestamp as the cohort timestamp.
  7️⃣ Exclude telephone, front-desk, postal, airport-desk, and other offline-origin complaints from this digital-only implementation, even if agents later update them digitally.

Business Use Case: |
  The Chief Customer Officer and Guest Relations leadership review this rate by property, digital channel, complaint category, journey stage, and severity to identify where digital complaints are not reaching stable resolution. When a property shows a low rate for mobile-app room-quality complaints, leadership can increase specialist coverage, correct routing rules, remove approval bottlenecks, or revise recovery authority and then validate whether subsequent complaint cohorts improve.



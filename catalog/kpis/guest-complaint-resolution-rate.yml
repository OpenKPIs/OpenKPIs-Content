KPI Name: Guest Complaint Resolution Rate
Formula: (Distinct Eligible Digital Complaint Cases Verified as Resolved Within the Policy Resolution Horizon / Distinct Eligible Digital Complaint Cases Whose Resolution Horizon Has Elapsed) × 100

Description: |
  Measures the percentage of eligible complaints submitted through digital guest channels that reach a verified resolution within the applicable resolution horizon. It indicates how reliably the organization converts digitally reported guest issues into completed, stable outcomes rather than merely acknowledging or administratively closing them.

Category: Quality

Tags: [kpi]

Industry: [Travel & Hospitality]

Priority: High

Core Area: Generic

Scope: Item

Measure Type: percentage

Aggregation Window: Time based - Daily, reported monthly by complaint-created cohort


Google Analytics SQL: |
  -- ==========================================
  -- 1. GOOGLE BIGQUERY SQL
  -- ==========================================
  SELECT COUNT(DISTINCT CASE WHEN event_name = 'purchase' THEN user_pseudo_id END) AS completed_checkouts,
         COUNT(DISTINCT CASE WHEN event_name = 'begin_checkout' THEN user_pseudo_id END) AS initiated_checkouts,
         SAFE_DIVIDE(COUNT(DISTINCT CASE WHEN event_name = 'purchase' THEN user_pseudo_id END), COUNT(DISTINCT CASE WHEN event_name = 'begin_checkout' THEN user_pseudo_id END)) AS checkout_completion_rate
  FROM `your-project.analytics_123456789.events_*`
  WHERE _TABLE_SUFFIX BETWEEN '20230101' AND '20231231'
    AND event_name IN ('purchase', 'begin_checkout')

AEP Query Service SQL: |
  -- ==========================================
  -- 2. ADOBE AEP QUERY SERVICE SQL
  -- ==========================================
  SELECT COUNT(DISTINCT CASE WHEN event = 'purchase' THEN user_id END) AS completed_checkouts,
         COUNT(DISTINCT CASE WHEN event = 'begin_checkout' THEN user_id END) AS initiated_checkouts,
         SAFE_DIVIDE(COUNT(DISTINCT CASE WHEN event = 'purchase' THEN user_id END), COUNT(DISTINCT CASE WHEN event = 'begin_checkout' THEN user_id END)) AS checkout_completion_rate
  FROM aep_dataset.events
  WHERE event IN ('purchase', 'begin_checkout')
    AND event_date BETWEEN '2023-01-01' AND '2023-12-31'

Calculation Notes: |
  Exclude sessions with technical errors or timeouts exceeding 30 minutes.

Business Use Case: |
  Executives use this KPI to identify and address bottlenecks in the checkout process, aiming to improve conversion rates.



KPI Name: Checkout completion rate
Formula: (Completed Checkouts / Initiated Checkouts) × 100

Description: |
  Measures the percentage of initiated checkout sessions that result in a completed purchase. This KPI helps assess the effectiveness of the checkout process.

Category: Conversion

Tags: [ecommerce, checkout, purchase]

Industry: [E-commerce]

Priority: High

Core Area: Checkout

Scope: Session

Measure Type: percentage

Aggregation Window: Time based - Daily


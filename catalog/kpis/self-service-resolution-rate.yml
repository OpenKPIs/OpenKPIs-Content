KPI Name: Self-Service Resolution Rate
Formula: ((Help-Center Sessions - Help-Center Sessions Followed by a Support Contact within 24h) / Help-Center Sessions) × 100

Description: |
  Share of help-center sessions not followed by a support contact (form, chat or click-to-call) within 24 hours. The standard deflection measure for help-center content.

Category: Experience

Tags: [kpi, E-commerce: Returns, Refunds & Customer Support]

Industry: [["E-commerce"]]

Priority: High

Core Area: Generic

Scope: Session

Measure Type: Percentage

Aggregation Window: Daily, Weekly, Monthly


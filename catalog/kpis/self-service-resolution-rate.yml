KPI Name: Self-Service Resolution Rate
Aliases: [Help Center Deflection Rate, Self-Service Deflection Rate, Ticket Deflection Rate]

Formula: Help-center visits without a support request ÷ Help-center visits × 100

Description: |
  Percentage of help-center visits without a later support request. It helps support teams assess whether help content reduces the need for assistance.

Category: Operational Efficiency

Tags: [self-service, help center, support deflection]

Industry: [E-commerce, Retail]

Business Criticality: High

Journey / Navigation Area: [Customer Service]

Owning Function: Customer Support

Scope: Session

Measurement Channels: [Web]

Measure Type: Percentage

Aggregation Window: [Daily, Weekly, Monthly, Selected Reporting Period]


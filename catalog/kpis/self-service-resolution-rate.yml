Google Analytics SQL: |
  WITH events AS (
    SELECT event_name, TIMESTAMP_MICROS(event_timestamp) AS ts,
      (SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'support_actor_id') AS actor_id,
      (SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'help_session_id') AS session_id,
      (SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'page_type') AS page_type,
      (SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'landing_page_type') AS landing_type,
      (SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'support_channel') AS channel
    FROM `project.analytics.events_*`
    WHERE _TABLE_SUFFIX <= FORMAT_DATE('%Y%m%d', DATE_ADD(DATE(@report_end), INTERVAL 1 DAY))
      AND event_timestamp < UNIX_MICROS(@report_end)
      AND event_name IN ('page_view', 'support_contact')
      AND (SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'traffic_type') = 'external'
  ), help_sessions AS (
    SELECT actor_id, session_id, MIN(ts) AS first_help
    FROM events
    WHERE event_name = 'page_view' AND page_type = 'help_center' AND landing_type <> 'contact'
      AND actor_id IS NOT NULL AND actor_id <> '' AND session_id IS NOT NULL AND session_id <> ''
    GROUP BY actor_id, session_id
  ), assessed AS (
    SELECT CASE WHEN EXISTS (
      SELECT 1 FROM events c
      WHERE c.event_name = 'support_contact' AND c.actor_id = h.actor_id
        AND c.channel IN ('form', 'chat', 'click_to_call')
        AND c.ts > h.first_help
        AND c.ts < TIMESTAMP_ADD(h.first_help, INTERVAL @contact_window_seconds SECOND)
    ) THEN 0 ELSE 1 END AS resolved
    FROM help_sessions h
    WHERE h.first_help >= @report_start
      AND h.first_help <= TIMESTAMP_SUB(@report_end, INTERVAL @contact_window_seconds SECOND)
      AND @contact_window_seconds > 0
  )
  SELECT SAFE_DIVIDE(SUM(resolved), COUNT(*)) * 100 AS self_service_resolution_rate
  FROM assessed;

AEP Query Service SQL: |
  WITH events AS (
    SELECT eventType, timestamp AS ts,
      _openkpis.supportActorId AS actor_id, _openkpis.helpSessionId AS session_id,
      _openkpis.pageType AS page_type, _openkpis.landingPageType AS landing_type,
      _openkpis.supportChannel AS channel
    FROM {{AEP_EXPERIENCE_EVENT_DATASET}}
    WHERE timestamp < CAST(:report_end AS TIMESTAMP)
      AND eventType IN ('web.webpagedetails.pageViews', 'support_contact')
      AND _openkpis.trafficType = 'external'
  ), help_sessions AS (
    SELECT actor_id, session_id, MIN(ts) AS first_help
    FROM events
    WHERE eventType = 'web.webpagedetails.pageViews' AND page_type = 'help_center' AND landing_type <> 'contact'
      AND actor_id IS NOT NULL AND actor_id <> '' AND session_id IS NOT NULL AND session_id <> ''
    GROUP BY actor_id, session_id
  ), assessed AS (
    SELECT CASE WHEN EXISTS (
      SELECT 1 FROM events c
      WHERE c.eventType = 'support_contact' AND c.actor_id = h.actor_id
        AND c.channel IN ('form', 'chat', 'click_to_call')
        AND c.ts > h.first_help
        AND c.ts < h.first_help + CAST(:contact_window_seconds AS BIGINT) * INTERVAL '1' SECOND
    ) THEN 0 ELSE 1 END AS resolved
    FROM help_sessions h
    WHERE h.first_help >= CAST(:report_start AS TIMESTAMP)
      AND h.first_help <= CAST(:report_end AS TIMESTAMP) - CAST(:contact_window_seconds AS BIGINT) * INTERVAL '1' SECOND
      AND CAST(:contact_window_seconds AS BIGINT) > 0
  )
  SELECT SUM(resolved) * 100.0 / NULLIF(COUNT(*), 0) AS self_service_resolution_rate
  FROM assessed;

Calculation Notes: |
  1️⃣ Count visits by first help view; include only those whose configured contact window ends by the UTC report end.
  2️⃣ Match recorded actor IDs; count support requests strictly after first help and before the contact window ends.
  3️⃣ Exclude contact-page landings and staff traffic; require stable actor IDs and globally unique visit IDs.
  4️⃣ No recorded request suggests resolution; one request can affect several visits. Return null if no visits qualify.
  5️⃣ Require unique source events and unchanged actor IDs within visits; later identity merges do not change results.

Business Use Case: |
  1️⃣ Customer Support reviews declines to prioritize help articles for revision.
  2️⃣ Customer Experience compares this rate with customer feedback before changing help journeys.
  3️⃣ Product teams investigate repeated support requests after help visits to improve navigation.



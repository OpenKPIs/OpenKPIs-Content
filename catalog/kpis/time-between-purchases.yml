KPI Name: Time Between Purchases
Formula: Average Time Between Purchases = Σ (order_date(n+1) − order_date(n), in days) / Count of consecutive order pairs; Median Time Between Purchases = MEDIAN(order_date(n+1) − order_date(n)) over the same pair set, where pairs are formed per customer from completed orders sorted by order timestamp

Description: |
  Time Between Purchases measures the mean and median number of days that elapse between a customer's consecutive completed orders, computed across every consecutive order pair placed by repeat customers whose later order falls within the reporting period. It sets the natural repurchase cadence of the customer base and is the primary input for timing replenishment reminders, subscription nudges and win-back triggers before a customer lapses.


Google Analytics SQL: |
  -- ==========================================
  -- 1. GOOGLE BIGQUERY SQL
  -- ==========================================
  -- Time Between Purchases: mean and median days between consecutive purchase occasions per customer.
  -- Reporting window: last 12 months (interval attributed to the month of the later order).
  -- Order history lookback: 36 months so long intervals are not truncated.
  WITH purchases AS (
    SELECT
      user_id,
      ecommerce.transaction_id AS transaction_id,
      PARSE_DATE('%Y%m%d', event_date) AS order_date,
      (SELECT MAX(IF(ep.key = 'order_type', ep.value.string_value, NULL))
         FROM UNNEST(event_params) AS ep) AS order_type,
      (SELECT MAX(IF(ep.key = 'is_subscription_renewal',
                     LOWER(COALESCE(ep.value.string_value, CAST(ep.value.int_value AS STRING))), NULL))
         FROM UNNEST(event_params) AS ep) AS is_subscription_renewal
    FROM `your-project.analytics_123456789.events_*`
    WHERE _TABLE_SUFFIX BETWEEN FORMAT_DATE('%Y%m%d', DATE_SUB(DATE_TRUNC(CURRENT_DATE(), MONTH), INTERVAL 36 MONTH))
                            AND FORMAT_DATE('%Y%m%d', DATE_SUB(CURRENT_DATE(), INTERVAL 1 DAY))
      AND event_name = 'purchase'
      AND user_id IS NOT NULL
      AND ecommerce.transaction_id IS NOT NULL
      AND ecommerce.transaction_id NOT IN ('', '(not set)')
  ),
  full_refunds AS (
    -- A refund event without items is a full refund of the transaction
    SELECT DISTINCT ecommerce.transaction_id AS transaction_id
    FROM `your-project.analytics_123456789.events_*`
    WHERE _TABLE_SUFFIX BETWEEN FORMAT_DATE('%Y%m%d', DATE_SUB(DATE_TRUNC(CURRENT_DATE(), MONTH), INTERVAL 36 MONTH))
                            AND FORMAT_DATE('%Y%m%d', DATE_SUB(CURRENT_DATE(), INTERVAL 1 DAY))
      AND event_name = 'refund'
      AND ecommerce.transaction_id IS NOT NULL
      AND ARRAY_LENGTH(items) = 0
  ),
  orders AS (
    -- One row per completed, non-test, non-renewal order (duplicate purchase hits collapsed)
    SELECT
      p.user_id,
      p.transaction_id,
      MIN(p.order_date) AS order_date
    FROM purchases AS p
    LEFT JOIN full_refunds AS r
      ON p.transaction_id = r.transaction_id
    WHERE r.transaction_id IS NULL
      AND COALESCE(p.order_type, 'standard') NOT IN ('test', 'subscription_renewal', 'b2b', 'marketplace')
      AND COALESCE(p.is_subscription_renewal, 'false') NOT IN ('true', '1')
    GROUP BY p.user_id, p.transaction_id
  ),
  purchase_occasions AS (
    -- Same-day orders by one customer are merged into a single purchase occasion
    SELECT DISTINCT user_id, order_date
    FROM orders
  ),
  sequenced AS (
    SELECT
      user_id,
      order_date,
      LAG(order_date) OVER (PARTITION BY user_id ORDER BY order_date) AS previous_order_date
    FROM purchase_occasions
  ),
  intervals AS (
    SELECT
      DATE_TRUNC(order_date, MONTH) AS report_month,
      user_id,
      DATE_DIFF(order_date, previous_order_date, DAY) AS days_between
    FROM sequenced
    WHERE previous_order_date IS NOT NULL
      AND order_date >= DATE_SUB(DATE_TRUNC(CURRENT_DATE(), MONTH), INTERVAL 12 MONTH)
  ),
  caps AS (
    SELECT
      report_month,
      APPROX_QUANTILES(days_between, 100)[OFFSET(99)] AS p99_days
    FROM intervals
    GROUP BY report_month
  )
  SELECT
    i.report_month,
    COUNT(*) AS consecutive_order_pairs,
    COUNT(DISTINCT i.user_id) AS repeat_customers,
    ROUND(AVG(i.days_between), 1) AS avg_days_between_purchases,
    ROUND(AVG(LEAST(i.days_between, c.p99_days)), 1) AS avg_days_between_purchases_p99_capped,
    APPROX_QUANTILES(i.days_between, 100)[OFFSET(50)] AS median_days_between_purchases
  FROM intervals AS i
  JOIN caps AS c
    ON i.report_month = c.report_month
  GROUP BY i.report_month
  ORDER BY i.report_month;

AEP Query Service SQL: |
  -- ==========================================
  -- 2. ADOBE AEP QUERY SERVICE SQL
  -- ==========================================
  -- Time Between Purchases: mean and median days between consecutive purchase occasions per customer.
  -- Reporting window: last 12 months (interval attributed to the month of the later order).
  -- Order history lookback: 36 months so long intervals are not truncated.
  WITH purchases AS (
    SELECT
      identityMap['CRMID'][0].id AS customer_id,
      commerce.order.purchaseID AS purchase_id,
      to_date(from_utc_timestamp(timestamp, 'America/Chicago')) AS order_date,
      lower(_experience.analytics.customDimensions.eVars.eVar12) AS order_type
    FROM aep_web_events_dataset
    WHERE eventType = 'commerce.purchases'
      AND commerce.purchases.value > 0
      AND timestamp >= add_months(trunc(current_date(), 'MM'), -36)
      AND timestamp < current_date()
      AND identityMap['CRMID'][0].id IS NOT NULL
      AND commerce.order.purchaseID IS NOT NULL
      AND commerce.order.purchaseID <> ''
  ),
  orders AS (
    -- One row per completed, non-test, non-renewal order (duplicate purchase hits collapsed)
    SELECT
      customer_id,
      purchase_id,
      MIN(order_date) AS order_date
    FROM purchases
    WHERE COALESCE(order_type, 'standard') NOT IN ('test', 'subscription_renewal', 'b2b', 'marketplace')
    GROUP BY customer_id, purchase_id
  ),
  purchase_occasions AS (
    -- Same-day orders by one customer are merged into a single purchase occasion
    SELECT DISTINCT customer_id, order_date
    FROM orders
  ),
  sequenced AS (
    SELECT
      customer_id,
      order_date,
      LAG(order_date) OVER (PARTITION BY customer_id ORDER BY order_date) AS previous_order_date
    FROM purchase_occasions
  ),
  intervals AS (
    SELECT
      trunc(order_date, 'MM') AS report_month,
      customer_id,
      datediff(order_date, previous_order_date) AS days_between
    FROM sequenced
    WHERE previous_order_date IS NOT NULL
      AND order_date >= add_months(trunc(current_date(), 'MM'), -12)
  ),
  caps AS (
    SELECT
      report_month,
      percentile_approx(days_between, 0.99) AS p99_days
    FROM intervals
    GROUP BY report_month
  )
  SELECT
    i.report_month,
    COUNT(*) AS consecutive_order_pairs,
    COUNT(DISTINCT i.customer_id) AS repeat_customers,
    ROUND(AVG(i.days_between), 1) AS avg_days_between_purchases,
    ROUND(AVG(LEAST(i.days_between, c.p99_days)), 1) AS avg_days_between_purchases_p99_capped,
    percentile_approx(i.days_between, 0.5) AS median_days_between_purchases
  FROM intervals AS i
  JOIN caps AS c
    ON i.report_month = c.report_month
  GROUP BY i.report_month
  ORDER BY i.report_month;

Calculation Notes: |
  1️⃣ Unit of analysis is the consecutive order pair, not the customer: a customer with five orders contributes four intervals, so high-frequency buyers weigh more heavily in the mean; report the per-customer median-of-intervals alongside when cohort comparisons need each customer weighted equally.,2️⃣ An interval is attributed to the period in which its later order occurs; the earlier order may pre-date the period, so order history must be read back at least 24 months (or the full lookback window) to avoid truncating long intervals and biasing the value downward.,3️⃣ Only completed, non-test orders on a persistent customer key count (authenticated user_id, CRM customer_id or hashed email); guest checkouts without a resolvable identity are excluded because they cannot be paired, and the identity match rate should be reported next to the KPI.,4️⃣ Fully cancelled, fraud-rejected and fully refunded orders are removed before pairing; partial refunds, exchanges issued as new order numbers and split shipments of one checkout are collapsed to the original order so they do not create artificial zero-day intervals.,5️⃣ Intervals are measured in calendar days between order timestamps normalised to the store's reporting timezone; multiple orders placed by the same customer on the same day are merged into one purchase occasion, so the minimum valid interval is one day.,6️⃣ Subscription auto-renewals and scheduled replenishment shipments are excluded or reported as a separate series, since their fixed cadence reflects the plan setting rather than discretionary repurchase behaviour; marketplace and B2B bulk accounts are likewise segmented out.,7️⃣ The mean is highly sensitive to long-tail reactivations, so publish the median as the headline for trigger timing, cap or winsorise intervals at the 99th percentile for the mean, and always read the value per category, since consumables and durables run on fundamentally different cycles.

Business Use Case: |
  1️⃣ The CRM & Lifecycle Marketing team sets the replenishment reminder for each product category at roughly 80% of that category's median interval and moves the send date whenever the median shifts by more than seven days quarter over quarter.,2️⃣ The Retention Marketing manager defines the at-risk threshold as 1.5–2× the customer's segment median interval and, once a customer passes it without ordering, enrols them in the win-back journey with an escalating incentive ladder.,3️⃣ The Merchandising team reviews intervals for consumable categories when they lengthen for two consecutive months and tests pack sizes, bundles or a subscribe-and-save offer to pull the repurchase cycle back in.,4️⃣ Finance feeds the median interval by acquisition cohort into the customer lifetime value and demand forecast models, revising purchase-frequency assumptions in the quarterly reforecast when the cohort gap moves materially.


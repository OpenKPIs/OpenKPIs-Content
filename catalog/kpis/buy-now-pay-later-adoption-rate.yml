KPI Name: Buy Now Pay Later Adoption Rate
Formula: (Completed Orders Paid with BNPL / Total Completed Orders) × 100

Description: |
  Share of completed orders paid with a buy-now-pay-later option such as Klarna, Afterpay or Affirm. Shows demand for instalment payment and guides provider mix and checkout placement.


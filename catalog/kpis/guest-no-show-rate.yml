KPI Name: Guest No-Show Rate
Formula: (Distinct Eligible Reservation Items Classified as No-Show / Distinct Eligible Confirmed Reservation Items Due to Arrive) × 100

Description: |
  Measures the percentage of eligible, digitally confirmed guest reservations for which no qualifying digital arrival or check-in is recorded by the defined no-show cutoff. It quantifies unrealized stay conversion and inventory risk for reservation journeys whose arrival outcome can be authoritatively determined from digital events.

Category: Conversion

Tags: [kpi]

Industry: [Travel & Hospitality]

Priority: High

Core Area: Generic

Scope: Item

Measure Type: rate

Aggregation Window: Time based - Daily


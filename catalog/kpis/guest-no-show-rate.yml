Google Analytics SQL: |
  -- ==========================================
  -- 1. GOOGLE BIGQUERY SQL
  -- ==========================================
  WITH extracted_events AS (
    SELECT
      event_name,
      event_timestamp AS ga4_event_timestamp_micros,
      user_pseudo_id AS ga4_user_pseudo_id,
      (SELECT COALESCE(value.string_value, CAST(value.int_value AS STRING), CAST(value.double_value AS STRING), CAST(value.float_value AS STRING)) FROM UNNEST(event_params) WHERE key = 'event_id' LIMIT 1) AS event_id,
      (SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'schema_version' LIMIT 1) AS schema_version,
      SAFE_CAST((SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'event_timestamp' LIMIT 1) AS TIMESTAMP) AS event_timestamp,
      (SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'source_system' LIMIT 1) AS source_system,
      (SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'environment' LIMIT 1) AS environment,
      (SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'platform' LIMIT 1) AS platform,
      (SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'brand_id' LIMIT 1) AS brand_id,
      (SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'property_id' LIMIT 1) AS property_id,
      (SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'property_name' LIMIT 1) AS property_name,
      (SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'property_timezone' LIMIT 1) AS property_timezone,
      (SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'reservation_id' LIMIT 1) AS reservation_id,
      (SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'confirmation_number' LIMIT 1) AS confirmation_number,
      (SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'guest_id' LIMIT 1) AS guest_id,
      (SELECT COALESCE(value.string_value, CAST(value.int_value AS STRING)) FROM UNNEST(event_params) WHERE key = 'session_id' LIMIT 1) AS session_id,
      COALESCE((SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'user_pseudo_id' LIMIT 1), user_pseudo_id) AS user_pseudo_id,
      SAFE_CAST((SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'booking_timestamp' LIMIT 1) AS TIMESTAMP) AS booking_timestamp,
      (SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'booking_channel' LIMIT 1) AS booking_channel,
      SAFE_CAST((SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'check_in_date' LIMIT 1) AS DATE) AS check_in_date,
      SAFE_CAST((SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'check_out_date' LIMIT 1) AS DATE) AS check_out_date,
      SAFE_CAST((SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'scheduled_arrival_timestamp' LIMIT 1) AS TIMESTAMP) AS scheduled_arrival_timestamp,
      SAFE_CAST((SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'no_show_cutoff_timestamp' LIMIT 1) AS TIMESTAMP) AS no_show_cutoff_timestamp,
      SAFE_CAST((SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'outcome_determined_timestamp' LIMIT 1) AS TIMESTAMP) AS outcome_determined_timestamp,
      LOWER((SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'reservation_status' LIMIT 1)) AS reservation_status,
      LOWER((SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'arrival_status' LIMIT 1)) AS arrival_status,
      LOWER((SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'check_in_status' LIMIT 1)) AS check_in_status,
      LOWER((SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'confirmation_status' LIMIT 1)) AS confirmation_status,
      (SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'confirmation_channel' LIMIT 1) AS confirmation_channel,
      SAFE_CAST(NULLIF((SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'confirmation_timestamp' LIMIT 1), '') AS TIMESTAMP) AS confirmation_timestamp,
      LOWER((SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'eligibility_status' LIMIT 1)) AS eligibility_status,
      (SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'eligibility_reason' LIMIT 1) AS eligibility_reason,
      LOWER((SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'cancellation_status' LIMIT 1)) AS cancellation_status,
      SAFE_CAST(NULLIF((SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'cancellation_timestamp' LIMIT 1), '') AS TIMESTAMP) AS cancellation_timestamp,
      LOWER(COALESCE((SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'qualifying_arrival_recorded' LIMIT 1), CAST((SELECT value.int_value FROM UNNEST(event_params) WHERE key = 'qualifying_arrival_recorded' LIMIT 1) AS STRING))) IN ('true', '1') AS qualifying_arrival_recorded,
      LOWER(COALESCE((SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'qualifying_check_in_recorded' LIMIT 1), CAST((SELECT value.int_value FROM UNNEST(event_params) WHERE key = 'qualifying_check_in_recorded' LIMIT 1) AS STRING))) IN ('true', '1') AS qualifying_check_in_recorded,
      SAFE_CAST((SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'last_digital_activity_timestamp' LIMIT 1) AS TIMESTAMP) AS last_digital_activity_timestamp,
      (SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'room_type' LIMIT 1) AS room_type,
      (SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'rate_plan' LIMIT 1) AS rate_plan,
      SAFE_CAST(COALESCE((SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'rooms_count' LIMIT 1), CAST((SELECT value.int_value FROM UNNEST(event_params) WHERE key = 'rooms_count' LIMIT 1) AS STRING)) AS INT64) AS rooms_count,
      SAFE_CAST(COALESCE((SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'nights_count' LIMIT 1), CAST((SELECT value.int_value FROM UNNEST(event_params) WHERE key = 'nights_count' LIMIT 1) AS STRING)) AS INT64) AS nights_count,
      SAFE_CAST(COALESCE((SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'guests_count' LIMIT 1), CAST((SELECT value.int_value FROM UNNEST(event_params) WHERE key = 'guests_count' LIMIT 1) AS STRING)) AS INT64) AS guests_count,
      SAFE_CAST(COALESCE((SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'adults_count' LIMIT 1), CAST((SELECT value.int_value FROM UNNEST(event_params) WHERE key = 'adults_count' LIMIT 1) AS STRING)) AS INT64) AS adults_count,
      SAFE_CAST(COALESCE((SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'children_count' LIMIT 1), CAST((SELECT value.int_value FROM UNNEST(event_params) WHERE key = 'children_count' LIMIT 1) AS STRING)) AS INT64) AS children_count,
      (SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'currency' LIMIT 1) AS currency,
      SAFE_CAST(COALESCE((SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'booking_value' LIMIT 1), CAST((SELECT value.int_value FROM UNNEST(event_params) WHERE key = 'booking_value' LIMIT 1) AS STRING), CAST((SELECT value.double_value FROM UNNEST(event_params) WHERE key = 'booking_value' LIMIT 1) AS STRING)) AS NUMERIC) AS booking_value,
      SAFE_CAST(COALESCE((SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'deposit_value' LIMIT 1), CAST((SELECT value.int_value FROM UNNEST(event_params) WHERE key = 'deposit_value' LIMIT 1) AS STRING), CAST((SELECT value.double_value FROM UNNEST(event_params) WHERE key = 'deposit_value' LIMIT 1) AS STRING)) AS NUMERIC) AS deposit_value,
      (SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'payment_status' LIMIT 1) AS payment_status,
      SAFE_CAST(COALESCE((SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'inventory_risk_units' LIMIT 1), CAST((SELECT value.int_value FROM UNNEST(event_params) WHERE key = 'inventory_risk_units' LIMIT 1) AS STRING)) AS INT64) AS inventory_risk_units,
      LOWER(COALESCE((SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'analytics_consent' LIMIT 1), CAST((SELECT value.int_value FROM UNNEST(event_params) WHERE key = 'analytics_consent' LIMIT 1) AS STRING))) IN ('true', '1') AS analytics_consent,
      LOWER((SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'data_quality_status' LIMIT 1)) AS data_quality_status
    FROM `your-project.analytics_123456789.events_*`
    WHERE _TABLE_SUFFIX BETWEEN FORMAT_DATE('%Y%m%d', DATE_SUB(@start_date, INTERVAL 3 DAY))
                            AND FORMAT_DATE('%Y%m%d', DATE_ADD(@end_date, INTERVAL 3 DAY))
      AND event_name = 'conversion'
  ),
  deduplicated_reservations AS (
    SELECT * EXCEPT(row_number)
    FROM (
      SELECT
        e.*,
        ROW_NUMBER() OVER (
          PARTITION BY reservation_id
          ORDER BY outcome_determined_timestamp DESC,
                   event_timestamp DESC,
                   ga4_event_timestamp_micros DESC,
                   event_id DESC
        ) AS row_number
      FROM extracted_events e
      WHERE reservation_id IS NOT NULL
        AND check_in_date BETWEEN @start_date AND @end_date
        AND environment = 'production'
        AND data_quality_status = 'authoritative'
    )
    WHERE row_number = 1
  ),
  eligible_base_population AS (
    SELECT
      *,
      GREATEST(COALESCE(guests_count, 1), 1) AS scheduled_guest_count,
      reservation_status = 'no_show'
        AND COALESCE(qualifying_arrival_recorded, FALSE) = FALSE
        AND COALESCE(qualifying_check_in_recorded, FALSE) = FALSE
        AND COALESCE(arrival_status, 'not_recorded') = 'not_recorded'
        AND COALESCE(check_in_status, 'not_recorded') = 'not_recorded' AS is_guest_no_show
    FROM deduplicated_reservations
    WHERE eligibility_status = 'eligible'
      AND COALESCE(cancellation_status, 'not_cancelled') = 'not_cancelled'
      AND cancellation_timestamp IS NULL
      AND no_show_cutoff_timestamp IS NOT NULL
      AND outcome_determined_timestamp IS NOT NULL
      AND outcome_determined_timestamp >= no_show_cutoff_timestamp
  )
  SELECT
    check_in_date,
    brand_id,
    property_id,
    ANY_VALUE(property_name HAVING MAX outcome_determined_timestamp) AS property_name,
    ANY_VALUE(property_timezone HAVING MAX outcome_determined_timestamp) AS property_timezone,
    platform,
    booking_channel,
    COUNT(*) AS eligible_reservation_count,
    COUNTIF(is_guest_no_show) AS no_show_reservation_count,
    SUM(scheduled_guest_count) AS eligible_scheduled_guest_count,
    SUM(IF(is_guest_no_show, scheduled_guest_count, 0)) AS no_show_guest_count,
    ROUND(100 * SAFE_DIVIDE(
      SUM(IF(is_guest_no_show, scheduled_guest_count, 0)),
      SUM(scheduled_guest_count)
    ), 4) AS guest_no_show_rate_pct
  FROM eligible_base_population
  GROUP BY
    check_in_date,
    brand_id,
    property_id,
    platform,
    booking_channel
  ORDER BY
    check_in_date,
    brand_id,
    property_id,
    platform,
    booking_channel;

AEP Query Service SQL: |
  -- ==========================================
  -- 2. ADOBE AEP QUERY SERVICE SQL
  -- ==========================================
  WITH extracted_events AS (
    SELECT
      eventType AS event_type,
      timestamp AS xdm_timestamp,
      _guestStay.reservationOutcome.event_id AS event_id,
      _guestStay.reservationOutcome.schema_version AS schema_version,
      CAST(_guestStay.reservationOutcome.event_timestamp AS TIMESTAMP) AS event_timestamp,
      _guestStay.reservationOutcome.source_system AS source_system,
      _guestStay.reservationOutcome.environment AS environment,
      _guestStay.reservationOutcome.platform AS platform,
      _guestStay.reservationOutcome.brand_id AS brand_id,
      _guestStay.reservationOutcome.property_id AS property_id,
      _guestStay.reservationOutcome.property_name AS property_name,
      _guestStay.reservationOutcome.property_timezone AS property_timezone,
      _guestStay.reservationOutcome.reservation_id AS reservation_id,
      _guestStay.reservationOutcome.confirmation_number AS confirmation_number,
      _guestStay.reservationOutcome.guest_id AS guest_id,
      _guestStay.reservationOutcome.session_id AS session_id,
      _guestStay.reservationOutcome.user_pseudo_id AS user_pseudo_id,
      CAST(_guestStay.reservationOutcome.booking_timestamp AS TIMESTAMP) AS booking_timestamp,
      _guestStay.reservationOutcome.booking_channel AS booking_channel,
      CAST(_guestStay.reservationOutcome.check_in_date AS DATE) AS check_in_date,
      CAST(_guestStay.reservationOutcome.check_out_date AS DATE) AS check_out_date,
      CAST(_guestStay.reservationOutcome.scheduled_arrival_timestamp AS TIMESTAMP) AS scheduled_arrival_timestamp,
      CAST(_guestStay.reservationOutcome.no_show_cutoff_timestamp AS TIMESTAMP) AS no_show_cutoff_timestamp,
      CAST(_guestStay.reservationOutcome.outcome_determined_timestamp AS TIMESTAMP) AS outcome_determined_timestamp,
      LOWER(_guestStay.reservationOutcome.reservation_status) AS reservation_status,
      LOWER(_guestStay.reservationOutcome.arrival_status) AS arrival_status,
      LOWER(_guestStay.reservationOutcome.check_in_status) AS check_in_status,
      LOWER(_guestStay.reservationOutcome.confirmation_status) AS confirmation_status,
      _guestStay.reservationOutcome.confirmation_channel AS confirmation_channel,
      CAST(NULLIF(_guestStay.reservationOutcome.confirmation_timestamp, '') AS TIMESTAMP) AS confirmation_timestamp,
      LOWER(_guestStay.reservationOutcome.eligibility_status) AS eligibility_status,
      _guestStay.reservationOutcome.eligibility_reason AS eligibility_reason,
      LOWER(_guestStay.reservationOutcome.cancellation_status) AS cancellation_status,
      CAST(NULLIF(_guestStay.reservationOutcome.cancellation_timestamp, '') AS TIMESTAMP) AS cancellation_timestamp,
      CAST(_guestStay.reservationOutcome.qualifying_arrival_recorded AS BOOLEAN) AS qualifying_arrival_recorded,
      CAST(_guestStay.reservationOutcome.qualifying_check_in_recorded AS BOOLEAN) AS qualifying_check_in_recorded,
      CAST(_guestStay.reservationOutcome.last_digital_activity_timestamp AS TIMESTAMP) AS last_digital_activity_timestamp,
      _guestStay.reservationOutcome.room_type AS room_type,
      _guestStay.reservationOutcome.rate_plan AS rate_plan,
      CAST(_guestStay.reservationOutcome.rooms_count AS BIGINT) AS rooms_count,
      CAST(_guestStay.reservationOutcome.nights_count AS BIGINT) AS nights_count,
      CAST(_guestStay.reservationOutcome.guests_count AS BIGINT) AS guests_count,
      CAST(_guestStay.reservationOutcome.adults_count AS BIGINT) AS adults_count,
      CAST(_guestStay.reservationOutcome.children_count AS BIGINT) AS children_count,
      _guestStay.reservationOutcome.currency AS currency,
      CAST(_guestStay.reservationOutcome.booking_value AS DECIMAL(18,2)) AS booking_value,
      CAST(_guestStay.reservationOutcome.deposit_value AS DECIMAL(18,2)) AS deposit_value,
      _guestStay.reservationOutcome.payment_status AS payment_status,
      CAST(_guestStay.reservationOutcome.inventory_risk_units AS BIGINT) AS inventory_risk_units,
      CAST(_guestStay.reservationOutcome.analytics_consent AS BOOLEAN) AS analytics_consent,
      LOWER(_guestStay.reservationOutcome.data_quality_status) AS data_quality_status
    FROM guest_reservation_outcome_events
    WHERE eventType = 'conversion'
  ),
  deduplicated_reservations AS (
    SELECT *
    FROM (
      SELECT
        e.*,
        ROW_NUMBER() OVER (
          PARTITION BY reservation_id
          ORDER BY outcome_determined_timestamp DESC,
                   event_timestamp DESC,
                   xdm_timestamp DESC,
                   event_id DESC
        ) AS row_number
      FROM extracted_events e
      WHERE reservation_id IS NOT NULL
        AND check_in_date BETWEEN CAST('${START_DATE}' AS DATE) AND CAST('${END_DATE}' AS DATE)
        AND environment = 'production'
        AND data_quality_status = 'authoritative'
    ) ranked
    WHERE row_number = 1
  ),
  eligible_base_population AS (
    SELECT
      d.*,
      GREATEST(COALESCE(guests_count, 1), 1) AS scheduled_guest_count,
      CASE
        WHEN reservation_status = 'no_show'
         AND COALESCE(qualifying_arrival_recorded, FALSE) = FALSE
         AND COALESCE(qualifying_check_in_recorded, FALSE) = FALSE
         AND COALESCE(arrival_status, 'not_recorded') = 'not_recorded'
         AND COALESCE(check_in_status, 'not_recorded') = 'not_recorded'
        THEN 1 ELSE 0
      END AS is_guest_no_show
    FROM deduplicated_reservations d
    WHERE eligibility_status = 'eligible'
      AND COALESCE(cancellation_status, 'not_cancelled') = 'not_cancelled'
      AND cancellation_timestamp IS NULL
      AND no_show_cutoff_timestamp IS NOT NULL
      AND outcome_determined_timestamp IS NOT NULL
      AND outcome_determined_timestamp >= no_show_cutoff_timestamp
  ),
  aggregated AS (
    SELECT
      check_in_date,
      brand_id,
      property_id,
      MAX(property_name) AS property_name,
      MAX(property_timezone) AS property_timezone,
      platform,
      booking_channel,
      COUNT(*) AS eligible_reservation_count,
      SUM(is_guest_no_show) AS no_show_reservation_count,
      SUM(scheduled_guest_count) AS eligible_scheduled_guest_count,
      SUM(CASE WHEN is_guest_no_show = 1 THEN scheduled_guest_count ELSE 0 END) AS no_show_guest_count
    FROM eligible_base_population
    GROUP BY
      check_in_date,
      brand_id,
      property_id,
      platform,
      booking_channel
  )
  SELECT
    check_in_date,
    brand_id,
    property_id,
    property_name,
    property_timezone,
    platform,
    booking_channel,
    eligible_reservation_count,
    no_show_reservation_count,
    eligible_scheduled_guest_count,
    no_show_guest_count,
    ROUND(
      100.0 * no_show_guest_count / NULLIF(eligible_scheduled_guest_count, 0),
      4
    ) AS guest_no_show_rate_pct
  FROM aggregated
  ORDER BY
    check_in_date,
    brand_id,
    property_id,
    platform,
    booking_channel;

Calculation Notes: |
  1️⃣ Cohort reservations by scheduled property-local arrival date, not booking creation date.
  2️⃣ Count one eligible accommodation or stay item per reservation_item_id; do not count individual guests or raw events.
  3️⃣ Classify an item as no-show only after the configured arrival cutoff has elapsed without a qualifying digital arrival or check-in event.
  4️⃣ Exclude test, employee, complimentary, duplicate, fraud-rejected, waitlisted, unconfirmed, and pre-cutoff canceled reservations.
  5️⃣ Retain the no-show classification when cancellation occurs after the cutoff and no earlier qualifying arrival exists.
  6️⃣ Use the latest valid reservation version before the cutoff; amendments must not create additional denominator records.
  7️⃣ Recalculate historical cohorts for late-arriving events within the correction window, then freeze results under the reporting-close policy.

Business Use Case: |
  Revenue Management reviews the rate by property, arrival date, booking channel, lead-time band, rate plan, and payment guarantee status to identify inventory at elevated risk of going unused. Leaders can then adjust overbooking controls, require deposits or card guarantees, trigger pre-arrival reminders, promote digital check-in, or release inventory earlier for high-risk segments.



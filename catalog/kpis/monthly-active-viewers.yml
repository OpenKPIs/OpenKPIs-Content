KPI Name: Monthly Active Viewers
Formula: COUNT(DISTINCT canonical_viewer_id WHERE SUM(eligible_viewing_seconds within calendar month) >= 30)

Description: |
  Monthly Active Viewers counts distinct viewer identities that consume at least 30 seconds of eligible video content during a calendar month. Each qualifying viewer is counted once per month after applying identity resolution, content eligibility, bot filtering, and cross-device deduplication rules.

Category: Engagement

Tags: [kpi]

Industry: [Media & Streaming]

Priority: High

Core Area: Engagement

Scope: User

Measure Type: count

Aggregation Window: Time based - Monthly


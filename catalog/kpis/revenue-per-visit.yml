KPI Name: revenue-per-visit
Formula: Total Revenue / Total Visits

Description: |
  Revenue per visit measures the average revenue generated each time a user visits the website. It is crucial for understanding the effectiveness of the website in converting visits into revenue.

Category: Revenue


Industry: [["Retail, SaaS, E-commerce, Media, Technology, Other"]]

Priority: High

Core Area: Digital Analytics

Scope: Session












Dependencies:
  Events: [purchase]
  Metrics: [revenue, sessions/visits, currency code]

Source Data: Digital Analytics, Business Intelligence, ERP

Report Attributes: |
  Dimensions: Default channel group, Source/Medium, Campaign, Device category, Landing page, Country, New vs Returning; Metrics: Revenue, Sessions, Transactions, Conversion rate, Average order value, Revenue per visit

Dashboard Usage: [Executive KPI Dashboard, E-commerce Performance, Traffic Analysis, Channel Performance, Conversion Optimization]

Segment Eligibility: |
  True

Related KPIs: [conversion rate, average order value, transactions, revenue, revenue per user, cart-to-purchase rate, return on ad spend]

Data Sensitivity: Internal

Contains PII: No


SQL Query: |
  WITH session_revenue AS (
    SELECT
      user_pseudo_id,
      CONCAT(user_pseudo_id, '-', CAST((SELECT value.int_value FROM UNNEST(event_params) WHERE key = 'ga_session_id') AS STRING)) AS session_id,
      SUM(COALESCE(ecommerce.purchase_revenue, 0)) AS revenue
    FROM `project.dataset.events_*`
    WHERE event_name = 'purchase'
    GROUP BY 1,2
  ), sessions AS (
    SELECT DISTINCT
      user_pseudo_id,
      CONCAT(user_pseudo_id, '-', CAST((SELECT value.int_value FROM UNNEST(event_params) WHERE key = 'ga_session_id') AS STRING)) AS session_id
    FROM `project.dataset.events_*`
    WHERE (SELECT value.int_value FROM UNNEST(event_params) WHERE key = 'ga_session_id') IS NOT NULL
  )
  SELECT
    SAFE_DIVIDE(SUM(COALESCE(sr.revenue, 0)), COUNT(DISTINCT s.session_id)) AS revenue_per_visit
  FROM sessions s
  LEFT JOIN session_revenue sr
    ON s.session_id = sr.session_id;

Calculation Notes: |
  1)Use visits as sessions, not users or pageviews. 
  2)Include only completed revenue events such as purchase or paid conversion events, and exclude refunds, canceled orders, test transactions, internal traffic, bot traffic, and duplicate purchase events. If reporting net revenue per visit, subtract refunds from gross revenue. Ensure sessionization logic is consistent across web and app data. For cross-domain implementations, deduplicate sessions where identity stitching is available.

Business Use Case: |
  An e-commerce growth team monitors revenue per visit by channel and device. If paid social drives high traffic but low revenue per visit compared with email, the team can reduce spend on low-value campaigns, improve landing page relevance, or retarget higher-intent audiences.


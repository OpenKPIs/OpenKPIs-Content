KPI Name: revenue-per-visit
Formula: Total Revenue / Total Visits

Description: |
  Revenue per visit measures the average revenue generated each time a user visits the website. It is crucial for understanding the effectiveness of the website in converting visits into revenue.

Category: Revenue


Industry: [["Retail, E-commerce"]]

Priority: High

Core Area: Digital Analytics

Scope: Session

Measure Type: Counter

Aggregation Window: Session, Hourly, Weekly, Quarterly, Daily, Monthly, Yearly










Dependencies:
  KPIs: [total revenue, total visits]

Source Data: Digital Analytics

Report Attributes: |
  Revenue, Visits

Dashboard Usage: [C-Suite, Traffic Analysis]

Segment Eligibility: |
  yes

Related KPIs: [RPV, revenue-per-session]

Data Sensitivity: Internal

Contains PII: No


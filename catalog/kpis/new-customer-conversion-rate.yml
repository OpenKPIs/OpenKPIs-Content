Google Analytics SQL: |
  -- ==========================================
  -- 1. GOOGLE BIGQUERY SQL
  -- ==========================================
  DECLARE start_date DATE DEFAULT DATE '2026-08-01';
  DECLARE end_date DATE DEFAULT DATE '2026-08-31';
  DECLARE conversion_window_days INT64 DEFAULT 30;
  DECLARE lookback_days INT64 DEFAULT 395;
  
  WITH ga4_events AS (
    SELECT
      user_pseudo_id,
      user_id,
      event_name,
      TIMESTAMP_MICROS(event_timestamp) AS event_ts,
      PARSE_DATE('%Y%m%d', event_date) AS event_dt,
      COALESCE(
        ecommerce.transaction_id,
        (SELECT ep.value.string_value FROM UNNEST(event_params) AS ep WHERE ep.key = 'transaction_id')
      ) AS transaction_id,
      (SELECT ep.value.string_value FROM UNNEST(event_params) AS ep WHERE ep.key = 'traffic_type') AS traffic_type,
      (SELECT LOWER(COALESCE(ep.value.string_value, CAST(ep.value.int_value AS STRING)))
         FROM UNNEST(event_params) AS ep WHERE ep.key = 'first_order') AS ga4_first_order_flag
    FROM `your-project.analytics_123456789.events_*`
    WHERE _TABLE_SUFFIX BETWEEN FORMAT_DATE('%Y%m%d', DATE_SUB(start_date, INTERVAL lookback_days DAY))
                            AND FORMAT_DATE('%Y%m%d', DATE_ADD(end_date, INTERVAL conversion_window_days DAY))
      AND user_pseudo_id IS NOT NULL
  ),
  internal_devices AS (
    SELECT DISTINCT user_pseudo_id
    FROM ga4_events
    WHERE traffic_type = 'internal'
  ),
  identity_map AS (
    SELECT
      user_pseudo_id,
      ARRAY_AGG(user_id ORDER BY event_ts DESC LIMIT 1)[OFFSET(0)] AS user_id
    FROM ga4_events
    WHERE user_id IS NOT NULL
    GROUP BY user_pseudo_id
  ),
  crm_valid_orders AS (
    SELECT order_id, customer_id, order_timestamp, order_status
    FROM `your-project.crm.orders`
    WHERE order_status NOT IN ('test', 'fraud_cancelled')
      AND COALESCE(is_test_order, FALSE) = FALSE
  ),
  transaction_identity AS (
    SELECT
      e.user_pseudo_id,
      ARRAY_AGG(o.customer_id ORDER BY e.event_ts LIMIT 1)[OFFSET(0)] AS customer_id
    FROM ga4_events AS e
    JOIN crm_valid_orders AS o
      ON o.order_id = e.transaction_id
    WHERE e.event_name = 'purchase'
    GROUP BY e.user_pseudo_id
  ),
  device_first_visits AS (
    SELECT
      d.user_pseudo_id,
      d.first_visit_ts,
      d.first_visit_dt,
      COALESCE(im.user_id, ti.customer_id) AS customer_id
    FROM (
      SELECT user_pseudo_id, MIN(event_ts) AS first_visit_ts, MIN(event_dt) AS first_visit_dt
      FROM ga4_events
      WHERE event_name IN ('first_visit', 'first_open')
      GROUP BY user_pseudo_id
    ) AS d
    LEFT JOIN identity_map AS im USING (user_pseudo_id)
    LEFT JOIN transaction_identity AS ti USING (user_pseudo_id)
    LEFT JOIN internal_devices AS i USING (user_pseudo_id)
    WHERE i.user_pseudo_id IS NULL
  ),
  new_users AS (
    SELECT
      COALESCE(customer_id, user_pseudo_id) AS person_id,
      ANY_VALUE(customer_id) AS customer_id,
      MIN(first_visit_ts) AS first_visit_ts,
      MIN(first_visit_dt) AS cohort_date
    FROM device_first_visits
    GROUP BY person_id
    HAVING MIN(first_visit_dt) BETWEEN start_date AND end_date
  ),
  excluded_accounts AS (
    SELECT DISTINCT customer_id
    FROM `your-project.crm.customers`
    WHERE is_staff = TRUE OR is_test_account = TRUE
  ),
  prior_customers AS (
    SELECT DISTINCT n.person_id
    FROM new_users AS n
    JOIN crm_valid_orders AS o
      ON o.customer_id = n.customer_id
    WHERE o.order_status IN ('completed', 'returned', 'refunded')
      AND o.order_timestamp < n.first_visit_ts
  ),
  classified_new_users AS (
    SELECT
      n.person_id,
      n.customer_id,
      n.first_visit_ts,
      n.cohort_date,
      pc.person_id IS NOT NULL AS is_returning_customer
    FROM new_users AS n
    LEFT JOIN prior_customers AS pc ON pc.person_id = n.person_id
    LEFT JOIN excluded_accounts AS x ON x.customer_id = n.customer_id
    WHERE x.customer_id IS NULL
  ),
  earliest_orders AS (
    -- rank only qualifying orders placed on or after first visit; cancelled orders (any reason) never block a later valid order
    SELECT
      c.person_id,
      o.order_id,
      o.order_timestamp,
      o.order_status,
      ROW_NUMBER() OVER (PARTITION BY c.person_id ORDER BY o.order_timestamp, o.order_id) AS order_rank
    FROM classified_new_users AS c
    JOIN crm_valid_orders AS o
      ON o.customer_id = c.customer_id
    WHERE c.is_returning_customer = FALSE
      AND o.order_timestamp >= c.first_visit_ts
      AND LOWER(o.order_status) NOT LIKE '%cancel%'
  ),
  ga4_flagged_transactions AS (
    SELECT DISTINCT transaction_id
    FROM ga4_events
    WHERE event_name = 'purchase'
      AND ga4_first_order_flag IN ('true', '1')
  ),
  verified_first_orders AS (
    SELECT
      c.person_id,
      f.transaction_id IS NOT NULL AS ga4_tagged_first_order
    FROM classified_new_users AS c
    JOIN earliest_orders AS eo
      ON eo.person_id = c.person_id
     AND eo.order_rank = 1
    LEFT JOIN ga4_flagged_transactions AS f
      ON f.transaction_id = eo.order_id
    WHERE eo.order_timestamp >= c.first_visit_ts
      AND eo.order_timestamp < TIMESTAMP_ADD(c.first_visit_ts, INTERVAL conversion_window_days DAY)
  )
  SELECT
    c.cohort_date AS first_visit_date,
    COUNT(DISTINCT c.person_id) AS new_users_acquired,
    COUNT(DISTINCT IF(c.is_returning_customer, c.person_id, NULL)) AS reclassified_returning_users,
    COUNT(DISTINCT IF(NOT c.is_returning_customer, c.person_id, NULL)) AS verified_new_users,
    COUNT(DISTINCT v.person_id) AS new_customers_first_order,
    COUNT(DISTINCT IF(v.ga4_tagged_first_order, v.person_id, NULL)) AS ga4_tagged_first_orders,
    ROUND(
      SAFE_DIVIDE(
        COUNT(DISTINCT v.person_id),
        COUNT(DISTINCT IF(NOT c.is_returning_customer, c.person_id, NULL))
      ) * 100, 2
    ) AS new_customer_conversion_rate_pct,
    IF(c.cohort_date > DATE_SUB(CURRENT_DATE(), INTERVAL conversion_window_days DAY), 'provisional', 'closed') AS cohort_status
  FROM classified_new_users AS c
  LEFT JOIN verified_first_orders AS v
    ON v.person_id = c.person_id
  GROUP BY first_visit_date, cohort_status
  ORDER BY first_visit_date;

AEP Query Service SQL: |
  -- ==========================================
  -- 2. ADOBE AEP QUERY SERVICE SQL
  -- ==========================================
  WITH params AS (
    SELECT
      CAST('2026-08-01' AS DATE) AS start_date,
      CAST('2026-08-31' AS DATE) AS end_date,
      30 AS conversion_window_days,
      395 AS lookback_days
  ),
  xdm_events AS (
    SELECT
      e.identityMap['ECID'][0].id AS ecid,
      e.identityMap['CRMID'][0].id AS crm_id,
      e.timestamp AS event_ts,
      e.eventType AS event_type,
      e.commerce.order.purchaseID AS purchase_id,
      e.environment.browserDetails.userAgent AS user_agent,
      array_join(e.environment.ipV4, ',') AS ip_list
    FROM aep_web_app_experience_events AS e
    CROSS JOIN params AS p
    WHERE e.timestamp >= CAST(date_sub(p.start_date, p.lookback_days) AS TIMESTAMP)
      AND e.timestamp < CAST(date_add(p.end_date, p.conversion_window_days + 1) AS TIMESTAMP)
  ),
  bot_or_internal_devices AS (
    SELECT DISTINCT ecid
    FROM xdm_events
    WHERE ecid IS NOT NULL
      AND (
        COALESCE(user_agent, '') RLIKE '(?i)(bot|spider|crawler|headless)'
        OR COALESCE(ip_list, '') RLIKE '(^|,)(10[.]|192[.]168[.]|172[.](1[6-9]|2[0-9]|3[01])[.])'
      )
  ),
  identity_map AS (
    SELECT ecid, MAX(crm_id) AS customer_id
    FROM xdm_events
    WHERE ecid IS NOT NULL
      AND crm_id IS NOT NULL
    GROUP BY ecid
  ),
  crm_valid_orders AS (
    SELECT order_id, customer_id, order_timestamp, order_status
    FROM crm_orders_dataset
    WHERE order_status NOT IN ('test', 'fraud_cancelled')
      AND COALESCE(is_test_order, FALSE) = FALSE
  ),
  transaction_identity AS (
    SELECT e.ecid, MIN(o.customer_id) AS customer_id
    FROM xdm_events AS e
    JOIN crm_valid_orders AS o
      ON o.order_id = e.purchase_id
    WHERE e.event_type = 'commerce.purchases'
      AND e.ecid IS NOT NULL
    GROUP BY e.ecid
  ),
  device_first_visits AS (
    SELECT
      f.ecid,
      f.first_visit_ts,
      COALESCE(im.customer_id, ti.customer_id) AS customer_id
    FROM (
      SELECT ecid, MIN(event_ts) AS first_visit_ts
      FROM xdm_events
      WHERE ecid IS NOT NULL
      GROUP BY ecid
    ) AS f
    LEFT JOIN identity_map AS im ON im.ecid = f.ecid
    LEFT JOIN transaction_identity AS ti ON ti.ecid = f.ecid
    LEFT JOIN bot_or_internal_devices AS b ON b.ecid = f.ecid
    WHERE b.ecid IS NULL
  ),
  new_users AS (
    SELECT
      COALESCE(d.customer_id, d.ecid) AS person_id,
      MAX(d.customer_id) AS customer_id,
      MIN(d.first_visit_ts) AS first_visit_ts,
      CAST(MIN(d.first_visit_ts) AS DATE) AS cohort_date
    FROM device_first_visits AS d
    GROUP BY COALESCE(d.customer_id, d.ecid)
  ),
  in_period_new_users AS (
    SELECT n.person_id, n.customer_id, n.first_visit_ts, n.cohort_date
    FROM new_users AS n
    CROSS JOIN params AS p
    WHERE n.cohort_date BETWEEN p.start_date AND p.end_date
  ),
  excluded_accounts AS (
    SELECT DISTINCT customer_id
    FROM crm_customers_dataset
    WHERE is_staff = TRUE OR is_test_account = TRUE
  ),
  prior_customers AS (
    SELECT DISTINCT n.person_id
    FROM in_period_new_users AS n
    JOIN crm_valid_orders AS o
      ON o.customer_id = n.customer_id
    WHERE o.order_status IN ('completed', 'returned', 'refunded')
      AND o.order_timestamp < n.first_visit_ts
  ),
  classified_new_users AS (
    SELECT
      n.person_id,
      n.customer_id,
      n.first_visit_ts,
      n.cohort_date,
      CASE WHEN pc.person_id IS NOT NULL THEN TRUE ELSE FALSE END AS is_returning_customer
    FROM in_period_new_users AS n
    LEFT JOIN prior_customers AS pc ON pc.person_id = n.person_id
    LEFT JOIN excluded_accounts AS x ON x.customer_id = n.customer_id
    WHERE x.customer_id IS NULL
  ),
  earliest_orders AS (
    -- rank only qualifying orders placed on or after first visit; cancelled orders (any reason) never block a later valid order
    SELECT
      c.person_id,
      o.order_id,
      o.order_timestamp,
      o.order_status,
      ROW_NUMBER() OVER (PARTITION BY c.person_id ORDER BY o.order_timestamp, o.order_id) AS order_rank
    FROM classified_new_users AS c
    JOIN crm_valid_orders AS o
      ON o.customer_id = c.customer_id
    WHERE c.is_returning_customer = FALSE
      AND o.order_timestamp >= c.first_visit_ts
      AND LOWER(o.order_status) NOT LIKE '%cancel%'
  ),
  verified_first_orders AS (
    SELECT c.person_id
    FROM classified_new_users AS c
    JOIN earliest_orders AS eo
      ON eo.person_id = c.person_id
     AND eo.order_rank = 1
    CROSS JOIN params AS p
    WHERE eo.order_timestamp >= c.first_visit_ts
      AND unix_timestamp(eo.order_timestamp) < unix_timestamp(c.first_visit_ts) + p.conversion_window_days * 86400
  )
  SELECT
    c.cohort_date AS first_visit_date,
    COUNT(DISTINCT c.person_id) AS new_users_acquired,
    COUNT(DISTINCT CASE WHEN c.is_returning_customer THEN c.person_id END) AS reclassified_returning_users,
    COUNT(DISTINCT CASE WHEN NOT c.is_returning_customer THEN c.person_id END) AS verified_new_users,
    COUNT(DISTINCT v.person_id) AS new_customers_first_order,
    ROUND(
      100.0 * COUNT(DISTINCT v.person_id)
      / NULLIF(COUNT(DISTINCT CASE WHEN NOT c.is_returning_customer THEN c.person_id END), 0), 2
    ) AS new_customer_conversion_rate_pct,
    CASE
      WHEN c.cohort_date > date_sub(current_date(), p.conversion_window_days) THEN 'provisional'
      ELSE 'closed'
    END AS cohort_status
  FROM classified_new_users AS c
  CROSS JOIN params AS p
  LEFT JOIN verified_first_orders AS v
    ON v.person_id = c.person_id
  GROUP BY c.cohort_date, p.conversion_window_days
  ORDER BY first_visit_date;

Calculation Notes: |
  1️⃣ Denominator is every new user whose first_visit / first_open falls in the reporting period, deduplicated to one person via user_id where a login or checkout identity exists and user_pseudo_id otherwise, with the earliest first_visit taken over a 395-day lookback so a person first seen on another device before the period is not counted as new; non-converting new users remain in the base.
  2️⃣ A GA4 new user whose stitched identity (customer ID or hashed email) matches a CRM customer with a completed order dated before their first_visit is reclassified as returning and removed from both numerator and denominator, so cookie resets and new devices do not inflate the rate.
  3️⃣ Numerator counts a user once, on their first order: the earliest order placed on or after first_visit, excluding cancelled (any reason) and test orders, is ranked as the first qualifying order; pending orders count provisionally (see 4️⃣). Orders before first_visit only make a user returning when their status is completed, returned or refunded (see 2️⃣). Second and later orders in the window never add to the count.
  4️⃣ Cohort timing: the first order must occur within 30 days of first_visit and is credited to the first_visit date, so the latest 30 days of cohorts, and any cohort whose first orders are still pending, are immature and must be labelled provisional rather than compared against closed periods.
  5️⃣ The KPI is user-scoped, not session-scoped: app and web activity for the same user_id collapses into one new user, resolved as the SQL does it (latest logged-in user_id per device, else the CRM customer on a matched purchase, else user_pseudo_id); aep_sql instead uses the CRMID present on the ECID's events (MAX when several) and treats an ECID's earliest event in the lookback as its first visit.
  6️⃣ A first conversion is the earliest placed order in the 30-day window whose status is not cancelled (any cancellation reason) and not a test order; pending orders count provisionally under the provisional-cohort label in 4️⃣, and orders later returned or refunded still count. The ga4_tagged_first_orders column (from the data-layer first_order flag) is a tagging-coverage check only and does not drive the KPI. Internal IP ranges, known bots and spiders, and staff and test accounts are excluded.
  7️⃣ First orders placed offline (store pickup, call centre) by a digitally acquired new user count in the numerator only when the CRM order links to that user's stitched identity; offline-only customers with no web or app first_visit are out of scope.

Business Use Case: |
  1️⃣ The Head of Performance Marketing reviews the rate weekly by first-touch channel and campaign; when a paid prospecting campaign drives new users at or above plan but converts below half the site-wide new customer rate for two consecutive weeks, budget is reallocated to the campaigns producing verified first orders.
  2️⃣ The CRO and UX team monitors the rate daily by landing page and device; a drop of more than 15% against the trailing four-week baseline on a top-entry landing template triggers a funnel diagnosis and prioritised A/B test on that template.
  3️⃣ The Growth Finance lead combines the monthly rate with Customer Acquisition Cost to compute cost per verified new customer, and adjusts the next quarter's acquisition budget and first-order incentive (welcome discount depth) when the implied payback period exceeds target.
  4️⃣ The CRM and Lifecycle Marketing team uses the gap between new users and verified first orders to size the welcome-journey audience, and escalates to the identity team when the share of new users reclassified as returning exceeds 10%, signalling a stitching or consent-mode gap.


# KPI: New Customer Conversion Rate
# Generated: 2026-09-15T13:48:24.186Z
# Contributed by: devyendarm
# Last modified by: devyendarm

KPI Name: New Customer Conversion Rate
Formula: (Verified New Users Placing a First Non-Cancelled, Non-Test Order within 30 Days of First Visit / Verified New Users Acquired in the Period, excluding CRM-matched returning customers and staff/test accounts) × 100

Description: |
  E-commerce specialisation of Conversion Rate: the percentage of new users acquired in a period who place their first-ever order, where "first-ever" is confirmed against stitched CRM order history rather than inferred from browser cookies alone. It measures how efficiently acquisition traffic is turned into genuinely net-new customers, separating true customer growth from repeat buyers arriving on new devices or cleared cookies.

Category: Conversion

Tags: [kpi, E-commerce: Top-of-Funnel & Marketing Acquisition]

Industry: [["E-commerce"]]

Priority: High

Core Area: Checkout

Scope: User

Measure Type: Percentage

Aggregation Window: Daily, Weekly, Monthly


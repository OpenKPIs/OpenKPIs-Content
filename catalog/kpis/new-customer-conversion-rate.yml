# KPI: New Customer Conversion Rate
# Generated: 2026-09-13T22:53:43.925Z
# Contributed by: devyendarm


KPI Name: New Customer Conversion Rate
Formula: (New Users Placing a Verified First-Ever Order within the Conversion Window / Total New Users Acquired in the Period) × 100

Description: |
  E-commerce specialisation of Conversion Rate: the percentage of new users acquired in a period who place their first-ever order, where "first-ever" is confirmed against stitched CRM order history rather than inferred from browser cookies alone. It measures how efficiently acquisition traffic is turned into genuinely net-new customers, separating true customer growth from repeat buyers arriving on new devices or cleared cookies.

Category: Conversion


























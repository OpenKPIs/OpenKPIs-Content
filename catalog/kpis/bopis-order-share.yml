# KPI: BOPIS Order Share
# Generated: 2026-09-21T17:11:42.530Z
# Contributed by: devyendarm


KPI Name: BOPIS Order Share
Formula: BOPIS Order Share (%) = (COUNT(DISTINCT transaction_id of completed online orders with at least one line where fulfillment_method = pickup_in_store, curbside included) / COUNT(DISTINCT transaction_id of all completed online orders in the period, every fulfilment method)) × 100

Description: |
  BOPIS Order Share is the percentage of all online orders placed in a period (web and app, every fulfilment method) that the customer chose to collect in store from that store's inventory, curbside pickup included. It shows how much digital demand the store network absorbs instead of parcel delivery, which drives store labour planning, pickup-eligible inventory and last-mile shipping cost.


KPI Name: Content Discovery Success Rate
Formula: (Number of Successful Discovery Sessions / Number of Eligible Discovery Sessions) × 100

Description: |
  Measures the percentage of eligible discovery sessions in which a user finds and begins consuming content attributable to a search, browse, recommendation, or navigation action. A session is successful only when the discovered content reaches the defined qualified-consumption threshold within the attribution window.

Category: Conversion

Tags: [kpi]

Industry: [Media & Streaming]

Priority: High

Core Area: Discovery

Scope: Session

Measure Type: percentage

Aggregation Window: Time based - Daily


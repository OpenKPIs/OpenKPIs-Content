KPI Name: Online Revenue
Formula: SUM(purchase revenue) for completed online orders; recommended GA4 calculation = SUM(ecommerce.purchase_revenue) or SUM(event parameter value) for event_name = 'purchase'

Description: |
  Online Revenue measures the total monetary value of completed eCommerce purchases through the website or app, net of discounts when available and excluding tax and shipping unless explicitly included by the business definition. It is a primary indicator of commercial performance and merchandising effectiveness.

Category: Revenue

Tags: [revenue, ecommerce, purchase, sales, orders, checkout, merchandising]

Industry: [["Retail","E-commerce"]]

Priority: High

Core Area: Digital Analytics

Scope: Event

Measure Type: currency

Aggregation Window: Event, Session, User, Time based - Hourly/Daily/Weekly/Monthly/Quarterly/Yearly

GA4 Event: |
  purchase


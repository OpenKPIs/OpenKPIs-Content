KPI Name: Online Revenue
Formula: SUM(Purchase Item Revenue after discounts) - SUM(Refunded Item Revenue), excluding tax and shipping unless otherwise defined by finance policy.

Description: |
  Total net merchandise revenue generated by completed online purchases for sporting goods, footwear, and apparel. This KPI indicates digital sales performance and is used to monitor growth, merchandising effectiveness, and campaign profitability.

Category: Revenue

Tags: [ecommerce, revenue, online-sales, purchase, merchandise-revenue, sporting-goods, footwear, apparel]

Industry: [["Retail","E-commerce"]]

Priority: High

Core Area: Digital Analytics

Scope: Global

Measure Type: currency

Aggregation Window: Event, Session, User, Time based - Hourly/Daily/Monthly/Yearly

GA4 Event: |
  purchase

Adobe Event: |
  purchase


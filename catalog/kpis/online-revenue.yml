XDM Mapping: |
  {"xdm.commerce.purchases.value":"1","xdm.commerce.order.purchaseID":"ecommerce.transaction_id","xdm.commerce.order.currencyCode":"ecommerce.currency","xdm.commerce.order.priceTotal":"ecommerce.revenue","xdm.commerce.order.taxAmount":"ecommerce.tax","xdm.commerce.order.shippingAmount":"ecommerce.shipping","xdm.productListItems[].SKU":"ecommerce.items[].product_id","xdm.productListItems[].name":"ecommerce.items[].product_name","xdm.productListItems[].priceTotal":"ecommerce.items[].price * ecommerce.items[].quantity","xdm.productListItems[].quantity":"ecommerce.items[].quantity","xdm.productListItems[].categories[].categoryID":"ecommerce.items[].category","xdm._tenant.product.sport":"ecommerce.items[].sport"}

SQL Query: |
  SELECT DATE(TIMESTAMP_MICROS(event_timestamp)) AS event_date, SUM(CASE WHEN event_name = 'purchase' THEN item.price * item.quantity WHEN event_name = 'refund' THEN -1 * item.price * item.quantity ELSE 0 END) AS online_revenue FROM `project.dataset.events_*`, UNNEST(items) AS item WHERE event_name IN ('purchase','refund') GROUP BY event_date ORDER BY event_date;

Calculation Notes: |
  Use completed purchase events only. Deduplicate duplicate transaction IDs before aggregation. Exclude test orders, cancelled orders, internal employee orders, gift card tender value if treated as liability, and taxes/shipping unless finance defines revenue as gross order value. Refunds should be subtracted in the period in which the refund occurs or restated to the original order date based on reporting policy.

Business Use Case: |
  The eCommerce leadership team tracks Online Revenue by sport, product category, campaign, and device to identify growth areas and underperforming merchandising segments, such as running footwear revenue declining after a product detail page redesign.


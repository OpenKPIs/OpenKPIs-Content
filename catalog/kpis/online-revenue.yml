SQL Query: |
  SELECT
    event_date,
    SUM(ecommerce.purchase_revenue) AS online_revenue,
    COUNT(DISTINCT ecommerce.transaction_id) AS orders
  FROM `project.dataset.events_*`
  WHERE event_name = 'purchase'
    AND ecommerce.transaction_id IS NOT NULL
  GROUP BY event_date
  ORDER BY event_date;

Calculation Notes: |
  Deduplicate purchases by transaction_id if the same order can fire multiple purchase events. Align the revenue definition with finance: GA4 purchase_revenue usually excludes tax and shipping, while the event parameter value may include or exclude them depending on implementation. Exclude canceled, test, fraud, internal QA, and fully refunded orders where downstream order-status data is available. Use consistent currency conversion when reporting across markets.

Business Use Case: |
  The eCommerce leadership team monitors Online Revenue by channel, campaign, device, category, and fulfillment type to identify revenue declines, prioritize merchandising changes, and optimize paid media spend toward higher-value traffic.

Dependencies: |
  purchase event; transaction_id; ecommerce.value or ecommerce.purchase_revenue; currency; items array; order status/refund data; campaign/source/medium; device category


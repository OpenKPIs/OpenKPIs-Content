Google Analytics SQL: |
  -- ==========================================
  -- 1. GOOGLE BIGQUERY SQL
  -- ==========================================
  -- Item revenue per day and SKU from the GA4 export (purchase events, deduplicated by transaction_id)
  WITH purchases AS (
    SELECT
      PARSE_DATE('%Y%m%d', event_date) AS event_date,
      ecommerce.transaction_id AS transaction_id,
      item.item_id,
      item.item_name,
      item.item_category,
      COALESCE(item.quantity, 0) AS quantity,
      COALESCE(item.item_revenue_in_usd, item.price_in_usd * item.quantity, 0) AS item_revenue_usd,
      ROW_NUMBER() OVER (
        PARTITION BY ecommerce.transaction_id, item.item_id, item.item_variant
        ORDER BY event_timestamp
      ) AS rn
    FROM `your-project.analytics_123456789.events_*`,
      UNNEST(items) AS item
    WHERE _TABLE_SUFFIX BETWEEN FORMAT_DATE('%Y%m%d', DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY))
                            AND FORMAT_DATE('%Y%m%d', DATE_SUB(CURRENT_DATE(), INTERVAL 1 DAY))
      AND event_name = 'purchase'
      AND ecommerce.transaction_id IS NOT NULL
      AND ecommerce.transaction_id != '(not set)'
  )
  SELECT
    event_date,
    item_id,
    ANY_VALUE(item_name) AS item_name,
    ANY_VALUE(item_category) AS item_category,
    SUM(quantity) AS items_purchased,
    ROUND(SUM(item_revenue_usd), 2) AS item_revenue_usd
  FROM purchases
  WHERE rn = 1
  GROUP BY event_date, item_id
  ORDER BY event_date, item_revenue_usd DESC;

AEP Query Service SQL: |
  -- ==========================================
  -- 2. ADOBE AEP QUERY SERVICE SQL
  -- ==========================================
  -- Item revenue per day and SKU from the ExperienceEvent dataset (commerce.purchases, deduplicated by purchaseID)
  WITH purchase_items AS (
    SELECT
      CAST(e.timestamp AS DATE) AS event_date,
      e.commerce.order.purchaseID AS purchase_id,
      e.timestamp AS event_ts,
      explode(e.productListItems) AS pli
    FROM analytics_experience_events e
    WHERE e.commerce.purchases.value = 1
      AND e.commerce.order.purchaseID IS NOT NULL
      AND e.timestamp >= date_sub(current_date(), 30)
      AND e.timestamp < current_date()
  ),
  ranked AS (
    SELECT
      event_date,
      purchase_id,
      pli.SKU AS item_id,
      pli.name AS item_name,
      COALESCE(pli.quantity, 0) AS quantity,
      COALESCE(pli.priceTotal, 0) AS item_revenue,
      ROW_NUMBER() OVER (PARTITION BY purchase_id, pli.SKU ORDER BY event_ts) AS rn
    FROM purchase_items
  )
  SELECT
    event_date,
    item_id,
    MAX(item_name) AS item_name,
    SUM(quantity) AS items_purchased,
    ROUND(SUM(item_revenue), 2) AS item_revenue
  FROM ranked
  WHERE rn = 1
  GROUP BY event_date, item_id
  ORDER BY event_date, item_revenue DESC;

Calculation Notes: |
  1️⃣ Computed per line item from the purchase event items array as price × quantity, where price is the unit price after item-level discounts (coupon / promotion reductions already applied to the item).
  2️⃣ Excludes tax, shipping and order-level fees; order-level discounts not allocated to items are not deducted, so the sum of item revenue can differ slightly from order revenue.
  3️⃣ Returns and refunds are not netted inside this KPI; they are captured by the refund event and reported alongside it as item refund amount (net item revenue = item revenue − item refund amount).
  4️⃣ Deduplicate on transaction_id so a purchase event re-fired on a thank-you page reload is counted once; exclude test orders and zero-value internal transactions.
  5️⃣ Report in a single currency: use the reporting-currency field (item_revenue_in_usd in GA4 export) or convert at the order-date exchange rate when stores sell in several currencies.
  6️⃣ Attribute revenue to the event date of the purchase in the property time zone; late-arriving hits within the export's 72-hour window may restate the last three days.

Business Use Case: |
  1️⃣ The merchandising team reviews weekly item revenue by SKU and category and, when a top-20 product drops more than 15% week over week, checks stock, pricing and on-site placement before the next promotional cycle.
  2️⃣ Inventory planners use monthly item revenue per SKU to set replenishment quantities and flag long-tail items with negligible revenue for markdown or delisting.
  3️⃣ The marketing team compares item revenue for promoted products during a campaign against the prior period to decide whether to extend, rebudget or stop the promotion.
  4️⃣ Finance reconciles monthly item revenue with order revenue and the ERP sales ledger, investigating any gap above 2% as a tracking or discount-allocation issue.


KPI Name: Item revenue
Formula: SUM(Item Price × Item Quantity) across all items in purchase events for the period

Description: |
  Item revenue is the total revenue earned from purchased products, calculated at line-item level as unit price multiplied by quantity for every item in completed orders, excluding tax and shipping. It shows how much each product, SKU, brand or category contributes to sales, so merchandising and finance teams can rank assortment performance independently of order-level totals.


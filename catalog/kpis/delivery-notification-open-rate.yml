# KPI: Delivery Notification Open Rate
# Generated: 2026-09-19T21:41:28.555Z
# Contributed by: devyendarm
# Last modified by: devyendarm

KPI Name: Delivery Notification Open Rate
Formula: (Unique Opened Delivery Notifications / Delivered Delivery Notifications) × 100, where the numerator counts distinct notification message_ids with at least one qualifying (non-machine) open within 7 days of delivery and the denominator counts distinct notification message_ids confirmed delivered in the same send cohort

Description: |
  Share of delivered shipping and delivery notifications (shipment confirmation, in transit, out for delivery, delivered and delay messages sent by email or push) that the customer opened at least once within the attribution window, computed per channel from ESP and push provider send and open logs. It measures how effectively post-purchase tracking communication reaches customers, is a leading indicator of 'where is my order' contact deflection, and is reported MPP-adjusted so Apple Mail Privacy Protection prefetches do not inflate the email figure.

Category: Engagement

Tags: [kpi, E-commerce: Post-Purchase Logistics & Fulfillment, transactional-messaging, wismo]

Industry: [["E-commerce"]]


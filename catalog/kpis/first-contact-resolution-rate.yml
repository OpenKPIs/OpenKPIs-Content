KPI Name: First Contact Resolution Rate
Formula: (Contacts Resolved With No Re-Contact Within 7 Days / Total Contacts Resolved In Period) × 100

Description: |
  Canonical service-quality KPI measuring the share of customer support contacts fully resolved during the first interaction, with no re-contact by the same customer on the same issue inside the benchmark re-contact window. It is the generic definition that the industry variants Guest Complaint Resolution Rate (Hospitality) and Learner Support Resolution Rate (Education) specialise, so changes here set the measurement standard those rows inherit.

Category: Experience


























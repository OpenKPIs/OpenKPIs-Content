KPI Name: Net Promoter Score
Formula: ((Promoter Responses − Detractor Responses) / Valid Survey Responses) × 100

Description: |
  Promoters (9–10) minus Detractors (0–6) as a share of all answers to the 0–10 likelihood-to-recommend question, from −100 to +100. Measures loyalty and advocacy, unlike CSAT, which rates one interaction.

Category: Experience


























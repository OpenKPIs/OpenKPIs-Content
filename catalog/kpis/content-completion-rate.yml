KPI Name: Content Completion Rate
Formula: (Number of Qualified Playback Attempts Completed / Total Number of Qualified Playback Attempts Started) × 100

Description: |
  Measures the percentage of qualified playback attempts that reach the defined completion threshold for eligible on-demand content. It indicates how consistently viewers consume content through its intended end after starting playback.

Category: Engagement

Tags: [kpi]

Industry: [Media & Streaming]

Priority: High

Core Area: Engagement

Scope: Item

Measure Type: percentage

Aggregation Window: Time based - Daily, with weekly and monthly rollups

GA4 Event: |
  video_complete

Adobe Event: |
  media.complete


KPI Name: Recommendation-Attributed Revenue Rate
Formula: (Item Revenue from Recommendation-Attributed Items / Total Item Revenue) × 100

Description: |
  Share of item revenue from purchased products the shopper selected in an on-site recommendation module. Also known as Recommendation Revenue Share; shows how much sales depend on recommendations.

Category: Monetization

Tags: [kpi, E-commerce: Product Discovery & Merchandising (Search/Filters/PDP)]

Industry: [["E-commerce"]]

Priority: Medium

Core Area: Discovery

Scope: Global

Measure Type: Percentage

Aggregation Window: Daily, Weekly, Monthly


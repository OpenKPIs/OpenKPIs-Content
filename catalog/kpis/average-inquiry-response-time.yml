KPI Name: Average Inquiry Response Time
Formula: Σ(First Qualifying Human Response Timestamp − Inquiry Received Timestamp) in minutes / Count of eligible digital inquiries with a qualifying human response

Description: |
  Measures the arithmetic mean elapsed time, in minutes, between receipt of an eligible digital inquiry and the earliest qualifying customer-visible human response. It quantifies operational responsiveness while excluding unanswered inquiries from the average so response coverage must be evaluated separately.

Category: Efficiency

Tags: [kpi]

Industry: [Technology]

Priority: High

Core Area: Engagement

Scope: Event

Measure Type: average

Aggregation Window: Time based - Hourly/Daily/Monthly/Yearly


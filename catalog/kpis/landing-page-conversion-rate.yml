Google Analytics SQL: |
  -- ==========================================
  -- 1. GOOGLE BIGQUERY SQL
  -- ==========================================
  WITH events AS (
    SELECT
      CONCAT(
        user_pseudo_id, '.',
        CAST((SELECT ep.value.int_value FROM UNNEST(event_params) AS ep WHERE ep.key = 'ga_session_id') AS STRING)
      ) AS session_key,
      PARSE_DATE('%Y%m%d', event_date) AS event_date,
      event_timestamp,
      event_name,
      (SELECT ep.value.string_value FROM UNNEST(event_params) AS ep WHERE ep.key = 'page_location') AS page_location,
      (SELECT ep.value.int_value FROM UNNEST(event_params) AS ep WHERE ep.key = 'entrances') AS entrances,
      COALESCE(
        NULLIF(ecommerce.transaction_id, '(not set)'),
        (SELECT ep.value.string_value FROM UNNEST(event_params) AS ep WHERE ep.key = 'transaction_id')
      ) AS transaction_id,
      (SELECT ep.value.string_value FROM UNNEST(event_params) AS ep WHERE ep.key = 'traffic_type') AS traffic_type
    FROM `your-project.analytics_123456789.events_*`
    -- Daily export tables only (intraday excluded); one extra leading day so sessions keep their true start date
    WHERE _TABLE_SUFFIX BETWEEN FORMAT_DATE('%Y%m%d', DATE_SUB(CURRENT_DATE(), INTERVAL 33 DAY))
                            AND FORMAT_DATE('%Y%m%d', DATE_SUB(CURRENT_DATE(), INTERVAL 3 DAY))
      AND user_pseudo_id IS NOT NULL
  ),
  
  -- Each transaction_id counts once (confirmation-page reloads removed) and belongs to the session of its first hit
  purchases AS (
    SELECT
      session_key
    FROM events
    WHERE event_name = 'purchase'
      AND session_key IS NOT NULL
      AND transaction_id IS NOT NULL
      AND transaction_id NOT IN ('', '(not set)')
      AND NOT STARTS_WITH(LOWER(transaction_id), 'test')
    QUALIFY ROW_NUMBER() OVER (PARTITION BY transaction_id ORDER BY event_timestamp) = 1
  ),
  
  sessions AS (
    SELECT
      session_key,
      ARRAY_AGG(event_date ORDER BY event_timestamp LIMIT 1)[OFFSET(0)] AS session_start_date,
      ARRAY_AGG(
        IF(event_name = 'page_view', page_location, NULL) IGNORE NULLS
        ORDER BY IF(entrances = 1, 0, 1), event_timestamp
        LIMIT 1
      )[SAFE_OFFSET(0)] AS landing_page_raw,
      COUNTIF(traffic_type = 'internal') > 0 AS is_internal
    FROM events
    WHERE session_key IS NOT NULL
    GROUP BY session_key
  ),
  
  session_landing AS (
    SELECT
      s.session_key,
      s.session_start_date,
      s.is_internal,
      COALESCE(
        NULLIF(
          REGEXP_REPLACE(
            REGEXP_REPLACE(
              REGEXP_REPLACE(
                REGEXP_REPLACE(
                  REGEXP_REPLACE(
                    REGEXP_REPLACE(LOWER(s.landing_page_raw), r'[#].*$', ''),
                    r'([?&])(utm_[^=&]*|gclid|gbraid|wbraid|dclid|fbclid|msclkid|_gl|sessionid|sid)=[^&]*', r'\1'),
                  r'&{2,}', '&'),
                r'[?]&+', '?'),
              r'[?&]+$', ''),
            r'/+([?]|$)', r'\1'),
          ''),
        '(not set)'
      ) AS landing_page,
      p.session_key IS NOT NULL AS has_purchase
    FROM sessions AS s
    LEFT JOIN (SELECT DISTINCT session_key FROM purchases) AS p
      ON s.session_key = p.session_key
  ),
  
  landing_page_rates AS (
    SELECT
      GROUPING(landing_page) = 1 AS is_site_total,
      landing_page,
      COUNT(*) AS entrance_sessions,
      COUNTIF(has_purchase) AS purchase_sessions
    FROM session_landing
    WHERE NOT is_internal
      AND session_start_date BETWEEN DATE_SUB(CURRENT_DATE(), INTERVAL 32 DAY)
                                 AND DATE_SUB(CURRENT_DATE(), INTERVAL 4 DAY)
    GROUP BY ROLLUP (landing_page)
  )
  
  SELECT
    IF(is_site_total, '(all landing pages)', landing_page) AS landing_page,
    entrance_sessions,
    purchase_sessions,
    ROUND(SAFE_DIVIDE(purchase_sessions, entrance_sessions) * 100, 2) AS landing_page_conversion_rate_pct
  FROM landing_page_rates
  WHERE is_site_total
     OR (landing_page <> '(not set)' AND entrance_sessions >= 200)
  ORDER BY is_site_total DESC, entrance_sessions DESC

AEP Query Service SQL: |
  -- ==========================================
  -- 2. ADOBE AEP QUERY SERVICE SQL
  -- ==========================================
  -- _tenant.trafficType is the tenant internal-traffic flag: replace _tenant with your tenant namespace.
  WITH hits AS (
    SELECT
      identityMap['ECID'][0].id AS ecid,
      timestamp,
      eventType,
      web.webPageDetails.URL AS page_url,
      commerce.order.purchaseID AS purchase_id,
      commerce.purchases.value AS purchases,
      _tenant.trafficType AS traffic_type,
      SESS_TIMEOUT(timestamp, 60 * 30) OVER (
        PARTITION BY identityMap['ECID'][0].id
        ORDER BY timestamp
        ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW
      ) AS session
    FROM aep_web_events_dataset
    WHERE timestamp >= CAST(date_sub(current_date(), 33) AS TIMESTAMP)
      AND timestamp <  CAST(date_sub(current_date(), 2) AS TIMESTAMP)
      AND identityMap['ECID'][0].id IS NOT NULL
      AND NOT (LOWER(COALESCE(environment.browserDetails.userAgent, '')) RLIKE 'bot|spider|crawl')
  ),
  
  session_hits AS (
    SELECT
      CONCAT(ecid, '-', CAST(session.num AS STRING)) AS session_key,
      timestamp,
      eventType,
      page_url,
      purchase_id,
      purchases,
      traffic_type
    FROM hits
  ),
  
  landing AS (
    SELECT
      session_key,
      page_url AS landing_page_raw
    FROM (
      SELECT
        session_key,
        page_url,
        ROW_NUMBER() OVER (PARTITION BY session_key ORDER BY timestamp) AS rn
      FROM session_hits
      WHERE eventType = 'web.webpagedetails.pageViews'
        AND page_url IS NOT NULL
    ) AS pv
    WHERE rn = 1
  ),
  
  -- Each purchaseID counts once (confirmation-page reloads removed) and belongs to the session of its first hit
  purchases AS (
    SELECT DISTINCT
      session_key
    FROM (
      SELECT
        session_key,
        ROW_NUMBER() OVER (PARTITION BY purchase_id ORDER BY timestamp) AS rn
      FROM session_hits
      WHERE eventType = 'commerce.purchases'
        AND COALESCE(purchases, 0) > 0
        AND purchase_id IS NOT NULL
        AND purchase_id <> ''
        AND LOWER(purchase_id) NOT LIKE 'test%'
    ) AS p
    WHERE rn = 1
  ),
  
  sessions AS (
    SELECT
      session_key,
      to_date(MIN(timestamp)) AS session_start_date,
      MAX(CASE WHEN LOWER(COALESCE(traffic_type, '')) = 'internal' THEN 1 ELSE 0 END) AS is_internal
    FROM session_hits
    GROUP BY session_key
  ),
  
  session_landing AS (
    SELECT
      s.session_key,
      s.session_start_date,
      s.is_internal,
      COALESCE(
        NULLIF(
          regexp_replace(
            regexp_replace(
              regexp_replace(
                regexp_replace(
                  regexp_replace(
                    regexp_replace(LOWER(l.landing_page_raw), '[#].*$', ''),
                    '([?&])(utm_[^=&]*|gclid|gbraid|wbraid|dclid|fbclid|msclkid|_gl|sessionid|sid)=[^&]*', '$1'),
                  '&{2,}', '&'),
                '[?]&+', '?'),
              '[?&]+$', ''),
            '/+([?]|$)', '$1'),
          ''),
        '(not set)'
      ) AS landing_page,
      CASE WHEN p.session_key IS NOT NULL THEN 1 ELSE 0 END AS has_purchase
    FROM sessions AS s
    LEFT JOIN landing AS l
      ON s.session_key = l.session_key
    LEFT JOIN purchases AS p
      ON s.session_key = p.session_key
  ),
  
  landing_page_rates AS (
    SELECT
      GROUPING(landing_page) = 1 AS is_site_total,
      landing_page,
      COUNT(*) AS entrance_sessions,
      SUM(has_purchase) AS purchase_sessions
    FROM session_landing
    WHERE is_internal = 0
      AND session_start_date BETWEEN date_sub(current_date(), 32)
                                 AND date_sub(current_date(), 4)
    GROUP BY ROLLUP (landing_page)
  )
  
  SELECT
    CASE WHEN is_site_total THEN '(all landing pages)' ELSE landing_page END AS landing_page,
    entrance_sessions,
    purchase_sessions,
    ROUND(CAST(purchase_sessions AS DOUBLE) / NULLIF(entrance_sessions, 0) * 100, 2) AS landing_page_conversion_rate_pct
  FROM landing_page_rates
  WHERE is_site_total
     OR (landing_page <> '(not set)' AND entrance_sessions >= 200)
  ORDER BY is_site_total DESC, entrance_sessions DESC

Calculation Notes: |
  1️⃣ The landing page is the page_location of the first page_view in the session (GA4 landingPagePlusQueryString, Adobe Entry Page); sessions with no page_view, such as Measurement Protocol-only or app-only sessions, resolve to (not set) and are kept in the site total but excluded from page-level ranking. GA4 selects the page_view with entrances = 1, while AEP takes the first page view of the session, so small differences between the two sources are expected.
  2️⃣ The numerator counts distinct sessions containing at least one purchase with a non-null transaction_id; multiple orders in one session count once, and duplicate purchase hits from confirmation-page reloads are removed by transaction_id before counting.
  3️⃣ The denominator is every entrance session on the landing page, including bounced and non-engaged sessions; restricting it to engaged sessions produces a different measure and must not be labelled with this KPI.
  4️⃣ Sessions close after 30 minutes of inactivity and are not restarted by a mid-session campaign change or midnight rollover, so each session keeps its original landing page; purchases completed in a later session are out of scope and belong to user-scoped attribution KPIs.
  5️⃣ Normalise the page key before grouping: lowercase the path, strip trailing slashes and tracking parameters (utm_*, gclid, fbclid, msclkid, session tokens), retain only governed functional parameters, and map localised or templated URLs to a landing page group for cross-market comparison; the landing page group is a reporting-layer mapping of landing page paths (lookup table or BI calculated field) and is not built in either SQL query.
  6️⃣ Exclude internal traffic (GA4 traffic_type = internal, AEP tenant trafficType = internal), known bots and spiders, and test orders whose transaction ID starts with test; fraud-cancelled orders are not removed, so the rate reconciles with GA4 and Adobe standard reports; any fraud adjustment belongs to a separate order-system KPI, and later customer refunds do not reverse the conversion.
  7️⃣ Attribute every session to its session start date so sessions spanning midnight count once, treat GA4 intraday tables as provisional and restate after 72 hours, and suppress page-level comparisons below 200 entrance sessions in the reporting window. AEP session start dates derive from UTC timestamps while GA4 event_date uses the property time zone, so align time zones before reconciling daily figures.

Business Use Case: |
  1️⃣ Performance marketing managers review the rate weekly by landing page and campaign; when a paid destination falls more than 20% below its landing page group median at stable traffic volume, they repoint ad final URLs to the stronger page and raise a conversion optimisation ticket.
  2️⃣ The CRO and Product team uses the rate as the primary success metric for landing page template experiments, randomising on entrance sessions and rolling out the winning variant once the pre-registered significance and sample thresholds are met.
  3️⃣ The SEO and Content lead audits high-entrance organic pages monthly; pages converting below the site-wide Conversion Rate receive shoppable modules above the fold (product grids, price and stock status, ratings) and are re-measured after 30 days.
  4️⃣ Merchandising monitors campaign and promotion landing pages daily during launches; when the rate drops against forecast because hero SKUs sell out or pricing fails to render, the team swaps featured products or redirects traffic to the parent category page the same day.


# KPI: Landing Page Conversion Rate
# Generated: 2026-09-13T22:53:28.965Z
# Contributed by: devyendarm


KPI Name: Landing Page Conversion Rate
Formula: (Entrance Sessions on Landing Page with ≥ 1 Purchase / Total Entrance Sessions on Landing Page) × 100

Description: |
  E-commerce specialisation of Conversion Rate: the percentage of sessions that entered the site on a given landing page and completed at least one purchase within that same session, measured against every entrance session on that page. Because the session is keyed to its first page_view (the GA4 Landing page and Adobe Entry Page dimension) rather than to site-wide traffic, it isolates how effectively each campaign destination, SEO entry point and page template turns arriving demand into orders.

Category: Conversion


























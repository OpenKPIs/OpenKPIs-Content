# Last modified by: devyendarm

KPI Name: Landing Page Conversion Rate
Formula: (Entrance Sessions on Landing Page with ≥ 1 Purchase / Total Entrance Sessions on Landing Page) × 100

Description: |
  The landing-page-scoped form of Conversion Rate: the percentage of sessions that entered the site on a given landing page and completed at least one purchase within that same session, measured against every entrance session on that page. Because the session is keyed to its first page_view (the GA4 Landing page and Adobe Entry Page dimension) rather than to site-wide traffic, it isolates how effectively each campaign destination, SEO entry point and page template turns arriving demand into orders.

Category: Conversion

Tags: [kpi, E-commerce: Top-of-Funnel & Marketing Acquisition]

Industry: [["E-commerce"]]

Priority: High

Core Area: Discovery

Scope: Session

Measure Type: Percentage

Aggregation Window: Session, Daily, Weekly, Monthly


KPI Name: Visitor
Formula: COUNT(DISTINCT Visitor ID)

Description: |
  A visitor is an individual who accesses a website, identified by a unique ID. Understanding visitor metrics helps in analyzing user demographics and behavior.

Category: Acquisition

Tags: [user, traffic, website]

Industry: [["Retail","E-commerce","SaaS","Media","Technology"]]

Priority: High

Core Area: Digital Analytics

Scope: User

Measure Type: count

Aggregation Window: User, Time based - Daily/Monthly/Yearly

GA4 Event: |
  user_engagement

Adobe Event: |
  userVisit

W3 Data Layer: |
  {"event":"userEngagement","user":{"userID":"u123","engagementTime":"2023-10-01T10:00:00Z"}}

GA4 Data Layer: |
  {"event":"user_engagement","user_id":"u123"}

Adobe Client Data Layer: |
  {"event":"userVisited","eventInfo":{"eventName":"userVisited"},"user":{"userID":"u123"}}

XDM Mapping: |
  {"eventType":"web.visitors","web":{"visitors":{"value":1}}}

SQL Query: |
  SELECT COUNT(DISTINCT visitor_id) AS visitors FROM website_visits WHERE visit_date BETWEEN '2023-01-01' AND '2023-12-31'

Calculation Notes: |
  Ensure unique visitor IDs are consistently tracked across sessions; account for returning visitors.

Business Use Case: |
  Marketing teams use Visitor data to tailor campaigns and improve user acquisition strategies.

Dependencies: |
  user_engagement

Source Data: Digital Analytics

Report Attributes: |
  Visitors, New vs Returning, Demographics

Dashboard Usage: [Audience Overview, Acquisition Analysis]

Segment Eligibility: |
  true

Related KPIs: [Sessions, Page Views]

Data Sensitivity: internal

Contains PII: Yes


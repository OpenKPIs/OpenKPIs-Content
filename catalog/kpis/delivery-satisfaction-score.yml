KPI Name: Delivery Satisfaction Score
Formula: SUM(Rating / Rating Scale Max × 5) / Delivery Survey Responses

Description: |
  Average post-delivery survey rating on a 5-point scale, one response per delivered order. Shows how customers judge the delivery itself: timing, condition on arrival and carrier conduct.

Category: Experience

Tags: [kpi, E-commerce: Post-Purchase Logistics & Fulfillment]

Industry: [["E-commerce"]]

Priority: High

Core Area: Generic

Scope: Event

Measure Type: Average


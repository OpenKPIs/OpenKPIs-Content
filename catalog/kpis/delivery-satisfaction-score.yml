Google Analytics SQL: |
  -- ==========================================
  -- 1. GOOGLE BIGQUERY SQL
  -- ==========================================
  DECLARE start_date DATE DEFAULT DATE_SUB(CURRENT_DATE(), INTERVAL 90 DAY);
  DECLARE end_date DATE DEFAULT DATE_SUB(CURRENT_DATE(), INTERVAL 1 DAY);
  
  WITH responses AS (
    -- Delivery survey submissions in the period (by submission date), parameters pivoted per event
    SELECT
      event_timestamp,
      MAX(IF(ep.key = 'order_id', ep.value.string_value, NULL)) AS order_id,
      MAX(IF(ep.key = 'traffic_type', ep.value.string_value, NULL)) AS traffic_type,
      MAX(IF(ep.key = 'rating', COALESCE(ep.value.double_value, CAST(ep.value.int_value AS FLOAT64), SAFE_CAST(ep.value.string_value AS FLOAT64)), NULL)) AS rating,
      MAX(IF(ep.key = 'rating_scale_max', COALESCE(ep.value.double_value, CAST(ep.value.int_value AS FLOAT64), SAFE_CAST(ep.value.string_value AS FLOAT64)), NULL)) AS rating_scale_max
    FROM `your-project.analytics_123456789.events_*`,
      UNNEST(event_params) AS ep
    WHERE _TABLE_SUFFIX BETWEEN FORMAT_DATE('%Y%m%d', start_date) AND FORMAT_DATE('%Y%m%d', end_date)
      AND event_name = 'submit_form'
      AND EXISTS (SELECT 1 FROM UNNEST(event_params) f WHERE f.key = 'form_type' AND f.value.string_value = 'delivery_survey')
    GROUP BY user_pseudo_id, event_timestamp, event_bundle_sequence_id
  ),
  latest_valid AS (
    -- Valid, non-internal responses; keep only the latest submission per order_id
    SELECT order_id, rating, rating_scale_max
    FROM responses
    WHERE order_id IS NOT NULL
      AND COALESCE(traffic_type, '') != 'internal'
      AND rating IS NOT NULL
      AND rating >= 1
      AND rating <= rating_scale_max
    QUALIFY ROW_NUMBER() OVER (PARTITION BY order_id ORDER BY event_timestamp DESC) = 1
  )
  -- Average rating normalised to a 5-point scale
  SELECT
    COUNT(*) AS delivery_survey_responses,
    ROUND(AVG(rating / rating_scale_max * 5), 2) AS delivery_satisfaction_score
  FROM latest_valid;

AEP Query Service SQL: |
  -- ==========================================
  -- 2. ADOBE AEP QUERY SERVICE SQL
  -- ==========================================
  DECLARE start_date DATE DEFAULT DATE_SUB(CURRENT_DATE(), 90);
  DECLARE end_date DATE DEFAULT DATE_SUB(CURRENT_DATE(), 1);
  
  WITH responses AS (
    -- Delivery survey submissions in the period (by submission date)
    SELECT
      timestamp,
      _experience.analytics.custom4 AS order_id,
      _tenant.traffic_type AS traffic_type,
      CAST(_experience.analytics.custom2 AS DOUBLE) AS rating,
      CAST(_experience.analytics.custom3 AS DOUBLE) AS rating_scale_max
    FROM aep_web_events_dataset
    WHERE CAST(timestamp AS DATE) BETWEEN start_date AND end_date
      AND eventType = 'form_submit'
      AND _experience.analytics.custom1 = 'delivery_survey'
  ),
  latest_valid AS (
    -- Valid, non-internal responses; keep only the latest submission per order_id
    SELECT order_id, rating, rating_scale_max
    FROM (
      SELECT
        r.*,
        ROW_NUMBER() OVER (PARTITION BY order_id ORDER BY timestamp DESC) AS rn
      FROM responses r
      WHERE order_id IS NOT NULL
        AND COALESCE(traffic_type, '') != 'internal'
        AND rating IS NOT NULL
        AND rating >= 1
        AND rating <= rating_scale_max
    ) ranked
    WHERE rn = 1
  )
  -- Average rating normalised to a 5-point scale
  SELECT
    COUNT(*) AS delivery_survey_responses,
    ROUND(AVG(rating / rating_scale_max * 5), 2) AS delivery_satisfaction_score
  FROM latest_valid;

Calculation Notes: |
  1️⃣ Responses: submit_form where form_type = delivery_survey (Delivery Satisfaction Survey Submission), keyed on order_id.
  2️⃣ One response per order_id; when a customer resubmits, keep the latest submission only.
  3️⃣ Normalise to 5 points: rating / rating_scale_max × 5, so 10-point and 5-point surveys roll up together.
  4️⃣ Drop responses with a null rating, rating below 1 or above rating_scale_max, or a missing order_id.
  5️⃣ Exclude traffic_type = internal; period is the survey submission date.
  6️⃣ Split shipments share one order-level rating; a per-shipment question, if asked, is not part of this score.
  7️⃣ Carrier, region, shipping-tier and SLA-status splits join on order_id to shipment data; the headline score needs no join.

Business Use Case: |
  1️⃣ Logistics Operations: one carrier's score drops → review its SLA and move volume to the better-rated carrier.
  2️⃣ Customer Service: low scores cluster on late orders → send proactive delay messages before the promise date.
  3️⃣ E-commerce Director: score falls while on-time rate holds → audit packaging damage and driver handover.


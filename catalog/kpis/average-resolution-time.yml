KPI Name: Average Resolution Time
Aliases: [Mean Time to Resolution, Full Resolution Time, Ticket Resolution Time]

Formula: Total ticket resolution hours ÷ Resolved tickets

Description: |
  Average calendar hours from ticket creation to recorded final resolution. Support teams use it to identify slow case handling and adjust staffing or resolution procedures.

Category: Operational Efficiency


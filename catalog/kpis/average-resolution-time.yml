Google Analytics SQL: |
  -- Bind report_start_utc and report_end_utc as UTC TIMESTAMP values.
  WITH ticket_events AS (
    SELECT event_name, event_timestamp,
      (SELECT p.value.string_value FROM UNNEST(event_params) p WHERE p.key = 'ticket_id') AS ticket_id,
      (SELECT p.value.string_value FROM UNNEST(event_params) p WHERE p.key = 'resolution_eligibility') AS eligibility
    FROM `project.analytics.events_*`
    WHERE event_name IN ('support_ticket_created', 'support_ticket_resolved')
      AND _TABLE_SUFFIX <= FORMAT_DATE('%Y%m%d', DATE_ADD(DATE(@report_end_utc), INTERVAL 1 DAY))
      AND event_timestamp < UNIX_MICROS(@report_end_utc)
  )
  SELECT AVG((r.event_timestamp - c.event_timestamp) / 3600000000.0) AS average_resolution_hours
  FROM ticket_events c
  JOIN ticket_events r ON r.ticket_id = c.ticket_id
  WHERE c.event_name = 'support_ticket_created'
    AND r.event_name = 'support_ticket_resolved'
    AND r.event_timestamp >= UNIX_MICROS(@report_start_utc)
    AND r.event_timestamp > c.event_timestamp
    AND r.eligibility = 'Eligible'
    AND c.ticket_id IS NOT NULL AND c.ticket_id <> ''

AEP Query Service SQL: |
  -- Substitute UTC report bounds in the two timestamp templates.
  WITH ticket_events AS (
    SELECT eventType, timestamp,
      _openkpis.ticketId AS ticket_id,
      _openkpis.resolutionEligibility AS eligibility
    FROM {{AEP_EXPERIENCE_EVENT_DATASET}}
    WHERE eventType IN ('support_ticket_created', 'support_ticket_resolved')
      AND timestamp < CAST('{{REPORT_END_UTC}}' AS TIMESTAMP)
  )
  SELECT AVG((UNIX_TIMESTAMP(r.timestamp) - UNIX_TIMESTAMP(c.timestamp)) / 3600.0) AS average_resolution_hours
  FROM ticket_events c
  JOIN ticket_events r ON r.ticket_id = c.ticket_id
  WHERE c.eventType = 'support_ticket_created'
    AND r.eventType = 'support_ticket_resolved'
    AND r.timestamp >= CAST('{{REPORT_START_UTC}}' AS TIMESTAMP)
    AND r.timestamp > c.timestamp
    AND r.eligibility = 'Eligible'
    AND c.ticket_id IS NOT NULL AND c.ticket_id <> ''

Calculation Notes: |
  1️⃣ Use UTC times: final resolution falls in [start, end) and follows creation, which may predate start.
  2️⃣ Supply one creation and one final resolution per anonymous ticket ID; remove transport retries upstream.
  3️⃣ Exclude spam, deleted and merged-away tickets at resolution; later changes do not restate history.
  4️⃣ Include customer waiting time in calendar hours; Support Channel is the channel recorded at creation.
  5️⃣ Return null when no eligible tickets resolve.

Business Use Case: |
  1️⃣ Support managers compare channels and move staffing toward queues with persistently slow resolution.
  2️⃣ Support leads investigate rising resolution time and revise escalation rules or agent guidance.


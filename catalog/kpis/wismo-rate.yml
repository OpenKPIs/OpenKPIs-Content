KPI Name: WISMO Rate
Formula: (Distinct shipped orders with ≥ 1 WISMO contact inside the attribution window ÷ Distinct orders with a first shipment in the period) × 100

Description: |
  WISMO Rate is the share of shipped orders that generate at least one "Where Is My Order" contact to customer support (chat, email, phone or an order-status contact form) before the order is resolved, measured on the order cohort shipped in the period. It isolates post-purchase anxiety caused by missing, late or unclear delivery information, making it the primary lead indicator of carrier underperformance, weak shipping-notification coverage and avoidable cost-to-serve.

Category: Experience

Tags: [kpi, E-commerce: Post-Purchase Logistics & Fulfillment, Customer Service, Cost to Serve, Omnichannel]

Industry: [["E-commerce"]]

Priority: High

Core Area: Generic

Scope: Global

Measure Type: Percentage

Aggregation Window: Daily, Weekly, Monthly


Google Analytics SQL: |
  -- ==========================================
  -- 1. GOOGLE BIGQUERY SQL
  -- ==========================================
  -- Item View to Cart Rate: share of view_item item rows followed by an add_to_cart
  -- of the same item_id by the same user within 24 hours.
  WITH item_views AS (
    SELECT
      user_pseudo_id,
      item.item_id,
      ANY_VALUE(item.item_category) AS item_category,
      event_timestamp AS view_ts
    FROM `your-project.analytics_123456789.events_*`,
      UNNEST(items) AS item
    WHERE _TABLE_SUFFIX BETWEEN FORMAT_DATE('%Y%m%d', DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY))
                            AND FORMAT_DATE('%Y%m%d', DATE_SUB(CURRENT_DATE(), INTERVAL 1 DAY))
      AND event_name = 'view_item'
      AND item.item_id IS NOT NULL
    GROUP BY user_pseudo_id, item.item_id, event_timestamp
  ),
  cart_adds AS (
    SELECT DISTINCT
      user_pseudo_id,
      item.item_id,
      event_timestamp AS add_ts
    FROM `your-project.analytics_123456789.events_*`,
      UNNEST(items) AS item
    WHERE _TABLE_SUFFIX BETWEEN FORMAT_DATE('%Y%m%d', DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY))
                            AND FORMAT_DATE('%Y%m%d', CURRENT_DATE())
      AND event_name = 'add_to_cart'
      AND item.item_id IS NOT NULL
  ),
  views_flagged AS (
    SELECT
      v.item_id,
      v.item_category,
      DATE(TIMESTAMP_MICROS(v.view_ts)) AS view_date,
      MAX(IF(c.add_ts IS NOT NULL, 1, 0)) AS converted
    FROM item_views v
    LEFT JOIN cart_adds c
      ON c.user_pseudo_id = v.user_pseudo_id
     AND c.item_id = v.item_id
     AND c.add_ts >= v.view_ts
     AND c.add_ts <= v.view_ts + 24 * 3600 * 1000000
    GROUP BY v.user_pseudo_id, v.item_id, v.item_category, v.view_ts
  )
  SELECT
    view_date,
    item_category,
    COUNT(*) AS item_views,
    SUM(converted) AS item_views_with_add_to_cart,
    ROUND(100 * SAFE_DIVIDE(SUM(converted), COUNT(*)), 2) AS item_view_to_cart_rate_pct
  FROM views_flagged
  GROUP BY view_date, item_category
  ORDER BY view_date, item_category;

AEP Query Service SQL: |
  -- ==========================================
  -- 2. ADOBE AEP QUERY SERVICE SQL
  -- ==========================================
  -- Item View to Cart Rate on the XDM ExperienceEvent dataset: product views
  -- (commerce.productViews) followed by an add (commerce.productListAdds) of the same SKU
  -- by the same ECID within 24 hours.
  WITH item_views AS (
    SELECT
      identityMap['ECID'][0].id AS ecid,
      pli.SKU AS sku,
      timestamp AS view_ts
    FROM web_experience_events
    LATERAL VIEW explode(productListItems) t AS pli
    WHERE timestamp >= date_sub(current_date(), 30)
      AND timestamp < current_date()
      AND commerce.productViews.value > 0
      AND pli.SKU IS NOT NULL
    GROUP BY identityMap['ECID'][0].id, pli.SKU, timestamp
  ),
  cart_adds AS (
    SELECT DISTINCT
      identityMap['ECID'][0].id AS ecid,
      pli.SKU AS sku,
      timestamp AS add_ts
    FROM web_experience_events
    LATERAL VIEW explode(productListItems) t AS pli
    WHERE timestamp >= date_sub(current_date(), 30)
      AND commerce.productListAdds.value > 0
      AND pli.SKU IS NOT NULL
  ),
  views_flagged AS (
    SELECT
      v.sku,
      to_date(v.view_ts) AS view_date,
      MAX(CASE WHEN c.add_ts IS NOT NULL THEN 1 ELSE 0 END) AS converted
    FROM item_views v
    LEFT JOIN cart_adds c
      ON c.ecid = v.ecid
     AND c.sku = v.sku
     AND c.add_ts >= v.view_ts
     AND c.add_ts <= v.view_ts + INTERVAL 24 HOURS
    GROUP BY v.ecid, v.sku, v.view_ts
  )
  SELECT
    view_date,
    COUNT(*) AS item_views,
    SUM(converted) AS item_views_with_add_to_cart,
    ROUND(100.0 * SUM(converted) / NULLIF(COUNT(*), 0), 2) AS item_view_to_cart_rate_pct
  FROM views_flagged
  GROUP BY view_date
  ORDER BY view_date;

Calculation Notes: |
  1️⃣ The denominator is every view_item item row in the reporting period (all product detail views, per item_id), not only views from sessions that later carried a cart.
  2️⃣ A view counts in the numerator when the same user adds the same item_id to cart at or after the view timestamp and within 24 hours; each view is counted at most once, so the rate cannot exceed 100%.
  3️⃣ Add-to-cart actions with no preceding view of that item (e.g. quick-add from listing pages or re-order widgets) are excluded from the numerator; report them separately via Add-to-Cart Rate.
  4️⃣ Views near the end of the reporting period need the full 24-hour look-forward window; close the period only after that lag has elapsed.
  5️⃣ Exclude internal traffic, bots and test orders, and deduplicate repeated view_item hits for the same item fired within one second by page reloads.
  6️⃣ Quantity is ignored; an add_to_cart of 3 units still converts a single view.

Business Use Case: |
  1️⃣ Merchandising teams review the rate weekly by product category and flag items more than 20% below their category average for image, copy and pricing fixes.
  2️⃣ Product managers use the rate as the primary success metric for product detail page A/B tests (gallery layout, size guides, sticky add-to-cart buttons) and ship variants that lift it with statistical significance.
  3️⃣ Marketing teams compare the rate by traffic source and campaign to shift paid budget away from campaigns that bring high-view but low-intent visitors.
  4️⃣ Inventory planners watch sudden drops on in-stock items as an early signal of pricing or availability-message problems and alert Merchandising the same day.


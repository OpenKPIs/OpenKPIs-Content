KPI Name: Item View to Cart Rate
Formula: (Item views followed by an add_to_cart of the same item by the same user within 24 hours / Total item views) × 100

Description: |
  Item View to Cart Rate measures the percentage of product detail views (view_item) that are followed by an add_to_cart of the same item by the same user within 24 hours. It shows how effectively product pages turn shopper interest into purchase intent and is the standard product-page conversion benchmark used in GA4, Adobe Analytics and commerce platform reporting.


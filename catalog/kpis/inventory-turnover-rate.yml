KPI Name: Inventory Turnover Rate
Formula: (Cost of Goods Sold / Average Inventory)

Description: |
  Measures how often inventory is sold and replaced over a specific period, indicating the efficiency of inventory management.

Category: Efficiency

Tags: [kpi]

Industry: [Logistics & Supply Chain]

Priority: High

Core Area: Generic

Scope: Global

Measure Type: rate

Aggregation Window: Time based - Monthly







Google Analytics SQL: |
  -- ==========================================
  -- 1. GOOGLE BIGQUERY SQL
  -- ==========================================
  SELECT product_id,
         SUM(sales_quantity) / NULLIF(SUM(average_inventory), 0) AS inventory_turnover_rate
  FROM `your-project.erp.warehouse_logs`
  WHERE event_date BETWEEN '2023-01-01' AND '2023-12-31'
  GROUP BY product_id

AEP Query Service SQL: |
  -- ==========================================
  -- 2. ADOBE AEP QUERY SERVICE SQL
  -- ==========================================
  SELECT product_id,
         SUM(sales_quantity) / NULLIF(SUM(average_inventory), 0) AS inventory_turnover_rate
  FROM aep_backend_dataset.warehouse_logs
  WHERE event_date BETWEEN '2023-01-01' AND '2023-12-31'
  GROUP BY product_id

Calculation Notes: |
  Exclude obsolete or non-moving inventory items; ensure consistent valuation method for inventory.

Business Use Case: |
  Executives use this KPI to optimize inventory levels, reduce holding costs, and improve cash flow by identifying slow-moving products.


Source Data: ERP


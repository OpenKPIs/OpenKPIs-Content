# KPI: Assessment Proficiency Rate
# Generated: 2026-09-11T22:30:31.066Z
# Contributed by: devyendarm
# Last modified by: devyendarm

KPI Name: Assessment Proficiency Rate
Formula: (Count of eligible learner-assessment-version records where the selected final valid attempt score is greater than or equal to the applicable proficiency threshold / Count of eligible learner-assessment-version records with a selected final valid scored attempt) × 100

Description: |
  Measures the percentage of eligible learner-assessment records whose final valid scored attempt meets or exceeds the proficiency threshold defined for the applicable assessment version. It shows how consistently assessed learners demonstrate the required level of knowledge or skill during the reporting period.

Category: Performance

Tags: [kpi]

Industry: [EdTech & E-Learning]

Priority: High

Core Area: Engagement

Scope: User

Measure Type: percentage

Aggregation Window: Time based - Daily/Weekly/Monthly/Academic Term/Yearly









Calculation Notes: |
  1️⃣ Select the latest valid attempt within the reporting window for each learner-assessment-version record.  
  2️⃣ Include attempts only after final scoring and manual grading are complete.  
  3️⃣ Compare final scores with the configured proficiency threshold for the assessment version.  
  4️⃣ Use the normalized score from the platform or calculate it as (earned points / max points) × 100.  
  5️⃣ Exclude in-progress, abandoned, voided, invalidated, duplicated, corrupted, unscored, preview, and test account attempts.  
  6️⃣ Do not include practice and diagnostic assessments unless proficiency-bearing.  
  7️⃣ Return null if the denominator is zero; apply privacy suppression for small populations.

Business Use Case: |
  An Academic Programs executive reviews monthly proficiency by course, assessment, learning objective, cohort, and delivery modality. If proficiency falls below the warning threshold for a required mathematics assessment while completion remains stable, the team examines item and learning-objective performance, validates assessment quality, assigns targeted remediation, updates instructional content, and monitors subsequent cohorts and retake outcomes to confirm improvement.


Source Data: Learning Management System (LMS), Assessment Platform, Student Information System (SIS), and Assessment Configuration Repository

Report Attributes: |
  ["Academic year","Academic term","Completion date","Institution","School or business unit","Program","Course","Course section","Assessment","Assessment version","Assessment type","Subject","Grade level","Learning objective","Competency","Cohort","Enrollment status","Delivery modality","Instructor","Attempt number","First attempt versus retake","Accommodation status","Learner region","Device type"]

Dashboard Usage: [Executive Learning Outcomes Dashboard, Academic Performance Dashboard, Assessment Effectiveness Dashboard, Course and Cohort Performance Dashboard, Learning Objective Mastery Dashboard, Intervention and Remediation Dashboard, Institutional Outcomes Dashboard]

Segment Eligibility: |
  true


# KPI: Product List Click-Through Rate
# Generated: 2026-09-16T17:36:13.653Z
# Contributed by: devyendarm


KPI Name: Product List Click-Through Rate
Formula: (Item List Clicks [count of select_item events] / Item List Views [count of view_item_list events]) × 100, where both counts are grouped by the same item_list_id / item_list_name over the same date range

Description: |
  Product List Click-Through Rate is the share of product list views (category pages, search results, recommendation carousels, cross-sell modules) that produce a click on a product, measured as select_item events divided by view_item_list events and broken down by item_list_id and item_list_name, matching GA4's Item-list click-through rate. It shows how well each list's ranking, product mix and tile content turn browsing into product-detail visits, which makes it the main health signal for merchandising and discovery surfaces before add-to-cart and purchase.

Category: Engagement


























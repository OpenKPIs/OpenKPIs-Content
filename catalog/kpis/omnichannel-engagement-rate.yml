# Last modified by: devyendarm

KPI Name: Omnichannel Engagement Rate
Formula: (Unique Users Engaging Across Multiple Digital Channels / Total Unique Users) × 100

Description: |
  Measures the percentage of users who interact with multiple digital channels within a defined period, indicating the effectiveness of cross-channel strategies.

Category: Engagement

Tags: [kpi]

Industry: [FinTech & Banking]

Priority: High

Core Area: Engagement

Scope: User

Measure Type: percentage

Aggregation Window: Time based - Daily

GA4 Event: |
  engagement

Adobe Event: |
  trackEngagement

W3 Data Layer: |
  {"user":{"engagementType":"omnichannel"},"event":"engagement","eventInfo":{"type":"interaction","eventName":"engagement"}}

GA4 Data Layer: |
  {"event":"engagement","engagement_type":"omnichannel"}

Adobe Client Data Layer: |
  {"event":"engagement","eventData":{"engagementType":"omnichannel"}}

XDM Mapping: |
  {"_experience":{"analytics":{"eventType":"engagement","engagement":{"type":"omnichannel"}}}}

Google Analytics SQL: |
  -- ==========================================
  -- 1. GOOGLE BIGQUERY SQL
  -- ==========================================
  SELECT COUNT(DISTINCT CASE WHEN engagement_type = 'omnichannel' THEN user_pseudo_id END) AS omnichannel_engaged_users,
         COUNT(DISTINCT user_pseudo_id) AS total_users,
         COUNT(DISTINCT CASE WHEN engagement_type = 'omnichannel' THEN user_pseudo_id END) / COUNT(DISTINCT user_pseudo_id) AS omnichannel_engagement_rate
  FROM `your-project.analytics_123456789.events_*`,
  UNNEST(event_params) AS params
  WHERE event_name = 'engagement'
    AND params.key = 'engagement_type'
    AND params.value.string_value = 'omnichannel'
    AND _TABLE_SUFFIX BETWEEN '20230101' AND '20231231';

AEP Query Service SQL: |
  -- ==========================================
  -- 2. ADOBE AEP QUERY SERVICE SQL
  -- ==========================================
  SELECT COUNT(DISTINCT CASE WHEN engagement_type = 'omnichannel' THEN user_id END) AS omnichannel_engaged_users,
         COUNT(DISTINCT user_id) AS total_users,
         COUNT(DISTINCT CASE WHEN engagement_type = 'omnichannel' THEN user_id END) / COUNT(DISTINCT user_id) AS omnichannel_engagement_rate
  FROM aep_backend_dataset.events,
  LATERAL VIEW EXPLODE(eventData) AS params
  WHERE eventType = 'engagement'
    AND params.engagementType = 'omnichannel';

Calculation Notes: |
  1️⃣ Exclude users with single-channel interactions.  
  2️⃣ Consider session timeouts in calculations.  
  3️⃣ Deduplicate user IDs across platforms.  
  4️⃣ Ensure accurate user engagement metrics.  
  5️⃣ Maintain data integrity across channels.

Business Use Case: |
  Executives use this KPI to assess the effectiveness of integrated marketing campaigns and optimize resource allocation across digital platforms.



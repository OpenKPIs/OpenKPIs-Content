# KPI: Customer Lifetime Value
# Generated: 2026-09-14T07:47:52.904Z
# Contributed by: devyendarm
# Last modified by: devyendarm

KPI Name: Customer Lifetime Value
Formula: Customer Lifetime Value (historical, 36-month) = Σ over non-cancelled orders within 36 months of first purchase of (Net Merchandise Revenue − Refunded Amount + (Shipping Revenue − Carrier Cost) − (COGS − Restocked COGS) − Pick/Pack Fulfilment Cost − Payment Processing Fees − Return Shipping & Processing Costs) × daily FX rate of the order date

Description: |
  Customer Lifetime Value is the cumulative contribution margin a resolved customer has generated across all digital and offline orders within 36 months of their first purchase, net of refunds, returns, cancellations, cost of goods sold and variable fulfilment costs. It is the long-term value benchmark for setting acquisition cost ceilings, sizing retention and loyalty investment, and comparing acquisition cohorts and channels on profitability rather than first-order revenue.

Category: Retention

Tags: [kpi, E-commerce: Customer Retention, Loyalty & LTV, clv, customer-value, profitability]

Industry: [["Retail"]]

Priority: High

Core Area: Monetization

Scope: User

Measure Type: Currency

Aggregation Window: User, Cohort, Time based - Monthly/Quarterly/Yearly/Lifetime, Monthly, Quarterly, Yearly


Google Analytics SQL: |
  -- ==========================================
  -- 1. GOOGLE BIGQUERY SQL
  -- ==========================================
  DECLARE start_date DATE DEFAULT @start_date;
  DECLARE end_date DATE DEFAULT @end_date;
  DECLARE lookback_months INT64 DEFAULT 24;
  
  WITH purchase_event_params AS (
    SELECT
      PARSE_DATE('%Y%m%d', e.event_date) AS event_partition_date,
      TIMESTAMP_MICROS(e.event_timestamp) AS event_timestamp,
      e.event_name,
      e.user_id,
      e.user_pseudo_id,
      e.platform AS analytics_platform,
      e.stream_id,
      MAX(IF(ep.key = 'event_id', COALESCE(ep.value.string_value, CAST(ep.value.int_value AS STRING)), NULL)) AS event_id,
      MAX(IF(ep.key = 'booking_id', COALESCE(ep.value.string_value, CAST(ep.value.int_value AS STRING)), NULL)) AS booking_id,
      MAX(IF(ep.key = 'transaction_id', COALESCE(ep.value.string_value, CAST(ep.value.int_value AS STRING)), NULL)) AS transaction_id,
      MAX(IF(ep.key = 'booking_status', ep.value.string_value, NULL)) AS booking_status,
      MAX(IF(ep.key = 'booking_validity', ep.value.string_value, NULL)) AS booking_validity,
      MAX(IF(ep.key = 'booking_channel', ep.value.string_value, NULL)) AS booking_channel,
      MAX(IF(ep.key = 'booking_platform', ep.value.string_value, NULL)) AS booking_platform,
      MAX(IF(ep.key = 'customer_id', COALESCE(ep.value.string_value, CAST(ep.value.int_value AS STRING)), NULL)) AS event_customer_id,
      MAX(IF(ep.key = 'identity_namespace', ep.value.string_value, NULL)) AS identity_namespace,
      MAX(IF(ep.key = 'authenticated', COALESCE(ep.value.string_value, CAST(ep.value.int_value AS STRING)), NULL)) AS authenticated_raw,
      MAX(IF(ep.key = 'customer_type', ep.value.string_value, NULL)) AS collected_customer_type,
      MAX(IF(ep.key = 'prior_valid_booking_count_24m', COALESCE(ep.value.string_value, CAST(ep.value.int_value AS STRING)), NULL)) AS collected_prior_booking_count_raw,
      MAX(IF(ep.key = 'prior_valid_booking_date', ep.value.string_value, NULL)) AS collected_prior_booking_date_raw,
      MAX(IF(ep.key = 'repeat_booking_24m', COALESCE(ep.value.string_value, CAST(ep.value.int_value AS STRING)), NULL)) AS collected_repeat_booking_raw,
      MAX(IF(ep.key = 'lookback_months', COALESCE(ep.value.string_value, CAST(ep.value.int_value AS STRING)), NULL)) AS collected_lookback_months_raw,
      MAX(IF(ep.key = 'booking_date', ep.value.string_value, NULL)) AS booking_date_raw,
      MAX(IF(ep.key = 'travel_start_date', ep.value.string_value, NULL)) AS travel_start_date_raw,
      MAX(IF(ep.key = 'travel_end_date', ep.value.string_value, NULL)) AS travel_end_date_raw,
      MAX(IF(ep.key = 'lead_time_days', COALESCE(ep.value.string_value, CAST(ep.value.int_value AS STRING)), NULL)) AS lead_time_days_raw,
      MAX(IF(ep.key = 'duration_nights', COALESCE(ep.value.string_value, CAST(ep.value.int_value AS STRING)), NULL)) AS duration_nights_raw,
      MAX(IF(ep.key = 'origin', ep.value.string_value, NULL)) AS origin,
      MAX(IF(ep.key = 'destination', ep.value.string_value, NULL)) AS destination,
      MAX(IF(ep.key = 'market', ep.value.string_value, NULL)) AS market,
      MAX(IF(ep.key = 'country', ep.value.string_value, NULL)) AS country,
      MAX(IF(ep.key = 'product_type', ep.value.string_value, NULL)) AS product_type,
      MAX(IF(ep.key = 'affiliation', ep.value.string_value, NULL)) AS affiliation,
      MAX(IF(ep.key = 'payment_type', ep.value.string_value, NULL)) AS payment_type,
      MAX(IF(ep.key = 'currency', ep.value.string_value, NULL)) AS currency,
      MAX(IF(ep.key = 'base_price', COALESCE(ep.value.string_value, CAST(ep.value.int_value AS STRING), CAST(ep.value.double_value AS STRING)), NULL)) AS base_price_raw,
      MAX(IF(ep.key = 'tax', COALESCE(ep.value.string_value, CAST(ep.value.int_value AS STRING), CAST(ep.value.double_value AS STRING)), NULL)) AS tax_raw,
      MAX(IF(ep.key = 'fees', COALESCE(ep.value.string_value, CAST(ep.value.int_value AS STRING), CAST(ep.value.double_value AS STRING)), NULL)) AS fees_raw,
      MAX(IF(ep.key = 'discount', COALESCE(ep.value.string_value, CAST(ep.value.int_value AS STRING), CAST(ep.value.double_value AS STRING)), NULL)) AS discount_raw,
      MAX(IF(ep.key = 'value', COALESCE(ep.value.string_value, CAST(ep.value.int_value AS STRING), CAST(ep.value.double_value AS STRING)), NULL)) AS transaction_total_raw,
      MAX(IF(ep.key = 'shipping', COALESCE(ep.value.string_value, CAST(ep.value.int_value AS STRING), CAST(ep.value.double_value AS STRING)), NULL)) AS shipping_raw,
      MAX(IF(ep.key = 'coupon', ep.value.string_value, NULL)) AS coupon,
      MAX(IF(ep.key = 'cancellation_flag', COALESCE(ep.value.string_value, CAST(ep.value.int_value AS STRING)), NULL)) AS cancellation_flag_raw,
      MAX(IF(ep.key = 'fraud_flag', COALESCE(ep.value.string_value, CAST(ep.value.int_value AS STRING)), NULL)) AS fraud_flag_raw,
      MAX(IF(ep.key = 'test_flag', COALESCE(ep.value.string_value, CAST(ep.value.int_value AS STRING)), NULL)) AS test_flag_raw,
      MAX(IF(ep.key = 'duplicate_flag', COALESCE(ep.value.string_value, CAST(ep.value.int_value AS STRING)), NULL)) AS duplicate_flag_raw,
      MAX(IF(ep.key = 'digital_booking_flag', COALESCE(ep.value.string_value, CAST(ep.value.int_value AS STRING)), NULL)) AS digital_booking_flag_raw,
      MAX(IF(ep.key = 'analytics_consent', COALESCE(ep.value.string_value, CAST(ep.value.int_value AS STRING)), NULL)) AS analytics_consent_raw,
      MAX(IF(ep.key = 'page_location', ep.value.string_value, NULL)) AS page_location,
      MAX(IF(ep.key = 'app_version', ep.value.string_value, NULL)) AS app_version,
      MAX(IF(ep.key = 'source_system', ep.value.string_value, NULL)) AS source_system,
      ARRAY_LENGTH(e.items) AS item_count,
      (SELECT SUM(COALESCE(item.quantity, 0)) FROM UNNEST(e.items) AS item) AS item_quantity
    FROM `your-project.analytics_123456789.events_*` AS e
    LEFT JOIN UNNEST(e.event_params) AS ep
    WHERE e.event_name = 'purchase'
      AND REGEXP_CONTAINS(_TABLE_SUFFIX, r'^\d{8}$')
      AND _TABLE_SUFFIX BETWEEN FORMAT_DATE('%Y%m%d', DATE_SUB(start_date, INTERVAL 24 MONTH))
                            AND FORMAT_DATE('%Y%m%d', end_date)
    GROUP BY
      event_partition_date,
      event_timestamp,
      e.event_name,
      e.user_id,
      e.user_pseudo_id,
      analytics_platform,
      e.stream_id,
      item_count,
      item_quantity
  ),
  normalized_bookings AS (
    SELECT
      event_partition_date,
      event_timestamp,
      event_name,
      event_id,
      booking_id,
      transaction_id,
      COALESCE(NULLIF(event_customer_id, ''), NULLIF(user_id, '')) AS customer_id,
      user_pseudo_id,
      identity_namespace,
      LOWER(booking_status) AS booking_status,
      LOWER(booking_validity) AS booking_validity,
      LOWER(booking_channel) AS booking_channel,
      LOWER(booking_platform) AS booking_platform,
      analytics_platform,
      stream_id,
      LOWER(COALESCE(authenticated_raw, 'false')) IN ('1', 'true', 'yes') AS authenticated,
      collected_customer_type,
      SAFE_CAST(collected_prior_booking_count_raw AS INT64) AS collected_prior_valid_booking_count_24m,
      SAFE.PARSE_DATE('%Y-%m-%d', collected_prior_booking_date_raw) AS collected_prior_valid_booking_date,
      LOWER(COALESCE(collected_repeat_booking_raw, 'false')) IN ('1', 'true', 'yes') AS collected_repeat_booking_24m,
      SAFE_CAST(collected_lookback_months_raw AS INT64) AS collected_lookback_months,
      COALESCE(SAFE.PARSE_DATE('%Y-%m-%d', booking_date_raw), DATE(event_timestamp)) AS booking_date,
      SAFE.PARSE_DATE('%Y-%m-%d', travel_start_date_raw) AS travel_start_date,
      SAFE.PARSE_DATE('%Y-%m-%d', travel_end_date_raw) AS travel_end_date,
      SAFE_CAST(lead_time_days_raw AS INT64) AS lead_time_days,
      SAFE_CAST(duration_nights_raw AS INT64) AS duration_nights,
      origin,
      destination,
      market,
      country,
      product_type,
      affiliation,
      payment_type,
      currency,
      SAFE_CAST(base_price_raw AS NUMERIC) AS base_price,
      SAFE_CAST(tax_raw AS NUMERIC) AS tax,
      SAFE_CAST(fees_raw AS NUMERIC) AS fees,
      SAFE_CAST(discount_raw AS NUMERIC) AS discount,
      SAFE_CAST(transaction_total_raw AS NUMERIC) AS transaction_total,
      SAFE_CAST(shipping_raw AS NUMERIC) AS shipping,
      coupon,
      LOWER(COALESCE(cancellation_flag_raw, 'false')) IN ('1', 'true', 'yes') AS cancellation_flag,
      LOWER(COALESCE(fraud_flag_raw, 'false')) IN ('1', 'true', 'yes') AS fraud_flag,
      LOWER(COALESCE(test_flag_raw, 'false')) IN ('1', 'true', 'yes') AS test_flag,
      LOWER(COALESCE(duplicate_flag_raw, 'false')) IN ('1', 'true', 'yes') AS duplicate_flag,
      LOWER(COALESCE(digital_booking_flag_raw, 'false')) IN ('1', 'true', 'yes') AS digital_booking_flag,
      LOWER(COALESCE(analytics_consent_raw, 'false')) IN ('1', 'true', 'yes') AS analytics_consent,
      page_location,
      app_version,
      source_system,
      item_count,
      item_quantity
    FROM purchase_event_params
  ),
  deduplicated_bookings AS (
    SELECT * EXCEPT (deduplication_rank)
    FROM (
      SELECT
        nb.*,
        ROW_NUMBER() OVER (
          PARTITION BY COALESCE(NULLIF(booking_id, ''), NULLIF(transaction_id, ''), NULLIF(event_id, ''))
          ORDER BY event_timestamp DESC
        ) AS deduplication_rank
      FROM normalized_bookings AS nb
      WHERE COALESCE(NULLIF(booking_id, ''), NULLIF(transaction_id, ''), NULLIF(event_id, '')) IS NOT NULL
    )
    WHERE deduplication_rank = 1
  ),
  eligible_valid_bookings AS (
    SELECT *
    FROM deduplicated_bookings
    WHERE booking_status = 'confirmed'
      AND booking_validity = 'valid'
      AND booking_channel = 'digital'
      AND digital_booking_flag
      AND authenticated
      AND analytics_consent
      AND NOT cancellation_flag
      AND NOT fraud_flag
      AND NOT test_flag
      AND NOT duplicate_flag
      AND customer_id IS NOT NULL
  ),
  cohort_bookings AS (
    SELECT *
    FROM eligible_valid_bookings
    WHERE booking_date BETWEEN start_date AND end_date
  ),
  classified_bookings AS (
    SELECT
      c.*,
      EXISTS (
        SELECT 1
        FROM eligible_valid_bookings AS h
        WHERE h.customer_id = c.customer_id
          AND h.booking_id != c.booking_id
          AND h.event_timestamp < c.event_timestamp
          AND h.booking_date >= DATE_SUB(c.booking_date, INTERVAL lookback_months MONTH)
          AND h.booking_date <= c.booking_date
      ) AS is_repeat_booking_24m
    FROM cohort_bookings AS c
  )
  SELECT
    booking_date,
    booking_channel,
    booking_platform,
    market,
    country,
    product_type,
    COUNT(*) AS total_valid_identified_digital_bookings,
    COUNTIF(is_repeat_booking_24m) AS repeat_valid_digital_bookings,
    ROUND(SAFE_DIVIDE(COUNTIF(is_repeat_booking_24m), COUNT(*)), 6) AS repeat_booking_rate,
    ROUND(100 * SAFE_DIVIDE(COUNTIF(is_repeat_booking_24m), COUNT(*)), 2) AS repeat_booking_rate_percent
  FROM classified_bookings
  GROUP BY
    booking_date,
    booking_channel,
    booking_platform,
    market,
    country,
    product_type
  ORDER BY
    booking_date,
    booking_channel,
    booking_platform,
    market,
    country,
    product_type;

AEP Query Service SQL: |
  -- ==========================================
  -- 2. ADOBE AEP QUERY SERVICE SQL
  -- ==========================================
  WITH report_parameters AS (
    SELECT
      CAST('2025-03-01' AS DATE) AS start_date,
      CAST('2025-03-31' AS DATE) AS end_date,
      24 AS lookback_months
  ),
  normalized_purchase_events AS (
    SELECT
      x.eventMergeId AS event_id,
      x.timestamp AS event_timestamp,
      CAST(x.timestamp AS DATE) AS event_partition_date,
      x.eventType AS event_type,
      x._repeatBooking.bookingId AS booking_id,
      x.commerce.order.purchaseID AS transaction_id,
      x.identityMap['CustomerID'][0].id AS customer_id,
      x.identityMap['CustomerID'][0].authenticatedState AS authenticated_state,
      x._repeatBooking.bookingStatus AS booking_status,
      x._repeatBooking.bookingValidity AS booking_validity,
      x._repeatBooking.bookingChannel AS booking_channel,
      x._repeatBooking.bookingPlatform AS booking_platform,
      x._repeatBooking.customerType AS collected_customer_type,
      x._repeatBooking.priorValidBookingCount24Months AS collected_prior_valid_booking_count_24m,
      CAST(x._repeatBooking.priorValidBookingDate AS DATE) AS collected_prior_valid_booking_date,
      x._repeatBooking.repeatBooking24Months AS collected_repeat_booking_24m,
      x._repeatBooking.lookbackMonths AS collected_lookback_months,
      CAST(x._repeatBooking.bookingDate AS DATE) AS booking_date,
      CAST(x._repeatBooking.travelStartDate AS DATE) AS travel_start_date,
      CAST(x._repeatBooking.travelEndDate AS DATE) AS travel_end_date,
      x._repeatBooking.leadTimeDays AS lead_time_days,
      x._repeatBooking.durationNights AS duration_nights,
      x._repeatBooking.origin AS origin,
      x._repeatBooking.destination AS destination,
      x._repeatBooking.market AS market,
      x._repeatBooking.country AS country,
      x._repeatBooking.productType AS product_type,
      x._repeatBooking.affiliation AS affiliation,
      x._repeatBooking.paymentType AS payment_type,
      x.commerce.order.currencyCode AS currency,
      x._repeatBooking.basePrice AS base_price,
      x._repeatBooking.tax AS tax,
      x._repeatBooking.fees AS fees,
      x._repeatBooking.discount AS discount,
      x.commerce.order.priceTotal AS transaction_total,
      x._repeatBooking.coupon AS coupon,
      x.commerce.purchases.value AS purchase_count,
      x.commerce.order.payments[0].transactionID AS payment_transaction_id,
      x.commerce.order.payments[0].paymentType AS order_payment_type,
      x.commerce.order.payments[0].paymentAmount AS payment_amount,
      x.commerce.order.payments[0].currencyCode AS payment_currency,
      x.productListItems[0].SKU AS primary_item_sku,
      x.productListItems[0].name AS primary_item_name,
      x.productListItems[0].quantity AS primary_item_quantity,
      x.productListItems[0].priceTotal AS primary_item_price_total,
      x.productListItems[0].currencyCode AS primary_item_currency,
      x.productListItems[0].productCategories[0].categoryID AS primary_item_category,
      x.web.webPageDetails.URL AS page_location,
      x.web.webPageDetails.name AS page_name,
      x.consents.collect.val AS collection_consent,
      x._repeatBooking.cancellationFlag AS cancellation_flag,
      x._repeatBooking.fraudFlag AS fraud_flag,
      x._repeatBooking.testFlag AS test_flag,
      x._repeatBooking.duplicateFlag AS duplicate_flag,
      x._repeatBooking.digitalBookingFlag AS digital_booking_flag,
      x._repeatBooking.analyticsConsent AS analytics_consent,
      x._repeatBooking.appVersion AS app_version,
      x._repeatBooking.sourceSystem AS source_system
    FROM your_aep_purchase_experience_event_dataset AS x
    CROSS JOIN report_parameters AS p
    WHERE x.eventType = 'commerce.purchases'
      AND CAST(x.timestamp AS DATE) BETWEEN ADD_MONTHS(p.start_date, -24) AND p.end_date
  ),
  ranked_purchase_events AS (
    SELECT
      n.*,
      ROW_NUMBER() OVER (
        PARTITION BY COALESCE(n.booking_id, n.transaction_id, n.event_id)
        ORDER BY n.event_timestamp DESC
      ) AS deduplication_rank
    FROM normalized_purchase_events AS n
    WHERE COALESCE(n.booking_id, n.transaction_id, n.event_id) IS NOT NULL
  ),
  deduplicated_bookings AS (
    SELECT *
    FROM ranked_purchase_events
    WHERE deduplication_rank = 1
  ),
  eligible_valid_bookings AS (
    SELECT *
    FROM deduplicated_bookings
    WHERE LOWER(booking_status) = 'confirmed'
      AND LOWER(booking_validity) = 'valid'
      AND LOWER(booking_channel) = 'digital'
      AND digital_booking_flag = TRUE
      AND LOWER(authenticated_state) = 'authenticated'
      AND analytics_consent = TRUE
      AND LOWER(collection_consent) = 'y'
      AND COALESCE(cancellation_flag, FALSE) = FALSE
      AND COALESCE(fraud_flag, FALSE) = FALSE
      AND COALESCE(test_flag, FALSE) = FALSE
      AND COALESCE(duplicate_flag, FALSE) = FALSE
      AND customer_id IS NOT NULL
  ),
  cohort_bookings AS (
    SELECT e.*
    FROM eligible_valid_bookings AS e
    CROSS JOIN report_parameters AS p
    WHERE e.booking_date BETWEEN p.start_date AND p.end_date
  ),
  classified_bookings AS (
    SELECT
      c.*,
      CASE
        WHEN EXISTS (
          SELECT 1
          FROM eligible_valid_bookings AS h
          CROSS JOIN report_parameters AS p
          WHERE h.customer_id = c.customer_id
            AND h.booking_id <> c.booking_id
            AND h.event_timestamp < c.event_timestamp
            AND h.booking_date >= ADD_MONTHS(c.booking_date, -p.lookback_months)
            AND h.booking_date <= c.booking_date
        ) THEN 1
        ELSE 0
      END AS is_repeat_booking_24m
    FROM cohort_bookings AS c
  )
  SELECT
    booking_date,
    LOWER(booking_channel) AS booking_channel,
    LOWER(booking_platform) AS booking_platform,
    market,
    country,
    product_type,
    COUNT(*) AS total_valid_identified_digital_bookings,
    SUM(is_repeat_booking_24m) AS repeat_valid_digital_bookings,
    ROUND(
      CAST(SUM(is_repeat_booking_24m) AS DOUBLE) / NULLIF(COUNT(*), 0),
      6
    ) AS repeat_booking_rate,
    ROUND(
      100.0 * CAST(SUM(is_repeat_booking_24m) AS DOUBLE) / NULLIF(COUNT(*), 0),
      2
    ) AS repeat_booking_rate_percent
  FROM classified_bookings
  GROUP BY
    booking_date,
    LOWER(booking_channel),
    LOWER(booking_platform),
    market,
    country,
    product_type
  ORDER BY
    booking_date,
    booking_channel,
    booking_platform,
    market,
    country,
    product_type;

Calculation Notes: |
  1️⃣ Count each deterministically identified customer once per measurement period, regardless of the number of repeat bookings.
  2️⃣ Qualify a customer as repeat only when a prior net-valid digital booking exists within the 24 months preceding the customer's first qualifying booking in the period.
  3️⃣ Include confirmed paid or guaranteed web and mobile-app bookings; exclude abandoned holds, test records, employee test bookings, fraud, chargebacks, and unpaid reservations.
  4️⃣ Deduplicate retries and cross-device submissions using the canonical booking ID and retain the earliest successful confirmation timestamp.
  5️⃣ Exclude fully cancelled or fully refunded bookings; provisionally report recent periods and restate them until 30 days after scheduled checkout.
  6️⃣ Exclude anonymous customers and bookings that cannot be deterministically linked to a stable first-party customer ID from both numerator and denominator.
  7️⃣ Assign the booking to the period containing its successful confirmation timestamp, normalized to the governed reporting timezone.

Business Use Case: |
  The Customer Loyalty executive monitors Repeat Booking Rate by acquisition channel, destination, booking platform, and loyalty status to identify customer groups that are not returning. If first-time mobile-app bookers show a materially lower rate than comparable web bookers, the retention team can deploy targeted in-app offers, improve post-trip lifecycle messaging, and evaluate subsequent monthly cohorts against the pre-intervention baseline.



# KPI: Repeat Booking Rate
# Generated: 2026-09-13T19:30:10.826Z
# Contributed by: devyendarm
# Last modified by: devyendarm

KPI Name: Repeat Booking Rate
Formula: (Distinct Eligible Customers with at least 1 Net-Valid Digital Booking in the Measurement Period and at least 1 Earlier Net-Valid Digital Booking in the Preceding 24 Months / Distinct Eligible Customers with at least 1 Net-Valid Digital Booking in the Measurement Period) × 100

Description: |
  Repeat Booking Rate measures the percentage of uniquely identified digital customers who complete a valid digital booking during the measurement period and had completed at least one valid digital booking within the preceding 24 months. It quantifies digitally observable customer retention while excluding anonymous, cancelled, fraudulent, test, and duplicate bookings.

Category: Retention

Tags: [kpi]

Industry: [Travel & Hospitality]

Priority: High

Core Area: Monetization

Scope: User

Measure Type: percentage

Aggregation Window: Time based - Monthly

GA4 Event: |
  purchase

Adobe Event: |
  purchase


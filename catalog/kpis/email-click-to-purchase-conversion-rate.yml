Google Analytics SQL: |
  -- ==========================================
  -- 1. GOOGLE BIGQUERY SQL
  -- ==========================================
  -- Email Click-to-Purchase Conversion Rate (recipient level, click-date cohort, 5-day attribution window)
  -- Click period: 2026-08-01 to 2026-08-31; GA4 export scanned to click period end + 5 days
  WITH esp_clicks AS (
    SELECT
      click_id,
      subscriber_id_hashed,
      campaign_id,
      message_type,
      click_timestamp AS click_ts,
      DATE(click_timestamp) AS click_date
    FROM `your-project.esp.email_clicks`
    WHERE click_timestamp >= TIMESTAMP('2026-08-01')
      AND click_timestamp < TIMESTAMP('2026-09-01')
      AND subscriber_id_hashed IS NOT NULL
      AND message_type IN ('campaign', 'flow')
      AND COALESCE(is_test_send, FALSE) = FALSE
      AND COALESCE(is_internal_or_seed_recipient, FALSE) = FALSE
      AND COALESCE(clicked_all_links_in_message, FALSE) = FALSE
      AND TIMESTAMP_DIFF(click_timestamp, delivered_timestamp, SECOND) > 2
      AND NOT REGEXP_CONTAINS(LOWER(COALESCE(user_agent, '')), r'(bot|scanner|proofpoint|mimecast|barracuda|safelinks)')
  ),
  ga4_events AS (
    SELECT
      user_pseudo_id,
      event_name,
      TIMESTAMP_MICROS(event_timestamp) AS event_ts,
      ecommerce.transaction_id AS transaction_id,
      ARRAY_LENGTH(items) AS item_count,
      (SELECT value.int_value FROM UNNEST(event_params) WHERE key = 'ga_session_id') AS ga_session_id,
      COALESCE(
        user_id,
        (SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'email_subscriber_id_hashed')
      ) AS subscriber_id_hashed,
      LOWER(COALESCE(
        session_traffic_source_last_click.manual_campaign.medium,
        collected_traffic_source.manual_medium,
        (SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'medium'),
        (SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'campaign_medium')
      )) AS event_medium,
      COALESCE(
        session_traffic_source_last_click.manual_campaign.campaign_id,
        collected_traffic_source.manual_campaign_id,
        (SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'campaign_id')
      ) AS event_campaign_id
    FROM `your-project.analytics_123456789.events_*`
    WHERE _TABLE_SUFFIX BETWEEN '20260801' AND '20260905'
      AND event_name IN ('session_start', 'page_view', 'purchase', 'refund')
  ),
  ga4_sessions AS (
    SELECT
      user_pseudo_id,
      ga_session_id,
      MAX(subscriber_id_hashed) AS subscriber_id_hashed,
      ARRAY_AGG(event_medium IGNORE NULLS ORDER BY event_ts LIMIT 1)[SAFE_OFFSET(0)] AS session_medium,
      ARRAY_AGG(event_campaign_id IGNORE NULLS ORDER BY event_ts LIMIT 1)[SAFE_OFFSET(0)] AS session_campaign_id
    FROM ga4_events
    WHERE ga_session_id IS NOT NULL
    GROUP BY user_pseudo_id, ga_session_id
  ),
  ga4_email_orders AS (
    SELECT
      e.transaction_id,
      s.subscriber_id_hashed,
      s.session_campaign_id AS campaign_id,
      MIN(e.event_ts) AS order_ts
    FROM ga4_events AS e
    JOIN ga4_sessions AS s
      ON s.user_pseudo_id = e.user_pseudo_id
     AND s.ga_session_id = e.ga_session_id
    WHERE e.event_name = 'purchase'
      AND e.transaction_id IS NOT NULL
      AND e.transaction_id NOT IN ('', '(not set)')
      AND s.session_medium = 'email'
      AND s.subscriber_id_hashed IS NOT NULL
    GROUP BY e.transaction_id, s.subscriber_id_hashed, s.session_campaign_id
  ),
  esp_feed_orders AS (
    SELECT
      order_id AS transaction_id,
      subscriber_id_hashed,
      attributed_campaign_id AS campaign_id,
      order_timestamp AS order_ts
    FROM `your-project.esp.email_orders`
    WHERE order_timestamp >= TIMESTAMP('2026-08-01')
      AND order_timestamp < TIMESTAMP('2026-09-06')
      AND order_id IS NOT NULL
      AND subscriber_id_hashed IS NOT NULL
  ),
  voided_orders AS (
    SELECT DISTINCT transaction_id
    FROM ga4_events
    WHERE event_name = 'refund'
      AND transaction_id IS NOT NULL
      AND COALESCE(item_count, 0) = 0
    UNION DISTINCT
    SELECT DISTINCT order_id AS transaction_id
    FROM `your-project.esp.email_orders`
    WHERE LOWER(order_status) IN ('refunded', 'cancelled')
  ),
  attributed_orders AS (
    SELECT o.transaction_id, o.subscriber_id_hashed, o.campaign_id, o.order_ts
    FROM (
      SELECT transaction_id, subscriber_id_hashed, campaign_id, order_ts FROM ga4_email_orders
      UNION ALL
      SELECT transaction_id, subscriber_id_hashed, campaign_id, order_ts FROM esp_feed_orders
    ) AS o
    LEFT JOIN voided_orders AS v
      ON v.transaction_id = o.transaction_id
    WHERE v.transaction_id IS NULL
    QUALIFY ROW_NUMBER() OVER (PARTITION BY o.transaction_id ORDER BY o.order_ts) = 1
  ),
  converting_clicks AS (
    SELECT
      c.click_date,
      c.subscriber_id_hashed,
      o.transaction_id
    FROM esp_clicks AS c
    JOIN attributed_orders AS o
      ON o.subscriber_id_hashed = c.subscriber_id_hashed
     AND o.campaign_id = c.campaign_id
     AND o.order_ts >= c.click_ts
     AND o.order_ts < TIMESTAMP_ADD(c.click_ts, INTERVAL 5 DAY)
    QUALIFY ROW_NUMBER() OVER (PARTITION BY o.transaction_id ORDER BY c.click_ts DESC) = 1
  )
  SELECT
    c.click_date,
    COUNT(DISTINCT c.subscriber_id_hashed) AS total_unique_email_clickers,
    COUNT(DISTINCT cc.subscriber_id_hashed) AS converting_unique_email_clickers,
    ROUND(SAFE_DIVIDE(COUNT(DISTINCT cc.subscriber_id_hashed), COUNT(DISTINCT c.subscriber_id_hashed)) * 100, 2) AS email_click_to_purchase_conversion_rate_pct,
    TIMESTAMP_ADD(TIMESTAMP(DATE_ADD(c.click_date, INTERVAL 1 DAY)), INTERVAL 5 DAY) <= CURRENT_TIMESTAMP() AS attribution_window_closed
  FROM esp_clicks AS c
  LEFT JOIN converting_clicks AS cc
    ON cc.click_date = c.click_date
   AND cc.subscriber_id_hashed = c.subscriber_id_hashed
  GROUP BY c.click_date
  ORDER BY c.click_date;

AEP Query Service SQL: |
  -- ==========================================
  -- 2. ADOBE AEP QUERY SERVICE SQL
  -- ==========================================
  -- Email Click-to-Purchase Conversion Rate (recipient level, click-date cohort, 5-day attribution window)
  -- Click period: 2026-08-01 to 2026-08-31; web events scanned to click period end + 5 days
  WITH esp_clicks AS (
    SELECT
      click_id,
      subscriber_id_hashed,
      campaign_id,
      message_type,
      CAST(click_timestamp AS TIMESTAMP) AS click_ts,
      CAST(click_timestamp AS DATE) AS click_date
    FROM esp_email_click_dataset
    WHERE click_timestamp >= TIMESTAMP '2026-08-01 00:00:00'
      AND click_timestamp < TIMESTAMP '2026-09-01 00:00:00'
      AND subscriber_id_hashed IS NOT NULL
      AND message_type IN ('campaign', 'flow')
      AND COALESCE(is_test_send, FALSE) = FALSE
      AND COALESCE(is_internal_or_seed_recipient, FALSE) = FALSE
      AND COALESCE(clicked_all_links_in_message, FALSE) = FALSE
      AND (unix_timestamp(click_timestamp) - unix_timestamp(delivered_timestamp)) > 2
      AND NOT (LOWER(COALESCE(user_agent, '')) RLIKE '(bot|scanner|proofpoint|mimecast|barracuda|safelinks)')
  ),
  web_events AS (
    SELECT
      endUserIDs._experience.mcid.id AS ecid,
      timestamp AS event_ts,
      eventType AS event_type,
      commerce.order.purchaseID AS transaction_id,
      _experience.analytics.customDimensions.eVars.eVar12 AS subscriber_id_hashed,
      COALESCE(_experience.analytics.customDimensions.eVars.eVar10, marketing.campaignName) AS event_campaign_id,
      LOWER(COALESCE(
        marketing.campaignGroup,
        CASE WHEN channel._type = 'https://ns.adobe.com/xdm/channel-types/email' THEN 'email' END,
        split(marketing.trackingCode, ':')[0]
      )) AS event_medium,
      SESS_TIMEOUT(timestamp, 60 * 30) OVER (
        PARTITION BY endUserIDs._experience.mcid.id
        ORDER BY timestamp
        ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW
      ).num AS session_num
    FROM aep_web_experience_event_dataset
    WHERE timestamp >= TIMESTAMP '2026-08-01 00:00:00'
      AND timestamp < TIMESTAMP '2026-09-06 00:00:00'
      AND endUserIDs._experience.mcid.id IS NOT NULL
  ),
  web_sessions AS (
    SELECT DISTINCT
      ecid,
      session_num,
      MAX(subscriber_id_hashed) OVER (PARTITION BY ecid, session_num) AS subscriber_id_hashed,
      first_value(event_medium, TRUE) OVER (
        PARTITION BY ecid, session_num ORDER BY event_ts
        ROWS BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING
      ) AS session_medium,
      first_value(event_campaign_id, TRUE) OVER (
        PARTITION BY ecid, session_num ORDER BY event_ts
        ROWS BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING
      ) AS session_campaign_id
    FROM web_events
  ),
  web_email_orders AS (
    SELECT
      e.transaction_id,
      s.subscriber_id_hashed,
      s.session_campaign_id AS campaign_id,
      MIN(e.event_ts) AS order_ts
    FROM web_events AS e
    JOIN web_sessions AS s
      ON s.ecid = e.ecid
     AND s.session_num = e.session_num
    WHERE e.event_type = 'commerce.purchases'
      AND e.transaction_id IS NOT NULL
      AND e.transaction_id <> ''
      AND s.session_medium = 'email'
      AND s.subscriber_id_hashed IS NOT NULL
    GROUP BY e.transaction_id, s.subscriber_id_hashed, s.session_campaign_id
  ),
  esp_feed_orders AS (
    SELECT
      order_id AS transaction_id,
      subscriber_id_hashed,
      attributed_campaign_id AS campaign_id,
      CAST(order_timestamp AS TIMESTAMP) AS order_ts
    FROM esp_email_order_dataset
    WHERE order_timestamp >= TIMESTAMP '2026-08-01 00:00:00'
      AND order_timestamp < TIMESTAMP '2026-09-06 00:00:00'
      AND order_id IS NOT NULL
      AND subscriber_id_hashed IS NOT NULL
  ),
  voided_orders AS (
    SELECT DISTINCT order_id AS transaction_id
    FROM esp_email_order_dataset
    WHERE LOWER(order_status) IN ('refunded', 'cancelled')
  ),
  ranked_orders AS (
    SELECT
      o.transaction_id,
      o.subscriber_id_hashed,
      o.campaign_id,
      o.order_ts,
      ROW_NUMBER() OVER (PARTITION BY o.transaction_id ORDER BY o.order_ts) AS rn
    FROM (
      SELECT transaction_id, subscriber_id_hashed, campaign_id, order_ts FROM web_email_orders
      UNION ALL
      SELECT transaction_id, subscriber_id_hashed, campaign_id, order_ts FROM esp_feed_orders
    ) AS o
    LEFT JOIN voided_orders AS v
      ON v.transaction_id = o.transaction_id
    WHERE v.transaction_id IS NULL
  ),
  click_order_matches AS (
    SELECT
      c.click_date,
      c.subscriber_id_hashed,
      o.transaction_id,
      ROW_NUMBER() OVER (PARTITION BY o.transaction_id ORDER BY c.click_ts DESC) AS rn
    FROM esp_clicks AS c
    JOIN ranked_orders AS o
      ON o.rn = 1
     AND o.subscriber_id_hashed = c.subscriber_id_hashed
     AND o.campaign_id = c.campaign_id
     AND o.order_ts >= c.click_ts
     AND unix_timestamp(o.order_ts) < unix_timestamp(c.click_ts) + 5 * 86400
  ),
  converting_clicks AS (
    SELECT DISTINCT click_date, subscriber_id_hashed
    FROM click_order_matches
    WHERE rn = 1
  )
  SELECT
    c.click_date,
    COUNT(DISTINCT c.subscriber_id_hashed) AS total_unique_email_clickers,
    COUNT(DISTINCT cc.subscriber_id_hashed) AS converting_unique_email_clickers,
    ROUND(
      100.0 * COUNT(DISTINCT cc.subscriber_id_hashed)
      / NULLIF(COUNT(DISTINCT c.subscriber_id_hashed), 0), 2
    ) AS email_click_to_purchase_conversion_rate_pct,
    CAST(date_add(c.click_date, 6) AS TIMESTAMP) <= current_timestamp() AS attribution_window_closed
  FROM esp_clicks AS c
  LEFT JOIN converting_clicks AS cc
    ON cc.click_date = c.click_date
   AND cc.subscriber_id_hashed = c.subscriber_id_hashed
  GROUP BY c.click_date
  ORDER BY c.click_date;

Calculation Notes: |
  1️⃣ Denominator is every unique clicking recipient (ESP subscriber/profile ID) with at least one tracked click on a campaign or flow email in the period, whether or not the click produced a measurable GA4 session; the click-level variant (attributed purchasing clicks / total clicks) must be labelled separately and never blended with the recipient-level rate.
  2️⃣ Numerator counts a clicker once when a purchase event with a valid transaction_id occurs in a session whose session_source_medium is email and whose session_campaign maps to the clicked send, or on the ESP order feed tied to the same profile, within the attribution window (default 5 days from click; state the window when comparing against Klaviyo or Braze defaults).
  3️⃣ Stitch ESP click data to GA4 on a hashed subscriber ID passed in the landing URL (e.g. utm_id or a hashed profile parameter) or the logged-in user_id; raw email addresses never enter the analytics join, and unmatched clicks stay in the denominator so the rate is not inflated by stitching gaps.
  4️⃣ Exclude bot and security-scanner clicks (clicks within 2 seconds of delivery, clicks on every link in the message, or known link-scanner user agents), internal and seed-list recipients, test sends and transactional messages (order confirmations, shipping notifications).
  5️⃣ GA4 sessions expire after 30 minutes of inactivity; a purchase in a later session still qualifies when that session is attributed to the same email campaign within the window, while a later session from a different source (paid search, direct with a new campaign) is credited to that source under last non-direct click rules.
  6️⃣ Deduplicate orders on transaction_id across web, app and the ESP order feed; orders fully refunded or cancelled before the reporting close are removed from the numerator.
  7️⃣ Attribute the conversion to the click date (the send cohort), not the order date, and hold the latest period open until the attribution window has fully elapsed before publishing the final value.

Business Use Case: |
  1️⃣ The CRM & Email Marketing Manager reviews the rate per campaign in the weekly send review; when a campaign converts below the trailing 8-week median despite an above-median click-through rate, the team audits the landing page, offer terms and product availability before the next send to that segment.
  2️⃣ Lifecycle Marketing compares automated flows (abandoned cart, browse abandonment, win-back) against broadcast campaigns each month and moves discount budget from flows whose rate does not exceed the broadcast baseline to those that do.
  3️⃣ The Growth team uses the rate as the primary success metric in subject-line, creative and send-time A/B tests, promoting a variant only when its uplift in click-to-purchase conversion is statistically significant rather than on clicks alone.
  4️⃣ Marketing Leadership reconciles ESP-reported and GA4-attributed values monthly; when the gap exceeds 15 percentage points, the email operations lead fixes UTM tagging or the hashed-ID handoff before the figures are used in channel budget planning.

Dependencies:
  Events: [purchase, session_start]
  Dimensions: [session-source-medium, session-campaign, transaction-id]


# KPI: Email Click-to-Purchase Conversion Rate
# Generated: 2026-09-15T03:32:52.521Z
# Contributed by: devyendarm
# Last modified by: devyendarm

KPI Name: Email Click-to-Purchase Conversion Rate
Formula: (Unique Email Clickers with ≥1 Attributed Purchase within the Attribution Window / Total Unique Email Clickers) × 100

Description: |
  E-commerce specialisation of Conversion Rate: the share of unique email clickers in a period whose click-through session (utm_medium=email, matched to the sending campaign) leads to a completed purchase, or to a click-attributed order on the ESP order feed, within the attribution window, with every unique clicker in the period, taken from the ESP click feed, as the denominator. It separates post-click commercial performance from open and click engagement, showing whether campaign content, offer and landing experience turn email traffic into orders at the rate reported by the ESP (Klaviyo, Braze, Salesforce Marketing Cloud) and reconciled in GA4.

Category: Conversion

Tags: [kpi, E-commerce: Top-of-Funnel & Marketing Acquisition]

Industry: [["E-commerce"]]

Priority: High

Core Area: Discovery

Scope: User

Measure Type: Percentage

Aggregation Window: Daily, Weekly, Monthly

GA4 Event: |
  purchase


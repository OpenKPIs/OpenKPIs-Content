# Last modified by: devyendarm

KPI Name: Shipment On-Time Delivery Rate
Formula: (On-Time Shipments / Total Shipments) × 100

Description: |
  Measures the percentage of shipments delivered on or before the scheduled delivery date. It reflects the efficiency and reliability of the logistics operations.

Category: Performance

Tags: [kpi]

Industry: [Logistics & Supply Chain]

Priority: High

Core Area: Generic

Scope: Global

Measure Type: percentage

Aggregation Window: Time based - Daily







Google Analytics SQL: |
  -- ==========================================
  -- 1. GOOGLE BIGQUERY SQL
  -- ==========================================
  SELECT order_id, 
         COUNT(CASE WHEN delivery_date <= promised_date THEN 1 END) / COUNT(order_id) AS on_time_delivery_rate
  FROM `your-project.erp.shipment_logs`
  WHERE delivery_status = 'Delivered'
  GROUP BY order_id

AEP Query Service SQL: |
  -- ==========================================
  -- 2. ADOBE AEP QUERY SERVICE SQL
  -- ==========================================
  SELECT order_id, 
         COUNT(CASE WHEN delivery_date <= promised_date THEN 1 END) / COUNT(order_id) AS on_time_delivery_rate
  FROM aep_backend_dataset.shipment_logs
  WHERE delivery_status = 'Delivered'
  GROUP BY order_id

Calculation Notes: |
  Exclude shipments with customer-requested delays. Consider timezone differences for international deliveries.

Business Use Case: |
  Executives use this KPI to identify bottlenecks in the delivery process and improve logistics planning to enhance customer satisfaction.


Source Data: ERP


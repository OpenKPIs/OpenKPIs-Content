# KPI: Gross Merchandise Value
# Generated: 2026-09-15T01:34:54.943Z
# Contributed by: swapnamagantius
# Last modified by: devyendarm

KPI Name: Gross Merchandise Value
Formula: GMV = SUM over distinct transaction_id order lines of (unit selling price × quantity × FX rate to reporting currency on order date), WHERE order is not test/internal AND order status ≠ cancelled before fulfilment; unit selling price is net of item-level markdowns and before order-level coupons; tax, shipping and fees excluded; gift card purchases excluded; returns, refunds, post-fulfilment cancellations and marketplace commissions not deducted (Net Revenue = GMV − order-level discounts − returns and refunds − post-fulfilment cancellations)

Description: |
  Gross Merchandise Value (GMV) is the total value of merchandise sold through completed orders in the period, calculated as unit selling price × quantity across every first- and third-party order line, excluding tax and shipping and stated before returns, refunds, post-fulfilment cancellations, order-level coupons and marketplace commissions. It is the top-line measure of transaction volume used to size demand and compare channels, categories and sellers, and it exceeds Net Revenue by order-level discounts, returns and refunds and post-fulfilment cancellations, plus, for marketplaces, the gap left when third-party seller proceeds are replaced by the commission earned, so it must never be presented as recognised revenue.

Category: Monetization


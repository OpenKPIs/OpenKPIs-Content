SQL Query: |
  WITH purchases AS (
    SELECT
      PARSE_DATE('%Y%m%d', event_date) AS order_date,
      ecommerce.transaction_id AS transaction_id,
      ecommerce.purchase_revenue AS order_value,
      items.item_id AS item_id,
      items.price AS item_price,
      items.quantity AS quantity
    FROM `project.dataset.events_*`, UNNEST(items) AS items
    WHERE event_name = 'purchase'
  )
  SELECT
    order_date,
    ROUND(SUM(COALESCE(item_price * quantity, order_value)), 2) AS gross_merchandise_value
  FROM purchases
  GROUP BY order_date
  ORDER BY order_date;

Calculation Notes: |
  1) The most common commerce definition excludes tax and shipping and uses merchandise subtotal only. 
  2) Define whether GMV includes tax, shipping, gift wrap, and discounts at the order or item level; 
  3) Deduplicate purchase events by transaction_id to avoid double counting from page reloads or server/client dual tagging. 
  4) Exclude canceled or fraudulent orders if the business reports net valid GMV; otherwise label the metric as booked GMV. 
  5) For marketplaces, clarify whether third-party seller sales are included and whether currency conversion is done at transaction-time FX rates or reporting-time rates. 
  6) Returns and refunds should not reduce GMV unless a separate net GMV definition is used.

Business Use Case: |
  An e-commerce leadership team tracks daily and monthly GMV by channel, device and product category to identify where sales volume is accelerating or declining. If paid social drives high sessions but low GMV relative to search, the team can reallocate budget, adjust promotions, or improve landing page merchandising.


KPI Name: Gross Merchandise value
Formula: GMV = SUM(item_price × quantity)

Description: |
  Gross merchandise value measures the total monetary value of merchandise sold over a given period before deducting returns, refunds, discounts funded after sale, shipping adjustments, taxes, or marketplace fees unless otherwise specified by the business definition. It is a core top-line revenue proxy used to evaluate sales volume, marketplace scale, merchandising performance, and growth trends.

Category: Revenue


Industry: [["Retail, E-commerce"]]

Priority: High

Core Area: Business Intelligence

Scope: Global

Measure Type: Currency

Aggregation Window: Event, User, Weekly, Hourly, Monthly, Yearly


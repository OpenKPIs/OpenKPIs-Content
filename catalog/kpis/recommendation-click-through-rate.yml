KPI Name: Recommendation Click-Through Rate
Formula: (Recommendation Module Impressions with a Recommended Item Click / Viewable Recommendation Module Impressions) × 100

Description: |
  Specialisation of Product List Click-Through Rate for recommendation modules: share of viewable module impressions (homepage, PDP, cart) with a recommended-item click. Shows how relevant each placement is.

Category: Engagement


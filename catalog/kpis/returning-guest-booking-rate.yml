Google Analytics SQL: |
  -- ==========================================
  -- 1. GOOGLE BIGQUERY SQL
  -- ==========================================
  WITH event_base AS (
    SELECT
      TO_HEX(SHA256(CONCAT(
        event_date, '|',
        CAST(event_timestamp AS STRING), '|',
        COALESCE(user_pseudo_id, ''), '|',
        COALESCE(stream_id, ''), '|',
        CAST(COALESCE(event_bundle_sequence_id, 0) AS STRING)
      ))) AS event_row_id,
      event_date,
      event_timestamp,
      event_name,
      user_id,
      user_pseudo_id,
      stream_id,
      platform AS ga4_platform,
      device,
      geo,
      traffic_source,
      ecommerce,
      items,
      event_params
    FROM `your-project.analytics_123456789.events_*`
    WHERE _TABLE_SUFFIX BETWEEN FORMAT_DATE('%Y%m%d', DATE_SUB(CURRENT_DATE(), INTERVAL 24 MONTH))
                            AND FORMAT_DATE('%Y%m%d', CURRENT_DATE())
      AND event_name = 'purchase'
  ),
  parameter_values AS (
    SELECT
      event_row_id,
      ep.key,
      COALESCE(
        ep.value.string_value,
        CAST(ep.value.int_value AS STRING),
        CAST(ep.value.double_value AS STRING),
        CAST(ep.value.float_value AS STRING)
      ) AS parameter_value
    FROM event_base
    CROSS JOIN UNNEST(event_params) AS ep
  ),
  parameter_pivot AS (
    SELECT
      event_row_id,
      MAX(IF(key = 'event_id', parameter_value, NULL)) AS event_id,
      MAX(IF(key = 'event_source', parameter_value, NULL)) AS event_source,
      MAX(IF(key = 'page_location', parameter_value, NULL)) AS page_location,
      MAX(IF(key = 'page_title', parameter_value, NULL)) AS page_title,
      MAX(IF(key = 'page_type', parameter_value, NULL)) AS page_type,
      MAX(IF(key = 'site_name', parameter_value, NULL)) AS site_name,
      MAX(IF(key = 'site_section', parameter_value, NULL)) AS site_section,
      MAX(IF(key = 'channel', parameter_value, NULL)) AS channel,
      MAX(IF(key = 'platform', parameter_value, NULL)) AS event_platform,
      MAX(IF(key = 'language', parameter_value, NULL)) AS language,
      MAX(IF(key = 'identity_eligible', parameter_value, NULL)) AS identity_eligible,
      MAX(IF(key = 'identity_namespace', parameter_value, NULL)) AS identity_namespace,
      MAX(IF(key = 'identity_auth_state', parameter_value, NULL)) AS identity_auth_state,
      MAX(IF(key = 'guest_status', parameter_value, NULL)) AS guest_status,
      MAX(IF(key = 'prior_confirmed_booking_count', parameter_value, NULL)) AS prior_confirmed_booking_count,
      MAX(IF(key = 'prior_confirmed_booking_date', parameter_value, NULL)) AS prior_confirmed_booking_date,
      MAX(IF(key = 'history_window_start', parameter_value, NULL)) AS history_window_start,
      MAX(IF(key = 'history_window_end', parameter_value, NULL)) AS history_window_end,
      MAX(IF(key = 'is_returning_guest', parameter_value, NULL)) AS is_returning_guest,
      MAX(IF(key = 'currency', parameter_value, NULL)) AS currency,
      MAX(IF(key = 'transaction_id', parameter_value, NULL)) AS transaction_id,
      MAX(IF(key = 'booking_id', parameter_value, NULL)) AS booking_id,
      MAX(IF(key = 'booking_status', parameter_value, NULL)) AS booking_status,
      MAX(IF(key = 'booking_timestamp', parameter_value, NULL)) AS booking_timestamp,
      MAX(IF(key IN ('value', 'booking_value'), parameter_value, NULL)) AS booking_value,
      MAX(IF(key = 'tax', parameter_value, NULL)) AS tax,
      MAX(IF(key = 'fees', parameter_value, NULL)) AS fees,
      MAX(IF(key = 'discount', parameter_value, NULL)) AS discount,
      MAX(IF(key = 'coupon', parameter_value, NULL)) AS coupon,
      MAX(IF(key = 'item_count', parameter_value, NULL)) AS item_count
    FROM parameter_values
    GROUP BY event_row_id
  ),
  booking_events AS (
    SELECT
      PARSE_DATE('%Y%m%d', b.event_date) AS event_date,
      TIMESTAMP_MICROS(b.event_timestamp) AS event_timestamp,
      p.event_id,
      COALESCE(p.event_source, 'digital_analytics') AS event_source,
      b.event_name,
      p.page_location,
      p.page_title,
      p.page_type,
      p.site_name,
      p.site_section,
      p.channel,
      COALESCE(p.event_platform, LOWER(b.ga4_platform)) AS platform,
      p.language,
      b.user_id,
      b.user_pseudo_id,
      CASE LOWER(p.identity_eligible)
        WHEN 'true' THEN TRUE
        WHEN '1' THEN TRUE
        WHEN 'false' THEN FALSE
        WHEN '0' THEN FALSE
        ELSE FALSE
      END AS identity_eligible,
      p.identity_namespace,
      p.identity_auth_state,
      p.guest_status,
      SAFE_CAST(p.prior_confirmed_booking_count AS INT64) AS prior_confirmed_booking_count,
      SAFE_CAST(p.prior_confirmed_booking_date AS TIMESTAMP) AS prior_confirmed_booking_date,
      SAFE_CAST(p.history_window_start AS TIMESTAMP) AS history_window_start,
      SAFE_CAST(p.history_window_end AS TIMESTAMP) AS history_window_end,
      CASE
        WHEN LOWER(p.is_returning_guest) IN ('true', '1') THEN TRUE
        WHEN LOWER(p.is_returning_guest) IN ('false', '0') THEN FALSE
        WHEN SAFE_CAST(p.prior_confirmed_booking_count AS INT64) > 0 THEN TRUE
        WHEN LOWER(p.guest_status) = 'returning' THEN TRUE
        ELSE FALSE
      END AS is_returning_guest,
      COALESCE(b.ecommerce.currency, p.currency) AS currency,
      COALESCE(NULLIF(b.ecommerce.transaction_id, ''), p.transaction_id) AS transaction_id,
      p.booking_id,
      LOWER(COALESCE(p.booking_status, 'confirmed')) AS booking_status,
      COALESCE(SAFE_CAST(p.booking_timestamp AS TIMESTAMP), TIMESTAMP_MICROS(b.event_timestamp)) AS booking_timestamp,
      COALESCE(b.ecommerce.purchase_revenue, SAFE_CAST(p.booking_value AS NUMERIC)) AS booking_value,
      COALESCE(b.ecommerce.tax_value, SAFE_CAST(p.tax AS NUMERIC)) AS tax,
      SAFE_CAST(p.fees AS NUMERIC) AS fees,
      SAFE_CAST(p.discount AS NUMERIC) AS discount,
      COALESCE(p.coupon, b.items[SAFE_OFFSET(0)].coupon) AS coupon,
      COALESCE(SAFE_CAST(p.item_count AS INT64), b.ecommerce.total_item_quantity, ARRAY_LENGTH(b.items)) AS item_count,
      b.items[SAFE_OFFSET(0)].item_id AS property_id,
      b.items[SAFE_OFFSET(0)].item_name AS property_name,
      b.items[SAFE_OFFSET(0)].item_brand AS property_brand,
      b.items[SAFE_OFFSET(0)].item_category2 AS property_city,
      b.items[SAFE_OFFSET(0)].item_category3 AS property_region,
      b.items[SAFE_OFFSET(0)].item_category4 AS property_country,
      (SELECT COALESCE(ip.value.string_value, CAST(ip.value.int_value AS STRING))
       FROM UNNEST(b.items[SAFE_OFFSET(0)].item_params) AS ip
       WHERE ip.key = 'check_in_date' LIMIT 1) AS check_in_date,
      (SELECT COALESCE(ip.value.string_value, CAST(ip.value.int_value AS STRING))
       FROM UNNEST(b.items[SAFE_OFFSET(0)].item_params) AS ip
       WHERE ip.key = 'check_out_date' LIMIT 1) AS check_out_date,
      SAFE_CAST((SELECT COALESCE(ip.value.string_value, CAST(ip.value.int_value AS STRING))
                 FROM UNNEST(b.items[SAFE_OFFSET(0)].item_params) AS ip
                 WHERE ip.key = 'nights' LIMIT 1) AS INT64) AS nights,
      SAFE_CAST((SELECT COALESCE(ip.value.string_value, CAST(ip.value.int_value AS STRING))
                 FROM UNNEST(b.items[SAFE_OFFSET(0)].item_params) AS ip
                 WHERE ip.key = 'rooms' LIMIT 1) AS INT64) AS rooms,
      SAFE_CAST((SELECT COALESCE(ip.value.string_value, CAST(ip.value.int_value AS STRING))
                 FROM UNNEST(b.items[SAFE_OFFSET(0)].item_params) AS ip
                 WHERE ip.key = 'adults' LIMIT 1) AS INT64) AS adults,
      SAFE_CAST((SELECT COALESCE(ip.value.string_value, CAST(ip.value.int_value AS STRING))
                 FROM UNNEST(b.items[SAFE_OFFSET(0)].item_params) AS ip
                 WHERE ip.key = 'children' LIMIT 1) AS INT64) AS children,
      (SELECT ip.value.string_value FROM UNNEST(b.items[SAFE_OFFSET(0)].item_params) AS ip
       WHERE ip.key = 'rate_plan_id' LIMIT 1) AS rate_plan_id,
      (SELECT ip.value.string_value FROM UNNEST(b.items[SAFE_OFFSET(0)].item_params) AS ip
       WHERE ip.key = 'rate_plan_name' LIMIT 1) AS rate_plan_name,
      (SELECT ip.value.string_value FROM UNNEST(b.items[SAFE_OFFSET(0)].item_params) AS ip
       WHERE ip.key = 'room_type_id' LIMIT 1) AS room_type_id,
      (SELECT ip.value.string_value FROM UNNEST(b.items[SAFE_OFFSET(0)].item_params) AS ip
       WHERE ip.key = 'room_type_name' LIMIT 1) AS room_type_name,
      b.device.category AS device_category,
      b.geo.country AS geo_country,
      b.traffic_source.source AS acquisition_source,
      b.traffic_source.medium AS acquisition_medium,
      b.event_row_id
    FROM event_base AS b
    LEFT JOIN parameter_pivot AS p
      USING (event_row_id)
  ),
  deduplicated_confirmed_bookings AS (
    SELECT *
    FROM booking_events
    WHERE booking_status = 'confirmed'
    QUALIFY ROW_NUMBER() OVER (
      PARTITION BY COALESCE(NULLIF(booking_id, ''), NULLIF(transaction_id, ''), NULLIF(event_id, ''), event_row_id)
      ORDER BY event_timestamp DESC
    ) = 1
  )
  SELECT
    DATE(booking_timestamp) AS booking_date,
    COUNT(*) AS total_confirmed_bookings,
    COUNTIF(is_returning_guest) AS returning_guest_bookings,
    ROUND(100 * SAFE_DIVIDE(COUNTIF(is_returning_guest), COUNT(*)), 2) AS returning_guest_booking_rate_pct,
    COUNTIF(identity_eligible) AS identity_eligible_bookings,
    ROUND(100 * SAFE_DIVIDE(COUNTIF(identity_eligible), COUNT(*)), 2) AS identity_coverage_rate_pct
  FROM deduplicated_confirmed_bookings
  GROUP BY booking_date
  ORDER BY booking_date;

AEP Query Service SQL: |
  -- ==========================================
  -- 2. ADOBE AEP QUERY SERVICE SQL
  -- ==========================================
  WITH booking_events AS (
    SELECT
      CAST(timestamp AS DATE) AS event_date,
      timestamp AS event_timestamp,
      _id AS event_id,
      eventType AS event_type,
      _tenant.bookingAnalytics.eventSource AS event_source,
      web.webPageDetails.URL AS page_url,
      web.webPageDetails.name AS page_name,
      _tenant.bookingAnalytics.pageType AS page_type,
      _tenant.bookingAnalytics.siteName AS site_name,
      _tenant.bookingAnalytics.siteSection AS site_section,
      channel.type AS channel,
      _tenant.bookingAnalytics.platform AS platform,
      environment.browserDetails.acceptLanguage AS language,
      _tenant.bookingAnalytics.guest.userId AS user_id,
      _tenant.bookingAnalytics.guest.identityEligible AS identity_eligible,
      _tenant.bookingAnalytics.guest.identityNamespace AS identity_namespace,
      _tenant.bookingAnalytics.guest.identityAuthState AS identity_auth_state,
      _tenant.bookingAnalytics.guest.guestStatus AS guest_status,
      _tenant.bookingAnalytics.guest.priorConfirmedBookingCount AS prior_confirmed_booking_count,
      _tenant.bookingAnalytics.guest.priorConfirmedBookingDate AS prior_confirmed_booking_date,
      _tenant.bookingAnalytics.guest.historyWindowStart AS history_window_start,
      _tenant.bookingAnalytics.guest.historyWindowEnd AS history_window_end,
      CASE
        WHEN _tenant.bookingAnalytics.guest.isReturningGuest IS NOT NULL
          THEN _tenant.bookingAnalytics.guest.isReturningGuest
        WHEN _tenant.bookingAnalytics.guest.priorConfirmedBookingCount > 0
          THEN TRUE
        WHEN LOWER(_tenant.bookingAnalytics.guest.guestStatus) = 'returning'
          THEN TRUE
        ELSE FALSE
      END AS is_returning_guest,
      commerce.order.currencyCode AS currency,
      commerce.order.purchaseID AS transaction_id,
      _tenant.bookingAnalytics.bookingId AS booking_id,
      LOWER(COALESCE(_tenant.bookingAnalytics.bookingStatus, 'confirmed')) AS booking_status,
      COALESCE(_tenant.bookingAnalytics.bookingTimestamp, timestamp) AS booking_timestamp,
      commerce.order.priceTotal AS booking_value,
      _tenant.bookingAnalytics.tax AS tax,
      _tenant.bookingAnalytics.fees AS fees,
      _tenant.bookingAnalytics.discount AS discount,
      _tenant.bookingAnalytics.coupon AS coupon,
      _tenant.bookingAnalytics.itemCount AS item_count,
      _tenant.bookingAnalytics.stay.propertyId AS property_id,
      _tenant.bookingAnalytics.stay.propertyName AS property_name,
      _tenant.bookingAnalytics.stay.propertyBrand AS property_brand,
      _tenant.bookingAnalytics.stay.propertyCity AS property_city,
      _tenant.bookingAnalytics.stay.propertyRegion AS property_region,
      _tenant.bookingAnalytics.stay.propertyCountry AS property_country,
      _tenant.bookingAnalytics.stay.checkInDate AS check_in_date,
      _tenant.bookingAnalytics.stay.checkOutDate AS check_out_date,
      _tenant.bookingAnalytics.stay.nights AS nights,
      _tenant.bookingAnalytics.stay.rooms AS rooms,
      _tenant.bookingAnalytics.stay.adults AS adults,
      _tenant.bookingAnalytics.stay.children AS children,
      _tenant.bookingAnalytics.stay.ratePlanId AS rate_plan_id,
      _tenant.bookingAnalytics.stay.ratePlanName AS rate_plan_name,
      _tenant.bookingAnalytics.stay.roomTypeId AS room_type_id,
      _tenant.bookingAnalytics.stay.roomTypeName AS room_type_name,
      marketing.trackingCode AS tracking_code,
      productListItems[0].SKU AS product_sku,
      productListItems[0].name AS product_name,
      productListItems[0].quantity AS product_quantity,
      productListItems[0].priceTotal AS product_price_total
    FROM your_aep_purchase_events_dataset
    WHERE eventType = 'commerce.purchases'
      AND timestamp >= CURRENT_DATE - INTERVAL '24 months'
      AND timestamp < CURRENT_DATE + INTERVAL '1 day'
  ),
  ranked_confirmed_bookings AS (
    SELECT
      booking_events.*,
      ROW_NUMBER() OVER (
        PARTITION BY COALESCE(
          NULLIF(booking_id, ''),
          NULLIF(transaction_id, ''),
          NULLIF(event_id, '')
        )
        ORDER BY event_timestamp DESC
      ) AS booking_record_rank
    FROM booking_events
    WHERE booking_status = 'confirmed'
  ),
  deduplicated_confirmed_bookings AS (
    SELECT *
    FROM ranked_confirmed_bookings
    WHERE booking_record_rank = 1
  )
  SELECT
    CAST(booking_timestamp AS DATE) AS booking_date,
    COUNT(*) AS total_confirmed_bookings,
    SUM(CASE WHEN is_returning_guest = TRUE THEN 1 ELSE 0 END) AS returning_guest_bookings,
    ROUND(
      100.0 * SUM(CASE WHEN is_returning_guest = TRUE THEN 1 ELSE 0 END)
      / NULLIF(COUNT(*), 0),
      2
    ) AS returning_guest_booking_rate_pct,
    SUM(CASE WHEN identity_eligible = TRUE THEN 1 ELSE 0 END) AS identity_eligible_bookings,
    ROUND(
      100.0 * SUM(CASE WHEN identity_eligible = TRUE THEN 1 ELSE 0 END)
      / NULLIF(COUNT(*), 0),
      2
    ) AS identity_coverage_rate_pct
  FROM deduplicated_confirmed_bookings
  GROUP BY CAST(booking_timestamp AS DATE)
  ORDER BY booking_date;

Calculation Notes: |
  1️⃣ Count distinct booking IDs, not booking-confirmation event occurrences, guests, rooms, room nights, or itinerary components.
  2️⃣ Classify a booking as returning only when the resolved guest identifier has an eligible earlier confirmed digital booking with a strictly earlier confirmation timestamp.
  3️⃣ Restrict the denominator to bookings with a durable identity and sufficient retained history; do not classify anonymous or identity-indeterminate bookings as new.
  4️⃣ Apply the returning classification as of the current booking confirmation timestamp to prevent future bookings or later identity updates from creating look-ahead bias.
  5️⃣ Include gross confirmed bookings regardless of subsequent cancellation; report net-of-cancellation performance through a separately governed KPI.
  6️⃣ Exclude test activity, employee test bookings, bot traffic, duplicate confirmations, failed payments, abandoned checkouts, and bookings without a valid confirmation state.
  7️⃣ Recompute longer-period rates from distinct booking counts rather than averaging daily percentages.

Business Use Case: |
  The Chief Marketing Officer and Digital Commerce leadership compare this rate by acquisition channel, loyalty status, destination, device, and booking lead time to identify where prior guests fail to convert again. If the rate declines for authenticated mobile guests, teams can investigate recognition, personalization, sign-in, offer eligibility, and checkout defects, then prioritize retention campaigns or product remediation while validating impact against returning-guest revenue and cancellation outcomes.



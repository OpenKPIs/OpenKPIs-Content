KPI Name: Returning Guest Booking Rate
Formula: (Distinct Confirmed Digital Booking IDs from Returning Guests / Distinct Confirmed Digital Booking IDs from Identity-Eligible Guests) × 100

Description: |
  Measures the percentage of identity-eligible digital bookings confirmed by guests who had at least one earlier confirmed booking within the defined digital history window. It quantifies repeat booking conversion within owned digital channels and indicates how effectively the business converts previously acquired guests into subsequent bookings.

Category: Conversion

Tags: [kpi]

Industry: [Travel & Hospitality]

Priority: High

Core Area: Monetization

Scope: Event

Measure Type: rate

Aggregation Window: Time based - Daily


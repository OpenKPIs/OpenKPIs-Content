KPI Name: Walmart+ Membership Trial Starts and Conversions
Formula: Trial Starts = COUNT(sign_up events where membership_program = 'walmart_plus' and membership_action = 'trial_start'); Paid Conversions = COUNT(purchase or subscribe events where membership_program = 'walmart_plus' and membership_action = 'paid_conversion'); Trial-to-Paid Conversion Rate = (Paid Conversions from prior trial users / Trial Starts) × 100

Description: |
  Walmart+ Membership Trial Starts and Conversions measures how many users begin a Walmart+ trial and how many convert to a paid Walmart+ membership. It helps evaluate membership acquisition, onboarding quality, offer effectiveness, and the ability to turn trial intent into recurring customer value.

Category: Conversion

Tags: [walmart-plus, membership, subscription, trial, trial-start, paid-conversion, loyalty, retention]


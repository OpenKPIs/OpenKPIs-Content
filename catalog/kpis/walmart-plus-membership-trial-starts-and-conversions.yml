SQL Query: |
  WITH events AS (
    SELECT
      event_date,
      user_pseudo_id,
      event_name,
      (SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'membership_program') AS membership_program,
      (SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'membership_action') AS membership_action,
      (SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'membership_plan_id') AS membership_plan_id,
      (SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'acquisition_surface') AS acquisition_surface,
      ecommerce.transaction_id AS transaction_id
    FROM `project.dataset.events_*`
    WHERE event_name IN ('sign_up','purchase','subscribe')
  )
  SELECT
    event_date,
    COUNTIF(event_name = 'sign_up' AND membership_program = 'walmart_plus' AND membership_action = 'trial_start') AS trial_starts,
    COUNTIF(event_name IN ('purchase','subscribe') AND membership_program = 'walmart_plus' AND membership_action = 'paid_conversion') AS paid_conversions,
    COUNT(DISTINCT CASE WHEN event_name = 'sign_up' AND membership_program = 'walmart_plus' AND membership_action = 'trial_start' THEN user_pseudo_id END) AS trial_start_users,
    COUNT(DISTINCT CASE WHEN event_name IN ('purchase','subscribe') AND membership_program = 'walmart_plus' AND membership_action = 'paid_conversion' THEN user_pseudo_id END) AS paid_conversion_users,
    SAFE_DIVIDE(
      COUNT(DISTINCT CASE WHEN event_name IN ('purchase','subscribe') AND membership_program = 'walmart_plus' AND membership_action = 'paid_conversion' THEN user_pseudo_id END),
      COUNT(DISTINCT CASE WHEN event_name = 'sign_up' AND membership_program = 'walmart_plus' AND membership_action = 'trial_start' THEN user_pseudo_id END)
    ) * 100 AS same_day_user_trial_to_paid_conversion_rate
  FROM events
  WHERE membership_program = 'walmart_plus'
  GROUP BY event_date
  ORDER BY event_date;

Calculation Notes: |
  Use sign_up for trial start and purchase or subscribe for paid membership conversion, with membership_program = 'walmart_plus' and a specific membership_action parameter to distinguish trial_start from paid_conversion. For true trial-to-paid conversion, cohort users by their trial start date and count paid conversions within the allowed trial window, such as 30 days; the daily SQL above provides same-day counts and should be extended for cohort reporting. Deduplicate by event_id and transaction_id where applicable. Exclude renewals, plan upgrades, failed payments, cancellations before activation, employee/test accounts, and users who were already paid members before the trial event.

Business Use Case: |
  The membership growth team compares trial starts and paid conversions by acquisition surface, offer code, traffic source, device, and plan type to decide where to promote Walmart+ benefits, which trial offers to continue, and where onboarding or billing reminders need improvement.


# Last modified by: devyendarm

KPI Name: Learner Activation Rate
Formula: (Distinct Eligible New Learners Completing a Qualifying Activation Event Within 7 Days / Distinct Eligible New Learners Whose 7-Day Activation Window Has Elapsed) × 100

Description: |
  Measures the percentage of eligible new learners who complete a defined meaningful learning action within seven days of receiving access to learning content. It evaluates how effectively acquisition and onboarding experiences convert newly registered or provisioned learners into actively engaged learners across web, mobile, LMS, and virtual-classroom channels.

Category: Conversion

Tags: [kpi]

Industry: [EdTech & E-Learning]

Priority: High

Core Area: Onboarding

Scope: User

Measure Type: percentage

Aggregation Window: Time based - Daily/Weekly/Monthly









Calculation Notes: |
  1️⃣ Count each canonical learner once using the first lifetime eligibility timestamp.  
  2️⃣ Limit to one activation per learner.  
  3️⃣ Finalized reporting includes only cohorts with a full 168-hour window elapsed.  
  4️⃣ Newer cohorts may appear as provisional but must be labeled separately.  
  5️⃣ Start the eligibility window when access becomes effective if granted post-creation.  
  6️⃣ Do not reset eligibility timestamp unless original entitlement was invalidated.  
  7️⃣ Normalize events to canonical taxonomy and require successful event status.

Business Use Case: |
  A Chief Product Officer compares activation by acquisition channel, device, program, and account type and finds that enterprise-provisioned mobile learners activate materially below target. Product then simplifies first-login authentication, deep-links invitation messages to the assigned lesson, and triggers reminders for learners who remain inactive after 24 and 72 hours; subsequent finalized cohorts are used to determine whether the intervention improved activation without reducing course completion or paid conversion.


Source Data: Learning Management System or Learning Experience Platform activity records stitched with web and mobile digital analytics, identity and authentication services, CRM or student information system account records, enrollment and entitlement services, virtual-classroom attendance data, and subscription or billing status when paid-access segmentation is required

Report Attributes: |
  ["Eligibility Cohort Date","Acquisition Channel","Campaign","Registration Method","Account Type","Learner Type","Paid or Free Access","Trial Status","Subscription Plan","Organization or Institution","Program","Course","Subject Area","Learning Format","Device Type","Platform","App Version","Geography","Language","Age Band","Accessibility Setting","First Entitlement Type","Activation Event Type","Hours to Activation"]

Dashboard Usage: [Executive Learner Journey Dashboard, Acquisition-to-Activation Funnel, Learner Onboarding Performance, Product Growth Scorecard, Enterprise Customer Adoption Dashboard, Course and Program Engagement Dashboard, Trial and Subscription Conversion Dashboard]

Segment Eligibility: |
  true


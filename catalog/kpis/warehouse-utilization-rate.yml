KPI Name: Warehouse Utilization Rate
Formula: (Occupied Warehouse Space / Total Warehouse Space) × 100

Description: |
  Measures the percentage of warehouse space currently being used compared to the total available space, indicating the efficiency of warehouse capacity utilization.

Category: Efficiency

Tags: [kpi]

Industry: [Logistics & Supply Chain]

Priority: High

Core Area: Generic

Scope: Global

Measure Type: percentage

Aggregation Window: Time based - Daily







Google Analytics SQL: |
  -- ==========================================
  -- 1. GOOGLE BIGQUERY SQL
  -- ==========================================
  SELECT
    warehouse_id,
    SUM(used_space) / SUM(total_space) AS utilization_rate
  FROM
    `your-project.erp.warehouse_logs`
  WHERE
    event_date BETWEEN DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY) AND CURRENT_DATE()
  GROUP BY
    warehouse_id
  ORDER BY
    utilization_rate DESC;

AEP Query Service SQL: |
  -- ==========================================
  -- 2. ADOBE AEP QUERY SERVICE SQL
  -- ==========================================
  SELECT
    warehouse_id,
    SUM(used_space) / SUM(total_space) AS utilization_rate
  FROM
    aep_backend_dataset.warehouse_logs
  WHERE
    event_date BETWEEN DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY) AND CURRENT_DATE()
  GROUP BY
    warehouse_id
  ORDER BY
    utilization_rate DESC;

Calculation Notes: |
  Exclude areas under maintenance or temporarily unavailable. Ensure accurate space measurement and update regularly.

Business Use Case: |
  Executives use this KPI to optimize warehouse operations and make decisions about expanding or consolidating warehouse space.



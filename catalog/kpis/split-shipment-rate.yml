# KPI: Split Shipment Rate
# Generated: 2026-09-20T01:41:52.767Z
# Contributed by: devyendarm
# Last modified by: devyendarm

KPI Name: Split Shipment Rate
Formula: (Orders with COUNT(DISTINCT shipment_id) >= 2 / Orders with COUNT(DISTINCT shipment_id) >= 1, where the order's first ship-confirm date falls in the period) × 100

Description: |
  Split Shipment Rate is the share of shipped orders that reached the customer in two or more separate shipments, measured from order management shipment records and joined to the GA4 purchase transaction_id so it can be cut by the channel, device and campaign that produced the order. It shows how fragmented fulfillment is across nodes, backorders and drop-ship vendors, which drives parcel cost per order, delivery-promise accuracy and 'where is my order' contact volume.

Category: Operations


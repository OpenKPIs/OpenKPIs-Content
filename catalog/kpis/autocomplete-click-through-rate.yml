KPI Name: Autocomplete Click-Through Rate
Formula: (Search Interactions with a Suggestion Click / Search Interactions with Suggestions Displayed) × 100

Description: |
  Share of search interactions that show autocomplete suggestions and end with a click on one. Low values point to weak suggestion relevance, ranking or coverage.


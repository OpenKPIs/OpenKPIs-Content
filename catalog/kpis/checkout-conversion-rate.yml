Google Analytics SQL: |
  -- ==========================================
  -- 1. GOOGLE BIGQUERY SQL (GA4 Export)
  -- ==========================================
  SELECT COUNTIF(event_name = 'purchase') / COUNTIF(event_name = 'begin_checkout') AS checkout_conversion_rate
  FROM `your-project.analytics_123456789.events_*`,
  UNNEST(event_params) AS params
  WHERE _TABLE_SUFFIX BETWEEN 'start_date' AND 'end_date';

AEP Query Service SQL: |
  -- ==========================================
  -- 2. ADOBE AEP QUERY SERVICE SQL (XDM Dataset)
  -- ==========================================
  SELECT SUM(CASE WHEN eventType = 'commerce.purchases' THEN 1 ELSE 0 END) / SUM(CASE WHEN eventType = 'commerce.checkout.start' THEN 1 ELSE 0 END) AS checkout_conversion_rate
  FROM your_aep_dataset
  WHERE timestamp BETWEEN 'start_date' AND 'end_date';

Calculation Notes: |
  Exclude retries, test, canceled, fraudulent, duplicate, and fully refunded orders. Use a consistent session key and apply a 30-minute inactivity timeout. Attribute completion to the same checkout instance or within 24 hours of initiation.

Business Use Case: |
  An e-commerce VP and analytics team monitor this KPI to identify and address issues in the checkout process, such as form friction or payment failures, to improve conversion rates.



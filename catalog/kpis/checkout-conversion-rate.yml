KPI Name: Checkout Conversion Rate
Formula: (Completed Checkouts / Initiated Checkouts) × 100

Description: |
  Measures the percentage of initiated checkouts that result in a completed order, indicating the effectiveness of the checkout process in converting potential buyers.

Category: Conversion

Tags: [kpi]

Industry: [E-commerce]

Priority: High

Core Area: Checkout

Scope: User

Measure Type: percentage

Aggregation Window: Time based - Daily


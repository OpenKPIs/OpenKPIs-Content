KPI Name: Add to Cart Rate
Formula: (count(add_to_cart) / count(product_view)) × 100

Description: |
  Measures the percentage of product views that lead to an 'Add to Cart' action, reflecting the effectiveness of product presentation in generating purchase intent.

Category: Conversion


Industry: [E-commerce]

Priority: High

Core Area: Generic

Scope: Session

Measure Type: rate

Aggregation Window: Time based - Daily

GA4 Event: |
  add_to_cart

Adobe Event: |
  scAdd


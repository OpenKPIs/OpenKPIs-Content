Google Analytics SQL: |
  -- ==========================================
  -- 1. GOOGLE BIGQUERY SQL
  -- ==========================================
  SELECT
    COUNTIF(event_name = 'add_to_cart') / COUNTIF(event_name = 'view_item') AS add_to_cart_rate
  FROM
    `your-project.analytics_123456789.events_*`
  WHERE
    _TABLE_SUFFIX BETWEEN '20250101' AND '20251231'
    AND event_name IN ('add_to_cart', 'view_item')

AEP Query Service SQL: |
  -- ==========================================
  -- 2. ADOBE AEP QUERY SERVICE SQL
  -- ==========================================
  SELECT
    SUM(CASE WHEN event = 'add-to-cart' THEN 1 ELSE 0 END) / SUM(CASE WHEN event = 'view-item' THEN 1 ELSE 0 END) AS add_to_cart_rate
  FROM
    aep_backend_dataset
  WHERE
    event IN ('add-to-cart', 'view-item')
    AND timestamp BETWEEN '2025-01-01T00:00:00Z' AND '2025-12-31T23:59:59Z'

Calculation Notes: |
  Ensure both events share the same product identifier and occur within the same session. Quantity is not considered in this KPI.

Business Use Case: |
  Evaluate product page effectiveness and optimize merchandising strategies to increase purchase intent.



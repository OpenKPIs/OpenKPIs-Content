# KPI: Cart abandonment rate
# Generated: 2026-09-18T16:56:25.380Z
# Contributed by: swapnamagantius
# Last modified by: devyendarm

KPI Name: Cart abandonment rate
Formula: ((Carts Created - Carts Converted to Purchase) / Carts Created) × 100

Description: |
  Cart abandonment rate measures the percentage of shopping carts that are created (at least one item added via add_to_cart) but do not result in a completed purchase within the same session. It is a critical e-commerce conversion KPI because it highlights friction in the checkout journey, such as unexpected shipping costs, forced account creation, payment failures or intent gaps, that suppresses revenue, and it is the complement of Cart-to-Purchase Rate.


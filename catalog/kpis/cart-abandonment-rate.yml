KPI Name: Cart abandonment rate
Formula: ((Carts Created - Purchases Attributed to Those Carts) / Carts Created) × 100

Description: |
  Cart abandonment rate measures the percentage of shopping carts that are created but do not result in a completed purchase within the defined attribution window. It is a critical e-commerce conversion KPI because it highlights friction in the checkout journey, pricing concerns, or intent gaps that suppress revenue.

Category: Conversion

























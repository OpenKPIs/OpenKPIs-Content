# KPI: Promotion Click-Through Rate
# Generated: 2026-09-16T17:36:30.726Z
# Contributed by: devyendarm


KPI Name: Promotion Click-Through Rate
Formula: (Deduplicated select_promotion Events / Deduplicated view_promotion Events) × 100, where each event is deduplicated to one per session × promotion_id × creative_slot × location_id

Description: |
  Internal promotion click-through rate is the share of viewable on-site internal promotion impressions (hero banners, carousels, category tiles, PDP and cart cross-sell slots) that a shopper clicks, measured as select_promotion over view_promotion for each promotion_id, creative_slot and location_id. It covers only promotions the retailer serves on its own storefront, not paid-media, email, affiliate or marketplace ad CTR, so Merchandising can judge which placements and creatives earn attention before downstream conversion is considered.

Category: Engagement


























  -- ==========================================
  -- 1. GOOGLE BIGQUERY SQL
  -- ==========================================
  WITH inventory_ranked AS (
    SELECT
      property_id,
      business_date AS reporting_date,
      physical_rooms,
      out_of_order_rooms,
      available_rooms,
      occupied_rooms,
      complimentary_rooms,
      house_use_rooms,
      sold_rooms,
      ROW_NUMBER() OVER (
        PARTITION BY property_id, business_date
        ORDER BY updated_at DESC, ingestion_timestamp DESC
      ) AS row_num
    FROM `your-project.pms.daily_room_inventory`
    WHERE business_date IS NOT NULL
  ),
  inventory AS (
    SELECT
      property_id,
      reporting_date,
      GREATEST(COALESCE(physical_rooms, 0), 0) AS physical_rooms,
      GREATEST(COALESCE(out_of_order_rooms, 0), 0) AS out_of_order_rooms,
      GREATEST(
        COALESCE(
          available_rooms,
          COALESCE(physical_rooms, 0) - COALESCE(out_of_order_rooms, 0)
        ),
        0
      ) AS available_rooms,
      GREATEST(COALESCE(occupied_rooms, 0), 0) AS occupied_rooms,
      GREATEST(COALESCE(complimentary_rooms, 0), 0) AS complimentary_rooms,
      GREATEST(COALESCE(house_use_rooms, 0), 0) AS house_use_rooms,
      GREATEST(COALESCE(sold_rooms, 0), 0) AS sold_rooms
    FROM inventory_ranked
    WHERE row_num = 1
  ),
  gl_latest AS (
    SELECT * EXCEPT (row_num)
    FROM (
      SELECT
        g.*,
        ROW_NUMBER() OVER (
          PARTITION BY journal_line_id
          ORDER BY updated_at DESC, ingestion_timestamp DESC
        ) AS row_num
      FROM `your-project.erp.gl_postings` AS g
      WHERE posting_status = 'POSTED'
        AND ledger_type = 'ACTUAL'
        AND posting_date IS NOT NULL
    )
    WHERE row_num = 1
  ),
  financial_actuals AS (
    SELECT
      g.property_id,
      g.posting_date AS reporting_date,
      SUM(IF(m.kpi_component = 'ROOMS_REVENUE', g.amount_local * m.display_sign, 0)) AS rooms_revenue_local,
      SUM(IF(m.kpi_component = 'FOOD_BEVERAGE_REVENUE', g.amount_local * m.display_sign, 0)) AS food_beverage_revenue_local,
      SUM(IF(m.kpi_component = 'OTHER_OPERATING_REVENUE', g.amount_local * m.display_sign, 0)) AS other_operating_revenue_local,
      SUM(IF(m.kpi_component IN (
        'ROOMS_REVENUE', 'FOOD_BEVERAGE_REVENUE', 'OTHER_OPERATING_REVENUE'
      ), g.amount_local * m.display_sign, 0)) AS total_operating_revenue_local,
      SUM(IF(m.kpi_component = 'DEPARTMENTAL_EXPENSE', g.amount_local * m.display_sign, 0)) AS departmental_expense_local,
      SUM(IF(m.kpi_component = 'UNDISTRIBUTED_OPERATING_EXPENSE', g.amount_local * m.display_sign, 0)) AS undistributed_operating_expense_local,
      SUM(IF(m.included_in_gop, g.amount_local * m.statement_sign, 0)) AS gross_operating_profit_local
    FROM gl_latest AS g
    INNER JOIN `your-project.finance.account_kpi_mapping` AS m
      ON g.account_id = m.account_id
     AND g.posting_date >= m.effective_from
     AND g.posting_date < COALESCE(m.effective_to, DATE '9999-12-31')
    WHERE m.included_in_gop
       OR m.kpi_component IN (
         'ROOMS_REVENUE',
         'FOOD_BEVERAGE_REVENUE',
         'OTHER_OPERATING_REVENUE',
         'DEPARTMENTAL_EXPENSE',
         'UNDISTRIBUTED_OPERATING_EXPENSE'
       )
    GROUP BY g.property_id, g.posting_date
  ),
  plan_latest AS (
    SELECT * EXCEPT (row_num)
    FROM (
      SELECT
        p.*,
        ROW_NUMBER() OVER (
          PARTITION BY plan_record_id
          ORDER BY version_number DESC, updated_at DESC, ingestion_timestamp DESC
        ) AS row_num
      FROM `your-project.planning.daily_property_plan` AS p
      WHERE scenario IN ('BUDGET', 'FORECAST')
        AND plan_date IS NOT NULL
        AND approval_status IN ('APPROVED', 'PUBLISHED')
    )
    WHERE row_num = 1
  ),
  plans AS (
    SELECT
      property_id,
      plan_date AS reporting_date,
      SUM(IF(scenario = 'BUDGET', gross_operating_profit_local, 0)) AS budget_gop_local,
      SUM(IF(scenario = 'BUDGET', available_room_nights, 0)) AS budget_available_room_nights,
      SUM(IF(scenario = 'FORECAST', gross_operating_profit_local, 0)) AS forecast_gop_local,
      SUM(IF(scenario = 'FORECAST', available_room_nights, 0)) AS forecast_available_room_nights
    FROM plan_latest
    GROUP BY property_id, plan_date
  ),
  fx_ranked AS (
    SELECT
      from_currency,
      to_currency,
      rate_date,
      exchange_rate,

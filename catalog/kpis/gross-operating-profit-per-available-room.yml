    FROM `your-project.finance.daily_fx_rates`
    WHERE rate_type = 'CORPORATE_CLOSING'
      AND to_currency = 'USD'
      AND exchange_rate > 0
  ),
  fx_effective AS (
    SELECT
      from_currency,
      to_currency,
      rate_date AS effective_from,
      LEAD(rate_date) OVER (
        PARTITION BY from_currency, to_currency
        ORDER BY rate_date
      ) AS effective_to,
      exchange_rate
    FROM fx_ranked
    WHERE row_num = 1
  ),
  property_history AS (

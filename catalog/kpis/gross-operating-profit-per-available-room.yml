     AND s.reporting_date = c.calendar_date
    LEFT JOIN inventory AS i
      ON s.property_id = i.property_id
     AND s.reporting_date = i.reporting_date
    LEFT JOIN financial_actuals AS f
      ON s.property_id = f.property_id
     AND s.reporting_date = f.reporting_date
    LEFT JOIN plans AS pl
      ON s.property_id = pl.property_id
     AND s.reporting_date = pl.reporting_date
    LEFT JOIN fx_effective AS fx
      ON p.currency_code = fx.from_currency

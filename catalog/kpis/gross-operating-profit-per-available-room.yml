Calculation Notes: |
  1️⃣ Calculate numerator from approved hotel operating statement using USALI chart-of-accounts.  
  2️⃣ Total operating revenue includes rooms, food & beverage, and other operated-department revenue.  
  3️⃣ Subtract departmental and undistributed operating expenses above the approved GOP line.  
  4️⃣ Exclude non-operating income/expenses, depreciation, amortization, interest, and owner-specific charges.  
  5️⃣ Denominator is the sum of daily saleable room inventory, excluding out-of-order or long-term closure rooms.  
  6️⃣ Include complimentary, house-use, no-show, and unsold room nights in saleable inventory.  
  7️⃣ For portfolios, divide aggregated GOP by aggregated available room nights, using finalized accruals.

Business Use Case: |
  A hotel chief operating officer compares monthly GOPPAR with budget, prior year, and peer properties to identify hotels where revenue growth is not translating into operating profit. If a property has stable RevPAR but declining GOPPAR, Finance and Operations investigate labor productivity, utilities, departmental margins, undistributed expenses, and inventory outages, then assign cost-control or revenue-mix actions and monitor the resulting variance.


Source Data: Property Management System room-inventory data; ERP or General Ledger operating statements; hotel financial consolidation system; budgeting and forecasting platform; property master data; foreign-exchange rate repository


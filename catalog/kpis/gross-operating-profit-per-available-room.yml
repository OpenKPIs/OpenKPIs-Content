      p.property_name,
      p.brand_code,
      p.brand_name,
      p.management_company,
      p.ownership_type,
      p.hotel_type,
      p.market,
      p.submarket,
      p.city,
      p.state_region,
      p.country_code,
      p.region,
      p.currency_code,
      'USD' AS reporting_currency,
      CASE
        WHEN p.currency_code = 'USD' THEN 1.0
        ELSE fx.exchange_rate
      END AS fx_rate,
      i.physical_rooms,
      i.out_of_order_rooms,
      i.available_rooms,
      i.occupied_rooms,
      i.complimentary_rooms,
      i.house_use_rooms,
      i.sold_rooms,
      f.rooms_revenue_local,
      f.food_beverage_revenue_local,
      f.other_operating_revenue_local,
      f.total_operating_revenue_local,
      f.departmental_expense_local,
      f.undistributed_operating_expense_local,

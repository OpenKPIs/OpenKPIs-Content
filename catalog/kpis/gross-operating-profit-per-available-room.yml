KPI Name: Gross Operating Profit per Available Room
Formula: (Total Operating Revenue - Departmental Operating Expenses - Undistributed Operating Expenses) / Total Available Room Nights

Description: |
  Gross Operating Profit per Available Room measures the gross operating profit generated for each room night available for sale during a reporting period, whether or not the room was occupied. It combines operating profitability and room-inventory utilization to show how effectively a hotel converts its available capacity into operating profit.

Category: Efficiency

Tags: [kpi]

Industry: [Travel & Hospitality]

Priority: High

Core Area: Monetization

Scope: Global

Measure Type: currency

Aggregation Window: Time based - Monthly








    available_rooms,
    available_rooms AS available_room_nights,
    occupied_rooms,
    complimentary_rooms,
    house_use_rooms,
    sold_rooms,
    SAFE_DIVIDE(occupied_rooms, available_rooms) AS occupancy_rate,
    rooms_revenue_local,
    food_beverage_revenue_local,
    other_operating_revenue_local,
    total_operating_revenue_local,
    departmental_expense_local,
    undistributed_operating_expense_local,
    gross_operating_profit_local,
    total_operating_revenue_local * fx_rate AS total_operating_revenue_reporting,
    gross_operating_profit_local * fx_rate AS gross_operating_profit_reporting,
    SAFE_DIVIDE(gross_operating_profit_local, available_rooms) AS goppar_local,
    SAFE_DIVIDE(gross_operating_profit_local * fx_rate, available_rooms) AS goppar_reporting,
    budget_gop_local * fx_rate AS budget_gop_reporting,
    budget_available_room_nights,
    SAFE_DIVIDE(budget_gop_local * fx_rate, budget_available_room_nights) AS budget_goppar_reporting,
    forecast_gop_local * fx_rate AS forecast_gop_reporting,
    forecast_available_room_nights,
    SAFE_DIVIDE(forecast_gop_local * fx_rate, forecast_available_room_nights) AS forecast_goppar_reporting,
    CASE
      WHEN property_code IS NULL THEN 'MISSING_PROPERTY_MASTER'
      WHEN available_rooms IS NULL THEN 'MISSING_ROOM_INVENTORY'
      WHEN available_rooms <= 0 THEN 'INVALID_AVAILABLE_ROOMS'

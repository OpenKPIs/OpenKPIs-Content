KPI Name: Support Contact Rate
Aliases: [Contact Rate, Contacts per 100 Orders, Ticket-to-Order Ratio]

Formula: Inbound support contacts ÷ Confirmed orders × 100

Description: |
  Inbound support contacts per 100 confirmed orders across channels, including pre-sale inquiries. It helps support teams assess workload and investigate changes in customer support demand.

Category: Operational Efficiency

Tags: [customer support, support demand, orders]

Industry: [E-commerce, Retail]

Business Criticality: High

Journey / Navigation Area: [Customer Service]

Owning Function: Customer Support

Scope: Event

Measurement Channels: [Web, Mobile App, Backend / API, Store / POS, Call Center / Support, External Platform / Partner]

Measure Type: Rate

Aggregation Window: [Daily, Weekly, Monthly, Selected Reporting Period]

GA4 Event: |
  inbound_support_contact_created — records an eligible new inbound ticket or conversation
  purchase — records a confirmed order

Adobe Event: |
  inbound_support_contact_created — records an eligible new inbound ticket or conversation
  commerce.purchases — records a confirmed order


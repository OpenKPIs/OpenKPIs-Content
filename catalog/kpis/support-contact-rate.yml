Google Analytics SQL: |
  WITH inputs AS (
    SELECT event_name, ecommerce.transaction_id AS transaction_id,
      (SELECT p.value.string_value FROM UNNEST(event_params) p WHERE p.key = 'contact_id') AS contact_id,
      (SELECT p.value.int_value FROM UNNEST(event_params) p WHERE p.key = 'is_test_order') AS is_test_order,
      (SELECT p.value.int_value FROM UNNEST(event_params) p WHERE p.key = 'is_fraud_order') AS is_fraud_order
    FROM `project.analytics.events_*`
    WHERE _TABLE_SUFFIX BETWEEN FORMAT_DATE('%Y%m%d', DATE_SUB(DATE(@report_start), INTERVAL 1 DAY))
      AND FORMAT_DATE('%Y%m%d', DATE_ADD(DATE(@report_end), INTERVAL 1 DAY))
      AND event_timestamp >= UNIX_MICROS(@report_start)
      AND event_timestamp < UNIX_MICROS(@report_end)
      AND event_name IN ('inbound_support_contact_created', 'purchase')
  )
  SELECT SAFE_DIVIDE(
    COUNT(DISTINCT IF(event_name = 'inbound_support_contact_created', contact_id, NULL)),
    COUNT(DISTINCT IF(event_name = 'purchase' AND is_test_order = 0 AND is_fraud_order = 0, transaction_id, NULL))
  ) * 100 AS support_contact_rate
  FROM inputs;

AEP Query Service SQL: |
  SELECT
    100.0 * COUNT(DISTINCT CASE
      WHEN eventType = 'inbound_support_contact_created' THEN _openkpis.contact_id
    END) / NULLIF(COUNT(DISTINCT CASE
      WHEN eventType = 'commerce.purchases'
        AND _openkpis.is_test_order = FALSE
        AND _openkpis.is_fraud_order = FALSE
      THEN commerce.order.purchaseID
    END), 0) AS support_contact_rate
  FROM {{AEP_EXPERIENCE_EVENT_DATASET}}
  WHERE timestamp >= CAST('{{REPORT_START}}' AS TIMESTAMP)
    AND timestamp < CAST('{{REPORT_END}}' AS TIMESTAMP)
    AND eventType IN ('inbound_support_contact_created', 'commerce.purchases');

Calculation Notes: |
  1️⃣ Date contacts by creation and orders by confirmation; use one UTC interval, start included and end excluded.
  2️⃣ Count each contact ID and order ID once; include pre-sale contacts, but exclude replies and reopened tickets.
  3️⃣ Count new inbound tickets or conversations only; exclude spam, auto-replies, outbound and internal tickets.
  4️⃣ Exclude orders identified as test or fraud at confirmation.
  5️⃣ Require complete channel coverage and stable IDs; return null with no orders. The rate can exceed 100.

Business Use Case: |
  1️⃣ Customer Support compares demand with staffing plans and adjusts agent coverage when the rate rises.
  2️⃣ Customer Support investigates contact-channel changes before revising routing and self-service options.
  3️⃣ E-commerce Operations investigates sustained increases before changing order and delivery communications.


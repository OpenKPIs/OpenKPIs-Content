KPI Name: LTV-CAC Ratio
Formula: (Cohort Contribution Margin over LTV Horizon / New Customers in Cohort) / (Acquisition Spend in Cohort Period / New Customers in Cohort)

Description: |
  Contribution-margin lifetime value of a newly acquired customer divided by what it cost to acquire them, per acquisition cohort. Below 3:1 is under the common benchmark; below 1:1 acquisition loses money.

Category: Acquisition


























Google Analytics SQL: |
  -- ==========================================
  -- 1. GOOGLE BIGQUERY SQL
  -- ==========================================
  -- Reporting window on the begin_checkout date; the last 48 hours are provisional, so the default window ends two days ago
  DECLARE start_date DATE DEFAULT DATE_SUB(CURRENT_DATE(), INTERVAL 92 DAY);
  DECLARE end_date DATE DEFAULT DATE_SUB(CURRENT_DATE(), INTERVAL 2 DAY);
  
  WITH events AS (
    -- begin_checkout and purchase events (window plus one day for sessions crossing midnight) with session key and traffic_type pivoted
    SELECT
      event_name,
      PARSE_DATE('%Y%m%d', event_date) AS event_day,
      event_timestamp,
      CONCAT(user_pseudo_id, '.', CAST((SELECT value.int_value FROM UNNEST(event_params) WHERE key = 'ga_session_id') AS STRING)) AS session_key,
      (SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'traffic_type') AS traffic_type,
      ecommerce.transaction_id AS transaction_id
    FROM `your-project.analytics_123456789.events_*`
    WHERE _TABLE_SUFFIX BETWEEN FORMAT_DATE('%Y%m%d', start_date) AND FORMAT_DATE('%Y%m%d', DATE_ADD(end_date, INTERVAL 1 DAY))
      AND event_name IN ('begin_checkout', 'purchase')
  ),
  checkout_sessions AS (
    -- One row per session with a begin_checkout in the window; internal, test and bot traffic excluded, checkout_error sessions kept
    SELECT session_key, MIN(event_timestamp) AS first_checkout_ts
    FROM events
    WHERE event_name = 'begin_checkout'
      AND event_day BETWEEN start_date AND end_date
      AND session_key IS NOT NULL
    GROUP BY session_key
    HAVING COUNTIF(LOWER(traffic_type) IN ('internal', 'test', 'bot')) = 0
  ),
  purchases AS (
    -- Purchases deduplicated on transaction_id: only the first hit of each order counts
    SELECT session_key, event_timestamp
    FROM events
    WHERE event_name = 'purchase'
      AND transaction_id IS NOT NULL
      AND transaction_id NOT IN ('', '(not set)')
    QUALIFY ROW_NUMBER() OVER (PARTITION BY transaction_id ORDER BY event_timestamp) = 1
  ),
  session_outcomes AS (
    -- A checkout session is completed when the same session has a purchase at or after its first begin_checkout
    SELECT c.session_key, COUNTIF(p.event_timestamp >= c.first_checkout_ts) > 0 AS completed
    FROM checkout_sessions c
    LEFT JOIN purchases p ON p.session_key = c.session_key
    GROUP BY c.session_key
  )
  -- Checkout Abandonment Rate: checkout sessions without a purchase over all checkout sessions
  SELECT
    COUNT(*) AS checkout_sessions,
    COUNTIF(NOT completed) AS abandoned_checkout_sessions,
    ROUND(100 * SAFE_DIVIDE(COUNTIF(NOT completed), COUNT(*)), 2) AS checkout_abandonment_rate_pct
  FROM session_outcomes;

AEP Query Service SQL: |
  -- ==========================================
  -- 2. ADOBE AEP QUERY SERVICE SQL
  -- ==========================================
  WITH params AS (
    -- Reporting window on the begin_checkout date; the last 48 hours are provisional, so the default window ends two days ago
    SELECT DATE_SUB(CURRENT_DATE, 92) AS start_date, DATE_SUB(CURRENT_DATE, 2) AS end_date
  ),
  events AS (
    -- Web events (window plus one day for sessions crossing midnight) sessionized per ECID with a 30-minute timeout
    SELECT
      e.eventType,
      TO_DATE(e.timestamp) AS event_day,
      e.timestamp,
      e.commerce.order.purchaseID AS purchase_id,
      e._experience.analytics.customDimensions.eVars.eVar3 AS traffic_type,
      CONCAT(e.identityMap['ECID'][0].id, '.', CAST(SESS_TIMEOUT(e.timestamp, 60 * 30) OVER (PARTITION BY e.identityMap['ECID'][0].id ORDER BY e.timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW).num AS STRING)) AS session_key
    FROM aep_web_events_dataset e
    CROSS JOIN params p
    WHERE TO_DATE(e.timestamp) BETWEEN p.start_date AND DATE_ADD(p.end_date, 1)
  ),
  checkout_sessions AS (
    -- One row per session with a begin_checkout in the window; internal, test and bot traffic excluded, checkout_error sessions kept
    SELECT ev.session_key, MIN(ev.timestamp) AS first_checkout_ts
    FROM events ev
    CROSS JOIN params p
    WHERE ev.eventType = 'commerce.checkouts'
      AND ev.event_day BETWEEN p.start_date AND p.end_date
      AND ev.session_key IS NOT NULL
    GROUP BY ev.session_key
    HAVING SUM(CASE WHEN LOWER(ev.traffic_type) IN ('internal', 'test', 'bot') THEN 1 ELSE 0 END) = 0
  ),
  purchases AS (
    -- Purchases deduplicated on purchaseID: only the first hit of each order counts
    SELECT session_key, timestamp
    FROM (
      SELECT session_key, timestamp, ROW_NUMBER() OVER (PARTITION BY purchase_id ORDER BY timestamp) AS rn
      FROM events
      WHERE eventType = 'commerce.purchases'
        AND purchase_id IS NOT NULL
        AND purchase_id <> ''
    ) d
    WHERE rn = 1
  ),
  session_outcomes AS (
    -- A checkout session is completed when the same session has a purchase at or after its first begin_checkout
    SELECT c.session_key, MAX(CASE WHEN pu.timestamp >= c.first_checkout_ts THEN 1 ELSE 0 END) AS completed
    FROM checkout_sessions c
    LEFT JOIN purchases pu ON pu.session_key = c.session_key
    GROUP BY c.session_key
  )
  -- Checkout Abandonment Rate: checkout sessions without a purchase over all checkout sessions
  SELECT
    COUNT(*) AS checkout_sessions,
    SUM(1 - completed) AS abandoned_checkout_sessions,
    ROUND(100.0 * SUM(1 - completed) / NULLIF(COUNT(*), 0), 2) AS checkout_abandonment_rate_pct
  FROM session_outcomes;

Calculation Notes: |
  1️⃣ Unit is the session: one or more begin_checkout events in a session count as one initiated checkout.,2️⃣ Completed = the same session has a purchase after begin_checkout with a transaction_id; dedupe purchases on transaction_id.,3️⃣ Equals 100 − Checkout Completion Rate for the same period and filters; report both from one query so they never drift apart.,4️⃣ Express or one-click orders that skip begin_checkout are out of both numerator and denominator; track them in Express Checkout Adoption Rate.,5️⃣ 30-minute session timeout: a purchase in a later session still counts as abandoned here and as recovered in Abandoned Cart Recovery Rate.,6️⃣ Exclude internal, test and bot traffic (traffic_type); keep sessions with checkout_error, since errors are a cause of abandonment.,7️⃣ Report on the begin_checkout date; treat the last 48 hours as provisional until late purchase hits finish processing.

Business Use Case: |
  1️⃣ Product (Checkout): rate up 3+ pts WoW → break down by checkout_step and error type to find the failing step.,2️⃣ CRM team: rate high for signed-in shoppers → send the abandoned-checkout email within one hour of exit.,3️⃣ Payments team: abandonment spikes by payment method → check provider errors and 3-D Secure declines with the PSP.,4️⃣ E-commerce Director: after a checkout redesign → compare the rate by device category against the pre-release baseline.


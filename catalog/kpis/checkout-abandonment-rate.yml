KPI Name: Checkout Abandonment Rate
Formula: ((Sessions with begin_checkout − Sessions with begin_checkout and purchase) / Sessions with begin_checkout) × 100

Description: |
  Share of sessions that start checkout (begin_checkout) but end without a purchase; the complement of Checkout Completion Rate. Unlike Cart Abandonment Rate, it counts only shoppers who entered checkout.

Category: Conversion

Tags: [kpi, E-commerce: Cart & Checkout Funnel Analytics]

Industry: [["E-commerce"]]

Priority: High

Core Area: Checkout

Scope: Session

Measure Type: Percentage

Aggregation Window: Daily, Weekly, Monthly


  WITH event_parameter_values AS (
    SELECT
      PARSE_DATE('%Y%m%d', e.event_date) AS ingestion_event_date,
      TIMESTAMP_MICROS(e.event_timestamp) AS event_timestamp_utc,
      e.event_name,
      e.user_pseudo_id,
      e.event_bundle_sequence_id,
      ep.key,
      COALESCE(
        ep.value.string_value,
        CAST(ep.value.int_value AS STRING),
        CAST(ep.value.double_value AS STRING),
        CAST(ep.value.float_value AS STRING)
      ) AS parameter_value
    FROM `your-project.analytics_123456789.events_*` AS e
    CROSS JOIN UNNEST(e.event_params) AS ep
    WHERE e.event_name = 'purchase'
      AND _TABLE_SUFFIX BETWEEN FORMAT_DATE('%Y%m%d', DATE_SUB(@start_date, INTERVAL 3 DAY))
                            AND FORMAT_DATE('%Y%m%d', DATE_ADD(@end_date, INTERVAL 3 DAY))
  ),
  pivoted_events AS (
    SELECT
      ingestion_event_date,
      event_timestamp_utc,
      event_name,
      user_pseudo_id,
      event_bundle_sequence_id,
      MAX(IF(key = 'event_action', parameter_value, NULL)) AS event_action,
      MAX(IF(key = 'event_id', parameter_value, NULL)) AS event_id,
      MAX(IF(key = 'transaction_id', parameter_value, NULL)) AS transaction_id,
      MAX(IF(key = 'booking_date', parameter_value, NULL)) AS booking_date_raw,

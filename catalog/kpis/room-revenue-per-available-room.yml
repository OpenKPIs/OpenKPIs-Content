KPI Name: Room Revenue per Available Room
Formula: Net Recognized Direct Digital Room Revenue / Available Room-Nights

Description: |
  Measures the direct digital room revenue recognized for stay dates divided by the digitally recorded room inventory available for sale during the same period. It quantifies how effectively a property converts available room capacity into digital room revenue by combining occupancy and achieved room rate performance.

Category: Revenue

Tags: [kpi]

Industry: [Travel & Hospitality]

Priority: High

Core Area: Monetization

Scope: Global

Measure Type: currency

Aggregation Window: Time based - Daily/Monthly/Yearly


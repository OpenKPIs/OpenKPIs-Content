      MAX(IF(key = 'property_id', parameter_value, NULL)) AS property_id,
      MAX(IF(key = 'property_name', parameter_value, NULL)) AS property_name,
      MAX(IF(key = 'brand_id', parameter_value, NULL)) AS brand_id,
      MAX(IF(key = 'brand_name', parameter_value, NULL)) AS brand_name,
      MAX(IF(key = 'market', parameter_value, NULL)) AS market,
      MAX(IF(key = 'country', parameter_value, NULL)) AS country,
      MAX(IF(key = 'region', parameter_value, NULL)) AS region,
      MAX(IF(key = 'city', parameter_value, NULL)) AS city,
      MAX(IF(key = 'currency', parameter_value, NULL)) AS currency,
      MAX(IF(key = 'gross_room_revenue', parameter_value, NULL)) AS gross_room_revenue_raw,
      MAX(IF(key = 'discount_amount', parameter_value, NULL)) AS discount_amount_raw,
      MAX(IF(key IN ('tax', 'tax_amount'), parameter_value, NULL)) AS tax_amount_raw,
      MAX(IF(key = 'fee_amount', parameter_value, NULL)) AS fee_amount_raw,

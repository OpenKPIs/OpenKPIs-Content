      event_timestamp_utc,
      event_name,
      user_pseudo_id,
      event_bundle_sequence_id
  ),
  normalized_events AS (
    SELECT
      ingestion_event_date,
      event_timestamp_utc,
      event_name,
      event_action,
      event_id,
      transaction_id,
      SAFE_CAST(booking_date_raw AS DATE) AS booking_date,
      SAFE_CAST(stay_date_raw AS DATE) AS stay_date,
      SAFE_CAST(check_in_date_raw AS DATE) AS check_in_date,
      SAFE_CAST(check_out_date_raw AS DATE) AS check_out_date,
      inventory_snapshot_id,
      property_id,
      property_name,
      brand_id,
      brand_name,
      market,
      country,
      region,
      city,
      currency,
      SAFE_CAST(gross_room_revenue_raw AS NUMERIC) AS gross_room_revenue,
      SAFE_CAST(discount_amount_raw AS NUMERIC) AS discount_amount,
      SAFE_CAST(tax_amount_raw AS NUMERIC) AS tax_amount,
      SAFE_CAST(fee_amount_raw AS NUMERIC) AS fee_amount,
      SAFE_CAST(refund_amount_raw AS NUMERIC) AS refund_amount,
      SAFE_CAST(net_room_revenue_raw AS NUMERIC) AS net_room_revenue,
      SAFE_CAST(recognized_room_revenue_raw AS NUMERIC) AS recognized_room_revenue,
      SAFE_CAST(available_rooms_raw AS NUMERIC) AS available_rooms,
      SAFE_CAST(out_of_order_rooms_raw AS NUMERIC) AS out_of_order_rooms,
      SAFE_CAST(total_rooms_raw AS NUMERIC) AS total_rooms,
      SAFE_CAST(rooms_sold_raw AS NUMERIC) AS rooms_sold,
      SAFE_CAST(room_nights_raw AS NUMERIC) AS room_nights,
      SAFE_CAST(length_of_stay_raw AS NUMERIC) AS length_of_stay,
      SAFE_CAST(rooms_booked_raw AS NUMERIC) AS rooms_booked,
      SAFE_CAST(source_occupancy_rate_raw AS NUMERIC) AS source_occupancy_rate,
      SAFE_CAST(source_average_daily_rate_raw AS NUMERIC) AS source_average_daily_rate,
      SAFE_CAST(source_revpar_raw AS NUMERIC) AS source_room_revenue_per_available_room,
      rate_plan_id,
      rate_plan_name,
      room_type_id,
      room_type_name,
      booking_channel,
      platform,
      payment_status,
      reservation_status,
      refund_status,
      customer_id,
      loyalty_id,
      campaign_id,
      CASE
        WHEN LOWER(analytics_consent_raw) IN ('true', '1', 'yes', 'y', 'granted') THEN TRUE
        WHEN LOWER(analytics_consent_raw) IN ('false', '0', 'no', 'n', 'denied') THEN FALSE
        ELSE NULL
      END AS analytics_consent,
      data_source,
      inventory_timezone,
      user_pseudo_id,
      event_bundle_sequence_id,
      COALESCE(
        NULLIF(inventory_snapshot_id, ''),
        NULLIF(event_id, ''),
        NULLIF(transaction_id, ''),
        CONCAT(
          COALESCE(property_id, 'UNKNOWN'), '|',
          COALESCE(stay_date_raw, 'UNKNOWN'), '|',
          CAST(event_timestamp_utc AS STRING), '|',
          COALESCE(user_pseudo_id, 'UNKNOWN'), '|',
          CAST(event_bundle_sequence_id AS STRING)
        )
      ) AS deduplication_key
    FROM pivoted_events
    WHERE SAFE_CAST(stay_date_raw AS DATE) BETWEEN @start_date AND @end_date
  ),
  ranked_snapshots AS (
    SELECT
      normalized_events.*,
      ROW_NUMBER() OVER (
        PARTITION BY property_id, deduplication_key
        ORDER BY event_timestamp_utc DESC, ingestion_event_date DESC
      ) AS snapshot_version_rank
    FROM normalized_events
  )
  SELECT
    * EXCEPT (
      user_pseudo_id,
      event_bundle_sequence_id,
      deduplication_key,
      snapshot_version_rank
    ),
    SAFE_DIVIDE(rooms_sold, available_rooms) AS calculated_occupancy_rate,
    SAFE_DIVIDE(recognized_room_revenue, rooms_sold) AS calculated_average_daily_rate,
    SAFE_DIVIDE(recognized_room_revenue, available_rooms) AS room_revenue_per_available_room
  FROM ranked_snapshots
  WHERE snapshot_version_rank = 1
    AND recognized_room_revenue IS NOT NULL
    AND available_rooms IS NOT NULL
  ORDER BY stay_date, property_id, rate_plan_id, room_type_id;


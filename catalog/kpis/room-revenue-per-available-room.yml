  -- ==========================================
  -- 2. ADOBE AEP QUERY SERVICE SQL
  -- ==========================================
  WITH normalized_events AS (
    SELECT
      CAST(timestamp AS TIMESTAMP) AS event_timestamp_utc,
      eventType AS event_name,
      CAST(NULL AS STRING) AS event_action,
      _id AS event_id,
      commerce.order.purchaseID AS transaction_id,
      CAST(_hotel.bookingDate AS DATE) AS booking_date,
      CAST(_hotel.stayDate AS DATE) AS stay_date,
      CAST(_hotel.checkInDate AS DATE) AS check_in_date,
      CAST(_hotel.checkOutDate AS DATE) AS check_out_date,
      _hotel.inventorySnapshotId AS inventory_snapshot_id,
      _hotel.propertyId AS property_id,
      _hotel.propertyName AS property_name,
      _hotel.brandId AS brand_id,
      _hotel.brandName AS brand_name,
      _hotel.market AS market,
      _hotel.country AS country,
      _hotel.region AS region,
      _hotel.city AS city,
      COALESCE(_hotel.currency, commerce.order.currencyCode) AS currency,
      CAST(_hotel.grossRoomRevenue AS DECIMAL(38,6)) AS gross_room_revenue,
      CAST(_hotel.discountAmount AS DECIMAL(38,6)) AS discount_amount,
      CAST(_hotel.taxAmount AS DECIMAL(38,6)) AS tax_amount,
      CAST(_hotel.feeAmount AS DECIMAL(38,6)) AS fee_amount,
      CAST(_hotel.refundAmount AS DECIMAL(38,6)) AS refund_amount,
      CAST(_hotel.netRoomRevenue AS DECIMAL(38,6)) AS net_room_revenue,
      CAST(_hotel.recognizedRoomRevenue AS DECIMAL(38,6)) AS recognized_room_revenue,
      CAST(_hotel.availableRooms AS DECIMAL(38,6)) AS available_rooms,
      CAST(_hotel.outOfOrderRooms AS DECIMAL(38,6)) AS out_of_order_rooms,
      CAST(_hotel.totalRooms AS DECIMAL(38,6)) AS total_rooms,
      CAST(_hotel.roomsSold AS DECIMAL(38,6)) AS rooms_sold,
      CAST(_hotel.roomNights AS DECIMAL(38,6)) AS room_nights,
      CAST(_hotel.lengthOfStay AS DECIMAL(38,6)) AS length_of_stay,
      CAST(_hotel.roomsBooked AS DECIMAL(38,6)) AS rooms_booked,
      CAST(_hotel.occupancyRate AS DECIMAL(38,6)) AS source_occupancy_rate,
      CAST(_hotel.averageDailyRate AS DECIMAL(38,6)) AS source_average_daily_rate,
      CAST(_hotel.roomRevenuePerAvailableRoom AS DECIMAL(38,6)) AS source_room_revenue_per_available_room,
      _hotel.ratePlanId AS rate_plan_id,
      _hotel.ratePlanName AS rate_plan_name,
      _hotel.roomTypeId AS room_type_id,
      _hotel.roomTypeName AS room_type_name,
      _hotel.bookingChannel AS booking_channel,
      _hotel.platform AS platform,
      _hotel.paymentStatus AS payment_status,
      _hotel.reservationStatus AS reservation_status,
      _hotel.refundStatus AS refund_status,
      _hotel.customerId AS customer_id,
      _hotel.loyaltyId AS loyalty_id,
      _hotel.campaignId AS campaign_id,
      CAST(_hotel.analyticsConsent AS BOOLEAN) AS analytics_consent,
      _hotel.dataSource AS data_source,
      _hotel.inventoryTimezone AS inventory_timezone,
      COALESCE(
        NULLIF(_hotel.inventorySnapshotId, ''),
        NULLIF(_id, ''),
        NULLIF(commerce.order.purchaseID, ''),
        CONCAT(
          COALESCE(_hotel.propertyId, 'UNKNOWN'), '|',
          COALESCE(_hotel.stayDate, 'UNKNOWN'), '|',
          CAST(timestamp AS STRING)
        )
      ) AS deduplication_key
    FROM hotel_commerce_events
    WHERE eventType = 'commerce.purchases'
      AND CAST(_hotel.stayDate AS DATE) BETWEEN CAST('${START_DATE}' AS DATE)
                                           AND CAST('${END_DATE}' AS DATE)
  ),
  ranked_snapshots AS (
    SELECT
      normalized_events.*,
      ROW_NUMBER() OVER (
        PARTITION BY property_id, deduplication_key
        ORDER BY event_timestamp_utc DESC
      ) AS snapshot_version_rank
    FROM normalized_events
  ),
  latest_snapshots AS (
    SELECT *
    FROM ranked_snapshots
    WHERE snapshot_version_rank = 1
  )
  SELECT
    event_timestamp_utc,
    event_name,
    event_action,
    event_id,
    transaction_id,
    booking_date,
    stay_date,
    check_in_date,
    check_out_date,
    inventory_snapshot_id,
    property_id,
    property_name,
    brand_id,
    brand_name,
    market,
    country,
    region,
    city,
    currency,
    gross_room_revenue,
    discount_amount,
    tax_amount,
    fee_amount,
    refund_amount,
    net_room_revenue,
    recognized_room_revenue,
    available_rooms,
    out_of_order_rooms,
    total_rooms,
    rooms_sold,
    room_nights,
    length_of_stay,
    rooms_booked,
    source_occupancy_rate,
    source_average_daily_rate,
    source_room_revenue_per_available_room,
    rate_plan_id,
    rate_plan_name,
    room_type_id,
    room_type_name,
    booking_channel,
    platform,
    payment_status,
    reservation_status,
    refund_status,
    customer_id,
    loyalty_id,
    campaign_id,
    analytics_consent,
    data_source,
    inventory_timezone,
    CASE
      WHEN available_rooms IS NULL OR available_rooms = 0 THEN NULL
      ELSE rooms_sold / available_rooms
    END AS calculated_occupancy_rate,
    CASE
      WHEN rooms_sold IS NULL OR rooms_sold = 0 THEN NULL
      ELSE recognized_room_revenue / rooms_sold
    END AS calculated_average_daily_rate,
    CASE
      WHEN available_rooms IS NULL OR available_rooms = 0 THEN NULL
      ELSE recognized_room_revenue / available_rooms
    END AS room_revenue_per_available_room
  FROM latest_snapshots
  WHERE recognized_room_revenue IS NOT NULL
    AND available_rooms IS NOT NULL
  ORDER BY stay_date, property_id, rate_plan_id, room_type_id;

Calculation Notes: |
  1️⃣ Recognize room revenue on the guest stay date, not the reservation creation, payment, or booking confirmation date.
  2️⃣ Include only the room component of completed direct web or mobile-app reservations; exclude taxes, fees, food and beverage, parking, spa, and other ancillary revenue.
  3️⃣ Deduct cancellations, refunds, chargebacks, discounts, and package adjustments from the affected stay dates using the approved revenue-allocation policy.
  4️⃣ Calculate available room-nights as sellable rooms multiplied by eligible operating nights; exclude inventory formally marked out of order or unavailable before the inventory cutoff.
  5️⃣ Return null when available room-nights equal zero; do not substitute zero or carry forward a prior-period value.
  6️⃣ Convert revenue to the reporting currency using the approved stay-date exchange rate before aggregation across properties or currencies.
  7️⃣ Label the result as Direct Digital RevPAR when the numerator contains only digital revenue while the denominator represents total digitally recorded sellable property inventory.

Business Use Case: |
  A Revenue Management executive compares Direct Digital RevPAR by property, stay date, device, market, and booking lead-time band. If occupancy remains stable but the KPI declines, the team can tighten digital discounting, adjust rate-plan visibility, modify direct-channel inventory, or investigate a shift toward lower-value room types before the next pricing cycle.



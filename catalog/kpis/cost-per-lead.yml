KPI Name: Cost per Lead
Formula: Total Marketing Spend / Net-New Leads Generated

Description: |
  Marketing spend divided by net-new leads captured in the same period, where a lead is a generate_lead event such as an email or SMS opt-in. Read by channel and campaign to price list growth.


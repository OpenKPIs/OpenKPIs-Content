KPI Name: Pickup Completion Rate
Formula: (Pickup Orders Collected within Hold Window / Pickup Orders Placed in Period) × 100, where both counts are distinct pickup orders (order_id) from the same placement-date cohort, each attributed to its pickup store

Description: |
  Share of buy-online-pickup-in-store (BOPIS) and curbside orders placed in a period that the customer actually collects within the store's hold window, stitched from the online purchase (fulfillment method = pickup) to the store handoff record on the order ID. It is the primary health signal of the click-and-collect promise: every point below target is booked revenue turning into auto-cancellations, refunds and stranded store inventory, and the gap decomposes cleanly into customer no-shows versus retailer-side pick failures.

Category: Operations

Tags: [kpi, E-commerce: Post-Purchase Logistics & Fulfillment, BOPIS, Curbside Pickup, Digital + Offline]


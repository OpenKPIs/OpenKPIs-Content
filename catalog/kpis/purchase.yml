KPI Name: Purchase
Formula: COUNT(DISTINCT transaction_id) WHERE event_name = 'purchase' AND transaction_id IS NOT NULL AND is_test_order != true AND traffic_type != 'internal' AND hostname NOT LIKE staging/stage/qa/test/dev/localhost, dated by MIN(event_date) per transaction_id (first placement date) in the reporting timezone

Description: |
  Purchase is the count of unique, successfully placed orders (distinct transaction IDs) across web and app in the reporting period, net of test, internal and duplicate transactions. It is the primary sales-volume outcome of the storefront and the numerator for order conversion rate, average order value and revenue-per-visit analysis.


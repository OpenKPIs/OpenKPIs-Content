KPI Name: Qualified Property Inquiry Rate
Formula: (Distinct Valid Property Inquiries Created in the Period and Classified as Qualified Within 7 Days / Distinct Valid Property Inquiries Created in the Period) × 100

Description: |
  Measures the percentage of valid, deduplicated property inquiries created during a reporting period that satisfy approved, non-discriminatory qualification criteria within the defined assessment window. It connects acquisition and property-discovery engagement to conversion quality by showing whether channels and experiences generate inquiries likely to progress to viewings, transactions, retention, and customer lifetime value.

Category: Conversion

Tags: [kpi]

Industry: [Real Estate Tech]

Priority: High

Core Area: Discovery

Scope: Event

Measure Type: rate

Aggregation Window: Time based - Daily


    page_location,
    platform,
    device_category,
    call_tracking_id,
    chat_conversation_id,
    partner_lead_id,
    qualified_inquiry_flag,
    qualified_inquiry_numerator,
    total_inquiry_denominator,
    ROUND(
      CAST(qualified_inquiry_numerator AS DOUBLE) /
      NULLIF(CAST(total_inquiry_denominator AS DOUBLE), 0),
      6
    ) AS qualified_property_inquiry_rate,
    ROUND(
      100 * CAST(qualified_inquiry_numerator AS DOUBLE) /
      NULLIF(CAST(total_inquiry_denominator AS DOUBLE), 0),
      2
    ) AS qualified_property_inquiry_rate_pct
  FROM scored
  ORDER BY inquiry_created_at DESC, canonical_inquiry_id;

Calculation Notes: |
  Use an inquiry-created cohort rather than the date on which qualification occurred. Allow seven complete 24-hour periods after submission for qualification, and report younger cohorts as provisional. Include successfully received inquiries from web forms, mobile applications, chat, tracked calls, approved partners, and agent-assisted channels when they reference an identifiable property and can be represented by a canonical inquiry ID. Exclude test activity, employee activity, monitoring traffic, confirmed bots, spam, vendor solicitations, malformed submissions, duplicate inquiries, and inquiries without a resolvable property. Determine qualification using the status effective at the seven-day maturity cutoff; pending, rejected, invalid, or disqualified inquiries remain in the denominator but not the numerator. Return null when the denominator is zero, never zero percent. Calculate the enterprise total from summed numerators and denominators rather than averaging market or channel rates.

Business Use Case: |
  A Sales or Product executive compares mature rates by acquisition channel, device, market, property type, and inquiry method. If paid-social mobile traffic produces high inquiry volume but a materially lower qualified rate than organic search, the team can change campaign targeting, correct listing-message mismatches, simplify the mobile form, improve inventory freshness, or adjust lead-routing rules before increasing media spend.



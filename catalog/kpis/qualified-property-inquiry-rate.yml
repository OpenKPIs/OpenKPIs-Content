Google Analytics SQL: |
  -- ==========================================
  -- 1. GOOGLE BIGQUERY SQL
  -- ==========================================
  WITH raw_events AS (
    SELECT
      TIMESTAMP_MICROS(e.event_timestamp) AS event_received_at,
      e.user_pseudo_id AS ga4_user_pseudo_id,
      e.platform AS ga4_platform,
      e.device.category AS ga4_device_category,
      (
        SELECT JSON_OBJECT(ARRAY_AGG(param_key), ARRAY_AGG(param_value))
        FROM (
          SELECT
            ep.key AS param_key,
            ANY_VALUE(
              COALESCE(
                ep.value.string_value,
                CAST(ep.value.int_value AS STRING),
                CAST(ep.value.double_value AS STRING),
                CAST(ep.value.float_value AS STRING)
              )
            ) AS param_value
          FROM UNNEST(e.event_params) AS ep
          GROUP BY ep.key
        )
      ) AS event_parameters
    FROM `your-project.analytics_123456789.events_*` AS e
    WHERE e.event_name = 'generate_lead'
      AND REGEXP_CONTAINS(_TABLE_SUFFIX, r'^\d{8}$')
      AND PARSE_DATE('%Y%m%d', _TABLE_SUFFIX)
          BETWEEN DATE_SUB(CURRENT_DATE(), INTERVAL 31 DAY) AND CURRENT_DATE()
  ),
  mapped AS (
    SELECT
      event_received_at,
      JSON_VALUE(event_parameters, '$.inquiry_id') AS inquiry_id,
      JSON_VALUE(event_parameters, '$.canonical_inquiry_id') AS canonical_inquiry_id,
      SAFE_CAST(JSON_VALUE(event_parameters, '$.inquiry_created_at') AS TIMESTAMP) AS inquiry_created_at,
      JSON_VALUE(event_parameters, '$.inquiry_status') AS inquiry_status,
      JSON_VALUE(event_parameters, '$.inquiry_type') AS inquiry_type,
      JSON_VALUE(event_parameters, '$.inquiry_channel') AS inquiry_channel,
      JSON_VALUE(event_parameters, '$.source_system') AS source_system,
      SAFE_CAST(JSON_VALUE(event_parameters, '$.assessment_window_start') AS TIMESTAMP) AS assessment_window_start,
      SAFE_CAST(JSON_VALUE(event_parameters, '$.assessment_window_end') AS TIMESTAMP) AS assessment_window_end,
      SAFE_CAST(JSON_VALUE(event_parameters, '$.qualification_assessed_at') AS TIMESTAMP) AS qualification_assessed_at,
      JSON_VALUE(event_parameters, '$.qualification_status') AS qualification_status,
      CASE
        WHEN LOWER(JSON_VALUE(event_parameters, '$.is_qualified')) IN ('true','1','yes','y') THEN TRUE
        WHEN LOWER(JSON_VALUE(event_parameters, '$.is_qualified')) IN ('false','0','no','n') THEN FALSE
        WHEN LOWER(JSON_VALUE(event_parameters, '$.qualification_status')) IN ('qualified','approved','accepted') THEN TRUE
        ELSE FALSE
      END AS is_qualified,
      JSON_VALUE(event_parameters, '$.qualification_rule_set_id') AS qualification_rule_set_id,
      JSON_VALUE(event_parameters, '$.qualification_rule_set_version') AS qualification_rule_set_version,
      JSON_VALUE(event_parameters, '$.qualification_reason_codes') AS qualification_reason_codes,
      JSON_VALUE(event_parameters, '$.deduplication_key') AS deduplication_key,
      LOWER(JSON_VALUE(event_parameters, '$.is_duplicate')) IN ('true','1','yes','y') AS is_duplicate,
      JSON_VALUE(event_parameters, '$.property_id') AS property_id,
      JSON_VALUE(event_parameters, '$.listing_id') AS listing_id,
      JSON_VALUE(event_parameters, '$.property_type') AS property_type,
      JSON_VALUE(event_parameters, '$.property_market') AS property_market,
      JSON_VALUE(event_parameters, '$.property_city') AS property_city,
      JSON_VALUE(event_parameters, '$.property_region') AS property_region,
      JSON_VALUE(event_parameters, '$.property_country') AS property_country,
      SAFE_CAST(JSON_VALUE(event_parameters, '$.property_price') AS NUMERIC) AS property_price,
      JSON_VALUE(event_parameters, '$.property_currency') AS property_currency,
      JSON_VALUE(event_parameters, '$.customer_id') AS customer_id,
      JSON_VALUE(event_parameters, '$.anonymous_id') AS anonymous_id,
      JSON_VALUE(event_parameters, '$.session_id') AS session_id,
      COALESCE(JSON_VALUE(event_parameters, '$.user_pseudo_id'), ga4_user_pseudo_id) AS user_pseudo_id,
      JSON_VALUE(event_parameters, '$.lead_id') AS lead_id,
      JSON_VALUE(event_parameters, '$.crm_contact_id') AS crm_contact_id,
      JSON_VALUE(event_parameters, '$.consent_status') AS consent_status,
      SAFE_CAST(JSON_VALUE(event_parameters, '$.consent_timestamp') AS TIMESTAMP) AS consent_timestamp,
      JSON_VALUE(event_parameters, '$.marketing_source') AS marketing_source,
      JSON_VALUE(event_parameters, '$.marketing_medium') AS marketing_medium,
      JSON_VALUE(event_parameters, '$.marketing_campaign') AS marketing_campaign,
      JSON_VALUE(event_parameters, '$.marketing_campaign_id') AS marketing_campaign_id,
      JSON_VALUE(event_parameters, '$.marketing_content') AS marketing_content,
      JSON_VALUE(event_parameters, '$.marketing_term') AS marketing_term,
      JSON_VALUE(event_parameters, '$.attribution_model') AS attribution_model,
      JSON_VALUE(event_parameters, '$.referrer') AS referrer,
      JSON_VALUE(event_parameters, '$.landing_page') AS landing_page,
      JSON_VALUE(event_parameters, '$.page_location') AS page_location,
      COALESCE(JSON_VALUE(event_parameters, '$.platform'), ga4_platform) AS platform,
      COALESCE(JSON_VALUE(event_parameters, '$.device_category'), ga4_device_category) AS device_category,
      JSON_VALUE(event_parameters, '$.call_tracking_id') AS call_tracking_id,
      JSON_VALUE(event_parameters, '$.chat_conversation_id') AS chat_conversation_id,
      JSON_VALUE(event_parameters, '$.partner_lead_id') AS partner_lead_id
    FROM raw_events
  ),
  ranked AS (
    SELECT
      mapped.*,
      ROW_NUMBER() OVER (
        PARTITION BY COALESCE(canonical_inquiry_id, deduplication_key, inquiry_id)
        ORDER BY qualification_assessed_at DESC, event_received_at DESC
      ) AS inquiry_record_rank
    FROM mapped
    WHERE COALESCE(canonical_inquiry_id, deduplication_key, inquiry_id) IS NOT NULL
      AND COALESCE(is_duplicate, FALSE) = FALSE
      AND COALESCE(property_id, listing_id) IS NOT NULL
      AND DATE(inquiry_created_at) BETWEEN DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY) AND CURRENT_DATE()
  ),
  eligible_inquiries AS (
    SELECT * EXCEPT (inquiry_record_rank)
    FROM ranked
    WHERE inquiry_record_rank = 1
      AND COALESCE(assessment_window_end, inquiry_created_at, event_received_at) <= CURRENT_TIMESTAMP()
  ),
  scored AS (
    SELECT
      eligible_inquiries.*,
      IF(is_qualified, 1, 0) AS qualified_inquiry_flag,
      COUNTIF(is_qualified) OVER () AS qualified_inquiry_numerator,
      COUNT(*) OVER () AS total_inquiry_denominator
    FROM eligible_inquiries
  )
  SELECT
    inquiry_id,
    canonical_inquiry_id,
    inquiry_created_at,
    inquiry_status,
    inquiry_type,
    inquiry_channel,
    source_system,
    assessment_window_start,
    assessment_window_end,
    qualification_assessed_at,
    qualification_status,
    is_qualified,
    qualification_rule_set_id,
    qualification_rule_set_version,
    qualification_reason_codes,
    deduplication_key,
    is_duplicate,
    property_id,
    listing_id,
    property_type,
    property_market,
    property_city,
    property_region,
    property_country,
    property_price,
    property_currency,
    customer_id,
    anonymous_id,
    session_id,
    user_pseudo_id,
    lead_id,
    crm_contact_id,
    consent_status,
    consent_timestamp,
    marketing_source,
    marketing_medium,
    marketing_campaign,
    marketing_campaign_id,
    marketing_content,
    marketing_term,
    attribution_model,
    referrer,
    landing_page,
    page_location,
    platform,
    device_category,
    call_tracking_id,
    chat_conversation_id,
    partner_lead_id,
    qualified_inquiry_flag,
    qualified_inquiry_numerator,
    total_inquiry_denominator,
    ROUND(SAFE_DIVIDE(qualified_inquiry_numerator, total_inquiry_denominator), 6) AS qualified_property_inquiry_rate,
    ROUND(100 * SAFE_DIVIDE(qualified_inquiry_numerator, total_inquiry_denominator), 2) AS qualified_property_inquiry_rate_pct
  FROM scored
  ORDER BY inquiry_created_at DESC, canonical_inquiry_id;

AEP Query Service SQL: |
  -- ==========================================
  -- 2. ADOBE AEP QUERY SERVICE SQL
  -- ==========================================
  WITH source_events AS (
    SELECT
      timestamp AS event_received_at,
      _propertyInquiry AS i
    FROM property_inquiry_event_dataset
    WHERE eventType = 'web.formFilledOut'
      AND web.webInteraction.name = 'generate_lead'
      AND timestamp >= CURRENT_TIMESTAMP - INTERVAL '31' DAY
  ),
  mapped AS (
    SELECT
      event_received_at,
      i.inquiry_id AS inquiry_id,
      i.canonical_inquiry_id AS canonical_inquiry_id,
      CAST(i.inquiry_created_at AS TIMESTAMP) AS inquiry_created_at,
      i.inquiry_status AS inquiry_status,
      i.inquiry_type AS inquiry_type,
      i.inquiry_channel AS inquiry_channel,
      i.source_system AS source_system,
      CAST(i.assessment_window_start AS TIMESTAMP) AS assessment_window_start,
      CAST(i.assessment_window_end AS TIMESTAMP) AS assessment_window_end,
      CAST(i.qualification_assessed_at AS TIMESTAMP) AS qualification_assessed_at,
      i.qualification_status AS qualification_status,
      CASE
        WHEN LOWER(CAST(i.is_qualified AS STRING)) IN ('true','1','yes','y') THEN TRUE
        WHEN LOWER(CAST(i.is_qualified AS STRING)) IN ('false','0','no','n') THEN FALSE
        WHEN LOWER(i.qualification_status) IN ('qualified','approved','accepted') THEN TRUE
        ELSE FALSE
      END AS is_qualified,
      i.qualification_rule_set_id AS qualification_rule_set_id,
      i.qualification_rule_set_version AS qualification_rule_set_version,
      i.qualification_reason_codes AS qualification_reason_codes,
      i.deduplication_key AS deduplication_key,
      CASE
        WHEN LOWER(CAST(i.is_duplicate AS STRING)) IN ('true','1','yes','y') THEN TRUE
        ELSE FALSE
      END AS is_duplicate,
      i.property_id AS property_id,
      i.listing_id AS listing_id,
      i.property_type AS property_type,
      i.property_market AS property_market,
      i.property_city AS property_city,
      i.property_region AS property_region,
      i.property_country AS property_country,
      CAST(i.property_price AS DECIMAL(38,2)) AS property_price,
      i.property_currency AS property_currency,
      i.customer_id AS customer_id,
      i.anonymous_id AS anonymous_id,
      i.session_id AS session_id,
      i.user_pseudo_id AS user_pseudo_id,
      i.lead_id AS lead_id,
      i.crm_contact_id AS crm_contact_id,
      i.consent_status AS consent_status,
      CAST(i.consent_timestamp AS TIMESTAMP) AS consent_timestamp,
      i.marketing_source AS marketing_source,
      i.marketing_medium AS marketing_medium,
      i.marketing_campaign AS marketing_campaign,
      i.marketing_campaign_id AS marketing_campaign_id,
      i.marketing_content AS marketing_content,
      i.marketing_term AS marketing_term,
      i.attribution_model AS attribution_model,
      i.referrer AS referrer,
      i.landing_page AS landing_page,
      i.page_location AS page_location,
      i.platform AS platform,
      i.device_category AS device_category,
      i.call_tracking_id AS call_tracking_id,
      i.chat_conversation_id AS chat_conversation_id,
      i.partner_lead_id AS partner_lead_id
    FROM source_events
  ),
  ranked AS (
    SELECT
      mapped.*,
      ROW_NUMBER() OVER (
        PARTITION BY COALESCE(canonical_inquiry_id, deduplication_key, inquiry_id)
        ORDER BY qualification_assessed_at DESC, event_received_at DESC
      ) AS inquiry_record_rank
    FROM mapped
    WHERE COALESCE(canonical_inquiry_id, deduplication_key, inquiry_id) IS NOT NULL
      AND COALESCE(is_duplicate, FALSE) = FALSE
      AND COALESCE(property_id, listing_id) IS NOT NULL
      AND CAST(inquiry_created_at AS DATE)
          BETWEEN CURRENT_DATE - INTERVAL '30' DAY AND CURRENT_DATE
  ),
  eligible_inquiries AS (
    SELECT
      inquiry_id,
      canonical_inquiry_id,
      inquiry_created_at,
      inquiry_status,
      inquiry_type,
      inquiry_channel,
      source_system,
      assessment_window_start,
      assessment_window_end,
      qualification_assessed_at,
      qualification_status,
      is_qualified,
      qualification_rule_set_id,
      qualification_rule_set_version,
      qualification_reason_codes,
      deduplication_key,
      is_duplicate,
      property_id,
      listing_id,
      property_type,
      property_market,
      property_city,
      property_region,
      property_country,
      property_price,
      property_currency,
      customer_id,
      anonymous_id,
      session_id,
      user_pseudo_id,
      lead_id,
      crm_contact_id,
      consent_status,
      consent_timestamp,
      marketing_source,
      marketing_medium,
      marketing_campaign,
      marketing_campaign_id,
      marketing_content,
      marketing_term,
      attribution_model,
      referrer,
      landing_page,
      page_location,
      platform,
      device_category,
      call_tracking_id,
      chat_conversation_id,
      partner_lead_id
    FROM ranked
    WHERE inquiry_record_rank = 1
      AND COALESCE(assessment_window_end, inquiry_created_at, event_received_at) <= CURRENT_TIMESTAMP
  ),
  scored AS (
    SELECT
      eligible_inquiries.*,
      CASE WHEN is_qualified THEN 1 ELSE 0 END AS qualified_inquiry_flag,
      SUM(CASE WHEN is_qualified THEN 1 ELSE 0 END) OVER () AS qualified_inquiry_numerator,
      COUNT(*) OVER () AS total_inquiry_denominator
    FROM eligible_inquiries
  )
  SELECT

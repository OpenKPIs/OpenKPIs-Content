# KPI: Course Completion Rate
# Generated: 2026-09-15T03:38:15.364Z
# Contributed by: devyendarm
# Last modified by: devyendarm

KPI Name: Course Completion Rate
Formula: (Eligible Enrolments in Cohort that Reached Completion Status within the Completion Window / Total Eligible Enrolments in Cohort) × 100

Description: |
  Course Completion Rate is the percentage of course enrolments in a cohort that meet the course's defined completion criteria (every required module finished and any mandatory final assessment passed) within the permitted completion window. It is the primary health indicator for course design, learner support and enterprise training commitments, and because it is measured against the full enrolled base, learners who never start are counted as non-completions rather than silently dropped.

Category: Engagement

Tags: [kpi, Education: Learner Engagement & Completion]

Industry: [["Education"]]

Priority: High

Core Area: Engagement

Scope: User

Measure Type: Percentage

Aggregation Window: Time based - Monthly, Weekly, Monthly, Quarterly


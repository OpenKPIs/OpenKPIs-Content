KPI Name: Course Completion Rate
Formula: (Number of Users Who Completed the Course / Number of Users Who Started the Course) × 100

Description: |
  Measures the percentage of users who complete a course out of those who started it, indicating course effectiveness and user engagement.

Category: Engagement

Tags: [kpi]

Industry: [Education]

Priority: High

Core Area: Engagement

Scope: User

Measure Type: percentage

Aggregation Window: Time based - Monthly

GA4 Event: |
  complete_course

Adobe Event: |
  courseCompletion

W3 Data Layer: |
  {"user":{"userId":"user_67890"},"event":"completeCourse","course":{"courseId":"12345","courseName":"Introduction to Analytics","completionStatus":"completed"},"eventInfo":{"type":"userEngagement","eventName":"Course Completion"}}

GA4 Data Layer: |
  {"user":{"user_id":"user_67890"},"event":"complete_course","course":{"course_id":"12345","course_name":"Introduction to Analytics","completion_status":"completed"}}

Adobe Client Data Layer: |
  {"user":{"id":"user_67890"},"event":"courseCompletion","course":{"id":"12345","name":"Introduction to Analytics","status":"completed"}}

XDM Mapping: |
  {"_experience":{"analytics":{"user":{"id":"user_67890"},"course":{"id":"12345","name":"Introduction to Analytics","status":"completed"},"eventType":"courseCompletion"}}}

Google Analytics SQL: |
  -- ==========================================
  -- 1. GOOGLE BIGQUERY SQL
  -- ==========================================
  SELECT
    course_id,
    COUNTIF(completion_status = 'completed') / COUNTIF(course_started = 'true') AS course_completion_rate
  FROM (
    SELECT
      event_params.value.string_value AS course_id,
      MAX(CASE WHEN event_params.key = 'completion_status' THEN event_params.value.string_value END) AS completion_status,
      MAX(CASE WHEN event_params.key = 'course_started' THEN event_params.value.string_value END) AS course_started
    FROM
      `your-project.analytics_123456789.events_*`,
      UNNEST(event_params) AS event_params
    WHERE
      event_name = 'complete_course'
    GROUP BY
      course_id
  )
  WHERE
    course_started = 'true'
  GROUP BY
    course_id

AEP Query Service SQL: |
  -- ==========================================
  -- 2. ADOBE AEP QUERY SERVICE SQL
  -- ==========================================
  SELECT
    course.id AS course_id,
    COUNT(CASE WHEN course.status = 'completed' THEN 1 END) / COUNT(CASE WHEN course.started = 'true' THEN 1 END) AS course_completion_rate
  FROM
    aep_backend_dataset
  WHERE
    eventType = 'courseCompletion'
    AND course.started = 'true'
  GROUP BY
    course.id

Calculation Notes: |
  Exclude users who did not engage with any course content beyond the introduction. Ensure only users who started the course are included in the denominator.

Business Use Case: |
  Executives use this KPI to identify courses with low completion rates and implement strategies to improve content or delivery methods.



Report Attributes: |
  Course Name; Academic Subject; Enrollment Cohort; Learning Delivery Format; Course Difficulty Level; Access Entitlement Type; Learner Role; Client Organization

Dashboard Usage: [Course Performance Dashboard, Learner Success & Retention Dashboard, Curriculum Quality Review, Enterprise Client Training Scorecard]

Segment Eligibility: |
  true


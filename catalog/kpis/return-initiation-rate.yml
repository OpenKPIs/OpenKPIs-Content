KPI Name: Return Initiation Rate
Formula: (Delivered Orders with ≥ 1 Return Initiated within the Return Window / Delivered Orders in the Cohort) × 100

Description: |
  Share of delivered orders with at least one return request started within the return window. Counted at initiation, before the item is received, so it leads Return Rate by the transit and inspection lag.


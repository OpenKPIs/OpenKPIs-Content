# Last modified by: devyendarm

KPI Name: Booking Cancellation Rate
Formula: (Distinct Eligible Confirmed Bookings Fully Cancelled Before First Scheduled Service Start / Distinct Eligible Confirmed Bookings in the Same Booking-Created Cohort) × 100

Description: |
  Measures the percentage of confirmed bookings that are fully cancelled before the first scheduled service start within a specific cohort period.

Category: Performance

Tags: [kpi]

Industry: [Other]

Priority: High

Core Area: Generic

Scope: Item

Measure Type: percentage

Aggregation Window: Time based - Daily/Weekly/Monthly/Yearly




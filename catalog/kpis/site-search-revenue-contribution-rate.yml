KPI Name: Site Search Revenue Contribution Rate
Formula: (Purchase Revenue from Sessions with ≥1 Site Search / Total Purchase Revenue) × 100

Description: |
  Share of total purchase revenue earned in sessions with at least one on-site product search. Sizes how much of the business depends on search.

Category: Monetization


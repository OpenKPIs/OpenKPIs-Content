KPI Name: Bounce Rate
Formula: (Single Page Sessions / Total Sessions) × 100

Description: |
  Bounce Rate measures the percentage of single-page sessions where users leave the site without interacting further. It is important for understanding user engagement and the effectiveness of landing pages.

Category: Engagement

Tags: [user behavior, site performance, engagement]

Industry: [["Retail","E-commerce","SaaS","Media","Technology"]]

Priority: High

Core Area: Digital Analytics

Scope: Session

Measure Type: percentage

Aggregation Window: Session, Time based - Hourly/Daily/Monthly/Yearly

GA4 Event: |
  page_view

Adobe Event: |
  pageView

W3 Data Layer: |
  {"event":"pageView","pageInstanceID":"p123","page":{"pageInfo":{"pageID":"landingPage"}}}

GA4 Data Layer: |
  {"event":"page_view","page_location":"https://example.com/landing","page_referrer":"https://example.com/referrer","page_title":"Landing Page"}

Adobe Client Data Layer: |
  {"event":"pageLoaded","eventInfo":{"eventName":"pageLoaded"},"page":{"pageInfo":{"pageName":"landingPage"}}}

XDM Mapping: |
  {"eventType":"web.pageViews","web":{"webPageDetails":{"name":"landingPage"}}}

SQL Query: |
  SELECT (COUNT(CASE WHEN page_views = 1 THEN 1 END) / COUNT(*)) * 100 AS bounce_rate FROM sessions WHERE session_date BETWEEN '2023-01-01' AND '2023-12-31';

Calculation Notes: |
  Exclude sessions with multiple page views; consider filtering out bot traffic for accuracy.

Business Use Case: |
  Marketing teams can use Bounce Rate to evaluate the effectiveness of landing pages and make adjustments to improve user engagement.

Dependencies: |
  Page View Event; Session ID

Source Data: Digital Analytics

Report Attributes: |
  Page Title, Session Count, Bounce Rate

Dashboard Usage: [Traffic Analysis, Engagement Metrics]

Segment Eligibility: |
  true

Related KPIs: [Exit Rate, Average Session Duration]

Data Sensitivity: internal

Contains PII: No


SQL Query: |
  SELECT (COUNT(CASE WHEN page_views = 1 THEN 1 END) / COUNT(*)) * 100 AS bounce_rate FROM sessions WHERE session_date BETWEEN '2023-01-01' AND '2023-12-31';

Calculation Notes: |
  In GA4, bounce rate is the inverse of engagement rate and is defined as the percentage of sessions that were not engaged. 
  An engaged session is typically a session lasting longer than 10 seconds, having 2 or more page or screen views, or containing at least one key event/conversion. 
  Exclude internal traffic, bot traffic, developer traffic, and invalid sessions where session identifiers are missing. 
  If calculating in Adobe Analytics or another platform, align the bounce definition explicitly because Adobe bounce may be based on single-hit visits unless customized.

Business Use Case: |
  A digital marketing team monitors bounce rate by landing page and campaign. If paid social traffic to a product landing page has a bounce rate of 78%, the team can review message match, page speed, mobile UX, and call-to-action clarity, then optimize the page or pause low-quality campaigns.


KPI Name: Customer Churn Rate
Formula: (Customers with ≥ 1 qualifying order in base period B and zero qualifying orders within lapse window L after their last order in B ÷ Customers with ≥ 1 qualifying order in base period B) × 100

Description: |
  E-commerce specialisation of Churn Rate for non-contractual retail: the share of customers who purchased during a base period and then placed no further qualifying order within a category-calibrated lapse window (typically 180 or 365 days), divided by all customers active in that base period. Unlike Subscriber Churn Rate, which counts explicit cancel_subscription events on contractual plans, and Customer Retention Rate, which measures period-over-period survival as (E − N) / S, churn here is inferred from purchase silence, so it is not simply 1 − retention and must be read against the stated lapse window.

Category: Retention

Tags: [kpi, E-commerce: Customer Retention, Loyalty & LTV]

Industry: [["E-commerce"]]

Priority: High

Core Area: Engagement

Scope: User

Measure Type: Percentage

Aggregation Window: Monthly, Quarterly, Yearly


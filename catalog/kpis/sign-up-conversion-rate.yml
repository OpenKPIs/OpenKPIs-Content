KPI Name: Sign Up Conversion Rate
Formula: (Unique Users Who Completed sign_up / Unique Users Who Started the Registration Form) × 100

Description: |
  Sign Up Conversion Rate is the percentage of users who start the account registration form and go on to complete it, creating a customer account. It isolates the efficiency of the sign-up flow itself, showing how much form friction, field count, verification steps and social-login options cost the store in registered customers.

Category: Conversion

Tags: [kpi, E-commerce: Top-of-Funnel & Marketing Acquisition, registration, funnel]

Industry: [["E-commerce"]]

Priority: High

Core Area: Authentication

Scope: User

Measure Type: Percentage

Aggregation Window: Daily, Weekly, Monthly


KPI Name: On-Time Assignment Submission Rate
Formula: (Number of eligible learner-assignment obligations submitted on or before the effective deadline / Total number of eligible learner-assignment obligations due in the reporting window) × 100

Description: |
  Measures the percentage of eligible learner-assignment obligations with a valid final submission received on or before the applicable deadline. Reporting periods are attributed by the effective assignment due timestamp so that submitted, late, and missing obligations are evaluated from the same due-date cohort.

Category: Performance

Tags: [kpi]

Industry: [EdTech & E-Learning]

Priority: High

Core Area: Engagement

Scope: Item

Measure Type: percentage

Aggregation Window: Time based - Daily/Weekly/Monthly/Academic Term









Calculation Notes: |
  Assign each obligation to a reporting period using its effective due timestamp, not its submission timestamp. Use the LMS server-received timestamp for the first valid final submission; draft saves, file uploads not finalized as submissions, instructor previews, and ingestion timestamps do not qualify. A submission received exactly at the effective deadline is on time. Missing submissions remain in the denominator and not the numerator. Apply approved learner-level or group-level extensions before classification and restate prior periods when a retroactive extension changes the effective deadline. For resubmissions, use the earliest valid final submission unless the instructor explicitly invalidated it before the deadline. Do not apply an implicit grace period unless it is formally configured as part of the effective deadline. Deduplicate repeated submission events by the canonical submission identifier. Recalculate backfilled events using the original server-received timestamp.

Business Use Case: |
  Academic Operations reviews the rate by course, instructor, assignment type, and learner cohort each week. If a course falls below the warning threshold, the team can investigate deadline configuration, workload clustering, unclear instructions, accessibility barriers, or notification failures and then adjust due dates, trigger learner reminders, or provide targeted instructor support before course completion declines.


Source Data: Learning Management System assignment records, enrollment and roster service, submission event store, extension and accommodation records, and academic calendar data

Report Attributes: |
  ["Academic term","Institution","Program","Department","Course","Course section","Instructor","Delivery modality","Assignment type","Assignment weight","Due weekday","Due hour","Learner cohort","Enrollment type","Extension status","Accessibility accommodation status","Device type","Submission channel"]


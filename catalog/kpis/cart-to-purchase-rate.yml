KPI Name: Cart-to-Purchase Rate
Formula: (Number of Sessions with Purchase / Number of Sessions with Add to Cart) × 100

Description: |
  Measures the percentage of sessions where users add items to their cart and complete a purchase in the same session. It evaluates the effectiveness of converting cart additions into purchases.

Category: Conversion

Tags: [cart, conversion, checkout]

Industry: [E-commerce]

Priority: High

Core Area: Checkout

Scope: Session

Measure Type: percentage

Aggregation Window: Time based - Daily


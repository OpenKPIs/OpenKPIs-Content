Google Analytics SQL: |
  -- ==========================================
  -- 1. GOOGLE BIGQUERY SQL
  -- ==========================================
  SELECT COUNT(DISTINCT purchase.transaction_id) AS purchases,
         COUNT(DISTINCT cart.transaction_id) AS carts,
         (COUNT(DISTINCT purchase.transaction_id) / COUNT(DISTINCT cart.transaction_id)) AS cart_to_purchase_rate
  FROM `your-project.analytics_123456789.events_*` AS events
  LEFT JOIN UNNEST(events.ecommerce.items) AS items
  ON TRUE
  LEFT JOIN (
      SELECT DISTINCT transaction_id
      FROM `your-project.analytics_123456789.events_*`
      WHERE event_name = 'purchase'
  ) AS purchase
  ON purchase.transaction_id = events.ecommerce.transaction_id
  LEFT JOIN (
      SELECT DISTINCT transaction_id
      FROM `your-project.analytics_123456789.events_*`
      WHERE event_name = 'add_to_cart'
  ) AS cart
  ON cart.transaction_id = events.ecommerce.transaction_id
  WHERE events.event_date BETWEEN '2023-01-01' AND '2023-12-31';

AEP Query Service SQL: |
  -- ==========================================
  -- 2. ADOBE AEP QUERY SERVICE SQL
  -- ==========================================
  SELECT COUNT(DISTINCT purchase.transactionID) AS purchases,
         COUNT(DISTINCT cart.transactionID) AS carts,
         (COUNT(DISTINCT purchase.transactionID) / COUNT(DISTINCT cart.transactionID)) AS cart_to_purchase_rate
  FROM aep_backend_dataset AS events
  LEFT JOIN UNNEST(events.ecommerce.items) AS items
  ON TRUE
  LEFT JOIN (
      SELECT DISTINCT transactionID
      FROM aep_backend_dataset
      WHERE event = 'purchase'
  ) AS purchase
  ON purchase.transactionID = events.ecommerce.transactionID
  LEFT JOIN (
      SELECT DISTINCT transactionID
      FROM aep_backend_dataset
      WHERE event = 'add_to_cart'
  ) AS cart
  ON cart.transactionID = events.ecommerce.transactionID
  WHERE events.event_date BETWEEN '2023-01-01' AND '2023-12-31';

Calculation Notes: |
  Excludes sessions without 'add_to_cart' events. Considers only sessions where both 'add_to_cart' and 'purchase' occur.

Business Use Case: |
  Executives use this KPI to identify bottlenecks in the checkout process and improve conversion strategies.



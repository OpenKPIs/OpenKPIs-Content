KPI Name: Cart-to-Purchase Rate
Formula: (Sessions with add_to_cart AND purchase / Sessions with add_to_cart) × 100

Description: |
  Cart-to-Purchase Rate measures the percentage of sessions containing at least one add_to_cart event that also contain a completed purchase within the same session. It shows how effectively cart-building activity turns into completed orders and isolates checkout and cart friction from upstream product-discovery performance.

Category: Conversion

Tags: [kpi, E-commerce: Cart & Checkout Funnel Analytics, cart, conversion, checkout]


KPI Name: Revenue
Formula: SUM(Transaction Amount)

Description: |
  Revenue measures the total income generated from sales of goods or services. It is a key indicator of business success and financial health.

Category: Revenue

Tags: [sales, income, financial]

Industry: [["Retail","E-commerce","SaaS","Finance"]]

Priority: High

Core Area: Business Intelligence

Scope: Global

Measure Type: currency

Aggregation Window: Time based - Daily/Monthly/Yearly

GA4 Event: |
  purchase

Adobe Event: |
  scPurchase

W3 Data Layer: |
  {"event":"purchase","transaction":{"transactionID":"T123","total":100,"currency":"USD"}}

GA4 Data Layer: |
  {"event":"purchase","ecommerce":{"transaction_id":"T123","value":100,"currency":"USD"}}

Adobe Client Data Layer: |
  {"event":"purchaseCompleted","eventInfo":{"eventName":"purchaseCompleted"},"transaction":{"transactionID":"T123","total":100}}

XDM Mapping: |
  {"eventType":"commerce.purchases","commerce":{"purchases":{"value":100}}}

SQL Query: |
  SELECT SUM(transaction_amount) AS revenue FROM transactions WHERE transaction_date BETWEEN '2023-01-01' AND '2023-12-31'

Calculation Notes: |
  Ensure currency conversion is applied if necessary; exclude refunds.

Business Use Case: |
  Finance teams use Revenue to assess overall business performance and make strategic decisions.

Dependencies: |
  purchase

Source Data: ERP, CRM

Report Attributes: |
  Revenue, Transaction ID, Date

Dashboard Usage: [Financial Overview, Sales Performance]

Segment Eligibility: |
  true

Related KPIs: [Average Order Value, Profit]

Data Sensitivity: confidential

Contains PII: No


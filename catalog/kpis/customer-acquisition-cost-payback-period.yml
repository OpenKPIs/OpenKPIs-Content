KPI Name: Customer Acquisition Cost Payback Period
Formula: Customer Acquisition Cost / (Average Order Value × Gross Margin % × Monthly Purchase Frequency)

Description: |
  Months of gross margin from newly acquired customers needed to recover the cost of acquiring them. Tracked per acquisition cohort and channel to show whether paid growth funds itself.


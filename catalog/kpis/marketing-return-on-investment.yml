KPI Name: Marketing Return on Investment
Formula: ((Revenue Attributed to Marketing - Total Marketing Spend) / Total Marketing Spend) × 100

Description: |
  Net return on total marketing cost: attributed revenue minus all marketing spend, divided by that spend. Unlike ROAS it counts agency, tooling and staff cost, and 0% means break-even.

Category: Performance


























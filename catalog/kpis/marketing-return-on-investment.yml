Google Analytics SQL: |
  -- ==========================================
  -- 1. GOOGLE BIGQUERY SQL
  -- ==========================================
  -- Last closed month is the latest month that ended at least 30 days ago (lookback for late conversions); three full months by default
  DECLARE end_date DATE DEFAULT DATE_SUB(DATE_TRUNC(DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY), MONTH), INTERVAL 1 DAY);
  DECLARE start_date DATE DEFAULT DATE_TRUNC(DATE_SUB(end_date, INTERVAL 2 MONTH), MONTH);
  
  WITH purchases AS (
    -- Marketing-attributed purchases (direct and organic excluded); captured value is the item subtotal and already excludes tax and shipping
    SELECT
      DATE_TRUNC(PARSE_DATE('%Y%m%d', event_date), MONTH) AS report_month,
      ecommerce.transaction_id,
      ecommerce.purchase_revenue AS net_revenue
    FROM `your-project.analytics_123456789.events_*`
    WHERE _TABLE_SUFFIX BETWEEN FORMAT_DATE('%Y%m%d', start_date) AND FORMAT_DATE('%Y%m%d', end_date)
      AND event_name = 'purchase'
      AND IFNULL((SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'campaign_medium'), '(none)') NOT IN ('(none)', 'organic')
      AND IFNULL((SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'campaign_source'), '(direct)') != '(direct)'
  ),
  refunds AS (
    -- Refunds and cancellations issued up to today against those transactions
    SELECT ecommerce.transaction_id, SUM(ecommerce.refund_value) AS refund_value
    FROM `your-project.analytics_123456789.events_*`
    WHERE _TABLE_SUFFIX BETWEEN FORMAT_DATE('%Y%m%d', start_date) AND FORMAT_DATE('%Y%m%d', CURRENT_DATE())
      AND event_name = 'refund'
    GROUP BY 1
  ),
  attributed_revenue AS (
    -- Monthly attributed revenue net of refunds
    SELECT p.report_month, SUM(p.net_revenue - IFNULL(r.refund_value, 0)) AS revenue
    FROM purchases p
    LEFT JOIN refunds r USING (transaction_id)
    GROUP BY 1
  ),
  spend AS (
    -- Total marketing spend: media, agency and creative fees, martech licences, allocated staff cost
    SELECT DATE_TRUNC(spend_date, MONTH) AS report_month, SUM(amount) AS total_spend
    FROM `your-project.marketing.marketing_spend`
    WHERE spend_date BETWEEN start_date AND end_date
      AND cost_type IN ('media', 'agency', 'creative', 'martech', 'staff')
    GROUP BY 1
  )
  -- Marketing ROI % per month; NULL (undefined) when spend is zero
  SELECT
    s.report_month,
    SAFE_DIVIDE(IFNULL(a.revenue, 0) - s.total_spend, s.total_spend) * 100 AS marketing_roi_pct
  FROM spend s
  LEFT JOIN attributed_revenue a USING (report_month)
  ORDER BY s.report_month

AEP Query Service SQL: |
  -- ==========================================
  -- 2. ADOBE AEP QUERY SERVICE SQL
  -- ==========================================
  WITH params AS (
    -- Last closed month is the latest month that ended at least 30 days ago (lookback for late conversions); three full months by default
    SELECT
      date_sub(trunc(date_sub(current_date(), 30), 'MM'), 1) AS end_date,
      trunc(add_months(date_sub(trunc(date_sub(current_date(), 30), 'MM'), 1), -2), 'MM') AS start_date
  ),
  purchases AS (
    -- Marketing-attributed purchases (direct and organic excluded); captured priceTotal is the item subtotal and already excludes tax and shipping
    SELECT
      trunc(to_date(e.timestamp), 'MM') AS report_month,
      e.commerce.order.purchaseID AS transaction_id,
      e.commerce.order.priceTotal AS net_revenue
    FROM aep_web_events_dataset e
    CROSS JOIN params p
    WHERE e.eventType = 'commerce.purchases'
      AND to_date(e.timestamp) BETWEEN p.start_date AND p.end_date
      AND COALESCE(e._experience.analytics.customDimensions.eVars.eVar2, '(none)') NOT IN ('(none)', 'organic')
      AND COALESCE(e._experience.analytics.customDimensions.eVars.eVar1, '(direct)') != '(direct)'
  ),
  refunds AS (
    -- Refunds and cancellations issued up to today against those transactions
    SELECT e.commerce.order.purchaseID AS transaction_id, SUM(e.commerce.order.priceTotal) AS refund_value
    FROM aep_web_events_dataset e
    CROSS JOIN params p
    WHERE e.eventType = 'refund'
      AND to_date(e.timestamp) BETWEEN p.start_date AND current_date()
    GROUP BY 1
  ),
  attributed_revenue AS (
    -- Monthly attributed revenue net of refunds
    SELECT pu.report_month, SUM(pu.net_revenue - COALESCE(r.refund_value, 0)) AS revenue
    FROM purchases pu
    LEFT JOIN refunds r ON pu.transaction_id = r.transaction_id
    GROUP BY 1
  ),
  spend AS (
    -- Total marketing spend: media, agency and creative fees, martech licences, allocated staff cost
    SELECT trunc(m.spend_date, 'MM') AS report_month, SUM(m.amount) AS total_spend
    FROM marketing_spend_dataset m
    CROSS JOIN params p
    WHERE m.spend_date BETWEEN p.start_date AND p.end_date
      AND m.cost_type IN ('media', 'agency', 'creative', 'martech', 'staff')
    GROUP BY 1
  )
  -- Marketing ROI % per month; NULL (undefined) when spend is zero
  SELECT
    s.report_month,
    (COALESCE(a.revenue, 0) - s.total_spend) / NULLIF(s.total_spend, 0) * 100 AS marketing_roi_pct
  FROM spend s
  LEFT JOIN attributed_revenue a ON s.report_month = a.report_month
  ORDER BY s.report_month

Calculation Notes: |
  1️⃣ Total Marketing Spend = media cost plus agency and creative fees, martech licences and allocated marketing staff cost for the same period.,2️⃣ Attributed revenue is net of refunds, cancellations, tax and shipping; name the attribution model on every report.,3️⃣ A 4.0 ROAS equals 300% ROI only when media is the sole cost; adding non-media cost lowers ROI, never ROAS.,4️⃣ Profit-based variant replaces revenue with attributed gross profit; never plot both variants in one trend.,5️⃣ Undefined when spend is zero; exclude direct and organic revenue unless their cost (SEO, content) sits in the spend base.,6️⃣ Revenue and spend use the same window; hold a 30-day lookback before closing a month so late conversions are counted.

Business Use Case: |
  1️⃣ CMO: channel ROI below 0% for two quarters → cut or restructure that channel's budget in the next plan.,2️⃣ Finance: at quarterly close → reconcile marketing ROI to the P&L before approving next quarter's budget.,3️⃣ Performance marketing: channel ranks high on ROAS but low on ROI → review its agency and tooling cost.


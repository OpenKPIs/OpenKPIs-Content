KPI Name: Average Daily Rate
Formula: (Sum(Net Room Revenue) / Sum(Paid Occupied Room Nights))

Description: |
  Average Daily Rate measures the net room revenue per paid occupied room night within a specified period, reflecting the achieved room price after adjustments and excluding taxes and ancillary revenue.

Category: Revenue

Tags: [kpi]

Industry: [Other]

Priority: High

Core Area: Monetization

Scope: Global

Measure Type: average

Aggregation Window: Time based - Daily/Monthly/Yearly




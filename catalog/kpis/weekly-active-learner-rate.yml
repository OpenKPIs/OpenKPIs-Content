      country,
      region,
      language,
      analytics_storage_consent,
      source_system,
      eligibility_snapshot_id,
      event_name,
      eventType
    FROM ranked_events
    WHERE event_deduplication_rank = 1
  ),
  active_learners AS (
    SELECT DISTINCT
      week_start_date,
      learner_id
    FROM deduplicated_events
    WHERE learner_id IS NOT NULL
      AND login_status = 'authenticated'
      AND qualifying_activity = TRUE
      AND week_start_date BETWEEN CAST('${START_DATE}' AS DATE)
                              AND CAST('${END_DATE}' AS DATE)
  ),
  eligible_population AS (
    SELECT DISTINCT
      week_start_date,
      week_end_date,
      calendar_week_id,
      learner_id,
      population_segment,
      organization_id,
      institution_id,
      account_id
    FROM learner_eligibility_weekly_snapshot
    WHERE week_start_date BETWEEN CAST('${START_DATE}' AS DATE)
                              AND CAST('${END_DATE}' AS DATE)
      AND eligibility_status = 'eligible'
      AND learner_id IS NOT NULL
      AND week_start_date BETWEEN eligibility_start_date
                              AND COALESCE(eligibility_end_date, CAST('9999-12-31' AS DATE))
  ),
  learner_week_population AS (
    SELECT
      eligible.week_start_date,
      eligible.week_end_date,
      eligible.calendar_week_id,
      eligible.population_segment,
      eligible.organization_id,
      eligible.institution_id,
      eligible.account_id,
      eligible.learner_id,
      CASE WHEN active.learner_id IS NOT NULL THEN 1 ELSE 0 END AS is_weekly_active_learner
    FROM eligible_population eligible
    LEFT JOIN active_learners active
      ON active.week_start_date = eligible.week_start_date
     AND active.learner_id = eligible.learner_id
  )
  SELECT
    week_start_date,
    week_end_date,
    calendar_week_id,
    population_segment,
    organization_id,
    institution_id,
    account_id,
    COUNT(DISTINCT learner_id) AS eligible_learners,
    COUNT(DISTINCT CASE WHEN is_weekly_active_learner = 1 THEN learner_id END) AS weekly_active_learners,
    CAST(COUNT(DISTINCT CASE WHEN is_weekly_active_learner = 1 THEN learner_id END) AS DECIMAL(18,6))
      / NULLIF(COUNT(DISTINCT learner_id), 0) AS weekly_active_learner_rate,
    100 * CAST(COUNT(DISTINCT CASE WHEN is_weekly_active_learner = 1 THEN learner_id END) AS DECIMAL(18,6))
      / NULLIF(COUNT(DISTINCT learner_id), 0) AS weekly_active_learner_rate_percent
  FROM learner_week_population
  GROUP BY
    week_start_date,
    week_end_date,
    calendar_week_id,
    population_segment,
    organization_id,
    institution_id,
    account_id
  ORDER BY
    week_start_date,
    population_segment,
    organization_id,
    institution_id,
    account_id;

Calculation Notes: |
  Calculate one record per canonical learner per calendar week and count each learner no more than once in both the numerator and denominator. The numerator must be a subset of the denominator and requires at least one validated qualifying activity; authentication, page views, navigation, notifications, searches, and passive video impressions do not qualify by themselves. Include learners whose enrollment, license, subscription, or institutional entitlement overlaps at least one day of the week. Use event occurrence time rather than ingestion time, apply the governed reporting time zone, exclude invalidated events and non-learner accounts, and finalize results after the late-arrival window.

Business Use Case: |
  The Chief Product Officer and Learning Experience Product team review this rate by institution, course, cohort, and learner tenure each week. If the rate falls below the warning threshold for newly enrolled learners, the team can investigate onboarding friction, content availability, notification delivery, and platform reliability, then launch targeted reminders or course-design interventions and measure whether engagement recovers in subsequent weeks.



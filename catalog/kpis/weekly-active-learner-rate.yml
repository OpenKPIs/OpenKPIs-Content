KPI Name: Weekly Active Learner Rate
Formula: (Distinct eligible learners with at least one qualifying learning activity during the week / Distinct learners eligible for learning access during any part of the same week) × 100

Description: |
  Measures the percentage of eligible learners who perform at least one qualifying learning activity during a defined calendar week. It shows how effectively the available learner population is engaging with educational content, assessments, assignments, or instructor-led learning.

Category: Engagement

Tags: [kpi]

Industry: [EdTech & E-Learning]

Priority: High

Core Area: Engagement

Scope: User

Measure Type: rate

Aggregation Window: Time based - Weekly


  -- ==========================================
  -- 1. GOOGLE BIGQUERY SQL
  -- ==========================================
  WITH ga4_event_parameters AS (
    SELECT
      PARSE_DATE('%Y%m%d', event_date) AS ga4_partition_date,
      event_name,
      event_timestamp AS ga4_event_timestamp,
      user_pseudo_id AS ga4_user_pseudo_id,
      MAX(IF(ep.key = 'event_id', ep.value.string_value, NULL)) AS event_id,
      MAX(IF(ep.key = 'event_timestamp', ep.value.string_value, NULL)) AS event_timestamp,
      MAX(IF(ep.key = 'event_date', ep.value.string_value, NULL)) AS event_date,
      MAX(IF(ep.key = 'calendar_week_id', ep.value.string_value, NULL)) AS calendar_week_id,
      MAX(IF(ep.key = 'week_start_date', ep.value.string_value, NULL)) AS week_start_date,
      MAX(IF(ep.key = 'week_end_date', ep.value.string_value, NULL)) AS week_end_date,
      MAX(IF(ep.key = 'reporting_timezone', ep.value.string_value, NULL)) AS reporting_timezone,
      MAX(IF(ep.key = 'learner_id', ep.value.string_value, NULL)) AS learner_id,
      MAX(IF(ep.key = 'user_pseudo_id', ep.value.string_value, NULL)) AS parameter_user_pseudo_id,
      MAX(IF(ep.key = 'identity_namespace', ep.value.string_value, NULL)) AS identity_namespace,
      MAX(IF(ep.key = 'login_status', ep.value.string_value, NULL)) AS login_status,
      MAX(IF(ep.key = 'eligibility_status', ep.value.string_value, NULL)) AS eligibility_status,
      MAX(IF(ep.key = 'eligibility_start_date', ep.value.string_value, NULL)) AS eligibility_start_date,
      MAX(IF(ep.key = 'eligibility_end_date', ep.value.string_value, NULL)) AS eligibility_end_date,
      MAX(IF(ep.key = 'population_segment', ep.value.string_value, NULL)) AS population_segment,
      MAX(IF(ep.key = 'organization_id', ep.value.string_value, NULL)) AS organization_id,
      MAX(IF(ep.key = 'institution_id', ep.value.string_value, NULL)) AS institution_id,
      MAX(IF(ep.key = 'account_id', ep.value.string_value, NULL)) AS account_id,
      MAX(IF(ep.key = 'subscription_id', ep.value.string_value, NULL)) AS subscription_id,
      MAX(IF(ep.key = 'enrollment_id', ep.value.string_value, NULL)) AS enrollment_id,
      MAX(IF(ep.key = 'course_id', ep.value.string_value, NULL)) AS course_id,
      MAX(IF(ep.key = 'course_name', ep.value.string_value, NULL)) AS course_name,
      MAX(IF(ep.key = 'course_category', ep.value.string_value, NULL)) AS course_category,
      MAX(IF(ep.key = 'program_id', ep.value.string_value, NULL)) AS program_id,
      MAX(IF(ep.key = 'item_id', ep.value.string_value, NULL)) AS item_id,
      MAX(IF(ep.key = 'content_type', ep.value.string_value, NULL)) AS content_type,
      MAX(IF(ep.key = 'activity_id', ep.value.string_value, NULL)) AS activity_id,
      MAX(IF(ep.key = 'activity_type', ep.value.string_value, NULL)) AS activity_type,
      MAX(IF(ep.key = 'activity_name', ep.value.string_value, NULL)) AS activity_name,
      MAX(IF(ep.key = 'activity_status', ep.value.string_value, NULL)) AS activity_status,
      MAX(IF(ep.key = 'qualifying_activity', COALESCE(ep.value.string_value, CAST(ep.value.int_value AS STRING)), NULL)) AS qualifying_activity,
      MAX(IF(ep.key = 'engagement_seconds', COALESCE(CAST(ep.value.int_value AS STRING), CAST(ep.value.double_value AS STRING), ep.value.string_value), NULL)) AS engagement_seconds,
      MAX(IF(ep.key = 'progress_percent', COALESCE(CAST(ep.value.int_value AS STRING), CAST(ep.value.double_value AS STRING), ep.value.string_value), NULL)) AS progress_percent,
      MAX(IF(ep.key = 'score', COALESCE(CAST(ep.value.int_value AS STRING), CAST(ep.value.double_value AS STRING), ep.value.string_value), NULL)) AS score,
      MAX(IF(ep.key = 'attempt_number', COALESCE(CAST(ep.value.int_value AS STRING), ep.value.string_value), NULL)) AS attempt_number,
      MAX(IF(ep.key = 'instructor_led', COALESCE(ep.value.string_value, CAST(ep.value.int_value AS STRING)), NULL)) AS instructor_led,
      MAX(IF(ep.key = 'session_id', ep.value.string_value, NULL)) AS session_id,
      MAX(IF(ep.key = 'virtual_classroom_id', ep.value.string_value, NULL)) AS virtual_classroom_id,
      MAX(IF(ep.key = 'delivery_mode', ep.value.string_value, NULL)) AS delivery_mode,
      MAX(IF(ep.key = 'platform', ep.value.string_value, NULL)) AS platform,
      MAX(IF(ep.key = 'device_category', ep.value.string_value, NULL)) AS device_category,
      MAX(IF(ep.key = 'operating_system', ep.value.string_value, NULL)) AS operating_system,
      MAX(IF(ep.key = 'browser', ep.value.string_value, NULL)) AS browser,
      MAX(IF(ep.key = 'page_location', ep.value.string_value, NULL)) AS page_location,
      MAX(IF(ep.key = 'page_referrer', ep.value.string_value, NULL)) AS page_referrer,
      MAX(IF(ep.key = 'country', ep.value.string_value, NULL)) AS country,
      MAX(IF(ep.key = 'region', ep.value.string_value, NULL)) AS region,
      MAX(IF(ep.key = 'language', ep.value.string_value, NULL)) AS language,
      MAX(IF(ep.key = 'analytics_storage_consent', ep.value.string_value, NULL)) AS analytics_storage_consent,
      MAX(IF(ep.key = 'source_system', ep.value.string_value, NULL)) AS source_system,
      MAX(IF(ep.key = 'eligibility_snapshot_id', ep.value.string_value, NULL)) AS eligibility_snapshot_id
    FROM `your-project.analytics_123456789.events_*` AS events
    LEFT JOIN UNNEST(events.event_params) AS ep
    WHERE _TABLE_SUFFIX BETWEEN FORMAT_DATE('%Y%m%d', @start_date)
                            AND FORMAT_DATE('%Y%m%d', @end_date)
      AND event_name IN ('select_content', 'view_item')
    GROUP BY
      ga4_partition_date,
      event_name,
      ga4_event_timestamp,
      ga4_user_pseudo_id
  ),
  normalized_events AS (
    SELECT
      COALESCE(NULLIF(event_id, ''), CONCAT('ga4-', CAST(ga4_event_timestamp AS STRING), '-', COALESCE(learner_id, ga4_user_pseudo_id))) AS event_id,
      COALESCE(SAFE_CAST(event_timestamp AS TIMESTAMP), TIMESTAMP_MICROS(ga4_event_timestamp)) AS event_timestamp,
      COALESCE(SAFE_CAST(event_date AS DATE), ga4_partition_date) AS event_date,
      calendar_week_id,
      COALESCE(SAFE_CAST(week_start_date AS DATE), DATE_TRUNC(COALESCE(SAFE_CAST(event_date AS DATE), ga4_partition_date), WEEK(MONDAY))) AS week_start_date,
      COALESCE(SAFE_CAST(week_end_date AS DATE), DATE_ADD(DATE_TRUNC(COALESCE(SAFE_CAST(event_date AS DATE), ga4_partition_date), WEEK(MONDAY)), INTERVAL 6 DAY)) AS week_end_date,
      COALESCE(NULLIF(reporting_timezone, ''), 'UTC') AS reporting_timezone,
      learner_id,
      COALESCE(NULLIF(parameter_user_pseudo_id, ''), ga4_user_pseudo_id) AS user_pseudo_id,
      identity_namespace,
      login_status,
      eligibility_status,
      SAFE_CAST(eligibility_start_date AS DATE) AS eligibility_start_date,
      SAFE_CAST(eligibility_end_date AS DATE) AS eligibility_end_date,
      population_segment,
      organization_id,
      institution_id,
      account_id,
      subscription_id,
      enrollment_id,
      course_id,
      course_name,
      course_category,
      program_id,
      item_id,
      content_type,
      activity_id,
      activity_type,
      activity_name,
      activity_status,
      LOWER(qualifying_activity) IN ('true', '1') AS qualifying_activity,
      SAFE_CAST(engagement_seconds AS INT64) AS engagement_seconds,
      SAFE_CAST(progress_percent AS NUMERIC) AS progress_percent,
      SAFE_CAST(score AS NUMERIC) AS score,
      SAFE_CAST(attempt_number AS INT64) AS attempt_number,
      LOWER(instructor_led) IN ('true', '1') AS instructor_led,
      session_id,
      NULLIF(virtual_classroom_id, '') AS virtual_classroom_id,
      delivery_mode,
      platform,
      device_category,
      operating_system,
      browser,
      page_location,
      page_referrer,
      country,
      region,
      language,
      analytics_storage_consent,
      source_system,
      eligibility_snapshot_id,
      event_name
    FROM ga4_event_parameters
  ),
  deduplicated_events AS (
    SELECT * EXCEPT(event_deduplication_rank)
    FROM (
      SELECT
        normalized_events.*,
        ROW_NUMBER() OVER (PARTITION BY event_id ORDER BY event_timestamp) AS event_deduplication_rank
      FROM normalized_events
    )
    WHERE event_deduplication_rank = 1
  ),
  active_learners AS (
    SELECT DISTINCT
      week_start_date,
      learner_id
    FROM deduplicated_events
    WHERE learner_id IS NOT NULL
      AND login_status = 'authenticated'
      AND qualifying_activity
      AND week_start_date BETWEEN DATE_TRUNC(@start_date, WEEK(MONDAY))
                              AND DATE_TRUNC(@end_date, WEEK(MONDAY))
  ),
  eligible_population AS (
    SELECT DISTINCT
      snapshot.week_start_date,
      snapshot.week_end_date,
      snapshot.calendar_week_id,
      snapshot.learner_id,
      snapshot.population_segment,
      snapshot.organization_id,
      snapshot.institution_id,
      snapshot.account_id
    FROM `your-project.learning_dw.learner_eligibility_weekly_snapshot` AS snapshot
    WHERE snapshot.week_start_date BETWEEN DATE_TRUNC(@start_date, WEEK(MONDAY))
                                       AND DATE_TRUNC(@end_date, WEEK(MONDAY))
      AND snapshot.eligibility_status = 'eligible'
      AND snapshot.learner_id IS NOT NULL
      AND snapshot.week_start_date BETWEEN snapshot.eligibility_start_date
                                       AND COALESCE(snapshot.eligibility_end_date, DATE '9999-12-31')
  ),
  learner_week_population AS (
    SELECT
      eligible.week_start_date,
      eligible.week_end_date,
      eligible.calendar_week_id,
      eligible.population_segment,
      eligible.organization_id,
      eligible.institution_id,
      eligible.account_id,
      eligible.learner_id,
      active.learner_id IS NOT NULL AS is_weekly_active_learner
    FROM eligible_population AS eligible
    LEFT JOIN active_learners AS active
      ON active.week_start_date = eligible.week_start_date
     AND active.learner_id = eligible.learner_id
  )
  SELECT
    week_start_date,
    week_end_date,
    calendar_week_id,
    population_segment,
    organization_id,
    institution_id,
    account_id,
    COUNT(DISTINCT learner_id) AS eligible_learners,
    COUNT(DISTINCT IF(is_weekly_active_learner, learner_id, NULL)) AS weekly_active_learners,
    SAFE_DIVIDE(
      COUNT(DISTINCT IF(is_weekly_active_learner, learner_id, NULL)),
      COUNT(DISTINCT learner_id)
    ) AS weekly_active_learner_rate,
    100 * SAFE_DIVIDE(
      COUNT(DISTINCT IF(is_weekly_active_learner, learner_id, NULL)),
      COUNT(DISTINCT learner_id)
    ) AS weekly_active_learner_rate_percent
  FROM learner_week_population
  GROUP BY
    week_start_date,
    week_end_date,
    calendar_week_id,
    population_segment,
    organization_id,
    institution_id,
    account_id
  ORDER BY
    week_start_date,
    population_segment,
    organization_id,
    institution_id,
    account_id;


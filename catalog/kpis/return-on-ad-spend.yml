KPI Name: Return on Ad Spend
Formula: Attributed Purchase Revenue from Paid Media / Paid Media Ad Spend

Description: |
  Purchase revenue attributed to paid media channels and campaigns divided by the media cost incurred to generate it over the same period, expressed as revenue returned per unit of currency spent (e.g. 4.2 = 4.20 in revenue per 1.00 of spend). It is the primary efficiency lens for allocating and pacing paid search, paid social, shopping and display budgets, and it is only comparable across channels when revenue is attributed under one model and lookback window and cost is normalised to the same currency and date basis.

Category: Acquisition

Tags: [kpi, E-commerce: Top-of-Funnel & Marketing Acquisition]

Industry: [["E-commerce"]]

Priority: High

Core Area: Monetization

Scope: Global

Measure Type: Ratio

Aggregation Window: Daily, Weekly, Monthly


KPI Name: Product List Conversion Rate
Formula: (Purchases of items selected from the product list / Product list views) × 100

Description: |
  Share of product list views (category, collection, search and recommendation lists) that end in a purchase of an item selected from that list. Ranks listings by what they sell, not by clicks.

Category: Conversion


























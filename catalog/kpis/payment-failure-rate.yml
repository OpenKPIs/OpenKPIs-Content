KPI Name: Payment Failure Rate
Formula: (Failed Payment Attempts / (Successful Payment Attempts + Failed Payment Attempts)) × 100

Description: |
  Payment Failure Rate is the share of payment attempts submitted at checkout that are declined by the issuer or acquirer, or that error out in the gateway, before an order is confirmed. It isolates payment-layer revenue loss from the rest of checkout abandonment, so the business can separate friction it can fix in the form from declines it must fix with routing, retries or additional payment methods.

Category: Conversion


























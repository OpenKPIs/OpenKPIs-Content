KPI Name: Cost per Occupied Room
Formula: Σ Eligible Room Operating Costs Recognized in Period ÷ Σ Occupied Room-Nights in Same Period

Description: |
  Measures the average eligible room-operating cost incurred for each physically occupied room-night during the reporting period. It aligns recognized operating expenses with actual occupancy to show how efficiently a property converts labor, supplies, services, and approved allocations into serviced stays.

Category: Efficiency

Tags: [kpi]

Industry: [Travel & Hospitality]

Priority: High

Core Area: Generic

Scope: Item

Measure Type: currency

Aggregation Window: Time based - Daily/Monthly/Yearly (monthly financial close is authoritative)









Calculation Notes: |
  1️⃣ Align numerator and denominator to the property's business date and the same accounting period.
  2️⃣ Count one occupied room-night for each room physically occupied overnight, including complimentary stays but excluding house-use rooms unless policy explicitly includes them.
  3️⃣ Include approved rooms-department payroll, benefits, housekeeping supplies, laundry, guest amenities, contracted services, and consistently allocated utilities.
  4️⃣ Exclude capital expenditure, depreciation, interest, income tax, corporate overhead, distribution commissions, cancellations, no-shows, and refunds unless included in a governed metric variant.
  5️⃣ Exclude out-of-order and out-of-service rooms from the denominator because they were not occupied; do not treat unavailable inventory as occupied demand.
  6️⃣ Return null rather than zero when occupied room-nights equal zero, and prohibit averaging property-level CPOR values without denominator weighting.
  7️⃣ Treat daily values as provisional when costs are allocated from monthly postings; restate historical results after financial close, accruals, or late PMS corrections.

Business Use Case: |
  A regional chief operating officer reviews CPOR by property, room type, and cost component against budget and prior year. When a property exceeds its target by more than 10%, Finance and Hotel Operations isolate whether the variance is driven by labor productivity, laundry contracts, guest supplies, utilities, or low occupancy, then adjust staffing schedules, procurement terms, service frequency, or operating procedures without compromising guest-experience targets.


Source Data: Digital + Offline data (omnichannel stitched): digital booking and commerce telemetry + Property Management System occupied-room-night records + ERP/General Ledger expense postings + workforce management, procurement, laundry, and utility systems


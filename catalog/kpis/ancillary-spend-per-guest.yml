Calculation Notes: |
  1️⃣ Include only ancillary purchases originating through owned or approved digital channels, including website, mobile application, digital kiosk, and authenticated self-service flows.
  2️⃣ Count each resolved guest once per fulfilled trip, stay, sailing, or equivalent service instance; do not use sessions, visitors, purchasers, or reservations as substitutes for guests.
  3️⃣ Use net ancillary spend after discounts, cancellations, refunds, chargebacks, taxes collected on behalf of authorities, and pass-through statutory fees.
  4️⃣ Include pre-arrival, booking-path, post-booking, and in-service digital purchases when they can be linked to the eligible fulfilled booking or guest service instance.
  5️⃣ Exclude core fare or room revenue, complimentary items, loyalty-point-only redemptions, employee transactions, test orders, fraudulent orders, and unfulfilled bookings.
  6️⃣ Convert transaction currencies into the enterprise reporting currency using the approved finance exchange rate for the transaction date; apply refund rates from the original transaction when available.
  7️⃣ If the eligible guest count is zero, return null rather than zero; late refunds and booking-status changes must restate the original service-period result.

Business Use Case: |
  Revenue Management compares Ancillary Spend per Guest by digital journey, device, loyalty tier, destination, property or route, and ancillary category to identify under-monetized guest cohorts. For example, if mobile-app guests show strong seat-selection attachment but low baggage spend, the digital commerce team can adjust offer sequencing, eligibility logic, bundles, and personalized merchandising while Finance monitors the resulting net spend and refund impact.



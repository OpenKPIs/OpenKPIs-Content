KPI Name: Ancillary Spend per Guest
Formula: Sum of Net Digital Ancillary Spend for Fulfilled Bookings / Count of Distinct Eligible Guests on Fulfilled Digital Bookings

Description: |
  Measures the average net amount spent on digitally purchased ancillary products and services for each eligible guest associated with a fulfilled digital booking during the reporting period. It quantifies ancillary monetization across items such as baggage, seat selection, upgrades, dining, activities, connectivity, transportation, and other non-core travel or hospitality offerings.

Category: Revenue

Tags: [kpi]

Industry: [Travel & Hospitality]

Priority: High

Core Area: Monetization

Scope: User

Measure Type: average

Aggregation Window: Time based - Daily/Monthly/Yearly


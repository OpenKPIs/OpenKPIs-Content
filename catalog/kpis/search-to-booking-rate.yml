Google Analytics SQL: |
  -- ==========================================
  -- 1. GOOGLE BIGQUERY SQL
  -- ==========================================
  WITH source_events AS (
    SELECT
      event_name,
      TIMESTAMP_MICROS(event_timestamp) AS collected_event_timestamp,
      user_id,
      user_pseudo_id,
      privacy_info.analytics_storage AS analytics_storage,
      platform,
      device.category AS device_category,
      geo.country AS country,
      ecommerce.transaction_id AS ecommerce_transaction_id,
      ecommerce.purchase_revenue AS ecommerce_purchase_revenue,
      ecommerce.tax_value AS ecommerce_tax_value,
      ecommerce.shipping_value AS ecommerce_fees,
      (SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'event_id' LIMIT 1) AS event_id,
      (SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'event_timestamp' LIMIT 1) AS event_timestamp_string,
      (SELECT COALESCE(value.string_value, CAST(value.int_value AS STRING)) FROM UNNEST(event_params) WHERE key = 'session_id' LIMIT 1) AS session_id,
      (SELECT value.int_value FROM UNNEST(event_params) WHERE key = 'session_number' LIMIT 1) AS session_number,
      (SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'anonymous_id' LIMIT 1) AS anonymous_id,
      (SELECT COALESCE(value.string_value, CAST(value.int_value AS STRING)) FROM UNNEST(event_params) WHERE key = 'analytics_consent' LIMIT 1) AS analytics_consent_raw,
      (SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'page_title' LIMIT 1) AS page_title,
      (SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'page_location' LIMIT 1) AS page_location,
      (SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'page_referrer' LIMIT 1) AS page_referrer,
      (SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'site_section' LIMIT 1) AS site_section,
      (SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'language' LIMIT 1) AS language,
      (SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'search_id' LIMIT 1) AS search_id,
      (SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'search_timestamp' LIMIT 1) AS search_timestamp_string,
      (SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'search_term' LIMIT 1) AS search_term,
      (SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'search_type' LIMIT 1) AS search_type,
      (SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'search_origin' LIMIT 1) AS search_origin,
      (SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'search_destination' LIMIT 1) AS search_destination,
      (SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'search_departure_date' LIMIT 1) AS search_departure_date,
      (SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'search_return_date' LIMIT 1) AS search_return_date,
      (SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'search_trip_type' LIMIT 1) AS search_trip_type,
      (SELECT value.int_value FROM UNNEST(event_params) WHERE key = 'search_passenger_count' LIMIT 1) AS search_passenger_count,
      (SELECT value.int_value FROM UNNEST(event_params) WHERE key = 'search_adult_count' LIMIT 1) AS search_adult_count,
      (SELECT value.int_value FROM UNNEST(event_params) WHERE key = 'search_child_count' LIMIT 1) AS search_child_count,
      (SELECT value.int_value FROM UNNEST(event_params) WHERE key = 'search_infant_count' LIMIT 1) AS search_infant_count,
      (SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'search_cabin_class' LIMIT 1) AS search_cabin_class,
      (SELECT value.int_value FROM UNNEST(event_params) WHERE key = 'search_results_count' LIMIT 1) AS search_results_count,
      (SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'search_filters' LIMIT 1) AS search_filters,
      (SELECT COALESCE(value.string_value, CAST(value.int_value AS STRING)) FROM UNNEST(event_params) WHERE key = 'valid_search' LIMIT 1) AS valid_search_raw,
      (SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'transaction_id' LIMIT 1) AS parameter_transaction_id,
      (SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'confirmation_number' LIMIT 1) AS confirmation_number,
      (SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'booking_status' LIMIT 1) AS booking_status,
      (SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'booking_timestamp' LIMIT 1) AS booking_timestamp_string,
      (SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'currency' LIMIT 1) AS currency,
      (SELECT COALESCE(value.double_value, CAST(value.int_value AS FLOAT64), CAST(value.float_value AS FLOAT64)) FROM UNNEST(event_params) WHERE key IN ('value', 'total') LIMIT 1) AS parameter_total,
      (SELECT COALESCE(value.double_value, CAST(value.int_value AS FLOAT64), CAST(value.float_value AS FLOAT64)) FROM UNNEST(event_params) WHERE key = 'tax' LIMIT 1) AS parameter_tax,
      (SELECT COALESCE(value.double_value, CAST(value.int_value AS FLOAT64), CAST(value.float_value AS FLOAT64)) FROM UNNEST(event_params) WHERE key IN ('fees', 'shipping') LIMIT 1) AS parameter_fees,
      (SELECT COALESCE(value.double_value, CAST(value.int_value AS FLOAT64), CAST(value.float_value AS FLOAT64)) FROM UNNEST(event_params) WHERE key = 'discount' LIMIT 1) AS discount,
      (SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'coupon' LIMIT 1) AS coupon,
      (SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'payment_type' LIMIT 1) AS payment_type,
      (SELECT item_id FROM UNNEST(items) ORDER BY item_list_index LIMIT 1) AS item_id,
      (SELECT item_name FROM UNNEST(items) ORDER BY item_list_index LIMIT 1) AS item_name,
      (SELECT item_category FROM UNNEST(items) ORDER BY item_list_index LIMIT 1) AS item_category,
      (SELECT item_brand FROM UNNEST(items) ORDER BY item_list_index LIMIT 1) AS item_brand,
      (SELECT quantity FROM UNNEST(items) ORDER BY item_list_index LIMIT 1) AS item_quantity
    FROM `your-project.analytics_123456789.events_*`
    WHERE _TABLE_SUFFIX BETWEEN FORMAT_DATE('%Y%m%d', DATE_SUB(CURRENT_DATE(), INTERVAL 60 DAY))
                            AND FORMAT_DATE('%Y%m%d', DATE_SUB(CURRENT_DATE(), INTERVAL 1 DAY))
      AND event_name IN ('search', 'purchase')
  ),
  normalized_events AS (
    SELECT
      *,
      COALESCE(SAFE_CAST(event_timestamp_string AS TIMESTAMP), collected_event_timestamp) AS event_timestamp,
      COALESCE(SAFE_CAST(search_timestamp_string AS TIMESTAMP), collected_event_timestamp) AS search_timestamp,
      COALESCE(SAFE_CAST(booking_timestamp_string AS TIMESTAMP), collected_event_timestamp) AS booking_timestamp,
      COALESCE(NULLIF(anonymous_id, ''), user_pseudo_id) AS resolved_anonymous_id,
      CASE
        WHEN LOWER(COALESCE(analytics_consent_raw, analytics_storage)) IN ('true', '1', 'yes', 'y', 'granted') THEN TRUE
        ELSE FALSE
      END AS analytics_consent,
      CASE
        WHEN LOWER(valid_search_raw) IN ('true', '1', 'yes', 'y') THEN TRUE
        WHEN LOWER(valid_search_raw) IN ('false', '0', 'no', 'n') THEN FALSE
        ELSE NULL
      END AS valid_search,
      COALESCE(NULLIF(ecommerce_transaction_id, ''), NULLIF(parameter_transaction_id, '')) AS transaction_id,
      COALESCE(ecommerce_purchase_revenue, parameter_total) AS booking_total,
      COALESCE(ecommerce_tax_value, parameter_tax) AS booking_tax,
      COALESCE(ecommerce_fees, parameter_fees) AS booking_fees
    FROM source_events
  ),
  ranked_searches AS (
    SELECT
      *,
      COALESCE(
        NULLIF(search_id, ''),
        CONCAT('event:', COALESCE(NULLIF(event_id, ''), FORMAT_TIMESTAMP('%Y%m%d%H%M%E6S', event_timestamp))),
        CONCAT('session:', COALESCE(session_id, resolved_anonymous_id), ':', FORMAT_TIMESTAMP('%Y%m%d%H%M%E6S', search_timestamp))
      ) AS search_key,
      ROW_NUMBER() OVER (
        PARTITION BY COALESCE(
          NULLIF(search_id, ''),
          CONCAT('event:', COALESCE(NULLIF(event_id, ''), FORMAT_TIMESTAMP('%Y%m%d%H%M%E6S', event_timestamp))),
          CONCAT('session:', COALESCE(session_id, resolved_anonymous_id), ':', FORMAT_TIMESTAMP('%Y%m%d%H%M%E6S', search_timestamp))
        )
        ORDER BY event_timestamp
      ) AS search_row_number
    FROM normalized_events
    WHERE event_name = 'search'
      AND valid_search IS TRUE
      AND analytics_consent IS TRUE
  ),
  searches AS (
    SELECT * EXCEPT(search_row_number)
    FROM ranked_searches
    WHERE search_row_number = 1
  ),
  ranked_purchases AS (
    SELECT
      *,
      ROW_NUMBER() OVER (
        PARTITION BY COALESCE(NULLIF(transaction_id, ''), NULLIF(event_id, ''), CONCAT('purchase:', FORMAT_TIMESTAMP('%Y%m%d%H%M%E6S', event_timestamp)))
        ORDER BY event_timestamp
      ) AS purchase_row_number
    FROM normalized_events
    WHERE event_name = 'purchase'
      AND analytics_consent IS TRUE
      AND LOWER(COALESCE(NULLIF(booking_status, ''), 'confirmed')) = 'confirmed'
  ),
  purchases AS (
    SELECT * EXCEPT(purchase_row_number)
    FROM ranked_purchases
    WHERE purchase_row_number = 1
  ),
  search_booking_matches AS (
    SELECT
      s.*,
      p.transaction_id,
      p.confirmation_number,
      COALESCE(p.booking_status, 'confirmed') AS booking_status,
      p.booking_timestamp,
      p.currency,
      p.booking_total,
      p.booking_tax,
      p.booking_fees,
      p.discount,
      p.coupon,
      p.payment_type,
      p.item_id,
      p.item_name,
      p.item_category,
      p.item_brand,
      p.item_quantity,
      ROW_NUMBER() OVER (
        PARTITION BY s.search_key
        ORDER BY p.booking_timestamp, p.transaction_id
      ) AS match_row_number
    FROM searches s
    LEFT JOIN purchases p
      ON p.search_id = s.search_id
     AND p.booking_timestamp >= s.search_timestamp
     AND p.booking_timestamp < TIMESTAMP_ADD(s.search_timestamp, INTERVAL 30 DAY)
  ),
  search_population AS (
    SELECT
      search_key,
      search_id,
      DATE(search_timestamp) AS search_date,
      search_timestamp,
      search_term,
      search_type,
      search_origin,
      search_destination,
      SAFE_CAST(search_departure_date AS DATE) AS search_departure_date,
      SAFE_CAST(search_return_date AS DATE) AS search_return_date,
      search_trip_type,
      search_passenger_count,
      search_adult_count,
      search_child_count,
      search_infant_count,
      search_cabin_class,
      search_results_count,
      search_filters,
      valid_search,
      event_id,
      event_timestamp,
      session_id,
      session_number,
      user_id,
      resolved_anonymous_id AS anonymous_id,
      analytics_consent,
      page_title,
      page_location,
      page_referrer,
      site_section,
      language,
      platform,
      device_category,
      country,
      transaction_id,
      confirmation_number,
      booking_status,
      booking_timestamp,
      currency,
      booking_total,
      booking_tax,
      booking_fees,
      discount,
      coupon,
      payment_type,
      item_id,
      item_name,
      item_category,
      item_brand,
      item_quantity,
      IF(transaction_id IS NOT NULL, 1, 0) AS is_booked
    FROM search_booking_matches
    WHERE match_row_number = 1
  )
  SELECT
    *,
    COUNT(*) OVER () AS total_valid_searches,
    SUM(is_booked) OVER () AS searches_with_confirmed_booking,
    SAFE_DIVIDE(SUM(is_booked) OVER (), COUNT(*) OVER ()) AS search_to_booking_rate
  FROM search_population
  ORDER BY search_timestamp, search_key;

AEP Query Service SQL: |
  -- ==========================================
  -- 2. ADOBE AEP QUERY SERVICE SQL
  -- ==========================================
  WITH source_events AS (
    SELECT
      eventType AS event_type,
      eventMergeId AS event_id,
      timestamp AS event_timestamp,
      identityMap['CRMID'][0].id AS user_id,
      identityMap['ECID'][0].id AS anonymous_id,
      CASE WHEN LOWER(consents.collect.val) = 'y' THEN TRUE ELSE FALSE END AS analytics_consent,
      _travel.session.sessionId AS session_id,
      _travel.session.sessionNumber AS session_number,
      web.webPageDetails.name AS page_title,
      web.webPageDetails.URL AS page_location,
      web.webReferrer.URL AS page_referrer,
      web.webPageDetails.siteSection AS site_section,
      environment.language AS language,
      environment.type AS platform,
      environment.device.typeID AS device_category,
      placeContext.geo.countryCode AS country,
      _travel.search.searchId AS search_id,
      COALESCE(_travel.search.timestamp, timestamp) AS search_timestamp,
      _travel.search.term AS search_term,
      _travel.search.type AS search_type,
      _travel.search.origin AS search_origin,
      _travel.search.destination AS search_destination,
      CAST(_travel.search.departureDate AS DATE) AS search_departure_date,
      CAST(_travel.search.returnDate AS DATE) AS search_return_date,
      _travel.search.tripType AS search_trip_type,
      _travel.search.passengerCount AS search_passenger_count,
      _travel.search.adultCount AS search_adult_count,
      _travel.search.childCount AS search_child_count,
      _travel.search.infantCount AS search_infant_count,
      _travel.search.cabinClass AS search_cabin_class,
      _travel.search.resultsCount AS search_results_count,
      _travel.search.filters AS search_filters,
      _travel.search.validSearch AS valid_search,
      commerce.order.purchaseID AS transaction_id,
      commerce.order.confirmationNumber AS confirmation_number,
      _travel.booking.status AS booking_status,
      COALESCE(_travel.booking.timestamp, timestamp) AS booking_timestamp,
      commerce.order.currencyCode AS currency,
      commerce.order.priceTotal AS booking_total,
      commerce.order.taxAmount AS booking_tax,
      _travel.booking.fees AS booking_fees,
      commerce.order.discountAmount AS discount,
      commerce.order.couponCode AS coupon,
      commerce.order.payments[0].paymentType AS payment_type,
      commerce.productListItems[0].SKU AS item_id,
      commerce.productListItems[0].name AS item_name,
      commerce.productListItems[0].productCategories[0].categoryID AS item_category,
      commerce.productListItems[0].manufacturer AS item_brand,
      commerce.productListItems[0].quantity AS item_quantity
    FROM aep_analytics_event_dataset
    WHERE timestamp >= CURRENT_TIMESTAMP - INTERVAL '60' DAY
      AND timestamp < DATE_TRUNC('day', CURRENT_TIMESTAMP)
      AND eventType IN ('search', 'commerce.purchases')
  ),
  ranked_searches AS (
    SELECT
      *,
      COALESCE(
        NULLIF(search_id, ''),
        CONCAT('event:', COALESCE(NULLIF(event_id, ''), CAST(event_timestamp AS VARCHAR))),
        CONCAT('session:', COALESCE(session_id, anonymous_id), ':', CAST(search_timestamp AS VARCHAR))
      ) AS search_key,
      ROW_NUMBER() OVER (
        PARTITION BY COALESCE(
          NULLIF(search_id, ''),
          CONCAT('event:', COALESCE(NULLIF(event_id, ''), CAST(event_timestamp AS VARCHAR))),
          CONCAT('session:', COALESCE(session_id, anonymous_id), ':', CAST(search_timestamp AS VARCHAR))
        )
        ORDER BY event_timestamp
      ) AS search_row_number
    FROM source_events
    WHERE event_type = 'search'
      AND valid_search = TRUE
      AND analytics_consent = TRUE
  ),
  searches AS (
    SELECT *
    FROM ranked_searches
    WHERE search_row_number = 1
  ),
  ranked_purchases AS (
    SELECT
      *,
      ROW_NUMBER() OVER (
        PARTITION BY COALESCE(NULLIF(transaction_id, ''), NULLIF(event_id, ''), CONCAT('purchase:', CAST(event_timestamp AS VARCHAR)))
        ORDER BY event_timestamp
      ) AS purchase_row_number
    FROM source_events
    WHERE event_type = 'commerce.purchases'
      AND analytics_consent = TRUE
      AND LOWER(COALESCE(NULLIF(booking_status, ''), 'confirmed')) = 'confirmed'
  ),
  purchases AS (
    SELECT *
    FROM ranked_purchases
    WHERE purchase_row_number = 1
  ),
  search_booking_matches AS (
    SELECT
      s.search_key,
      s.search_id,
      CAST(s.search_timestamp AS DATE) AS search_date,
      s.search_timestamp,
      s.search_term,
      s.search_type,
      s.search_origin,
      s.search_destination,
      s.search_departure_date,
      s.search_return_date,
      s.search_trip_type,
      s.search_passenger_count,
      s.search_adult_count,
      s.search_child_count,
      s.search_infant_count,
      s.search_cabin_class,
      s.search_results_count,
      s.search_filters,
      s.valid_search,
      s.event_id,
      s.event_timestamp,
      s.session_id,
      s.session_number,
      s.user_id,
      s.anonymous_id,
      s.analytics_consent,
      s.page_title,
      s.page_location,
      s.page_referrer,
      s.site_section,
      s.language,
      s.platform,
      s.device_category,
      s.country,
      p.transaction_id,
      p.confirmation_number,
      COALESCE(p.booking_status, 'confirmed') AS booking_status,
      p.booking_timestamp,
      p.currency,
      p.booking_total,
      p.booking_tax,
      p.booking_fees,
      p.discount,
      p.coupon,
      p.payment_type,
      p.item_id,
      p.item_name,
      p.item_category,
      p.item_brand,
      p.item_quantity,
      ROW_NUMBER() OVER (
        PARTITION BY s.search_key
        ORDER BY p.booking_timestamp, p.transaction_id
      ) AS match_row_number
    FROM searches s
    LEFT JOIN purchases p
      ON p.search_id = s.search_id
     AND p.booking_timestamp >= s.search_timestamp
     AND p.booking_timestamp < s.search_timestamp + INTERVAL '30' DAY
  ),
  search_population AS (
    SELECT
      search_key,
      search_id,
      search_date,
      search_timestamp,
      search_term,
      search_type,
      search_origin,
      search_destination,
      search_departure_date,
      search_return_date,
      search_trip_type,
      search_passenger_count,
      search_adult_count,
      search_child_count,
      search_infant_count,
      search_cabin_class,
      search_results_count,
      search_filters,
      valid_search,
      event_id,
      event_timestamp,
      session_id,
      session_number,
      user_id,
      anonymous_id,
      analytics_consent,
      page_title,
      page_location,
      page_referrer,
      site_section,
      language,
      platform,
      device_category,
      country,
      transaction_id,
      confirmation_number,
      booking_status,
      booking_timestamp,
      currency,
      booking_total,
      booking_tax,
      booking_fees,
      discount,
      coupon,
      payment_type,
      item_id,
      item_name,
      item_category,
      item_brand,
      item_quantity,
      CASE WHEN transaction_id IS NOT NULL THEN 1 ELSE 0 END AS is_booked
    FROM search_booking_matches
    WHERE match_row_number = 1
  )
  SELECT
    *,
    COUNT(*) OVER () AS total_valid_searches,
    SUM(is_booked) OVER () AS searches_with_confirmed_booking,
    CAST(SUM(is_booked) OVER () AS DOUBLE) / NULLIF(COUNT(*) OVER (), 0) AS search_to_booking_rate
  FROM search_population
  ORDER BY search_timestamp, search_key;

Calculation Notes: |
  1️⃣ Count each eligible digital session once in the denominator.  
  2️⃣ Count a session in the numerator only for confirmed bookings after a qualifying search.  
  3️⃣ Exclude bookings before the first search, in later sessions, or without observable searches.  
  4️⃣ A qualifying search must meet minimum parameters (destination, travel dates, occupancy).  
  5️⃣ Apply a 30-minute inactivity timeout unless specified otherwise.  
  6️⃣ Exclude bots, synthetic monitoring, employees, malformed events, and canceled attempts.  
  7️⃣ Assign sessions crossing midnight to the date of the qualifying search for attribution.

Business Use Case: |
  The Digital Commerce organization monitors this rate by device, market, destination, search-result state, and acquisition channel to identify high-intent journeys that fail to convert. A material decline on mobile web after a search-results release would trigger funnel diagnostics across availability quality, pricing presentation, property selection, checkout transitions, and booking-confirmation instrumentation, enabling product leaders to prioritize remediation based on affected search volume and revenue opportunity.



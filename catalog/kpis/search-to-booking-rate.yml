KPI Name: Search-to-Booking Rate
Formula: (Distinct Eligible Digital Sessions with a Qualifying Search Followed by a Confirmed Booking / Distinct Eligible Digital Sessions with at Least One Qualifying Search) × 100

Description: |
  Measures the percentage of eligible digital sessions containing at least one valid travel search that subsequently produce a confirmed booking within the same session. It quantifies how effectively the digital search and booking journey converts demonstrated travel intent into completed reservations.

Category: Conversion

Tags: [kpi]

Industry: [Travel & Hospitality]

Priority: High

Core Area: Discovery

Scope: Session

Measure Type: rate

Aggregation Window: Time based - Daily


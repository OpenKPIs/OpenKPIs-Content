KPI Name: Test KPI 123
Formula: (Completed Actions / Total Sessions) × 100

Description: |
  Measures the rate at which users complete a specific action during a session, indicating conversion effectiveness.

Category: Conversion

Tags: [kpi]

Industry: [Retail]

Priority: High

Core Area: Generic

Scope: Session

Measure Type: percentage

Aggregation Window: Time based - Daily

GA4 Event: |
  conversion

Adobe Event: |
  conversion

W3 Data Layer: |
  {"event":"conversion","eventInfo":{"type":"conversion","action":"complete_action","eventName":"Test KPI 123"}}

GA4 Data Layer: |
  {"event":"conversion","eventParams":{"event_name":"Test KPI 123","conversion_type":"complete_action"}}

Adobe Client Data Layer: |
  {"event":"conversion","eventData":{"eventName":"Test KPI 123","conversionType":"complete_action"}}

XDM Mapping: |
  {"_experience":{"analytics":{"event1":{"name":"Test KPI 123","type":"conversion","action":"complete_action"}}}}

Google Analytics SQL: |
  -- ==========================================
  -- 1. GOOGLE BIGQUERY SQL
  -- ==========================================
  SELECT COUNT(*) AS test_kpi_123_count
  FROM `your-project.analytics_123456789.events_*`
  WHERE event_name = 'conversion'
  AND (eventParams.event_name = 'Test KPI 123' AND eventParams.conversion_type = 'complete_action')

AEP Query Service SQL: |
  -- ==========================================
  -- 2. ADOBE AEP QUERY SERVICE SQL
  -- ==========================================
  SELECT COUNT(*) AS test_kpi_123_count
  FROM aep_backend_dataset
  WHERE event = 'conversion'
  AND (eventData.eventName = 'Test KPI 123' AND eventData.conversionType = 'complete_action')

Calculation Notes: |
  Excludes sessions with less than 2 page views; session timeout set at 30 minutes.

Business Use Case: |
  Executives use this KPI to assess the effectiveness of marketing campaigns in driving user actions.



# KPI: Customer Reactivation Rate
# Generated: 2026-09-19T18:20:54.450Z
# Contributed by: devyendarm


KPI Name: Customer Reactivation Rate
Formula: (Lapsed Customers at Period Start Who Place ≥ 1 Valid Order During the Period / Total Lapsed Customers at Period Start) × 100

Description: |
  E-commerce specialisation of the canonical reactivation concept (Viewer Reactivation Rate measures returning content consumption; this KPI measures a returning purchase recorded on the orders tables): the share of customers who were lapsed at the start of the period, meaning no purchase within the defined lapse window, and who went on to place at least one valid order during the period. Measured against the full lapsed base rather than only customers reached by a win-back campaign, it shows how much of the dormant file the business actually recovers and is the main outcome metric for win-back programmes, lifecycle CRM and reactivation offers.

Category: Retention


























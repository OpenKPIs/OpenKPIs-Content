SQL Query: |
  WITH session_pageviews AS (
    SELECT
      user_pseudo_id,
      CONCAT(user_pseudo_id, '-', CAST((SELECT value.int_value FROM UNNEST(event_params) WHERE key = 'ga_session_id') AS STRING)) AS session_id,
      COUNTIF(event_name = 'page_view') AS page_views
    FROM `project.dataset.events_*`
    WHERE _TABLE_SUFFIX BETWEEN '20250101' AND '20250131'
    GROUP BY 1, 2
  ), valid_sessions AS (
    SELECT session_id, page_views
    FROM session_pageviews
    WHERE session_id IS NOT NULL
  )
  SELECT
    SAFE_DIVIDE(SUM(page_views), COUNT(DISTINCT session_id)) AS pages_per_session
  FROM valid_sessions;

Calculation Notes: |
  1) Use page_view events only; 
  2) Do not include screen_view unless intentionally creating a combined pages/screens per session KPI. Exclude bot/internal traffic where possible. 
  3) Ensure sessions with zero page_view events are handled consistently; in GA4, sessions can exist from non-page events, so decide whether to include all sessions or only sessions containing at least one page_view. 
  4) For SPA implementations, verify virtual page views are fired correctly to avoid undercounting. If using Adobe, align on whether repeated reloads count as page views.

Business Use Case: |
  A content team monitors pages per session by landing page and traffic source. If paid social traffic has low pages per session compared with organic search, the team can improve landing page internal linking, content recommendations, or audience targeting to increase on-site exploration.


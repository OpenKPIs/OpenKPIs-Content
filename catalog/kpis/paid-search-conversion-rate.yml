# KPI: Paid Search Conversion Rate
# Generated: 2026-09-15T13:51:37.687Z
# Contributed by: devyendarm
# Last modified by: devyendarm

KPI Name: Paid Search Conversion Rate
Formula: (Paid Search Sessions with ≥ 1 purchase / Total Paid Search Sessions) × 100

Description: |
  E-commerce specialisation of Conversion Rate: the percentage of Paid Search sessions (GA4 session default channel group "Paid Search", i.e. a cpc/ppc medium from a search-engine source; Paid Shopping, Display, Paid Video and Performance Max Cross-network traffic excluded) that contain at least one completed purchase, measured against all Paid Search sessions in the period. It is the core on-site efficiency signal for Google Ads and Microsoft Advertising spend, separating the quality of keyword and query traffic from post-click experience issues; the gclid is only the join key when reconciling to Google Ads clicks and never assigns the channel.

Category: Acquisition

Tags: [kpi, E-commerce: Top-of-Funnel & Marketing Acquisition]

Industry: [["E-commerce"]]

Priority: High

Core Area: Discovery

Scope: Session

Measure Type: Percentage

Aggregation Window: Daily, Weekly, Monthly

GA4 Event: |
  purchase

Adobe Event: |
  purchase


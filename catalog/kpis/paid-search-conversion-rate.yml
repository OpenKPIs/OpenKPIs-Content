# KPI: Paid Search Conversion Rate
# Generated: 2026-09-13T22:53:59.245Z
# Contributed by: devyendarm


KPI Name: Paid Search Conversion Rate
Formula: (Paid Search Sessions with ≥ 1 purchase / Total Paid Search Sessions) × 100

Description: |
  E-commerce specialisation of Conversion Rate: the percentage of Paid Search sessions (GA4 default channel group "Paid Search", i.e. a cpc/ppc medium from a search-engine source or an auto-tagged gclid landing) that contain at least one completed purchase, measured against all Paid Search sessions in the period. It is the core on-site efficiency signal for Google Ads and Microsoft Advertising spend, separating the quality of keyword and query traffic from post-click experience issues and reconciling to ad-platform clicks through the gclid join.

Category: Acquisition


























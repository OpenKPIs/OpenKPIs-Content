      COALESCE(pc.city, 'unknown') AS city,
      COALESCE(pc.property_type, 'unknown') AS property_type,
      COALESCE(pc.listing_type, 'unknown') AS listing_type,
      COALESCE(bl.source_channel, 'unknown') AS source_channel,
      COALESCE(fl.feed_name, 'not_applicable') AS feed_name,
      COALESCE(ca.account_segment, 'unknown') AS account_segment,
      COALESCE(ca.account_tier, 'unknown') AS account_tier,
      COALESCE(ca.agent_type, 'unknown') AS agent_type,
      LEAST(COALESCE(ac.completed_required_attribute_count, 0), 49) AS completed_required_attribute_count,
      CASE
        WHEN COALESCE(ac.completed_required_attribute_count, 0) >= 49 THEN 1
        ELSE 0
      END AS has_complete_required_attributes,
      CASE
        WHEN LOWER(COALESCE(bl.lifecycle_status, '')) = 'active'
         AND LOWER(COALESCE(ml.moderation_status, '')) IN ('approved', 'accepted')
         AND LOWER(COALESCE(al.availability_status, '')) IN ('available', 'active')
         AND (al.available_from IS NULL OR CAST(al.available_from AS DATE) <= prm.snapshot_date)
         AND (al.available_until IS NULL OR CAST(al.available_until AS DATE) >= prm.snapshot_date)
         AND LOWER(COALESCE(pl.publication_status, '')) IN ('published', 'indexed', 'success')
         AND (bl.valid_from IS NULL OR CAST(bl.valid_from AS DATE) <= prm.snapshot_date)
         AND (bl.valid_to IS NULL OR CAST(bl.valid_to AS DATE) >= prm.snapshot_date)
         AND (
           LOWER(COALESCE(bl.source_channel, 'direct')) NOT IN ('partner_feed', 'agent_feed')
           OR LOWER(COALESCE(fl.ingestion_status, '')) IN ('accepted', 'completed', 'success')
         )
         AND COALESCE(ac.completed_required_attribute_count, 0) >= 49
        THEN 1
        ELSE 0
      END AS is_active_listing,
      COALESCE(ma.detail_view_count, 0) AS detail_view_count,
      COALESCE(ma.lead_count, 0) AS lead_count,
      COALESCE(ma.save_count, 0) AS save_count
    FROM base_listings AS bl
    CROSS JOIN parameters AS prm
    LEFT JOIN property_catalog_properties AS pc
      ON pc.property_id = bl.property_id
    LEFT JOIN attribute_completeness AS ac
      ON ac.property_id = bl.property_id
    LEFT JOIN moderation_latest AS ml
      ON ml.listing_id = bl.listing_id
    LEFT JOIN availability_latest AS al
      ON al.listing_id = bl.listing_id
    LEFT JOIN publication_latest AS pl
      ON pl.listing_id = bl.listing_id
    LEFT JOIN feed_latest AS fl
      ON fl.listing_id = bl.listing_id
    LEFT JOIN crm_account_attributes AS ca
      ON ca.account_id = bl.account_id
    LEFT JOIN marketplace_activity AS ma
      ON ma.listing_id = bl.listing_id
  )
  SELECT
    snapshot_date,
    country_code,
    state_region,
    city,
    property_type,
    listing_type,
    source_channel,
    feed_name,
    account_segment,
    account_tier,
    agent_type,
    COUNT(DISTINCT listing_id) AS total_property_listing_count,
    COUNT(DISTINCT CASE WHEN is_active_listing = 1 THEN listing_id END) AS active_property_listing_count,
    CAST(COUNT(DISTINCT CASE WHEN is_active_listing = 1 THEN listing_id END) AS DECIMAL(38,10))
      / NULLIF(COUNT(DISTINCT listing_id), 0) AS active_property_listing_rate,
    CAST(100 * COUNT(DISTINCT CASE WHEN is_active_listing = 1 THEN listing_id END) AS DECIMAL(38,10))
      / NULLIF(COUNT(DISTINCT listing_id), 0) AS active_property_listing_rate_percent,
    COUNT(DISTINCT CASE WHEN has_complete_required_attributes = 1 THEN listing_id END) AS complete_attribute_listing_count,
    COUNT(DISTINCT CASE WHEN has_complete_required_attributes = 0 THEN listing_id END) AS incomplete_attribute_listing_count,
    AVG(CAST(completed_required_attribute_count AS DECIMAL(38,10))) AS average_completed_required_attribute_count,
    CAST(SUM(completed_required_attribute_count) AS DECIMAL(38,10))
      / NULLIF(49 * COUNT(DISTINCT listing_id), 0) AS required_attribute_completion_rate,
    COUNT(DISTINCT CASE WHEN detail_view_count > 0 THEN listing_id END) AS viewed_listing_count,
    SUM(detail_view_count) AS detail_view_count,
    SUM(lead_count) AS lead_count,
    SUM(save_count) AS save_count
  FROM listing_evaluation
  GROUP BY
    snapshot_date,
    country_code,
    state_region,
    city,
    property_type,
    listing_type,
    source_channel,
    feed_name,
    account_segment,
    account_tier,
    agent_type;

Calculation Notes: |
  Calculate from a point-in-time snapshot at 23:59:59 in each property's market time zone. The denominator includes distinct canonical production listings intended for marketing on the snapshot date, associated with an enabled market and applicable customer-facing channel, within inclusive marketing start and end boundaries, and not deleted, fraudulent, duplicated, sold, rented, permanently withdrawn, rejected, or terminally expired. Temporarily paused, moderation-suspended, availability-suppressed, or indexing-failed listings remain denominator-eligible when they are still intended for marketing. The numerator includes denominator-eligible listings that meet the market- and channel-specific minimum publishability requirements, have an approved moderation state, are currently available, are successfully published, and are present in at least one applicable customer-facing search or browse index. Do not require a fixed universal attribute count when requirements vary by market, property type, listing purpose, or channel. Missing status records fail the numerator but do not remove an otherwise eligible listing from the denominator. Deduplicate syndicated copies and channel variants by canonical listing ID within each market; for channel-level reporting, evaluate eligibility and active status separately for that channel. Customer views, saves, or inquiries are not required to establish discoverability. Return null when the denominator is zero, calculate cross-market results from summed counts rather than averaged rates, and restate affected snapshots for qualifying late-arriving corrections received within seven days.

Business Use Case: |
  Marketplace Operations reviews the daily rate by market, channel, listing source, and property type. If a market falls below 90% or declines by more than five percentage points, the team isolates moderation backlogs, expired availability records, publication failures, search-index defects, or partner-feed issues and routes remediation to the responsible operational owner; after recovery, Product and Growth compare restored inventory with search impressions, detail views, inquiries, transactions, partner retention, and subscription-entitlement performance.


Source Data: Listing Management Service, property catalog, moderation and availability services, partner-feed ingestion records, customer-facing web and mobile publication logs, search-index status, CRM account attributes, and digital marketplace analytics


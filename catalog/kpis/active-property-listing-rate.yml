    FROM listing_management_service_listings AS l
    CROSS JOIN parameters AS prm
    WHERE l.created_at < CAST(prm.snapshot_date + INTERVAL '1 day' AS TIMESTAMP)
      AND (
        l.deleted_at IS NULL
        OR l.deleted_at >= CAST(prm.snapshot_date + INTERVAL '1 day' AS TIMESTAMP)
      )
      AND COALESCE(l.is_test_listing, FALSE) = FALSE
  ),
  catalog_attribute_ranked AS (
    SELECT
      pa.property_id,
      pa.attribute_name,
      pa.attribute_value,
      ROW_NUMBER() OVER (
        PARTITION BY pa.property_id, pa.attribute_name
        ORDER BY pa.updated_at DESC, pa.attribute_version DESC
      ) AS row_num
    FROM property_catalog_property_attributes AS pa
    INNER JOIN required_attributes AS ra
      ON ra.attribute_name = pa.attribute_name
    CROSS JOIN parameters AS prm
    WHERE pa.updated_at < CAST(prm.snapshot_date + INTERVAL '1 day' AS TIMESTAMP)
  ),
  attribute_completeness AS (
    SELECT
      property_id,
      COUNT(DISTINCT CASE
        WHEN NULLIF(TRIM(CAST(attribute_value AS VARCHAR)), '') IS NOT NULL
        THEN attribute_name
        ELSE NULL
      END) AS completed_required_attribute_count
    FROM catalog_attribute_ranked
    WHERE row_num = 1

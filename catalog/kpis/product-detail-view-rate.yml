KPI Name: Product Detail View Rate
Formula: (Sessions with ≥ 1 full product-page view_item event (view_type ≠ quick_view) / Total Sessions) × 100

Description: |
  Product Detail View Rate is the percentage of all sessions that reach at least one product detail page (PDP), showing how well search, navigation, listing pages and landing pages move shoppers from browsing to looking at a specific product. It measures only whether shoppers reach the PDP, not whether they add the product to cart afterwards, which Add to Cart Rate and Item View to Cart Rate measure.

Category: Engagement


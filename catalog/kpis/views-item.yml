KPI Name: Views Item
Formula: Item Views = COUNT(DISTINCT view instances), where one view instance = one parent item_id in a view_item event rendering product detail content, with repeats of the same user_pseudo_id + ga_session_id + item_id within 30 seconds collapsed to one and bot-flagged or internal traffic removed

Description: |
  Views Item (canonically Product Detail Views) counts how often shoppers are shown the full detail content of a specific product, measured at item_id grain from the unified view_item event after bot exclusion and refresh deduplication, and explicitly excluding list and grid impressions. It is the standard measure of product-level demand interest and the base for Cart-to-View Rate and Item Purchase Conversion Rate, so one stable definition must govern merchandising, search and site-experience reporting.

Category: Engagement

Tags: [kpi, E-commerce: Product Discovery & Merchandising, product-detail-page, view_item, merchandising]

Industry: [["Retail"]]

Priority: High

Core Area: Discovery

Scope: Event

Measure Type: Counter

Aggregation Window: Event, Session, User, Hourly, Daily, Weekly, Monthly


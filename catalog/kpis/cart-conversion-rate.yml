# KPI: cart conversion rate
# Generated: 2026-09-18T16:56:01.149Z
# Contributed by: swapnamagantius
# Last modified by: devyendarm

KPI Name: cart conversion rate
Formula: (Carts Created that result in a Purchase within 7 days, in any session / Total Carts Created) × 100

Description: |
  Cart conversion rate is the percentage of carts created (a shopper's first add_to_cart of the day) that end in a completed purchase within a 7-day conversion window, including purchases made in a later session or visit. It is the cross-session counterpart of the session-scoped Cart-to-Purchase Rate and shows how much cart intent the store turns into orders, including deferred and returning-visit purchases.


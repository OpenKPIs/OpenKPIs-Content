KPI Name: cart conversion rate
Formula: (Completed Purchases / Carts Created) × 100

Description: |
  Cart conversion rate measures the percentage of shopping carts that result in a completed purchase. It is a critical e-commerce KPI for identifying checkout friction, cart abandonment issues, and the effectiveness of cart-to-purchase optimization efforts.

Category: Conversion

























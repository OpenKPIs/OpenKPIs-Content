KPI Name: Online Order Conversion Rate
Formula: (Sessions with at least one Completed Order / Total Sessions) × 100

Description: |
  Online Order Conversion Rate is the percentage of all website or app sessions that include at least one completed order (a purchase event with a unique transaction ID). It is the standard session-based e-commerce conversion rate used in GA4, Adobe Analytics and Shopify reporting to judge how effectively traffic turns into orders.

Category: Conversion

Tags: [kpi, E-commerce: Cart & Checkout Funnel Analytics, conversion rate, sessions]

Industry: [["Retail"]]

Priority: High

Core Area: Checkout

Scope: Session

Measure Type: Percentage

Aggregation Window: Daily, Weekly, Monthly


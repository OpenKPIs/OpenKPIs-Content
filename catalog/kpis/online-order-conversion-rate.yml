KPI Name: Online Order Conversion Rate
Formula: (Completed Orders / Total Sessions) × 100

Description: |
  The Online Order Conversion Rate measures the percentage of online sessions that result in a completed order on the website.

Category: Conversion


Industry: [Retail]

Priority: High

Core Area: Generic

Scope: Session

Measure Type: rate

Aggregation Window: Time based - Daily

GA4 Event: |
  purchase

Adobe Event: |
  purchase

W3 Data Layer: |
  {"page":{"type":"checkout","category":"conversion"},"event":{"name":"purchase","action":"completed"}}

GA4 Data Layer: |
  {"event":"purchase","ecommerce":{"purchase":{"products":[{"id":"PROD123","name":"Product Name","price":"25.00","quantity":2}],"actionField":{"id":"12345","tax":"5.00","coupon":"SUMMER10","revenue":"50.00","shipping":"5.00"}}}}

Adobe Client Data Layer: |
  {"events":[{"products":[{"productID":"PROD123","productName":"Product Name","productPrice":"25.00","productQuantity":2}],"purchaseID":"12345","purchaseTax":"5.00","purchaseTotal":"50.00","purchaseCoupon":"SUMMER10","purchaseShipping":"5.00"}]}

XDM Mapping: |
  {"_experience":{"analytics":{"custom1":"purchase","custom2":"completed"}}}

Google Analytics SQL: |
  -- ==========================================
  -- 1. GOOGLE BIGQUERY SQL
  -- ==========================================
  WITH total_orders AS (
    SELECT COUNT(DISTINCT event_id) AS total_orders
    FROM `your-project.analytics_123456789.events_*`
    WHERE event_name = 'purchase'
  ), total_visits AS (
    SELECT COUNT(DISTINCT event_id) AS total_visits
    FROM `your-project.analytics_123456789.events_*`
    WHERE event_name = 'page_view'
  )
  
  SELECT
    (total_orders.total_orders / total_visits.total_visits) * 100 AS online_order_conversion_rate
  FROM total_orders, total_visits;

AEP Query Service SQL: |
  -- ==========================================
  -- 2. ADOBE AEP QUERY SERVICE SQL
  -- ==========================================
  WITH total_orders AS (
    SELECT COUNT(DISTINCT purchaseID) AS total_orders
    FROM aep_backend_dataset.purchase_events
  ), total_visits AS (
    SELECT COUNT(DISTINCT visitID) AS total_visits
    FROM aep_backend_dataset.visit_events
  )
  
  SELECT
    (total_orders.total_orders / total_visits.total_visits) * 100 AS online_order_conversion_rate
  FROM total_orders, total_visits;

Calculation Notes: |
  Exclude sessions with no interaction or incomplete order data.

Business Use Case: |
  By monitoring the Online Order Conversion Rate, the marketing team can optimize website design and checkout process to increase sales conversion.



  Events: [product-view, purchase]
  Metrics: [product-view, item-list-views, item-list-clicks]
  Dimensions: [item-category, promotion-type, product-name]
  KPIs: [item-purchase-conversion-rate]

Source Data: Digital Analytics (GA4 / Adobe Analytics)


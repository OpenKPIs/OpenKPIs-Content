# KPI: Merchandising Conversion Rate
# Generated: 2026-06-17T20:58:22.201Z
# Contributed by: swapnamagantius


KPI Name: Merchandising Conversion Rate
Formula: (Purchasing Sessions Attributed to Merchandising Exposure / Eligible Sessions with Merchandising Exposure) × 100

Description: |
  Merchandising Conversion Rate measures the percentage of sessions or users exposed to a merchandising element, product listing, recommendation module, collection page, or promotional placement that result in a purchase of the merchandised product or any product within the defined attribution scope. It matters because it quantifies how effectively digital merchandising tactics turn product exposure into revenue-generating outcomes.

Category: Conversion

























# KPI: Merchandising Conversion Rate
# Generated: 2026-09-15T14:04:45.054Z
# Contributed by: swapnamagantius
# Last modified by: devyendarm

KPI Name: Merchandising Conversion Rate
Formula: (Purchased Item Lines Credited to the Merchandising Placement / Item Views Credited to the Same Merchandising Placement) × 100

Description: |
  Merchandising Conversion Rate breaks down the canonical Item Purchase Conversion Rate by merchandising placement: it is the percentage of item views carrying a placement value (item list, category grid, internal search results, recommendation module or onsite promotion) that are matched by purchased lines of items carrying the same placement value, showing which merchandising surfaces turn product interest into orders separately from a slot's click-through rate and from site-wide purchase-to-view performance. It is kept as a separate spec from Item Purchase Conversion Rate because the implementation differs in substance: placement values must be bound on select_item / select_promotion and carried by the site onto every view_item and purchase item (GA4 item_list_* / promotion_* / creative_slot fields, Adobe merchandising eVar20-eVar23 on productListItems), and both SQLs group by those values.

Category: Conversion

Tags: [kpi, E-commerce: Product Discovery & Merchandising]

Industry: [["E-commerce"]]

Priority: High

Core Area: Discovery

Scope: Event

Measure Type: Percentage

Aggregation Window: Daily, Weekly, Monthly


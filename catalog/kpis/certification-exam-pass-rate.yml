KPI Name: Certification Exam Pass Rate
Formula: (Distinct Valid Finalized Certification Exam Attempts Passed / Distinct Valid Finalized Certification Exam Attempts Passed or Failed) × 100

Description: |
  Measures the percentage of valid, finalized production certification exam attempts that receive a Passed result during the reporting period. It indicates how effectively learner engagement with certification content converts into successful exam outcomes, with each eligible retake counted as a separate attempt.

Category: Conversion

Tags: [kpi]

Industry: [Education]

Priority: High

Core Area: Engagement

Scope: Event

Measure Type: percentage

Aggregation Window: Time based - Daily/Monthly/Quarterly/Yearly







Google Analytics SQL: |
  -- ==========================================
  -- 1. GOOGLE BIGQUERY SQL
  -- ==========================================
  WITH ranked_attempts AS (
    SELECT
      a.*,
      ROW_NUMBER() OVER (
        PARTITION BY a.attempt_id
        ORDER BY
          a.updated_at DESC NULLS LAST,
          a.ingested_at DESC NULLS LAST,
          a.completed_at DESC NULLS LAST,
          a.started_at DESC NULLS LAST,
          a.result_status DESC NULLS LAST,
          a.completion_status DESC NULLS LAST,
          SAFE_CAST(a.score AS NUMERIC) DESC NULLS LAST
      ) AS record_rank
    FROM `your-project.certification_assessment.exam_attempts` AS a
    WHERE a.attempt_id IS NOT NULL
  ),
  deduplicated_attempts AS (
    SELECT * EXCEPT (record_rank)
    FROM ranked_attempts
    WHERE record_rank = 1
  ),
  ranked_attempt_enrollments AS (
    SELECT
      a.attempt_id,
      e.enrollment_status,
      ROW_NUMBER() OVER (
        PARTITION BY a.attempt_id
        ORDER BY
          CASE WHEN e.learner_id IS NULL THEN 1 ELSE 0 END,
          e.enrollment_date DESC NULLS LAST,
          e.updated_at DESC NULLS LAST,
          e.enrollment_status DESC NULLS LAST
      ) AS enrollment_rank
    FROM deduplicated_attempts AS a
    LEFT JOIN `your-project.certification_assessment.exams` AS x
      ON a.exam_id = x.exam_id
    LEFT JOIN `your-project.learning_management.course_enrollments` AS e
      ON a.learner_id = e.learner_id
     AND x.course_id = e.course_id
     AND e.enrollment_date <= a.completed_at
     AND e.learner_id IS NOT NULL
     AND e.course_id IS NOT NULL
  ),
  attempt_enrollments AS (
    SELECT
      attempt_id,
      enrollment_status
    FROM ranked_attempt_enrollments
    WHERE enrollment_rank = 1
  ),
  prepared AS (
    SELECT
      DATE(a.completed_at, 'UTC') AS metric_date,
      DATE_TRUNC(DATE(a.completed_at, 'UTC'), WEEK(MONDAY)) AS metric_week_start,
      DATE_TRUNC(DATE(a.completed_at, 'UTC'), MONTH) AS metric_month_start,
      DATE_TRUNC(DATE(a.completed_at, 'UTC'), QUARTER) AS metric_quarter_start,
      EXTRACT(YEAR FROM DATE(a.completed_at, 'UTC')) AS metric_year,
      COALESCE(p.certification_program_id, 'unknown') AS certification_program_id,
      COALESCE(p.program_name, 'Unknown') AS certification_program_name,
      COALESCE(p.certification_code, 'unknown') AS certification_code,
      COALESCE(p.program_version, 'unknown') AS certification_version,
      COALESCE(p.certification_level, 'unknown') AS certification_level,
      COALESCE(p.certification_category, 'unknown') AS certification_category,
      COALESCE(x.exam_id, a.exam_id, 'unknown') AS exam_id,
      COALESCE(x.exam_name, 'Unknown') AS exam_name,
      COALESCE(x.exam_code, 'unknown') AS exam_code,
      COALESCE(x.exam_version, 'unknown') AS exam_version,
      COALESCE(a.delivery_channel, 'unknown') AS delivery_channel,
      COALESCE(a.proctoring_type, 'unknown') AS proctoring_type,
      COALESCE(a.exam_language, 'unknown') AS exam_language,
      COALESCE(l.country_code, 'unknown') AS country_code,
      COALESCE(l.region, 'unknown') AS region,
      COALESCE(l.business_unit, 'unknown') AS business_unit,
      COALESCE(l.organization_id, 'unknown') AS organization_id,
      COALESCE(o.organization_name, 'Unknown') AS organization_name,
      COALESCE(o.partner_status, 'unknown') AS partner_status,
      COALESCE(l.learner_type, 'unknown') AS learner_type,
      COALESCE(e.enrollment_status, 'not_enrolled') AS enrollment_status,
      COALESCE(x.course_id, 'unknown') AS course_id,
      COALESCE(c.course_name, 'Unknown') AS course_name,
      COALESCE(c.learning_path_id, 'unknown') AS learning_path_id,
      COALESCE(lp.learning_path_name, 'Unknown') AS learning_path_name,
      CASE
        WHEN a.attempt_number = 1 THEN '1'
        WHEN a.attempt_number = 2 THEN '2'
        WHEN a.attempt_number = 3 THEN '3'
        WHEN a.attempt_number >= 4 THEN '4+'
        ELSE 'unknown'
      END AS attempt_number_band,
      COALESCE(a.accommodation_flag, FALSE) AS accommodation_flag,
      CASE
        WHEN a.attempt_number = 1 THEN FALSE
        WHEN a.attempt_number > 1 THEN TRUE
        ELSE NULL
      END AS retake_flag,
      CASE
        WHEN a.attempt_number = 1 THEN TRUE
        WHEN a.attempt_number > 1 THEN FALSE
        ELSE NULL
      END AS first_attempt_flag,
      COALESCE(x.scoring_method, 'unknown') AS scoring_method,
      SAFE_CAST(x.passing_score AS NUMERIC) AS passing_score,
      COALESCE(a.source_system, 'certification_assessment_platform') AS source_system,
      a.attempt_id,
      a.learner_id,
      SAFE_CAST(a.score AS NUMERIC) AS score_value,
      a.pass_indicator,
      LOWER(TRIM(COALESCE(a.result_status, ''))) AS normalized_result_status,
      CASE
        WHEN a.started_at IS NOT NULL
         AND a.completed_at >= a.started_at
          THEN TIMESTAMP_DIFF(a.completed_at, a.started_at, SECOND) / 60.0
        ELSE NULL
      END AS completion_minutes
    FROM deduplicated_attempts AS a
    LEFT JOIN `your-project.certification_assessment.exams` AS x
      ON a.exam_id = x.exam_id
    LEFT JOIN `your-project.certification_management.certification_programs` AS p
      ON x.certification_program_id = p.certification_program_id
    LEFT JOIN `your-project.learning_management.learners` AS l
      ON a.learner_id = l.learner_id
    LEFT JOIN `your-project.certification_management.organizations` AS o
      ON l.organization_id = o.organization_id
    LEFT JOIN attempt_enrollments AS e
      ON a.attempt_id = e.attempt_id
    LEFT JOIN `your-project.learning_management.courses` AS c
      ON x.course_id = c.course_id
    LEFT JOIN `your-project.learning_management.learning_paths` AS lp
      ON c.learning_path_id = lp.learning_path_id
    WHERE a.completed_at IS NOT NULL
      AND LOWER(TRIM(COALESCE(a.completion_status, ''))) IN ('completed', 'scored', 'finalized')
      AND COALESCE(a.is_practice_exam, FALSE) = FALSE
      AND COALESCE(a.is_voided, FALSE) = FALSE
      AND COALESCE(a.is_deleted, FALSE) = FALSE
  ),
  classified AS (
    SELECT
      prepared.*,
      CASE
        WHEN pass_indicator IS NOT NULL THEN IF(pass_indicator, 1, 0)
        WHEN normalized_result_status IN ('passed', 'pass') THEN 1
        WHEN normalized_result_status IN ('failed', 'fail', 'not_passed', 'not passed') THEN 0
        WHEN score_value IS NOT NULL AND passing_score IS NOT NULL
          THEN IF(score_value >= passing_score, 1, 0)
        ELSE NULL
      END AS passed_flag
    FROM prepared
  )
  SELECT
    metric_date,
    metric_week_start,
    metric_month_start,
    metric_quarter_start,
    metric_year,
    certification_program_id,
    certification_program_name,
    certification_code,
    certification_version,
    certification_level,
    certification_category,
    exam_id,
    exam_name,
    exam_code,
    exam_version,
    delivery_channel,
    proctoring_type,
    exam_language,
    country_code,
    region,
    business_unit,
    organization_id,
    organization_name,
    partner_status,
    learner_type,
    enrollment_status,
    course_id,
    course_name,
    learning_path_id,
    learning_path_name,
    attempt_number_band,
    accommodation_flag,
    retake_flag,
    first_attempt_flag,
    'eligible_result_required' AS eligibility_status,
    scoring_method,
    passing_score,
    source_system,
    CURRENT_TIMESTAMP() AS data_as_of_ts,
    COUNT(DISTINCT attempt_id) AS total_completed_exam_attempts,
    COUNT(DISTINCT IF(passed_flag IS NOT NULL, attempt_id, NULL)) AS total_exam_attempts,
    COUNT(DISTINCT IF(passed_flag IS NULL, attempt_id, NULL)) AS excluded_indeterminate_attempts,
    COUNT(DISTINCT IF(passed_flag = 1, attempt_id, NULL)) AS passed_exam_attempts,
    COUNT(DISTINCT IF(passed_flag = 0, attempt_id, NULL)) AS failed_exam_attempts,
    COUNT(DISTINCT IF(passed_flag IS NOT NULL, learner_id, NULL)) AS distinct_learners,
    COUNT(DISTINCT IF(passed_flag = 1, learner_id, NULL)) AS distinct_passed_learners,
    ROUND(
      SAFE_DIVIDE(
        COUNT(DISTINCT IF(passed_flag = 1, attempt_id, NULL)),
        COUNT(DISTINCT IF(passed_flag IS NOT NULL, attempt_id, NULL))
      ),
      6
    ) AS pass_rate,
    ROUND(
      100 * SAFE_DIVIDE(
        COUNT(DISTINCT IF(passed_flag = 1, attempt_id, NULL)),
        COUNT(DISTINCT IF(passed_flag IS NOT NULL, attempt_id, NULL))
      ),
      2
    ) AS pass_rate_percentage,
    ROUND(AVG(IF(passed_flag IS NOT NULL, score_value, NULL)), 2) AS average_score,
    ROUND(AVG(IF(passed_flag IS NOT NULL, completion_minutes, NULL)), 2) AS average_completion_minutes,
    'Passed eligible completed exam attempts divided by all eligible completed exam attempts with a determinable result' AS metric_definition
  FROM classified
  GROUP BY
    metric_date,
    metric_week_start,
    metric_month_start,
    metric_quarter_start,
    metric_year,
    certification_program_id,
    certification_program_name,
    certification_code,
    certification_version,
    certification_level,
    certification_category,
    exam_id,
    exam_name,
    exam_code,
    exam_version,
    delivery_channel,
    proctoring_type,
    exam_language,
    country_code,
    region,
    business_unit,
    organization_id,
    organization_name,
    partner_status,
    learner_type,
    enrollment_status,
    course_id,
    course_name,
    learning_path_id,
    learning_path_name,
    attempt_number_band,
    accommodation_flag,
    retake_flag,
    first_attempt_flag,
    scoring_method,
    passing_score,
    source_system;

AEP Query Service SQL: |
  -- ==========================================
  -- 2. ADOBE AEP QUERY SERVICE SQL

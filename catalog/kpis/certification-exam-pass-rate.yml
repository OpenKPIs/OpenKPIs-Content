    scoring_method,
    passing_score,
    source_system,
    CURRENT_TIMESTAMP AS data_as_of_ts,
    COUNT(DISTINCT attempt_id) AS total_completed_exam_attempts,
    COUNT(DISTINCT CASE WHEN passed_flag IS NOT NULL THEN attempt_id END) AS total_exam_attempts,
    COUNT(DISTINCT CASE WHEN passed_flag IS NULL THEN attempt_id END) AS excluded_indeterminate_attempts,
    COUNT(DISTINCT CASE WHEN passed_flag = 1 THEN attempt_id END) AS passed_exam_attempts,
    COUNT(DISTINCT CASE WHEN passed_flag = 0 THEN attempt_id END) AS failed_exam_attempts,
    COUNT(DISTINCT CASE WHEN passed_flag IS NOT NULL THEN learner_id END) AS distinct_learners,
    COUNT(DISTINCT CASE WHEN passed_flag = 1 THEN learner_id END) AS distinct_passed_learners,
    ROUND(

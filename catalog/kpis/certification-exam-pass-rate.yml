    ROUND(AVG(CASE WHEN passed_flag IS NOT NULL THEN score_value END), 2) AS average_score,
    ROUND(AVG(CASE WHEN passed_flag IS NOT NULL THEN completion_minutes END), 2) AS average_completion_minutes,
    'Passed eligible completed exam attempts divided by all eligible completed exam attempts with a determinable result' AS metric_definition

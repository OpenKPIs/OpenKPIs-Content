        WHEN a.attempt_number = 3 THEN '3'
        WHEN a.attempt_number >= 4 THEN '4+'
        ELSE 'unknown'
      END AS attempt_number_band,
      COALESCE(a.accommodation_flag, FALSE) AS accommodation_flag,
      CASE
        WHEN a.attempt_number = 1 THEN FALSE
        WHEN a.attempt_number > 1 THEN TRUE
        ELSE NULL
      END AS retake_flag,
      CASE
        WHEN a.attempt_number = 1 THEN TRUE
        WHEN a.attempt_number > 1 THEN FALSE
        ELSE NULL
      END AS first_attempt_flag,
      COALESCE(x.scoring_method, 'unknown') AS scoring_method,
      CAST(x.passing_score AS DECIMAL(18,4)) AS passing_score,
      COALESCE(a.source_system, 'certification_assessment_platform') AS source_system,

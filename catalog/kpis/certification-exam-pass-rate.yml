Calculation Notes: |
  Deduplicate by exam_attempt_id using the latest authoritative result revision. Include only valid production certification exam attempts with a populated result_finalized_at and a final Passed or Failed result; exclude practice, mock, diagnostic, abandoned, cancelled, no-show, pending, unscored, voided, fraud-invalidated, technical-failure, administrative, quality-assurance, and deleted attempts. Use the assessment platform's finalized result as authoritative; derive the result from final_score greater than or equal to the effective passing_score only when formally approved and both values use the same scoring scale for the exact exam version. Attribute the attempt to the period containing result_finalized_at after conversion to the enterprise reporting time zone. Count every eligible retake separately, return null when no eligible attempts exist, and calculate rollups from summed passed and eligible attempt counts rather than averaging subgroup percentages. Restate affected periods after appeals, result corrections, invalidations, reinstatements, duplicate removal, or repaired exam-version mappings.

Business Use Case: |
  Certification Programs compares monthly pass rates by exam version, language, delivery channel, and learner cohort. If a new version is more than five percentage points below its approved target with at least 30 eligible attempts while prior versions remain stable, the team initiates item analysis, validates the passing standard and learning-content alignment, and may correct defective questions or pause delivery.



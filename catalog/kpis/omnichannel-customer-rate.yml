# KPI: Omnichannel Customer Rate
# Generated: 2026-09-21T17:14:06.506Z
# Contributed by: devyendarm
# Last modified by: devyendarm

KPI Name: Omnichannel Customer Rate
Formula: Omnichannel Customer Rate (%) = (COUNT(DISTINCT resolved customer_id with ≥ 1 qualifying digitally placed order AND ≥ 1 qualifying physical-store transaction in the period) / COUNT(DISTINCT resolved customer_id with ≥ 1 qualifying purchase in any channel in the period)) × 100

Description: |
  Omnichannel Customer Rate is the percentage of active purchasing customers in a period who bought through both a digital channel (web or app order, any fulfilment method) and a physical store (in-store POS purchase or a collected BOPIS, curbside or ship-to-store order), measured on resolved customer identities. It is the retailer's headline measure of cross-channel penetration, used to size the omnichannel base that typically carries higher purchase frequency and lifetime value than single-channel buyers, and it counts completed purchases only, unlike engagement-based omnichannel measures that credit browsing or store visits without a transaction.

Category: Retention

Tags: [kpi, Retail: Omnichannel (BOPIS - Buy Online Pick Up In Store)]


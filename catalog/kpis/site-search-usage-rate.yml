KPI Name: Site Search Usage Rate
Formula: (Sessions with at least one Site Search / Total Sessions) × 100

Description: |
  Percentage of all sessions with at least one on-site product search. Shows how much shoppers rely on search rather than category navigation to find products.

Category: Engagement


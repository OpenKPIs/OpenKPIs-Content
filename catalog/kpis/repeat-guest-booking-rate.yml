  WITH extracted_purchases AS (
    SELECT
      timestamp AS event_timestamp,
      _experience.analytics.customDimensions.eVars.eVar1 AS booking_id,
      _experience.analytics.customDimensions.eVars.eVar2 AS confirmation_number,

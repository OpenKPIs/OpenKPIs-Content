      _experience.analytics.customDimensions.eVars.eVar34 AS device_category,
      _experience.analytics.customDimensions.eVars.eVar35 AS digital_guest_id,
      _experience.analytics.customDimensions.eVars.eVar36 AS identity_namespace,
      CASE WHEN LOWER(_experience.analytics.customDimensions.eVars.eVar37) = 'true' THEN TRUE ELSE FALSE END AS authenticated_flag,
      CASE WHEN LOWER(_experience.analytics.customDimensions.eVars.eVar38) = 'true' THEN TRUE ELSE FALSE END AS deterministic_identity_flag,
      CASE WHEN LOWER(_experience.analytics.customDimensions.eVars.eVar39) = 'true' THEN TRUE ELSE FALSE END AS repeat_eligibility_flag,
      CASE WHEN LOWER(_experience.analytics.customDimensions.eVars.eVar40) = 'true' THEN TRUE ELSE FALSE END AS repeat_guest_flag,
      CAST(_experience.analytics.customDimensions.eVars.eVar41 AS BIGINT) AS prior_qualifying_booking_count,
      CAST(_experience.analytics.customDimensions.eVars.eVar42 AS TIMESTAMP) AS first_prior_qualifying_booking_timestamp,
      CAST(_experience.analytics.customDimensions.eVars.eVar43 AS TIMESTAMP) AS latest_prior_qualifying_booking_timestamp,

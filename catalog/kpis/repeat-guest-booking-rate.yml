Google Analytics SQL: |
  -- ==========================================
  -- 1. GOOGLE BIGQUERY SQL
  -- ==========================================
  WITH purchase_event_params AS (
    SELECT
      PARSE_DATE('%Y%m%d', e.event_date) AS event_date,
      e.event_timestamp,
      e.event_bundle_sequence_id,
      e.user_pseudo_id,
      e.ecommerce.transaction_id AS ecommerce_transaction_id,
      ep.key AS parameter_key,
      COALESCE(
        ep.value.string_value,
        CAST(ep.value.int_value AS STRING),
        CAST(ep.value.double_value AS STRING),
        CAST(ep.value.float_value AS STRING)
      ) AS parameter_value
    FROM `your-project.analytics_123456789.events_*` AS e
    CROSS JOIN UNNEST(e.event_params) AS ep
    WHERE _TABLE_SUFFIX BETWEEN FORMAT_DATE('%Y%m%d', @start_date)
                            AND FORMAT_DATE('%Y%m%d', @end_date)
      AND e.event_name = 'purchase'
  ),
  pivoted_purchases AS (
    SELECT
      event_date,
      event_timestamp,
      event_bundle_sequence_id,
      user_pseudo_id,
      ecommerce_transaction_id,
      MAX(IF(parameter_key = 'booking_id', parameter_value, NULL)) AS booking_id,
      MAX(IF(parameter_key = 'confirmation_number', parameter_value, NULL)) AS confirmation_number,
      COALESCE(
        MAX(IF(parameter_key = 'transaction_id', parameter_value, NULL)),
        ecommerce_transaction_id
      ) AS transaction_id,
      MAX(IF(parameter_key = 'booking_status', parameter_value, NULL)) AS booking_status,
      SAFE_CAST(MAX(IF(parameter_key = 'confirmation_timestamp', parameter_value, NULL)) AS TIMESTAMP) AS confirmation_timestamp,
      MAX(IF(parameter_key = 'currency', parameter_value, NULL)) AS currency,
      SAFE_CAST(MAX(IF(parameter_key = 'booking_value', parameter_value, NULL)) AS NUMERIC) AS booking_value,
      SAFE_CAST(MAX(IF(parameter_key = 'tax_amount', parameter_value, NULL)) AS NUMERIC) AS tax_amount,
      SAFE_CAST(MAX(IF(parameter_key = 'fee_amount', parameter_value, NULL)) AS NUMERIC) AS fee_amount,
      SAFE_CAST(MAX(IF(parameter_key = 'discount_amount', parameter_value, NULL)) AS NUMERIC) AS discount_amount,
      MAX(IF(parameter_key = 'coupon_code', parameter_value, NULL)) AS coupon_code,
      MAX(IF(parameter_key = 'property_id', parameter_value, NULL)) AS property_id,
      MAX(IF(parameter_key = 'property_name', parameter_value, NULL)) AS property_name,
      MAX(IF(parameter_key = 'brand', parameter_value, NULL)) AS brand,
      MAX(IF(parameter_key = 'property_city', parameter_value, NULL)) AS property_city,
      MAX(IF(parameter_key = 'property_region', parameter_value, NULL)) AS property_region,
      MAX(IF(parameter_key = 'property_country', parameter_value, NULL)) AS property_country,
      SAFE_CAST(MAX(IF(parameter_key = 'check_in_date', parameter_value, NULL)) AS DATE) AS check_in_date,
      SAFE_CAST(MAX(IF(parameter_key = 'check_out_date', parameter_value, NULL)) AS DATE) AS check_out_date,
      SAFE_CAST(MAX(IF(parameter_key = 'nights', parameter_value, NULL)) AS INT64) AS nights,
      SAFE_CAST(MAX(IF(parameter_key = 'room_count', parameter_value, NULL)) AS INT64) AS room_count,
      SAFE_CAST(MAX(IF(parameter_key = 'adult_count', parameter_value, NULL)) AS INT64) AS adult_count,
      SAFE_CAST(MAX(IF(parameter_key = 'child_count', parameter_value, NULL)) AS INT64) AS child_count,
      SAFE_CAST(MAX(IF(parameter_key = 'guest_count', parameter_value, NULL)) AS INT64) AS guest_count,
      MAX(IF(parameter_key = 'room_type_id', parameter_value, NULL)) AS room_type_id,
      MAX(IF(parameter_key = 'room_type_name', parameter_value, NULL)) AS room_type_name,
      MAX(IF(parameter_key = 'rate_plan_id', parameter_value, NULL)) AS rate_plan_id,
      MAX(IF(parameter_key = 'rate_plan_name', parameter_value, NULL)) AS rate_plan_name,
      SAFE_CAST(MAX(IF(parameter_key = 'booking_window_days', parameter_value, NULL)) AS INT64) AS booking_window_days,
      MAX(IF(parameter_key = 'booking_channel', parameter_value, NULL)) AS booking_channel,
      MAX(IF(parameter_key = 'platform', parameter_value, NULL)) AS platform,
      MAX(IF(parameter_key = 'site_id', parameter_value, NULL)) AS site_id,
      MAX(IF(parameter_key = 'locale', parameter_value, NULL)) AS locale,
      MAX(IF(parameter_key = 'device_category', parameter_value, NULL)) AS device_category,
      MAX(IF(parameter_key = 'digital_guest_id', parameter_value, NULL)) AS digital_guest_id,
      MAX(IF(parameter_key = 'identity_namespace', parameter_value, NULL)) AS identity_namespace,
      LOWER(MAX(IF(parameter_key = 'authenticated_flag', parameter_value, NULL))) = 'true' AS authenticated_flag,
      LOWER(MAX(IF(parameter_key = 'deterministic_identity_flag', parameter_value, NULL))) = 'true' AS deterministic_identity_flag,
      LOWER(MAX(IF(parameter_key = 'repeat_eligibility_flag', parameter_value, NULL))) = 'true' AS repeat_eligibility_flag,
      LOWER(MAX(IF(parameter_key = 'repeat_guest_flag', parameter_value, NULL))) = 'true' AS repeat_guest_flag,
      SAFE_CAST(MAX(IF(parameter_key = 'prior_qualifying_booking_count', parameter_value, NULL)) AS INT64) AS prior_qualifying_booking_count,
      SAFE_CAST(MAX(IF(parameter_key = 'first_prior_qualifying_booking_timestamp', parameter_value, NULL)) AS TIMESTAMP) AS first_prior_qualifying_booking_timestamp,
      SAFE_CAST(MAX(IF(parameter_key = 'latest_prior_qualifying_booking_timestamp', parameter_value, NULL)) AS TIMESTAMP) AS latest_prior_qualifying_booking_timestamp,
      SAFE_CAST(MAX(IF(parameter_key = 'qualification_cutoff_timestamp', parameter_value, NULL)) AS TIMESTAMP) AS qualification_cutoff_timestamp,
      SAFE_CAST(MAX(IF(parameter_key = 'lookback_start_timestamp', parameter_value, NULL)) AS TIMESTAMP) AS lookback_start_timestamp,
      MAX(IF(parameter_key = 'qualification_rule_version', parameter_value, NULL)) AS qualification_rule_version,
      MAX(IF(parameter_key = 'prior_booking_channel_scope', parameter_value, NULL)) AS prior_booking_channel_scope,
      MAX(IF(parameter_key = 'booking_source_system', parameter_value, NULL)) AS booking_source_system,
      MAX(IF(parameter_key = 'consent_analytics_status', parameter_value, NULL)) AS consent_analytics_status
    FROM purchase_event_params
    GROUP BY
      event_date,
      event_timestamp,
      event_bundle_sequence_id,
      user_pseudo_id,
      ecommerce_transaction_id
  ),
  deduplicated_purchases AS (
    SELECT * EXCEPT(duplicate_sequence)
    FROM (
      SELECT
        p.*,
        ROW_NUMBER() OVER (
          PARTITION BY COALESCE(NULLIF(transaction_id, ''), NULLIF(booking_id, ''), CONCAT(user_pseudo_id, '-', CAST(event_timestamp AS STRING)))
          ORDER BY event_timestamp DESC, event_bundle_sequence_id DESC
        ) AS duplicate_sequence
      FROM pivoted_purchases AS p
      WHERE COALESCE(NULLIF(transaction_id, ''), NULLIF(booking_id, '')) IS NOT NULL
    )
    WHERE duplicate_sequence = 1
  ),
  confirmed_purchases AS (
    SELECT
      *,
      DATE(COALESCE(confirmation_timestamp, TIMESTAMP_MICROS(event_timestamp))) AS confirmation_date
    FROM deduplicated_purchases
    WHERE LOWER(booking_status) = 'confirmed'
      AND LOWER(consent_analytics_status) = 'granted'
  )
  SELECT
    confirmation_date,
    booking_id,
    confirmation_number,
    transaction_id,
    booking_status,
    confirmation_timestamp,
    currency,
    booking_value,
    tax_amount,
    fee_amount,
    discount_amount,
    coupon_code,
    property_id,
    property_name,
    brand,
    property_city,
    property_region,
    property_country,
    check_in_date,
    check_out_date,
    nights,
    room_count,
    adult_count,
    child_count,
    guest_count,
    room_type_id,
    room_type_name,
    rate_plan_id,
    rate_plan_name,
    booking_window_days,
    booking_channel,
    platform,
    site_id,
    locale,
    device_category,
    digital_guest_id,
    identity_namespace,
    authenticated_flag,
    deterministic_identity_flag,
    repeat_eligibility_flag,
    repeat_guest_flag,
    prior_qualifying_booking_count,
    first_prior_qualifying_booking_timestamp,
    latest_prior_qualifying_booking_timestamp,
    qualification_cutoff_timestamp,
    lookback_start_timestamp,
    qualification_rule_version,
    prior_booking_channel_scope,
    booking_source_system,
    consent_analytics_status,
    COUNTIF(repeat_eligibility_flag) OVER () AS eligible_confirmed_booking_count,
    COUNTIF(repeat_eligibility_flag AND repeat_guest_flag) OVER () AS repeat_guest_booking_count,
    SAFE_DIVIDE(
      COUNTIF(repeat_eligibility_flag AND repeat_guest_flag) OVER (),
      COUNTIF(repeat_eligibility_flag) OVER ()
    ) AS repeat_guest_booking_rate,
    100 * SAFE_DIVIDE(
      COUNTIF(repeat_eligibility_flag AND repeat_guest_flag) OVER (),
      COUNTIF(repeat_eligibility_flag) OVER ()
    ) AS repeat_guest_booking_rate_pct
  FROM confirmed_purchases
  ORDER BY confirmation_timestamp DESC, transaction_id;


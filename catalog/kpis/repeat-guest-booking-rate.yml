KPI Name: Repeat Guest Booking Rate
Formula: (Confirmed Digital Bookings from Repeat Guests / All Eligible Confirmed Digital Bookings from Identifiable Guests) × 100

Description: |
  Measures the percentage of eligible confirmed digital bookings made by guests who had at least one qualifying digital booking before the current booking confirmation timestamp. It quantifies repeat booking behavior within deterministically identified web and mobile guests without incorporating call-center, walk-in, travel-agent, or other offline booking history.

Category: Retention

Tags: [kpi]

Industry: [Travel & Hospitality]

Priority: High

Core Area: Monetization

Scope: Event

Measure Type: rate

Aggregation Window: Time based - Monthly


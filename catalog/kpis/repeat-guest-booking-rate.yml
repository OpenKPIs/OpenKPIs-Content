    locale,
    device_category,
    digital_guest_id,
    identity_namespace,
    authenticated_flag,
    deterministic_identity_flag,
    repeat_eligibility_flag,
    repeat_guest_flag,
    prior_qualifying_booking_count,
    first_prior_qualifying_booking_timestamp,
    latest_prior_qualifying_booking_timestamp,
    qualification_cutoff_timestamp,
    lookback_start_timestamp,
    qualification_rule_version,
    prior_booking_channel_scope,
    booking_source_system,
    consent_analytics_status,
    SUM(CASE WHEN repeat_eligibility_flag THEN 1 ELSE 0 END) OVER () AS eligible_confirmed_booking_count,
    SUM(CASE WHEN repeat_eligibility_flag AND repeat_guest_flag THEN 1 ELSE 0 END) OVER () AS repeat_guest_booking_count,
    CAST(SUM(CASE WHEN repeat_eligibility_flag AND repeat_guest_flag THEN 1 ELSE 0 END) OVER () AS DECIMAL(18,6))
      / NULLIF(SUM(CASE WHEN repeat_eligibility_flag THEN 1 ELSE 0 END) OVER (), 0) AS repeat_guest_booking_rate,
    100 * CAST(SUM(CASE WHEN repeat_eligibility_flag AND repeat_guest_flag THEN 1 ELSE 0 END) OVER () AS DECIMAL(18,6))
      / NULLIF(SUM(CASE WHEN repeat_eligibility_flag THEN 1 ELSE 0 END) OVER (), 0) AS repeat_guest_booking_rate_pct
  FROM confirmed_purchases
  ORDER BY confirmation_timestamp DESC, transaction_id;

Calculation Notes: |
  1️⃣ Use booking confirmation events for counting.  
  2️⃣ Count each booking once using the canonical booking identifier.  
  3️⃣ Classify repeat status based on current booking confirmation timestamp.  
  4️⃣ Prior bookings must meet specific criteria to qualify.  
  5️⃣ Exclude anonymous bookings from numerator and denominator.  
  6️⃣ Deduplicate various event types to ensure accurate counts.  
  7️⃣ Booking modifications do not count as new bookings unless canceled.

Business Use Case: |
  The Loyalty and Customer Marketing leadership team monitors this rate by acquisition channel, device, destination, property, loyalty status, and booking window to identify where digital guests fail to return. A sustained decline among previously high-value cohorts can trigger authenticated re-engagement campaigns, loyalty enrollment prompts, personalized destination recommendations, or direct-booking incentives, while increases are validated against cancellation rate and average booking value to ensure retention growth is economically productive.



KPI Name: Marketing-Sourced New Customer Rate
Formula: (First-Time Purchasers with Marketing First Touch / Total First-Time Purchasers) × 100

Description: |
  Share of first-time purchasers in a period whose first recorded digital touch was a marketing-driven channel (paid search, paid social, display, affiliate, email or SMS) rather than direct, organic or referral traffic. It isolates how much of new-customer growth is being bought or earned by the marketing program versus arriving on its own.

Category: Acquisition


























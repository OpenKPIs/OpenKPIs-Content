Google Analytics SQL: |
  -- ==========================================
  -- 1. GOOGLE BIGQUERY SQL
  -- ==========================================
  WITH raw_events AS (
    SELECT
      e.event_date,
      e.event_timestamp,
      e.event_name,
      e.user_pseudo_id,
      e.event_bundle_sequence_id,
      e.platform AS export_platform,
      e.ecommerce.transaction_id AS ecommerce_transaction_id,
      e.ecommerce.purchase_revenue AS ecommerce_value,
      e.ecommerce.tax_value AS ecommerce_tax,
      e.ecommerce.shipping_value AS ecommerce_shipping,
      e.ecommerce.currency AS ecommerce_currency,
      (
        SELECT AS STRUCT
          i.item_id,
          i.item_name,
          i.item_brand,
          i.item_category,
          i.item_category2,
          i.item_category3,
          i.item_variant,
          i.price,
          i.quantity,
          i.coupon
        FROM UNNEST(e.items) AS i
        ORDER BY i.item_list_index
        LIMIT 1
      ) AS first_item,
      e.event_params
    FROM `your-project.analytics_123456789.events_*` AS e
    WHERE _TABLE_SUFFIX BETWEEN FORMAT_DATE('%Y%m%d', @start_date)
                            AND FORMAT_DATE('%Y%m%d', DATE_ADD(@end_date, INTERVAL 30 DAY))
      AND e.event_name IN ('search', 'view_search_results', 'purchase')
  ),
  pivoted_events AS (
    SELECT
      r.* EXCEPT(event_params),
      MAX(IF(ep.key = 'event_id', ep.value.string_value, NULL)) AS event_id,
      MAX(IF(ep.key = 'analytics_session_id', COALESCE(ep.value.string_value, CAST(ep.value.int_value AS STRING)), NULL)) AS analytics_session_id,
      MAX(IF(ep.key = 'session_eligible', COALESCE(ep.value.string_value, CAST(ep.value.int_value AS STRING)), NULL)) AS session_eligible_raw,
      MAX(IF(ep.key = 'platform', ep.value.string_value, NULL)) AS instrumented_platform,
      MAX(IF(ep.key = 'channel', ep.value.string_value, NULL)) AS channel,
      MAX(IF(ep.key = 'page_location', ep.value.string_value, NULL)) AS page_location,
      MAX(IF(ep.key = 'page_referrer', ep.value.string_value, NULL)) AS page_referrer,
      MAX(IF(ep.key = 'market', ep.value.string_value, NULL)) AS market,
      MAX(IF(ep.key = 'language', ep.value.string_value, NULL)) AS language,
      MAX(IF(ep.key = 'search_id', ep.value.string_value, NULL)) AS search_id,
      MAX(IF(ep.key = 'search_timestamp', ep.value.string_value, NULL)) AS search_timestamp_raw,
      MAX(IF(ep.key = 'search_valid', COALESCE(ep.value.string_value, CAST(ep.value.int_value AS STRING)), NULL)) AS search_valid_raw,
      MAX(IF(ep.key = 'search_term', ep.value.string_value, NULL)) AS search_term,
      MAX(IF(ep.key = 'search_type', ep.value.string_value, NULL)) AS search_type,
      MAX(IF(ep.key = 'origin_code', ep.value.string_value, NULL)) AS origin_code,
      MAX(IF(ep.key = 'origin_city', ep.value.string_value, NULL)) AS origin_city,
      MAX(IF(ep.key = 'origin_country', ep.value.string_value, NULL)) AS origin_country,
      MAX(IF(ep.key = 'destination_code', ep.value.string_value, NULL)) AS destination_code,
      MAX(IF(ep.key = 'destination_city', ep.value.string_value, NULL)) AS destination_city,
      MAX(IF(ep.key = 'destination_country', ep.value.string_value, NULL)) AS destination_country,
      MAX(IF(ep.key = 'departure_date', ep.value.string_value, NULL)) AS departure_date_raw,
      MAX(IF(ep.key = 'return_date', ep.value.string_value, NULL)) AS return_date_raw,
      MAX(IF(ep.key = 'trip_type', ep.value.string_value, NULL)) AS trip_type,
      MAX(IF(ep.key = 'cabin_class', ep.value.string_value, NULL)) AS cabin_class,
      MAX(IF(ep.key = 'fare_class', ep.value.string_value, NULL)) AS fare_class,
      MAX(IF(ep.key = 'adult_count', ep.value.int_value, NULL)) AS adult_count,
      MAX(IF(ep.key = 'child_count', ep.value.int_value, NULL)) AS child_count,
      MAX(IF(ep.key = 'infant_count', ep.value.int_value, NULL)) AS infant_count,
      MAX(IF(ep.key = 'passenger_count', ep.value.int_value, NULL)) AS passenger_count,
      MAX(IF(ep.key = 'room_count', ep.value.int_value, NULL)) AS room_count,
      MAX(IF(ep.key = 'nights_count', ep.value.int_value, NULL)) AS nights_count,
      MAX(IF(ep.key = 'travel_product_type', ep.value.string_value, NULL)) AS travel_product_type,
      MAX(IF(ep.key = 'carrier_code', ep.value.string_value, NULL)) AS carrier_code,
      MAX(IF(ep.key = 'itinerary_id', ep.value.string_value, NULL)) AS itinerary_id,
      MAX(IF(ep.key = 'selected_offer_id', ep.value.string_value, NULL)) AS selected_offer_id,
      MAX(IF(ep.key = 'matching_search_id', ep.value.string_value, NULL)) AS matching_search_id,
      MAX(IF(ep.key = 'itinerary_match', COALESCE(ep.value.string_value, CAST(ep.value.int_value AS STRING)), NULL)) AS itinerary_match_raw,
      MAX(IF(ep.key = 'booking_status', ep.value.string_value, NULL)) AS booking_status,
      MAX(IF(ep.key = 'booking_timestamp', ep.value.string_value, NULL)) AS booking_timestamp_raw,
      MAX(IF(ep.key = 'booking_channel', ep.value.string_value, NULL)) AS booking_channel,
      MAX(IF(ep.key = 'payment_type', ep.value.string_value, NULL)) AS payment_type,
      MAX(IF(ep.key = 'loyalty_status', ep.value.string_value, NULL)) AS loyalty_status,
      MAX(IF(ep.key = 'login_status', ep.value.string_value, NULL)) AS login_status,
      MAX(IF(ep.key = 'analytics_consent', COALESCE(ep.value.string_value, CAST(ep.value.int_value AS STRING)), NULL)) AS analytics_consent_raw,
      MAX(IF(ep.key = 'campaign_id', ep.value.string_value, NULL)) AS campaign_id,
      MAX(IF(ep.key = 'source', ep.value.string_value, NULL)) AS source,
      MAX(IF(ep.key = 'medium', ep.value.string_value, NULL)) AS medium,
      MAX(IF(ep.key = 'device_category', ep.value.string_value, NULL)) AS device_category,
      MAX(IF(ep.key = 'transaction_id', ep.value.string_value, NULL)) AS parameter_transaction_id,
      MAX(IF(ep.key = 'value', COALESCE(ep.value.double_value, ep.value.float_value, CAST(ep.value.int_value AS FLOAT64)), NULL)) AS parameter_value,
      MAX(IF(ep.key = 'tax', COALESCE(ep.value.double_value, ep.value.float_value, CAST(ep.value.int_value AS FLOAT64)), NULL)) AS parameter_tax,
      MAX(IF(ep.key = 'shipping', COALESCE(ep.value.double_value, ep.value.float_value, CAST(ep.value.int_value AS FLOAT64)), NULL)) AS parameter_shipping,
      MAX(IF(ep.key = 'currency', ep.value.string_value, NULL)) AS parameter_currency,
      MAX(IF(ep.key = 'coupon', ep.value.string_value, NULL)) AS parameter_coupon
    FROM raw_events AS r
    LEFT JOIN UNNEST(r.event_params) AS ep
    GROUP BY ALL
  ),
  typed_events AS (
    SELECT
      *,
      TIMESTAMP_MICROS(event_timestamp) AS collected_event_timestamp,
      COALESCE(SAFE_CAST(search_timestamp_raw AS TIMESTAMP), TIMESTAMP_MICROS(event_timestamp)) AS search_timestamp,
      COALESCE(SAFE_CAST(booking_timestamp_raw AS TIMESTAMP), TIMESTAMP_MICROS(event_timestamp)) AS booking_timestamp,
      SAFE_CAST(departure_date_raw AS DATE) AS departure_date,
      SAFE_CAST(return_date_raw AS DATE) AS return_date,
      LOWER(session_eligible_raw) IN ('true', '1') AS session_eligible,
      LOWER(search_valid_raw) IN ('true', '1') AS search_valid,
      LOWER(itinerary_match_raw) IN ('true', '1') AS itinerary_match,
      LOWER(analytics_consent_raw) IN ('true', '1') AS analytics_consent,
      COALESCE(instrumented_platform, export_platform) AS platform,
      COALESCE(parameter_transaction_id, ecommerce_transaction_id) AS transaction_id,
      COALESCE(parameter_value, ecommerce_value) AS transaction_value,
      COALESCE(parameter_tax, ecommerce_tax) AS transaction_tax,
      COALESCE(parameter_shipping, ecommerce_shipping) AS transaction_shipping,
      COALESCE(parameter_currency, ecommerce_currency) AS transaction_currency
    FROM pivoted_events
  ),
  valid_searches AS (
    SELECT * EXCEPT(search_rank)
    FROM (
      SELECT
        t.*,
        ROW_NUMBER() OVER (
          PARTITION BY t.search_id
          ORDER BY t.search_timestamp, t.collected_event_timestamp, t.event_id
        ) AS search_rank
      FROM typed_events AS t
      WHERE t.event_name IN ('search', 'view_search_results')
        AND t.search_id IS NOT NULL
        AND t.search_valid
        AND t.session_eligible
        AND t.analytics_consent
        AND DATE(t.search_timestamp) BETWEEN @start_date AND @end_date
    )
    WHERE search_rank = 1
  ),
  confirmed_bookings AS (
    SELECT * EXCEPT(booking_rank)
    FROM (
      SELECT
        t.*,
        ROW_NUMBER() OVER (
          PARTITION BY t.matching_search_id
          ORDER BY t.booking_timestamp, t.collected_event_timestamp, t.event_id, t.transaction_id
        ) AS booking_rank
      FROM typed_events AS t
      WHERE t.event_name = 'purchase'
        AND t.matching_search_id IS NOT NULL
        AND t.transaction_id IS NOT NULL
        AND LOWER(t.booking_status) = 'confirmed'
        AND t.itinerary_match
        AND t.session_eligible
        AND t.analytics_consent
    )
    WHERE booking_rank = 1
  ),
  search_booking_population AS (
    SELECT
      DATE(s.search_timestamp) AS search_date,
      s.event_id AS search_event_id,
      s.collected_event_timestamp AS search_event_timestamp,
      s.analytics_session_id,
      s.user_pseudo_id,
      s.search_id,
      s.search_timestamp,
      s.session_eligible,
      s.search_valid,
      s.analytics_consent,
      s.platform,
      s.channel,
      s.page_location,
      s.page_referrer,
      s.market,
      s.language,
      s.search_term,
      s.search_type,
      s.origin_code,
      s.origin_city,
      s.origin_country,
      s.destination_code,
      s.destination_city,
      s.destination_country,
      s.departure_date,
      s.return_date,
      s.trip_type,
      s.cabin_class,
      s.fare_class,
      s.adult_count,
      s.child_count,
      s.infant_count,
      s.passenger_count,
      s.room_count,
      s.nights_count,
      s.travel_product_type,
      s.carrier_code,
      s.itinerary_id,
      s.selected_offer_id,
      s.loyalty_status,
      s.login_status,
      s.campaign_id,
      s.source,
      s.medium,
      s.device_category,
      b.event_id AS booking_event_id,
      b.matching_search_id,
      b.itinerary_match,
      b.booking_status,
      b.booking_timestamp,
      b.booking_channel,
      b.payment_type,
      b.transaction_id,
      b.transaction_value,
      b.transaction_tax,
      b.transaction_shipping,
      b.transaction_currency,
      b.parameter_coupon AS coupon,
      b.first_item.item_id AS booked_item_id,
      b.first_item.item_name AS booked_item_name,
      b.first_item.item_brand AS booked_item_brand,
      b.first_item.item_category AS booked_item_category,
      b.first_item.item_category2 AS booked_item_category2,
      b.first_item.item_category3 AS booked_item_category3,
      b.first_item.item_variant AS booked_item_variant,
      b.first_item.price AS booked_item_price,
      b.first_item.quantity AS booked_item_quantity,
      CASE WHEN b.transaction_id IS NOT NULL THEN 1 ELSE 0 END AS booked_search_flag
    FROM valid_searches AS s
    LEFT JOIN confirmed_bookings AS b
      ON b.matching_search_id = s.search_id
     AND b.booking_timestamp >= s.search_timestamp
     AND b.booking_timestamp < TIMESTAMP_ADD(s.search_timestamp, INTERVAL 30 DAY)
  )
  SELECT
    p.*,
    COUNT(*) OVER (PARTITION BY p.search_date) AS total_valid_searches,
    COUNTIF(p.booked_search_flag = 1) OVER (PARTITION BY p.search_date) AS searches_with_confirmed_booking,
    ROUND(
      100 * SAFE_DIVIDE(
        COUNTIF(p.booked_search_flag = 1) OVER (PARTITION BY p.search_date),
        COUNT(*) OVER (PARTITION BY p.search_date)
      ),
      4
    ) AS travel_search_to_booking_rate_pct
  FROM search_booking_population AS p
  ORDER BY p.search_date, p.search_timestamp, p.search_id;

AEP Query Service SQL: |
  -- ==========================================
  -- 2. ADOBE AEP QUERY SERVICE SQL
  -- ==========================================
  WITH normalized_events AS (
    SELECT
      eventType,
      eventMergeId AS event_id,
      CAST(timestamp AS TIMESTAMP) AS collected_event_timestamp,
      _travelSearchBooking.analyticsSessionId AS analytics_session_id,
      _travelSearchBooking.sessionEligible AS session_eligible,
      _travelSearchBooking.platform AS platform,
      _travelSearchBooking.channel AS channel,
      _travelSearchBooking.pageLocation AS page_location,
      _travelSearchBooking.pageReferrer AS page_referrer,
      _travelSearchBooking.market AS market,
      _travelSearchBooking.language AS language,
      _travelSearchBooking.searchId AS search_id,
      COALESCE(
        CAST(_travelSearchBooking.searchTimestamp AS TIMESTAMP),
        CAST(timestamp AS TIMESTAMP)
      ) AS search_timestamp,
      _travelSearchBooking.searchValid AS search_valid,
      _travelSearchBooking.searchTerm AS search_term,
      _travelSearchBooking.searchType AS search_type,
      _travelSearchBooking.originCode AS origin_code,
      _travelSearchBooking.originCity AS origin_city,
      _travelSearchBooking.originCountry AS origin_country,
      _travelSearchBooking.destinationCode AS destination_code,
      _travelSearchBooking.destinationCity AS destination_city,
      _travelSearchBooking.destinationCountry AS destination_country,
      CAST(_travelSearchBooking.departureDate AS DATE) AS departure_date,
      CAST(_travelSearchBooking.returnDate AS DATE) AS return_date,
      _travelSearchBooking.tripType AS trip_type,
      _travelSearchBooking.cabinClass AS cabin_class,
      _travelSearchBooking.fareClass AS fare_class,
      _travelSearchBooking.adultCount AS adult_count,
      _travelSearchBooking.childCount AS child_count,
      _travelSearchBooking.infantCount AS infant_count,
      _travelSearchBooking.passengerCount AS passenger_count,
      _travelSearchBooking.roomCount AS room_count,
      _travelSearchBooking.nightsCount AS nights_count,
      _travelSearchBooking.travelProductType AS travel_product_type,
      _travelSearchBooking.carrierCode AS carrier_code,
      _travelSearchBooking.itineraryId AS itinerary_id,
      _travelSearchBooking.selectedOfferId AS selected_offer_id,
      _travelSearchBooking.matchingSearchId AS matching_search_id,
      _travelSearchBooking.itineraryMatch AS itinerary_match,
      _travelSearchBooking.bookingStatus AS booking_status,
      COALESCE(
        CAST(_travelSearchBooking.bookingTimestamp AS TIMESTAMP),
        CAST(timestamp AS TIMESTAMP)
      ) AS booking_timestamp,
      _travelSearchBooking.bookingChannel AS booking_channel,
      _travelSearchBooking.paymentType AS payment_type,
      _travelSearchBooking.loyaltyStatus AS loyalty_status,
      _travelSearchBooking.loginStatus AS login_status,
      _travelSearchBooking.analyticsConsent AS analytics_consent,
      _travelSearchBooking.campaignId AS campaign_id,
      _travelSearchBooking.source AS source,
      _travelSearchBooking.medium AS medium,
      _travelSearchBooking.deviceCategory AS device_category,
      commerce.order.purchaseID AS transaction_id,
      commerce.order.priceTotal AS transaction_value,
      commerce.order.currencyCode AS transaction_currency,
      _travelSearchBooking.basePrice AS base_price,
      _travelSearchBooking.discount AS discount,
      _travelSearchBooking.tax AS transaction_tax,
      _travelSearchBooking.fees AS transaction_fees,
      _travelSearchBooking.coupon AS coupon,
      productListItems[0].SKU AS booked_item_id,
      productListItems[0].name AS booked_item_name,
      productListItems[0].quantity AS booked_item_quantity,
      productListItems[0].priceTotal AS booked_item_value,
      productListItems[0].selectedOptions AS booked_item_selected_options
    FROM aep_travel_digital_events
    WHERE CAST(timestamp AS DATE) BETWEEN CAST('${START_DATE}' AS DATE)
                                      AND DATE_ADD(CAST('${END_DATE}' AS DATE), 30)
      AND (
        eventType IN ('search', 'view_search_results', 'commerce.purchases')
        OR commerce.purchases.value > 0
      )
  ),
  valid_searches AS (
    SELECT *
    FROM (
      SELECT
        n.*,
        ROW_NUMBER() OVER (
          PARTITION BY n.search_id
          ORDER BY n.search_timestamp, n.collected_event_timestamp, n.event_id
        ) AS search_rank
      FROM normalized_events AS n
      WHERE n.eventType IN ('search', 'view_search_results')
        AND n.search_id IS NOT NULL
        AND n.search_valid = true
        AND n.session_eligible = true
        AND n.analytics_consent = true
        AND CAST(n.search_timestamp AS DATE) BETWEEN CAST('${START_DATE}' AS DATE)
                                                  AND CAST('${END_DATE}' AS DATE)
    ) ranked_searches
    WHERE search_rank = 1
  ),
  confirmed_bookings AS (
    SELECT *
    FROM (
      SELECT
        n.*,
        ROW_NUMBER() OVER (
          PARTITION BY n.matching_search_id
          ORDER BY n.booking_timestamp, n.collected_event_timestamp, n.event_id, n.transaction_id
        ) AS booking_rank
      FROM normalized_events AS n
      WHERE (n.eventType = 'commerce.purchases' OR n.transaction_id IS NOT NULL)
        AND n.matching_search_id IS NOT NULL
        AND n.transaction_id IS NOT NULL
        AND LOWER(n.booking_status) = 'confirmed'
        AND n.itinerary_match = true
        AND n.session_eligible = true
        AND n.analytics_consent = true
    ) ranked_bookings
    WHERE booking_rank = 1
  ),
  search_booking_population AS (
    SELECT
      CAST(s.search_timestamp AS DATE) AS search_date,
      s.event_id AS search_event_id,
      s.collected_event_timestamp AS search_event_timestamp,
      s.analytics_session_id,
      s.search_id,
      s.search_timestamp,
      s.session_eligible,
      s.search_valid,
      s.analytics_consent,
      s.platform,
      s.channel,
      s.page_location,
      s.page_referrer,
      s.market,
      s.language,
      s.search_term,
      s.search_type,
      s.origin_code,
      s.origin_city,
      s.origin_country,
      s.destination_code,
      s.destination_city,
      s.destination_country,
      s.departure_date,
      s.return_date,
      s.trip_type,
      s.cabin_class,
      s.fare_class,
      s.adult_count,
      s.child_count,
      s.infant_count,
      s.passenger_count,
      s.room_count,
      s.nights_count,
      s.travel_product_type,
      s.carrier_code,
      s.itinerary_id,
      s.selected_offer_id,
      s.loyalty_status,
      s.login_status,
      s.campaign_id,
      s.source,
      s.medium,
      s.device_category,
      b.event_id AS booking_event_id,
      b.matching_search_id,
      b.itinerary_match,
      b.booking_status,
      b.booking_timestamp,
      b.booking_channel,
      b.payment_type,
      b.transaction_id,
      b.transaction_value,
      b.transaction_currency,
      b.base_price,
      b.discount,
      b.transaction_tax,
      b.transaction_fees,
      b.coupon,
      b.booked_item_id,
      b.booked_item_name,
      b.booked_item_quantity,
      b.booked_item_value,
      b.booked_item_selected_options,
      CASE WHEN b.transaction_id IS NOT NULL THEN 1 ELSE 0 END AS booked_search_flag
    FROM valid_searches AS s
    LEFT JOIN confirmed_bookings AS b
      ON b.matching_search_id = s.search_id
     AND b.booking_timestamp >= s.search_timestamp
     AND b.booking_timestamp < s.search_timestamp + INTERVAL 30 DAYS
  )
  SELECT
    p.*,
    COUNT(1) OVER (PARTITION BY p.search_date) AS total_valid_searches,
    SUM(p.booked_search_flag) OVER (PARTITION BY p.search_date) AS searches_with_confirmed_booking,
    ROUND(
      100.0 * SUM(p.booked_search_flag) OVER (PARTITION BY p.search_date)
      / NULLIF(COUNT(1) OVER (PARTITION BY p.search_date), 0),
      4
    ) AS travel_search_to_booking_rate_pct
  FROM search_booking_population AS p
  ORDER BY p.search_date, p.search_timestamp, p.search_id;

Calculation Notes: |
  1️⃣ Calculate KPI using session-level binary indicators.  
  2️⃣ Assign session to reporting date of first eligible search.  
  3️⃣ Attribute confirmed booking to latest preceding search with matching itinerary key.  
  4️⃣ Use governed product-specific matching if exact key is unavailable.  
  5️⃣ Preserve sessions across approved first-party web-to-booking-engine domains.  
  6️⃣ Exclude direct bookings with no eligible search from numerator and denominator.  
  7️⃣ Reprocess late digital events within defined correction window before closing reporting period.

Business Use Case: |
  The Digital Product and Revenue Management teams review this rate by product type, device, market, destination, departure window, and search-results state. A material decline concentrated in mobile hotel searches with available inventory triggers investigation of search latency, price changes, result ranking, checkout handoff, and payment defects; a decline concentrated in zero-result searches drives inventory, route, rate-plan, or date-flexibility actions.



KPI Name: Travel Search-to-Booking Rate
Formula: (Unique Eligible Search Sessions with at Least One Attributable Confirmed Booking / Total Unique Eligible Search Sessions) × 100

Description: |
  Measures the percentage of eligible digital sessions containing a valid travel search that subsequently produce a confirmed booking for a matching searched itinerary within the same analytics session. It indicates how effectively the digital discovery and booking journey converts demonstrated travel intent into completed reservations.

Category: Conversion

Tags: [kpi]

Industry: [Travel & Hospitality]

Priority: High

Core Area: Discovery

Scope: Session

Measure Type: rate

Aggregation Window: Time based - Daily


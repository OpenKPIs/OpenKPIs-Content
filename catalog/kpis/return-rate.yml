KPI Name: Return Rate
Formula: (Units Returned from Orders Placed in the Cohort Period / Units Sold in the Same Cohort Period) × 100

Description: |
  Return Rate is the share of units sold and delivered from a given order cohort that customers send back within the published return window, measured against the original order date rather than the date the return is processed. It is the primary quality and fit signal for merchandising, because a rising rate on a category or supplier erodes contribution margin through reverse-logistics cost, restocking effort and markdown on returned inventory long before it shows up in net revenue.


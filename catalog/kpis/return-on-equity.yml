# KPI: Return on Equity
# Generated: 2026-09-12T19:30:09.027Z
# Contributed by: devyendarm
# Last modified by: devyendarm

KPI Name: Return on Equity
Formula: (Net Income Attributable to Common Shareholders / ((Beginning Common Shareholders' Equity + Ending Common Shareholders' Equity) / 2)) × 100

Description: |
  Return on Equity measures the percentage of profit generated for common shareholders from the average common equity invested during a reporting period. It shows whether customer acquisition, engagement, conversion, retention, billing, and lifetime-value activities collectively produce sufficient earnings relative to the equity capital supporting those activities.

Category: Performance

Tags: [kpi]

Industry: [FinTech & Banking]

Priority: High

Core Area: Monetization

Scope: Global

Measure Type: percentage

Aggregation Window: Time based - Monthly/Quarterly/Yearly







Google Analytics SQL: |
  -- ==========================================
  -- 1. GOOGLE BIGQUERY SQL
  -- ==========================================
  WITH
  reporting_period AS (
    SELECT
      DATE_TRUNC(DATE_SUB(DATE_TRUNC(CURRENT_DATE(), MONTH), INTERVAL 1 DAY), YEAR) AS period_start,
      DATE_SUB(DATE_TRUNC(CURRENT_DATE(), MONTH), INTERVAL 1 DAY) AS period_end
  ),
  net_income AS (
    SELECT
      p.reporting_entity_id,
      p.legal_entity_id,
      p.ledger_id,
      p.reporting_currency,
      SUM(p.signed_amount * m.reporting_sign_multiplier) AS net_income_amount,
      COUNT(DISTINCT p.posting_id) AS income_posting_count,
      MAX(p.ingested_at) AS income_freshness_timestamp
    FROM `your-project.finance.fct_gl_postings` AS p
    INNER JOIN `your-project.finance.dim_gl_account_mapping` AS m
      ON p.account_id = m.account_id
     AND p.posting_date BETWEEN m.effective_start_date
                            AND COALESCE(m.effective_end_date, DATE '9999-12-31')
    CROSS JOIN reporting_period AS rp
    WHERE p.posting_date BETWEEN rp.period_start AND rp.period_end
      AND p.posting_status = 'POSTED'
      AND p.ledger_type = 'ACTUAL'
      AND p.consolidation_status = 'CONSOLIDATED'
      AND m.roe_component = 'NET_INCOME'
    GROUP BY 1, 2, 3, 4
  ),
  beginning_equity_ranked AS (
    SELECT
      b.reporting_entity_id,
      b.legal_entity_id,
      b.ledger_id,
      b.reporting_currency,
      b.account_id,
      b.balance_date,
      b.ending_balance_amount * m.reporting_sign_multiplier AS equity_amount,
      b.ingested_at,
      ROW_NUMBER() OVER (
        PARTITION BY
          b.reporting_entity_id,
          b.legal_entity_id,
          b.ledger_id,
          b.reporting_currency,
          b.account_id
        ORDER BY b.balance_date DESC, b.ingested_at DESC
      ) AS row_num
    FROM `your-project.finance.fct_gl_daily_balances` AS b
    INNER JOIN `your-project.finance.dim_gl_account_mapping` AS m
      ON b.account_id = m.account_id
     AND b.balance_date BETWEEN m.effective_start_date
                            AND COALESCE(m.effective_end_date, DATE '9999-12-31')
    CROSS JOIN reporting_period AS rp
    WHERE b.balance_date < rp.period_start
      AND b.ledger_type = 'ACTUAL'
      AND b.consolidation_status = 'CONSOLIDATED'
      AND m.roe_component = 'SHAREHOLDERS_EQUITY'
  ),
  beginning_equity AS (
    SELECT
      reporting_entity_id,
      legal_entity_id,
      ledger_id,
      reporting_currency,
      SUM(equity_amount) AS beginning_equity_amount,
      MAX(balance_date) AS beginning_equity_observation_date,
      COUNT(*) AS beginning_equity_observation_count,
      MAX(ingested_at) AS beginning_equity_freshness_timestamp
    FROM beginning_equity_ranked
    WHERE row_num = 1
    GROUP BY 1, 2, 3, 4
  ),
  ending_equity_ranked AS (
    SELECT
      b.reporting_entity_id,
      b.legal_entity_id,
      b.ledger_id,
      b.reporting_currency,
      b.account_id,
      b.balance_date,
      b.ending_balance_amount * m.reporting_sign_multiplier AS equity_amount,
      b.ingested_at,
      ROW_NUMBER() OVER (
        PARTITION BY
          b.reporting_entity_id,
          b.legal_entity_id,
          b.ledger_id,
          b.reporting_currency,
          b.account_id
        ORDER BY b.balance_date DESC, b.ingested_at DESC
      ) AS row_num
    FROM `your-project.finance.fct_gl_daily_balances` AS b
    INNER JOIN `your-project.finance.dim_gl_account_mapping` AS m
      ON b.account_id = m.account_id
     AND b.balance_date BETWEEN m.effective_start_date
                            AND COALESCE(m.effective_end_date, DATE '9999-12-31')
    CROSS JOIN reporting_period AS rp
    WHERE b.balance_date <= rp.period_end
      AND b.ledger_type = 'ACTUAL'
      AND b.consolidation_status = 'CONSOLIDATED'
      AND m.roe_component = 'SHAREHOLDERS_EQUITY'
  ),
  ending_equity AS (
    SELECT
      reporting_entity_id,
      legal_entity_id,
      ledger_id,
      reporting_currency,
      SUM(equity_amount) AS ending_equity_amount,
      MAX(balance_date) AS ending_equity_observation_date,
      COUNT(*) AS ending_equity_observation_count,
      MAX(ingested_at) AS ending_equity_freshness_timestamp
    FROM ending_equity_ranked
    WHERE row_num = 1
    GROUP BY 1, 2, 3, 4
  ),
  calculation_grain AS (
    SELECT reporting_entity_id, legal_entity_id, ledger_id, reporting_currency FROM net_income
    UNION DISTINCT
    SELECT reporting_entity_id, legal_entity_id, ledger_id, reporting_currency FROM beginning_equity
    UNION DISTINCT
    SELECT reporting_entity_id, legal_entity_id, ledger_id, reporting_currency FROM ending_equity
  ),
  roe_components AS (
    SELECT
      g.reporting_entity_id,
      g.legal_entity_id,
      g.ledger_id,
      g.reporting_currency,
      i.net_income_amount,
      b.beginning_equity_amount,
      e.ending_equity_amount,
      SAFE_DIVIDE(b.beginning_equity_amount + e.ending_equity_amount, 2) AS average_equity_amount,
      b.beginning_equity_observation_date,
      e.ending_equity_observation_date,
      COALESCE(b.beginning_equity_observation_count, 0)
        + COALESCE(e.ending_equity_observation_count, 0) AS equity_observation_count,
      COALESCE(i.income_posting_count, 0) AS income_posting_count,
      NULLIF(
        GREATEST(
          COALESCE(i.income_freshness_timestamp, TIMESTAMP '1970-01-01 00:00:00+00'),
          COALESCE(b.beginning_equity_freshness_timestamp, TIMESTAMP '1970-01-01 00:00:00+00'),
          COALESCE(e.ending_equity_freshness_timestamp, TIMESTAMP '1970-01-01 00:00:00+00')
        ),
        TIMESTAMP '1970-01-01 00:00:00+00'
      ) AS data_freshness_timestamp
    FROM calculation_grain AS g
    LEFT JOIN net_income AS i
      USING (reporting_entity_id, legal_entity_id, ledger_id, reporting_currency)
    LEFT JOIN beginning_equity AS b
      USING (reporting_entity_id, legal_entity_id, ledger_id, reporting_currency)
    LEFT JOIN ending_equity AS e
      USING (reporting_entity_id, legal_entity_id, ledger_id, reporting_currency)
  ),
  final_calculation AS (
    SELECT
      c.*,
      rp.period_start,
      rp.period_end,
      DATE_DIFF(rp.period_end, rp.period_start, DAY) + 1 AS period_days,
      DATE_DIFF(DATE_ADD(DATE_TRUNC(rp.period_end, YEAR), INTERVAL 1 YEAR), DATE_TRUNC(rp.period_end, YEAR), DAY) AS annualization_days,
      SAFE_DIVIDE(
        DATE_DIFF(DATE_ADD(DATE_TRUNC(rp.period_end, YEAR), INTERVAL 1 YEAR), DATE_TRUNC(rp.period_end, YEAR), DAY),
        DATE_DIFF(rp.period_end, rp.period_start, DAY) + 1
      ) AS annualization_factor
    FROM roe_components AS c
    CROSS JOIN reporting_period AS rp
  )
  SELECT
    'Return on Equity' AS kpi_name,
    'ROE' AS kpi_code,
    'PROFITABILITY' AS kpi_category,
    f.period_start AS reporting_period_start_date,
    f.period_end AS reporting_period_end_date,
    f.period_end AS as_of_date,
    EXTRACT(YEAR FROM f.period_end) AS fiscal_year,
    EXTRACT(QUARTER FROM f.period_end) AS fiscal_quarter,
    EXTRACT(MONTH FROM f.period_end) AS fiscal_month,
    f.period_days,
    f.annualization_days,
    f.annualization_factor,
    f.reporting_entity_id,
    re.legal_entity_name AS reporting_entity_name,
    f.legal_entity_id,
    le.legal_entity_name,
    le.consolidation_scope,
    ld.ledger_name,
    le.accounting_standard,
    f.reporting_currency,
    f.net_income_amount,
    f.beginning_equity_amount,
    f.ending_equity_amount,
    f.average_equity_amount,
    SAFE_DIVIDE(f.net_income_amount * f.annualization_factor, f.average_equity_amount) AS return_on_equity_ratio,
    100 * SAFE_DIVIDE(f.net_income_amount * f.annualization_factor, f.average_equity_amount) AS return_on_equity_percent,
    'Annualized consolidated net income' AS numerator_name,
    'Average beginning and ending shareholders equity' AS denominator_name,
    'finance.fct_gl_postings' AS numerator_source,
    'finance.fct_gl_daily_balances' AS denominator_source,
    f.period_start AS numerator_start_date,
    f.period_end AS numerator_end_date,
    f.beginning_equity_observation_date AS denominator_beginning_observation_date,
    f.ending_equity_observation_date AS denominator_ending_observation_date,
    f.equity_observation_count,
    f.income_posting_count,
    f.period_days < f.annualization_days AS is_annualized,
    'ARITHMETIC_MEAN_OF_BEGINNING_AND_ENDING_EQUITY' AS equity_method,
    'CONSOLIDATED_POSTED_ACTUALS' AS income_basis,
    f.data_freshness_timestamp,
    CURRENT_TIMESTAMP() AS kpi_calculated_at,
    f.income_posting_count + f.equity_observation_count AS source_record_count,
    f.average_equity_amount IS NULL AS null_equity_flag,
    COALESCE(f.average_equity_amount <= 0, FALSE) AS zero_or_negative_equity_flag,
    CASE
      WHEN f.net_income_amount IS NULL THEN 'MISSING_NET_INCOME'
      WHEN f.beginning_equity_amount IS NULL THEN 'MISSING_BEGINNING_EQUITY'
      WHEN f.ending_equity_amount IS NULL THEN 'MISSING_ENDING_EQUITY'
      WHEN f.average_equity_amount <= 0 THEN 'NON_POSITIVE_AVERAGE_EQUITY'
      ELSE 'PASS'
    END AS data_quality_status,
    'ALL_PRODUCTS' AS product_scope,
    'ALL_CHANNELS' AS channel_scope,
    'ALL_CUSTOMER_COHORTS' AS customer_cohort_scope,
    '1.0.0' AS kpi_version
  FROM final_calculation AS f
  LEFT JOIN `your-project.finance.dim_legal_entity` AS re
    ON f.reporting_entity_id = re.legal_entity_id
   AND re.is_current = TRUE
  LEFT JOIN `your-project.finance.dim_legal_entity` AS le
    ON f.legal_entity_id = le.legal_entity_id
   AND le.is_current = TRUE
  LEFT JOIN `your-project.finance.dim_ledger` AS ld
    ON f.ledger_id = ld.ledger_id
   AND ld.is_current = TRUE;

AEP Query Service SQL: |
  -- ==========================================
  -- 2. ADOBE AEP QUERY SERVICE SQL
  -- ==========================================
  WITH
  reporting_period AS (
    SELECT
      CAST(DATE_TRUNC('year', DATE_TRUNC('month', CURRENT_DATE) - INTERVAL '1 day') AS DATE) AS period_start,
      CAST(DATE_TRUNC('month', CURRENT_DATE) - INTERVAL '1 day' AS DATE) AS period_end
  ),
  net_income AS (
    SELECT
      p.reporting_entity_id,
      p.legal_entity_id,
      p.ledger_id,
      p.reporting_currency,
      SUM(p.signed_amount * m.reporting_sign_multiplier) AS net_income_amount,
      COUNT(DISTINCT p.posting_id) AS income_posting_count,
      MAX(p.ingested_at) AS income_freshness_timestamp
    FROM finance_gl_postings AS p
    INNER JOIN finance_gl_account_mapping AS m
      ON p.account_id = m.account_id
     AND p.posting_date BETWEEN m.effective_start_date
                            AND COALESCE(m.effective_end_date, DATE '9999-12-31')
    CROSS JOIN reporting_period AS rp
    WHERE p.posting_date BETWEEN rp.period_start AND rp.period_end
      AND p.posting_status = 'POSTED'
      AND p.ledger_type = 'ACTUAL'
      AND p.consolidation_status = 'CONSOLIDATED'
      AND m.roe_component = 'NET_INCOME'
    GROUP BY 1, 2, 3, 4
  ),
  beginning_equity_ranked AS (
    SELECT
      b.reporting_entity_id,
      b.legal_entity_id,
      b.ledger_id,
      b.reporting_currency,
      b.account_id,
      b.balance_date,
      b.ending_balance_amount * m.reporting_sign_multiplier AS equity_amount,
      b.ingested_at,
      ROW_NUMBER() OVER (
        PARTITION BY
          b.reporting_entity_id,
          b.legal_entity_id,
          b.ledger_id,
          b.reporting_currency,
          b.account_id
        ORDER BY b.balance_date DESC, b.ingested_at DESC
      ) AS row_num
    FROM finance_gl_daily_balances AS b
    INNER JOIN finance_gl_account_mapping AS m
      ON b.account_id = m.account_id
     AND b.balance_date BETWEEN m.effective_start_date
                            AND COALESCE(m.effective_end_date, DATE '9999-12-31')
    CROSS JOIN reporting_period AS rp
    WHERE b.balance_date < rp.period_start
      AND b.ledger_type = 'ACTUAL'
      AND b.consolidation_status = 'CONSOLIDATED'
      AND m.roe_component = 'SHAREHOLDERS_EQUITY'
  ),
  beginning_equity AS (
    SELECT
      reporting_entity_id,
      legal_entity_id,
      ledger_id,
      reporting_currency,
      SUM(equity_amount) AS beginning_equity_amount,
      MAX(balance_date) AS beginning_equity_observation_date,
      COUNT(*) AS beginning_equity_observation_count,
      MAX(ingested_at) AS beginning_equity_freshness_timestamp
    FROM beginning_equity_ranked
    WHERE row_num = 1
    GROUP BY 1, 2, 3, 4
  ),
  ending_equity_ranked AS (
    SELECT
      b.reporting_entity_id,
      b.legal_entity_id,
      b.ledger_id,
      b.reporting_currency,
      b.account_id,
      b.balance_date,
      b.ending_balance_amount * m.reporting_sign_multiplier AS equity_amount,
      b.ingested_at,
      ROW_NUMBER() OVER (
        PARTITION BY
          b.reporting_entity_id,
          b.legal_entity_id,
          b.ledger_id,
          b.reporting_currency,
          b.account_id
        ORDER BY b.balance_date DESC, b.ingested_at DESC
      ) AS row_num
    FROM finance_gl_daily_balances AS b
    INNER JOIN finance_gl_account_mapping AS m
      ON b.account_id = m.account_id
     AND b.balance_date BETWEEN m.effective_start_date
                            AND COALESCE(m.effective_end_date, DATE '9999-12-31')
    CROSS JOIN reporting_period AS rp
    WHERE b.balance_date <= rp.period_end
      AND b.ledger_type = 'ACTUAL'
      AND b.consolidation_status = 'CONSOLIDATED'
      AND m.roe_component = 'SHAREHOLDERS_EQUITY'
  ),
  ending_equity AS (
    SELECT
      reporting_entity_id,
      legal_entity_id,
      ledger_id,
      reporting_currency,
      SUM(equity_amount) AS ending_equity_amount,
      MAX(balance_date) AS ending_equity_observation_date,
      COUNT(*) AS ending_equity_observation_count,
      MAX(ingested_at) AS ending_equity_freshness_timestamp
    FROM ending_equity_ranked
    WHERE row_num = 1
    GROUP BY 1, 2, 3, 4
  ),
  calculation_grain AS (
    SELECT reporting_entity_id, legal_entity_id, ledger_id, reporting_currency FROM net_income
    UNION
    SELECT reporting_entity_id, legal_entity_id, ledger_id, reporting_currency FROM beginning_equity
    UNION
    SELECT reporting_entity_id, legal_entity_id, ledger_id, reporting_currency FROM ending_equity
  ),
  roe_components AS (
    SELECT
      g.reporting_entity_id,
      g.legal_entity_id,
      g.ledger_id,
      g.reporting_currency,
      i.net_income_amount,
      b.beginning_equity_amount,
      e.ending_equity_amount,
      (b.beginning_equity_amount + e.ending_equity_amount) / 2.0 AS average_equity_amount,
      b.beginning_equity_observation_date,
      e.ending_equity_observation_date,
      COALESCE(b.beginning_equity_observation_count, 0)
        + COALESCE(e.ending_equity_observation_count, 0) AS equity_observation_count,
      COALESCE(i.income_posting_count, 0) AS income_posting_count,
      NULLIF(
        GREATEST(
          COALESCE(i.income_freshness_timestamp, TIMESTAMP '1970-01-01 00:00:00'),
          COALESCE(b.beginning_equity_freshness_timestamp, TIMESTAMP '1970-01-01 00:00:00'),
          COALESCE(e.ending_equity_freshness_timestamp, TIMESTAMP '1970-01-01 00:00:00')
        ),
        TIMESTAMP '1970-01-01 00:00:00'
      ) AS data_freshness_timestamp
    FROM calculation_grain AS g
    LEFT JOIN net_income AS i
      ON g.reporting_entity_id = i.reporting_entity_id
     AND g.legal_entity_id = i.legal_entity_id
     AND g.ledger_id = i.ledger_id
     AND g.reporting_currency = i.reporting_currency
    LEFT JOIN beginning_equity AS b
      ON g.reporting_entity_id = b.reporting_entity_id
     AND g.legal_entity_id = b.legal_entity_id
     AND g.ledger_id = b.ledger_id
     AND g.reporting_currency = b.reporting_currency
    LEFT JOIN ending_equity AS e
      ON g.reporting_entity_id = e.reporting_entity_id
     AND g.legal_entity_id = e.legal_entity_id
     AND g.ledger_id = e.ledger_id
     AND g.reporting_currency = e.reporting_currency
  ),
  final_calculation AS (
    SELECT
      c.*,
      rp.period_start,
      rp.period_end,
      (rp.period_end - rp.period_start + 1) AS period_days,
      (
        CAST(DATE_TRUNC('year', rp.period_end) + INTERVAL '1 year' AS DATE)
        - CAST(DATE_TRUNC('year', rp.period_end) AS DATE)
      ) AS annualization_days,
      CAST(
        CAST(DATE_TRUNC('year', rp.period_end) + INTERVAL '1 year' AS DATE)
        - CAST(DATE_TRUNC('year', rp.period_end) AS DATE)
        AS DECIMAL(18,6)
      ) / NULLIF(CAST(rp.period_end - rp.period_start + 1 AS DECIMAL(18,6)), 0) AS annualization_factor
    FROM roe_components AS c
    CROSS JOIN reporting_period AS rp
  )
  SELECT
    'Return on Equity' AS kpi_name,
    'ROE' AS kpi_code,
    'PROFITABILITY' AS kpi_category,
    f.period_start AS reporting_period_start_date,
    f.period_end AS reporting_period_end_date,
    f.period_end AS as_of_date,
    EXTRACT(YEAR FROM f.period_end) AS fiscal_year,
    EXTRACT(QUARTER FROM f.period_end) AS fiscal_quarter,
    EXTRACT(MONTH FROM f.period_end) AS fiscal_month,
    f.period_days,
    f.annualization_days,
    f.annualization_factor,
    f.reporting_entity_id,
    re.legal_entity_name AS reporting_entity_name,
    f.legal_entity_id,
    le.legal_entity_name,
    le.consolidation_scope,
    ld.ledger_name,
    le.accounting_standard,
    f.reporting_currency,
    f.net_income_amount,
    f.beginning_equity_amount,
    f.ending_equity_amount,
    f.average_equity_amount,
    (f.net_income_amount * f.annualization_factor) / NULLIF(f.average_equity_amount, 0) AS return_on_equity_ratio,
    100.0 * (f.net_income_amount * f.annualization_factor) / NULLIF(f.average_equity_amount, 0) AS return_on_equity_percent,
    'Annualized consolidated net income' AS numerator_name,
    'Average beginning and ending shareholders equity' AS denominator_name,
    'finance_gl_postings' AS numerator_source,
    'finance_gl_daily_balances' AS denominator_source,
    f.period_start AS numerator_start_date,
    f.period_end AS numerator_end_date,
    f.beginning_equity_observation_date AS denominator_beginning_observation_date,
    f.ending_equity_observation_date AS denominator_ending_observation_date,
    f.equity_observation_count,
    f.income_posting_count,
    CASE WHEN f.period_days < f.annualization_days THEN TRUE ELSE FALSE END AS is_annualized,
    'ARITHMETIC_MEAN_OF_BEGINNING_AND_ENDING_EQUITY' AS equity_method,
    'CONSOLIDATED_POSTED_ACTUALS' AS income_basis,
    f.data_freshness_timestamp,
    CURRENT_TIMESTAMP AS kpi_calculated_at,
    f.income_posting_count + f.equity_observation_count AS source_record_count,
    CASE WHEN f.average_equity_amount IS NULL THEN TRUE ELSE FALSE END AS null_equity_flag,
    CASE WHEN f.average_equity_amount <= 0 THEN TRUE ELSE FALSE END AS zero_or_negative_equity_flag,
    CASE
      WHEN f.net_income_amount IS NULL THEN 'MISSING_NET_INCOME'
      WHEN f.beginning_equity_amount IS NULL THEN 'MISSING_BEGINNING_EQUITY'
      WHEN f.ending_equity_amount IS NULL THEN 'MISSING_ENDING_EQUITY'
      WHEN f.average_equity_amount <= 0 THEN 'NON_POSITIVE_AVERAGE_EQUITY'
      ELSE 'PASS'
    END AS data_quality_status,
    'ALL_PRODUCTS' AS product_scope,
    'ALL_CHANNELS' AS channel_scope,
    'ALL_CUSTOMER_COHORTS' AS customer_cohort_scope,
    '1.0.0' AS kpi_version
  FROM final_calculation AS f
  LEFT JOIN finance_legal_entity AS re
    ON f.reporting_entity_id = re.legal_entity_id
   AND re.is_current = TRUE
  LEFT JOIN finance_legal_entity AS le
    ON f.legal_entity_id = le.legal_entity_id
   AND le.is_current = TRUE
  LEFT JOIN finance_ledger AS ld
    ON f.ledger_id = ld.ledger_id
   AND ld.is_current = TRUE;

Calculation Notes: |
  1️⃣ Use net income attributable to common shareholders after tax, preferred dividends, and non-controlling interests.  
  2️⃣ Apply average common shareholders' equity for the reporting period; use monthly weighted average for material changes.  
  3️⃣ For interim annualized reporting, divide year-to-date net income by elapsed months, multiply by 12, then divide by average equity.  
  4️⃣ Label annualized results; do not annualize full-year values.  
  5️⃣ Report ROE as not meaningful if average common equity is zero or negative; disclose underlying net income and equity values.  
  6️⃣ Restate prior periods when financial statements are restated; maintain consistent accounting basis and rules.  
  7️⃣ Customer, product, channel, cohort, and journey-stage views allowed only with approved profitability and capital-allocation methodologies.

Business Use Case: |
  The CFO and Customer Profitability team compare ROE by product portfolio, acquisition cohort, primary service channel, and customer-value segment using governed revenue, cost, credit-loss, tax, and allocated-equity models. If digitally acquired lending customers show strong conversion and retention but below-target ROE, management can adjust pricing, credit policy, servicing journeys, cross-sell offers, or acquisition spend rather than optimizing conversion volume without regard to capital efficiency.


Source Data: Finance General Ledger and Consolidation, shareholder equity and regulatory reporting platforms, Treasury capital-management data, customer profitability data marts, billing and loan servicing systems, CRM, and authenticated web/mobile analytics joined through governed product, channel, cohort, and legal-entity mappings

Report Attributes: |
  ["Fiscal period","Legal entity","Business line","Product family","Customer segment","Acquisition cohort","Acquisition channel","Primary engagement channel","Customer journey stage","Geography","Reporting currency","New versus existing customer","Risk grade","Profitability tier","Capital-allocation methodology version"]


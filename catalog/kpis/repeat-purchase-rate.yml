KPI Name: Repeat Purchase Rate
Formula: (Distinct Customers with ≥ 2 Valid Orders in Period / Distinct Customers with ≥ 1 Valid Order in Period) × 100

Description: |
  Repeat Purchase Rate is the share of distinct purchasing customers in a reporting period who placed two or more valid orders within that same period, measured against every customer who placed at least one valid order. It is the primary indicator of whether acquisition spend is converting into a returning customer base, and it feeds directly into purchase frequency, customer lifetime value and retention-led budget decisions.

Category: Retention


























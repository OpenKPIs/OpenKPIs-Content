Google Analytics SQL: |
  -- ==========================================
  -- 1. GOOGLE BIGQUERY SQL
  -- ==========================================
  -- Customer Retention Rate for the last complete month vs the month before it.
  -- CRR = ((customers at end - new customers) / customers at start) * 100
  WITH params AS (
    SELECT
      DATE_TRUNC(DATE_SUB(CURRENT_DATE(), INTERVAL 1 MONTH), MONTH) AS cur_start,
      LAST_DAY(DATE_SUB(CURRENT_DATE(), INTERVAL 1 MONTH), MONTH) AS cur_end,
      DATE_TRUNC(DATE_SUB(CURRENT_DATE(), INTERVAL 2 MONTH), MONTH) AS prev_start,
      LAST_DAY(DATE_SUB(CURRENT_DATE(), INTERVAL 2 MONTH), MONTH) AS prev_end
  ),
  purchase_events AS (
    SELECT
      e.user_id,
      PARSE_DATE('%Y%m%d', e.event_date) AS purchase_date,
      MAX(IF(ep.key = 'transaction_id', ep.value.string_value, NULL)) AS transaction_id,
      MAX(IF(ep.key = 'value', COALESCE(ep.value.double_value, CAST(ep.value.int_value AS FLOAT64)), NULL)) AS order_value
    FROM `your-project.analytics_123456789.events_*` AS e,
      UNNEST(e.event_params) AS ep
    WHERE e.event_name = 'purchase'
      AND e.user_id IS NOT NULL
      AND _TABLE_SUFFIX BETWEEN FORMAT_DATE('%Y%m%d', DATE_SUB(CURRENT_DATE(), INTERVAL 26 MONTH))
                            AND FORMAT_DATE('%Y%m%d', CURRENT_DATE())
    GROUP BY e.user_id, e.event_date, e.event_timestamp, e.user_pseudo_id
  ),
  orders AS (
    -- one row per transaction; drop test and zero-value orders
    SELECT user_id, MIN(purchase_date) AS purchase_date, transaction_id
    FROM purchase_events
    WHERE transaction_id IS NOT NULL
      AND order_value > 0
    GROUP BY user_id, transaction_id
  ),
  first_purchase AS (
    SELECT user_id, MIN(purchase_date) AS first_purchase_date
    FROM orders
    GROUP BY user_id
  ),
  start_base AS (
    SELECT DISTINCT o.user_id
    FROM orders AS o, params AS p
    WHERE o.purchase_date BETWEEN p.prev_start AND p.prev_end
  ),
  end_base AS (
    SELECT DISTINCT o.user_id
    FROM orders AS o, params AS p
    WHERE o.purchase_date BETWEEN p.cur_start AND p.cur_end
  ),
  new_customers AS (
    SELECT f.user_id
    FROM first_purchase AS f, params AS p
    WHERE f.first_purchase_date BETWEEN p.cur_start AND p.cur_end
  )
  SELECT
    (SELECT cur_start FROM params) AS period_start,
    (SELECT cur_end FROM params) AS period_end,
    (SELECT COUNT(*) FROM start_base) AS customers_at_start,
    (SELECT COUNT(*) FROM end_base) AS customers_at_end,
    (SELECT COUNT(*) FROM new_customers) AS new_customers,
    (SELECT COUNT(*) FROM end_base AS e JOIN start_base AS s USING (user_id)) AS retained_from_start,
    ROUND(SAFE_DIVIDE(
      (SELECT COUNT(*) FROM end_base) - (SELECT COUNT(*) FROM new_customers),
      (SELECT COUNT(*) FROM start_base)
    ) * 100, 2) AS customer_retention_rate_pct,
    ROUND(SAFE_DIVIDE(
      (SELECT COUNT(*) FROM end_base AS e JOIN start_base AS s USING (user_id)),
      (SELECT COUNT(*) FROM start_base)
    ) * 100, 2) AS cohort_retention_rate_pct;

AEP Query Service SQL: |
  -- ==========================================
  -- 2. ADOBE AEP QUERY SERVICE SQL
  -- ==========================================
  -- Customer Retention Rate for the last complete month vs the month before it.
  -- CRR = ((customers at end - new customers) / customers at start) * 100
  WITH params AS (
    SELECT
      add_months(trunc(current_date(), 'MM'), -1) AS cur_start,
      date_sub(trunc(current_date(), 'MM'), 1) AS cur_end,
      add_months(trunc(current_date(), 'MM'), -2) AS prev_start,
      date_sub(add_months(trunc(current_date(), 'MM'), -1), 1) AS prev_end
  ),
  orders AS (
    -- one row per purchase ID; drop test and zero-value orders
    SELECT
      identityMap['CRMID'][0].id AS customer_id,
      commerce.order.purchaseID AS purchase_id,
      MIN(CAST(timestamp AS DATE)) AS purchase_date
    FROM commerce_experience_event_dataset
    WHERE eventType = 'commerce.purchases'
      AND commerce.purchases.value > 0
      AND commerce.order.priceTotal > 0
      AND commerce.order.purchaseID IS NOT NULL
      AND identityMap['CRMID'][0].id IS NOT NULL
      AND timestamp >= add_months(trunc(current_date(), 'MM'), -26)
    GROUP BY identityMap['CRMID'][0].id, commerce.order.purchaseID
  ),
  first_purchase AS (
    SELECT customer_id, MIN(purchase_date) AS first_purchase_date
    FROM orders
    GROUP BY customer_id
  ),
  start_base AS (
    SELECT DISTINCT o.customer_id
    FROM orders o CROSS JOIN params p
    WHERE o.purchase_date BETWEEN p.prev_start AND p.prev_end
  ),
  end_base AS (
    SELECT DISTINCT o.customer_id
    FROM orders o CROSS JOIN params p
    WHERE o.purchase_date BETWEEN p.cur_start AND p.cur_end
  ),
  new_customers AS (
    SELECT f.customer_id
    FROM first_purchase f CROSS JOIN params p
    WHERE f.first_purchase_date BETWEEN p.cur_start AND p.cur_end
  ),
  counts AS (
    SELECT
      (SELECT COUNT(*) FROM start_base) AS customers_at_start,
      (SELECT COUNT(*) FROM end_base) AS customers_at_end,
      (SELECT COUNT(*) FROM new_customers) AS new_customers,
      (SELECT COUNT(*) FROM end_base e JOIN start_base s ON e.customer_id = s.customer_id) AS retained_from_start
  )
  SELECT
    p.cur_start AS period_start,
    p.cur_end AS period_end,
    c.customers_at_start,
    c.customers_at_end,
    c.new_customers,
    c.retained_from_start,
    ROUND(CASE WHEN c.customers_at_start = 0 THEN NULL
          ELSE (c.customers_at_end - c.new_customers) * 100.0 / c.customers_at_start END, 2) AS customer_retention_rate_pct,
    ROUND(CASE WHEN c.customers_at_start = 0 THEN NULL
          ELSE c.retained_from_start * 100.0 / c.customers_at_start END, 2) AS cohort_retention_rate_pct
  FROM counts c CROSS JOIN params p;

Calculation Notes: |
  1️⃣ A customer is an identified buyer (logged-in user_id / CRM ID) with at least one completed purchase in the period; anonymous or guest orders that cannot be tied to a customer ID are excluded from all three counts, so report the share of identified revenue alongside the rate.
  2️⃣ Customers at start of period (the denominator) is the full base of customers who purchased in the prior period of equal length, not only those who were exposed to a retention campaign or visited the site.
  3️⃣ New customers are those whose first-ever completed purchase falls inside the current period; use a lookback of at least 24 months of order history so returning customers are not misclassified as new.
  4️⃣ Count purchases once per transaction_id: deduplicate repeated purchase hits, and exclude test orders, zero-value orders and orders fully cancelled or refunded within the period.
  5️⃣ Choose the period to match the category's natural purchase cycle (monthly for grocery and consumables, quarterly or yearly for apparel, electronics and home) and never compare rates across different period lengths.
  6️⃣ Customers at end minus new customers can include lapsed customers who reactivated; report reactivated customers separately and use the cohort-intersection value (start-base customers who purchased again) when a strict cohort view capped at 100% is needed.
  7️⃣ Value action by industry: E-commerce and Retail use a repeat purchase; subscription businesses use an active paid subscription at period end (see Subscriber Retention Rate).

Business Use Case: |
  1️⃣ The CRM and Lifecycle Marketing team reviews the monthly rate by acquisition cohort and first-touch channel, and when a cohort falls more than 5 points below the trailing average it launches a win-back email and SMS journey for that cohort.
  2️⃣ The Loyalty Programme Manager compares retention of loyalty members against non-members each quarter and uses the gap to justify tier benefits or to redesign rewards that are not lifting repeat purchase.
  3️⃣ Finance and the executive team use the yearly rate with Customer Lifetime Value to forecast revenue from the existing base and to set the acquisition budget ceiling for the next planning cycle.
  4️⃣ Merchandising reviews retention by first-purchased product category and promotes or bundles the categories whose buyers return most often in new-customer offers.


KPI Name: Customer Retention Rate
Formula: ((Customers at End of Period − New Customers Acquired During Period) / Customers at Start of Period) × 100

Description: |
  Customer Retention Rate measures the percentage of the customers active at the start of a period who are still buying at its end, calculated as ((customers at end of period − new customers acquired in the period) ÷ customers at start of period) × 100. It is the standard gauge of customer loyalty and of how well lifecycle, loyalty and service programmes keep the existing customer base purchasing.

Category: Retention

Tags: [kpi, E-commerce: Customer Retention, Loyalty & LTV, Retail]

Industry: [["E-commerce & SaaS, E-commerce"]]

Priority: High

Core Area: Monetization

Scope: User

Measure Type: Percentage

Aggregation Window: Monthly, Quarterly, Yearly

